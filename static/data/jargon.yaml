# Pāṇinian grammatical terminology — the glossary.
#
# THE hand-edited source. Loaded at runtime as generated jargon.json
# (bun run build:jargon). Keyed by the Devanagari headword so every term is an
# IDE "Go to Symbol" target (Ctrl-Shift-O → वृद्धि). A headword that repeats
# holds a LIST of entries under its one key.
#
# entry fields:
#   termRoman — IAST transliteration
#   category  — samjna | pratyahara | karaka | vibhakti | pratyaya | sandhi
#               | lakara | gana | samasa | general
#   meaning   — English (may include @[...] and @deva[...] and @ref[...] markup)
#   sutraRef  — defining sūtra id, e.g. "1.1.1" (optional)
#   related   — list of termRoman keys (optional)

संज्ञा:
  termRoman: saṃjñā
  category: samjna
  meaning: Technical term or name. Panini defines many samjnas to create a precise
    metalanguage.
वृद्धि:
  termRoman: vṛddhi
  category: samjna
  meaning: 'The "strengthened" vowel grade: @[ā], @[ai], @[au]. Defined in 1.1.1.'
  sutraRef: 1.1.1
  related:
    - guṇa
गुण:
  termRoman: guṇa
  category: samjna
  meaning: 'The "medium" vowel grade: @[a], @[e], @[o]. Defined in 1.1.2.'
  sutraRef: 1.1.2
  related:
    - vṛddhi
स्वर:
  termRoman: svara
  category: samjna
  meaning: Vowel. Defined as the pratyahara "@[ac]" in 1.1.9.
  sutraRef: 1.1.9
  related:
    - vyañjana
    - ac
व्यञ्जन:
  termRoman: vyañjana
  category: samjna
  meaning: Consonant. Defined as the pratyahara "@[hal]" in 1.1.10.
  sutraRef: 1.1.10
  related:
    - svara
    - hal
अन्तःस्थ:
  termRoman: antaḥstha
  category: samjna
  meaning: Semivowel, literally 'standing between' (vowels and consonants). The
    four sounds @deva[य], @deva[र], @deva[ल], @deva[व] (y, r, l, v).
  related:
    - vyañjana
    - yaṇ
ऊष्मन्:
  termRoman: ūṣman
  category: samjna
  meaning: Sibilant/fricative, literally 'heat'. The sounds @deva[श], @deva[ष],
    @deva[स], @deva[ह] (ś, ṣ, s, h).
  related:
    - vyañjana
अनुस्वार:
  termRoman: anusvāra
  category: samjna
  meaning: The nasal sound @deva[ं] written as a dot above the line. Represents
    nasalization of the preceding vowel.
  related:
    - visarga
सवर्ण:
  termRoman: savarṇa
  category: samjna
  meaning: Homogeneous sounds - same place and effort of articulation.
  sutraRef: 1.1.9
आस्य:
  termRoman: āsya
  category: phonetics
  meaning: Mouth; place of articulation (स्थान). Used in defining homogeneous sounds.
प्रयत्न:
  termRoman: prayatna
  category: phonetics
  meaning: Articulatory effort. Internal (आभ्यन्तर) and external (बाह्य) efforts
    define sound production.
इत्:
  - termRoman: it
    category: samjna
    meaning: Marker letter (anubandha) that indicates grammatical properties but is
      deleted.
    sutraRef: 1.3.2
    related:
      - anubandha
  - termRoman: it
    category: samjna
    meaning: Marker letter (nominative). Technical designation for indicatory letters.
    related:
      - anubandha
अनुबन्ध:
  termRoman: anubandha
  category: samjna
  meaning: Same as "it" - a marker letter attached to grammatical elements.
  related:
    - it
लोप:
  termRoman: lopa
  category: samjna
  meaning: Deletion or elision. Markers undergo lopa (1.3.9).
  sutraRef: 1.3.9
आदेश:
  termRoman: ādeśa
  category: samjna
  meaning: Substitution or replacement. One element replacing another.
  related:
    - sthānin
स्थानिन्:
  termRoman: sthānin
  category: samjna
  meaning: The original element that gets replaced (by an ādeśa).
  related:
    - ādeśa
प्रकृति:
  termRoman: prakṛti
  category: samjna
  meaning: Base or stem to which affixes are added.
  related:
    - pratyaya
धातु:
  termRoman: dhātu
  category: samjna
  meaning: Verbal root. The base form of verbs listed in the Dhatupatha.
  related:
    - prakṛti
    - prātipadika
प्रातिपदिक:
  termRoman: prātipadika
  category: samjna
  meaning: Nominal stem - a meaningful base that takes case endings.
  related:
    - dhātu
पद:
  termRoman: pada
  category: samjna
  meaning: Word - a complete inflected form ending in sup or tiṅ.
संहिता:
  termRoman: saṃhitā
  category: samjna
  meaning: Close proximity of sounds - the domain where sandhi applies.
  sutraRef: 1.4.109
अधिकार:
  termRoman: adhikāra
  category: samjna
  meaning: Governing rule whose scope extends over subsequent sutras.
अनुवृत्ति:
  termRoman: anuvṛtti
  category: samjna
  meaning: Continuation - when a term from a prior sutra carries forward.
परिभाषा:
  termRoman: paribhāṣā
  category: samjna
  meaning: Interpretive rule that governs how other rules are applied.
विधि:
  termRoman: vidhi
  category: samjna
  meaning: Operational rule that prescribes a grammatical operation.
प्रत्याहार:
  termRoman: pratyāhāra
  category: pratyahara
  meaning: A shorthand notation for sound groups using the Shiva Sutras.
अच्:
  termRoman: ac
  category: pratyahara
  meaning: "All vowels: @[a], @[i], @[u], @[ṛ], @[ḷ], @[e], @[o], @[ai], @[au]."
हल्:
  - termRoman: hal
    category: pratyahara
    meaning: All consonants.
  - termRoman: hal
    category: pratyahara
    meaning: Pratyāhāra for all consonants. From @deva[ह] to @deva[ल] in the Śiva
      Sūtras.
अण्:
  - termRoman: aṇ
    category: pratyahara
    meaning: "Simple vowels: @[a], @[i], @[u]."
  - termRoman: aṇ
    category: pratyaya
    meaning: Taddhita suffix (= @deva[अ] with @deva[वृद्धि]). Forms patronymics and
      derivatives.
    sutraRef: 4.1.83
  - termRoman: aṇ
    category: pratyaya
    meaning: Taddhita suffix (= @deva[अ] with vṛddhi). Forms patronymics and
      derivatives. @deva[दशरथ] → @deva[दाशरथि].
    sutraRef: 4.1.83
इक्:
  termRoman: ik
  category: pratyahara
  meaning: The vowels i, u, ṛ, ḷ - those that become semivowels.
  related:
    - yaṇ
यण्:
  termRoman: yaṇ
  category: pratyahara
  meaning: "Semivowels: @[y], @[v], @[r], @[l]."
  related:
    - ik
एच्:
  termRoman: ec
  category: pratyahara
  meaning: "Diphthongs: @[e], @[o], @[ai], @[au]."
कारक:
  termRoman: kāraka
  category: karaka
  meaning: Semantic role - the relation between a noun and the verbal action.
कर्तृ:
  termRoman: kartṛ
  category: karaka
  meaning: "The doer — the one who acts on its own (स्वतन्त्रः, 1.4.54). A कारक is
    the ROLE a noun plays toward the verb; the विभक्ति is the ENDING that shows
    it. कर्तृ takes प्रथमा in the active, तृतीया in the passive: @[rāmaḥ karoti]
    / @[rāmeṇa kṛtam]. The role behind most प्रथमा."
  sutraRef: 1.4.54
कर्मन्:
  termRoman: karman
  category: karaka
  meaning: "The object — what the doer most wants to reach through the act
    (1.4.49). Takes द्वितीया: @[grāmam gacchati] 'goes to the village', @[phalam
    khādati] 'eats the fruit.' In the passive it turns into the प्रथमा subject:
    @[phalam khādyate] 'the fruit is eaten.'"
  sutraRef: 1.4.49
करण:
  termRoman: karaṇa
  category: karaka
  meaning: "The instrument — the most effective means of the act (1.4.42). Takes
    तृतीया: @[hastena] 'with the hand', @[netreṇa paśyati] 'sees with the eye.'
    Answers केन? 'by what.'"
  sutraRef: 1.4.42
सम्प्रदान:
  termRoman: sampradāna
  category: karaka
  meaning: "The recipient — the one the act is aimed at, for whose sake it is done
    (1.4.32). Takes चतुर्थी: @[brāhmaṇāya dadāti] 'gives to the brahmin.'
    Answers कस्मै? 'for whom.'"
  sutraRef: 1.4.32
अपादान:
  termRoman: apādāna
  category: karaka
  meaning: "The source — the fixed point movement departs from (1.4.24). Takes
    पञ्चमी: @[grāmāt] 'from the village', @[vṛkṣāt patati] 'falls from the
    tree.' Answers कस्मात्? 'from what.' Also the standard in a comparison."
  sutraRef: 1.4.24
अधिकरण:
  termRoman: adhikaraṇa
  category: karaka
  meaning: "The locus — the ground or container of the act (1.4.45). Takes सप्तमी:
    @[vane] 'in the forest', @[kaṭe āste] 'sits on the mat.' Answers कुत्र?
    'where.'"
  sutraRef: 1.4.45
विभक्ति:
  termRoman: vibhakti
  category: vibhakti
  meaning: Inflectional ending - case endings (sup) or verb endings (tiṅ).
  sutraRef: 1.4.104
प्रथमा:
  termRoman: prathamā
  category: vibhakti
  meaning: "First case (nominative), the naming/subject case. Answers कः?
    'who/what.' Carries the कर्तृ (agent) of an active verb and the bare stem's
    own sense (2.3.46): @[rāmaḥ gacchati] 'Rāma goes.' a-stem endings -ः / -au /
    -āḥ. Contrast द्वितीया, the object."
द्वितीया:
  termRoman: dvitīyā
  category: vibhakti
  meaning: "Second case (accusative), the object case. Answers कम्? 'whom/what.'
    Carries the कर्मन् — what the act most affects (2.3.2) — and the goal of
    motion: @[grāmam gacchati] 'goes to the village.' Endings -म् / -au / -ān."
तृतीया:
  termRoman: tṛtīyā
  category: vibhakti
  meaning: "Third case (instrumental), the 'by/with' case. Answers केन? 'by what
    means.' Carries the करण (instrument) and the agent of a passive: @[hastena
    karoti] 'does with the hand'; @[rāmeṇa uktam] 'said by Rāma.' Endings -ena /
    -bhyām / -aiḥ. Contrast सप्तमी (in/on)."
चतुर्थी:
  termRoman: caturthī
  category: vibhakti
  meaning: "Fourth case (dative), the 'for/to' case. Answers कस्मै? 'for whom.'
    Carries the सम्प्रदान (recipient) and purpose: @[rāmāya dadāti] 'gives to
    Rāma'; @[phalāya] 'for fruit.' Endings -āya / -bhyām / -bhyaḥ."
पञ्चमी:
  termRoman: pañcamī
  category: vibhakti
  meaning: "Fifth case (ablative), the 'from' case. Answers कस्मात्? 'from what.'
    Carries the अपादान (source, 2.3.28) and the standard of comparison (2.3.42):
    @[grāmāt āgacchati] 'comes from the village'; @[rāmāt paṭutaraḥ] 'cleverer
    than Rāma.' Endings -āt / -bhyām / -bhyaḥ."
षष्ठी:
  termRoman: ṣaṣṭhī
  category: vibhakti
  meaning: "Sixth case (genitive), the 'of / -'s' case. Answers कस्य? 'whose.'
    Carries सम्बन्ध — the plain relation between two nouns (2.3.50): @[rāmasya
    putraḥ] 'Rāma's son.' Endings -sya / -yoḥ / -ānām. The one case that links
    noun to noun, not noun to verb."
सप्तमी:
  termRoman: saptamī
  category: vibhakti
  meaning: "Seventh case (locative), the 'in/on/at' case. Answers कुत्र? 'where /
    in what.' Carries the अधिकरण (locus, 2.3.36): @[vane vasati] 'lives in the
    forest'; @[rāme] 'in Rāma.' Endings -e / -yoḥ / -eṣu. Contrast तृतीया
    (by/with) and पञ्चमी (from)."
प्रत्यय:
  termRoman: pratyaya
  category: pratyaya
  meaning: Suffix or affix added after a base.
  sutraRef: 3.1.1
सुप्:
  termRoman: sup
  category: pratyaya
  meaning: "Nominal case endings (21 total: 7 cases × 3 numbers)."
  related:
    - subanta
सुबन्त:
  termRoman: subanta
  category: samjna
  meaning: A word ending in @[sup] (nominal endings). Declined nouns, adjectives,
    and pronouns. Contrasts with @[tiṅanta].
  related:
    - sup
    - tiṅanta
    - prātipadika
तिङ्:
  termRoman: tiṅ
  category: pratyaya
  meaning: "Verbal personal endings (18 total: 3 persons × 3 numbers × 2 padas)."
  related:
    - tiṅanta
तिङन्त:
  termRoman: tiṅanta
  category: samjna
  meaning: A word ending in @[tiṅ] (verbal endings). Conjugated finite verbs.
    Contrasts with @[subanta].
  related:
    - tiṅ
    - subanta
    - dhātu
कृत्:
  termRoman: kṛt
  category: pratyaya
  meaning: Primary suffix added directly to a verbal root.
तद्धित:
  termRoman: taddhita
  category: pratyaya
  meaning: Secondary suffix added to a nominal stem.
सन्धि:
  termRoman: sandhi
  category: sandhi
  meaning: Junction - sound changes when morphemes or words combine.
दीर्घ:
  termRoman: dīrgha
  category: sandhi
  meaning: Long (vowel) - the lengthened version of a vowel.
ह्रस्व:
  termRoman: hrasva
  category: sandhi
  meaning: Short (vowel) - the basic short vowel.
प्लुत:
  termRoman: pluta
  category: sandhi
  meaning: Prolated (vowel) - extra-long, used in calling.
लकार:
  termRoman: lakāra
  category: lakara
  meaning: Tense-mood marker. The 10 lakaras indicate tense, mood, and aspect of verbs.
लट्:
  termRoman: laṭ
  category: lakara
  meaning: "Present (वर्तमान) — ongoing or habitual, 'does / is doing.' Endings
    -ति / -तः / -न्ति: @deva[गच्छति] 'goes.' The unmarked, commonest लकार.
    Contrast लङ् (past), लोट् (command)."
  sutraRef: 3.2.123
लङ्:
  termRoman: laṅ
  category: lakara
  meaning: "Imperfect (अनद्यतन-भूत) — past, 'did.' The tell is the अ-augment on
    the front: @deva[अगच्छत्] 'went,' @deva[अभवत्] 'became.' The workhorse
    narrative past. Contrast लट् (गच्छति) — same stem, the अ- and the ending
    differ."
  sutraRef: 3.2.111
लोट्:
  termRoman: loṭ
  category: lakara
  meaning: "Imperative (लोट्) — command, request, blessing. Endings -तु / -न्तु:
    @deva[गच्छतु] 'let him go,' @deva[भवतु] 'so be it.' Contrast विधिलिङ् — लोट्
    orders, विधिलिङ् advises."
  sutraRef: 3.3.162
लिङ्:
  termRoman: liṅ
  category: lakara
  meaning: "Optative/potential mood. Has two forms: @[vidhiliṅ] (prescription) and
    @[āśīrliṅ] (benediction)."
  sutraRef: 3.3.161
लिट्:
  termRoman: liṭ
  category: lakara
  meaning: "Perfect (परोक्ष-भूत) — remote past, unwitnessed; the tense of story
    and report. Reduplicates the root: @deva[चकार] 'did' (कृ), @deva[उवाच]
    'said,' @deva[बभूव] 'became.' Contrast लङ् (a recent/witnessed past)."
  sutraRef: 3.2.115
लुट्:
  termRoman: luṭ
  category: lakara
  meaning: Periphrastic future. Future not of today.
  sutraRef: 3.3.15
लृट्:
  termRoman: lṛṭ
  category: lakara
  meaning: "Simple future (लृट्) — 'will do.' The tell is -स्य- before the ending:
    @deva[गमिष्यति] 'will go,' @deva[भविष्यति] 'will be.' Contrast लट् (now)."
  sutraRef: 3.3.13
लुङ्:
  termRoman: luṅ
  category: lakara
  meaning: "Aorist (लुङ्) — plain past, 'did,' with no today/not-today limit.
    Augment, often a सिच्: @deva[अगमत्] 'went,' @deva[अभूत्] 'became.' Also the
    past used in prohibitions with मा."
  sutraRef: 3.2.110
लृङ्:
  termRoman: lṛṅ
  category: lakara
  meaning: Conditional. Used for hypothetical conditions.
  sutraRef: 3.3.139
लेट्:
  termRoman: leṭ
  category: lakara
  meaning: Vedic subjunctive. Found only in Vedic texts.
  sutraRef: 3.4.7
भूत:
  termRoman: bhūta
  category: lakara
  meaning: Past time. Action already completed.
वर्तमान:
  termRoman: vartamāna
  category: lakara
  meaning: Present time. Action ongoing or habitual.
भविष्यत्:
  termRoman: bhaviṣyat
  category: lakara
  meaning: Future time. Action yet to occur.
गण:
  termRoman: gaṇa
  category: gana
  meaning: Verb class. The 10 classes determine how roots form their present stem.
भ्वादि:
  termRoman: bhvādi
  category: gana
  meaning: First class (class 1). Adds @[guṇa] and śap vikaraṇa. E.g., @[bhū] →
    @[bhavati].
अदादि:
  termRoman: adādi
  category: gana
  meaning: Second class (class 2). No vikaraṇa, root directly takes endings. E.g.,
    @[ad] → @[atti].
जुहोत्यादि:
  termRoman: juhotyādi
  category: gana
  meaning: Third class (class 3). Reduplication without vikaraṇa. E.g., @[hu] →
    @[juhoti].
दिवादि:
  termRoman: divādi
  category: gana
  meaning: Fourth class (class 4). Adds śyan vikaraṇa. E.g., @[div] → @[dīvyati].
स्वादि:
  termRoman: svādi
  category: gana
  meaning: Fifth class (class 5). Adds śnu vikaraṇa. E.g., @[su] → @[sunoti].
तुदादि:
  termRoman: tudādi
  category: gana
  meaning: Sixth class (class 6). Adds śa vikaraṇa (accent on ending). E.g.,
    @[tud] → @[tudati].
रुधादि:
  termRoman: rudhādi
  category: gana
  meaning: Seventh class (class 7). Inserts nasal (śnam) before final consonant.
    E.g., @[rudh] → @[ruṇaddhi].
तनादि:
  termRoman: tanādi
  category: gana
  meaning: Eighth class (class 8). Adds u vikaraṇa. E.g., @[tan] → @[tanoti].
क्र्यादि:
  termRoman: kryādi
  category: gana
  meaning: Ninth class (class 9). Adds śnā vikaraṇa. E.g., @[krī] → @[krīṇāti].
चुरादि:
  termRoman: curādi
  category: gana
  meaning: Tenth class (class 10). Adds ṇic (causative-like). E.g., @[cur] →
    @[corayati].
समास:
  termRoman: samāsa
  category: samasa
  meaning: Compound - multiple words joined into a single unit.
  sutraRef: 2.1.3
तत्पुरुष:
  termRoman: tatpuruṣa
  category: samasa
  meaning: Determinative compound — the LAST member is the head; the first stands
    to it in a case relation. @deva[राजपुरुषः] = @deva[राज्ञः पुरुषः] 'the
    king's man.' Named by that case (षष्ठी-, चतुर्थी-तत्पुरुष…). The commonest
    compound. Contrast बहुव्रीहि.
  sutraRef: 2.1.22
कर्मधारय:
  termRoman: karmadhāraya
  category: samasa
  meaning: A तत्पुरुष whose two members refer to the SAME thing, one qualifying
    the other. @deva[नीलोत्पलम्] = @deva[नीलम् उत्पलम्] 'the blue lotus,'
    @deva[महापुरुषः] 'a great man.' A subtype of तत्पुरुष (1.2.42).
  sutraRef: 1.2.42
द्विगु:
  termRoman: dvigu
  category: samasa
  meaning: A कर्मधारय whose first member is a NUMERAL. @deva[त्रिलोकी] 'the three
    worlds,' @deva[पञ्चवटी] 'the five banyans' — often a collective. A subtype
    of तत्पुरुष.
  sutraRef: 2.1.52
बहुव्रीहि:
  termRoman: bahuvrīhi
  category: samasa
  meaning: "Possessive compound — NEITHER member is the head; the whole points
    OUTWARD to a third thing that HAS what the members name (2.2.23).
    @deva[पीताम्बरः] 'the one whose garment is yellow' = Kṛṣṇa, not 'yellow' and
    not 'garment.' The test: 'that WHICH HAS ___.'"
  sutraRef: 2.2.23
द्वन्द्व:
  termRoman: dvandva
  category: samasa
  meaning: Copulative compound — both members are heads, joined as 'and' (2.2.29).
    @deva[रामकृष्णौ] 'Rāma and Kṛṣṇa,' @deva[मातापितरौ] 'mother and father.'
    Usually dual/plural; or neuter singular for a collective (समाहार).
  sutraRef: 2.2.29
अव्ययीभाव:
  termRoman: avyayībhāva
  category: samasa
  meaning: Adverbial compound — the FIRST member is indeclinable and the WHOLE
    becomes indeclinable, usually neuter (2.1.5). @deva[उपकृष्णम्] 'near Kṛṣṇa,'
    @deva[प्रतिदिनम्] 'every day,' @deva[यथाशक्ति] 'as able.' Recognise it by
    उप/प्रति/यथा heading it and no further inflection.
  sutraRef: 2.1.5
समाहार:
  termRoman: samāhāra
  category: samasa
  meaning: Collective sense. When a dvandva denotes the group as a whole (neuter
    singular).
क्त:
  termRoman: kta
  category: pratyaya
  meaning: Past passive participle — 'was ___ed,' the निष्ठा suffix, and it
    DECLINES. @deva[गतः] 'gone' (गम्), @deva[कृतम्] 'done,' @deva[सुप्तः]
    'asleep.' Agrees with its noun in लिङ्ग/विभक्ति/वचन. Contrast क्तवतु (the
    ACTIVE past participle).
  sutraRef: 3.2.102
  related:
    - ktavatu
क्तवतु:
  termRoman: ktavatu
  category: pratyaya
  meaning: Past ACTIVE participle — 'one who has ___ed,' the other निष्ठा.
    @deva[कृतवान्] 'having done,' @deva[गतवान्] 'having gone.' Declines
    (-वान्/-वती). Contrast क्त — the same event from the doer's side.
  sutraRef: 3.2.102
  related:
    - kta
क्त्वा:
  - termRoman: ktvā
    category: pratyaya
    meaning: Gerund (absolutive) — 'having done X,' ties an earlier act to the main
      verb, same agent, and does NOT decline. @deva[भुक्त्वा गच्छति] 'having
      eaten, he goes.' On a bare root; with a preverb it becomes ल्यप् (आगत्य
      not *आगत्वा).
    sutraRef: 3.4.21
    related:
      - lyap
  - termRoman: ktvā
    category: pratyaya
    meaning: Gerund (absolutive) — 'having done X,' ties an earlier act to the main
      verb, same agent, and does NOT decline. @deva[भुक्त्वा गच्छति] 'having
      eaten, he goes.' On a bare root; with a preverb it becomes ल्यप् (आगत्य
      not *आगत्वा).
    sutraRef: 3.4.21
    related:
      - lyap
ल्यप्:
  termRoman: lyap
  category: pratyaya
  meaning: The gerund used WHEN a preverb is present — same sense as क्त्वा, form
    -य. @deva[आगत्य] 'having come' (आ+गम्), @deva[प्रविश्य] 'having entered.'
    The preverb is what selects ल्यप् over क्त्वा — a clean minimal pair.
  sutraRef: 3.4.22
  related:
    - ktvā
तुमुन्:
  termRoman: tumun
  category: pratyaya
  meaning: "Infinitive — 'to do,' the -तुम् suffix, indeclinable. @deva[गन्तुम्]
    'to go,' @deva[द्रष्टुम्] 'to see.' Follows verbs of wishing/being able:
    @deva[द्रष्टुम् इच्छति] 'wishes to see.'"
  sutraRef: 3.3.10
शतृ:
  termRoman: śatṛ
  category: pratyaya
  meaning: Present ACTIVE participle — 'doing / while doing,' the शतृ suffix
    (परस्मैपद). @deva[गच्छन्] 'going,' @deva[हसन्] 'laughing.' Declines, agrees
    with its noun. The आत्मनेपद twin is शानच् (-मान).
  sutraRef: 3.2.124
  related:
    - śānac
शानच्:
  termRoman: śānac
  category: pratyaya
  meaning: Present participle suffix (@[ātmanepada]). 'One who is doing' (middle voice).
  sutraRef: 3.2.124
  related:
    - śatṛ
तव्य:
  termRoman: tavya
  category: pratyaya
  meaning: Future passive participle suffix. 'Should be done, must be done'.
  sutraRef: 3.1.96
  related:
    - anīya
    - ṇyat
अनीय:
  termRoman: anīya
  category: pratyaya
  meaning: Future passive participle suffix. Same meaning as tavya.
  sutraRef: 3.1.96
  related:
    - tavya
    - ṇyat
ण्यत्:
  termRoman: ṇyat
  category: pratyaya
  meaning: Gerundive — 'to be done, ought to be done,' the ण्यत् suffix (-य) on a
    हल्- or ऋ-final root (3.1.124). @deva[कार्यम्] 'to be done' (कृ),
    @deva[वाच्यम्] 'to be said.' Declines. Its vowel-final twin is यत् (देयम्).
  sutraRef: 3.1.124
  related:
    - tavya
    - anīya
तव्यत्:
  termRoman: tavyat
  category: pratyaya
  meaning: Variant of tavya. Future passive participle suffix.
  related:
    - tavya
विकरण:
  termRoman: vikaraṇa
  category: pratyaya
  meaning: Tense-mood affix inserted between root and personal ending.
शप्:
  termRoman: śap
  category: pratyaya
  meaning: Vikaraṇa for class 1 (bhvādi). Adds @[a] to stem.
  sutraRef: 3.1.68
श्यन्:
  termRoman: śyan
  category: pratyaya
  meaning: Vikaraṇa for class 4 (divādi). Adds @[ya] to stem.
  sutraRef: 3.1.69
श्नु:
  termRoman: śnu
  category: pratyaya
  meaning: Vikaraṇa for class 5 (svādi). Adds @[nu]/@[no] to stem.
  sutraRef: 3.1.73
श्ना:
  termRoman: śnā
  category: pratyaya
  meaning: Vikaraṇa for class 9 (kryādi). Adds @[nā]/@[nī] to stem.
  sutraRef: 3.1.81
श्नम्:
  termRoman: śnam
  category: pratyaya
  meaning: Vikaraṇa for class 7 (rudhādi). Inserts nasal before final consonant.
  sutraRef: 3.1.78
मतुप्:
  termRoman: matup
  category: pratyaya
  meaning: Possessive suffix — 'having ___,' shows as -वत्/-मत् and declines
    राजन्-style. @deva[धनवान्] 'wealthy,' @deva[बुद्धिमान्] 'wise,'
    @deva[गुणवान्] 'virtuous.' Turns any noun into 'the one who HAS it'
    (5.2.94).
  sutraRef: 5.2.94
तल्:
  termRoman: tal
  category: pratyaya
  meaning: "Abstract-noun suffix — '-ness / -hood,' shows as -ता, FEMININE
    (5.1.119). @deva[मित्रता] 'friendship,' @deva[गुरुता] 'heaviness.' The
    feminine twin of त्व (गुरुत्वम्): same sense, different gender."
  sutraRef: 5.1.119
  related:
    - tva
त्व:
  termRoman: tva
  category: pratyaya
  meaning: Abstract-noun suffix — '-ness / -hood,' shows as -त्व, NEUTER
    (5.1.119). @deva[गुरुत्वम्] 'heaviness,' @deva[महत्त्वम्] 'greatness,'
    @deva[देवत्वम्] 'godhood.' The neuter twin of तल् (-ता); names a quality as
    a thing.
  sutraRef: 5.1.119
  related:
    - tal
इन्:
  termRoman: in
  category: pratyaya
  meaning: Possessive suffix meaning 'having X'. Alternative to matup.
णिच्:
  termRoman: ṇic
  category: pratyaya
  meaning: "Causative suffix. Makes verbs causative: @[paca] → @[pācayati] 'causes
    to cook'."
  sutraRef: 3.1.26
सन्:
  termRoman: san
  category: pratyaya
  meaning: "Desiderative suffix. Expresses desire to do: @[piba] → @[pipāsati]
    'wishes to drink'."
  sutraRef: 3.1.7
अङ्ग:
  termRoman: aṅga
  category: samjna
  meaning: Stem - the base to which an affix is attached (after certain operations).
  sutraRef: 1.4.13
उपसर्ग:
  termRoman: upasarga
  category: samjna
  meaning: Verbal prefix. Preverbs like @[pra], @[parā], @[apa], @[sam], etc. that
    modify verb meaning.
  sutraRef: 1.4.59
अव्यय:
  termRoman: avyaya
  category: samjna
  meaning: Indeclinable - a word that doesn't change form (particles, adverbs).
  sutraRef: 1.1.37
उपपद:
  termRoman: upapada
  category: samjna
  meaning: Co-occurring word. A word in construction with another that conditions
    an affix.
पूर्वपद:
  termRoman: pūrvapada
  category: samjna
  meaning: Prior member - the first component of a compound.
घि:
  termRoman: ghi
  category: samjna
  meaning: Technical name for stems ending in short i/u (except @[sakhi] and
    @[pati] in certain uses).
  sutraRef: 1.4.7
घु:
  termRoman: ghu
  category: samjna
  meaning: Technical name for the roots @[dā] 'give' and @[dhā] 'place' (and their
    derivatives).
  sutraRef: 1.1.20
नदी:
  termRoman: nadī
  category: samjna
  meaning: Technical name for feminine stems in long ī/ū.
  sutraRef: 1.4.3
सर्वनामस्थान:
  termRoman: sarvanāmasthāna
  category: samjna
  meaning: Strong cases - nominative and accusative (singular, dual, plural) where
    stems strengthen.
  sutraRef: 1.1.42
अभ्यास:
  termRoman: abhyāsa
  category: samjna
  meaning: Reduplication - the repeated portion of a reduplicated form.
  sutraRef: 6.1.4
सम्प्रसारण:
  termRoman: samprasāraṇa
  category: samjna
  meaning: "Semivowel-to-vowel change: @[y]→@[i], @[v]→@[u], @[r]→@[ṛ], @[l]→@[ḷ]."
  sutraRef: 1.1.45
आगम:
  termRoman: āgama
  category: samjna
  meaning: Augment - an element inserted into a form.
इट्:
  termRoman: iṭ
  category: samjna
  meaning: Augment @[i] added before certain affixes (@[seṭ] roots).
  sutraRef: 7.2.35
  related:
    - aniṭ
अनिट्:
  termRoman: aniṭ
  category: samjna
  meaning: Without iṭ augment. Roots that don't take iṭ before certain affixes.
  related:
    - iṭ
आट्:
  termRoman: āṭ
  category: samjna
  meaning: Augment @[ā] added in certain formations.
औट्:
  termRoman: auṭ
  category: samjna
  meaning: Augment @[au] added before certain endings.
नुम्:
  - termRoman: num
    category: samjna
    meaning: Nasal augment @[n] inserted in certain forms.
    sutraRef: 7.1.58
  - termRoman: num
    category: samjna
    meaning: Augment @deva[न्] inserted in certain forms. Appears before final
      consonant.
    sutraRef: 7.1.58
    related:
      - āgama
पित्:
  termRoman: pit
  category: samjna
  meaning: Having p as marker. Indicates accent on first syllable.
  related:
    - kit
    - ṅit
कित्:
  termRoman: kit
  category: samjna
  meaning: Having k as marker. Prevents @[guṇa]/@[vṛddhi].
  related:
    - pit
    - ṅit
ङित्:
  termRoman: ṅit
  category: samjna
  meaning: Having ṅ as marker. Prevents @[guṇa]/@[vṛddhi]; indicates @[ātmanepada].
  related:
    - pit
    - kit
शित्:
  termRoman: śit
  category: samjna
  meaning: Having ś as marker. Indicates @[sārvadhātuka] affix.
लुक्:
  termRoman: luk
  category: samjna
  meaning: Complete deletion with no trace. The deleted element is as if it never
    existed.
  sutraRef: 1.1.61
  related:
    - ślu
श्लु:
  termRoman: ślu
  category: samjna
  meaning: Deletion that leaves a trace (@[sthānivat]). The deleted element still
    triggers some rules.
  sutraRef: 1.1.62
  related:
    - luk
परस्मैपद:
  termRoman: parasmaipada
  category: samjna
  meaning: Active voice endings. 'Word for another' - action for another's benefit.
  sutraRef: 1.4.99
  related:
    - ātmanepada
आत्मनेपद:
  termRoman: ātmanepada
  category: samjna
  meaning: Middle voice endings. 'Word for oneself' - action for one's own benefit.
  sutraRef: 1.4.100
  related:
    - parasmaipada
सार्वधातुक:
  termRoman: sārvadhātuka
  category: samjna
  meaning: Conjugational affixes - affixes marked with ś or tiṅ endings. Cause @[guṇa].
  sutraRef: 3.4.113
  related:
    - ārdhadhātuka
आर्धधातुक:
  termRoman: ārdhadhātuka
  category: samjna
  meaning: Non-conjugational affixes - affixes not marked with ś. Include kṛt
    affixes. Cause @[vṛddhi].
  sutraRef: 3.4.114
  related:
    - sārvadhātuka
अनुदात्त:
  termRoman: anudātta
  category: samjna
  meaning: Low-pitched accent (non-acute). Unmarked in pronunciation.
एकवचन:
  termRoman: ekavacana
  category: vibhakti
  meaning: Singular number.
द्विवचन:
  termRoman: dvivacana
  category: vibhakti
  meaning: Dual number.
बहुवचन:
  termRoman: bahuvacana
  category: vibhakti
  meaning: Plural number.
पुरुष:
  termRoman: puruṣa
  category: vibhakti
  meaning: "Grammatical person. Sanskrit has three: @[prathama] (third),
    @[madhyama] (second), @[uttama] (first). Note: Sanskrit counts from the one
    spoken about."
  related:
    - prathama
    - madhyama
    - uttama
प्रथम:
  termRoman: prathama
  category: vibhakti
  meaning: Third person (in Sanskrit grammar, 'first' puruṣa refers to the one
    spoken about).
  related:
    - puruṣa
    - madhyama
    - uttama
प्रथमपुरुष:
  termRoman: prathama puruṣa
  category: vibhakti
  meaning: Third person. The one spoken about (he/she/it/they). Called 'first'
    because grammatically primary.
  related:
    - puruṣa
    - prathama
मध्यम:
  termRoman: madhyama
  category: vibhakti
  meaning: Second person (the one spoken to).
  related:
    - puruṣa
    - prathama
    - uttama
मध्यमपुरुष:
  termRoman: madhyama puruṣa
  category: vibhakti
  meaning: Second person. The one spoken to (you).
  related:
    - puruṣa
    - madhyama
उत्तम:
  termRoman: uttama
  category: vibhakti
  meaning: First person (the speaker).
  related:
    - puruṣa
    - prathama
    - madhyama
उत्तमपुरुष:
  termRoman: uttama puruṣa
  category: vibhakti
  meaning: First person. The speaker (I/we).
  related:
    - puruṣa
    - uttama
विसर्ग:
  termRoman: visarga
  category: sandhi
  meaning: The sound @[ḥ] (@[visarjanīya]). Final aspiration that undergoes sandhi
    changes.
क्रिया:
  termRoman: kriyā
  category: general
  meaning: Action or verb. The activity denoted by the verbal root.
भाव:
  termRoman: bhāva
  category: general
  meaning: State of being, abstract action, or impersonal passive sense.
उच्चारण:
  termRoman: uccāraṇa
  category: general
  meaning: Pronunciation or articulation.
वर्ण:
  termRoman: varṇa
  category: general
  meaning: Sound or phoneme - the basic unit of speech.
अक्षर:
  termRoman: akṣara
  category: general
  meaning: Syllable - a vowel with optional consonants.
वर्णमाला:
  termRoman: varṇamālā
  category: general
  meaning: "The alphabet, literally 'garland of letters'. The systematic
    arrangement of Sanskrit sounds: vowels (@deva[स्वर]) and consonants
    (@deva[व्यञ्जन])."
  related:
    - varṇa
    - svara
    - vyañjana
प्रक्रिया:
  termRoman: prakriyā
  category: general
  meaning: Derivation or grammatical procedure. The step-by-step application of
    rules to derive a word form from its base elements (@[dhātu],
    @[prātipadika]) and affixes (@[pratyaya]).
  related:
    - dhātu
    - pratyaya
    - prātipadika
व्युत्पत्ति:
  termRoman: vyutpatti
  category: general
  meaning: Etymology or derivation. The origin and formation of a word through
    grammatical rules.
  related:
    - prakriyā
प्रयोग:
  termRoman: prayoga
  category: general
  meaning: Voice or construction. The way a verb relates to its @[kartṛ] and @[karman].
कर्तरि प्रयोग:
  termRoman: kartari prayoga
  category: general
  meaning: Active voice. The @[kartṛ] (agent) is the grammatical subject and takes
    @[prathamā]. The verb agrees with the @[kartṛ].
  related:
    - karmaṇi prayoga
    - kartṛ
कर्मणि प्रयोग:
  termRoman: karmaṇi prayoga
  category: general
  meaning: Passive voice. The @[karman] (object) becomes the grammatical subject
    and takes @[prathamā]. The @[kartṛ] takes @[tṛtīyā].
  related:
    - kartari prayoga
    - karman
भावे प्रयोग:
  termRoman: bhāve prayoga
  category: general
  meaning: Impersonal passive. Used with intransitive verbs. The verb is always
    third person singular neuter. @[मया गम्यते] 'going is done by me'.
  related:
    - karmaṇi prayoga
सहार्थ:
  termRoman: sahārtha
  category: karaka
  meaning: "Accompaniment. Expressed by @[tṛtīyā] with @[saha]: @[पुत्रेण सह
    गच्छति] 'goes with the son'."
  related:
    - tṛtīyā
प्रयोजन:
  termRoman: prayojana
  category: karaka
  meaning: "Purpose or goal. Expressed by @[caturthī]: @[विद्यायै गच्छति] 'goes
    for knowledge'."
  related:
    - caturthī
    - sampradāna
दान:
  termRoman: dāna
  category: karaka
  meaning: "Giving. The prototypical action for @[sampradāna] (recipient):
    @[ब्राह्मणाय गां ददाति] 'gives a cow to the brahmin'."
साधकतम:
  termRoman: sādhakatama
  category: karaka
  meaning: "Most effective means. The defining quality of @[karaṇa] (instrument):
    @[दात्रेण लुनाति] 'cuts with the sickle'."
  sutraRef: 1.4.42
  related:
    - karaṇa
ईप्सिततम:
  termRoman: īpsitatama
  category: karaka
  meaning: "Most desired (to affect). The defining quality of @[karman]: what the
    @[kartṛ] most wishes to accomplish."
  sutraRef: 1.4.49
  related:
    - karman
स्वतन्त्र:
  termRoman: svatantra
  category: karaka
  meaning: "Independent. The defining quality of @[kartṛ]: the agent acts of their
    own accord, not as instrument of another."
  sutraRef: 1.4.54
  related:
    - kartṛ
आधार:
  termRoman: ādhāra
  category: karaka
  meaning: "Container or support. The defining quality of @[adhikaraṇa] (locus):
    where the action takes place."
  sutraRef: 1.4.45
  related:
    - adhikaraṇa
ध्रुव:
  termRoman: dhruva
  category: karaka
  meaning: "Fixed point. The defining quality of @[apādāna]: the stationary point
    from which separation occurs."
  sutraRef: 1.4.24
  related:
    - apādāna
सम्बोधन:
  termRoman: sambodhana
  category: vibhakti
  meaning: "The address case ('O ___!'). Pāṇini treats it as प्रथमा-in-address
    (2.3.47), so it borrows nominative forms, but the singular often shortens:
    @[he rāma] 'O Rāma!', @[he deva] not @[devaḥ]. Marked by हे / भोः."
  related:
    - prathamā
सति सप्तमी:
  termRoman: sati saptamī
  category: vibhakti
  meaning: "Locative absolute. A construction where both subject and participle
    take @[saptamī] to express circumstance: @[सूर्ये उदिते] 'the sun having
    risen'."
  related:
    - saptamī
    - adhikaraṇa
गत्यर्थ:
  termRoman: gatyartha
  category: vibhakti
  meaning: "Motion meaning. Verbs of motion (@[गम्], @[या], etc.) whose
    destination takes @[dvitīyā]: @[ग्रामं गच्छति] 'goes to the village'."
  related:
    - dvitīyā
काल:
  termRoman: kāla
  category: vibhakti
  meaning: "Time. Duration takes @[dvitīyā]: @[मासं वसति] 'stays for a month'.
    Time-when takes @[saptamī]: @[प्रातःकाले] 'in the morning'."
अध्वन्:
  termRoman: adhvan
  category: vibhakti
  meaning: "Distance or path. Extent of distance takes @[dvitīyā]: @[क्रोशं
    गच्छति] 'goes one krośa'."
  related:
    - dvitīyā
अत्यन्तसंयोग:
  termRoman: atyantasaṃyoga
  category: vibhakti
  meaning: Complete connection. When @[dvitīyā] expresses duration, the action
    pervades the entire time/distance.
  sutraRef: 2.3.5
लिङ्ग:
  termRoman: liṅga
  category: samjna
  meaning: "Gender. Sanskrit has three: @[puṃliṅga] (masculine), @[strīliṅga]
    (feminine), @[napuṃsakaliṅga] (neuter)."
पुंलिङ्ग:
  termRoman: puṃliṅga
  category: samjna
  meaning: Masculine gender. E.g., @[देवः] 'god', @[नरः] 'man'.
  related:
    - liṅga
स्त्रीलिङ्ग:
  termRoman: strīliṅga
  category: samjna
  meaning: Feminine gender. E.g., @[देवी] 'goddess', @[नदी] 'river'.
  related:
    - liṅga
नपुंसकलिङ्ग:
  termRoman: napuṃsakaliṅga
  category: samjna
  meaning: Neuter gender. E.g., @[फलम्] 'fruit', @[वनम्] 'forest'.
  related:
    - liṅga
वचन:
  termRoman: vacana
  category: vibhakti
  meaning: "Number. Sanskrit has three: @[ekavacana] (singular), @[dvivacana]
    (dual), @[bahuvacana] (plural)."
तपस्:
  termRoman: tapas
  category: general
  meaning: Austerity or penance. Spiritual practice involving self-discipline.
सह:
  - termRoman: saha
    category: general
    meaning: "With (together with). Governs @[tṛtīyā]: @[पुत्रेण सह] 'with the son'."
    related:
      - sahārtha
      - tṛtīyā
  - termRoman: saha
    category: general
    meaning: With, together with. Governs instrumental case for accompaniment.
    related:
      - sahārtha
शेष:
  termRoman: śeṣa
  category: karaka
  meaning: Remainder. षष्ठी (genitive) expresses relations not covered by other कारकs.
  sutraRef: 2.3.50
  related:
    - ṣaṣṭhī
उपमान:
  termRoman: upamāna
  category: karaka
  meaning: "Standard of comparison. Takes पञ्चमी (ablative): @[रामात् बलवान्]
    'stronger than Rama'."
  related:
    - pañcamī
स्वामित्व:
  termRoman: svāmitva
  category: karaka
  meaning: "Ownership. A type of सम्बन्ध expressed by षष्ठी: @[मम गृहम्] 'my house'."
  related:
    - ṣaṣṭhī
    - sambandha
अवयव:
  termRoman: avayava
  category: karaka
  meaning: "Part or limb. Part-whole relation expressed by षष्ठी: @[वृक्षस्य शाखा]
    'branch of tree'."
  related:
    - ṣaṣṭhī
विकार:
  termRoman: vikāra
  category: karaka
  meaning: "Modification or transformation. Material relation in षष्ठी:
    @[सुवर्णस्य भूषणम्] 'ornament of gold'."
  related:
    - ṣaṣṭhī
औपश्लेषिक:
  termRoman: aupaśleṣika
  category: karaka
  meaning: "Contact-based अधिकरण. The आधार touches the action: @[कटे आस्ते] 'sits
    on the mat'."
  related:
    - adhikaraṇa
वैषयिक:
  termRoman: vaiṣayika
  category: karaka
  meaning: "Domain-based अधिकरण. Abstract location: @[मोक्षे इच्छा] 'desire for
    liberation', @[व्याकरणे निपुणः] 'skilled in grammar'."
  related:
    - adhikaraṇa
अभिव्यापक:
  termRoman: abhivyāpaka
  category: karaka
  meaning: "Pervading अधिकरण. The located thing pervades the locus: @[तिलेषु
    तैलम्] 'oil in sesame seeds'."
  related:
    - adhikaraṇa
कालाधिकरण:
  termRoman: kālādhikaraṇa
  category: karaka
  meaning: "Temporal location. सप्तमी (locative) expressing time-when:
    @[प्रातःकाले] 'at dawn', @[मध्याह्ने] 'at midday'."
  related:
    - adhikaraṇa
    - kāla
    - saptamī
निमित्त:
  termRoman: nimitta
  category: karaka
  meaning: Occasion or circumstance. Expressed by सप्तमी in constructions like सति
    सप्तमी.
  related:
    - saptamī
विषय:
  termRoman: viṣaya
  category: karaka
  meaning: "Domain or subject matter. सप्तमी meaning 'regarding': @[शास्त्रे
    पण्डितः] 'learned in शास्त्र'."
  related:
    - saptamī
देश:
  termRoman: deśa
  category: karaka
  meaning: "Place or location. Spatial अधिकरण: @[गृहे वसति] 'lives in the house'."
  related:
    - adhikaraṇa
कृदन्त:
  termRoman: kṛdanta
  category: pratyaya
  meaning: Word ending in a कृत् suffix. Verbal derivative like @[गत] 'gone',
    @[कृत] 'done'.
  related:
    - kṛt
सम्बन्ध:
  termRoman: sambandha
  category: karaka
  meaning: "Relation — the plain 'of' link between two nouns, the one 'role' with
    no tie to the verb. Takes षष्ठी (2.3.50): @[rāmasya putraḥ] 'Rāma's son.'
    Strictly outside the कारक set, but shown beside them because it too governs
    a case."
  related:
    - ṣaṣṭhī
भय:
  termRoman: bhaya
  category: general
  meaning: "Fear. The cause of fear takes पञ्चमी: @[चोरात् बिभेति] 'fears the thief'."
  related:
    - pañcamī
त्राण:
  termRoman: trāṇa
  category: general
  meaning: "Protection. The source of danger takes पञ्चमी: @[सिंहात् त्रायते] 'is
    protected from the lion'."
  related:
    - pañcamī
निष्ठा:
  termRoman: niṣṭhā
  category: pratyaya
  meaning: Collective name for @[kta] and @[ktavatu] suffixes. Past participle
    affixes defined in 1.1.26.
  sutraRef: 1.1.26
  related:
    - kta
    - ktavatu
सत्:
  termRoman: sat
  category: pratyaya
  meaning: Technical name for @[śatṛ] and @[śānac] (present participle suffixes).
    Defined in 3.2.127.
  sutraRef: 3.2.127
  related:
    - śatṛ
    - śānac
कृत्य:
  termRoman: kṛtya
  category: pratyaya
  meaning: "Future passive participle suffixes (@[tavya], @[anīya], @[yat]).
    Express obligation: 'to be done'."
  sutraRef: 3.1.96
  related:
    - tavya
    - anīya
अपत्य:
  termRoman: apatya
  category: samjna
  meaning: Offspring or descendant. The meaning expressed by patronymic suffixes
    like @[aṇ], @[iñ].
  sutraRef: 4.1.92
गोत्र:
  termRoman: gotra
  category: samjna
  meaning: Clan or lineage. Family name passed through generations, formed with
    special suffixes.
  related:
    - apatya
इमनिच्:
  termRoman: imanic
  category: pratyaya
  meaning: Abstract noun suffix (= @[iman]). Forms nouns like @[गरिमन्]
    'heaviness' with @[vṛddhi].
  sutraRef: 5.1.120
  related:
    - tva
    - tal
यत्:
  - termRoman: yat
    category: pratyaya
    meaning: Gerundive — 'to be done,' the यत् suffix (-य) on a VOWEL-final root
      (3.1.97). @deva[देयम्] 'to be given' (दा), @deva[गेयम्] 'to be sung.' Same
      sense as ण्यत्, chosen by the root's final sound.
    sutraRef: 3.1.97
    related:
      - tavya
      - kṛtya
  - termRoman: yat
    category: pratyaya
    meaning: Gerundive — 'to be done,' the यत् suffix (-य) on a VOWEL-final root
      (3.1.97). @deva[देयम्] 'to be given' (दा), @deva[गेयम्] 'to be sung.' Same
      sense as ण्यत्, chosen by the root's final sound.
    sutraRef: 3.1.97
    related:
      - kṛtya
इञ्:
  termRoman: iñ
  category: pratyaya
  meaning: Patronymic suffix (= @[i]) after @[a]-final stems. @[दक्ष] → @[दाक्षिः]
    'son of Daksha'.
  sutraRef: 4.1.95
  related:
    - aṇ
    - apatya
ढक्:
  termRoman: ḍhak
  category: pratyaya
  meaning: Patronymic suffix (= @[eya]). @[कुन्ती] → @[कौन्तेयः] 'son of Kunti'.
  related:
    - apatya
वल्:
  termRoman: val
  category: pratyahara
  meaning: Pratyahara covering most consonants. Used in @[iṭ] augment rules (7.2.35).
  sutraRef: 7.2.35
झल्:
  termRoman: jhal
  category: pratyahara
  meaning: Pratyahara for obstruent consonants (stops and sibilants). Used in
    sandhi rules.
पररूप:
  termRoman: pararūpa
  category: sandhi
  meaning: Substitution by the following element. In @[a/ā + e/o], the @[e/o]
    replaces both.
  sutraRef: 6.1.94
पूर्वरूप:
  termRoman: pūrvarūpa
  category: sandhi
  meaning: Substitution by the preceding element. The prior vowel replaces both in
    certain contexts.
  sutraRef: 6.1.109
प्रकृतिभाव:
  termRoman: prakṛtibhāva
  category: sandhi
  meaning: Retention of original form. No sandhi occurs; both elements remain unchanged.
आयादेश:
  termRoman: āyādeśa
  category: sandhi
  meaning: Substitution by @[āy], @[āv], etc. Diphthongs become @[ay], @[av]
    before vowels.
  sutraRef: 6.1.78
प्रधान:
  termRoman: pradhāna
  category: samasa
  meaning: Primary or principal element. In @[tatpuruṣa], the second member is
    @[pradhāna].
  related:
    - upasarjana
उपसर्जन:
  termRoman: upasarjana
  category: samasa
  meaning: Subordinate element. In compounds, the non-primary member that
    qualifies the @[pradhāna].
  sutraRef: 1.2.43
  related:
    - pradhāna
समाहार द्वन्द्व:
  termRoman: samāhāra dvandva
  category: samasa
  meaning: "Collective @[dvandva]. Members taken as a group; result is neuter
    singular: @[पाणिपादम्]."
  related:
    - dvandva
इतरेतर द्वन्द्व:
  termRoman: itaretara dvandva
  category: samasa
  meaning: "Enumerative @[dvandva]. Members counted individually; result is
    plural: @[रामलक्ष्मणौ]."
  related:
    - dvandva
विधिलिङ्:
  termRoman: vidhiliṅ
  category: lakara
  meaning: "Optative (विधिलिङ्) — should / would / may; advice and possibility.
    The -ेत् / -ेयुः endings: @deva[भवेत्] 'should be,' @deva[गच्छेत्] 'should
    go.' Contrast लोट् (a direct command) and लट् (a plain fact)."
  sutraRef: 3.3.161
  related:
    - āśīrliṅ
    - liṅ
आशीर्लिङ्:
  termRoman: āśīrliṅ
  category: lakara
  meaning: "Benedictive optative. Expresses blessing or wish: @[भूयात्] 'may it be!'"
  sutraRef: 3.3.173
  related:
    - vidhiliṅ
    - liṅ
अनद्यतन:
  termRoman: anadyatana
  category: lakara
  meaning: Not of today. Time reference excluding the current day; governs @[laṅ]
    and @[luṭ].
  sutraRef: 3.2.111
परोक्ष:
  termRoman: parokṣa
  category: lakara
  meaning: Unwitnessed. Past action not seen by the speaker; expressed by @[liṭ]
    (perfect).
  sutraRef: 3.2.115
  related:
    - liṭ
स्थानिवत्:
  termRoman: sthānivat
  category: samjna
  meaning: Like the original. A substitute behaves as if it were the replaced
    element for certain rules.
  sutraRef: 1.1.56
असिद्ध:
  termRoman: asiddha
  category: samjna
  meaning: Non-effected. A rule's result is 'invisible' to certain other rules.
  sutraRef: 8.2.1
उपधा:
  termRoman: upadhā
  category: samjna
  meaning: "Penultimate. The letter before the final: in @[पच्], @[अ] is the @[upadhā]."
  sutraRef: 1.1.65
टि:
  termRoman: ṭi
  category: samjna
  meaning: Final portion. The last vowel and what follows it in a word.
  sutraRef: 1.1.64
nominative:
  termRoman: nominative
  category: vibhakti
  meaning: "First case (@deva[प्रथमा]). Used for the subject of a sentence or
    simple naming. Sanskrit: @deva[प्रथमा विभक्ति]."
  related:
    - prathamā
accusative:
  termRoman: accusative
  category: vibhakti
  meaning: "Second case (@deva[द्वितीया]). Used for the direct object of a
    transitive verb. Sanskrit: @deva[द्वितीया विभक्ति]."
  related:
    - dvitīyā
instrumental:
  termRoman: instrumental
  category: vibhakti
  meaning: "Third case (@deva[तृतीया]). Used for the instrument or means, also for
    agent in passive. Sanskrit: @deva[तृतीया विभक्ति]."
  related:
    - tṛtīyā
dative:
  termRoman: dative
  category: vibhakti
  meaning: "Fourth case (@deva[चतुर्थी]). Used for the indirect object or
    recipient. Sanskrit: @deva[चतुर्थी विभक्ति]."
  related:
    - caturthī
ablative:
  termRoman: ablative
  category: vibhakti
  meaning: "Fifth case (@deva[पञ्चमी]). Used for source, separation, or
    comparison. Sanskrit: @deva[पञ्चमी विभक्ति]."
  related:
    - pañcamī
genitive:
  termRoman: genitive
  category: vibhakti
  meaning: "Sixth case (@deva[षष्ठी]). Used for possession and various relations.
    Sanskrit: @deva[षष्ठी विभक्ति]."
  related:
    - ṣaṣṭhī
locative:
  termRoman: locative
  category: vibhakti
  meaning: "Seventh case (@deva[सप्तमी]). Used for location in space or time.
    Sanskrit: @deva[सप्तमी विभक्ति]."
  related:
    - saptamī
vocative:
  termRoman: vocative
  category: vibhakti
  meaning: "Case of direct address (@deva[सम्बोधन]). Uses @deva[प्रथमा] endings
    with special forms. Sanskrit: @deva[सम्बोधन प्रथमा]."
  related:
    - sambodhana
    - prathamā
singular:
  termRoman: singular
  category: vibhakti
  meaning: "One item (@deva[एकवचन]). Sanskrit: @deva[एकवचनम्]."
  related:
    - ekavacana
dual:
  termRoman: dual
  category: vibhakti
  meaning: "Two items (@deva[द्विवचन]). Sanskrit has a special number for exactly
    two. Sanskrit: @deva[द्विवचनम्]."
  related:
    - dvivacana
plural:
  termRoman: plural
  category: vibhakti
  meaning: "More than two items (@deva[बहुवचन]). Sanskrit: @deva[बहुवचनम्]."
  related:
    - bahuvacana
present:
  termRoman: present
  category: lakara
  meaning: "Present tense (@deva[लट्]). Expresses ongoing or habitual action.
    Sanskrit: @deva[वर्तमानकालः]."
  related:
    - laṭ
    - vartamāna
imperfect:
  termRoman: imperfect
  category: lakara
  meaning: "Past tense not of today (@deva[लङ्]). Sanskrit: @deva[अनद्यतन भूतकालः]."
  related:
    - laṅ
    - anadyatana
perfect:
  termRoman: perfect
  category: lakara
  meaning: "Past tense unwitnessed (@deva[लिट्]). Action not seen by speaker.
    Sanskrit: @deva[परोक्ष भूतकालः]."
  related:
    - liṭ
    - parokṣa
aorist:
  termRoman: aorist
  category: lakara
  meaning: "General past tense (@deva[लुङ्]). Simple past without specific nuance.
    Sanskrit: @deva[सामान्य भूतकालः]."
  related:
    - luṅ
    - bhūta
future:
  termRoman: future
  category: lakara
  meaning: "Future tense. Simple future is @deva[लृट्]; periphrastic future is
    @deva[लुट्]. Sanskrit: @deva[भविष्यत्कालः]."
  related:
    - lṛṭ
    - luṭ
    - bhaviṣyat
imperative:
  termRoman: imperative
  category: lakara
  meaning: "Command mood (@deva[लोट्]). Used for orders, requests, blessings.
    Sanskrit: @deva[आज्ञार्थः]."
  related:
    - loṭ
optative:
  termRoman: optative
  category: lakara
  meaning: "Potential mood (@deva[लिङ्]). Expresses possibility, wish, or
    prescription. Sanskrit: @deva[विध्यर्थः]."
  related:
    - liṅ
    - vidhiliṅ
conditional:
  termRoman: conditional
  category: lakara
  meaning: "Hypothetical mood (@deva[लृङ्]). Used for 'would have' scenarios.
    Sanskrit: @deva[सङ्केतार्थः]."
  related:
    - lṛṅ
benedictive:
  termRoman: benedictive
  category: lakara
  meaning: "Blessing mood (@deva[आशीर्लिङ्]). Used for wishes and blessings.
    Sanskrit: @deva[आशिषि लिङ्]."
  related:
    - āśīrliṅ
active:
  termRoman: active
  category: samjna
  meaning: "Active voice (@deva[परस्मैपद]). Action for another's benefit.
    Sanskrit: @deva[कर्तरि प्रयोगः]."
  related:
    - parasmaipada
    - kartari prayoga
middle:
  termRoman: middle
  category: samjna
  meaning: "Middle voice (@deva[आत्मनेपद]). Action for one's own benefit.
    Sanskrit: @deva[आत्मनेपदम्]."
  related:
    - ātmanepada
passive:
  termRoman: passive
  category: samjna
  meaning: "Passive voice (@deva[कर्मणि प्रयोग]). Object becomes subject; agent in
    instrumental. Sanskrit: @deva[कर्मणि प्रयोगः]."
  related:
    - karmaṇi prayoga
causative:
  termRoman: causative
  category: pratyaya
  meaning: "Causing another to act (@deva[णिच्]). @deva[पच्] 'cook' →
    @deva[पाचयति] 'causes to cook'. Sanskrit: @deva[प्रयोजकः]."
  related:
    - ṇic
desiderative:
  termRoman: desiderative
  category: pratyaya
  meaning: "Expressing desire to act (@deva[सन्]). @deva[पा] 'drink' →
    @deva[पिपासति] 'wants to drink'. Sanskrit: @deva[सन्नन्तः]."
  related:
    - san
intensive:
  termRoman: intensive
  category: pratyaya
  meaning: "Expressing repeated or intense action (@deva[यङ्]). Also called
    frequentative. Sanskrit: @deva[यङन्तः]."
participle:
  termRoman: participle
  category: pratyaya
  meaning: "Verbal adjective. Present (@deva[शतृ]/[@deva[शानच्]), past
    (@deva[क्त]), future passive (@deva[तव्य]). Sanskrit: @deva[कृदन्तः]."
  related:
    - śatṛ
    - śānac
    - kta
    - tavya
infinitive:
  termRoman: infinitive
  category: pratyaya
  meaning: "Verbal noun 'to do' (@deva[तुमुन्]). @deva[गन्तुम्] 'to go'. Sanskrit:
    @deva[तुमन्तः]."
  related:
    - tumun
absolutive:
  termRoman: absolutive
  category: pratyaya
  meaning: "Gerund 'having done' (@deva[क्त्वा], @deva[ल्यप्]). @deva[गत्वा]
    'having gone'. Sanskrit: @deva[क्त्वान्तः]."
  related:
    - ktvā
    - lyap
agent:
  termRoman: agent
  category: karaka
  meaning: "The doer of the action (@deva[कर्तृ]). Independent performer.
    Sanskrit: @deva[कर्ता]."
  related:
    - kartṛ
object:
  termRoman: object
  category: karaka
  meaning: "What the action affects (@deva[कर्मन्]). What the agent most desires
    to reach. Sanskrit: @deva[कर्म]."
  related:
    - karman
instrument:
  termRoman: instrument
  category: karaka
  meaning: "The means of the action (@deva[करण]). Most effective tool. Sanskrit:
    @deva[करणम्]."
  related:
    - karaṇa
recipient:
  termRoman: recipient
  category: karaka
  meaning: "One who receives (@deva[सम्प्रदान]). Indirect object. Sanskrit:
    @deva[सम्प्रदानम्]."
  related:
    - sampradāna
source:
  termRoman: source
  category: karaka
  meaning: "Point of separation (@deva[अपादान]). Fixed point from which something
    moves away. Sanskrit: @deva[अपादानम्]."
  related:
    - apādāna
locus:
  termRoman: locus
  category: karaka
  meaning: "Location of the action (@deva[अधिकरण]). Where the action occurs.
    Sanskrit: @deva[अधिकरणम्]."
  related:
    - adhikaraṇa
masculine:
  termRoman: masculine
  category: samjna
  meaning: "Masculine gender (@deva[पुंलिङ्ग]). One of three genders in Sanskrit.
    Sanskrit: @deva[पुंलिङ्गम्]."
  related:
    - puṃliṅga
feminine:
  termRoman: feminine
  category: samjna
  meaning: "Feminine gender (@deva[स्त्रीलिङ्ग]). One of three genders in
    Sanskrit. Sanskrit: @deva[स्त्रीलिङ्गम्]."
  related:
    - strīliṅga
neuter:
  termRoman: neuter
  category: samjna
  meaning: "Neuter gender (@deva[नपुंसकलिङ्ग]). One of three genders in Sanskrit.
    Sanskrit: @deva[नपुंसकलिङ्गम्]."
  related:
    - napuṃsakaliṅga
first person:
  termRoman: first person
  category: vibhakti
  meaning: "The speaker (@deva[उत्तम पुरुष]). 'I/we' in English. Sanskrit:
    @deva[उत्तमपुरुषः]."
  related:
    - uttama
second person:
  termRoman: second person
  category: vibhakti
  meaning: "The addressee (@deva[मध्यम पुरुष]). 'You' in English. Sanskrit:
    @deva[मध्यमपुरुषः]."
  related:
    - madhyama
third person:
  termRoman: third person
  category: vibhakti
  meaning: "The one spoken about (@deva[प्रथम पुरुष]). 'He/she/it/they' in
    English. Sanskrit: @deva[प्रथमपुरुषः]."
  related:
    - prathama
root:
  termRoman: root
  category: samjna
  meaning: "Verbal root (@deva[धातु]). The base form from which verbs are derived.
    Sanskrit: @deva[धातुः]."
  related:
    - dhātu
stem:
  termRoman: stem
  category: samjna
  meaning: "Nominal stem (@deva[प्रातिपदिक]) or verbal base (@deva[अङ्ग]). What
    affixes attach to. Sanskrit: @deva[प्रातिपदिकम्], @deva[अङ्गम्]."
  related:
    - prātipadika
