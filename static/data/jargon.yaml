  related:
    - āśīrliṅ
कण्ठ्य:
  termRoman: kaṇṭhya
  category: samjna
  meaning: "Guttural — produced at the throat (कण्ठ). Sounds: अ, आ, क-वर्ग, ह, विसर्ग."
  related:
    - uccāraṇasthāna
तालव्य:
  termRoman: tālavya
  category: samjna
  meaning: "Palatal — produced at the palate (तालु). Sounds: इ, ई, च-वर्ग, य, श."
  related:
    - uccāraṇasthāna
मूर्धन्य:
  termRoman: mūrdhanya
  category: samjna
  meaning: "Retroflex / cerebral — produced at the roof of the mouth (मूर्धन्).
    Sounds: ऋ, ॠ, ट-वर्ग, र, ष."
  related:
    - uccāraṇasthāna
दन्त्य:
  termRoman: dantya
  category: samjna
  meaning: "Dental — produced at the teeth (दन्त). Sounds: ऌ, ॡ, त-वर्ग, ल, स."
  related:
    - uccāraṇasthāna
ओष्ठ्य:
  termRoman: oṣṭhya
  category: samjna
  meaning: "Labial — produced at the lips (ओष्ठ). Sounds: उ, ऊ, प-वर्ग."
  related:
    - uccāraṇasthāna
अघोष:
  termRoman: aghoṣa
  category: samjna
  meaning: Voiceless — produced without vibration of the vocal cords. The 1st and
    2nd members of each varga.
  related:
    - ghoṣa
    - sparśa
घोष:
  termRoman: ghoṣa
  category: samjna
  meaning: Voiced — produced with vibration of the vocal cords. The 3rd, 4th, and
    5th members of each varga, plus semivowels.
  related:
    - aghoṣa
    - sparśa
अल्पप्राण:
  termRoman: alpaprāṇa
  category: samjna
  meaning: Unaspirated — produced with little breath. The 1st, 3rd, and 5th
    members of each varga.
  related:
    - mahāprāṇa
महाप्राण:
  termRoman: mahāprāṇa
  category: samjna
  meaning: Aspirated — produced with a strong puff of breath. The 2nd and 4th
    members of each varga.
  related:
    - alpaprāṇa
क्तिन्:
  termRoman: ktin
  category: pratyaya
  meaning: Action-noun suffix — names the act as a FEMININE thing, shows as -ति
    (3.3.94). @deva[गतिः] 'going' (गम्), @deva[मतिः] 'thought,' @deva[सम्पत्तिः]
    'attainment.' The feminine counterpart of masculine घञ् (पाकः).
  sutraRef: 3.3.94
घञ्:
  termRoman: ghañ
  category: pratyaya
  meaning: Action-noun suffix — names the act as a MASCULINE thing, -a with
    गुण/वृद्धि of the root (3.3.18). @deva[पाकः] 'cooking' (पच्), @deva[त्यागः]
    'giving up,' @deva[लाभः] 'gain' (लभ्). Masculine counterpart of feminine
    क्तिन् (गतिः).
  sutraRef: 3.3.18
ल्युट्:
  termRoman: lyuṭ
  category: pratyaya
  meaning: Action-noun suffix — names the act as a NEUTER thing, shows as -अन
    (3.3.115). @deva[गमनम्] 'going' (गम्), @deva[दानम्] 'giving' (दा),
    @deva[दर्शनम्] 'seeing.' The neuter action-noun, beside masculine घञ् and
    feminine क्तिन्.
  sutraRef: 3.3.115
ण्वुल्:
  termRoman: ṇvul
  category: pratyaya
  meaning: "Agent-noun suffix — 'the one who ___s,' shows as -अक (3.1.133).
    @deva[कारकः] 'doer' (कृ), @deva[नायकः] 'leader,' @deva[दायकः] 'giver.' Pairs
    with तृच् (कर्ता): ण्वुल् gives -अक, तृच् gives -तृ."
  sutraRef: 3.1.133
