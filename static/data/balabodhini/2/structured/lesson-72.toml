# --- passage ---

[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "తవ పితామహః గ్రామే అస్తివా?"
english = "Is your paternal grandfather in the village?"

[[sections.items]]
n = 2
sanskrit_telugu = "తాదృశః బాలకః కుత్రాపి నాస్తి; యుష్మద్భాగినేయస్య ఉపనయనం అసీదా్వ?"
english = "Such a boy does not exist anywhere; has your nephew's upanayana ceremony taken place?"

[[sections.items]]
n = 3
sanskrit_telugu = "అస్మాదృశానాం వృద్ధానాం సర్వదా యుష్మాదృశైః బాలకైః సేవా కర్తవ్యా?"
english = "Should those like us, the elders, always be served by boys like you?"

[[sections.items]]
n = 4
sanskrit_telugu = "తేషాం వ్యవహారం ప్రచ్చ."
english = "Ask about their affairs."

[[sections.items]]
n = 5
sanskrit_telugu = "పాకః ఆసీత్కింభో దేవతార్చనార్థం కః స్నాస్యతి."
english = "Was there cooking? Who will bathe for the purpose of worshipping the deity?"

[[sections.items]]
n = 6
sanskrit_telugu = "యూయం స్నాత."
english = "You all should bathe."

[[sections.items]]
n = 7
sanskrit_telugu = "అరే ఇదానీమపి నిద్రాసి కిం రే."
english = "Hey, are you still sleeping even now?"

[[sections.items]]
n = 8
sanskrit_telugu = "ఘంటాదశకం అసీత్; ఉత్తిష్ఠ, ఉత్తిష్ఠ."
english = "It was ten o'clock; get up, get up."

[[sections.items]]
n = 9
sanskrit_telugu = "దంత ధావనం కురు."
english = "Clean your teeth."

[[sections.items]]
n = 10
sanskrit_telugu = "ముఖప్రక్షాళనానంతరం పుష్పాణి విభజ్య కానిచి తృష్ణేపణి రామాయ దేహి."
english = "After washing your face, divide the flowers and give some to Rāma with devotion."

[[sections.items]]
n = 11
sanskrit_telugu = "కానిచి తృష్ణేపణి అనుజాయైపి దేహి."
english = "Give some also to the younger sister with devotion."

[[sections.items]]
n = 12
sanskrit_telugu = "బాలకాః సర్వేపి కథం దోలాయంతేవా పశ్య."
english = "Look how all the boys are swinging on the swing."

[[sections.items]]
n = 13
sanskrit_telugu = "త్వం కదావా తథా అదోలాయథాః కిం?"
english = "Did you ever swing like that?"

[[sections.items]]
n = 14
sanskrit_telugu = "పతేయం కింవా ఇతి మామ అధిక భయం."
english = "I have great fear thinking 'What if I fall?'"

[[sections.items]]
n = 15
sanskrit_telugu = "అతపే ఆగచ్చ తస్మాత్ ఈషత్కాలం అస్మద్గృహే విశ్రమ్య గచ్చ."
english = "Come out of the sun; rest in our house for a little while and then go."

[[sections.items]]
n = 16
sanskrit_telugu = """అరే దేవగృహే
దీపః నాస్తి; ప్రజ్వలయ."""
english = "Hey, there is no lamp in the temple; light it."

[[sections.items]]
n = 17
sanskrit_telugu = """మమాంగుష్ఠే పాషాణప్రహారేణ అదళత్. నఖః దీపః నాస్తి; ప్రజ్వలయ. మమాంగుష్ఠే పాషాణప్రహారేణ అదళత్. నఖః ఉదతిష్ఠత్; తర్హి త్వం కథం స్నాస్యసి?"""
english = "My thumb split from a stone blow. The nail — there is no lamp; light it. My thumb split from a stone blow. The nail rose up; then how will you bathe?"

[[sections.items]]
n = 18
sanskrit_telugu = "తవ వివాహార్థం మాతులపుత్రికా అస్తిఖలు అస్తి చేత్కిం."
english = "There is a maternal uncle's daughter for your marriage, isn't there? If there is, what of it?"

[[sections.items]]
n = 19
sanskrit_telugu = """మహ్యం దాతుం మాతులానాఽ అభిప్రాయః నాస్తి. మామ మాతులః అస్తి చేత్కిం. మహ్యం దాతుం మాతులానాఽ అభిప్రాయః నాస్తి. మామ మాతులః అస్తి చేత్కిం. మహ్యం దాతుం మాతులానాఽ అభిప్రాయః నాస్తి. మామ మాతులః అస్వతంత్రః."""
english = "The maternal uncle's wife has no intention of giving her to me. My maternal uncle — if he is there, what of it? The maternal uncle's wife has no intention of giving her to me. My maternal uncle — if he is there, what of it? The maternal uncle's wife has no intention of giving her to me. My maternal uncle is not independent."

[[sections.items]]
n = 20
sanskrit_telugu = "ఈషదపి కార్యం కర్తుం న శక్నోతి; తస్మాత్కృథం భవిష్యతివా."
english = "He cannot do even a little work; so what will happen then?"

[[sections.items]]
n = 21
sanskrit_telugu = "కేని జ్ఞాయతే?"
english = "Who knows?"

# --- passage_translation ---

[[sections]]
type = "passage_translation"
language = "telugu"

[[sections.items]]
n = 1
telugu = "శ్రీరాముడు తన తండ్రియొక్కఁ ఆజ్ఞచేత అరణ్యమునకు వెళ్ళెను."
english = "Śrī Rāma went to the forest by his father's command."

[[sections.items]]
n = 2
telugu = "అక్కఁడ శూర్పణఖ రాముని చూచుటకు వచ్చెను."
english = "There Śūrpaṇakhā came to see Rāma."

[[sections.items]]
n = 3
telugu = """మొవంటి చక్కని పురుషులు లోకమందు శూర్పణఖ రాముని చూచుటకు వచ్చెను. మొవంటి చక్కని పురుషులు లోకమందు శూర్పణఖ రాముని చూచుటకు వచ్చెను. మొవంటి చక్కని పురుషులు లోకమందు దెక్కఁడను లేరు. గనుక నిన్నుఁ పెండ్లాడుటకు వచ్చితిని. నన్నుఁ దెక్కఁడను లేరు. గనుక నిన్నుఁ పెండ్లాడుటకు వచ్చితిని. నన్నుఁ దెక్కఁడను లేరు. గనుక నిన్నుఁ పెండ్లాడుటకు వచ్చితిని. నన్నుఁ (గ్రహింపుము = గృహాణ) అని అడిగెను."""
english = "Handsome men like you do not exist anywhere in the world — Śūrpaṇakhā came to see Rāma. Handsome men like you do not exist anywhere in the world. So I have come to marry you. There is no one like me anywhere. So I have come to marry you. She asked: 'Accept me (gṛhāṇa).'"

[[sections.items]]
n = 4
telugu = """అప్పుఁడు రాముఁడు శూర్పణఖ (గ్రహింపుము = గృహాణ) అని అడిగెను. అప్పుఁడు రాముఁడు శూర్పణఖ కొఱకు లక్ష్మణిఁ జూపి వీనివంటి సుందరపురుమఁడు నీకు దొరకఁడు వీనిని కొఱకు లక్ష్మణిఁ జూపి వీనివంటి సుందరపురుమఁడు నీకు దొరకఁడు వీనిని పెండ్లాడుమని చెప్పి పంపెను."""
english = "Then Rāma — Śūrpaṇakhā asked 'Accept me (gṛhāṇa).' Then Rāma pointed to Lakṣmaṇa for Śūrpaṇakhā and said, 'You will not find a handsome man like him — marry him,' and sent her away."

[[sections.items]]
n = 5
telugu = """అప్పుఁడు శూర్పణఖ లక్ష్మణిని చెంతకు వెళ్ళి పెండ్లాడుమని చెప్పి పంపెను. అప్పుఁడు శూర్పణఖ లక్ష్మణిని చెంతకు వెళ్ళి (మునుపటివలె = యథాపూర్వం) అడిగెను."""
english = "Then Śūrpaṇakhā went to Lakṣmaṇa and said 'Marry me' and was sent away. Then Śūrpaṇakhā went near Lakṣmaṇa and asked as before (yathāpūrvam)."

[[sections.items]]
n = 6
telugu = """అంతట లక్ష్మణుఁడు ఆమెయొక్కఁ (మునుపటివలె = యథాపూర్వం) అడిగెను. అంతట లక్ష్మణుఁడు ఆమెయొక్కఁ ముక్కును కర్ణద్వయమును కోసెను."""
english = "Thereupon Lakṣmaṇa asked her as before (yathāpūrvam). Thereupon Lakṣmaṇa cut off her nose and both ears."

[[sections.items]]
n = 7
telugu = """నేనిప్పుడు నిద్రపోవుచున్నానుగాని నాతో ముక్కును కర్ణద్వయమును కోసెను. నేనిప్పుడు నిద్రపోవుచున్నానుగాని నాతో కూడ సంభావణమును చాలింపుము."""
english = "I am sleeping now — yet he cut my nose and both ears. I am sleeping now — please stop the conversation with me too."

[[sections.items]]
n = 8
telugu = """ఇప్పుడు నిద్రపోవుచున్నా వేమయ్యా! కూడ సంభావణమును చాలింపుము. ఇప్పుడు నిద్రపోవుచున్నా వేమయ్యా! భోజనమునకు వేళ అయినది; లెమ్ము లెమ్ము."""
english = "Why are you sleeping now, sir! Stop the conversation too. Why are you sleeping now, sir! It is time for the meal; get up, get up."

[[sections.items]]
n = 9
telugu = "పిల్లలు [పాఠశాలకు = పాఠశాలాం] వెళ్ళుచున్నారు."
english = "The children are going to school (pāṭhaśālām)."

[[sections.items]]
n = 10
telugu = "చూడు నీ పాఠములను నీవు చదువుకొమ్ము."
english = "See here — you study your own lessons."

[[sections.items]]
n = 11
telugu = "[నీవు చేయపసిని = త్వయాక్రియమాణం కార్యం] చాలించి యిటురమ్ము."
english = "Stop what you are doing (tvayā kriyamāṇaṃ kāryam) and come here."

[[sections.items]]
n = 12
telugu = "మొనాయనగారి కన్నేఁండ్లు? మీఁ అమ్మమ్మఁ కన్నేఁండ్లు? మా నాయనకిప్పుఁడు డెబ్బదేఁండ్లు; మా అమ్మమ్మకు అఱువదియేఁడేఁండ్లు."
english = "How old is your father? How old is your maternal grandmother? My father is seventy now; my maternal grandmother is sixty-seven."

[[sections.items]]
n = 13
telugu = "చూడు బావియొద్ద మా అమ్మమ్మ స్నానము చేయుచున్నది; మొరు కొంచెముసేపు ఆగుఁడు."
english = "Look — our maternal grandmother is bathing at the well; please wait a little while."
