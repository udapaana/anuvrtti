# --- passage ---

[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "భోజిష్యాఽ! రాత్రిఽ ప్రభాతి."
english = "Hey sleepyhead! The night is dawning."

[[sections.items]]
n = 2
sanskrit_telugu = "శీఘ్రు ముత్తిష్ఠత."
english = "Rise quickly."

[[sections.items]]
n = 3
sanskrit_telugu = "ఇతోపి నిద్రాధ కిం ప్రబోధత."
english = "Even more than this, why don't you wake up from sleep?"

[[sections.items]]
n = 4
sanskrit_telugu = "అద్య అనంత చతుర్థి ఖలు శ్యామకందం కారవేళ్లాన్ పటోళిశలాటూన్ క్రీత్వా ఆనయత."
english = "Today is Ananta Caturthi, isn't it — buy and bring yam, bitter gourds, and unripe snake gourds."

[[sections.items]]
n = 5
sanskrit_telugu = "బాంధవాన్ సర్వాన్ భోజనార్థం ఆహ్వాయత."
english = "Invite all the relatives for the meal."

[[sections.items]]
n = 6
sanskrit_telugu = "సర్వేపి వయం మిళిత్వా అస్మద్గృహే ఏవ వ్రతం కరవామ."
english = "Let us all gather together and perform the vow right here in our home."

[[sections.items]]
n = 7
sanskrit_telugu = "కుంభాండఽ అస్తిచేత్ ఖండయిత్వా చోష్యం కురు ఇతి యుష్మద్దూతరం వదత."
english = "If there is a pumpkin, tell your wife: cut it up and make a dish for sucking."

[[sections.items]]
n = 8
sanskrit_telugu = "అస్మిన్ దినే అస్మాభిఽ సర్వేప్పి అభ్యంజనస్నానం కర్తవ్యం."
english = "On this day all of us must take an oil-bath."

[[sections.items]]
n = 9
sanskrit_telugu = "దిశాఽసరాఽఽపి ధవళాయంతే."
english = "Even the directions are turning white (dawning)."

[[sections.items]]
n = 10
sanskrit_telugu = "సర్వేఽఖగాఽ ఉత్థాయ ఆకాశే డయంతే."
english = "All the birds have risen and are flying in the sky."

[[sections.items]]
n = 11
sanskrit_telugu = "పశ్యత పశ్యత."
english = "Look, look!"

[[sections.items]]
n = 12
sanskrit_telugu = "రామాచార్యఽ తుందిలత్వాత్ శీఘ్రం ఉత్థాయ చలితుం న సమర్థఽ."
english = "Rāmācārya, because of his pot-belly, is unable to rise quickly and move."

[[sections.items]]
n = 13
sanskrit_telugu = "సూర్యఽ శ్నైఽ శ్నైఽ ప్రకాశతే వృథా కిమర్థం కలహాయధ్వే [మిథఽ = ఒకరితో నొకరు?]"
english = "The sun is slowly brightening — why do you quarrel with each other in vain?"

[[sections.items]]
n = 14
sanskrit_telugu = "[భ్రమరాఽ = తుమ్మెదలు. మకరందం = పూదేనెను] పీత్వా గుంజంతి మనోహారం."
english = "The bees, having drunk nectar, hum in a charming manner."

[[sections.items]]
n = 15
sanskrit_telugu = "అద్యవ్రతదినత్వాత్ త్రిణ్యాకం (నోపయుజ్యతే = పనికిరాదు) ఫేనిలశలాటువఽ = కుంకుడు కాయలు) గృహే నసంతికిల క్రీణీత."
english = "Since today is a vow day, soap nuts (unripe soapberry fruits) are of no use; there are none at home, so buy some."

[[sections.items]]
n = 16
sanskrit_telugu = "మహిషీక్షీరం విక్రేతుం ఆగచ్చత్ క్రీణీయాం వా?"
english = "Someone has come to sell buffalo milk — shall I buy it?"

[[sections.items]]
n = 17
sanskrit_telugu = "(చిక్కణం= చిక్కనిదిగా) అస్తిచేత్ క్రీణీహి."
english = "If it is thick and rich, buy it."

[[sections.items]]
n = 18
sanskrit_telugu = "అరే రామస్య ముఖం దినాత్ ధవళాయతే కో రోగఽ తస్యాలగ ద్వా కేన జ్ఞాయతే."
english = "Hey, Rāma's face grows pale day by day — what disease has afflicted him? How is one to know?"

[[sections.items]]
n = 19
sanskrit_telugu = "మామ పాదే పామాసద్భావాత్ పాదఽ సమ్యక్ ఉదశ్వయత్."
english = "Because of the presence of a skin rash on my foot, the foot swelled up completely."

[[sections.items]]
n = 20
sanskrit_telugu = "శ్వఽ నక్తం వా గోమయేన చికిత్సా కర్తవ్యా."
english = "Treatment with cow-dung should be done tonight or tomorrow night."

[[sections.items]]
n = 21
sanskrit_telugu = "నోచేత్, అవయవాత్ అవయవం(ప్రసర్పతి = ప్రాకును.)"
english = "Otherwise it will creep from limb to limb."

[[sections.items]]
n = 22
sanskrit_telugu = "వయం సర్వేపి అద్య సాయంకాళే తర్కశాస్తే పూర్వపక్షసిద్ధాంతాన్ కరవామ."
english = "Today in the evening, all of us together will do the pūrvapakṣa and siddhānta discussion in logic."

# --- passage_translation ---

[[sections]]
type = "passage_translation"
language = "telugu"

[[sections.items]]
n = 1
telugu = "నిన్నరాత్రి యెందుకో మన (వీధిలో = వీథ్యాం) కుక్కలు మొఱిగినవి."
english = "For some reason last night the dogs in our street (vīthyāṃ) were barking."

[[sections.items]]
n = 2
telugu = "బలిద్ధాచార్యులగారింటిలో దొంగలుపడి ఆయన యొక్కఁ దర్పాసనమును తిరుచూర్ణపు పెళ్ళెను ఎత్తుకొనిపోయినారఁటు."
english = "It seems thieves broke into Balidhācārya's house and took away his seat cushion and the plate with holy powder."

[[sections.items]]
n = 3
telugu = "మీఁ యెడమ కాలు మిగుల లావుగ నున్నఁ దేమండి తాతాచార్యులుగారూ?"
english = "Tātācārya sir, your left leg is very swollen, isn't it!"

[[sections.items]]
n = 4
telugu = "[నా యెడమ కాలు మాత్రమే కాదు = న కేవలం మమవామపాదఽ ఏవ] కాని దేహమంతయు నటులేయున్నది."
english = "Not only my left leg (na kevalaṃ mama vāmapādaḥ eva) — the whole body is like that."

[[sections.items]]
n = 5
telugu = "మొపొట్టయందు లావుకలదని (వేతే = ప్రృభకీ) [చెప్పనకఁ్కరలేదు = వక్తుం నావసరఽ] ఇదివఱకే నాకుఁ దెలియను."
english = "There is no need to tell me (vaktuṃ nāvaśaraḥ) that your belly is fat — I already knew that."

[[sections.items]]
n = 6
telugu = "నేతిబీరకాయను మేము తినము అందువలనే మొరు స్థూలకాయులుగఁ గనఁబడుచున్నారు."
english = "We do not eat smooth gourd — that is why you appear to be of stout build."

[[sections.items]]
n = 7
telugu = "ఆ గుఱ్ఱము అందువలనే మొరు స్థూలకాయులుగఁ గనఁబడుచున్నారు."
english = "That horse — because of that you appear to be of stout build."

[[sections.items]]
n = 8
telugu = "ఆ గుఱ్ఱము తెవరివి సకిలించుచున్నవి?"
english = "Whose horses are those that are neighing?"

[[sections.items]]
n = 9
telugu = "ఎద్దులు ఆవులు నెమరు వేయను గాని గుఱ్ఱములు నెమరవేయనా?"
english = "Bullocks and cows chew the cud — but do horses also chew the cud?"

[[sections.items]]
n = 10
telugu = "(అన్నియావులకంటె = సర్వ బహళాపేక్షయా) నల్లావు శ్రేష్ఠమయినది."
english = "Among all cows (sarva bahalāpekṣayā), the brown/black cow is the best."

[[sections.items]]
n = 11
telugu = "ఈనాఁడొక మొనేఁడు పెసరపప్పు ఏను నీటిలో పోయుడు."
english = "Today pour a handful of mung dal into water."

[[sections.items]]
n = 12
telugu = "శ్రేష్ఠమయినది."
english = "It is the best."

[[sections.items]]
n = 13
telugu = "ఈనాఁడొక మొనేఁడు పెసరపప్పు ఏను నీటిలో పోయుడు."
english = "Today pour a handful of mung dal into water."

[[sections.items]]
n = 14
telugu = "నేఁడు శ్రీరామనవమి కావున పానకమును కూడ చేయించుము."
english = "Since today is Śrī Rāma Navamī, have the sweet drink (panakam) also prepared."

[[sections.items]]
n = 15
telugu = "బెల్లము తేనియెడల అంగడినుండి తెప్పింపుఁడు ఇప్వేళ బజారునఁ దంతటను తలుపులను మూసినారు."
english = "If there is no jaggery, have it brought from the shop — just now they have closed the doors everywhere in the market."

[[sections.items]]
n = 16
telugu = "ఎందుకు మూసినారో మొకుఁ దెలియునా?"
english = "Do you know why they have closed?"

[[sections.items]]
n = 17
telugu = "నేడమావాస్య కాదా?"
english = "Is today not the new moon day?"
