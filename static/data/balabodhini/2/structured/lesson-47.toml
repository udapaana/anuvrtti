[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "హాంజే రుటితి స్థలం శోధయ."
english = "Yes, quickly clean the place."

[[sections.items]]
n = 2
sanskrit_telugu = "అహాం స్నానం కృత్వా ఇదానీ మేవ ఆగమిష్యామి యూయం సర్వే శీఘ్రం భోజనం కురుత."
english = "I, having bathed, will come right now; all of you quickly eat your meals."

[[sections.items]]
n = 3
sanskrit_telugu = "అద్య నక్తం అస్మద్గృహే హరికథా భవిష్యతి."
english = "Tonight there will be a Hari story recitation in our house."

[[sections.items]]
n = 4
sanskrit_telugu = "ఏతద్వృత్తాంతం రామాయ కః అకథయత్?"
english = "Who narrated this matter to Rāma?"

[[sections.items]]
n = 5
sanskrit_telugu = "సః ఏవ హరిదాససమీపం ప్రాత రత్వా సర్వం సమాచారం జ్ఞాత్వా ఆగచ్ఛత్."
english = "He himself, having gone to the Hari devotee in the morning and having learned all the news, came back."

[[sections.items]]
n = 6
sanskrit_telugu = "దాసస్య కథాకథనే అతీవ సామర్థ్యం అస్తిభో ః కథాకథనానంతరం సః క్షీరం పాస్యతి."
english = "The devotee has great ability in story narration; after the narration he will drink milk."

[[sections.items]]
n = 7
sanskrit_telugu = "అస్తివా నవా క్షీరం గృహే?"
english = "Is there milk in the house or not?"

[[sections.items]]
n = 8
sanskrit_telugu = "నోచేత్, అస్మచ్చిష్యం క్షీరమానేతుం ఆజ్ఞాపయ."
english = "If not, command our student to bring milk."

[[sections.items]]
n = 9
sanskrit_telugu = "బహుజనాః ఆగమిష్యంతి."
english = "Many people will come."

[[sections.items]]
n = 10
sanskrit_telugu = "అస్మాకం గృహే స్థలం నాలం కింవా."
english = "Is there not enough space in our house?"

[[sections.items]]
n = 11
sanskrit_telugu = "పార్శ్వే వాసుదేవాచార్యస్య గృహం అస్తిఖలు."
english = "Vāsudevācārya's house is nearby, isn't it?"

[[sections.items]]
n = 12
sanskrit_telugu = "కుడ్యే ద్వారం కృత్వా తత్రాపి కటాన్ ప్రసార్య జనా నుపవేశయిష్యామః."
english = "Having made a door in the wall, we shall spread mats there too and seat the people."

[[sections.items]]
n = 13
sanskrit_telugu = "యథా కథంవా భవతు."
english = "Let it be somehow or other."

[[sections.items]]
n = 14
sanskrit_telugu = "హరికథా కింవా భవిష్యత్యేవ."
english = "The Hari story will certainly take place."

[[sections.items]]
n = 15
sanskrit_telugu = """అరే సుబ్రహ్మణ్యో! నృపసమీపం గత్వా-"భోనృప! అస్మదుపాధ్యాయగృహే అద్యనక్తం హరికథా భవిష్యతి; యూయమపి ఆగచ్చత" ఇతి విజ్ఞాప్య ఆగమిష్యసి కిం?"""
english = "Hey Subrahmaṇya! Will you go to the king and having petitioned — 'O king! Tonight there will be a Hari story in our teacher's house; you all also come' — and then return?"

[[sections.items]]
n = 16
sanskrit_telugu = "నృపగృహాద్వారే ఏకః శ్వనకః అస్తి; సః మదుపరి పతే త్కింవా."
english = "There is a dog at the door of the king's house; might it not jump upon me?"

[[sections.items]]
n = 17
sanskrit_telugu = "అహాం న గమిష్యామి."
english = "I shall not go."

[[sections.items]]
n = 18
sanskrit_telugu = "మాస్తు మాస్తు."
english = "No, no."

[[sections.items]]
n = 19
sanskrit_telugu = "సీతారామః ప్రాతరేవ నృప సమీపం గత్వా సర్వ వృత్తాంతం వ్యజ్ఞాపయత్."
english = "Sītārāma, having gone to the king early in the morning, petitioned him regarding all matters."

[[sections.items]]
n = 20
sanskrit_telugu = "అస్మద్దా మం పరితః గోదా అస్తి."
english = "Around our house there is a river (Godāvarī)."

[[sections.items]]
n = 21
sanskrit_telugu = "తతః అస్మాకం స్నానార్థం అనుకూల్య మస్తి."
english = "Therefore there is a convenient facility for our bathing."

[[sections.items]]
n = 22
sanskrit_telugu = "సత్యం."
english = "True."

[[sections]]
type = "passage_translation"
language = "telugu"

[[sections.items]]
n = 1
telugu = "మొరివేళ సాయంకాలమువఱకు మాయింట్లో నుండవలయును."
english = "You must stay at our house until this evening."

[[sections.items]]
n = 2
telugu = "రేపు ప్రొద్దున మొదలుకొని దేవుని పెండ్లి కాఁగలదు."
english = "Starting tomorrow morning, the deity's festival procession will take place."

[[sections.items]]
n = 3
telugu = "నీవెందుకు భయపడుచున్నావు?"
english = "Why are you afraid?"

[[sections.items]]
n = 4
telugu = "మా అక్కయ్యను మేనమామ యింటికిం దీసికొని వెళ్ళుటకు ఎవరును లేరు."
english = "There is no one to take our elder sister to the maternal uncle's house."

[[sections.items]]
n = 5
telugu = "ఎట్లగునో అని భయపడుచున్నాను."
english = "I am worried about what will happen."

[[sections.items]]
n = 6
telugu = "లేకపోయిన నేమి నీవే తీసికొని వెళ్ళుము."
english = "If there's no one else, never mind — you yourself take her."

[[sections.items]]
n = 7
telugu = "పిల్లలందఱు నెక్కఁడ కూర్చుండి భోజనమును చేయుచున్నారు?"
english = "Where are all the children sitting and eating their meal?"

[[sections.items]]
n = 8
telugu = "ఇంట్లో బియ్యము లేవుగాని అంగడికి వెళ్ళి తీసికొనిరమ్ము."
english = "There is no rice at home, you know — go to the shop and bring some."

[[sections.items]]
n = 9
telugu = "జీలకఱ్ఱకూడ లేఁదట తెత్తునా!"
english = "They say there is no cumin either — shall I bring some too?"

[[sections.items]]
n = 10
telugu = "నన్నుఁ డిగెదవేమి?"
english = "Why are you asking me?"

[[sections.items]]
n = 11
telugu = "మీఁ అమ్మఁ తమ్మునిన యెడల తెమ్ము."
english = "If your mother is there (with the younger brother), bring her."

[[sections.items]]
n = 12
telugu = "మా అమ్మఁ యిక్కఁడ లేదు."
english = "Our mother is not here."

[[sections.items]]
n = 13
telugu = "శేషాచార్యులగారి యింట్లో కూర్చున్నది."
english = "She is sitting in Śeṣācāryulu's house."

[[sections.items]]
n = 14
telugu = "అక్కఁడ నేమి చేయుచున్నది?"
english = "What is she doing there?"

[[sections.items]]
n = 15
telugu = "అక్కఁడ అప్పములను చేయుచున్నది."
english = "She is making rice cakes (appam) there."

[[sections.items]]
n = 16
telugu = "మన యింట్లో మినుములున్నవా యేమి?"
english = "Is there black gram in our house?"

[[sections.items]]
n = 17
telugu = "నిన్నఁ నేను తెచ్చితినిగా."
english = "I brought some yesterday, didn't I?"

[[sections.items]]
n = 18
telugu = "అంగడిలో తెల్లము నెట్టిచ్చుచున్నారు?"
english = "Are they giving fair prices at the shop?"

[[sections.items]]
n = 19
telugu = "ఏమో నేనడుగలేదు."
english = "I don't know — I didn't ask."

[[sections.items]]
n = 20
telugu = "రేపు కనుఁగొనెదను [విచారింతును.]"
english = "I will find out [inquire] tomorrow."

[[sections.items]]
n = 21
telugu = "మొన్నఁ సీఁదురుగా నెవరో మీఁ యింటిలో కూర్చున్నారే వారెవరు?"
english = "Who were those people sitting in a row in your house the day before yesterday?"

[[sections.items]]
n = 22
telugu = "నా భార్యయొక్కఁ మేనమామలు."
english = "My wife's maternal uncles."

[[sections.items]]
n = 23
telugu = "వారిదే యూరు?అక్కఁడే తెనాలి."
english = "Which is their village? That same place — Tenāli."

[[sections.items]]
n = 24
telugu = "తెనాలిలో పాఠశాల సాగుచున్నదా?"
english = "Is the school running in Tenāli?"

[[sections.items]]
n = 25
telugu = "చక్కగనే సాగుచున్నది."
english = "It is running very nicely."

[[sections.items]]
n = 26
telugu = "పాఠశాలలో నెందఱు పిల్లలున్నారు?"
english = "How many children are there in the school?"

[[sections.items]]
n = 27
telugu = "చాలమంది పిల్లలున్నారు."
english = "There are many children."

[[sections.items]]
n = 28
telugu = "అందఱును బ్రాహ్మణులేనా."
english = "Are they all brahmins?"

[[sections.items]]
n = 29
telugu = "ఇతరులుకూడ నున్నారా?"
english = "Are there others too?"

[[sections.items]]
n = 30
telugu = "ఇతరులు చాలమంది లేరు."
english = "There are not many others."

[[sections.items]]
n = 31
telugu = "అలాగా!"
english = "Is that so!"
