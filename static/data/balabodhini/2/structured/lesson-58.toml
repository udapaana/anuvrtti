# --- Passage ---

[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "మామ అభిప్రాయః ఏషః."
english = "This is my opinion."

[[sections.items]]
n = 2
sanskrit_telugu = "అనంతరం త్వదిచ్చానుసారేణ కురు."
english = "Afterwards do as you wish."

[[sections.items]]
n = 3
sanskrit_telugu = "మామ అంగవస్త్రం కిమర్థం ఆర్దం అభవత్? జలే అపతత్కింవా."
english = "Why did my upper garment become wet? Did it fall into water?"

[[sections.items]]
n = 4
sanskrit_telugu = "త్వమపి దుష్టేనసాకం దోష్టిం కురుఽఠ చేత్ తవాధిక్యం కిమస్తి?"
english = "If you also associate with the wicked, what greatness do you have?"

[[sections.items]]
n = 5
sanskrit_telugu = "తత్ర ఏకం శుష్కం పర్ణం అస్తిచేత్ ఇత్థ మానయ."
english = "If there is a dry leaf there, bring it here."

[[sections.items]]
n = 6
sanskrit_telugu = "రామః కుత్రాస్తివా అజానాః కిం?"
english = "Do you know where Rāma is?"

[[sections.items]]
n = 7
sanskrit_telugu = "దినత్రయాత్ప్రభృతి రామః అద్యాపి నాదృశ్యత్తేవ."
english = "From three days ago, Rāma has not been seen even today."

[[sections.items]]
n = 8
sanskrit_telugu = "కుత్రాగచ్చదాపి కః జానాతి?"
english = "Who knows where he went?"

[[sections.items]]
n = 9
sanskrit_telugu = "సమస్తాయం సర్వేపి సర్వే ఏవ."
english = "On the whole, everyone is just the same (everyone is like that)."

[[sections.items]]
n = 10
sanskrit_telugu = "మమాగ్రజః స్వతః ఏవ గత్వా తత్ర తత్ర దృష్ట్వాపి ఆగచ్చత్."
english = "My elder brother went by himself, looked here and there, and came back."

[[sections.items]]
n = 11
sanskrit_telugu = "కుత్రాపి నాదృశ్యత కిల."
english = "He was not seen anywhere, they say."

[[sections.items]]
n = 12
sanskrit_telugu = "ఏతత్ సమస్తం అపి ప్రయాసార్థం ఆగచ్చత్."
english = "All this came to nothing but trouble."

[[sections.items]]
n = 13
sanskrit_telugu = "అస్మాకం బహులాయత్రకుత్రాపి దృశ్యతే చేత్ బద్ధ్వాపి తస్యై తృణం యచ్చ."
english = "If our cow is seen wherever it may be, even after tying her up, give her grass."

[[sections.items]]
n = 14
sanskrit_telugu = "పూర్వేద్యుః సాయం ఏకః శూద్రః యుష్మద్వహళాం స్వగృహే అబధ్నాత్."
english = "The day before yesterday in the evening, a śūdra tied your buffalo cow in his own house."

[[sections.items]]
n = 15
sanskrit_telugu = "అహా మపశ్యం."
english = "I saw (it)."

[[sections.items]]
n = 16
sanskrit_telugu = "ఏషః మాధవః స్వస్య సౌందర్యం సర్వదా వర్ణయతి."
english = "This Mādhava always describes his own beauty."

[[sections.items]]
n = 17
sanskrit_telugu = "తాతాచార్య! తవ పుత్రః అతీవ దుష్టః."
english = "Tātācārya! Your son is extremely wicked."

[[sections.items]]
n = 18
sanskrit_telugu = "కేనాపి దండయితుం శక్యః సభవతి."
english = "He might be possible to punish by someone."

[[sections.items]]
n = 19
sanskrit_telugu = "తం అనేష్యసి చేత్ త్వం అధిక నిపుణః ఏవ."
english = "If you bring him, then you are indeed very skilled."

[[sections.items]]
n = 20
sanskrit_telugu = "తవ చాతుర్యం అస్తిచే దస్తు; మాం కిమర్థం పరిహాససి?"
english = "If you have cleverness, so be it; why do you mock me?"

[[sections.items]]
n = 21
sanskrit_telugu = "మామ నాథః గ్రామాంతరం ఆగచ్చత్."
english = "My lord (husband) went to another village."

[[sections.items]]
n = 22
sanskrit_telugu = "త్వం(పునఃపునః = వారం వారం = ముహుర్ముహుళః = పదేపదే) అస్మద్గృహాం మాగచ్చ."
english = "Do not come to our house again and again (repeatedly)."

[[sections.items]]
n = 23
sanskrit_telugu = "తవ స్వభావః న సమీచీనః."
english = "Your nature is not good."
