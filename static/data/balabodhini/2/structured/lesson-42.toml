# ── passage ──

[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "మల్లికాలతాయాం పుష్పాణి సమ్యక్ సంతి."
english = "There are flowers in good number on the jasmine creeper."

[[sections.items]]
n = 2
sanskrit_telugu = "తత్రస్థితః బాలకః కః ? రామానుజాచార్యస్య పుత్రఃఖలు."
english = "Who is the boy standing there? He is indeed the son of Rāmānujācārya."

[[sections.items]]
n = 3
sanskrit_telugu = """గోదాసమీపఁగ గత్వా మామ వస్తాని సమ్యక్\
 ధావ."""
english = "Go near the Godāvarī and wash my clothes properly."

[[sections.items]]
n = 4
sanskrit_telugu = "కృష్ణాజలేన గంగాలయం పూరయ కటుం ప్రసారయాముః."
english = "Fill the large vessel with Kṛṣṇā water; let us spread out the mat."

[[sections.items]]
n = 5
sanskrit_telugu = "మామ ఉపాధ్యాయః ఆగత్య ద్వారాత్ బహిః ఈషత్కాలం స్థిత్వా పునరపి కుత్రవా ఆగచ్ఛత్."
english = "My teacher came, stood outside the door for a little while, and then came back from somewhere again."

[[sections.items]]
n = 6
sanskrit_telugu = "ఏతం బాలకం సంస్కృతవిద్యాం శిక్షయాముః ఖనిత్రేణ వనే రామః ఖనతి."
english = "Let us teach this boy Sanskrit learning. Rāma is digging in the forest with a spade."

[[sections.items]]
n = 7
sanskrit_telugu = "హే అంబ! చేలం అత్రాస్తి ధర."
english = "O mother! The garment is here; wear it."

[[sections.items]]
n = 8
sanskrit_telugu = "తే బాలకాః యుష్మత్సుతం వృక్షం అరోపయంతి; పశ్యత సః పతేత్ చేత్ కథం ?"
english = "Those boys are making your son climb the tree; look — what if he were to fall?"

[[sections.items]]
n = 9
sanskrit_telugu = "అరే విధవ! త్వం కిమర్థం వృక్షం మారోహాసిరే."
english = "Hey widow! Why are you climbing the tree?"

[[sections.items]]
n = 10
sanskrit_telugu = "మామ అంబా అనుజం గర్భగృహే మంచోపరి శాయయతి."
english = "My mother is putting my younger brother to sleep on the cot in the inner room."

[[sections.items]]
n = 11
sanskrit_telugu = "సా అంగనా క్షీరపాత్రం అంతర్గృహే స్థాపయిత్వా స్వగృహ మగచ్ఛత్."
english = "That woman placed the milk vessel inside the house and went to her own home."

[[sections.items]]
n = 12
sanskrit_telugu = "హాంజే బాలికే! మామ చోలం సమ్యక్ నిష్పీడ్య శోషయ."
english = "Hey girl! Wring out my blouse properly and dry it."

[[sections.items]]
n = 13
sanskrit_telugu = "అహాం గోదాయాం స్నానం కృత్వా, తత్ర సంధ్యావందనం కృత్వా."
english = "I, having bathed in the Godāvarī and performed the twilight prayer there,"

[[sections.items]]
n = 14
sanskrit_telugu = "అనంతరం గృహం ప్రతి ఆగమిష్యామి."
english = "will afterwards come back home."

[[sections.items]]
n = 15
sanskrit_telugu = "సః బాలకః ఇదానీం సమ్యక్ నపఠతి."
english = "That boy is not studying properly now."

[[sections.items]]
n = 16
sanskrit_telugu = "అంతతః ఖరః భవిష్యతి కింవా."
english = "In the end, will he not turn out to be a fool?"

[[sections.items]]
n = 17
sanskrit_telugu = "పాకః అసీత్ చేత్ పర్ణాని ప్రసార్య బహిస్స్థితాన్ బ్రాహ్మణాన్ భోజనార్థ మాహ్వాయ హే జనక! బ్రాహ్మణా స్సర్వే స్నానం కృత్వా స్వవస్తాని శోషయంతి."
english = "If the cooking is done, spread the leaves and invite the brāhmaṇas standing outside for the meal. O father! All the brāhmaṇas, having bathed, are drying their garments."

[[sections.items]]
n = 18
sanskrit_telugu = "అవరణే పర్ణాని ప్రసారయేయం వా ?"
english = "Shall I spread the leaves in the courtyard?"

[[sections.items]]
n = 19
sanskrit_telugu = "త్వం మా ప్రసారయ."
english = "You do not spread them."

[[sections.items]]
n = 20
sanskrit_telugu = "తవాంబా ప్రసారయిష్యతి తర్హి అహాం కిం కురాం?"
english = "Your mother will spread them; so what shall I do?"

[[sections.items]]
n = 21
sanskrit_telugu = "త్వం తూష్ణీం భవ"
english = "You be silent."

# ── passage_translation ──

[[sections]]
type = "passage_translation"
language = "telugu"

[[sections.items]]
n = 1
telugu = "మా పిల్లవాఁడెక్కఁడ నున్నాఁడో నేఁటికిని తెలియదురేపు తెలియగలదు."
english = "We still do not know where our boy is today; tomorrow it will become known."

[[sections.items]]
n = 2
telugu = "ఆ యూరినుండి రేపు మా తమ్ముఁడు రాగలఁడు."
english = "Our younger brother will be able to come from that village tomorrow."

[[sections.items]]
n = 3
telugu = "నవ్వువద్దురా నీ యుపాధ్యాయుఁడు నిన్నుఁ కొట్టును."
english = "Don't laugh, man — your teacher will beat you."

[[sections.items]]
n = 4
telugu = "ఆ ఆఁబోతు నిన్నఁ నాలుగుమాఱులు మాయింటికి వచ్చినది; చివరకెక్కఁడి కెళ్ళినదో నాకు తెలియదు."
english = "That bull came to our house four times yesterday; where it finally went I do not know."

[[sections.items]]
n = 5
telugu = "నాకు తెలియును."
english = "I know."

[[sections.items]]
n = 6
telugu = "అది గడమంచెమొంద నున్నఁ దోసకాయలను క్రిందపడవేసి పరుగెత్తినది."
english = "It knocked down the cucumbers that were on the bamboo shelf and ran off."

[[sections.items]]
n = 7
telugu = "నేతిని కరఁగించుము."
english = "Melt the ghee."

[[sections.items]]
n = 8
telugu = "మమ్మును మోసగించెదవేమి ?"
english = "Are you trying to deceive us?"

[[sections.items]]
n = 9
telugu = "వంకాయలను సరిగా చూచుము."
english = "Look at the brinjals carefully."

[[sections.items]]
n = 10
telugu = "మేము నిన్నఁ శ్రీశైలమును ఎక్కినాము."
english = "Yesterday we climbed Śrīśaila."

[[sections.items]]
n = 11
telugu = "కొంద మిక్కిలి ఎత్తుగా నున్నది కాఁ కొండమొంద చాల చెట్లు లేవు."
english = "The hill is very high, you know — there are not many trees on the hill."

[[sections.items]]
n = 12
telugu = "(నీవు వ్రాసిన తర్వాత) = (త్వల్లేఖనానంతరం) మాయింటి కొకమారు రాఁగలవా!"
english = "After you have written (tvallekhanānantaraṃ) — can you come to our house once?"

[[sections.items]]
n = 13
telugu = "మాయింటిని చుట్టుకొని శూలేతీగ లున్నవి."
english = "Thorn creepers are growing all around our house."

[[sections.items]]
n = 14
telugu = "ఉపాధ్యాయుఁడనఁగా ఎవఁడు?"
english = "Who is this person called 'teacher'?"

[[sections.items]]
n = 15
telugu = """ఆ పిల్లలు మంచినీళ్ళి నంతయు\
 చెఱుచుచున్నారు."""
english = "Those children are spoiling all the drinking water."

[[sections.items]]
n = 16
telugu = "మీఁ చెల్లెలి దగ్గఱ పాలుకేది."
english = "Your younger sister has no milk."

[[sections.items]]
n = 17
telugu = "అందువలన చంటిపిల్లవాఁడు చెడిపోవుచున్నాఁడు."
english = "Because of that the infant is deteriorating."

[[sections.items]]
n = 18
telugu = "వెన్నఁ కరఁగినదో లేదో చూపించుము."
english = "Show me whether the butter has melted or not."

[[sections.items]]
n = 19
telugu = "బెండ చెట్లుదగ్గర నున్నఁ మనుమ్యఁ డెవఁడు?"
english = "Who is that man standing near the okra plants?"

[[sections.items]]
n = 20
telugu = "వాఁడు దొంగవలె నున్నాఁడయ్యా నాకెందుకు నేనిక్కఁడ నుండను."
english = "He looks like a thief, sir — why should I stay here? I will not stay here."

[[sections.items]]
n = 21
telugu = "చెఱువుయొక్కఁ ఓడ్డుమొంద ఒక ఆఁబోతు అడ్డముగా పరుగెత్తుచున్నది."
english = "A bull is running across on the bank of the tank."

[[sections.items]]
n = 22
telugu = "దానిని చూచి మా అక్కఁ భయపడినది."
english = "Seeing it, our elder sister was frightened."

[[sections.items]]
n = 23
telugu = "నీవు వెళ్ళి దానిని కొంచెము కొట్టుఁగలవా !"
english = "Can you go and give it a little beating?"
