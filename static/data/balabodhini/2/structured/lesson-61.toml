[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "అరే బాలక! త్వం అద్య ప్రాతః ప్రభృతి మంచాత్ ఉత్థాయ దంత ధావనమపి నాకరోఃఖలు; త్వాం కిం కరవాణి?"
english = "Hey boy! You have not even brushed your teeth after getting out of bed since this morning; what should I do with you?"

[[sections.items]]
n = 2
sanskrit_telugu = "గచ్చ (శీఘ్రం = రుటితి) (తటాకసమీపం = తటాకాంతికం) దంత ధావనం కురు ప్రథమతః."
english = "Go quickly to the pond nearby and brush your teeth first."

[[sections.items]]
n = 3
sanskrit_telugu = "దేవ పూజార్థం పుష్పాణి తులసీ దళాని చ లూనీహి."
english = "Pluck flowers and tulasī leaves for the worship of God."

[[sections.items]]
n = 4
sanskrit_telugu = "ఏతస్మిన్నినే శ్రీహాయగ్రీవోత్సవః అస్మాభిః కర్తవ్యః."
english = "On this day the festival of Śrī Hayagrīva must be performed by us."

[[sections.items]]
n = 5
sanskrit_telugu = "హేతాత! పుష్పాణి (క్వ = కుత్ర) సంతి?"
english = "Hey father! Where are the flowers?"

[[sections.items]]
n = 6
sanskrit_telugu = "కాని పుష్పాణి మయా లవితవ్యాని?"
english = "Which flowers should be plucked by me?"

[[sections.items]]
n = 7
sanskrit_telugu = "త్వం కథయసిచేత్ అహంతద్దైవ కరిష్యామి."
english = "If you tell me, I will do it right away."

[[sections.items]]
n = 8
sanskrit_telugu = "రేరామ! తవ అంబాం ప్రచ్చ; సా ఆజ్ఞాపయేత్."
english = "Hey Rāma! Ask your mother; she would give instructions."

[[sections.items]]
n = 9
sanskrit_telugu = "తద్దైవ ప్రక్ష్యామి; అంబా కా'గచ్చత్?"
english = "I will ask right away; where has mother gone?"

[[sections.items]]
n = 10
sanskrit_telugu = "అంబాప్రాత రేవ గంగాయాం స్నాత్వా నిర్మలవస్త్రం ధృత్వా తులసీ బృందావనసమీపే ఉపవిశ్య లక్ష్మీపూజాఁం కరోతి."
english = "Mother bathed in the Gaṅgā early in the morning, put on clean clothes, sat near the tulasī garden, and is performing the worship of Lakṣmī."

[[sections.items]]
n = 11
sanskrit_telugu = "తాం ప్రష్ట్వా శీఘ్రం త్వమపి పుష్పాణి లవిత్వా ఆనయ."
english = "After asking her, you too quickly pluck the flowers and bring them."

[[sections.items]]
n = 12
sanskrit_telugu = "హేఅంబ! కాని మయా లలితవ్యాని వద?"
english = "O mother! Tell me, which ought to be plucked by me?"

[[sections.items]]
n = 13
sanskrit_telugu = "హేపుత్ర! నరసింహాలయే మల్లికాపుష్పాణి."
english = "O son! There are jasmine flowers in the Narasiṃha temple."

[[sections.items]]
n = 14
sanskrit_telugu = "జాతీపుష్పాణిచ అనేకాని సంతి."
english = "And there are many jātī flowers as well."

[[sections.items]]
n = 15
sanskrit_telugu = "అర్చకాన్ ప్రష్ట్వా తాని పుష్పాణి సర్వాణ్యానయ."
english = "Ask the priests and bring all those flowers."

[[sections.items]]
n = 16
sanskrit_telugu = "అర్చకాః న సంతి చేత్కింకర్తవ్యంబ?"
english = "If the priests are not there, what should be done, mother?"

[[sections.items]]
n = 17
sanskrit_telugu = "తూష్టీ మేవాగచ్చ."
english = "Come back silently."

[[sections.items]]
n = 18
sanskrit_telugu = "తులసీదళాని అస్మదావరణే స్థితాని లూనీహ."
english = "Pluck the tulasī leaves that are in our yard."

[[sections.items]]
n = 19
sanskrit_telugu = "ప్రథమతః దేవాలయం గత్వా మయా అర్చకాః ద్రష్టవ్యాః."
english = "First I must go to the temple and see the priests."

[[sections.items]]
n = 20
sanskrit_telugu = "తత్రార్చకాః సంతిచేత్."
english = "If the priests are there,"

[[sections.items]]
n = 21
sanskrit_telugu = "తాన్ ప్రష్ట్వా పుష్పా ణ్యానేష్యామి; నోచేత్తూష్టీమే వాగమిష్యామి."
english = "I will ask them and bring the flowers; otherwise I will return silently."

[[sections.items]]
n = 22
sanskrit_telugu = "తద్దైవ కురు."
english = "Do it right away."

[[sections.items]]
n = 23
sanskrit_telugu = "రేరే పూజాపాత్రం గృహీత్వా గచ్చ; నోచేత్కృథం పుష్పాణి ఆనేష్యసి?"
english = "Hey, take the worship vessel and go; otherwise how will you bring the flowers?"

[[sections.items]]
n = 24
sanskrit_telugu = "తద్దైవ గచ్చేయం."
english = "I would go right away."

[[sections]]
type = "passage_translation"
language = "telugu"

[[sections.items]]
n = 1
telugu = "అమ్మా! దేవాలయములో మల్లెచెట్టుమొంద తొండలున్నవమ్మా!"
english = "Mother! There are chameleons on the jasmine plant in the temple, mother!"

[[sections.items]]
n = 2
telugu = "నాకు భయమును కలుగుచున్నది; నేను కోయఁజాలను."
english = "I am afraid; I cannot pluck (the flowers)."

[[sections.items]]
n = 3
telugu = "అన్నయ్యను పంపుము."
english = "Send elder brother."

[[sections.items]]
n = 4
telugu = "పోనిముఁగాని బజారులో బెండకాయలున్నచో కొని తెమ్ము."
english = "Never mind that — if there are okra in the market, buy and bring them."

[[sections.items]]
n = 5
telugu = "నాకు వాటి యొక్కఁ ధర తెలియదమ్మా!"
english = "I do not know their price, mother!"

[[sections.items]]
n = 6
telugu = "నాన్నఁగారితోఁ జెప్పుము."
english = "Tell father."

[[sections.items]]
n = 7
telugu = "ఛీ! దొంగకుంకా! (యొఱైన = కథంచిత) పాఱిపోవుటకు చూచుచున్నావు."
english = "Shame on you, you thief! You are somehow (= kathaṃcit) trying to run away."

[[sections.items]]
n = 8
telugu = "చూడు రేపు నిన్నేమి చేయుదునో."
english = "Just wait and see what I will do to you tomorrow."

[[sections.items]]
n = 9
telugu = "పోనీగాని అక్కఁడ కూర్చుండి రామాయణమును చదువుము."
english = "Never mind that — sit there and read the Rāmāyaṇa."

[[sections.items]]
n = 10
telugu = "అలాగే చదివెదనుగాని."
english = "I will read like that, but..."

[[sections.items]]
n = 11
telugu = "ఆ పిల్లిపిల్లను నేను పెంచుకొందును."
english = "I will rear that kitten."

[[sections.items]]
n = 12
telugu = "సరేనా."
english = "Is that alright?"

[[sections.items]]
n = 13
telugu = "ఆ పిల్లికూనతో నీకేమిపసిరా?"
english = "What business do you have with that kitten?"

[[sections.items]]
n = 14
telugu = "ఆ బాఱలిలో నూనె పోయుము; దేవునిదగ్గర దీపమును వెలిగింతును."
english = "Pour oil in that lamp-holder; I will light the lamp before the deity."

[[sections.items]]
n = 15
telugu = "నారాయణాచార్యులగారి కొడుకు పెండ్లెప్పుఁడేమి?"
english = "When is Nārāyaṇācāryulu's son's wedding?"

[[sections.items]]
n = 16
telugu = "ఓ రి వెధవా! పెండ్లి సమాచారము నీకెందుకురా; చదువు కొనుమురా."
english = "You wretch! What business is wedding news to you? Go study."

[[sections.items]]
n = 17
telugu = "అటులనే చదివెదను; నాకొక అప్పుచి నీయఁగలవా? (అపూపః = అప్పుచి)"
english = "I will read like that — but can you give me one sweet cake (apūpaḥ = appuci)?"

[[sections.items]]
n = 18
telugu = "నిన్నటి అప్పుచి నేమిచేసితివి?"
english = "What did you do with yesterday's sweet cake?"

[[sections.items]]
n = 19
telugu = "నేను తినుచుండఁగా మాముయ్యికోతి వచ్చి నన్నుఁ భయపెట్టి యెత్తుకొనిపోయినది."
english = "While I was eating, our big monkey came, frightened me, and carried it off."
