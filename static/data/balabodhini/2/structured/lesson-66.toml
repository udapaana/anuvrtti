[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "శ్వః సాయం మంగళగిరిగ్రామే రథోత్సవః భవిష్యతి."
english = "Tomorrow evening there will be a chariot festival in the village of Maṅgalagiri."

[[sections.items]]
n = 2
sanskrit_telugu = "తం ద్రష్టుం వయం సర్వే గమిష్యామః; యూయమపి ఆగమిష్యథకిం?"
english = "We will all go to see it; will you also come?"

[[sections.items]]
n = 3
sanskrit_telugu = "మయా పఠ్యమానం పుస్తకం అద్యసాయం సమాప్తం భవిష్యతి."
english = "The book being read by me will be finished this evening."

[[sections.items]]
n = 4
sanskrit_telugu = "ప్రథమ పుస్తకం ఇతః పూర్వమేవ పఠితం."
english = "The first book was already read before this."

[[sections.items]]
n = 5
sanskrit_telugu = "తథాపి అస్మదుపాధ్యాయం సప్రష్ట్వా ఆగమిష్యామి."
english = "Even so, I will come after asking our teacher."

[[sections.items]]
n = 6
sanskrit_telugu = "మామ హస్తే ఈషదపి ధనం నాస్తి."
english = "There is not even a little money in my hand."

[[sections.items]]
n = 7
sanskrit_telugu = "తతః అహాం ఘూమశకటం ఆరోఢుం న సమర్థః."
english = "Therefore I am not able to board the train."

[[sections.items]]
n = 8
sanskrit_telugu = "అరేరే ఇతః ఇతః ఆగచ్చ."
english = "Hey hey, come here, this way."

[[sections.items]]
n = 9
sanskrit_telugu = "తత్ర వృశ్చిక ఇవ దృశ్యతే."
english = "Something like a scorpion is seen there."

[[sections.items]]
n = 10
sanskrit_telugu = "దండం ఇత్థం ఆనయ; దండేన తం వృశ్చికం పీడయామి."
english = "Bring a stick this way; I will crush that scorpion with the stick."

[[sections.items]]
n = 11
sanskrit_telugu = "రేపాపిష్ఠ! కిమర్థం వృథా తం బాధసే."
english = "Hey wretch! Why do you trouble it needlessly?"

[[sections.items]]
n = 12
sanskrit_telugu = "చీదుష్ఠ! తూష్టీంభవ తూష్టీంభవ."
english = "Fie, wicked one! Be quiet, be quiet."

[[sections.items]]
n = 13
sanskrit_telugu = "వృశ్చికః సర్వేపి సర్వదా బాధితవ్యః ఏవ."
english = "A scorpion must always be tormented by everyone."

[[sections.items]]
n = 14
sanskrit_telugu = "ఏతావత్పర్యంతం బాధితః ఖలు; అలం ఇతః పరంవా [ముంచ = వదలు.]"
english = "It has been troubled enough; enough — leave it alone from now on."

[[sections.items]]
n = 15
sanskrit_telugu = "ఇదానీం త్వం వృశ్చికం అబాధథాః."
english = "Now you have troubled the scorpion."

[[sections.items]]
n = 16
sanskrit_telugu = "సః వృశ్చికః పరలోకే త్వాం బాధిష్యతే."
english = "That scorpion will trouble you in the next world."

[[sections.items]]
n = 17
sanskrit_telugu = "బాధిష్యతే చే ద్దాధతాం."
english = "If it will trouble me, let it trouble."

[[sections.items]]
n = 18
sanskrit_telugu = "ఇదానీం త్వాం అరక్షంఖలు; తత్పుణ్యం కిం భవిష్యతి?"
english = "Now I certainly protected you; what merit will come from that?"

[[sections.items]]
n = 19
sanskrit_telugu = "తేన పుణ్యేన మామ పరలోకే బాద్దైవ నభవిష్యతి."
english = "By that merit, I will certainly not be troubled in the next world."

[[sections.items]]
n = 20
sanskrit_telugu = "త్వం ఉద్యోగార్థం ప్రయత్నం కరోఽఖలు; సః ప్రయత్నః సేత్స్యతి కిం?"
english = "You are certainly making an effort for employment; will that effort succeed?"

[[sections.items]]
n = 21
sanskrit_telugu = "న సేత్స్యతిచేత్ త్వం న సాధయేఃకిం?"
english = "If it doesn't succeed on its own, won't you make it succeed?"

[[sections.items]]
n = 22
sanskrit_telugu = "(ఏతస్య = అస్య.) బాలకస్య కేశాన్ కంకతికయా ప్రసాధయ."
english = "Comb this boy's hair with a comb."

[[sections]]
type = "passage_translation"
language = "telugu"

[[sections.items]]
n = 1
telugu = "(నేనిప దుత్తరమును చదువపలె = మయా ఇదానీం ఉత్తరం పఠితవ్యం.)"
english = "(I must read the letter now = mayā idānīṃ uttaraṃ paṭhitavyam.)"

[[sections.items]]
n = 2
telugu = "ఎందుకా పిండిని అట్లు మర్దించుచున్నావు?"
english = "Why are you kneading that dough like that?"

[[sections.items]]
n = 3
telugu = "(భక్ష్యములను చేయవలె = భక్ష్యాణి కర్తవ్యాని)."
english = "(Snacks must be made = bhakṣyāṇi kartavyāni.)"

[[sections.items]]
n = 4
telugu = "మా యింటిలో నేమి? మా అమ్మాయి పెండ్లి."
english = "What is at our house? Our daughter's wedding."

[[sections.items]]
n = 5
telugu = "(నేటి కెంతలో నున్నది = అద్య ప్రభృతి కియ దంతరే అస్తి?)"
english = "(How many days until it? = adya prabhṛti kiyad antare asti?)"

[[sections.items]]
n = 6
telugu = "(ఇంకను పదిరోజు లున్నది = ఇతోఽపి దశదినాంతరే అస్తి.)"
english = "(There are still ten more days = ito'pi daśadināntare asti.)"

[[sections.items]]
n = 7
telugu = "సరేగాని అందుకోసమేనా మీఁ యిల్లు అంతటను అలుకుచున్నారు (పూయుచున్నారు?)"
english = "Alright — but is it for that reason that you are plastering (smearing) your entire house?"

[[sections.items]]
n = 8
telugu = "అందుకొఱకే."
english = "It is for that very reason."

[[sections.items]]
n = 9
telugu = "నేనుఁ సందేవేళవఱకు అలుకఁగలరు."
english = "I too can finish the plastering by evening."

[[sections.items]]
n = 10
telugu = "(నీవెప్పు డెక్కఁడికి వెళ్ళవలె = త్వయా అద్యకుత్ర గంతవ్యం)"
english = "(Where must you go today? = tvayā adya kutra gantavyam)"

[[sections.items]]
n = 11
telugu = "నీ తలలో పేళ్ళు చాల నున్నవిగాని నీవు మాయొద్దకు రావద్దు; మా తలలో పడఁగలవు."
english = "There are many lice in your hair — do not come near us; they might get into our heads."

[[sections.items]]
n = 12
telugu = "ఇదివఱకు మీఁ తలలో పేళ్ళు (లేవుకాఁదోలు = న సంతి కింవా.)"
english = "Are there no lice in your heads till now (= na santi kiṃvā)?"

[[sections.items]]
n = 13
telugu = "చూడు చూడు నీతలలో ఈపి యెట్లున్నవో!"
english = "Look, look — how many nits are in your head!"

[[sections.items]]
n = 14
telugu = "మీఁ తమ్మునిఁ మాతోకూడ మాయూరికి బంపెదవా?"
english = "Will you send your younger brother along with us to our town?"

[[sections.items]]
n = 15
telugu = "అక్కఁడ (నిప్పు = అగ్నిః) ఉన్నది."
english = "There is fire (= agniḥ) there."

[[sections.items]]
n = 16
telugu = "కొంచెము (చల్లాఱుముము = శమయు.)"
english = "Let it cool down a little (= śamayu)."

[[sections.items]]
n = 17
telugu = "అలాగే ఆఱుదమనుగాని కొంచెము నీరు తెమ్ము."
english = "We will let it cool like that — but first bring a little water."

[[sections.items]]
n = 18
telugu = "చాలు పోరా నీవు మంచివాఁడవు గావు; మా నాన్నఁ వచ్చినయెడల కోపవడఁగలఁడు."
english = "Enough, get away — you are not a good person; if our father comes, he will get angry."

[[sections.items]]
n = 19
telugu = "మీఁ నాన్నఁ యెక్కఁడికి వెళ్ళినాఁడు ఇంటిలో లేదా?"
english = "Where has your father gone — is he not at home?"
