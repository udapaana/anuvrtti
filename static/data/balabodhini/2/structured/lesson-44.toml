[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "భో మాతుల! బాలకాః సర్వేపి మంచేభ్యః ఉదతిష్ఠన్; తాన్ సర్వాన్ అంత రానీయ భోజనం కారయిత్వా అనంతరం రామాయణం పాఠయ."
english = "O uncle! All the boys have risen from their beds; bring them all inside, have them fed, and then teach them the Rāmāyaṇa."

[[sections.items]]
n = 2
sanskrit_telugu = "కిమర్థంరే ఏకవారం ఘంటాం నాదయ (తేవివ = తపివ) ఆగత్య స్వస్వకార్యాణి కురుఘ."
english = "Why, friend? Ring the bell once; come and do your respective duties."

[[sections.items]]
n = 3
sanskrit_telugu = "ఏషః స్తనపః తతః ఉత్థాతుం నాలం."
english = "This nursing infant is not capable of rising from there."

[[sections.items]]
n = 4
sanskrit_telugu = "త్వం గత్వా త మేుత్థాప్య, క్షీరం పాయయ."
english = "You go and having woken him up, make him drink milk."

[[sections.items]]
n = 5
sanskrit_telugu = "క్షీరం కిమర్థం."
english = "Why milk?"

[[sections.items]]
n = 6
sanskrit_telugu = "ఈష దన్నఁ మేవ ఖాదయిష్యామి; అన్నప్రాశనం అభవత్తలు ?"
english = "I shall feed him just a little rice; has the rice-feeding ceremony taken place?"

[[sections.items]]
n = 7
sanskrit_telugu = "తత్ర యూయాం సర్వే కి మాలోచయథ నకిమపి."
english = "What do all of you think about that matter, or nothing at all?"

[[sections.items]]
n = 8
sanskrit_telugu = "రామాయ కన్యాం దాతుం కేవా ఆగచ్ఛన్."
english = "Who came to give their daughter to Rāma?"

[[sections.items]]
n = 9
sanskrit_telugu = "తం సమాచారం విచారయాముః."
english = "We shall deliberate on that matter."

[[sections.items]]
n = 10
sanskrit_telugu = "విచారణానంతరం మధ్యాహ్నం ఆగత్య తం వృత్తాంతం మాంప్రతి వదిష్యథ కిం ?"
english = "After deliberation, will you come at noon and tell me that matter?"

[[sections.items]]
n = 11
sanskrit_telugu = "తద్దైవ వదిష్యాముః."
english = "We shall tell you right then."

[[sections.items]]
n = 12
sanskrit_telugu = "రామస్య ఉద్యోగః నాస్తి."
english = "Rāma has no employment."

[[sections.items]]
n = 13
sanskrit_telugu = "మానయం ఈషదపి నాస్తి; కింతు- బాలకః యోగ్యః శాంతః."
english = "He has no money at all; but the boy is worthy and calm."

[[sections.items]]
n = 14
sanskrit_telugu = "సుందరః."
english = "Handsome."

[[sections.items]]
n = 15
sanskrit_telugu = "పాఠశాలాయాం చతుర్థకక్షాయాం పఠతి."
english = "He studies in the fourth class at school."

[[sections.items]]
n = 16
sanskrit_telugu = "అరే సంస్కృతభాషామపి పఠతి కిం ?"
english = "Does he also study the Sanskrit language?"

[[sections.items]]
n = 17
sanskrit_telugu = "తస్య జనకః సంస్కృతవిద్యాం పణావిద్యాం చ శిక్షయతి."
english = "His father teaches him Sanskrit learning and music."

[[sections.items]]
n = 18
sanskrit_telugu = "కథం పాఠయతి రే."
english = "How does he teach, friend?"

[[sections.items]]
n = 19
sanskrit_telugu = "తస్య ధనం నాస్తిఖలు."
english = "He has no money, isn't it?"

[[sections.items]]
n = 20
sanskrit_telugu = "చేత్ కిం; భిక్షాటనం కృత్వా భాషాద్వయం పాఠయతి."
english = "So what; having gone begging, he teaches both languages."

[[sections.items]]
n = 21
sanskrit_telugu = "బాధం."
english = "Indeed, right."

[[sections.items]]
n = 22
sanskrit_telugu = "వివాహ నిశ్చయః అభవ త్కిం ?"
english = "Was the marriage decided?"

[[sections.items]]
n = 23
sanskrit_telugu = "నాభవత్."
english = "It was not."

[[sections.items]]
n = 24
sanskrit_telugu = "కుతః? ఏతావత్పర్యంతం నాభవత్."
english = "Why? It has not happened until now."

[[sections.items]]
n = 25
sanskrit_telugu = "శ్వః కిం భవిష్యతివా."
english = "Will it happen tomorrow perhaps?"

[[sections.items]]
n = 26
sanskrit_telugu = "మామ మంచే బాలకాః పతిత్వా దోష్టిం కుర్వంతి."
english = "The boys are falling from my bed and making mischief."

[[sections.items]]
n = 27
sanskrit_telugu = "తం మంచం యత్ర కుత్రవా స్థాపయిత్వా తాన్ దండయ."
english = "Having placed that bed somewhere or other, punish them."

[[sections.items]]
n = 28
sanskrit_telugu = "అస్మదృష్టం పంకే అపతత్."
english = "Before our eyes it fell into the mud."

[[sections.items]]
n = 29
sanskrit_telugu = "సమఱ్ఱిగావత."
english = "Let it be set right."

[[sections]]
type = "passage_translation"
language = "telugu"

[[sections.items]]
n = 1
telugu = "మా బాఱలిని ఎవరో బావిలో పడవేసినారు."
english = "Someone has thrown our bucket into the well."

[[sections.items]]
n = 2
telugu = "మీఁ బావిలో ఎంత నీరున్నది?"
english = "How much water is in your well?"

[[sections.items]]
n = 3
telugu = "అహో! నిలిమేడు నీరున్నది."
english = "Oh! Water is there to a man's height (depth)."

[[sections.items]]
n = 4
telugu = "నీవు బావిలో దిగఁగలవా?"
english = "Can you go down into the well?"

[[sections.items]]
n = 5
telugu = "నేను దిగఁజాలను."
english = "I cannot go down."

[[sections.items]]
n = 6
telugu = "మీఁ ఆలోచన మయినతరువాత నేను పిలుచున్నానని మాతబ్బాయిని పిలువుఁడు."
english = "After your deliberation is done, call our boy saying that I am calling him."

[[sections.items]]
n = 7
telugu = "మీఁ యింట్లో చాల దోమ లున్నవండి."
english = "There are so many mosquitoes in your house, sir."

[[sections.items]]
n = 8
telugu = "ఈపిల్లవానిని గుఱ్ఱముపైన నెక్కించి అలా తీసికొనివెళ్ళుము లేకపోతే వేఁడిక్కడ అల్లరిని చేయఁగలఁడు."
english = "Make this boy ride the horse and take him away — otherwise he will cause mischief here."

[[sections.items]]
n = 9
telugu = "మంచముమొంద దిందున్నదా లేదా?"
english = "Is there a pillow on the cot or not?"

[[sections.items]]
n = 10
telugu = "అరే ఆఁబోతు ఇష్టము వచ్చినట్లు మనుమ్యలను తఱుముచున్నదిగాని, రోకటితో దానిని కొట్టుము."
english = "That bull is chasing people as it pleases — beat it with the pestle."

[[sections.items]]
n = 11
telugu = "అయోో! చూచితివా ఆ ఆఁబోతు బురదలో బడినది."
english = "Oh no! Did you see — that bull has fallen into the mud."

[[sections.items]]
n = 12
telugu = "అయితే కొట్టవద్దు."
english = "Then don't beat it."

[[sections.items]]
n = 13
telugu = "పిల్లవానిని తొట్లనెక్కించుము."
english = "Put the child in the cradle."

[[sections.items]]
n = 14
telugu = "ఉట్టిమొందనుండి నేతిగిన్నెను దింపుము."
english = "Bring down the ghee vessel from the ceiling rack."

[[sections.items]]
n = 15
telugu = "వంట అంతయును అయినది."
english = "All the cooking is done."

[[sections.items]]
n = 16
telugu = "ఇకమొంద ఆలస్యము లేదు."
english = "There is no delay henceforth."

[[sections.items]]
n = 17
telugu = "అక్కడ నున్నఁ అందరిని భోజనముకొఱకు పిలిచి నీవు కూడ స్నానము కొఱకు చెఱువునకు పొమ్ము."
english = "Call all the people who are there for the meal, and you also go to the tank for a bath."

[[sections.items]]
n = 18
telugu = "త్వరగా లేచి పోరా; ఎందుకు జాగుచేయుదువు?"
english = "Get up quickly and go, man — why are you delaying?"

[[sections.items]]
n = 19
telugu = "నీవు లేచిన తరువాత నేను కూడ స్నానముకొఱకు లేవఁగలను."
english = "After you get up, I too will be able to get up for the bath."

[[sections.items]]
n = 20
telugu = "నీనాల్వ తమ్ముఁడు బడికిపోవుట లేదఱే?"
english = "Is your fourth (youngest) brother not going to school?"

[[sections.items]]
n = 21
telugu = "అప్పుఁడే చదువు అయినదా?"
english = "Has the study already finished?"

[[sections.items]]
n = 22
telugu = "నే(నెన్నిమార్లు = కతికృత్వః) చెప్పఁఱిదను?"
english = "How many times (katikṛtvaḥ) shall I tell you?"

[[sections.items]]
n = 23
telugu = "ఎక్కఁడెక్కఁడికో వెళ్ళఁగలఁడు."
english = "He can go off to various places (somewhere or other)."

[[sections.items]]
n = 24
telugu = "ఏమేమో చేయఁగలఁడు.(వానియిష్టమే యిష్టము = తస్య ఇష్టమే వేష్టం)"
english = "He can do all sorts of things. (His will is his command = tasya iṣṭamē veṣṭaṃ)"

[[sections.items]]
n = 25
telugu = "నేనేమి చేయఁజాలుదును?"
english = "What can I do?"

[[sections.items]]
n = 26
telugu = "నా కెందుకు."
english = "Why should I care?"

[[sections.items]]
n = 27
telugu = "మీఁ కెందుకు?"
english = "Why should it matter to you?"
