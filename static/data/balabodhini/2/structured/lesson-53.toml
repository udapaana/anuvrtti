# ---- passage (Sanskrit) ----

[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "మాసాత్ ప్రభృతి యుష్మాకం దర్శనం నాస్తి; యూయం సర్వేపి కుత్రాస్వ?"
english = "There has been no sight of you since a month; where have all of you been?"

[[sections.items]]
n = 2
sanskrit_telugu = "వయం కృష్ణాస్నానార్థం ఆగచ్చాం."
english = "We came for bathing in the Krishna river."

[[sections.items]]
n = 3
sanskrit_telugu = "ఏతదంతరే అస్మద్దాఁందవగృహే ఏకః యజ్ఞః అచలత్."
english = "In the meantime a yajña took place at our relative's house."

[[sections.items]]
n = 4
sanskrit_telugu = "తం ఉత్సవం ద్రష్టుం ఏతావత్పర్యంతం తత్రైవ అవసాం."
english = "To witness that festival, we stayed there until now."

[[sections.items]]
n = 5
sanskrit_telugu = "హ్యః సాయం స్వగృహాం ప్రతి-ఆగచ్చాం."
english = "Yesterday evening we returned home."

[[sections.items]]
n = 6
sanskrit_telugu = "తవ కిమర్థం మయి సర్వదాపి కోపః?"
english = "Why are you always angry with me?"

[[sections.items]]
n = 7
sanskrit_telugu = "దేవాలయం గత్వా తత్ర దీపం జ్వాలయత కిమర్థం?"
english = "Why did you go to the temple and light a lamp there?"

[[sections.items]]
n = 8
sanskrit_telugu = "తత్ర దీపః సమ్యగేవ జ్వలతి."
english = "The lamp is burning well there."

[[sections.items]]
n = 9
sanskrit_telugu = "ఏతం బాలకం తటాకసమీపే ఈషత్కాలం భ్రామయ."
english = "Walk this boy around near the tank for a little while."

[[sections.items]]
n = 10
sanskrit_telugu = "దారిద్ర్యేణ సర్వేషాంపి దుఃఖం భవిష్యతి."
english = "Due to poverty, all will suffer."

[[sections.items]]
n = 11
sanskrit_telugu = "భాగ్యేన సుఖం భవిష్యతి."
english = "With good fortune, there will be happiness."

[[sections.items]]
n = 12
sanskrit_telugu = "అస్మద్ శ్వశురఃహ్యః ప్రాతఃకాళే మదరాసునగరం ప్రతి ఆగచ్చత్."
english = "Our father-in-law came towards Madras city yesterday morning."

[[sections.items]]
n = 13
sanskrit_telugu = "యుష్మాకం దారిద్ర్యభావాత్ సర్వదాపి సంతోషః ఏవ."
english = "Because of your state of poverty, there is only contentment always."

[[sections.items]]
n = 14
sanskrit_telugu = "సర్వేషాం నరేషాం దయాం స్థాపయత."
english = "Show compassion to all people."

[[sections.items]]
n = 15
sanskrit_telugu = "శాలికః పూర్వేద్యుః కంఠే నూతన యజ్ఞోపవీతం ధృత్వా ఆపణం ఆగచ్చత్."
english = "The brother-in-law came to the shop the day before yesterday wearing a new sacred thread around his neck."

[[sections.items]]
n = 16
sanskrit_telugu = "తత్ర ఏకః బాలకః తస్య యజ్ఞోపవీతం హస్తేన అత్రోటుయత్."
english = "There a boy broke his sacred thread with his hand."

[[sections.items]]
n = 17
sanskrit_telugu = "కిమర్థం తే సర్వే ఇత స్తతః తూష్టీమేవ భ్రమంతి?"
english = "Why are all of them wandering silently here and there?"

[[sections.items]]
n = 18
sanskrit_telugu = "తాసాం అంగనానాం వస్త్రశోభనం అసీత్ చేత్ వయం శీఘ్రం గత్వా స్నానం కరవామ; ఆగచ్చత."
english = "If the clothes of those women are washed, let us quickly go and bathe; come."

[[sections.items]]
n = 19
sanskrit_telugu = "తాసాం స్నానాదికం ఇదానీం కుత్ర భవిష్యతి ?"
english = "Where will their bathing and other things happen now?"

[[sections.items]]
n = 20
sanskrit_telugu = "అరే తవ భావస్య శరీరే కో రోగః; కిం వా మయా నజ్ఞాయతే."
english = "Hey, what disease does your brother-in-law have in his body? As if I do not know."

[[sections.items]]
n = 21
sanskrit_telugu = "శరీరే అన్యః రోగః నాస్తి."
english = "There is no other disease in the body."

[[sections.items]]
n = 22
sanskrit_telugu = "గృహే దారిద్ర్యరోగః."
english = "The disease at home is poverty."

[[sections.items]]
n = 23
sanskrit_telugu = "రామః యదా అచోరయత్రవ వస్తాని తదాహాం త్రాసం."
english = "When Rama was stealing clothes, I was frightened."

[[sections.items]]
n = 24
sanskrit_telugu = "సః మాం దృష్ట్వాపి అత్రసత్."
english = "Even upon seeing me, he was frightened."

[[sections.items]]
n = 25
sanskrit_telugu = "కుతః త్రోటిష్యతి."
english = "How will it break?"

# ---- passage_translation (Telugu) ----

[[sections]]
type = "passage_translation"
language = "telugu"

[[sections.items]]
n = 1
telugu = "గదిలో దీపము వెలుఁగుచున్నదో లేదో చూచిరండు; మీఁ బావమఱఁదికి పెండ్లి అయినదా ?"
english = "Go and see whether the lamp is burning in the room; has your brother-in-law's wedding taken place?"

[[sections.items]]
n = 2
telugu = "ఎవనికూఁతు నిచ్చిరి ?"
english = "Whose daughter did they give (in marriage)?"

[[sections.items]]
n = 3
telugu = "గోవిందాచార్యులుగారూ! మీఁ మనుమనికి ఉపనయన మెప్పుడండి?"
english = "O Govindācāryulu! When is your grandson's sacred thread ceremony, sir?"

[[sections.items]]
n = 4
telugu = "వచ్చెడు సంవత్సరమందు మాఘమాసములో చేయఁగలను."
english = "I will be able to do it in the month of Māgha in the coming year."

[[sections.items]]
n = 5
telugu = "మీఁ పిల్లలందఱును ప్రతిదినము మా నులకమంచము మొఁద పడి అల్లరి చేయుచున్నారు."
english = "All your children fall onto our rope cot every day and make a ruckus."

[[sections.items]]
n = 6
telugu = "అందువలన నులకంతయు తెగుచున్నది."
english = "Because of that, the entire rope webbing is breaking."

[[sections.items]]
n = 7
telugu = "నే నేమయినను అన్న యెడల మాకు కోపము."
english = "If I say anything about it, you get angry."

[[sections.items]]
n = 8
telugu = "వారు (అల్లరివాఁడ్రు = దుష్టాః)."
english = "They are mischievous ones (duṣṭāḥ)."

[[sections.items]]
n = 9
telugu = "చాలు చాలు మా పిల్లలు చెడ్డవారును మీఁ పిల్లలు మంచివారునా?"
english = "Enough, enough — are our children bad and your children good?"

[[sections.items]]
n = 10
telugu = "నీ మాట చాల బాగుగా నున్నది."
english = "What you say is very nice indeed."

[[sections.items]]
n = 11
telugu = "ఎప్పుడును మీఁ రభద్దమే మాట్లాడుచుందరు."
english = "You always speak only nonsense."

[[sections.items]]
n = 12
telugu = "మా మేనమామ తనకొడుకును గుంటూరు పట్టణములో పణావభాషను చదివించుచున్నాఁడు."
english = "Our maternal uncle is having his son study commerce language in the town of Guṇṭūru."

[[sections.items]]
n = 13
telugu = "ఇప్పుఁడు ప్రతివానికిను అదే పని గదా."
english = "That is the business of everyone nowadays, isn't it?"

[[sections.items]]
n = 14
telugu = "ఎందుకనఁగా ఆ భాష రాజభాషగా నున్నది."
english = "Because that language has become the official language (of the rulers)."

[[sections.items]]
n = 15
telugu = "ఏమో నేను (మాత్రము = తు) సంస్కృతమునే చదివింపఁగలను."
english = "For my part (tu), I can only have (my children) study Sanskrit."

[[sections.items]]
n = 16
telugu = "మంచిదే."
english = "That is good."

[[sections.items]]
n = 17
telugu = "రెండు నెలలయిన తరువాత నీకు సంస్కృతప్రారంభము చేయుదును."
english = "After two months I will begin Sanskrit instruction for you."

[[sections.items]]
n = 18
telugu = "మరల మీఁ దర్శనము మా కెప్పుఁడగునో నిన్నఁ మీఁ ఆవు కనఁబడలే దంటిరే కనఁబడినదా?"
english = "When will we have the chance to see you again? You said yesterday that your cow was not visible — has it appeared?"

[[sections.items]]
n = 19
telugu = "ఆవు ఈ వేళ కనఁబడినదిగాని దూడ కనఁబడలేదు."
english = "The cow appeared this time, but the calf has not appeared."

[[sections.items]]
n = 20
telugu = "కోడెదూడా పెయ్యిదూడా?"
english = "Is it a bull-calf or a heifer-calf?"

[[sections.items]]
n = 21
telugu = "పెయ్యియో కోడెయో మా మనుమని పిల్చి అడుగుము."
english = "Whether heifer or bull — call our grandson and ask him."
