# --- Passage ---

[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "ఏకస్మిన్ గ్రామే నారాయణభట్టోనామ బ్రాహ్మణః అవసత్."
english = "In a certain village there lived a brahmin named Nārāyaṇabhaṭṭa."

[[sections.items]]
n = 2
sanskrit_telugu = "సః అతీవ అమాయికః."
english = "He was extremely simple-minded."

[[sections.items]]
n = 3
sanskrit_telugu = "పూర్వకాలమనుష్యః."
english = "He was a man of the old times."

[[sections.items]]
n = 4
sanskrit_telugu = "వేదచతుష్టయం సాంతం అపఠత్."
english = "He had studied all four Vedas completely."

[[sections.items]]
n = 5
sanskrit_telugu = "తస్య సంగీతే అతీవ అపేక్షా ఆసీత్."
english = "He had a very keen desire for music."

[[sections.items]]
n = 6
sanskrit_telugu = "సంగీతాభ్యాసార్థం దేశాంతరం గంతుం సమకల్పయత్."
english = "He resolved to go to another country for the purpose of practising music."

[[sections.items]]
n = 7
sanskrit_telugu = """అనంతరం భార్యాసమీపం గత్వా 'హే భార్యే! అహాం సంగీతార్థం దేశాంతరం గమిష్యామి. తవ అభిప్రాయం వద' ఇతి తాం అపృచ్చత్."""
english = "Then going to his wife he asked her: 'Dear wife! I will go to another country for music. Tell me your opinion.'"

[[sections.items]]
n = 8
sanskrit_telugu = """తదా సా హాసిత్వా 'హేనాథ! సంగీతార్థం దేశాంతరగమనం కుతః? అత్రైవ స్థిత్వా సంగీతాభ్యాసనం కురుత' ఇత్య కథయత్."""
english = "Then she, laughing, said: 'Dear lord! Why go to another country for music? Stay right here and practise music.'"

[[sections.items]]
n = 9
sanskrit_telugu = """తస్యాః వచనం ఆకర్ణ్య 'మామ సంగీతం సుతరాం నజ్ఞాతం; తస్మాత్ అత్ర స్థిత్వా కథం సంగీతం సంపాదయిష్యామి' ఇతి అపృచ్చత్."""
english = "Having heard her words, he asked: 'I do not know music at all; so staying here, how will I acquire music?'"

[[sections.items]]
n = 10
sanskrit_telugu = """తదా సా ఏవ మవదత్-'భోనాథ! సంగీతాభ్యాసక్రమం అహాం వదిష్యామి ఆకర్ణయత. కథమితి చేత్, శీతకాళే ప్రతిదినం సూర్యోదయా తూా పూర్వం ఉత్థాయ గంగాయాం స్నానం కృత్వాఁ గంగాతీరే ఏవ ఉపవిశ్య జపం కురుఁ; చేత్ సంగీతం క్రమశః ఆగమిష్యతి.'"""
english = "Then she spoke thus: 'Dear lord! I will tell you the method of practising music — listen. If you ask how: in the cold season, rising before sunrise every day, bathing in the Gaṅgā, and sitting on the bank of the Gaṅgā itself, perform japa; if so, music will come gradually.'"

[[sections.items]]
n = 11
sanskrit_telugu = "సః అమాయిక బ్రాహ్మణః తద్వచనం సత్యమేవేతి జ్ఞాత్వా."
english = "That simple-minded brahmin, taking her words as absolutely true,"

[[sections.items]]
n = 12
sanskrit_telugu = "ద్వితీయదినాత్ ప్రభృతి సూర్యోదయాతూా పూర్వం శీతకాళే గంగాయాం స్నానం కర్తుం ఉదతిష్ఠత్."
english = "from the second day onwards, rose before sunrise to bathe in the Gaṅgā in the cold season."

[[sections.items]]
n = 13
sanskrit_telugu = "స్నానం మకరోత్."
english = "He bathed."

[[sections.items]]
n = 14
sanskrit_telugu = "సంగీతం నాస్తి, గింగీతం నాస్తి (పరంతు-కింతు) అతీవ శీతబాధాం అన్వభవత్."
english = "There was no music, no 'gingīta' (meaningless singing) — but he experienced extreme cold torment."

[[sections.items]]
n = 15
sanskrit_telugu = "భార్యా అహాసత్."
english = "His wife laughed."

# --- Passage Translation ---

[[sections]]
type = "passage_translation"
language = "telugu"

[[sections.items]]
n = 1
telugu = "మా గుఱ్ఱమునకు బొత్తుగా చుఱుకుడనము లేదు."
english = "Our horse has absolutely no alertness."

[[sections.items]]
n = 2
telugu = "మీఁ యుపాధ్యాయుఁడు మిక్కిలి సమర్థుఁడేగాని చెవిటివాఁడు."
english = "Your teacher is very capable, but he is deaf."

[[sections.items]]
n = 3
telugu = "అది యొక్కటియే ఆయన యందు లోపము."
english = "That alone is the shortcoming in him."

[[sections.items]]
n = 4
telugu = "నాచెవిలో కొంచెము నూనె పోయుము."
english = "Pour a little oil into my ear."

[[sections.items]]
n = 5
telugu = "పాపయ్యగారి పెయ్యుదూడ మన దొడ్లో ప్రవేశించి దొడ్లోనున్న చెట్లనన్నిటిని పాడుచయుచున్నది; గాని నీవు వెళ్ళి ఆయావును పున్నాగచెట్టున గట్టుము."
english = "Pāpayya's young heifer has entered our yard and is spoiling all the trees in the yard; so go and tie that cow to the punnāga tree."

[[sections.items]]
n = 6
telugu = "నిన్నఁ రాత్రి శివునిగుళ్ళో ఎవఁడో హరికథను చెప్పినాఁడఁట."
english = "They say someone told a Hari-kathā in the Śiva temple last night."

[[sections.items]]
n = 7
telugu = "మొరు విన్నారా?"
english = "Did you all hear it?"

[[sections.items]]
n = 8
telugu = "వాకిటిలో నెవరో తిరుగుచున్నారు."
english = "Someone is wandering in the front yard."

[[sections.items]]
n = 9
telugu = "తెలిసికొనుఁడు."
english = "Find out (who it is)."

[[sections.items]]
n = 10
telugu = "ఎవరో కాదు మీఁ మామగారే."
english = "It is none other than your uncle."

[[sections.items]]
n = 11
telugu = "నేను అంగడికి వెళ్ళి వెంటనే వత్తును."
english = "I will go to the shop and come back immediately."

[[sections.items]]
n = 12
telugu = "అంతవఱకును నీవు ఎక్కఁడకును వెళ్ళవద్దు."
english = "Until then, you are not to go anywhere."

[[sections.items]]
n = 13
telugu = "వాఁడు సమస్త బాధలను అనుభవించి చివఱకు చచ్చెను."
english = "He experienced all sorts of troubles and finally died."

[[sections.items]]
n = 14
telugu = "నీ మేనమామ నాకోసము మా యింటికివచ్చినాఁడుగదా."
english = "Your maternal uncle did come to our house to see me."

[[sections.items]]
n = 15
telugu = "(ఇదిగో = ఏషః) వచ్చుచున్నానయ్యా అని చెప్పితిని."
english = "Here he comes (= eṣaḥ) — I said, 'I am coming, sir.'"

[[sections.items]]
n = 16
telugu = "అంతటితో పోయెనేమి ?"
english = "Did it end just with that?"

[[sections.items]]
n = 17
telugu = "ఆ కాతిని బద్ధలుకొట్టుము."
english = "Break open that pot."

[[sections.items]]
n = 18
telugu = "నాకొకచిటికెఁడు (పొడుము = నస్యం) పెట్టుము."
english = "Give me a pinch of snuff (= nasya)."

[[sections.items]]
n = 19
telugu = "నాకు ఎందులకోగాని నిద్ర వచ్చుటలేదు."
english = "For some reason or other, sleep is not coming to me."

[[sections.items]]
n = 20
telugu = "నీవు చాల దుష్టుడవు."
english = "You are very wicked."

[[sections.items]]
n = 21
telugu = "నీ స్వభావము మంచిది కాదు."
english = "Your nature is not good."

[[sections.items]]
n = 22
telugu = "నా అవస్థ నేమని చెప్పఱిదును?"
english = "What shall I say about my condition?"

[[sections.items]]
n = 23
telugu = "నా పెండ్లాము గ్రుడ్డిది."
english = "My wife is blind."

[[sections.items]]
n = 24
telugu = "చెవిటిది."
english = "She is deaf."

[[sections.items]]
n = 25
telugu = "కుంటిది; కాని భోజనమునకు మట్టుకు పెద్దది."
english = "She is lame; but when it comes to eating, she is quite capable."

[[sections.items]]
n = 26
telugu = "నీ అదృష్ట మది."
english = "That is your (good) fortune."

[[sections.items]]
n = 27
telugu = "నా అదృష్టమిది."
english = "This is my fortune."

[[sections.items]]
n = 28
telugu = "నాయాశ వ్యర్థమైనది."
english = "My hope has come to nothing."
