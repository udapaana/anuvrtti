[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "ఆపణం గత్వా సర్వాన్ పదార్థాన్ ఏకవారమే వానయ."
english = "Going to the shop, bring all the items at once."

[[sections.items]]
n = 2
sanskrit_telugu = "పునః పునర్మాగచ్చ."
english = "Do not come again and again."

[[sections.items]]
n = 3
sanskrit_telugu = "తత్ర ఉపవిశ్య సంధ్యావందనం కరోతి కః, త్వయా జ్ఞాయతే కిం?"
english = "Who is sitting there and performing the evening prayer — do you know?"

[[sections.items]]
n = 4
sanskrit_telugu = "సః బాలకః తటాకతఱే తూష్ణీం ధావతి."
english = "That boy is running silently along the bank of the tank."

[[sections.items]]
n = 5
sanskrit_telugu = "తం అనీయ గృహే ఏకత్ర ఉపవేశయితుం త్వం ఏకః ఏవ సమర్థః నాన్యః."
english = "Only you can bring him into the house and sit him down somewhere — no one else can."

[[sections.items]]
n = 6
sanskrit_telugu = "యావజ్జీవం అస్మన్మం చేమ మత్కుణాః వసంతి ఏవ."
english = "As long as one lives, bedbugs dwell in our bed."

[[sections.items]]
n = 7
sanskrit_telugu = "శిష్యాః సర్వేపి ప్రత్యహాం సంధ్యావందనం యథావిధి కుర్వంత్యేవ."
english = "All the disciples indeed perform the twilight prayer every day according to rule."

[[sections.items]]
n = 8
sanskrit_telugu = "త్వ మేక ఏవ సమ్యక్ న కరోషి."
english = "You alone do not do it properly."

[[sections.items]]
n = 9
sanskrit_telugu = "మాషాన్ ఆనేష్యామి కింతు."
english = "I shall bring black gram, but..."

[[sections.items]]
n = 10
sanskrit_telugu = "త్వదంబయా అపూపాన్ కారయిష్యసి కిం ?"
english = "Will you have your mother make rice cakes?"

[[sections.items]]
n = 11
sanskrit_telugu = "క్షీరే ఈషద్గుడం పాతయేః చేత్."
english = "If you were to add a little jaggery to the milk..."

[[sections.items]]
n = 12
sanskrit_telugu = "మధురం భవేత్."
english = "It would become sweet."

[[sections.items]]
n = 13
sanskrit_telugu = "సః మర్కటః అత్రాగత్య అస్మద్ద్వారే ఉపవేష్టుం స్థలం పశ్యతి."
english = "That monkey, having come here, is looking for a place to sit at our door."

[[sections.items]]
n = 14
sanskrit_telugu = "యూయం అత్ర ఉపవిశత."
english = "All of you sit down here."

[[sections.items]]
n = 15
sanskrit_telugu = "ఏకం సమాచారం వదిష్యామి."
english = "I shall tell one piece of news."

[[sections.items]]
n = 16
sanskrit_telugu = "కః సమాచారః ఇతిచేత్."
english = "If you ask what news it is..."

[[sections.items]]
n = 17
sanskrit_telugu = "సర్వే బ్రాహ్మణాః దేవాలయే ఉపావిశన్."
english = "All the brahmins sat down in the temple."

[[sections.items]]
n = 18
sanskrit_telugu = "ఏకః హరిదాసః చెన్నపత్నాత్ ఆగత్య తత్ర హరికథాం కథయతికల తదర్థం బహుజనాః ఆగచ్ఛన్."
english = "A devotee of Hari, having come from Chennai, is narrating the Hari story there — so many people came for that."

[[sections.items]]
n = 19
sanskrit_telugu = "అరేత్వం గత్వా ఏఁకెకం సమ్యక్ ఉపవేశయ."
english = "Hey you, go and seat each one properly."

[[sections.items]]
n = 20
sanskrit_telugu = "భో బ్రాహ్మణాః ! శీఘ్రు మత్ర ఉపవిశత."
english = "O brahmins! Quickly sit down here."

[[sections.items]]
n = 21
sanskrit_telugu = "అత్రకటాః న సంతి; కథం ఉపవిశేమ?"
english = "There are no mats here; how shall we sit?"

[[sections.items]]
n = 22
sanskrit_telugu = "అధః సర్వత్ర స్థలం సమ్యక్ నాస్తి."
english = "Below, the ground is not proper everywhere."

[[sections.items]]
n = 23
sanskrit_telugu = "ప్రథమతః స్థలం శోధయిత్వా తదుపరి కటాన్ ప్రసారయత; తేమ వయం ఉపవిశామ."
english = "First clean the ground, then spread mats upon it; then we shall sit."

[[sections.items]]
n = 24
sanskrit_telugu = "నృపః ఆగత్య సర్వాన్ ఉపవేశయిష్యతి; తావత్పర్యంతం బహిస్తిష్ఠామ ఉత్తిష్ఠత."
english = "The king, having come, will seat everyone; until then let us stand outside, rise up."

[[sections.items]]
n = 25
sanskrit_telugu = "అరే అస్మాన్ కః ఉపవేశయిష్యతిరే; వయమేవ అనుకూలస్థలే ఉపవేక్ష్యామః."
english = "Hey, who will seat us? We ourselves shall sit in a convenient place."

[[sections.items]]
n = 26
sanskrit_telugu = "నృపః బహుజనాన్ ఉపావేశయత్."
english = "The king caused many people to be seated."

[[sections.items]]
n = 27
sanskrit_telugu = "అరే పశ్య హరిదాసః సమ్యక్ హాసయిష్యతి రే."
english = "Hey look, the Hari devotee will make everyone laugh properly."

[[sections]]
type = "passage_translation"
language = "telugu"

[[sections.items]]
n = 1
telugu = "నే నొకనాఁడు మార్కాపుర గ్రామమునందు ఒక సత్రములో ప్రవేశించితిని."
english = "One day I entered a travellers' rest house in the village of Mārkāpura."

[[sections.items]]
n = 2
telugu = "అక్కఁడ నొక బ్రాహ్మణబాలుఁడు నన్నుఁ చూచుటకు వచ్చెను."
english = "There a young brahmin boy came to see me."

[[sections.items]]
n = 3
telugu = "వానికి ఉపనయనము అయినది."
english = "His sacred thread ceremony had been performed."

[[sections.items]]
n = 4
telugu = "కంఠమునందు యజ్ఞోపవీతము వ్రేలాడుచున్నది."
english = "The sacred thread was hanging from his neck."

[[sections.items]]
n = 5
telugu = "ఆ పిల్లవాఁడు బహుయోగ్యుఁడువలె నుండెను."
english = "That boy seemed very worthy and capable."

[[sections.items]]
n = 6
telugu = "అతఁడు నాకు నమస్కారమును చేసి అయ్యా! మీఁ యూరేది అని నన్నుఁ డిగెను."
english = "He saluted me and asked me: 'Sir! Which is your village?'"

[[sections.items]]
n = 7
telugu = "అరే అబ్బాయి! మా యూరిపేరు నీకెందుకని నేను వానిని అడిగితిని."
english = "Why do you need our village's name? — so I asked him."

[[sections.items]]
n = 8
telugu = "ఎందుకును లేదు! మొరు పండితులువఱె నున్నారు గాన నేను మీఁ దగ్గర విద్యను చదువుకొనుటకు వచ్చినాను! మొరు నాకు సంస్కృతమును నేర్పుదురా."
english = "No particular reason! You seem to be a learned scholar, so I have come to study under you! Will you teach me Sanskrit?"

[[sections.items]]
n = 9
telugu = "అని నన్నుఁ అడిగెను."
english = "— thus he asked me."

[[sections.items]]
n = 10
telugu = "వానియొక్క మాటఁఱ (వచనాని) నన్నుఁ మిక్కిలి సంతోషపెట్టినవి."
english = "His words (vacanāni) pleased me greatly."

[[sections.items]]
n = 11
telugu = "పిమ్మట నేను నాయనా! నీవు మొదట ఆంధ్రభాషను చదివినావా' అని అడిగితిని.'మా తండ్రి నన్నుఁ ఆంధ్ర భాషను బాగుగనే చదివించినాడు."
english = "Then I asked him: 'My dear, have you studied Telugu first?' — 'My father had me taught Telugu quite well.'"

[[sections.items]]
n = 12
telugu = "మొరు నాకు సంస్కృత భాషను నేర్పుదుఁటాని చెప్పెను."
english = "'Please teach me the Sanskrit language' — so he said."

[[sections.items]]
n = 13
telugu = "సరేకాని 'నీవు ఆంధ్రభాషను చదివిన యెడల ఏమేమి పుస్తకములు చదివినా'వని అడిగితిని."
english = "All right, but I asked: 'If you have studied Telugu, what books have you read?'"

[[sections.items]]
n = 14
telugu = "\"నేను ఆంధ్ర భారతమును, భాగవతమును, మనుచరిత్రను, వసుచరిత్రను ఇంకను చాల గ్రంథములను చదివితి\"ని చెప్పి కొన్ని పద్యములను చదివెను."
english = "'I have read the Āndhra Bhārata, the Bhāgavata, the Manucaritra, the Vasucaritra, and many more works' — so saying, he recited some verses."
