# --- passage ---

[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "యుష్మాభిః క్రియమాణం కార్యం సమాప్తంచేత్ భో శిష్యాః! శీఘ్రం పుష్పవనం గత్వా స్వామిపూజార్థం పుష్పాణి అనయత."
english = "If the task being done by you is finished, O disciples! Go quickly to the flower garden and bring flowers for the master's worship."

[[sections.items]]
n = 2
sanskrit_telugu = "హాంజే! దేవాలయే దీపఃఆస్తివా నవా పశ్య."
english = "Hey there! Check whether there is a lamp in the temple or not."

[[sections.items]]
n = 3
sanskrit_telugu = "తైలాభావాత్ నక్త మేవ దీపః ఆశామ్యత్."
english = "Due to lack of oil, the lamp was extinguished just at night."

[[sections.items]]
n = 4
sanskrit_telugu = "తర్హి తిలఘాతకగృహం గత్వా తైల మానయేతి రామంప్రతి వద."
english = "Then tell Rāma to go to the oil-presser's house and bring oil."

[[sections.items]]
n = 5
sanskrit_telugu = "తద్దైవ వదిష్యామి."
english = "I will tell him right then."

[[sections.items]]
n = 6
sanskrit_telugu = "తిలఘాతకః ఇదానీమేవ తిలాన్ ఘూణాయాం పూరయిత్వా ఘూణాం భ్రమయితుం ఆరభత."
english = "The oil-presser just now filled the oil press with sesame seeds and began to turn the press."

[[sections.items]]
n = 7
sanskrit_telugu = "ఈషత్కాలం స్థిత్వా ఆగచ్చేతి అవదత్."
english = "He said, 'Wait a little while and come back.'"

[[sections.items]]
n = 8
sanskrit_telugu = "చణకాః భృష్టాః కింవా అంబాం ప్రచ్చ."
english = "Have the chickpeas been roasted? Ask mother."

[[sections.items]]
n = 9
sanskrit_telugu = "అస్మద్వృత్తుః అవరణే శివకే కేన బద్ధః?"
english = "By whom was our calf tied to the post in the enclosure?"

[[sections.items]]
n = 10
sanskrit_telugu = "యుష్మద్వృత్తున్ రాత్రా అహా మబధ్నాం."
english = "I tied your calf at night."

[[sections.items]]
n = 11
sanskrit_telugu = "అద్యప్రాతః సుబ్రహ్మణ్యః పునరపి అమోచయత్."
english = "This morning Subrahmaṇya released it again."

[[sections.items]]
n = 12
sanskrit_telugu = """పూర్వేద్యుః తటాకే మగ్నః గజః కుత్రా గచ్చత్? ఏకః అలర్కః అస్మద్దా మే పూర్వేద్యుః తటాకే మగ్నః గజః కుత్రా గచ్చత్? ఏకః అలర్కః అస్మద్దా మే సంచరతి; తం పాదే అతాడయన్; తస్య పాదః భగ్న అసీత్."""
english = "The day before yesterday, where did the elephant that had sunk in the pond go? A mad dog was roaming near us the day before yesterday; they struck it on the foot; its foot was broken."

[[sections.items]]
n = 13
sanskrit_telugu = "సః ఇదానీం కుత్రాస్తి వా నజ్ఞాయతే."
english = "Where it is now is not known."

[[sections.items]]
n = 14
sanskrit_telugu = "మమాంగవస్త్రం కేన సిక్తం?"
english = "By whom was my body-cloth wetted?"

[[sections.items]]
n = 15
sanskrit_telugu = "ఘోషాత్ గోపికా ఆగతా వా?"
english = "Has the milkmaid come from the hamlet?"

[[sections.items]]
n = 16
sanskrit_telugu = "నహి."
english = "No."

[[sections.items]]
n = 17
sanskrit_telugu = "రేరే తైలపిష్టే కీటాః ఇత స్తతశ్చలంతి."
english = "Hey hey, insects are moving here and there in the oil residue."

[[sections.items]]
n = 18
sanskrit_telugu = "శోధయ."
english = "Clean it."

[[sections.items]]
n = 19
sanskrit_telugu = "యుష్మాకం ధనసద్భావాత్ యథాపేక్షితం తథా భేలధ."
english = "With the existence of your wealth, behave as you wish."

[[sections.items]]
n = 20
sanskrit_telugu = "అస్మాకం కి మస్తి?"
english = "What do we have?"

[[sections.items]]
n = 21
sanskrit_telugu = "వయం సర్వదా నిర్ధనాః అస్మద్గృహాత్ అవప్రసృత్ కింవా కంచన ఢంకం మార్గయ రే."
english = "We are always penniless — get out of our house, or look for some money, hey."

[[sections.items]]
n = 22
sanskrit_telugu = "మాషాన్ మానికయా మాహి."
english = "Measure the black gram with a mānika measure."

# --- passage_translation ---

[[sections]]
type = "passage_translation"
language = "telugu"

[[sections.items]]
n = 1
telugu = "మా పిల్లవాఁడు చదివి చదివి మిక్కిలి అలసినాఁడు."
english = "Our boy has studied and studied and become very tired."

[[sections.items]]
n = 2
telugu = "సూర్యుఁడు కొంచెము కొంచెము ఎఱ్ఱబాఱుచున్నాఁడు."
english = "The sun is gradually turning red."

[[sections.items]]
n = 3
telugu = "నా చెంబు నెవఁడో అపహరించుచున్నాఁడు చూడుము."
english = "Look — someone is stealing my water-pot."

[[sections.items]]
n = 4
telugu = "ఒక సింహము నిన్నటి యేనుఁగును గోళ్ళతో చీల్చుచున్నది."
english = "A lion is tearing apart yesterday's elephant with its claws."

[[sections.items]]
n = 5
telugu = "ఇఁక నీవు వంటు చాలించుము. (చాల ప్రొద్దయినది = మహాన్యాఽలో గతీ) కొంచెము నూనెనిటు తెమ్ము."
english = "Stop cooking now. (A lot of time has passed = mahān kālo gataḥ) Bring a little oil here."

[[sections.items]]
n = 6
telugu = "శరీరమునందు పూసికొని స్నానము చేయుదును."
english = "I will apply it on my body and then bathe."

[[sections.items]]
n = 7
telugu = "పాముపఱుగిడుచున్నది."
english = "A snake is running away."

[[sections.items]]
n = 8
telugu = "చంపుము."
english = "Kill it."

[[sections.items]]
n = 9
telugu = "ఎవఁడు సంహరింపఁగలఁడు? (నేను చంపలేను = మారయితుం న శక్నోమి)"
english = "Who can kill it? (I cannot kill it = mārayituṃ na śaknomi)"

[[sections.items]]
n = 10
telugu = "మల్లెపూవులు ముడుచుకొనుచున్నవి. (కాకులు కూయుచున్నవి = కాకా రటంతి)"
english = "Jasmine flowers are closing up. (Crows are cawing = kākā raṭanti)"

[[sections.items]]
n = 11
telugu = "మీఁ యింటిలో ధాన్యమును దంపుచున్నా రేమి?"
english = "Are they pounding grain in your house?"

[[sections.items]]
n = 12
telugu = "రేపు మా తాతగారి పెండ్లి."
english = "Tomorrow is our grandfather's wedding."

[[sections.items]]
n = 13
telugu = "నీ కాలిమొంద కురుపు పగిలినదా? లేదు; ఇంకను చాల బాధపెట్టుచున్నది."
english = "Has the boil on your foot burst? No; it is still causing a lot of pain."

[[sections.items]]
n = 14
telugu = "మినపప్పు చ్చులను తినుము."
english = "Eat black gram lentil fritters."

[[sections.items]]
n = 15
telugu = "రేపోయెల్లుండో పగులఁగలదు."
english = "It may burst tomorrow or the day after."

[[sections.items]]
n = 16
telugu = "తొలుకాని పోతేదు? ఇప్పుడేగా ఎనిమిదిగంటలు అయినది; గాఁడు పదిగంటల్లైన తర్వాత తొలుకాని పోతేదు? ఇప్పుడేగా ఎనిమిదిగంటలు అయినది; పదిగంటలైన తర్వాత గదా వాఁడు ప్రతిదినమును వచ్చును; (ఇంతలోనే వాఁడే వచ్చును. త్వరపడెదవేల = ఏతదంతరే ఏవ త్వరసి కిం?) కొంచెము కాలమును చూడుము"
english = "Where has the oil-presser gone? It is only eight o'clock now; where has the oil-presser gone? It is only eight o'clock now; he comes every day only after ten; (he will come on his own in the meantime — why are you in a hurry = etadantare eva tvarasi kiṃ?) Wait a little while."
