# --- passage ---

[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "హే అంబ! తందులపిష్టే అనేకే మశకాః అపతన్."
english = "O mother! Many mosquitoes fell into the rice flour."

[[sections.items]]
n = 2
sanskrit_telugu = "చాలిన్యా ఈషత్ చలయ."
english = "Sift it a little with the sieve."

[[sections.items]]
n = 3
sanskrit_telugu = "అహాం సాయంకాళే ధాన్య మానేష్యామి లాజిష్యసి కిం?"
english = "I will bring grain in the evening — will you roast puffed rice?"

[[sections.items]]
n = 4
sanskrit_telugu = "తవ లలాటే తిలకం నాస్తికింరే?"
english = "There is no tilaka mark on your forehead, is there?"

[[sections.items]]
n = 5
sanskrit_telugu = "మధ్యాహ్నౌ అధరం."
english = "It was there at noon."

[[sections.items]]
n = 6
sanskrit_telugu = "పరంతు ఇదానీం అనశ్యత్."
english = "But now it has disappeared."

[[sections.items]]
n = 7
sanskrit_telugu = "యుష్మాభిః అస్మద్వ్యవహార పరిష్కారపర్యంతం అత్రైవ స్థాతవ్యం."
english = "You all must stay right here until our dispute is settled."

[[sections.items]]
n = 8
sanskrit_telugu = "తద్దైవ స్థాస్యామః ఇదానీం యుష్మత్సోదరాణాం వ్యవహారపరిష్కారం భవిష్యతి కిం?"
english = "We will stay for that — will the settlement of your brothers' dispute happen now?"

[[sections.items]]
n = 9
sanskrit_telugu = "నోచే ద్వాయమేవ పరిష్కురుత."
english = "Otherwise, settle both of them together."

[[sections.items]]
n = 10
sanskrit_telugu = "మమాంగుష్టే ఏకః కంటకః అలగత్."
english = "A thorn got stuck in my thumb."

[[sections.items]]
n = 11
sanskrit_telugu = "తవ చిబుకే పామా (నొప్పిటః = పొక్కు) ఇవదృశ్యతే."
english = "Something like a blister (pimple = a sore) is visible on your chin."

[[sections.items]]
n = 12
sanskrit_telugu = "హాంజే! స్నానపశ్చి (నాసికాయాం = నాసాయాం) సింఘాణం లంబతే."
english = "Hey! After bathing, mucus is hanging from the nose."

[[sections.items]]
n = 13
sanskrit_telugu = "అపనయ."
english = "Remove it."

[[sections.items]]
n = 14
sanskrit_telugu = "రమణంబాయాః కేశాన్ సమ్యక్ ప్రసాధ్య పుష్పేఽపి ఆలంకురు."
english = "Properly arrange Ramaṇambā's hair and also decorate it with flowers."

[[sections.items]]
n = 15
sanskrit_telugu = "హేబలిద్ధాచార్య! తవ భార్యాయాః నామధేయం కిం; ఈషత్కుథయసి వా మామ లజ్ఞాఖలు?"
english = "O Balidhācārya! What is your wife's name? Are you speaking softly? Are you not ashamed?"

[[sections.items]]
n = 16
sanskrit_telugu = "యుష్మద్భార్యాయాః నామధేయం యూయం వదిష్యథ కిం?"
english = "Will you tell your wife's name?"

[[sections.items]]
n = 17
sanskrit_telugu = "ఏకః గజః ఆగత్య తటాకే అమ్మజత్."
english = "An elephant came and bathed in the pond."

[[sections.items]]
n = 18
sanskrit_telugu = """జలం సర్వం
(పంకిలం = బురదచే నిండినది) అసీత్."""
english = "All the water became muddy (filled with mud)."

[[sections.items]]
n = 19
sanskrit_telugu = "కస్యవా గృహం జ్వలతి."
english = "Whose house is on fire?"

[[sections.items]]
n = 20
sanskrit_telugu = "ఈషత్ జలేన శమయ."
english = "Extinguish it with a little water."

[[sections.items]]
n = 21
sanskrit_telugu = "మమాంగవస్త్రం సిక్వాపి ఆనయ."
english = "Bring my body-cloth even after wetting it."

[[sections.items]]
n = 22
sanskrit_telugu = "చణకాన్ భృజ్జసి కిం?"
english = "Are you roasting chickpeas?"

[[sections.items]]
n = 23
sanskrit_telugu = "నహినహి మాషాన్ భృజ్జామి."
english = "No no, I am roasting black gram."

[[sections.items]]
n = 24
sanskrit_telugu = "సః శుకః బంధనే పతిత్వా కూజతి; తం బంధనాత్ మోచయిత్వా యత్రకుత్రాపి వృక్షే ముంచ."
english = "That parrot has fallen into captivity and is crying; free it from captivity and release it on any tree."

[[sections.items]]
n = 25
sanskrit_telugu = "త్వం అద్య శుకపురం యాహి."
english = "You go to Śukapura today."

[[sections.items]]
n = 26
sanskrit_telugu = "పునః దినపంచకానంతరం అత్ర ఆయాహి."
english = "Come back here again after five days."

[[sections.items]]
n = 27
sanskrit_telugu = "అరే కావా విధవా అభిముఖం ఆయాత్రిరే."
english = "Hey, which widow is coming towards us?"

[[sections.items]]
n = 28
sanskrit_telugu = "ఇదానీం మా యాహి; శ్వః యాయాః కింతూత్తిష్ఠ."
english = "Don't go now; you should go tomorrow — but get up."

# --- passage_translation ---

[[sections]]
type = "passage_translation"
language = "telugu"

[[sections.items]]
n = 1
telugu = "ఓపిల్లలూ! మాకు పరీక్షాసమయమను దగ్గఱకు వచ్చుచున్నది; భయపడవద్దండి!"
english = "O children! Our examination time is drawing near — do not be afraid!"

[[sections.items]]
n = 2
telugu = "పరీక్షయందు అన్ని ప్రశ్నులకును జవాబు వ్రాయుఁడు."
english = "Write answers to all the questions in the exam."

[[sections.items]]
n = 3
telugu = "ఒకప్రశ్నను కూడ విడువవద్దండి; నీకు చేతిమొంద గఱ్ఱిపొక్కులున్నవి కాఁబోలు నీవెట్లు వ్రాయుదువు."
english = "Do not leave even a single question; you seem to have blisters on your hand — how will you write?"

[[sections.items]]
n = 4
telugu = "ఆవేళకు నశించవండి."
english = "They will be gone by that time."

[[sections.items]]
n = 5
telugu = "మీఁ అనుగ్రహ ముున్న యెడల నేను దైర్యముతోనే వ్రాయఁగలను."
english = "If I have your blessing, I will be able to write with confidence."

[[sections.items]]
n = 6
telugu = "నా కేమియు భయము లేదు; కాని పరీక్ష యందు ప్రశ్నపత్రమిు తెల్లుఁడునో!"
english = "I have no fear at all; but I wonder whether the question paper in the exam will be easy!"

[[sections.items]]
n = 7
telugu = "నాకు పణావ భాషయందు, భూగోళమునందు, దేశచరిత్రమునందు, సంస్కృతమునందును బాగుగనే ప్రవేశమున్నది గాని గణితమందు మాత్రము బొత్తుగా ప్రవేశము లేదండి."
english = "I have good command in local language, geography, history, and Sanskrit, but in mathematics I have absolutely no grip at all."

[[sections.items]]
n = 8
telugu = "\"రూపాయికి అణాలు ఎన్ని?\" అని అడిగినచో చెప్పలేనండి; కాఁ బట్టి గణితములోనే నాకు భయము."
english = "If asked \"How many annas in a rupee?\" I cannot say — so mathematics is what I am afraid of."

[[sections.items]]
n = 9
telugu = "భయపడినయెడల నేమి లాభము?"
english = "What is the use of being afraid?"

[[sections.items]]
n = 10
telugu = "దైర్యముతో గణితమును ఎక్కువగా అనేక పర్యాయములు పరిచుము."
english = "Practise mathematics courageously, many times over."

[[sections.items]]
n = 11
telugu = "అప్పుఁడు నీకు భయముండదు."
english = "Then you will have no fear."

[[sections.items]]
n = 12
telugu = "పరీక్షయందు జయమును పొందినచో నాలుగు బెంకాయలను కొస్తేదను."
english = "If you succeed in the exam, I will buy you four betel nuts."

[[sections.items]]
n = 13
telugu = "నే నిక్కఁడ నుండవలెనో, వెళ్ళవలెనో, మొనాన్నఁ నడిగిరమ్ము- ఉండమనినచో నుండను, పొమ్మనినచో పోదును."
english = "Whether I should stay here or go — ask the day after tomorrow; if told to stay, I will not stay; if told to go, I will not go."

[[sections.items]]
n = 14
telugu = "నాకేమాటయును తెలియలేదు."
english = "I do not know anything about this."
