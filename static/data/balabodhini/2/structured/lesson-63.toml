[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "అద్య శ్రకం త్వయైవ మంథితవ్యం."
english = "Today the curd must be churned by you alone."

[[sections.items]]
n = 2
sanskrit_telugu = "తవాంబా బహిర రా సీత్."
english = "Your mother has gone outside."

[[sections.items]]
n = 3
sanskrit_telugu = "బాధం అహామేవ మంథిష్యామి."
english = "Alright, I myself will churn."

[[sections.items]]
n = 4
sanskrit_telugu = "గృహే సుతరాం ఘృతం నాస్తి; కిం కర్తవ్యం?"
english = "There is absolutely no ghee in the house; what is to be done?"

[[sections.items]]
n = 5
sanskrit_telugu = "నవనీతం అస్తిఖలు; తత్ ద్రావయ; ఏకదినస్య యథాకథంవా ద్రక్ష్యామః శ్రకమంథనానంతరం మమాంగవస్త్రం కూపసమీపం నీత్వా ఈషత్ ధావ."
english = "There is butter isn't there; melt that; somehow we will manage for one day. After churning the curd, take my body-cloth near the well and wash it a little."

[[sections.items]]
n = 6
sanskrit_telugu = "మామ ఇదానీం అవకాశః నాస్తి; భోజనానంతరం యుష్మద్వస్త్రంధావేయం."
english = "I have no time now; after the meal I would wash your clothes."

[[sections.items]]
n = 7
sanskrit_telugu = "గృథ్రాః తటాకస్థా న్సురావా నమృ త్కాన్ ఖాదంతి."
english = "Vultures eat the dead fish or creatures lying in the pond."

[[sections.items]]
n = 8
sanskrit_telugu = "తీరే జంబుకః ఏకః ఉపావిశత్ పశ్య."
english = "Look, a jackal has settled on the bank."

[[sections.items]]
n = 9
sanskrit_telugu = "యథాకథంవా గృథ్రం పాతయిత్వా ఖాదితుం తత్రాస్తి."
english = "It is there to somehow knock down the vulture and eat it."

[[sections.items]]
n = 10
sanskrit_telugu = "తవ ఉపాధ్యాయః సర్వేషాం పుత్రాణాం వివాహాన్ అకరోత్ కిం?"
english = "Did your teacher arrange the marriages of all the sons?"

[[sections.items]]
n = 11
sanskrit_telugu = "కథం కరిష్యతి?"
english = "How will he manage?"

[[sections.items]]
n = 12
sanskrit_telugu = "ఏషః క్షామకాళే."
english = "This is a time of famine."

[[sections.items]]
n = 13
sanskrit_telugu = "అపిచ."
english = "Moreover,"

[[sections.items]]
n = 14
sanskrit_telugu = "అస్మదుపాధ్యాయః కాశీదేశస్థః గౌడ బ్రాహ్మణః."
english = "Our teacher is a Gauḍa Brāhmaṇa from the Kāśī region."

[[sections.items]]
n = 15
sanskrit_telugu = "తత్రజీవనాభావేన అస్మద్దేశం ఆగత్య అత్ర జీవనం కరోతి."
english = "Unable to sustain a livelihood there, he came to our region and makes his living here."

[[sections.items]]
n = 16
sanskrit_telugu = "ఏవంస్థితే గౌడ బ్రాహ్మణాః మత్యాన్ అశ్నంతీతి బహుజనాః వదంతి."
english = "In such circumstances, many people say that Gauḍa Brāhmaṇas eat fish."

[[sections.items]]
n = 17
sanskrit_telugu = "తస్మాత్ కారణాత్ అస్మద్దేశే బ్రాహ్మణేమ ఏకోఽపి అస్మదుపాధ్యాయపుత్రేభ్యః కన్యాం న దాస్యతి."
english = "For that reason, not even one Brāhmaṇa in our region will give a daughter to our teacher's sons."

[[sections.items]]
n = 18
sanskrit_telugu = "అతః తేషాం కథం వివాహాః భవిష్యతి?"
english = "Therefore how will their marriages happen?"

[[sections]]
type = "passage_translation"
language = "telugu"

[[sections.items]]
n = 1
telugu = "ఎవరు మా చెఱువులో చేఁపలను పట్టుకొనుచున్నారు?"
english = "Who is catching fish in our pond?"

[[sections.items]]
n = 2
telugu = "ఏమో నే నెఱుఁగను."
english = "I do not know."

[[sections.items]]
n = 3
telugu = "చాలకోఁతులు కొండదగ్గర నున్నఁ చెట్టయం దెట్లు వ్రేలాడుచున్నవో చూడుఁడు."
english = "Look how many monkeys are hanging from the tree near the hill!"

[[sections.items]]
n = 4
telugu = "మేము నిన్నఁ నొక కోతిని పట్టుకొన్నాము."
english = "Yesterday we caught a monkey."

[[sections.items]]
n = 5
telugu = "అది కొంతసేపు మా యింటిలో (నున్నట్లేయుండి = స్థితఃఇవస్థిత్వా) పాఱిపోయినది."
english = "After staying in our house for a while (as if settled = sthitaḥ iva sthitvā), it ran away."

[[sections.items]]
n = 6
telugu = "దానికొఱకు (వెదకుచున్నాను = మార్గయామి) నీకెక్కఁడ నైనఁగనఁబడెనా తాతాచార్యులగారి యింటిమొంద నొక కోతిని నిన్నఁ చూచినాను."
english = "I am searching for it (= mārgayāmi) — did you see it anywhere? I saw a monkey in front of Tātācāryulu's house yesterday."

[[sections.items]]
n = 7
telugu = "అదే మీఁ కోతియేమో!"
english = "That might be your monkey!"

[[sections.items]]
n = 8
telugu = "మాకు తోలు లేదుగాని యొకటి (అమ్మవచ్చినచో = విక్రేతుం ఆగచ్చేదఖది) విచారించి చెప్పఱిము."
english = "We do not have a hide, but if someone comes to sell one (= vikretum āgacchedakhadi), inquire and let us know."

[[sections.items]]
n = 9
telugu = "నేను కొనెదను."
english = "I will buy it."

[[sections.items]]
n = 10
telugu = "మీఁ అన్నఁకు ఏ యూరిలో ఉద్యోగమయినది?"
english = "In which town did your elder brother get a job?"

[[sections.items]]
n = 11
telugu = "నెల్లూరులో అయినది."
english = "It happened in Nellore."

[[sections.items]]
n = 12
telugu = "అక్కఁడ అన్ని పదార్థములును దొరకునా?"
english = "Are all things available there?"

[[sections.items]]
n = 13
telugu = "అన్నియును దొరకునుగాని నెయ్యి మాత్రము మంచిది దొరకదు."
english = "Everything is available, but good ghee alone cannot be found."

[[sections.items]]
n = 14
telugu = "అయినచో నెట్లు భోజనము చేయుచున్నాఁడు?"
english = "Then how is he managing his meals?"

[[sections.items]]
n = 15
telugu = "ప్రతి నెల మన యూరినుండి నేను పంపుదును."
english = "Every month I send it from our town."
