# ── passage ──

[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "అరే బాలక! నాగదంతే మామ అంగవస్త్రం లంబయ' నోచేత్ గృహేవా లంబయ భో బాలక! తక్రే మక్షికాః పతిష్యంతి కింవా గత్వాపశ్యసివా నవా."
english = "Hey boy! Hang my upper garment on the peg; if not there, hang it in the house. Boy! Will flies fall into the buttermilk? Go and look, will you or not."

[[sections.items]]
n = 2
sanskrit_telugu = "కటాహే జలం అస్తిరే నోచేత్ త్వం రుటితి తటాకం గత్వా పానీయం ఆనీయ కటాహాం పూరయ."
english = "Is there water in the pot? If not, go quickly to the tank and fetch water and fill the pot."

[[sections.items]]
n = 3
sanskrit_telugu = "అనేకే బాంధవాః స్నానార్థం ఆగచ్ఛన్ హ్యః నక్తం మామ నిద్రాసమయే ఏకః ఖనకః ఆగత్య అన్నపాత్రం అధః అపాతయత్."
english = "Many relatives came for bathing. Last night, while I was sleeping, a rat came and knocked down the food vessel."

[[sections.items]]
n = 4
sanskrit_telugu = "అనంతరం ఏకఃమూషకః మామ కనిష్ఠికాం శ్నైః అదశత్."
english = "Then a mouse slowly bit my little finger."

[[sections.items]]
n = 5
sanskrit_telugu = "తత్ర ఘరట్ట సమీపే మూసలం అస్తి; ఇత్థం అనేష్యసి కిం?"
english = "The pestle is near the grinding mill there; will you not bring it here?"

[[sections.items]]
n = 6
sanskrit_telugu = "ఘరట్టుః కుత్రా స్వావ మయానఽ జ్ఞాయతే; తవ పఠనానంతరం త్వమేవ గత్వా ఆనయ మూసలం."
english = "Where the grinding mill is, I do not know; after your studies are done, you yourself go and bring the pestle."

[[sections.items]]
n = 7
sanskrit_telugu = "హ్యః ప్రాతరస్మ దావరణే ఏకం శూర్పం ఆసీత్."
english = "Yesterday morning there was a winnowing basket in our courtyard."

[[sections.items]]
n = 8
sanskrit_telugu = "తస్మిన్ ఏకః రక్తపుచ్ఛః అవసత్."
english = "In it, a red-tailed creature dwelt."

[[sections.items]]
n = 9
sanskrit_telugu = "తం దృష్ట్వా తవ అనుజః అమారయ ద్రే అబ్రహ్మాకృఙం."
english = "Seeing it, your younger brother killed it — poor creature, how sinful!"

[[sections.items]]
n = 10
sanskrit_telugu = "మంథానః, కటుః, ఉలూఖలం చ ఏకత్ర ఏవ సంతి."
english = "The churn, the mat, and the mortar are all in one place."

[[sections.items]]
n = 11
sanskrit_telugu = "హేఅంబ! మామ చేలం జటే ఆపతత్; ఈషత్ శోషయిష్యసికిం ?"
english = "O mother! My garment fell into the well; will you dry it a little?"

[[sections.items]]
n = 12
sanskrit_telugu = "యుష్మద్గృహే అద్య ప్రా॰తః దశ నకులాన్ అహా మపశ్యం."
english = "This morning I saw ten mongooses in your house."

[[sections.items]]
n = 13
sanskrit_telugu = "తేషాం మధ్యే ఏకః నకులః కుసూలే పతిత్వా ధాన్యం సర్వం అఖాదత్."
english = "Among them, one mongoose fell into the granary and ate up all the grain."

# ── passage_translation ──

[[sections]]
type = "passage_translation"
language = "telugu"

[[sections.items]]
n = 1
telugu = "నీకు ఆఁడుపిల్ల లెందఱియ్యా ? నాకు ఒక్కతే కూతురు."
english = "How many daughters do you have? I have only one daughter."

[[sections.items]]
n = 2
telugu = "అలాగా ? ఎందుకురా ఆ పిల్లను అలా బాధపెట్టుచున్నావు ? నీకేమి తెలియును?"
english = "Is that so? Why are you tormenting that girl like that? What do you know?"

[[sections.items]]
n = 3
telugu = "నిన్నుఁ నన్నుఁ చెఱుపుదగ్గఁఱి కొట్టినది, అయితే సరే మొదటు తమ్మునిఁ పాలను త్రాగించి, తరువాత పరుండఁబెట్టుము."
english = "She struck (both) you and me, causing harm — well, never mind; first give the younger brother his milk to drink, and then put him to bed."

[[sections.items]]
n = 4
telugu = "వాఁడెక్కడ నుండెనో నీకు తెలియునా ? చూడుచూడు ఆ చెట్టుమొంద వ్రేలాడుచున్నాఁడు."
english = "Do you know where he was? Look, look — he is hanging from that tree trunk."

[[sections.items]]
n = 5
telugu = "నీవు మెల్లగా అక్కడకు వెళ్ళి వానిని తీసికొని రమ్ము, కాని వానిని భయపెట్టవద్దు."
english = "Go there slowly and bring him here, but do not frighten him."

[[sections.items]]
n = 6
telugu = "మాకు గుఱ్ఱములెన్ని యున్నవి ? ఎద్దులెన్ని యున్నవి?"
english = "How many horses do we have? How many bullocks do we have?"

[[sections.items]]
n = 7
telugu = "నానా! మనయింట్లో దోసవరు గున్నదా?"
english = "Grandfather! Is there a cucumber creeper in our house?"

[[sections.items]]
n = 8
telugu = "నులకమంచముమొంద కంబళి యుండెనే ఎవఁడు తీసికొని వెళ్ళినాఁడు?"
english = "There was a blanket on the rope cot — who has taken it away?"

[[sections.items]]
n = 9
telugu = "నిన్నుఁ ఒక బళ్ళి మఱ్ఱిగలో పడ్డది."
english = "Yesterday a lizard fell into the buttermilk."

[[sections.items]]
n = 10
telugu = "అబ్బాయిని బాగుగా మొదటు చదివించుము."
english = "First have the boy taught properly."

[[sections.items]]
n = 11
telugu = "వెనుక వ్రాయించుము."
english = "Afterwards have him made to write."

[[sections.items]]
n = 12
telugu = "ఈఁ రవికను ఎవరు అక్కడ వ్రేలాడవేసినారు."
english = "Who has hung this blouse there?"

[[sections.items]]
n = 13
telugu = "తీగెయందు పూలు బొత్తుగా లేకున్నవి."
english = "There are no flowers at all on the creeper."
