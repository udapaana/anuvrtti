# ── passage ──

[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "గర్భగృహే కటుః అస్తి శీఘ్రు మానయ; బహిః కేవా రథ్యాయాం సంతి."
english = "The mat is in the inner room; bring it quickly. Who is outside in the street?"

[[sections.items]]
n = 2
sanskrit_telugu = "తాన్ అంతః ఆహ్వాయ-కోటే అనేకే మత్కుణాః సంతి."
english = "Call them inside — there are many bedbugs in the corner."

[[sections.items]]
n = 3
sanskrit_telugu = "సర్వాన్ దోషయః కింభో! తవ అంబా కిమర్థం ఖనిత్రేణ అవరణే ఖనతి ?"
english = "Drive all of them away. Hey! Why is your mother digging in the yard with a spade?"

[[sections.items]]
n = 4
sanskrit_telugu = "ఘురికాం ఆనయరే - ఉర్వారుకం భేదయిత్వా భక్షయామ ?"
english = "Bring the knife — shall we cut open the cucumber and eat it?"

[[sections.items]]
n = 5
sanskrit_telugu = "అరేరే శ్వనకః తం శశం ద్రావ యతిరే! మారయిష్యతి కింవా కిం కరవామ ?"
english = "Hey! The dog is chasing that rabbit! Will it kill it? What shall we do?"

[[sections.items]]
n = 6
sanskrit_telugu = "అవరణే పుష్పాణి సంతిచేత్ దేవపూజార్థం శీఘ్రు మానయ."
english = "If there are flowers in the yard, bring them quickly for the worship of God."

[[sections.items]]
n = 7
sanskrit_telugu = "హే బాలికే తత్ర గోమయేన కిం కరోషి ?"
english = "Hey girl! What are you doing there with the cow dung?"

[[sections.items]]
n = 8
sanskrit_telugu = "రామః పాఠం పంచకృత్వః లిఖిత్వా శతకృత్వః అపఠత్."
english = "Rāma wrote the lesson five times and recited it a hundred times."

[[sections.items]]
n = 9
sanskrit_telugu = "అరే తూష్ణీం ఆలోచయసి కిం రే! ఫలకోపరి బాలకః అస్తివా నవా విచారయ."
english = "Hey, why are you thinking silently? Check whether the boy is on the plank or not."

[[sections.items]]
n = 10
sanskrit_telugu = "భో జనక! అనుజః మందపస్య అధః నవనీతం ఖాదతి."
english = "O father! The younger brother is eating butter under the shelf."

[[sections.items]]
n = 11
sanskrit_telugu = "కించత్కిరమపి పిబతి."
english = "He is also drinking something."

[[sections.items]]
n = 12
sanskrit_telugu = "పిబతిచేత్, పిబతు."
english = "If he is drinking, let him drink."

[[sections.items]]
n = 13
sanskrit_telugu = "త్వం తూష్ణీం ఏధి."
english = "You be quiet."

[[sections.items]]
n = 14
sanskrit_telugu = "మామ వస్త్రం కః నిరపీడయత్ ?"
english = "Who wrung out my garment?"

[[sections.items]]
n = 15
sanskrit_telugu = "తే బాలకాః నిరపీడయన్."
english = "Those boys wrung it out."

[[sections.items]]
n = 16
sanskrit_telugu = "ప్రతిదినం ప్రాతః సాయంచ దేవస్య ద్విః నమస్కారం కుధు॰త్రిః సంధ్యావందనం కురు."
english = "Every day, morning and evening, prostrate yourself before God twice; perform the twilight prayer three times."

[[sections.items]]
n = 17
sanskrit_telugu = "శివరాత్రి దినే ఏకవారం దివావా, నక్తం వా ఫలహారం కురుత."
english = "On the day of Śivarātri, take a meal of fruits once, either by day or by night."

[[sections.items]]
n = 18
sanskrit_telugu = "ద్వారే ఖరః అస్తి దూరం ద్రావయ."
english = "There is a donkey at the door; drive it away."

# ── passage_translation ──

[[sections]]
type = "passage_translation"
language = "telugu"

[[sections.items]]
n = 1
telugu = "బాణాలిలో నూనెను పోయుము."
english = "Pour oil into the lamp."

[[sections.items]]
n = 2
telugu = "వారు కొడవలితో తీగను కొసిరి."
english = "They cut the creeper with a sickle."

[[sections.items]]
n = 3
telugu = "ఆఁదోతు నిన్ను సందేవేశ మాయింటిలో పిండిని తిన్నది."
english = "Yesterday evening a cow came into our house and ate the flour."

[[sections.items]]
n = 4
telugu = "గొడయందు బల్లిని పిల్లి చంపినది."
english = "The cat killed a lizard on the wall."

[[sections.items]]
n = 5
telugu = "గవ్విలము గిన్నెలో నూనెను త్రాగినది."
english = "A mongoose drank the oil in the bowl."

[[sections.items]]
n = 6
telugu = "అరేఅరే పాములు వెళ్ళుచున్నవి."
english = "Oh! Snakes are going by!"

[[sections.items]]
n = 7
telugu = "చూచినావురా! తేడుకేది; పాములుకావు ఉడుతలురా."
english = "Did you see? What difference — they are not snakes, they are squirrels, man."

[[sections.items]]
n = 8
telugu = "అయితే తేళ్ళు అని చెప్పెదవేమి ?"
english = "So then will you say they are scorpions?"

[[sections.items]]
n = 9
telugu = "దేవుఁడు వాహానముమొంద వచ్చుచున్నాఁడు."
english = "The deity is coming on the vehicle (in procession)."

[[sections.items]]
n = 10
telugu = "ఇప్వేళ మొరు కంచములో అన్నమును తినుచున్నారేమి ?"
english = "Are they eating rice from a bronze plate now?"

[[sections.items]]
n = 11
telugu = "మాయింటిలో ఆకులు లేవుగా, తలుపుదగ్గఁఱి ఆ పొడుమేమి?"
english = "There are no (banana) leaves in our house, you know — what is that powder near the door?"

[[sections.items]]
n = 12
telugu = "మాయింటిలో ఇప్వేళ వంకాయ కూరను వండించినాము."
english = "Today we had brinjal curry cooked in our house."

[[sections.items]]
n = 13
telugu = "మాయింటిలో చాల దోమలున్నవిరా."
english = "There are so many mosquitoes in our house, man."

[[sections.items]]
n = 14
telugu = "నీఁఫడుతు తర్వాత నిన్నుఁ నేను మళ్ళి చూడకేది."
english = "After you fell, I did not see you again."

[[sections.items]]
n = 15
telugu = "రేపు నాకు మీఁ పెయ్యుదూడను చూపించుము."
english = "Tomorrow show me your female calf."

[[sections.items]]
n = 16
telugu = "మీఁ ఆవు పాలు ఇచ్చుచున్నదా?"
english = "Is your cow giving milk?"

[[sections.items]]
n = 17
telugu = "చంటి పిల్లకు గజ్జెలు లేవు."
english = "The infant has no anklet bells."

[[sections.items]]
n = 18
telugu = "పోనిమ్ము."
english = "Let it be; never mind."
