[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "తాతాచార్యస్య పుత్రః గతదినే ఏకం శ్వనకం దండేన అతాడయత్."
english = "Tātācārya's son, on a previous day, struck a dog with a stick."

[[sections.items]]
n = 2
sanskrit_telugu = "శ్వనకః అలర్కః."
english = "The dog was rabid (a mad dog)."

[[sections.items]]
n = 3
sanskrit_telugu = "తస్మాత్కారణాత్ సః శ్వనకః తాతాచార్యస్య పుత్రం అప్పులాచార్యం పాదం అదశత్."
english = "For that reason, the dog bit Tātācārya's son Appulācārya on the foot."

[[sections.items]]
n = 4
sanskrit_telugu = "అనంతరం కతిచిద్దినాని గతాని - తదానీంతా సర్వాపి అశామ్యత్."
english = "Afterwards, a few days passed — by that time, everything had calmed down."

[[sections.items]]
n = 5
sanskrit_telugu = "ఇదానీం తత్పాదే ఏకః వ్రణః ఉదతిష్ఠత్కిల."
english = "Now, a sore has apparently arisen on that foot."

[[sections.items]]
n = 6
sanskrit_telugu = "తం బాలకం (వైద్యాలయం = ఆసుపత్రికి) అనయన్."
english = "They took that boy to the hospital."

[[sections.items]]
n = 7
sanskrit_telugu = "వైద్యః వ్రణం అచ్చేదయత్."
english = "The doctor lanced (cut open) the wound."

[[sections.items]]
n = 8
sanskrit_telugu = "ఇతఃపరం కథంభవిష్యతివా కేన జ్ఞాయతే."
english = "How it will be hereafter — who can know?"

[[sections.items]]
n = 9
sanskrit_telugu = "హేఅంబ! అనుజస్య మస్తకే అతీవ యూకాలిక్షం అస్తి."
english = "O mother! There are very many lice and nits on the younger one's head."

[[sections.items]]
n = 10
sanskrit_telugu = "తం ఆహహాయ కంకతికయా తత్సర్వం అపనయ."
english = "Call him over and remove all of it with a comb."

[[sections.items]]
n = 11
sanskrit_telugu = "రే రామ! అవరణే ఏకం శివకం (నిఘాయ = ప్రొతి) తత్ర మహిషం బధాన."
english = "Hey Rāma! Drive a peg into the enclosure and tie the buffalo there."

[[sections.items]]
n = 12
sanskrit_telugu = "తత్రస్థితం గోధనం అజకం చ వనం చారయ."
english = "Graze the cattle and goats that are there in the forest."

[[sections.items]]
n = 13
sanskrit_telugu = "బలిద్ధాచార్యాయ సీతాపతిః ప్రథమతః కన్యాం దాస్యామోతి కథయిత్వా అంతః తం ఆవంచయత."
english = "Sītāpati first said he would give his daughter to Baliddhācārya, but then deceived him in the end."

[[sections.items]]
n = 14
sanskrit_telugu = "కిమరే ఏవం విశ్వాస్య కంఠచ్చేదనం యుక్తం కిం?"
english = "Hey, is it proper to cut someone's throat after winning their trust like this?"

[[sections.items]]
n = 15
sanskrit_telugu = "యుష్మద్దా మే గుడం దుర్లభం కిం?"
english = "Is jaggery hard to obtain for me from you?"

[[sections.items]]
n = 16
sanskrit_telugu = "ఘరట్టుపుంఖః కుత్రాస్తి వా పశ్య."
english = "Look and see where the handle of the hand-mill is."

[[sections.items]]
n = 17
sanskrit_telugu = "గృహే తందులపిష్టం నాస్తి."
english = "There is no rice flour in the house."

[[sections.items]]
n = 18
sanskrit_telugu = "ఈషత్ భ్రామయిష్యామి."
english = "I will grind (turn) it a little."

[[sections.items]]
n = 19
sanskrit_telugu = "ప్రథమతః కన్యకాం ద్రష్ట్వా."
english = "First, having seen the girl."

[[sections.items]]
n = 20
sanskrit_telugu = "అనంతరం వివాహాః ఆలోచయితవ్యః."
english = "Afterwards, the marriage must be considered."

[[sections.items]]
n = 21
sanskrit_telugu = "అద్య ఆకాశే మేఘాః సాంద్రాః సంతి."
english = "Today the clouds in the sky are dense."

[[sections.items]]
n = 22
sanskrit_telugu = "బహుళఒ వర్థం పతిష్యతి కింవా."
english = "Will heavy rain fall, or not?"

[[sections.items]]
n = 23
sanskrit_telugu = "పతిష్యతిచే ద్వయం సర్వేపి కృతారాః ఏవఖలు."
english = "If it does fall, then everyone will certainly be well-served."

[[sections]]
type = "passage_translation"
language = "telugu"

[[sections.items]]
n = 1
telugu = "మొతండ్రి యేమో చెప్పఱిచున్నాఁడు వినిరమ్ము."
english = "Father is saying something — come and listen."

[[sections.items]]
n = 2
telugu = "నీవు చెఱువుదగ్గరకు వెళ్ళుచున్నావు; గనుక స్నానము చేయకుండ రావద్దు."
english = "You are going to the pond, so do not come back without bathing."

[[sections.items]]
n = 3
telugu = "మల్లెచెట్టుక్రింద పూవులు పడినవిగాని ప్రోగుచేయుము."
english = "Flowers have fallen under the jasmine plant — gather them."

[[sections.items]]
n = 4
telugu = "అరే నీశరీరమునందు అంతటను గఱ్ఱి అట్లున్నఁ దేమిరా?"
english = "Hey, why is scabies all over your body like that?"

[[sections.items]]
n = 5
telugu = "వైద్యుని యొద్ద నొషధము పుచ్చుకొనుము."
english = "Get medicine from the doctor."

[[sections.items]]
n = 6
telugu = "మాదున్నఁ యెక్కఁడికో పాఱిపోయినది."
english = "Our buffalo has run off somewhere."

[[sections.items]]
n = 7
telugu = "చూచి చూచి వచ్చినాను."
english = "I looked and looked and came back."

[[sections.items]]
n = 8
telugu = "ఎక్కఁడను కనఁబడలేదండి."
english = "She was not found anywhere, sir."

[[sections.items]]
n = 9
telugu = "నన్నుఁ పురాణము చెప్పఱిమనెదవుగదా."
english = "You are asking me to recite the Purāṇa, aren't you?"

[[sections.items]]
n = 10
telugu = "ఎవరు వినఁగలరు?"
english = "Who can listen?"

[[sections.items]]
n = 11
telugu = "నేను ఒకఁడను వినఁగలను గదా!"
english = "I alone can listen, can't I?"

[[sections.items]]
n = 12
telugu = "సరియే నీవు వినుము."
english = "Alright then, you listen."

[[sections.items]]
n = 13
telugu = "నేను చెప్పెదను."
english = "I will recite."

[[sections.items]]
n = 14
telugu = "నాకు బలము తగ్గిపోవుచున్నదిరా."
english = "My strength is declining."

[[sections.items]]
n = 15
telugu = "ఇఁకమొంద చలినీటిలో స్నానమును చేయఁజాలనురా."
english = "Henceforth I cannot bathe in cold water."

[[sections.items]]
n = 16
telugu = "పిల్లను ఊచుము; ఎందుకు నన్నుఁ జూచి నవ్వెదవు?"
english = "Swing the child; why are you looking at me and laughing?"

[[sections.items]]
n = 17
telugu = "నవ్వించుచున్నాఁవు గనుక నేను నవ్వుచున్నాను."
english = "Because you are making me laugh, I am laughing."

[[sections.items]]
n = 18
telugu = "నీ కాలిమొంద పుండెట్లున్నది?"
english = "How is the sore on your foot?"

[[sections.items]]
n = 19
telugu = "బొత్తుగా తగ్గిపోయినది."
english = "It has completely subsided."

[[sections.items]]
n = 20
telugu = "పిల్లకాయ లందఱును నా మాటలను వినుచున్నారు."
english = "All the children are listening to my words."

[[sections.items]]
n = 21
telugu = "అయ్యా! మాకు మిక్కిలి డబ్బున్నదిగదా."
english = "Sir! We do have quite a lot of money."

[[sections.items]]
n = 22
telugu = "దరిద్రులవలె మీఁ అమ్మాయి పెండ్లిని గుళ్ళో చేసితిరేమి?"
english = "Why did you conduct your daughter's wedding in the temple like paupers?"

[[sections.items]]
n = 23
telugu = "ఈ కఱువు కాలములో నిశ్చే చేయవలె."
english = "In this time of famine, one must do it frugally."
