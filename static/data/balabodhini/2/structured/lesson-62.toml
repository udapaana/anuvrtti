[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "కాకస్య కాకపోతః రమణీయః."
english = "The young crow of the crow is charming."

[[sections.items]]
n = 2
sanskrit_telugu = "శుకానాం శుకకిశోరాః రమణీయాః."
english = "The young parrots of the parrots are charming."

[[sections.items]]
n = 3
sanskrit_telugu = "ప్రతిదినం అరణ్యే సర్వత్ర ఝిల్లికాః (రటంతి = ఆఱుచుచుండును.)"
english = "Every day crickets chirp everywhere in the forest."

[[sections.items]]
n = 4
sanskrit_telugu = "యుష్మజ్జనకేన విరచితః శ్లోకః కః?"
english = "What is the verse composed by your father?"

[[sections.items]]
n = 5
sanskrit_telugu = "కిమరే బాలక! త్వయా కిమపి దోష్టిం కృతం కిం?"
english = "What is this, boy! Did you do something wrong?"

[[sections.items]]
n = 6
sanskrit_telugu = "ఇతః పూర్వం కిమర్థం త్వా ముపాధ్యాయః అతాడయత్?"
english = "For what reason did the teacher beat you before this?"

[[sections.items]]
n = 7
sanskrit_telugu = "ప్రథమతః ఏతత్పుస్తకం త్వం గృహాణ."
english = "First, you take this book."

[[sections.items]]
n = 8
sanskrit_telugu = "అనంతరం ఉపాధ్యాయస్య వృత్తాంతం కథయిష్యామి."
english = "After that I will tell you what happened with the teacher."

[[sections.items]]
n = 9
sanskrit_telugu = "ఆకర్ణయ."
english = "Listen."

[[sections.items]]
n = 10
sanskrit_telugu = "అస్మత్పాఠశాలాయాం ఏకఃకుక్కుటః ప్రావిశత్."
english = "A rooster entered our school."

[[sections.items]]
n = 11
sanskrit_telugu = "తదా మామ సమీపే ఆగచ్చత్."
english = "Then it came near me."

[[sections.items]]
n = 12
sanskrit_telugu = "అహాం తం కుక్కుటం హస్తేన గృహీత్వా అన్య బాలకస్య ఉపరి అపాతయం."
english = "I grabbed that rooster with my hand and threw it on another boy."

[[sections.items]]
n = 13
sanskrit_telugu = "ततः ఉపాధ్యాయః మాం దృష్ట్వా ఈష దకుప్యత్."
english = "Then the teacher saw me and became a little angry."

[[sections.items]]
n = 14
sanskrit_telugu = "నోచే త్కిమర్థం కోపిష్యతి సత్యం అవదః."
english = "Otherwise why would he get angry? Tell the truth."

[[sections.items]]
n = 15
sanskrit_telugu = "సమస్తాయం త్వం దుష్టః ఇతి సర్వే బాలకాః వదంతి."
english = "All the boys say that you are altogether wicked."

[[sections.items]]
n = 16
sanskrit_telugu = "వదంతిచే ద్వదంతు మామ కిం భయం?"
english = "Let them say so — what fear do I have?"

[[sections.items]]
n = 17
sanskrit_telugu = "ఇతః పూర్వం యుష్మత్పాఠశాలాయాం ఏకః మయూరః ఆసీత్."
english = "Earlier there was a peacock in your school."

[[sections.items]]
n = 18
sanskrit_telugu = "స ఇదానీం న దృశ్యతే; కుత్రాస్తిరే?"
english = "It is not visible now; where is it?"

[[sections.items]]
n = 19
sanskrit_telugu = "అస్మాకం వాక్యం ఆకర్ణ యసిచేత్రవ క్షేమః భవిష్యతి నోచేత్ త్వం వృథా దుష్యోఽ."
english = "If you listen to our words, you will be well; otherwise you will be ruined for nothing."

[[sections.items]]
n = 20
sanskrit_telugu = "వర్షాకాలః ఆగచ్చతి."
english = "The rainy season is coming."

[[sections.items]]
n = 21
sanskrit_telugu = "ఆకాశే సర్వత్ర మేఘాః దృశ్యంతే."
english = "Clouds are visible everywhere in the sky."

[[sections.items]]
n = 22
sanskrit_telugu = "యుష్మద్వృత్తుః తథా ధావతి తం గ్రహీతుం అస్మాసు కోఽ పి న సమర్థః."
english = "Your bull runs so fast that none of us is capable of catching it."

[[sections]]
type = "passage_translation"
language = "telugu"

[[sections.items]]
n = 1
telugu = "మీఁ అమ్మఁ పెరుగు చిలుకుచున్నదిగాని నేను పిలుచుచున్నానని యొక్కమారు పిలువుఱుఱు."
english = "Your mother is churning curd — go call her once and tell her that I am calling."

[[sections.items]]
n = 2
telugu = "చీమలు నెతిగిన్నె యొక్కఁ పైభాగమున అంటుకొనిపోయినవి."
english = "Ants have stuck to the top surface of the bronze bowl."

[[sections.items]]
n = 3
telugu = "ఈ కాలమునందు ఎద్దులను పెంచుటకు నాకు సామర్థ్యము లేదు గనుక వాటిని పంపివేయుదును."
english = "In these times I have no means to rear bullocks, so I will send them away."

[[sections.items]]
n = 4
telugu = "ఎవ్వరైనను కొందురేమో విచారించుము."
english = "Inquire whether anyone at all might buy them."

[[sections.items]]
n = 5
telugu = "ఏమండీ తాతాచార్యులుగారూ! మీఁ అమ్మాయిని మా అబ్బాయికిచ్చి పెండ్లిచేయుదురా లేదా?"
english = "Well, Tātācāryulu sir! Will you give your daughter in marriage to our son, or not?"

[[sections.items]]
n = 6
telugu = "మావల్ల మీఁ కెందుకు భయము?"
english = "Why should you fear anything from us?"

[[sections.items]]
n = 7
telugu = "ఓ పిల్లలు! మొరు మీఁ పాఠములను వేళకప్పుకుండ నప్పగించితిరేని మిమ్మును మేముకొట్టుము."
english = "O children! If you do not recite your lessons on time, we will beat you."

[[sections.items]]
n = 8
telugu = "నేను కొన్ని దినము లొక గరుడిని తెంచి మరల పంపితిని."
english = "For some days I kept a vulture and then released it again."

[[sections.items]]
n = 9
telugu = "బ్రతికినంత వరకు."
english = "As long as it lived."

[[sections.items]]
n = 10
telugu = "నేను చేతనయినంతవఱకు నీకు విద్యను చెప్పఱిదనుగాని నీవు ఈ యూళోపనుండి నా యొద్ద చదువుకొనుము."
english = "To the best of my ability I will teach you — but you must study with me starting from this very village."

[[sections.items]]
n = 11
telugu = "ఎందుకోగాని మొతండి నిన్నఁ నాన్మొంద కోపడినాఁడు మొపిల్లవాఁడు మిగుల నల్లఱిని జేయుచున్నాఁడుగాని వానిని పట్టుకొని కట్టుఁడు."
english = "For some reason our father got angry at us yesterday — that boy is causing a great commotion; catch hold of him and tie him up."

[[sections.items]]
n = 12
telugu = "మాఱిమ్యులు ప్రతిదినమును యథావిధిగా సంధ్యావందనము చేయుచున్నారు."
english = "Our brothers perform the sandhyāvandana properly every day."

[[sections.items]]
n = 13
telugu = "కొంచెము ధాన్యమును సంగ్రహించిపెట్టుము."
english = "Set aside a little grain in storage."
