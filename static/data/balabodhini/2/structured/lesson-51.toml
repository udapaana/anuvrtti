# ---- passage (Sanskrit) ----

[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "శ్వః భానువాసరే దివా పుష్యమానక్షత్రే రామస్య వివాహః భవిష్యతి."
english = "Tomorrow on Sunday during the day under the Puṣya asterism, Rāma's wedding will take place."

[[sections.items]]
n = 2
sanskrit_telugu = "యూయం సర్వేపి తదా ఆగచ్చత."
english = "All of you come at that time."

[[sections.items]]
n = 3
sanskrit_telugu = "మామ ధనం నాస్తి."
english = "There is no money with me."

[[sections.items]]
n = 4
sanskrit_telugu = "చేత్ కిం."
english = "Even so, what of it?"

[[sections.items]]
n = 5
sanskrit_telugu = "వివాహం యథావిధి కరిష్యామి."
english = "I will perform the wedding according to the proper rites."

[[sections.items]]
n = 6
sanskrit_telugu = "గోపాలస్య జనకః పింగళసంవత్సరే కార్తికమాసే కాలమకరోత్."
english = "Gopala's father passed away in the month of Kārtika in the year Piṅgala."

[[sections.items]]
n = 7
sanskrit_telugu = "తదా అహాం గ్రామే నాసం."
english = "At that time I was not in the village."

[[sections.items]]
n = 8
sanskrit_telugu = "త్వం దుర్బలః తతఃశీతోదకే స్నానం మాకురు."
english = "You are weak; so do not bathe in cold water."

[[sections.items]]
n = 9
sanskrit_telugu = "అహాం ప్రతిదినం ఉష్ణోదకే ఏవ స్నానం కరోమి."
english = "I bathe only in hot water every day."

[[sections.items]]
n = 10
sanskrit_telugu = "కిమరే! తవసుతరాం జ్ఞానం నాస్తిరేకిమర్థం బాలికాంతథా తాడయసి?"
english = "What! You have no sense at all — why do you beat the girl like that?"

[[sections.items]]
n = 11
sanskrit_telugu = "సా దోష్టిం కరోతి చేత్ కిం కరవాణి?"
english = "If she misbehaves, what am I to do?"

[[sections.items]]
n = 12
sanskrit_telugu = "అస్మదుపాధ్యాయః శ్వః ఆగమిష్యతి."
english = "Our teacher will come tomorrow."

[[sections.items]]
n = 13
sanskrit_telugu = "తస్య యత్రకుత్రాపి స్థలం కల్పయ."
english = "Arrange a place for him somewhere or other."

[[sections.items]]
n = 14
sanskrit_telugu = "ఇతఃపూర్వమేవ తటాకతటు స్థితచ్చేత్ స్థలంకల్పయిత్వా అస్థాపయం."
english = "Even before this, if there was space by the tank, I had arranged and kept a place."

[[sections.items]]
n = 15
sanskrit_telugu = "కృత అవరోక్ష్యతి యుష్మదుపాధ్యాయః."
english = "Your teacher will descend (arrive) having done (it)."

[[sections.items]]
n = 16
sanskrit_telugu = "యుష్మద్బాలికాయై ఏతత్స్థలం దాస్యసికిం?"
english = "Will you give this place to your daughter?"

[[sections.items]]
n = 17
sanskrit_telugu = "సా ఇదానీం అస్మదంబాం అనుధావతి."
english = "She is now running after our mother."

[[sections.items]]
n = 18
sanskrit_telugu = "ఆగమనానంతరం దాస్యామి --"
english = "I will give it after arriving --"

[[sections.items]]
n = 19
sanskrit_telugu = "వయం ఏకదా శ్రీశైలక్షేత్రం గత్వా ప్రథమం పాతాళగంగాయాం స్నానం కృత్వా అనంతరం దేవపూజార్థం సమకల్పయామ."
english = "We once went to the Śrīśaila shrine, first bathed in the Pātālagaṅgā, and then made arrangements for the worship of the deity."

[[sections.items]]
n = 20
sanskrit_telugu = "శంకరస్య హస్తే ధనాభావాత్ శ్రీశైలం ప్రతి నాగచ్చత్."
english = "Due to Śaṅkara's lack of money in hand, he did not go to Śrīśaila."

[[sections.items]]
n = 21
sanskrit_telugu = "వివాహాం కర్తుం సంకల్పయిష్యసి కిం ?"
english = "Will you resolve to perform the wedding?"

[[sections.items]]
n = 22
sanskrit_telugu = "త్వం కిమర్థం హ్యః రామం అన్వధావః?"
english = "Why did you chase Rāma yesterday?"

[[sections.items]]
n = 23
sanskrit_telugu = "సః స్నానార్థం తటాకం ప్రత్యగచ్చత్."
english = "He went towards the tank for bathing."

[[sections.items]]
n = 24
sanskrit_telugu = "శీతజలానయనార్థం తేనసాకం అధావం."
english = "I ran with him to fetch cold water."

[[sections.items]]
n = 25
sanskrit_telugu = "ఏతస్మిన్ దినే సూర్యః అతీవ ఉష్ణం ప్రకాశతే."
english = "On this day the sun shines very hotly."

[[sections.items]]
n = 26
sanskrit_telugu = "హ్యః నక్తం ఆకాశే చంద్రః శీతం ప్రాకాశత."
english = "Yesterday at night the moon shone coolly in the sky."

[[sections.items]]
n = 27
sanskrit_telugu = "ఏకః మార్జాలః అస్మదావరణే రక్తపుచ్చం అనుధావతి పశ్య పశ్య."
english = "Look, look — a cat in our courtyard is chasing a red-tailed (one)."

# ---- passage_translation (Telugu) ----

[[sections]]
type = "passage_translation"
language = "telugu"

[[sections.items]]
n = 1
telugu = "మీఁ తండ్రియొక్కఁ పెట్టెలో డబ్బున్న యెడల ఇట్లు తీసికొనిరమ్ము."
english = "If there is money in your father's box, bring it here."

[[sections.items]]
n = 2
telugu = "మా తండ్రిగారి పెట్టెలో డబ్బెక్కఁడ నున్నదండీఁనేను రేపు ప్రయాణమును చేయుటకు సంకల్పించితినిగాని నీవు కూడ నాతో వత్తువా?"
english = "Where is the money in our father's box, sir? I have resolved to travel tomorrow — will you also come with me?"

[[sections.items]]
n = 3
telugu = "రేపు ఉత్తరాయణ పుణ్యకాలము గదా; మా తండ్రి నన్నుఁ ఎక్కఁడికిను వెళ్ళవద్దని అన్నాఁడు."
english = "Tomorrow is the auspicious time of Uttarāyaṇa, you know — my father told me not to go anywhere."

[[sections.items]]
n = 4
telugu = "నీ పెట్టెలో డబ్బున్నదో లేదో నాకొకపర్యాయము చూపించుము; అటుపైన చెప్పెదను."
english = "Show me once whether there is money in your box or not; after that I will tell you."

[[sections.items]]
n = 5
telugu = "గ్రీష్మకాలమందు సూర్యుఁడెప్పుఁడును వేడిగనే వెలుగుచుండును."
english = "In summer the sun always shines hotly."

[[sections.items]]
n = 6
telugu = "శరత్కాలమందు రాత్రులయందు చంద్రుఁడు చక్కగా ప్రకాశించును సంధ్యావందనమునకు చోటు నేర్పఱచుము."
english = "In autumn at nights the moon shines beautifully. Arrange a place for the twilight prayer."

[[sections.items]]
n = 7
telugu = "ఏమిరా నాయనా ! మీఁ అమ్మతో కూడ మామగారింటికి భోజనమునకు వెళ్ళుదువా?"
english = "Dear boy, will you go with your mother to your maternal uncle's house for the meal?"

[[sections.items]]
n = 8
telugu = "అలాగే వెళ్ళెదను."
english = "Yes, I will go like that."

[[sections.items]]
n = 9
telugu = "వాని వెంట పరుగెత్తుచున్నా వెందుకురా?"
english = "Why are you running after him, man?"

[[sections.items]]
n = 10
telugu = "మా యింటిలో పెరుగు లేదుగాని ఇప్వేళ కొంచెము మఱ్ఱిగ ఈగిన్నెలోఁ బోయుము."
english = "There is no curd in our house, you know — pour a little into this bowl now by mistake (i.e., into any available bowl)."

[[sections.items]]
n = 11
telugu = "నాకు పెండ్లిని ఎప్పుడు చేయుదువు నాయనా!"
english = "When will you arrange my wedding, father?"

[[sections.items]]
n = 12
telugu = "ఈ నెల తరువాత చేయుదును."
english = "I will do it after this month."

[[sections.items]]
n = 13
telugu = "అంతవఱకును జాగ్రత్తగానుండుము."
english = "Until then, be careful."

[[sections.items]]
n = 14
telugu = "నీటిలో వెచ్చన లేదు."
english = "The water has no warmth."

[[sections.items]]
n = 15
telugu = "అంగడిలో జీలకఱ్ఱ ఉన్నదో లేదో విచారించుము."
english = "Find out whether cumin is available in the shop or not."

[[sections.items]]
n = 16
telugu = "నేను ఇప్పుడుండుటకు ఒక యింటిని ఏర్పరచినాను."
english = "I have arranged a house to stay in now."

[[sections.items]]
n = 17
telugu = "మాకు కూడ నొక యింటి నేర్పఱచుతువా ?"
english = "Will you arrange a house for us too?"

[[sections.items]]
n = 18
telugu = "రేపు సాయంకాలము మాయింటికి రమ్ము."
english = "Come to our house tomorrow evening."
