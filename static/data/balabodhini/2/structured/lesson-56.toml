# --- Passage ---

[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "రామః పూర్వేద్యుః అస్మాకం బహుళాం దండేన అతాడయత్."
english = "The day before yesterday Rāma beat our buffalo cow with a stick."

[[sections.items]]
n = 2
sanskrit_telugu = "యుష్మాభిః లిఖితం పుస్తకం కుత్రాస్తి? దేవదత్తః స్వగృహాయ అనయత్."
english = "Where is the book written by you (all)? Devadatta took it to his own home."

[[sections.items]]
n = 3
sanskrit_telugu = "దేవదత్తాయ కిమర్థం అయచ్చత్? కః అయచ్చత్; సఏవ అచోరయత్."
english = "Why did he give it to Devadatta? Who gave it? He himself stole it."

[[sections.items]]
n = 4
sanskrit_telugu = "అరే పాపిష్ఠ! మా తాడయ మహిషం."
english = "Hey, most wicked one! Don't beat the buffalo."

[[sections.items]]
n = 5
sanskrit_telugu = "ఏకః ఖంజః ద్వారే తిష్ఠతి."
english = "A lame person is standing at the door."

[[sections.items]]
n = 6
sanskrit_telugu = "తస్తైతందులాన్ యచ్చత."
english = "Give him rice."

[[sections.items]]
n = 7
sanskrit_telugu = "పాత్రస్థితం క్షీరం కేన పీతం? యుష్మత్తూత్రైః పీతం."
english = "By whom was the milk in the vessel drunk? It was drunk by your grandsons."

[[sections.items]]
n = 8
sanskrit_telugu = "మామ పుత్రాః గృహే ఏవ నసంతిఖలు."
english = "My sons are not at home, indeed."

[[sections.items]]
n = 9
sanskrit_telugu = "తైః కథం పీతం? త్వం సర్వదా అనత్వమేవ వదసి రామకృష్ఠ! తులసీ దళాని త్వయా భేదితాని కిం? నహినహి గోపాలః అభేదయత్."
english = "How did they drink it? Rāmakṛṣṭha, you always say what is untrue! Were the tulasī leaves split by you? No no, Gopāla split them."

[[sections.items]]
n = 10
sanskrit_telugu = "పూజాసమయఆసీత్."
english = "It was the time of worship."

[[sections.items]]
n = 11
sanskrit_telugu = "పుష్పాణి శీఘ్రం ఆనయేతి వద."
english = "Tell (him) to bring the flowers quickly."

[[sections.items]]
n = 12
sanskrit_telugu = "కో ః స్తి తత్ర వదితుం? రామాచార్యః స్వల్పద్రవ్యేణ వివాహః భవిష్యతీతి ఆశయా ఏకాం కన్యాం (పరి+అనయత్ = పర్యణయత్ = పెండ్లాడెను) కింతు సా అంధా."
english = "Who is there to say so? Rāmācārya married a girl with the expectation that the wedding would happen with little expense, but she is blind."

[[sections.items]]
n = 13
sanskrit_telugu = "చలచిత్తా వ."
english = "Or fickle-minded."

[[sections.items]]
n = 14
sanskrit_telugu = "తేన కారణేన చోష్యే గుడం (క్షిపతి = వేయుచున్నది.) పాయసే లవణం క్షిపతి; శ్రకపాత్రే తైలం పూరయతి; తైలపాత్రే ద్రప్సం ప్రవేశయతి; సర్వాన్ పదార్థాన్ అధః పాతయతి."
english = "For that reason she throws jaggery into the chutney, throws salt into the rice pudding, fills the cooking vessel with oil, puts curd into the oil vessel, and knocks all the things down."

[[sections.items]]
n = 15
sanskrit_telugu = "ఏవం స్థితే ఏకదా అహాం తద్గృహాం గత్వా బహిఃస్థిత్వా రామాచార్య! రామాచార్య! ఇతి ఆహ్వాయం."
english = "Things being thus, one day I went to his house and standing outside called out 'Rāmācārya! Rāmācārya!'"

[[sections.items]]
n = 16
sanskrit_telugu = "అనంతరం సః ఆగత్య కవాటం ఉదఘాటయత్."
english = "Afterwards he came and opened the door."

[[sections.items]]
n = 17
sanskrit_telugu = "అహాం అంతః ప్రావిశం."
english = "I entered inside."

[[sections.items]]
n = 18
sanskrit_telugu = "రామాచార్యః మాం ఏకస్మిన్ పీఠే ఉపవేశ్య స్వస్య చిత్తక్షోభం సర్వమపి యథావిధి అకథయత్."
english = "Rāmācārya, having seated me on a stool, told me all of his mental anguish in full detail."

# --- Passage Translation ---

[[sections]]
type = "passage_translation"
language = "telugu"

[[sections.items]]
n = 1
telugu = "మీఁ యావు తెల్లనిది."
english = "Your cow is white."

[[sections.items]]
n = 2
telugu = "మా యావు ఎఱ్ఱనిది."
english = "Our cow is red."

[[sections.items]]
n = 3
telugu = "వాకిటిలో నొకఁగ్రుడ్డివాఁడు నిలుచున్నాఁడుగాని లోనికి పిలువుము."
english = "A blind man is standing in the front yard — call him inside."

[[sections.items]]
n = 4
telugu = "ఆవును ఎవఁడు కట్టివేయుచున్నాఁడు?"
english = "Who is tying up the cow?"

[[sections.items]]
n = 5
telugu = "మాపిల్లలు అన్ని సమాచారములను ఎఱుఁగుదురు."
english = "Our children know all the news."

[[sections.items]]
n = 6
telugu = "(మా దొడ్లో నున్నఁ మల్లెపూలయందు తెలుపు బాగుగనున్నది = యుష్మదావరణస్థిత మల్లికా పుష్పేషు ధావళ్యం సమ్యగస్తి.)"
english = "(The whiteness in the jasmine flowers in our yard is very good = yuṣmadāvaraṇasthita mallikā puṣpeṣu dhāvaḷyaṃ samyagasti.)"

[[sections.items]]
n = 7
telugu = "మాపిల్లలు ఎక్కఁడ నున్నారో."
english = "Where on earth are our children?"

[[sections.items]]
n = 8
telugu = "ఏమి చేయుచున్నారో ఇంతవఱకును మే మెఱుఁగము."
english = "What they are doing, we do not know even now."

[[sections.items]]
n = 9
telugu = "నీవు రాముని తెలియుటకు వెళ్ళుము."
english = "You go to find out about Rāma."

[[sections.items]]
n = 10
telugu = "వాఁడెక్కఁడ నున్నాఁడో తెలిసికొనిరమ్ము(ఇంతలో = ఏతదంతరే) నేను పురాణారంభమును చేయఁగలను."
english = "Find out where he is and come back — in the meantime (= etadantare) I can begin the recitation of the Purāṇa."

[[sections.items]]
n = 11
telugu = "నీచేయి యెఱ్ఱగా నున్నదేమిరా? ఊరకయే అట్లున్నది."
english = "Why is your hand so red? It is like that for no reason."

[[sections.items]]
n = 12
telugu = "నాచేతియందు యెఱుపు లేదు."
english = "There is no redness in my hand."

[[sections.items]]
n = 13
telugu = "ఆ తెల్లగుఱ్ఱ మెవరిది? బొబ్బిలి రాజుగారిది."
english = "Whose is that white horse? It belongs to the Raja of Bobbili."

[[sections.items]]
n = 14
telugu = "నీవు మిగుల కర్మిష్ఠుఁడవు; కాని చలచిత్తుఁడవు."
english = "You are very diligent; but you are fickle-minded."

[[sections.items]]
n = 15
telugu = "ఓ రి పిచ్చివాఁడా! కర్మిష్ఠుఁడు చలచిత్తుఁడు డెట్లుకాఁగలఁడురా?"
english = "You madman! How can a diligent person be fickle-minded?"

[[sections.items]]
n = 16
telugu = "మాబావగారి బావిలో నొకయుడుత పడినది."
english = "A squirrel fell into our brother-in-law's well."

[[sections.items]]
n = 17
telugu = "చచ్చినదా, బ్రతికినదా? ఎవఁడెఱుఁగు?"
english = "Did it die or did it survive? Who knows?"

[[sections.items]]
n = 18
telugu = "చచ్చినతర్వాత కొంతసేపటికి ప్రాణములు పోయినవని మా బావమఱఁది చెప్పినాఁడు."
english = "My brother-in-law said that after it died, after some time the life left it."

[[sections.items]]
n = 19
telugu = "గ్రుడ్డిపెండ్లాము కథ యేమాయెను? అప్పుడే పోయినది."
english = "What happened to the story of the blind wife? It ended right there."

[[sections.items]]
n = 20
telugu = "ఇంత వఱకును ఉన్నదా?"
english = "Has it been going on until now?"

[[sections.items]]
n = 21
telugu = "ఆ కథ చాల బాగుగా నున్నది."
english = "That story is very good."

[[sections.items]]
n = 22
telugu = "కొంచెము చెప్పఱిడు."
english = "Tell a little of it."

[[sections.items]]
n = 23
telugu = "రేపు రమ్ము."
english = "Come tomorrow."

[[sections.items]]
n = 24
telugu = "మఱియొక కథను చెప్పెదను."
english = "I will tell another story."
