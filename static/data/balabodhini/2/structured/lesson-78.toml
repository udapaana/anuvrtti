# --- passage ---

[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "ఇదానీం దశఘంటాఽ నదంతి."
english = "Now the ten o'clock bells are ringing."

[[sections.items]]
n = 2
sanskrit_telugu = "అద్దైవ మమాభియోగస్య విచారణా దివసఽ అభియోగఽ కస్యాఽనకూలో భవిష్యతి వా సంధిం కారయిష్యామఽ ఇతి [కతిచిత్ = కేచిత్] మధ్యస్థాఽ వదంతి."
english = "That very day is the hearing of my lawsuit — some mediators say whether the case will go in whose favour or whether they will arrange a compromise."

[[sections.items]]
n = 3
sanskrit_telugu = "తే కీదృశాఽ వా నజ్ఞాయతే."
english = "What kind of people they are is not known."

[[sections.items]]
n = 4
sanskrit_telugu = "ప్రాడ్వివాకఽ [ఉత్కోచం = లంచమును] నగ్రహిష్యతీతి మామ నిశ్చయఽ(ఏవంచ = ఇంతకు) అస్మాకం అదృష్టం కథమస్తివా!"
english = "My conviction is that the judge will not take a bribe — and given that, how is our fortune?"

[[sections.items]]
n = 5
sanskrit_telugu = "కిమర్థ మిదానీం విచారఽ?"
english = "Why worry about it now?"

[[sections.items]]
n = 6
sanskrit_telugu = "అస్మత్పాక్షికేనాయ లేఖం అప్రేషయం."
english = "I had sent a letter to our side's party."

[[sections.items]]
n = 7
sanskrit_telugu = "తత్కుమొపాల్ ప్రతిలేఖఽ నాస్తి."
english = "There is no reply letter from him yet."

[[sections.items]]
n = 8
sanskrit_telugu = "నోచే తంత్రివార్తాం వా ప్రేషయిష్యామి."
english = "Otherwise I will send a telegram."

[[sections.items]]
n = 9
sanskrit_telugu = "కిం కరిష్యామి గ్రహాచార కాళఽ ఏవం సంప్రాప్తఽ యూయం నిధే కియత్ ధనం అస్థాపయత?"
english = "What am I to do — such a time has come due to planetary influence; how much money did you deposit in the bank?"

[[sections.items]]
n = 10
sanskrit_telugu = "పంచసహస్ర రూపకాన్ అస్థాపయామ."
english = "We deposited five thousand rupees."

[[sections.items]]
n = 11
sanskrit_telugu = "ప్రాడ్వివాకస్య అశ్వశకటఽ న్యాయస్థానం ప్రావిశదితి భాతి."
english = "The judge's horse-carriage appears to have entered the court."

[[sections.items]]
n = 12
sanskrit_telugu = "తర్హి యుష్మాభిరపి శీఘ్రమేవ గంతవ్యం; నోచే దుష్మాఽకం అభియోగం ఏకపక్షే ఏవ విచార్య ప్రాతికాల్యం కుర్యాత్."
english = "Then you too must go quickly; otherwise he might decide your lawsuit ex parte and rule against you."

[[sections.items]]
n = 13
sanskrit_telugu = "సత్యం సత్యం."
english = "True, true."

[[sections.items]]
n = 14
sanskrit_telugu = "హ్యఽ సాయం ఈషద్విచారణ మాసీత్."
english = "Yesterday evening there was a brief hearing."

[[sections.items]]
n = 15
sanskrit_telugu = "భాష!"
english = "Well said!"

[[sections.items]]
n = 16
sanskrit_telugu = "అస్మదభియోగఽ ఇదానీమేవ అస్మదనుకూలం పరిష్కృతఽ ఈశ్వరానుగ్రహేణ వయం అజయామ."
english = "Our lawsuit has just now been settled in our favour — by God's grace we have won."

[[sections.items]]
n = 17
sanskrit_telugu = "అస్మత్ శత్రుఽ కాలంకరోతు."
english = "May our enemy perish."

# --- passage_translation ---

[[sections]]
type = "passage_translation"
language = "telugu"

[[sections.items]]
n = 1
telugu = "సూర్యాస్తమయము అయినది గదా యింతవఱకును దీపమును వెలిగింపవేమి?"
english = "The sun has set, hasn't it — why have you not lit the lamp until now?"

[[sections.items]]
n = 2
telugu = "మొకొడుకు నూనెను ఒలకఁపోసినాఁడు."
english = "Your son spilled the oil."

[[sections.items]]
n = 3
telugu = "నీటిని కాచుము."
english = "Heat the water."

[[sections.items]]
n = 4
telugu = "నేను వేడినీటితో స్నానము చేయుదును."
english = "I will bathe with hot water."

[[sections.items]]
n = 5
telugu = "నా కాలిలో నున్నమంటిని వెలికి లాగుము."
english = "Pull out the thorn that is in my foot."

[[sections.items]]
n = 6
telugu = "నాచేతగాదు."
english = "It is not possible for me."

[[sections.items]]
n = 7
telugu = "కొంచెము నీటి నిక్కఁడ చిలుకరింపుము."
english = "Sprinkle a little water here."

[[sections.items]]
n = 8
telugu = "మన కత్తి మొక్కఁపోయినది(సానమొంద = శాషోపరి) పదునుపెట్టుము."
english = "Our knife has become blunt — sharpen it on the whetstone (śāṣopari)."

[[sections.items]]
n = 9
telugu = "పిల్లది యెందులకు గకుఁచున్నది."
english = "Why is the child foaming at the mouth?"

[[sections.items]]
n = 10
telugu = "గుళిలో అర్చకులు గంటను మ్రోగించుచున్నారు."
english = "The priests in the temple are ringing the bell."

[[sections.items]]
n = 11
telugu = "నీవు పాఠమును అప్పగింపుము."
english = "Recite the lesson."

[[sections.items]]
n = 12
telugu = "వామనాచార్యులనకు నాయఁడు బొత్తుగా గౌరవమే లేదు."
english = "Nāyaḍu has absolutely no respect for Vāmanācārya."

[[sections.items]]
n = 13
telugu = "ఎప్పుఁడును నాతో దర్పించుచుండును."
english = "He always acts arrogantly with me."

[[sections.items]]
n = 14
telugu = "ప్రతిదినమును రాత్రియందు ఎలుక వచ్చి నాపాదమును గీరుచున్నది."
english = "Every night a rat comes and scratches my foot."

[[sections.items]]
n = 15
telugu = "మొబావియొద్ద బురద మురిగినది."
english = "Mud has accumulated near your well."

[[sections.items]]
n = 16
telugu = "నీచెవినుండి చీము (కారుచున్నది = ద్రవతి) కురుపున్నదా యేమి?"
english = "Pus is draining (dravati) from your ear — is there a boil or what?"

[[sections.items]]
n = 17
telugu = "ఆ గ్రుడ్డిపిల్లఁ నెవరు పెండ్లి చేసికొందురు?"
english = "Who will marry that blind girl?"

[[sections.items]]
n = 18
telugu = "మాయోపాయము చేత నెటులో శంకరునికిచ్చి పెండ్లి చేసినారు."
english = "By some cunning means they somehow gave her to Śaṃkara in marriage."

[[sections.items]]
n = 19
telugu = "పోనిమ్ము పాపము; అదే మనకుఁగావలసినది."
english = "Let it be, poor thing — that is what we needed."

[[sections.items]]
n = 20
telugu = "ఆపిల్లకుం పెండ్లి యెట్లగునాయని నాకు భయముగా నుండెను."
english = "I was fearful about how that girl's marriage would happen."

[[sections.items]]
n = 21
telugu = "శంకరుఁడు అమాయికుండును సద్బ్రాహ్మణుండును కావున చిరకాలము (ఆదంపతులు పార్వతీ పరమేశ్వరులవలె వర్థిల్లుదురుగాత! = తౌ దంపతీ పార్వతీపరమేశ్వరా వివ వర్థేతాం) అందఱు జనులు సుఖపడుదురుగాత!"
english = "Since Śaṃkara is innocent and a good brahmin, may that couple flourish for a long time like Pārvatī and Parameśvara (tau dampatī pārvatīparameśvarāv iva varthethām) — may all people be happy!"

