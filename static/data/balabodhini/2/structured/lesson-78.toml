# --- grammar note: pitṛ dvivacana ---

[[sections]]
type = "grammar_note"
language = "meta"

[[sections.items]]
telugu = """'పితృ' పితరౌ-పితృభ్యాం- పిత్రోఽ- హేపితరౌ!
మాతృ-యాతృ-జామాతృ-దుహితృ-భ్రాతృ-నసందృ శబ్దములను పతృశబ్దమువలెనే నడచును."""
english = "pitṛ dual: pitarau (1-2), pitṛbhyām (3-4-5), pitroḥ (6-7), he pitarau! (vocative). mātṛ, yātṛ, jāmātṛ, duhitṛ, bhrātṛ, nanandṛ all follow the pitṛ pattern."

