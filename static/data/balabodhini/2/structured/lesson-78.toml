# --- grammar note: strīliṅga i/u like hāri/guru ---

[[sections]]
type = "grammar_note"
language = "meta"

[[sections.items]]
telugu = "స్త్రీలింగ, ఇ-ఉకారాంతములను హారి, గురుశబ్దములవలెనే."
english = "Feminine i-stem and u-stem duals follow hāri and guru respectively."

# --- grammar note: napuṃsaka i/u prathamā-dvitīyā ---

[[sections]]
type = "grammar_note"
language = "meta"

[[sections.items]]
telugu = """నపుంసకలింగ, ఇ - ఉకారాంతములు, ప్రథమా - ద్వితీయలలో మాత్రమే మాఱును.
(శుచి) శుచినీ
(మధు) మధునీ
తక్కిన విభక్తులు పుంలింగపద్ధతినే నడచును."""
english = "Neuter i/u-stems differ only in prathamā-dvitīyā dual: śuci → śucinī, madhu → madhunī. Other vibhaktis follow the masculine pattern."

