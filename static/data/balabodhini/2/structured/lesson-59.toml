[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "అద్యనక్తం చంద్రికా సమ్యగస్తి."
english = "Tonight the moonlight is good (present in full)."

[[sections.items]]
n = 2
sanskrit_telugu = "పూర్వేద్యుః ఆకాశే సర్వత్ర మేఘసద్భావాత్ నక్షత్రాణి సమ్యక్ నాదృశ్యంత."
english = "The day before yesterday, because of clouds everywhere in the sky, the stars were not properly visible."

[[sections.items]]
n = 3
sanskrit_telugu = "అబ్బం ఇత్థం ఆనయ ముఖం పశ్యేయం."
english = "Bring the mirror here; I would like to see my face."

[[sections.items]]
n = 4
sanskrit_telugu = "తటాకసమీపే ఢంకః ఇత స్తతః సంచరతి; కథ మహాం స్నానార్థం గచ్చేయం?"
english = "A frog is moving here and there near the pond; how could I go for a bath?"

[[sections.items]]
n = 5
sanskrit_telugu = "ఢంకః త్వాం కిం కరిష్యతి-త్వం నిర్భయం గచ్చ."
english = "What will a frog do to you? Go fearlessly."

[[sections.items]]
n = 6
sanskrit_telugu = "అవరణ ద్వారస్య అర్గళా దృఢం నాస్తి."
english = "The bolt of the outer door is not firm."

[[sections.items]]
n = 7
sanskrit_telugu = "రాత్రికాళే చోరాః ప్రవేక్ష్యంతి కింవా."
english = "Will thieves enter at night, or what?"

[[sections.items]]
n = 8
sanskrit_telugu = "[న కేవలం కవాటస్య = తలుపునకు మాత్రమేకాదు] కింతు గవాక్ష స్యాపి అర్గళా నాస్తి."
english = "Not only the door's [bolt is missing], but even the window has no bolt."

[[sections.items]]
n = 9
sanskrit_telugu = "గవాక్షస్య అర్గళా నాస్తిచే త్కిం భయం రే!"
english = "If the window has no bolt, what is there to fear?"

[[sections.items]]
n = 10
sanskrit_telugu = "త్వం అద్యనక్తం యామద్వయ పర్యంతం తత్రైవ సంచర."
english = "You wander there tonight until two yāmas (six hours)."

[[sections.items]]
n = 11
sanskrit_telugu = "(అస్మిన్నినే = ఈరోజున) పంచదశ ఘటికాపర్యంతం చంద్రికా ప్రకాశిష్యతే; తావత్పర్యంతం తవ భయం నాస్తిఖలు."
english = "Today the moonlight will shine until fifteen ghaṭikās; until then you have no fear, right?"

[[sections.items]]
n = 12
sanskrit_telugu = "అనంతరం ధ్యాంతం ఆగమిష్యతి."
english = "After that, darkness will come."

[[sections.items]]
n = 13
sanskrit_telugu = "తదా అహామేవ తత్ర తిష్ఠేయం."
english = "At that time I myself would stand there."

[[sections.items]]
n = 14
sanskrit_telugu = "మామ పాదే పూర్వేద్యుః నక్తం పాషాణప్రహరః అలగత్."
english = "My foot was struck by a stone at night the day before yesterday."

[[sections.items]]
n = 15
sanskrit_telugu = "తస్మాత్పాదః (శూలతి = నొప్పిపెట్టుచున్నది.)"
english = "Because of that my foot is aching."

[[sections.items]]
n = 16
sanskrit_telugu = "అదఱిగృహే అట్లం నాస్తికిల; త్వం తత్ర ఉపావిశః అహా మత్ర ఉపావిశం."
english = "There is no sugarcane in the neighbour's house, it seems; you sit there, I will sit here."

[[sections.items]]
n = 17
sanskrit_telugu = "పాకః కథం భవిష్యతి?"
english = "How will the cooking happen?"

[[sections.items]]
n = 18
sanskrit_telugu = "ఆపణం గత్వా శకటమాత్రం అట్లం ఆనయ."
english = "Go to the shop and bring a cartload of sugarcane."

[[sections.items]]
n = 19
sanskrit_telugu = "అంజలిమాత్రమపి జలం నాస్తి అస్మత్తూా పే."
english = "There is not even a handful of water in our well."

[[sections]]
type = "passage_translation"
language = "telugu"

[[sections.items]]
n = 1
telugu = "నిన్నఁ నేను రాముని తోఁ గూడ వెన్నెలలో భోజనమును జేసితిని."
english = "Yesterday I dined together with Rāma in the moonlight."

[[sections.items]]
n = 2
telugu = "అప్పుడు గవాక్షమునుండి యొక పిల్లి [కూన = కిశోరః] వచ్చి నా దగ్గర భయము లేకుండ కూర్చుండి నా విస్తరిలో నున్నఁ పరమాన్నము నంతయుఁదినెను."
english = "At that time a kitten [kitten = kiśoraḥ] came through the window, sat near me without any fear, and ate up all the sweet rice that was on my leaf-plate."

[[sections.items]]
n = 3
telugu = "ఈ మఱ్ఱి కాఱుచుండి నా విస్తరిలో నున్నఁ పరమాన్నము నంతయుఁదినెను."
english = "While I was eating, this banyan creeper ate up all the sweet rice on my leaf-plate."

[[sections.items]]
n = 4
telugu = "ఈ మఱ్ఱి తీగను మొదాద్లో ప్రొతుము."
english = "Plant this banyan vine in the ground."

[[sections.items]]
n = 5
telugu = "ఈవేళ నింతవఱకు నెన్ని గంటులు అయినవో తెలియలేదు."
english = "How many hours have passed until now today, I do not know."

[[sections.items]]
n = 6
telugu = "ప్రతిరోజును మీఁ దూడను ఎవరు కట్టుదురు?"
english = "Who ties your calf every day?"

[[sections.items]]
n = 7
telugu = "అద్దములో నీ మొగము బాగుగఁ గనఁబడెనా, లేదా!"
english = "Did your face show up well in the mirror, or not?"

[[sections.items]]
n = 8
telugu = "ఇప్వేళనే బాగుగా చూచుకొనుము."
english = "Look at it properly right now."

[[sections.items]]
n = 9
telugu = "రేపుగా మాయింటిలో శుభకార్యముము."
english = "Tomorrow there is an auspicious ceremony at our house."

[[sections.items]]
n = 10
telugu = "శుభకార్య మయినచో నాకేమి?"
english = "What do I care if there is an auspicious ceremony?"

[[sections.items]]
n = 11
telugu = "ఈ స్తంభమును ఇక్కఁడ ప్రొతి దానియందు మా ఆవును కట్టుము."
english = "Plant this post here and tie our cow to it."

[[sections.items]]
n = 12
telugu = "రేపు పెండ్లికొఱత ఎవరెవరు వత్తురో మేమే తెలిసికొందుము."
english = "Who all will come for the wedding-party tomorrow, we ourselves will find out."

[[sections.items]]
n = 13
telugu = "ఇప్వేళ ప్రొద్దుటినుండియు పదిదెబ్బలు తగిలినవి."
english = "Since morning today, ten blows have landed (on me)."

[[sections.items]]
n = 14
telugu = "ఎవరు నిన్నఁ గుళ్ళో ఉపన్యాసమును చెప్పిరి?"
english = "Who gave the lecture in the temple yesterday?"

[[sections.items]]
n = 15
telugu = "తాతాచార్యులుగారు చెప్పినారు."
english = "Tātācāryulu said it."

[[sections.items]]
n = 16
telugu = "ఏ విషయములో?"
english = "On what subject?"

[[sections.items]]
n = 17
telugu = "బాల్యవివాహములు మంచివి కావని చెప్పినారు."
english = "He said that child marriages are not good."

[[sections.items]]
n = 18
telugu = "ఏ భాషలో చెప్పినారు?"
english = "In what language did he say it?"

[[sections.items]]
n = 19
telugu = "ద్రవిడభాషలో చెప్పినారు."
english = "He said it in the Tamil language."

[[sections.items]]
n = 20
telugu = "నీకు బాగుగా తెలిసెనా?"
english = "Did you understand it well?"

[[sections.items]]
n = 21
telugu = "నే నక్కఁడికి వెళ్ళనేలేదు."
english = "I did not go there at all."
