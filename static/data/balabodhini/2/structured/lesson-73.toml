# --- passage ---

[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "తాతాచార్యస్య జ్యేష్ఠపుత్రః బలిద్ధాచార్యస్య తృతీయ పుత్రికాం పరిణేతుం ప్రయత్న మకరోత్."
english = "Tātācārya's eldest son made effort to marry Balidhācārya's third daughter."

[[sections.items]]
n = 2
sanskrit_telugu = "కింతు బలిద్ధః స్వస్య కనిష్ఠపుత్రికాం దాతుం ఇచ్చత కుత ఇతిచేత్."
english = "But Balidha wished to give his youngest daughter — why is that?"

[[sections.items]]
n = 3
sanskrit_telugu = "తృతీయపుత్రికా అతీవ రమణీయా; తస్మాత్ తస్యాఽయథా కథంవా వివాహాః భవిష్యతి."
english = "The third daughter is very beautiful; therefore her marriage will happen somehow or other."

[[sections.items]]
n = 4
sanskrit_telugu = "పరంతు కనిష్ఠాయాఽ సౌందర్యం నాస్తి; తతః తస్యాఽ వరః న లభ్యతే."
english = "But the youngest does not have beauty; therefore a suitable groom is not found for her."

[[sections.items]]
n = 5
sanskrit_telugu = "యథాకథంవా తాతం వంచయిత్వా కార్యం సాధయితుం(ప్రయతేఽ = ప్రయత్నించుచున్నాఁడు) పూర్వకాళే వేకుదళఽ పేటికాం పేటంతి స్మ."
english = "He is trying to accomplish his purpose by deceiving the father somehow; in former times they used to weave baskets with bamboo leaves."

[[sections.items]]
n = 6
sanskrit_telugu = "(మదీయః జనకః = నా తండ్రి) నద్యాం స్నాతుం అగచ్చత్."
english = "My father went to bathe in the river."

[[sections.items]]
n = 7
sanskrit_telugu = "ఏతదంతరే అంతికాయాం అగ్నిం ప్రవేశయ."
english = "In the meantime, put fire in the stove."

[[sections.items]]
n = 8
sanskrit_telugu = """మత్స్యార్జికాకం
భేదయిత్వా తత్ర నిక్షిప."""
english = "Cut up the ponnaganṭi vegetable and place it there."

[[sections.items]]
n = 9
sanskrit_telugu = "ముద్గదాళిం ఆనయ."
english = "Bring the mung dal."

[[sections.items]]
n = 10
sanskrit_telugu = "సూపం కరిష్యామి."
english = "I will make soup."

[[sections.items]]
n = 11
sanskrit_telugu = "శూర్పే తందులాని నిక్షిప్య ఈషత్ ప్రస్ఫోటు."
english = "Put the rice in the winnowing basket and winnow it a little."

[[sections.items]]
n = 12
sanskrit_telugu = "స్తనపః క్రందతి కింతు."
english = "But the nursing infant is crying."

[[sections.items]]
n = 13
sanskrit_telugu = "అంబ! కించిత్ తం సాంతయ."
english = "Mother! Console him a little."

[[sections.items]]
n = 14
sanskrit_telugu = "(త్వాం వినా = నీవుతప్పు) బాలకం కా లాలయతి?"
english = "Without you, who will pamper the child?"

[[sections.items]]
n = 15
sanskrit_telugu = "దోలాయాం శయ్యా సమ్యక్ అస్తివా నవా పశ్య; అస్తిచేత్ తత్ర శాયયిత్వా దోలయ."
english = "Check whether there is a proper bed in the cradle or not; if there is, lay him down there and rock the cradle."

[[sections.items]]
n = 16
sanskrit_telugu = "నిద్రాస్యతి."
english = "He will sleep."

[[sections.items]]
n = 17
sanskrit_telugu = "గోధూమపిష్టం సమ్యక్ గవేషయఽ కిం?"
english = "Did you properly search for the wheat flour?"

[[sections.items]]
n = 18
sanskrit_telugu = "యుష్మద్దా మే నది సర్వదా ప్రవహతి కిం?"
english = "Does the river near your place always flow?"

[[sections.items]]
n = 19
sanskrit_telugu = "అహాం ప్రయామి; కదాపి మాం మా విస్మర."
english = "I am going; never forget me."

[[sections.items]]
n = 20
sanskrit_telugu = "సూర్య ఉదయతే."
english = "The sun rises."

[[sections.items]]
n = 21
sanskrit_telugu = "ఇతోపి(శయావృతఽ = ప్రక్కమొంద నుండి నోత్థాస్యసి కిలరే?&కస్థిష్యామి."
english = "Even from here (lying down — will you not rise from the bed, hey?) where will I stand?"

# --- passage_translation ---

[[sections]]
type = "passage_translation"
language = "telugu"

[[sections.items]]
n = 1
telugu = "సూర్యుఁడస్తమించుచున్నాఁడు."
english = "The sun is setting."

[[sections.items]]
n = 2
telugu = "నక్షత్రము లుదయించుచున్నవి."
english = "The stars are rising."

[[sections.items]]
n = 3
telugu = "ఈనాఁడు చంద్రుఁడుదయించఁడు."
english = "Today the moon will not rise."

[[sections.items]]
n = 4
telugu = "ఇప్పుడు కృష్ణపక్షముగదా."
english = "It is the dark fortnight now, isn't it."

[[sections.items]]
n = 5
telugu = "మరల శుక్ల పక్షము వచ్చునెడల చంద్రుఁడు కనఁబడును."
english = "When the bright fortnight comes again, the moon will be visible."

[[sections.items]]
n = 6
telugu = "ఇప్పు దుత్తరాయణమా."
english = "Is it the northern solstice now?"

[[sections.items]]
n = 7
telugu = "దక్షిణాయనమా?"
english = "Or the southern solstice?"

[[sections.items]]
n = 8
telugu = "రాముఁడు నన్నెప్పుఁడైనను తలంచుచున్నాఁడా?"
english = "Does Rāma ever think of me?"

[[sections.items]]
n = 9
telugu = "ఆ పిల్ల లందఱిను రస్తాయం దెగురుచున్నారు చూడుము."
english = "Look — all those children are jumping about on the road."

[[sections.items]]
n = 10
telugu = "కుంతీదేవికి నడిమి కొడుకు అర్జునుఁడు."
english = "Kuntīdevī's middle son is Arjuna."

[[sections.items]]
n = 11
telugu = "నా నొసట బొట్టున్నదా లేదా? లేనియెడల చెప్పఁఱిము; మరలం బెట్టుకొందును; మా నాన్నఁ కోపము చేయును."
english = "Is there a tilaka mark on my forehead or not? If not, tell me; I will put it on again — our father will be angry."

[[sections.items]]
n = 12
telugu = "నీకాలిమొంద వ్రణము (మానినదా? = అశామ్యత్ కిం?) ఇంకను నన్నుఁ బాధించుచున్నది."
english = "Has the wound on your foot healed (aśāmyat kim)? It is still causing me pain."

[[sections.items]]
n = 13
telugu = "అలాగా! అటువంటి కాలితో ఎందుకు నడచుచున్నావు?"
english = "Is that so! Why are you walking with such a foot?"

[[sections.items]]
n = 14
telugu = "నేను తప్పు మాఇంటిలో నెవరున్నారు? మా నాన్నఁగారు మూసలివారుగదా! మా అన్నయ్యఁ కుంటివాఁడు; కాఁబట్టి నేనే బజారునకు పోవలయును."
english = "Other than me, who is there in our house? Our father is elderly, isn't he! My elder brother is lame; therefore I alone must go to the market."

[[sections.items]]
n = 15
telugu = "ఇటుల నుండియే నిన్నఁ యెందుకురా కఱ్ఱను కాలుచున్నావు? లేదు లేదు."
english = "Why were you burning a stick right here yesterday? No, no."

[[sections.items]]
n = 16
telugu = "ఆ ధాన్యమును చేటలో పోసి యెందలో నుంచుము."
english = "Pour that grain into the winnowing basket and keep it in the sun."

[[sections.items]]
n = 17
telugu = "కొంచెము నిప్పును తెమ్ము; నేతిని కఱిగించెదను."
english = "Bring a little fire; I will melt the ghee."

[[sections.items]]
n = 18
telugu = "రాముసికాలు విరిగినది."
english = "Rāmu's leg is broken."

[[sections.items]]
n = 19
telugu = "పొన్నుఁగంటి కూరలో కందిపప్పుఁగాని పెసరపప్పు ఏ గాని పడవేయుము."
english = "Add either toor dal or mung dal to the ponnaganṭi curry."
