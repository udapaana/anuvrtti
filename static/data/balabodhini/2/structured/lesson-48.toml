[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "యుష్మద్గృహే ఉపవేష్టుం మామ ఈషదపి అవకాశః నాస్తి; కుత ఇతి చేత్."
english = "There is no space at all for me to sit in your house; if you ask why..."

[[sections.items]]
n = 2
sanskrit_telugu = "అస్మద్గృహే మమానుజస్య వివాహః భవతి; తదర్థం అహం ప్రతిగృహం గత్వా సర్వాన్ బాంధవాన్ భోజనార్థం ఆహ్వాయేయం; యూయమపి ఆగచ్ఛత."
english = "My younger brother's wedding is taking place at our house; for that purpose I should go to each house and invite all relatives for the feast; you all also come."

[[sections.items]]
n = 3
sanskrit_telugu = "శీఘ్రమేవ భవిష్యతి కిం?"
english = "Will it happen very soon?"

[[sections.items]]
n = 4
sanskrit_telugu = "తద్దైవాగమిష్యామి."
english = "I shall come right then."

[[sections.items]]
n = 5
sanskrit_telugu = "సర్వసమావేశనానంతరం పునర పేఁయికవారం మాం ఆహాోషిస్యసికిం?"
english = "After assembling everyone, will you invite me again once more?"

[[sections.items]]
n = 6
sanskrit_telugu = "తవ హస్తే కిమస్తి దర్శయ."
english = "What is in your hand? Show me."

[[sections.items]]
n = 7
sanskrit_telugu = "కిమపి నాస్తి."
english = "There is nothing."

[[sections.items]]
n = 8
sanskrit_telugu = "పాకం కర్తుం కాన్ ఆజ్ఞాపయః?"
english = "Whom did you command to cook?"

[[sections.items]]
n = 9
sanskrit_telugu = "బహుజనాః సంతి; గ్రామాంతరేమ స్థితాః యుష్మద్బాంధవాః సర్వే సమావిశన్ కిం?"
english = "There are many people; did all your relatives living in other villages assemble?"

[[sections.items]]
n = 10
sanskrit_telugu = "సమావిశ్య దినచతుష్టయం అసీత్."
english = "Having assembled, they stayed for four days."

[[sections.items]]
n = 11
sanskrit_telugu = "సర్వాన్ సమావేశయితుం త్వమేవ సమర్థః అస్మదావరణే తులసీవృక్షః నాస్తిరే."
english = "You alone are capable of assembling everyone. There is no tulasī plant in our courtyard, friend."

[[sections.items]]
n = 12
sanskrit_telugu = "కతికృత్వః ఆపి న రోహతి."
english = "Even though planted many times, it does not grow."

[[sections.items]]
n = 13
sanskrit_telugu = "దేవపూజార్థం తులసీదళాని నసంతి."
english = "There are no tulasī leaves for the worship of the deity."

[[sections.items]]
n = 14
sanskrit_telugu = "ప్రతిదినం కస్యగృహం గచ్చేయం?"
english = "To whose house should I go every day?"

[[sections.items]]
n = 15
sanskrit_telugu = "అస్మద్గృహే అనేక వృక్షాః సంతి."
english = "There are many trees in our house."

[[sections.items]]
n = 16
sanskrit_telugu = "ఏక మానీయ పునరపి రోపయిష్యామి; శ్వః దా స్యసికిం?"
english = "Having brought one, I shall plant it again; will you give it tomorrow?"

[[sections.items]]
n = 17
sanskrit_telugu = "శ్వః శుక్రవాసరః పరశ్వః ఆగచ్చ; ఆగమన సమయే ఏకం ఖనిత్రము పా్యనయ."
english = "Tomorrow is Friday; come the day after; at the time of coming, also bring a spade."

[[sections.items]]
n = 18
sanskrit_telugu = "శాకాని భేదయత."
english = "Chop the vegetables."

[[sections.items]]
n = 19
sanskrit_telugu = "ఆలస్యం మా భవతు."
english = "Let there be no delay."

[[sections.items]]
n = 20
sanskrit_telugu = "ఇదానీ మేవ దశ ఘంటాః అభవన్."
english = "It is already ten o'clock now."

[[sections.items]]
n = 21
sanskrit_telugu = "విధవా యథా అభిముఖం నా గచ్చతి తథా జాగ్రత్రయా తిష్ఠ."
english = "Be vigilant so that a widow does not come in front of you."

[[sections.items]]
n = 22
sanskrit_telugu = "పురోహితాః కిం కుర్వంతి?"
english = "What are the priests doing?"

[[sections.items]]
n = 23
sanskrit_telugu = "స్నానం కృత్వా వస్తాని శోషయంతి."
english = "Having bathed, they are drying their clothes."

[[sections.items]]
n = 24
sanskrit_telugu = "తాన్ శీఘ్రు మానయ."
english = "Bring them quickly."

[[sections]]
type = "passage_translation"
language = "telugu"

[[sections.items]]
n = 1
telugu = "నాకేమియును తెలియదు."
english = "I know nothing at all."

[[sections.items]]
n = 2
telugu = "ఎవరెవరిని పిలుచుకొందురో మొరే వెళ్ళి పిలువుఁడు."
english = "Whoever needs to be invited — you yourself go and invite them."

[[sections.items]]
n = 3
telugu = "మీఁ మేనమామ కుత్తిరము వ్రాసినావా?"
english = "Have you written a letter to your maternal uncle?"

[[sections.items]]
n = 4
telugu = "ఇంకను చేరలేదేమి?"
english = "Has he not arrived yet?"

[[sections.items]]
n = 5
telugu = "ఆయన రేపు ప్రొద్దున మన యింటికి చేరగలఁడు."
english = "He will reach our house tomorrow morning."

[[sections.items]]
n = 6
telugu = "నీవు కొంచెము నాతో కూడ అంగడికి వచ్చెదవా?"
english = "Will you come to the shop with me for a little while?"

[[sections.items]]
n = 7
telugu = "సరే వత్తును పడండి."
english = "All right, I will come — let's go."

[[sections.items]]
n = 8
telugu = "చాలమంది భోజనమునకు వత్తురేమో కదా."
english = "Many people will likely come for the meal, won't they?"

[[sections.items]]
n = 9
telugu = "వారినందరిని ఎక్కఁడ కూర్చుండఁబెట్టఁ గలవుమాకెందుకండి."
english = "Where can you seat all of them — why is that our concern, sir?"

[[sections.items]]
n = 10
telugu = "అంతయు మాకేనా?"
english = "Is all of it on us alone?"

[[sections.items]]
n = 11
telugu = "నేనెక్కఁడనో ఒకచోట కూర్చుండఁబెట్టఁగలను."
english = "I can seat them somewhere or other."

[[sections.items]]
n = 12
telugu = "మీఁ దూరకుండుఁడు."
english = "You stay away (keep your distance)."

[[sections.items]]
n = 13
telugu = "చంటిపిల్లవాఁడ్రు రస్తాయందున్నారు."
english = "The infants are on the road."

[[sections.items]]
n = 14
telugu = "లోపలికి తీసికొనిరమ్ము."
english = "Bring them inside."

[[sections.items]]
n = 15
telugu = "పాలు త్రాగించుము."
english = "Give them milk to drink."

[[sections.items]]
n = 16
telugu = "మంగళసూత్రమును తీసికొనివచ్చుటకు మాయమ్మతో కూడ నెవరెవరు వెళ్ళినారు?"
english = "Who all went along with our mother to fetch the marriage thread?"

[[sections.items]]
n = 17
telugu = "మా అక్కయ్య, చెల్లెలు, రామాచార్యులగారి పెండ్లాము వెళ్ళినారు."
english = "Our elder sister, younger sister, and Rāmācāryulu's wife went."

[[sections.items]]
n = 18
telugu = "నీవు కొంచెము సేపిక్కఁడ నుండి అందఱిని అక్కఁడక్కఁడ కూర్చుండఁబెట్టుము."
english = "You stay here for a little while and seat everyone in their respective places."

[[sections.items]]
n = 19
telugu = "చూడు చూడు పిల్లవాఁడ్రు బెల్లమును తెచ్చికొని యెట్లు తినుచున్నారో?"
english = "Look, look — how the children have brought jaggery and are eating it!"

[[sections.items]]
n = 20
telugu = "వాఁడ్రను కొంచెము తెదరింపుము."
english = "Calm them down a little."

[[sections.items]]
n = 21
telugu = "అమె యెవని భార్యయో నీకు తెలియునా?"
english = "Do you know whose wife she is?"

[[sections.items]]
n = 22
telugu = "మా గురువు గారి భార్య."
english = "Our teacher's wife."

[[sections.items]]
n = 23
telugu = "లోనికి ప్రవేశపెట్టి మీఁ అమ్మతో చెప్పఁఱిము."
english = "Bring her inside and tell your mother."

[[sections.items]]
n = 24
telugu = "ఓ ఆచార్యులుగారూ! ఒక మనవి యున్నది గాని యిట్లు రండు."
english = "O Ācāryulu! I have a request — please come this way."

[[sections.items]]
n = 25
telugu = "(ఇదుగో = ఏషోస్మి) వచ్చినాను చెప్పఁఱిడు."
english = "(Here I am = eṣosmi) I have come — tell me."

[[sections.items]]
n = 26
telugu = "ముహూర్తకాల మెన్నిగంటల తరువాత?"
english = "The auspicious time — after how many hours?"

[[sections.items]]
n = 27
telugu = "రాత్రి యెనిమిది గంటలకు పైన; అయితే సరే."
english = "After eight o'clock at night; very well then."

[[sections.items]]
n = 28
telugu = "ఇంకను చాల అవకాశమున్నది."
english = "There is still a lot of time (opportunity) remaining."
