[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "అరే తవ గురుః గంగాంప్రతి స్నానార్థ మగచ్చత్."
english = "Hey, your teacher went towards the Gaṅgā for bathing."

[[sections.items]]
n = 2
sanskrit_telugu = "ఘంటాద్వయ మాసీత్."
english = "It was two hours ago."

[[sections.items]]
n = 3
sanskrit_telugu = "ఏతావత్పర్యంతం కిం కరోతిరే తత్ర?"
english = "What is he doing there until now?"

[[sections.items]]
n = 4
sanskrit_telugu = "మాం ప్రచ్చసి కిం?"
english = "Why are you asking me?"

[[sections.items]]
n = 5
sanskrit_telugu = "కిం కరోతివా! తథా హాసని కిం రే?"
english = "What do you care! Why do you laugh like that?"

[[sections.items]]
n = 6
sanskrit_telugu = "ఆగచ్చుత్వాగచ్చతి."
english = "He comes when he comes."

[[sections.items]]
n = 7
sanskrit_telugu = "శీఘ్రు మంథర్గత్వా పీఠం స్థాపయిత్వా."
english = "Quickly go inside and, having set up a seat."

[[sections.items]]
n = 8
sanskrit_telugu = "పీఠోపరి దర్పాసనం ప్రసారయ."
english = "Spread a mat/cushion on the seat."

[[sections.items]]
n = 9
sanskrit_telugu = "లవ్యాని పుష్పాణి రుటితి లవిత్వా తత్ర (నిక్షిప = ఉంచుము.)"
english = "Having quickly plucked the flowers that are ready to be cut, place them there."

[[sections.items]]
n = 10
sanskrit_telugu = "దర్పాసనం కుత్రాస్తివా మామ నదృష్టం."
english = "Where is the mat? I did not see it."

[[sections.items]]
n = 11
sanskrit_telugu = "అస్మద్గురుః తాడయిష్యతి కింవా, కింకుర్యాం భావ! మాత్రన."
english = "Will our teacher beat me or not? What shall I do, brother? Not at all."

[[sections.items]]
n = 12
sanskrit_telugu = "భీ పాపిష్ఠ! ఏతావత్పర్యంతం అహాం సహస్రకృత్వః అవదం ఖలు."
english = "Shame, wretch! I have told you thousands of times until now."

[[sections.items]]
n = 13
sanskrit_telugu = "మామ వాక్యం అశ్రుణోఃకిం?"
english = "Did you not hear my words?"

[[sections.items]]
n = 14
sanskrit_telugu = "భావ! భావ! అస్మద్గురుః రథ్యాయాం గళిత్వా అపతత్."
english = "Brother! Brother! Our teacher slipped and fell on the road."

[[sections.items]]
n = 15
sanskrit_telugu = "తదుత్థానాంతరే దర్పాసనం మార్గయిష్యామి."
english = "I will search for the mat after he gets up."

[[sections.items]]
n = 16
sanskrit_telugu = "(తావదంతరే = అంతలో) దర్పాసనం నలభ్యతే కిం?"
english = "In the meantime, is the mat not to be found?"

[[sections.items]]
n = 17
sanskrit_telugu = "భావ! దర్పాసనం అలభ్యత."
english = "Brother! The mat was found."

[[sections.items]]
n = 18
sanskrit_telugu = "అస్మద్గురోః శరీరే సర్వత్ర పంకః కథమస్తివాపశ్య."
english = "Look — how is there mud all over our teacher's body?"

[[sections.items]]
n = 19
sanskrit_telugu = "బత! పాపం."
english = "Alas! How unfortunate."

[[sections.items]]
n = 20
sanskrit_telugu = "తస్య వస్తాని సర్వాణి పంకమయాని ఆసన్."
english = "All his clothes were covered with mud."

[[sections.items]]
n = 21
sanskrit_telugu = "రేబాలక! తవ గురుః అతీవ (కుపితః = కోపగించినవాఁడు) ఆసీత్."
english = "Hey boy! Your teacher was very angry."

[[sections.items]]
n = 22
sanskrit_telugu = "తతః దృశ్యం పారం దృష్ట్వా (ఆయత్రీభవ = సిద్ధముగా నుండుము.)"
english = "Then, having seen how things stand, be ready."

[[sections.items]]
n = 23
sanskrit_telugu = "సః పంకా దుత్థాయ గృహం ప్రత్యాగత్య పంకం సర్వం ప్రక్షాళ్య అనంతరం శుభ్ర వస్త్రం ధృత్వా ఖలు మామ పారం వదిష్యతి."
english = "He, having gotten up from the mud, returned home, washed off all the mud, and then, having put on clean clothes, will certainly speak to me further."

[[sections.items]]
n = 24
sanskrit_telugu = "ఏతదంతరే అహాం నాయత్రీభవేయం కిం?"
english = "Should I not be prepared in the meantime?"

[[sections.items]]
n = 25
sanskrit_telugu = "కిమర్థం మాం త్వరయసి?"
english = "Why are you rushing me?"

[[sections]]
type = "passage_translation"
language = "telugu"

[[sections.items]]
n = 1
telugu = "పోనిమ్ము నాకెందుకు; నేను నిన్నుఁ త్వరపెట్టుటలే."
english = "Never mind — what is it to me; I am not rushing you."

[[sections.items]]
n = 2
telugu = "నీయిష్టానుసారమే కానిమ్ము."
english = "Let it be as you please."

[[sections.items]]
n = 3
telugu = "నేనంతవఱకును ఆడుకొనుచుందును."
english = "Until then I will keep playing."

[[sections.items]]
n = 4
telugu = "మా దొడ్లో నొక చెట్టుమొంద మంచి తేనెపట్టున్నది."
english = "There is a nice honeycomb on a tree in our yard."

[[sections.items]]
n = 5
telugu = "దానిని పడవేసి ఆ తేనెను త్రాగుదను."
english = "I will knock it down and drink that honey."

[[sections.items]]
n = 6
telugu = "సరేలే మీఁ గురువుగారి భార్య బియ్యపు చేటును క్రింద పడవేసినది; నీవు వెళ్ళి ఆ బియ్యమును ప్రోగుచేయుము."
english = "Alright then — your teacher's wife has knocked the rice-sieve down; you go and gather that rice."

[[sections.items]]
n = 7
telugu = "ప్రోగుచేయుటకు నీకు శక్తి లేని యెడల మీఁ చెల్లెలిని పిలువుము."
english = "If you do not have the strength to gather it, call your younger sister."

[[sections.items]]
n = 8
telugu = "మా చెల్లెలు ఎక్కఁడనో ఆడుకొనుచున్నది."
english = "Our younger sister is somewhere playing."

[[sections.items]]
n = 9
telugu = "ఇప్పుడు నేను పిల్చునెడల నది నా మాటను వినదు."
english = "If I call her now, she will not listen to my words."

[[sections.items]]
n = 10
telugu = "నీయొక్కఁ వినుట తరువాత మీఁ గురువుచేత నాకు కొంచెము తీర్థము నిప్పించుము."
english = "After your listening session, have your teacher give me a little sacred water."

[[sections.items]]
n = 11
telugu = "నాకా పురాణము వినుటకు శక్తి లేదుగాని యింక నీ పురాణమును కట్టిపెట్టుము."
english = "I do not have the strength to listen to that Purāṇa — now stop your Purāṇa recitation."

[[sections.items]]
n = 12
telugu = "నిన్నఁ రాత్రి నా కాలు పందికొక్కుఁ కఱచినది."
english = "Last night a scorpion bit my foot."

[[sections.items]]
n = 13
telugu = "నేను కదలుటకుఁ గూడ (శక్తి లేకుండ నున్నాను = అసమర్థః అస్మి.)"
english = "I am unable even to move (= asamarthaḥ asmi)."

[[sections.items]]
n = 14
telugu = "నన్నెందుకు (బాధించెదవు = బాధేథాః?)"
english = "Why do you trouble me (= bādhethhāḥ)?"

[[sections.items]]
n = 15
telugu = "నీకు వేలున్న యెడల నీవు హరికథను వినుటకు వెళ్ళుము."
english = "If you have the inclination, go to hear the Hari-kathā."

[[sections.items]]
n = 16
telugu = "నా దేహమునింద గఱ్ఱి ఉన్నది."
english = "My body has scabies."

[[sections.items]]
n = 17
telugu = "నేనును వెళ్ళను."
english = "I also will not go."

[[sections.items]]
n = 18
telugu = "(ఎవరును పోవద్దు = కేపి న గచ్చంతు.)"
english = "(Let no one go = ke'pi na gacchantu.)"
