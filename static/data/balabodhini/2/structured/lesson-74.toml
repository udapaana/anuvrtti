# --- passage ---

[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "ఆగామివత్సరే జ్యేష్ఠ శుక్ల పూర్ణిమా సోమవాసరే సంపూర్ణ చంద్రగ్రహణ మితి పంచాంగే లిఖిత మస్తి."
english = "In the coming year, it is written in the almanac that there will be a total lunar eclipse on a Monday in the bright fortnight of Jyeṣṭha, on the full-moon day."

[[sections.items]]
n = 2
sanskrit_telugu = "నదాఽర్కిం స్నానసమయే మామ శ్యాలకస్య వామపాదం ఏకః మకరః అగృష్ఠత్."
english = "Once, at the time of bathing in the river, a crocodile seized my brother-in-law's left foot."

[[sections.items]]
n = 3
sanskrit_telugu = "సోపి నిర్భయం జలే నిమజ్జ్య మకరస్య కంఠం హస్తద్వయేన అగృష్ఠత్."
english = "He too, fearlessly plunging into the water, seized the crocodile's throat with both hands."

[[sections.items]]
n = 4
sanskrit_telugu = "అనంతరం మకరః తం విసృజ్య [విడిచి] భయేన జలాంతర మవిశత్."
english = "Thereupon the crocodile, releasing him, entered deep into the water out of fear."

[[sections.items]]
n = 5
sanskrit_telugu = "మామ శ్యాలకస్తు జీవిత్వా తీరే అపతత్."
english = "My brother-in-law, having survived, fell upon the bank."

[[sections.items]]
n = 6
sanskrit_telugu = "సృష్టికర్తా స్నానానారాయణః సర్వజంతుమ దయాయా ప్రపర్తే."
english = "The creator, the all-pervading Lord, acts with compassion toward all living beings."

[[sections.items]]
n = 7
sanskrit_telugu = "స్వస్య ఇచ్చానుసారేణ లోకం సృజతి, తతః పాలయతి, అంతహః నాశయతి."
english = "According to his own will, he creates the world, then sustains it, and finally destroys it."

[[sections.items]]
n = 8
sanskrit_telugu = "గతపంచమ్యాం ఏకం రసాలవృక్షం మదరాసునగరా దానాయ్య, అస్మదావరణే ఆరోపయం."
english = "On the last fifth day of the lunar fortnight, I had a mango tree brought from the city of Madras and planted in our compound."

[[sections.items]]
n = 9
sanskrit_telugu = "ఏకః కీటకః ఆగత్య తస్య పర్ణాని అనాశయత్."
english = "An insect came and destroyed its leaves."

[[sections.items]]
n = 10
sanskrit_telugu = "కిం కుర్యాంరే?"
english = "What am I to do?"

[[sections.items]]
n = 11
sanskrit_telugu = "ఏకం రూపకం అస్మద్రామాయ దాపయ."
english = "Have one rupee given to our Rāma."

[[sections.items]]
n = 12
sanskrit_telugu = "అరేరే శ్వనకః అస్మద్బాలకస్య హస్తాత్ అపూపం అపహృత్య ధావతిరే!"
english = "Hey! The dog has snatched the sweet cake from our boy's hand and is running away!"

[[sections.items]]
n = 13
sanskrit_telugu = "బాలకః తదర్థం క్రందతి."
english = "The boy is crying on account of that."

[[sections.items]]
n = 14
sanskrit_telugu = "తం సాంత్వయరే."
english = "Comfort him."

[[sections.items]]
n = 15
sanskrit_telugu = "తాత! మాక్రంద, అన్యం అపూపం తుభ్యం దాపయామి ఆగచ్చ."
english = "Don't cry, child — I'll get you another sweet cake. Come."

[[sections.items]]
n = 16
sanskrit_telugu = "ధాన్యమాగచ్చత్ కింతు."
english = "The grain has come, however."

[[sections.items]]
n = 17
sanskrit_telugu = "మాపయిత్వా కండోలం పూరయ."
english = "After measuring it, fill the basket."

[[sections.items]]
n = 18
sanskrit_telugu = "బలిద్ధస్య పాదే ఏకః సామాస్ఫోటః ఉద్భూయ అతీవ బాధతే."
english = "On Balidda's foot, a blister has arisen and is causing great pain."

[[sections.items]]
n = 19
sanskrit_telugu = "సర్వదా పాదః శూలతి."
english = "The foot throbs with pain constantly."

[[sections.items]]
n = 20
sanskrit_telugu = "యుష్మద్దురుపుత్రః ప్రతి దినం ఏకం శ్వనకం స్వేన సాకం తటాకసమీపం నీత్వా తటాకజలే స్నపయతి."
english = "Your teacher's son takes a dog with him every day to the lake and bathes it in the lake water."

[[sections.items]]
n = 21
sanskrit_telugu = "సః ఉన్మత్త ఇవ భాతి."
english = "He appears to be mad."

[[sections.items]]
n = 22
sanskrit_telugu = "ఉన్మత్తః నహి మదనోఽత్తః."
english = "He is not mad — he is love-struck."

[[sections.items]]
n = 23
sanskrit_telugu = "తస్య ఏక వారం 'శుండ్యంతాం' కరవామ."
english = "Let us give him a good drubbing once."

# --- passage_translation ---

[[sections]]
type = "passage_translation"
language = "telugu"

[[sections.items]]
n = 1
telugu = "రాభోవు చవితియే వినాయకచవితి."
english = "The upcoming Caturthi is Vināyaka Caturthi."

[[sections.items]]
n = 2
telugu = "మాయింట్లో వినాయకుఁ డున్నాఁడురా?"
english = "Is there a Vināyaka idol in your house?"

[[sections.items]]
n = 3
telugu = "ఆహో [ఉన్నాఁడు మాత్రమే కాదు = న కేవల మస్తి.] కాని మాతో ప్రతిరోజును ఆడుకొనుచున్నాఁడు."
english = "Oh yes, not only is he there (na kevalam asti) — he plays with us every single day."

[[sections.items]]
n = 4
telugu = "అయితే (మొరు వినాయకుని కొనకఁ్కరలేదా= యుష్మాకం వినాయకం క్రేతుం అవసరఽ నాస్తి కిం?) లేదులేదు ఎప్పుఁడును వినాయకుఁడు మా యింటియొద్దనే ఉన్నాఁడు."
english = "Then (is there no need for you to buy a Vināyaka = yuṣmākaṃ vināyakaṃ kretuṃ avaro nāsti kim?) No, no — Vināyaka has always been right at our house."

[[sections.items]]
n = 5
telugu = "ఎవఁడురా ఆ వినాయకుఁడు?"
english = "Who is that Vināyaka, then?"

[[sections.items]]
n = 6
telugu = "అప్పులాచార్యులగారి కుమారుఁడే కాదండి!"
english = "Why, it is none other than Appulācārya's son!"

[[sections.items]]
n = 7
telugu = "కానిచో అంత పొట్ట మఱియెవనికున్నది?"
english = "Otherwise, who else has such a belly?"

[[sections.items]]
n = 8
telugu = "అరే అదికాదురా ఓ రి పిచ్చివాఁడా!"
english = "Hey, that is not it — you fool!"

[[sections.items]]
n = 9
telugu = "అప్పులాచార్యుల కొడుకును చవితియందు మాయింటికి తెచ్చి స్నానము చేయించి పూజింతువుతురా?"
english = "Will you bring Appulācārya's son to our house on Caturthi, bathe him, and worship him?"

[[sections.items]]
n = 10
telugu = "సరే యిప్పుడు [తెలిసెను = జ్ఞాతం] మాయింట్లో వినాయకులు లేరుగాని వినాయకుని తండ్రులు చాలమంది గలరు."
english = "All right, now I understand (jñātam) — there are no Vināyakas in our house, but there are many fathers of Vināyaka."

[[sections.items]]
n = 11
telugu = "మా అమ్మఁ వినాయకుని తండ్రితో మినపప్పును రుబ్బినది (= అమర్దయత్.)"
english = "Our mother ground black gram lentils with Vināyaka's father (= amarddayat)."

[[sections.items]]
n = 12
telugu = "రాముఁడు అరణ్యమ నందున్నప్పుఁడు మూనులందఱును రాముని సేవించిరి."
english = "When Rāma was in the forest, all the sages served Rāma."

[[sections.items]]
n = 13
telugu = "రాముఁడు మూనులయొక్కఁ భయమును నివారించి సమస్త రాక్షసులను సంహరించి లోకమును సౌఖ్యముతో రక్షించెను."
english = "Rāma removed the fear of the sages, destroyed all the rākṣasas, and protected the world with happiness."

[[sections.items]]
n = 14
telugu = "రేపాఁక్కమారు మీఁ అబ్బాయిని బడినుండి పిలిపింపుము."
english = "Tomorrow once, have your boy called from school."
