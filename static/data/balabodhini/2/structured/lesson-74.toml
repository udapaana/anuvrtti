# --- grammar note: strīliṅga ṛ-kārānta stems ---

[[sections]]
type = "grammar_note"
language = "meta"

[[sections.items]]
telugu = """పుంలింగము-ఋకారాంతము స్త్రీలింగ ఋకారాంతములు నాలుగు
(యాతృ) యాతా = తోఁడికోఁడలు
(మాతృ) మాతా = తల్లి
(దుహితృ) దుహితా = కూఁతురు
(సనందృ) సనందా = ఆఁడుబిడ్డ
ఈ నాలుగు శబ్దములు స్త్రీలింగములు గాన ద్వితీయా బహావచనములో 'తౄన్' అని వచ్చును. తక్కిన దంతయు పితృశబ్దమువలెనే ఉండును."""
english = "There are four feminine ṛ-stem words: yātṛ (sister-in-law), mātṛ (mother), duhitṛ (daughter), nanandṛ (girl-child). Being feminine, their dvitīyā bahuvacanam ends in -tṝn. The rest follow the pitṛ pattern."

# --- grammar note: jāmātṛ, bhrātṛ ---

[[sections]]
type = "grammar_note"
language = "meta"

[[sections.items]]
telugu = "[జామాతృ] జాతామా = అల్లుఁడు [భ్రాతృ] భ్రాతా = అన్న"
english = "jāmātṛ = son-in-law; bhrātṛ = brother."

[[sections.items]]
telugu = "పుంలింగములు గాన 'పితృ' శబ్దమువలెనే ఉండును."
english = "Being masculine, they follow the pitṛ pattern."

# --- grammar note: dhātuja viśeṣaṇa ---

[[sections]]
type = "grammar_note"
language = "meta"

[[sections.items]]
telugu = """ఈ పైన వ్రాయఁబడినట్టి పుంలింగములగు పితృ-భ్రాతృ - జామాతృ శబ్దములును స్త్రీలింగములగు మాతృ-దుహితృ-యాతృ-సనందృ శబ్దములను మొత్రము ఏడు శబ్దములుగాక తక్కిన ఋకారాంత శబ్దములన్నియు[ధాతుజ విశేషణములే.] అనఁగా క్రియమొదనుండి పుట్టిన విశేషణవాచకములే యీ పుస్తకమునందు వ్రాయఁబడును. అట్టి శబ్దములు విశేషణ వాచకములు; అనఁగా నామవాచకమొక్కఁ పనిని దెలుఁపునవి గాన, నామవాచక మే లింగమందుండిన నాలింగమునందే యుండును. అందుచే ధాతుజవిశేషణములగు ఋకారాంత శబ్దములు పుంలింగమున నొకరీతిగా. నపుంసకస్త్రీలింగమున నొకరీతిగా"""
english = "Apart from the seven stems listed above (pitṛ, bhrātṛ, jāmātṛ, mātṛ, duhitṛ, yātṛ, nanandṛ), all other ṛ-kārānta words are dhātuja viśeṣaṇas (verbal adjectives derived from roots). Being adjectives, they take the gender of the noun they qualify."

[[sections.items]]
telugu = """అందు ధాతుజవిశేషణమైన పుంలింగమయిన లింగమున నొకరీతిగా నుండును. అందు ధాతుజవిశేషణమైన పుంలింగమయిన లింగమున నొకరీతిగా నుండును. ప్రథమా ఋకారాంత శబ్దముకూడ 'పితృ' శబ్దమువలెనే యుండును. ప్రథమా బహావచనమునందు మాత్రము రెంటికిని భేదము."""
english = "The masculine dhātuja viśeṣaṇa ṛ-stem also follows the pitṛ pattern. The only difference is in prathamā bahuvacanam."

[[sections.items]]
telugu = """'దా' అను ధాతువుమొదనుండి పుట్టిన ధాతుజవిశేషణము. 'దాతా' = ఇచ్చువాఁడు. 'దాతృ' శబ్దము దీని ప్రథమా బహావచనము 'దాతారః'. 'పితృ' శబ్ద ప్రథమా బహావచనము 'పితరః'. ఇచటనే భేదము. ధాతుజ విశేషణములగు ఋకారాంత శబ్దము లన్నియు స్త్రీలింగములో ఈకారాంతములై [గౌరి] శబ్దమువంటివగును. దాత్రీ = ఇచ్చునట్టియాఁడది అని అర్థము. ప్ర-దాత్రీ-దాత్రీఽ"""
english = "The dhātuja viśeṣaṇa from √dā is dātṛ (dātā = giver). Its prathamā bahuvacanam is dātāraḥ, whereas pitṛ has pitaraḥ — this is the only difference. In the feminine, dhātuja viśeṣaṇa ṛ-stems become ī-stems like gaurī. E.g. dātrī = she who gives."

