english = "What are you all doing standing there? (Forgive, forgive = please excuse us.)"

# --- passage_translation ---

[[sections]]
type = "passage_translation"
language = "telugu"

[[sections.items]]
n = 1
telugu = "మాచెట్టుయొక్కఁ ఆకులను త్రుంచవద్దుచెట్టు చచ్చును."
english = "Do not pluck the leaves of our tree — the tree will die."

[[sections.items]]
n = 2
telugu = "ఇంట్లో మినపగింజ లేమైనా నున్నవా?"
english = "Are there any black gram seeds at home?"

[[sections.items]]
n = 3
telugu = "నిన్నఁ రాత్రి బొత్తుగా గాలి వీచలేదు."
english = "Last night there was absolutely no breeze at all."

[[sections.items]]
n = 4
telugu = "శ్రావణ మాసమునందుకూడ వేసవికాలమువలె నున్నది."
english = "Even in the month of Śrāvaṇa it feels like summer."

[[sections.items]]
n = 5
telugu = "దక్షిణముగా వెళ్ళుటకు వేలు లేదు."
english = "There is no finger pointing southward (i.e., no way or direction to go south)."

[[sections.items]]
n = 6
telugu = "లేకపోయినయెడల ఉత్తరముగా వెళ్ళుఁడు అక్కఁడనెవరో ఉన్నారు."
english = "If that is not possible, go northward — there are some people there."

[[sections.items]]
n = 7
telugu = "ఇక్కఁడ ఉమ్మి వేయవద్దు."
english = "Do not spit here."

[[sections.items]]
n = 8
telugu = "ఇక్కఁడ అలికినాము."
english = "We have plastered this place."

[[sections.items]]
n = 9
telugu = "మీఁ తండ్రి ఇక్కఁడ కూర్చుండి సంధ్యావందనము చేయఁగలఁడు."
english = "Your father can sit here and perform the evening worship."

[[sections.items]]
n = 10
telugu = "మాతండ్రి సంధ్యావందనమును (మఱచిపోయినాఁడు = వ్యస్మరత్) బెండిగింజలున్న యెడల (పాదచేసి = అలవాలంకృత్వా) పెట్టుము."
english = "Our father has forgotten (vyasmarat) the evening worship — if there are okra seeds, plant them after preparing the bed (alāvālaṃkṛtvā)."

[[sections.items]]
n = 11
telugu = "నాగ్రంథము ఎవఁడు వ్యాఖ్యానమును చేయుచున్నాఁడు? మీఁ గురువుగారే."
english = "Who is commenting on my text? Your teacher himself."

[[sections.items]]
n = 12
telugu = "అరే ఈశ్లోకముదగ్గర ఆయన పొరపడినాఁడు."
english = "Hey, he has made a mistake at this verse."

[[sections.items]]
n = 13
telugu = "గురువునకుగూడ పొరపాటేనా? గురువైనేమి గిరువైన నేమి?"
english = "Even a teacher makes mistakes? What does it matter whether it is a teacher or anyone else?"

[[sections.items]]
n = 14
telugu = "మాపొలములో సస్యము పండినదా? మాపొలములో దర్భలు (పెరుగుచున్నవి = వర్థంతే) ఇప్వేళ గుమ్మడి గింజ మొలచినది."
english = "Has the crop ripened in our field? Kusha grass is growing (vardhante) in our field — just now a pumpkin seed has sprouted."

[[sections.items]]
n = 15
telugu = "ఎందుకు మాటికి వానిని అటుల బ్రతిమాలెదవు?"
english = "Why do you keep pleading with him like that again and again?"

[[sections.items]]
n = 16
telugu = "ఏటుకూరికి త్రోవ యేదండి? ఉత్తరముగా పోయి మరల ఎడమప్రక్కగా పొండు."
english = "Which is the way to Eṭukūru, sir? Go north and then turn to the left."

[[sections.items]]
n = 17
telugu = "అక్కఁడ నొక త్రోవ కనఁబడను అదే ఏటుకూరి దారి."
english = "There a road becomes visible — that is the way to Eṭukūru."
