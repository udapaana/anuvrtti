# --- passage ---

[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "అద్య ప్రాతః కస్య ముఖ మపశ్యంవా వామపాదే కంటకః అలగత్."
english = "This morning, whose face did I see? A thorn got stuck in my left foot."

[[sections.items]]
n = 2
sanskrit_telugu = "పూర్వేద్యుః రాత్రా చణకాన్ అభక్షయం."
english = "The night before last I ate chickpeas."

[[sections.items]]
n = 3
sanskrit_telugu = "ఉదరే శూలా ఉత్పన్నా."
english = "Colic pains arose in the stomach."

[[sections.items]]
n = 4
sanskrit_telugu = "అతః బహుకృత్వః బహిర్గమనావసరః ఆసీత్."
english = "Therefore there was occasion to go outside many times."

[[sections.items]]
n = 5
sanskrit_telugu = "తేషాం గృహే ప్రతిదినం ముద్గసూపమేవ కురుఽఠ."
english = "In their house every day only mung bean soup is prepared."

[[sections.items]]
n = 6
sanskrit_telugu = "మమవచనం కః శ్రుణయాత్?"
english = "Who would listen to my words?"

[[sections.items]]
n = 7
sanskrit_telugu = "నకోఽపి శ్రుణోతి."
english = "Nobody listens."

[[sections.items]]
n = 8
sanskrit_telugu = "కుళుద్ధాన్ పక్తా్వా అశ్వేభ్యః అయచ్చన్ కిం?"
english = "Did they cook horse gram and give it to the horses?"

[[sections.items]]
n = 9
sanskrit_telugu = "పాత్రస్థితా నృక్వకుళుద్ధాన్ తాతాచార్యః చోరయిత్వా అవరణే కుత్రవా కోణే ఉపవిశ్య అభక్షయత్."
english = "Tātācārya stole the horse gram that was in the vessel and, sitting in some corner of the enclosure, ate it."

[[sections.items]]
n = 10
sanskrit_telugu = "ఏవం చౌర్యం కరోతిచేత్రం అస్మద్గృహాత్ శీఘ్రం ప్రసాపయిష్యామి."
english = "If he does such theft, I will quickly expel him from our house."

[[sections.items]]
n = 11
sanskrit_telugu = "కుళుద్ధాదికాన్ గిళిత్వా అనంతరం దేవపూజాం కరిష్యతి కింవా?"
english = "Will he perform the worship of God after swallowing horse gram and the like?"

[[sections.items]]
n = 12
sanskrit_telugu = "సః శీఘ్రమేవ అస్మద్గృహాత్ బహిష్కర్తవ్యః."
english = "He must be expelled from our house very quickly."

[[sections.items]]
n = 13
sanskrit_telugu = "విరమ విరమ సః అత్రైవాగచ్చతి."
english = "Stop, stop — he is coming here only."

[[sections.items]]
n = 14
sanskrit_telugu = "గోధూమపిష్టే పిపీలికా స్సంతి సమ్యక్ వస్తేన గాళయ."
english = "There are ants in the wheat flour; strain it properly with a cloth."

[[sections.items]]
n = 15
sanskrit_telugu = "తవోపాధ్యాయస్య త్వయి కోపః సమ్యగ్ గచ్చత్;"
english = "Your teacher's anger at you is fitting;"

[[sections.items]]
n = 16
sanskrit_telugu = "శీఘ్రం గత్వా తం ప్రసాదయ."
english = "Go quickly and propitiate him."

[[sections.items]]
n = 17
sanskrit_telugu = "బాలకః అంగణే గువతి."
english = "The boy is defecating in the courtyard."

[[sections.items]]
n = 18
sanskrit_telugu = "పానీయం సర్వం తథా శీఘ్రం గత్వా తం ప్రసాదయ."
english = "All the water — likewise, go quickly and propitiate him."

[[sections.items]]
