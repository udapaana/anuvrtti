# --- Passage ---

[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "ఏవ బాలకః నూతన ఇవాస్తి."
english = "This boy seems to be a newcomer."

[[sections.items]]
n = 2
sanskrit_telugu = "సత్త్వమేవ."
english = "Indeed (that is true)."

[[sections.items]]
n = 3
sanskrit_telugu = "నాగాంబయాః పుత్రః విశాఖపత్తనాత్ ఆగచ్చత్."
english = "Nāgāmbā's son came from Viśākhapattana."

[[sections.items]]
n = 4
sanskrit_telugu = "నాగాంబా కా? సాపి మామ నూతనా."
english = "Who is Nāgāmbā? She is also new to me."

[[sections.items]]
n = 5
sanskrit_telugu = "కోదండరామస్య ద్వితీయభార్యా."
english = "She is Kodaṇḍarāma's second wife."

[[sections.items]]
n = 6
sanskrit_telugu = "కోదండరామః కోనురే? అప్పులాచార్యస్య శ్వశురః."
english = "Who is Kodaṇḍarāma? He is Appulācārya's father-in-law."

[[sections.items]]
n = 7
sanskrit_telugu = "అప్పులాచార్యః ఇదానీం కాఁస్తి? దేశాంతరం గతః."
english = "Where is Appulācārya now? He has gone to another country."

[[sections.items]]
n = 8
sanskrit_telugu = "యుష్మద్గృహే శాకపాకాదికాని కా అకరోత్? సా ఏవ."
english = "Who cooked vegetables and such things at your house? She (Nāgāmbā) herself did."

[[sections.items]]
n = 9
sanskrit_telugu = "త్వదగ్రజస్య కః ఉద్యోగః? ఉద్యోగవచనం కిమర్థంతు."
english = "What is your elder brother's occupation? Why (even) speak of occupation?"

[[sections.items]]
n = 10
sanskrit_telugu = "ఏకం ప్రశ్నం ప్రక్ష్యామి కథయ."
english = "I will ask one question — tell me."

[[sections.items]]
n = 11
sanskrit_telugu = "కః ప్రశ్నః? తస్యాః గర్భే పుత్రః అస్తివా."
english = "What question? Is there a son in her womb?"

[[sections.items]]
n = 12
sanskrit_telugu = "పుత్రికా అస్తివా? ఈషదాలోచ్య కథయిష్యామి."
english = "Or is there a daughter? I will think for a moment and then tell you."

[[sections.items]]
n = 13
sanskrit_telugu = "తావత్పర్యంతం బహిః స్థిష్ఠ."
english = "Until then, wait outside."

[[sections.items]]
n = 14
sanskrit_telugu = "అంతరా'గచ్చ."
english = "Come inside."

[[sections.items]]
n = 15
sanskrit_telugu = "తద్దైవ స్థాస్యామి; రుటితి కథయిష్యథకిం? నక్షత్రాణి గణయిత్వా అనంతరం పుత్రః జనిష్యతేవా పుత్రికా జనిష్యతే వా వదిష్యామి."
english = "I will stay just there. What — will you tell (the answer) quickly? After counting the stars I will say whether a son will be born or a daughter will be born."

[[sections.items]]
n = 16
sanskrit_telugu = "త్వరిష్యసే కిమర్థం? మామ త్వరా నాస్తి తాతాచార్య! మాకుపఱ."
english = "Why are you hurrying? There is no hurry for me, Tātācārya! Don't be angry."

[[sections.items]]
n = 17
sanskrit_telugu = "చీరాండేయ! అహాం కుప్యామి కిం? త్వమేవ మాం త్వరయసే వృథా."
english = "You foolish one! Am I angry? It is you who are rushing me for no reason."

[[sections.items]]
n = 18
sanskrit_telugu = "తత్ర స్తంభోపరి పంచాంగమస్తి; ఇత్థ మానయ."
english = "On that pillar there is an almanac; bring it here."

[[sections.items]]
n = 19
sanskrit_telugu = "మామ నశక్యతే ఆనేతుం."
english = "I am not able to bring it."

[[sections.items]]
n = 20
sanskrit_telugu = "తావనాస్తి[తేఁజైవ తవ మర్యాదా గచ్చతి కిం? భగ్న కనిష్ఠికాయాం న మూత్రయిష్యస్యపి."
english = "Is your dignity only this much? Even with a broken little finger you cannot urinate."

[[sections.items]]
n = 21
sanskrit_telugu = "ప్రథమతః త్వం బహిర్గచ్చ."
english = "First, you go outside."

[[sections.items]]
n = 22
sanskrit_telugu = "అనంతరం అహా మాలోచయిష్యామి."
english = "Afterwards I will deliberate."

[[sections.items]]
n = 23
sanskrit_telugu = "కోవా ఆగచ్చతి అంతః ఓహో హహో! వైద్యః బలిదాచార్యః ఆగతః."
english = "Who is coming inside? Oh ho! The physician Balidācārya has come."

[[sections.items]]
n = 24
sanskrit_telugu = "అస్తు నామ."
english = "Very well then."

# --- Passage Translation ---

[[sections]]
type = "passage_translation"
language = "telugu"

[[sections.items]]
n = 1
telugu = "అరే నీ మేడలో జండెము కనఁబడదేమి?"
english = "Hey, why is your sacred thread not visible on the upper body?"

[[sections.items]]
n = 2
telugu = "అయ్యో."
english = "Oh no."

[[sections.items]]
n = 3
telugu = "చెఱువులో స్నానము చేయనప్పుడు మేడనుండి జాఱిపోయినది."
english = "While bathing in the tank it slipped off the terrace (shoulder)."

[[sections.items]]
n = 4
telugu = "ఏమోరా ఇప్పుడేమి చేయుదును?"
english = "What can I do now, man?"

[[sections.items]]
n = 5
telugu = "మా తండ్రి చూచినయెడల (చూస్తే) కొట్టగలఁడు(కొడతాడు)."
english = "If my father sees (if he sees), he will beat me (he will beat)."

[[sections.items]]
n = 6
telugu = "నీదగ్గర నొక జండెమున్న యెడల నాకొఱికిత్తువా?"
english = "If you have a sacred thread with you, will you give it to me?"

[[sections.items]]
n = 7
telugu = "రేపు మరల నీకిచ్చెదను."
english = "I will give it back to you again tomorrow."

[[sections.items]]
n = 8
telugu = "వారందఱు నెవరి బాంధవులు?"
english = "Whose relatives are all of them?"

[[sections.items]]
n = 9
telugu = "మొదట అక్కఁడ పీఁట వేసి దానిమొంద దర్పాసనము పఱచుము."
english = "First place a stool there and spread a carpet on top of it."

[[sections.items]]
n = 10
telugu = "నేను స్నానము చేసి వచ్చి సంధ్యావందనము చేసికొందును."
english = "I will bathe, come back, and perform the twilight prayer."

[[sections.items]]
n = 11
telugu = "మీఁ అమ్మఁ కోపము చేయునేమో త్వరగా పొమ్ము; భోజనమైన తర్వాత వత్తువుగాని."
english = "Your mother might get angry — go quickly; you can come after the meal."

[[sections.items]]
n = 12
telugu = "రేపు సాయంకాలమునందు రామాయణమును ప్రారంభింపుము."
english = "Begin the Rāmāyaṇa tomorrow evening."

[[sections.items]]
n = 13
telugu = "నిన్నఁ మీఁ యింటికి వైద్యుఁడు వచ్చినాఁడెందుకురా?"
english = "Why did a physician come to your house yesterday, man?"

[[sections.items]]
n = 14
telugu = "అంతమాత్రానికే కోపపడెదవేల?"
english = "Why do you get angry over just this much?"

[[sections.items]]
n = 15
telugu = "మా యూరిలో రేపటినుండియు రాముల వారికి ఉత్సవములు జరుగును."
english = "In our village, starting from tomorrow, the Rāma festival will take place."

[[sections.items]]
n = 16
telugu = "నీకు మాయందు అపేక్ష యున్న యెడల ఉత్సవము చూచుట్కైనను మాయూరికి వచ్చి మమ్మును చూడఁగలవు; లేకపోయిన యెడల లేదు."
english = "If you care for us, you can at least come to our village to see the festival and visit us; otherwise, don't."

[[sections.items]]
n = 17
telugu = "నా కూంతుసకు కూంతురు పుట్టినది."
english = "A daughter has been born to my daughter."

[[sections.items]]
n = 18
telugu = "(నాలుగు దినమాళైనవి = దినచతుష్టయం అసీత్.)"
english = "(Four days have passed = dinacatuṣṭayaṃ asīt.)"

[[sections.items]]
n = 19
telugu = "అయిదవ దినమందు పథ్యమును ఇత్తురు."
english = "On the fifth day they will give the prescribed diet."

[[sections.items]]
n = 20
telugu = "వారు నిన్నఁనే యజ్ఞమును మొదలుపెట్టినారు."
english = "They started the yajña just yesterday."

[[sections.items]]
n = 21
telugu = "దానితో గూడ సప్తాహమును గూడ చేయుదురఁటు."
english = "Along with that they will also conduct a week-long recitation, I hear."

[[sections.items]]
n = 22
telugu = "బాగుగానే యున్నది."
english = "That is very good."
