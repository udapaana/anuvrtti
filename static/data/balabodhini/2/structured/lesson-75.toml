# --- passage ---

[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "యుష్మాదృశాన్ మూఢాన్ అనేకా సపశ్యామ వయం గచ్చత గచ్చత."
english = "We see many fools like you — go, go!"

[[sections.items]]
n = 2
sanskrit_telugu = "అద్య గృహే పర్ణాని నసంతి; తటాకం గత్వా పద్మిప్రాణి లవిత్వా ఆనయ."
english = "Today there are no leaves at home; go to the lake, cut some lotus leaves and bring them."

[[sections.items]]
n = 3
sanskrit_telugu = "అస్మద్దుహళా ప్రసూతాఖలు ఏకాదశదినాని గతాని."
english = "Our cow has calved — eleven days have passed, haven't they."

[[sections.items]]
n = 4
sanskrit_telugu = "ఇతఃపరం తస్యాఽ క్షీరాదికం గ్రహాభ్యమేవ అస్మాభిఽ."
english = "From now on it is we who must take her milk and so on."

[[sections.items]]
n = 5
sanskrit_telugu = "నృపోద్యానే చంపకాని."
english = "In the king's garden there are champaka trees."

[[sections.items]]
n = 6
sanskrit_telugu = "వకుళాని సంతిఖలు వనపాలాన్ ప్రష్ట్వా పి లూనీహి."
english = "And vakula trees too — ask the forest-keepers and then cut (the flowers)."

[[sections.items]]
n = 7
sanskrit_telugu = "ఏతత్కాళే శ్రాద్ధకర్తారఽ కేపి న సంతి."
english = "In this age there are hardly any performers of śrāddha."

[[sections.items]]
n = 8
sanskrit_telugu = "కలికాలఽ సమాయతఽ."
english = "The Kali age has arrived."

[[sections.items]]
n = 9
sanskrit_telugu = "పనసఫలం అస్మభ్యం కఽ అప్రేషయత్?"
english = "Who sent us the jackfruit?"

[[sections.items]]
n = 10
sanskrit_telugu = "మల్లికాముకుళాఽ సమ్యగ్వికసంతి; పుష్పవృక్షాన్ ప్రతిదినం సాయం ప్రాతళ్ళు జలేన సమ్యక్ సించత."
english = "The jasmine buds are blooming nicely; water the flowering plants well every day morning and evening."

[[sections.items]]
n = 11
sanskrit_telugu = "వ్యజన మానీయ తం బ్రాహ్మణం వీజయ."
english = "Bringing a fan, fan that brahmin."

[[sections.items]]
n = 12
sanskrit_telugu = "గృహే అట్లు మస్తివా నవా?"
english = "Is there firewood at home or not?"

[[sections.items]]
n = 13
sanskrit_telugu = "అస్తితు."
english = "Yes there is."

[[sections.items]]
n = 14
sanskrit_telugu = "శుష్కం న."
english = "Is it not dry?"

[[sections.items]]
n = 15
sanskrit_telugu = "ఆర్దం తర్హి అంతికా కథం జ్వలేత్ గోపాలఽ ఆగచ్చ దితి భాతి."
english = "If it is wet, how will the hearth burn? Gopāla, it seems, is about to come."

[[sections.items]]
n = 16
sanskrit_telugu = "బహళాం చారయితుం వత్సేవ సహ మోచయ."
english = "Release the calf along with the cow to graze."

[[sections.items]]
n = 17
sanskrit_telugu = "అద్య శకటం క శోచేదయిష్యతి?"
english = "Who will yoke the cart today?"

[[sections.items]]
n = 18
sanskrit_telugu = "యూయం పూర్వం కృత్వాఽ?"
english = "Have you done it before?"

[[sections.items]]
n = 19
sanskrit_telugu = "అస్మత్పూర్వాఽ ప్రథమం దాక్షిణాత్యఽ దారిద్ర్యదోషేణ అశనాభావాత్ అత్రాగత్య అజీవన్."
english = "Our forebears first came here from the South due to poverty and lack of food and lived here."

[[sections.items]]
n = 20
sanskrit_telugu = "శతాబ్ది గతా."
english = "A century has passed."

[[sections.items]]
n = 21
sanskrit_telugu = "నసృశలాటుఽ కుత్రా స్ఫోఽ?"
english = "Where has the unripe coconut gone?"

[[sections.items]]
n = 22
sanskrit_telugu = "గవాక్షే అస్థాపయం పశ్యరే."
english = "Look — I placed it in the window."

[[sections.items]]
n = 23
sanskrit_telugu = "కువలయాని ఆనయేయం కిం?"
english = "Shall I bring water-lilies?"

[[sections.items]]
n = 24
sanskrit_telugu = "మా మా."
english = "No, no."

[[sections.items]]
n = 25
sanskrit_telugu = "మతస్యర్జికీశాకం తుభ్యం న రోచతే కిం?"
english = "Does fish-leaf vegetable not please you?"

[[sections.items]]
n = 26
sanskrit_telugu = "పరిహారసి కిం రే?"
english = "Why are you joking?"

[[sections.items]]
n = 27
sanskrit_telugu = "న పరిహారేయం."
english = "I am not joking."

# --- passage_translation ---

[[sections]]
type = "passage_translation"
language = "telugu"

[[sections.items]]
n = 1
telugu = "మీఁ తాతగారు మొన్నఁ మొన్నటిదాఁక మా పళ్ళెలోనున్నవాఁడే; ఇప్పుఁడు మాత్రము మొరు నాగరికులు అయితిరి."
english = "Your grandfather was eating from our plate just the day before yesterday; now however you have become city folk."

[[sections.items]]
n = 2
telugu = "మేము జానపదులమేగదా."
english = "We are just village people, aren't we."

[[sections.items]]
n = 3
telugu = "పొనింటు మనకు శ్రావణపూర్ణిమయందు యజ్ఞోపవీతధారణము కాఁగలదు."
english = "As for us, the sacred thread ceremony will take place on Śrāvaṇa Pūrṇimā."

[[sections.items]]
n = 4
telugu = "మన మందఱము ప్రొద్దున లేచి, దంతధావనాదికము చేసికొని, నదిలో స్నానము చేసి, యజ్ఞోపవీతములను వేసికొందుము."
english = "We shall all rise in the morning, perform tooth-cleaning and other duties, bathe in the river, and put on the sacred threads."

[[sections.items]]
n = 5
telugu = "[మీఁ ఆవిని = ప్రసూతాయాఽ యుష్మద్దుహళాయాఽ] పదునొకండవరోజు గడచిన యెడల దాని పెరుగు పాలు నెయ్య మఱ్ఱిగ వెన్న పుచ్చుకొనఁదగినదే."
english = "Once eleven days have passed since your cow calved (prasūtāyāḥ yuṣmad duhiḷāyāḥ), one may then take its curd, milk, ghee, buttermilk, and butter."

[[sections.items]]
n = 6
telugu = "మా పొగడచెట్టుసందు అంతటను పూవులున్నవి."
english = "The whole area between our vakula trees is full of flowers."

[[sections.items]]
n = 7
telugu = "మొతమ్మునిఁ కాలిమొంద కురు పెట్టుచున్నది?"
english = "Is a boil forming on your mother's foot?"

[[sections.items]]
n = 8
telugu = "మా యింటిలో నొక రొకరికి సరిపడదు = [అనుకూల్యంనాస్తి] మా దొడ్డికి గోడలేదు; అందుచే గాడిదలు లోపల ప్రవేశించుచున్నవి."
english = "In our house no one gets along with anyone else (anukūlyaṃ nāsti) — our yard has no wall; because of that donkeys are entering inside."

[[sections.items]]
n = 9
telugu = "మొపిల్లఁ వానిని విద్యాభ్యాసముకొఱకు చెన్నపత్తనమునకు ప్రయాణము చేయించినావా?"
english = "Have you sent that boy on a journey to Chennai for his education?"

[[sections.items]]
n = 10
telugu = "రాఁబోవు బహుళపంచమి సోమవాసరమున బాగుగ నున్నదని మా పురోహితుఁడు చెప్పినాఁడు; కాఁబట్టి ఆనాఁడు పంపెదను."
english = "Our priest said the upcoming dark-fortnight fifth day on a Monday is auspicious; so I will send him on that day."

[[sections.items]]
n = 11
telugu = "గఱ్ఱికి పెద వేసి కట్టినయెడల మంచిది అని వైద్యులు చెప్పినారు."
english = "The physicians said it would be good to apply a splint and bind it."

[[sections.items]]
n = 12
telugu = "నీవాఁక దున్నఁపోతువు."
english = "You will go to plough the field now."

[[sections.items]]
n = 13
telugu = "మా మాటను వినవు."
english = "You do not listen to our word."
