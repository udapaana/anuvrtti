# ---- passage (Sanskrit) ----

[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "ప్రతిదినం దివా ఆకాశే సూర్యః ప్రకాశతే."
english = "Every day the sun shines in the sky during the daytime."

[[sections.items]]
n = 2
sanskrit_telugu = "నక్తం చంద్రః ప్రకాశతే."
english = "At night the moon shines."

[[sections.items]]
n = 3
sanskrit_telugu = "మేఘాః సమ్యక్ అవర్షన్."
english = "The clouds rained well."

[[sections.items]]
n = 4
sanskrit_telugu = "సముద్రజలం సర్వం అపి లవణం."
english = "All the water of the ocean is salty."

[[sections.items]]
n = 5
sanskrit_telugu = "బ్రాహ్మణేభ్యః ద్రప్సం పరివేషయత."
english = "Serve curd to the Brahmins."

[[sections.items]]
n = 6
sanskrit_telugu = "తవ పుత్రః అతీవ దుష్టః; యుష్మదనుజః యోగ్యః."
english = "Your son is very wicked; your younger brother is worthy."

[[sections.items]]
n = 7
sanskrit_telugu = "సమీచీనం ఏకం ఉర్వారుకఫలం ఇత్థం ఆనయరే; భేదయిత్వా ఖాదామ."
english = "Bring a good cucumber fruit here; we will cut and eat it."

[[sections.items]]
n = 8
sanskrit_telugu = "ఘురికా నాస్తి గృహే."
english = "There is no knife at home."

[[sections.items]]
n = 9
sanskrit_telugu = "కథం భేదయిష్యసి ?"
english = "How will you cut it?"

[[sections.items]]
n = 10
sanskrit_telugu = "దంత్రైః ఏవ దృష్ట్వాపి ఖాదామ."
english = "Even after seeing, let us just eat with our teeth."

[[sections.items]]
n = 11
sanskrit_telugu = "నోచేత్ తూష్టీం స్థాస్యామః కిం?"
english = "Otherwise shall we just remain silent?"

[[sections.items]]
n = 12
sanskrit_telugu = "హ్యః సాయం సమయే చోరాః ఆగత్య అస్మాకం సర్వేషాం గృహేమ పాషాణాన్ అపాతయన్."
english = "Yesterday evening, thieves came and threw stones at all our houses."

[[sections.items]]
n = 13
sanskrit_telugu = "తదా కతిచిత్ మనుష్యాః తాన్ చోరాన్ (అన్వధావన్ = వెంటపరుగెత్తిరి.)"
english = "Then some men chased those thieves."

[[sections.items]]
n = 14
sanskrit_telugu = "కింతు తే చోరాః మనుష్యాన్ త్రాసయిత్వా పాషాణేఃఆతాడయన్."
english = "But those thieves frightened the people and struck them with stones."

[[sections.items]]
n = 15
sanskrit_telugu = "తే మనుష్యాః స్త్రత్ స్థిత్వా పునః స్వగృహాణి అధావన్."
english = "Those people stopped there and ran back to their own houses."

[[sections.items]]
n = 16
sanskrit_telugu = "ఏకదా ఏకః బలిష్ఠః వృషభః అస్మదావరణే పతిత్వా సర్వాన్ దార్వికావృక్షాన్ ఉర్వారుకవృక్షాన్ చ అఖాదత్."
english = "Once a strong bull broke into our enclosure and ate all the drumstick trees and cucumber plants."

[[sections.items]]
n = 17
sanskrit_telugu = "అరే మూఢ! ప్రథమం రామాయణం పఠరే అనంతరం భారతం పఠరే."
english = "Hey fool! First read the Ramayana and then read the Mahabharata."

[[sections.items]]
n = 18
sanskrit_telugu = "చీ! ఖర! దూరం గచ్చ; తవ జనకః ఆగచ్చతి ఆగచ్చతి శీఘ్రం వృక్షాత్ అవరోహ."
english = "Shame! Donkey! Go away; your father is coming, coming — quickly climb down from the tree."

[[sections.items]]
n = 19
sanskrit_telugu = "సః ద్రక్ష్యతిచేత్ తాడయిష్యతి."
english = "If he sees you, he will beat you."

[[sections.items]]
n = 20
sanskrit_telugu = "మాధావ మాధావ; శ్నైః ఆగచ్చ."
english = "Madhava, Madhava; come slowly."

[[sections.items]]
n = 21
sanskrit_telugu = "నోచేత్ అధః పతేః."
english = "Otherwise you will fall down."

[[sections.items]]
n = 22
sanskrit_telugu = "హ్యః మధ్యాహ్నో సూర్యః సమ్యకాకాశత."
english = "Yesterday at noon the sun shone well."

[[sections.items]]
n = 23
sanskrit_telugu = "అద్య ఆకాశే మేఘాః సంతి ఖలు తదర్థం సమ్యక్ నప్రకాశతే."
english = "Today there are clouds in the sky, so the sun does not shine well."

[[sections.items]]
n = 24
sanskrit_telugu = "సర్వేషాం పర్ణేమ శాకం పర్యవేషయన్ కిం ?"
english = "Did you serve vegetables on the leaf to everyone?"

[[sections.items]]
n = 25
sanskrit_telugu = "దృష్ట్వాపి ఆగచ్చ."
english = "Come after seeing (it)."

[[sections.items]]
n = 26
sanskrit_telugu = "ఆకాశే మేఘాః ధావంతి."
english = "Clouds are moving in the sky."

[[sections.items]]
n = 27
sanskrit_telugu = "భోజన సమయే వర్థంతి కింవా కేన జ్ఞాయతే!"
english = "Whether it will rain at meal time — who can know!"

[[sections.items]]
n = 28
sanskrit_telugu = "దేవేన జ్ఞాయతే."
english = "It is known by God (only God knows)."

[[sections.items]]
n = 29
sanskrit_telugu = "వర్థంతి చేత్."
english = "If it rains."

[[sections.items]]
n = 30
sanskrit_telugu = "కిం కరిష్యామః?"
english = "What shall we do?"

# ---- passage_translation (Telugu) ----

[[sections]]
type = "passage_translation"
language = "telugu"

[[sections.items]]
n = 1
telugu = "అరే దురాచారుఁడా! అల్లరి చేయుచున్నావా! లేచి పొమ్ము."
english = "Hey, you scoundrel! Are you making a ruckus? Get up and go away."

[[sections.items]]
n = 2
telugu = "ఒక తెలివి తక్కువ పిల్లి ఒక యెలుకను చంపి తన దగ్గర క్రింద ఉంచుకొని కూర్చుండెను."
english = "A foolish cat killed a rat, kept it down beside itself, and sat there."

[[sections.items]]
n = 3
telugu = "అప్పుఁడు ఒక నక్కఁ ఆ పిల్లని చూచి'ఓ పిల్లీ! యెందుకు విచారించుచున్నావు' అని అడిగెను."
english = "Then a fox, seeing the cat, asked: 'O cat! Why are you looking worried?'"

[[sections.items]]
n = 4
telugu = "తరువాత ఆ పిల్లి నక్కను చూచి'ఈ నక్కఁ నన్నుఁ మోసపుచ్చుటకు వచ్చినది. ఇది మిక్కిలి చెడ్డది అని తెలిసికొని ఆ యెలుకను ఇంకొక చోటికి తీసికొని పోయెను."
english = "Then the cat, seeing the fox, understood: 'This fox has come to deceive me. This one is very wicked,' and carried the rat to another place."

[[sections.items]]
n = 5
telugu = "ఓ మామా! ఆ యెలుకను నీవు తినవలదు."
english = "O uncle! You must not eat that rat."

[[sections.items]]
n = 6
telugu = "అది చాల చెడ్డది; నిన్నఁ దానియొక్కఁ పండ్లను నేను చూచినాను."
english = "It is very bad; yesterday I saw its teeth."

[[sections.items]]
n = 7
telugu = "అది నన్నుఁ కఱచినది."
english = "It bit me."

[[sections.items]]
n = 8
telugu = "నిలు నిలు యెక్కఁడికి పోవుచున్నావఱే దానిని నీవు తిన్న యెడల చత్తువు."
english = "Stop, stop — where are you going, man? If you eat that, you will die."

[[sections.items]]
n = 9
telugu = "నేను ఈ మాటను నీకు చెప్పఁటకే వచ్చినాను; ఇఁకమొంద నేను పోవుచున్నాను - అని నక్కఁ చెప్పెను."
english = "'I came only to tell you this; now I am going' — so the fox said."

[[sections.items]]
n = 10
telugu = "ఆ మాటలు చెప్పిన పిమ్మట నక్కయొక్కఁ మాలు నిజమేమో అని ఆ యెలుకను అక్కఁడనే యుంచి పాఱిపోయెను."
english = "After those words were spoken, the cat thought the fox's words might be true, left the rat right there, and ran away."

[[sections.items]]
n = 11
telugu = "పిల్లిపోయిన సంగతిని నక్కఁ తెలిసికొని ఆ యెలుక యెక్కఁడ నుండెనో అక్కఁడికి వెళ్ళి దానిని తినెను."
english = "The fox learned that the cat had gone, went to where the rat was, and ate it."

[[sections.items]]
n = 12
telugu = "పిల్లి మరల పూర్వస్థలమునకు వచ్చి చూచెను."
english = "The cat came back to the previous place and looked."

[[sections.items]]
n = 13
telugu = "అప్పుడు ఆ నక్కఁ యెలుకను తినుచున్నది."
english = "At that moment the fox was eating the rat."

[[sections.items]]
n = 14
telugu = "ఓ నక్కా! నీవిప్పుడా యెలుకను ఎట్లు తినుచున్నావని అడిగెను."
english = "The cat asked: 'O fox! How are you eating that rat now?'"

[[sections.items]]
n = 15
telugu = "ఓసి తెలివితక్కువదానా! నే నాయెలుకయొక్కఁ పండ్లను అవుపేదతో శుద్ధిచేసి తినుచున్నానుకాని ఊరకే తినుట లేదు- అని చెప్పి నవ్వెను."
english = "'You foolish one! I am purifying the rat's teeth with medicine and eating it — I am not eating it just like that' — so saying, the fox laughed."

[[sections.items]]
n = 16
telugu = "పిల్లియు మిగుల విచారించెను."
english = "And the cat too was greatly distressed."
