[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "పురా ఏకస్మిన్వనే కతిచన మృగాః నివాసం అకుర్వన్."
english = "Long ago, in a certain forest, some animals lived."

[[sections.items]]
n = 2
sanskrit_telugu = "తేషాం మృగాణాం సర్వేషాం సింహః నృపః ఆసీత్."
english = "A lion was king over all those animals."

[[sections.items]]
n = 3
sanskrit_telugu = "ప్రతిదినం సింహః వనస్థితాన్ అనేకమృగాన్ మారయిత్వా జీవతిస్మ."
english = "Every day the lion lived by killing many animals in the forest."

[[sections.items]]
n = 4
sanskrit_telugu = "తదా సర్వే మృగాః ఏకత్ర సమావిశ్య ఇత్థం ఆలోచయన్--'అహో! ఏషః సింహః ప్రత్యహం అస్మాన్ సర్వాన్ మారయిత్వా భక్షయతి; ఏవంచేత్ శీఘ్రమేవ అస్మాకం కులం సర్వంనశ్యేత్."
english = "Then all the animals gathered together and thought thus: 'Alas! This lion kills and eats all of us every day; if this continues, our entire community will soon perish."

[[sections.items]]
n = 5
sanskrit_telugu = "తతః కః ఉపాయః అస్మాకం జీవనవిషయే ఇతి' తదా వరాహోద్యాః కతిచనమృగాః ఉత్థాయ ఏవం అకథయన్ \"వయం సర్వే సింహస్య సమీపం గత్వా 'హేసింహా! త్వం ఏకైక మృగక్రమేణ ఖాదిత్వా జీవనం కురు 'ఇతి ప్రార్థ్యామహై."
english = "Then what is the means for our survival?' At that time some animals including the boar rose up and said: 'Let us all go near the lion and beg: O lion! Please live by eating one animal at a time in order.'"

[[sections.items]]
n = 6
sanskrit_telugu = "తతః సింహః కిం వదతివా ఆకర్ణ్యామ ఇతి' పరదినే మృగాః సర్వే తద్దైవ కృత్వా."
english = "Then let us hear what the lion says.' The next day all the animals did exactly that."

[[sections.items]]
n = 7
sanskrit_telugu = "సింహసమీపే పూర్వంవృత్తాంతం వ్యజ్ఞాపయన్."
english = "They informed the lion of the earlier events."

[[sections.items]]
n = 8
sanskrit_telugu = "సింహోఽపి ఆంగీకారం అదర్శయత్."
english = "The lion also showed his agreement."

[[sections.items]]
n = 9
sanskrit_telugu = "అనంతరం వ్యాఘ్రవరాహ శలలహరిణాద్యాః మృగాః సర్వే అతీవ సంతోషేణ యథేచ్ఛం వనే విహారంతిస్మ."
english = "After that, all the animals — tigers, boars, porcupines, deer and others — roamed freely in the forest with great joy."

[[sections.items]]
n = 10
sanskrit_telugu = "ఏకదా శశపోతస్య వారః ఆగచ్చత్."
english = "Once the turn of a young hare came."

[[sections.items]]
n = 11
sanskrit_telugu = "తదా శశపోతః ఏవం ఆలోచయత్ 'అహాం (యేన కేనాపి = ఏదోయొక) ఉపాయేన సింహాం మారయిష్యామి."
english = "Then the young hare thought thus: 'By whatever means I will kill the lion."

[[sections.items]]
n = 12
sanskrit_telugu = "తతః వయం సర్వేమృగాః ఏతస్మిన్ వనే సుఖేన నివాసం కురుఽఠ' ఇతి ఆలోచ్య స్వస్య దినే ఈష దాలస్యం కృత్వా సింహ సమీపం ఆగచ్చత్."
english = "Then all of us animals will live happily in this forest.' Having thought so, on his appointed day he deliberately came late to the lion."

[[sections.items]]
n = 13
sanskrit_telugu = "తతః సింహః అతికోపేన అజ్వలత్."
english = "Then the lion blazed with extreme anger."

[[sections]]
type = "passage_translation"
language = "telugu"

[[sections.items]]
n = 1
telugu = "ఒకనాఁడొక ఎఱుకలవాఁడు అడవిపందులను చంపుటకు అడవికి వెళ్ళెను."
english = "One day a hunter went to the forest to kill wild boars."

[[sections.items]]
n = 2
telugu = "వానికి పందులు దొరకలేదు."
english = "He did not find any boars."

[[sections.items]]
n = 3
telugu = "పిమ్మట కొన్ని ఇతర మృగములను, పది పిచ్చుకలను, ఆఱు కొంగలను, ఒక ఏదుపంది ని చంపి ఇంటికి తెచ్చుకొనెను."
english = "Afterwards he killed some other animals, ten sparrows, six cranes, and one porcupine, and brought them home."

[[sections.items]]
n = 4
telugu = "ఇట్లుండఁగా వాని శరీరమందు ఒక తొండపడి కఱచెను."
english = "While things were thus, a chameleon fell on his body and bit him."

[[sections.items]]
n = 5
telugu = "కాని ఆయెఱుకలవాఁడు చావలేదు."
english = "But that hunter did not die."

[[sections.items]]
n = 6
telugu = "కొంతవఱకును వాని శరీర మంతయు చెడ్డది."
english = "To some extent his whole body went bad."

[[sections.items]]
n = 7
telugu = "పిమ్మట నొకవైద్యుఁడార్థ నొషధమును (పుచ్చుకొనెను = అగృహ్ణాత్) ఆకారణముఁవలన వాఁడు ఇట్లు చింతించెను - 'అయ్యో! నేను చాల మృగములను జంపితిని."
english = "Afterwards he took medicine from a physician (= agṛhṇāt). For that reason he thought thus: 'Alas! I have killed many animals."

[[sections.items]]
n = 8
telugu = "వాఁడు ఇట్లు చింతించెను - 'అయ్యో! నేను చాల మృగములను జంపితిని."
english = "He thought thus: 'Alas! I have killed many animals."

[[sections.items]]
n = 9
telugu = "ఆపాపమునకు ఫలము అప్పుఁడే కనఁబడినది."
english = "The fruit of that sin appeared right then."

[[sections.items]]
n = 10
telugu = "ఇఁక ముందు నే నెప్పుఁడును పాపకార్యములను జేయను' అది మొదలుకొని వాఁడు మార్గాంతరము చేత జీవనము చేసెనుగాని మృగములను జంపలేదు."
english = "Henceforth I will never do sinful deeds.' From that time on he earned his living by other means and did not kill animals."

[[sections.items]]
n = 11
telugu = "చిట్టచివరకు ఒక పండితుని యొక్కఁ ఉపదేశముచే వాఁడు హరిభక్తుఁడయి స్వర్గమునకుఁ బోయెను."
english = "Finally, through the teachings of a certain scholar, he became a devotee of Hari and went to heaven."

[[sections.items]]
n = 12
telugu = "ప్రతివాఁడును పాపమును చేయరాదు."
english = "No one should commit sin."

[[sections.items]]
n = 13
telugu = "సత్కార్యమునే చేయవలెను దానిచే నీ లోకము నందును పరలోకమునందును (సుఖపడుదురు = సుఖేయుః)."
english = "One must do only good deeds — by that one will be happy in this world and in the next (= sukheyu ḥ)."
