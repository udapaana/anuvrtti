type = "grammar_note"
language = "meta"

[[sections.items]]
telugu = """ఈపైన వ్రాసిన ఛవ తరగతి క్రియలు రెండు విధములు

(౦) నకారముగాని, ణా కారముగాని, మరియొక హల్లు క్రింద వత్తుగా వచ్చునవి - (ఉ = బధ్నాతి; పుష్ణాతి) వీనిలో నకారము ధ కారము క్రింద నావత్తుగను, ణాకారము ష కారము క్రింద ణావత్తును వచ్చినవి. (ఋ) నకారముగాని, ణాకారముగాని, మఱియొక హల్లుక్రింద వత్తుగా రాకుండ విడిగా వచ్చునవి. (ఉ, లునాతి; క్రీణాతి) వీనియందు లునాతిలో 'నా'యును, క్రీణాతిలో 'ణా'యును విడిగా నిలిచినవిగాని మఱియొక హల్లుక్రింద వత్తులుగా రాలేదు. నకార ణాకారములు వత్తులుగా వచ్చు క్రియలన్నియు బధ్నాతి వలెను. నకార ణాకారములు వత్తులుగా రాక విడిగా నిల్చు క్రియ లన్నియు క్రీణాతివలెను. ఆయాకాలములయందు చెప్పికొనవలయును. భేద ముున్నచో వ్రాయఁబడును. [ఇవి తొమ్మిదవ తరగతి క్రియలు]"""
english = "The 9th-gaṇa verbs written above are of two kinds: (1) those where na/ṇā appears as a conjunct under another consonant (e.g. badhnāti, puṣṇāti), and (2) those where na/ṇā stands independently (e.g. lunāti, krīṇāti). Type 1 conjugates like badhnāti; type 2 like krīṇāti. Differences, if any, will be noted. [These are 9th class verbs.]"

