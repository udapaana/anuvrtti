[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "ఏకం రూపకంగృహీత్వా ఆపణం గచ్చ."
english = "Take one rupee and go to the shop."

[[sections.items]]
n = 2
sanskrit_telugu = "తత్ర ఉర్వారుకఫలాని సంతిచేత్ సమ్యక్ మూల్యం విచారిళ."
english = "If there are cucumber fruits there, properly inquire about the price."

[[sections.items]]
n = 3
sanskrit_telugu = "ఏకాణకమూల్యాని ఆనయ."
english = "Bring those worth one anna."

[[sections.items]]
n = 4
sanskrit_telugu = "ప్రస్థ మాత్రం ధాన్యం."
english = "Grain only a prastha measure."

[[sections.items]]
n = 5
sanskrit_telugu = "ద్రమ్మస్య నస్యం అనయ."
english = "Bring snuff worth a small coin."

[[sections.items]]
n = 6
sanskrit_telugu = "నస్యంముఖ్యంరే."
english = "Snuff is important, you know."

[[sections.items]]
n = 7
sanskrit_telugu = "నస్యఫలం రిక్షం అసీత్."
english = "The snuff box was empty."

[[sections.items]]
n = 8
sanskrit_telugu = "గృహే జీరకః అస్తివానవాప్రచ్చ; అస్తిచేత్ మాస్తు నోచేత్ జీరకమ పా్యనయ."
english = "Ask whether there is cumin at home or not; if there is, leave it, otherwise bring cumin too."

[[sections.items]]
n = 9
sanskrit_telugu = "దార్వికాఫలాని కతి సంతివా గణయ."
english = "Count how many dārvikā fruits there are."

[[sections.items]]
n = 10
sanskrit_telugu = "నారికేళ ఫల మస్తిచేత్ (భిత్వా = బద్దలుకొట్టి) ఖండశః కృత్వా చోష్యే పాతయేతి అంబాం వద."
english = "If there is a coconut, tell mother to break it, cut it into pieces, and put them in chewing."

[[sections.items]]
n = 11
sanskrit_telugu = "తత్ర అనేక పండితాః సంతి."
english = "There are many scholars there."

[[sections.items]]
n = 12
sanskrit_telugu = "తేభ్యః సర్వేభ్యః దక్షిణాం యచ్చత."
english = "Give a gift (dakṣiṇā) to all of them."

[[sections.items]]
n = 13
sanskrit_telugu = "మాత్రన."
english = "Not just that."

[[sections.items]]
n = 14
sanskrit_telugu = "యథాకథంవా త్వత్కార్య సాధన ప్రయత్నం కురు."
english = "By whatever means, make an effort to accomplish your task."

[[sections.items]]
n = 15
sanskrit_telugu = "తత్కార్యం సాధ్యంవా అసాధ్యం వా?"
english = "Is that task achievable or not achievable?"

[[sections.items]]
n = 16
sanskrit_telugu = "హేగురో! తత్కార్యం అసాధ్యమివాస్తి - కుత ఇతిచేత్ మాతులపుత్రః మమవచనం నశ్రుణోతి."
english = "O teacher! That task seems unachievable — why? Because my maternal uncle's son does not listen to my words."

[[sections.items]]
n = 17
sanskrit_telugu = "యూయం అశ్రుణుత ఖలు తస్య వృత్తాంతం సర్వం అపి."
english = "You certainly heard all of his story."

[[sections.items]]
n = 18
sanskrit_telugu = "సః ఏకాం కాంతాం పర్యణయత్."
english = "He married a woman."

[[sections.items]]
n = 19
sanskrit_telugu = "సా కాంతా విధవా ఇతి అహాం అశ్రుణవం."
english = "I heard that that woman was a widow."

[[sections.items]]
n = 20
sanskrit_telugu = "(అద్య తనాః = ఇప్పటి వారు) సర్వేపి కుపితాః ఆసన్ కిం కర్తవ్యం?"
english = "People of today were all angry — what is to be done?"

[[sections]]
type = "passage_translation"
language = "telugu"

[[sections.items]]
n = 1
telugu = "మన దొడ్డిగోడను మెత్తుచున్నా రెందుకు?"
english = "Why are they plastering our courtyard wall?"

[[sections.items]]
n = 2
telugu = "నీ పందును ఎవరు తిన్నారు?"
english = "Who ate your share?"

[[sections.items]]
n = 3
telugu = "మా తమ్ముఁడు తిన్నాఁడు."
english = "My younger brother ate it."

[[sections.items]]
n = 4
telugu = "అందుకొఱకేనా నిన్నఁ వానిని నీవు కొట్టినావు?"
english = "Was it for that reason that you beat him yesterday?"

[[sections.items]]
n = 5
telugu = "అవును నా పందును తినినయెడల నే నూరకుందునా యేమి?"
english = "Yes — if someone eats my share, should I just stay quiet?"

[[sections.items]]
n = 6
telugu = "ఆ గోడను అలికి ముక్కలుగా చేసి మా దొడ్లో పారవేసినది."
english = "She plastered that wall, broke it to pieces, and threw it into our yard."

[[sections.items]]
n = 7
telugu = "ఆ గది యెవరిది."
english = "Whose room is that?"

[[sections.items]]
n = 8
telugu = "ఈ గది యెవరిది వచ్చెనా?"
english = "Whose room is this — has it come up for possession?"

[[sections.items]]
n = 9
telugu = "ఈ బట్టను రెండుగా భాగించుము."
english = "Divide this cloth into two."

[[sections.items]]
n = 10
telugu = "మానికలో నేమియున్నో చూడుము."
english = "Check what is in the māṇika measure."

[[sections.items]]
n = 11
telugu = "మీఁ వంటయింటిగోడ పూయుటకు నెవరు వెళ్ళినారు?"
english = "Who went to plaster your kitchen wall?"

[[sections.items]]
n = 12
telugu = "అన్ని గోడలను మా దాసియే పూయుచున్నది."
english = "Our maidservant herself is plastering all the walls."

[[sections.items]]
n = 13
telugu = "పూర్వకాలమున విధవా వివాహమును ఇప్పటి పండితులు [అంగీకరింపరు = నాంగీకుర్వంతి] గాదెలో ధాన్య మున్నదా?"
english = "The scholars of today do not approve of widow remarriage as in ancient times — is there grain in the granary?"

[[sections.items]]
n = 14
telugu = "గాదె నిన్నఁనే వట్టిది ఆయినదిగా."
english = "The granary became empty just yesterday, didn't it."

[[sections.items]]
n = 15
telugu = "మన యింట్లో పెండ్లి యెల్లుండేగదా."
english = "The wedding in our house is the day after tomorrow, isn't it."

[[sections.items]]
n = 16
telugu = "తాతాచార్యులగారి కుమారులు నిన్నఁ [ఒకరొకరు = పరస్పరం] కొట్టుకొనుచున్నారు."
english = "Tātācārya's sons were beating each other (one another = parasparam) yesterday."
