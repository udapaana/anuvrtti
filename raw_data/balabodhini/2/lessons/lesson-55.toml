# --- Grammar Note (introductory) ---

[[sections]]
type = "grammar_note"
language = "meta"

[[sections.items]]
telugu = "నపుంసకలింగ సర్వనామశబ్దములలో ప్రథమా, ద్వితీయా విభక్తులు ఒక విధముగనే యుండును. తక్కిన విభక్తులు పుంలింగశబ్దమునకు వలె నుండును."
english = "In neuter-gender pronouns, the prathamā and dvitīyā vibhaktis are identical. The remaining vibhaktis follow the masculine pattern."

