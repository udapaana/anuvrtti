# --- Passage ---

[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "ఏషః మామ జ్యేష్ఠపుత్రః."
english = "This is my eldest son."

[[sections.items]]
n = 2
sanskrit_telugu = "సః ద్వితీయపుత్రః."
english = "He is the second son."

[[sections.items]]
n = 3
sanskrit_telugu = "అన్యః కనిష్ఠః పూర్వేద్యుః సాయంసమయే తాతాచార్యస్య కనిష్ఠ పుత్రః వేంకటేశ్వరేణ సాక వనం గత్వా తత్ర ఏకం వృక్షం ఆరుహ్య వృక్షాత్ అధః అపతత్."
english = "The other (youngest one) — the day before yesterday in the evening, the youngest son went to the forest together with Tātācārya's youngest son Veṅkaṭeśvara, climbed a tree there, and fell down from the tree."

[[sections.items]]
n = 4
sanskrit_telugu = "పతనానంతరం తస్య హస్తః భగ్నః అసీత్."
english = "After the fall, his hand was broken."

[[sections.items]]
n = 5
sanskrit_telugu = "తతః ద్వితీయదివసే ఏకం వైద్యం అనీయ తస్యై భగ్నహస్తం మదర్పయన్."
english = "Then on the second day, bringing a physician, they presented the broken hand to him."

[[sections.items]]
n = 6
sanskrit_telugu = "సః స్వేన కృత తైలం ఆనీయ హస్తం సమ్యక్ అమర్దయత్."
english = "He brought oil prepared by himself and massaged the hand properly."

[[sections.items]]
n = 7
sanskrit_telugu = "ఇదానీమపి ప్రతిదినం మర్దయత్యేవ."
english = "Even now he massages it every day."

[[sections.items]]
n = 8
sanskrit_telugu = "సః వైద్యః అతీవ కోపిష్ఠ."
english = "That physician is extremely irascible."

[[sections.items]]
n = 9
sanskrit_telugu = "తథావా! తం కదాపి అహాం నజానామి."
english = "Is that so! I have never known him."

[[sections.items]]
n = 10
sanskrit_telugu = "శ్వోవా పరశ్వోవా జ్ఞాస్యసి."
english = "You will know (him) tomorrow or the day after."

[[sections.items]]
n = 11
sanskrit_telugu = "ఇతఃపూర్వం త్వయా కదాపి న దృష్టః? దృష్టః చేత్ కిం? నదృష్టః చేత్ కిం? కదాపి అస్మాకం వైద్య దర్శనమేవ మాస్తు."
english = "Have you never seen him before this? If seen, what of it? If not seen, what of it? May we never even have occasion to see a physician."

[[sections.items]]
n = 12
sanskrit_telugu = "సీతారామస్య కనిష్ఠ పుత్రికాం కస్తై అయచ్చత్."
english = "To whom did he give Sītārāma's youngest daughter?"

[[sections.items]]
n = 13
sanskrit_telugu = "కస్తైచిత్ వృద్ధాయ అయచ్చత్."
english = "He gave her to some old man."

[[sections.items]]
n = 14
sanskrit_telugu = "వివాహః కుత్ర కృతః? తటాకసమీపస్థితశివాలయే కృతః."
english = "Where was the wedding performed? It was performed in the Śiva temple located near the tank."

[[sections.items]]
n = 15
sanskrit_telugu = "అరే శాకుంతల నాటకం పఠ ఇతి అవదం ఖలు."
english = "Hey, I told you to read the Śakuntalā play, didn't I."

[[sections.items]]
n = 16
sanskrit_telugu = "త్వం అపరః కిం? నహినహి; ఏతావత్పర్యంతమపి మయా న పఠితం."
english = "Are you any different? No no; I have not even read (it) up to this point."

[[sections.items]]
n = 17
sanskrit_telugu = "సర్వదాపి మామ శరీరే తాపః."
english = "There is always fever in my body."

[[sections.items]]
n = 18
sanskrit_telugu = "తదర్థం వైద్యసమీపం గచ్చామి."
english = "For that reason I am going to the physician."

[[sections.items]]
n = 19
sanskrit_telugu = "పూర్వేద్యుః యుష్మద్కృష్ఠః ఏకం అపరాధ మకరోత్."
english = "The day before yesterday your Kṛṣṭha committed an offence."

[[sections.items]]
n = 20
sanskrit_telugu = "సః అపరాధః తవ జ్ఞాతః కిం? నహి కింతు తదర్థమేవ సః పూర్వేద్యుః చింతయా తూష్ణీం అవసత్ గృహే."
english = "Is that offence known to you? No, but it is for that very reason that he stayed silently at home with worry the day before yesterday."

[[sections.items]]
n = 21
sanskrit_telugu = "సత్యమేవ."
english = "That is indeed true."

# --- Passage Translation ---

[[sections]]
type = "passage_translation"
language = "telugu"

[[sections.items]]
n = 1
telugu = "అక్కఁడ కూర్చుండి యేమో చింతించుచున్నావు."
english = "You are sitting there worrying about something."

[[sections.items]]
n = 2
telugu = "నాయొక్కఁ పుస్తకము మీఁ అమ్మయొద్ద నున్నదిగాని యిటులం దీసికొనిరమ్ము."
english = "My book is with your mother — go ahead and bring it here."

[[sections.items]]
n = 3
telugu = "ఆమె యింట్లో లేదండి."
english = "She is not at home, sir."

[[sections.items]]
n = 4
telugu = "ఆమె యెక్కఁడ పెట్టినదో నాకు తెలియదు."
english = "I do not know where she has kept it."

[[sections.items]]
n = 5
telugu = "తెలియదనెద వేమిరా! ఆమెయొక్కఁ పెట్టెలోఁ జూడుము."
english = "Why do you say you don't know! Look in her box."

[[sections.items]]
n = 6
telugu = "ఆమెయొక్కఁ పెట్టె నాకు గనఁబడలేదు."
english = "Her box is not visible to me."

[[sections.items]]
n = 7
telugu = "పెట్టె గదిలో నున్నదేమో చూడుము."
english = "See if the box might be in the room."

[[sections.items]]
n = 8
telugu = "చూచితిని మీఁ పుస్తకము పెట్టెలోనే యున్నది."
english = "I looked — your book is right in the box."

[[sections.items]]
n = 9
telugu = "తెచ్చుచున్నాను."
english = "I am bringing it."

[[sections.items]]
n = 10
telugu = "సరేగాని మా పిల్లవా డూయేలయందు ఊగుచున్నాఁడుగాని వానిని నే రమ్మంటినని పిలువుము."
english = "Very well — but our boy is swinging on the swing; call him and tell him that I said to come."

[[sections.items]]
n = 11
telugu = "వాఁడు ఇప్పుడు రానన్నాఁడు."
english = "He said he will not come now."

[[sections.items]]
n = 12
telugu = "(నీకు కావలసినయెడల నా చెంబు నిచ్చెదను. దానితో నీరు త్రావుము = త్వయా అపేక్ష్యతే చేత్ - తవ అపేక్షితం చేత్. మత్పాత్రం దాస్యామి; తేన జలం పిబ)"
english = "If you need it (if it is desired by you = tvayā apekṣyate cet — tava apekṣitaṃ cet), I will give you my vessel; drink water with it."

[[sections.items]]
n = 13
telugu = "నాపంచపాత్ర యెక్కఁడ నున్నదో యెఱుగుదువా?"
english = "Do you know where my pañcapātra is?"

[[sections.items]]
n = 14
telugu = "బావిదగ్గర నున్నది."
english = "It is near the well."

[[sections.items]]
n = 15
telugu = "పోనిమ్ము."
english = "Never mind."

[[sections.items]]
n = 16
telugu = "నా పంచపాత్ర బావియొద్ద నెందు కున్నది?"
english = "Why is my pañcapātra near the well?"

[[sections.items]]
n = 17
telugu = "మా అమ్మఁ చెంబులన్నిటిని తోముచున్నది."
english = "Our mother is scrubbing all the vessels."

[[sections.items]]
n = 18
telugu = "దేనితో తోముచున్నది? చింతపండుతో."
english = "What is she scrubbing with? With tamarind."

[[sections.items]]
n = 19
telugu = "మన ఆవు ఎక్కఁడికి పాఱిపోయినదో ఎవఁడు విచారింపగలఁడు?"
english = "Who can find out where our cow has run off to?"

[[sections.items]]
n = 20
telugu = "నీవే వెళ్ళి విచారించుము."
english = "You yourself go and inquire."

[[sections.items]]
n = 21
telugu = "నేను చాలచోట్ల విచారించితిని గాని కనఁబడలేదు."
english = "I inquired in many places but she was not found."

[[sections.items]]
n = 22
telugu = "నిన్నఁ సాయంకాలమున వైష్ణవులదొడ్లో నొక యావు మేయుచున్నదఁట."
english = "They say that yesterday evening a cow was grazing in the Vaiṣṇavas' yard."

[[sections.items]]
n = 23
telugu = "వైష్ణవుల యింటికి నీవిప్పుడే వెళ్ళి కనుఁగొనిరమ్ము."
english = "Go to the Vaiṣṇavas' house right now and find out."

[[sections.items]]
n = 24
telugu = "నీవిచటనే నిలువుము."
english = "You stay right here."

[[sections.items]]
n = 25
telugu = "నేను వెళ్ళి కనుఁగొనివత్తును."
english = "I will go and find out and come back."

[[sections.items]]
n = 26
telugu = "(ఇదిగో యావు = ఏషా బహులా) దూడతోఁ గూడ వచ్చుచున్నది."
english = "Here is the cow (= eṣā bahulā) — she is coming along with the calf."

[[sections.items]]
n = 27
telugu = "ఇఁక నీవు పోవద్దు."
english = "You need not go anymore."
