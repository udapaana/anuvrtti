# ── passage ──

[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "సా అంగనా కస్య పుత్రికా వా, కిమర్థం గంగాసమీపే సంచరతి వా ఇతి ఏకః నృపః మాం ప్రహ్యః అపృచ్ఛత్."
english = "A certain king asked me the day before yesterday: 'Whose daughter is that woman, and why does she wander near the Gaṅgā?'"

[[sections.items]]
n = 2
sanskrit_telugu = "తదా అహాం ఈషత్ అలోచ్య 'హేనృప! అహమపి తద్వృత్తాంతం సర్వం విచార్య అనంతరం వదిష్యామి; తావత్పర్యంతం అత్ర ఏధి' ఇతి అవదం."
english = "Then, after thinking a little, I said: 'O king! I too will investigate the whole matter and tell you afterwards; until then, stay here.'"

[[sections.items]]
n = 3
sanskrit_telugu = "తతః సః భూపాలః గంగాతీరే ఏకస్మిన్ లతాగృహే ఈషం త్వర్యంతం ఉషిత్వా, పునః అపి బహిః ఆగత్య మాం అహ్వాయత్."
english = "Thereupon that king stayed for a short while in a bower on the bank of the Gaṅgā, then came out again and called me."

[[sections.items]]
n = 4
sanskrit_telugu = "తదుపరి అహం రాజసమీపం గత్వా 'హేభూపాల! ఏషా మద్వచనస్య ప్రతుత్తరం నాయచ్ఛత్."
english = "After that I went to the king and said: 'O king! This woman did not give an answer to my question.'"

[[sections.items]]
n = 5
sanskrit_telugu = "కింతు అహం పునః పునః అపృచ్ఛం; తథాపి సా తూష్ణీం ఆసీత్, త్వమేవ గత్వా ప్రచ్ఛ-ఇతి తం నృపం అవదం పశ్చాత్ సః నృపః తథా ఏవ అకరోత్."
english = "But I asked her again and again; still she remained silent. Go yourself and ask her — so I told the king, and afterwards the king did exactly that."

# ── passage_translation ──

[[sections]]
type = "passage_translation"
language = "telugu"

[[sections.items]]
n = 1
telugu = "పిమ్మట రాజును జూచి ఆ యాదుండి ఓరాజా! నాయూరియొక్కయు నాయొక్కయు పేరు నీ కెందుకుఁగీవు (నీ త్రోవను = తవమార్గేణ) వెళ్ళుమని చెప్పెను."
english = "Then, seeing the king, that woman said: 'O king! What do you need with the name of my village or my own name? Go on your way (your path = tavamārgeṇa).'"

[[sections.items]]
n = 2
telugu = "(ఈలోపల = ఏతదంతరే) ఒక దొంగ అక్కడ చెట్టుమొద వ్రేలాడుచుండెను."
english = "In the meantime (ētadantarē), a thief was hanging from the trunk of a tree there."

[[sections.items]]
n = 3
telugu = "వాఁడు ఈ స్త్రీని దొంగిలించుకొని పోవుటకు వచ్చినాఁడని రాజు వానిని దండించెను."
english = "The king punished him, saying that he had come to abduct this woman."

[[sections.items]]
n = 4
telugu = "(ఇట్లుండగా = ఏవంస్థితే) మఱియొక్కతె ఆరాజును జూచి ఈవేళ మాయింట్లో భోజనము చేయుటకు నీవు రమ్మని రాజును బిలిచెను."
english = "While things were thus (ēvaṃsthitē), another woman, seeing the king, invited him, saying: 'Come to our house today to have your meal.'"

[[sections.items]]
n = 5
telugu = "ఓసే! నీవెవతెవు అని రాజు అడిగెను."
english = "The king asked: 'Who are you?'"

[[sections.items]]
n = 6
telugu = "అది నేనొక శూద్రుని యొక్క పెండ్లాముని అని జవాబు చెప్పెను."
english = "She replied: 'I am the wife of a Śūdra.'"

[[sections.items]]
n = 7
telugu = "పిమ్మట ఓసీ నేను క్షత్రియుడను గదా! మాయింట్లో ఎట్లు భోజనమును చేయుదును? నేను మాయింటికి రాను పొమ్మని చెప్పెను."
english = "Then the king said: 'O woman! I am a Kṣatriya after all — how can I eat in your house? I will not come to your house; go away.'"
sensitive = true

[[sections.items]]
n = 8
telugu = "ఆమెయు వెళ్ళెను."
english = "And she too went away."
