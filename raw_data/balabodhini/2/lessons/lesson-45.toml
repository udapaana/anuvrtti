[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "రామస్య వివాహః అసీత్తలు."
english = "Rāma's marriage has taken place, hasn't it?"

[[sections.items]]
n = 2
sanskrit_telugu = "గృహాప్రవేశః కదా అభవద్రే?"
english = "When did the house-entry ceremony take place, friend?"

[[sections.items]]
n = 3
sanskrit_telugu = "ఇతో ః పి నాభవత్."
english = "It has not happened yet."

[[sections.items]]
n = 4
sanskrit_telugu = "శ్వోవా పరశ్వో వా భవిష్యతి."
english = "It will happen tomorrow or the day after."

[[sections.items]]
n = 5
sanskrit_telugu = "రామస్య వివాహార్థం గమనసమయే ఏకః మూర్ఖాలః అభిముఖం ఆగచ్ఛత్."
english = "At the time of setting out for Rāma's wedding, a fool came in front."

[[sections.items]]
n = 6
sanskrit_telugu = "కన్యాదానం కః అకరోత్?"
english = "Who performed the gift of the bride?"

[[sections.items]]
n = 7
sanskrit_telugu = "శ్రీనివాసః గ్రామే నాస్తిఖలు?"
english = "Śrīnivāsa is not in the village, isn't it?"

[[sections.items]]
n = 8
sanskrit_telugu = "మమానుజేన అకారయత్."
english = "It was caused to be done by my younger brother."

[[sections.items]]
n = 9
sanskrit_telugu = "మామ ఉత్థాతుమపి సామర్థ్యం నాస్తి."
english = "There is no ability even to rise from bed."

[[sections.items]]
n = 10
sanskrit_telugu = "త్వం శుభ్రవస్త్రం ధృత్వా దేవతార్చనం కుర్యాః కిం?"
english = "Will you put on clean clothes and perform the worship of the deity?"

[[sections.items]]
n = 11
sanskrit_telugu = "తద్దైవ కరిష్యామి."
english = "I shall do it right away."

[[sections.items]]
n = 12
sanskrit_telugu = "యుష్మద్దేవపేటికాయాం విగ్రహాః న సంతి ఖలు ?"
english = "There are no idols in your deity-box, isn't it?"

[[sections.items]]
n = 13
sanskrit_telugu = "దేవపూజాం కథం కుర్వాం?"
english = "How shall I perform the worship of the deity?"

[[sections.items]]
n = 14
sanskrit_telugu = "ఏకం విగ్రహాం పేటికాయాం ప్రవేశయ ప్రథమం."
english = "First, place one idol in the box."

[[sections.items]]
n = 15
sanskrit_telugu = "అనంతరం ఘంటాం నాదయ."
english = "Then ring the bell."

[[sections.items]]
n = 16
sanskrit_telugu = "తద్దైవ."
english = "Right away."

[[sections.items]]
n = 17
sanskrit_telugu = "భో ఆచార్య! దేవపేటికాయాం ఇతః పూర్వమేవ ఏకః విగ్రహాః అస్తి పశ్య."
english = "O teacher! Look, there is already one idol in the deity-box from before."

[[sections.items]]
n = 18
sanskrit_telugu = "అరే ఏతత్కింరే మూషకః కథం ప్రావిశద్దే దేవపేటికాయాం కేన జ్ఞాయతే?"
english = "Hey, what is this? How did a mouse enter the deity-box? Who knows?"

[[sections.items]]
n = 19
sanskrit_telugu = "ఏకః బ్రాహ్మణః ద్వారే తిష్ఠతి."
english = "A brahmin is standing at the door."

[[sections.items]]
n = 20
sanskrit_telugu = "తం యథా కథం వా అంతః ప్రవేశ్య తం ప్రచ్ఛ."
english = "Having brought him inside somehow, ask him."

[[sections.items]]
n = 21
sanskrit_telugu = "తస్య సమీపే దేవపేటికా అస్తికింవా."
english = "Does he have a deity-box near him?"

[[sections.items]]
n = 22
sanskrit_telugu = "దేవతార్చనేన కిం ప్రయోజనం ?"
english = "What is the benefit of worshipping the deity?"

[[sections.items]]
n = 23
sanskrit_telugu = "ప్రథమం గృహే తందులా ఏవ న సంతి."
english = "First of all, there is not even rice in the house."

[[sections.items]]
n = 24
sanskrit_telugu = "బ్రాహ్మణాష్టు ఆగత్య కిం కరిష్యతి?"
english = "What will the brahmin do after coming?"

[[sections.items]]
n = 25
sanskrit_telugu = "ప్రహ్యః రాజమహేంద్రపురే దశ తస్కరాః ఏకస్య బ్రాహ్మణస్య గృహే ప్రవిశ్య సర్వం ధనం అచోరయన్ - ఇతి ఆంధ్రపత్రికాయాం అలిఖన్."
english = "Yesterday in Rājamahendrī, ten thieves having entered the house of a brahmin stole all his wealth — thus it was written in the Āndhra newspaper."

[[sections.items]]
n = 26
sanskrit_telugu = "పాకపాత్రాణి ప్రథమం చుక్కేన ధావిత్వా పశ్చాత్ గోమయేన శోధయ."
english = "First wash the cooking vessels with tamarind, then clean them with cow dung."

[[sections.items]]
n = 27
sanskrit_telugu = "తవ అంబా స్నానార్థం ఆగచ్ఛత్."
english = "Your mother came for the purpose of bathing."

[[sections.items]]
n = 28
sanskrit_telugu = "ఏతావత్పర్యంతం స్నానం కృత్వా స్నాత్సా పాకగృహే ప్రవేక్ష్యతి."
english = "Having bathed by now, she will enter the kitchen having become purified."

[[sections.items]]
n = 29
sanskrit_telugu = "పాత్రాణి సర్వాణి అనీయ అత్రస్థాపయ."
english = "Having brought all the vessels, place them here."

[[sections.items]]
n = 30
sanskrit_telugu = "త్వం తూష్ణీం తిష్ఠ."
english = "You stand silently."

[[sections.items]]
n = 31
sanskrit_telugu = "అహాం సర్వం కరిష్యామి."
english = "I shall do everything."

[[sections]]
type = "passage_translation"
language = "telugu"

[[sections.items]]
n = 1
telugu = "నా చెంబు బురదలో పడినదిగాని కొంచెము కడుగుదూ నాయనా!"
english = "My water vessel has fallen into the mud — please wash it a little, dear!"

[[sections.items]]
n = 2
telugu = "ఎందుకు పడినది మామా నీ చెంబు?"
english = "Why did your vessel fall, uncle?"

[[sections.items]]
n = 3
telugu = "నేను వెలుపలికి వెళ్ళినాను."
english = "I went outside."

[[sections.items]]
n = 4
telugu = "అక్కఁడ నన్నొక పంది తఱిమినది."
english = "A pig chased me there."

[[sections.items]]
n = 5
telugu = "అందువల్లనే నేనా పందిని చెంబుతో కొట్టినాను."
english = "That is why I hit that pig with the vessel."

[[sections.items]]
n = 6
telugu = "పంది పాఱిపోయినది."
english = "The pig ran away."

[[sections.items]]
n = 7
telugu = "చెంబు బురదలో పడినది."
english = "The vessel fell in the mud."

[[sections.items]]
n = 8
telugu = "నిన్నఁ మీఁ ఉపాధ్యాయుఁడు గ్రామాంతరము నుండి వచ్చినాఁడుగదా ఆయనను ఎక్కఁడ ప్రవేశపెట్టినావు నిన్నఁ సందెవఱకు సత్రములోనే ఉండెను; ఇప్వేళ మాయింట్లో ప్రవేశపెట్టుదును."
english = "Your teacher came from another village yesterday, didn't he — where did you put him up? He was in the travellers' rest house until yesterday evening; today I will have him enter our house."

[[sections.items]]
n = 9
telugu = "మొదటు సత్రములో నెవరు ప్రవేశపెట్టిరి?"
english = "Who let him into the rest house first?"

[[sections.items]]
n = 10
telugu = "ఆయనే ప్రవేశించినాఁడు."
english = "He himself entered."

[[sections.items]]
n = 11
telugu = "ఆయన గుఱ్ఱముమొంద వచ్చినాఁడా(లేక = నోచేత్) ఊరకయే వచ్చినాఁడా?"
english = "Did he come on horseback, or (nōcēt) did he come on foot?"

[[sections.items]]
n = 12
telugu = "మొదటు గుఱ్ఱమునెక్కి కొంతదూరము వచ్చినాఁడఁట."
english = "He rode a horse for some distance at first, I hear."

[[sections.items]]
n = 13
telugu = "అప్పుఁడు సంధ్యాకాల మయినదట; ఇంతలో గుఱ్ఱమును అక్కఁడ నొక చెట్టుదగ్గర నుంచి చెఱువునకు సంధ్యావందనానికి వెళ్ళినాఁడఁట; అప్పుఁడా గుఱ్ఱము దేవుని పెళ్ళెను క్రింద పడవేసి పాఱిపోయినదని ఆయన నాకు చెప్పినాఁడు."
english = "At that time it became evening, they say; in the meantime he tied the horse to a tree there and went to the tank for the twilight prayer; then the horse knocked down the deity's palanquin and ran off — so he told me."

[[sections.items]]
n = 14
telugu = "అది యెంతవఱకు నిజమో నాకు తెలియదు."
english = "How true that is, I do not know."

[[sections.items]]
n = 15
telugu = "అది ముంగియా, యెలుకా, లేక పందికొక్కా కొంచెము చూడు."
english = "Is it a mongoose, a rat, or a porcupine — have a little look."

[[sections.items]]
n = 16
telugu = "చూచినానండోయి అది యేదియు కాదు; కుక్కఁ కుక్కఁ అయ్యో దేవునింట్లోనికి కుక్కఁ యెట్లు చొరఁబడ్డదిరా అది చొరఁబడలేదు మీఁ శిమ్మెఁడు తెచ్చినాఁడఁట."
english = "I looked, sir — it is none of those; a dog — a dog — oh my, how did a dog get into the deity's room? It did not sneak in — your Simmayya brought it, I hear."

[[sections.items]]
n = 17
telugu = "వానికేమి వచ్చినదిరా నాయనా?"
english = "What has come over him, dear boy?"

[[sections.items]]
n = 18
telugu = "ఏమో పోనిమ్ము."
english = "Who knows — let it be."
