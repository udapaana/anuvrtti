# ---- passage (Sanskrit) ----

[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "యుష్మదంబాయాః శరీరే సుతరాం బలం నాస్తి."
english = "Your mother's body has no strength at all."

[[sections.items]]
n = 2
sanskrit_telugu = "పంచాంగ మానయ."
english = "Bring the almanac."

[[sections.items]]
n = 3
sanskrit_telugu = "ఏతద్దినే నక్షత్రం కింవా పశ్యామ."
english = "Let us see what asterism falls on this day."

[[sections.items]]
n = 4
sanskrit_telugu = "పంచాంగం కుత్రాస్తివా నాదృశ్యత."
english = "Where is the almanac? It is not visible."

[[sections.items]]
n = 5
sanskrit_telugu = "మామ హస్తం."
english = "It is in my hand."

[[sections.items]]
n = 6
sanskrit_telugu = "చలయితుమపి దార్ఢ్యం నాస్తి."
english = "There is not even firmness enough to move."

[[sections.items]]
n = 7
sanskrit_telugu = "అస్మద్దృష్టం దృఢమే వాస్తి."
english = "What we have seen is indeed firm."

[[sections.items]]
n = 8
sanskrit_telugu = "కిమర్థం మాం సర్వదా ఆక్షిపసి?"
english = "Why do you reproach me always?"

[[sections.items]]
n = 9
sanskrit_telugu = "తవజనకః కుత్రాగచ్ఛత్."
english = "Where did your father go?"

[[sections.items]]
n = 10
sanskrit_telugu = "మాసప్రభృతి నదృశ్యతే."
english = "He has not been seen since a month."

[[sections.items]]
n = 11
sanskrit_telugu = "మామ ఈషత్ లవణ మపేక్షితం; పరివేషయత."
english = "I need a little salt; serve it."

[[sections.items]]
n = 12
sanskrit_telugu = "అస్మత్తూత్తాయ సందిశ."
english = "Send word from our side."

[[sections.items]]
n = 13
sanskrit_telugu = "యుష్మత్తూపజలే మాధుర్యం నాస్తి."
english = "There is no sweetness in your well water."

[[sections.items]]
n = 14
sanskrit_telugu = "గతదినే ఆతపః సమ్యగ్ గాసీత్."
english = "Yesterday the sunlight was good."

[[sections.items]]
n = 15
sanskrit_telugu = "ఘృతః ఈషత్ ఆతపే స్థాపయ."
english = "Place the ghee a little in the sunlight."

[[sections.items]]
n = 16
sanskrit_telugu = "ద్రవిష్యతి కింవా."
english = "Will it melt, I wonder?"

[[sections.items]]
n = 17
sanskrit_telugu = "దేవస్య సంకల్పః కథమ్ స్తివా; సా కాలంకరిష్యతికింవా!"
english = "How is God's will — will she die, I wonder!"

[[sections.items]]
n = 18
sanskrit_telugu = "యుష్మత్ కలశః కుత్రా స్తివా శ్వః ద్రక్ష్యతే."
english = "Where is your pot? It will be seen tomorrow."

[[sections.items]]
n = 19
sanskrit_telugu = "ఇదానీం మా విచారయత."
english = "Do not worry about it now."

[[sections.items]]
n = 20
sanskrit_telugu = "తవజనకః కిముద్దిశతి?"
english = "What does your father intend?"

[[sections.items]]
n = 21
sanskrit_telugu = "అపేక్షితం ప్రచ్చ."
english = "Ask for what is needed."

[[sections.items]]
n = 22
sanskrit_telugu = "పరివేషయిష్యామి."
english = "I will serve."

[[sections.items]]
n = 23
sanskrit_telugu = "పరివేషణం అసీత్; యూయం సర్వేపి ఆగచ్చత; నోచేత్ అన్నం శుష్యతి."
english = "The serving is ready; all of you come; otherwise the rice will dry up."

[[sections.items]]
n = 24
sanskrit_telugu = "గ్రీష్మకాలే మల్లికాపుష్పాణి లతాను సమ్యక్ దృశ్యేరన్."
english = "In summer, jasmine flowers on the creepers are visible beautifully."

[[sections.items]]
n = 25
sanskrit_telugu = "అరేరేపశ్య పశ్య తదపిత్యేకే సర్పః లంబతే."
english = "Hey, look look — over there on the creeper a snake is hanging."

[[sections.items]]
n = 26
sanskrit_telugu = "తత్ర యః కశ్చిత్ అస్తిచేత్ మారయితుం ఆహ్వాయ."
english = "If anyone is there, call them to kill it."

[[sections.items]]
n = 27
sanskrit_telugu = "కిమరేరామ! త్వం కుత్రాపి న దృశ్యసే కిం?"
english = "Hey Rama! Are you not visible anywhere?"

[[sections.items]]
n = 28
sanskrit_telugu = "అహాం కుత్రాగచ్చం; అత్రే వాస్మఖలు."
english = "Where would I go; I am right here, you know."

[[sections.items]]
n = 29
sanskrit_telugu = "తావ్రం ద్రష్టుం మమాంబా వాంఛతి."
english = "My mother wants to see you quickly."

[[sections.items]]
n = 30
sanskrit_telugu = "ఏకవారం అస్మద్గ్రహాం ఆగచ్చ."
english = "Come to our house once."

[[sections.items]]
n = 31
sanskrit_telugu = "ఇదానీం మామ అవకాశః నాస్తి."
english = "I have no opportunity now."

[[sections.items]]
n = 32
sanskrit_telugu = "శ్వస్సాయం ఆగమిష్యా మితి కథయ."
english = "Tell (her) that I will come tomorrow evening."

[[sections.items]]
n = 33
sanskrit_telugu = "తవ కి మపేక్షితం?"
english = "What do you need?"

[[sections.items]]
n = 34
sanskrit_telugu = "క్షీరమపేక్షితం; అస్తి చేదఱిచ్చు."
english = "Milk is needed; if there is some, give it."

# ---- passage_translation (Telugu) ----

[[sections]]
type = "passage_translation"
language = "telugu"

[[sections.items]]
n = 1
telugu = "రాముఁడు సీతతో కూడ అడవిని ప్రవేశించెను."
english = "Rāma entered the forest together with Sītā."

[[sections.items]]
n = 2
telugu = "లక్ష్మణుఁడును రాముని వెంబడించెను."
english = "Lakṣmaṇa too followed Rāma."

[[sections.items]]
n = 3
telugu = "ఇట్లుండఁగా సీత స్నానము చేయుటకు గోదావరికి వెళ్ళెను."
english = "While things were thus, Sītā went to the Godāvarī to bathe."

[[sections.items]]
n = 4
telugu = "అక్కఁడ నొక రాక్షసుఁడు ఆమెకు గనఁబడెను."
english = "There a demon appeared to her."

[[sections.items]]
n = 5
telugu = "వాఁడే రావణాసురుఁడు."
english = "That very one was Rāvaṇa the demon."

[[sections.items]]
n = 6
telugu = "వాఁడు సీతనుచూచి నీవెవతెవని అడిగెను."
english = "He saw Sītā and asked: 'Who are you?'"

[[sections.items]]
n = 7
telugu = "నేను రాముని యొక్కఁ భార్యనని ఆమె బదులు చెప్పెను."
english = "She replied: 'I am Rāma's wife.'"

[[sections.items]]
n = 8
telugu = "అప్పుఁడు రావణుఁడు సీతను ఎత్తుకొని పోయెను."
english = "Then Rāvaṇa lifted up Sītā and carried her away."

[[sections.items]]
n = 9
telugu = "పిమ్మట, రాముఁడింటికి వచ్చి చూచెను."
english = "Afterwards, Rāma came home and looked."

[[sections.items]]
n = 10
telugu = "సీత యెక్కఁడను కనఁబడకుండెను."
english = "Sītā was not visible anywhere."

[[sections.items]]
n = 11
telugu = "పిమ్మట రాముఁడు లక్ష్మణితోకూడ బయలుదేరి కిష్కింధాపురమునకు వెళ్ళెను."
english = "Then Rāma set out together with Lakṣmaṇa and went to the city of Kiṣkindhā."

[[sections.items]]
n = 12
telugu = "అక్కఁడ రాముసకు సుగ్రీవుఁడు కనఁబడెను."
english = "There Sugrīva appeared to Rāma."

[[sections.items]]
n = 13
telugu = "రాముడు తన వృత్తాంతమును సుగ్రీవునకు చెప్పెను."
english = "Rāma told Sugrīva his story."

[[sections.items]]
n = 14
telugu = "ఆ మాటలు సుగ్రీవుఁడు విని తనయొక్కఁ వానరులను సీతకొఱకు పంపెను."
english = "Hearing those words, Sugrīva sent his monkeys to search for Sītā."

[[sections.items]]
n = 15
telugu = "సీత లంకాపురమందు అశోకవనమునం దుండెను."
english = "Sītā was in the Aśoka grove in the city of Laṅkā."

[[sections.items]]
n = 16
telugu = "అంజనేయుఁడు లంకకు బోయి సీతను చూచి మళ్ళి రాముని దగ్గరకు వచ్చి 'ఓ రామా! నాకు సీత కనఁబడెను' అని చెప్పి రాముని తన మాటలచేత సంతోషపెట్టెను."
english = "Añjanēya went to Laṅkā, saw Sītā, came back to Rāma, and said 'O Rāma! Sītā appeared to me,' and made Rāma happy with his words."

[[sections.items]]
n = 17
telugu = "అప్పుఁడు రాముఁడు లంకకుఁ బోయి రాక్షసుల నందఱిని చంపి రావణుని చంపి లంకను విభీషణున కిచ్చి తిరిగి అయోధ్యకు వచ్చి రాజ్యమును పాలించెను."
english = "Then Rāma went to Laṅkā, killed all the demons, slew Rāvaṇa, gave Laṅkā to Vibhīṣaṇa, returned to Ayodhyā, and ruled the kingdom."

[[sections.items]]
n = 18
telugu = "జనులను సంతోషపెట్టెను."
english = "He made the people happy."
