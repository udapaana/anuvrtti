[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "తే బాలకాః కుత్రత్యాః వా ప్రష్ట్వాపి ఆగచ్చ."
english = "Ask where those boys are from and then come."

[[sections.items]]
n = 2
sanskrit_telugu = "తే సర్వేపి దాక్షిణాత్యాః ఏవ; తేషాం వస్తాదిక మేవ కథయతి."
english = "They are all southerners; their clothing and so on speaks for itself."

[[sections.items]]
n = 3
sanskrit_telugu = "తే ఔత్తరాహాః భవేయురితి."
english = "Could they possibly be northerners?"

[[sections.items]]
n = 4
sanskrit_telugu = "పాశ్చాత్యానాం అస్మాకంచ భేదః సమ్యక్ దృశ్యతే."
english = "The difference between westerners and us is clearly seen."

[[sections.items]]
n = 5
sanskrit_telugu = "తేషాం వర్ణః శ్వేతః అస్మాకంతు నీలవర్ణః."
english = "Their complexion is white; ours, however, is dark."

[[sections.items]]
n = 6
sanskrit_telugu = "తస్మాదేవ తేషాం శ్వేతముఖా ఇతి నామధేయం అస్తి."
english = "For that very reason they have the appellation 'white-faced.'"

[[sections.items]]
n = 7
sanskrit_telugu = "త్వత్సమీపే స్థితం సర్వమపి ధనం విభజ్య అర్థభాగం తవ అనుజాయ దేహి."
english = "Having divided all the wealth that is with you, give half the share to your younger brother."

[[sections.items]]
n = 8
sanskrit_telugu = "తటాకః కదా పూర్ణః?"
english = "When was the tank full?"

[[sections.items]]
n = 9
sanskrit_telugu = "సర్వమపి ధనం విభజ్య అర్థభాగం తవ అనుజాయ దేహి."
english = "Having divided all the wealth, give half the share to your younger brother."

[[sections.items]]
n = 10
sanskrit_telugu = "తటాకః కదా పూర్ణః?"
english = "When was the tank full?"

[[sections.items]]
n = 11
sanskrit_telugu = "సమ్యక్ అవర్తలు."
english = "It rained well."

[[sections.items]]
n = 12
sanskrit_telugu = "ఏకస్యాం ప్రపూర్వేద్యుః [రాత్రిందివం = రేయింబగలు] సమ్యక్ అవర్తలు."
english = "On a certain night and day before, it rained well day and night."

[[sections.items]]
n = 13
sanskrit_telugu = "రాత్ర్యాం ఏవ సంపూర్ణః ఆసీత్."
english = "It was completely full by night itself."

[[sections.items]]
n = 14
sanskrit_telugu = "ఇతఃపరం వత్సరచతుష్టయపర్యంతం జలస్య క్షాముః నాస్తి."
english = "From now on for four years there will be no shortage of water."

[[sections.items]]
n = 15
sanskrit_telugu = "[శాలిక్షేత్రాణి = వరి పొలములు] ఏతదవత్సరే సమ్యక్ ఫలిష్యంతీతి జ్ఞాముః నాస్తి."
english = "There is no certainty that the rice fields will yield well this year."

[[sections.items]]
n = 16
sanskrit_telugu = "అరే తవ గుణాః మహ్యం న రోచంతే."
english = "Hey, your qualities do not please me."

[[sections.items]]
n = 17
sanskrit_telugu = "తవ సమాచారః సుతరాం సమ్యక్ భాతి."
english = "Your news seems altogether proper."

[[sections.items]]
n = 18
sanskrit_telugu = "అరే తవ గుణాః మహ్యం న రోచంతే."
english = "Hey, your qualities do not please me."

[[sections.items]]
n = 19
sanskrit_telugu = "తవ సమాచారః సుతరాం సమ్యక్ నాస్తి."
english = "Your news is altogether not proper."

[[sections.items]]
n = 20
sanskrit_telugu = "ఇతః ప్రభృతి [ప్రాతఃఉత్థాయ = ప్రాతరుత్థాయ] స్నానం శీతోదకే కురు."
english = "From now on, having risen early in the morning, bathe in cold water."

[[sections.items]]
n = 21
sanskrit_telugu = "అనంతరం సంధ్యావందనాదికం యథావిధి కురు."
english = "Afterwards, perform the evening prayer and other duties according to the prescribed method."

[[sections.items]]
n = 22
sanskrit_telugu = "తతః హ్యస్తనశోకచింతనాం కురు."
english = "Then reflect on yesterday's grief."

[[sections.items]]
n = 23
sanskrit_telugu = "అద్య పఠనీయం పాఠం సమ్యక్ విచారయ."
english = "Carefully think over today's lesson that is to be studied."

[[sections.items]]
n = 24
sanskrit_telugu = "ఏవంచే త్రవ వచనం అంగీకరిష్యామి; నోచేత్రవ గతి స్తవ; మామ గతి ర్మము."
english = "If so, I will accept your word; otherwise, your path is yours; my path is mine."

[[sections.items]]
n = 25
sanskrit_telugu = "జ్ఔషధం కథమపి గిళ."
english = "Swallow the medicine somehow."

[[sections.items]]
n = 26
sanskrit_telugu = "ఆరోగ్యం శీఘ్రమేవ విందేః."
english = "You will find health quickly."

[[sections]]
type = "passage_translation"
language = "telugu"

[[sections.items]]
n = 1
telugu = "నిన్నఁ నేను [గృహాచారముచాలక = గృహాచారహీనాః] సంభావన కొనసము పెండ్లిచోటునకు వెళ్ళితిని."
english = "Yesterday I went to the wedding venue to receive the gift, though lacking in domestic propriety (gṛhācārahīnāḥ)."

[[sections.items]]
n = 2
telugu = "సంభావన లేదు."
english = "There was no gift."

[[sections.items]]
n = 3
telugu = "సరిగదా యజమానుఁడు కఱతీసికొని నన్నుఁ కొట్టవచ్చినాఁడు."
english = "Serves me right — the master took a stick and came to beat me."

[[sections.items]]
n = 4
telugu = "నీ విప్పుఁడు డెక్కడికి ప్రయాణమగుచున్నా వయ్యా?"
english = "Where are you setting out to now, sir?"

[[sections.items]]
n = 5
telugu = "ఎక్కఁడికని అడిగినావు; శకునము బాగుగనేయున్నది."
english = "You asked where I am going — the omen is quite good."

[[sections.items]]
n = 6
telugu = "ఇంక నాపని బాగుగనే నెరవేరును."
english = "My work will now be accomplished well."

[[sections.items]]
n = 7
telugu = "అటుల నెప్పుఁడును [అడుగరాదు = న ప్రష్టవ్యం] అందుచేతనే నేను నిన్నఁ దుఃఖమును అనుభవించితిని."
english = "One should never ask such things (na praṣṭavyam) — that is why I suffered sorrow yesterday."

[[sections.items]]
n = 8
telugu = "నీ బట్టలు నా పెట్టెలో (పట్టువు = ఇముడవు) గనుక నీపెట్టెలోనే [పెట్టుకొనుము = నిక్షిప] మొరెటులైన ముహూర్తమును గడపి వెళ్ళుఁడు."
english = "Your clothes do not fit (imuḍavu) in my box, so keep them (nikṣipa) in your own box — somehow spend the auspicious hour and then go."

[[sections.items]]
n = 9
telugu = "నాభాగమును నాకు పంచిపెట్టుము."
english = "Distribute my share to me."

[[sections.items]]
n = 10
telugu = "మా యూరు సముద్రపుకొఱ్ఱన నున్నది; గనుక అక్కఁడ నెండకాలపు భాదలేదు."
english = "Our village is on the seashore, so there is no trouble from the summer heat there."

[[sections.items]]
n = 11
telugu = "మొకేమండి మొరెప్పుఱిదను డబ్బుతో నిండినవారు."
english = "What do you mean — you people have always been full of money."

[[sections.items]]
n = 12
telugu = "నా దగ్గర నేమి యున్నది?"
english = "What do I have with me?"

[[sections.items]]
n = 13
telugu = "ఒక దమ్మిడియును లేదు."
english = "Not even a single small coin."

[[sections.items]]
n = 14
telugu = "నీవు చాల చతురుఁడవుగాని ఇఁక నూరకుఱేదుము."
english = "You are very clever, but let us be quiet now."

[[sections.items]]
n = 15
telugu = "[నాకంటె = మదపేక్షయా] నీవే డబ్బుతో నిండినవాఁడవు."
english = "Compared to me (madapekṣayā), you yourself are the one full of money."

[[sections.items]]
n = 16
telugu = "నీవెంత మాత్రము దరిద్రుఁడవు కావు."
english = "You are not poor in the least."

[[sections.items]]
n = 17
telugu = "వట్టిమాటలతో నేమి ప్రయోజన మున్నది?"
english = "What is the use of empty words?"

[[sections.items]]
n = 18
telugu = "తెచిపో..."
english = "Get out of here..."
