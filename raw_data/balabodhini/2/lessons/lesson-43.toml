# ── passage ──

[[sections]]
type = "passage"
language = "sanskrit"

[[sections.items]]
n = 1
sanskrit_telugu = "బాలకాః వృక్షాన్ ఆరుహ్య ఫలాని పర్ణాని చ భేదయన్తి."
english = "The boys, having climbed the trees, are plucking fruits and leaves."

[[sections.items]]
n = 2
sanskrit_telugu = "అద్య భోజనార్థం కేకే ఆగమిష్యంతి వా సమ్యక్ ఆలోచ్య పాకం కారయ."
english = "Think carefully about who will come for the meal today and have the cooking done accordingly."

[[sections.items]]
n = 3
sanskrit_telugu = "నోచేత్ వ్యర్థః భవిష్యతి."
english = "Otherwise it will be wasted."

[[sections.items]]
n = 4
sanskrit_telugu = "సర్వే మేషాః పర్వతాత్ అవరుహ్య గృహం అగచ్ఛంతి."
english = "All the rams, having descended from the mountain, went home."

[[sections.items]]
n = 5
sanskrit_telugu = "యుష్మాకం బహులా హ్యః సాయంకాళే అస్మాకం ద్వారే ఈషత్కాలపర్యంతం స్థిత్వా అనంతరం కుత్రవా అచలత్."
english = "Your cow yesterday evening stood at our door for a short while and then moved off somewhere."

[[sections.items]]
n = 6
sanskrit_telugu = "తేషాం అవరోహణపర్యంతం త్వం అత్రైవ తిష్ఠ."
english = "Until they descend, you stay right here."

[[sections.items]]
n = 7
sanskrit_telugu = "బత! బాలకః పృక్షాత్ అపతద్రే తం ఉత్థాపయరే."
english = "Alas! The boy has fallen from the tree — go and help him up."

[[sections.items]]
n = 8
sanskrit_telugu = "తాత! మాం శ్నైః మంచ మారోపయిష్యసి కిం?"
english = "Father! Will you gently lift me up onto the cot?"

[[sections.items]]
n = 9
sanskrit_telugu = "తే బ్రాహ్మణాః కటుప్రసారణానంతరం అంతః ఆగమిష్యంతి."
english = "Those brāhmaṇas will come inside after the mat is spread."

[[sections.items]]
n = 10
sanskrit_telugu = """చోష్యే ఈషత్\
 లవణం స్థాపయ."""
english = "Put a little salt in the chutney."

[[sections.items]]
n = 11
sanskrit_telugu = "తైలపాత్రం ఘృతపాత్రం చ శక్యే కే అస్థాపయన్?"
english = "Who placed the oil vessel and the ghee vessel in the basket?"

[[sections.items]]
n = 12
sanskrit_telugu = "కింవా మయా న జ్ఞాయతే."
english = "Why — it is not known by me."

[[sections.items]]
n = 13
sanskrit_telugu = "మండపే ఏకా లతా లంబతే పశ్య."
english = "A creeper is hanging in the pavilion — look."

[[sections.items]]
n = 14
sanskrit_telugu = "సా కా లతా? తత్ర వృష్టికః అస్తి."
english = "What creeper is that? There is a scorpion on it."

[[sections.items]]
n = 15
sanskrit_telugu = "త్వం గత్వా శీఘ్రం మారయ; నోచేత్ బాలకం దశేత్."
english = "Go quickly and kill it; otherwise it may bite the child."

[[sections.items]]
n = 16
sanskrit_telugu = "నవనీతం ద్రావయిత్వా ఘృతం కురుత."
english = "Melt the butter and make ghee."

[[sections.items]]
n = 17
sanskrit_telugu = "అస్మదావరణే వార్తాకాని సంతిచేత్, శాకార్థం ఆసయత."
english = "If there are brinjals in our yard, set them aside for the vegetable dish."

[[sections.items]]
n = 18
sanskrit_telugu = "చోష్యే ఉర్వారుకం దార్వికాఫలంచ పాతయత శ్రీనివాసస్య పుత్రః పాఠార్థం అద్య ఆగమిష్యతి వా నవా విచార్య వద."
english = "Drop the cucumber and the wood-apple into the chutney. Think carefully and tell me whether Śrīnivāsa's son will come today for his lesson or not."

[[sections.items]]
n = 19
sanskrit_telugu = "అనుజాం దోలాయాం కే అశాయయన్?"
english = "Who put the younger sister to sleep in the cradle?"

# ── passage_translation ──

[[sections]]
type = "passage_translation"
language = "telugu"

[[sections.items]]
n = 1
telugu = "నిన్నరాత్రి మాయింట్లో నున్నవారెవరు ?"
english = "Who were the people staying at our house last night?"

[[sections.items]]
n = 2
telugu = "మొన్నఁ మీఁ దొడ్డిలోనికి నాలుగుమారు దొంగలు వచ్చినారఁటే."
english = "I hear that thieves came into your yard four times the day before yesterday."

[[sections.items]]
n = 3
telugu = "నాలుగుమారు కాదుగాని రెండు మాఱులో మూఁడుమాఱులో వచ్చినారు."
english = "Not four times — they came two or three times."

[[sections.items]]
n = 4
telugu = "చాలదా ఏమి ?"
english = "Is that not enough?"

[[sections.items]]
n = 5
telugu = "ఏమైనను ఎత్తుకొని పోయినారా?"
english = "Did they carry anything away?"

[[sections.items]]
n = 6
telugu = "మానాన్నఁగారి అంగవస్తాలను దొంగిలించిరి."
english = "They stole our father's upper garments."

[[sections.items]]
n = 7
telugu = "(పోనీకే= వ్యతునామ) ఇంతవఱకు బాగుగానే యుండెను."
english = "Well, never mind (vyatunāma) — until now everything was fine."

[[sections.items]]
n = 8
telugu = "నేను వచ్చువఱకు నీవిక్కఁడ నిలువగలవా?"
english = "Can you stand here until I come?"

[[sections.items]]
n = 9
telugu = "అలాగే యుండునుగాని."
english = "Yes, I will stay like that."

[[sections.items]]
n = 10
telugu = "మొరు వెళ్ళిరండు."
english = "Go and come back."

[[sections.items]]
n = 11
telugu = "ఓ నాయనా! మీఁ అమ్మను పిలువుము."
english = "O dear! Call your mother."

[[sections.items]]
n = 12
telugu = "బొత్తుగా రామాయణమును చదువవేమిరా - చదువుచున్నాను నాయనా !"
english = "Why don't you read the Rāmāyaṇa at all? — I am reading, father!"

[[sections.items]]
n = 13
telugu = "నేను చదువలేదని ఎవరు చెప్పినారు ?"
english = "Who said I am not reading?"

[[sections.items]]
n = 14
telugu = "ఎవఁడు చెప్పిన నేమిగాని నీవు పుస్తకమును చూచుచున్నావురా ?"
english = "Never mind who said it — you are just looking at the book, aren't you, boy?"

[[sections.items]]
n = 15
telugu = "చూచుటలేదుగాని చదువుచున్నానని చెప్పితినిగా."
english = "I am not just looking — I said I am reading, didn't I?"

[[sections.items]]
n = 16
telugu = "బాగుగానే యున్నది; చూచుచున్నాఁడు కాఁదఁటు చదువుచున్నాఁడఁటు పోని నాయనా! తమ్మునిఁ అడుగుము."
english = "Very well; not looking at it, he says — reading, he says — never mind, dear! Ask your younger brother."

[[sections.items]]
n = 17
telugu = "అలాగే అడుగుదునుగాని తమ్మునిఁ పిలువుము."
english = "Yes, I will ask — but first call the younger brother."

[[sections.items]]
n = 18
telugu = "పిలిచినాను."
english = "I have called him."

[[sections.items]]
n = 19
telugu = "ఏమిరా పిల్లవాఁడా! అన్నయ్యఁ ఇప్వేళ ప్రొద్దున మొదలుకొని యేమిచేయుచున్నాఁడురా."
english = "What has your elder brother been doing since this morning, boy?"

[[sections.items]]
n = 20
telugu = "నిజముగా చెప్పఁఱిము."
english = "Tell the truth."

[[sections.items]]
n = 21
telugu = "అన్నయ్యఁనడిగి చెప్పఁఱిదను."
english = "I will ask elder brother and tell you."

[[sections.items]]
n = 22
telugu = "నాయనా! అన్నయ్యను అడుగవద్దు నీవే చెప్పఁఱిము."
english = "My dear! Do not ask elder brother — you yourself tell me."

[[sections.items]]
n = 23
telugu = "అన్నయ్యఁ మన దొడ్లో గడ్డపాఱితో త్రవ్వుచున్నాఁడయ్యో!"
english = "Elder brother is digging in our yard with a spade, oh my!"
