# --- grammar note: dyo like go, nau like glau ---

[[sections]]
type = "grammar_note"
language = "meta"

[[sections.items]]
telugu = "'ద్యో' శబ్దము 'గో' శబ్దము వలెను, 'నౌ' శబ్దము 'గ్లౌ' శబ్దమువలెను చెప్పఁకొనవలయును."
english = "dyo declines like go; nau declines like glau."

