# --- grammar note: intro on o/au-kārānta stems ---

[[sections]]
type = "grammar_note"
language = "meta"

[[sections.items]]
telugu = """'ఓ' కారాంతశబ్దములు కే వనియే చెప్పవచ్చును. 'ఏ'కారాంత, 'ఐ'కారాంతశబ్దము లొకటి రెండున్నను ప్రాయశఽ భాషలోనికి (వ్యవహారము) లోనికి వచ్చుటయేలేదు. 'ఓ' కారాంతము లై వ్యవహారమలోనికి వచ్చు శబ్దములు రెండుమాత్రము నా స్వల్పానుభవములో గోచరమాళైనవి. అవి ం 'గో' శబ్దము. ం 'ద్యో' శబ్దము. వానిలో 'గో' శబ్దము-ఆవు అర్థమయినప్పుడు స్త్రీలింగమును. ఎద్దు అర్థమయినపుడు పుంలింగమును గలిగి యుండును.'ద్యో' శబ్దము మాత్రమ స్వర్గవాచకము; స్త్రీలింగము. రెండు శబ్దములు నొక విధముగనే యుండును. 'ఔ' కారాంత పుంలింగము 'గ్లౌ' శబ్దము; చంద్రుండర్థము. "ఔ"కారాంత స్త్రీలింగము "నౌ" శబ్దము ఓడ యర్థము. ఇవియును వ్యవహారమలో రెండే నేనెఱిఁగినంతవఱకు గోచరించుచున్నవి. రెండును ఒకవిధముగనే నడచును."""
english = "O-kārānta words are few in number. Only go (cow/bull) and dyo (heaven) are in practical use. go is feminine when meaning 'cow', masculine for 'bull'; dyo is feminine (heaven). Au-kārānta words: glau (moon, masculine) and nau (boat, feminine). Both pairs decline alike."

