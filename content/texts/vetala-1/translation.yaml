'8.196':
  text: |
    When the Vetala, who was in the corpse, heard this, as the king by giving this correct answer had broken his silence, he immediately left his shoulder, and went somewhere unobserved by the force of his magic power, in order to test his persistence; and the intrepid king at once determined to recover him.
  modern: |
    When the Vetāla, who was in the corpse, heard this, he saw that the king had broken his silence by giving the correct answer. At once, by the force of his magic power, he left the king's shoulder and went off somewhere unseen, to test the king's persistence. And the fearless king at once determined to recover him.
