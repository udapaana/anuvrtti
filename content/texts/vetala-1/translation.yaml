# Keyed by our section id (Kathāsaritsāgara 12.8.verse). Tawney gives no verse numbers; aligned by content, sentence by sentence.
# `text`: Tawney's sentence(s), OCR cleaned; his spelling kept, acute accents on names not represented. A sentence spanning several ślokas
#   is given to the first and the rest read `(with <first>)`. Where a quoted speech is cut across ślokas, the quotation mark is left open or closed as the sentence falls.
# `note`: Tawney's footnote where it bears on the verse. His margin heading and the chapter's other footnotes are omitted.
source:
  translator: C. H. Tawney
  title: The Kathá Sarit Ságara, or Ocean of the Streams of Story, vol. 2
  publisher: 'Calcutta: Baptist Mission Press'
  year: 1884
  archive: kathsaritsga02somauoft
  pages: 232–241
'8.21':
  text: |
    On the banks of the Godavari there is a place named Pratishthana.
  modern: |
    On the banks of the Godāvarī there is a place named Pratiṣṭhāna.
'8.22':
  text: |
    In it there lived of old time a famous king, named Trivikramasena, the son of Vikramasena, equal to Indra in might.
  modern: |
    Long ago a famous king lived there, named Trivikramasena, the son of Vikramasena and equal to Indra in might.
'8.23':
  text: |
    Every day, when he was in his hall of audience, a mendicant named Kshantisila came to him, to pay him his respects, and presented him with a fruit.
  modern: |
    Every day, when the king was in his hall of audience, a mendicant named Kṣāntiśīla came to pay his respects and gave him a fruit.
'8.24':
  text: |
    And every day, the king as soon as he received the fruit, gave it into the hand of the superintendent of his treasury who was near him.
  modern: |
    And every day, as soon as the king received the fruit, he handed it to the superintendent of his treasury, who stood near him.
'8.25':
  text: |
    In this way ten years passed, but one day, when the mendicant had left the hall of audience, after giving the fruit to the king, the king gave it to a young pet monkey, that had escaped from the hands of its keepers, and happened to enter there.
  modern: |
    Ten years passed in this way. But one day, after the mendicant had given the king the fruit and left the hall of audience, the king gave it to a young pet monkey that had escaped from its keepers and happened to come in.
'8.26':
  text: |
    (with 8.25)
'8.27':
  text: |
    While the monkey was eating that fruit, it burst open, and there came out of it a splendid priceless jewel.
  modern: |
    While the monkey was eating the fruit, it burst open, and a splendid, priceless jewel came out of it.
'8.28':
  text: |
    When the king saw that, he took up the jewel, and asked the treasurer the following question, "Where have you put all those fruits which I have been in the habit of handing over to you, after they were given to me by the mendicant?"
  modern: |
    When the king saw that, he picked up the jewel and asked the treasurer, "Where have you put all those fruits that the mendicant gave me and that I have been handing over to you?"
'8.29':
  text: |
    When the superintendent of the treasury heard that, he was full of fear, and he said to the king, "I used to throw them into the treasury from the window without opening the door; if your Majesty orders me, I will open it and look for them."
  modern: |
    When the superintendent of the treasury heard that, he was afraid, and he said to the king, "I used to throw them into the treasury through the window, without opening the door. If your Majesty orders me, I will open it and look for them."
'8.30':
  text: |
    (with 8.29)
'8.31':
  text: |
    When the treasurer said this, the king gave him leave to do so, and he went away, and soon returned, and said to the king "I see that those fruits have all rotted away in the treasury, and I also see that there is a heap of jewels there resplendent with radiant gleams."
  modern: |
    When the treasurer said this, the king gave him leave. He went away, soon returned, and said to the king, "I see that those fruits have all rotted away in the treasury. And I also see a heap of jewels there, resplendent with radiant gleams."
'8.32':
  text: |
    (with 8.31)
'8.33':
  text: |
    When the king heard it, he was pleased, and gave those jewels to the treasurer, and the next day he said to the mendicant, who came as before, "Mendicant, why do you court me every day with great expenditure of wealth?"
  modern: |
    When the king heard this, he was pleased and gave those jewels to the treasurer. The next day he said to the mendicant, who came as before, "Mendicant, why do you court me every day at such great expense?"
'8.34':
  text: |
    I will not take your fruit to-day until you tell me."
  modern: |
    I will not take your fruit today until you tell me."
'8.35':
  text: |
    When the king said this, the mendicant said to him in private, "I have an incantation to perform which requires the aid of a brave man, I request, hero, that you will assist me in it."
  modern: |
    When the king said this, the mendicant said to him in private, "I have an incantation to perform, and it needs the help of a brave man. I ask you, hero, to help me with it."
'8.36':
  text: |
    When the king heard that, he consented and promised him that he would do so.
  modern: |
    When the king heard that, he agreed and promised to do so.
'8.37':
  text: |
    Then the mendicant was pleased and he went on to say to that king, "Then I shall be waiting for you at night-fall in the approaching black fortnight, in the great cemetery here, under the shade of a banyan-tree, and you must come to me there."
  modern: |
    Then the mendicant was pleased and went on to say to the king, "Then I shall be waiting for you at nightfall in the coming dark fortnight, in the great cemetery here, under the shade of a banyan tree. You must come to me there."
'8.38':
  text: |
    (with 8.37)
'8.39':
  text: |
    The king said—"Well! I will do so." And the mendicant Kshantisila returned delighted to his own dwelling.
  modern: |
    The king said, "Very well! I will do so." And the mendicant Kṣāntiśīla went back, delighted, to his own dwelling.
'8.40':
  text: |
    Then the heroic monarch, as soon as he had got into the black fortnight, remembered the request of the mendicant, which he had promised to accomplish for him, and as soon as night came, he enveloped his head in a black cloth, and left the palace unperceived, sword in hand, and went fearlessly to the cemetery.
  modern: |
    Then the heroic king, as soon as the dark fortnight had begun, remembered the mendicant's request, which he had promised to fulfill. When night came, he wrapped his head in a black cloth, left the palace unnoticed with his sword in his hand, and went fearlessly to the cemetery.
'8.41':
  text: |
    (with 8.40)
'8.42':
  text: |
    It was obscured by a dense and terrible pall of darkness, and its aspect was rendered awful by the ghastly flames from the burning of the funeral pyres, and it produced horror by the bones, skeletons, and skulls of men that appeared in it.
  modern: |
    A dense, terrible pall of darkness covered it. The ghastly flames of the burning funeral pyres made it look awful, and the bones, skeletons, and skulls of men that showed in it filled it with horror.
'8.43':
  text: |
    In it were present formidable Bhutas and Vetalas, joyfully engaged in their horrible activity, and it was alive with the loud yells of jackals,* so that it seemed like a second mysterious tremendous form of Bhairava.
  modern: |
    Formidable Bhūtas and Vetālas were there, joyfully busy with their horrible work, and the place rang with the loud yells of jackals, so that it seemed a second form of Bhairava, mysterious and tremendous.
  note: |
    Here there is probably a pun. The word translated "jackal" also means the god S'iva. Bhairava is a form of S'iva.
'8.44':
  text: |
    (with 8.43)
'8.45':
  text: |
    And after he had searched about in it, he found that mendicant under a banyan-tree, engaged in making a circle, and he went up to him and said, "Here I am arrived, mendicant; tell me, what can I do for you?"
  modern: |
    After searching the cemetery, he found the mendicant under a banyan tree, busy making a circle. He went up to him and said, "Here I am, mendicant. Tell me, what can I do for you?"
'8.46':
  text: |
    When the mendicant heard that, and saw the king, he was delighted, and said to him—"King, if I have found favour in your eyes, go alone a long way from here towards the south, and you will find an aśoka-tree.
  modern: |
    When the mendicant heard that and saw the king, he was delighted and said to him, "King, if I have found favor in your eyes, go alone a long way from here toward the south, and you will find an aśoka tree.
  departs: Our text (8.47) names a śiṃśapā tree (Dalbergia sissoo), not an aśoka; Tawney's edition (Brockhaus) may read differently.
'8.47':
  text: |
    (with 8.46)
'8.48':
  text: |
    On it there is a dead man hanging up; go and bring him here; assist me in this matter, hero."
  modern: |
    A dead man is hanging on it. Go and bring him here. Help me in this matter, hero."
'8.49':
  text: |
    As soon as the brave king, who was faithful to his promise, heard this, he said, "I will do so," and went towards the south.
  modern: |
    As soon as the brave king, who kept his promises, heard this, he said, "I will do so," and went toward the south.
'8.50':
  text: |
    And after he had gone some way in that direction, along a path revealed by the light of the flaming pyres, he reached with difficulty in the darkness that aśoka-tree; the tree was scorched with the smoke of funeral pyres, and smelt of raw flesh, and looked like a Bhuta, and he saw the corpse hanging on its trunk, as it were on the shoulder of a demon.
  modern: |
    After he had gone some way in that direction, along a path lit by the flaming pyres, he reached that aśoka tree with difficulty in the darkness. The smoke of funeral pyres had scorched the tree, it smelled of raw flesh, and it looked like a Bhūta. He saw the corpse hanging on its trunk, as if on the shoulder of a demon.
  departs: Again our text has the śiṃśapā tree, not an aśoka.
'8.51':
  text: |
    (with 8.50)
'8.52':
  text: |
    So he climbed up, and cutting the string which held it, flung it to the ground. And the moment it was flung down, it cried out, as if in pain.
  modern: |
    So he climbed up, cut the rope that held it, and threw it to the ground. The moment it fell, it cried out as if in pain.
'8.53':
  text: |
    Then the king, supposing it was alive, came down and rubbed its body out of compassion; that made the corpse utter a loud demoniac laugh.
  modern: |
    Then the king, thinking it was alive, came down and rubbed its body out of compassion. At that the corpse let out a loud, demonic laugh.
'8.54':
  text: |
    Then the king knew that it was possessed by a Vetala, and said without flinching, "Why do you laugh? Come, let us go off."
  modern: |
    Then the king knew that a Vetāla possessed it, and he said without flinching, "Why do you laugh? Come, let us go."
'8.55':
  text: |
    And immediately he missed from the ground the corpse possessed by the Vetala, and perceived that it was once more suspended on that very tree.
  modern: |
    At once he missed the corpse from the ground, the one the Vetāla possessed, and he saw that it was hanging once more on that same tree.
'8.56':
  text: |
    Then he climbed up again and brought it down, for the heart of heroes is a gem more impenetrable than adamant.
  modern: |
    Then he climbed up again and brought it down, for the heart of heroes is a gem harder than adamant.
'8.57':
  text: |
    Then king Trivikramasena threw the corpse possessed by a Vetala over his shoulder, and proceeded to go off with it, in silence.
  modern: |
    Then King Trivikramasena threw the corpse with the Vetāla in it over his shoulder and set off with it in silence.
'8.58':
  text: |
    And as he was going along, the Vetala in the corpse that was on his shoulder said to him, "King, I will tell you a story to beguile the way, listen."
  modern: |
    As he was going along, the Vetāla in the corpse on his shoulder said to him, "King, I will tell you a story to make the way pass. Listen."
'8.59':
  text: |
    There is a city named Varanasi, which is the dwelling-place of S'iva, inhabited by holy beings, and thus resembles the plateau of mount Kailasa.
  modern: |
    There is a city named Vārāṇasī, the dwelling place of Śiva, inhabited by holy beings. In this it resembles the plateau of Mount Kailāsa.
'8.60':
  text: |
    The river Ganges, ever full of water, flows near it, and appears as if it were the necklace ever resting on its neck; in that city there lived of old time a king named Pratapamukuta, who consumed the families of his enemies with his valour, as the fire consumes the forest.
  modern: |
    The river Ganges, always full of water, flows near it and looks like a necklace resting on its neck. In that city there lived, long ago, a king named Pratāpamukuṭa, who consumed the families of his enemies with his valor, as fire consumes a forest.
'8.61':
  text: |
    (with 8.60)
'8.62':
  text: |
    He had a son named Vajramukuta, who dashed the god of love's pride in his beauty, and his enemies' confidence in their valour.
  modern: |
    He had a son named Vajramukuṭa, who struck down the god of love's pride in his beauty and his enemies' confidence in their valor.
'8.63':
  text: |
    And that prince had a friend, named Buddhisarira, whom he valued more than his life, the sagacious son of a minister.
  modern: |
    That prince had a friend named Buddhiśarīra, the shrewd son of a minister, whom he valued more than his life.
'8.64':
  text: |
    Once on a time that prince was amusing himself with that friend, and his excessive devotion to the chase made him travel a long distance.
  modern: |
    Once that prince was amusing himself with his friend, and his great devotion to the hunt took him a long way from home.
'8.65':
  text: |
    As he was cutting off the long-maned heads of lions with his arrows, as it were the chowries that represented the glory of their valour, he entered a great forest.
  modern: |
    He was cutting off the long-maned heads of lions with his arrows, as if they were the chowries that stood for the glory of the lions' valor, when he entered a great forest.
'8.66':
  text: |
    It seemed like the chosen home of love, with singing cuckoos for bards, fanned by trees with their clusters of blossoms, waving like chowries.
  modern: |
    It seemed the chosen home of love, with singing cuckoos for bards and trees fanning it with their waving clusters of blossoms, like chowries.
'8.67':
  text: |
    In it he and the minister's son saw a great lake, looking like a second sea, the birthplace of lotuses* of various colours; and in that pool of gods there was seen by him a maiden of heavenly appearance, who had come there with her attendants to bathe.
  modern: |
    In the forest he and the minister's son saw a great lake that looked like a second sea, the birthplace of lotuses of many colors. And in that pool of the gods he saw a maiden of heavenly appearance, who had come there with her attendants to bathe.
  note: |
    In this there is a pun; the word translated "lotus" may also refer to Lakshmi the wife of Vishnu.
'8.68':
  text: |
    (with 8.67)
'8.69':
  text: |
    She seemed to fill the splendid tank with the flood of her beauty, and with her glances to create in it a new forest of blue lotuses.
  modern: |
    She seemed to fill the splendid pool with the flood of her beauty, and with her glances to create a new forest of blue lotuses in it.
'8.70':
  text: |
    With her face, that surpassed the moon in beauty, she seemed to put to shame the white lotuses, and she at once captivated with it the heart of that prince.
  modern: |
    Her face surpassed the moon in beauty and seemed to put the white lotuses to shame, and with it she captivated the prince's heart at once.
'8.71':
  text: |
    The youth too, in the same way, took with a glance such complete possession of her eyes, that she did not regard her own modesty or even her ornaments.
  modern: |
    The young man in the same way took such complete possession of her eyes with a glance that she forgot her own modesty and even her ornaments.
'8.72':
  text: |
    And as he was looking at her with his attendants, and wondering who she was, she made, under pretence of pastime, a sign to tell him her country and other particulars about her.
  modern: |
    As he looked at her, with his attendants, and wondered who she was, she made a sign, under the pretense of playing, to tell him her country and other facts about herself.
'8.73':
  text: |
    She took a lotus from her garland of flowers, and put it in her ear, and she remained for a long time twisting it into the form of an ornament called dantapatra or tooth-leaf, and then she took another lotus and placed it on her head, and she laid her hand significantly upon her heart.
  modern: |
    She took a lotus from her garland of flowers and put it in her ear. For a long time she twisted it into the shape of an ornament called dantapatra, or tooth-leaf. Then she took another lotus and placed it on her head, and she laid her hand significantly on her heart.
'8.74':
  text: |
    The prince did not at that time understand those signs, but his sagacious friend the minister's son did understand them.
  modern: |
    The prince did not understand those signs at the time, but his shrewd friend, the minister's son, did.
'8.75':
  text: |
    The maiden soon departed, being led away from that place by her attendants, and when she had reached her own house, she flung herself down on a sofa, but her heart remained with that prince, to justify the sign she had made.
  modern: |
    The maiden soon left, led away from that place by her attendants. When she reached her own house, she flung herself down on a sofa, but her heart stayed with that prince, to make good the sign she had made.
'8.76':
  text: |
    (with 8.75)
'8.77':
  text: |
    The prince, for his part, when without her, was like a Vidyadhara who has lost his magic knowledge, and, returning to his own city, he fell into a miserable condition.
  modern: |
    The prince, for his part, without her, was like a Vidyādhara who has lost his magic knowledge. He returned to his own city and fell into a miserable state.
'8.78':
  text: |
    And one day the minister's son questioned him in private, speaking of that beauty as easy to obtain, whereupon he lost his self-command and exclaimed, "How is she to be obtained, when neither her name, nor her village, nor her origin is known? So why do you offer me false comfort?"
  modern: |
    One day the minister's son questioned him in private, speaking of that beauty as easy to win. At this the prince lost his self-control and cried out, "How is she to be won, when neither her name, nor her village, nor her family is known? So why do you offer me false comfort?"
'8.79':
  text: |
    (with 8.78)
'8.80':
  text: |
    When the prince said this to the minister's son, he answered, "What! did you not see, what she told you by her signs?
  modern: |
    When the prince said this, the minister's son answered, "What! Did you not see what she told you by her signs?
'8.81':
  text: |
    By placing the lotus in her ear, she meant to say this, 'I live in the realm of king Karnotpala.'
  modern: |
    By putting the lotus in her ear, she meant to say, 'I live in the realm of King Karṇotpala.'
'8.82':
  text: |
    By making it into the tooth-leaf ornament she meant to say, 'Know that I am the daughter of a dentist there.'
  modern: |
    By making it into the tooth-leaf ornament, she meant to say, 'Know that I am the daughter of a dentist there.'
  note: |
    Pandit S'yama Charan Mukhopadhyaya thinks that the word dantaghataka must mean "dentist:" the Petersburg lexicographers take it to mean, "a worker in ivory." His name Sangramavardhana has a warlike sound. Pandit Mahesa Chandra Nyayaratna thinks that dantaghata is a proper name. If so, sangramavardhana must mean prime minister.
'8.83':
  text: |
    By lifting up the lotus she let you know her name was Padmavati; and by placing her hand on her heart she told you that it was yours.
  modern: |
    By lifting up the lotus she let you know her name was Padmāvatī, and by laying her hand on her heart she told you that it was yours.
'8.84':
  text: |
    Now there is a king named Karnotpala in the country of Kalinga; he has a favourite courtier, a great dentist named Sangramavardhana, and he has a daughter named Padmavati, the pearl of the three worlds, whom he values more than his life.
  modern: |
    Now there is a king named Karṇotpala in the country of Kaliṅga. He has a favorite courtier, a great dentist named Saṅgrāmavardhana, and this man has a daughter named Padmāvatī, the pearl of the three worlds, whom he values more than his life.
'8.85':
  text: |
    (with 8.84)
'8.86':
  text: |
    All this I knew from the talk of the people, and so I understood her signs, which were meant to tell her country and the other particulars about her."
  modern: |
    I knew all this from what people say, and so I understood her signs, which were meant to tell you her country and the other facts about her."
'8.87':
  text: |
    When that prince had been told all this by the minister's son, he was pleased with that intelligent man, and rejoiced, as he had now got an opportunity of attaining his object, and, after he had deliberated with him, he set out with him from his palace on the pretence of hunting, but really in search of his beloved, and went again in that direction.
  modern: |
    When the minister's son had told the prince all this, the prince was pleased with that intelligent man and rejoiced, because he now had a way to reach his goal. After he had talked it over with him, he set out with him from his palace, on the pretense of hunting but really in search of his beloved, and went again in that direction.
'8.88':
  text: |
    (with 8.87)
'8.89':
  text: |
    And on the way he managed to give his retinue the slip by the speed of his swift horse, and he went to the country of Kalinga accompanied by the minister's son only.
  modern: |
    On the way he gave his retinue the slip by the speed of his swift horse, and he went to the country of Kaliṅga with only the minister's son.
'8.90':
  text: |
    There they reached the city of king Karnotpala, and searched for and found the palace of that dentist, and the prince and the minister's son entered the house of an old woman, who lived near there, to lodge.
  modern: |
    There they reached the city of King Karṇotpala, searched for the dentist's palace, and found it. Then the prince and the minister's son went into the house of an old woman who lived near it, to lodge there.
'8.91':
  text: |
    (with 8.90)
'8.92':
  text: |
    The minister's son gave their horses water and fodder, and placed them there in concealment, and then said to that old woman in the presence of the prince, "Do you know, mother, a dentist named Sangramavardhana?"
  modern: |
    The minister's son gave their horses water and fodder and kept them hidden there. Then, with the prince present, he said to the old woman, "Do you know, mother, a dentist named Saṅgrāmavardhana?"
'8.93':
  text: |
    When the old woman heard that, she said to him courteously, "I know him well; I was his nurse, and he has now made me attend upon his daughter as a duenna; but I never go there at present, as I have been deprived of my clothes, for my wicked son, who is a gambler, takes away my clothes as soon as he sees them."
  modern: |
    When the old woman heard that, she said to him politely, "I know him well. I was his nurse, and he has now set me to attend his daughter as a duenna. But I never go there at present, because I have been deprived of my clothes. My wicked son, who is a gambler, takes my clothes away as soon as he sees them."
'8.94':
  text: |
    (with 8.93)
'8.95':
  text: |
    (with 8.93)
'8.96':
  text: |
    When the minister's son heard this, he was delighted, and he gratified the old woman with the gift of his upper garment and other presents, and went on to say to her, "You are a mother to us, so do what we request you to do in secret; go to that Padmavati, the daughter of the dentist, and say to her, 'The prince, whom you saw at the lake, has come here, and out of love he has sent me to tell you.'"
  modern: |
    When the minister's son heard this, he was delighted. He pleased the old woman with the gift of his upper garment and other presents, and went on to say to her, "You are a mother to us, so do in secret what we ask. Go to that Padmāvatī, the dentist's daughter, and say to her, 'The prince whom you saw at the lake has come here, and out of love he has sent me to tell you.'"
'8.97':
  text: |
    (with 8.96)
'8.98':
  text: |
    (with 8.96)
'8.99':
  text: |
    When the old woman heard this, she consented, being won over by the presents, and went to Padmavati, and came back in a moment.
  modern: |
    When the old woman heard this, she agreed, won over by the presents. She went to Padmāvatī and came back in a moment.
'8.100':
  text: |
    And when the prince and the minister's son questioned her, she said to them, "I went and told her secretly that you had come.
  modern: |
    When the prince and the minister's son questioned her, she said to them, "I went and told her secretly that you had come.
'8.101':
  text: |
    When she heard that, she scolded me, and struck me on both cheeks with her two hands smeared with camphor.
  modern: |
    When she heard that, she scolded me and struck me on both cheeks with her two hands, which were smeared with camphor.
'8.102':
  text: |
    So I have come back weeping, distressed at the insult. See here, my children, these marks of her fingers on my face."
  modern: |
    So I have come back weeping, upset by the insult. Look, my children, at these marks of her fingers on my face."
'8.103':
  text: |
    When she said this, the prince was despondent, as he despaired of attaining his object, but the sagacious minister's son said to him in private, "Do not despond, for by keeping her own counsel and scolding the old woman, and striking her on the face with her ten fingers white with camphor, she meant to say, 'Wait for these remaining ten moonlight nights of the white fortnight, for they are unfavourable to an interview.'"
  modern: |
    When she said this, the prince lost heart, for he despaired of reaching his goal. But the shrewd minister's son said to him in private, "Do not lose heart. By keeping her own counsel, by scolding the old woman, and by striking her face with her ten fingers white with camphor, she meant to say, 'Wait for these remaining ten moonlight nights of the bright fortnight, for they are unfavorable for a meeting.'"
'8.104':
  text: |
    (with 8.103)
'8.105':
  text: |
    (with 8.103)
'8.106':
  text: |
