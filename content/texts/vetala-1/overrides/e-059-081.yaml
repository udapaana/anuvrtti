# Kathāsaritsāgara 12.8.59–81 — see ../overrides.yaml for the format.

'8.59':
  पुरारिवसतिः:
    split:
      - { form: पुर, lemma: पुर, member: true, gloss: 'a city; here Tripura, the triple city of the demons' }
      - { form: अरि, lemma: अरि, member: true, gloss: 'an enemy (पुरारि "the foe of Tripura", Śiva)' }
      - { form: वसतिः, lemma: वसति, a: प्रथमा एकवचन स्त्रीलिङ्ग, gloss: 'a dwelling, abode' }
  स्थलीव:
    fix:
      1: { gloss: 'a tableland, plateau' }
  कैलासगिरेर्या:
    split:
      - { form: कैलास, lemma: कैलास, member: true, gloss: 'Kailāsa, the mountain of Śiva and Kubera' }
      - { form: गिरेः, lemma: गिरि, a: षष्ठी एकवचन पुंलिङ्ग, gloss: 'a mountain' }
      - { form: या, lemma: यद्, a: प्रथमा एकवचन स्त्रीलिङ्ग, gloss: 'which' }
  पुण्यजनसेविता:
    split:
      - { form: पुण्य, lemma: पुण्य, member: true, gloss: 'virtuous, holy' }
      - { form: जन, lemma: जन, member: true, gloss: 'people (पुण्यजन "the virtuous"; also the Yakṣas)' }
      - { form: सेविता, lemma: सेव्, a: प्रथमा एकवचन स्त्रीलिङ्ग क्त, gloss: 'frequented, inhabited' }
    note: >-
      पुण्यजन is a pun: the city is thronged by the virtuous, as Kailāsa by
      the Yakṣas (also called पुण्यजन) of Kubera.

