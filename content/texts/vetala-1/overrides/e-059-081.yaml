    split:
      - { form: प्रताप, lemma: प्रताप, member: true, gloss: 'valour, majesty' }
      - { form: अनल, lemma: अनल, member: true, gloss: 'fire' }
      - { form: निर्दग्ध, lemma: निर्दग्ध, member: true, gloss: 'burnt up (निर् + दह्, क्त)' }
      - { form: विपक्ष, lemma: विपक्ष, member: true, gloss: 'an enemy' }
      - { form: कुल, lemma: कुल, member: true, gloss: 'a family, clan' }
      - { form: काननः, lemma: कानन, a: प्रथमा एकवचन पुंलिङ्ग, gloss: 'a forest' }
    note: >-
      A bahuvrīhi — "he by whom the forest of enemy clans was burnt up with the
      fire of his valour" — so the neuter कानन takes राजा's masculine.
