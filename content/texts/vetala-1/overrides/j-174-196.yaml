      2: { gloss: 'one, a certain one' }
      3: { form: आनीय, lemma: नी, a: अव्यय क्त्वा, gloss: 'having brought (आ + नी)' }
  योगिन्या:
    fix:
      1: { gloss: 'a yoginī, a sorceress' }
  उद्घाटितहृदम्भोजो:
    split:
      - { form: उद्घाटित, lemma: उद्घाटित, member: true, gloss: 'opened, laid open' }
