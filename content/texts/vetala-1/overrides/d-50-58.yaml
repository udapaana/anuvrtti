'8.58':
  तं:
    fix:
      1: { lemma: तद्, a: द्वितीया एकवचन पुंलिङ्ग }
  शवान्तःस्थो:
    fix:
      1: { form: शव, lemma: शव, member: true }
      2: { gloss: 'standing within' }
  वेतालोऽंसस्थितोऽब्रवीत्:
    split:
      - { form: वेतालः, lemma: वेताल, a: प्रथमा एकवचन पुंलिङ्ग }
      - { form: अंस, lemma: अंस, member: true, gloss: 'the shoulder' }
      - { form: स्थितः, lemma: स्था, a: प्रथमा एकवचन पुंलिङ्ग क्त }
      - { form: अब्रवीत्, lemma: ब्रू, a: लङ् प्रथमपुरुष एकवचन परस्मैपद }
  राजन्नध्वविनोदाय:
    split:
