# Kathāsaritsāgara 12.8.50–58 — see ../overrides.yaml for the format.

'8.50':
  आत्तदीप्तचितालातलक्षितेन:
    split:
      - { form: आत्त, lemma: आत्त, member: true, gloss: 'taken, seized (आ + दा, क्त)' }
      - { form: दीप्त, lemma: दीप्त, member: true, gloss: 'blazing, burning' }
      - { form: चिता, lemma: चिता, member: true, gloss: 'a funeral pyre' }
      - { form: अलात, lemma: अलात, member: true, gloss: 'a firebrand' }
      - { form: लक्षितेन, lemma: लक्ष्, a: तृतीया एकवचन पुंलिङ्ग क्त, gloss: 'marked, made visible' }
    note: >-
      "By a path made visible by blazing firebrands taken from the pyres" — one
      compound qualifying पथा.
  सः:
    fix:
      1: { lemma: तद्, a: प्रथमा एकवचन पुंलिङ्ग }
  तं:
    fix:
      1: { lemma: तद्, a: द्वितीया एकवचन पुंलिङ्ग }
  प्राप:
    fix:
      1: { form: प्राप, lemma: आप्, a: लिट् प्रथमपुरुष एकवचन परस्मैपद, gloss: 'reached (प्र + आप्)' }
    note: प्र + आप्, perfect प्र-आप — not a vocative.
  कथंचिच्छिंशपातरुम्:
    split:
      - { form: कथम्, lemma: कथम्, a: अव्यय, gloss: 'how? — with चित्, "somehow, with difficulty"' }
      - { form: चित्, lemma: चित्, a: अव्यय, gloss: 'with an interrogative: "some-" (कथंचित् "somehow")' }
      - { form: शिंशपा, lemma: शिंशपा, member: true, gloss: 'the Śiṃśapā tree (Dalbergia sissoo)' }
      - { form: तरुम्, lemma: तरु, a: द्वितीया एकवचन पुंलिङ्ग, gloss: 'a tree' }

'8.51':
  तस्य:
    fix:
      1: { lemma: तद्, a: षष्ठी एकवचन पुंलिङ्ग }
  स्कन्धे:
    fix:
      1: { gloss: 'a branch (of a tree); with तरोः, "on a bough of the tree"' }
  चिताधूमदग्धस्य:
    split:
      - { form: चिता, lemma: चिता, member: true, gloss: 'a funeral pyre' }
      - { form: धूम, lemma: धूम, member: true }
      - { form: दग्धस्य, lemma: दह्, a: षष्ठी एकवचन पुंलिङ्ग क्त, gloss: 'scorched, blackened' }
  क्रव्यगन्धिनः:
    split:
      - { form: क्रव्य, lemma: क्रव्य, member: true, gloss: 'raw flesh, carrion' }
      - { form: गन्धिनः, lemma: गन्धिन्, a: षष्ठी एकवचन पुंलिङ्ग, gloss: 'smelling of' }
  सोऽपश्यल्लम्बमानं:
    fix:
      1: { lemma: तद्, a: प्रथमा एकवचन पुंलिङ्ग }
  तं:
    fix:
      1: { lemma: तद्, a: द्वितीया एकवचन पुंलिङ्ग }
  तरोः:
    fix:
      1: { gloss: 'a tree' }
  भूतस्येव:
    fix:
      1: { lemma: भूत, a: षष्ठी एकवचन पुंलिङ्ग, gloss: 'a ghost, goblin' }

'8.52':
  तं:
    fix:
      1: { lemma: तद्, a: द्वितीया एकवचन पुंलिङ्ग }
  छिन्न:
    fix:
      1: { form: छिन्न, lemma: छिन्न, member: true, gloss: 'cut (छिद्, क्त)' }
    note: >-
      The edition prints छिन्न रज्जुम् as two words; the sense needs one
      बहुव्रीहि, छिन्नरज्जुम् "him whose rope was cut", qualifying तम्. Read as
      a misprint.
  रज्जुमपातयत्:
    fix:
      1: { lemma: रज्जु, a: द्वितीया एकवचन पुंलिङ्ग, note: 'Last member of the बहुव्रीहि छिन्नरज्जुम्, so masculine with तम्.' }
      2: { lemma: पाति, a: लङ् प्रथमपुरुष एकवचन परस्मैपद, gloss: 'made fall, threw down (causative of पत्)' }
  पतितश्चात्र:
    fix:
      1: { lemma: पत्, a: प्रथमा एकवचन पुंलिङ्ग क्त, gloss: 'fallen' }
  सोऽकस्माच्चक्रन्द:
    fix:
      1: { lemma: तद्, a: प्रथमा एकवचन पुंलिङ्ग }
  यथा:
    fix:
      1: { gloss: 'as if' }

'8.53':
  ततोऽवरुह्य:
    fix:
      1: { gloss: 'then, thereupon' }
  जीवाशङ्की:
    split:
      - { form: जीव, lemma: जीव, member: true, gloss: 'life' }
      - { form: आशङ्की, lemma: शङ्क्, a: प्रथमा एकवचन पुंलिङ्ग णिनि, gloss: 'suspecting' }
  स:
    fix:
      1: { lemma: तद्, a: प्रथमा एकवचन पुंलिङ्ग, note: सः loses its visarga before a consonant (6.1.132). }
  तस्य:
    fix:
      1: { lemma: तद्, a: षष्ठी एकवचन पुंलिङ्ग }
  यत्:
    fix:
      1: { lemma: यद्, a: अव्यय, gloss: 'when, as (correlative to तेन)' }
  राजाङ्गं:
    fix:
      2: { lemma: अङ्ग, a: द्वितीया एकवचन नपुंसकलिङ्ग, gloss: 'a limb, the body' }
  प्रामृशत्तेन:
    split:
      - { form: प्रामृशत्, lemma: मृश्, a: लङ् प्रथमपुरुष एकवचन परस्मैपद, gloss: 'touched, felt (प्र + मृश्)' }
      - { form: तेन, lemma: तद्, a: तृतीया एकवचन नपुंसकलिङ्ग, gloss: 'by that, therefore' }
  सोऽट्टहासं:
    fix:
      1: { lemma: तद्, a: प्रथमा एकवचन पुंलिङ्ग }
      2: { gloss: 'a loud laugh, guffaw' }
  व्यधाच्छवः:
    fix:
      1: { gloss: 'made, did (वि + धा, aorist)' }

'8.54':
  ततः:
    fix:
      1: { gloss: 'then, thereupon' }
  मत्वा:
    fix:
      1: { gloss: 'having thought, taking (him) to be' }
  स:
    fix:
      1: { lemma: तद्, a: प्रथमा एकवचन पुंलिङ्ग }
  तं:
    fix:
      1: { lemma: तद्, a: द्वितीया एकवचन पुंलिङ्ग }
  वेतालाधिष्ठितं:
    fix:
      1: { form: वेताल, lemma: वेताल, member: true }
      2: { gloss: 'possessed, inhabited (अधि + स्था)' }
  किं:
    fix:
      1: { gloss: 'why?' }
  हसस्येहि:
    split:
      - { form: हससि, lemma: हस्, a: लट् मध्यमपुरुष एकवचन परस्मैपद }
      - { form: इहि, lemma: इ, a: लोट् मध्यमपुरुष एकवचन परस्मैपद, gloss: 'come!' }
  यावदकम्पितः:
    fix:
      1: { gloss: 'while — with तावत् (8.55), "no sooner … than"' }
      2: { gloss: 'unshaken, undaunted' }

'8.55':
  तावन्न:
    fix:
      1: { gloss: 'just then — answering यावत् (8.54): "no sooner … than"' }
  तु:
    fix:
      1: { gloss: 'but, however' }
  सवेतालं:
    split:
      - { form: सवेतालम्, lemma: सवेताल, a: द्वितीया एकवचन पुंलिङ्ग, gloss: 'with the Vetāla (in it)' }
    note: स-वेताल, a बहुव्रीहि with स "together with" — not सः.

