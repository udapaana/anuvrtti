      - { form: न्यासम्, lemma: न्यास, a: द्वितीया एकवचन पुंलिङ्ग, gloss: 'laying out, drawing' }
      - { form: उपसृत्य, lemma: सृ, a: अव्यय क्त्वा, gloss: 'having approached' }
  सः:
    fix:
      1: { lemma: तद्, a: प्रथमा एकवचन पुंलिङ्ग }

