# Kathāsaritsāgara 12.8.41–49: the king goes out to the cremation ground and
# the mendicant sends him for the corpse. Format as in
# content/texts/pancatantra-kilotpatin/overrides.yaml.

'8.41':
  प्रदोषे:
    fix:
      1: { lemma: प्रदोष, a: सप्तमी एकवचन पुंलिङ्ग, gloss: 'at nightfall, in the evening' }
  नीलवसनस्तमालकृतशेखरः:
    split:
      - { form: नील, lemma: नील, member: true, gloss: 'dark blue' }
      - { form: वसनः, lemma: वसन, a: प्रथमा एकवचन पुंलिङ्ग, gloss: 'clothing (नीलवसन "dark-clad")' }
      - { form: तमाल, lemma: तमाल, member: true, gloss: 'the tamāla tree (dark-leaved)' }
      - { form: कृत, lemma: कृत, member: true, gloss: 'made' }
      - { form: शेखरः, lemma: शेखर, a: प्रथमा एकवचन पुंलिङ्ग, gloss: 'a crest, chaplet worn on the head' }
    note: >-
      Two बहुव्रीहि compounds describing the king, both masculine to agree with
      him: नीलवसनः "whose clothes are dark", तमालकृतशेखरः "by whom a chaplet of
      tamāla was made" — dark dress and dark leaves, to go unseen.
  राजधानीतः:
    split:
      - { form: राजधानीतः, lemma: राजधानी, a: अव्यय, gloss: 'from the royal city' }
    note: -तः (तसिल्) makes an ablative adverb from a noun — राजधानीतः "from the capital".
  खड्गपाणिरलक्षितः:
    split:
      - { form: खड्ग, lemma: खड्ग, member: true, gloss: 'a sword' }
      - { form: पाणिः, lemma: पाणि, a: प्रथमा एकवचन पुंलिङ्ग, gloss: 'hand (खड्गपाणि "sword in hand")' }
      - { form: अलक्षितः, lemma: अलक्षित, a: प्रथमा एकवचन पुंलिङ्ग, gloss: 'unseen, unobserved' }

'8.42':
  घोरनिबिडध्वान्तव्रातमलीमसम्:
    split:
      - { form: घोर, lemma: घोर, member: true, gloss: 'terrible' }
      - { form: निबिड, lemma: निबिड, member: true, gloss: 'dense, thick' }
      - { form: ध्वान्त, lemma: ध्वान्त, member: true, gloss: 'darkness' }
      - { form: व्रात, lemma: व्रात, member: true, gloss: 'a mass, multitude' }
      - { form: मलीमसम्, lemma: मलीमस, a: द्वितीया एकवचन नपुंसकलिङ्ग, gloss: 'dark, foul' }
    note: >-
      This and the next five compounds (through 8.44) all describe श्मशानम्
      in 8.45, the object of ययौ — the verb comes first, its object a verse
      and a half later.
  चितानलोग्रनयनज्वालादारुणदर्शनम्:
    split:
      - { form: चिता, lemma: चिता, member: true, gloss: 'a funeral pyre' }
      - { form: अनल, lemma: अनल, member: true, gloss: 'fire' }
      - { form: उग्र, lemma: उग्र, member: true, gloss: 'fierce' }
      - { form: नयन, lemma: नयन, member: true, gloss: 'eye' }
      - { form: ज्वाला, lemma: ज्वाला, member: true, gloss: 'flame' }
      - { form: दारुण, lemma: दारुण, member: true, gloss: 'dreadful' }
      - { form: दर्शनम्, lemma: दर्शन, a: द्वितीया एकवचन नपुंसकलिङ्ग, gloss: 'aspect, look' }
    note: >-
      "Dreadful to look on with the flames of its fierce eyes, the pyre-fires":
      the burning pyres are the ground's glaring eyes.

