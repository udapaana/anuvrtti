'8.45':
  स्फूर्जन्महाशिवारावं:
    split:
      - { form: स्फूर्जत्, lemma: स्फूर्जत्, member: true, gloss: 'resounding (present participle of स्फूर्ज्)' }
      - { form: महा, lemma: महत्, member: true, gloss: 'great' }
      - { form: शिवा, lemma: शिवा, member: true, gloss: 'a jackal' }
      - { form: आरावम्, lemma: आराव, a: द्वितीया एकवचन नपुंसकलिङ्ग, gloss: 'a cry, howl' }
    note: >-
      A बहुव्रीहि, neuter to agree with श्मशानम्: "where the howls of great
      jackals resound". स्फूर्जत् ends in त्, which becomes न् before the
      nasal म (8.4.45).
  तदविह्वलः:
    fix:
      2: { gloss: 'undismayed, steady' }
  विचित्य:
    fix:
      1: { gloss: 'having searched through' }
  तं:
