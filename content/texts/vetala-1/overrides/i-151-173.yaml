# Kathāsaritsāgara 12.8.151–173 — see ../overrides.yaml for the format.

'8.151':
  मन्त्रिसुतो:
    split:
      - { form: मन्त्रि, lemma: मन्त्रिन्, member: true, gloss: 'a minister' }
      - { form: सुतम्, lemma: सुत, a: द्वितीया एकवचन पुंलिङ्ग, gloss: 'a son' }
    note: >-
      The edition prints मन्त्रिसुतो, but the syntax needs the object: इत्युक्तवन्तं
      तं मन्त्रिसुतं "the minister's son who had said this", with राजसुतः सः the
      one who praises. Read as a misprint for मन्त्रिसुतं.
  राजसुतोऽत्र:
    split:
      - { form: राज, lemma: राजन्, member: true, gloss: 'a king' }
      - { form: सुतः, lemma: सुत, a: प्रथमा एकवचन पुंलिङ्ग, gloss: 'a son' }
      - { form: अत्र, lemma: अत्र, a: अव्यय, gloss: 'here, at this' }
  सत्यं:
    fix:
      1: { lemma: सत्य, a: अव्यय, gloss: 'truly, indeed' }
  बुद्धिशरीरस्त्वमिति:
    split:
      - { form: बुद्धि, lemma: बुद्धि, member: true, gloss: 'intellect, wisdom' }
      - { form: शरीरः, lemma: शरीर, a: प्रथमा एकवचन पुंलिङ्ग, gloss: 'body; बुद्धिशरीर "whose body is wisdom", wisdom incarnate' }
      - { form: त्वम्, lemma: युष्मद्, a: प्रथमा एकवचन }
      - { form: इति, lemma: इति, a: अव्यय }
  यावत्प्रशंसति:
    fix:
      1: { gloss: 'while (answered by तावत् in the next verse: "while … just then")' }
      2: { gloss: 'praises' }

