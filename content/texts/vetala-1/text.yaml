sections:
  - id: '8.21'
    kind: verse
    lines:
      - प्रतिष्ठानाभिधानोऽस्ति देशो गोदावरीतटे
    iast: "pratiṣṭhānābhidhāno 'sti deśo godāvarītaṭe"
  - id: '8.22'
    kind: verse
    lines:
      - तत्र विक्रमसेनस्य पुत्रः शक्रपराक्रमः
      - प्राक्त्रिविक्रमसेनाख्यः ख्यातकीर्तिरभून्नृपः
    iast: "tatra vikramasenasya putraḥ śakraparākramaḥ | prāk trivikramasenākhyaḥ khyātakīrtir abhūn nṛpaḥ"
  - id: '8.23'
    kind: verse
    lines:
      - तस्य प्रत्यहमास्थानगतस्योपेत्य भूपतेः
      - सेवार्थं क्षान्तिशीलाख्यो भिक्षुः फलमुपानयत्
    iast: "tasya pratyaham āsthānagatasyopetya bhūpateḥ | sevārthaṃ kṣāntiśīlākhyo bhikṣuḥ phalam upānayat"
  - id: '8.24'
    kind: verse
    lines:
      - सोऽपि राजा तदादाय फलमासन्नवर्तिनः
      - हस्ते ददौ प्रतिदिनं कोषागाराधिकारिणः
    iast: "so 'pi rājā tad ādāya phalam āsannavartinaḥ | haste dadau pratidinaṃ koṣāgārādhikāriṇaḥ"
  - id: '8.25'
    kind: verse
    lines:
      - इत्थं गतेषु वर्षेषु दशस्वत्र किलैकदा
      - दत्त्वा राज्ञे फलं तस्मै भिक्षावास्थानतो गते
    iast: "itthaṃ gateṣu varṣeṣu daśasv atra kilaikadā | dattvā rājñe phalaṃ tasmai bhikṣāv āsthānato gate"
  - id: '8.26'
    kind: verse
    lines:
      - स राजा तत्फलं प्रादात्प्रविष्टायात्र दैवतः
      - क्रीडामर्कटपोताय हस्तभ्रष्टाय रक्षिणाम्
    iast: "sa rājā tat phalaṃ prādāt praviṣṭāyātra daivataḥ | krīḍāmarkaṭapotāya hastabhraṣṭāya rakṣiṇām"
  - id: '8.27'
    kind: verse
    lines:
      - स मर्कटस्तदश्नाति यावत्तावत्फलात्ततः
      - विभिन्नमध्यान्निरगादनर्घं रत्नमुत्तमम्
    iast: "sa markaṭas tad aśnāti yāvat tāvat phalāt tataḥ | vibhinnamadhyān niragād anarghaṃ ratnam uttamam"
  - id: '8.28'
    kind: verse
    lines:
      - तद्दृष्ट्वादाय पप्रच्छ तं भाण्डागारिकं नृपः
      - भिक्षूपनीतानि मया यानि नित्यं फलानि ते
    iast: "tad dṛṣṭvādāya papraccha taṃ bhāṇḍāgārikaṃ nṛpaḥ | bhikṣūpanītāni mayā yāni nityaṃ phalāni te"
  - id: '8.29'
    kind: verse
    lines:
      - हस्ते दत्तानि तानि क्व स्थापितानि सदा त्वया
      - तच्छ्रुत्वा तं स सभयः कोषाध्यक्षो व्यजिज्ञपत्
    iast: "haste dattāni tāni kva sthāpitāni sadā tvayā | tac chrutvā taṃ sa sabhayaḥ koṣādhyakṣo vyajijñapat"
  - id: '8.30'
    kind: verse
    lines:
      - क्षिप्तानि तान्यनुद्घाट्य मया गञ्जे गवाक्षतः
      - यद्यादिशसि तद्देव तमुद्घाट्य गवेषये
    iast: "kṣiptāni tāny anudghāṭya mayā gañje gavākṣataḥ | yady ādiśasi tad deva tam udghāṭya gaveṣaye"
  - id: '8.31'
    kind: verse
    lines:
      - इति ऊचिवाननुमतो रज्ञा गत्वा क्षणेन सः
      - कोषाध्यक्षः समागत्य प्रभुं व्यज्ञापयत्पुनः
    iast: "iti ūcivān anumato rajñā gatvā kṣaṇena saḥ | koṣādhyakṣaḥ samāgatya prabhuṃ vyajñāpayat punaḥ"
  - id: '8.32'
    kind: verse
    lines:
      - शीर्णानि नात्र पश्यामि कोषे तानि फलान्यहम्
      - रत्नराशिं तु पश्यामि रश्मिज्वालाकुलं विभो
    iast: "śīrṇāni nātra paśyāmi koṣe tāni phalāny aham | ratnarāśiṃ tu paśyāmi raśmijvālākulaṃ vibho"
  - id: '8.33'
    kind: verse
    lines:
      - तच्छ्रुत्वा तान्मनीन्दत्त्वा तुष्टोऽस्मै कोषरक्षिणे
      - राजान्येद्युरपृच्छत्स भिक्षुं तं प्राग्वदागतम्
    iast: "tac chrutvā tān manīn dattvā tuṣṭo 'smai koṣarakṣiṇe | rājānyedyur apṛcchat sa bhikṣuṃ taṃ prāgvad āgatam"
  - id: '8.34'
    kind: verse
    lines:
      - भिक्षो धनव्ययेनैवं सेवसे मां किमन्वहम्
      - नेदानीं ते ग्रहीष्यामि फलं यावन्न वक्ष्यसि
    iast: "bhikṣo dhanavyayenaivaṃ sevase māṃ kim anvaham | nedānīṃ te grahīṣyāmi phalaṃ yāvan na vakṣyasi"
  - id: '8.35'
    kind: verse
    lines:
      - इत्युक्तवन्तं राजानं भिक्षुस्तं विजनेऽब्रवीत्
      - वीरसाचिव्यसापेक्षं मन्त्रसाधनमस्ति मे
    iast: "ity uktavantaṃ rājānaṃ bhikṣus taṃ vijane 'bravīt | vīrasācivyasāpekṣaṃ mantrasādhanam asti me"
  - id: '8.36'
    kind: verse
    lines:
      - तत्र वीरेन्द्र साहाय्यं क्रियमानं त्वयार्थये
      - तच्छ्रुत्वा प्रतिपेदे तत्तथेत्यस्य स भूपतिः
    iast: "tatra vīrendra sāhāyyaṃ kriyamānaṃ tvayārthaye | tac chrutvā pratipede tat tathety asya sa bhūpatiḥ"
  - id: '8.37'
    kind: verse
    lines:
      - ततः स श्रमणस्तुष्टो नृपं पुन उवाच तम्
      - तर्हि कृष्णचतुर्दश्यामागामिन्यां निशागमे
    iast: "tataḥ sa śramaṇas tuṣṭo nṛpaṃ puna uvāca tam | tarhi kṛṣṇacaturdaśyām āgāminyāṃ niśāgame"
  - id: '8.38'
    kind: verse
    lines:
      - इतो महाश्मशानान्तःवटस्याधः स्थितस्य मे
      - आगन्तव्यं त्वया देव प्रतिपालयतोऽन्तिकम्
    iast: "ito mahāśmaśānāntaḥvaṭasyādhaḥ sthitasya me | āgantavyaṃ tvayā deva pratipālayato 'ntikam"
  - id: '8.39'
    kind: verse
    lines:
      - बाढमेवं करिष्यामीत्युक्ते तेन महीभुजा
      - स क्षान्तिशीलः श्रमणो हृष्टः स्वनिलयं ययौ
    iast: "bāḍham evaṃ kariṣyāmīty ukte tena mahībhujā | sa kṣāntiśīlaḥ śramaṇo hṛṣṭaḥ svanilayaṃ yayau"
  - id: '8.40'
    kind: verse
    lines:
      - अथ तां स महासत्त्वः प्राप्य कृष्णचतुर्दशीम्
      - प्रार्थनां प्रतिपन्नां तां भिक्षोस्तस्य नृपः स्मरन्
    iast: "atha tāṃ sa mahāsattvaḥ prāpya kṛṣṇacaturdaśīm | prārthanāṃ pratipannāṃ tāṃ bhikṣos tasya nṛpaḥ smaran"
  - id: '8.41'
    kind: verse
    lines:
      - प्रदोषे नीलवसनस्तमालकृतशेखरः
      - निर्ययौ राजधानीतः खड्गपाणिरलक्षितः
    iast: "pradoṣe nīlavasanas tamālakṛtaśekharaḥ | niryayau rājadhānītaḥ khaḍgapāṇir alakṣitaḥ"
  - id: '8.42'
    kind: verse
    lines:
      - ययौ च घोरनिबिडध्वान्तव्रातमलीमसम्
      - चितानलोग्रनयनज्वालादारुणदर्शनम्
    iast: "yayau ca ghoranibiḍadhvāntavrātamalīmasam | citānalogranayanajvālādāruṇadarśanam"
  - id: '8.43'
    kind: verse
    lines:
      - असंख्यनरकङ्कालकपालास्थिविशङ्कटम्
      - हृष्यत्संनिहितोत्तालभूतवेतालवेष्टितम्
    iast: "asaṃkhyanarakaṅkālakapālāsthiviśaṅkaṭam | hṛṣyatsaṃnihitottālabhūtavetālaveṣṭitam"
  - id: '8.44'
    kind: verse
    lines:
      - भैरवस्यापरं रूपमिव गम्भीरभीषणम्
    iast: "bhairavasyāparaṃ rūpam iva gambhīrabhīṣaṇam"
  - id: '8.45'
    kind: verse
    lines:
      - स्फूर्जन्महाशिवारावं श्मशानं तदविह्वलः
      - विचित्य चात्र तं प्राप्य भिक्षुं वटतरोरधः
      - कुर्वाणं मण्डलन्यासमुपसृत्य जगाद सः
    iast: "sphūrjan mahāśivārāvaṃ śmaśānaṃ tad avihvalaḥ | vicitya cātra taṃ prāpya bhikṣuṃ vaṭataror adhaḥ | kurvāṇaṃ maṇḍalanyāsam upasṛtya jagāda saḥ"
  - id: '8.46'
    kind: verse
    lines:
      - एषोऽहमागतो भिक्षो ब्रूहि किं करवाणि ते
      - तच्छ्रुत्वा स नृपं दृष्ट्वा हृष्टो भिक्षुरुवाच तम्
    iast: "eṣo 'ham āgato bhikṣo brūhi kiṃ karavāṇi te | tac chrutvā sa nṛpaṃ dṛṣṭvā hṛṣṭo bhikṣur uvāca tam"
  - id: '8.47'
    kind: verse
    lines:
      - राजन्कृतः प्रसादश्चेत्तदितो दक्षिणामुखम्
      - गत्वा विदूरमेकाकी विद्यते शिंशपातरुः
    iast: "rājan kṛtaḥ prasādaś cet tad ito dakṣiṇāmukham | gatvā vidūram ekākī vidyate śiṃśapātaruḥ"
  - id: '8.48'
    kind: verse
    lines:
      - तस्मिन्नुल्लम्बितमृतः कोऽप्येकः पुरुषः स्थितः
      - तमिहानय गत्वा त्वं सानाथ्यं कुरु वीर मे
    iast: "tasminn ullambitamṛtaḥ ko 'py ekaḥ puruṣaḥ sthitaḥ | tam ihānaya gatvā tvaṃ sānāthyaṃ kuru vīra me"
  - id: '8.49'
    kind: verse
    lines:
      - तच्छृउत्वैव तथेत्युक्त्वा स राजा सत्यसंगरः
      - दक्षिणां दिशमालम्ब्य प्रवीरः प्रययौ ततः
    iast: "tac chṛutvaiva tathety uktvā sa rājā satyasaṃgaraḥ | dakṣiṇāṃ diśam ālambya pravīraḥ prayayau tataḥ"
  - id: '8.50'
    kind: verse
    lines:
      - आत्तदीप्तचितालातलक्षितेन पथात्र सः
      - गत्वा तमसि तं प्राप कथंचिच्छिंशपातरुम्
    iast: "āttadīptacitālātalakṣitena pathātra saḥ | gatvā tamasi taṃ prāpa kathaṃcic chiṃśapātarum"
  - id: '8.51'
    kind: verse
    lines:
      - तस्य स्कन्धे चिताधूमदग्धस्य क्रव्यगन्धिनः
      - सोऽपश्यल्लम्बमानं तं भूतस्येव शवं तरोः
    iast: "tasya skandhe citādhūmadagdhasya kravyagandhinaḥ | so 'paśyal lambamānaṃ taṃ bhūtasyeva śavaṃ taroḥ"
  - id: '8.52'
    kind: verse
    lines:
      - आरुह्य चात्र भूमौ तं छिन्न रज्जुमपातयत्
      - पतितश्चात्र सोऽकस्माच्चक्रन्द व्यथितो यथा
    iast: "āruhya cātra bhūmau taṃ chinna rajjum apātayat | patitaś cātra so 'kasmāc cakranda vyathito yathā"
  - id: '8.53'
    kind: verse
    lines:
      - ततोऽवरुह्य कृपया जीवाशङ्की स तस्य यत्
      - राजाङ्गं प्रामृशत्तेन सोऽट्टहासं व्यधाच्छवः
    iast: "tato 'varuhya kṛpayā jīvāśaṅkī sa tasya yat | rājāṅgaṃ prāmṛśat tena so 'ṭṭahāsaṃ vyadhāc chavaḥ"
  - id: '8.54'
    kind: verse
    lines:
      - ततः स राजा मत्वा तं वेतालाधिष्ठितं तदा
      - किं हसस्येहि गच्छाव इति यावदकम्पितः
    iast: "tataḥ sa rājā matvā taṃ vetālādhiṣṭhitaṃ tadā | kiṃ hasasy ehi gacchāva iti yāvad akampitaḥ"
  - id: '8.55'
    kind: verse
    lines:
      - वक्ति तावन्न भूमौ सवेतालं शवमैक्षत
      - ऐक्षतात्रैव वृक्षे तु लम्बमानं स्थितं पुनः
    iast: "vakti tāvan na bhūmau savetālaṃ śavam aikṣata | aikṣatātraiva vṛkṣe tu lambamānaṃ sthitaṃ punaḥ"
  - id: '8.56'
    kind: verse
    lines:
      - ततोऽधिरुह्य भूयोऽपि तमवातारयत्ततः
      - वज्रादपि हि वीराणां चित्तरत्नमखण्डितम्
    iast: "tato 'dhiruhya bhūyo 'pi tam avātārayat tataḥ | vajrād api hi vīrāṇāṃ cittaratnam akhaṇḍitam"
  - id: '8.57'
    kind: verse
    lines:
      - आरोप्य च सवेतालं स्कन्धे मौनेन तं शवम्
      - स त्रिविक्रमसेनोऽथ राजा गन्तुं प्रचक्रमे
    iast: "āropya ca savetālaṃ skandhe maunena taṃ śavam | sa trivikramaseno 'tha rājā gantuṃ pracakrame"
  - id: '8.58'
    kind: verse
    lines:
      - यान्तं च तं शवान्तःस्थो वेतालोऽंसस्थितोऽब्रवीत्
      - राजन्नध्वविनोदाय कथामाख्यामि ते शृणु
    iast: "yāntaṃ ca taṃ śavāntaḥstho vetālo 'ṃsasthito 'bravīt | rājann adhvavinodāya kathām ākhyāmi te śṛṇu"
