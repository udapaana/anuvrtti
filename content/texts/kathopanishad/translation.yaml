# R. E. Hume, The Thirteen Principal Upanishads (Oxford University Press, 1921), the Kaṭha Upaniṣad, pp. 341–361.
# Public domain. Source scan: archive.org thirteenprincipa00hume (Princeton Theological Seminary Library copy);
# OCR (data/sources/ocr/hume-thirteen-upanishads.txt) cleaned against the page images throughout.
# Keyed by our section id; Hume numbers the Kaṭha by vallī and verse (1.1 … 6.18), exactly as we do, so no `hume` field is needed.
# `text`: the verse, one printed verse line per line (turnover lines rejoined, line-end hyphens closed up); Hume's wording,
#   punctuation, capitals, brackets and parenthetical Sanskrit kept, diacritics as printed (ṁ for his dotted m). Italics and
#   footnote markers are not represented; the space Hume's printer set before ! ? ; : is dropped.
# `heading`: Hume's bold section heading set above this verse. `speaker`: his bracketed speaker label above it.
# `note`: a substantive footnote of Hume's (interpretation, alternative rendering, textual problem), verbatim; several are
#   separated by a blank line; verse quoted inside a footnote is run in with " / ". Parallel-passage and gloss footnotes are omitted.
source:
  translator: R. E. Hume
  title: The Thirteen Principal Upanishads
  publisher: Oxford University Press
  year: 1921
  pages: 341–361
  archive: thirteenprincipa00hume
'1.1':
  heading: "Prologue: Naciketas devoted to Death"
  text: "Now verily, with zeal did Vājaśravasa give his whole possession [as a religious gift]. He had a son, Naciketas by name."
  modern: "Now Vājaśravasa, in his zeal, gave away everything he owned. He had a son named Naciketas."
'1.2':
  text: "Into him, boy as he was, while the sacrificial gifts were being led up, faith (śraddhā) entered. He thought to himself:"
  modern: "As the sacrificial gifts were being led up, faith (śraddhā) entered him, boy though he was. He thought:"
'1.3':
  text: "‘Their water drunk, their grass eaten,\nTheir milk milked, barren!—\nJoyless (a-nanda) certainly are those worlds\nHe goes to, who gives such [cows]!’"
  modern: "‘They have drunk their water, eaten their grass,\ngiven their milk, and are barren!\nJoyless (a-nanda), surely, are the worlds\nthat a man goes to who gives such cows!’"
'1.4':
  text: "Then he said to his father: ‘Papa, to whom will you give me?’—a second time—a third time.\nTo him then he said: ‘To Death I give you!’"
  modern: "Then he said to his father, ‘Father, to whom will you give me?’ A second time, and a third.\nThen his father said to him, ‘I give you to Death!’"
  note: "That is, Naciketas voluntarily offers himself in order to fulfil the vow which his father was paying so grudgingly. Thereupon the father, in anger at the veiled reproof, exclaims: ‘Oh! go to Hades!’"
'1.5':
  heading: "Naciketas in the house of Death"
  speaker: "[Naciketas reflects:]"
  text: "Of many I go as the first.\nOf many I go as an intermediate.\nWhat, pray, has Yama (Death) to be done\nThat he will do with me today?"
  modern: "I go as the first of many;\nI go as the middle of many.\nWhat, I wonder, does Yama (Death) have to do\nthat he will do with me today?"
'1.6':
  text: "Look forward, how [fared] the former ones.\nLook backward; so [will] the after ones.\nLike grain a mortal ripens!\nLike grain he is born hither (ā-jāyate) again!"
  modern: "Look ahead: see how those who went before fared.\nLook back: so will those who come after.\nA mortal ripens like grain,\nand like grain he is born here (ā-jāyate) again."
'1.7':
  heading: "Warning on the neglect of a Brahman guest"
  speaker: "[Voice:]"
  text: "As fire, enters\nA Brahman (brāhmaṇa) guest into houses.\nThey make this the quieting thereof:—\nFetch water, Vaivasvata!"
  modern: "A Brahman (brāhmaṇa) guest enters a house like fire.\nThis is how people quiet him:\nfetch water, Vaivasvata!"
'1.8':
  text: "Hope and expectation, intercourse and pleasantness,\nSacrifices and meritorious deeds, sons and cattle, all—\nThis he snatches away from the man of little understanding\nIn whose home a Brahman remains without eating."
  modern: "Hope and expectation, fellowship and kind words,\nsacrifices and good works, sons and cattle, all of it—\nhe snatches it away from the man of little understanding\nin whose house a Brahman stays without eating."
'1.9':
  heading: "Three boons offered to Naciketas"
  speaker: "[Death (Yama), returning from a three days’ absence and finding that Naciketas has not received the hospitality which is due to a Brahman, says:]"
  speakerModern: "[Death (Yama) returns after three days away, finds that Naciketas has not received the hospitality due to a Brahman, and says:]"
  text: "Since for three nights thou hast abode in my house\nWithout eating, O Brahman (brahman), a guest to be reverenced,\nReverence be to thee, O Brahman! Well-being (svasti) be to me!\nTherefore in return choose three boons!"
  modern: "Since you, Brahman (brahman), a guest to be revered,\nhave stayed three nights in my house without eating—\nreverence to you, Brahman! May it be well with me (svasti)!—\nchoose three boons in return."
'1.10':
  heading: "Naciketas’s first wish: return to an appeased father on earth"
  speaker: "[Naciketas:]"
  text: "With intent appeased, well-minded, with passion departed,\nThat Gautama toward me may be, O Death;\nThat cheerfully he may greet me, when from thee dismissed—\nThis of the three as boon the first I choose!"
  modern: "Death, let Gautama be calm toward me, kind, his anger gone;\nwhen you send me back, let him greet me gladly.\nOf the three boons, this is the first I choose."
'1.11':
  speaker: "[Death:]"
  text: "Cheerful as formerly will he be—\nAuddālaki Āruṇi, from me dismissed.\nHappily will he sleep o’ nights, with passion departed,\nWhen he has seen thee from the mouth of Death released."
  modern: "Auddālaki Āruṇi will be glad as he was before,\ndismissed by me.\nHe will sleep well at night, his anger gone,\nwhen he has seen you released from the mouth of Death."
  note: "As it stands, prasṛṣṭaḥ is nominative and must agree with the subject, ‘Auddālaki Āruṇi.’ But in such a connection it is hardly applicable; and in the previous stanza it was used with reference to Naciketas. To relieve the difficulty Böhtlingk (in his translation of the Kaṭha, Aitareya, and Praśna Upanishads, Berichte über die Verhandlungen der Königlich Sächsischen Gesellschaft der Wissenschaften zu Leipzig, philologisch-historische Classe, 1890, pp. 127–197), p. 132, emends to prasṛṣṭe, i. e. ‘toward one from me dismissed’; and Whitney (in his ‘Translation of the Kaṭha Upanishad’ in the Transactions of the American Philological Association, 21. 88–112), p. 94, emends to prasṛṣṭaṁ, and translates: ‘be cheerful [toward thee], sent forth by me.’ Śaṅkara solves the difficulty by giving the word a sense, ‘authorized,’ which is quite different from what it evidently has in the previous stanza."
'1.12':
  heading: "Naciketas’s second wish: an understanding of the Naciketas sacrificial fire that leads to heaven"
  speaker: "[Naciketas:]"
  text: "In the heavenly world is no fear whatsoever.\nNot there art thou. Not from old age does one fear.\nOver both having crossed—hunger, and thirst too—\nGone beyond sorrow, one rejoices in the heaven-world."
  modern: "In the heaven-world there is no fear at all.\nYou are not there, and no one fears old age.\nHaving crossed beyond both hunger and thirst,\none rejoices in the heaven-world, past sorrow."
'1.13':
  text: "Thyself, O Death, understandest the heavenly fire.\nDeclare it to me who have faith (śraddadhāna).\nHeaven-world people partake of immortality.\nThis I choose with boon the second."
  modern: "You yourself, Death, understand the heavenly fire.\nExplain it to me, for I have faith (śraddadhāna).\nThose in the heaven-world share in immortality.\nThis I choose as my second boon."
'1.14':
  speaker: "[Death:]"
  text: "To thee I do declare, and do thou learn it of me—\nUnderstanding about the heavenly fire, O Naciketas!\nThe attainment of the infinite world, likewise too its establishment—\nKnow thou that as set down in the secret place [of the heart]."
  modern: "I will explain it to you; learn it from me,\nunderstanding the heavenly fire, Naciketas:\nthe attaining of the endless world, and its foundation too.\nKnow that it is set in the secret place [of the heart]."
'1.15':
  speaker: "[Narrative:]"
  text: "He told him of that fire as the beginning of the world,\nWhat bricks, and how many, and how [built].\nAnd he too repeated that, as it was told.\nThen, pleased with him, Death said again—"
  modern: "He told him of that fire, the beginning of the world:\nwhat bricks, how many, and how.\nAnd he repeated it back just as it was told.\nThen Death, pleased with him, spoke again."
'1.16':
  text: "Delighting, the great soul (mahātman) said to him:—\n[Death resumes:]\nA further boon I give thee here today.\nBy thy name indeed shall this fire be [known].\nThis multifold garland (sṛṅkā), too, accept."
  modern: "Delighted, the great soul (mahātman) said to him:\n‘Here and now I give you a further boon:\nthis fire will be known by your own name.\nAccept this many-formed garland (sṛṅkā) too.’"
'1.17':
  text: "Having kindled a triple Naciketas-fire, having attained union with the three,\nPerforming the triple work, one crosses over birth and death.\nBy knowing the knower of what is born from Brahma, the god to be praised,\n[And] by revering [him], one goes for ever to this [peace (śānti)."
  modern: "One who has kindled a triple Naciketas-fire, has joined with the three,\nand does the threefold work crosses over birth and death.\nKnowing the knower of what is born from Brahma, the god to be praised,\nand revering him, one goes for ever to this peace (śānti)."
'1.18':
  text: "Having kindled a triple Naciketas-fire, having known this triad,\nHe who knowing thus, builds up the Naciketas-fire—\nHe, having cast off in advance the bonds of death,\nWith sorrow overpassed, rejoices in the heaven-world."
  modern: "One who has kindled a triple Naciketas-fire and knows this triad,\nand who, knowing this, builds the Naciketas-fire,\nthrows off the bonds of death ahead of time,\nand, past sorrow, rejoices in the heaven-world."
  note: "Stanzas 16–18 are not quite apt here. They may be an irrelevant interpolation—as previous translators have suggested."
'1.19':
  text: "This, O Naciketas, is thy heavenly fire,\nWhich thou didst choose with the second boon.\nAs thine, indeed, will folks proclaim this fire,\nThe third boon, Naciketas, choose!"
  modern: "This, Naciketas, is your heavenly fire,\nwhich you chose with the second boon.\nPeople will call this fire yours indeed.\nChoose the third boon, Naciketas!"
'1.20':
  heading: "Naciketas’s third wish: knowledge concerning the effect of dying"
  speaker: "[Naciketas:]"
  text: "This doubt that there is in regard to a man deceased:\n‘He exists,’ say some; ‘He exists not,’ say others—\nThis would I know, instructed by thee!\nOf the boons this is boon the third."
  modern: "There is this doubt about a man who has died:\nsome say ‘He exists’, others ‘He does not exist’.\nLet me know this, taught by you.\nOf the boons, this is the third."
'1.21':
  speaker: "[Death:]"
  text: "Even the gods had doubt as to this of yore!\nFor truly, it is not easily to be understood. Subtile is this matter (dharma).\nAnother boon, O Naciketas, choose!\nPress me not! Give up this one for me!"
  modern: "Even the gods had doubts about this long ago,\nfor it is not easy to understand; this matter (dharma) is subtle.\nChoose another boon, Naciketas.\nDo not press me! Give this one up for me."
'1.22':
  heading: "This knowledge preferable to the greatest earthly pleasures"
  speaker: "[Naciketas:]"
  text: "Even the gods had doubt, indeed, as to this,\nAnd thou, O Death, sayest that it is not easily to be understood.\nAnd another declarer of it the like of thee is not to be obtained.\nNo other boon the equal of it is there at all."
  modern: "Even the gods had doubts about this, indeed,\nand you, Death, say it is not easy to understand.\nNo one else who can explain it as you can is to be found,\nand no other boon is equal to it."
'1.23':
  speaker: "[Death:]"
  text: "Choose centenarian sons and grandsons,\nMany cattle, elephants, gold, and horses.\nChoose a great abode of earth.\nAnd thyself live as many autumns as thou desirest."
  modern: "Choose sons and grandsons who will live a hundred years,\nmany cattle, elephants, gold and horses.\nChoose a great domain on earth,\nand live yourself as many autumns as you wish."
'1.24':
  text: "This, if thou thinkest an equal boon,\nChoose—wealth and long life!\nA great one on earth, O Naciketas, be thou.\nThe enjoyer of thy desires I make thee."
  modern: "If you think it an equal boon,\nchoose wealth and long life.\nBe a great one on earth, Naciketas.\nI make you one who enjoys your desires."
  departs: "The Sanskrit mahābhūmau is ‘on the great earth’; Hume makes ‘great’ describe Naciketas."
'1.25':
  text: "Whate’er desires are hard to get in mortal world—\nFor all desires at pleasure make request.\nThese lovely maidens with chariots, with lyres—\nSuch [maidens], indeed, are not obtainable by men—\nBy these, from me bestowed, be waited on!\nO Naciketas, question me not regarding dying (maraṇa)!"
  modern: "Whatever desires are hard to win in the mortal world,\nask for them all, as you please.\nThese lovely maidens, with chariots and lyres—\nmen truly cannot win such as these—\nlet them, my gift to you, wait on you.\nNaciketas, do not ask me about dying (maraṇa)!"
'1.26':
  speaker: "[Naciketas:]"
  text: "Ephemeral things! That which is a mortal’s, O End-maker,\nEven the vigor (tejas) of all the powers, they wear away.\nEven a whole life is slight indeed.\nThine be the vehicles (vāha)! Thine be the dance and song!"
  modern: "Things that last till tomorrow, End-maker! They wear away\nwhat a mortal has, the vigor (tejas) of all his powers.\nEven a whole life is short indeed.\nKeep your vehicles (vāha)! Keep your dance and song!"
'1.27':
  text: "Not with wealth is a man to be satisfied.\nShall we take wealth, if we have seen thee?\nShall we live so long as thou shalt rule?\n—This, in truth, is the boon to be chosen by me."
  modern: "No man is to be satisfied with wealth.\nShall we get wealth, once we have seen you?\nShall we live as long as you rule?\nThat alone is the boon I choose."
'1.28':
  text: "When one has come into the presence of undecaying immortals,\nWhat decaying mortal here below that understands,\nThat meditates upon the pleasures of beauty and delight,\nWould delight in a life over-long?"
  modern: "Once he has come near the unaging immortals,\nwhat aging mortal here below, who understands,\nwho reflects on the pleasures of beauty and love,\nwould take delight in an overlong life?"
'1.29':
  text: "This thing whereon they doubt, O Death:\nWhat there is in the great passing-on—tell us that!\nThis boon, that has entered into the hidden—\nNo other than that does Naciketas choose."
  modern: "This thing they doubt about, Death,\nwhat there is in the great passing-on—tell us that!\nThis boon has entered into the hidden;\nNaciketas chooses no other."
'2.1':
  heading: "The failure of pleasure and of ignorance; the wisdom of the better knowledge"
  speaker: "[Death:]"
  text: "The better (śreyas) is one thing, and the pleasanter (preyas) quite another.\nBoth these, of different aim, bind a person.\nOf these two, well is it for him who takes the better;\nHe fails of his aim who chooses the pleasanter."
  modern: "The better (śreyas) is one thing, the pleasanter (preyas) quite another.\nBoth, with their different aims, bind a person.\nIt goes well for the one who takes the better of the two;\nthe one who chooses the pleasanter misses his aim."
'2.2':
  text: "Both the better and the pleasanter come to a man.\nGoing all around the two, the wise man discriminates.\nThe wise man chooses the better, indeed, rather than the pleasanter.\nThe stupid man, from getting-and-keeping (yoga-kṣema), chooses the pleasanter."
  modern: "Both the better and the pleasanter come to a man.\nThe wise man goes all around the two and tells them apart.\nThe wise man chooses the better over the pleasanter;\nthe fool, out of concern for getting and keeping (yoga-kṣema), chooses the pleasanter."
'2.3':
  text: "Thou indeed, upon the pleasant and pleasantly appearing desires\nMeditating, hast let them go, O Naciketas.\nThou art not one who has taken that garland of wealth\nIn which many men sink down."
  modern: "You, Naciketas, have reflected on desires\nthat are pleasant and look pleasant, and let them go.\nYou have not taken that garland of wealth\nin which many men sink."
'2.4':
  text: "Widely opposite and asunder are these two:\nIgnorance (avidyā) and what is known as ‘knowledge’ (vidyā).\nI think Naciketas desirous of obtaining knowledge!\nMany desires rend thee not."
  modern: "Far apart, opposite and divergent are these two:\nignorance (avidyā) and what is known as ‘knowledge’ (vidyā).\nI think Naciketas longs for knowledge;\nmany desires do not tear at you."
'2.5':
  text: "Those abiding in the midst of ignorance,\nSelf-wise, thinking themselves learned,\nRunning hither and thither, go around deluded,\nLike blind men led by one who is himself blind."
  modern: "Living in the midst of ignorance,\nwise in their own eyes, thinking themselves learned,\nthe deluded go round and round, rushing this way and that,\nlike the blind led by one who is himself blind."
'2.6':
  heading: "Heedlessness the cause of rebirth"
  text: "The passing-on is not clear to him who is childish,\nHeedless, deluded with the delusion of wealth.\nThinking ‘This is the world! There is no other!’—\nAgain and again he comes under my control."
  modern: "The passing-on does not become clear to the childish,\nthe heedless, deluded by the delusion of wealth.\nThinking ‘This is the world; there is no other’,\nhe falls under my control again and again."
'2.7':
  heading: "The need for a competent teacher of the soul"
  text: "He who by many is not obtainable even to hear of,\nHe whom many, even when hearing, know not—\nWonderful is the declarer, proficient the obtainer of Him!\nWonderful the knower, proficiently taught!"
  modern: "He whom many cannot even get to hear of,\nwhom many, even hearing, do not know—\nwonderful is the one who can teach Him, skilled the one who gains Him;\nwonderful the one who knows Him, skillfully taught."
'2.8':
  text: "Not, when proclaimed by an inferior man, is He\nTo be well understood, [though] being manifoldly considered.\nUnless declared by another, there is no going thither;\nFor He is inconceivably more subtile than what is of subtile measure."
  modern: "Taught by an inferior man, He is not\nwell understood, though thought about in many ways.\nUnless another teaches Him, there is no way to Him,\nfor He is inconceivably subtler than anything of the subtlest measure."
  note: "With different grouping of words the first two lines may also mean: (1) ‘Not by an inferior man is He, [even] when proclaimed, / To be well understood, [though] being often meditated upon.’ That is, the Ātman is to be obtained only by a superior person, as is stated in Muṇḍ. 3. 2. 4. Or, (2) ‘Not by an inferior man is He proclaimed. / [But] He is easily to be understood when repeatedly meditated upon.’\n\nOr perhaps, ‘. . . [because] being considered manifoldly,’ i. e. by the inferior man the Ātman is falsely ‘conceived of as a plurality,’ while in reality He is absolute unity.\n\nEither (1) by another than an inferior man, i. e. by a proficient understander, or (2) by another than oneself, i. e. by some teacher."
'2.9':
  text: "Not by reasoning (tarka) is this thought (mati) to be attained.\nProclaimed by another, indeed, it is for easy understanding, dearest friend (preṣṭha)!—\nThis which thou hast attained! Ah, thou art of true steadfastness!\nMay there be for us a questioner (praṣṭā) the like of thee, O Naciketas!"
  modern: "This thought (mati) is not reached by reasoning (tarka).\nTaught by another, indeed, it is easy to understand, dearest friend (preṣṭha)—\nthis that you have reached. Ah, you are truly steadfast!\nMay we have a questioner (praṣṭā) like you, Naciketas!"
'2.10':
  heading: "Steadfast renunciation and self-meditation required"
  speaker: "[Naciketas:]"
  text: "I know that what is known as treasure is something inconstant.\nFor truly, that which is steadfast is not obtained by those who are unsteadfast.\nTherefore the Naciketas-fire has been built up by me,\nAnd with means which are inconstant I have obtained that which is constant."
  modern: "I know that what is called treasure is inconstant,\nfor the stable is not gained by those who are unstable.\nSo I have built the Naciketas-fire,\nand with inconstant things I have gained what is constant."
  departs: "The Sanskrit adhruvaiḥ may mean unstable things as well as unstable people; Hume reads it as people."
'2.11':
  speaker: "[Death:]"
  text: "The obtainment of desire, the foundation of the world (jagat),\nThe endlessness of will, the safe shore of fearlessness,\nThe greatness of praise, the wide extent, the foundation (having seen),\nThou, O Naciketas, a wise one, hast with steadfastness let [these] go!"
  modern: "The gaining of desire, the foundation of the world (jagat),\nthe endlessness of will, the safe far shore of fearlessness,\nthe greatness of praise, the wide range, the foundation:\nyou have seen them, Naciketas, and, wise, firmly let them go."
  note: "The word dṛṣṭvā is superfluous both logically and metrically.\n\nOr perhaps ‘work.’"
'2.12':
  text: "Him who is hard to see, entered into the hidden,\nSet in the secret place [of the heart], dwelling in the depth, primeval—\nBy considering him as God, through the Yoga-study of what pertains to self,\nThe wise man leaves joy and sorrow behind."
  modern: "Him who is hard to see, who has entered the hidden,\nset in the secret place [of the heart], dwelling in the depths, primeval—\nrecognizing Him as God through Yoga-study of the self,\nthe wise man leaves joy and sorrow behind."
'2.13':
  heading: "The absolutely unqualified Soul"
  text: "When a mortal has heard this and fully comprehended,\nHas torn off what is concerned with the right (dharmya), and has taken Him as the subtile,\nThen he rejoices, for indeed he has obtained what is to be rejoiced in.\nI regard Naciketas a dwelling open [for Ātman]."
  modern: "When a mortal has heard this and fully grasped it,\nhas torn away what concerns the right (dharmya) and gained Him as the subtle one,\nhe rejoices, for he has gained what is worth rejoicing in.\nI think Naciketas is a house open [for Ātman]."
  note: "Here, in contrast with the latter half of the line, the idea of dharma may be philosophical: i. e. ‘the qualified.’ In the next stanza it is certainly ethical."
'2.14':
  text: "Apart from the right (dharma) and apart from the unright (a-dharma),\nApart from both what has been done and what has not been done here,\nApart from what has been and what is to be—\nWhat thou seest as that, speak that!"
  modern: "Apart from right (dharma) and apart from wrong (a-dharma),\napart from both what has been done and what has not been done here,\napart from what has been and what is to be—\nwhat you see as that, say it!"
'2.15':
  heading: "The mystic syllable ‘Om’ as an aid"
  speaker: "[Naciketas being unable to mention that absolutely unqualified object, Death continues to explain:]"
  speakerModern: "[Naciketas cannot name that wholly unqualified object, so Death goes on to explain:]"
  text: "The word which all the Vedas rehearse,\nAnd which all austerities proclaim,\nDesiring which men live the life of religious studentship (brahmacarya)—\nThat word to thee I briefly declare.\nThat is Om!"
  modern: "The word that all the Vedas recite,\nthat all austerities proclaim,\nfor which men live as religious students (brahmacarya)—\nthat word I tell you in brief.\nIt is Om!"
  note: "Śaṅkara and all translators except Deussen regard the previous section as an utterance by Naciketas. Instead of assigning so pregnant an inquiry to a pupil still being instructed, the present distribution of the parts of this dialogue interprets it (in agreement with Deussen) as continued exposition, rhetorically put in the form of an interrogation by the teacher himself."
'2.16':
  text: "That syllable, truly, indeed, is Brahma!\nThat syllable indeed is the supreme!\nKnowing that syllable, truly, indeed,\nWhatever one desires is his!"
  modern: "That syllable, truly, is Brahma!\nThat syllable, truly, is the supreme!\nKnowing that syllable, truly,\none has whatever one desires."
  note: "The word akṣaram here may also be pregnant with the meaning ‘imperishable’ (Apte gives fourteen meanings in all). Thus:—‘That, truly, indeed, is the imperishable Brahma! / That indeed is the supreme imperishable! / Knowing that imperishable, truly, indeed, . . .’\n\nThe word brahma(n) here may contain some of its liturgical meaning, ‘sacred word,’ as well as the philosophical meaning ‘Brahma.’ Thus:—‘That syllable, truly, indeed, is sacred word!’ or ‘That, truly, indeed, is imperishable sacred word!’"
'2.17':
  text: "That is the best support.\nThat is the supreme support.\nKnowing that support,\nOne becomes happy in the Brahma-world."
  modern: "That is the best support.\nThat is the supreme support.\nKnowing that support,\none becomes happy in the Brahma-world."
  departs: "The verb is mahīyate, ‘is exalted’, as in 3.16, where Hume gives ‘is magnified’; here he renders it ‘becomes happy’."
'2.18':
  heading: "The eternal indestructible soul"
  text: "The wise one [i. e. the soul, the ātman, the self] is not born, nor dies.\nThis one has not come from anywhere, has not become anyone.\nUnborn, constant, eternal, primeval, this one\nIs not slain when the body is slain."
  modern: "The wise one [the self (ātman)] is not born, nor does He die.\nHe has come from nowhere and has become no one.\nUnborn, constant, eternal, primeval,\nHe is not killed when the body is killed."
'2.19':
  text: "If the slayer think to slay,\nIf the slain think himself slain,\nBoth these understand not.\nThis one slays not, nor is slain."
  modern: "If the killer thinks he kills,\nif the killed thinks he is killed,\nneither of them understands.\nHe neither kills nor is killed."
'2.20':
  heading: "The Soul revealed to the unstriving elect"
  text: "More minute than the minute, greater than the great\nIs the Soul (Ātman) that is set in the heart of a creature here.\nOne who is without the active will (a-kratu) beholds Him, and becomes freed from sorrow—\nWhen through the grace (prasāda) of the Creator (dhātṛ) he beholds the greatness of the Soul (Ātman)."
  modern: "Smaller than the small, greater than the great,\nthe Self (Ātman) is set in the heart of a creature here.\nOne without active will (a-kratu) sees Him and is freed from sorrow,\nwhen through the grace (prasāda) of the Creator (dhātṛ) he sees the greatness of the Self (Ātman)."
  note: "This is an important passage, as being the first explicit statement of the doctrine of Grace (prasāda). The idea is found earlier in the celebrated Hymn of the Word (Vāc), RV. 10. 125. 5 c, d, and again in Muṇḍ. 3. 2. 3 c, d. This same stanza occurs with slight verbal variation as Śvet. 3. 20 and Mahānārāyaṇa Upanishad 8. 3 (= Taittirīya Āraṇyaka 10. 10. 1).\n\nInasmuch as this method of salvation ‘through the grace of the Creator’ is directly opposed to the general Upanishadic doctrine of salvation ‘through knowledge,’ Śaṅkara interprets dhātuḥ prasādāt as dhātu-samprasādāt, ‘through the tranquillity of the senses,’ according to the practice of the Yoga-method. There is this possibility of different interpretation of the word prasāda; for it occurs unquestionably in the sense of ‘tranquillity’ at Maitri 6. 20 and 6. 34; compare also the compounds jñāna-prasāda, ‘the peace of knowledge,’ at Muṇḍ. 3. 1. 8, and varṇa-prasāda, ‘clearness of complexion,’ at Śvet. 2. 13. In the Bhagavad Gīta there is the same double use:—‘peace’ or ‘tranquillity,’ at 2. 64; 2. 65; 18. 37; and ‘the grace of Kṛishṇa,’ at 18. 56; 18. 58; 18. 62; 18. 73; and ‘the grace of Vyāsa,’ at 18. 75.\n\nThe development of the doctrine of ‘salvation by grace’ by the Vishnuites proceeds through the Epic, culminating in the sharp controversy against this ‘Cat-doctrine’ by the ‘Monkey-doctrine’ of ‘salvation by works.’ Compare Hopkins, Religions of India, pp. 500, 501."
'2.21':
  heading: "His opposite characteristics"
  text: "Sitting, he proceeds afar;\nLying, he goes everywhere.\nWho else than I (mad) is able to know\nThe god (deva) who rejoices and rejoices not (madāmada)?"
  modern: "Sitting, He travels far;\nlying down, He goes everywhere.\nWho but I (mad) can know\nthe god (deva) who rejoices and does not rejoice (madāmada)?"
'2.22':
  text: "Him who is the bodiless among bodies,\nStable among the unstable,\nThe great, all-pervading Soul (Ātman)—\nOn recognizing Him, the wise man sorrows not."
  modern: "The bodiless among bodies,\nstable among the unstable,\nthe great, all-pervading Self (Ātman)—\nrecognizing Him, the wise man does not grieve."
'2.23':
  heading: "The conditions of knowing Him"
  text: "This Soul (Ātman) is not to be obtained by instruction,\nNor by intellect, nor by much learning.\nHe is to be obtained only by the one whom He chooses;\nTo such a one that Soul (Ātman) reveals his own person (tanūm svām)."
  modern: "This Self (Ātman) is not gained by teaching,\nnor by intellect, nor by much learning.\nHe is gained only by the one He chooses;\nto that one the Self (Ātman) reveals His own person (tanūṃ svām)."
'2.24':
  text: "Not he who has not ceased from bad conduct,\nNot he who is not tranquil, not he who is not composed,\nNot he who is not of peaceful mind\nCan obtain Him by intelligence (prajñā)."
  modern: "No one who has not turned from wrongdoing,\nwho is not calm, who is not composed,\nor whose mind is not at peace\ncan gain Him by intelligence (prajñā)."
  departs: "The Sanskrit has prajñānena (prajñāna), not prajñā."
'2.25':
  heading: "The all-comprehending incomprehensible"
  text: "He for whom the priesthood (brahman) and the nobility (kṣatra)\nBoth are as food,\nAnd death is as a sauce—\nWho really knows where He is?"
  modern: "He for whom priesthood (brahman) and nobility (kṣatra)\nare both as food,\nand death is the sauce—\nwho truly knows where He is?"
'3.1':
  heading: "The universal and the individual soul"
  text: "There are two that drink of righteousness (ṛta) in the world of good deeds;\nBoth are entered into the secret place [of the heart], and in the highest upper sphere.\nBrahma-knowers speak of them as ‘light’ and ‘shade,’\nAnd so do householders who maintain the five sacrificial fires, and those too who perform the triple Naciketas-fire."
  modern: "There are two who drink of the right (ṛta) in the world of good deeds,\nboth entered into the secret place [of the heart], in the highest upper sphere.\nKnowers of Brahma call them ‘light’ and ‘shade’,\nand so do householders who keep the five sacrificial fires, and those who have kindled a triple Naciketas-fire."
  departs: "The Sanskrit has only pañcāgnayaḥ, ‘those of the five fires’; ‘householders’ is Hume’s gloss."
'3.2':
  heading: "The Naciketas sacrificial fire as an aid"
  text: "This which is the bridge for those who sacrifice,\nAnd which is the highest imperishable Brahma\nFor those who seek to cross over to the fearless farther shore—\nThe Naciketas-fire may we master!"
  modern: "That which is the bridge for those who sacrifice,\nand which is the highest, imperishable Brahma\nfor those who seek to cross to the fearless far shore—\nmay we master the Naciketas-fire!"
'3.3':
  heading: "Parable of the individual soul in a chariot"
  text: "Know thou the soul (ātman, self) as riding in a chariot,\nThe body as the chariot.\nKnow thou the intellect (buddhi) as the chariot-driver,\nAnd the mind (manas) as the reins."
  modern: "Know the self (ātman) as the rider in the chariot,\nthe body as the chariot.\nKnow the intellect (buddhi) as the driver,\nand the mind (manas) as the reins."
'3.4':
  text: "The senses (indriya), they say, are the horses;\nThe objects of sense, what they range over.\nThe self combined with senses and mind\nWise men call ‘the enjoyer’ (bhoktṛ)."
  modern: "The senses (indriya), they say, are the horses;\nthe objects of sense, the ground they range over.\nThe self joined with senses and mind\nwise men call ‘the enjoyer’ (bhoktṛ)."
'3.5':
  text: "He who has not understanding (a-vijñāna),\nWhose mind is not constantly held firm—\nHis senses are uncontrolled,\nLike the vicious horses of a chariot-driver."
  modern: "He who lacks understanding (a-vijñāna),\nwhose mind is never held firm—\nhis senses are out of control,\nlike the bad horses of a driver."
'3.6':
  text: "He, however, who has understanding,\nWhose mind is constantly held firm—\nHis senses are under control,\nLike the good horses of a chariot-driver."
  modern: "But he who has understanding,\nwhose mind is always held firm—\nhis senses are under control,\nlike the good horses of a driver."
'3.7':
  heading: "Intelligent control of the soul’s chariot needed to arrive beyond transmigration"
  text: "He, however, who has not understanding,\nWho is unmindful and ever impure,\nReaches not the goal,\nBut goes on to transmigration (saṁsāra)."
  modern: "But he who lacks understanding,\nwho is unmindful and always impure,\ndoes not reach the goal\nbut goes on to transmigration (saṁsāra)."
'3.8':
  text: "He, however, who has understanding,\nWho is mindful and ever pure,\nReaches the goal\nFrom which he is born no more."
  modern: "But he who has understanding,\nwho is mindful and always pure,\nreaches the goal\nfrom which he is not born again."
'3.9':
  text: "He, however, who has the understanding of a chariot-driver,\nA man who reins in his mind—\nHe reaches the end of his journey,\nThat highest place of Vishṇu."
  modern: "But the man who has a chariot-driver’s understanding\nand reins in his mind\nreaches the end of his journey,\nthat highest place of Vishṇu."
  departs: "The Sanskrit vijñāna-sārathi means ‘who has understanding as his chariot-driver’; Hume’s ‘the understanding of a chariot-driver’ reads it differently."
'3.10':
  heading: "The order of progression to the supreme Person"
  text: "Higher than the senses are the objects of sense.\nHigher than the objects of sense is the mind (manas);\nAnd higher than the mind is the intellect (buddhi).\nHigher than the intellect is the Great Self (Ātman)."
  modern: "Higher than the senses are the objects of sense;\nhigher than the objects of sense is the mind (manas);\nhigher than the mind is the intellect (buddhi);\nhigher than the intellect is the Great Self (Ātman)."
'3.11':
  text: "Higher than the Great is the Unmanifest (avyakta).\nHigher than the Unmanifest is the Person.\nHigher than the Person there is nothing at all.\nThat is the goal. That is the highest course."
  modern: "Higher than the Great is the Unmanifest (avyakta).\nHigher than the Unmanifest is the Person (puruṣa).\nHigher than the Person there is nothing at all.\nThat is the goal; that is the highest course."
'3.12':
  heading: "The subtle perception of the all-pervading Soul"
  text: "Though He is hidden in all things,\nThat Soul (Ātman, Self) shines not forth.\nBut he is seen by subtle seers\nWith superior, subtle intellect."
  modern: "Though He is hidden in all things,\nthe Self (Ātman) does not shine forth.\nBut He is seen by subtle seers\nwith a superior, subtle intellect."
  departs: "The Sanskrit is bhūta, which Hume renders ‘beings’ at 4.6–4.7; here and in 5.9–5.12 he has ‘things’."
'3.13':
  heading: "The Yoga method—of suppression"
  text: "An intelligent man should suppress his speech and his mind.\nThe latter he should suppress in the Understanding-Self (jñāna ātman).\nThe understanding he should suppress in the Great Self [= buddhi, intellect].\nThat he should suppress in the Tranquil Self (śānta ātman)."
  modern: "A wise man should restrain speech and mind;\nthat he should restrain in the understanding self (jñāna ātman);\nthe understanding he should restrain in the Great Self [the intellect (buddhi)];\nand that he should restrain in the tranquil self (śānta ātman)."
'3.14':
  heading: "Exhortation to the way of liberation from death"
  text: "Arise ye! Awake ye!\nObtain your boons and understand them!\nA sharpened edge of a razor, hard to traverse,\nA difficult path is this—poets (kavi) declare!"
  modern: "Arise! Awake!\nWin your boons and understand them!\nA sharpened razor’s edge, hard to cross,\na hard path is this, the poets (kavi) say."
  note: "The commentators interpret ‘boons’ as referring to ‘teachers.’ But the word may imply ‘answers to your questions.’"
'3.15':
  text: "What is soundless, touchless, formless, imperishable,\nLikewise tasteless, constant, odorless,\nWithout beginning, without end, higher than the great, stable—\nBy discerning That, one is liberated from the mouth of death."
  modern: "What is soundless, touchless, formless, imperishable,\ntasteless too, constant, odorless,\nwithout beginning, without end, higher than the great, stable—\ndiscerning That, one is released from the mouth of death."
'3.16':
  heading: "The immortal value of this teaching"
  text: "The Naciketas tale,\nDeath’s immemorial teaching—\nBy declaring and hearing this, a wise man\nIs magnified in the Brahma-world."
  modern: "The Naciketas story,\nDeath’s immemorial teaching—\nby telling it and hearing it, a wise man\nis exalted in the Brahma-world."
  departs: "The Sanskrit is sanātana, which Hume renders ‘eternal’ at 5.6 and 6.1; here ‘immemorial’."
'3.17':
  text: "If one recites this supreme secret\nIn an assembly of Brahmans,\nOr at a time of the ceremony for the dead, devoutly—\nThat makes for immortality!\n—That makes for immortality!"
  modern: "Whoever, devout, recites this supreme secret\nin an assembly of Brahmans\nor at the time of the rite for the dead—\nthat makes for immortality!\nThat makes for immortality!"
'4.1':
  heading: "The immortal Soul not to be sought through outward senses"
  text: "The Self-existent (svayambhū) pierced the openings [of the senses] outward;\nTherefore one looks outward, not within himself (antarātman).\nA certain wise man, while seeking immortality,\nIntrospectively beheld the Soul (Ātman) face to face."
  modern: "The Self-existent (svayambhū) pierced the openings [of the senses] outward,\nso one looks outward, not within oneself (antarātman).\nA certain wise man, seeking immortality,\nturned his eyes inward and saw the Self (Ātman) face to face."
'4.2':
  text: "The childish go after outward pleasures;\nThey walk into the net of widespread death.\nBut the wise, knowing immortality,\nSeek not the stable among things which are unstable here."
  modern: "The childish go after outward pleasures;\nthey walk into the net of widespread death.\nBut the wise, knowing immortality,\ndo not seek the stable among the unstable things here."
  departs: "The word is pāśa, which Hume renders ‘bonds’ at 1.18 (mṛtyupāśān) and ‘net’ here."
'4.3':
  heading: "Yet the agent in all the senses, in sleeping and in waking"
  text: "That by which [one discerns] form, taste, smell,\nSound, and mutual touches—\nIt is with That indeed that one discerns.\nWhat is there left over here!\nThis, verily, is That!"
  modern: "That by which one discerns form, taste, smell,\nsounds, and mutual touches—\nby That, indeed, one discerns.\nWhat is left over here?\nThis, truly, is That!"
  departs: "Hume’s ‘mutual touches’ is a euphemism: maithunān sparśān are the touches of sexual union."
'4.4':
  text: "By recognizing as the great pervading Soul (Ātman)\nThat whereby one perceives both\nThe sleeping state and the waking state,\nThe wise man sorrows not."
  modern: "That by which one perceives both\nthe state of sleep and the state of waking—\nrecognizing it as the great, all-pervading Self (Ātman),\nthe wise man does not grieve."
'4.5':
  heading: "The universal Soul (Ātman), identical with the individual and with all creation"
  text: "He who knows this experiencer\nAs the living Soul (Ātman) near at hand,\nLord of what has been and of what is to be—\nHe does not shrink away from Him.\nThis, verily, is That!"
  modern: "He who knows this experiencer\nas the living Self (Ātman) close at hand,\nLord of what has been and what is to be,\ndoes not shrink from Him.\nThis, truly, is That!"
'4.6':
  text: "He who was born of old from austerity (tapas),\nWas born of old from the waters,\nWho stands entered into the secret place [of the heart],\nWho looked forth through beings—\nThis, verily, is That!"
  modern: "He who was born of old from austerity (tapas),\nwho was born of old from the waters,\nwho has entered the secret place [of the heart] and stands there,\nwho looked out through beings—\nThis, truly, is That!"
  note: "This stanza contains an ungrammatical form and impossible constructions. The text here, as also in § 7, is probably corrupt. The reference here is probably to the Sāṅkhyan Purusha, Person."
'4.7':
  text: "She who arises with life (prāṇa),\nAditi (Infinity), maker of divinity,\nWho stands entered into the secret place [of the heart],\nWho was born forth through beings—\nThis, verily, is That!"
  modern: "She who comes into being with life (prāṇa),\nAditi (Infinity), maker of divinity,\nwho has entered the secret place [of the heart] and stands there,\nwho was born forth through beings—\nThis, truly, is That!"
  note: "Traditionally interpreted as Prakṛiti, Nature."
'4.8':
  text: "Fire (Agni), the all-knower (jātavedas), hidden away in the two fire-sticks\nLike the embryo well borne by pregnant women,\nWorthy to be worshiped day by day\nBy watchful men with oblations—\nThis, verily, is That!"
  modern: "Fire (Agni), the all-knower (jātavedas), hidden in the two fire-sticks\nlike an embryo well carried by pregnant women,\nworthy to be worshiped day after day\nby watchful men with offerings—\nThis, truly, is That!"
'4.9':
  text: "Whence the sun rises,\nAnd where it goes to rest—\nOn Him all the gods are founded;\nAnd no one ever goes beyond it.\nThis, verily, is That!"
  modern: "That from which the sun rises\nand into which it sets—\non Him all the gods are founded,\nand no one ever goes beyond it.\nThis, truly, is That!"
'4.10':
  heading: "Failure to comprehend the essential unity of being regarded as the cause of reincarnation"
  text: "Whatever is here, that is there.\nWhat is there, that again is here.\nHe obtains death after death\nWho seems to see a difference here."
  modern: "Whatever is here is there;\nwhatever is there is here as well.\nHe gets death after death\nwho seems to see a difference here."
'4.11':
  text: "By the mind, indeed, is this [realization] to be attained:—\nThere is no difference here at all!\nHe goes from death to death\nWho seems to see a difference here."
  modern: "By the mind, indeed, this is to be reached:\nthere is no difference here at all.\nHe goes from death to death\nwho seems to see a difference here."
'4.12':
  heading: "The eternal Lord abiding in one’s self"
  text: "A Person of the measure of a thumb\nStands in the midst of one’s self (ātman),\nLord of what has been and of what is to be.\nOne does not shrink away from Him.\nThis, verily, is That!"
  modern: "A Person (puruṣa) the size of a thumb\nstands in the middle of the self (ātman),\nLord of what has been and what is to be.\nOne does not shrink from Him.\nThis, truly, is That!"
'4.13':
  text: "A Person of the measure of a thumb,\nLike a light without smoke,\nLord of what has been and what is to be.\nHe alone is today, and tomorrow too."
  modern: "A Person the size of a thumb,\nlike a light without smoke,\nLord of what has been and what is to be:\nHe alone is today, and tomorrow too."
  departs: "The Sanskrit ends with etad vai tat (‘This, truly, is That!’), which Hume omits."
'4.14':
  heading: "The result of seeing multiplicity or else pure unity"
  text: "As water rained upon rough ground\nRuns to waste among the hills,\nSo he who sees qualities (dharma) separately,\nRuns to waste after them."
  modern: "As rain that falls on rough ground\nruns to waste among the hills,\nso one who sees qualities (dharma) as separate\nruns to waste after them."
'4.15':
  text: "As pure water poured forth into pure\nBecomes the very same,\nSo becomes the soul (ātman), O Gautama,\nOf the seer (muni) who has understanding."
  modern: "As pure water poured into pure water\nbecomes just the same,\nso, Gautama, becomes the self (ātman)\nof the sage (muni) who understands."
'5.1':
  heading: "The real Soul of the individual and of the world"
  text: "By ruling over the eleven-gated citadel\nOf the Unborn, the Un-crooked-minded one,\nOne sorrows not.\nBut when liberated [from the body], he is liberated indeed.\nThis, verily, is That!"
  modern: "Ruling the eleven-gated city\nof the Unborn, whose thought is not crooked,\none does not grieve;\nbut once released [from the body], one is released indeed.\nThis, truly, is That!"
'5.2':
  text: "The swan [i. e. sun] in the clear, the Vasu in the atmosphere,\nThe priest by the altar, the guest in the house,\nIn man, in broad space, in the right (ṛta), in the sky,\nBorn in water, born in cattle, born in the right, born in rock, is the Right, the Great!"
  modern: "The swan [the sun] in the bright, the Vasu in mid-air,\nthe priest at the altar, the guest in the house,\nin men, in broad space, in the right (ṛta), in the sky,\nborn in water, born in cattle, born in the right, born in rock,\nis the Right, the Great!"
'5.3':
  text: "Upwards the out-breath (prāṇa) he leadeth.\nThe in-breath (apāna) inwards he casts.\nThe dwarf who is seated in the middle\nAll the gods (deva) reverence!"
  modern: "He leads the out-breath (prāṇa) upward;\nhe casts the in-breath (apāna) inward.\nAll the gods (deva) revere\nthe dwarf seated in the middle."
  note: "That is, in the middle of the body, and the devās are the bodily powers (or ‘senses,’ as not infrequently), according to Śaṅkara’s interpretation."
'5.4':
  text: "When this incorporate one that stands in the body\nIs dissolved,\nAnd is released from the body,\nWhat is there left over here?\nThis, verily, is That!"
  modern: "When this embodied one who dwells in the body\nis dissolved\nand released from the body,\nwhat is left over here?\nThis, truly, is That!"
'5.5':
  text: "Not by the out-breath (prāṇa) and the in-breath (apāna)\nDoth any mortal whatsoever live.\nBut by another do men live—\nEven That whereon both these depend."
  modern: "No mortal at all lives\nby the out-breath (prāṇa) or the in-breath (apāna).\nMen live by something else,\nby That on which both of these depend."
'5.6':
  heading: "The appropriate embodiment of the transmigrating soul"
  text: "Come! I will declare this to you:\nThe hidden, eternal Brahma;\nAnd how, after it reaches death,\nThe soul (ātman) fares, O Gautama!"
  modern: "Come, I will tell you this:\nthe hidden, eternal Brahma,\nand how the self (ātman) fares\nafter it meets death, Gautama."
'5.7':
  text: "Some go into a womb\nFor the embodiment of a corporeal being.\nOthers go into a stationary thing\nAccording to their deeds (karman), according to their knowledge."
  modern: "Some go into a womb\nso that an embodied being may take a body;\nothers go into a stationary thing,\naccording to their deeds (karman), according to their knowledge."
  departs: "Hume takes dehinaḥ as a genitive (‘of a corporeal being’); it can as well be the nominative subject, ‘some embodied beings go into a womb’."
'5.8':
  heading: "One’s real person, the same as the world-ground"
  text: "He who is awake in those that sleep,\nThe Person who fashions desire after desire—\nThat indeed is the Pure. That is Brahma.\nThat indeed is called the Immortal.\nOn it all the worlds do rest;\nAnd no one soever goes beyond it.\nThis, verily, is That!"
  modern: "He who is awake in those who sleep,\nthe Person who shapes desire after desire—\nthat indeed is the Pure; that is Brahma;\nthat indeed is called the Immortal.\nOn it all the worlds rest,\nand no one ever goes beyond it.\nThis, truly, is That!"
'5.9':
  heading: "The unitary world-soul, immanent yet transcendent"
  text: "As the one fire has entered the world\nAnd becomes corresponding in form to every form,\nSo the one Inner Soul (Ātman) of all things\nIs corresponding in form to every form, and yet is outside."
  modern: "As the one fire has entered the world\nand takes the form of every form,\nso the one inner Self (Ātman) of all things\ntakes the form of every form, and is outside as well."
'5.10':
  text: "As the one wind has entered the world\nAnd becomes corresponding in form to every form,\nSo the one Inner Soul of all things\nIs corresponding in form to every form, and yet is outside."
  modern: "As the one wind has entered the world\nand takes the form of every form,\nso the one inner Self of all things\ntakes the form of every form, and is outside as well."
'5.11':
  text: "As the sun, the eye of the whole world,\nIs not sullied by the external faults of the eyes,\nSo the one Inner Soul of all things\nIs not sullied by the evil in the world, being external to it."
  modern: "As the sun, the eye of the whole world,\nis not stained by the outward faults of the eyes,\nso the one inner Self of all things\nis not stained by the evil in the world, being outside it."
  departs: "The Sanskrit lokaduḥkha is ‘the suffering (duḥkha) of the world’; Hume has ‘the evil in the world’."
'5.12':
  heading: "The indescribable bliss of recognizing the world-soul in one’s own soul"
  text: "The Inner Soul (antarātman) of all things, the One Controller,\nWho makes his one form manifold—\nThe wise who perceive Him as standing in oneself,\nThey, and no others, have eternal happiness!"
  modern: "The one Controller, the inner Self (antarātman) of all things,\nwho makes His one form many—\nthe wise who see Him standing in themselves,\nthey and no others have eternal happiness."
'5.13':
  text: "Him who is the constant among the inconstant, the intelligent among intelligences,\nThe One among many, who grants desires—\nThe wise who perceive Him as standing in oneself,\nThey, and no others, have eternal peace!"
  modern: "The constant among the inconstant, the intelligent among the intelligent,\nthe One among many, who grants desires—\nthe wise who see Him standing in themselves,\nthey and no others have eternal peace."
'5.14':
  text: "‘This is it!’—thus they recognize\nThe highest, indescribable happiness.\nHow, now, shall I understand ‘this’?\nDoes it shine [of itself] or does it shine in reflection?"
  modern: "‘This is it!’ So they recognize\nthe highest, indescribable happiness.\nHow, then, shall I understand ‘this’?\nDoes it shine [of itself], or does it shine by reflection?"
'5.15':
  heading: "The self-luminous light of the world"
  text: "The sun shines not there, nor the moon and stars,\nThese lightnings shine not, much less this (earthly) fire!\nAfter Him, as He shines, doth everything shine,\nThis whole world is illumined with His light."
  modern: "The sun does not shine there, nor the moon and stars;\nthese lightnings do not shine, much less this (earthly) fire.\nAs He shines, everything shines after Him;\nthis whole world is lit by His light."
'6.1':
  heading: "The world-tree rooted in Brahma"
  text: "Its root is above, its branches below—\nThis eternal fig-tree!\nThat (root) indeed is the Pure. That is Brahma.\nThat indeed is called the Immortal.\nOn it all the worlds do rest,\nAnd no one soever goes beyond it.\nThis, verily, is That!"
  modern: "Its root above, its branches below,\nthis is the eternal fig tree.\nThat [root] indeed is the Pure; that is Brahma;\nthat indeed is called the Immortal.\nOn it all the worlds rest,\nand no one ever goes beyond it.\nThis, truly, is That!"
'6.2':
  heading: "The great fear"
  text: "This whole world, whatever there is,\nWas created from and moves in Life (prāṇa).\nThe great fear, the upraised thunderbolt—\nThey who know That, become immortal."
  modern: "This whole world, whatever there is,\nwas created from Life (prāṇa) and moves in it.\nThe great fear, the raised thunderbolt:\nthose who know That become immortal."
  departs: "The Sanskrit niḥsṛtam means ‘gone forth, issued’; Hume renders it ‘was created from’."
'6.3':
  text: "From fear of Him fire (Agni) doth burn.\nFrom fear the sun (Sūrya) gives forth heat.\nFrom fear both Indra and Wind (Vāyu),\nAnd Death (Mṛityu) as fifth, do speed along."
  modern: "From fear of Him fire (Agni) burns;\nfrom fear the sun (Sūrya) gives heat;\nfrom fear Indra and Wind (Vāyu),\nand Death (Mṛtyu) as the fifth, rush on."
'6.4':
  heading: "Degrees of perception of the Soul (Ātman)."
  text: "If one has been able to perceive [Him] here on earth\nBefore the dissolution of the body,\nAccording to that [knowledge] he becomes fitted\nFor embodiment in the world-creations."
  modern: "If one has been able to perceive [Him] here on earth\nbefore the body falls apart,\naccording to that he becomes fit\nfor embodiment in the created worlds."
  note: "The reading svargeṣu instead of sargeṣu would yield the more suitable meaning ‘in the heavenly worlds.’ At best, the stanza contradicts the general theory that perception of the Ātman produces release from reincarnation immediately after death. Consequently Śaṅkara supplies an ellipsis which changes the meaning entirely, and Max Müller hesitatingly inserts a ‘not’ in the first line. The present translation interprets the meaning that the degree of perception of the Ātman in the present world determines one’s reincarnate status."
'6.5':
  text: "As in a mirror, so is it seen in the body (ātman);\nAs in a dream, so in the world of the fathers;\nAs if in water, so in the world of the Gandharvas (genii);\nAs if in light and shade, so in the world of Brahma."
  modern: "As in a mirror, so it is seen in the body (ātman);\nas in a dream, so in the world of the fathers;\nas if in water, so in the world of the Gandharvas;\nas if in light and shade, so in the world of Brahma."
'6.6':
  heading: "The gradation up to the supersensible Person"
  text: "The separate nature of the senses,\nAnd that their arising and setting\nIs of things that come into being apart [from himself],\nThe wise man recognizes, and sorrows not."
  modern: "That the senses are separate,\nand that their rising and setting\nbelong to things that come into being apart [from himself]—\nrecognizing this, the wise man does not grieve."
'6.7':
  text: "Higher than the senses (indriya) is the mind (manas);\nAbove the mind is the true being (sattva).\nOver the true being is the Great Self [i. e. buddhi, intellect];\nAbove the Great is the Unmanifest (avyakta)."
  modern: "Higher than the senses (indriya) is the mind (manas);\nabove the mind is true being (sattva);\nabove true being is the Great Self [the intellect (buddhi)];\nabove the Great is the Unmanifest (avyakta)."
'6.8':
  text: "Higher than the Unmanifest, however, is the Person (Purusha),\nAll-pervading and without any mark (a-liṅga) whatever.\nKnowing which, a man is liberated\nAnd goes to immortality."
  modern: "Higher than the Unmanifest is the Person (puruṣa),\nall-pervading and without any mark (a-liṅga) at all.\nKnowing Him, a man is released\nand goes to immortality."
  departs: "The word is jantu, ‘creature’, as Hume renders it at 2.20; here he has ‘a man’."
'6.9':
  text: "His form is not to be beheld.\nNo one soever sees Him with the eye.\nHe is framed by the heart, by the thought, by the mind.\nThey who know That become immortal."
  modern: "His form is not there to be seen;\nno one at all sees Him with the eye.\nHe is framed by the heart, by thought, by the mind.\nThose who know That become immortal."
'6.10':
  heading: "The method of Yoga, suppressive of the lower activity"
  text: "When cease the five\n[Sense-]knowledges, together with the mind (manas),\nAnd the intellect (buddhi) stirs not—\nThat, they say, is the highest course."
  modern: "When the five [sense-]knowledges cease,\ntogether with the mind (manas),\nand the intellect (buddhi) does not stir—\nthat, they say, is the highest course."
'6.11':
  text: "This they consider as Yoga—\nThe firm holding back of the senses.\nThen one becomes undistracted.\nYoga, truly, is the origin and the end."
  modern: "This they consider Yoga:\nthe firm holding back of the senses.\nThen one becomes undistracted.\nYoga, truly, is the origin and the end."
  note: "Literally ‘yoking’; both a ‘yoking,’ i. e. subduing, of the senses; and also a ‘yoking,’ i. e. a ‘joining’ or ‘union,’ with the Supreme Spirit.\n\nPerhaps, of ‘the world’ of beings and experiences—here too, as in Māṇḍ. 6, where the phrase occurs. That is: ‘the world’ becomes created for the person when he emerges from the Yoga state, and passes away when he enters into it. Or perhaps the translation should be ‘an arising and a passing away’: i. e. is transitory—according to Śaṅkara."
'6.12':
  heading: "The Soul incomprehensible except as existent"
  text: "Not by speech, not by mind,\nNot by sight can He be apprehended.\nHow can He be comprehended\nOtherwise than by one’s saying ‘He is’?"
  modern: "Not by speech, not by mind,\nnot by sight can He be grasped.\nHow can He be known\nexcept by one’s saying ‘He is’?"
'6.13':
  text: "He can indeed be comprehended by the thought ‘He is’ (asti)\nAnd by [admitting] the real nature of both [his comprehensibility and his incomprehensibility].\nWhen he has been comprehended by the thought ‘He is’\nHis real nature manifests itself."
  modern: "He can indeed be known by the thought ‘He is’ (asti)\nand by [admitting] the real nature of both [His knowability and His unknowability].\nOnce He is known by the thought ‘He is’,\nHis real nature shows itself."
  departs: "The Sanskrit says only ubhayoḥ, ‘of both’; Hume’s bracket naming the two is his interpretation (see his note)."
  note: "That is, both the affirmable, ‘He is’ and the absolutely non-affirmable ‘No! No!’ neti, neti of Bṛih. 2. 3. 6; both ‘being’ (sad) and ‘non-being’ (asad) of Muṇḍ. 2. 2. 1 d and Praśna 2. 5 d. Śaṅkara interprets ‘both’ as referring to the ‘conditioned’ and the ‘unconditioned’ Brahma."
'6.14':
  heading: "A renunciation of all desires and attachments the condition of immortality"
  text: "When are liberated all\nThe desires that lodge in one’s heart,\nThen a mortal becomes immortal!\nTherein he reaches Brahma!"
  modern: "When all the desires\nthat lodge in one’s heart are released,\nthen a mortal becomes immortal\nand reaches Brahma here."
'6.15':
  text: "When are cut all\nThe knots of the heart here on earth,\nThen a mortal becomes immortal!\n—Thus far is the instruction."
  modern: "When all the knots of the heart\nare cut here on earth,\nthen a mortal becomes immortal.\nThis much is the teaching."
'6.16':
  heading: "The passage of the soul from the body to immortality—or elsewhere"
  text: "There are a hundred and one arteries of the heart.\nOne of these passes up to the crown of the head.\nGoing up by it, one goes to immortality.\nThe others are for departing in various directions."
  modern: "The heart has a hundred and one arteries.\nOne of them goes up to the crown of the head.\nGoing up by it, one goes to immortality;\nthe others are for departing in every direction."
  departs: "The Sanskrit nāḍī is a ‘channel’ or ‘tube’; ‘arteries’ is Hume’s choice."
'6.17':
  text: "A Person of the measure of a thumb is the inner soul (antarātman),\nEver seated in the heart of creatures.\nHim one should draw out from one’s own body\nLike an arrow-shaft out from a reed, with firmness.\nHim one should know as the Pure, the Immortal—\nYea, Him one should know as the Pure, the Immortal."
  modern: "A Person the size of a thumb, the inner Self (antarātman),\nis always seated in the heart of creatures.\nOne should draw Him out from one’s own body, firmly,\nlike an arrow-shaft from a reed.\nOne should know Him as the Pure, the Immortal—\nyes, one should know Him as the Pure, the Immortal."
  departs: "The Sanskrit janānām means ‘of people’; Hume has ‘creatures’."
'6.18':
  heading: "This teaching, the means of attaining Brahma and immortality"
  text: "Then Naciketas, having received this knowledge\nDeclared by Death, and the entire rule of Yoga,\nAttained Brahma and became free from passion, free from death;\nAnd so may any other who knows this in regard to the Soul (Ātman)."
  modern: "Then Naciketas, having received this knowledge\ntaught by Death, and the whole rule of Yoga,\nreached Brahma and became free of passion, free of death;\nand so may any other who knows this about the Self (Ātman)."
