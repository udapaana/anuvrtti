      1: { gloss: 'and, but' }
  बुद्धिं:
    fix:
      1: { gloss: 'the intellect' }
  'विद्धि#2':
    fix:
      1: { lemma: विद्, a: लोट् मध्यमपुरुष एकवचन परस्मैपद, gloss: 'know!' }
  मनः:
    fix:
      1: { gloss: 'the mind' }
  प्रग्रहमेव:
    fix:
