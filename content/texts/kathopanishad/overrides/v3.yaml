      - { form: अयुक्तेन, lemma: अयुक्त, a: तृतीया एकवचन नपुंसकलिङ्ग, gloss: 'unyoked, undisciplined' }
  मनसा:
    fix:
      1: { gloss: 'the mind' }
  तस्येन्द्रियाण्यवश्यानि:
    split:
      - { form: तस्य, lemma: तद्, a: षष्ठी एकवचन पुंलिङ्ग }
      - { form: इन्द्रियाणि, lemma: इन्द्रिय, a: प्रथमा बहुवचन नपुंसकलिङ्ग, gloss: 'the senses' }
