  हयानाहुर्विषयांस्तेषु:
    fix:
      2: { gloss: 'they say, call' }
      3: { gloss: 'an object of sense' }
  गोचरान्:
    fix:
      1: { gloss: 'a range, field; here the paths the horses run on' }
  आत्मेन्द्रियमनोयुक्तं:
    split:
      - { form: आत्म, lemma: आत्मन्, member: true, gloss: 'the self' }
      - { form: इन्द्रिय, lemma: इन्द्रिय, member: true, gloss: 'a sense' }
      - { form: मनस्, lemma: मनस्, member: true, gloss: 'the mind' }
