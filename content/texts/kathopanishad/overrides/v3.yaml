# Kaṭha Upaniṣad, vallī 3 (3.1–3.17): the author's decisions on vidyut's reading.
# Format: see the header of content/texts/pancatantra-kilotpatin/overrides.yaml.

'3.1':
  ऋतं:
    fix:
      1: { a: द्वितीया एकवचन नपुंसकलिङ्ग, gloss: 'truth, cosmic order; here "the truth" (of one''s deeds)' }
  पिबन्तौ:
    fix:
      1: { gloss: 'drinking' }
    note: 'Dual: the two "selves" of the next line, the shadow and the light.'
  सुकृतस्य:
    fix:
      1: { gloss: 'a good deed; सुकृतस्य लोके "in the world of good deeds"' }
  लोके:
    fix:
      1: { gloss: 'a world' }
  गुहां:
    fix:
      1: { gloss: 'a hiding-place, cave; the secret place of the heart' }
  प्रविष्टौ:
    fix:
      1: { lemma: प्रविश्, a: प्रथमा द्विवचन पुंलिङ्ग क्त, gloss: 'having entered' }
  परमे:
    fix:
      1: { gloss: 'highest, supreme' }
  परार्धे:
    fix:
      1: { gloss: 'the highest region' }
  छायातपौ:
    split:
      - { form: छाया, lemma: छाया, member: true, gloss: 'shade, shadow' }
      - { form: आतपौ, lemma: आतप, a: प्रथमा द्विवचन पुंलिङ्ग, gloss: 'sunlight, heat (छायातपौ "shadow and light")' }
    note: A द्वन्द्व, dual — the two who drink, named.
  ब्रह्मविदो:
    split:
      - { form: ब्रह्म, lemma: ब्रह्मन्, member: true }
      - { form: विदः, lemma: विद्, a: प्रथमा बहुवचन पुंलिङ्ग, gloss: 'knowing; ब्रह्मविद् "a knower of brahman"' }
  पञ्चाग्नयो:
    split:
      - { form: पञ्च, lemma: पञ्चन्, member: true, gloss: 'five' }
      - { form: अग्नयः, lemma: अग्नि, a: प्रथमा बहुवचन पुंलिङ्ग, gloss: 'fire; पञ्चाग्नि "one who keeps the five fires"' }
    note: A बहुव्रीहि, "those who keep five fires" — householders who tend the sacred fires.
  त्रिणाचिकेताः:
    fix:
      1: { gloss: 'one who has thrice kindled the Nāciketa fire' }

'3.2':
  सेतुरीजानानामक्षरं:
    fix:
      1: { gloss: 'a bridge, dam' }
      2: { a: षष्ठी बहुवचन पुंलिङ्ग कानच्, gloss: 'having sacrificed; ईजानानाम् "of those who sacrifice"' }
    note: ईजान is the perfect middle participle (कानच्) of यज्, a Vedic form.
  ब्रह्म:
    fix:
      1: { gloss: 'brahman, the absolute' }
  यत्परम्:
    fix:
      2: { a: प्रथमा एकवचन नपुंसकलिङ्ग, gloss: 'highest, supreme' }
  अभयं:
    fix:
      1: { gloss: 'fearless, free from danger; the fearless (shore)' }
  तितीर्षतां:
    fix:
      1: { lemma: तॄ, a: षष्ठी बहुवचन पुंलिङ्ग शतृ, gloss: 'wishing to cross over' }
    note: Desiderative of तॄ "cross" (ति-तीर्-ष), as a present participle.
  पारं:
    fix:
      1: { gloss: 'the further shore' }
  नाचिकेतं:
    fix:
      1: { a: द्वितीया एकवचन पुंलिङ्ग, gloss: 'the Nāciketa fire' }
  शकेमहि:
    split:
      - { form: शकेमहि, lemma: शक्, a: विधिलिङ् उत्तमपुरुष बहुवचन आत्मनेपद, gloss: 'may we be able (to master)' }
    note: >-
      Vedic: an optative middle of शक् "be able" (classical शक्नुयाम). It governs
      the accusatives नाचिकेतम् and the bridge/brahman of the verse.

