    note: '"(The self) joined with body, senses and mind" — agreeing with an understood आत्मानम्; मनस् becomes मनो before the voiced य.'
  भोक्तेत्याहुर्मनीषिणः:
    fix:
      1: { gloss: 'one who enjoys, the experiencer' }
      3: { gloss: 'they say, call' }
      4: { gloss: 'wise, a sage' }

