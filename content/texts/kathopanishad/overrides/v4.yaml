# Kaṭha Upaniṣad, vallī 4 (4.1–4.15) — see ../../pancatantra-kilotpatin/overrides.yaml for the format.

'4.1':
  पराञ्चि:
    fix:
      1: { a: द्वितीया बहुवचन नपुंसकलिङ्ग, gloss: 'turned outward' }
  खानि:
    fix:
      1: { a: द्वितीया बहुवचन नपुंसकलिङ्ग, gloss: 'the openings of the body, the senses (lit. holes)' }
  व्यतृणत्स्वयंभूस्तस्मात्पराङ्पश्यति:
    split:
      - { form: व्यतृणत्, lemma: वितृद्, a: लङ् प्रथमपुरुष एकवचन परस्मैपद, gloss: 'bored through, pierced' }
      - { form: स्वयम्, lemma: स्वयम्, member: true, gloss: 'self, by oneself' }
      - { form: भूः, lemma: भू, a: प्रथमा एकवचन पुंलिङ्ग, gloss: 'being; at the end of a compound, "existing" — स्वयम्भू, the Self-existent' }
      - { form: तस्मात्, lemma: तद्, a: पञ्चमी एकवचन पुंलिङ्ग, gloss: 'therefore' }
      - { form: पराङ्, lemma: पराञ्च्, a: प्रथमा एकवचन पुंलिङ्ग, gloss: 'turned outward' }
      - { form: पश्यति, lemma: दृश्, a: लट् प्रथमपुरुष एकवचन परस्मैपद, gloss: 'one looks' }
  नान्तरात्मन्:
    fix:
      2: { a: सप्तमी एकवचन पुंलिङ्ग, gloss: 'the inner self' }
    note: 'अन्तरात्मन् is a Vedic locative with no ending (= अन्तरात्मनि), "into the inner self".'
  कश्चिद्धीरः:
    split:
      - { form: कः, lemma: किम्, a: प्रथमा एकवचन पुंलिङ्ग }
      - { form: चित्, lemma: चित्, a: अव्यय, gloss: '(after a form of किम्) some, a certain' }
      - { form: धीरः, lemma: धीर, a: प्रथमा एकवचन पुंलिङ्ग, gloss: 'wise, steadfast' }
  प्रत्यगात्मानमैक्षदावृत्तचक्षुरमृतत्वमिच्छन्:
    split:
      - { form: प्रत्यक्, lemma: प्रत्यञ्च्, a: अव्यय, gloss: 'inward, turned back' }
      - { form: आत्मानम्, lemma: आत्मन्, a: द्वितीया एकवचन पुंलिङ्ग, gloss: 'the self' }
      - { form: ऐक्षत्, lemma: ईक्ष्, a: लङ् प्रथमपुरुष एकवचन परस्मैपद, gloss: 'saw, beheld' }
      - { form: आवृत्त, lemma: आवृत्त, member: true, gloss: 'turned back, turned round' }
      - { form: चक्षुः, lemma: चक्षुस्, a: प्रथमा एकवचन पुंलिङ्ग, gloss: 'eye, sight' }
      - { form: अमृतत्वम्, lemma: अमृतत्व, a: द्वितीया एकवचन नपुंसकलिङ्ग, gloss: 'immortality' }
      - { form: इच्छन्, lemma: इष्, a: प्रथमा एकवचन पुंलिङ्ग शतृ, gloss: 'wishing, seeking' }
    note: >-
      ऐक्षत् is a Vedic active of a root classical Sanskrit uses only in the
      middle (ऐक्षत). आवृत्तचक्षुः is a बहुव्रीहि, "whose sight is turned back",
      agreeing with धीरः.

