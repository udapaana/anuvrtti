    fix:
      1: { lemma: अनुष्ठा, a: अव्यय क्त्वा, gloss: "having governed, having attended to" }
  एतद्वै:
    fix:
      2: { gloss: "indeed, truly" }
  तत्:
    fix:
      1: { gloss: "that" }

