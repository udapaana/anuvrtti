# Kaṭha Upaniṣad 5.1–5.15: the author's decisions on vidyut's reading.
# Format: see the header of content/texts/pancatantra-kilotpatin/overrides.yaml.

'5.1':
  पुरमेकादशद्वारमजस्यावक्रचेतसः:
    split:
      - { form: पुरम्, lemma: पुर, a: द्वितीया एकवचन नपुंसकलिङ्ग, gloss: "a fortress, city" }
      - { form: एकादश, lemma: एकादशन्, member: true, gloss: "eleven" }
      - { form: द्वारम्, lemma: द्वार, a: द्वितीया एकवचन नपुंसकलिङ्ग, gloss: "a door, gate" }
      - { form: अजस्य, lemma: अज, a: षष्ठी एकवचन पुंलिङ्ग, gloss: "the unborn one" }
      - { form: अवक्र, lemma: अवक्र, member: true, gloss: "not crooked, straight" }
      - { form: चेतसः, lemma: चेतस्, a: षष्ठी एकवचन पुंलिङ्ग, gloss: "mind, thought" }
    note: 'Two बहुव्रीहिs: the body is a city "with eleven gates", belonging to the unborn one "whose thought is not crooked".'
