# Kaṭha Upaniṣad, whole — the six vallīs, in order.
#
# AUTHORED SOURCE of a whole text: the text verbatim — see
# content/texts/pancatantra-kilotpatin/text.yaml for the format. Devanagari
# saṃhitā from GRETIL's IAST (iastToDeva in scripts/analyze-text.ts); `iast`
# is GRETIL's line exactly. Unaccented, as Olivelle prints it. Section ids are
# vallī.verse (KaU 1.1 …): never renumber one. The first three verses are also
# a word-by-word chapter in the reader (13_kathopanishad, ku0101–ku0103).
id: kathopanishad
title: कठोपनिषद्
title_en: The Kaṭha Upaniṣad
work: कठोपनिषद्
place: the whole Upaniṣad, vallīs 1–6
source:
  edition: Olivelle, The Early Upaniṣads (1998), pp. 374–402, via GRETIL (Vienna University Student Team)
  file: sa_kathopaniSad # data/texts.json (sha256-pinned)
  lines: '51–427'
  licence: GRETIL text, CC BY-NC-SA 4.0 (per its header)
sections:
  - id: '1.1'
    kind: verse
    lines:
      - उशन्ह वै वाजश्रवसः सर्ववेदसं ददौ
      - तस्य ह नचिकेता नाम पुत्र आस
    iast: "uśan ha vai vājaśravasaḥ sarvavedasaṃ dadau | tasya ha naciketā nāma putra āsa"
  - id: '1.2'
    kind: verse
    lines:
      - तं ह कुमारं सन्तं दक्षिणासु नीयमानासु श्रद्धाविवेश
      - सोऽमन्यत
    iast: "taṃ ha kumāraṃ santaṃ dakṣiṇāsu nīyamānāsu śraddhāviveśa | so 'manyata"
  - id: '1.3'
    kind: verse
    lines:
      - पीतोदका जग्धतृणा दुग्धदोहा निरिन्द्रियाः
      - अनन्दा नाम ते लोकास्तान्स गच्छति ता ददत्
    iast: "pītodakā jagdhatṛṇā dugdhadohā nirindriyāḥ | anandā nāma te lokās tān sa gacchati tā dadat"
  - id: '1.4'
    kind: verse
    lines:
      - स होवाच पितरं तत कस्मै मां दास्यसीति
      - द्वितीयं तृतीयम्
      - तं होवाच मृत्यवे त्वा ददामीति
    iast: "sa hovāca pitaraṃ tata kasmai māṃ dāsyasīti | dvitīyaṃ tṛtīyam | taṃ hovāca mṛtyave tvā dadāmīti"
  - id: '1.5'
    kind: verse
    lines:
      - बहूनामेमि प्रथमो बहूनामेमि मध्यमः
      - किं स्विद्यमस्य कर्तव्यं यन्मयाद्य करिष्यति
    iast: "bahūnām emi prathamo bahūnām emi madhyamaḥ | kiṃ svid yamasya kartavyaṃ yan mayādya kariṣyati"
  - id: '1.6'
    kind: verse
    lines:
      - अनुपश्य यथा पूर्वे प्रतिपश्य तथापरे
      - सस्यमिव मर्त्यः पच्यते सस्यमिवाजायते पुनः
    iast: "anupaśya yathā pūrve pratipaśya tathāpare | sasyam iva martyaḥ pacyate sasyam ivājāyate punaḥ"
  - id: '1.7'
    kind: verse
    lines:
      - वैश्वानरः प्रविशति अतिथिर्ब्राह्मणो गृहान्
      - तस्यैतां शान्तिं कुर्वन्ति हर वैवस्वतोदकम्
    iast: "vaiśvānaraḥ praviśati atithir brāhmaṇo gṛhān | tasyaitāṃ śāntiṃ kurvanti hara vaivasvatodakam"
  - id: '1.8'
    kind: verse
    lines:
      - आशाप्रतीक्षे संगतं सूनृतां च इष्टापूर्ते पुत्रपशूंश्च सर्वान्
      - एतद्वृङ्क्ते पुरुषस्याल्पमेधसो यस्यानश्नन्वसति ब्राह्मणो गृहे
    iast: "āśāpratīkṣe saṃgataṃ sūnṛtāṃ ca iṣṭāpūrte putrapaśūṃś ca sarvān | etad vṛṅkte puruṣasyālpamedhaso yasyānaśnan vasati brāhmaṇo gṛhe"
  - id: '1.9'
    kind: verse
    lines:
      - तिस्रो रात्रीर्यदवत्सीर्गृहे मे अनश्नन्ब्रह्मन्नतिथिर्नमस्यः
      - नमस्तेऽस्तु ब्रह्मन्स्वस्ति मेऽस्तु तस्मात्प्रति त्रीन्वरान्वृणीष्व
    iast: "tisro rātrīr yad avatsīr gṛhe me anaśnan brahmann atithir namasyaḥ | namas te 'stu brahman svasti me 'stu tasmāt prati trīn varān vṛṇīṣva"
  - id: '1.10'
    kind: verse
    lines:
      - शान्तसङ्कल्पः सुमना यथा स्याद्वीतमन्युर्गौतमो माभि मृत्यो
      - त्वत्प्रसृष्टं माभिवदेत्प्रतीत एतत्त्रयाणां प्रथमं वरं वृणे
    iast: "śāntasaṅkalpaḥ sumanā yathā syād vītamanyur gautamo mābhi mṛtyo | tvatprasṛṣṭaṃ mābhivadet pratīta etat trayāṇāṃ prathamaṃ varaṃ vṛṇe"
  - id: '1.11'
    kind: verse
    lines:
      - यथा पुरस्ताद्भविता प्रतीत औद्दालकिरारुणिर्मत्प्रसृष्टः
      - सुखं रात्रीः शयिता वीतमन्युस्त्वां ददृशिवान्मृत्युमुखात्प्रमुक्तम्
    iast: "yathā purastād bhavitā pratīta auddālakir āruṇir matprasṛṣṭaḥ | sukhaṃ rātrīḥ śayitā vītamanyus tvāṃ dadṛśivān mṛtyumukhāt pramuktam"
  - id: '1.12'
    kind: verse
    lines:
      - स्वर्गे लोके न भयं किंचनास्ति न तत्र त्वं न जरया बिभेति
      - उभे तीर्त्वा अशनायापिपासे शोकातिगो मोदते स्वर्गलोके
    iast: "svarge loke na bhayaṃ kiṃcanāsti na tatra tvaṃ na jarayā bibheti | ubhe tīrtvā aśanāyāpipāse śokātigo modate svargaloke"
  - id: '1.13'
    kind: verse
    lines:
      - स त्वमग्निं स्वर्ग्यमध्येषि मृत्यो प्रब्रूहि तं श्रद्दधानाय मह्यम्
      - स्वर्गलोका अमृतत्वं भजन्त एतद्द्वितीयेन वृणे वरेण
    iast: "sa tvam agniṃ svargyam adhyeṣi mṛtyo prabrūhi taṃ śraddadhānāya mahyam | svargalokā amṛtatvaṃ bhajanta etad dvitīyena vṛṇe vareṇa"
  - id: '1.14'
    kind: verse
    lines:
      - प्र ते ब्रवीमि तदु मे निबोध स्वर्ग्यमग्निं नचिकेतः प्रजानन्
      - अनन्तलोकाप्तिमथो प्रतिष्ठां विद्धि त्वमेतं निहितं गुहायाम्
    iast: "pra te bravīmi tad u me nibodha svargyam agniṃ naciketaḥ prajānan | anantalokāptim atho pratiṣṭhāṃ viddhi tvam etaṃ nihitaṃ guhāyām"
  - id: '1.15'
    kind: verse
    lines:
      - लोकादिमग्निं तमुवाच तस्मै या इष्टका यावतीर्वा यथा वा
      - स चापि तत्प्रत्यवदद्यथोक्तमथास्य मृत्युः पुनराह तुष्टः
    iast: "lokādim agniṃ tam uvāca tasmai yā iṣṭakā yāvatīr vā yathā vā | sa cāpi tat pratyavadad yathoktam athāsya mṛtyuḥ punar āha tuṣṭaḥ"
  - id: '1.16'
    kind: verse
    lines:
      - तमब्रवीत्प्रीयमाणो महात्मा वरं तवेहाद्य ददामि भूयः
      - तवैव नाम्ना भवितायमग्निः सृङ्कां चेमामनेकरूपां गृहाण
    iast: "tam abravīt prīyamāṇo mahātmā varaṃ tavehādya dadāmi bhūyaḥ | tavaiva nāmnā bhavitāyam agniḥ sṛṅkāṃ cemām anekarūpāṃ gṛhāṇa"
  - id: '1.17'
    kind: verse
    lines:
      - त्रिणाचिकेतस्त्रिभिरेत्य सन्धिं त्रिकर्मकृत्तरति जन्ममृत्यू
      - ब्रह्मजज्ञं देवमीड्यं विदित्वा निचाय्येमां शान्तिमत्यन्तमेति
    iast: "triṇāciketas tribhir etya sandhiṃ trikarmakṛt tarati janmamṛtyū | brahmajajñaṃ devam īḍyaṃ viditvā nicāyyemāṃ śāntim atyantam eti"
  - id: '1.18'
    kind: verse
    lines:
      - त्रिणाचिकेतस्त्रयमेतद्विदित्वा य एवं विद्वांश्चिनुते नाचिकेतम्
      - स मृत्युपाशान्पुरतः प्रणोद्य शोकातिगो मोदते स्वर्गलोके
    iast: "triṇāciketas trayam etad viditvā ya evaṃ vidvāṃś cinute nāciketam | sa mṛtyupāśān purataḥ praṇodya śokātigo modate svargaloke"
  - id: '1.19'
    kind: verse
    lines:
      - एष तेऽग्निर्नचिकेतः स्वर्ग्यो यमवृणीथा द्वितीयेन वरेण
      - एतमग्निं तवैव प्रवक्ष्यन्ति जनासस्तृतीयं वरं नचिकेतो वृणीष्व
    iast: "eṣa te 'gnir naciketaḥ svargyo yam avṛṇīthā dvitīyena vareṇa | etam agniṃ tavaiva pravakṣyanti janāsas tṛtīyaṃ varaṃ naciketo vṛṇīṣva"
  - id: '1.20'
    kind: verse
    lines:
      - येयं प्रेते विचिकित्सा मनुष्ये अस्तीत्येके नायमस्तीति चैके
      - एतद्विद्यामनुशिष्टस्त्वयाहं वराणामेष वरस्तृतीयः
    iast: "yeyaṃ prete vicikitsā manuṣye astīty eke nāyam astīti caike | etad vidyām anuśiṣṭas tvayāhaṃ varāṇām eṣa varas tṛtīyaḥ"
  - id: '1.21'
    kind: verse
    lines:
      - देवैरत्रापि विचिकित्सितं पुरा न हि सुज्ञेयमणुरेष धर्मः
      - अन्यं वरं नचिकेतो वृणीष्व मा मोपरोत्सीरति मा सृजैनम्
    iast: "devair atrāpi vicikitsitaṃ purā na hi sujñeyam aṇur eṣa dharmaḥ | anyaṃ varaṃ naciketo vṛṇīṣva mā moparotsīr ati mā sṛjainam"
  - id: '1.22'
    kind: verse
    lines:
      - देवैरत्रापि विचिकित्सितं किल त्वं च मृत्यो यन्न सुज्ञेयमात्थ
      - वक्ता चास्य त्वादृगन्यो न लभ्यो नान्यो वरस्तुल्य एतस्य कश्चित्
    iast: "devair atrāpi vicikitsitaṃ kila tvaṃ ca mṛtyo yan na sujñeyam āttha | vaktā cāsya tvādṛg anyo na labhyo nānyo varas tulya etasya kaścit"
  - id: '1.23'
    kind: verse
    lines:
      - शतायुषः पुत्रपौत्रान्वृणीष्व बहून्पशून्हस्तिहिरण्यमश्वान्
      - भूमेर्महदायतनं वृणीष्व स्वयं च जीव शरदो यावदिच्छसि
    iast: "śatāyuṣaḥ putrapautrān vṛṇīṣva bahūn paśūn hastihiraṇyam aśvān | bhūmer mahad āyatanaṃ vṛṇīṣva svayaṃ ca jīva śarado yāvad icchasi"
  - id: '1.24'
    kind: verse
    lines:
      - एतत्तुल्यं यदि मन्यसे वरं वृणीष्व वित्तं चिरजीविकां च
      - महाभूमौ नचिकेतस्त्वमेधि कामानां त्वा कामभाजं करोमि
    iast: "etat tulyaṃ yadi manyase varaṃ vṛṇīṣva vittaṃ cirajīvikāṃ ca | mahābhūmau naciketas tvam edhi kāmānāṃ tvā kāmabhājaṃ karomi"
  - id: '1.25'
    kind: verse
    lines:
      - ये ये कामा दुर्लभा मर्त्यलोके सर्वान्कामांश्छन्दतः प्रार्थयस्व
      - इमा रामाः सरथाः सतूर्या न हीदृशा लम्भनीया मनुष्यैः
      - आभिर्मत्प्रत्ताभिः परिचारयस्व नचिकेतो मरणं मानुप्राक्षीः
    iast: "ye ye kāmā durlabhā martyaloke sarvān kāmāṃś chandataḥ prārthayasva | imā rāmāḥ sarathāḥ satūryā na hīdṛśā lambhanīyā manuṣyaiḥ | ābhir matprattābhiḥ paricārayasva naciketo maraṇaṃ mānuprākṣīḥ"
  - id: '1.26'
    kind: verse
    lines:
      - श्वोभावा मर्त्यस्य यदन्तकैतत्सर्वेन्द्रियाणां जरयन्ति तेजः
      - अपि सर्वं जीवितमल्पमेव तवैव वाहास्तव नृत्यगीते
    iast: "śvobhāvā martyasya yad antakaitat sarvendriyāṇāṃ jarayanti tejaḥ | api sarvaṃ jīvitam alpam eva tavaiva vāhās tava nṛtyagīte"
  - id: '1.27'
    kind: verse
    lines:
      - न वित्तेन तर्पणीयो मनुष्यो लप्स्यामहे वित्तमद्राक्ष्म चेत्त्वा
      - जीविष्यामो यावदीशिष्यसि त्वं वरस्तु मे वरणीयः स एव
    iast: "na vittena tarpaṇīyo manuṣyo lapsyāmahe vittam adrākṣma cet tvā | jīviṣyāmo yāvad īśiṣyasi tvaṃ varas tu me varaṇīyaḥ sa eva"
  - id: '1.28'
    kind: verse
    lines:
      - अजीर्यताममृतानामुपेत्य जीर्यन्मर्त्यः क्वधःस्थः प्रजानन्
      - अभिध्यायन्वर्णरतिप्रमोदानतिदीर्घे जीविते को रमेत
    iast: "ajīryatām amṛtānām upetya jīryan martyaḥ kvadhaḥsthaḥ prajānan | abhidhyāyan varṇaratipramodān atidīrghe jīvite ko rameta"
  - id: '1.29'
    kind: verse
    lines:
      - यस्मिन्निदं विचिकित्सन्ति मृत्यो यत्साम्पराये महति ब्रूहि नस्तत्
      - योऽयं वरो गूढमनुप्रविष्टो नान्यं तस्मान्नचिकेता वृणीते
    iast: "yasminn idaṃ vicikitsanti mṛtyo yat sāmparāye mahati brūhi nas tat | yo 'yaṃ varo gūḍham anupraviṣṭo nānyaṃ tasmān naciketā vṛṇīte"
  - id: '2.1'
    kind: verse
    lines:
      - अन्यच्छ्रेयोऽन्यदुतैव प्रेयस्ते उभे नानार्थे पुरुषं सिनीतः
      - तयोः श्रेय आददानस्य साधु भवति हीयतेऽर्थाद्य उ प्रेयो वृणीते
    iast: "anyac chreyo 'nyad utaiva preyas te ubhe nānārthe puruṣaṃ sinītaḥ | tayoḥ śreya ādadānasya sādhu bhavati hīyate 'rthād ya u preyo vṛṇīte"
  - id: '2.2'
    kind: verse
    lines:
      - श्रेयश्च प्रेयश्च मनुष्यमेतस्तौ संपरीत्य विविनक्ति धीरः
      - श्रेयो हि धीरोऽभि प्रेयसो वृणीते प्रेयो मन्दो योगक्षेमाद्वृणीते
    iast: "śreyaś ca preyaś ca manuṣyam etas tau saṃparītya vivinakti dhīraḥ | śreyo hi dhīro 'bhi preyaso vṛṇīte preyo mando yogakṣemād vṛṇīte"
  - id: '2.3'
    kind: verse
    lines:
      - स त्वं प्रियान्प्रियरूपांश्च कामानभिध्यायन्नचिकेतोऽत्यस्राक्षीः
      - नैतां सृङ्कां वित्तमयीमवाप्तो यस्यां मज्जन्ति बहवो मनुष्याः
    iast: "sa tvaṃ priyān priyarūpāṃś ca kāmān abhidhyāyan naciketo 'tyasrākṣīḥ | naitāṃ sṛṅkāṃ vittamayīm avāpto yasyāṃ majjanti bahavo manuṣyāḥ"
  - id: '2.4'
    kind: verse
    lines:
      - दूरमेते विपरीते विषूची अविद्या या च विद्येति ज्ञाता
      - विद्याभीप्सिनं नचिकेतसं मन्ये न त्वा कामा बहवोऽलोलुपन्त
    iast: "dūram ete viparīte viṣūcī avidyā yā ca vidyeti jñātā | vidyābhīpsinaṃ naciketasaṃ manye na tvā kāmā bahavo 'lolupanta"
  - id: '2.5'
    kind: verse
    lines:
      - अविद्यायामन्तरे वर्तमानाः स्वयं धीराः पण्डितं मन्यमानाः
      - दन्द्रम्यमाणाः परियन्ति मूढा अन्धेनैव नीयमाना यथान्धाः
    iast: "avidyāyām antare vartamānāḥ svayaṃ dhīrāḥ paṇḍitaṃ manyamānāḥ | dandramyamāṇāḥ pariyanti mūḍhā andhenaiva nīyamānā yathāndhāḥ"
  - id: '2.6'
    kind: verse
    lines:
      - न साम्परायः प्रतिभाति बालं प्रमाद्यन्तं वित्तमोहेन मूढम्
      - अयं लोको नास्ति पर इति मानी पुनः पुनर्वशमापद्यते मे
    iast: "na sāmparāyaḥ pratibhāti bālaṃ pramādyantaṃ vittamohena mūḍham | ayaṃ loko nāsti para iti mānī punaḥ punar vaśam āpadyate me"
  - id: '2.7'
    kind: verse
    lines:
      - श्रवणायापि बहुभिर्यो न लभ्यः शृण्वन्तोऽपि बहवो यं न विद्युः
      - आश्चर्यो वक्ता कुशलोऽस्य लब्धा आश्चर्यो ज्ञाता कुशलानुशिष्टः
    iast: "śravaṇāyāpi bahubhir yo na labhyaḥ śṛṇvanto 'pi bahavo yaṃ na vidyuḥ | āścaryo vaktā kuśalo 'sya labdhā āścaryo jñātā kuśalānuśiṣṭaḥ"
  - id: '2.8'
    kind: verse
    lines:
      - न नरेणावरेण प्रोक्त एष सुविज्ञेयो बहुधा चिन्त्यमानः
      - अनन्यप्रोक्ते गतिरत्र नास्त्यणीयान्ह्यतर्क्यमणुप्रमाणात्
    iast: "na nareṇāvareṇa prokta eṣa suvijñeyo bahudhā cintyamānaḥ | ananyaprokte gatir atra nāsty aṇīyān hy atarkyam aṇupramāṇāt"
  - id: '2.9'
    kind: verse
    lines:
      - नैषा तर्केण मतिरापनेया प्रोक्तान्येनैव सुज्ञानाय प्रेष्ठ
      - यां त्वमापः सत्यधृतिर्बतासि त्वादृङ्नो भूयान्नचिकेतः प्रेष्टा
    iast: "naiṣā tarkeṇa matir āpaneyā proktānyenaiva sujñānāya preṣṭha | yāṃ tvam āpaḥ satyadhṛtir batāsi tvādṛṅ no bhūyān naciketaḥ preṣṭā"
  - id: '2.10'
    kind: verse
    lines:
      - जानाम्यहं शेवधिरित्यनित्यं न ह्यध्रुवैः प्राप्यते हि ध्रुवं तत्
      - ततो मया नाचिकेतश्चितोऽग्निरनित्यैर्द्रव्यैः प्राप्तवानस्मि नित्यम्
    iast: "jānāmy ahaṃ śevadhir ity anityaṃ na hy adhruvaiḥ prāpyate hi dhruvaṃ tat | tato mayā nāciketaś cito 'gnir anityair dravyaiḥ prāptavān asmi nityam"
  - id: '2.11'
    kind: verse
    lines:
      - कामस्य आप्तिं जगतः प्रतिष्ठां क्रतोरनन्त्यमभयस्य पारम्
      - स्तोममहदुरुगायं प्रतिष्ठां दृष्ट्वा धृत्या धीरो नचिकेतोऽत्यस्राक्षीः
    iast: "kāmasya āptiṃ jagataḥ pratiṣṭhāṃ krator anantyam abhayasya pāram | stomamahad urugāyaṃ pratiṣṭhāṃ dṛṣṭvā dhṛtyā dhīro naciketo 'tyasrākṣīḥ"
  - id: '2.12'
    kind: verse
    lines:
      - तं दुर्दर्शं गूढमनुप्रविष्टं गुहाहितं गह्वरेष्ठं पुराणम्
      - अध्यात्मयोगाधिगमेन देवं मत्वा धीरो हर्षशोकौ जहाति
    iast: "taṃ durdarśaṃ gūḍham anupraviṣṭaṃ guhāhitaṃ gahvareṣṭhaṃ purāṇam | adhyātmayogādhigamena devaṃ matvā dhīro harṣaśokau jahāti"
  - id: '2.13'
    kind: verse
    lines:
      - एतच्छ्रुत्वा संपरिगृह्य मर्त्यः प्रवृह्य धर्म्यमणुमेतमाप्य
      - स मोदते मोदनीयं हि लब्ध्वा विवृतं सद्म नचिकेतसं मन्ये
    iast: "etac chrutvā saṃparigṛhya martyaḥ pravṛhya dharmyam aṇum etam āpya | sa modate modanīyaṃ hi labdhvā vivṛtaṃ sadma naciketasaṃ manye"
  - id: '2.14'
    kind: verse
    lines:
      - अन्यत्र धर्मादन्यत्राधर्मादन्यत्रास्मात्कृताकृतात्
      - अन्यत्र भूताच्च भव्याच्च यत्तत्पश्यसि तद्वद
    iast: "anyatra dharmād anyatrādharmād anyatrāsmāt kṛtākṛtāt | anyatra bhūtāc ca bhavyāc ca yat tat paśyasi tad vada"
  - id: '2.15'
    kind: verse
    lines:
      - सर्वे वेदा यत्पदमामनन्ति तपांसि सर्वाणि च यद्वदन्ति
      - यदिच्छन्तो ब्रह्मचर्यं चरन्ति तत्ते पदं संग्रहेण ब्रवीमि
      - ओमित्येतत्
    iast: "sarve vedā yat padam āmananti tapāṃsi sarvāṇi ca yad vadanti | yad icchanto brahmacaryaṃ caranti tat te padaṃ saṃgraheṇa bravīmi / | om ity etat"
  - id: '2.16'
    kind: verse
    lines:
      - एतद्ध्येवाक्षरं ब्रह्म एतद्ध्येवाक्षरं परम्
      - एतद्ध्येवाक्षरं ज्ञात्वा यो यदिच्छति तस्य तत्
    iast: "etad dhy evākṣaraṃ brahma etad dhy evākṣaraṃ param | etad dhy evākṣaraṃ jñātvā yo yad icchati tasya tat"
  - id: '2.17'
    kind: verse
    lines:
      - एतदालम्बनं श्रेष्ठमेतदालम्बनं परम्
      - एतदालम्बनं ज्ञात्वा ब्रह्मलोके महीयते
    iast: "etad ālambanaṃ śreṣṭham etad ālambanaṃ param | etad ālambanaṃ jñātvā brahmaloke mahīyate"
  - id: '2.18'
    kind: verse
    lines:
      - न जायते म्रियते वा विपश्चिन्नायं कुतश्चिन्न बभूव कश्चित्
      - अजो नित्यः शाश्वतोऽयं पुराणो न हन्यते हन्यमाने शरीरे
    iast: "na jāyate mriyate vā vipaścin nāyaṃ kutaścin na babhūva kaścit | ajo nityaḥ śāśvato 'yaṃ purāṇo na hanyate hanyamāne śarīre"
  - id: '2.19'
    kind: verse
    lines:
      - हन्ता चेन्मन्यते हन्तुं हतश्चेन्मन्यते हतम्
      - उभौ तौ न विजानीतो नायं हन्ति न हन्यते
    iast: "hantā cen manyate hantuṃ hataś cen manyate hatam | ubhau tau na vijānīto nāyaṃ hanti na hanyate"
  - id: '2.20'
    kind: verse
    lines:
      - अणोरणीयान्महतो महीयानात्मास्य जन्तोर्निहितो गुहायाम्
      - तमक्रतुः पश्यति वीतशोको धातुप्रसादान्महिमानमात्मनः
    iast: "aṇor aṇīyān mahato mahīyān ātmāsya jantor nihito guhāyām | tam akratuḥ paśyati vītaśoko dhātuprasādān mahimānam ātmanaḥ"
  - id: '2.21'
    kind: verse
    lines:
      - आसीनो दूरं व्रजति शयानो याति सर्वतः
      - कस्तं मदामदं देवं मदन्यो ज्ञातुमर्हति
    iast: "āsīno dūraṃ vrajati śayāno yāti sarvataḥ | kas taṃ madāmadaṃ devaṃ mad anyo jñātum arhati"
  - id: '2.22'
    kind: verse
    lines:
      - अशरीरं शरीरेषु अनवस्थेष्ववस्थितम्
      - महान्तं विभुमात्मानं मत्वा धीरो न शोचति
    iast: "aśarīraṃ śarīreṣu anavastheṣv avasthitam | mahāntaṃ vibhum ātmānaṃ matvā dhīro na śocati"
  - id: '2.23'
    kind: verse
    lines:
      - नायमात्मा प्रवचनेन लभ्यो न मेधया न बहुना श्रुतेन
      - यमेवैष वृणुते तेन लभ्यस्तस्यैष आत्मा विवृणुते तनूं स्वाम्
    iast: "nāyam ātmā pravacanena labhyo na medhayā na bahunā śrutena | yam evaiṣa vṛṇute tena labhyas tasyaiṣa ātmā vivṛṇute tanūṃ svām"
  - id: '2.24'
    kind: verse
    lines:
      - नाविरतो दुश्चरितान्नाशान्तो नासमाहितः
      - नाशान्तमानसो वापि प्रज्ञानेनैनमाप्नुयात्
    iast: "nāvirato duścaritān nāśānto nāsamāhitaḥ | nāśāntamānaso vāpi prajñānenainam āpnuyāt"
  - id: '2.25'
    kind: verse
    lines:
      - यस्य ब्रह्म च क्षत्रं च उभे भवत ओदनः
      - मृत्युर्यस्योपसेचनं क इत्था वेद यत्र सः
    iast: "yasya brahma ca kṣatraṃ ca ubhe bhavata odanaḥ | mṛtyur yasyopasecanaṃ ka itthā veda yatra saḥ"
  - id: '3.1'
    kind: verse
    lines:
      - ऋतं पिबन्तौ सुकृतस्य लोके गुहां प्रविष्टौ परमे परार्धे
      - छायातपौ ब्रह्मविदो वदन्ति पञ्चाग्नयो ये च त्रिणाचिकेताः
    iast: "ṛtaṃ pibantau sukṛtasya loke guhāṃ praviṣṭau parame parārdhe | chāyātapau brahmavido vadanti pañcāgnayo ye ca triṇāciketāḥ"
  - id: '3.2'
    kind: verse
    lines:
      - यः सेतुरीजानानामक्षरं ब्रह्म यत्परम्
      - अभयं तितीर्षतां पारं नाचिकेतं शकेमहि
    iast: "yaḥ setur ījānānām akṣaraṃ brahma yat param | abhayaṃ titīrṣatāṃ pāraṃ nāciketaṃ śakemahi"
  - id: '3.3'
    kind: verse
    lines:
      - आत्मानं रथिनं विद्धि शरीरं रथमेव तु
      - बुद्धिं तु सारथिं विद्धि मनः प्रग्रहमेव च
    iast: "ātmānaṃ rathinaṃ viddhi śarīraṃ ratham eva tu | buddhiṃ tu sārathiṃ viddhi manaḥ pragraham eva ca"
  - id: '3.4'
    kind: verse
    lines:
      - इन्द्रियाणि हयानाहुर्विषयांस्तेषु गोचरान्
      - आत्मेन्द्रियमनोयुक्तं भोक्तेत्याहुर्मनीषिणः
    iast: "indriyāṇi hayān āhur viṣayāṃs teṣu gocarān | ātmendriyamanoyuktaṃ bhoktety āhur manīṣiṇaḥ"
  - id: '3.5'
    kind: verse
    lines:
      - यस्त्वविज्ञानवान्भवत्ययुक्तेन मनसा सदा
      - तस्येन्द्रियाण्यवश्यानि दुष्टाश्वा इव सारथेः
    iast: "yas tv avijñānavān bhavaty ayuktena manasā sadā | tasyendriyāṇy avaśyāni duṣṭāśvā iva sāratheḥ"
  - id: '3.6'
    kind: verse
    lines:
      - यस्तु विज्ञानवान्भवति युक्तेन मनसा सदा
      - तस्येन्द्रियाणि वश्यानि सदश्वा इव सारथेः
    iast: "yas tu vijñānavān bhavati yuktena manasā sadā | tasyendriyāṇi vaśyāni sadaśvā iva sāratheḥ"
  - id: '3.7'
    kind: verse
    lines:
      - यस्त्वविज्ञानवान्भवत्यमनस्कः सदाशुचिः
      - न स तत्पदमाप्नोति संसारं चाधिगच्छति
    iast: "yas tv avijñānavān bhavaty amanaskaḥ sadāśuciḥ | na sa tat padam āpnoti saṃsāraṃ cādhigacchati"
  - id: '3.8'
    kind: verse
    lines:
      - यस्तु विज्ञानवान्भवति समनस्कः सदा शुचिः
      - स तु तत्पदमाप्नोति यस्माद्भूयो न जायते
    iast: "yas tu vijñānavān bhavati samanaskaḥ sadā śuciḥ | sa tu tat padam āpnoti yasmād bhūyo na jāyate"
  - id: '3.9'
    kind: verse
    lines:
      - विज्ञानसारथिर्यस्तु मनः प्रग्रहवान्नरः
      - सोऽध्वनः पारमाप्नोति तद्विष्णोः परमं पदम्
    iast: "vijñānasārathir yas tu manaḥ pragrahavān naraḥ | so 'dhvanaḥ pāram āpnoti tad viṣṇoḥ paramaṃ padam"
  - id: '3.10'
    kind: verse
    lines:
      - इन्द्रियेभ्यः परा ह्यर्था अर्थेभ्यश्च परं मनः
      - मनसस्तु परा बुद्धिर्बुद्धेरात्मा महान्परः
    iast: "indriyebhyaḥ parā hy arthā arthebhyaś ca paraṃ manaḥ | manasas tu parā buddhir buddher ātmā mahān paraḥ"
  - id: '3.11'
    kind: verse
    lines:
      - महतः परमव्यक्तमव्यक्तात्पुरुषः परः
      - पुरुशान्न परं किंचित्सा काष्ठा सा परा गतिः
    iast: "mahataḥ param avyaktam avyaktāt puruṣaḥ paraḥ | puruśān na paraṃ kiṃcit sā kāṣṭhā sā parā gatiḥ"
  - id: '3.12'
    kind: verse
    lines:
      - एष सर्वेषु भूतेषु गूढोऽत्मा न प्रकाशते
      - दृष्यते त्वग्र्यया बुद्ध्या सूक्ष्मया सूक्ष्मदर्शिभिः
    iast: "eṣa sarveṣu bhūteṣu gūḍho 'tmā na prakāśate | dṛṣyate tv agryayā buddhyā sūkṣmayā sūkṣmadarśibhiḥ"
  - id: '3.13'
    kind: verse
    lines:
      - यच्छेद्वाङ्मनसी प्राज्ञस्तद्यच्छेज्ज्ञान आत्मनि
      - ज्ञानमात्मनि महति नियच्छेत्तद्यच्छेच्छान्त आत्मनि
    iast: "yacched vāṅmanasī prājñas tad yacchej jñāna ātmani | jñānam ātmani mahati niyacchet tad yacchec chānta ātmani"
  - id: '3.14'
    kind: verse
    lines:
      - उत्तिष्ठत जाग्रत प्राप्य वरान्निबोधत
      - क्षुरस्य धारा निशिता दुरत्यया दुर्गं पथस्तत्कवयो वदन्ति
    iast: "uttiṣṭhata jāgrata prāpya varān nibodhata | kṣurasya dhārā niśitā duratyayā durgaṃ pathas tat kavayo vadanti"
  - id: '3.15'
    kind: verse
    lines:
      - अशब्दमस्पर्शमरूपमव्ययं तथारसं नित्यमगन्धवच्च यत्
      - अनाद्यनन्तं महतः परं ध्रुवं निचाय्य तन्मृत्युमुखात्प्रमुच्यते
    iast: "aśabdam asparśam arūpam avyayaṃ tathārasaṃ nityam agandhavac ca yat | anādy anantaṃ mahataḥ paraṃ dhruvaṃ nicāyya tan mṛtyumukhāt pramucyate"
  - id: '3.16'
    kind: verse
    lines:
      - नाचिकेतमुपाख्यानं मृत्युप्रोक्तं सनातनम्
      - उक्त्वा श्रुत्वा च मेधावी ब्रह्मलोके महीयते
    iast: "nāciketam upākhyānaṃ mṛtyuproktaṃ sanātanam | uktvā śrutvā ca medhāvī brahmaloke mahīyate"
  - id: '3.17'
    kind: verse
    lines:
      - य इमं परमं गुह्यं श्रावयेद्ब्रह्मसंसदि
      - प्रयतः श्राद्धकाले वा तदानन्त्याय कल्पते
      - तदानन्त्याय कल्पत इति
    iast: "ya imaṃ paramaṃ guhyaṃ śrāvayed brahmasaṃsadi | prayataḥ śrāddhakāle vā tad ānantyāya kalpate | tad ānantyāya kalpata iti"
  - id: '4.1'
    kind: verse
    lines:
      - पराञ्चि खानि व्यतृणत्स्वयंभूस्तस्मात्पराङ्पश्यति नान्तरात्मन्
      - कश्चिद्धीरः प्रत्यगात्मानमैक्षदावृत्तचक्षुरमृतत्वमिच्छन्
    iast: "parāñci khāni vyatṛṇat svayaṃbhūs tasmāt parāṅ paśyati nāntarātman | kaścid dhīraḥ pratyag ātmānam aikṣad āvṛttacakṣur amṛtatvam icchan"
  - id: '4.2'
    kind: verse
    lines:
      - पराचः कामाननुयन्ति बालास्ते मृत्योर्यन्ति विततस्य पाशम्
      - अथ धीरा अमृतत्वं विदित्वा ध्रुवमध्रुवेष्विह न प्रार्थयन्ते
    iast: "parācaḥ kāmān anuyanti bālās te mṛtyor yanti vitatasya pāśam | atha dhīrā amṛtatvaṃ viditvā dhruvam adhruveṣv iha na prārthayante"
  - id: '4.3'
    kind: verse
    lines:
      - येन रूपं रसं गन्धं शब्दान्स्पर्शींश्च मैथुनान्
      - एतेनैव विजानाति किमत्र परिशिष्यते
      - एतद्वै तत्
    iast: "yena rūpaṃ rasaṃ gandhaṃ śabdān sparśīṃś ca maithunān | etenaiva vijānāti kim atra pariśiṣyate / | etad vai tat"
  - id: '4.4'
    kind: verse
    lines:
      - स्वप्नान्तं जागरितान्तं चोभौ येनानुपश्यति
      - महान्तं विभुमात्मानं मत्वा धीरो न शोचति
    iast: "svapnāntaṃ jāgaritāntaṃ cobhau yenānupaśyati | mahāntaṃ vibhum ātmānaṃ matvā dhīro na śocati"
  - id: '4.5'
    kind: verse
    lines:
      - य इमं मध्वदं वेद आत्मानं जीवमन्तिकात्
      - ईशानं भूतभव्यस्य न ततो विजुगुप्सते
      - एतद्वै तत्
    iast: "ya imaṃ madhvadaṃ veda ātmānaṃ jīvam antikāt | īśānaṃ bhūtabhavyasya na tato vijugupsate / | etad vai tat"
  - id: '4.6'
    kind: verse
    lines:
      - यः पूर्वं तपसो जातमद्भ्यः पूर्वमजायत
      - गुहां प्रविश्य तिष्ठन्तं यो भूतेभिर्व्यपश्यत
      - एतद्वै तत्
    iast: "yaḥ pūrvaṃ tapaso jātam adbhyaḥ pūrvam ajāyata | guhāṃ praviśya tiṣṭhantaṃ yo bhūtebhir vyapaśyata / | etad vai tat"
  - id: '4.7'
    kind: verse
    lines:
      - या प्राणेन संभवति अदितिर्देवतामयी
      - गुहां प्रविश्य तिष्ठन्तीं या भूतेभिर्व्यजायत
      - एतद्वै तत्
    iast: "yā prāṇena saṃbhavati aditir devatāmayī | guhāṃ praviśya tiṣṭhantīṃ yā bhūtebhir vyajāyata / | etad vai tat"
  - id: '4.8'
    kind: verse
    lines:
      - अरण्योर्निहितो जातवेदा गर्भ इव सुभृतो गर्भिणीभिः
      - दिवेदिव ईड्यो जागृवद्भिर्हविष्मद्भिर्मनुष्येभिरग्निः
      - एतद्वै तत्
    iast: "araṇyor nihito jātavedā garbha iva subhṛto garbhiṇībhiḥ | divediva īḍyo jāgṛvadbhir haviṣmadbhir manuṣyebhir agniḥ / | etad vai tat"
  - id: '4.9'
    kind: verse
    lines:
      - यतश्चोदेति सूर्यो अस्तं यत्र च गच्छति
      - तं देवाः सर्वे अर्पितास्तदु नात्येति कश्चन
      - एतद्वै तत्
    iast: "yataś codeti sūryo astaṃ yatra ca gacchati | taṃ devāḥ sarve arpitās tad u nātyeti kaścana / | etad vai tat"
  - id: '4.10'
    kind: verse
    lines:
      - यदेवेह तदमुत्र यदमुत्र तदन्विह
      - मृत्योः स मृत्युमाप्नोति य इह नानेव पश्यति
    iast: "yad eveha tad amutra yad amutra tad anv iha | mṛtyoḥ sa mṛtyum āpnoti ya iha nāneva paśyati"
  - id: '4.11'
    kind: verse
    lines:
      - मनसैवेदमाप्तव्यं नेह नानास्ति किंचन
      - मृत्योः स मृत्युं गच्छति य इह नानेव पश्यति
    iast: "manasaivedam āptavyaṃ neha nānāsti kiṃcana | mṛtyoḥ sa mṛtyuṃ gacchati ya iha nāneva paśyati"
  - id: '4.12'
    kind: verse
    lines:
      - अङ्गुष्ठमात्रः पुरुषो मध्य आत्मनि तिष्ठति
      - ईशानो भूतभव्यस्य न ततो विजुगुप्सते
      - एतद्वै तत्
    iast: "aṅguṣṭhamātraḥ puruṣo madhya ātmani tiṣṭhati | īśāno bhūtabhavyasya na tato vijugupsate / | etad vai tat"
  - id: '4.13'
    kind: verse
    lines:
      - अङ्गुष्ठमात्रः पुरुषो ज्योतिरिव अधूमकः
      - ईशानो भूतभव्यस्य स एवाद्य स उ श्वः
      - एतद्वै तत्
    iast: "aṅguṣṭhamātraḥ puruṣo jyotir iva adhūmakaḥ | īśāno bhūtabhavyasya sa evādya sa u śvaḥ / | etad vai tat"
  - id: '4.14'
    kind: verse
    lines:
      - यथोदकं दुर्गे वृष्टं पर्वतेषु विधावति
      - एवं धर्मान्पृथक्पश्यंस्तानेवानु विधावति
    iast: "yathodakaṃ durge vṛṣṭaṃ parvateṣu vidhāvati | evaṃ dharmān pṛthak paśyaṃs tān evānu vidhāvati"
  - id: '4.15'
    kind: verse
    lines:
      - यथोदकं शुद्धे शुद्धमासिक्तं तादृगेव भवति
      - एवं मुनेर्विजानत आत्मा भवति गौतम
    iast: "yathodakaṃ śuddhe śuddham āsiktaṃ tādṛg eva bhavati | evaṃ muner vijānata ātmā bhavati gautama"
  - id: '5.1'
    kind: verse
    lines:
      - पुरमेकादशद्वारमजस्यावक्रचेतसः
      - अनुष्ठाय न शोचति विमुक्तश्च विमुच्यते
      - एतद्वै तत्
    iast: "puram ekādaśadvāram ajasyāvakracetasaḥ | anuṣṭhāya na śocati vimuktaś ca vimucyate / | etad vai tat"
  - id: '5.2'
    kind: verse
    lines:
      - हंसः शुचिषद्वसुरन्तरिक्षसद्धोता वेदिषदतिथिर्दुरोणसत्
      - नृषद्वरसदृतसद्व्योमसदब्जा गोजा ऋतजा अद्रिजा ऋतं बृहत्
    iast: "haṃsaḥ śuciṣad vasur antarikṣasad dhotā vediṣad atithir duroṇasat | nṛṣad varasad ṛtasad vyomasad abjā gojā ṛtajā adrijā ṛtaṃ bṛhat"
  - id: '5.3'
    kind: verse
    lines:
      - ऊर्ध्वं प्राणमुन्नयति अपानं प्रत्यगस्यति
      - मध्ये वामनमासीनं विश्वे देवा उपासते
    iast: "ūrdhvaṃ prāṇam unnayati apānaṃ pratyag asyati | madhye vāmanam āsīnaṃ viśve devā upāsate"
  - id: '5.4'
    kind: verse
    lines:
      - अस्य विस्रंसमानस्य शरीरस्थस्य देहिनः
      - देहाद्विमुच्यमानस्य किमत्र परिशिष्यते
      - एतद्वै तत्
    iast: "asya visraṃsamānasya śarīrasthasya dehinaḥ | dehād vimucyamānasya kim atra pariśiṣyate / | etad vai tat"
  - id: '5.5'
    kind: verse
    lines:
      - न प्राणेन नापानेन मर्त्यो जीवति कश्चन
      - इतरेण तु जीवन्ति यस्मिन्नेतावुपाश्रितौ
    iast: "na prāṇena nāpānena martyo jīvati kaścana | itareṇa tu jīvanti yasminn etāv upāśritau"
  - id: '5.6'
    kind: verse
    lines:
      - हन्त त इदं प्रवक्ष्यामि गुह्यं ब्रह्म सनातनम्
      - यथा च मरणं प्राप्य आत्मा भवति गौतम
    iast: "hanta ta idaṃ pravakṣyāmi guhyaṃ brahma sanātanam | yathā ca maraṇaṃ prāpya ātmā bhavati gautama"
  - id: '5.7'
    kind: verse
    lines:
      - योनिमन्ये प्रपद्यन्ते शरीरत्वाय देहिनः
      - स्थाणुमन्येऽनुसंयन्ति यथाकर्म यथाश्रुतम्
    iast: "yonim anye prapadyante śarīratvāya dehinaḥ | sthāṇum anye 'nusaṃyanti yathākarma yathāśrutam"
  - id: '5.8'
    kind: verse
    lines:
      - य एष सुप्तेषु जागर्ति कामं कामं पुरुषो निर्मिमाणः
      - तदेव शुक्रं तद्ब्रह्म तदेवामृतमुच्यते
      - तस्मिंल्लोकाः श्रिताः सर्वे तदु नात्येति कश्चन
      - एतद्वै तत्
    iast: "ya eṣa supteṣu jāgarti kāmaṃ kāmaṃ puruṣo nirmimāṇaḥ | tad eva śukraṃ tad brahma tad evāmṛtam ucyate | tasmiṃl lokāḥ śritāḥ sarve tad u nātyeti kaścana / | etad vai tat"
  - id: '5.9'
    kind: verse
    lines:
      - अग्निर्यथैको भुवनं प्रविष्टो रूपं रूपं प्रतिरूपो बभूव
      - एकस्तथा सर्वभूतान्तरात्मा रूपं रूपं प्रतिरूपो बहिश्च
    iast: "agnir yathaiko bhuvanaṃ praviṣṭo rūpaṃ rūpaṃ pratirūpo babhūva | ekas tathā sarvabhūtāntarātmā rūpaṃ rūpaṃ pratirūpo bahiś ca"
  - id: '5.10'
    kind: verse
    lines:
      - वायुर्यथैको भुवनं प्रविष्टो रूपं रूपं प्रतिरूपो बभूव
      - एकस्तथा सर्वभूतान्तरात्मा रूपं रूपं प्रतिरूपो बहिश्च
    iast: "vāyur yathaiko bhuvanaṃ praviṣṭo rūpaṃ rūpaṃ pratirūpo babhūva | ekas tathā sarvabhūtāntarātmā rūpaṃ rūpaṃ pratirūpo bahiś ca"
  - id: '5.11'
    kind: verse
    lines:
      - सूर्यो यथा सर्वलोकस्य चक्षुर्न लिप्यते चाक्षुषैर्बाह्यदोषैः
      - एकस्तथा सर्वभूतान्तरात्मा न लिप्यते लोकदुःखेन बाह्यः
    iast: "sūryo yathā sarvalokasya cakṣur na lipyate cākṣuṣair bāhyadoṣaiḥ | ekas tathā sarvabhūtāntarātmā na lipyate lokaduḥkhena bāhyaḥ"
  - id: '5.12'
    kind: verse
    lines:
      - एको वशी सर्वभूतान्तरात्मा एकं रूपं बहुधा यः करोति
      - तमात्मस्थं येऽनुपश्यन्ति धीरास्तेषां सुखं शाश्वतं नेतरेषाम्
    iast: "eko vaśī sarvabhūtāntarātmā ekaṃ rūpaṃ bahudhā yaḥ karoti | tam ātmasthaṃ ye 'nupaśyanti dhīrās teṣāṃ sukhaṃ śāśvataṃ netareṣām"
  - id: '5.13'
    kind: verse
    lines:
      - नित्योऽनित्यानां चेतनश्चेतनानामेको बहूनां यो विदधाति कामान्
      - तमात्मस्थं येऽनुपश्यन्ति धीरास्तेषं शान्तिः शाश्वती नेतरेषाम्
    iast: "nityo 'nityānāṃ cetanaś cetanānām eko bahūnāṃ yo vidadhāti kāmān | tam ātmasthaṃ ye 'nupaśyanti dhīrās teṣaṃ śāntiḥ śāśvatī netareṣām"
  - id: '5.14'
    kind: verse
    lines:
      - तदेतदिति मन्यन्तेऽनिर्देश्यं परमं सुखम्
      - कथं नु तद्विजानीयां किमु भाति विभाति वा
    iast: "tad etad iti manyante 'nirdeśyaṃ paramaṃ sukham | kathaṃ nu tad vijānīyāṃ kim u bhāti vibhāti vā"
  - id: '5.15'
    kind: verse
    lines:
      - न तत्र सूर्यो भाति न चन्द्रतारकं नेमा विद्युतो भान्ति कुतोऽयमग्निः
      - तमेव भान्तमनु भाति सर्वं तस्य भासा सर्वमिदं विभाति
    iast: "na tatra sūryo bhāti na candratārakaṃ nemā vidyuto bhānti kuto 'yam agniḥ | tam eva bhāntam anu bhāti sarvaṃ tasya bhāsā sarvam idaṃ vibhāti"
  - id: '6.1'
    kind: verse
    lines:
      - ऊर्ध्वमूलो अवाक्शाख एषोऽश्वत्थः सनातनः
      - तदेव शुक्रं तद्ब्रह्म तदेवामृतमुच्यते
      - तस्मिंल्लोकाः श्रिताः सर्वे तदु नात्येति कश्चन
      - एतद्वै तत्
    iast: "ūrdhvamūlo avākśākha eṣo 'śvatthaḥ sanātanaḥ | tad eva śukraṃ tad brahma tad evāmṛtam ucyate | tasmiṃl lokāḥ śritāḥ sarve tad u nātyeti kaścana / | etad vai tat"
  - id: '6.2'
    kind: verse
    lines:
      - यदिदं किंच जगत्सर्वं प्राण एजति निःसृतम्
      - महद्भयं वज्रमुद्यतं य एतद्विदुरमृतास्ते भवन्ति
    iast: "yad idaṃ kiṃca jagat sarvaṃ prāṇa ejati niḥsṛtam | mahad bhayaṃ vajram udyataṃ ya etad vidur amṛtās te bhavanti"
  - id: '6.3'
    kind: verse
    lines:
      - भयादस्याग्निस्तपति भयात्तपति सूर्यः
      - भयादिन्द्रश्च वायुश्च मृत्युर्धावति पञ्चमः
    iast: "bhayād asyāgnis tapati bhayāt tapati sūryaḥ | bhayād indraś ca vāyuś ca mṛtyur dhāvati pañcamaḥ"
  - id: '6.4'
    kind: verse
    lines:
      - इह चेदशकद्बोद्धुं प्राक्शरीरस्य विस्रसः
      - ततः सर्गेषु लोकेषु शरीरत्वाय कल्पते
    iast: "iha ced aśakad boddhuṃ prākśarīrasya visrasaḥ | tataḥ sargeṣu lokeṣu śarīratvāya kalpate"
  - id: '6.5'
    kind: verse
    lines:
      - यथादर्शे तथात्मनि यथा स्वप्ने तथा पितृलोके
      - यथाप्सु परीव ददृशे तथा गन्धर्वलोके छायातपयोरिव ब्रह्मलोके
    iast: "yathādarśe tathātmani yathā svapne tathā pitṛloke | yathāpsu parīva dadṛśe tathā gandharvaloke chāyātapayor iva brahmaloke"
  - id: '6.6'
    kind: verse
    lines:
      - इन्द्रियाणां पृथग्भावमुदयास्तमयौ च यत्
      - पृथगुत्पद्यमानानां मत्वा धीरो न शोचति
    iast: "indriyāṇāṃ pṛthagbhāvam udayāstamayau ca yat | pṛthag utpadyamānānāṃ matvā dhīro na śocati"
  - id: '6.7'
    kind: verse
    lines:
      - इन्द्रियेभ्यः परं मनो मनसः सत्त्वमुत्तमम्
      - सत्त्वादधि महानात्मा महतोऽव्यक्तमुत्तमम्
    iast: "indriyebhyaḥ paraṃ mano manasaḥ sattvam uttamam | sattvād adhi mahānātmā mahato 'vyaktam uttamam"
  - id: '6.8'
    kind: verse
    lines:
      - अव्यक्तात्तु परः पुरुषो व्यापकोऽलिङ्ग एव च
      - यं ज्ञात्वा मुच्यते जन्तुरमृतत्वं च गच्छति
    iast: "avyaktāt tu paraḥ puruṣo vyāpako 'liṅga eva ca | yaṃ jñātvā mucyate jantur amṛtatvaṃ ca gacchati"
  - id: '6.9'
    kind: verse
    lines:
      - न संदृशे तिष्ठति रूपमस्य न चक्षुषा पश्यति कश्चनैनम्
      - हृदा मनीषा मनसाभिकॢप्तो य एतद्विदुरमृतास्ते भवन्ति
    iast: "na saṃdṛśe tiṣṭhati rūpam asya na cakṣuṣā paśyati kaścanainam | hṛdā manīṣā manasābhikḷpto ya etad vidur amṛtās te bhavanti"
  - id: '6.10'
    kind: verse
    lines:
      - यदा पञ्चावतिष्ठन्ते ज्ञानानि मनसा सह
      - बुद्धिश्च न विचेष्टति तामाहुः परमां गतिम्
    iast: "yadā pañcāvatiṣṭhante jñānāni manasā saha | buddhiś ca na viceṣṭati tām āhuḥ paramāṃ gatim"
  - id: '6.11'
    kind: verse
    lines:
      - तां योगमिति मन्यन्ते स्थिरामिन्द्रियधारणाम्
      - अप्रमत्तस्तदा भवति योगो हि प्रभवाप्ययौ
    iast: "tāṃ yogam iti manyante sthirām indriyadhāraṇām | apramattas tadā bhavati yogo hi prabhavāpyayau"
  - id: '6.12'
    kind: verse
    lines:
      - नैव वाचा न मनसा प्राप्तुं शक्यो न चक्षुषा
      - अस्तीति ब्रुवतोऽन्यत्र कथं तदुपलभ्यते
    iast: "naiva vācā na manasā prāptuṃ śakyo na cakṣuṣā | astīti bruvato 'nyatra kathaṃ tad upalabhyate"
  - id: '6.13'
    kind: verse
    lines:
      - अस्तीत्येवोपलब्धव्यस्तत्त्वभावेन चोभयोः
      - अस्तीत्येवोपलब्धस्य तत्त्वभावः प्रसीदति
    iast: "astīty evopalabdhavyas tattvabhāvena cobhayoḥ | astīty evopalabdhasya tattvabhāvaḥ prasīdati"
  - id: '6.14'
    kind: verse
    lines:
      - यदा सर्वे प्रमुच्यन्ते कामा येऽस्य हृदि श्रिताः
      - अथ मर्त्योऽमृतो भवत्यत्र ब्रह्म समश्नुते
    iast: "yadā sarve pramucyante kāmā ye 'sya hṛdi śritāḥ | atha martyo 'mṛto bhavaty atra brahma samaśnute"
  - id: '6.15'
    kind: verse
    lines:
      - यदा सर्वे प्रभिद्यन्ते हृदयस्येह ग्रन्थयः
      - अथ मर्त्योऽमृतो भवत्येतावद्ध्यनुशासनम्
    iast: "yadā sarve prabhidyante hṛdayasyeha granthayaḥ | atha martyo 'mṛto bhavaty etāvad dhy anuśāsanam"
  - id: '6.16'
    kind: verse
    lines:
      - शतं चैका च हृदयस्य नाड्यस्तासां मूर्धानमभिनिःसृतैका
      - तयोर्ध्वमायन्नमृतत्वमेति विष्वङ्ङन्या उत्क्रमणे भवति
    iast: "śataṃ caikā ca hṛdayasya nāḍyas tāsāṃ mūrdhānam abhiniḥsṛtaikā | tayordhvam āyann amṛtatvam eti viṣvaṅṅ anyā utkramaṇe bhavati"
  - id: '6.17'
    kind: verse
    lines:
      - अङ्गुष्ठमात्रः पुरुषोऽन्तरात्मा सदा जनानां हृदये संनिविष्टः
      - तं स्वाच्छरीरात्प्रवृहेन्मुञ्जादिवेषीकां धैर्येण
      - तं विद्याच्छुक्रममृतं तं विद्याच्छुक्रममृतमिति
    iast: "aṅguṣṭhamātraḥ puruṣo 'ntarātmā sadā janānāṃ hṛdaye saṃniviṣṭaḥ | taṃ svāc charīrāt pravṛhen muñjād iveṣīkāṃ dhairyeṇa | taṃ vidyāc chukram amṛtaṃ taṃ vidyāc chukram amṛtam iti"
  - id: '6.18'
    kind: verse
    lines:
      - मृत्युप्रोक्तां नचिकेतोऽथ लब्ध्वा विद्यामेतां योगविधिं च कृत्स्नम्
      - ब्रह्मप्राप्तो विरजोऽभूद्विमृत्युरन्योऽप्येवं यो विदध्यात्ममेव
    iast: "mṛtyuproktāṃ naciketo 'tha labdhvā vidyām etāṃ yogavidhiṃ ca kṛtsnam | brahmaprāpto virajo 'bhūd vimṛtyur anyo 'py evaṃ yo vid adhyātmam eva"
