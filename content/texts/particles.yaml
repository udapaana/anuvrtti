# The glosses of common indeclinables, for every whole text.
#
# AUTHORED. Monier-Williams's first sense, which a whole text otherwise shows
# for a word nobody glossed, is a poor gloss for a particle: वा's entry opens
# with the root वा "to blow", हि's with the root हि "to impel", and अपि's and
# यदि's run on into grammatical remarks. A pada analysed as अव्यय with one of
# these lemmas takes the gloss here, unless its text's overrides give one.
# scripts/build-texts.ts reads it.
अपि: even, also
अथ: then, now
इति: thus (closing a quotation or thought)
इव: like, as if
उत: or; and
एव: just, only, indeed
किम्: (marks a question)
कुतः: whence? why?
खलु: indeed, surely
च: and
चेत्: if
तत्र: there
तथा: so, thus
तदा: then
तु: but
न: not
ननु: surely, is it not so?
नु: now, indeed
पुनर्: again; but
मा: do not
यत्र: where
यथा: as, just as
यदा: when
यदि: if
वा: or
हि: for, because; indeed
नाम: by name, called; indeed
