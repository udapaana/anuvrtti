      - युधिष्ठिर उवाच
    iast: "asti te vai priyā rājan glaha eko'parājitaḥ | paṇasva kṛṣṇāṃ pāñcālīṃ tayātmānaṃ punarjaya | yudhiṣṭhira uvāca"
  - id: 'sabha-2-88-36'
    kind: verse
    lines:
