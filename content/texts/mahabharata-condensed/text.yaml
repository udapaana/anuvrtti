    iast: "śiro gṛhītvā viduro gatasatva ivābhavat | āste dhyāyannadhovaktro niḥ śvasanniva pannagaḥ"
  - id: 'sabha-2-88-44'
    kind: verse
    lines:
      - धृतराष्ट्रस्तु संहृष्टः पर्यपृच्छत्पुनः पुनः
