    iast: "jaharṣa karṇo'tibhṛśaṃ saha duḥśāsanādibhiḥ | itareṣāṃ tu sabhyānāṃ netrebhyaḥ prāpatañjalam"
  - id: 'sabha-2-88-46'
    kind: verse
    lines:
