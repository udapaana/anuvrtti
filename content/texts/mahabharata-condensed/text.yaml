    iast: "evamuktvā tu tānakṣāñśakuniḥ pratyadīvyata | jitamityeva śakuniryudhiṣṭhiramabhāṣata | yudhiṣṭhira uvāca"
  - id: 'sabha-2-88-15'
    kind: verse
    lines:
