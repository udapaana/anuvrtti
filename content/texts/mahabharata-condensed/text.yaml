    iast: "bahuvittaṃ parājaiṣīrbhrātṝṃśca sahayadvipān | ācakṣva vittaṃ kaunteya yadi te'styaparājitam | yudhiṣṭhira uvāca"
  - id: 'sabha-2-88-28'
    kind: verse
    lines:
