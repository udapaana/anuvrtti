    iast: "cukṣubhe sā sabhā rājanrājñāṃ sañjatrire śucaḥ | bhīṣmadroṇakṛpādīnāṃ svedaśca samajāyata"
  - id: 'sabha-2-88-42'
    kind: verse
    lines:
