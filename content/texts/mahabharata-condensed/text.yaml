    iast: "dhṛtarāṣṭrastu saṃhṛṣṭaḥ paryapṛcchatpunaḥ punaḥ | kiṃ jitaṃ kiṃ jitamiti hyākāraṃ nābhyarakṣata"
  - id: 'sabha-2-88-45'
    kind: verse
    lines:
