    iast: "tayaivaṃvidhayā rājanpāñcālyāhaṃ sumadhyamā | glahaṃ dīvyāmi cārvaṅgyā draupadyā hanta saubala | vaiśampāyana uvāca"
  - id: 'sabha-2-88-40'
    kind: verse
    lines:
