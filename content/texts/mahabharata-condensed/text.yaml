    iast: "etatpāpiṣṭhamakaroryadātmānaṃ parājayeḥ | śiṣṭe sati dhane rājanpāpa ātmaparājayaḥ | vaiśampāyana uvāca"
  - id: 'sabha-2-88-32'
    kind: verse
    lines:
