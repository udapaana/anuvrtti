sections:
  - id: 'adi-1-1-1'
    kind: verse
    lines:
      - नारायणं नमस्कृत्य नरं चैव नरोत्तमम्
      - देवीं सरस्वतीं चैव ततो जयमुदीरयेत्
    iast: "nārāyaṇaṃ namaskṛtya naraṃ caiva narottamam | devīṃ sarasvatīṃ caiva tato jayamudīrayet"
  - id: 'adi-1-1-28'
    kind: verse
    lines:
      - आद्यं पुरुषमीशानं पुरुहूतं पुरुष्टुतम्
      - ऋतमेकाक्षरं ब्रह्म व्यक्ताव्यक्तं सनातनम्
    iast: "ādyaṃ puruṣamīśānaṃ puruhūtaṃ puruṣṭutam | ṛtamekākṣaraṃ brahma vyaktāvyaktaṃ sanātanam"
  - id: 'adi-1-1-30'
    kind: verse
    lines:
      - मङ्गल्यं मङ्गलं विष्णुं वरेण्यमनघं शुचिम्
      - नमस्कृत्य हृषीकेशं चराचरगुरुं हरिम्
    iast: "maṅgalyaṃ maṅgalaṃ viṣṇuṃ vareṇyamanaghaṃ śucim | namaskṛtya hṛṣīkeśaṃ carācaraguruṃ harim"
  - id: 'adi-1-1-31'
    kind: verse
    lines:
      - महर्षेः पूजितस्येह सर्वलोकैर्महात्मनः
      - प्रवक्ष्यामि मतं पुण्यं व्यासस्याद्भुतकर्मणः
    iast: "maharṣeḥ pūjitasyeha sarvalokairmahātmanaḥ | pravakṣyāmi mataṃ puṇyaṃ vyāsasyādbhutakarmaṇaḥ"
  - id: 'adi-1-1-32'
    kind: verse
    lines:
      - नमो भगवते तस्मै व्यासायामिततेजसे
      - यस्य प्रसादाद्वक्ष्यामि नारायणकथामिमाम्
    iast: "namo bhagavate tasmai vyāsāyāmitatejase | yasya prasādādvakṣyāmi nārāyaṇakathāmimām"
  - id: 'adi-1-62-22'
    kind: verse
    lines:
      - मुच्यते सर्वपापेभ्यो राहुणा चन्द्रमा यथा
      - जयो नामेतिहासोऽयं श्रोतव्यो विजिगीषुणा
    iast: "mucyate sarvapāpebhyo rāhuṇā candramā yathā | jayo nāmetihāso'yaṃ śrotavyo vijigīṣuṇā"
  - id: 'adi-1-62-42'
    kind: verse
    lines:
      - तन्महाभारताख्यानं श्रुत्वैव प्रविलीयते
      - भरतानां महज्जन्म महाभारतमुच्यते
    iast: "tanmahābhāratākhyānaṃ śrutvaiva pravilīyate | bharatānāṃ mahajjanma mahābhāratamucyate"
  - id: 'adi-1-100-12'
    kind: verse
    lines:
      - भरताद्भारती कीर्तिर्येनेदं भारतं कुलम्
      - अपरे ये च पूर्वे च भारता इति तेऽभवन्
      - वैशंपायन उवाच
    iast: "bharatādbhāratī kīrtiryenedaṃ bhārataṃ kulam | apare ye ca pūrve ca bhāratā iti te'bhavan | vaiśaṃpāyana uvāca"
  - id: 'adi-1-101-61'
    kind: verse
    lines:
      - भरताद्भारती कीर्तिर्येनेदं भारतं कुलम् भरतस्यान्वये जाता देवकल्पा महारथाः
    iast: "bharatādbhāratī kīrtiryenedaṃ bhārataṃ kulam bharatasyānvaye jātā devakalpā mahārathāḥ"
  - id: 'adi-1-103-1'
    kind: verse
    lines:
      - ततः प्रतीपो राजाऽऽसीत्सर्वभूतहितः सदा
      - निषसाद समा बह्वीर्गङ्गाद्वारगतो जपन्
    iast: "tataḥ pratīpo rājā''sītsarvabhūtahitaḥ sadā | niṣasāda samā bahvīrgaṅgādvāragato japan"
  - id: 'adi-1-103-19'
    kind: verse
    lines:
      - तपस्तेपे सुतस्यार्थे सभार्यः कुरुनन्दन
      - प्रतीपस्य तु भार्यायां गर्भः श्रीमानवर्धत
    iast: "tapastepe sutasyārthe sabhāryaḥ kurunandana | pratīpasya tu bhāryāyāṃ garbhaḥ śrīmānavardhata"
  - id: 'adi-1-103-22'
    kind: verse
    lines:
      - शान्तस्य जज्ञे सन्तानस्तस्मादासीत्स शान्तनुः
      - तस्य जातस्य कृत्यानि प्रतीपोऽकारयत्प्रभुः
    iast: "śāntasya jajñe santānastasmādāsītsa śāntanuḥ | tasya jātasya kṛtyāni pratīpo'kārayatprabhuḥ"
  - id: 'adi-1-103-31'
    kind: verse
    lines:
      - एवं संदिश्य तनयं प्रतीपः शान्तनुं तदा
      - स्वे च राज्येऽभिषिच्यैनं वनं राजा विवेश ह
    iast: "evaṃ saṃdiśya tanayaṃ pratīpaḥ śāntanuṃ tadā | sve ca rājye'bhiṣicyainaṃ vanaṃ rājā viveśa ha"
  - id: 'adi-1-103-32'
    kind: verse
    lines:
      - स राजा शान्तनुर्धीमान्देवराजसमद्युतिः
      - बभूव सर्वलोकस्य सत्यवागिति संमतः
    iast: "sa rājā śāntanurdhīmāndevarājasamadyutiḥ | babhūva sarvalokasya satyavāgiti saṃmataḥ"
  - id: 'adi-1-103-34'
    kind: verse
    lines:
      - अमात्यलक्षणोपेतः क्षत्रधर्मविशेषवित्
      - वशे चक्रे महीमेको विजित्य वसुधाधिपान्
    iast: "amātyalakṣaṇopetaḥ kṣatradharmaviśeṣavit | vaśe cakre mahīmeko vijitya vasudhādhipān"
  - id: 'adi-1-103-37'
    kind: verse
    lines:
      - वयोरूपेण संपन्नः पौरुषेण बलेन च
      - ऐश्वर्येण प्रतापेन विक्रमेण धनेन च
    iast: "vayorūpeṇa saṃpannaḥ pauruṣeṇa balena ca | aiśvaryeṇa pratāpena vikrameṇa dhanena ca"
  - id: 'adi-1-103-43'
    kind: verse
    lines:
      - स एव राजा सर्वेषां भूतानामभवत्पिता
      - स हस्तिनाम्नि धर्मात्मा विहरन्कुरुनन्दनः
    iast: "sa eva rājā sarveṣāṃ bhūtānāmabhavatpitā | sa hastināmni dharmātmā viharankurunandanaḥ"
  - id: 'adi-1-103-46'
    kind: verse
    lines:
      - चचार मृगयाशीलः शान्तनुर्वनगोचरः
      - स मृगान्महिषांश्चैव विनिघ्नन्राजसत्तमः
    iast: "cacāra mṛgayāśīlaḥ śāntanurvanagocaraḥ | sa mṛgānmahiṣāṃścaiva vinighnanrājasattamaḥ"
  - id: 'adi-1-104-1'
    kind: verse
    lines:
      - एतच्छ्रुत्वा वचो राज्ञः सस्मितं मृदु वल्गु च
      - यशस्विनी च साऽगच्छच्छान्तनोर्भूतये तदा
    iast: "etacchrutvā vaco rājñaḥ sasmitaṃ mṛdu valgu ca | yaśasvinī ca sā'gacchacchāntanorbhūtaye tadā"
  - id: 'adi-1-104-5'
    kind: verse
    lines:
      - भविष्यामि महीपाल महिषी ते वशानुगा
      - न तु त्वं वा द्वितीयो वा ज्ञातुमिच्छेत्कथंचन
    iast: "bhaviṣyāmi mahīpāla mahiṣī te vaśānugā | na tu tvaṃ vā dvitīyo vā jñātumicchetkathaṃcana"
  - id: 'adi-1-104-7'
    kind: verse
    lines:
      - एवं हि वर्तमानेऽहं त्वयि वत्स्यामि पार्थिव
      - वारिता विप्रियं चोक्ता त्यजेयं त्वामसंशयम्
    iast: "evaṃ hi vartamāne'haṃ tvayi vatsyāmi pārthiva | vāritā vipriyaṃ coktā tyajeyaṃ tvāmasaṃśayam"
  - id: 'adi-1-104-8'
    kind: verse
    lines:
      - एष मे समयो राजन्भज मां त्वं यथेप्सितम्
      - अनुनीताऽस्मि ते पित्रा भर्ता मे त्वं भव प्रभो
      - वैशंपायन उवाच
    iast: "eṣa me samayo rājanbhaja māṃ tvaṃ yathepsitam | anunītā'smi te pitrā bhartā me tvaṃ bhava prabho | vaiśaṃpāyana uvāca"
  - id: 'adi-1-105-2'
    kind: verse
    lines:
      - दिविष्ठान्मानुषांश्चैव भोगान्भुङ्क्ते स वै नृपः आसाद्य शान्तनुः श्रीमान्मुमुदे योषितां वराम्
    iast: "diviṣṭhānmānuṣāṃścaiva bhogānbhuṅkte sa vai nṛpaḥ āsādya śāntanuḥ śrīmānmumude yoṣitāṃ varām"
  - id: 'adi-1-105-3'
    kind: verse
    lines:
      - ऋतुकाले तु सा देवी दिव्यं गर्भमधारयत्
      - अष्टावजनयत्पुत्रांस्तस्मादमरसन्निभान्
    iast: "ṛtukāle tu sā devī divyaṃ garbhamadhārayat | aṣṭāvajanayatputrāṃstasmādamarasannibhān"
  - id: 'adi-1-105-4'
    kind: verse
    lines:
      - जातं जातं च सा पुत्रं क्षिपत्यम्यसि भारत
      - सूतके कण्ठमाक्रम्य तान्निनाय यमक्षयम्
    iast: "jātaṃ jātaṃ ca sā putraṃ kṣipatyamyasi bhārata | sūtake kaṇṭhamākramya tānnināya yamakṣayam"
  - id: 'adi-1-105-8'
    kind: verse
    lines:
      - शान्तनुर्धर्मभङ्गाच्च नापृच्छत्तां कथंचन अष्टमं तु जिघांसन्त्यां चुक्षुभे शान्तनोर्धृतिः
    iast: "śāntanurdharmabhaṅgācca nāpṛcchattāṃ kathaṃcana aṣṭamaṃ tu jighāṃsantyāṃ cukṣubhe śāntanordhṛtiḥ"
  - id: 'adi-1-105-10'
    kind: verse
    lines:
      - आलभन्तीं तदा दृष्ट्वा तां स कौरवनन्दनः अब्रवीद्भरतश्रेष्ठो वाक्यं परमदुःखितः
    iast: "ālabhantīṃ tadā dṛṣṭvā tāṃ sa kauravanandanaḥ abravīdbharataśreṣṭho vākyaṃ paramaduḥkhitaḥ"
  - id: 'adi-1-105-11'
    kind: verse
    lines:
      - मावधीः कस्य काऽसीति किं हिनत्सि सुतानिति
      - पुत्रघ्नि सुमहत्पापं संप्राप्तं ते सुगर्हितम्
      - गङ्गोवाच
    iast: "māvadhīḥ kasya kā'sīti kiṃ hinatsi sutāniti | putraghni sumahatpāpaṃ saṃprāptaṃ te sugarhitam | gaṅgovāca"
  - id: 'adi-1-105-12'
    kind: verse
    lines:
      - पुत्रकाम न ते हन्मि पुत्रं पुत्रवतां वर
      - जीर्णस्तु मम वासोऽयं यथा स समयः कृतः
    iast: "putrakāma na te hanmi putraṃ putravatāṃ vara | jīrṇastu mama vāso'yaṃ yathā sa samayaḥ kṛtaḥ"
  - id: 'adi-1-105-18'
    kind: verse
    lines:
      - तत्ते शापाद्विनिर्मुक्ता आपवस्य महात्मनः
      - स्वस्ति तेस्तु गमिष्यामि पुत्रं पाहि महाव्रतम्
    iast: "tatte śāpādvinirmuktā āpavasya mahātmanaḥ | svasti testu gamiṣyāmi putraṃ pāhi mahāvratam"
  - id: 'adi-1-106-48'
    kind: verse
    lines:
      - एतदाख्याय सा देवी तत्रैवान्तरधीयत
      - आदाय च कुमारं तं जगामाथ यथेप्सितम्
    iast: "etadākhyāya sā devī tatraivāntaradhīyata | ādāya ca kumāraṃ taṃ jagāmātha yathepsitam"
  - id: 'adi-1-106-49'
    kind: verse
    lines:
      - स तु देवव्रतो नाम गाङ्गेय इति चाभवत्
      - द्युनामा शान्तनोः पुत्रः शान्तनोरधिको गुणैः
    iast: "sa tu devavrato nāma gāṅgeya iti cābhavat | dyunāmā śāntanoḥ putraḥ śāntanoradhiko guṇaiḥ"
  - id: 'adi-1-107-41'
    kind: verse
    lines:
      - मया दत्तं निजं पुत्रं वीरं वीर गृहं नय
      - वैशंपायन उवाच
      - इत्युक्त्वा सा महाभागा तत्रैवान्तरधीयत
      - तयैवं समनुज्ञातः पुत्रमादाय शान्तनुः
    iast: "mayā dattaṃ nijaṃ putraṃ vīraṃ vīra gṛhaṃ naya | vaiśaṃpāyana uvāca | ityuktvā sā mahābhāgā tatraivāntaradhīyata | tayaivaṃ samanujñātaḥ putramādāya śāntanuḥ"
  - id: 'adi-1-107-44'
    kind: verse
    lines:
      - गुणवन्तं महात्मानं यौवराज्येऽभ्यषेचयत्
      - पौरवाञ्शान्तनोः पुत्रः पितरं च महायशाः
    iast: "guṇavantaṃ mahātmānaṃ yauvarājye'bhyaṣecayat | pauravāñśāntanoḥ putraḥ pitaraṃ ca mahāyaśāḥ"
  - id: 'adi-1-107-45'
    kind: verse
    lines:
      - राष्ट्रं च रञ्जयामास वृत्तेन भरतर्षभ
      - स तथा सह पुत्रेण रममाणो महीपतिः
    iast: "rāṣṭraṃ ca rañjayāmāsa vṛttena bharatarṣabha | sa tathā saha putreṇa ramamāṇo mahīpatiḥ"
  - id: 'adi-1-107-46'
    kind: verse
    lines:
      - वर्तयामास वर्षाणि चत्वार्यमितविक्रमः
      - स कदाचिद्वनं यातो यमुनामभितो नदीम्
    iast: "vartayāmāsa varṣāṇi catvāryamitavikramaḥ | sa kadācidvanaṃ yāto yamunāmabhito nadīm"
  - id: 'adi-1-107-51'
    kind: verse
    lines:
      - समीक्ष्य राजा दाशेयीं कामयामास शान्तनुः
      - स गत्वा पितरं तस्या वरयामास तां तदा
    iast: "samīkṣya rājā dāśeyīṃ kāmayāmāsa śāntanuḥ | sa gatvā pitaraṃ tasyā varayāmāsa tāṃ tadā"
  - id: 'adi-1-107-52'
    kind: verse
    lines:
      - पर्यपृच्छत्ततस्तस्याः पितरं सोत्मकारणात्
      - स च तं प्रत्युवाचेदं दाशराजो महीपतिम्
    iast: "paryapṛcchattatastasyāḥ pitaraṃ sotmakāraṇāt | sa ca taṃ pratyuvācedaṃ dāśarājo mahīpatim"
  - id: 'adi-1-107-55'
    kind: verse
    lines:
      - समयेन प्रदद्यां ते कन्यामहमिमां नृप
      - न हि मे त्वत्समः कश्चिद्वरो जातु भविष्यति
      - शान्तनुरुवाच
    iast: "samayena pradadyāṃ te kanyāmahamimāṃ nṛpa | na hi me tvatsamaḥ kaścidvaro jātu bhaviṣyati | śāntanuruvāca"
  - id: 'adi-1-107-57'
    kind: verse
    lines:
      - अस्यां जायेत यः पुत्रः स राजा पृथिवीपते
      - त्वदूर्ध्वमभिषेक्तव्यो नान्यः कश्चन पार्थिव
      - वैशंपायन उवाच
    iast: "asyāṃ jāyeta yaḥ putraḥ sa rājā pṛthivīpate | tvadūrdhvamabhiṣektavyo nānyaḥ kaścana pārthiva | vaiśaṃpāyana uvāca"
  - id: 'adi-1-107-58'
    kind: verse
    lines:
      - नाकामयत तं दातुं वरं दाशाय शान्तनुः
      - शरीरजेन तीव्रेण दह्यमानोऽपि भारत
    iast: "nākāmayata taṃ dātuṃ varaṃ dāśāya śāntanuḥ | śarīrajena tīvreṇa dahyamāno'pi bhārata"
  - id: 'adi-1-107-59'
    kind: verse
    lines:
      - स चिन्तयन्नेव तदा दाशकन्यां महीपतिः
      - प्रत्ययाद्धास्तिनपुरं कामोपहतचेतनः
    iast: "sa cintayanneva tadā dāśakanyāṃ mahīpatiḥ | pratyayāddhāstinapuraṃ kāmopahatacetanaḥ"
  - id: 'adi-1-107-64'
    kind: verse
    lines:
      - विवर्तुं नाशकत्तस्मै पिता पुत्रस्य शान्तनुः एवमुक्तः स पुत्रेण शान्तनुः प्रत्यभाषत
    iast: "vivartuṃ nāśakattasmai pitā putrasya śāntanuḥ evamuktaḥ sa putreṇa śāntanuḥ pratyabhāṣata"
  - id: 'adi-1-107-83'
    kind: verse
    lines:
      - एतत्ते कथितं वीर कुरुष्व यदनन्तरम्
      - वैशंपायन उवाच
      - ततः स पितुराज्ञाय मतं सम्यगवेक्ष्य च
      - ज्ञात्वा च मानसं पुत्रः प्रययौ यमुनां प्रति
    iast: "etatte kathitaṃ vīra kuruṣva yadanantaram | vaiśaṃpāyana uvāca | tataḥ sa piturājñāya mataṃ samyagavekṣya ca | jñātvā ca mānasaṃ putraḥ prayayau yamunāṃ prati"
  - id: 'adi-1-107-84'
    kind: verse
    lines:
      - क्षत्रियैः सह धर्मात्मा पुराणैर्धर्मचारिभिः
      - उच्चैश्श्रवसमागम्य कन्यां वव्रे पितुः स्वयम्
    iast: "kṣatriyaiḥ saha dharmātmā purāṇairdharmacāribhiḥ | uccaiśśravasamāgamya kanyāṃ vavre pituḥ svayam"
  - id: 'adi-1-107-108'
    kind: verse
    lines:
      - अपत्यहेतोरपि च करिष्येऽद्य विनिश्चयम्
      - अद्यप्रभृति मे दाश ब्रह्मचर्यं भविष्यति
    iast: "apatyahetorapi ca kariṣye'dya viniścayam | adyaprabhṛti me dāśa brahmacaryaṃ bhaviṣyati"
  - id: 'adi-1-107-109'
    kind: verse
    lines:
      - अपुत्रस्यापि मे लोका भविष्यन्त्यक्षया दिवि
      - न हि जन्मप्रभृत्युक्तं मया किंचिदिहानृतम्
    iast: "aputrasyāpi me lokā bhaviṣyantyakṣayā divi | na hi janmaprabhṛtyuktaṃ mayā kiṃcidihānṛtam"
  - id: 'adi-1-107-111'
    kind: verse
    lines:
      - परित्यजाम्यहं राज्यं मैथुनं चापि सर्वशः ऊर्ध्वरेता भविष्यामि दाश सत्यं ब्रवीमि ते
      - वैशंपायन उवाच
    iast: "parityajāmyahaṃ rājyaṃ maithunaṃ cāpi sarvaśaḥ ūrdhvaretā bhaviṣyāmi dāśa satyaṃ bravīmi te | vaiśaṃpāyana uvāca"
  - id: 'adi-1-107-112'
    kind: verse
    lines:
      - तस्य तद्वचनं श्रुत्वा संप्रहृष्टतनूरुहः
      - ददानीत्येव तं दाशो धर्मात्मा प्रत्यभाषत
    iast: "tasya tadvacanaṃ śrutvā saṃprahṛṣṭatanūruhaḥ | dadānītyeva taṃ dāśo dharmātmā pratyabhāṣata"
  - id: 'adi-1-107-113'
    kind: verse
    lines:
      - ततोन्तरिक्षेऽप्सरसो देवाः सर्षिगणास्तदा तद्दृष्टा दुष्करं कर्म प्रशशंसुश्च पार्थिवाः
    iast: "tatontarikṣe'psaraso devāḥ sarṣigaṇāstadā taddṛṣṭā duṣkaraṃ karma praśaśaṃsuśca pārthivāḥ"
  - id: 'adi-1-107-114'
    kind: verse
    lines:
      - अभ्यवर्षन्त कुसुमैर्भीष्मोऽयमिति चाब्रुवन्
      - ततः स पितुरर्थाय तामुवाच यशस्विनीम्
    iast: "abhyavarṣanta kusumairbhīṣmo'yamiti cābruvan | tataḥ sa piturarthāya tāmuvāca yaśasvinīm"
  - id: 'adi-1-107-115'
    kind: verse
    lines:
      - अधिरोह रथं मातर्गच्छावः स्वगृहानिति
      - एवमुक्त्वा तु भीष्मस्तां रथमारोप्य भामिनीं
    iast: "adhiroha rathaṃ mātargacchāvaḥ svagṛhāniti | evamuktvā tu bhīṣmastāṃ rathamāropya bhāminīṃ"
  - id: 'adi-1-107-116'
    kind: verse
    lines:
      - आगम्य हास्तिनपुरं शान्तनोः संन्यवेदयत्
      - तस्य तद्दुष्करं कर्म प्रशशंसुर्नाराधिपाः
    iast: "āgamya hāstinapuraṃ śāntanoḥ saṃnyavedayat | tasya tadduṣkaraṃ karma praśaśaṃsurnārādhipāḥ"
  - id: 'adi-1-107-118'
    kind: verse
    lines:
      - बभूव दुःखितो राजा चिररात्राय भारत स तेन कर्मणा सूनोः प्रीतस्तस्मै वरं ददौ
    iast: "babhūva duḥkhito rājā cirarātrāya bhārata sa tena karmaṇā sūnoḥ prītastasmai varaṃ dadau"
  - id: 'adi-1-107-120'
    kind: verse
    lines:
      - त्वत्तो ह्यनुज्ञां संप्राप्य मृत्युः प्रभविताऽनघ
    iast: "tvatto hyanujñāṃ saṃprāpya mṛtyuḥ prabhavitā'nagha"
  - id: 'adi-1-108-3'
    kind: verse
    lines:
      - ततः शान्तनवो धीमान्सत्यवत्यामजायत
      - वीरश्चित्राङ्गदो नाम वीर्यवान्पुरुषेश्वरः
    iast: "tataḥ śāntanavo dhīmānsatyavatyāmajāyata | vīraścitrāṅgado nāma vīryavānpuruṣeśvaraḥ"
  - id: 'adi-1-108-4'
    kind: verse
    lines:
      - अथापरं महेष्वासं सत्यवत्यां सुतं प्रभुः
      - विचित्रवीर्यं राजानं जनयामास वीर्यवान्
    iast: "athāparaṃ maheṣvāsaṃ satyavatyāṃ sutaṃ prabhuḥ | vicitravīryaṃ rājānaṃ janayāmāsa vīryavān"
  - id: 'adi-1-108-6'
    kind: verse
    lines:
      - स्वर्गते शान्तनौ भीष्मश्चित्राङ्गदमरिन्दनम्
      - स्थापयामास वै राज्ये सत्यवत्या मते स्थितः
    iast: "svargate śāntanau bhīṣmaścitrāṅgadamarindanam | sthāpayāmāsa vai rājye satyavatyā mate sthitaḥ"
  - id: 'adi-1-108-8'
    kind: verse
    lines:
      - तं क्षिपन्तं सुरांश्चैव मनुष्यानसुरांस्तथा
      - गन्धर्वराजो बलवांस्तुल्यनामाऽभ्ययात्तदा
      - गन्धर्व उवाच
    iast: "taṃ kṣipantaṃ surāṃścaiva manuṣyānasurāṃstathā | gandharvarājo balavāṃstulyanāmā'bhyayāttadā | gandharva uvāca"
  - id: 'adi-1-108-11'
    kind: verse
    lines:
      - इत्युक्त्वा गर्जमानौ तौ हिरण्वत्यास्तटं गतौ
      - तेनास्य सुमहद्युद्धं कुरुक्षेत्रे बभूव ह
    iast: "ityuktvā garjamānau tau hiraṇvatyāstaṭaṃ gatau | tenāsya sumahadyuddhaṃ kurukṣetre babhūva ha"
  - id: 'adi-1-108-13'
    kind: verse
    lines:
      - तस्मिन्विमर्दे तुमुले शस्त्रवर्षसमाकुले
      - मायाधिकोऽवधीद्वीरं गन्धर्वः कुरुसत्तमम्
    iast: "tasminvimarde tumule śastravarṣasamākule | māyādhiko'vadhīdvīraṃ gandharvaḥ kurusattamam"
  - id: 'adi-1-108-15'
    kind: verse
    lines:
      - तस्मिन्पुरुषशार्दूले निहते भूरितेजसि
      - भीष्मः शान्तनवो राजा प्रेतकार्याण्यकारयत्
    iast: "tasminpuruṣaśārdūle nihate bhūritejasi | bhīṣmaḥ śāntanavo rājā pretakāryāṇyakārayat"
  - id: 'adi-1-108-16'
    kind: verse
    lines:
      - विचित्रवीर्यं च तदा बालमप्राप्तयौवनम्
      - कुरुराज्ये महाबाहुरभ्यषिञ्चदनन्तरम्
    iast: "vicitravīryaṃ ca tadā bālamaprāptayauvanam | kururājye mahābāhurabhyaṣiñcadanantaram"
  - id: 'adi-1-109-2'
    kind: verse
    lines:
      - तथा विचित्रवीर्यं तु वर्तमानं सुखेऽतुले संप्राप्तयौवनं दृष्ट्वा भ्रातरं धीमतां वरः
      - भीष्मो विचित्रवीर्यस्य विवाहायाकरोन्मतिम्
    iast: "tathā vicitravīryaṃ tu vartamānaṃ sukhe'tule saṃprāptayauvanaṃ dṛṣṭvā bhrātaraṃ dhīmatāṃ varaḥ | bhīṣmo vicitravīryasya vivāhāyākaronmatim"
  - id: 'adi-1-109-3'
    kind: verse
    lines:
      - अथ काशिपतेर्भीष्मः कन्यास्तिस्रोऽप्सरोपमाः
      - शुश्राव सहिता राजन्वृण्वाना वै स्वयंवरम्
    iast: "atha kāśipaterbhīṣmaḥ kanyāstisro'psaropamāḥ | śuśrāva sahitā rājanvṛṇvānā vai svayaṃvaram"
  - id: 'adi-1-109-60'
    kind: verse
    lines:
      - ताः सर्वगुणसंपन्ना भ्राता भ्रात्रे यवीयसे
      - भीष्मो विचित्रवीर्याय प्रददौ विक्रमाहृताः
    iast: "tāḥ sarvaguṇasaṃpannā bhrātā bhrātre yavīyase | bhīṣmo vicitravīryāya pradadau vikramāhṛtāḥ"
  - id: 'adi-1-109-62'
    kind: verse
    lines:
      - सत्यवत्या सह मिथः कृत्वा निश्चयमात्मवान् विवाहं कारयिष्यन्तं भीष्मं काशिपतेः सुता
      - ज्येष्ठा तासामिदं वाक्यमब्रवीद्धसती तदा
    iast: "satyavatyā saha mithaḥ kṛtvā niścayamātmavān vivāhaṃ kārayiṣyantaṃ bhīṣmaṃ kāśipateḥ sutā | jyeṣṭhā tāsāmidaṃ vākyamabravīddhasatī tadā"
  - id: 'adi-1-109-63'
    kind: verse
    lines:
      - मया सौभपतिः पूर्वं मनसा हि वृतः पतिः
      - तेन चास्मि वृता पूर्वमेष कामश्च मे पितुः
    iast: "mayā saubhapatiḥ pūrvaṃ manasā hi vṛtaḥ patiḥ | tena cāsmi vṛtā pūrvameṣa kāmaśca me pituḥ"
  - id: 'adi-1-109-68'
    kind: verse
    lines:
      - विनिश्चित्य स धर्मज्ञो ब्राह्मणैर्वेदपारगैः
      - अनुजज्ञे तदा ज्येष्ठामम्बां काशिपतेः सुताम्
    iast: "viniścitya sa dharmajño brāhmaṇairvedapāragaiḥ | anujajñe tadā jyeṣṭhāmambāṃ kāśipateḥ sutām"
  - id: 'adi-1-109-69'
    kind: verse
    lines:
      - अम्बिकाम्बालिके भार्ये प्रादाद्भ्रात्रे यवीयसे
      - भीष्मो विचित्रवीर्याय विधिदृष्टेन कर्मणा
    iast: "ambikāmbālike bhārye prādādbhrātre yavīyase | bhīṣmo vicitravīryāya vidhidṛṣṭena karmaṇā"
  - id: 'adi-1-109-70'
    kind: verse
    lines:
      - तयोः पाणी गृहीत्वा तु रूपयौवनदर्पितः
      - विचित्रवीर्यो धर्मात्मा नाम्बामैच्छत्कथंचन
    iast: "tayoḥ pāṇī gṛhītvā tu rūpayauvanadarpitaḥ | vicitravīryo dharmātmā nāmbāmaicchatkathaṃcana"
  - id: 'adi-1-111-6'
    kind: verse
    lines:
      - ताभ्यां सह समाः सप्त विहरन्पृथिवीपतिः
      - विचित्रवीर्यस्तरुणो यक्ष्मणा समगृह्यत
    iast: "tābhyāṃ saha samāḥ sapta viharanpṛthivīpatiḥ | vicitravīryastaruṇo yakṣmaṇā samagṛhyata"
  - id: 'adi-1-111-7'
    kind: verse
    lines:
      - सुहृदां यतमानानामाप्तैः सह चिकित्सकैः
      - जगामास्तमिवादित्यः कौरव्यो यमसादनम्
    iast: "suhṛdāṃ yatamānānāmāptaiḥ saha cikitsakaiḥ | jagāmāstamivādityaḥ kauravyo yamasādanam"
  - id: 'adi-1-112-1'
    kind: verse
    lines:
      - ततः सत्यवती दीना कृपणा पुत्रगृद्धिनी
      - पुत्रस्य कृत्वा कार्याणि स्नुषाभ्यां सह भारत
    iast: "tataḥ satyavatī dīnā kṛpaṇā putragṛddhinī | putrasya kṛtvā kāryāṇi snuṣābhyāṃ saha bhārata"
  - id: 'adi-1-112-21'
    kind: verse
    lines:
      - जानामि ते स्थितिं सत्ये परां सत्यपराक्रम
      - इच्छन्सृजेथास्त्रींल्लोकानन्यांस्त्वं स्वेन तेजसा
    iast: "jānāmi te sthitiṃ satye parāṃ satyaparākrama | icchansṛjethāstrīṃllokānanyāṃstvaṃ svena tejasā"
  - id: 'adi-1-112-23'
    kind: verse
    lines:
      - यथा ते कुलतन्तुश्च धर्मश्च न पराभवेत्
      - सुहृदश्च प्रहृष्येरंस्तथा कुरु परन्तप
    iast: "yathā te kulatantuśca dharmaśca na parābhavet | suhṛdaśca prahṛṣyeraṃstathā kuru parantapa"
  - id: 'adi-1-114-13'
    kind: verse
    lines:
      - त्वमेव कुलवृद्धासि गौरवं तु परं त्वयि
      - सोपायं कुलसन्ताने वक्तुमर्हसि नः परम्
    iast: "tvameva kulavṛddhāsi gauravaṃ tu paraṃ tvayi | sopāyaṃ kulasantāne vaktumarhasi naḥ param"
  - id: 'adi-1-114-17'
    kind: verse
    lines:
      - सत्यमेतन्महाबाहो यथा वदसि भारत
      - विश्वासात्ते प्रवक्ष्यामि सन्तानाय कुलस्य नः
    iast: "satyametanmahābāho yathā vadasi bhārata | viśvāsātte pravakṣyāmi santānāya kulasya naḥ"
  - id: 'adi-1-114-35'
    kind: verse
    lines:
      - पाराशर्यो महायोगी स बभूव महानृषिः
      - कन्यापुत्रो मम पुरा द्वैपायन इति श्रुतः
    iast: "pārāśaryo mahāyogī sa babhūva mahānṛṣiḥ | kanyāputro mama purā dvaipāyana iti śrutaḥ"
  - id: 'adi-1-114-38'
    kind: verse
    lines:
      - स नियुक्तो मया व्यक्तं त्वया चाप्रतिमद्युतिः
      - भ्रातुः क्षेत्रेषु कल्याणमपत्यं जनयिष्यति
    iast: "sa niyukto mayā vyaktaṃ tvayā cāpratimadyutiḥ | bhrātuḥ kṣetreṣu kalyāṇamapatyaṃ janayiṣyati"
  - id: 'adi-1-114-41'
    kind: verse
    lines:
      - वैशंपायन उवाच
      - महर्षेः कीर्तने तस्य भीष्मः प्राञ्जलिरब्रवीत् देशकालौ च जानासि क्रियतामर्थसिद्धये
      - धर्ममर्थं च कामं च त्रीनेतान्योनुपश्यति
    iast: "vaiśaṃpāyana uvāca | maharṣeḥ kīrtane tasya bhīṣmaḥ prāñjalirabravīt deśakālau ca jānāsi kriyatāmarthasiddhaye | dharmamarthaṃ ca kāmaṃ ca trīnetānyonupaśyati"
  - id: 'adi-1-114-44'
    kind: verse
    lines:
      - उक्तं भवत्या यच्छ्रेयस्तन्मह्यं रोचते भृशम्
      - वैशंपायन उवाच
      - ततस्तस्मिन्प्रतिज्ञाते भीष्मेण कुरुनन्दन
    iast: "uktaṃ bhavatyā yacchreyastanmahyaṃ rocate bhṛśam | vaiśaṃpāyana uvāca | tatastasminpratijñāte bhīṣmeṇa kurunandana"
  - id: 'adi-1-114-46'
    kind: verse
    lines:
      - प्रादुर्बभूवाविदितः क्षणेन कुरुनन्दन
      - तस्मै पूजां ततः कृत्वा सुताय विधिपूर्वकम्
    iast: "prādurbabhūvāviditaḥ kṣaṇena kurunandana | tasmai pūjāṃ tataḥ kṛtvā sutāya vidhipūrvakam"
  - id: 'adi-1-114-49'
    kind: verse
    lines:
      - भवत्या यदभिप्रेतं तदहं कर्तुमागतः
      - शाधि मां धर्मतत्त्वज्ञे करवाणि प्रियं तव
    iast: "bhavatyā yadabhipretaṃ tadahaṃ kartumāgataḥ | śādhi māṃ dharmatattvajñe karavāṇi priyaṃ tava"
  - id: 'adi-1-115-47'
    kind: verse
    lines:
      - एते विचित्रवीर्यस्य क्षेत्रे द्वैपायनादपि
      - जज्ञिरे देवगर्भाभाः कुरुवंशविवर्धनाः
    iast: "ete vicitravīryasya kṣetre dvaipāyanādapi | jajñire devagarbhābhāḥ kuruvaṃśavivardhanāḥ"
  - id: 'adi-1-118-17'
    kind: verse
    lines:
      - धृतराष्ट्रश्च पाण्डुश्च विदुरश्च महामतिः
      - जन्मप्रभृति भीष्मेण पुत्रवत्परिपालिताः
    iast: "dhṛtarāṣṭraśca pāṇḍuśca viduraśca mahāmatiḥ | janmaprabhṛti bhīṣmeṇa putravatparipālitāḥ"
  - id: 'adi-1-118-18'
    kind: verse
    lines:
      - संस्कारैः संस्कृतास्ते तु व्रताध्ययनसंयुताः
      - श्रमव्यायामकुशलाः समपद्यन्त यौवनम्
    iast: "saṃskāraiḥ saṃskṛtāste tu vratādhyayanasaṃyutāḥ | śramavyāyāmakuśalāḥ samapadyanta yauvanam"
  - id: 'adi-1-118-21'
    kind: verse
    lines:
      - वैदिकाध्ययने युक्तो नीतिशास्त्रेषु पारगः
      - भीष्मेण राजा कौरव्यो धृतराष्ट्रोऽभिषेचितः
    iast: "vaidikādhyayane yukto nītiśāstreṣu pāragaḥ | bhīṣmeṇa rājā kauravyo dhṛtarāṣṭro'bhiṣecitaḥ"
  - id: 'adi-1-118-27'
    kind: verse
    lines:
      - त्रिषु लोकेषु न त्वासीत्कश्चिद्विदुरसंमितः
      - धर्मनित्यस्तथा राजन्धर्मं च परमं गतः
    iast: "triṣu lokeṣu na tvāsītkaścidvidurasaṃmitaḥ | dharmanityastathā rājandharmaṃ ca paramaṃ gataḥ"
  - id: 'adi-1-118-30'
    kind: verse
    lines:
      - धृतराष्ट्रस्त्वचक्षुष्ट्वाद्रज्यं न प्रत्यपद्यत
      - पारसवत्वाद्विदुरो राजा पाण्डुर्बभूव ह
    iast: "dhṛtarāṣṭrastvacakṣuṣṭvādrajyaṃ na pratyapadyata | pārasavatvādviduro rājā pāṇḍurbabhūva ha"
  - id: 'adi-1-118-33'
    kind: verse
    lines:
      - कदाचिदथ गाङ्गेयः सर्वनीतिमतां वरः
      - विदुरं धर्मतत्त्वज्ञं वाक्यमाह यथोचितम्
    iast: "kadācidatha gāṅgeyaḥ sarvanītimatāṃ varaḥ | viduraṃ dharmatattvajñaṃ vākyamāha yathocitam"
  - id: 'adi-1-119-5'
    kind: verse
    lines:
      - श्रूयते यादवी कन्या स्वनुरूपा कुलस्य नः
      - सुबलस्यात्मजा चैव तथा मद्रेश्वरस्य च
    iast: "śrūyate yādavī kanyā svanurūpā kulasya naḥ | subalasyātmajā caiva tathā madreśvarasya ca"
  - id: 'adi-1-119-6'
    kind: verse
    lines:
      - कुलीना रूपवत्यश्च ताः कन्याः पुत्र सर्वशः
      - उचिताश्चैव संबन्धे तेऽस्माकं क्षत्रियर्षभाः
    iast: "kulīnā rūpavatyaśca tāḥ kanyāḥ putra sarvaśaḥ | ucitāścaiva saṃbandhe te'smākaṃ kṣatriyarṣabhāḥ"
  - id: 'adi-1-119-7'
    kind: verse
    lines:
      - मन्ये वरयितव्यास्ता इत्यहं धीमतां वर
      - सन्तानार्थं कुलस्यास्य यद्वा विदुर मन्यसे
      - विदुर उवाच
    iast: "manye varayitavyāstā ityahaṃ dhīmatāṃ vara | santānārthaṃ kulasyāsya yadvā vidura manyase | vidura uvāca"
  - id: 'adi-1-119-8'
    kind: verse
    lines:
      - भवान्पिता भावन्माता भवान्नः परमो गुरुः
      - तस्मात्स्वयं कुलस्यास्य विचार्य कुरु यद्धितम्
      - वैशंपायन उवाच
    iast: "bhavānpitā bhāvanmātā bhavānnaḥ paramo guruḥ | tasmātsvayaṃ kulasyāsya vicārya kuru yaddhitam | vaiśaṃpāyana uvāca"
  - id: 'adi-1-119-15'
    kind: verse
    lines:
      - नाभ्यसूयां पतिमहमित्येवं कृतनिश्चया
      - ततो गान्धारराजस्य पुत्रः शकुनिरभ्ययात्
    iast: "nābhyasūyāṃ patimahamityevaṃ kṛtaniścayā | tato gāndhārarājasya putraḥ śakunirabhyayāt"
  - id: 'adi-1-119-16'
    kind: verse
    lines:
      - स्वसारं परया लक्ष्म्या युक्तामादाय कौरवान् तां तदा धृतराष्ट्राय ददौ परमसत्कृताम्
      - भीष्मस्यानुमते चैव विवाहं समकारयत्
    iast: "svasāraṃ parayā lakṣmyā yuktāmādāya kauravān tāṃ tadā dhṛtarāṣṭrāya dadau paramasatkṛtām | bhīṣmasyānumate caiva vivāhaṃ samakārayat"
  - id: 'adi-1-120-1'
    kind: verse
    lines:
      - शूरो नाम यदुश्रेष्ठो वसुदेवपिताऽभवत्
      - तस्य कन्या पृथा नाम रूपेणाप्रतिमा भुवि
    iast: "śūro nāma yaduśreṣṭho vasudevapitā'bhavat | tasya kanyā pṛthā nāma rūpeṇāpratimā bhuvi"
  - id: 'adi-1-121-9'
    kind: verse
    lines:
      - यथागतं समाजग्मुर्गजैरश्वै रथैस्तथा
      - ततस्तस्याः पिता राजन्विवाहमकरोत्प्रभुः
    iast: "yathāgataṃ samājagmurgajairaśvai rathaistathā | tatastasyāḥ pitā rājanvivāhamakarotprabhuḥ"
  - id: 'adi-1-122-2'
    kind: verse
    lines:
      - सोऽमात्यैः स्थविरैः सार्धं ब्राह्मणैश्च महर्षिभिः
      - बलेन चतुरङ्गेण ययौ मद्रपतेः पुरम्
    iast: "so'mātyaiḥ sthaviraiḥ sārdhaṃ brāhmaṇaiśca maharṣibhiḥ | balena caturaṅgeṇa yayau madrapateḥ puram"
  - id: 'adi-1-122-17'
    kind: verse
    lines:
      - स तां माद्रीमुपादाय भीष्मः सागरगासुतः
      - आजगाम पुरीं धीमान्प्रविष्टो गजसाह्वयम्
    iast: "sa tāṃ mādrīmupādāya bhīṣmaḥ sāgaragāsutaḥ | ājagāma purīṃ dhīmānpraviṣṭo gajasāhvayam"
  - id: 'adi-1-122-18'
    kind: verse
    lines:
      - तत इष्टेऽहनि प्राप्ते मुहूर्ते साधुसंमते विवाहं कारायामास भीष्मः पाण्डोर्महात्मनः
      - जग्राह विधिवत्पाणिं माद्र्याः पाण्डुर्नराधिपः
    iast: "tata iṣṭe'hani prāpte muhūrte sādhusaṃmate vivāhaṃ kārāyāmāsa bhīṣmaḥ pāṇḍormahātmanaḥ | jagrāha vidhivatpāṇiṃ mādryāḥ pāṇḍurnarādhipaḥ"
  - id: 'adi-1-122-21'
    kind: verse
    lines:
      - ततः स कौरवो राजा विहृत्य त्रिदशा निशाः
      - जिगीषया महीं पाण्डुर्निरक्रामत्पुरात्प्रभो
    iast: "tataḥ sa kauravo rājā vihṛtya tridaśā niśāḥ | jigīṣayā mahīṃ pāṇḍurnirakrāmatpurātprabho"
  - id: 'adi-1-122-32'
    kind: verse
    lines:
      - तेन ते निर्जिताः सर्वे पृथिव्यां सर्वपार्थिवाः
      - तमेकं मेनिरे शूरं देवेष्विव पुरन्दरम्
    iast: "tena te nirjitāḥ sarve pṛthivyāṃ sarvapārthivāḥ | tamekaṃ menire śūraṃ deveṣviva purandaram"
  - id: 'adi-1-123-6'
    kind: verse
    lines:
      - संप्रयुक्तस्तु कुन्त्या च माद्र्या च भरतर्षभ
      - जिततन्द्रिस्तदा पाण्डुर्बभूव वनगोचरः
    iast: "saṃprayuktastu kuntyā ca mādryā ca bharatarṣabha | jitatandristadā pāṇḍurbabhūva vanagocaraḥ"
  - id: 'adi-1-126-1'
    kind: verse
    lines:
      - अथ पारसवीं कन्यां देवकस्य महीपतेः
      - रूपयौवनसंपन्नां स सुश्रावापगासुतः
    iast: "atha pārasavīṃ kanyāṃ devakasya mahīpateḥ | rūpayauvanasaṃpannāṃ sa suśrāvāpagāsutaḥ"
  - id: 'adi-1-126-2'
    kind: verse
    lines:
      - ततस्तु वरयित्वा तामानीय भरतर्षभः
      - विवाहं कारयामास विदुरस्य महामतेः
    iast: "tatastu varayitvā tāmānīya bharatarṣabhaḥ | vivāhaṃ kārayāmāsa vidurasya mahāmateḥ"
  - id: 'adi-1-126-3'
    kind: verse
    lines:
      - तस्यां चोत्पादयामास विदुरः कुरुनन्दन
      - पुत्रान्विनयसंपन्नानात्मनः सदृशान्गुणैः
    iast: "tasyāṃ cotpādayāmāsa viduraḥ kurunandana | putrānvinayasaṃpannānātmanaḥ sadṛśānguṇaiḥ"
  - id: 'adi-1-126-13'
    kind: verse
    lines:
      - गान्धार्यामाहिते गर्भे पाण्डुरम्बालिकासुतः
      - अगच्छत्परमं दुःखमपत्यार्थमरिन्दम
    iast: "gāndhāryāmāhite garbhe pāṇḍurambālikāsutaḥ | agacchatparamaṃ duḥkhamapatyārthamarindama"
  - id: 'adi-1-126-15'
    kind: verse
    lines:
      - स गत्वा तपसा सिद्धिं विश्वामित्रो यथा भुवि
      - देहान्यासे कृतमना इदं वचनमब्रवीत्
      - पाण्डुरुवाच
    iast: "sa gatvā tapasā siddhiṃ viśvāmitro yathā bhuvi | dehānyāse kṛtamanā idaṃ vacanamabravīt | pāṇḍuruvāca"
  - id: 'adi-1-126-16'
    kind: verse
    lines:
      - चतुर्भिर्ऋणवानित्थं जायते मनुजो भुवि
      - पितृदेवमनुष्याणामृषीणामथ भामिनि
    iast: "caturbhirṛṇavānitthaṃ jāyate manujo bhuvi | pitṛdevamanuṣyāṇāmṛṣīṇāmatha bhāmini"
  - id: 'adi-1-126-19'
    kind: verse
    lines:
      - ऋषिदेवमनुष्याणामृणान्मुक्तोऽस्मि धर्मतः
      - पितॄणां तु न मुक्तोऽस्मि तच्च तेभ्यो विशिष्यते
    iast: "ṛṣidevamanuṣyāṇāmṛṇānmukto'smi dharmataḥ | pitṝṇāṃ tu na mukto'smi tacca tebhyo viśiṣyate"
  - id: 'adi-1-126-26'
    kind: verse
    lines:
      - अपत्यं नाम लोकेषु प्रतिष्ठा धर्मसंहिता
      - इति कुन्ति विदुर्धीराः शाश्वतं धर्मवादिनः
    iast: "apatyaṃ nāma lokeṣu pratiṣṭhā dharmasaṃhitā | iti kunti vidurdhīrāḥ śāśvataṃ dharmavādinaḥ"
  - id: 'adi-1-128-60'
    kind: verse
    lines:
      - एवमुक्ता ततः कुन्ती पाण्डुं परपुरञ्जयम्
      - प्रत्युवाच वरारोहा भर्तुः प्रियहिते रता
    iast: "evamuktā tataḥ kuntī pāṇḍuṃ parapurañjayam | pratyuvāca varārohā bhartuḥ priyahite ratā"
  - id: 'adi-1-128-62'
    kind: verse
    lines:
      - पितृवेश्मन्यहं बाला नियुक्ताऽतिथिपूजने
      - उग्रं पर्यचरं तत्र ब्राह्मणं संशितव्रतम्
    iast: "pitṛveśmanyahaṃ bālā niyuktā'tithipūjane | ugraṃ paryacaraṃ tatra brāhmaṇaṃ saṃśitavratam"
  - id: 'adi-1-128-64'
    kind: verse
    lines:
      - स मेऽभिचारसंयुक्तमाचष्ट भगवान्वरम्
      - मन्त्रं त्विमं च मे प्रादादब्रवीच्चैव मामिदम्
    iast: "sa me'bhicārasaṃyuktamācaṣṭa bhagavānvaram | mantraṃ tvimaṃ ca me prādādabravīccaiva māmidam"
  - id: 'adi-1-128-67'
    kind: verse
    lines:
      - ब्राह्मणस्य वचस्तथ्यं तस्य कालोऽयमागतः
      - अनुज्ञाता त्वया देवमाह्वयेयमहं नृप
    iast: "brāhmaṇasya vacastathyaṃ tasya kālo'yamāgataḥ | anujñātā tvayā devamāhvayeyamahaṃ nṛpa"
  - id: 'adi-1-128-68'
    kind: verse
    lines:
      - यां मे विद्यां महाराज अददात्स महायशाः तयाऽऽहूतः सुरः पुत्रं प्रदास्यति सुरोपमम्
      - अनपत्यकृतं यस्ते शोकं वीर विनेष्यति
    iast: "yāṃ me vidyāṃ mahārāja adadātsa mahāyaśāḥ tayā''hūtaḥ suraḥ putraṃ pradāsyati suropamam | anapatyakṛtaṃ yaste śokaṃ vīra vineṣyati"
  - id: 'adi-1-129-7'
    kind: verse
    lines:
      - प्रवरं सर्वदेवानां धर्ममावाहयाबले
      - वैशंपायन उवाच
      - पाण्डुना समनुज्ञाता भारतेन यशस्विना
      - मतिं चक्रे महाराज धर्मस्यावाहने तदा
      - पाण्डुरुवाच
    iast: "pravaraṃ sarvadevānāṃ dharmamāvāhayābale | vaiśaṃpāyana uvāca | pāṇḍunā samanujñātā bhāratena yaśasvinā | matiṃ cakre mahārāja dharmasyāvāhane tadā | pāṇḍuruvāca"
  - id: 'adi-1-129-22'
    kind: verse
    lines:
      - समृद्धयसशं कुन्ती सुषाव प्रवरं सुतम्
      - जातमात्रे सुते तस्मिन्वागुवाचाशरीरिणी
    iast: "samṛddhayasaśaṃ kuntī suṣāva pravaraṃ sutam | jātamātre sute tasminvāguvācāśarīriṇī"
  - id: 'adi-1-129-22#2'
    kind: verse
    lines:
      - समृद्धयसशं कुन्ती सुषाव प्रवरं सुतम्
      - जातमात्रे सुते तस्मिन्वागुवाचाशरीरिणी
    iast: "samṛddhayasaśaṃ kuntī suṣāva pravaraṃ sutam | jātamātre sute tasminvāguvācāśarīriṇī"
  - id: 'adi-1-129-23'
    kind: verse
    lines:
      - एष धर्मभृतां श्रेष्ठो भविष्यति नरोत्तमः
      - विक्रान्तः सत्यवाक्चैव राजा पृथ्व्यां भविष्यति
    iast: "eṣa dharmabhṛtāṃ śreṣṭho bhaviṣyati narottamaḥ | vikrāntaḥ satyavākcaiva rājā pṛthvyāṃ bhaviṣyati"
  - id: 'adi-1-129-24'
    kind: verse
    lines:
      - युधिष्ठिर इति ख्यातः पाण्डोः प्रथमजः सुतः भविता प्रथितो राजा त्रिषु लोकेषु विश्रुतः
      - यशसा तेजसा चैव वृत्तेन च समन्वितः
    iast: "yudhiṣṭhira iti khyātaḥ pāṇḍoḥ prathamajaḥ sutaḥ bhavitā prathito rājā triṣu lokeṣu viśrutaḥ | yaśasā tejasā caiva vṛttena ca samanvitaḥ"
  - id: 'adi-1-129-44'
    kind: verse
    lines:
      - धार्मिकं च सुतं दृष्ट्वा पाण्डुः कुन्तीमथाऽब्रवीत्
      - प्राहुः क्षत्रं बलज्येष्ठं बलज्येष्ठं सुतं वृणु
    iast: "dhārmikaṃ ca sutaṃ dṛṣṭvā pāṇḍuḥ kuntīmathā'bravīt | prāhuḥ kṣatraṃ balajyeṣṭhaṃ balajyeṣṭhaṃ sutaṃ vṛṇu"
  - id: 'adi-1-129-45'
    kind: verse
    lines:
      - ततः कुन्तीमभिक्रम्य शशासातीव भारत
      - वायुमावाहयस्वेति स देवो बलवत्तरः
    iast: "tataḥ kuntīmabhikramya śaśāsātīva bhārata | vāyumāvāhayasveti sa devo balavattaraḥ"
  - id: 'adi-1-129-49'
    kind: verse
    lines:
      - तथोक्तवति सा काले वायुमेवाजुहाव ह
      - द्वितीयेनोपहारेण तेनोक्तविधिना पुनः
    iast: "tathoktavati sā kāle vāyumevājuhāva ha | dvitīyenopahāreṇa tenoktavidhinā punaḥ"
  - id: 'adi-1-129-52'
    kind: verse
    lines:
      - तस्यां जज्ञे महावीर्यो भीमो भीमपराक्रमः
      - तमप्यतिबलं जातं वागुवाचाशरीरिणी
    iast: "tasyāṃ jajñe mahāvīryo bhīmo bhīmaparākramaḥ | tamapyatibalaṃ jātaṃ vāguvācāśarīriṇī"
  - id: 'adi-1-129-53'
    kind: verse
    lines:
      - सर्वेषां बलिनां श्रेष्ठो जातोऽयमिति भारत
      - जातमात्रे कुमारे तु सर्वलोकस्य पार्थिवाः
    iast: "sarveṣāṃ balināṃ śreṣṭho jāto'yamiti bhārata | jātamātre kumāre tu sarvalokasya pārthivāḥ"
  - id: 'adi-1-129-56'
    kind: verse
    lines:
      - इदं चाद्भुतमत्रासीज्जातमात्रे वृकोदरे
      - यदऱ्कात्पतितो मातुः शिलां गात्रैरचूर्णयत्
    iast: "idaṃ cādbhutamatrāsījjātamātre vṛkodare | yadaऱkātpatito mātuḥ śilāṃ gātrairacūrṇayat"
  - id: 'adi-1-129-68'
    kind: verse
    lines:
      - यस्मिन्नहनि भमस्तु जज्ञे भीमपराक्रमः
      - तामेव रात्रिं पूर्वां तु जज्ञे दुर्योधनो नृपः
    iast: "yasminnahani bhamastu jajñe bhīmaparākramaḥ | tāmeva rātriṃ pūrvāṃ tu jajñe duryodhano nṛpaḥ"
  - id: 'adi-1-129-69'
    kind: verse
    lines:
      - स जातमात्र एवाथ धृतराष्ट्रसुतो नृप
      - रासभारावसदृशं रुराव च ननाद च
    iast: "sa jātamātra evātha dhṛtarāṣṭrasuto nṛpa | rāsabhārāvasadṛśaṃ rurāva ca nanāda ca"
  - id: 'adi-1-129-77'
    kind: verse
    lines:
      - लक्षयित्वा निमित्तानि तानि घोराणि सर्वशः
      - तेऽब्रुवन्ब्राह्मणा राजन्विदुरश्च महामतिः
    iast: "lakṣayitvā nimittāni tāni ghorāṇi sarvaśaḥ | te'bruvanbrāhmaṇā rājanviduraśca mahāmatiḥ"
  - id: 'adi-1-129-79'
    kind: verse
    lines:
      - व्यक्तं कुलान्तकरणो भवितैष सुतस्तव
      - तस्य शान्तिः परित्यागे गुप्तावपनयो महान्
    iast: "vyaktaṃ kulāntakaraṇo bhavitaiṣa sutastava | tasya śāntiḥ parityāge guptāvapanayo mahān"
  - id: 'adi-1-129-80'
    kind: verse
    lines:
      - एष दुर्योधनो राजा मधुपिङ्गललोचनः न केवलं कुलस्यान्तं क्षत्रियान्तं करिष्यति
    iast: "eṣa duryodhano rājā madhupiṅgalalocanaḥ na kevalaṃ kulasyāntaṃ kṣatriyāntaṃ kariṣyati"
  - id: 'adi-1-129-81'
    kind: verse
    lines:
      - शतमेकोनमप्यस्तु पुत्राणां ते महीपते
      - त्यजैनमेकं शान्तिं चेत्कुलस्येच्छसि भारत
    iast: "śatamekonamapyastu putrāṇāṃ te mahīpate | tyajainamekaṃ śāntiṃ cetkulasyecchasi bhārata"
  - id: 'adi-1-129-83'
    kind: verse
    lines:
      - ग्रामं जनपदस्यार्थे आत्मार्थे पृथिवीं त्यजेत्
      - स तथा विदुरेणोक्तस्तैश्च सर्वैर्द्विजोत्तमैः
    iast: "grāmaṃ janapadasyārthe ātmārthe pṛthivīṃ tyajet | sa tathā vidureṇoktastaiśca sarvairdvijottamaiḥ"
  - id: 'adi-1-129-84'
    kind: verse
    lines:
      - न चकार तथा राजा पुत्रस्नेहसमन्वितः
      - ततः पुत्रशतं पूर्ण धृतराष्ट्रस्य पार्थिव
    iast: "na cakāra tathā rājā putrasnehasamanvitaḥ | tataḥ putraśataṃ pūrṇa dhṛtarāṣṭrasya pārthiva"
  - id: 'adi-1-129-85'
    kind: verse
    lines:
      - अह्नांशतेन संजज्ञे कन्या चैका शताधिका
      - गान्धार्यां क्लिश्यमानायामुदरेण विवर्धता
    iast: "ahnāṃśatena saṃjajñe kanyā caikā śatādhikā | gāndhāryāṃ kliśyamānāyāmudareṇa vivardhatā"
  - id: 'adi-1-129-88'
    kind: verse
    lines:
      - महारथानां वीराणां कन्या चैका शताधिका
      - युयुत्सुश्च महातेजा वैश्यापुत्रः प्रतापवान्
    iast: "mahārathānāṃ vīrāṇāṃ kanyā caikā śatādhikā | yuyutsuśca mahātejā vaiśyāputraḥ pratāpavān"
  - id: 'adi-1-131-17'
    kind: verse
    lines:
      - सर्वेषामनुरूपाश्च कृता दारा महीपते
      - धृतराष्ट्रेण समये परीक्ष्य विविवन्नृप
    iast: "sarveṣāmanurūpāśca kṛtā dārā mahīpate | dhṛtarāṣṭreṇa samaye parīkṣya vivivannṛpa"
  - id: 'adi-1-131-18'
    kind: verse
    lines:
      - दुःशलां चापि समये धृतराष्ट्रो नराधिपः
      - जयद्रथाय प्रददौ विधिना भरतर्षभ
    iast: "duḥśalāṃ cāpi samaye dhṛtarāṣṭro narādhipaḥ | jayadrathāya pradadau vidhinā bharatarṣabha"
  - id: 'adi-1-132-1'
    kind: verse
    lines:
      - जाते बलवतां श्रेष्ठे पाण्डुश्चिन्तापरोऽभवत्
      - कथमन्यो मम सुतो लोके श्रेष्ठो भवेदिति
    iast: "jāte balavatāṃ śreṣṭhe pāṇḍuścintāparo'bhavat | kathamanyo mama suto loke śreṣṭho bhavediti"
  - id: 'adi-1-132-6'
    kind: verse
    lines:
      - ततः पाण्डुर्महाराजो मन्त्रयित्वा महर्षिभिः
      - दिदेश कुन्त्याः कौरव्यो व्रतं सांवत्सरं शुभम्
    iast: "tataḥ pāṇḍurmahārājo mantrayitvā maharṣibhiḥ | dideśa kuntyāḥ kauravyo vrataṃ sāṃvatsaraṃ śubham"
  - id: 'adi-1-132-16'
    kind: verse
    lines:
      - एवमुक्ता ततः शक्रमाजुहाव यशस्विनी
      - अथाजगाम देवेन्द्रो जनयामास चार्जुनम्
    iast: "evamuktā tataḥ śakramājuhāva yaśasvinī | athājagāma devendro janayāmāsa cārjunam"
  - id: 'adi-1-132-18'
    kind: verse
    lines:
      - जातमात्रे कुमारे तु सर्वभूतप्रहर्षिणी सूतके वर्तमानां तां वागुवाचाशरीरिणी
      - महागम्भीरनिर्घोषा नभो नादयती तदा
    iast: "jātamātre kumāre tu sarvabhūtapraharṣiṇī sūtake vartamānāṃ tāṃ vāguvācāśarīriṇī | mahāgambhīranirghoṣā nabho nādayatī tadā"
  - id: 'adi-1-132-20'
    kind: verse
    lines:
      - कार्तवीर्यसमः कुन्ति शिवतुल्यपराक्रमः
      - एष शक्र इवाजय्यो यशस्ते प्रथयिष्यति
    iast: "kārtavīryasamaḥ kunti śivatulyaparākramaḥ | eṣa śakra ivājayyo yaśaste prathayiṣyati"
  - id: 'adi-1-132-21'
    kind: verse
    lines:
      - अदित्या विष्णुना प्रीतिर्यथाऽभूदभिवर्धिता
      - तथा विष्णुसमः प्रीतिं वर्धयिष्यति तेऽर्जुनः
    iast: "adityā viṣṇunā prītiryathā'bhūdabhivardhitā | tathā viṣṇusamaḥ prītiṃ vardhayiṣyati te'rjunaḥ"
  - id: 'adi-1-133-9'
    kind: verse
    lines:
      - ततः कुन्तीं पुनः पाण्डुर्विविक्त इदमब्रवीत् अनुगृह्णीष्व कल्याणि मद्रराजसुतामपि
      - कुलस्य मम सन्तानं लोकस्य च कुरु प्रियम्
    iast: "tataḥ kuntīṃ punaḥ pāṇḍurvivikta idamabravīt anugṛhṇīṣva kalyāṇi madrarājasutāmapi | kulasya mama santānaṃ lokasya ca kuru priyam"
  - id: 'adi-1-133-16'
    kind: verse
    lines:
      - एवमुक्ताऽब्रवीन्मार्द्रीं सकृच्चिन्तय दैवतम्
      - तस्मात्ते भविताऽपत्यमनुरूपमसंशयम्
    iast: "evamuktā'bravīnmārdrīṃ sakṛccintaya daivatam | tasmātte bhavitā'patyamanurūpamasaṃśayam"
  - id: 'adi-1-133-18'
    kind: verse
    lines:
      - ततो माद्री विचार्यैका जगाम मनसाऽश्विनौ तावागम्य सुतौ तस्यां जनयामासतुर्यमौ
      - नकुलं सहदेवं च रूपेणाप्रतिमौ भुवि
    iast: "tato mādrī vicāryaikā jagāma manasā'śvinau tāvāgamya sutau tasyāṃ janayāmāsaturyamau | nakulaṃ sahadevaṃ ca rūpeṇāpratimau bhuvi"
  - id: 'adi-1-133-19'
    kind: verse
    lines:
      - तथैव तावपि यमौ वागुवाचाशरीरिणी
      - धर्मतो भक्तितश्चैव शीलतो विनयैस्तथा
    iast: "tathaiva tāvapi yamau vāguvācāśarīriṇī | dharmato bhaktitaścaiva śīlato vinayaistathā"
  - id: 'adi-1-133-20'
    kind: verse
    lines:
      - सत्वरूपगुणोपेतौ भवतोऽत्यश्विनाविति
      - मासते तेजसाऽत्यर्थं रूपद्रविणसंपदा
    iast: "satvarūpaguṇopetau bhavato'tyaśvināviti | māsate tejasā'tyarthaṃ rūpadraviṇasaṃpadā"
  - id: 'adi-1-133-35'
    kind: verse
    lines:
      - ततस्तु वृष्णयः सर्वे वसुदेवपुरोगमाः
    iast: "tatastu vṛṣṇayaḥ sarve vasudevapurogamāḥ"
  - id: 'adi-1-133-39'
    kind: verse
    lines:
      - इत्येवं कथयन्तस्ते वृष्णयः सह बान्धवैः
      - पाण्डोः पुत्रागमं श्रुत्वा सर्वे हर्षसमन्विताः
    iast: "ityevaṃ kathayantaste vṛṣṇayaḥ saha bāndhavaiḥ | pāṇḍoḥ putrāgamaṃ śrutvā sarve harṣasamanvitāḥ"
  - id: 'adi-1-133-58'
    kind: verse
    lines:
      - ते च पञ्च शतं चैव कुरुवंशविवर्धनाः
      - सर्वे ववृधिरेऽल्पेन कालेनाप्स्विव पङ्कजाः
    iast: "te ca pañca śataṃ caiva kuruvaṃśavivardhanāḥ | sarve vavṛdhire'lpena kālenāpsviva paṅkajāḥ"
  - id: 'adi-1-134-15'
    kind: verse
    lines:
      - सुपुष्पितवने काले कदाचिन्मधुमाधवे
      - भूतसंमोहने राजा सभार्यो व्यचरद्वनम्
    iast: "supuṣpitavane kāle kadācinmadhumādhave | bhūtasaṃmohane rājā sabhāryo vyacaradvanam"
  - id: 'adi-1-134-18'
    kind: verse
    lines:
      - प्रहृष्टमनसं तत्र विचरन्तं यथाऽमरम्
      - तं माद्र्यनुजगामैका वसनं बिभ्रती शुभम्
    iast: "prahṛṣṭamanasaṃ tatra vicarantaṃ yathā'maram | taṃ mādryanujagāmaikā vasanaṃ bibhratī śubham"
  - id: 'adi-1-134-22'
    kind: verse
    lines:
      - तत एनां बलाद्राजा निजग्राह रहोगताम्
      - वार्यमाणस्तया देव्या विस्फुरन्त्या यथाबलम्
    iast: "tata enāṃ balādrājā nijagrāha rahogatām | vāryamāṇastayā devyā visphurantyā yathābalam"
  - id: 'adi-1-134-26'
    kind: verse
    lines:
      - स तया सह संगम्य भार्यया कुरुनन्दनः
      - पाण्डुः परमधर्मात्मा युयुजे कालधर्मणा
    iast: "sa tayā saha saṃgamya bhāryayā kurunandanaḥ | pāṇḍuḥ paramadharmātmā yuyuje kāladharmaṇā"
  - id: 'adi-1-134-29'
    kind: verse
    lines:
      - ततो माद्र्यब्रवीद्राजन्नार्ता कुन्तीमिदं वचः
      - एकैव त्वमिहागच्छ तिष्ठन्त्वत्रैव दारकाः
    iast: "tato mādryabravīdrājannārtā kuntīmidaṃ vacaḥ | ekaiva tvamihāgaccha tiṣṭhantvatraiva dārakāḥ"
  - id: 'adi-1-134-90'
    kind: verse
    lines:
      - कुन्त्याश्च वृष्णयो नाथाः कुन्तिभोजस्तथैव च
      - नाहं त्वमिव पुत्राणां समर्था धारणे तथा
    iast: "kuntyāśca vṛṣṇayo nāthāḥ kuntibhojastathaiva ca | nāhaṃ tvamiva putrāṇāṃ samarthā dhāraṇe tathā"
  - id: 'adi-1-134-91'
    kind: verse
    lines:
      - साऽहं भर्तारमन्विष्ये संतृप्ता नापि भोगतः
      - भर्तृलोकस्य तु ज्येष्ठा देवी मामनुमन्यताम्
    iast: "sā'haṃ bhartāramanviṣye saṃtṛptā nāpi bhogataḥ | bhartṛlokasya tu jyeṣṭhā devī māmanumanyatām"
  - id: 'adi-1-134-94'
    kind: verse
    lines:
      - अभिवाद्य महर्षीन्सा परिष्वज्य च पाण्डवान्
      - मूर्ध्न्युपाघ्राय बहुशः पार्थानात्मसुतौ तदा
    iast: "abhivādya maharṣīnsā pariṣvajya ca pāṇḍavān | mūrdhnyupāghrāya bahuśaḥ pārthānātmasutau tadā"
  - id: 'adi-1-134-95'
    kind: verse
    lines:
      - हस्ते युधिष्ठिरं गृह्य माद्री वाक्यमभाषत
      - कुन्ती माता अहं धात्री युष्माकं तु पिता मृतः
    iast: "haste yudhiṣṭhiraṃ gṛhya mādrī vākyamabhāṣata | kuntī mātā ahaṃ dhātrī yuṣmākaṃ tu pitā mṛtaḥ"
  - id: 'adi-1-134-96'
    kind: verse
    lines:
      - युधिष्ठिरः पिता ज्येष्ठश्चतुर्णां धर्मतः सदा
      - वृद्धाद्युपासनासक्ताः सत्यधर्मपरायणाः
    iast: "yudhiṣṭhiraḥ pitā jyeṣṭhaścaturṇāṃ dharmataḥ sadā | vṛddhādyupāsanāsaktāḥ satyadharmaparāyaṇāḥ"
  - id: 'adi-1-134-97'
    kind: verse
    lines:
      - तादृशा न विनश्यन्ति नैव यान्ति पराभवम्
      - तस्मात्सर्वे कुरुध्वं वै गुरुवृत्तिमतन्द्रिताः
      - वैशंपायन उवाच
    iast: "tādṛśā na vinaśyanti naiva yānti parābhavam | tasmātsarve kurudhvaṃ vai guruvṛttimatandritāḥ | vaiśaṃpāyana uvāca"
  - id: 'adi-1-134-110'
    kind: verse
    lines:
      - ऋषीन्पुत्रान्पृथां चैव विसृज्य च नृपात्मज नमस्कृत्य चिताग्निस्थं धर्मपत्नी नरर्षभम्
    iast: "ṛṣīnputrānpṛthāṃ caiva visṛjya ca nṛpātmaja namaskṛtya citāgnisthaṃ dharmapatnī nararṣabham"
  - id: 'adi-1-134-111'
    kind: verse
    lines:
      - मद्रराजसुता तूर्णमन्वारोहद्यशस्विनी
    iast: "madrarājasutā tūrṇamanvārohadyaśasvinī"
  - id: 'adi-1-135-1'
    kind: verse
    lines:
      - पाण्डोरुपरमं दृष्ट्वा देवकल्पा महर्षयः
      - ततो मन्त्रविदः सर्वे मन्त्रयांचक्रिरे मिथः
      - तापसा ऊचुः
    iast: "pāṇḍoruparamaṃ dṛṣṭvā devakalpā maharṣayaḥ | tato mantravidaḥ sarve mantrayāṃcakrire mithaḥ | tāpasā ūcuḥ"
  - id: 'adi-1-135-6'
    kind: verse
    lines:
      - उदारमनसः सिद्धा गमने चक्रिरे मनः
      - भीष्माय पण्डवान्दातुं धृतराष्ट्राय चैव हि
    iast: "udāramanasaḥ siddhā gamane cakrire manaḥ | bhīṣmāya paṇḍavāndātuṃ dhṛtarāṣṭrāya caiva hi"
  - id: 'adi-1-137-1'
    kind: verse
    lines:
      - ततः क्षत्ता च भीष्मश्च व्यासो राजा च बन्धुभिः
      - ददुः श्राद्धं तदा पाण्डोः स्वधामृतमयं तदा
    iast: "tataḥ kṣattā ca bhīṣmaśca vyāso rājā ca bandhubhiḥ | daduḥ śrāddhaṃ tadā pāṇḍoḥ svadhāmṛtamayaṃ tadā"
  - id: 'adi-1-137-14'
    kind: verse
    lines:
      - अथाप्तवन्तो वेदोक्तान्संस्कारान्पाण्डवास्तदा
      - संव्यवर्धन्त भोगांस्ते भुञ्जानाः पितृवेश्मनि
    iast: "athāptavanto vedoktānsaṃskārānpāṇḍavāstadā | saṃvyavardhanta bhogāṃste bhuñjānāḥ pitṛveśmani"
  - id: 'adi-1-137-15'
    kind: verse
    lines:
      - धार्तराष्ट्रैश्च सहिताः क्रीडन्तो मुदिताः सुखम्
      - बालक्रीडासु सर्वासु विशिष्टास्तेजसाऽभवन्
    iast: "dhārtarāṣṭraiśca sahitāḥ krīḍanto muditāḥ sukham | bālakrīḍāsu sarvāsu viśiṣṭāstejasā'bhavan"
  - id: 'adi-1-137-18'
    kind: verse
    lines:
      - शतमेकोत्तरं तेषां कुमाराणां महौजसाम्
      - एक एव निगृह्णाति नातिकृच्छ्राद्वृकोदरः
    iast: "śatamekottaraṃ teṣāṃ kumārāṇāṃ mahaujasām | eka eva nigṛhṇāti nātikṛcchrādvṛkodaraḥ"
  - id: 'adi-1-137-26'
    kind: verse
    lines:
      - ततो बलमतिख्यातं धार्तराष्ट्रः प्रतापवान्
      - भीमसेनस्य तज्ज्ञात्वा दुष्टभावमदर्शयत्
    iast: "tato balamatikhyātaṃ dhārtarāṣṭraḥ pratāpavān | bhīmasenasya tajjñātvā duṣṭabhāvamadarśayat"
  - id: 'adi-1-137-31'
    kind: verse
    lines:
      - प्रसह्य बन्धने बद्ध्वा प्रशासिष्ये वसुन्धराम् एवं स निश्चयं पापः कृत्वा दुर्योधनस्तदा
      - नित्यमेवान्तरप्रेक्षी भीमस्यासीन्महात्मनः
    iast: "prasahya bandhane baddhvā praśāsiṣye vasundharām evaṃ sa niścayaṃ pāpaḥ kṛtvā duryodhanastadā | nityamevāntaraprekṣī bhīmasyāsīnmahātmanaḥ"
  - id: 'adi-1-137-40'
    kind: verse
    lines:
      - प्रमाणकोट्यां संसुप्तं गङ्गायां प्राक्षिपज्जले
      - ततः प्रबुद्धः कौन्तेयः सर्वान्संछिद्य बन्धनान्
    iast: "pramāṇakoṭyāṃ saṃsuptaṃ gaṅgāyāṃ prākṣipajjale | tataḥ prabuddhaḥ kaunteyaḥ sarvānsaṃchidya bandhanān"
  - id: 'adi-1-137-41'
    kind: verse
    lines:
      - उदतिष्ठद्बलाद्भूयो भीमः प्रहरतां वरः
      - स विमुक्तो महातेजा नाज्ञासीत्तेन तत्कृतम्
    iast: "udatiṣṭhadbalādbhūyo bhīmaḥ praharatāṃ varaḥ | sa vimukto mahātejā nājñāsīttena tatkṛtam"
  - id: 'adi-1-137-43'
    kind: verse
    lines:
      - सुप्तं चापि पुनः सर्पैस्तीक्ष्णदंष्ट्रैर्महाविषैः
      - कुपितैर्दंशयामास सर्वेष्वेवाङ्गसन्धिषु
    iast: "suptaṃ cāpi punaḥ sarpaistīkṣṇadaṃṣṭrairmahāviṣaiḥ | kupitairdaṃśayāmāsa sarveṣvevāṅgasandhiṣu"
  - id: 'adi-1-137-45'
    kind: verse
    lines:
      - प्रबुद्धो भीसेनस्तान्सर्वान्सर्पानपोथयत्
      - सारथिं चास्य दयितमपहस्तेन जघ्निवान्
    iast: "prabuddho bhīsenastānsarvānsarpānapothayat | sārathiṃ cāsya dayitamapahastena jaghnivān"
  - id: 'adi-1-137-46'
    kind: verse
    lines:
      - तथान्यदिवसे राजन्हन्तुकामोऽत्यमर्षणः
      - वलनेन सहामन्त्र्य सौबलस्य मते स्थितः
    iast: "tathānyadivase rājanhantukāmo'tyamarṣaṇaḥ | valanena sahāmantrya saubalasya mate sthitaḥ"
  - id: 'adi-1-137-47'
    kind: verse
    lines:
      - भोजने भीमसेनस्य ततः प्राक्षेपयद्विषम्
      - कालकूटं विषं तीक्ष्णं संभृतं रोमहर्षणम्
    iast: "bhojane bhīmasenasya tataḥ prākṣepayadviṣam | kālakūṭaṃ viṣaṃ tīkṣṇaṃ saṃbhṛtaṃ romaharṣaṇam"
  - id: 'adi-1-137-48'
    kind: verse
    lines:
      - तच्चापि भुक्त्वाऽजरदॉयदविकारो वृकोदरः
      - विकारं नाभ्यजनयत्सुतीक्ष्णमपि तद्विषम्
    iast: "taccāpi bhuktvā'jaradaॉyadavikāro vṛkodaraḥ | vikāraṃ nābhyajanayatsutīkṣṇamapi tadviṣam"
  - id: 'adi-1-137-52'
    kind: verse
    lines:
      - वैश्या पुत्रस्तदाचष्ट पार्थानां हितकाम्यया पाण्डवा ह्यपि तत्सर्वं प्रत्यजानन्नरिन्दमाः
      - उद्भावनमकुर्वन्तो विदुरस्य मते स्थिताः
    iast: "vaiśyā putrastadācaṣṭa pārthānāṃ hitakāmyayā pāṇḍavā hyapi tatsarvaṃ pratyajānannarindamāḥ | udbhāvanamakurvanto vidurasya mate sthitāḥ"
  - id: 'adi-1-142-18'
    kind: verse
    lines:
      - ततो द्रोणः पाण्डुपुत्रानस्त्राणि विविधानि च
      - ग्राहयामास दिव्यानि मानुषाणि च वीर्यवान्
    iast: "tato droṇaḥ pāṇḍuputrānastrāṇi vividhāni ca | grāhayāmāsa divyāni mānuṣāṇi ca vīryavān"
  - id: 'adi-1-142-19'
    kind: verse
    lines:
      - राजपुत्रास्तथा चान्ये समेत्य भरतर्षभ
      - अभिजग्मुस्ततो द्रोणमस्त्रार्थे द्विजसत्तमम्
    iast: "rājaputrāstathā cānye sametya bharatarṣabha | abhijagmustato droṇamastrārthe dvijasattamam"
  - id: 'adi-1-142-21'
    kind: verse
    lines:
      - स्पर्धमानस्तु पार्थेन सूतपुत्रोऽत्यमर्षणः
      - दुर्योधनं समाश्रित्य सोऽवमन्यत पाण्डवान्
    iast: "spardhamānastu pārthena sūtaputro'tyamarṣaṇaḥ | duryodhanaṃ samāśritya so'vamanyata pāṇḍavān"
  - id: 'adi-1-142-22'
    kind: verse
    lines:
      - अभ्ययात्स ततो द्रोणं धनुर्वेदचिकीर्षया
      - शिक्षाभुजवलोद्योगैस्तेषु सर्वेषु पाण्डवः
    iast: "abhyayātsa tato droṇaṃ dhanurvedacikīrṣayā | śikṣābhujavalodyogaisteṣu sarveṣu pāṇḍavaḥ"
  - id: 'adi-1-142-24'
    kind: verse
    lines:
      - सर्वेषामेव शिष्याणां बभूवाभ्यधिकोऽर्जुनः
      - ऐन्द्रिमप्रतिमं द्रोण उपदेशेष्वमन्यत
    iast: "sarveṣāmeva śiṣyāṇāṃ babhūvābhyadhiko'rjunaḥ | aindrimapratimaṃ droṇa upadeśeṣvamanyata"
  - id: 'adi-1-142-29'
    kind: verse
    lines:
      - न व्यहीयत मेधावी पार्थोऽप्यस्त्रविदां वरः
      - अर्जुनः परमं यत्नमातिष्ठद्गुरुपूजने
    iast: "na vyahīyata medhāvī pārtho'pyastravidāṃ varaḥ | arjunaḥ paramaṃ yatnamātiṣṭhadgurupūjane"
  - id: 'adi-1-142-30'
    kind: verse
    lines:
      - अस्त्रे च परमं योगं प्रियो द्रोणस्य चाभवत्
      - तं दृष्ट्वा नित्यमुद्युक्तमिष्वस्त्रं प्रति फाल्गुनम्
    iast: "astre ca paramaṃ yogaṃ priyo droṇasya cābhavat | taṃ dṛṣṭvā nityamudyuktamiṣvastraṃ prati phālgunam"
  - id: 'adi-1-143-27'
    kind: verse
    lines:
      - तथेति संप्रतिश्रुत्य बीभत्सुः स कृताञ्जलिः जग्राह परमास्त्रं तदाह चैनं पुनर्गुरुः
      - भविता त्वत्समो नान्यः पुमाँल्लोके धनुर्धरः
    iast: "tatheti saṃpratiśrutya bībhatsuḥ sa kṛtāñjaliḥ jagrāha paramāstraṃ tadāha cainaṃ punarguruḥ | bhavitā tvatsamo nānyaḥ pumām̐lloke dhanurdharaḥ"
  - id: 'adi-1-144-1'
    kind: verse
    lines:
      - कृतास्त्रान्धार्तराष्ट्रांश्च पाण्डुपुत्रांश्च भारत
      - दृष्ट्वा द्रोणोऽब्रवीद्राजन्धृतराष्ट्रं जनेश्वरम्
    iast: "kṛtāstrāndhārtarāṣṭrāṃśca pāṇḍuputrāṃśca bhārata | dṛṣṭvā droṇo'bravīdrājandhṛtarāṣṭraṃ janeśvaram"
  - id: 'adi-1-144-3'
    kind: verse
    lines:
      - राजन्संप्राप्तविद्यास्ते कुमाराः कुरुसत्तम
      - ते दर्शयेयुः स्वां शिक्षां राजन्ननुमते तव
    iast: "rājansaṃprāptavidyāste kumārāḥ kurusattama | te darśayeyuḥ svāṃ śikṣāṃ rājannanumate tava"
  - id: 'adi-1-144-8'
    kind: verse
    lines:
      - ततो राजानमामन्त्र्य विदुरानुमतोपि हि
      - भारद्वाजो महाप्राज्ञो मापयामास मेदिनीम्
    iast: "tato rājānamāmantrya vidurānumatopi hi | bhāradvājo mahāprājño māpayāmāsa medinīm"
  - id: 'adi-1-144-10'
    kind: verse
    lines:
      - अवघुष्टं पुरं चापि तदर्थं भरतर्षभ
      - रङ्गभूमौ सुविपुलं शास्त्रदृष्टं यथाविधि
    iast: "avaghuṣṭaṃ puraṃ cāpi tadarthaṃ bharatarṣabha | raṅgabhūmau suvipulaṃ śāstradṛṣṭaṃ yathāvidhi"
  - id: 'adi-1-144-11'
    kind: verse
    lines:
      - प्रेक्षागारं सुविहितं चक्रस्ते तस्य शिल्पिनः
      - रक्षां सर्वायुधोपेतां स्त्रीणां चैव नरर्षभ
    iast: "prekṣāgāraṃ suvihitaṃ cakraste tasya śilpinaḥ | rakṣāṃ sarvāyudhopetāṃ strīṇāṃ caiva nararṣabha"
  - id: 'adi-1-144-13'
    kind: verse
    lines:
      - तस्मिंस्ततोऽहनि प्राप्ते राजा ससचिवस्तदा सान्तःपुरः सहामात्यो व्यासस्यानुमते तदा
      - भीष्मं प्रमुखतः कृत्वा कृपं चाचार्यसत्तमम्
    iast: "tasmiṃstato'hani prāpte rājā sasacivastadā sāntaḥpuraḥ sahāmātyo vyāsasyānumate tadā | bhīṣmaṃ pramukhataḥ kṛtvā kṛpaṃ cācāryasattamam"
  - id: 'adi-1-144-16'
    kind: verse
    lines:
      - मुक्ताजालपरिक्षिप्तं वैदूर्यममिशोभितम्
      - शातकुम्भमयं दिव्यं प्रेक्षागारमुपागमत्
    iast: "muktājālaparikṣiptaṃ vaidūryamamiśobhitam | śātakumbhamayaṃ divyaṃ prekṣāgāramupāgamat"
  - id: 'adi-1-144-17'
    kind: verse
    lines:
      - गान्धारी च महाभागा कुन्ती च जयतां वर
      - स्त्रियश्च राज्ञः सर्वास्ताः सप्रेष्याः सपरिच्छदाः
    iast: "gāndhārī ca mahābhāgā kuntī ca jayatāṃ vara | striyaśca rājñaḥ sarvāstāḥ sapreṣyāḥ saparicchadāḥ"
  - id: 'adi-1-144-18'
    kind: verse
    lines:
      - हर्षादारुरुहुर्मञ्चान्मेरुं देवस्त्रियो यथा
      - ब्राह्मणक्षत्रियाद्यं च चातुर्वर्ण्यं पुराद्द्रुतम्
    iast: "harṣādāruruhurmañcānmeruṃ devastriyo yathā | brāhmaṇakṣatriyādyaṃ ca cāturvarṇyaṃ purāddrutam"
  - id: 'adi-1-144-20'
    kind: verse
    lines:
      - प्रवादितैश्च वादित्रैर्जनकौतूहलेन च
      - महार्णव इव क्षुब्धः समाजः सोऽभवत्तदा
    iast: "pravāditaiśca vāditrairjanakautūhalena ca | mahārṇava iva kṣubdhaḥ samājaḥ so'bhavattadā"
  - id: 'adi-1-144-21'
    kind: verse
    lines:
      - ततः शुक्लाम्बरधरः शुक्लयज्ञोपवीतवान्
      - शुक्लकेशः सितश्मश्रुः शुक्लाल्यानुलेपनः
    iast: "tataḥ śuklāmbaradharaḥ śuklayajñopavītavān | śuklakeśaḥ sitaśmaśruḥ śuklālyānulepanaḥ"
  - id: 'adi-1-144-22'
    kind: verse
    lines:
      - रङ्गमध्यं तदाचार्यः सपुत्रः प्रविवेश ह
      - नभो जलधरैर्हीनं साङ्गारक इवांशुमान्
    iast: "raṅgamadhyaṃ tadācāryaḥ saputraḥ praviveśa ha | nabho jaladharairhīnaṃ sāṅgāraka ivāṃśumān"
  - id: 'adi-1-144-26'
    kind: verse
    lines:
      - ततो बद्धाङ्गुलित्राणा बद्धकक्ष्या महारथाः
      - बद्धथूणाः सधनुषो विविशुर्भरतर्षभाः
    iast: "tato baddhāṅgulitrāṇā baddhakakṣyā mahārathāḥ | baddhathūṇāḥ sadhanuṣo viviśurbharatarṣabhāḥ"
  - id: 'adi-1-144-27'
    kind: verse
    lines:
      - रङ्गमध्ये स्थितं द्रोणमभिवाद्य नरर्षभाः
      - चक्रुः पूजां यथान्यायं द्रोणस्य च कृपस्य च
    iast: "raṅgamadhye sthitaṃ droṇamabhivādya nararṣabhāḥ | cakruḥ pūjāṃ yathānyāyaṃ droṇasya ca kṛpasya ca"
  - id: 'adi-1-144-30'
    kind: verse
    lines:
      - सर्वे रक्तपताकाश्च सर्वे रक्तान्तलोचनाः
      - द्रोणेन समनुज्ञाता गृह्य शस्त्रं परन्तपाः
    iast: "sarve raktapatākāśca sarve raktāntalocanāḥ | droṇena samanujñātā gṛhya śastraṃ parantapāḥ"
  - id: 'adi-1-144-32'
    kind: verse
    lines:
      - ज्याघोषं तलघोषं च कृत्वा भूतान्यमोहयन्
    iast: "jyāghoṣaṃ talaghoṣaṃ ca kṛtvā bhūtānyamohayan"
  - id: 'adi-1-144-33'
    kind: verse
    lines:
      - अनुज्येष्ठं च ते तत्र युधिष्ठिरपुनरोगमाः
      - चक्रुरस्त्रं महावीर्याः कुमाराः परमाद्भुतम्
    iast: "anujyeṣṭhaṃ ca te tatra yudhiṣṭhirapunarogamāḥ | cakrurastraṃ mahāvīryāḥ kumārāḥ paramādbhutam"
  - id: 'adi-1-144-42'
    kind: verse
    lines:
      - लाघवं सौष्ठवं शोभां स्थिरत्वं दृढमुष्टिताम्
      - ददृशुस्तत्र सर्वेषां प्रयोगं खड्गचर्मणोः
    iast: "lāghavaṃ sauṣṭhavaṃ śobhāṃ sthiratvaṃ dṛḍhamuṣṭitām | dadṛśustatra sarveṣāṃ prayogaṃ khaḍgacarmaṇoḥ"
  - id: 'adi-1-144-43'
    kind: verse
    lines:
      - अथ तौ नित्यसंहृष्टौ सुयोधनवृकोदरौ
      - अवतीर्णौ गदाहस्तावेकशृङ्गाविवाचलौ
    iast: "atha tau nityasaṃhṛṣṭau suyodhanavṛkodarau | avatīrṇau gadāhastāvekaśṛṅgāvivācalau"
  - id: 'adi-1-144-45'
    kind: verse
    lines:
      - तौ प्रदक्षिणसव्यानि मण्डलानि महाबलौ
      - चेरतुर्मण्डलगतौ समदाविव कुञ्जरौ
    iast: "tau pradakṣiṇasavyāni maṇḍalāni mahābalau | ceraturmaṇḍalagatau samadāviva kuñjarau"
  - id: 'adi-1-145-1'
    kind: verse
    lines:
      - कुरुराजे हि रङ्गस्थे भीमे च बलिनां वरे
      - पक्षपातकृतस्नेहः स द्विधेवाभवज्जनः
    iast: "kururāje hi raṅgasthe bhīme ca balināṃ vare | pakṣapātakṛtasnehaḥ sa dvidhevābhavajjanaḥ"
  - id: 'adi-1-145-2'
    kind: verse
    lines:
      - जय हे कुरुराजेति जय हे भीम इत्युत
      - पुरुषाणां सुविपुलाः प्रणादाः सहसोत्थिताः
    iast: "jaya he kururājeti jaya he bhīma ityuta | puruṣāṇāṃ suvipulāḥ praṇādāḥ sahasotthitāḥ"
  - id: 'adi-1-145-6'
    kind: verse
    lines:
      - ततस्तावुद्यतगतौ गुरुपुत्रेण वारितौ
      - युगान्तानिलसंक्षुब्धौ महावेलाविवार्णवौ
    iast: "tatastāvudyatagatau guruputreṇa vāritau | yugāntānilasaṃkṣubdhau mahāvelāvivārṇavau"
  - id: 'adi-1-145-7'
    kind: verse
    lines:
      - ततो रङ्गाङ्गणगतो द्रोणो वचनमब्रवीत्
      - निवार्य वादित्रगणं महामेघनिभस्वनम्
    iast: "tato raṅgāṅgaṇagato droṇo vacanamabravīt | nivārya vāditragaṇaṃ mahāmeghanibhasvanam"
  - id: 'adi-1-145-8'
    kind: verse
    lines:
      - यो मे पुत्रात्प्रियतरः सर्वशस्त्रविशारदः
      - ऐन्द्रिरिन्द्रानुजसमः स पार्थो दृश्यतामिति
    iast: "yo me putrātpriyataraḥ sarvaśastraviśāradaḥ | aindririndrānujasamaḥ sa pārtho dṛśyatāmiti"
  - id: 'adi-1-145-9'
    kind: verse
    lines:
      - आचार्यवचनेनाथ कृतस्वस्त्ययनो युवा
      - बद्धगोधाङ्गुलित्राणः पूर्णतूणः सकार्मुकः
    iast: "ācāryavacanenātha kṛtasvastyayano yuvā | baddhagodhāṅgulitrāṇaḥ pūrṇatūṇaḥ sakārmukaḥ"
  - id: 'adi-1-145-10'
    kind: verse
    lines:
      - काञ्चनं कवचं बिभ्रत्प्रत्यदृश्य फाल्गुनः
      - सार्कः सेन्द्रायुधतडित्ससन्ध्य इव तोयदः
    iast: "kāñcanaṃ kavacaṃ bibhratpratyadṛśya phālgunaḥ | sārkaḥ sendrāyudhataḍitsasandhya iva toyadaḥ"
  - id: 'adi-1-145-11'
    kind: verse
    lines:
      - ततः सर्वस्य रङ्गस्य समुत्पिञ्जलकोऽभवत्
      - प्रावाद्यन्त च वाद्यानि सशङ्खानि समन्ततः
      - प्रेक्षका ऊचुः
    iast: "tataḥ sarvasya raṅgasya samutpiñjalako'bhavat | prāvādyanta ca vādyāni saśaṅkhāni samantataḥ | prekṣakā ūcuḥ"
  - id: 'adi-1-145-12'
    kind: verse
    lines:
      - एष कुन्तीसुतः श्रीमानेष मध्यमपाण्डवः
      - एष पुत्रो महेन्द्रस्य कुरूणामेष रक्षिता
    iast: "eṣa kuntīsutaḥ śrīmāneṣa madhyamapāṇḍavaḥ | eṣa putro mahendrasya kurūṇāmeṣa rakṣitā"
  - id: 'adi-1-145-13'
    kind: verse
    lines:
      - एषोऽस्त्रविदुषां श्रेष्ठ एष धर्मभृतां वरः
      - एष शीलवतां चापि शीलज्ञाननिधिः परः
      - वैशंपायन उवाच
    iast: "eṣo'straviduṣāṃ śreṣṭha eṣa dharmabhṛtāṃ varaḥ | eṣa śīlavatāṃ cāpi śīlajñānanidhiḥ paraḥ | vaiśaṃpāyana uvāca"
  - id: 'adi-1-145-14'
    kind: verse
    lines:
      - इत्येवं तुमुला वाचः शुश्रुवुः प्रेक्षकेरिताः
      - कुन्त्याः प्रस्रवसंयुक्तैरस्रैः क्लिन्नमुरोऽभवत्
    iast: "ityevaṃ tumulā vācaḥ śuśruvuḥ prekṣakeritāḥ | kuntyāḥ prasravasaṃyuktairasraiḥ klinnamuro'bhavat"
  - id: 'adi-1-145-19'
    kind: verse
    lines:
      - तस्मिन्प्रमुदिते रङ्गे कथंचित्प्रत्युपस्थिते
      - दर्शयामास बीभत्सुराचार्यायास्त्रलाघवम्
    iast: "tasminpramudite raṅge kathaṃcitpratyupasthite | darśayāmāsa bībhatsurācāryāyāstralāghavam"
  - id: 'adi-1-145-27'
    kind: verse
    lines:
      - ततः समाप्तभूयिष्ठे तस्मिन्कर्मणि भारत
      - मन्दीभूते समाजे च वादित्रस्य च निःस्वने
    iast: "tataḥ samāptabhūyiṣṭhe tasminkarmaṇi bhārata | mandībhūte samāje ca vāditrasya ca niḥsvane"
  - id: 'adi-1-146-1'
    kind: verse
    lines:
      - एतस्मिन्नेव काले तु तस्मिञ्जनसमागमे दत्तेऽवकाशे पुरुषैर्विस्मयोत्फुल्ललोचनः
      - विवेश रङ्गं विस्तीर्णं कर्णः परपुरञ्जयः
    iast: "etasminneva kāle tu tasmiñjanasamāgame datte'vakāśe puruṣairvismayotphullalocanaḥ | viveśa raṅgaṃ vistīrṇaṃ karṇaḥ parapurañjayaḥ"
  - id: 'adi-1-146-2'
    kind: verse
    lines:
      - सहजं कवचं बिभ्रत्कुण्डलोद्द्योतिताननः
      - स धनुर्बद्धनिस्त्रिंशः पादचारीव पर्वतः
    iast: "sahajaṃ kavacaṃ bibhratkuṇḍaloddyotitānanaḥ | sa dhanurbaddhanistriṃśaḥ pādacārīva parvataḥ"
  - id: 'adi-1-146-6'
    kind: verse
    lines:
      - स निरीक्ष्य महाबाहुः सर्वतो रङ्गमण्डलम्
      - प्रणामं द्रोणकृपयोर्नात्यादृतमिवाकरोत्
    iast: "sa nirīkṣya mahābāhuḥ sarvato raṅgamaṇḍalam | praṇāmaṃ droṇakṛpayornātyādṛtamivākarot"
  - id: 'adi-1-146-7'
    kind: verse
    lines:
      - स समाजजनः सर्वो निश्चलः स्थिरलोचनः
      - कोऽयमित्यागतक्षोभः कौतूहलपरोऽभवत्
    iast: "sa samājajanaḥ sarvo niścalaḥ sthiralocanaḥ | ko'yamityāgatakṣobhaḥ kautūhalaparo'bhavat"
  - id: 'adi-1-146-8'
    kind: verse
    lines:
      - सोऽब्रवीन्मेघगम्भीरस्वरेण वदतां वरः
      - भ्राता भ्रातरमज्ञातं सावित्रः पाकशासनिम्
    iast: "so'bravīnmeghagambhīrasvareṇa vadatāṃ varaḥ | bhrātā bhrātaramajñātaṃ sāvitraḥ pākaśāsanim"
  - id: 'adi-1-146-9'
    kind: verse
    lines:
      - पार्थ यत्ते कृतं कर्म विशेषवदहं ततः
      - करिष्ये पश्यतां नॄणां माऽऽत्मना विस्मयं गमः
    iast: "pārtha yatte kṛtaṃ karma viśeṣavadahaṃ tataḥ | kariṣye paśyatāṃ nṝṇāṃ mā''tmanā vismayaṃ gamaḥ"
  - id: 'adi-1-146-10'
    kind: verse
    lines:
      - असमाप्ते ततस्तस्य वचने वदतां वर
      - यन्त्रोत्क्षिप्त इवोत्तस्थौ क्षिप्रं वै सर्वतो जनः
    iast: "asamāpte tatastasya vacane vadatāṃ vara | yantrotkṣipta ivottasthau kṣipraṃ vai sarvato janaḥ"
  - id: 'adi-1-146-11'
    kind: verse
    lines:
      - प्रीतिश्च मनुजव्याघ्र दुर्योधनमुपाविशत्
      - ह्रीश्च क्रोधश्च बीभत्सुं क्षणेनान्वाविवेश ह
    iast: "prītiśca manujavyāghra duryodhanamupāviśat | hrīśca krodhaśca bībhatsuṃ kṣaṇenānvāviveśa ha"
  - id: 'adi-1-146-12'
    kind: verse
    lines:
      - ततो द्रोणाभ्यनुज्ञातः कर्णः प्रियरणः सदा
      - यत्कृतं तत्र पार्थेन तच्चकार महाबलः
    iast: "tato droṇābhyanujñātaḥ karṇaḥ priyaraṇaḥ sadā | yatkṛtaṃ tatra pārthena taccakāra mahābalaḥ"
  - id: 'adi-1-146-13'
    kind: verse
    lines:
      - अथ दुर्योधनस्तत्र भ्रातृभिः सह भारत
      - कर्णं परिष्वज्य मुदा ततो वचनमब्रवीत्
    iast: "atha duryodhanastatra bhrātṛbhiḥ saha bhārata | karṇaṃ pariṣvajya mudā tato vacanamabravīt"
  - id: 'adi-1-146-14'
    kind: verse
    lines:
      - स्वागतं ते महाबाहो दिष्ट्या प्राप्तोऽसि मानद
      - अहं च कुरुराज्यं च यथेष्टमुपभुज्यताम्
      - कर्ण उवाच
    iast: "svāgataṃ te mahābāho diṣṭyā prāpto'si mānada | ahaṃ ca kururājyaṃ ca yatheṣṭamupabhujyatām | karṇa uvāca"
  - id: 'adi-1-146-17'
    kind: verse
    lines:
      - भुङ्क्ष्व भोगान्मया सार्धं बन्धूनां प्रियकृद्भव
      - दुर्हृदां कुरु सर्वेषां मूर्ध्नि पादमरिन्दम
      - वैशंपायन उवाच
    iast: "bhuṅkṣva bhogānmayā sārdhaṃ bandhūnāṃ priyakṛdbhava | durhṛdāṃ kuru sarveṣāṃ mūrdhni pādamarindama | vaiśaṃpāyana uvāca"
  - id: 'adi-1-146-18'
    kind: verse
    lines:
      - ततः क्षिप्तमिवात्मानं मत्वा पार्थोऽभ्यभाषत
      - कर्णं भ्रातृसमूहस्य मध्येऽचलमिव स्थितम्
      - अर्जुन उवाच
    iast: "tataḥ kṣiptamivātmānaṃ matvā pārtho'bhyabhāṣata | karṇaṃ bhrātṛsamūhasya madhye'calamiva sthitam | arjuna uvāca"
  - id: 'adi-1-146-19'
    kind: verse
    lines:
      - अनाहूतोपसृष्टानामनाहूतोपजल्पिनाम्
      - ये लोकास्तान्हतः कर्ण मया त्वं प्रतिपत्स्यसे
      - कर्ण उवाच
    iast: "anāhūtopasṛṣṭānāmanāhūtopajalpinām | ye lokāstānhataḥ karṇa mayā tvaṃ pratipatsyase | karṇa uvāca"
  - id: 'adi-1-146-22'
    kind: verse
    lines:
      - ततो द्रोणाभ्यनुज्ञातः पार्तः परपुरञ्जयः
      - भ्रातृभिस्त्वरयाश्लिष्टो रणायोपजगाम तम्
    iast: "tato droṇābhyanujñātaḥ pārtaḥ parapurañjayaḥ | bhrātṛbhistvarayāśliṣṭo raṇāyopajagāma tam"
  - id: 'adi-1-146-23'
    kind: verse
    lines:
      - ततो दुर्योधनेनापि स भ्रात्रा समरोद्यतः
      - परिष्वक्तः स्थितः कर्णः प्रगृह्य सशरं धनुः
    iast: "tato duryodhanenāpi sa bhrātrā samarodyataḥ | pariṣvaktaḥ sthitaḥ karṇaḥ pragṛhya saśaraṃ dhanuḥ"
  - id: 'adi-1-146-27'
    kind: verse
    lines:
      - धार्तराष्ट्रा यतः कर्णस्तस्मिन्देशे व्यवस्थिताः
      - भारद्वाजः कृपो भीष्मो यतः पार्थस्ततोऽभवन्
    iast: "dhārtarāṣṭrā yataḥ karṇastasmindeśe vyavasthitāḥ | bhāradvājaḥ kṛpo bhīṣmo yataḥ pārthastato'bhavan"
  - id: 'adi-1-146-28'
    kind: verse
    lines:
      - द्विधा रङ्गः समभवत्स्त्रीणां द्वैधमजायत
      - कुन्तिभोजसुता मोहं विज्ञातार्था जगाम ह
    iast: "dvidhā raṅgaḥ samabhavatstrīṇāṃ dvaidhamajāyata | kuntibhojasutā mohaṃ vijñātārthā jagāma ha"
  - id: 'adi-1-146-31'
    kind: verse
    lines:
      - तावुद्यतमहाचापौ कृपः शारद्वतोऽब्रवीत्
      - द्वन्द्वयुद्धसमाचारे कुशलः सर्वधर्मवित्
    iast: "tāvudyatamahācāpau kṛpaḥ śāradvato'bravīt | dvandvayuddhasamācāre kuśalaḥ sarvadharmavit"
  - id: 'adi-1-146-32'
    kind: verse
    lines:
      - अयं पृथायास्तनयः कनीयान्पाण्डुनन्दनः
      - कौरवो भवता सार्धं द्वन्द्वयुद्धं करिष्यति
    iast: "ayaṃ pṛthāyāstanayaḥ kanīyānpāṇḍunandanaḥ | kauravo bhavatā sārdhaṃ dvandvayuddhaṃ kariṣyati"
  - id: 'adi-1-146-33'
    kind: verse
    lines:
      - त्वमप्येवं महाबाहो मातरं पितरं कुलम्
      - कथयस्व नरेन्द्राणां येषां त्वं कुलभूषणम्
    iast: "tvamapyevaṃ mahābāho mātaraṃ pitaraṃ kulam | kathayasva narendrāṇāṃ yeṣāṃ tvaṃ kulabhūṣaṇam"
  - id: 'adi-1-146-34'
    kind: verse
    lines:
      - ततो विदित्वा पार्थस्त्वां प्रतियोत्स्यति वा न वा
      - वृथाकुलसमाचारैर्न युध्यन्ते नृपात्मजाः
      - वैशंपायन उवाच
    iast: "tato viditvā pārthastvāṃ pratiyotsyati vā na vā | vṛthākulasamācārairna yudhyante nṛpātmajāḥ | vaiśaṃpāyana uvāca"
  - id: 'adi-1-146-39'
    kind: verse
    lines:
      - ततो राजानमामन्त्र्य गाङ्गेयं च पितामहम्
      - अभिषेकस्य संभारान्समानीय द्विजातिभिः
    iast: "tato rājānamāmantrya gāṅgeyaṃ ca pitāmaham | abhiṣekasya saṃbhārānsamānīya dvijātibhiḥ"
  - id: 'adi-1-146-40'
    kind: verse
    lines:
      - गोसहस्रायुतं दत्त्वा युक्तानां पुण्यकर्मणाम्
      - अर्होऽयमङ्गराज्यस्य इति वाच्य द्विजातिभिः
    iast: "gosahasrāyutaṃ dattvā yuktānāṃ puṇyakarmaṇām | arho'yamaṅgarājyasya iti vācya dvijātibhiḥ"
  - id: 'adi-1-146-44'
    kind: verse
    lines:
      - उवाच कौरवं राजन्वचनं स वृषस्तदा
      - अस्य राज्यप्रदानस्य सदृशं किं ददानि ते
    iast: "uvāca kauravaṃ rājanvacanaṃ sa vṛṣastadā | asya rājyapradānasya sadṛśaṃ kiṃ dadāni te"
  - id: 'adi-1-146-45'
    kind: verse
    lines:
      - प्रब्रूहि राजशार्दूल कर्ता ह्यस्मि तथा नृप
      - अत्यन्तं सख्यमिच्छामीत्याह तं स सुयोधनः
    iast: "prabrūhi rājaśārdūla kartā hyasmi tathā nṛpa | atyantaṃ sakhyamicchāmītyāha taṃ sa suyodhanaḥ"
  - id: 'adi-1-146-46'
    kind: verse
    lines:
      - एवमुक्तस्ततः कर्णस्तथेति प्रत्युवाच तम्
      - हर्षाच्चोभौ समाश्लिष्य परां मुदमवापतुः
    iast: "evamuktastataḥ karṇastatheti pratyuvāca tam | harṣāccobhau samāśliṣya parāṃ mudamavāpatuḥ"
  - id: 'adi-1-147-1'
    kind: verse
    lines:
      - ततः स्रस्तोत्तरपटः सप्रस्वेदः सवेपथुः
      - विवेशाधिरथो रङ्गं यष्टिप्राणो ह्वयन्निव
    iast: "tataḥ srastottarapaṭaḥ saprasvedaḥ savepathuḥ | viveśādhiratho raṅgaṃ yaṣṭiprāṇo hvayanniva"
  - id: 'adi-1-147-2'
    kind: verse
    lines:
      - तमालोक्य धनुस्त्यक्त्वा पितृगौरवयन्त्रितः
      - कर्णोऽभिषेकार्द्रशिराः शिरसा समवन्दत
    iast: "tamālokya dhanustyaktvā pitṛgauravayantritaḥ | karṇo'bhiṣekārdraśirāḥ śirasā samavandata"
  - id: 'adi-1-147-5'
    kind: verse
    lines:
      - तं दृष्ट्वा सूतपुत्रोऽयमिति संचिन्त्य पाण्डवः
      - भीमसेनस्तदा वाक्यमब्रवीत्प्रहसन्निव
    iast: "taṃ dṛṣṭvā sūtaputro'yamiti saṃcintya pāṇḍavaḥ | bhīmasenastadā vākyamabravītprahasanniva"
  - id: 'adi-1-147-6'
    kind: verse
    lines:
      - न त्वमर्हसि पार्थेन सूतपुत्र रणे वधम्
      - कुलस्य सदृशस्तूर्णं प्रतोदो गृह्यतां त्वया
    iast: "na tvamarhasi pārthena sūtaputra raṇe vadham | kulasya sadṛśastūrṇaṃ pratodo gṛhyatāṃ tvayā"
  - id: 'adi-1-147-7'
    kind: verse
    lines:
      - अङ्गराज्यं च नार्हस्त्वमुपभोक्तुं नराधम
      - श्वा हुताशसमीपस्थं पुरोडाशमिवाध्वरे
      - वैशंपायन उवाच
    iast: "aṅgarājyaṃ ca nārhastvamupabhoktuṃ narādhama | śvā hutāśasamīpasthaṃ puroḍāśamivādhvare | vaiśaṃpāyana uvāca"
  - id: 'adi-1-147-9'
    kind: verse
    lines:
      - ततो दुर्योधनः कोपादुत्पपात महाबलः
      - भ्रातृपद्मवनात्तस्मान्मदोत्कट इव द्विपः
    iast: "tato duryodhanaḥ kopādutpapāta mahābalaḥ | bhrātṛpadmavanāttasmānmadotkaṭa iva dvipaḥ"
  - id: 'adi-1-147-10'
    kind: verse
    lines:
      - सोऽब्रवीद्भीमकर्माणं भीमसेनमवस्थितम्
      - वृकोदर न युक्तं ते वचनं वक्तुमीदृशम्
    iast: "so'bravīdbhīmakarmāṇaṃ bhīmasenamavasthitam | vṛkodara na yuktaṃ te vacanaṃ vaktumīdṛśam"
  - id: 'adi-1-147-11'
    kind: verse
    lines:
      - क्षत्रियाणां बलं ज्यष्ठं योक्तव्यं क्षत्रबन्धुना
      - शूराणां च नदीनां च प्रभवो दुर्विभावनः
    iast: "kṣatriyāṇāṃ balaṃ jyaṣṭhaṃ yoktavyaṃ kṣatrabandhunā | śūrāṇāṃ ca nadīnāṃ ca prabhavo durvibhāvanaḥ"
  - id: 'adi-1-147-16'
    kind: verse
    lines:
      - भवतां च यथा जन्म तदप्यागमितं मया सकुण्डलं सकवचं सर्वलक्षणलक्षितम्
      - कथमादित्यसदृशं मृगी व्याघ्रं जनिष्यति
    iast: "bhavatāṃ ca yathā janma tadapyāgamitaṃ mayā sakuṇḍalaṃ sakavacaṃ sarvalakṣaṇalakṣitam | kathamādityasadṛśaṃ mṛgī vyāghraṃ janiṣyati"
  - id: 'adi-1-147-17'
    kind: verse
    lines:
      - पृथिवीराज्यमर्होऽयं नाङ्गराज्यं नरेश्वरः
      - अनेन बाहुवीर्येण मया चाज्ञानुवर्तिना
    iast: "pṛthivīrājyamarho'yaṃ nāṅgarājyaṃ nareśvaraḥ | anena bāhuvīryeṇa mayā cājñānuvartinā"
  - id: 'adi-1-147-18'
    kind: verse
    lines:
      - यस्य वा मनुजस्येदं न क्षान्तं मद्विचेष्टितम्
      - रथमारुह्य पद्भ्यां स विनामयतु कार्मुकम्
    iast: "yasya vā manujasyedaṃ na kṣāntaṃ madviceṣṭitam | rathamāruhya padbhyāṃ sa vināmayatu kārmukam"
  - id: 'adi-1-147-19'
    kind: verse
    lines:
      - ततः सर्वस्य रङ्गस्य हाहाकारो महानभूत्
      - साधुवादानुसंबद्धः सूर्यश्चास्तमुपागमत्
    iast: "tataḥ sarvasya raṅgasya hāhākāro mahānabhūt | sādhuvādānusaṃbaddhaḥ sūryaścāstamupāgamat"
  - id: 'adi-1-147-20'
    kind: verse
    lines:
      - ततो दुर्योधनः कर्णमालम्ब्याग्रकरे नृपः
      - दीपिकाभिः कृतालोकस्तस्माद्रङ्गाद्विनिर्ययौ
    iast: "tato duryodhanaḥ karṇamālambyāgrakare nṛpaḥ | dīpikābhiḥ kṛtālokastasmādraṅgādviniryayau"
  - id: 'adi-1-147-21'
    kind: verse
    lines:
      - पाण्डवाश्च सहद्रोणाः सकृपाश्च विशांपते
      - भीष्मेण सहिताः सर्वे ययुः स्वं स्वं निवेशनम्
    iast: "pāṇḍavāśca sahadroṇāḥ sakṛpāśca viśāṃpate | bhīṣmeṇa sahitāḥ sarve yayuḥ svaṃ svaṃ niveśanam"
  - id: 'adi-1-147-22'
    kind: verse
    lines:
      - अर्जुनेति जनः कश्चित्कश्चित्कर्णेति भारत
      - कश्चिद्दुर्योधनेत्येवं ब्रुवन्तः प्रस्थितास्तदा
    iast: "arjuneti janaḥ kaścitkaścitkarṇeti bhārata | kaścidduryodhanetyevaṃ bruvantaḥ prasthitāstadā"
  - id: 'adi-1-147-24'
    kind: verse
    lines:
      - दुर्योधनस्यापि तदा कर्णमासाद्य पार्थिव
      - भयमर्जुनसंजातं क्षिप्रमन्तरधीयत
    iast: "duryodhanasyāpi tadā karṇamāsādya pārthiva | bhayamarjunasaṃjātaṃ kṣipramantaradhīyata"
  - id: 'adi-1-151-1'
    kind: verse
    lines:
      - धृतराष्ट्रस्तु राजन्द्रे यदा कौरवनन्दनम्
      - युधिष्ठिरं विजानन्वै समर्थं राज्यरक्षणे
    iast: "dhṛtarāṣṭrastu rājandre yadā kauravanandanam | yudhiṣṭhiraṃ vijānanvai samarthaṃ rājyarakṣaṇe"
  - id: 'adi-1-151-2'
    kind: verse
    lines:
      - यौवराज्याभिषेकार्थममन्त्रयत मन्त्रिभिः
      - ते तु बुद्ध्वान्वतप्यन्त धृतराष्ट्रात्मजास्तदा
    iast: "yauvarājyābhiṣekārthamamantrayata mantribhiḥ | te tu buddhvānvatapyanta dhṛtarāṣṭrātmajāstadā"
  - id: 'adi-1-151-3'
    kind: verse
    lines:
      - ततः संवत्सरस्यान्ते यौवराज्याय पार्थिव
      - स्थापितो धृतराष्ट्रेण पाण्डुपुत्रो युधिष्ठिरः
    iast: "tataḥ saṃvatsarasyānte yauvarājyāya pārthiva | sthāpito dhṛtarāṣṭreṇa pāṇḍuputro yudhiṣṭhiraḥ"
  - id: 'adi-1-151-4'
    kind: verse
    lines:
      - ततोऽदीर्घेण कालेन कुन्तीपुत्रो युधिष्ठिरः
      - पितुरन्तर्दधे कीर्तिं शीलवृत्तसमाधिभिः
    iast: "tato'dīrgheṇa kālena kuntīputro yudhiṣṭhiraḥ | piturantardadhe kīrtiṃ śīlavṛttasamādhibhiḥ"
  - id: 'adi-1-151-18'
    kind: verse
    lines:
      - द्रोणो जगाद वचनं समालिङ्ग्य तु फाल्गुनम्
      - यन्मयोक्तं पुरा पार्थ तव लोके नरं क्वचित्
    iast: "droṇo jagāda vacanaṃ samāliṅgya tu phālgunam | yanmayoktaṃ purā pārtha tava loke naraṃ kvacit"
  - id: 'adi-1-151-20'
    kind: verse
    lines:
      - देवा युधि न शक्तास्त्वां योद्धुं दैत्या न दानवाः
      - नाहं त्वत्तो विशिष्टोऽस्मि किं पुनर्मानवा रणे
    iast: "devā yudhi na śaktāstvāṃ yoddhuṃ daityā na dānavāḥ | nāhaṃ tvatto viśiṣṭo'smi kiṃ punarmānavā raṇe"
  - id: 'adi-1-151-21'
    kind: verse
    lines:
      - एकस्तवाधिको लोके यो हि वृष्णिकुलोद्भवः
      - कृष्णः कमलपत्राक्षः कंसकालियसूदनः
    iast: "ekastavādhiko loke yo hi vṛṣṇikulodbhavaḥ | kṛṣṇaḥ kamalapatrākṣaḥ kaṃsakāliyasūdanaḥ"
  - id: 'adi-1-151-29'
    kind: verse
    lines:
      - न तेन भवतो युद्धं भविता नर्मतोऽपि वा
      - अपिचार्थे तव पुरा शक्रेण किल चोदितः
    iast: "na tena bhavato yuddhaṃ bhavitā narmato'pi vā | apicārthe tava purā śakreṇa kila coditaḥ"
  - id: 'adi-1-151-33'
    kind: verse
    lines:
      - तमुवाच ततः श्रीमाञ्शङ्खचक्रगदाधरः
      - जानामि पाण्डवे वंशे जातं पार्थं पितृष्वसुः
    iast: "tamuvāca tataḥ śrīmāñśaṅkhacakragadādharaḥ | jānāmi pāṇḍave vaṃśe jātaṃ pārthaṃ pitṛṣvasuḥ"
  - id: 'adi-1-151-35'
    kind: verse
    lines:
      - आवयोः सख्यसदृशं न च लोके भविष्यति
      - यस्तद्भक्तः समद्भक्तो यस्तं द्वेष्टि स मामपि
    iast: "āvayoḥ sakhyasadṛśaṃ na ca loke bhaviṣyati | yastadbhaktaḥ samadbhakto yastaṃ dveṣṭi sa māmapi"
  - id: 'adi-1-151-36'
    kind: verse
    lines:
      - यन्मे वित्तं तु तत्तस्य तं विनाहं न जीवये
      - इति पार्थ पुरा शक्रमाह सर्वेश्वरो हरिः
    iast: "yanme vittaṃ tu tattasya taṃ vināhaṃ na jīvaye | iti pārtha purā śakramāha sarveśvaro hariḥ"
  - id: 'adi-1-151-37'
    kind: verse
    lines:
      - तस्मात्तवापि सदृशस्तं विनाभ्यधिकः पुमान्
      - न चेह भविता लोके तमेव शरणं व्रज
    iast: "tasmāttavāpi sadṛśastaṃ vinābhyadhikaḥ pumān | na ceha bhavitā loke tameva śaraṇaṃ vraja"
  - id: 'adi-1-151-39'
    kind: verse
    lines:
      - तथेति च प्रतिज्ञाय द्रोणाय कुरुपुङ्गवः
      - उपसंगृह्य चरणौ युधिष्ठिरवशोऽभवत्
    iast: "tatheti ca pratijñāya droṇāya kurupuṅgavaḥ | upasaṃgṛhya caraṇau yudhiṣṭhiravaśo'bhavat"
  - id: 'adi-1-151-45'
    kind: verse
    lines:
      - न शशाक वशे कर्तुं यं पाण्डुरपि वीर्यवान्
      - सोऽर्जुनेन वशं नीतो राजासीद्यवनाधिपः
    iast: "na śaśāka vaśe kartuṃ yaṃ pāṇḍurapi vīryavān | so'rjunena vaśaṃ nīto rājāsīdyavanādhipaḥ"
  - id: 'adi-1-151-47'
    kind: verse
    lines:
      - दत्तामित्र इति ख्यातं सङ्ग्रामे कृतनिश्चयम्
      - सुमित्रं नाम सौवीरमर्जुनोऽदमयच्छरैः
    iast: "dattāmitra iti khyātaṃ saṅgrāme kṛtaniścayam | sumitraṃ nāma sauvīramarjuno'damayaccharaiḥ"
  - id: 'adi-1-151-48'
    kind: verse
    lines:
      - भीमसेनसहायश्च रथानामयुतं च सः
      - अर्जुनः समरे प्राच्यान्सर्वानेकरथोऽजयत्
    iast: "bhīmasenasahāyaśca rathānāmayutaṃ ca saḥ | arjunaḥ samare prācyānsarvānekaratho'jayat"
  - id: 'adi-1-151-49'
    kind: verse
    lines:
      - तथैवैकरथो गत्वा दक्षिणामजयद्दिशम्
      - धनौघं प्रापयामास कुरुराष्ट्रं धनञ्जयः
    iast: "tathaivaikaratho gatvā dakṣiṇāmajayaddiśam | dhanaughaṃ prāpayāmāsa kururāṣṭraṃ dhanañjayaḥ"
  - id: 'adi-1-151-50'
    kind: verse
    lines:
      - यतः पञ्चदशे वर्षे सर्वमेतच्चकार सः
      - तं दृष्ट्वा धार्तराष्ट्राणां ततो भयमजायत
    iast: "yataḥ pañcadaśe varṣe sarvametaccakāra saḥ | taṃ dṛṣṭvā dhārtarāṣṭrāṇāṃ tato bhayamajāyata"
  - id: 'adi-1-151-54'
    kind: verse
    lines:
      - एवं सर्वे महात्मानः पाण्डवा मनुजोत्तमाः
      - परराष्ट्राणि निर्जित्य स्वराष्ट्रं ववृधुः पुरा
    iast: "evaṃ sarve mahātmānaḥ pāṇḍavā manujottamāḥ | pararāṣṭrāṇi nirjitya svarāṣṭraṃ vavṛdhuḥ purā"
  - id: 'adi-1-151-55'
    kind: verse
    lines:
      - ततो बलमतिख्यातं विज्ञाय दृढधन्विनाम् दूषितः सहसा भावो धृतराष्ट्रस्य पाण्डुषु
      - स चिन्तापरमो राजा न निद्रामलभन्निशि
    iast: "tato balamatikhyātaṃ vijñāya dṛḍhadhanvinām dūṣitaḥ sahasā bhāvo dhṛtarāṣṭrasya pāṇḍuṣu | sa cintāparamo rājā na nidrāmalabhanniśi"
  - id: 'adi-1-152-4'
    kind: verse
    lines:
      - गुणैः समुदितान्दृष्ट्वा पौराः पाण्डुसुतांस्तदा
      - कथयाञ्चक्रिरे तेषां गुणान्संसत्सु भारत
    iast: "guṇaiḥ samuditāndṛṣṭvā paurāḥ pāṇḍusutāṃstadā | kathayāñcakrire teṣāṃ guṇānsaṃsatsu bhārata"
  - id: 'adi-1-152-5'
    kind: verse
    lines:
      - राज्यप्राप्तिं च संप्राप्तं ज्येष्ठं पाण्डुसुतं तदा
      - कथयन्ति स्म संभूय चत्वरेषु सभासु च
    iast: "rājyaprāptiṃ ca saṃprāptaṃ jyeṣṭhaṃ pāṇḍusutaṃ tadā | kathayanti sma saṃbhūya catvareṣu sabhāsu ca"
  - id: 'adi-1-152-6'
    kind: verse
    lines:
      - प्रज्ञाश्चक्षुरचक्षुष्ट्वाद्धृतराष्ट्रो जनेश्वरः
      - राज्यं न प्राप्तवान्पूर्वं स कथं नृपतिर्भवेत्
    iast: "prajñāścakṣuracakṣuṣṭvāddhṛtarāṣṭro janeśvaraḥ | rājyaṃ na prāptavānpūrvaṃ sa kathaṃ nṛpatirbhavet"
  - id: 'adi-1-152-7'
    kind: verse
    lines:
      - तथा शान्तनवो भीष्मः सत्यसन्धो महाव्रतः
      - प्रत्याख्याय पुरा राज्यं न स जातु ग्रहीष्यति
    iast: "tathā śāntanavo bhīṣmaḥ satyasandho mahāvrataḥ | pratyākhyāya purā rājyaṃ na sa jātu grahīṣyati"
  - id: 'adi-1-152-8'
    kind: verse
    lines:
      - ते वयं पाण्डवज्येष्ठं तरुणं वृद्धशीलिनम्
      - अभिषिञ्चाम साध्वद्य सत्यकारुण्यवेदिनम्
    iast: "te vayaṃ pāṇḍavajyeṣṭhaṃ taruṇaṃ vṛddhaśīlinam | abhiṣiñcāma sādhvadya satyakāruṇyavedinam"
  - id: 'adi-1-152-10'
    kind: verse
    lines:
      - तेषां दुर्योधनः श्रुत्वा तानि वाक्यानि जल्पताम्
      - युधिष्ठिरानुरक्तानां पर्यतप्यत दुर्मतिः
    iast: "teṣāṃ duryodhanaḥ śrutvā tāni vākyāni jalpatām | yudhiṣṭhirānuraktānāṃ paryatapyata durmatiḥ"
  - id: 'adi-1-152-12'
    kind: verse
    lines:
      - ततो विरहितं दृष्ट्वा पितरं प्रतिपूज्य सः
      - पौरानुरागसंतप्तः पश्चादिदमभाषत
    iast: "tato virahitaṃ dṛṣṭvā pitaraṃ pratipūjya saḥ | paurānurāgasaṃtaptaḥ paścādidamabhāṣata"
  - id: 'adi-1-152-13'
    kind: verse
    lines:
      - श्रुता मे जल्पतां तात पौराणामशिवा गिरः
      - त्वामनादृत्य भीष्मं च पतिमिच्छन्ति पाण्डवम्
    iast: "śrutā me jalpatāṃ tāta paurāṇāmaśivā giraḥ | tvāmanādṛtya bhīṣmaṃ ca patimicchanti pāṇḍavam"
  - id: 'adi-1-152-14'
    kind: verse
    lines:
      - मतमेतच्च भीष्मस्य न स राज्यं बुभुक्षति
      - अस्माकं तु परां पीडां चिकीर्षन्ति पुरे जनाः
    iast: "matametacca bhīṣmasya na sa rājyaṃ bubhukṣati | asmākaṃ tu parāṃ pīḍāṃ cikīrṣanti pure janāḥ"
  - id: 'adi-1-152-15'
    kind: verse
    lines:
      - पितृतः प्राप्तवान्राज्यं पाण्डुरात्मगुणैः पुरा
      - त्वमन्धगुणसंयोगात्प्राप्तं राज्यं न लब्धवान्
    iast: "pitṛtaḥ prāptavānrājyaṃ pāṇḍurātmaguṇaiḥ purā | tvamandhaguṇasaṃyogātprāptaṃ rājyaṃ na labdhavān"
  - id: 'adi-1-152-16'
    kind: verse
    lines:
      - स एष पाण्डोर्दायाद्यं यदि प्राप्नोति पाण्डवः
      - तस्य पुत्रो ध्रुवं प्राप्तस्तस्य तस्यापि चापरः
    iast: "sa eṣa pāṇḍordāyādyaṃ yadi prāpnoti pāṇḍavaḥ | tasya putro dhruvaṃ prāptastasya tasyāpi cāparaḥ"
  - id: 'adi-1-152-17'
    kind: verse
    lines:
      - ते वयं राजवंशेन हीनाः सह सुतैरपि
      - अवज्ञाता भविष्यामो लोकस्य जगतीपते
    iast: "te vayaṃ rājavaṃśena hīnāḥ saha sutairapi | avajñātā bhaviṣyāmo lokasya jagatīpate"
  - id: 'adi-1-152-18'
    kind: verse
    lines:
      - सततं निरयं प्राप्ताः परपिण्डोपजीविनः
      - न भवेम यथा राजंस्तथा नीतिर्विधीयताम्
    iast: "satataṃ nirayaṃ prāptāḥ parapiṇḍopajīvinaḥ | na bhavema yathā rājaṃstathā nītirvidhīyatām"
  - id: 'adi-1-152-19'
    kind: verse
    lines:
      - यदि त्वं हि पुरा राजन्निदं राज्यमवाप्तवान्
      - ध्रुवं प्राप्स्याम च वयं राज्यमप्यवशे जने
      - वैशंपायन उवाच
    iast: "yadi tvaṃ hi purā rājannidaṃ rājyamavāptavān | dhruvaṃ prāpsyāma ca vayaṃ rājyamapyavaśe jane | vaiśaṃpāyana uvāca"
  - id: 'adi-1-152-20'
    kind: verse
    lines:
      - धृतराष्ट्रस्तु पुत्रस्य श्रुत्वा वचनमीदृशम्
      - मुहूर्तमिव संचिन्त्य दुर्योधनमथाब्रवीत्
    iast: "dhṛtarāṣṭrastu putrasya śrutvā vacanamīdṛśam | muhūrtamiva saṃcintya duryodhanamathābravīt"
  - id: 'adi-1-152-21'
    kind: verse
    lines:
      - धर्मनित्यस्तथा पाण्डुः सुप्रीतो मयि कौरवः
      - सर्वेषु ज्ञातिषु तथा मदीयेषु विशेषतः
    iast: "dharmanityastathā pāṇḍuḥ suprīto mayi kauravaḥ | sarveṣu jñātiṣu tathā madīyeṣu viśeṣataḥ"
  - id: 'adi-1-152-23'
    kind: verse
    lines:
      - तस्य पुत्रो यथा पाण्डुस्तथा धर्मपरः सदा
      - गुणावाँल्लोकविख्यातो नगरे च प्रतिष्ठितः
    iast: "tasya putro yathā pāṇḍustathā dharmaparaḥ sadā | guṇāvām̐llokavikhyāto nagare ca pratiṣṭhitaḥ"
  - id: 'adi-1-152-24'
    kind: verse
    lines:
      - स कथं शक्यतेऽस्माभिरपाक्रष्टुं नरर्षभः
      - राज्यमेष हि नः प्राप्तः ससहयो विशेषतः
    iast: "sa kathaṃ śakyate'smābhirapākraṣṭuṃ nararṣabhaḥ | rājyameṣa hi naḥ prāptaḥ sasahayo viśeṣataḥ"
  - id: 'adi-1-154-20'
    kind: verse
    lines:
      - ततो दुर्योधनो राजा धृतराष्ट्रमभाषत पाण्डवेभ्यो भयं नः स्यात्तान्विवासयतां भवान्
      - निपुणेनाभ्युपायेन नगरं वारणावतम्
    iast: "tato duryodhano rājā dhṛtarāṣṭramabhāṣata pāṇḍavebhyo bhayaṃ naḥ syāttānvivāsayatāṃ bhavān | nipuṇenābhyupāyena nagaraṃ vāraṇāvatam"
  - id: 'adi-1-154-31'
    kind: verse
    lines:
      - यदा प्रतिष्ठितं राज्यं मयि राजन्भविष्यति
      - तदा कुन्ती सहापत्या पुनरेष्यति भारत
      - धृतराष्ट्र उवाच
    iast: "yadā pratiṣṭhitaṃ rājyaṃ mayi rājanbhaviṣyati | tadā kuntī sahāpatyā punareṣyati bhārata | dhṛtarāṣṭra uvāca"
  - id: 'adi-1-155-1'
    kind: verse
    lines:
      - ततो दुर्योधनो राजा सर्वास्तु प्रकृतीः शनैः अर्थमानप्रदानाभ्यां संजहार सहानुजः
      - युयुत्सुमपनीयैकं धार्तराष्ट्रं सहोदरम्
    iast: "tato duryodhano rājā sarvāstu prakṛtīḥ śanaiḥ arthamānapradānābhyāṃ saṃjahāra sahānujaḥ | yuyutsumapanīyaikaṃ dhārtarāṣṭraṃ sahodaram"
  - id: 'adi-1-155-2'
    kind: verse
    lines:
      - धृतराष्ट्रप्रयुक्तास्तु केचित्कुशलमन्त्रिणः
      - कथयाञ्चक्रिरे रम्यं नगरं वारणावतम्
    iast: "dhṛtarāṣṭraprayuktāstu kecitkuśalamantriṇaḥ | kathayāñcakrire ramyaṃ nagaraṃ vāraṇāvatam"
  - id: 'adi-1-155-5'
    kind: verse
    lines:
      - कथ्यमाने तथा रम्ये नगरे वारणावते
      - गमने पाण्डुपुत्राणां जज्ञे तत्र मतिर्नृप
    iast: "kathyamāne tathā ramye nagare vāraṇāvate | gamane pāṇḍuputrāṇāṃ jajñe tatra matirnṛpa"
  - id: 'adi-1-155-6'
    kind: verse
    lines:
      - यदा त्वमन्यत नृपो जातकौतूहला इति
      - उवाचैतानेत्य तदा पाण्डवानम्बिकासुतः
    iast: "yadā tvamanyata nṛpo jātakautūhalā iti | uvācaitānetya tadā pāṇḍavānambikāsutaḥ"
  - id: 'adi-1-155-10'
    kind: verse
    lines:
      - ते ताता यदि मन्यध्वमुत्सवं वारणावते
      - सगणाः सान्वयाश्चैव विहरध्वं यथाऽमराः
    iast: "te tātā yadi manyadhvamutsavaṃ vāraṇāvate | sagaṇāḥ sānvayāścaiva viharadhvaṃ yathā'marāḥ"
  - id: 'adi-1-155-12'
    kind: verse
    lines:
      - कंचित्कालं विहृत्यैवमनुभूय परां मुदम्
      - इदं वै हास्तिनपुरं सुखिनः पुनरेष्यथ
    iast: "kaṃcitkālaṃ vihṛtyaivamanubhūya parāṃ mudam | idaṃ vai hāstinapuraṃ sukhinaḥ punareṣyatha"
  - id: 'adi-1-155-14'
    kind: verse
    lines:
      - धृतराष्ट्रस्य तं काममनुबुध्य युधिष्ठिरः
      - आत्मनश्चासहायत्वं तथेति प्रत्युवाच तम्
    iast: "dhṛtarāṣṭrasya taṃ kāmamanubudhya yudhiṣṭhiraḥ | ātmanaścāsahāyatvaṃ tatheti pratyuvāca tam"
  - id: 'adi-1-156-1'
    kind: verse
    lines:
      - धृतराष्ट्रप्रयुक्तेषु पाण्डुपुत्रेषु भारत
      - दुर्योधनः परं हर्षमगच्छत्स दुरात्मवान्
    iast: "dhṛtarāṣṭraprayukteṣu pāṇḍuputreṣu bhārata | duryodhanaḥ paraṃ harṣamagacchatsa durātmavān"
  - id: 'adi-1-156-3'
    kind: verse
    lines:
      - स पुरोचनमेकान्तमानीय भरतर्षभ
      - गृहीत्वा दक्षिणे पाणौ सचिवं वाक्यमब्रवीत्
    iast: "sa purocanamekāntamānīya bharatarṣabha | gṛhītvā dakṣiṇe pāṇau sacivaṃ vākyamabravīt"
  - id: 'adi-1-156-7'
    kind: verse
    lines:
      - पाण्डवा धृतराष्ट्रेण प्रेषिता वारणावतम्
      - उत्सवे विहरिष्यन्ति धृतराष्ट्रस्य शासनात्
    iast: "pāṇḍavā dhṛtarāṣṭreṇa preṣitā vāraṇāvatam | utsave vihariṣyanti dhṛtarāṣṭrasya śāsanāt"
  - id: 'adi-1-156-9'
    kind: verse
    lines:
      - तत्र गत्वा चतुःशालं गृहं परमसंवृतम्
      - नगरोपान्तमाश्रित्य कारयेथा महाधनम्
    iast: "tatra gatvā catuḥśālaṃ gṛhaṃ paramasaṃvṛtam | nagaropāntamāśritya kārayethā mahādhanam"
  - id: 'adi-1-156-12'
    kind: verse
    lines:
      - शणं तैलं घृतं चैव जतु दारूणि चैव हि
      - तस्मिन्वेश्मनि सर्वाणि निक्षिपेथाः समन्ततः
    iast: "śaṇaṃ tailaṃ ghṛtaṃ caiva jatu dārūṇi caiva hi | tasminveśmani sarvāṇi nikṣipethāḥ samantataḥ"
  - id: 'adi-1-156-15'
    kind: verse
    lines:
      - वेश्मन्येवं कृते तत्र कृत्वा तान्परमार्चितान्
      - वासयेथाः पाण्डवेयान्कुन्तीं च ससुहृज्जनाम्
    iast: "veśmanyevaṃ kṛte tatra kṛtvā tānparamārcitān | vāsayethāḥ pāṇḍaveyānkuntīṃ ca sasuhṛjjanām"
  - id: 'adi-1-156-16'
    kind: verse
    lines:
      - आसनानि च दिव्यानि यानानि शयनानि न
      - निघातव्यानि पाण्डूनां यथा तुष्येच्च मे पिता
    iast: "āsanāni ca divyāni yānāni śayanāni na | nighātavyāni pāṇḍūnāṃ yathā tuṣyecca me pitā"
  - id: 'adi-1-156-18'
    kind: verse
    lines:
      - ज्ञात्वा च तान्सुविश्वस्ताञ्शयानानकुतोभयान्
      - अग्निस्त्वया ततो देयो द्वारतस्तस्य वेश्मनः
    iast: "jñātvā ca tānsuviśvastāñśayānānakutobhayān | agnistvayā tato deyo dvāratastasya veśmanaḥ"
  - id: 'adi-1-156-20'
    kind: verse
    lines:
      - स तथेति प्रतिज्ञाय कौरवाय पुरोचनः
      - प्रायाद्रासभयुक्तेन स्यन्दनेनाशुगामिना
    iast: "sa tatheti pratijñāya kauravāya purocanaḥ | prāyādrāsabhayuktena syandanenāśugāminā"
  - id: 'adi-1-157-3'
    kind: verse
    lines:
      - एवं सर्वान्कुरून्वृद्धानभिवाद्य यतव्रताः
      - समालिङ्ग्य समानान्वै बालैश्चाप्यभिवादिताः
    iast: "evaṃ sarvānkurūnvṛddhānabhivādya yatavratāḥ | samāliṅgya samānānvai bālaiścāpyabhivāditāḥ"
  - id: 'adi-1-157-4'
    kind: verse
    lines:
      - सर्वा मातॄस्तथाऽऽपृच्छ्य कृत्वा चैव प्रदक्षिणम्
      - प्रकृतीरपि सर्वाश्च प्रययुर्वारणावतम्
    iast: "sarvā mātṝstathā''pṛcchya kṛtvā caiva pradakṣiṇam | prakṛtīrapi sarvāśca prayayurvāraṇāvatam"
  - id: 'adi-1-157-19'
    kind: verse
    lines:
      - पौरेषु विनिवृत्तेषु विदुरः सर्वधर्मवित्
      - बोधयन्पाण्डवश्रेष्ठमिदंवचनमब्रवीत्
    iast: "paureṣu vinivṛtteṣu viduraḥ sarvadharmavit | bodhayanpāṇḍavaśreṣṭhamidaṃvacanamabravīt"
  - id: 'adi-1-157-22'
    kind: verse
    lines:
      - कक्षघ्नः शिशिरघ्नश्च महाकक्षे बिलौकसः
      - न दहेदिति चात्मानं यो रक्षति स जीवति
    iast: "kakṣaghnaḥ śiśiraghnaśca mahākakṣe bilaukasaḥ | na dahediti cātmānaṃ yo rakṣati sa jīvati"
  - id: 'adi-1-157-27'
    kind: verse
    lines:
      - अनुशिक्ष्यानुगम्यैतान्कृत्वा चैव प्रदक्षिणम्
      - पाण्डवानभ्यनुज्ञाय विदुरः प्रययौ गृहान्
    iast: "anuśikṣyānugamyaitānkṛtvā caiva pradakṣiṇam | pāṇḍavānabhyanujñāya viduraḥ prayayau gṛhān"
  - id: 'adi-1-158-5'
    kind: verse
    lines:
      - सत्कृताश्चैव पौरैस्ते पौरान्सत्कृत्य चानघ
      - अलङ्कृतं जनाकीर्णं विविशुर्वारणावतम्
    iast: "satkṛtāścaiva pauraiste paurānsatkṛtya cānagha | alaṅkṛtaṃ janākīrṇaṃ viviśurvāraṇāvatam"
  - id: 'adi-1-158-9'
    kind: verse
    lines:
      - तेभ्यो भक्ष्याणि पानानि शयनानि शुभानि च
      - आसनानि च मुख्यानि प्रददौ स पुरोचनः
    iast: "tebhyo bhakṣyāṇi pānāni śayanāni śubhāni ca | āsanāni ca mukhyāni pradadau sa purocanaḥ"
  - id: 'adi-1-158-11'
    kind: verse
    lines:
      - दशरात्रोषितानां तु तत्र तेषां पुरोचनः
      - निवेदयामास गृहं शिवाख्यमशिवं तदा
    iast: "daśarātroṣitānāṃ tu tatra teṣāṃ purocanaḥ | nivedayāmāsa gṛhaṃ śivākhyamaśivaṃ tadā"
  - id: 'adi-1-159-1'
    kind: verse
    lines:
      - विदुरस्य सुहृत्कश्चित्खनकः कुशलः क्वचित्
      - विविक्ते पाण्डवान्राजन्निदं वचनमब्रवीत्
    iast: "vidurasya suhṛtkaścitkhanakaḥ kuśalaḥ kvacit | vivikte pāṇḍavānrājannidaṃ vacanamabravīt"
  - id: 'adi-1-159-16'
    kind: verse
    lines:
      - चक्रे च वेश्मनस्तस्य मध्ये नातिमहद्बिलम्
      - कपाटयुक्तमज्ञातं समं भूम्याश्च भारत
    iast: "cakre ca veśmanastasya madhye nātimahadbilam | kapāṭayuktamajñātaṃ samaṃ bhūmyāśca bhārata"
  - id: 'adi-1-159-17'
    kind: verse
    lines:
      - पुरोचनभयादेव व्यदधात्संवृतं मुखम् स तस्य तु गृहद्वारि वसत्यशुभधीः सदा
      - तत्र ते सायुधाः सर्वे वसन्ति स्म क्षपां नृप
    iast: "purocanabhayādeva vyadadhātsaṃvṛtaṃ mukham sa tasya tu gṛhadvāri vasatyaśubhadhīḥ sadā | tatra te sāyudhāḥ sarve vasanti sma kṣapāṃ nṛpa"
  - id: 'adi-1-159-18'
    kind: verse
    lines:
      - दिवा चरन्ति मृगयां पाण्डवेया वनाद्वनम्
      - विश्वस्तवदविश्वस्ता वञ्चयन्तः पुरोचनम्
    iast: "divā caranti mṛgayāṃ pāṇḍaveyā vanādvanam | viśvastavadaviśvastā vañcayantaḥ purocanam"
  - id: 'adi-1-160-13'
    kind: verse
    lines:
      - सुष्वाप विगतज्ञाना मृतकल्पा नराधिप
      - अथ प्रवाते तुमुले निशि सुप्ते जने तदा
    iast: "suṣvāpa vigatajñānā mṛtakalpā narādhipa | atha pravāte tumule niśi supte jane tadā"
  - id: 'adi-1-160-14'
    kind: verse
    lines:
      - तदुपादीपयद्भीमः शेते यत्र पुरोचनः
      - ततो जतुगृहद्वारं दीपयामास पाण्डवः
    iast: "tadupādīpayadbhīmaḥ śete yatra purocanaḥ | tato jatugṛhadvāraṃ dīpayāmāsa pāṇḍavaḥ"
  - id: 'adi-1-160-17'
    kind: verse
    lines:
      - गृहस्थं द्रविणं गृह्य निर्जगाम बिलेन सः ज्ञात्वा तु तद्गृहं सर्वमादीप्तं पाण्डुनन्दनाः
    iast: "gṛhasthaṃ draviṇaṃ gṛhya nirjagāma bilena saḥ jñātvā tu tadgṛhaṃ sarvamādīptaṃ pāṇḍunandanāḥ"
  - id: 'adi-1-160-24'
    kind: verse
    lines:
      - पाण्डवाश्चापि ते सर्वे सह मात्रा सुदुःखिताः
      - बिलेन तेन निर्गत्य जग्मुर्द्रुतमलक्षिताः
    iast: "pāṇḍavāścāpi te sarve saha mātrā suduḥkhitāḥ | bilena tena nirgatya jagmurdrutamalakṣitāḥ"
  - id: 'adi-1-161-5'
    kind: verse
    lines:
      - ततः प्रवासितो विद्वान्विदुरेण नरस्तदा
      - पार्थानां दर्शयामास मनोमारुतगामिनीम्
    iast: "tataḥ pravāsito vidvānvidureṇa narastadā | pārthānāṃ darśayāmāsa manomārutagāminīm"
  - id: 'adi-1-161-6'
    kind: verse
    lines:
      - सर्ववातसहां नावं यन्त्रयुक्तां पताकिनीम्
      - शिवे भागीरथीतीरे नरैर्विस्रम्भिभिः कृताम्
    iast: "sarvavātasahāṃ nāvaṃ yantrayuktāṃ patākinīm | śive bhāgīrathītīre narairvisrambhibhiḥ kṛtām"
  - id: 'adi-1-161-22'
    kind: verse
    lines:
      - पाण्डवाश्च महात्मानः प्रतिसन्दिश्य वै कवेः
      - गङ्गामुत्तीर्य वेगेन जग्मुर्गूढमलक्षिताः
    iast: "pāṇḍavāśca mahātmānaḥ pratisandiśya vai kaveḥ | gaṅgāmuttīrya vegena jagmurgūḍhamalakṣitāḥ"
  - id: 'adi-1-161-28'
    kind: verse
    lines:
      - त्वं हि नो बलवानेको यथा सततगस्तथा इत्युक्तो धर्मराजेन भीमसेनो महाबलः
      - आदाय कुन्तीं भ्रातॄंश्च जगामाशु स पावनिः
    iast: "tvaṃ hi no balavāneko yathā satatagastathā ityukto dharmarājena bhīmaseno mahābalaḥ | ādāya kuntīṃ bhrātṝṃśca jagāmāśu sa pāvaniḥ"
  - id: 'adi-1-162-76'
    kind: verse
    lines:
      - अथाम्बिकेयः सामात्यः सकर्णः सहसौबलः
      - सात्मजः पार्थनाशस्य स्मरंस्तथ्यं जर्ष च
    iast: "athāmbikeyaḥ sāmātyaḥ sakarṇaḥ sahasaubalaḥ | sātmajaḥ pārthanāśasya smaraṃstathyaṃ jarṣa ca"
  - id: 'adi-1-162-77'
    kind: verse
    lines:
      - भीष्मश्च राजन्दुर्धर्षो विदुरश्च महामतिः
      - जहृषाते स्मरन्तौ तौ जातुषाग्नेर्विमोचनम्
    iast: "bhīṣmaśca rājandurdharṣo viduraśca mahāmatiḥ | jahṛṣāte smarantau tau jātuṣāgnervimocanam"
  - id: 'adi-1-162-78'
    kind: verse
    lines:
      - सत्यशीलगुणाचारै रागैर्जानपदोद्भवैः
      - द्रोणादयश्च धर्मैस्तु तेषां तान्मोचितान्विदुः
    iast: "satyaśīlaguṇācārai rāgairjānapadodbhavaiḥ | droṇādayaśca dharmaistu teṣāṃ tānmocitānviduḥ"
  - id: 'adi-1-162-80'
    kind: verse
    lines:
      - अन्ये जनाः प्राकृताश्च स्त्रियश्च बहुलास्तदा
      - शङ्कमाना वदन्ति स्म दग्धा जीवन्ति वा न वा
    iast: "anye janāḥ prākṛtāśca striyaśca bahulāstadā | śaṅkamānā vadanti sma dagdhā jīvanti vā na vā"
  - id: 'adi-1-163-19'
    kind: verse
    lines:
      - ततो भीमो वनं घोरं प्रविश्य विजनं महत्
      - न्यग्रोधं विपुलच्छायं रमणीयं ददर्श ह
    iast: "tato bhīmo vanaṃ ghoraṃ praviśya vijanaṃ mahat | nyagrodhaṃ vipulacchāyaṃ ramaṇīyaṃ dadarśa ha"
  - id: 'adi-1-163-20'
    kind: verse
    lines:
      - तत्र निक्षिप्य तान्सर्वानुवाच भरतर्षभः
      - पानीयं मृगयामीह तावद्विश्रम्यतामिह
    iast: "tatra nikṣipya tānsarvānuvāca bharatarṣabhaḥ | pānīyaṃ mṛgayāmīha tāvadviśramyatāmiha"
  - id: 'adi-1-164-1'
    kind: verse
    lines:
      - तत्र तेषु शयानेषु हिडिम्बो नाम राक्षसः
      - अविदूरे वनात्तस्माच्छालवृक्षं समाश्रितः
    iast: "tatra teṣu śayāneṣu hiḍimbo nāma rākṣasaḥ | avidūre vanāttasmācchālavṛkṣaṃ samāśritaḥ"
  - id: 'adi-1-165-41'
    kind: verse
    lines:
      - एवमुक्त्वा ततो बाहुं प्रगृह्य पुरुषादकः
      - अभ्यद्रवत संक्रुद्धो भीमसेनमरिन्दमम्
    iast: "evamuktvā tato bāhuṃ pragṛhya puruṣādakaḥ | abhyadravata saṃkruddho bhīmasenamarindamam"
  - id: 'adi-1-165-43'
    kind: verse
    lines:
      - निगृह्य तं बलाद्भीमो विस्फुरन्तं चकर्ष ह
      - तस्माद्देशाद्धनूंष्यष्टौ सिंहः क्षुद्रमृगं यथा
    iast: "nigṛhya taṃ balādbhīmo visphurantaṃ cakarṣa ha | tasmāddeśāddhanūṃṣyaṣṭau siṃhaḥ kṣudramṛgaṃ yathā"
  - id: 'adi-1-167-1'
    kind: verse
    lines:
      - सा तानेवापतत्तूर्णं भगिनी तस्य रक्षसः
      - अब्रुवाणा हिडिम्बा तु राक्षसी पाण्डवान्प्रति
    iast: "sā tānevāpatattūrṇaṃ bhaginī tasya rakṣasaḥ | abruvāṇā hiḍimbā tu rākṣasī pāṇḍavānprati"
  - id: 'adi-1-167-4'
    kind: verse
    lines:
      - राक्षसे रौद्रसङ्काशे तवापश्यं विचेष्टितम् अहं शुश्रूषुरिच्छेयं तव गात्रं निषेवितुम्
      - भीमसेन उवाच
    iast: "rākṣase raudrasaṅkāśe tavāpaśyaṃ viceṣṭitam ahaṃ śuśrūṣuriccheyaṃ tava gātraṃ niṣevitum | bhīmasena uvāca"
  - id: 'adi-1-169-6'
    kind: verse
    lines:
      - अतृप्ता भीमसेनेन सप्तमासोपसंगता प्रजज्ञे राक्षसी पुत्रं भीमसेनान्महाबलात्
    iast: "atṛptā bhīmasenena saptamāsopasaṃgatā prajajñe rākṣasī putraṃ bhīmasenānmahābalāt"
  - id: 'adi-1-169-11'
    kind: verse
    lines:
      - सद्यो हि गर्भं राक्षस्यो लभन्ते प्रसवन्ति च
      - कामरूपधराश्चैव भवन्ति बहुरूपिकाः
    iast: "sadyo hi garbhaṃ rākṣasyo labhante prasavanti ca | kāmarūpadharāścaiva bhavanti bahurūpikāḥ"
  - id: 'adi-1-169-19'
    kind: verse
    lines:
      - कृत्यकाल उपस्थास्ये पितॄनिति घटोत्कचः
      - आमन्त्र्य रक्षसां श्रेष्ठः प्रतस्थे चोत्तरां दिशम्
    iast: "kṛtyakāla upasthāsye pitṝniti ghaṭotkacaḥ | āmantrya rakṣasāṃ śreṣṭhaḥ pratasthe cottarāṃ diśam"
  - id: 'adi-1-169-22'
    kind: verse
    lines:
      - पदा मां संस्मरेः कान्त रिरंसू रहसि प्रभो
      - तदा तव वशं भूय आगन्तास्म्याशु भारत
    iast: "padā māṃ saṃsmareḥ kānta riraṃsū rahasi prabho | tadā tava vaśaṃ bhūya āgantāsmyāśu bhārata"
  - id: 'adi-1-169-23'
    kind: verse
    lines:
      - इत्युक्त्वा सा जगामाशु भावमासज्य पाण्डवे
      - हिडिम्बा समयं स्मृत्वा स्वां गतिं प्रत्यपद्यत
    iast: "ityuktvā sā jagāmāśu bhāvamāsajya pāṇḍave | hiḍimbā samayaṃ smṛtvā svāṃ gatiṃ pratyapadyata"
  - id: 'adi-1-170-1'
    kind: verse
    lines:
      - ततस्ते पाण्डवाः सर्वे शालिहोत्राश्रमे तदा
      - पूजितास्तेन वन्येन तमामन्त्र्य महामुनिम्
    iast: "tataste pāṇḍavāḥ sarve śālihotrāśrame tadā | pūjitāstena vanyena tamāmantrya mahāmunim"
  - id: 'adi-1-171-2'
    kind: verse
    lines:
      - एकचक्रां गतास्ते तु कन्तीपुत्रा महारथाः
      - ऊषुर्नातिचिरं कालं ब्राह्मणस्य निवेशने
    iast: "ekacakrāṃ gatāste tu kantīputrā mahārathāḥ | ūṣurnāticiraṃ kālaṃ brāhmaṇasya niveśane"
  - id: 'adi-1-171-5'
    kind: verse
    lines:
      - भैक्षं चरन्तस्तु तदा जटिला ब्रह्मचारिणः
      - बभूवुर्नागराणां च गुणैः संप्रियदर्शनाः
      - नागरा ऊचुः
    iast: "bhaikṣaṃ carantastu tadā jaṭilā brahmacāriṇaḥ | babhūvurnāgarāṇāṃ ca guṇaiḥ saṃpriyadarśanāḥ | nāgarā ūcuḥ"
  - id: 'adi-1-174-4'
    kind: verse
    lines:
      - समीपे नगरस्यास्य वको वसति राक्षसः
      - इतो गव्यूतिमात्रे ञस्ति यमुनागह्वरे गुहा
    iast: "samīpe nagarasyāsya vako vasati rākṣasaḥ | ito gavyūtimātre ñasti yamunāgahvare guhā"
  - id: 'adi-1-174-9'
    kind: verse
    lines:
      - अनाथा नगरी नाथं त्रातारं नाधिगच्छति
      - गुहायां च वसंस्तत्र बाधते सततं जनम्
    iast: "anāthā nagarī nāthaṃ trātāraṃ nādhigacchati | guhāyāṃ ca vasaṃstatra bādhate satataṃ janam"
  - id: 'adi-1-177-28'
    kind: verse
    lines:
      - स तं हसति तेजस्वी तदन्नमुपभुज्य च आसाद्य तु वनं तस्य रक्षसः पाण्डवो बली
      - आजुहाव ततो नाम्ना तदन्नमुपपादयन्
    iast: "sa taṃ hasati tejasvī tadannamupabhujya ca āsādya tu vanaṃ tasya rakṣasaḥ pāṇḍavo balī | ājuhāva tato nāmnā tadannamupapādayan"
  - id: 'adi-1-178-7'
    kind: verse
    lines:
      - सगणस्तु बकभ्राता प्राणमत्पाण्डवं तदा ततः प्रभृति रक्षांसि तत्र सौम्यानि भारत
      - नगरे प्रत्यदृश्यन्त नरैर्नगरवासिभिः
    iast: "sagaṇastu bakabhrātā prāṇamatpāṇḍavaṃ tadā tataḥ prabhṛti rakṣāṃsi tatra saumyāni bhārata | nagare pratyadṛśyanta narairnagaravāsibhiḥ"
  - id: 'adi-1-184-1'
    kind: verse
    lines:
      - वसत्सु तेषु प्रच्छन्नं पाण्डवेषु महात्मसु
      - आजगामाथ तान्द्रष्टुं व्यासः सत्यवतीसुतः
    iast: "vasatsu teṣu pracchannaṃ pāṇḍaveṣu mahātmasu | ājagāmātha tāndraṣṭuṃ vyāsaḥ satyavatīsutaḥ"
  - id: 'adi-1-184-6'
    kind: verse
    lines:
      - आसीत्तपोवने काचिदृषेः कन्या महात्मनः
      - विलग्नमध्या सुश्रोणी सुभ्रूः सर्वगुणान्विता
    iast: "āsīttapovane kācidṛṣeḥ kanyā mahātmanaḥ | vilagnamadhyā suśroṇī subhrūḥ sarvaguṇānvitā"
  - id: 'adi-1-184-7'
    kind: verse
    lines:
      - कर्मभिः स्वकृतैः सा तु दुर्भगा समपद्यत
      - नाध्यगच्छत्पतिं सा तु कन्या रूपवती सती
    iast: "karmabhiḥ svakṛtaiḥ sā tu durbhagā samapadyata | nādhyagacchatpatiṃ sā tu kanyā rūpavatī satī"
  - id: 'adi-1-184-8'
    kind: verse
    lines:
      - तपस्तप्तुमथारेभे पत्यर्थमसुखा ततः
      - तोषयामास तपसा सा किलोग्रेण शङ्करम्
    iast: "tapastaptumathārebhe patyarthamasukhā tataḥ | toṣayāmāsa tapasā sā kilogreṇa śaṅkaram"
  - id: 'adi-1-184-11'
    kind: verse
    lines:
      - तामथ प्रत्युवाचेदमीशानो वदतां वरः
      - पञ्च ते पतयो भद्रे भविष्यन्तीति भारताः
    iast: "tāmatha pratyuvācedamīśāno vadatāṃ varaḥ | pañca te patayo bhadre bhaviṣyantīti bhāratāḥ"
  - id: 'adi-1-184-14'
    kind: verse
    lines:
      - देहमन्यं गतायास्ते यथोक्तं तद्भविष्यति
      - व्यास उवाच
      - द्रुपदस्य कुले जज्ञे सा कन्या देवरूपिणी
    iast: "dehamanyaṃ gatāyāste yathoktaṃ tadbhaviṣyati | vyāsa uvāca | drupadasya kule jajñe sā kanyā devarūpiṇī"
  - id: 'adi-1-184-15'
    kind: verse
    lines:
      - निर्दिष्टा भवतां पत्नी कृष्णा पार्षत्यनिन्दिता पाञ्चालनगरे तस्मान्निवसध्वं महाबलाः
      - सुखिनस्तामनुप्राप्य भविष्यथ न संशयः
    iast: "nirdiṣṭā bhavatāṃ patnī kṛṣṇā pārṣatyaninditā pāñcālanagare tasmānnivasadhvaṃ mahābalāḥ | sukhinastāmanuprāpya bhaviṣyatha na saṃśayaḥ"
  - id: 'adi-1-200-1'
    kind: verse
    lines:
      - ततस्ते नरशार्दूला भ्रातरः पञ्च पाण्डवाः तं ब्राह्मणं पुरस्कृत्य पाञ्चाल्याश्च स्वयंवरम्
      - प्रययुर्द्रौपदीं द्रष्टुं तं च देशं महोत्सवम्
    iast: "tataste naraśārdūlā bhrātaraḥ pañca pāṇḍavāḥ taṃ brāhmaṇaṃ puraskṛtya pāñcālyāśca svayaṃvaram | prayayurdraupadīṃ draṣṭuṃ taṃ ca deśaṃ mahotsavam"
  - id: 'adi-1-200-6'
    kind: verse
    lines:
      - ते तु दृष्ट्वा पुरं तच्च स्कन्धावारं च पाण्डवाः
      - कुम्भकारस्य शालायां निवासं चक्रिरे तदा
    iast: "te tu dṛṣṭvā puraṃ tacca skandhāvāraṃ ca pāṇḍavāḥ | kumbhakārasya śālāyāṃ nivāsaṃ cakrire tadā"
  - id: 'adi-1-200-7'
    kind: verse
    lines:
      - तत्र भैक्षं समाजह्रुर्ब्राह्मणीं वृत्तिमाश्रिताः
      - तान्संप्राप्तांस्तथा वीराञ्जज्ञिरे न नराः क्वचित्
    iast: "tatra bhaikṣaṃ samājahrurbrāhmaṇīṃ vṛttimāśritāḥ | tānsaṃprāptāṃstathā vīrāñjajñire na narāḥ kvacit"
  - id: 'adi-1-200-10'
    kind: verse
    lines:
      - कन्यादानात्तु शरणं सोऽमन्यत महीपतिः यज्ञसेनस्य कामस्तु पाण्डवाय किरीटिने
    iast: "kanyādānāttu śaraṇaṃ so'manyata mahīpatiḥ yajñasenasya kāmastu pāṇḍavāya kirīṭine"
  - id: 'adi-1-200-11'
    kind: verse
    lines:
      - दास्यामि कृष्मामिति वै न चैनं विवृणोति सः जामातृबलसंयोगं मेने हि बलवत्तरम्
    iast: "dāsyāmi kṛṣmāmiti vai na cainaṃ vivṛṇoti saḥ jāmātṛbalasaṃyogaṃ mene hi balavattaram"
  - id: 'adi-1-200-12'
    kind: verse
    lines:
      - सोऽन्वेषमाणः कौन्तेयान्पाञ्चालो जनमेजय
      - दृढं धनुरथानम्यं कारयामास भारत
    iast: "so'nveṣamāṇaḥ kaunteyānpāñcālo janamejaya | dṛḍhaṃ dhanurathānamyaṃ kārayāmāsa bhārata"
  - id: 'adi-1-200-17'
    kind: verse
    lines:
      - यन्त्रं वैहायसं चापि कारयामास कृत्रिमम्
      - तेन यन्त्रेण सहितं राजँल्लक्ष्यं च काञ्चनम्
      - द्रुपद उवाच
    iast: "yantraṃ vaihāyasaṃ cāpi kārayāmāsa kṛtrimam | tena yantreṇa sahitaṃ rājam̐llakṣyaṃ ca kāñcanam | drupada uvāca"
  - id: 'adi-1-200-18'
    kind: verse
    lines:
      - इदं सज्यं धनुः कृत्वा सज्जैरेभिश्च सायकैः
      - अतीत्य लक्ष्य यो वेद्धा स लब्धा मत्सुतामिति
      - वैशंपायन उवाच
    iast: "idaṃ sajyaṃ dhanuḥ kṛtvā sajjairebhiśca sāyakaiḥ | atītya lakṣya yo veddhā sa labdhā matsutāmiti | vaiśaṃpāyana uvāca"
  - id: 'adi-1-200-19'
    kind: verse
    lines:
      - इति स द्रुपदो राजा स्वयंवरमघोषयत्
      - तच्छ्रुत्वा पार्थिवाः सर्वे समीयुस्तत्र भारत
    iast: "iti sa drupado rājā svayaṃvaramaghoṣayat | tacchrutvā pārthivāḥ sarve samīyustatra bhārata"
  - id: 'adi-1-200-20'
    kind: verse
    lines:
      - ऋषयश्च महात्मानः स्वयंवरदिदृक्षवः
      - दुर्योधनपुरोगाश्च सकर्णाः कुरवो नृप
    iast: "ṛṣayaśca mahātmānaḥ svayaṃvaradidṛkṣavaḥ | duryodhanapurogāśca sakarṇāḥ kuravo nṛpa"
  - id: 'adi-1-200-22'
    kind: verse
    lines:
      - उपोपविष्टा मञ्चेषु द्रष्टुकामाः स्वयंवरम्
      - ब्राह्मणाश्च महाभागा देशेभ्यः समुपागमन्
    iast: "upopaviṣṭā mañceṣu draṣṭukāmāḥ svayaṃvaram | brāhmaṇāśca mahābhāgā deśebhyaḥ samupāgaman"
  - id: 'adi-1-200-23'
    kind: verse
    lines:
      - ब्राह्मणैरेव सहिताः पाण्डवाः समुपाविशन्
      - त्रयस्त्रिंशत्सुराः सर्वे विमानैर्व्योम्न्यवस्थिताः
    iast: "brāhmaṇaireva sahitāḥ pāṇḍavāḥ samupāviśan | trayastriṃśatsurāḥ sarve vimānairvyomnyavasthitāḥ"
  - id: 'adi-1-200-35'
    kind: verse
    lines:
      - मञ्चेषु च परार्द्ध्येषु पौरजानपदा जनाः
      - कृष्णादर्शनसिद्ध्यर्थं सर्वतः समुपाविशन्
    iast: "mañceṣu ca parārddhyeṣu paurajānapadā janāḥ | kṛṣṇādarśanasiddhyarthaṃ sarvataḥ samupāviśan"
  - id: 'adi-1-200-54'
    kind: verse
    lines:
      - मालां च समुपादाय काञ्चनीं समलङ्कृताम् आगतां ददृशुः सर्वे रङ्गभूमिमलङ्कृताम्
    iast: "mālāṃ ca samupādāya kāñcanīṃ samalaṅkṛtām āgatāṃ dadṛśuḥ sarve raṅgabhūmimalaṅkṛtām"
  - id: 'adi-1-202-1'
    kind: verse
    lines:
      - तेऽलङ्कृताः कुण्डलिनो युवानः परस्परं स्पर्धमाना नरेन्द्राः
      - अस्त्रं बलं चात्मनि मन्यमानाः सर्वें समुत्पेतुरुदायुधास्ते
    iast: "te'laṅkṛtāḥ kuṇḍalino yuvānaḥ parasparaṃ spardhamānā narendrāḥ | astraṃ balaṃ cātmani manyamānāḥ sarveṃ samutpeturudāyudhāste"
  - id: 'adi-1-202-3'
    kind: verse
    lines:
      - परस्परं स्पर्धया प्रेक्षमाणाः सङ्कल्पजेनाभिपरिप्लुताङ्गाः
      - कृष्णा ममैवेत्यभिभाषमाणा नृपाः समुत्पेतुरथासनेभ्यः
    iast: "parasparaṃ spardhayā prekṣamāṇāḥ saṅkalpajenābhipariplutāṅgāḥ | kṛṣṇā mamaivetyabhibhāṣamāṇā nṛpāḥ samutpeturathāsanebhyaḥ"
  - id: 'adi-1-202-15'
    kind: verse
    lines:
      - समाजवाटोपरि संस्थितानां मेघैः समन्तादिव गर्जमानैः
      - ततस्तु ते राजगणाः क्रमेण कृष्णानिमित्तं कृतविक्रमाश्च सकर्णदुर्योधनशाल्वशल्यद्रौणायनिक्राथसुनीथवक्राः
    iast: "samājavāṭopari saṃsthitānāṃ meghaiḥ samantādiva garjamānaiḥ | tatastu te rājagaṇāḥ krameṇa kṛṣṇānimittaṃ kṛtavikramāśca sakarṇaduryodhanaśālvaśalyadrauṇāyanikrāthasunīthavakrāḥ"
  - id: 'adi-1-202-18'
    kind: verse
    lines:
      - तत्कार्मुकं संहननोपपन्नं सज्यं न शेकुर्मनसाऽपि कर्तुम्
      - ते विक्रमन्तः स्फुरता दृढेन विक्षिप्यमाणा धनुषा नरेन्द्राः
    iast: "tatkārmukaṃ saṃhananopapannaṃ sajyaṃ na śekurmanasā'pi kartum | te vikramantaḥ sphuratā dṛḍhena vikṣipyamāṇā dhanuṣā narendrāḥ"
  - id: 'adi-1-203-1'
    kind: verse
    lines:
      - यदा निवृत्ता राजानो धनुषः सज्यकर्मणः
      - अथोदतिष्ठद्विप्राणां मध्याज्जिष्णुरुदारधीः
    iast: "yadā nivṛttā rājāno dhanuṣaḥ sajyakarmaṇaḥ | athodatiṣṭhadviprāṇāṃ madhyājjiṣṇurudāradhīḥ"
  - id: 'adi-1-203-22'
    kind: verse
    lines:
      - प्रणम्य शिरसा देवमीनं वरदं प्रभुम्
      - कृष्णं च मनसा कृत्वा जगृहे चार्जुनो धनुः
    iast: "praṇamya śirasā devamīnaṃ varadaṃ prabhum | kṛṣṇaṃ ca manasā kṛtvā jagṛhe cārjuno dhanuḥ"
  - id: 'adi-1-203-24'
    kind: verse
    lines:
      - तदर्जुनो वीर्यवतां सदर्पस्तदैन्द्रिरिन्द्रावरजप्रभावः
      - सज्यं च चक्रे निमिषान्तरेण शरांश्च जग्राह दशार्दसङ्ख्यान्
    iast: "tadarjuno vīryavatāṃ sadarpastadaindririndrāvarajaprabhāvaḥ | sajyaṃ ca cakre nimiṣāntareṇa śarāṃśca jagrāha daśārdasaṅkhyān"
  - id: 'adi-1-203-25'
    kind: verse
    lines:
      - विव्याध लक्ष्यं निपपात तच्च छिद्रेण भूमौ सहसातिविद्धम्
      - ततोऽन्तरिक्षे च बभूव नादः समाजमध्ये च महान्निनादः
    iast: "vivyādha lakṣyaṃ nipapāta tacca chidreṇa bhūmau sahasātividdham | tato'ntarikṣe ca babhūva nādaḥ samājamadhye ca mahānninādaḥ"
  - id: 'adi-1-203-33'
    kind: verse
    lines:
      - गत्वा च पश्चात्प्रसमीक्ष्य कृष्णा पार्थस्य वक्षस्यविशङ्कमाना
      - क्षिप्त्वा स्रजं पार्थिववीरमध्ये वराय वव्रे द्विजसङ्घमध्ये
    iast: "gatvā ca paścātprasamīkṣya kṛṣṇā pārthasya vakṣasyaviśaṅkamānā | kṣiptvā srajaṃ pārthivavīramadhye varāya vavre dvijasaṅghamadhye"
  - id: 'adi-1-203-34'
    kind: verse
    lines:
      - शचीव देवेन्द्रमथाग्निदेवं स्वाहेव लक्ष्मीश्च यथा मुकुन्दम्
      - उषेव सूर्यं मदनं रतीव महेश्वरं पर्वतराजपुत्री
    iast: "śacīva devendramathāgnidevaṃ svāheva lakṣmīśca yathā mukundam | uṣeva sūryaṃ madanaṃ ratīva maheśvaraṃ parvatarājaputrī"
  - id: 'adi-1-206-15'
    kind: verse
    lines:
      - तेषामाकारभावज्ञः कुन्तीपुत्रो युधिष्ठिरः
      - द्वैपायनवचः कृत्स्नं सस्मार मनुजर्षभः
    iast: "teṣāmākārabhāvajñaḥ kuntīputro yudhiṣṭhiraḥ | dvaipāyanavacaḥ kṛtsnaṃ sasmāra manujarṣabhaḥ"
  - id: 'adi-1-206-16'
    kind: verse
    lines:
      - अब्रवीत्सहितान्भ्रातॄन्मिथो भेदभयान्नृपः
      - सर्वेषां द्रौपदी भार्या भविष्यति हि नः शुभा
      - जनमेजय उवाच
    iast: "abravītsahitānbhrātṝnmitho bhedabhayānnṛpaḥ | sarveṣāṃ draupadī bhāryā bhaviṣyati hi naḥ śubhā | janamejaya uvāca"
  - id: 'adi-1-210-1'
    kind: verse
    lines:
      - तत आहूय पाञ्चाल्यो राजपुत्रं युधिष्ठिरम्
      - परिग्रहेण ब्राह्मेण परिगृह्य महाद्युतिः
    iast: "tata āhūya pāñcālyo rājaputraṃ yudhiṣṭhiram | parigraheṇa brāhmeṇa parigṛhya mahādyutiḥ"
  - id: 'adi-1-210-2'
    kind: verse
    lines:
      - पर्यपृच्छददीनात्मा कुन्तीपुत्रं सुवर्चसम्
      - कथं जानीम भवतः क्षत्रियान्ब्राह्मणानुत
    iast: "paryapṛcchadadīnātmā kuntīputraṃ suvarcasam | kathaṃ jānīma bhavataḥ kṣatriyānbrāhmaṇānuta"
  - id: 'adi-1-210-15'
    kind: verse
    lines:
      - पप्रच्छ चैनं धर्मात्मा यथा ते प्रद्रुताः पुरात्
      - स तस्मै सर्वमाचख्यावानुपूर्व्येण पाण्डवः
    iast: "papraccha cainaṃ dharmātmā yathā te pradrutāḥ purāt | sa tasmai sarvamācakhyāvānupūrvyeṇa pāṇḍavaḥ"
  - id: 'adi-1-215-14'
    kind: verse
    lines:
      - ततस्तु ते कौरवराजपुत्रा विभूषिताः कुण्डलिनो युवानः
      - महार्हवस्त्राम्बरचन्दनोक्षिताः कृताभिषेकाः कृतमङ्गलक्रियाः
    iast: "tatastu te kauravarājaputrā vibhūṣitāḥ kuṇḍalino yuvānaḥ | mahārhavastrāmbaracandanokṣitāḥ kṛtābhiṣekāḥ kṛtamaṅgalakriyāḥ"
  - id: 'adi-1-215-22'
    kind: verse
    lines:
      - पुरोहितस्यानुमतेन राज्ञस्ते राजपुत्रा मुदिता बभूवुः
      - क्रमेण चान्ये च नराधिपात्मजा वरस्त्रियास्ते जगृहुः करं तदा
    iast: "purohitasyānumatena rājñaste rājaputrā muditā babhūvuḥ | krameṇa cānye ca narādhipātmajā varastriyāste jagṛhuḥ karaṃ tadā"
  - id: 'adi-1-218-72'
    kind: verse
    lines:
      - ततः संकर्षणश्चैव केशवश्च महाबलः
      - यादवैः सह सर्वैश्च पाण्डवानभिजग्मतुः
    iast: "tataḥ saṃkarṣaṇaścaiva keśavaśca mahābalaḥ | yādavaiḥ saha sarvaiśca pāṇḍavānabhijagmatuḥ"
  - id: 'adi-1-218-75'
    kind: verse
    lines:
      - यादवाः पूजिताः सर्वे पाण्डवैश्च महात्मभिः
      - रेमिरे पाण्डवैः सार्धं ते पाञ्चालपुरे तदा
    iast: "yādavāḥ pūjitāḥ sarve pāṇḍavaiśca mahātmabhiḥ | remire pāṇḍavaiḥ sārdhaṃ te pāñcālapure tadā"
  - id: 'adi-1-219-14'
    kind: verse
    lines:
      - विदुरस्त्वथ ताञ्श्रुत्वा द्रौपद्या पाण्डवान्वृतान्
      - व्रीडितान्धार्तराष्ट्रांश्च भग्नदर्पानुपागतान्
    iast: "vidurastvatha tāñśrutvā draupadyā pāṇḍavānvṛtān | vrīḍitāndhārtarāṣṭrāṃśca bhagnadarpānupāgatān"
  - id: 'adi-1-219-15'
    kind: verse
    lines:
      - ततः प्रीतमनाः क्षत्ता धृतराष्ट्रं विशांपते
      - उवाच दिष्ट्या कुरवो वर्ध्त इति विस्मितः
    iast: "tataḥ prītamanāḥ kṣattā dhṛtarāṣṭraṃ viśāṃpate | uvāca diṣṭyā kuravo vardhta iti vismitaḥ"
  - id: 'adi-1-219-20'
    kind: verse
    lines:
      - वर्धन्त इति मद्वाक्याद्वर्धिताः पाण्डुनन्दनाः
      - कृष्णया संवृताः पार्था विमुक्ता राजसङ्गरात्
    iast: "vardhanta iti madvākyādvardhitāḥ pāṇḍunandanāḥ | kṛṣṇayā saṃvṛtāḥ pārthā vimuktā rājasaṅgarāt"
  - id: 'adi-1-219-22'
    kind: verse
    lines:
      - एतच्छ्रुत्वा तु वचनं विदुरस्य नराधिपः
      - आकारच्छादनार्थाय दिष्ट्यादिष्ट्येति चाब्रवीत्
      - धृतराष्ट्र उवाच
    iast: "etacchrutvā tu vacanaṃ vidurasya narādhipaḥ | ākāracchādanārthāya diṣṭyādiṣṭyeti cābravīt | dhṛtarāṣṭra uvāca"
  - id: 'adi-1-219-34'
    kind: verse
    lines:
      - ततो दुर्योधनश्चापि राधेयश्च विशांपते
      - धृतराष्ट्रमुपागम्य वचोऽब्रूतामिदं तदा
    iast: "tato duryodhanaścāpi rādheyaśca viśāṃpate | dhṛtarāṣṭramupāgamya vaco'brūtāmidaṃ tadā"
  - id: 'adi-1-219-35'
    kind: verse
    lines:
      - सन्निधौ विदुरस्य त्वां दोषं वक्तुं न शक्नुवः
      - विविक्तमिति वक्ष्यावः किं तवेदं चिकीर्षितम्
    iast: "sannidhau vidurasya tvāṃ doṣaṃ vaktuṃ na śaknuvaḥ | viviktamiti vakṣyāvaḥ kiṃ tavedaṃ cikīrṣitam"
  - id: 'adi-1-219-36'
    kind: verse
    lines:
      - सपत्नवृद्धिं यत्तात मन्यसे वृद्धिमात्मनः
      - अभिष्टौषि च यत्क्षत्तुः समीपे द्विपदांवर
    iast: "sapatnavṛddhiṃ yattāta manyase vṛddhimātmanaḥ | abhiṣṭauṣi ca yatkṣattuḥ samīpe dvipadāṃvara"
  - id: 'adi-1-219-37'
    kind: verse
    lines:
      - अन्यस्मिन्नृप कर्तव्ये त्वमन्यत्कुरुषेऽनघ
      - तेषां बलविघातो हि कर्तव्यस्तात नित्यशः
    iast: "anyasminnṛpa kartavye tvamanyatkuruṣe'nagha | teṣāṃ balavighāto hi kartavyastāta nityaśaḥ"
  - id: 'adi-1-220-2'
    kind: verse
    lines:
      - अहमप्येवमेवैतच्चिकीर्षामि यथा युवाम्
      - विवेक्तुं नाहमिच्छामि त्वाकारं विदुरं प्रति
    iast: "ahamapyevamevaitaccikīrṣāmi yathā yuvām | vivektuṃ nāhamicchāmi tvākāraṃ viduraṃ prati"
  - id: 'adi-1-221-24'
    kind: verse
    lines:
      - भूय एव तु भीष्मश्च द्रोणो विदुर एव च
      - युवां च कुरुतं बुद्धिं भवेद्या नः सुखोदया
    iast: "bhūya eva tu bhīṣmaśca droṇo vidura eva ca | yuvāṃ ca kurutaṃ buddhiṃ bhavedyā naḥ sukhodayā"
  - id: 'adi-1-221-25'
    kind: verse
    lines:
      - तत आनाय्य तान्सर्वान्मन्त्रिणः सुमहायशाः
      - धृतराष्ट्रो महाराज मन्त्रयामास वै तदा
    iast: "tata ānāyya tānsarvānmantriṇaḥ sumahāyaśāḥ | dhṛtarāṣṭro mahārāja mantrayāmāsa vai tadā"
  - id: 'adi-1-222-1'
    kind: verse
    lines:
      - न रोचते विग्रहो मे पाण्डुपुत्रैः कथंचन
      - यथैव धृतराष्ट्रो मे तथा पाण्डुरसंशयम्
    iast: "na rocate vigraho me pāṇḍuputraiḥ kathaṃcana | yathaiva dhṛtarāṣṭro me tathā pāṇḍurasaṃśayam"
  - id: 'adi-1-222-8'
    kind: verse
    lines:
      - मधुरेणैव राज्यस्य तेषामर्धं प्रदीयताम्
      - एतद्धि पुरुषव्याघ्र हितं सर्वजनस्य च
    iast: "madhureṇaiva rājyasya teṣāmardhaṃ pradīyatām | etaddhi puruṣavyāghra hitaṃ sarvajanasya ca"
  - id: 'adi-1-222-17'
    kind: verse
    lines:
      - न चापि तेषां वीराणां जीवतां कुरुनन्दन
      - पित्र्योंशः शक्य आदातुमपि वज्रभृता स्वयं
    iast: "na cāpi teṣāṃ vīrāṇāṃ jīvatāṃ kurunandana | pitryoṃśaḥ śakya ādātumapi vajrabhṛtā svayaṃ"
  - id: 'adi-1-223-2'
    kind: verse
    lines:
      - ममाप्येषा मतिस्तात या भीष्मस्य महात्मनः
      - संविभज्यास्तु कौन्तेया धर्म एष सनातनः
    iast: "mamāpyeṣā matistāta yā bhīṣmasya mahātmanaḥ | saṃvibhajyāstu kaunteyā dharma eṣa sanātanaḥ"
  - id: 'adi-1-224-2'
    kind: verse
    lines:
      - प्रियं हितं च तद्वाक्यमुक्तवान्कुरुसत्तमः
      - भीष्मः शान्तनवो राजन्प्रतिगृह्णासि तन्न च
    iast: "priyaṃ hitaṃ ca tadvākyamuktavānkurusattamaḥ | bhīṣmaḥ śāntanavo rājanpratigṛhṇāsi tanna ca"
  - id: 'adi-1-224-3'
    kind: verse
    lines:
      - तथा द्रोणेन बहुधा भाषितं हितमुत्तमम्
      - तच्च राधासुतः कर्णो मन्यते न हितं तव
    iast: "tathā droṇena bahudhā bhāṣitaṃ hitamuttamam | tacca rādhāsutaḥ karṇo manyate na hitaṃ tava"
  - id: 'adi-1-224-11'
    kind: verse
    lines:
      - एतद्धि परमं श्रेयो मन्येऽहं तव भारत
      - दुर्योधनप्रभृतयः पुत्रा राजन्यथा तव
    iast: "etaddhi paramaṃ śreyo manye'haṃ tava bhārata | duryodhanaprabhṛtayaḥ putrā rājanyathā tava"
  - id: 'adi-1-224-15'
    kind: verse
    lines:
      - यच्चाप्यशक्यतां तेषामाहतुः पुरुषर्षभौ
      - तत्तथा पुरुषव्याघ्र तव तद्भद्रमस्तु ते
    iast: "yaccāpyaśakyatāṃ teṣāmāhatuḥ puruṣarṣabhau | tattathā puruṣavyāghra tava tadbhadramastu te"
  - id: 'adi-1-224-29'
    kind: verse
    lines:
      - यच्च साम्नैव शक्येत कार्यं साधयितुं नृप
      - को दैवशप्तस्तत्कार्यं विग्रहेण समाचरेत्
    iast: "yacca sāmnaiva śakyeta kāryaṃ sādhayituṃ nṛpa | ko daivaśaptastatkāryaṃ vigraheṇa samācaret"
  - id: 'adi-1-224-30'
    kind: verse
    lines:
      - श्रुत्वा च जीवतः पार्थान्पौरजानपदा जनाः
      - बलवद्दर्शने हृष्टास्तेषां राजन्प्रियं कुरु
    iast: "śrutvā ca jīvataḥ pārthānpaurajānapadā janāḥ | balavaddarśane hṛṣṭāsteṣāṃ rājanpriyaṃ kuru"
  - id: 'adi-1-224-31'
    kind: verse
    lines:
      - दुर्योधनश्च कर्णश्च शकुनिश्चापि सौबलः
      - अधर्मयुक्ता दुष्प्रज्ञा बाला मैषां वचः कृथाः
    iast: "duryodhanaśca karṇaśca śakuniścāpi saubalaḥ | adharmayuktā duṣprajñā bālā maiṣāṃ vacaḥ kṛthāḥ"
  - id: 'adi-1-225-5'
    kind: verse
    lines:
      - दिष्ट्या जीवन्ति ते पार्था दिष्ट्या जीवति सा पृथा
      - दिष्ट्या द्रुपदकन्यां च लब्धवन्तो महारथाः
    iast: "diṣṭyā jīvanti te pārthā diṣṭyā jīvati sā pṛthā | diṣṭyā drupadakanyāṃ ca labdhavanto mahārathāḥ"
  - id: 'adi-1-225-7'
    kind: verse
    lines:
      - त्वमेव गत्वा विदुर तानिहानय मा चिरम्
      - वैशंपायन उवाच
      - एवमुक्तस्ततः क्षत्ता रथमारुह्य शीघ्रगम्
      - आगात्कतिपयाहोभिः पाञ्चालान्राजधर्मवित्
    iast: "tvameva gatvā vidura tānihānaya mā ciram | vaiśaṃpāyana uvāca | evamuktastataḥ kṣattā rathamāruhya śīghragam | āgātkatipayāhobhiḥ pāñcālānrājadharmavit"
  - id: 'adi-1-225-12'
    kind: verse
    lines:
      - ददर्श पाण्डवांस्तत्र वासुदेवं च भारत
      - स्नेहात्परिष्वज्य स तान्पप्रच्छानामयं ततः
    iast: "dadarśa pāṇḍavāṃstatra vāsudevaṃ ca bhārata | snehātpariṣvajya sa tānpapracchānāmayaṃ tataḥ"
  - id: 'adi-1-226-17'
    kind: verse
    lines:
      - बान्धवैः सहिताः सर्वे न शोकं कुरु माधवि
      - वैशंपायन उवाच
      - ततस्ते समनुज्ञाता द्रुपदेन महात्मना
    iast: "bāndhavaiḥ sahitāḥ sarve na śokaṃ kuru mādhavi | vaiśaṃpāyana uvāca | tataste samanujñātā drupadena mahātmanā"
  - id: 'adi-1-226-19'
    kind: verse
    lines:
      - सविहारं सुखं जग्मुर्नगरं नागसाह्वयम्
      - सुवर्णकक्ष्याग्रैवेयान्सुवर्णाङ्कुशभूषितान्
    iast: "savihāraṃ sukhaṃ jagmurnagaraṃ nāgasāhvayam | suvarṇakakṣyāgraiveyānsuvarṇāṅkuśabhūṣitān"
  - id: 'adi-1-226-31'
    kind: verse
    lines:
      - पाण्डवानागताञ्छ्रुत्वा नागरास्तु कुतूहलात्
      - मण्डयाञ्चक्रिरे तत्र नगरं नागसाह्वयम्
    iast: "pāṇḍavānāgatāñchrutvā nāgarāstu kutūhalāt | maṇḍayāñcakrire tatra nagaraṃ nāgasāhvayam"
  - id: 'adi-1-226-42'
    kind: verse
    lines:
      - पृष्टास्तु कुशलप्रश्नं सर्वेण नगरेण ते
      - समाविशन्त वेश्मानि धृतराष्ट्रस्य शासनात्
    iast: "pṛṣṭāstu kuśalapraśnaṃ sarveṇa nagareṇa te | samāviśanta veśmāni dhṛtarāṣṭrasya śāsanāt"
  - id: 'adi-1-227-11'
    kind: verse
    lines:
      - विश्रान्तास्ते महात्मानः कंचित्कालं सकेशवाः
      - आहूता धृतराष्ट्रेण राज्ञा शान्तनवेन च
      - धृतराष्ट्र उवाच
    iast: "viśrāntāste mahātmānaḥ kaṃcitkālaṃ sakeśavāḥ | āhūtā dhṛtarāṣṭreṇa rājñā śāntanavena ca | dhṛtarāṣṭra uvāca"
  - id: 'adi-1-227-12'
    kind: verse
    lines:
      - भ्रातृभिः सह कौन्तेय निबोधेदं वचो मम
      - पाण्डुना वर्धितं राज्यं पाण्डुना पालितं जगत्
    iast: "bhrātṛbhiḥ saha kaunteya nibodhedaṃ vaco mama | pāṇḍunā vardhitaṃ rājyaṃ pāṇḍunā pālitaṃ jagat"
  - id: 'adi-1-227-17'
    kind: verse
    lines:
      - संरक्ष्यमाणान्पार्थेन त्रिदशानिव वज्रिणा
      - अर्धराज्यं तु संप्राप्य खाण्डवप्रस्थणाविश
    iast: "saṃrakṣyamāṇānpārthena tridaśāniva vajriṇā | ardharājyaṃ tu saṃprāpya khāṇḍavaprasthaṇāviśa"
  - id: 'adi-1-227-18'
    kind: verse
    lines:
      - केशवो यदि मन्यते तत्कर्तव्यमसंशयम्
      - वैशंपायन उवाच
    iast: "keśavo yadi manyate tatkartavyamasaṃśayam | vaiśaṃpāyana uvāca"
  - id: 'adi-1-227-20'
    kind: verse
    lines:
      - अभिषेकस्य संभारान्क्षत्तरानय मा चिरम्
      - अभिषिक्तं करिष्यामि ह्यद्य वै कुरुनन्दनम्
    iast: "abhiṣekasya saṃbhārānkṣattarānaya mā ciram | abhiṣiktaṃ kariṣyāmi hyadya vai kurunandanam"
  - id: 'adi-1-227-21'
    kind: verse
    lines:
      - ब्राह्मणा नैगमश्रेष्ठाः श्रेणीमुख्याश्च सर्वतः
      - आहूयन्तां प्रकृतयो बान्धवाश्च विशेषतः
    iast: "brāhmaṇā naigamaśreṣṭhāḥ śreṇīmukhyāśca sarvataḥ | āhūyantāṃ prakṛtayo bāndhavāśca viśeṣataḥ"
  - id: 'adi-1-227-25'
    kind: verse
    lines:
      - जाह्नवीसलिलं शीघ्रमानीयन्तां पुरोहितैः
      - अभिषेकोदकक्लिन्नं सर्वाभरणभूषितम्
    iast: "jāhnavīsalilaṃ śīghramānīyantāṃ purohitaiḥ | abhiṣekodakaklinnaṃ sarvābharaṇabhūṣitam"
  - id: 'adi-1-227-27'
    kind: verse
    lines:
      - जयेति द्विजवाक्येनु स्तूयमानं नृपैस्तथा
      - दृष्ट्वा कुन्तीसुतं ज्येष्ठमाजमीढं युधिष्ठिरम्
    iast: "jayeti dvijavākyenu stūyamānaṃ nṛpaistathā | dṛṣṭvā kuntīsutaṃ jyeṣṭhamājamīḍhaṃ yudhiṣṭhiram"
  - id: 'adi-1-227-29'
    kind: verse
    lines:
      - प्रतिक्रिया कृतमिदं भविष्यति न संशयः
      - भीष्मो द्रोणः कृपः क्षत्ता साधुसाध्वित्यथाब्रुवन्
      - श्रीवासुदेव उवाच
    iast: "pratikriyā kṛtamidaṃ bhaviṣyati na saṃśayaḥ | bhīṣmo droṇaḥ kṛpaḥ kṣattā sādhusādhvityathābruvan | śrīvāsudeva uvāca"
  - id: 'adi-1-227-32'
    kind: verse
    lines:
      - तस्मिन्क्षणे महाराज कृष्णद्वैपायनस्तदा
      - आगत्य कुरुभिः सर्वैः पूजितः ससुहृद्गणैः
    iast: "tasminkṣaṇe mahārāja kṛṣṇadvaipāyanastadā | āgatya kurubhiḥ sarvaiḥ pūjitaḥ sasuhṛdgaṇaiḥ"
  - id: 'adi-1-227-33'
    kind: verse
    lines:
      - मूर्धाभिषिक्तैः सहितो ब्राह्मणैर्वेदपारगैः
      - कारयामास विधिवत्केशवानुमते तदा
    iast: "mūrdhābhiṣiktaiḥ sahito brāhmaṇairvedapāragaiḥ | kārayāmāsa vidhivatkeśavānumate tadā"
  - id: 'adi-1-227-41'
    kind: verse
    lines:
      - प्रविवेश तदा राजा नागरैः पूजितो गृहम्
      - मूर्धाभिषिक्तं कौन्तेयमभ्यगच्छन्त कौरवाः
    iast: "praviveśa tadā rājā nāgaraiḥ pūjito gṛham | mūrdhābhiṣiktaṃ kaunteyamabhyagacchanta kauravāḥ"
  - id: 'adi-1-227-43'
    kind: verse
    lines:
      - समक्षं वासुदेवस्य कुरूणां च समक्षतः
      - अभिषेकस्त्वया प्राप्तो दुष्प्रापो ह्यकृतात्मभिः
    iast: "samakṣaṃ vāsudevasya kurūṇāṃ ca samakṣataḥ | abhiṣekastvayā prāpto duṣprāpo hyakṛtātmabhiḥ"
  - id: 'adi-1-227-46'
    kind: verse
    lines:
      - विनाशितं मुनिगणैर्लोभाद्बुधसुतस्य वै
      - तस्मात्त्वं खाण्डवप्रस्थं पुरं राष्ट्रं च वर्धय
    iast: "vināśitaṃ munigaṇairlobhādbudhasutasya vai | tasmāttvaṃ khāṇḍavaprasthaṃ puraṃ rāṣṭraṃ ca vardhaya"
  - id: 'adi-1-227-49'
    kind: verse
    lines:
      - प्रतिगृह्य तु तद्वाक्यं तस्मै सर्वे प्रणम्य च
      - रथैर्नागैर्हयैश्चापि सहितास्तु पदातिभिः
    iast: "pratigṛhya tu tadvākyaṃ tasmai sarve praṇamya ca | rathairnāgairhayaiścāpi sahitāstu padātibhiḥ"
  - id: 'adi-1-227-50'
    kind: verse
    lines:
      - प्रतस्थिरे ततो घोषसंयुक्तैः स्यन्दनैर्वरैः
      - तान्दृष्ट्वा नागराः सर्वे भक्त्या चैव प्रतस्थिरे
    iast: "pratasthire tato ghoṣasaṃyuktaiḥ syandanairvaraiḥ | tāndṛṣṭvā nāgarāḥ sarve bhaktyā caiva pratasthire"
  - id: 'adi-1-227-53'
    kind: verse
    lines:
      - मण्डयाञ्चक्रिरे तद्वै पुरं स्वर्गादिव च्युतम्
      - वासुदेवो जगन्नाथश्चिन्तयामास वासवम्
    iast: "maṇḍayāñcakrire tadvai puraṃ svargādiva cyutam | vāsudevo jagannāthaścintayāmāsa vāsavam"
  - id: 'adi-1-227-55'
    kind: verse
    lines:
      - इन्द्रप्रस्थमिति ख्यातं दिव्यं भूम्यां भविष्यति
      - महेन्द्रशासनाद्गत्वा विश्वकर्मा तु केशवम्
    iast: "indraprasthamiti khyātaṃ divyaṃ bhūmyāṃ bhaviṣyati | mahendraśāsanādgatvā viśvakarmā tu keśavam"
  - id: 'adi-1-227-56'
    kind: verse
    lines:
      - प्रणम्य प्रणिपातार्हं किं करोमीत्यभाषत
      - वासुदेवस्तु तच्छ्रुत्वा विश्वकर्माणमूचिवान्
    iast: "praṇamya praṇipātārhaṃ kiṃ karomītyabhāṣata | vāsudevastu tacchrutvā viśvakarmāṇamūcivān"
  - id: 'adi-1-227-57'
    kind: verse
    lines:
      - कुरुष्व कुरुराजस्य महेन्द्रपुरसन्निभम्
      - इन्द्रेण कृतनामानमिन्द्रप्रस्थं महापुरम्
      - वैशंपायन उवाच
    iast: "kuruṣva kururājasya mahendrapurasannibham | indreṇa kṛtanāmānamindraprasthaṃ mahāpuram | vaiśaṃpāyana uvāca"
  - id: 'adi-1-227-59'
    kind: verse
    lines:
      - तत्पुरं मापयामासुर्द्वैपायनपुरोगमाः ततः स विश्वकर्मा तु चकार पुरमुत्तमम्
    iast: "tatpuraṃ māpayāmāsurdvaipāyanapurogamāḥ tataḥ sa viśvakarmā tu cakāra puramuttamam"
  - id: 'adi-1-227-60'
    kind: verse
    lines:
      - सागरप्रतिरूपाभिः परिखाभिरलङ्कृतम्
      - प्राकारेण च संपन्नं दिवमावृत्य तिष्ठता
    iast: "sāgarapratirūpābhiḥ parikhābhiralaṅkṛtam | prākāreṇa ca saṃpannaṃ divamāvṛtya tiṣṭhatā"
  - id: 'adi-1-227-68'
    kind: verse
    lines:
      - शुशुभे धनसंपूर्णं धनाध्यक्षक्षयोपमम्
      - तत्रागच्छन्द्विजा राजन्सर्ववेदविदां वराः
    iast: "śuśubhe dhanasaṃpūrṇaṃ dhanādhyakṣakṣayopamam | tatrāgacchandvijā rājansarvavedavidāṃ varāḥ"
  - id: 'adi-1-227-69'
    kind: verse
    lines:
      - निवासं रोचयन्ति स्म सर्वभाषाविदस्तथा
      - वणिजश्चाययुस्तत्र नानादिग्भ्यो धनार्थिनः
    iast: "nivāsaṃ rocayanti sma sarvabhāṣāvidastathā | vaṇijaścāyayustatra nānādigbhyo dhanārthinaḥ"
  - id: 'adi-1-227-70'
    kind: verse
    lines:
      - सर्वशिल्पविदस्तत्र वासायाभ्यागमंस्तदा
      - उद्यानानि च रम्याणि नगरस्य समन्ततः
    iast: "sarvaśilpavidastatra vāsāyābhyāgamaṃstadā | udyānāni ca ramyāṇi nagarasya samantataḥ"
  - id: 'adi-1-227-78'
    kind: verse
    lines:
      - रम्याश्च विविधास्तत्र पुष्करिण्यो वनावृताः
      - तडागानि च रम्याणि बृहन्ति सुबहूनि च
    iast: "ramyāśca vividhāstatra puṣkariṇyo vanāvṛtāḥ | taḍāgāni ca ramyāṇi bṛhanti subahūni ca"
  - id: 'adi-1-227-79'
    kind: verse
    lines:
      - नदी च नन्दिनी नाम सा पुरीमुपगूहति
      - चातुर्वर्ण्यसमाकीर्णमन्यैः शिल्पिभिरावृतम्
    iast: "nadī ca nandinī nāma sā purīmupagūhati | cāturvarṇyasamākīrṇamanyaiḥ śilpibhirāvṛtam"
  - id: 'adi-1-227-83'
    kind: verse
    lines:
      - पौरवाणामधिपतिः कुन्तीपुत्रो युधिष्ठिरः
      - कृतमङ्गलसत्कारैर्ब्राह्मणैर्वेदपारगैः
    iast: "pauravāṇāmadhipatiḥ kuntīputro yudhiṣṭhiraḥ | kṛtamaṅgalasatkārairbrāhmaṇairvedapāragaiḥ"
  - id: 'adi-1-227-84'
    kind: verse
    lines:
      - द्वैपायनं पुरस्कृत्य धौम्यस्याभिमते स्थितः
      - भ्रातृभिः सहितो राजा राजमार्गमतीत्य च
    iast: "dvaipāyanaṃ puraskṛtya dhaumyasyābhimate sthitaḥ | bhrātṛbhiḥ sahito rājā rājamārgamatītya ca"
  - id: 'adi-1-227-85'
    kind: verse
    lines:
      - औपवाह्यगतो राजा केशवेन सहाभिभूः
      - तोरणद्वारसुमुखं द्वात्रिंशद्द्वारसंयुतम्
    iast: "aupavāhyagato rājā keśavena sahābhibhūḥ | toraṇadvārasumukhaṃ dvātriṃśaddvārasaṃyutam"
  - id: 'adi-1-227-86'
    kind: verse
    lines:
      - वर्धमानपुरद्वारात्प्रविवेश महाद्युतिः
      - शङ्खदुन्दुभिनिर्घोषाः श्रूयन्ते बहवो भृशम्
    iast: "vardhamānapuradvārātpraviveśa mahādyutiḥ | śaṅkhadundubhinirghoṣāḥ śrūyante bahavo bhṛśam"
  - id: 'adi-1-227-89'
    kind: verse
    lines:
      - प्रविश्य भवनं राजा नागरैरभिसंवृतः
      - प्रहृष्टमुदितैरासीत्सत्कारैरभिपूजितः
    iast: "praviśya bhavanaṃ rājā nāgarairabhisaṃvṛtaḥ | prahṛṣṭamuditairāsītsatkārairabhipūjitaḥ"
  - id: 'adi-1-227-97'
    kind: verse
    lines:
      - तव प्रसादाद्वार्ष्णेय राज्यं प्राप्तं मयाऽनघ
      - प्रसादादेव ते वीर शून्यं राष्ट्रं सुदुर्गमम्
    iast: "tava prasādādvārṣṇeya rājyaṃ prāptaṃ mayā'nagha | prasādādeva te vīra śūnyaṃ rāṣṭraṃ sudurgamam"
  - id: 'adi-1-227-98'
    kind: verse
    lines:
      - तवैव तु प्रसादेन राज्यस्थाश्च भवामहे
      - गतिस्त्वमापत्कालेऽपि पाण्डवानां च माधव
    iast: "tavaiva tu prasādena rājyasthāśca bhavāmahe | gatistvamāpatkāle'pi pāṇḍavānāṃ ca mādhava"
  - id: 'adi-1-227-100'
    kind: verse
    lines:
      - त्वत्प्रभावान्महाराज्यं संप्राप्तं हि स्वधर्मतः
      - पितृपैतामहं राज्यं कथं न स्यात्तव प्रभो
    iast: "tvatprabhāvānmahārājyaṃ saṃprāptaṃ hi svadharmataḥ | pitṛpaitāmahaṃ rājyaṃ kathaṃ na syāttava prabho"
  - id: 'adi-1-227-101'
    kind: verse
    lines:
      - धार्तराष्ट्रा दुराचाराः किं करिष्यन्ति पाण्डवान्
      - यथेष्टं पालय जगच्छश्वद्धर्मधुरं वह
    iast: "dhārtarāṣṭrā durācārāḥ kiṃ kariṣyanti pāṇḍavān | yatheṣṭaṃ pālaya jagacchaśvaddharmadhuraṃ vaha"
  - id: 'adi-1-228-6'
    kind: verse
    lines:
      - प्राप्य राज्यं महातेजाः सत्यसन्धो युधिष्ठिरः
      - पालयामास धर्मेण पृथिवीं भ्रातृभिः सह
    iast: "prāpya rājyaṃ mahātejāḥ satyasandho yudhiṣṭhiraḥ | pālayāmāsa dharmeṇa pṛthivīṃ bhrātṛbhiḥ saha"
  - id: 'adi-1-238-3'
    kind: verse
    lines:
      - चिन्तयामास रात्रौ तु गदेन कथितं पुरा
      - सुभद्रायाश्च माधुर्यरूपसंपद्गुणानि च
    iast: "cintayāmāsa rātrau tu gadena kathitaṃ purā | subhadrāyāśca mādhuryarūpasaṃpadguṇāni ca"
  - id: 'adi-1-241-21'
    kind: verse
    lines:
      - पाण्डवस्य सुभद्रायाः सकाशे तु यशस्विनः
      - समुत्पत्तिः प्रभावश्च गदेन कथितः पुरा
    iast: "pāṇḍavasya subhadrāyāḥ sakāśe tu yaśasvinaḥ | samutpattiḥ prabhāvaśca gadena kathitaḥ purā"
  - id: 'adi-1-241-26'
    kind: verse
    lines:
      - तस्मात्सुभद्रा चकमे पौरुषाद्भरतर्षभम्
      - सत्यसन्धस्य रूपेण चातुर्येण च मोहिता
    iast: "tasmātsubhadrā cakame pauruṣādbharatarṣabham | satyasandhasya rūpeṇa cāturyeṇa ca mohitā"
  - id: 'adi-1-247-36'
    kind: verse
    lines:
      - ततः प्रीतिकरो यूनां विवाहपरमोत्सवः भद्रवत्यै सुभद्रायै सप्तरात्रमवर्तत
    iast: "tataḥ prītikaro yūnāṃ vivāhaparamotsavaḥ bhadravatyai subhadrāyai saptarātramavartata"
  - id: 'adi-1-247-62'
    kind: verse
    lines:
      - दीर्घबाहुं महोरस्कं वृषभाक्षमरिन्दमम्
      - सुभद्रा सुषुवे वीरमभिमन्युं नरर्षभम्
    iast: "dīrghabāhuṃ mahoraskaṃ vṛṣabhākṣamarindamam | subhadrā suṣuve vīramabhimanyuṃ nararṣabham"
  - id: 'adi-1-247-73'
    kind: verse
    lines:
      - कृष्णस्य सदृशं शौर्ये वीर्ये रूपे तथाऽऽकृतौ
      - ददर्श पुत्रं बीभत्सुर्मघवानिव तं यथा
    iast: "kṛṣṇasya sadṛśaṃ śaurye vīrye rūpe tathā''kṛtau | dadarśa putraṃ bībhatsurmaghavāniva taṃ yathā"
  - id: 'adi-1-247-75'
    kind: verse
    lines:
      - युधिष्ठिरात्प्रतिविन्ध्यं सुतसोमं वृकोदरात्
      - अर्जुनाच्छ्रुतकर्माणं शतानीकं च नाकुलिम्
    iast: "yudhiṣṭhirātprativindhyaṃ sutasomaṃ vṛkodarāt | arjunācchrutakarmāṇaṃ śatānīkaṃ ca nākulim"
  - id: 'adi-1-247-76'
    kind: verse
    lines:
      - सहदेवाच्छ्रुतसेनमेतान्पञ्च महारथान्
      - पाञ्चाली सुषुवे वीरानादित्यानदितिर्यथा
    iast: "sahadevācchrutasenametānpañca mahārathān | pāñcālī suṣuve vīrānādityānaditiryathā"
  - id: 'adi-1-247-85'
    kind: verse
    lines:
      - दिव्यगर्भोपमैः पुत्रैर्व्यूढोरस्कैर्महारथैः
      - अन्विता राजशार्दूल पाण्डवा मुदमाप्नुवन्
    iast: "divyagarbhopamaiḥ putrairvyūḍhoraskairmahārathaiḥ | anvitā rājaśārdūla pāṇḍavā mudamāpnuvan"
  - id: 'adi-1-248-14'
    kind: verse
    lines:
      - ततः कतिपयाहस्य बीभत्सुः कृष्णमब्रवीत्
      - उष्णानि कृष्ण वर्तन्ते गच्छावो यमुनां प्रति
    iast: "tataḥ katipayāhasya bībhatsuḥ kṛṣṇamabravīt | uṣṇāni kṛṣṇa vartante gacchāvo yamunāṃ prati"
  - id: 'adi-1-248-17'
    kind: verse
    lines:
      - आमन्त्र्य तौ धर्मराजमनुज्ञाप्य च भारत
      - जग्मतुः पार्थगोविन्दौ सुहृज्जनवृतौ ततः
    iast: "āmantrya tau dharmarājamanujñāpya ca bhārata | jagmatuḥ pārthagovindau suhṛjjanavṛtau tataḥ"
  - id: 'adi-1-248-40'
    kind: verse
    lines:
      - तत्र गत्वा महात्मानौ कृष्णौ परपुरञ्जयौ
      - महार्हासनयो राजंस्ततस्तौ सन्निषीदतुः
    iast: "tatra gatvā mahātmānau kṛṣṇau parapurañjayau | mahārhāsanayo rājaṃstatastau sanniṣīdatuḥ"
  - id: 'adi-1-248-42'
    kind: verse
    lines:
      - तत्रोपविष्टौ मुदितौ नाकपृष्ठेऽश्विनाविव
      - अभ्यागच्छत्तदा विप्रो वासुदेवधनञ्जयौ
    iast: "tatropaviṣṭau muditau nākapṛṣṭhe'śvināviva | abhyāgacchattadā vipro vāsudevadhanañjayau"
  - id: 'adi-1-249-1'
    kind: verse
    lines:
      - सोऽब्रवीदर्जुनं चैव वासुदेवं च सात्वतम्
      - लोकप्रवीरौ तिष्ठन्तौ काण्डवस्य समीपतः
    iast: "so'bravīdarjunaṃ caiva vāsudevaṃ ca sātvatam | lokapravīrau tiṣṭhantau kāṇḍavasya samīpataḥ"
  - id: 'adi-1-249-2'
    kind: verse
    lines:
      - ब्राह्मणो बहुभोक्ताऽस्मि बुञ्जेऽपरिमितं सदा
      - भिक्षे वार्ष्णेयपार्थौ वामेकां तृप्तिं प्रयच्छतम्
    iast: "brāhmaṇo bahubhoktā'smi buñje'parimitaṃ sadā | bhikṣe vārṣṇeyapārthau vāmekāṃ tṛptiṃ prayacchatam"
  - id: 'adi-1-249-10'
    kind: verse
    lines:
      - स युवाभ्यां सहायाभ्यामस्त्रविद्भ्यां समागतः
      - दहेयं खाण्डवं दावमेतदन्नं वृतं मया
    iast: "sa yuvābhyāṃ sahāyābhyāmastravidbhyāṃ samāgataḥ | daheyaṃ khāṇḍavaṃ dāvametadannaṃ vṛtaṃ mayā"
  - id: 'adi-1-251-9'
    kind: verse
    lines:
      - देवदानवगन्धर्वैः पूजितं शाश्वतीः समाः
      - प्रादाच्चैव धनूरत्नमक्षय्यौ च महेषुधी
    iast: "devadānavagandharvaiḥ pūjitaṃ śāśvatīḥ samāḥ | prādāccaiva dhanūratnamakṣayyau ca maheṣudhī"
  - id: 'adi-1-251-10'
    kind: verse
    lines:
      - रथं च दिव्याश्वयुजं कपिप्रवरकेतनम्
      - उपेतं राजतैरश्वैर्गान्धर्वैर्हेममालिभिः
    iast: "rathaṃ ca divyāśvayujaṃ kapipravaraketanam | upetaṃ rājatairaśvairgāndharvairhemamālibhiḥ"
  - id: 'adi-1-251-23'
    kind: verse
    lines:
      - बभूव कल्यः कौन्तेयः प्रहृष्टः साह्यकर्मणि
      - वज्रनाभं ततश्चक्रं ददौ कृष्णाय पावकः
    iast: "babhūva kalyaḥ kaunteyaḥ prahṛṣṭaḥ sāhyakarmaṇi | vajranābhaṃ tataścakraṃ dadau kṛṣṇāya pāvakaḥ"
  - id: 'adi-1-251-29'
    kind: verse
    lines:
      - ततः पावकमब्रूतां प्रहृष्टावर्जुनाच्युतौ
      - कृतास्त्रौ शस्त्रसंपन्नौ रथिनौ ध्वजिनावपि
    iast: "tataḥ pāvakamabrūtāṃ prahṛṣṭāvarjunācyutau | kṛtāstrau śastrasaṃpannau rathinau dhvajināvapi"
  - id: 'adi-1-251-33'
    kind: verse
    lines:
      - सर्वतः परिवार्यैवं दावमेतं महाप्रभो
      - कामं संप्रज्वलाद्यैव कल्यौ स्वः साह्यकर्मणि
    iast: "sarvataḥ parivāryaivaṃ dāvametaṃ mahāprabho | kāmaṃ saṃprajvalādyaiva kalyau svaḥ sāhyakarmaṇi"
  - id: 'adi-1-251-35'
    kind: verse
    lines:
      - एवमुक्तः स भगवान्दाशार्हेणार्जुनेन च
      - तैजसं रपमास्थाय दावं दग्धुं प्रचक्रमे
    iast: "evamuktaḥ sa bhagavāndāśārheṇārjunena ca | taijasaṃ rapamāsthāya dāvaṃ dagdhuṃ pracakrame"
  - id: 'adi-1-251-36'
    kind: verse
    lines:
      - सर्वतः परिवार्याथ सप्तार्चिर्ज्वलनस्तथा
      - ददाह खाण्डवं दावं युगान्तमिव दर्शयन्
    iast: "sarvataḥ parivāryātha saptārcirjvalanastathā | dadāha khāṇḍavaṃ dāvaṃ yugāntamiva darśayan"
  - id: 'adi-1-252-17'
    kind: verse
    lines:
      - तच्छ्रुत्वा वृत्रहा तेभ्यः स्वयमेवान्ववेक्ष्य च
      - खाण्डवस्य विमोक्षार्थं प्रययौ हरिवाहनः
    iast: "tacchrutvā vṛtrahā tebhyaḥ svayamevānvavekṣya ca | khāṇḍavasya vimokṣārthaṃ prayayau harivāhanaḥ"
  - id: 'adi-1-253-46'
    kind: verse
    lines:
      - भूय एव तदा वीर्यं जिज्ञासुः सव्यसाचिनः
      - तच्छैरर्जुनो वर्षं प्रतिजघ्नेऽत्यमर्षितः
    iast: "bhūya eva tadā vīryaṃ jijñāsuḥ savyasācinaḥ | tacchairarjuno varṣaṃ pratijaghne'tyamarṣitaḥ"
  - id: 'adi-1-254-47'
    kind: verse
    lines:
      - तस्मिन्वने दह्यमाने षडग्निर्न ददाह च
      - अश्वसेनं मयं चैव चतुरः शार्ङ्गकांस्तथा
    iast: "tasminvane dahyamāne ṣaḍagnirna dadāha ca | aśvasenaṃ mayaṃ caiva caturaḥ śārṅgakāṃstathā"
  - id: 'adi-1-260-15'
    kind: verse
    lines:
      - पावकश्च तदा दावं दग्ध्वसमृगपक्षिणम्
      - अहोभिरेकविंशद्भिर्विरराग्सुतर्पितः
    iast: "pāvakaśca tadā dāvaṃ dagdhvasamṛgapakṣiṇam | ahobhirekaviṃśadbhirvirarāgsutarpitaḥ"
  - id: 'adi-1-260-20'
    kind: verse
    lines:
      - एवं तौ समनुज्ञातौ पाववेमहात्मना
      - अर्जुनो वासुदेवश्च दानवश्चयस्तथा
    iast: "evaṃ tau samanujñātau pāvavemahātmanā | arjuno vāsudevaśca dānavaścayastathā"
  - id: 'adi-1-260-21'
    kind: verse
    lines:
      - परिक्रम्य ततः सर्वे त्रयोऽभरतर्षभ
      - रमणीये नदीकूले सहितामुपाविशंन्
    iast: "parikramya tataḥ sarve trayo'bharatarṣabha | ramaṇīye nadīkūle sahitāmupāviśaṃn"
  - id: 'sabha-2-1-6'
    kind: verse
    lines:
      - ततोऽब्रवीन्मयः पार्थं वासुदेवस्य सन्निधौ
      - पाण्डवेन परित्रातस्तत्कृतं प्रत्यनुस्मरन्
    iast: "tato'bravīnmayaḥ pārthaṃ vāsudevasya sannidhau | pāṇḍavena paritrātastatkṛtaṃ pratyanusmaran"
  - id: 'sabha-2-1-8'
    kind: verse
    lines:
      - त्वया त्रातोऽस्मि कौन्तेय ब्रूहि किं करवाणि ते
      - अहं हि विश्वकर्मा वै असुराणां परन्तप
    iast: "tvayā trāto'smi kaunteya brūhi kiṃ karavāṇi te | ahaṃ hi viśvakarmā vai asurāṇāṃ parantapa"
  - id: 'sabha-2-1-21'
    kind: verse
    lines:
      - ततो विचिन्त्य मनसा लोकनाथः प्रजापितः
      - चोदयामास तं कृष्णः सभा वै क्रियतामिति
    iast: "tato vicintya manasā lokanāthaḥ prajāpitaḥ | codayāmāsa taṃ kṛṣṇaḥ sabhā vai kriyatāmiti"
  - id: 'sabha-2-2-2'
    kind: verse
    lines:
      - गमनाय मतिं चक्रे पितुर्दर्शनलालसः
      - धर्मराजमथामन्त्र्य पृथां च पृथुलोचनः
    iast: "gamanāya matiṃ cakre piturdarśanalālasaḥ | dharmarājamathāmantrya pṛthāṃ ca pṛthulocanaḥ"
  - id: 'sabha-2-3-21'
    kind: verse
    lines:
      - तदाहृत्य च तां चक्रे सोऽसुरोऽप्रतिमां सभाम्
      - विश्रुतां त्रिषु लोकेषु दिव्यां मणिमयीं शुभाम्
    iast: "tadāhṛtya ca tāṃ cakre so'suro'pratimāṃ sabhām | viśrutāṃ triṣu lokeṣu divyāṃ maṇimayīṃ śubhām"
  - id: 'sabha-2-4-1'
    kind: verse
    lines:
      - तां तु कृत्वा सभां श्रेष्ठां मयश्चार्जुनमब्रवीत्
      - भूतानां च महावीर्यो ध्वजाग्रे किङ्करो गणः
    iast: "tāṃ tu kṛtvā sabhāṃ śreṣṭhāṃ mayaścārjunamabravīt | bhūtānāṃ ca mahāvīryo dhvajāgre kiṅkaro gaṇaḥ"
  - id: 'sabha-2-5-1'
    kind: verse
    lines:
      - अथ तत्रोपविष्टेषु पाण्डवेषु महात्मसु
      - महत्सु चोपविष्टेषु गन्धर्वेषु च भारत
    iast: "atha tatropaviṣṭeṣu pāṇḍaveṣu mahātmasu | mahatsu copaviṣṭeṣu gandharveṣu ca bhārata"
  - id: 'sabha-2-5-19'
    kind: verse
    lines:
      - तुतोष च यथावच्च पूजां प्राप्य युधिष्ठिरात् सोऽर्चितः पाण्डवैः सर्वैर्महर्षिर्वेदपारगः
      - धर्मकामार्थसंयुक्तं पप्रच्छेदं युधिष्ठिरम्
      - नारद उवाच
    iast: "tutoṣa ca yathāvacca pūjāṃ prāpya yudhiṣṭhirāt so'rcitaḥ pāṇḍavaiḥ sarvairmaharṣirvedapāragaḥ | dharmakāmārthasaṃyuktaṃ papracchedaṃ yudhiṣṭhiram | nārada uvāca"
  - id: 'sabha-2-5-20'
    kind: verse
    lines:
      - कच्चिदर्थाश्च कल्पन्ते धर्मे च रमते मनः
      - सुखानि चानुभूयन्ते मनश्च न विहन्यते
    iast: "kaccidarthāśca kalpante dharme ca ramate manaḥ | sukhāni cānubhūyante manaśca na vihanyate"
  - id: 'sabha-2-5-30'
    kind: verse
    lines:
      - कुलीनाश्चानुरक्ताश्च कृतास्ते वीरमन्त्रिणः
      - विजयो मन्त्रमूलो हि राज्ञो भवति भारत
    iast: "kulīnāścānuraktāśca kṛtāste vīramantriṇaḥ | vijayo mantramūlo hi rājño bhavati bhārata"
  - id: 'sabha-2-5-39'
    kind: verse
    lines:
      - कच्चिद्दुर्गाणि सर्वाणि धनधान्यायुधोदकैः
      - यन्त्रैश्च परिपूर्णानि तथा शिल्पिधनुर्धरैः
    iast: "kacciddurgāṇi sarvāṇi dhanadhānyāyudhodakaiḥ | yantraiśca paripūrṇāni tathā śilpidhanurdharaiḥ"
  - id: 'sabha-2-5-43'
    kind: verse
    lines:
      - कच्चिद्विनयसम्पन्नः कुलपुत्रो बहुश्रुतः
      - अनसूयुरनुप्रष्टा सत्कृतस्ते पुरोहितः
    iast: "kaccidvinayasampannaḥ kulaputro bahuśrutaḥ | anasūyuranupraṣṭā satkṛtaste purohitaḥ"
  - id: 'sabha-2-5-52'
    kind: verse
    lines:
      - कच्चिद्वलस्य भक्तं च वेतनं च यथोचितम्
      - सम्प्राप्तकाले दातव्यं ददासि न विकर्षसि
    iast: "kaccidvalasya bhaktaṃ ca vetanaṃ ca yathocitam | samprāptakāle dātavyaṃ dadāsi na vikarṣasi"
  - id: 'sabha-2-5-57'
    kind: verse
    lines:
      - कच्चिद्विद्याविनीतांश्च नराञ्ज्ञानविशारदान्
      - यथार्हं गुणतश्चैव दानेनाभ्युपपद्यसे
    iast: "kaccidvidyāvinītāṃśca narāñjñānaviśāradān | yathārhaṃ guṇataścaiva dānenābhyupapadyase"
  - id: 'sabha-2-5-58'
    kind: verse
    lines:
      - कच्चिद्दारान्मनुष्याणां तवार्थे मृत्युमीयुषाम्
      - व्यसनं चाभ्युपेतानां बिभर्षि भरतर्षभ
    iast: "kacciddārānmanuṣyāṇāṃ tavārthe mṛtyumīyuṣām | vyasanaṃ cābhyupetānāṃ bibharṣi bharatarṣabha"
  - id: 'sabha-2-5-74'
    kind: verse
    lines:
      - कच्चिदायस्य चार्धेन चतुर्भागेन वा पुनः
      - पादभागैस्त्रिभिर्वापि व्ययः संशुद्ध्यते तव
    iast: "kaccidāyasya cārdhena caturbhāgena vā punaḥ | pādabhāgaistribhirvāpi vyayaḥ saṃśuddhyate tava"
  - id: 'sabha-2-5-75'
    kind: verse
    lines:
      - कच्चिज्ज्ञातीन्गुरून्वृद्धान्वणिजः शिल्पिनः श्रितान्
      - अभीक्ष्णमनुगृहाणिसि धनधान्येन दुर्गतान्
    iast: "kaccijjñātīngurūnvṛddhānvaṇijaḥ śilpinaḥ śritān | abhīkṣṇamanugṛhāṇisi dhanadhānyena durgatān"
  - id: 'sabha-2-5-77'
    kind: verse
    lines:
      - कच्चिदर्थेषु सम्प्रौढान्हितकामाननुप्रियान्
      - नापकर्षसि कर्मभ्यः पूर्वमप्राप्य किल्बिषम्
    iast: "kaccidartheṣu samprauḍhānhitakāmānanupriyān | nāpakarṣasi karmabhyaḥ pūrvamaprāpya kilbiṣam"
  - id: 'sabha-2-5-81'
    kind: verse
    lines:
      - कच्चिद्राष्ट्रे तटाकानि पूर्णानि च बृहन्ति च
      - भागशो विनिविष्टानि न कृषिर्देवमातृका
    iast: "kaccidrāṣṭre taṭākāni pūrṇāni ca bṛhanti ca | bhāgaśo viniviṣṭāni na kṛṣirdevamātṛkā"
  - id: 'sabha-2-5-83'
    kind: verse
    lines:
      - कच्चित्स्वनुष्ठिता तात वार्ता ते साधुभिर्जनैः
      - वार्तायां संश्रितस्तात लोकोऽयं सुखमेधते
    iast: "kaccitsvanuṣṭhitā tāta vārtā te sādhubhirjanaiḥ | vārtāyāṃ saṃśritastāta loko'yaṃ sukhamedhate"
  - id: 'sabha-2-5-123'
    kind: verse
    lines:
      - कच्चित्कृतं विजानीषे कर्तारं च प्रशंससि
      - सतां मध्ये महाराज सत्करोषि च पूजयन्
    iast: "kaccitkṛtaṃ vijānīṣe kartāraṃ ca praśaṃsasi | satāṃ madhye mahārāja satkaroṣi ca pūjayan"
  - id: 'sabha-2-5-127'
    kind: verse
    lines:
      - कच्चिदग्निभयाच्चैव सर्वं व्यालभयात्तथा
      - रोगरक्षोभयाच्चैव राष्ट्रं स्वं परिरक्षशि
    iast: "kaccidagnibhayāccaiva sarvaṃ vyālabhayāttathā | rogarakṣobhayāccaiva rāṣṭraṃ svaṃ parirakṣaśi"
  - id: 'sabha-2-5-128'
    kind: verse
    lines:
      - कच्चिदन्धांश्च मूकांश्च पङ्गून्व्यङ्गानबान्धवान्
      - पितेव पासि धर्मज्ञ तथा प्रव्रजितानपि
    iast: "kaccidandhāṃśca mūkāṃśca paṅgūnvyaṅgānabāndhavān | piteva pāsi dharmajña tathā pravrajitānapi"
  - id: 'sabha-2-5-129'
    kind: verse
    lines:
      - षडवर्था महाराज कच्चित्ते पृष्ठतः कृताः
      - निद्राऽऽलस्यं भयं क्रोधो मार्दवं दीर्घसूत्रता
      - वैशम्पायन उवाच
    iast: "ṣaḍavarthā mahārāja kaccitte pṛṣṭhataḥ kṛtāḥ | nidrā''lasyaṃ bhayaṃ krodho mārdavaṃ dīrghasūtratā | vaiśampāyana uvāca"
  - id: 'sabha-2-12-28'
    kind: verse
    lines:
      - पिता च त्वाऽऽह कौन्तेय पाण्डुः कौरवनन्दन
      - हरिश्चन्द्रे श्रियं दृष्ट्वा नृपतौ जातविस्मयः
    iast: "pitā ca tvā''ha kaunteya pāṇḍuḥ kauravanandana | hariścandre śriyaṃ dṛṣṭvā nṛpatau jātavismayaḥ"
  - id: 'sabha-2-12-30'
    kind: verse
    lines:
      - समर्थोऽसि महीं जेतुं भ्रातरस्ते स्थिता वशे
      - राजसूयं क्रतुश्रेष्ठमहारस्वेति भारत
    iast: "samartho'si mahīṃ jetuṃ bhrātaraste sthitā vaśe | rājasūyaṃ kratuśreṣṭhamahārasveti bhārata"
  - id: 'sabha-2-13-1'
    kind: verse
    lines:
      - ऋषेस्तद्वचनं श्रुत्वा निशश्वास युधिष्ठिरः
      - चिन्तयन्राजसूयेष्टिं न लेभे शर्म भारत
    iast: "ṛṣestadvacanaṃ śrutvā niśaśvāsa yudhiṣṭhiraḥ | cintayanrājasūyeṣṭiṃ na lebhe śarma bhārata"
  - id: 'sabha-2-13-46'
    kind: verse
    lines:
      - गुरुवद्भूतगुरवे प्राहिणोद्दूतमञ्जसा
      - शीघ्रगेन रथेनाशु स दूतः प्राप्य यादवान्
    iast: "guruvadbhūtagurave prāhiṇoddūtamañjasā | śīghragena rathenāśu sa dūtaḥ prāpya yādavān"
  - id: 'sabha-2-26-11'
    kind: verse
    lines:
      - ससैन्याः प्रययुः सर्वे धर्मराजेन पूजिताः
      - दिशं धनपतेरिष्टामजयत्पाकशासनिः
    iast: "sasainyāḥ prayayuḥ sarve dharmarājena pūjitāḥ | diśaṃ dhanapateriṣṭāmajayatpākaśāsaniḥ"
  - id: 'sabha-2-26-12'
    kind: verse
    lines:
      - भीमसेनस्तथा प्राचीं सहदेवस्तु दक्षिणाम्
      - प्रतीचीं नकुलो राजन्दिशं व्यजयतास्त्रवित्
    iast: "bhīmasenastathā prācīṃ sahadevastu dakṣiṇām | pratīcīṃ nakulo rājandiśaṃ vyajayatāstravit"
  - id: 'sabha-2-36-13'
    kind: verse
    lines:
      - उच्चावचमुपादाय धर्मराजाय माधवः
      - धनौघं पुरुषव्याघ्रो बलेन महता वृतः
    iast: "uccāvacamupādāya dharmarājāya mādhavaḥ | dhanaughaṃ puruṣavyāghro balena mahatā vṛtaḥ"
  - id: 'sabha-2-36-13#2'
    kind: verse
    lines:
      - उच्चावचमुपादाय धर्मराजाय माधवः
      - धनौघं पुरुषव्याघ्रो बलेन महता वृतः
    iast: "uccāvacamupādāya dharmarājāya mādhavaḥ | dhanaughaṃ puruṣavyāghro balena mahatā vṛtaḥ"
  - id: 'sabha-2-36-18'
    kind: verse
    lines:
      - त्वत्कृते पृथिवी सर्वा मद्वशे कृष्ण वर्तते
      - धनं च बहु वार्ष्णेय त्वत्प्रसादादुपार्जितम्
    iast: "tvatkṛte pṛthivī sarvā madvaśe kṛṣṇa vartate | dhanaṃ ca bahu vārṣṇeya tvatprasādādupārjitam"
  - id: 'sabha-2-36-22'
    kind: verse
    lines:
      - मां वाप्यभ्यनुजानीह सहैभिरनुजैर्विभो
      - अनुज्ञातस्त्वया कृष्ण प्राप्नुयां क्रतुमुत्तमम्
      - वैशम्पायन उवाच
    iast: "māṃ vāpyabhyanujānīha sahaibhiranujairvibho | anujñātastvayā kṛṣṇa prāpnuyāṃ kratumuttamam | vaiśampāyana uvāca"
  - id: 'sabha-2-36-24'
    kind: verse
    lines:
      - यदस्वाभीप्सितं यज्ञं मयि श्रेयस्यवस्थिते
      - नियुङ्क्ष्व त्वं च मां कृत्ये सर्वं कर्तास्मि ते वचः
      - युधिष्ठिर उवाच
    iast: "yadasvābhīpsitaṃ yajñaṃ mayi śreyasyavasthite | niyuṅkṣva tvaṃ ca māṃ kṛtye sarvaṃ kartāsmi te vacaḥ | yudhiṣṭhira uvāca"
  - id: 'sabha-2-36-26'
    kind: verse
    lines:
      - अनुज्ञातस्तु कृष्णेन पाण्डवो भ्रातृभिः सह
      - ईजितुं राजसूयेन साधनान्युपचक्रमे
    iast: "anujñātastu kṛṣṇena pāṇḍavo bhrātṛbhiḥ saha | ījituṃ rājasūyena sādhanānyupacakrame"
  - id: 'sabha-2-36-43'
    kind: verse
    lines:
      - दूताश्च वाहनैर्जग्भू राष्ट्राणि सुबहून्यपि
      - ततो युधिष्ठिरो राजा प्रेषयामास पाण्डवम्
    iast: "dūtāśca vāhanairjagbhū rāṣṭrāṇi subahūnyapi | tato yudhiṣṭhiro rājā preṣayāmāsa pāṇḍavam"
  - id: 'sabha-2-36-44'
    kind: verse
    lines:
      - नकुलं हास्तिनपुरं भीष्माय भरतर्षभ द्रोणाय धृतराष्ट्राय विदुराय कृपाय च
      - भ्रातृणां चैव सर्वेणां येऽनुरक्ता युधिष्ठिरे
    iast: "nakulaṃ hāstinapuraṃ bhīṣmāya bharatarṣabha droṇāya dhṛtarāṣṭrāya vidurāya kṛpāya ca | bhrātṛṇāṃ caiva sarveṇāṃ ye'nuraktā yudhiṣṭhire"
  - id: 'sabha-2-36-47'
    kind: verse
    lines:
      - दीक्षितः स तु धर्मात्मा धर्मराजो युधिष्ठिरः
      - जगाम यज्ञायतनं वृतो विप्रैः सहस्रशः
    iast: "dīkṣitaḥ sa tu dharmātmā dharmarājo yudhiṣṭhiraḥ | jagāma yajñāyatanaṃ vṛto vipraiḥ sahasraśaḥ"
  - id: 'sabha-2-36-48'
    kind: verse
    lines:
      - भातृभिर्ज्ञातिभिश्चैव सुहृद्भिः सचिवैः सह
      - क्षत्रियैश्च मनुष्येन्द्रैर्नानादेशसमागतैः
    iast: "bhātṛbhirjñātibhiścaiva suhṛdbhiḥ sacivaiḥ saha | kṣatriyaiśca manuṣyendrairnānādeśasamāgataiḥ"
  - id: 'sabha-2-39-45'
    kind: verse
    lines:
      - ततो भीष्मः शान्तनवो बुद्ध्या निश्चित्य वीर्यवान्
      - वार्ष्णेयं मन्यते कृष्णमर्हणीयतमं भुवि
      - भीष्ण उवाच
    iast: "tato bhīṣmaḥ śāntanavo buddhyā niścitya vīryavān | vārṣṇeyaṃ manyate kṛṣṇamarhaṇīyatamaṃ bhuvi | bhīṣṇa uvāca"
  - id: 'sabha-2-39-46'
    kind: verse
    lines:
      - एष ह्येषां समस्तानां तेजोबलपराक्रमैः
      - मध्ये तपन्निवाभाति ज्योतिषामिव भास्करः
    iast: "eṣa hyeṣāṃ samastānāṃ tejobalaparākramaiḥ | madhye tapannivābhāti jyotiṣāmiva bhāskaraḥ"
  - id: 'sabha-2-39-48'
    kind: verse
    lines:
      - तस्मै भीष्माभ्यनुज्ञातः सहदेवः प्रतापवान्
      - उपजह्रेऽथ विधिवद्वार्ष्णेयायार्घ्यमुत्तमम्
    iast: "tasmai bhīṣmābhyanujñātaḥ sahadevaḥ pratāpavān | upajahre'tha vidhivadvārṣṇeyāyārghyamuttamam"
  - id: 'sabha-2-39-51'
    kind: verse
    lines:
      - प्रतिजग्राह तां कृष्णः शास्त्रदृष्टेन कर्मणा
      - शिशुपालस्तु तां पूजां वासुदेवे न चक्षमे
    iast: "pratijagrāha tāṃ kṛṣṇaḥ śāstradṛṣṭena karmaṇā | śiśupālastu tāṃ pūjāṃ vāsudeve na cakṣame"
  - id: 'sabha-2-39-57'
    kind: verse
    lines:
      - अतिपश्यसि वा सर्वान्न वा पश्यसि पाण्डव
      - तिष्ठत्स्वन्येषु पूज्येषु गोपमर्चितवानसि
    iast: "atipaśyasi vā sarvānna vā paśyasi pāṇḍava | tiṣṭhatsvanyeṣu pūjyeṣu gopamarcitavānasi"
  - id: 'sabha-2-40-25'
    kind: verse
    lines:
      - यदि भीताश्च कौन्तेयाः कृपणाश्च तपस्विनः
      - ननु त्वयाऽपि बोद्धव्यं यां पूजां माधवार्हसि
    iast: "yadi bhītāśca kaunteyāḥ kṛpaṇāśca tapasvinaḥ | nanu tvayā'pi boddhavyaṃ yāṃ pūjāṃ mādhavārhasi"
  - id: 'sabha-2-40-27'
    kind: verse
    lines:
      - अयुक्तामात्मनः पूजां त्वं पुनर्बहुमन्यसे
      - हविषः प्राप्य निष्यन्दं प्राशिता श्वेव निर्जने
    iast: "ayuktāmātmanaḥ pūjāṃ tvaṃ punarbahumanyase | haviṣaḥ prāpya niṣyandaṃ prāśitā śveva nirjane"
  - id: 'sabha-2-68-2'
    kind: verse
    lines:
      - आह्वये त्वां रणं गच्छ मया सार्धं जनार्दन
      - यावदद्य निहन्मि त्वां सहितं सर्वपाण्डवैः
    iast: "āhvaye tvāṃ raṇaṃ gaccha mayā sārdhaṃ janārdana | yāvadadya nihanmi tvāṃ sahitaṃ sarvapāṇḍavaiḥ"
  - id: 'sabha-2-68-6'
    kind: verse
    lines:
      - स रणायैव सङ्क्रुद्धः सन्नद्धः सर्वराजभिः
      - सुनीथः प्रययौ क्षिप्रं पार्थयज्ञजिघांसया
    iast: "sa raṇāyaiva saṅkruddhaḥ sannaddhaḥ sarvarājabhiḥ | sunīthaḥ prayayau kṣipraṃ pārthayajñajighāṃsayā"
  - id: 'sabha-2-68-7'
    kind: verse
    lines:
      - ततश्चक्रगदापाणिः केशवः केशिहा हरिः सध्वजं रथमास्थाय दारुकेण सुसत्कृतम्
      - भीष्मेण दत्तहस्तोऽसावारुहोह रथोत्तमम्
    iast: "tataścakragadāpāṇiḥ keśavaḥ keśihā hariḥ sadhvajaṃ rathamāsthāya dārukeṇa susatkṛtam | bhīṣmeṇa dattahasto'sāvāruhoha rathottamam"
  - id: 'sabha-2-70-50'
    kind: verse
    lines:
      - संमोहयित्वा भगवांश्चक्रं दिव्यं समाददे
      - चिच्छेद च सुनीथस्य शिरश्चक्रेण संयुगे
    iast: "saṃmohayitvā bhagavāṃścakraṃ divyaṃ samādade | ciccheda ca sunīthasya śiraścakreṇa saṃyuge"
  - id: 'sabha-2-71-1'
    kind: verse
    lines:
      - ततः प्रववृते यज्ञो धर्मराजस्य धीमतः
      - शान्तविघ्नार्हणक्षोभो महर्षिगणसङ्कुलः
    iast: "tataḥ pravavṛte yajño dharmarājasya dhīmataḥ | śāntavighnārhaṇakṣobho maharṣigaṇasaṅkulaḥ"
  - id: 'sabha-2-72-9'
    kind: verse
    lines:
      - ततस्त्ववभृथस्नातं धर्मात्मानं युधिष्ठिरम्
      - समस्तं पार्थिवं क्षत्रमुपगम्येदमब्रवीत्
    iast: "tatastvavabhṛthasnātaṃ dharmātmānaṃ yudhiṣṭhiram | samastaṃ pārthivaṃ kṣatramupagamyedamabravīt"
  - id: 'sabha-2-72-10'
    kind: verse
    lines:
      - दिष्ट्या वर्धसि धर्मज्ञ साम्राज्यं प्राप्तवानसि
      - आजमीढाजमीढानां यशः संवर्धितं त्वया
    iast: "diṣṭyā vardhasi dharmajña sāmrājyaṃ prāptavānasi | ājamīḍhājamīḍhānāṃ yaśaḥ saṃvardhitaṃ tvayā"
  - id: 'sabha-2-72-11'
    kind: verse
    lines:
      - कर्मणैतेन राजेन्द्र धर्मश्च सुमहान्कृतः
      - आपृच्छामो नरव्याघ्र सर्वकामैः सूपूजिताः
    iast: "karmaṇaitena rājendra dharmaśca sumahānkṛtaḥ | āpṛcchāmo naravyāghra sarvakāmaiḥ sūpūjitāḥ"
  - id: 'sabha-2-72-12'
    kind: verse
    lines:
      - स्वराष्ट्राणि गमिष्यामस्तदनुज्ञातुमर्हसि
      - श्रुत्वा तु वचनं राज्ञां धर्मराजो युधिष्ठिरः
    iast: "svarāṣṭrāṇi gamiṣyāmastadanujñātumarhasi | śrutvā tu vacanaṃ rājñāṃ dharmarājo yudhiṣṭhiraḥ"
  - id: 'sabha-2-72-15'
    kind: verse
    lines:
      - भ्रातुर्वचनमाज्ञाय पाण्डवा धर्मचारिणः
      - यथार्हं नृपतीन्सर्वानेकैकं समनुव्रजन्
    iast: "bhrāturvacanamājñāya pāṇḍavā dharmacāriṇaḥ | yathārhaṃ nṛpatīnsarvānekaikaṃ samanuvrajan"
  - id: 'sabha-2-72-32'
    kind: verse
    lines:
      - प्रययौ पुण्डरीकाक्षस्ततो द्वारवतीं पुरीम्
    iast: "prayayau puṇḍarīkākṣastato dvāravatīṃ purīm"
  - id: 'sabha-2-73-35'
    kind: verse
    lines:
      - कृतमङ्गलकल्यामो भ्रातृभिः पिरवारितः
      - गतेषु क्षत्रियेन्द्रेषु सर्वेषु भरतर्षभ
    iast: "kṛtamaṅgalakalyāmo bhrātṛbhiḥ piravāritaḥ | gateṣu kṣatriyendreṣu sarveṣu bharatarṣabha"
  - id: 'sabha-2-74-14'
    kind: verse
    lines:
      - एवं प्रलम्भान्विविधान्प्राप्य तत्र विशाम्पते
      - पाण्डवेयाभ्यनुज्ञातस्ततो दुर्योधनो नृपः
    iast: "evaṃ pralambhānvividhānprāpya tatra viśāmpate | pāṇḍaveyābhyanujñātastato duryodhano nṛpaḥ"
  - id: 'sabha-2-74-15'
    kind: verse
    lines:
      - अपहृष्टेन मनसा राजसूये महाक्रतौ
      - प्रेक्ष्य तामद्भुतामृद्धिं जगाम गजसाह्वयम्
    iast: "apahṛṣṭena manasā rājasūye mahākratau | prekṣya tāmadbhutāmṛddhiṃ jagāma gajasāhvayam"
  - id: 'sabha-2-74-17'
    kind: verse
    lines:
      - पार्थान्सुमनसो दृष्ट्वा पार्थिवांश्च वशानुगान्
      - कृत्स्नं चापि हितं लोकमाकुमारं कुरूद्वह
    iast: "pārthānsumanaso dṛṣṭvā pārthivāṃśca vaśānugān | kṛtsnaṃ cāpi hitaṃ lokamākumāraṃ kurūdvaha"
  - id: 'sabha-2-76-21'
    kind: verse
    lines:
      - तस्य तद्वचनं श्रुत्वा मन्दः क्रोधवशानुगः
      - पितरं प्रत्युवाचेदं स्वमतिं सम्प्रकाशयन्
      - दुर्योधन उवाच
    iast: "tasya tadvacanaṃ śrutvā mandaḥ krodhavaśānugaḥ | pitaraṃ pratyuvācedaṃ svamatiṃ samprakāśayan | duryodhana uvāca"
  - id: 'sabha-2-76-25'
    kind: verse
    lines:
      - न मां प्रीणाति मद्भुक्तं श्रियं दृष्ट्वा युधिष्ठेरे
      - अतिज्वलन्तीं कौन्तेये विवर्णकरणीं मम
    iast: "na māṃ prīṇāti madbhuktaṃ śriyaṃ dṛṣṭvā yudhiṣṭhere | atijvalantīṃ kaunteye vivarṇakaraṇīṃ mama"
  - id: 'sabha-2-76-59'
    kind: verse
    lines:
      - तां दृष्ट्वा पाण्डुपुत्रस्य श्रियं परमिक्रामहम्
      - शान्तिं न परिगच्छामि दह्यमानेन चेतसा
    iast: "tāṃ dṛṣṭvā pāṇḍuputrasya śriyaṃ paramikrāmaham | śāntiṃ na parigacchāmi dahyamānena cetasā"
  - id: 'sabha-2-76-62'
    kind: verse
    lines:
      - यामेतामतुलां लक्ष्मीं दृष्टवानसि पाण्डवे
      - तस्याटः प्राप्तावुपायं मे शृणु सत्यपराक्रम
    iast: "yāmetāmatulāṃ lakṣmīṃ dṛṣṭavānasi pāṇḍave | tasyāṭaḥ prāptāvupāyaṃ me śṛṇu satyaparākrama"
  - id: 'sabha-2-76-63'
    kind: verse
    lines:
      - अहमक्षेष्वभिज्ञोऽस्मि पृथिव्यामपि भारत
      - हृदयज्ञः पणज्ञश्च विशेषज्ञश्च देवने
    iast: "ahamakṣeṣvabhijño'smi pṛthivyāmapi bhārata | hṛdayajñaḥ paṇajñaśca viśeṣajñaśca devane"
  - id: 'sabha-2-76-64'
    kind: verse
    lines:
      - द्यूतप्रियश्च कौन्तेयो न च जानाति देवितुम्
      - आहूतश्चैष्यति व्यक्तं नित्यमेवाह्वयत्स्वयम्
    iast: "dyūtapriyaśca kaunteyo na ca jānāti devitum | āhūtaścaiṣyati vyaktaṃ nityamevāhvayatsvayam"
  - id: 'sabha-2-76-65'
    kind: verse
    lines:
      - नियतं तं विजेष्यामि कृत्वा तु कपटं विभो
      - आनयामि समृद्धिं तां दिव्यां चोपाह्वयस्व तम्
      - वैशम्पायन उवाच
    iast: "niyataṃ taṃ vijeṣyāmi kṛtvā tu kapaṭaṃ vibho | ānayāmi samṛddhiṃ tāṃ divyāṃ copāhvayasva tam | vaiśampāyana uvāca"
  - id: 'sabha-2-76-67'
    kind: verse
    lines:
      - अयमुत्सहते राजञ्श्रियमाहर्तुमक्षवित्
      - द्यूतेन पाण्डुपुत्रस्य तदनुज्ञातुमर्हसि
      - धृतराष्ट्र उवाच
    iast: "ayamutsahate rājañśriyamāhartumakṣavit | dyūtena pāṇḍuputrasya tadanujñātumarhasi | dhṛtarāṣṭra uvāca"
  - id: 'sabha-2-76-72'
    kind: verse
    lines:
      - आर्तवाक्यं तु तत्तस्य प्रणयोक्तं निशम्य सः
      - धृतराष्ट्रोऽब्रवीत्प्रेष्यन्दुर्योधनमते स्थितः
    iast: "ārtavākyaṃ tu tattasya praṇayoktaṃ niśamya saḥ | dhṛtarāṣṭro'bravītpreṣyanduryodhanamate sthitaḥ"
  - id: 'sabha-2-76-75'
    kind: verse
    lines:
      - दूर्योधनस्य शान्त्यर्थमिति निश्चित्य भूमिपः
      - धृतराष्ट्रो महाराज प्राहिणोद्विदुराय वै
    iast: "dūryodhanasya śāntyarthamiti niścitya bhūmipaḥ | dhṛtarāṣṭro mahārāja prāhiṇodvidurāya vai"
  - id: 'sabha-2-76-76'
    kind: verse
    lines:
      - अपृष्ट्वा विदुरं स्वस्यन नासीत्कश्चिद्विनिश्चयः
      - द्यूते दोषांश्च जानन्स पुत्रस्नेहादकृष्यत
    iast: "apṛṣṭvā viduraṃ svasyana nāsītkaścidviniścayaḥ | dyūte doṣāṃśca jānansa putrasnehādakṛṣyata"
  - id: 'sabha-2-76-77'
    kind: verse
    lines:
      - तच्छ्रुत्वा विदुरो धीमान्कलिद्वारमुपस्थितम्
      - विनाशमुखमुत्पन्नं धृतराष्ट्रमुपाद्रवत्
    iast: "tacchrutvā viduro dhīmānkalidvāramupasthitam | vināśamukhamutpannaṃ dhṛtarāṣṭramupādravat"
  - id: 'sabha-2-76-79'
    kind: verse
    lines:
      - नाभिनन्दामि ते राजन्व्यवसायमिमं प्रभो
      - पुत्रैर्भेदो यथा न स्थाद््द्यूतहेतोस्तथा कुरु
      - धृतराष्ट्र उवाच
    iast: "nābhinandāmi te rājanvyavasāyamimaṃ prabho | putrairbhedo yathā na sthāddyūtahetostathā kuru | dhṛtarāṣṭra uvāca"
  - id: 'sabha-2-76-81'
    kind: verse
    lines:
      - अशुभं वा शुभं वापि हितं वा यदि वाऽहितम्
    iast: "aśubhaṃ vā śubhaṃ vāpi hitaṃ vā yadi vā'hitam"
  - id: 'sabha-2-76-82'
    kind: verse
    lines:
      - मयि सन्निहिते द्रोणे भीष्मे त्वयि च भारत
      - अनयो दैवविहितो न कथञ्चिद्भविष्यति
    iast: "mayi sannihite droṇe bhīṣme tvayi ca bhārata | anayo daivavihito na kathañcidbhaviṣyati"
  - id: 'sabha-2-76-83'
    kind: verse
    lines:
      - गच्छ त्वं रथमास्थाय हयैर्वातसमैर्जवे
      - खाण्डवप्रस्थमद्यैव समानय युधिष्ठिरम्
    iast: "gaccha tvaṃ rathamāsthāya hayairvātasamairjave | khāṇḍavaprasthamadyaiva samānaya yudhiṣṭhiram"
  - id: 'sabha-2-83-1'
    kind: verse
    lines:
      - ततः प्रायाद्विदुरोऽश्वैरुदारैर्महाजवैर्बलिभिः साधु दान्तैः
      - बलान्नियुक्तो धृतराष्ट्रेण राज्ञा मनीषिणां पाण्डवानां सकाशे
    iast: "tataḥ prāyādviduro'śvairudārairmahājavairbalibhiḥ sādhu dāntaiḥ | balānniyukto dhṛtarāṣṭreṇa rājñā manīṣiṇāṃ pāṇḍavānāṃ sakāśe"
  - id: 'sabha-2-83-4'
    kind: verse
    lines:
      - तं वै राजा सत्यधृतिर्महात्मा अजातशत्रुर्विदुरं यथावत्
      - पूजापूर्वं प्रतिगृह्याजमीढस्ततोऽपृच्छद्धृतराष्ट्रं सपुत्रम्
      - युधिष्ठिर उवाच
    iast: "taṃ vai rājā satyadhṛtirmahātmā ajātaśatrurviduraṃ yathāvat | pūjāpūrvaṃ pratigṛhyājamīḍhastato'pṛcchaddhṛtarāṣṭraṃ saputram | yudhiṣṭhira uvāca"
  - id: 'sabha-2-83-6'
    kind: verse
    lines:
      - राजा महात्मा कुशली सपुत्र आस्ते वृतो ज्ञातिभिरिन्द्रकल्पः
      - प्रीतो राजन्पुत्रगुणैर्विनीतो विशोक एवात्मरतिर्महात्मा
    iast: "rājā mahātmā kuśalī saputra āste vṛto jñātibhirindrakalpaḥ | prīto rājanputraguṇairvinīto viśoka evātmaratirmahātmā"
  - id: 'sabha-2-83-7'
    kind: verse
    lines:
      - इदं तु त्वां कुरुराजोऽभ्युवाच पूर्वं पृष्ट्वा कुशलं चाव्ययं च
      - इयं सभा त्वत्सभातुल्यरूपा भ्रातॄणां ते दृस्यतामेत्य पुत्र
    iast: "idaṃ tu tvāṃ kururājo'bhyuvāca pūrvaṃ pṛṣṭvā kuśalaṃ cāvyayaṃ ca | iyaṃ sabhā tvatsabhātulyarūpā bhrātṝṇāṃ te dṛsyatāmetya putra"
  - id: 'sabha-2-83-8'
    kind: verse
    lines:
      - समागम्य भ्रातृभिः पार्थ तस्यां सुहृद्द्यूतं क्रियतां रम्यतां च
      - प्रीयामहे भवतां सङ्गमेन समागताः कुरवश्चापि सर्वे
    iast: "samāgamya bhrātṛbhiḥ pārtha tasyāṃ suhṛddyūtaṃ kriyatāṃ ramyatāṃ ca | prīyāmahe bhavatāṃ saṅgamena samāgatāḥ kuravaścāpi sarve"
  - id: 'sabha-2-83-11'
    kind: verse
    lines:
      - जानाम्यहं द्यूतमनर्थमूलं कृतश्च यत्नोऽस्य मया निवारणे
      - राजा च मां प्राहिमोत्त्वत्सकाशं श्रुत्वा विद्वञ्श्रेय इहाचरस्व
      - युधिष्ठिर उवाच
    iast: "jānāmyahaṃ dyūtamanarthamūlaṃ kṛtaśca yatno'sya mayā nivāraṇe | rājā ca māṃ prāhimottvatsakāśaṃ śrutvā vidvañśreya ihācarasva | yudhiṣṭhira uvāca"
  - id: 'sabha-2-83-16'
    kind: verse
    lines:
      - न चाकामः शकुनिना देविताहं न चेन्मां जिष्णुराह्वयिता सभायाम्
      - आहूतोऽहं न निवर्ते कदाचित् तदाहितं शाश्वतं वै व्रतं मे
      - वैशम्पायन उवाच
    iast: "na cākāmaḥ śakuninā devitāhaṃ na cenmāṃ jiṣṇurāhvayitā sabhāyām | āhūto'haṃ na nivarte kadācit tadāhitaṃ śāśvataṃ vai vrataṃ me | vaiśampāyana uvāca"
  - id: 'sabha-2-83-17'
    kind: verse
    lines:
      - एवमुक्त्वा विदुरं धर्मराजः प्रायात्रिकं सर्वमाज्ञाप्य तूर्णम्
      - प्रायाच्छ्वोभूते सगणः सानुयात्रः सह स्त्रीभिर्दौपदामादि कृत्वा
    iast: "evamuktvā viduraṃ dharmarājaḥ prāyātrikaṃ sarvamājñāpya tūrṇam | prāyācchvobhūte sagaṇaḥ sānuyātraḥ saha strībhirdaupadāmādi kṛtvā"
  - id: 'sabha-2-83-47'
    kind: verse
    lines:
      - स हास्तिनपुरं गत्वा धृतराष्ट्रगृहं ययौ
      - समियाय च धर्मात्मा धृतराष्ट्रेण पाण्डवः
    iast: "sa hāstinapuraṃ gatvā dhṛtarāṣṭragṛhaṃ yayau | samiyāya ca dharmātmā dhṛtarāṣṭreṇa pāṇḍavaḥ"
  - id: 'sabha-2-83-51'
    kind: verse
    lines:
      - जयद्रथेन च तथा कुरुभिश्चापि सर्वशः
      - ततः सर्वैर्महाबाहुर्भ्रातृभिः पिरवारितः
    iast: "jayadrathena ca tathā kurubhiścāpi sarvaśaḥ | tataḥ sarvairmahābāhurbhrātṛbhiḥ piravāritaḥ"
  - id: 'sabha-2-83-63'
    kind: verse
    lines:
      - मुखोषितास्ते रजनीं प्रातः सर्वे कृताह्निकाः
      - सभां रम्यां प्रविविशुः कितवैरभिनन्दिताः
    iast: "mukhoṣitāste rajanīṃ prātaḥ sarve kṛtāhnikāḥ | sabhāṃ ramyāṃ praviviśuḥ kitavairabhinanditāḥ"
  - id: 'sabha-2-84-3'
    kind: verse
    lines:
      - तेषु तत्रोपविष्टेषु सर्वेष्वथ नृपेषु च
      - शकुनिः सौबलस्तत्र युधिष्ठिरमभाषत
      - शकुनिरुवाच
    iast: "teṣu tatropaviṣṭeṣu sarveṣvatha nṛpeṣu ca | śakuniḥ saubalastatra yudhiṣṭhiramabhāṣata | śakuniruvāca"
  - id: 'sabha-2-84-4'
    kind: verse
    lines:
      - उपस्तीर्णा सभा राजन्सर्वे त्वयि कृतक्षणाः
      - अक्षानुप्त्वा देवनस्य समयोऽस्तु युधिष्ठिर
      - युधिष्ठिर उवाच
    iast: "upastīrṇā sabhā rājansarve tvayi kṛtakṣaṇāḥ | akṣānuptvā devanasya samayo'stu yudhiṣṭhira | yudhiṣṭhira uvāca"
  - id: 'sabha-2-84-5'
    kind: verse
    lines:
      - नितिर्देवनं पापं न क्षात्रोऽत्र पराक्रमः
      - न च नीतिर्ध्रुवा राजन्किं त्वं द्यूतं प्रशंससि
    iast: "nitirdevanaṃ pāpaṃ na kṣātro'tra parākramaḥ | na ca nītirdhruvā rājankiṃ tvaṃ dyūtaṃ praśaṃsasi"
  - id: 'sabha-2-84-18'
    kind: verse
    lines:
      - आहूतो न निवर्तेयमिति मे व्रतमाहितम्
      - विधिश्च बलवान्राजन्दिष्टस्यास्मि वशे स्थितः
    iast: "āhūto na nivarteyamiti me vratamāhitam | vidhiśca balavānrājandiṣṭasyāsmi vaśe sthitaḥ"
  - id: 'sabha-2-84-18#2'
