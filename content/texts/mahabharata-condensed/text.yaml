    iast: "evamukte tu vacane dharmarājena dhīmatā | dhigdhigityeva vṛddhānāṃ sabhyānāṃ niḥ sṛtā giraḥ"
  - id: 'sabha-2-88-41'
    kind: verse
    lines:
      - चुक्षुभे सा सभा राजन्राज्ञां सञ्जत्रिरे शुचः
