    iast: "anyenānyasya vai dyūtaṃ viṣamaṃ pratibhāti me | etadvidvinnupādatsva kāmamevaṃ pravartatam"
  - id: 'sabha-2-85-11'
    kind: verse
    lines:
      - सन्ति निष्कसहस्रस्य भाण्डिन्यो भरिताः शुभाः कोशो हिरण्यमक्षय्यं जातरूपमनेकशः
      - एतद्राजन्मम धनं तेन दीव्याम्यहं त्वया
      - वैशम्पायन उवाच
    iast: "santi niṣkasahasrasya bhāṇḍinyo bharitāḥ śubhāḥ kośo hiraṇyamakṣayyaṃ jātarūpamanekaśaḥ | etadrājanmama dhanaṃ tena dīvyāmyahaṃ tvayā | vaiśampāyana uvāca"
  - id: 'sabha-2-85-17'
    kind: verse
    lines:
      - शतं दासीसहस्राणि तरुण्यो हेमभद्रिकाः
      - कम्बुकेयूरधारिण्यो निष्ककण्ठ्यः स्वलङ्कृताः
    iast: "śataṃ dāsīsahasrāṇi taruṇyo hemabhadrikāḥ | kambukeyūradhāriṇyo niṣkakaṇṭhyaḥ svalaṅkṛtāḥ"
  - id: 'sabha-2-85-24'
    kind: verse
    lines:
      - सहस्रसङ्ख्या नगा मे मत्तास्तिष्ठन्ति सौबल
      - हेमकक्षाः कृतापीडाः पद्मिनो हेममालिनः
    iast: "sahasrasaṅkhyā nagā me mattāstiṣṭhanti saubala | hemakakṣāḥ kṛtāpīḍāḥ padmino hemamālinaḥ"
  - id: 'sabha-2-88-6'
    kind: verse
    lines:
      - गवाश्वं बहुधेनूकमसङ्ख्येयमजाविकम् यत्किञ्चिदनु पर्णाशां प्राक् सिन्धोरपि सौबल
      - एतन्मम धनं सर्वं तेन दीव्याम्यहं त्वया
      - वैशम्पायन उवाच
    iast: "gavāśvaṃ bahudhenūkamasaṅkhyeyamajāvikam yatkiñcidanu parṇāśāṃ prāk sindhorapi saubala | etanmama dhanaṃ sarvaṃ tena dīvyāmyahaṃ tvayā | vaiśampāyana uvāca"
  - id: 'sabha-2-88-8'
    kind: verse
    lines:
      - पुरं जनपदो भूमिरब्राह्मणधनैः सह अब्राह्मणाश्च पुरुषा राजञ्शिष्टं धनं मम
      - एतद्राजन्मम धनं तेन दीव्याम्यहं त्वया
      - वैशम्पायन उवाच
    iast: "puraṃ janapado bhūmirabrāhmaṇadhanaiḥ saha abrāhmaṇāśca puruṣā rājañśiṣṭaṃ dhanaṃ mama | etadrājanmama dhanaṃ tena dīvyāmyahaṃ tvayā | vaiśampāyana uvāca"
  - id: 'sabha-2-88-9'
    kind: verse
    lines:
      - एतच्छ्रुत्वा व्यवसितो निकृतिं समुपाश्रितः
      - जितमित्येव शकुनिर्युधिष्ठिरमभाषत
      - युधिष्ठिर उवाच
    iast: "etacchrutvā vyavasito nikṛtiṃ samupāśritaḥ | jitamityeva śakuniryudhiṣṭhiramabhāṣata | yudhiṣṭhira uvāca"
  - id: 'sabha-2-88-10'
    kind: verse
    lines:
