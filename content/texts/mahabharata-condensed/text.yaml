    iast: "ahaṃ dātāsmi ratnānāṃ dhanānāṃ ca viśāmpate | madarthe devitā cāyaṃ śakunirmātulo mama | yudhiṣṭhira uvāca"
  - id: 'sabha-2-84-21'
    kind: verse
    lines:
      - अन्येनान्यस्य वै द्यूतं विषमं प्रतिभाति मे
