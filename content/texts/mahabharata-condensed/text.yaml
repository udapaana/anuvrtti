    kind: verse
    lines:
      - एहि क्षत्तर्द्रौपदीमानस्व प्रियां भार्यां संमतां पाण्डवानाम्
      - संमार्जतां वेश्म परैतु शीघ्रं तत्रास्तु दासीभिरपुण्यशीला
      - विदुर उवाच
    iast: "ehi kṣattardraupadīmānasva priyāṃ bhāryāṃ saṃmatāṃ pāṇḍavānām | saṃmārjatāṃ veśma paraitu śīghraṃ tatrāstu dāsībhirapuṇyaśīlā | vidura uvāca"
  - id: 'sabha-2-89-2'
    kind: verse
    lines:
      - दर्विभाषं भाषितं त्वादृशेन न मन्द सम्बुद्ध्यसि
      - प्रपाते त्वं लम्बमानो न वेत्सि व्याघ्रान्मृगः कोपयसेऽतिवेलम्
    iast: "darvibhāṣaṃ bhāṣitaṃ tvādṛśena na manda sambuddhyasi | prapāte tvaṃ lambamāno na vetsi vyāghrānmṛgaḥ kopayase'tivelam"
  - id: 'sabha-2-89-2#2'
    kind: verse
    lines:
      - दर्विभाषं भाषितं त्वादृशेन न मन्द सम्बुद्ध्यसि
      - प्रपाते त्वं लम्बमानो न वेत्सि व्याघ्रान्मृगः कोपयसेऽतिवेलम्
    iast: "darvibhāṣaṃ bhāṣitaṃ tvādṛśena na manda sambuddhyasi | prapāte tvaṃ lambamāno na vetsi vyāghrānmṛgaḥ kopayase'tivelam"
  - id: 'sabha-2-89-4'
    kind: verse
    lines:
      - न हि दासीत्वमापन्ना कृष्णा भवितुमर्हति
      - जनीशेन हि राज्ञैषा पणे न्यस्तेति मे मतिः
    iast: "na hi dāsītvamāpannā kṛṣṇā bhavitumarhati | janīśena hi rājñaiṣā paṇe nyasteti me matiḥ"
  - id: 'sabha-2-89-13'
    kind: verse
    lines:
      - धिगस्तु क्षत्तारमिति ब्रुवाणो दर्पेण मत्तो धृतराष्ट्रस्य पुत्रः
      - अवैक्षत प्रातिकामीं सभायामुवाच चैनं परमार्यमध्ये
      - दुर्योधन उवाच
    iast: "dhigastu kṣattāramiti bruvāṇo darpeṇa matto dhṛtarāṣṭrasya putraḥ | avaikṣata prātikāmīṃ sabhāyāmuvāca cainaṃ paramāryamadhye | duryodhana uvāca"
  - id: 'sabha-2-89-14'
    kind: verse
    lines:
      - त्वं प्रातिकामिन्द्रौपदीमानयस्व न ते भयं विद्यते पाण्डवेभ्यः
      - क्षत्ता ह्ययं विवदत्येव भीतो न चास्माकं वृद्धिकामः सदैव
      - वैशम्पायन उवाच
    iast: "tvaṃ prātikāmindraupadīmānayasva na te bhayaṃ vidyate pāṇḍavebhyaḥ | kṣattā hyayaṃ vivadatyeva bhīto na cāsmākaṃ vṛddhikāmaḥ sadaiva | vaiśampāyana uvāca"
  - id: 'sabha-2-89-15'
    kind: verse
    lines:
      - एवमुक्तः प्रातिकामी स सूतः प्रायाच्छीघ्रं राजवचो निशम्य
      - प्रविश्य च श्वेव हि सिंहगेष्ठं समासदन्महिषीं पाण्डवानाम्
      - प्रातिकाम्युवाच
    iast: "evamuktaḥ prātikāmī sa sūtaḥ prāyācchīghraṃ rājavaco niśamya | praviśya ca śveva hi siṃhageṣṭhaṃ samāsadanmahiṣīṃ pāṇḍavānām | prātikāmyuvāca"
  - id: 'sabha-2-89-16'
    kind: verse
    lines:
      - युधिष्ठिरो द्यूतमदेन मत्तो दुर्योधनो द्रौपदि त्वामजैषीत्
      - सा त्वं प्रपद्यस्व धृतराष्ट्रस्य वेश्म नयामि त्वां कर्मणि याज्ञसेनि
      - द्रौपद्युवाच
    iast: "yudhiṣṭhiro dyūtamadena matto duryodhano draupadi tvāmajaiṣīt | sā tvaṃ prapadyasva dhṛtarāṣṭrasya veśma nayāmi tvāṃ karmaṇi yājñaseni | draupadyuvāca"
  - id: 'sabha-2-89-17'
    kind: verse
    lines:
      - कथं त्वेवं वदसि प्रातिकामिको हि दीव्येद्भार्यया राजपुत्रः
      - मूडो राजा द्यूतमदेन मत्तो ह्यभून्नान्यत्कैतवमस्य किञ्चित्
      - प्रातिकाम्युवाच
    iast: "kathaṃ tvevaṃ vadasi prātikāmiko hi dīvyedbhāryayā rājaputraḥ | mūḍo rājā dyūtamadena matto hyabhūnnānyatkaitavamasya kiñcit | prātikāmyuvāca"
  - id: 'sabha-2-89-18'
    kind: verse
    lines:
      - यदा नाभूत्कैतवमन्यदस्य तदाऽदेवीत्पाण्डवोऽजातशत्रुः
      - न्यस्ताः पूर्वं भ्रातरस्तेन राज्ञा स्वयं चात्मा त्वमथो राजपुत्रि
      - द्रौपद्युवाच
    iast: "yadā nābhūtkaitavamanyadasya tadā'devītpāṇḍavo'jātaśatruḥ | nyastāḥ pūrvaṃ bhrātarastena rājñā svayaṃ cātmā tvamatho rājaputri | draupadyuvāca"
  - id: 'sabha-2-89-19'
    kind: verse
    lines:
      - गच्छ त्वं कितवं गत्वा सभायां पृच्छ सूतज
      - किं तु पूर्वं पराजैषीरात्मानमथवा नु माम्
    iast: "gaccha tvaṃ kitavaṃ gatvā sabhāyāṃ pṛccha sūtaja | kiṃ tu pūrvaṃ parājaiṣīrātmānamathavā nu mām"
  - id: 'sabha-2-89-21'
    kind: verse
    lines:
      - सभां गत्वा स चोवाच द्रौपद्यस्तद्वचस्तदा
      - युधिष्ठिरं नरेनद्राणां मध्ये स्थितमिदं वचः
    iast: "sabhāṃ gatvā sa covāca draupadyastadvacastadā | yudhiṣṭhiraṃ narenadrāṇāṃ madhye sthitamidaṃ vacaḥ"
  - id: 'sabha-2-89-23'
    kind: verse
    lines:
      - युधिष्ठिरस्तु निश्चेता गतसत्व इवाभवत्
      - न तं सूतं प्रत्युवाच वचनं साध्वसाधु वा
      - दुर्योधन उवाच
    iast: "yudhiṣṭhirastu niścetā gatasatva ivābhavat | na taṃ sūtaṃ pratyuvāca vacanaṃ sādhvasādhu vā | duryodhana uvāca"
  - id: 'sabha-2-89-24'
    kind: verse
    lines:
      - इहैवागत्य पाञ्चाली प्रश्नमेनं प्रभाषताम्
      - इहैव सर्वे शृण्वन्तु तस्याश्चैतस्य यद्वचः
      - वैशम्पायन उवाच
    iast: "ihaivāgatya pāñcālī praśnamenaṃ prabhāṣatām | ihaiva sarve śṛṇvantu tasyāścaitasya yadvacaḥ | vaiśampāyana uvāca"
  - id: 'sabha-2-89-37'
    kind: verse
    lines:
      - दुःशासनैष मम सूतपुत्रो वृकोदरादुद्विजतेऽल्पचेताः
      - स्वयं प्रगृह्यानय याज्ञसेनीं किं ते करिष्यन्त्यवशाः सपत्नाः
      - वैशम्पायन उवाच
    iast: "duḥśāsanaiṣa mama sūtaputro vṛkodarādudvijate'lpacetāḥ | svayaṃ pragṛhyānaya yājñasenīṃ kiṃ te kariṣyantyavaśāḥ sapatnāḥ | vaiśampāyana uvāca"
  - id: 'sabha-2-89-38'
    kind: verse
    lines:
      - ततः समुत्थाय स राजपुत्रः श्रुत्वा भ्रातुः शासनं रक्तदृष्टिः
      - प्रविश्य तद्वेश्म महारथानामित्यब्रवीद्द्रौपदीं राजपुत्रीम्
    iast: "tataḥ samutthāya sa rājaputraḥ śrutvā bhrātuḥ śāsanaṃ raktadṛṣṭiḥ | praviśya tadveśma mahārathānāmityabravīddraupadīṃ rājaputrīm"
  - id: 'sabha-2-89-39'
    kind: verse
    lines:
      - एह्येहि पाञ्चालि राजपुत्रीम् दुर्योधनं पश्य विमुक्तलज्जा
      - कुरून्भजस्वायतपत्रनेत्रे धर्मेण लब्धाऽसि सभां परैहि
    iast: "ehyehi pāñcāli rājaputrīm duryodhanaṃ paśya vimuktalajjā | kurūnbhajasvāyatapatranetre dharmeṇa labdhā'si sabhāṃ paraihi"
  - id: 'sabha-2-89-40'
    kind: verse
    lines:
      - ततः समुत्थाय सुदूर्मनाः सा विवर्णमामृज्य मुखं करेण
      - आर्ता प्रदुद्राव यतः स्त्रियस्ता वृद्धस्य राज्ञः कुरुपुङ्गवस्य
    iast: "tataḥ samutthāya sudūrmanāḥ sā vivarṇamāmṛjya mukhaṃ kareṇa | ārtā pradudrāva yataḥ striyastā vṛddhasya rājñaḥ kurupuṅgavasya"
  - id: 'sabha-2-89-41'
    kind: verse
    lines:
      - ततो जवेनाभिससार रोषाद्दुःशासनस्तामभिगर्जमानः
      - दीर्घेषु नीलेष्वथ चोर्मिमत्सु जग्राह केशेषु नरेन्द्रपत्नीम्
    iast: "tato javenābhisasāra roṣādduḥśāsanastāmabhigarjamānaḥ | dīrgheṣu nīleṣvatha cormimatsu jagrāha keśeṣu narendrapatnīm"
  - id: 'sabha-2-89-44'
    kind: verse
    lines:
      - सा कृष्णमाणा नमिताङ्गयष्टिः शनैरुवाचाथ रजस्वलाऽस्मि
      - एकं च वासो मम मन्दबुद्धे सभां नेतुं नार्हसि मामनार्य
    iast: "sā kṛṣṇamāṇā namitāṅgayaṣṭiḥ śanairuvācātha rajasvalā'smi | ekaṃ ca vāso mama mandabuddhe sabhāṃ netuṃ nārhasi māmanārya"
  - id: 'sabha-2-89-45'
    kind: verse
    lines:
      - ततोऽब्रवीत्तां प्रसभं निगृह्य केशेशु कृष्णेषु तदा स कृष्णाम्
      - कृष्णं च जिष्णुं च हरिं नरं च त्रायाय विक्रोशति याज्ञसेनि
    iast: "tato'bravīttāṃ prasabhaṃ nigṛhya keśeśu kṛṣṇeṣu tadā sa kṛṣṇām | kṛṣṇaṃ ca jiṣṇuṃ ca hariṃ naraṃ ca trāyāya vikrośati yājñaseni"
  - id: 'sabha-2-89-46'
    kind: verse
    lines:
      - रजस्वला वा भव याज्ञसेनि एकाम्बरा वाप्यथवा विवस्त्रा
      - द्यूते जिता चासि कृताऽसि दासी दासीषु वासश्च यथोपजोषम्
      - वैशम्पायन उवाच
    iast: "rajasvalā vā bhava yājñaseni ekāmbarā vāpyathavā vivastrā | dyūte jitā cāsi kṛtā'si dāsī dāsīṣu vāsaśca yathopajoṣam | vaiśampāyana uvāca"
  - id: 'sabha-2-89-47'
    kind: verse
    lines:
      - प्रकीर्णकेशी पतितार्धवस्त्रा दुःशासनेन व्यवधूयमाना
      - हीमत्यमर्षेण च दह्यमाना शनैरिदं वाक्यमुवाच कृष्णा
      - द्रौपद्युवाच
    iast: "prakīrṇakeśī patitārdhavastrā duḥśāsanena vyavadhūyamānā | hīmatyamarṣeṇa ca dahyamānā śanairidaṃ vākyamuvāca kṛṣṇā | draupadyuvāca"
  - id: 'sabha-2-89-51'
    kind: verse
    lines:
      - इदं त्वकार्यं कुरुवीरमध्ये रजस्वलां यत्परिकर्षसे माम्
      - न चापि कश्चित्कुरुतेऽत्र कुत्सां ध्रुवं तवेदं मतमभ्युपेतः
    iast: "idaṃ tvakāryaṃ kuruvīramadhye rajasvalāṃ yatparikarṣase mām | na cāpi kaścitkurute'tra kutsāṃ dhruvaṃ tavedaṃ matamabhyupetaḥ"
  - id: 'sabha-2-89-53'
    kind: verse
    lines:
      - द्रोणस्य भीष्मस्य च नास्ति सत्त्वं क्षत्तुस्तथैवास्य चनास्ति सत्त्वं
      - क्षत्तुस्तथैवास्य महात्मनोपि न लक्षयन्ति कुरुवृद्धमुख्याः
      - वैशम्पायन उवाच
    iast: "droṇasya bhīṣmasya ca nāsti sattvaṃ kṣattustathaivāsya canāsti sattvaṃ | kṣattustathaivāsya mahātmanopi na lakṣayanti kuruvṛddhamukhyāḥ | vaiśampāyana uvāca"
  - id: 'sabha-2-89-56'
    kind: verse
    lines:
      - दुःशासनश्चापि समीक्ष्य कृष्णामवेक्षमाणां कृपणान्पतींस्तान्
      - आधूय वेगेन विसञ्ज्ञकल्पामुवाच दासीति हसन्सशब्दम्
    iast: "duḥśāsanaścāpi samīkṣya kṛṣṇāmavekṣamāṇāṃ kṛpaṇānpatīṃstān | ādhūya vegena visañjñakalpāmuvāca dāsīti hasansaśabdam"
  - id: 'sabha-2-89-57'
    kind: verse
    lines:
      - कर्णस्तु तद्वाक्यमतीव हृष्टः सम्पूजयामास हसन्सशब्दम्
      - गान्धारराजः सुबलस्य पुत्रस्तथैव दुःशासनमभ्यनन्दत्
    iast: "karṇastu tadvākyamatīva hṛṣṭaḥ sampūjayāmāsa hasansaśabdam | gāndhārarājaḥ subalasya putrastathaiva duḥśāsanamabhyanandat"
  - id: 'sabha-2-89-59'
    kind: verse
    lines:
      - न धर्मसौक्ष्म्यात्सुभगे विवेक्तुं शक्रोमि ते प्रश्नमिमं यथावत्
      - अस्वाम्यशक्तः पणितुं परस्वं स्त्रियाश्च भर्तुर्वशतां समीक्ष्य
    iast: "na dharmasaukṣmyātsubhage vivektuṃ śakromi te praśnamimaṃ yathāvat | asvāmyaśaktaḥ paṇituṃ parasvaṃ striyāśca bharturvaśatāṃ samīkṣya"
  - id: 'sabha-2-89-60'
    kind: verse
    lines:
      - त्यजेत सर्वां पृथिवीं समृद्धां युधिष्ठिरो धर्ममथो न जह्यात्
      - उक्तं जितोऽस्मीति च पाण्डवेन तस्मान्न शक्नोमि विवेक्तुमेतत्
    iast: "tyajeta sarvāṃ pṛthivīṃ samṛddhāṃ yudhiṣṭhiro dharmamatho na jahyāt | uktaṃ jito'smīti ca pāṇḍavena tasmānna śaknomi vivektumetat"
  - id: 'sabha-2-90-19'
    kind: verse
    lines:
      - विब्रूत पृथिवीपाला वाक्यं मा वा कथञ्चनि
      - मन्ये न्याय्यं यदत्राहं तद्वि वक्ष्यामि कौरवाः
    iast: "vibrūta pṛthivīpālā vākyaṃ mā vā kathañcani | manye nyāyyaṃ yadatrāhaṃ tadvi vakṣyāmi kauravāḥ"
  - id: 'sabha-2-90-23'
    kind: verse
    lines:
      - साधारणी च सर्वेषां पाण्डवानामनिन्दिता
      - जितेन पूर्वं चानेन पाण्डवेन कृतः पणः
    iast: "sādhāraṇī ca sarveṣāṃ pāṇḍavānāmaninditā | jitena pūrvaṃ cānena pāṇḍavena kṛtaḥ paṇaḥ"
  - id: 'sabha-2-90-24'
    kind: verse
    lines:
      - इयं च कीर्तिता कृष्णा सौबलेन पणार्थिना
      - एतत्सर्वं विचार्याहं मन्ये न विजितामिमाम्
      - वैशम्पायन उवाच
    iast: "iyaṃ ca kīrtitā kṛṣṇā saubalena paṇārthinā | etatsarvaṃ vicāryāhaṃ manye na vijitāmimām | vaiśampāyana uvāca"
  - id: 'sabha-2-90-25'
    kind: verse
    lines:
      - एतच्छ्रुत्वा महान्नादः सभ्यानामुदतिष्ठत
      - विकर्णं शंसमानानां सौबलं चापि निन्दताम्
    iast: "etacchrutvā mahānnādaḥ sabhyānāmudatiṣṭhata | vikarṇaṃ śaṃsamānānāṃ saubalaṃ cāpi nindatām"
  - id: 'sabha-2-90-26'
    kind: verse
    lines:
      - तस्मिन्नुपरते शब्दे राधेयः क्रोधमूर्छितः
      - प्रगृह्य रुचिरं बाहुमिदं वचनमब्रवीत्
      - कर्ण उवाच
    iast: "tasminnuparate śabde rādheyaḥ krodhamūrchitaḥ | pragṛhya ruciraṃ bāhumidaṃ vacanamabravīt | karṇa uvāca"
  - id: 'sabha-2-90-33'
    kind: verse
    lines:
      - कीर्तिता द्रौपदी वाचा अनुज्ञाता च पाण्डवैः
      - भवत्यविजिता केन हेतुनैषा मता तव
    iast: "kīrtitā draupadī vācā anujñātā ca pāṇḍavaiḥ | bhavatyavijitā kena hetunaiṣā matā tava"
  - id: 'sabha-2-90-34'
    kind: verse
    lines:
      - मन्यसे वा सभामेतामानीतामेकवाससम्
      - अधर्मेणेति तत्रापि शृणु मे वाक्यमुत्तमम्
    iast: "manyase vā sabhāmetāmānītāmekavāsasam | adharmeṇeti tatrāpi śṛṇu me vākyamuttamam"
  - id: 'sabha-2-90-35'
    kind: verse
    lines:
      - एको भर्ता स्त्रिया देवैर्विहितः कुरुनन्दन
      - इयं त्वनेकवशगा बन्धकीति विनिश्चिता
    iast: "eko bhartā striyā devairvihitaḥ kurunandana | iyaṃ tvanekavaśagā bandhakīti viniścitā"
  - id: 'sabha-2-90-36'
    kind: verse
    lines:
      - अस्याः सभामानयनं न चित्रमिति मे मतिः
      - एकाम्बरधरत्वं वाऽप्यथवाऽपि विवस्त्रता
    iast: "asyāḥ sabhāmānayanaṃ na citramiti me matiḥ | ekāmbaradharatvaṃ vā'pyathavā'pi vivastratā"
  - id: 'sabha-2-90-38'
    kind: verse
    lines:
      - दुःशासन सुबालोऽयं विकर्णः प्राज्ञवादिकः
      - पाण्डवानां च वासांसि द्रौपद्याश्चाप्युपाहर
      - वैशम्पायन उवाच
    iast: "duḥśāsana subālo'yaṃ vikarṇaḥ prājñavādikaḥ | pāṇḍavānāṃ ca vāsāṃsi draupadyāścāpyupāhara | vaiśampāyana uvāca"
  - id: 'sabha-2-90-39'
    kind: verse
    lines:
      - तच्छ्रुत्वा पाण्डवाः सर्वे स्वानि वासांसि भारत
      - अवकीर्योत्तरीयाणि सभायां समुपाविशन्
    iast: "tacchrutvā pāṇḍavāḥ sarve svāni vāsāṃsi bhārata | avakīryottarīyāṇi sabhāyāṃ samupāviśan"
  - id: 'sabha-2-90-40'
    kind: verse
    lines:
      - ततो दुःशासनो राजन्द्रौपद्या वसनं बलात्
      - सभामध्ये सभाक्षिप्य व्यपाक्रष्टुं प्रचक्रमे
    iast: "tato duḥśāsano rājandraupadyā vasanaṃ balāt | sabhāmadhye sabhākṣipya vyapākraṣṭuṃ pracakrame"
  - id: 'sabha-2-90-42'
    kind: verse
    lines:
      - महत्यापदि सम्प्राप्ते स्मर्तव्यो भगवान्हरिः इति निश्चित्य मनसा शरणागतवत्सलम्
      - आकृष्यमाणे वसने द्रौपदी कृष्णमस्तरत्
    iast: "mahatyāpadi samprāpte smartavyo bhagavānhariḥ iti niścitya manasā śaraṇāgatavatsalam | ākṛṣyamāṇe vasane draupadī kṛṣṇamastarat"
  - id: 'sabha-2-90-43'
    kind: verse
    lines:
      - शङ्खचक्रगदापाणे द्वारकानिलयाच्युत
      - गोविन्द पुण्डरीकाक्ष रक्ष मां शरणागताम्
    iast: "śaṅkhacakragadāpāṇe dvārakānilayācyuta | govinda puṇḍarīkākṣa rakṣa māṃ śaraṇāgatām"
  - id: 'sabha-2-90-44'
    kind: verse
    lines:
      - हा कृष्ण द्वारकावासिन्क्वासि यादवन्दन
      - इमामवस्थां सम्प्राप्तामनाथां किमुपेक्षसे
    iast: "hā kṛṣṇa dvārakāvāsinkvāsi yādavandana | imāmavasthāṃ samprāptāmanāthāṃ kimupekṣase"
  - id: 'sabha-2-90-47'
    kind: verse
    lines:
      - कृष्णकृष्ण महायोगिन्विश्वात्मन्विश्व्भावन
      - प्रपन्नां पाहि गोविन्द कुरमध्येऽवसीदतीम्
    iast: "kṛṣṇakṛṣṇa mahāyoginviśvātmanviśvbhāvana | prapannāṃ pāhi govinda kuramadhye'vasīdatīm"
  - id: 'sabha-2-90-48'
    kind: verse
    lines:
      - इत्यनुस्मृत्य कृष्णं सा हरिं त्रिभुवनेश्वरम्
      - प्रारुदद्दुः खिता राजन्मुखमाच्छाद्य भामिनी
    iast: "ityanusmṛtya kṛṣṇaṃ sā hariṃ tribhuvaneśvaram | prārudadduḥ khitā rājanmukhamācchādya bhāminī"
  - id: 'sabha-2-90-49'
    kind: verse
    lines:
      - तस्य प्रसाद्द्रौपद्याः कृष्णमाणेऽम्बरे तदा
      - तद्रूपमपरे वस्त्रं प्रादुरासीदनेकशः
    iast: "tasya prasāddraupadyāḥ kṛṣṇamāṇe'mbare tadā | tadrūpamapare vastraṃ prādurāsīdanekaśaḥ"
  - id: 'sabha-2-90-51'
    kind: verse
    lines:
      - ततो हलहलाशब्दस्तत्रासीद्घोरदर्शनः
      - तदद्भुततमं लोके वीक्ष्य सर्वे महीभृतः
    iast: "tato halahalāśabdastatrāsīdghoradarśanaḥ | tadadbhutatamaṃ loke vīkṣya sarve mahībhṛtaḥ"
  - id: 'sabha-2-90-52'
    kind: verse
    lines:
      - शशंसुर्द्रौपदीं तत्र कुत्सन्तो धृतराष्ट्रजम्
      - धिग्धिगित्यशिवां वाचमुत्सृजन्कौरवान्प्रति
    iast: "śaśaṃsurdraupadīṃ tatra kutsanto dhṛtarāṣṭrajam | dhigdhigityaśivāṃ vācamutsṛjankauravānprati"
  - id: 'sabha-2-90-53'
    kind: verse
    lines:
      - यदा तु वाससां राशिः सभामध्ये समाचितः तदा दुःशासनः श्रान्तो व्रीडितः समुपाविशत्
    iast: "yadā tu vāsasāṃ rāśiḥ sabhāmadhye samācitaḥ tadā duḥśāsanaḥ śrānto vrīḍitaḥ samupāviśat"
  - id: 'sabha-2-90-91'
    kind: verse
    lines:
      - विदुरस्य वचः श्रुत्वा नोचुः किञ्चन पार्थिवाः
      - कर्णो दुःशासनं त्वाह कृष्णं दासीं गृहान्नय
    iast: "vidurasya vacaḥ śrutvā nocuḥ kiñcana pārthivāḥ | karṇo duḥśāsanaṃ tvāha kṛṣṇaṃ dāsīṃ gṛhānnaya"
  - id: 'sabha-2-90-92'
    kind: verse
    lines:
      - तां वेपमानां सव्रीडां प्रलपन्तीं स्म पाण्डवान्
      - दुःशासनः सभामध्ये विचकर्ष तपस्विनीम्
    iast: "tāṃ vepamānāṃ savrīḍāṃ pralapantīṃ sma pāṇḍavān | duḥśāsanaḥ sabhāmadhye vicakarṣa tapasvinīm"
  - id: 'sabha-2-92-44'
    kind: verse
    lines:
      - परित्रायस्व मां भीष्ण द्रोण द्रौणे तथा कृप
      - परित्रायस्व विदुर धर्मिष्ठो धर्मवत्सल
    iast: "paritrāyasva māṃ bhīṣṇa droṇa drauṇe tathā kṛpa | paritrāyasva vidura dharmiṣṭho dharmavatsala"
  - id: 'sabha-2-92-45'
    kind: verse
    lines:
      - धृतराष्ट्र महाराज परित्रायस्व वै स्नुषाम् गान्धारि त्वं महाभागे सर्वज्ञे सर्वदर्शिनि
      - पिरत्रायस्व मां भीरुं सुयोधनभयार्दिताम्
    iast: "dhṛtarāṣṭra mahārāja paritrāyasva vai snuṣām gāndhāri tvaṃ mahābhāge sarvajñe sarvadarśini | piratrāyasva māṃ bhīruṃ suyodhanabhayārditām"
  - id: 'sabha-2-92-46'
    kind: verse
    lines:
      - त्वमार्ये वीरजननि किं मां पश्यसि यादवीम्
      - क्लिश्यमानामनार्येण न त्रायसिव वधूं स्वकाम्
    iast: "tvamārye vīrajanani kiṃ māṃ paśyasi yādavīm | kliśyamānāmanāryeṇa na trāyasiva vadhūṃ svakām"
  - id: 'sabha-2-92-47'
    kind: verse
    lines:
      - यदि लालप्यमानां मां न कश्चित्किञ्चिदब्रवीत्
      - हा हताऽस्मि सुमन्दात्मा सुयोधनवशं गता
    iast: "yadi lālapyamānāṃ māṃ na kaścitkiñcidabravīt | hā hatā'smi sumandātmā suyodhanavaśaṃ gatā"
  - id: 'sabha-2-92-54'
    kind: verse
    lines:
      - यद्येवं त्वं महाराज सङ्क्लेशयसि द्रौपदीम् अचिरेणैव कालेन पुत्रस्ते सह मन्त्रिभिः
      - गमिष्यति क्षयं पापः पाण्डवक्षयकारणात्
    iast: "yadyevaṃ tvaṃ mahārāja saṅkleśayasi draupadīm acireṇaiva kālena putraste saha mantribhiḥ | gamiṣyati kṣayaṃ pāpaḥ pāṇḍavakṣayakāraṇāt"
  - id: 'sabha-2-92-55'
    kind: verse
    lines:
      - भीमार्जुनाभ्यां क्रुद्धाभ्यां माद्रीपुत्रद्वयेन च
      - तस्मान्निवारय सुतं मा विनाशं विचिन्तय
      - वैशम्पायन उवाच
    iast: "bhīmārjunābhyāṃ kruddhābhyāṃ mādrīputradvayena ca | tasmānnivāraya sutaṃ mā vināśaṃ vicintaya | vaiśampāyana uvāca"
  - id: 'sabha-2-92-56'
    kind: verse
    lines:
      - एतच्छुत्वा मन्दबुद्धिर्नोत्तरं किञ्चिदब्रवीत्
      - ततो दुर्योधनस्तत्र दैवमोहबलात्कृतः
    iast: "etacchutvā mandabuddhirnottaraṃ kiñcidabravīt | tato duryodhanastatra daivamohabalātkṛtaḥ"
  - id: 'sabha-2-92-57'
    kind: verse
    lines:
      - अचिन्त्य क्षत्तुर्वचनं हर्षेणायतलोचनः
      - ऊरू दर्शयते पापो द्रौपद्या वै मुहुर्मुहुः
    iast: "acintya kṣatturvacanaṃ harṣeṇāyatalocanaḥ | ūrū darśayate pāpo draupadyā vai muhurmuhuḥ"
  - id: 'sabha-2-92-79'
    kind: verse
    lines:
      - यस्माच्चोरुं दर्शयसे यस्माच्चोरुं निरीक्षसे
      - तस्मात्तव ह्यधर्मिष्ठ ऊरौ मृत्युर्भविष्यति
    iast: "yasmāccoruṃ darśayase yasmāccoruṃ nirīkṣase | tasmāttava hyadharmiṣṭha ūrau mṛtyurbhaviṣyati"
  - id: 'sabha-2-92-80'
    kind: verse
    lines:
      - यस्माच्चैवं क्लेशयति भ्राता ते मां दुरात्मवान्
      - तस्मादुधिरमेवास्य पास्यते वै वृकोदरः
    iast: "yasmāccaivaṃ kleśayati bhrātā te māṃ durātmavān | tasmādudhiramevāsya pāsyate vai vṛkodaraḥ"
  - id: 'sabha-2-92-81'
    kind: verse
    lines:
      - इमं च पापिष्ठमतिं कर्णं समुतबान्धवम्
      - सामात्यं सपरीवारं हनिष्यति धनञ्जयः
    iast: "imaṃ ca pāpiṣṭhamatiṃ karṇaṃ samutabāndhavam | sāmātyaṃ saparīvāraṃ haniṣyati dhanañjayaḥ"
  - id: 'sabha-2-92-82'
    kind: verse
    lines:
      - क्षुद्रधर्मं नैकृतिकं शकुनिं पापचेतसम्
      - सहदेवो रणे क्रुद्धो हनिष्यति सबान्धवम्
      - वैशम्पायन उवाच
    iast: "kṣudradharmaṃ naikṛtikaṃ śakuniṃ pāpacetasam | sahadevo raṇe kruddho haniṣyati sabāndhavam | vaiśampāyana uvāca"
  - id: 'sabha-2-92-83'
    kind: verse
    lines:
      - एवमुक्ते तु वचने द्रौपद्या धर्मशीलया
      - ततोऽन्तरिक्षात्सुमहत्पुष्पवर्षमवापततम्
    iast: "evamukte tu vacane draupadyā dharmaśīlayā | tato'ntarikṣātsumahatpuṣpavarṣamavāpatatam"
  - id: 'sabha-2-93-1'
    kind: verse
    lines:
      - द्रौपद्या वचनं श्रुत्वा चुकोपाथ धनञ्जयः
      - स तदा क्रोधताम्राक्ष इदं वचनमब्रवीत्
    iast: "draupadyā vacanaṃ śrutvā cukopātha dhanañjayaḥ | sa tadā krodhatāmrākṣa idaṃ vacanamabravīt"
  - id: 'sabha-2-93-3'
    kind: verse
    lines:
      - सव्यसाची समुत्पत्य ताञ्छत्रून्समुदैक्षत
      - उद्यतं फल्गुनं तत्र ददृशुः सर्वपार्थिवाः
    iast: "savyasācī samutpatya tāñchatrūnsamudaikṣata | udyataṃ phalgunaṃ tatra dadṛśuḥ sarvapārthivāḥ"
  - id: 'sabha-2-93-14'
    kind: verse
    lines:
      - उत्पतन्तं तु वेगेन ततो दृष्ट्वा धनञ्जयम्
      - जग्राह स तदा राजा पुरुहूतो यथा हरिम्
    iast: "utpatantaṃ tu vegena tato dṛṣṭvā dhanañjayam | jagrāha sa tadā rājā puruhūto yathā harim"
  - id: 'sabha-2-93-15'
    kind: verse
    lines:
      - उवाच स घृणी ज्येष्ठो धर्मराजो युधिष्ठिरः
      - मा पार्थ साहसं कार्षीर्मा विनाशं गमेद्यशः
    iast: "uvāca sa ghṛṇī jyeṣṭho dharmarājo yudhiṣṭhiraḥ | mā pārtha sāhasaṃ kārṣīrmā vināśaṃ gamedyaśaḥ"
  - id: 'sabha-2-93-16'
    kind: verse
    lines:
      - अहमेतान्पापकृतो द्यूतज्ञान्दग्धुमुत्सहे
      - कन्त्त्वसत्यगतिं दृष्ट्वा क्रोधो नाशमुपैति मे
    iast: "ahametānpāpakṛto dyūtajñāndagdhumutsahe | kanttvasatyagatiṃ dṛṣṭvā krodho nāśamupaiti me"
  - id: 'sabha-2-93-17'
    kind: verse
    lines:
      - त्वमिमं जगतोऽर्थे वै कोपं संयच्छ पाण्डव
      - वैशम्पायन उवाच
    iast: "tvamimaṃ jagato'rthe vai kopaṃ saṃyaccha pāṇḍava | vaiśampāyana uvāca"
  - id: 'sabha-2-93-21'
    kind: verse
    lines:
      - ततो राज्ञो धृतराष्ट्रस्य गेहे गोमायुरुच्चैर्व्याहरदग्निहोत्रे
      - तं रासभाः प्रत्यभाषन्त राजन्समन्ततः पक्षिणश्चैव रौद्राः
    iast: "tato rājño dhṛtarāṣṭrasya gehe gomāyuruccairvyāharadagnihotre | taṃ rāsabhāḥ pratyabhāṣanta rājansamantataḥ pakṣiṇaścaiva raudrāḥ"
  - id: 'sabha-2-93-22'
    kind: verse
    lines:
      - तं वै शब्दं विदुरस्तत्त्ववेदी शुश्राव घोरं सुबलात्मजा च
      - भीष्मो द्रोणो गौतमश्चापि विद्वान् स्वस्तिस्वस्तीत्यपि चैवाहुरुच्चैः
    iast: "taṃ vai śabdaṃ vidurastattvavedī śuśrāva ghoraṃ subalātmajā ca | bhīṣmo droṇo gautamaścāpi vidvān svastisvastītyapi caivāhuruccaiḥ"
  - id: 'sabha-2-93-23'
    kind: verse
    lines:
      - ततो गान्धारी विदुरश्चापि विद्वांस्तमुत्पातं घोरमालक्ष्य राज्ञे
      - निवेदयामासतुरार्तवत्तदा ततो राजा वाक्यमिदं बभाषे
      - धृतराष्ट्र उवाच
    iast: "tato gāndhārī viduraścāpi vidvāṃstamutpātaṃ ghoramālakṣya rājñe | nivedayāmāsaturārtavattadā tato rājā vākyamidaṃ babhāṣe | dhṛtarāṣṭra uvāca"
  - id: 'sabha-2-93-24'
    kind: verse
    lines:
      - हतोऽसि दुर्योधन मन्दबुद्धे यस्त्वं सभायां कुरुपुङ्गवानाम्
      - स्त्रियं समाभाषसि दुर्विनीत विशेषतो द्रौपदीं धर्मपत्नीम्
    iast: "hato'si duryodhana mandabuddhe yastvaṃ sabhāyāṃ kurupuṅgavānām | striyaṃ samābhāṣasi durvinīta viśeṣato draupadīṃ dharmapatnīm"
  - id: 'sabha-2-93-25'
    kind: verse
    lines:
      - वैशम्पायन उवाच
      - एवमुक्त्वा धृतराष्ट्रो मनीषी हितान्वेषी बान्धवानामपायात्
      - कृष्णां पाञ्चालीमब्रवीत्सान्त्वपूर्वं विमृश्यैतत्प्रज्ञया तत्त्वबुद्धिः
    iast: "vaiśampāyana uvāca | evamuktvā dhṛtarāṣṭro manīṣī hitānveṣī bāndhavānāmapāyāt | kṛṣṇāṃ pāñcālīmabravītsāntvapūrvaṃ vimṛśyaitatprajñayā tattvabuddhiḥ"
  - id: 'sabha-2-93-26'
    kind: verse
    lines:
      - धृतराष्ट उवाच
      - वरं वृणीष्व पाञ्चालि मत्तो यदभिवाञ्छसि
      - वधूनां हि विशिष्टा मे त्वं धर्मपरमा सती
    iast: "dhṛtarāṣṭa uvāca | varaṃ vṛṇīṣva pāñcāli matto yadabhivāñchasi | vadhūnāṃ hi viśiṣṭā me tvaṃ dharmaparamā satī"
  - id: 'sabha-2-93-27'
    kind: verse
    lines:
      - द्रौपद्युवाच
      - ददासि चेद्वरं मह्यंवृणोमि भरतर्षभ
      - सर्वधर्मानुगः श्रीमानदासोऽस्तु युधिष्ठिरः
    iast: "draupadyuvāca | dadāsi cedvaraṃ mahyaṃvṛṇomi bharatarṣabha | sarvadharmānugaḥ śrīmānadāso'stu yudhiṣṭhiraḥ"
  - id: 'sabha-2-93-30'
    kind: verse
    lines:
      - एवं भवतु कल्याणि यथा त्वमभिभाषसे द्वितीयं ते वरं भद्रे ददानि वरयस्व ह
      - मनो हि मे वितरति नैकं त्वं वरमर्हसि
      - द्रौपद्युवाच
    iast: "evaṃ bhavatu kalyāṇi yathā tvamabhibhāṣase dvitīyaṃ te varaṃ bhadre dadāni varayasva ha | mano hi me vitarati naikaṃ tvaṃ varamarhasi | draupadyuvāca"
  - id: 'sabha-2-93-31'
    kind: verse
    lines:
      - सरथौ सघनुष्कौ न भीमसेनधनञ्जयौ
      - यमौ च वरये राजन्नदासान्स्ववशानहम्
    iast: "sarathau saghanuṣkau na bhīmasenadhanañjayau | yamau ca varaye rājannadāsānsvavaśānaham"
  - id: 'sabha-2-93-32'
    kind: verse
    lines:
      - धृतराष्ट्र उवाच
      - तथाऽस्तु ते महाभागे यथा त्वं नन्दिनीच्छसि
      - तृतीयं वरयास्मत्तो नासि द्वाभ्यां सुसंस्कृता
      - त्वं हि सर्वस्नुषाणां मे श्रेयसी धर्मचारिणी
    iast: "dhṛtarāṣṭra uvāca | tathā'stu te mahābhāge yathā tvaṃ nandinīcchasi | tṛtīyaṃ varayāsmatto nāsi dvābhyāṃ susaṃskṛtā | tvaṃ hi sarvasnuṣāṇāṃ me śreyasī dharmacāriṇī"
  - id: 'sabha-2-93-33'
    kind: verse
    lines:
      - द्रौपद्युवाच
      - लोभो धर्मस्य नाशाय भगवन्नाहमुत्सहे
      - अनर्हा वरमादातुं तृतीयं राजसत्तम
    iast: "draupadyuvāca | lobho dharmasya nāśāya bhagavannāhamutsahe | anarhā varamādātuṃ tṛtīyaṃ rājasattama"
  - id: 'sabha-2-93-35'
    kind: verse
    lines:
      - पापीयांस इमे भूत्वा सन्तीर्णाः पतयो मम
      - वेत्स्यन्ति चैव भद्राणि राजन्पुण्येन कर्मणा
    iast: "pāpīyāṃsa ime bhūtvā santīrṇāḥ patayo mama | vetsyanti caiva bhadrāṇi rājanpuṇyena karmaṇā"
  - id: 'sabha-2-95-2'
    kind: verse
    lines:
      - अजातशत्रो भद्रं ते अरिष्टं स्वस्ति गच्छत
      - अनुज्ञाताः सहधनाः स्वराज्यमनुशासत
    iast: "ajātaśatro bhadraṃ te ariṣṭaṃ svasti gacchata | anujñātāḥ sahadhanāḥ svarājyamanuśāsata"
  - id: 'sabha-2-95-10'
    kind: verse
    lines:
      - स्मरन्ति सुकृतान्येव न वैराणि कृतान्यपि
      - सन्तः प्रतिविजानन्तो लब्ध्वा प्रत्ययमात्मनः
    iast: "smaranti sukṛtānyeva na vairāṇi kṛtānyapi | santaḥ prativijānanto labdhvā pratyayamātmanaḥ"
  - id: 'sabha-2-95-11'
    kind: verse
    lines:
      - असम्भिन्नार्यमर्यादाः साधवः प्रियदर्शनाः
      - तथा चरित्तंमार्येण त्वयाऽस्मिन्सत्समागमे
    iast: "asambhinnāryamaryādāḥ sādhavaḥ priyadarśanāḥ | tathā carittaṃmāryeṇa tvayā'sminsatsamāgame"
  - id: 'sabha-2-95-12'
    kind: verse
    lines:
      - दुर्योधनस्य पारुष्यं तत्तात हृदि मा कृथाः
      - मातरं चैव गान्धारीं मां च त्वं गुणकाङ्क्षया
    iast: "duryodhanasya pāruṣyaṃ tattāta hṛdi mā kṛthāḥ | mātaraṃ caiva gāndhārīṃ māṃ ca tvaṃ guṇakāṅkṣayā"
  - id: 'sabha-2-95-16'
    kind: verse
    lines:
      - शुद्धा च गुरुशुश्रूषा यमयोः पुरुषाग्र्ययोः अजातशत्रो भद्रं ते खाण्डवप्रस्थमाविश
      - भ्रातृभिस्तेऽस्तु सौभ्रात्रं धर्मे ते धीयताम मनः
      - वैशम्पायन उवाच
    iast: "śuddhā ca guruśuśrūṣā yamayoḥ puruṣāgryayoḥ ajātaśatro bhadraṃ te khāṇḍavaprasthamāviśa | bhrātṛbhiste'stu saubhrātraṃ dharme te dhīyatāma manaḥ | vaiśampāyana uvāca"
  - id: 'sabha-2-95-17'
    kind: verse
    lines:
      - इत्युक्तो भरतश्रेष्ठ धर्मराजो युधिष्ठिरः
      - कृत्वाऽऽर्यसमयं सर्वं प्रतस्थे भ्रातृभिः सह
    iast: "ityukto bharataśreṣṭha dharmarājo yudhiṣṭhiraḥ | kṛtvā''ryasamayaṃ sarvaṃ pratasthe bhrātṛbhiḥ saha"
  - id: 'sabha-2-96-5'
    kind: verse
    lines:
      - अथ दुर्योधनः कर्णः शकुनिश्चापि सौबलः
      - मिथः सङ्गम्य सहिताः पाण्डवान्प्रति मानिनः
    iast: "atha duryodhanaḥ karṇaḥ śakuniścāpi saubalaḥ | mithaḥ saṅgamya sahitāḥ pāṇḍavānprati māninaḥ"
  - id: 'sabha-2-96-6'
    kind: verse
    lines:
      - वैचित्रवीर्यं राजानं धृतराष्ट्रं मनीषिणम्
      - अभिगम्य त्वरायुक्ताः श्लक्ष्णं वचनमब्रुवन्
      - दुर्योधन उवाच
    iast: "vaicitravīryaṃ rājānaṃ dhṛtarāṣṭraṃ manīṣiṇam | abhigamya tvarāyuktāḥ ślakṣṇaṃ vacanamabruvan | duryodhana uvāca"
  - id: 'sabha-2-96-8'
    kind: verse
    lines:
      - सर्वोपायैर्निहन्तव्याः शत्रवः शत्रुसूदन
      - पुरा युद्धाद्बलाद्वापि प्रकुर्वन्ति तवाहितम्
    iast: "sarvopāyairnihantavyāḥ śatravaḥ śatrusūdana | purā yuddhādbalādvāpi prakurvanti tavāhitam"
  - id: 'sabha-2-96-15'
    kind: verse
    lines:
      - ते त्वास्थाय रथान्सर्वे बहुशस्त्रपरिच्छदान्
      - अभिघ्नान्तो रथव्रातान्सेनायोगाय निर्ययुः
    iast: "te tvāsthāya rathānsarve bahuśastraparicchadān | abhighnānto rathavrātānsenāyogāya niryayuḥ"
  - id: 'sabha-2-96-16'
    kind: verse
    lines:
      - न क्षंस्यन्ते तथाऽस्माभिर्जातु विप्रकृता हि ते
      - द्रौपद्याश्च परिक्लेशं कस्तेषां क्षन्तुमर्हति
    iast: "na kṣaṃsyante tathā'smābhirjātu viprakṛtā hi te | draupadyāśca parikleśaṃ kasteṣāṃ kṣantumarhati"
  - id: 'sabha-2-96-20'
    kind: verse
    lines:
      - अर्जुनेन समो लोके नास्ति वीर्ये धनुर्धरः
      - योऽर्जुनेनार्जुनस्तुल्यो द्विबाहुर्बहुबाहुना
      - धृतराष्ट्र उवाच
    iast: "arjunena samo loke nāsti vīrye dhanurdharaḥ | yo'rjunenārjunastulyo dvibāhurbahubāhunā | dhṛtarāṣṭra uvāca"
  - id: 'sabha-2-97-67'
    kind: verse
    lines:
      - अकारादीनि नामानि अर्जुनग्रस्तचेतसः
      - अश्वाक्षराम्बुजाश्चैव त्रासं सञ्जनयन्ति मे
    iast: "akārādīni nāmāni arjunagrastacetasaḥ | aśvākṣarāmbujāścaiva trāsaṃ sañjanayanti me"
  - id: 'sabha-2-97-75'
    kind: verse
    lines:
      - द्यूते पार्थस्य कौरव्य मायया निकृतिः कृता
      - तस्माद्वि नो जयस्तात अन्योपायेन नो भवेत्
      - धृतराष्ट्र उवाच
    iast: "dyūte pārthasya kauravya māyayā nikṛtiḥ kṛtā | tasmādvi no jayastāta anyopāyena no bhavet | dhṛtarāṣṭra uvāca"
  - id: 'sabha-2-97-80'
    kind: verse
    lines:
      - पुनर्दीव्याम भद्रं ते वनवासाय पाण्डवैः एवमेतान्वशे कर्तुं शक्ष्यामः पुरुषर्षभ ष
    iast: "punardīvyāma bhadraṃ te vanavāsāya pāṇḍavaiḥ evametānvaśe kartuṃ śakṣyāmaḥ puruṣarṣabha ṣa"
  - id: 'sabha-2-97-84'
    kind: verse
    lines:
      - एतत्कृत्यतमं राजन्नस्माकं भरतर्षभ
      - अयं हि शकुनिर्वेद सविद्यामक्षसम्पदम्
    iast: "etatkṛtyatamaṃ rājannasmākaṃ bharatarṣabha | ayaṃ hi śakunirveda savidyāmakṣasampadam"
  - id: 'sabha-2-97-85'
    kind: verse
    lines:
      - दृढमूलं वयं राज्ये मित्राणि परिगृह्य च
      - सारवद्विपुलं सैन्यं सत्कृत्य च दुरासदम्
    iast: "dṛḍhamūlaṃ vayaṃ rājye mitrāṇi parigṛhya ca | sāravadvipulaṃ sainyaṃ satkṛtya ca durāsadam"
  - id: 'sabha-2-97-86'
    kind: verse
    lines:
      - ते च त्रयोदशं वर्षं पारयिष्यन्ति चेद्व्रतम्
      - जेष्यामस्तान्वयं राजत्रोचतां ते परन्तप
      - धृतराष्ट्र उवाच
    iast: "te ca trayodaśaṃ varṣaṃ pārayiṣyanti cedvratam | jeṣyāmastānvayaṃ rājatrocatāṃ te parantapa | dhṛtarāṣṭra uvāca"
  - id: 'sabha-2-97-87'
    kind: verse
    lines:
      - तूर्णं प्रत्यानयस्वैतान्कामं व्यध्वगतानपि
      - आगच्छन्तु पुनर्द्यूतमिदं कुर्वन्तु पाण्डवः
      - वैशम्पायन उवाच
    iast: "tūrṇaṃ pratyānayasvaitānkāmaṃ vyadhvagatānapi | āgacchantu punardyūtamidaṃ kurvantu pāṇḍavaḥ | vaiśampāyana uvāca"
  - id: 'sabha-2-97-91'
    kind: verse
    lines:
      - अथाब्रवीन्महाराज धृतराष्ट्रं जनेश्वरम्
      - पुत्रहार्दाद्धर्मयुक्ता गान्धारी शोककर्शिता
    iast: "athābravīnmahārāja dhṛtarāṣṭraṃ janeśvaram | putrahārdāddharmayuktā gāndhārī śokakarśitā"
  - id: 'sabha-2-97-95'
    kind: verse
    lines:
      - मा कुलस्य क्षये घोरे कारणं त्वं भविष्यसि
      - बद्धं सेतुं को नु भिन्द्याद्धमेच्छान्तं च पावकम्
    iast: "mā kulasya kṣaye ghore kāraṇaṃ tvaṃ bhaviṣyasi | baddhaṃ setuṃ ko nu bhindyāddhamecchāntaṃ ca pāvakam"
  - id: 'sabha-2-97-96'
    kind: verse
    lines:
      - शमे स्थितान्को नु पार्थान्कोपयेद्भरतर्षभ
      - स्मरन्तं त्वामाजमीढं स्मारयिष्याम्यहं पुनः
    iast: "śame sthitānko nu pārthānkopayedbharatarṣabha | smarantaṃ tvāmājamīḍhaṃ smārayiṣyāmyahaṃ punaḥ"
  - id: 'sabha-2-97-98'
    kind: verse
    lines:
      - त्वन्नेत्राः सन्तु ते पुत्रा मा त्वां दीर्णाः प्रहासिषुः
      - तस्मादयं मद्वचनात्त्यज्यतां कुलपांसनः
    iast: "tvannetrāḥ santu te putrā mā tvāṃ dīrṇāḥ prahāsiṣuḥ | tasmādayaṃ madvacanāttyajyatāṃ kulapāṃsanaḥ"
  - id: 'sabha-2-97-101'
    kind: verse
    lines:
      - अथाब्रवीन्महाराजो गान्धारीं धर्मदर्शिनीम्
      - अन्तः कामं कुलस्यास्तु न शक्नोमि निवारितुम्
    iast: "athābravīnmahārājo gāndhārīṃ dharmadarśinīm | antaḥ kāmaṃ kulasyāstu na śaknomi nivāritum"
  - id: 'sabha-2-97-102'
    kind: verse
    lines:
      - यथेच्छन्ति तथैवास्तु प्रत्यागच्छन्तु पाण्डवाः
      - पुनर्द्यूतं च कुर्वन्तु मामकाः पाण्डवैः सह
    iast: "yathecchanti tathaivāstu pratyāgacchantu pāṇḍavāḥ | punardyūtaṃ ca kurvantu māmakāḥ pāṇḍavaiḥ saha"
  - id: 'sabha-2-98-1'
    kind: verse
    lines:
      - ततो व्यध्वगतं पार्थं प्रातिकामी युधिष्ठिरम्
      - उवाच वचनाद्राज्ञो धृतराष्ट्रस्य धीमतः
    iast: "tato vyadhvagataṃ pārthaṃ prātikāmī yudhiṣṭhiram | uvāca vacanādrājño dhṛtarāṣṭrasya dhīmataḥ"
  - id: 'sabha-2-98-2'
    kind: verse
    lines:
      - उपास्तीर्णा सभा राजन्नक्षानुप्त्वा युधिष्ठिर
      - एहि पाण्डव दीव्येति पिता त्वाह नराधिपः
      - युधिष्ठिर उवाच
    iast: "upāstīrṇā sabhā rājannakṣānuptvā yudhiṣṭhira | ehi pāṇḍava dīvyeti pitā tvāha narādhipaḥ | yudhiṣṭhira uvāca"
  - id: 'sabha-2-98-3'
    kind: verse
    lines:
      - धातुर्नियोगाद्भूतानि प्राप्नुवन्ति शुभाशुभम्
      - न निवृत्तिस्तयोरस्ति देवतव्यं पुनर्यदि
    iast: "dhāturniyogādbhūtāni prāpnuvanti śubhāśubham | na nivṛttistayorasti devatavyaṃ punaryadi"
  - id: 'sabha-2-98-4'
    kind: verse
    lines:
      - अक्षद्यूते समाह्वानं नियोगात्स्थविरस्य च
      - जानन्नपि क्षयकरं नातिक्रमितुमुत्सहे
      - वैशम्पायन उवाच
    iast: "akṣadyūte samāhvānaṃ niyogātsthavirasya ca | jānannapi kṣayakaraṃ nātikramitumutsahe | vaiśampāyana uvāca"
  - id: 'sabha-2-98-6'
    kind: verse
    lines:
      - इति ब्रुवन्निववृते भ्रातृभिः सह पाण्डवः
      - जानांश्च शकुनेर्मायां पार्थो द्यूतमियात्पुनः
    iast: "iti bruvannivavṛte bhrātṛbhiḥ saha pāṇḍavaḥ | jānāṃśca śakunermāyāṃ pārtho dyūtamiyātpunaḥ"
  - id: 'sabha-2-98-10'
    kind: verse
    lines:
      - वयं वा द्वादशाब्दानि युष्माभिर्द्यूतनिर्जिताः
      - प्रविशेम महारण्यं रौरवाजिनवाससः
    iast: "vayaṃ vā dvādaśābdāni yuṣmābhirdyūtanirjitāḥ | praviśema mahāraṇyaṃ rauravājinavāsasaḥ"
  - id: 'sabha-2-98-11'
    kind: verse
    lines:
      - त्रयोदशं च स्वजनैरज्ञाताः परिवत्सरम्
      - ज्ञाताश्च पुनरन्यानि वने वर्षाणि द्वादश
    iast: "trayodaśaṃ ca svajanairajñātāḥ parivatsaram | jñātāśca punaranyāni vane varṣāṇi dvādaśa"
  - id: 'sabha-2-98-12'
    kind: verse
    lines:
      - अस्माभिर्निर्जिता यूयं वने द्वादश वत्सरान्
      - वसध्वं कृष्णया सार्धमजिनैः प्रतिवासिताः
    iast: "asmābhirnirjitā yūyaṃ vane dvādaśa vatsarān | vasadhvaṃ kṛṣṇayā sārdhamajinaiḥ prativāsitāḥ"
  - id: 'sabha-2-98-13'
    kind: verse
    lines:
      - त्रयोदशं च स्वजनैरज्ञाताः पिरवत्सरम्
      - ज्ञाताश्च पुनरन्यानि वने वर्षाणि द्वादश
    iast: "trayodaśaṃ ca svajanairajñātāḥ piravatsaram | jñātāśca punaranyāni vane varṣāṇi dvādaśa"
  - id: 'sabha-2-98-15'
    kind: verse
    lines:
      - अनेन व्यवसायेन सहास्माभिर्युधिष्ठिर
      - अक्षानुप्त्वा पुनर्द्यूतमेहि दीव्यस्व भारत
    iast: "anena vyavasāyena sahāsmābhiryudhiṣṭhira | akṣānuptvā punardyūtamehi dīvyasva bhārata"
  - id: 'sabha-2-98-24'
    kind: verse
    lines:
      - वैशम्पायन उवाच
      - एवं दैवबलाविष्टो धर्मराजो युधिष्ठिरः
      - भीष्मद्रोणाऽऽवार्यमाणो विदुरेण च धीमता
    iast: "vaiśampāyana uvāca | evaṃ daivabalāviṣṭo dharmarājo yudhiṣṭhiraḥ | bhīṣmadroṇā''vāryamāṇo vidureṇa ca dhīmatā"
  - id: 'sabha-2-98-25'
    kind: verse
    lines:
      - युयुत्सुना कृपेणाथ सञ्जयेन च भारत
      - गान्धार्या पृथया चैव भीमार्जुनयमैस्तथा
    iast: "yuyutsunā kṛpeṇātha sañjayena ca bhārata | gāndhāryā pṛthayā caiva bhīmārjunayamaistathā"
  - id: 'sabha-2-98-27'
    kind: verse
    lines:
      - वार्यमाणोपि सततं न च राजन्नियच्छति
      - एवं संवार्यमाणोपि कौन्तेयो हितकाम्यया
    iast: "vāryamāṇopi satataṃ na ca rājanniyacchati | evaṃ saṃvāryamāṇopi kaunteyo hitakāmyayā"
  - id: 'sabha-2-98-29'
    kind: verse
    lines:
      - एवं भवत्विति तदा वनवासाय दीव्यति
      - प्रतिजग्राह तं पार्थो ग्लहं जग्राह सौबलः
      - जितमित्येव शकुनिर्युधिष्ठिरमभाषत
    iast: "evaṃ bhavatviti tadā vanavāsāya dīvyati | pratijagrāha taṃ pārtho glahaṃ jagrāha saubalaḥ | jitamityeva śakuniryudhiṣṭhiramabhāṣata"
  - id: 'sabha-2-99-2'
    kind: verse
    lines:
      - अजिनैः संवृतान्दृष्ट्वा हृतराज्यानरिन्दमान्
      - प्रस्थितान्वनवासाय ततो दुःशासनोऽब्रवीत्
    iast: "ajinaiḥ saṃvṛtāndṛṣṭvā hṛtarājyānarindamān | prasthitānvanavāsāya tato duḥśāsano'bravīt"
  - id: 'sabha-2-99-3'
    kind: verse
    lines:
      - प्रवृत्तं धार्तराष्ट्रस्य चक्रं राज्ञो महात्मनः
      - पराजिताः पाण्डवेया विपत्तिं परमां गताः
    iast: "pravṛttaṃ dhārtarāṣṭrasya cakraṃ rājño mahātmanaḥ | parājitāḥ pāṇḍaveyā vipattiṃ paramāṃ gatāḥ"
  - id: 'sabha-2-99-6'
    kind: verse
    lines:
      - धनेन मत्ता ये ते स्म धार्तराष्ट्रान्प्रहासिषुः
      - ते निर्जिता हृतधना वनमेष्यन्ति पाण्डवः
    iast: "dhanena mattā ye te sma dhārtarāṣṭrānprahāsiṣuḥ | te nirjitā hṛtadhanā vanameṣyanti pāṇḍavaḥ"
  - id: 'sabha-2-99-10'
    kind: verse
    lines:
      - महाप्राज्ञः सौमकिर्यज्ञसेनः कन्यां पाञ्चालीं पाण्डवेभ्यः प्रदाय
      - अकार्षिद्वै सुकृतं नेह किञ्चित् क्लीबाः पार्थाः पतयो याज्ञसेन्याः
    iast: "mahāprājñaḥ saumakiryajñasenaḥ kanyāṃ pāñcālīṃ pāṇḍavebhyaḥ pradāya | akārṣidvai sukṛtaṃ neha kiñcit klībāḥ pārthāḥ patayo yājñasenyāḥ"
  - id: 'sabha-2-99-11'
    kind: verse
    lines:
      - सूक्ष्मप्रावारानजिनोत्तरीयान् दृष्ट्वाऽरण्ये निर्धनानप्रतिष्ठान्
      - कां त्वं प्रीतिं लप्स्यसे याज्ञसेनि पतिं वृणीष्वेह यमन्यमिच्छसि
    iast: "sūkṣmaprāvārānajinottarīyān dṛṣṭvā'raṇye nirdhanānapratiṣṭhān | kāṃ tvaṃ prītiṃ lapsyase yājñaseni patiṃ vṛṇīṣveha yamanyamicchasi"
  - id: 'sabha-2-99-16'
    kind: verse
    lines:
      - क्रूर पापजनैर्जुष्टमकृतार्थं प्रभाषसे
      - गान्धारविद्यया हि त्वं राजमध्ये विकत्थसे
    iast: "krūra pāpajanairjuṣṭamakṛtārthaṃ prabhāṣase | gāndhāravidyayā hi tvaṃ rājamadhye vikatthase"
  - id: 'sabha-2-99-17'
    kind: verse
    lines:
      - यथा तुदसि मर्माणि वाक्छरैरिह नो भृशम्
      - तथा स्मारयिता तेऽहं कृन्तन्मर्माणि संयुगे
    iast: "yathā tudasi marmāṇi vākcharairiha no bhṛśam | tathā smārayitā te'haṃ kṛntanmarmāṇi saṃyuge"
  - id: 'sabha-2-99-20'
    kind: verse
    lines:
      - नृशंस परुषं वक्तुं दुःशासन त्वया
      - निकृत्या हि धनं लब्ध्वा को विकत्थितुमर्हति
    iast: "nṛśaṃsa paruṣaṃ vaktuṃ duḥśāsana tvayā | nikṛtyā hi dhanaṃ labdhvā ko vikatthitumarhati"
  - id: 'sabha-2-99-22'
    kind: verse
    lines:
      - धार्तराष्ट्रान्रणे हत्त्वा मिषतां सर्वधन्विनाम्
      - शमं गन्ताऽस्मि नचिरात्सत्यमेतद्ब्रवीमि ते
      - वैशम्पायन उवाच
    iast: "dhārtarāṣṭrānraṇe hattvā miṣatāṃ sarvadhanvinām | śamaṃ gantā'smi nacirātsatyametadbravīmi te | vaiśampāyana uvāca"
  - id: 'sabha-2-99-26'
    kind: verse
    lines:
      - अहं दुर्योधनं हन्ता कर्णं हन्ता धनञ्जयः
      - शकुनिं चाक्षकितवं सहदेवो हनिष्यति
    iast: "ahaṃ duryodhanaṃ hantā karṇaṃ hantā dhanañjayaḥ | śakuniṃ cākṣakitavaṃ sahadevo haniṣyati"
  - id: 'sabha-2-99-28'
    kind: verse
    lines:
      - सुयोधनमिमं पापं हन्ताऽस्मि गदया युधि
      - शिरः पादेन चास्याहमधिष्ठास्यामि भूतले
    iast: "suyodhanamimaṃ pāpaṃ hantā'smi gadayā yudhi | śiraḥ pādena cāsyāhamadhiṣṭhāsyāmi bhūtale"
  - id: 'sabha-2-99-29'
    kind: verse
    lines:
      - वाक्यशूरस्य चैवास्य परुषस्य दुरात्मनः
      - दुःशासनस्य रुधिरं पाताऽस्मि मृगराडिव
      - अर्जुन उवाच
    iast: "vākyaśūrasya caivāsya paruṣasya durātmanaḥ | duḥśāsanasya rudhiraṃ pātā'smi mṛgarāḍiva | arjuna uvāca"
  - id: 'sabha-2-99-31'
    kind: verse
    lines:
      - नैवं वाचा व्यवसितं भीम विज्ञायते सताम्
      - इतश्चतुर्दशे वर्षे द्रष्टारो यद्भविष्यति
      - भीमसेन उवाच
    iast: "naivaṃ vācā vyavasitaṃ bhīma vijñāyate satām | itaścaturdaśe varṣe draṣṭāro yadbhaviṣyati | bhīmasena uvāca"
  - id: 'sabha-2-99-48'
    kind: verse
    lines:
      - एवं ते पुरुषव्याघ्राः सर्वे व्यायतबाहवः
      - प्रतिज्ञा बहुलाः कृत्वा धृतराष्ट्रमुपागमन्
    iast: "evaṃ te puruṣavyāghrāḥ sarve vyāyatabāhavaḥ | pratijñā bahulāḥ kṛtvā dhṛtarāṣṭramupāgaman"
  - id: 'sabha-2-101-61'
    kind: verse
    lines:
      - एवं विपलतीं कुन्तीमभिवाद्य प्रणम्य च
      - पाण्डवा विगतानन्दा वनायैव प्रवव्रजुः
    iast: "evaṃ vipalatīṃ kuntīmabhivādya praṇamya ca | pāṇḍavā vigatānandā vanāyaiva pravavrajuḥ"
  - id: 'sabha-2-102-31'
    kind: verse
    lines:
      - एवं तेषु नराग्र्येषु निर्यत्सु गजसाह्वयात्
      - अनभ्रे विद्युतश्चासन्भूमिश्च समकम्पत
    iast: "evaṃ teṣu narāgryeṣu niryatsu gajasāhvayāt | anabhre vidyutaścāsanbhūmiśca samakampata"
  - id: 'vana-3-1-10'
    kind: verse
    lines:
      - वर्धमानपुरद्वारादभिनिष्क्रम्य ते तदा
      - उदङ्मुखाः शस्त्रभृतः प्रययुः सह कृष्णया
    iast: "vardhamānapuradvārādabhiniṣkramya te tadā | udaṅmukhāḥ śastrabhṛtaḥ prayayuḥ saha kṛṣṇayā"
  - id: 'vana-3-1-11'
    kind: verse
    lines:
      - इन्द्रसेनादयश्चैतान्भृत्याः परिचतुर्दश
      - रथैरनुययुः शीघ्रैः स्त्रिय आदाय सर्वशः
    iast: "indrasenādayaścaitānbhṛtyāḥ paricaturdaśa | rathairanuyayuḥ śīghraiḥ striya ādāya sarvaśaḥ"
  - id: 'vana-3-1-13'
    kind: verse
    lines:
      - व्रजतस्तान्विदित्वा तु पौराः शोकाभिपीडिताः गर्हयन्तोऽसकृद्भीष्मविदुरद्रोणगौतमान्
      - ऊचुर्वै समयं कृत्वा समागम्य परस्परम्
      - पौरा ऊचुः
    iast: "vrajatastānviditvā tu paurāḥ śokābhipīḍitāḥ garhayanto'sakṛdbhīṣmaviduradroṇagautamān | ūcurvai samayaṃ kṛtvā samāgamya parasparam | paurā ūcuḥ"
  - id: 'vana-3-1-17'
    kind: verse
    lines:
      - नेयमस्ति मही कृत्स्ना यत्र दुर्योधनो नृपः
      - साधु गच्छामहे सर्वे यत्र गच्छन्ति पाण्डवाः
    iast: "neyamasti mahī kṛtsnā yatra duryodhano nṛpaḥ | sādhu gacchāmahe sarve yatra gacchanti pāṇḍavāḥ"
  - id: 'vana-3-1-19'
    kind: verse
    lines:
      - एवमुक्त्वाऽनुजग्मुस्ते पाण्डवांस्तान्समेत्य च
      - ऊचुः प्राञ्जलयः सर्वे तान्कुन्तीमाद्रिनन्दनान्
    iast: "evamuktvā'nujagmuste pāṇḍavāṃstānsametya ca | ūcuḥ prāñjalayaḥ sarve tānkuntīmādrinandanān"
  - id: 'vana-3-1-35'
    kind: verse
    lines:
      - भीष्मः पितामहो राजा विदुरो जननी च मे
      - सुहृज्जनश्च प्रायो मे नगरे नागसाह्वये
    iast: "bhīṣmaḥ pitāmaho rājā viduro jananī ca me | suhṛjjanaśca prāyo me nagare nāgasāhvaye"
  - id: 'vana-3-1-36'
    kind: verse
    lines:
      - ते त्वस्मद्धितकामार्थं पालनीयाः प्रयत्नतः
      - युष्माभिः सहिताः सर्वे शोकसंतापविह्वलाः
    iast: "te tvasmaddhitakāmārthaṃ pālanīyāḥ prayatnataḥ | yuṣmābhiḥ sahitāḥ sarve śokasaṃtāpavihvalāḥ"
  - id: 'vana-3-1-37'
    kind: verse
    lines:
      - निवर्ततागता दूरं ममागमनकाङ्क्षिणः
      - स्वजने न्यासभूते मे कार्या स्नेहान्विता मतिः
    iast: "nivartatāgatā dūraṃ mamāgamanakāṅkṣiṇaḥ | svajane nyāsabhūte me kāryā snehānvitā matiḥ"
  - id: 'vana-3-1-39'
    kind: verse
    lines:
      - तथानुमन्त्रितास्तेन धर्मराजेन ताः प्रजाः
      - चक्रुरार्तस्वरं घोरं हा राजन्निति दुःखिताः
    iast: "tathānumantritāstena dharmarājena tāḥ prajāḥ | cakrurārtasvaraṃ ghoraṃ hā rājanniti duḥkhitāḥ"
  - id: 'vana-3-1-40'
    kind: verse
    lines:
      - गुणान्पार्थस्य संस्मृत्य दुःखार्ताः परमातुराः
      - अकामाः संन्यवर्तन्त समागम्याथ पाण्डवान्
    iast: "guṇānpārthasya saṃsmṛtya duḥkhārtāḥ paramāturāḥ | akāmāḥ saṃnyavartanta samāgamyātha pāṇḍavān"
  - id: 'vana-3-5-3'
    kind: verse
    lines:
      - ततः सरस्वतीकूले समेषु मरुधन्वसु
      - काम्यकं नाम ददृशुर्वनं मुनिजनप्रियम्
    iast: "tataḥ sarasvatīkūle sameṣu marudhanvasu | kāmyakaṃ nāma dadṛśurvanaṃ munijanapriyam"
  - id: 'vana-3-5-4'
    kind: verse
    lines:
      - तत्र ते न्यवसन्वीरा वने बहुमृगद्विजे
      - अन्वास्यमाना मुनिभिः सान्त्व्यमानाश्च भारत
    iast: "tatra te nyavasanvīrā vane bahumṛgadvije | anvāsyamānā munibhiḥ sāntvyamānāśca bhārata"
  - id: 'vana-3-12-1'
    kind: verse
    lines:
      - भोजाः प्रव्रजिताञ्श्रुत्वा वृष्णयश्चान्धकैः सह
      - पाण्डवान्दुःखसंतप्तान्समाजग्मुर्महावने
    iast: "bhojāḥ pravrajitāñśrutvā vṛṣṇayaścāndhakaiḥ saha | pāṇḍavānduḥkhasaṃtaptānsamājagmurmahāvane"
  - id: 'vana-3-12-2'
    kind: verse
    lines:
      - पाञ्चालस्य च दायादो धृष्टकेतुश्च चेदिपः
      - केकयाश्च महावीर्या भ्रातरो लोकविश्रुताः
    iast: "pāñcālasya ca dāyādo dhṛṣṭaketuśca cedipaḥ | kekayāśca mahāvīryā bhrātaro lokaviśrutāḥ"
  - id: 'vana-3-12-4'
    kind: verse
    lines:
      - वासुदेवं पुरस्कृत्य सर्वे ते क्षत्रियर्षभाः परिवार्योपविविशुर्धर्मराजं युधिष्ठिरम्
      - अभिवाद्य कुरुश्रेष्ठं विषण्णः केशवोऽब्रवीत्
      - वासुदेव उवाच
    iast: "vāsudevaṃ puraskṛtya sarve te kṣatriyarṣabhāḥ parivāryopaviviśurdharmarājaṃ yudhiṣṭhiram | abhivādya kuruśreṣṭhaṃ viṣaṇṇaḥ keśavo'bravīt | vāsudeva uvāca"
  - id: 'vana-3-12-61'
    kind: verse
    lines:
      - लोकपालाश्च लोकाश्च नक्षत्राणि दिशे दश
      - नभश्चन्द्रश्च सूर्यश्च त्वयि सर्वं प्रतिष्ठितम्
    iast: "lokapālāśca lokāśca nakṣatrāṇi diśe daśa | nabhaścandraśca sūryaśca tvayi sarvaṃ pratiṣṭhitam"
  - id: 'vana-3-12-63'
    kind: verse
    lines:
      - सा तेऽहं दुःखमाख्यास्ये प्रणयान्मधुसूदन
      - ईशस्त्वं सर्वभूतानां ये दिव्या ये च मानुषाः
    iast: "sā te'haṃ duḥkhamākhyāsye praṇayānmadhusūdana | īśastvaṃ sarvabhūtānāṃ ye divyā ye ca mānuṣāḥ"
  - id: 'vana-3-12-64'
    kind: verse
    lines:
      - कथं नु भार्या पार्थानां तव कृष्ण सखी विभो
      - धृष्टद्युम्नस्य भगिनी सभां कृष्येत मादृशी
    iast: "kathaṃ nu bhāryā pārthānāṃ tava kṛṣṇa sakhī vibho | dhṛṣṭadyumnasya bhaginī sabhāṃ kṛṣyeta mādṛśī"
  - id: 'vana-3-12-67'
    kind: verse
    lines:
      - दासीभावेन मां भोक्तुमीष्सुते मधुसूदन
      - जीवत्सु पाण्डुपुत्रेषु पाञ्चालेषु च वृष्णिषु
    iast: "dāsībhāvena māṃ bhoktumīṣsute madhusūdana | jīvatsu pāṇḍuputreṣu pāñcāleṣu ca vṛṣṇiṣu"
  - id: 'vana-3-12-71'
    kind: verse
    lines:
      - शाश्वतोऽयं धर्मपथः सद्भिराचरितः सदा
      - यद्भार्यां परिरक्षन्ति भर्तारोऽल्पबला अपि
    iast: "śāśvato'yaṃ dharmapathaḥ sadbhirācaritaḥ sadā | yadbhāryāṃ parirakṣanti bhartāro'lpabalā api"
  - id: 'vana-3-12-74'
    kind: verse
    lines:
      - नन्विमे शरणं प्राप्तं न त्यजन्ति कदाचन
      - ते मां शरणमापन्नां नान्वपद्यन्त पाण्डवाः
    iast: "nanvime śaraṇaṃ prāptaṃ na tyajanti kadācana | te māṃ śaraṇamāpannāṃ nānvapadyanta pāṇḍavāḥ"
  - id: 'vana-3-12-79'
    kind: verse
    lines:
      - अधर्मेण हृतं राज्यं सर्वे दासाः कृतास्तथा
      - सभायां परिकृष्टाऽहमेकवस्त्रा रजस्वला
    iast: "adharmeṇa hṛtaṃ rājyaṃ sarve dāsāḥ kṛtāstathā | sabhāyāṃ parikṛṣṭā'hamekavastrā rajasvalā"
  - id: 'vana-3-12-81'
    kind: verse
    lines:
      - धिग्बलं भीमसेनस्य धिक्पार्थस्य च पौरुषम्
      - यत्र दुर्योधनः कृष्ण मुहूर्तमपि जीवति
    iast: "dhigbalaṃ bhīmasenasya dhikpārthasya ca pauruṣam | yatra duryodhanaḥ kṛṣṇa muhūrtamapi jīvati"
  - id: 'vana-3-12-123'
    kind: verse
    lines:
      - कुले महतिजाताऽस्मि दिव्येन विधिना किल
      - पाण्डवानां प्रिया भार्या स्नुषा पाण्डोर्महात्मनः
    iast: "kule mahatijātā'smi divyena vidhinā kila | pāṇḍavānāṃ priyā bhāryā snuṣā pāṇḍormahātmanaḥ"
  - id: 'vana-3-12-124'
    kind: verse
    lines:
      - केशग्रहमनुप्राप्ता का नु जीवेत मादृशी
      - पञ्चानामिन्द्रकल्पानां प्रेक्षतां मधुसूदन
    iast: "keśagrahamanuprāptā kā nu jīveta mādṛśī | pañcānāmindrakalpānāṃ prekṣatāṃ madhusūdana"
  - id: 'vana-3-12-128'
    kind: verse
    lines:
      - नैव मे पतयः सन्ति न पुत्रा न च बान्धवाः
      - न भ्रातरो न च पिता नैव त्वं मधुसूदन
    iast: "naiva me patayaḥ santi na putrā na ca bāndhavāḥ | na bhrātaro na ca pitā naiva tvaṃ madhusūdana"
  - id: 'vana-3-12-130'
    kind: verse
    lines:
      - चतुर्भिः कारणैः कृष्ण त्वया रक्ष्याऽस्मि नित्यशः
      - संबन्धाद्गौरवात्सख्यात्प्रभुत्वेनैव केशव
      - वैशंपायन उवाच
    iast: "caturbhiḥ kāraṇaiḥ kṛṣṇa tvayā rakṣyā'smi nityaśaḥ | saṃbandhādgauravātsakhyātprabhutvenaiva keśava | vaiśaṃpāyana uvāca"
  - id: 'vana-3-12-133'
    kind: verse
    lines:
      - यत्समर्थं पाण्डवनां तत्करिष्यामि मा शुचः
      - सत्यं ते प्रतिजानामि राज्ञां राज्ञी भविष्यसि
    iast: "yatsamarthaṃ pāṇḍavanāṃ tatkariṣyāmi mā śucaḥ | satyaṃ te pratijānāmi rājñāṃ rājñī bhaviṣyasi"
  - id: 'vana-3-13-1'
    kind: verse
    lines:
      - नैतत्कृच्छ्रमनुप्राप्तो भवान्स्याद्वसुधाधिप
      - यद्यहं द्वारकायां स्यां राजन्सन्निहितः पुरा
    iast: "naitatkṛcchramanuprāpto bhavānsyādvasudhādhipa | yadyahaṃ dvārakāyāṃ syāṃ rājansannihitaḥ purā"
  - id: 'vana-3-13-2'
    kind: verse
    lines:
      - आगच्छेयमहं द्यूतमनाहूतोऽपि कौरवैः आम्बिकेयेन दुर्धर्ष राज्ञा दुर्योधनेन च
      - वारयेयमहं द्यूतं बहून्दोपान्प्रदर्शयन्
    iast: "āgaccheyamahaṃ dyūtamanāhūto'pi kauravaiḥ āmbikeyena durdharṣa rājñā duryodhanena ca | vārayeyamahaṃ dyūtaṃ bahūndopānpradarśayan"
  - id: 'vana-3-13-7'
    kind: verse
    lines:
      - स्त्रियोऽक्षा मृगया पानमेतत्कामसमुत्थितम्
      - दुःखं चतुष्टय प्रोक्तं यैर्नरो भ्रश्यते श्रियः
    iast: "striyo'kṣā mṛgayā pānametatkāmasamutthitam | duḥkhaṃ catuṣṭaya proktaṃ yairnaro bhraśyate śriyaḥ"
  - id: 'vana-3-13-9'
    kind: verse
    lines:
      - एकाहाद्द्रव्यनाशोऽत्र ध्रुवं व्यसनमेव च
      - अभुक्तनाशश्चार्थानां वाक्पारुष्यं च केवलम्
    iast: "ekāhāddravyanāśo'tra dhruvaṃ vyasanameva ca | abhuktanāśaścārthānāṃ vākpāruṣyaṃ ca kevalam"
  - id: 'vana-3-22-44'
    kind: verse
    lines:
      - एवमुक्त्वा महाबाहुः कौरवं पुरुषोत्तमः
      - आमन्त्र्य प्रययौ श्रीमान्पाण्डवान्मधुसूदनः
    iast: "evamuktvā mahābāhuḥ kauravaṃ puruṣottamaḥ | āmantrya prayayau śrīmānpāṇḍavānmadhusūdanaḥ"
  - id: 'vana-3-22-47'
    kind: verse
    lines:
      - सुभद्रामभिमन्युं च रथमारोप्य काञ्चनम्
      - आरुरोह रथं कृष्णः पाण्डवैरभिपूजितः
    iast: "subhadrāmabhimanyuṃ ca rathamāropya kāñcanam | āruroha rathaṃ kṛṣṇaḥ pāṇḍavairabhipūjitaḥ"
  - id: 'vana-3-22-48'
    kind: verse
    lines:
      - शैब्यसुग्रीवयुक्तेन रथेनादित्यवर्चसा
      - द्वारकां प्रययौ कृष्णः समाश्वास्य युधिष्ठिरम्
    iast: "śaibyasugrīvayuktena rathenādityavarcasā | dvārakāṃ prayayau kṛṣṇaḥ samāśvāsya yudhiṣṭhiram"
  - id: 'vana-3-22-49'
    kind: verse
    lines:
      - ततः प्रयते दाशार्हे धृष्टद्युम्नोपि पार्षतः
      - द्रौपदेयानुपादाय प्रययौ स्वपुरं तदा
    iast: "tataḥ prayate dāśārhe dhṛṣṭadyumnopi pārṣataḥ | draupadeyānupādāya prayayau svapuraṃ tadā"
  - id: 'vana-3-24-16'
    kind: verse
    lines:
      - ते यात्वा पाण्डवास्तत्रब्राह्मणैर्बहुभिः सह
      - पुण्यं द्वैतवनं रम्यं विविशुर्बरतर्षभाः
    iast: "te yātvā pāṇḍavāstatrabrāhmaṇairbahubhiḥ saha | puṇyaṃ dvaitavanaṃ ramyaṃ viviśurbaratarṣabhāḥ"
  - id: 'vana-3-27-2'
    kind: verse
    lines:
      - प्रिया च दर्शनीया च पण्डिता च पतिव्रता
      - अथ कृष्णा धर्मराजमिदं वचनमब्रवीत्
      - द्रौपद्युवाच
    iast: "priyā ca darśanīyā ca paṇḍitā ca pativratā | atha kṛṣṇā dharmarājamidaṃ vacanamabravīt | draupadyuvāca"
  - id: 'vana-3-27-35'
    kind: verse
    lines:
      - नूनं च तव नैवास्ति मन्युर्भरतसत्तम
      - यत्ते भ्रातॄंश्च मां चैव दृष्ट्वा नव्यथते मनः
    iast: "nūnaṃ ca tava naivāsti manyurbharatasattama | yatte bhrātṝṃśca māṃ caiva dṛṣṭvā navyathate manaḥ"
  - id: 'vana-3-30-3'
    kind: verse
    lines:
      - नेह धर्मानृशंस्याभ्यां न क्षान्त्या नार्जवेन च
      - पुरुषः श्रियमाप्नोति न घृणित्वेन कर्हिचित्
    iast: "neha dharmānṛśaṃsyābhyāṃ na kṣāntyā nārjavena ca | puruṣaḥ śriyamāpnoti na ghṛṇitvena karhicit"
  - id: 'vana-3-30-40'
    kind: verse
    lines:
      - तवेमामापदं दृष्ट्वा समृद्धिं च सुयोधने
      - धातारं गर्हये पार्थ विषमं योऽनुपश्यति
    iast: "tavemāmāpadaṃ dṛṣṭvā samṛddhiṃ ca suyodhane | dhātāraṃ garhaye pārtha viṣamaṃ yo'nupaśyati"
  - id: 'vana-3-31-2'
    kind: verse
    lines:
      - नाहं धर्मफलाकाङ्क्षी राजपुत्रि चराम्भुत
      - ददामि देयमित्येव यजे यष्टव्यमित्युत
    iast: "nāhaṃ dharmaphalākāṅkṣī rājaputri carāmbhuta | dadāmi deyamityeva yaje yaṣṭavyamityuta"
  - id: 'vana-3-31-5'
    kind: verse
    lines:
      - धर्म एव मनः कृष्णे स्वभावाच्चैव मे धृतम् धर्मवाणिज्यको हीनो जघन्यो धर्मवादिनाम्
    iast: "dharma eva manaḥ kṛṣṇe svabhāvāccaiva me dhṛtam dharmavāṇijyako hīno jaghanyo dharmavādinām"
  - id: 'vana-3-31-6'
    kind: verse
    lines:
      - न धर्मफलमाप्नोति यो धर्मं दोग्धुमिच्छति
      - यश्चैनं शङ्कते कृत्वा नास्तिक्यात्पापचेतनः
    iast: "na dharmaphalamāpnoti yo dharmaṃ dogdhumicchati | yaścainaṃ śaṅkate kṛtvā nāstikyātpāpacetanaḥ"
  - id: 'vana-3-31-24'
    kind: verse
    lines:
      - धर्म एव प्लवो नान्यः स्वर्गं द्रौपदि गच्छताम्
      - सैवः नौः सागरस्येव वणिजः पारमिच्छतः
    iast: "dharma eva plavo nānyaḥ svargaṃ draupadi gacchatām | saivaḥ nauḥ sāgarasyeva vaṇijaḥ pāramicchataḥ"
  - id: 'vana-3-31-41'
    kind: verse
    lines:
      - ईश्वरं चापि भूतानां धातारं मा च वै क्षिप
      - शिक्षस्वैनं नमस्वैनं मा तेऽभूद्बुद्धिरीदृशी
    iast: "īśvaraṃ cāpi bhūtānāṃ dhātāraṃ mā ca vai kṣipa | śikṣasvainaṃ namasvainaṃ mā te'bhūdbuddhirīdṛśī"
  - id: 'vana-3-32-1'
    kind: verse
    lines:
      - नावमन्ये न गर्हे च धर्मं पार्थ कथंचन
      - ईश्वरं कुत एवाहमवमंस्ये प्रजापतिम्
    iast: "nāvamanye na garhe ca dharmaṃ pārtha kathaṃcana | īśvaraṃ kuta evāhamavamaṃsye prajāpatim"
  - id: 'vana-3-32-2'
    kind: verse
    lines:
      - आर्ताऽहं प्रलपामीदमिति मां विद्धि भारत
      - भूयश्च विलपिष्यामि सुमनास्त्वं निबोध मे
    iast: "ārtā'haṃ pralapāmīdamiti māṃ viddhi bhārata | bhūyaśca vilapiṣyāmi sumanāstvaṃ nibodha me"
  - id: 'vana-3-33-6'
    kind: verse
    lines:
      - भवतोऽनुविधानेन राज्यं नः पश्यतां हृतम्
      - अहार्यमपि शक्रेण गुप्तं गाण्डीवधन्वना
    iast: "bhavato'nuvidhānena rājyaṃ naḥ paśyatāṃ hṛtam | ahāryamapi śakreṇa guptaṃ gāṇḍīvadhanvanā"
  - id: 'vana-3-33-13'
    kind: verse
    lines:
      - भवान्धर्मो धर्म इति सततं व्रतकर्शितः
      - कच्चिद्राजन्न निर्वेदादापन्नः क्लीबजीविकाम्
    iast: "bhavāndharmo dharma iti satataṃ vratakarśitaḥ | kaccidrājanna nirvedādāpannaḥ klībajīvikām"
  - id: 'vana-3-33-51'
    kind: verse
    lines:
      - भैक्ष्यचर्या न विहिता न च विट्शूद्रजीविका
      - क्षत्रियस् विशेषेण धर्मस्तु बलमौरसम्
    iast: "bhaikṣyacaryā na vihitā na ca viṭśūdrajīvikā | kṣatriyas viśeṣeṇa dharmastu balamaurasam"
  - id: 'vana-3-33-56'
    kind: verse
    lines:
      - तस्माद्विचलितः पार्थ लोके हास्यं गमिष्यसि
      - स्वधर्माद्धि मनुष्याणां चलनं न प्रशस्यते
    iast: "tasmādvicalitaḥ pārtha loke hāsyaṃ gamiṣyasi | svadharmāddhi manuṣyāṇāṃ calanaṃ na praśasyate"
  - id: 'vana-3-35-35'
    kind: verse
    lines:
      - तस्माच्छत्रुवधे राजन्क्रियतां निश्चयस्त्वया क्षत्रियस्य हि सर्वस्य नान्यो धर्मोस्ति संयुगात्
    iast: "tasmācchatruvadhe rājankriyatāṃ niścayastvayā kṣatriyasya hi sarvasya nānyo dharmosti saṃyugāt"
  - id: 'vana-3-36-3'
    kind: verse
    lines:
      - धर्मस्य जानमानोऽहं गतिमग्र्यां सुदुर्विदाम्
      - कथं बलात्करिष्यामि मेरोरिव विवर्तनम्
    iast: "dharmasya jānamāno'haṃ gatimagryāṃ sudurvidām | kathaṃ balātkariṣyāmi meroriva vivartanam"
  - id: 'vana-3-36-11'
    kind: verse
    lines:
      - राजानः पार्थिवाश्चैव येऽस्माभिरुपतापिताः
      - ते श्रिताः कौरवं पक्षं जातस्नेहाश्च सांप्रतम्
    iast: "rājānaḥ pārthivāścaiva ye'smābhirupatāpitāḥ | te śritāḥ kauravaṃ pakṣaṃ jātasnehāśca sāṃpratam"
  - id: 'vana-3-36-19'
    kind: verse
    lines:
      - अनिर्जित्यरणे सर्वानेतान्पुरुषसत्तमान्
      - अशक्यो ह्यसहायेन हन्तुं दुर्योधनस्त्वया
    iast: "anirjityaraṇe sarvānetānpuruṣasattamān | aśakyo hyasahāyena hantuṃ duryodhanastvayā"
  - id: 'vana-3-36-20'
    kind: verse
    lines:
      - न निद्रामधिगच्छामि चिन्तयानो वृकोदर
      - अतिसर्वान्धनुर्ग्राहान्सूतपुत्रस्य लाघवम्
      - वैशंपायन उवाच
    iast: "na nidrāmadhigacchāmi cintayāno vṛkodara | atisarvāndhanurgrāhānsūtaputrasya lāghavam | vaiśaṃpāyana uvāca"
  - id: 'vana-3-36-21'
    kind: verse
    lines:
      - एतद्वचनमाज्ञाय भीमसेनोऽत्यमर्षणः
      - बभूव शान्तिसंयुक्तो गुरोर्वचनवारितः
    iast: "etadvacanamājñāya bhīmaseno'tyamarṣaṇaḥ | babhūva śāntisaṃyukto gurorvacanavāritaḥ"
  - id: 'vana-3-36-22'
    kind: verse
    lines:
      - तयोः संवदतोरेवं तदा पाण्डवयोर्द्वयोः
      - आजगाम महायोगी व्यासः सत्यवतीसुतः
    iast: "tayoḥ saṃvadatorevaṃ tadā pāṇḍavayordvayoḥ | ājagāma mahāyogī vyāsaḥ satyavatīsutaḥ"
  - id: 'vana-3-36-26'
    kind: verse
    lines:
      - त्ते भयममित्रघ्न हृदि संपरिवर्तते
      - तत्तेऽहं नाशयिष्यामि विधिदृष्टेन हेतुना
    iast: "tte bhayamamitraghna hṛdi saṃparivartate | tatte'haṃ nāśayiṣyāmi vidhidṛṣṭena hetunā"
  - id: 'vana-3-36-30'
    kind: verse
    lines:
      - गृहाणेमां मया प्रोक्तां सिद्धिं मूर्तिमर्तामिव
      - विद्यां प्रतिस्मृतिं नाम प्रपन्नाय ब्रवीमि ते
    iast: "gṛhāṇemāṃ mayā proktāṃ siddhiṃ mūrtimartāmiva | vidyāṃ pratismṛtiṃ nāma prapannāya bravīmi te"
  - id: 'vana-3-36-31'
    kind: verse
    lines:
      - यामवाप्यमहाबाहुरर्जुनः साधयिष्यति
      - अस्त्रहेतोर्महेन्द्रं च रुद्रं चैवाभिगच्छतु
    iast: "yāmavāpyamahābāhurarjunaḥ sādhayiṣyati | astrahetormahendraṃ ca rudraṃ caivābhigacchatu"
  - id: 'vana-3-36-35'
    kind: verse
    lines:
      - वनादस्माच्च कौन्तेय वनमन्यद्विचिन्त्यताम्
      - निवासार्थाय यद्युक्तं भवेद्वः पृथिवीपते
    iast: "vanādasmācca kaunteya vanamanyadvicintyatām | nivāsārthāya yadyuktaṃ bhavedvaḥ pṛthivīpate"
  - id: 'vana-3-36-41'
    kind: verse
    lines:
      - स व्यासवाक्यमुदितो वनाद्द्वैतवनात्ततः
      - ययौ सरस्वतीकूले काम्यकं नाम काननम्
    iast: "sa vyāsavākyamudito vanāddvaitavanāttataḥ | yayau sarasvatīkūle kāmyakaṃ nāma kānanam"
  - id: 'vana-3-37-1'
    kind: verse
    lines:
      - कस्यचित्त्वथ कालस्य धर्मराजो युधिष्ठिरः
      - संस्मृत्य मुनिसंदेशमिदं वचनमब्रवीत्
    iast: "kasyacittvatha kālasya dharmarājo yudhiṣṭhiraḥ | saṃsmṛtya munisaṃdeśamidaṃ vacanamabravīt"
  - id: 'vana-3-37-18'
    kind: verse
    lines:
      - दीक्षितं विधिना तेन यतवाक्कायमानसम्
      - अनुजज्ञे तदा वीरं भ्राता भ्रातरमग्रजः
    iast: "dīkṣitaṃ vidhinā tena yatavākkāyamānasam | anujajñe tadā vīraṃ bhrātā bhrātaramagrajaḥ"
  - id: 'vana-3-37-21'
    kind: verse
    lines:
      - प्रातिष्ठत महाबाहुः प्रगृहीतशरासनः
      - वधाय धार्तराष्ट्राणां निःश्वस्योर्ध्वमुदैक्षत
    iast: "prātiṣṭhata mahābāhuḥ pragṛhītaśarāsanaḥ | vadhāya dhārtarāṣṭrāṇāṃ niḥśvasyordhvamudaikṣata"
  - id: 'vana-3-38-22'
    kind: verse
    lines:
      - रमणीये वनोद्देशे रममाणोऽर्जुनस्तदा
      - तपस्युग्रे वर्तमान उग्रतेजा महामनाः
    iast: "ramaṇīye vanoddeśe ramamāṇo'rjunastadā | tapasyugre vartamāna ugratejā mahāmanāḥ"
  - id: 'vana-3-39-73'
    kind: verse
    lines:
      - स जानुभ्यां महीं गत्वा शिरसा प्रणिपत्य च
      - प्रसादयामास हरं पार्थः परपुरंजयः
      - अर्जुन उवाच
    iast: "sa jānubhyāṃ mahīṃ gatvā śirasā praṇipatya ca | prasādayāmāsa haraṃ pārthaḥ parapuraṃjayaḥ | arjuna uvāca"
  - id: 'vana-3-39-83'
    kind: verse
    lines:
      - तमुवाच महातेजाः प्रहसन्वृषभध्वजः
      - प्रगृह्य रुचिरं बाहुं क्षान्तमित्येव फल्गुनम्
    iast: "tamuvāca mahātejāḥ prahasanvṛṣabhadhvajaḥ | pragṛhya ruciraṃ bāhuṃ kṣāntamityeva phalgunam"
  - id: 'vana-3-40-15'
    kind: verse
    lines:
      - ददामि तेऽस्त्रं दयितमहं पाशुपतं विभो
      - समर्थो धारणे मोक्षे संहारेऽपि च पाण्डव
    iast: "dadāmi te'straṃ dayitamahaṃ pāśupataṃ vibho | samartho dhāraṇe mokṣe saṃhāre'pi ca pāṇḍava"
  - id: 'vana-3-40-21'
    kind: verse
    lines:
      - उपतस्थे महात्मानं यथा त्र्यक्षमुमापतिम्
      - प्रतिजग्राह तच्चापि प्रीतिमानर्जुनस्तदा
    iast: "upatasthe mahātmānaṃ yathā tryakṣamumāpatim | pratijagrāha taccāpi prītimānarjunastadā"
  - id: 'vana-3-41-48'
    kind: verse
    lines:
      - ततोऽर्जुनो महातेजा लोकपालान्समागतान्
      - पूजयामास विधिवद्वाग्भिरद्भिः फलैरपि
    iast: "tato'rjuno mahātejā lokapālānsamāgatān | pūjayāmāsa vidhivadvāgbhiradbhiḥ phalairapi"
  - id: 'vana-3-41-50'
    kind: verse
    lines:
      - ततो ऽर्जुनो मुदं लेभे लब्धास्त्रः पुरुषर्पभः
      - कृतार्थमथ चात्मानं स मेने पूर्णमानसम्
    iast: "tato 'rjuno mudaṃ lebhe labdhāstraḥ puruṣarpabhaḥ | kṛtārthamatha cātmānaṃ sa mene pūrṇamānasam"
  - id: 'vana-3-42-42'
    kind: verse
    lines:
      - एवं स संक्रमंस्तत्र स्वर्गलोके महायशाः ततो ददर्श शक्रस्य पुरीं ताममरावतीम्
    iast: "evaṃ sa saṃkramaṃstatra svargaloke mahāyaśāḥ tato dadarśa śakrasya purīṃ tāmamarāvatīm"
  - id: 'vana-3-43-16'
    kind: verse
    lines:
      - ततः पार्थो महाबाहुरवतीर्य रथोत्तमात्
      - ददर्श साक्षाद्देवेशं पितरं पाकशासनम्
    iast: "tataḥ pārtho mahābāhuravatīrya rathottamāt | dadarśa sākṣāddeveśaṃ pitaraṃ pākaśāsanam"
  - id: 'vana-3-43-37'
    kind: verse
    lines:
      - गृहीतास्त्रस्तु कौन्तेयो भ्रातॄन्सस्मार पाण्डवः
      - पुरंदरनियोगाच्च पञ्चाब्दानवसत्सुखी
    iast: "gṛhītāstrastu kaunteyo bhrātṝnsasmāra pāṇḍavaḥ | puraṃdaraniyogācca pañcābdānavasatsukhī"
  - id: 'vana-3-78-4'
    kind: verse
    lines:
      - गते तु पाण्डवेतात काम्यकात्सव्यसाचिनि
      - बभूवुः कौरवेयास्ते दुःखशोकपरायणाः
    iast: "gate tu pāṇḍavetāta kāmyakātsavyasācini | babhūvuḥ kauraveyāste duḥkhaśokaparāyaṇāḥ"
  - id: 'vana-3-78-7'
    kind: verse
    lines:
      - तमृते ते नरव्याघ्राः पाण्डवा जनमेजय
      - मुदमप्राप्नुवन्तो वै काम्यके न्यवसंस्तदा
    iast: "tamṛte te naravyāghrāḥ pāṇḍavā janamejaya | mudamaprāpnuvanto vai kāmyake nyavasaṃstadā"
  - id: 'vana-3-147-21'
    kind: verse
    lines:
      - तेऽवतीर्य बहून्देशानुत्तरांश्च कुरूनपि
      - ददृशुर्विविधाश्चर्यं कैलासं पर्वतोत्तमम्
    iast: "te'vatīrya bahūndeśānuttarāṃśca kurūnapi | dadṛśurvividhāścaryaṃ kailāsaṃ parvatottamam"
  - id: 'vana-3-147-22'
    kind: verse
    lines:
      - तस्याभ्याशे तु ददृशुर्नरनारायणाश्रमम्
      - उपेतं पादपैर्दिव्यैः सदापुष्पफलोपगैः
    iast: "tasyābhyāśe tu dadṛśurnaranārāyaṇāśramam | upetaṃ pādapairdivyaiḥ sadāpuṣpaphalopagaiḥ"
  - id: 'vana-3-148-1'
    kind: verse
    lines:
      - तत्र ते पुरुषव्याघ्राः परमं शौचमास्थिताः
      - षड्रात्रमवसन्वीरा धनंजयदिदृक्षया
    iast: "tatra te puruṣavyāghrāḥ paramaṃ śaucamāsthitāḥ | ṣaḍrātramavasanvīrā dhanaṃjayadidṛkṣayā"
  - id: 'vana-3-156-33'
    kind: verse
    lines:
      - विदिताश्चकुबेरस्य तत्रते कुरुपुङ्गवाः ऊषुर्नातिचिरं कालं रममाणाः कुरूद्वहाः
      - प्रतीक्षमाणआ बीभत्सुं गन्धमादनसानुषु
    iast: "viditāścakuberasya tatrate kurupuṅgavāḥ ūṣurnāticiraṃ kālaṃ ramamāṇāḥ kurūdvahāḥ | pratīkṣamāṇaā bībhatsuṃ gandhamādanasānuṣu"
  - id: 'vana-3-168-1'
    kind: verse
    lines:
      - यथागतं गते शक्रे भ्रातृभिः सह संगतः
      - कृष्णया चैव बीभत्सुर्धर्मराजमपूजयत्
    iast: "yathāgataṃ gate śakre bhrātṛbhiḥ saha saṃgataḥ | kṛṣṇayā caiva bībhatsurdharmarājamapūjayat"
  - id: 'vana-3-178-5'
    kind: verse
    lines:
      - समेत्य पार्थेन यथैकरात्रमूषुः समास्तत्रतथा चतस्रः
      - पूर्वाश्च षट् ता दश पाण्डवानां शिवा बभूवुर्वसतां वनेषु
    iast: "sametya pārthena yathaikarātramūṣuḥ samāstatratathā catasraḥ | pūrvāśca ṣaṭ tā daśa pāṇḍavānāṃ śivā babhūvurvasatāṃ vaneṣu"
  - id: 'vana-3-179-11'
    kind: verse
    lines:
      - ततः क्रमेणोपययुर्नृवीरा यथागतेनैव पथा समग्राः
      - विहृत्य मासं सुखिनो बदर्यां किरातराज्ञो विषयं सुबाहोः
    iast: "tataḥ krameṇopayayurnṛvīrā yathāgatenaiva pathā samagrāḥ | vihṛtya māsaṃ sukhino badaryāṃ kirātarājño viṣayaṃ subāhoḥ"
  - id: 'vana-3-179-12'
    kind: verse
    lines:
      - चीनांस्तुषारान्दरदांश्च सर्वान् देशान्कुलिन्दस्य च भूरिरम्यान्
      - अतीत्य दुर्गं हिमवत्प्रदेशं पुरं सुबाहोर्ददृशुर्नृवीराः
    iast: "cīnāṃstuṣārāndaradāṃśca sarvān deśānkulindasya ca bhūriramyān | atītya durgaṃ himavatpradeśaṃ puraṃ subāhordadṛśurnṛvīrāḥ"
  - id: 'vana-3-179-15'
    kind: verse
    lines:
      - सुखोपितास्तत्रत एकरात्रं सूतान्समादाय रथांश्च सर्वान्
      - घटोत्कचं सानुचरं विसृज्य ततोऽभ्ययुर्यामुनमद्रिराजम्
    iast: "sukhopitāstatrata ekarātraṃ sūtānsamādāya rathāṃśca sarvān | ghaṭotkacaṃ sānucaraṃ visṛjya tato'bhyayuryāmunamadrirājam"
  - id: 'vana-3-179-17'
    kind: verse
    lines:
      - वराहनानामृगपक्षिजुष्टं महावनं चैत्ररथप्रकाशम्
      - शिवेन यात्वा मृगयाप्रधानाः संवत्सरं तत्रवने विजह्रुः
    iast: "varāhanānāmṛgapakṣijuṣṭaṃ mahāvanaṃ caitrarathaprakāśam | śivena yātvā mṛgayāpradhānāḥ saṃvatsaraṃ tatravane vijahruḥ"
  - id: 'vana-3-179-20'
    kind: verse
    lines:
      - ते द्वादशं वर्षमथोपयान्तं वने विहुर्तुं कुरवः प्रतीताः
      - तस्माद्वनाच्चैत्ररथप्रकाशाच्छ्रिया ज्वलन्तस्तपसा च युक्ताः
    iast: "te dvādaśaṃ varṣamathopayāntaṃ vane vihurtuṃ kuravaḥ pratītāḥ | tasmādvanāccaitrarathaprakāśācchriyā jvalantastapasā ca yuktāḥ"
  - id: 'vana-3-179-21'
    kind: verse
    lines:
      - ततश्च यात्वा मरुधन्वपार्श्वं सदा धनुर्वेदरतिप्रधानाः
      - सरस्वतीमेत्य निवासकामाः सरस्ततो द्वैतवनं प्रतीयुः
    iast: "tataśca yātvā marudhanvapārśvaṃ sadā dhanurvedaratipradhānāḥ | sarasvatīmetya nivāsakāmāḥ sarastato dvaitavanaṃ pratīyuḥ"
  - id: 'vana-3-179-24'
    kind: verse
    lines:
      - तां यक्षगन्धर्वमहर्षिकान्तामावासभूतामिव देवतानाम्
      - सरस्वतीं प्रीतियुताश्चरन्तः सुखं विजह्रुर्नरदेवपुत्राः
    iast: "tāṃ yakṣagandharvamaharṣikāntāmāvāsabhūtāmiva devatānām | sarasvatīṃ prītiyutāścarantaḥ sukhaṃ vijahrurnaradevaputrāḥ"
  - id: 'vana-3-184-16'
    kind: verse
    lines:
      - तेषां पुण्यतमा रात्रिः पर्वसन्धौ स्म शारदी
      - तत्रैव वसतामासीत्कार्तिकी जनमेजय
    iast: "teṣāṃ puṇyatamā rātriḥ parvasandhau sma śāradī | tatraiva vasatāmāsītkārtikī janamejaya"
  - id: 'vana-3-184-18'
    kind: verse
    lines:
      - तमिस्राभ्युदये तस्मिन्धौम्येन सह पाण्डवाः सूतैः पौरोगवैः साकं काम्यकं प्रययुर्वनम्
    iast: "tamisrābhyudaye tasmindhaumyena saha pāṇḍavāḥ sūtaiḥ paurogavaiḥ sākaṃ kāmyakaṃ prayayurvanam"
  - id: 'vana-3-185-7'
    kind: verse
    lines:
      - मघवानिव पौलोम्या सहितः सत्यभामया
      - उपायाद्देवकीपुत्रो दिदृक्षुः कुरुसत्तमान्
    iast: "maghavāniva paulomyā sahitaḥ satyabhāmayā | upāyāddevakīputro didṛkṣuḥ kurusattamān"
  - id: 'vana-3-185-17'
    kind: verse
    lines:
      - धर्मः परः पाण्डव राज्यलाभात्तस्यादिमाहुस्तप एव राजन्
      - सत्यार्जवाभ्यां चरता स्वधर्मं जितस्त्वयाऽचं परश्च लोकः
    iast: "dharmaḥ paraḥ pāṇḍava rājyalābhāttasyādimāhustapa eva rājan | satyārjavābhyāṃ caratā svadharmaṃ jitastvayā'caṃ paraśca lokaḥ"
  - id: 'vana-3-185-33'
    kind: verse
    lines:
      - आवर्ततां कार्मुकवेगवाता हलायुधप्रग्रणा मधूनाम्
      - सेना तवार्थेषु नरेन्द्र यत्ता ससादिपत्त्यश्वरथा सनागा
    iast: "āvartatāṃ kārmukavegavātā halāyudhapragraṇā madhūnām | senā tavārtheṣu narendra yattā sasādipattyaśvarathā sanāgā"
  - id: 'vana-3-185-35'
    kind: verse
    lines:
      - कामं तथा तिष्ठ नरेन्द्र तस्मिन्यथा कृतस्ते समयः सभायाम्
      - दाशार्हयोधैस्तु हतारियोधं प्रतीक्षतां नागपुरं प्रभग्नम्
    iast: "kāmaṃ tathā tiṣṭha narendra tasminyathā kṛtaste samayaḥ sabhāyām | dāśārhayodhaistu hatāriyodhaṃ pratīkṣatāṃ nāgapuraṃ prabhagnam"
  - id: 'vana-3-185-38'
    kind: verse
    lines:
      - असंशयं केशव पाण्डवानां भवान्गतिस्त्वच्छरणा हि पार्थाः
      - कालोदये तच्च ततश्च भूयः कर्ता भवान्कर्म न संशयोस्ति
    iast: "asaṃśayaṃ keśava pāṇḍavānāṃ bhavāngatistvaccharaṇā hi pārthāḥ | kālodaye tacca tataśca bhūyaḥ kartā bhavānkarma na saṃśayosti"
  - id: 'vana-3-185-39'
    kind: verse
    lines:
      - यथाप्रतिज्ञं विहृतश्च कालः सर्वाः समा द्वादश निर्जनेषु
      - अज्ञातचर्यां विधिवत्समाप्य भवद्गताः केशव पाण्डवेयाः
    iast: "yathāpratijñaṃ vihṛtaśca kālaḥ sarvāḥ samā dvādaśa nirjaneṣu | ajñātacaryāṃ vidhivatsamāpya bhavadgatāḥ keśava pāṇḍaveyāḥ"
  - id: 'vana-3-236-18'
    kind: verse
    lines:
      - आरुरोह रथं शौरेः सत्यभामाऽथ भामिनी स्मयित्वातु यदुश्रेष्ठो द्रौपदीं परिसान्त्व्य च
      - उपावर्त्य ततः शीघ्रैर्हयैः प्रायात्परंतपः
    iast: "āruroha rathaṃ śaureḥ satyabhāmā'tha bhāminī smayitvātu yaduśreṣṭho draupadīṃ parisāntvya ca | upāvartya tataḥ śīghrairhayaiḥ prāyātparaṃtapaḥ"
  - id: 'vana-3-240-23'
    kind: verse
    lines:
      - अनुज्ञातस्तु गान्धारिः कर्णेन सहितस्तदा
      - निर्ययौ भरतश्रेष्ठो बलेन महता वृतः
    iast: "anujñātastu gāndhāriḥ karṇena sahitastadā | niryayau bharataśreṣṭho balena mahatā vṛtaḥ"
  - id: 'vana-3-240-24'
    kind: verse
    lines:
      - दुःशासनेन च तथा सौबलेन च धीमता
      - संवृतो भ्रातृभिश्चान्यैः स्त्रीभिश्चापि सहस्रशः
    iast: "duḥśāsanena ca tathā saubalena ca dhīmatā | saṃvṛto bhrātṛbhiścānyaiḥ strībhiścāpi sahasraśaḥ"
  - id: 'vana-3-241-1'
    kind: verse
    lines:
      - अथ दुर्योधनो राजा तत्रतत्र वने वसन्
      - जगाम घोषानभितस्तत्र चक्रे निवेशनम्
    iast: "atha duryodhano rājā tatratatra vane vasan | jagāma ghoṣānabhitastatra cakre niveśanam"
  - id: 'vana-3-241-15'
    kind: verse
    lines:
      - ऋद्ध्या परमया युक्तो महेन्द्र इव वज्रभृत्
      - यदृच्छया च तत्रस्थो धर्मपुत्रो युधिष्ठिरः
    iast: "ṛddhyā paramayā yukto mahendra iva vajrabhṛt | yadṛcchayā ca tatrastho dharmaputro yudhiṣṭhiraḥ"
  - id: 'vana-3-241-21'
    kind: verse
    lines:
      - प्रविशन्तं वनद्वारि गन्धर्वाः समवारयन् तत्र गन्धऱ्वराजो वै पूर्वमेव विशांपते
      - कुबेरभवनाद्राजन्नाजगाम गणावृतः
    iast: "praviśantaṃ vanadvāri gandharvāḥ samavārayan tatra gandhaऱvarājo vai pūrvameva viśāṃpate | kuberabhavanādrājannājagāma gaṇāvṛtaḥ"
  - id: 'vana-3-242-13'
    kind: verse
    lines:
      - आपतन्तीं तु संप्रेक्ष्य गन्धर्वाणां महाचमूम्
      - महता शरवर्षेण राधेयः प्रत्यवारयत्
    iast: "āpatantīṃ tu saṃprekṣya gandharvāṇāṃ mahācamūm | mahatā śaravarṣeṇa rādheyaḥ pratyavārayat"
  - id: 'vana-3-243-1'
    kind: verse
    lines:
      - गन्धर्वैस्तु महाराज भग्ने कर्णे महारथे
      - संप्राद्रवच्चमूः सर्वा धार्तराष्ट्रस्य पश्यतः
    iast: "gandharvaistu mahārāja bhagne karṇe mahārathe | saṃprādravaccamūḥ sarvā dhārtarāṣṭrasya paśyataḥ"
  - id: 'vana-3-243-6'
    kind: verse
    lines:
      - दुर्योधनं चित्रसनो विरथं पतितं भुवि
      - अभिद्रुस्य महाबाहुर्जीवग्राहमथाग्रहीत्
    iast: "duryodhanaṃ citrasano virathaṃ patitaṃ bhuvi | abhidrusya mahābāhurjīvagrāhamathāgrahīt"
  - id: 'vana-3-243-13'
    kind: verse
    lines:
      - दुःशासनो दुर्विषहो दुर्मुखो दुर्मुखो दुर्जयस्तथा
      - बद्ध्वा ह्रियन्ते गन्धर्वै राजदाराश्च सर्वशः
    iast: "duḥśāsano durviṣaho durmukho durmukho durjayastathā | baddhvā hriyante gandharvai rājadārāśca sarvaśaḥ"
  - id: 'vana-3-243-14'
    kind: verse
    lines:
      - इतिदुर्योधनामात्याः क्रोशन्तो राजगृद्धिनः
      - आर्ता दीनास्ततः सर्वे युधिष्ठिरमुपागमन्
    iast: "itiduryodhanāmātyāḥ krośanto rājagṛddhinaḥ | ārtā dīnāstataḥ sarve yudhiṣṭhiramupāgaman"
  - id: 'vana-3-243-17'
    kind: verse
    lines:
      - अस्माभिर्यदनुष्ठेयं गन्धर्वैस्तदनुष्ठितम्
    iast: "asmābhiryadanuṣṭheyaṃ gandharvaistadanuṣṭhitam"
  - id: 'vana-3-243-20'
    kind: verse
    lines:
      - दिष्ट्या लोके पुमानस्ति कश्चिदस्मन्प्रिये स्थितः
      - येनास्माकं हृतो भार आसीनानां सुखावहः
    iast: "diṣṭyā loke pumānasti kaścidasmanpriye sthitaḥ | yenāsmākaṃ hṛto bhāra āsīnānāṃ sukhāvahaḥ"
  - id: 'vana-3-243-24'
    kind: verse
    lines:
      - एवं ब्रुवाणं कौन्तेयं भीमसेनमपस्वरम् न कालः परुषस्यायमिति राजाऽभ्यभाषत
    iast: "evaṃ bruvāṇaṃ kaunteyaṃ bhīmasenamapasvaram na kālaḥ paruṣasyāyamiti rājā'bhyabhāṣata"
  - id: 'vana-3-244-2'
    kind: verse
    lines:
      - भवन्ति भेदा ज्ञातीनां कलहाश्च वृकोदर
      - प्रसक्तानि च वैराणि ज्ञातिधर्मो न नश्यति
    iast: "bhavanti bhedā jñātīnāṃ kalahāśca vṛkodara | prasaktāni ca vairāṇi jñātidharmo na naśyati"
  - id: 'vana-3-244-10'
    kind: verse
    lines:
      - एतानास्थाय वै यत्ता गन्धर्वान्योद्धुमाहवे
      - सुयोधनस्य मोक्षाय प्रयतध्वमतनद्रिताः
    iast: "etānāsthāya vai yattā gandharvānyoddhumāhave | suyodhanasya mokṣāya prayatadhvamatanadritāḥ"
  - id: 'vana-3-244-11'
    kind: verse
    lines:
      - परैः परिभवे प्राप्ते वयं पञ्चोत्तरं शतम् परस्परविरोधे तु वयं पञ्चैव ते शतम्
    iast: "paraiḥ paribhave prāpte vayaṃ pañcottaraṃ śatam parasparavirodhe tu vayaṃ pañcaiva te śatam"
  - id: 'vana-3-245-1'
    kind: verse
    lines:
      - युधिष्ठिरवचः श्रुत्वा भीमसेनपुरोगमाः
      - प्रहृष्टवदनाः सर्वे समुत्तस्थुर्नरर्षभाः
    iast: "yudhiṣṭhiravacaḥ śrutvā bhīmasenapurogamāḥ | prahṛṣṭavadanāḥ sarve samuttasthurnararṣabhāḥ"
  - id: 'vana-3-245-21'
    kind: verse
    lines:
      - ततः सुतुमुलं युद्धं गन्धर्वाणां तरस्विनाम् बभूव भीमवेगानां च भात
    iast: "tataḥ sutumulaṃ yuddhaṃ gandharvāṇāṃ tarasvinām babhūva bhīmavegānāṃ ca bhāta"
  - id: 'vana-3-247-1'
    kind: verse
    lines:
      - ततोऽर्जुनश्चित्रसेनं प्रहसन्निदमब्रवीत्
      - मध्ये गन्धर्वसैन्यानां महेष्वासो महाद्युतिः
    iast: "tato'rjunaścitrasenaṃ prahasannidamabravīt | madhye gandharvasainyānāṃ maheṣvāso mahādyutiḥ"
  - id: 'vana-3-247-2'
    kind: verse
    lines:
      - किं ते व्यवसितं वीर कौरवाणां विनिग्रहे
      - किमर्थं च सदारोऽयं निगृहीतः सुयोधनः
      - चित्रसेन उवाच
    iast: "kiṃ te vyavasitaṃ vīra kauravāṇāṃ vinigrahe | kimarthaṃ ca sadāro'yaṃ nigṛhītaḥ suyodhanaḥ | citrasena uvāca"
  - id: 'vana-3-247-4'
    kind: verse
    lines:
      - वनस्थान्भवतो ज्ञात्वा क्लिश्यमानाननर्हवत्
      - समस्थो विषमस्थांस्तान्द्रक्ष्यामीत्यनवस्थितान्
    iast: "vanasthānbhavato jñātvā kliśyamānānanarhavat | samastho viṣamasthāṃstāndrakṣyāmītyanavasthitān"
  - id: 'vana-3-247-5'
    kind: verse
    lines:
      - इमेऽवहसितुं प्राप्ता द्रौपदीं च यशस्विनीम्
      - ज्ञात्वा चिकीर्षितं चैषां मामुवाच सुरेश्वरः
    iast: "ime'vahasituṃ prāptā draupadīṃ ca yaśasvinīm | jñātvā cikīrṣitaṃ caiṣāṃ māmuvāca sureśvaraḥ"
  - id: 'vana-3-247-7'
    kind: verse
    lines:
      - स च प्रियः सखा तुभ्यं शिष्यश् तव पाण्डवः
      - वचनाद्देवराजस् ततोऽस्मीहागतो द्रुतम्
    iast: "sa ca priyaḥ sakhā tubhyaṃ śiṣyaś tava pāṇḍavaḥ | vacanāddevarājas tato'smīhāgato drutam"
  - id: 'vana-3-247-13'
    kind: verse
    lines:
      - अजातशत्रुस्तच्छ्रुत्वा गन्धर्वस्य वचस्तदा
      - मोक्षयामास तान्सर्वान्गन्धर्वान्प्रशशंस च
    iast: "ajātaśatrustacchrutvā gandharvasya vacastadā | mokṣayāmāsa tānsarvāngandharvānpraśaśaṃsa ca"
  - id: 'vana-3-247-26'
    kind: verse
    lines:
      - ततो दुर्योधनं मुक्तं भ्रातृभिः सहितस्तदा
      - युधिष्ठिरस्तु प्रणयादिदं वचनमब्रवीत्
    iast: "tato duryodhanaṃ muktaṃ bhrātṛbhiḥ sahitastadā | yudhiṣṭhirastu praṇayādidaṃ vacanamabravīt"
  - id: 'vana-3-247-27'
    kind: verse
    lines:
      - रमा स्म तात पुनः कार्षीरीदृशं साहसं क्वचित्
      - न हि साहसकर्तारः सुखमेघन्ति भारत
    iast: "ramā sma tāta punaḥ kārṣīrīdṛśaṃ sāhasaṃ kvacit | na hi sāhasakartāraḥ sukhameghanti bhārata"
  - id: 'vana-3-247-28'
    kind: verse
    lines:
      - स्वस्तिमान्सहितः सर्वैर्ब्रातृभिः कुरुनन्दन
      - गृहान्व्रज यथाकामं वैमनस्यं च मा कृथाः
      - वैशंपायन उवाच
    iast: "svastimānsahitaḥ sarvairbrātṛbhiḥ kurunandana | gṛhānvraja yathākāmaṃ vaimanasyaṃ ca mā kṛthāḥ | vaiśaṃpāyana uvāca"
  - id: 'vana-3-247-29'
    kind: verse
    lines:
      - पाण्डवेनाभ्यनुज्ञानो राजा दुर्योधनस्तदा अभिवाद्य धर्मपुत्रं गतेन्द्रिय इवातुरः
      - विदीर्यमाणो व्रीडावाञ्जगाम नगरं प्रति
    iast: "pāṇḍavenābhyanujñāno rājā duryodhanastadā abhivādya dharmaputraṃ gatendriya ivāturaḥ | vidīryamāṇo vrīḍāvāñjagāma nagaraṃ prati"
  - id: 'vana-3-312-3'
    kind: verse
    lines:
      - पुनर्द्वैतवनं रम्यमाजगाम युधिष्ठिरः
      - स्वादुमूलफलं रम्यं विचित्रबहुपादपम्
    iast: "punardvaitavanaṃ ramyamājagāma yudhiṣṭhiraḥ | svādumūlaphalaṃ ramyaṃ vicitrabahupādapam"
  - id: 'vana-3-312-11'
    kind: verse
    lines:
      - अजातशत्रुमासीनं भ्रातृभिः सहितं वने
      - आगम्य ब्राह्मणस्तूर्णं संतप्तश्चेदमब्रवीत्
    iast: "ajātaśatrumāsīnaṃ bhrātṛbhiḥ sahitaṃ vane | āgamya brāhmaṇastūrṇaṃ saṃtaptaścedamabravīt"
  - id: 'vana-3-312-12'
    kind: verse
    lines:
      - अरणीसहितं भाण्डं समासक्तं वनस्पतौ
      - मृगस्य घऱ्षमाणस्य विषाणे समसज्जत
    iast: "araṇīsahitaṃ bhāṇḍaṃ samāsaktaṃ vanaspatau | mṛgasya ghaऱṣamāṇasya viṣāṇe samasajjata"
  - id: 'vana-3-312-13'
    kind: verse
    lines:
      - तमादाय गतो राजंस्त्वरमाणो महामृगः
      - आश्रमात्त्वरितः शीघ्रं प्लवमानो महाजवः
    iast: "tamādāya gato rājaṃstvaramāṇo mahāmṛgaḥ | āśramāttvaritaḥ śīghraṃ plavamāno mahājavaḥ"
  - id: 'vana-3-312-14'
    kind: verse
    lines:
      - तस्य गत्वा पदं राजन्नासाद्य च महामृगम्
      - अग्निहोत्रं न लुप्येत तदानयत पाण्डवाः
    iast: "tasya gatvā padaṃ rājannāsādya ca mahāmṛgam | agnihotraṃ na lupyeta tadānayata pāṇḍavāḥ"
  - id: 'vana-3-312-16'
    kind: verse
    lines:
      - सन्नद्धा धन्विनः सर्वे प्राद्रवन्नरपुङ्गवाः
      - ब्राह्मणार्थे यतन्तस्ते शीघ्रमन्वगमन्मृगम्
    iast: "sannaddhā dhanvinaḥ sarve prādravannarapuṅgavāḥ | brāhmaṇārthe yatantaste śīghramanvagamanmṛgam"
  - id: 'vana-3-312-18'
    kind: verse
    lines:
      - तेषां प्रयतमानानां नादृश्यत महामृगः
      - अपश्यन्तोमृगं श्रान्ता दुःखं प्राप्ता मनस्विनः
    iast: "teṣāṃ prayatamānānāṃ nādṛśyata mahāmṛgaḥ | apaśyantomṛgaṃ śrāntā duḥkhaṃ prāptā manasvinaḥ"
  - id: 'vana-3-312-19'
    kind: verse
    lines:
      - शीतलच्छायमागमय् न्यग्रोधं गहने वने
      - क्षुत्पिपासापरीताङ्गाः पाण्डवाः समुपाविशन्
    iast: "śītalacchāyamāgamay nyagrodhaṃ gahane vane | kṣutpipāsāparītāṅgāḥ pāṇḍavāḥ samupāviśan"
  - id: 'vana-3-313-5'
    kind: verse
    lines:
      - ततो युधिष्ठिरो राजा नकुलं वाक्यमब्रवीत्
      - आरुह्य वृक्षं माद्रेय निरीक्षस्व दिशो दश
    iast: "tato yudhiṣṭhiro rājā nakulaṃ vākyamabravīt | āruhya vṛkṣaṃ mādreya nirīkṣasva diśo daśa"
  - id: 'vana-3-313-6'
    kind: verse
    lines:
      - पानीयमन्तिके पश्य वृक्षान्वाप्युदकाश्रयान्
      - एते हि भ्रातरः श्रान्तास्तव तात पिपासिताः
    iast: "pānīyamantike paśya vṛkṣānvāpyudakāśrayān | ete hi bhrātaraḥ śrāntāstava tāta pipāsitāḥ"
  - id: 'vana-3-313-10'
    kind: verse
    lines:
      - नकुलस्तु तथेत्युक्त्वा भ्रातुर्ज्येष्ठस्य शासनात्
      - प्राद्रवद्यत्र पानीयं शीघ्रं चैवान्वपद्यत
    iast: "nakulastu tathetyuktvā bhrāturjyeṣṭhasya śāsanāt | prādravadyatra pānīyaṃ śīghraṃ caivānvapadyata"
  - id: 'vana-3-313-11'
    kind: verse
    lines:
      - स दृष्ट्वा विमलं तोयं सारसैः परिवारितम्
      - पातुकामस्ततो वाचमन्तरिक्षात्स शुश्रुवे
      - यक्ष उवाच
    iast: "sa dṛṣṭvā vimalaṃ toyaṃ sārasaiḥ parivāritam | pātukāmastato vācamantarikṣātsa śuśruve | yakṣa uvāca"
  - id: 'vana-3-313-12'
    kind: verse
    lines:
      - मा तात साहसं कार्षीर्मम पूर्वपरिग्रहः
      - प्रश्नानुक्त्वा तु माद्रेय ततः पिब हरस्व च
    iast: "mā tāta sāhasaṃ kārṣīrmama pūrvaparigrahaḥ | praśnānuktvā tu mādreya tataḥ piba harasva ca"
  - id: 'vana-3-313-13'
    kind: verse
    lines:
      - अनादृत्य तु तद्वाक्यं नकुलः सुपिपासितः
      - अपिबच्छीतलं तोयं पीत्वा च निपपात ह
    iast: "anādṛtya tu tadvākyaṃ nakulaḥ supipāsitaḥ | apibacchītalaṃ toyaṃ pītvā ca nipapāta ha"
  - id: 'vana-3-313-25'
    kind: verse
    lines:
      - नापश्यत्तत्रकिंचित्स भूतमस्मिन्महावने
      - सव्यसाची पिपासार्तः पानीयं सोभ्यधावत
    iast: "nāpaśyattatrakiṃcitsa bhūtamasminmahāvane | savyasācī pipāsārtaḥ pānīyaṃ sobhyadhāvata"
  - id: 'vana-3-313-40'
    kind: verse
    lines:
      - एवमुक्तस्तदा भीमो यक्षेणामिततेजसा
      - अनुक्त्वैव तु तान्प्रश्नान्पीत्वैव निपपात ह
    iast: "evamuktastadā bhīmo yakṣeṇāmitatejasā | anuktvaiva tu tānpraśnānpītvaiva nipapāta ha"
  - id: 'vana-3-313-42'
    kind: verse
    lines:
      - ततश्चिरगतान्भ्रातृनथाऽऽज्ञाय युधिष्ठिरः
      - चिरायमाणान्बहुशः पुनः पुनरुवाचह
    iast: "tataściragatānbhrātṛnathā''jñāya yudhiṣṭhiraḥ | cirāyamāṇānbahuśaḥ punaḥ punaruvācaha"
  - id: 'vana-3-314-1'
    kind: verse
    lines:
      - स ददर्श हतान्भ्रातृँल्लोकपालानिव च्युतान्
      - युगान्ते समनुप्राप्ते शक्रवैश्रवणोपमान्
    iast: "sa dadarśa hatānbhrātṛm̐llokapālāniva cyutān | yugānte samanuprāpte śakravaiśravaṇopamān"
  - id: 'vana-3-314-29'
    kind: verse
    lines:
      - एतेन व्यवसायेन तत्तोयं व्यवगाढवान्
      - पातुकामश्च तत्तोयमन्तरिक्षात्स शुश्रुवे
      - यक्ष उवाच
    iast: "etena vyavasāyena tattoyaṃ vyavagāḍhavān | pātukāmaśca tattoyamantarikṣātsa śuśruve | yakṣa uvāca"
  - id: 'vana-3-314-44'
    kind: verse
    lines:
      - पार्थ मा साहसं कार्पीर्मम पूर्वपरिग्रहः
      - प्रश्नानुक्त्वा तु कौन्तेय ततःपिब हरस्व च
      - यूधिष्ठिर उवाच
    iast: "pārtha mā sāhasaṃ kārpīrmama pūrvaparigrahaḥ | praśnānuktvā tu kaunteya tataḥpiba harasva ca | yūdhiṣṭhira uvāca"
  - id: 'vana-3-314-46'
    kind: verse
    lines:
      - कामं नैतत्प्रसंसन्ति सन्तो हि पुरुषाः सदा यदात्मना स्वमात्मानं प्रशंसेत्पुरुषर्षभ
      - यथाप्रज्ञं तु ते प्रश्नान्प्रतिवक्ष्यामि पृच्छ माम्
      - यक्ष उवाच
    iast: "kāmaṃ naitatprasaṃsanti santo hi puruṣāḥ sadā yadātmanā svamātmānaṃ praśaṃsetpuruṣarṣabha | yathāprajñaṃ tu te praśnānprativakṣyāmi pṛccha mām | yakṣa uvāca"
  - id: 'vana-3-314-71'
    kind: verse
    lines:
      - किंस्विदेकपदं धर्म्यं किंस्विदेकपदं यशः
      - किंस्विदेकपदं स्वर्ग्यं किंस्विदेकपदं सुखम्
      - युधिष्ठिर उवाच
    iast: "kiṃsvidekapadaṃ dharmyaṃ kiṃsvidekapadaṃ yaśaḥ | kiṃsvidekapadaṃ svargyaṃ kiṃsvidekapadaṃ sukham | yudhiṣṭhira uvāca"
  - id: 'vana-3-314-72'
    kind: verse
    lines:
      - दाक्ष्यमेकपदं धर्म्यं दानमेकपदं यशः
      - सत्यमेकपदं स्वर्ग्यं शीलमेकपदंसुखम्
      - यक्ष उवाच
    iast: "dākṣyamekapadaṃ dharmyaṃ dānamekapadaṃ yaśaḥ | satyamekapadaṃ svargyaṃ śīlamekapadaṃsukham | yakṣa uvāca"
  - id: 'vana-3-314-73'
    kind: verse
    lines:
      - किंस्विदात्मा मनुष्यस् किंस्विद्दैवकृतः सखा
      - उपजीवनं किस्विदस् किंस्विदस्य परायणम्
      - युधिष्ठिर उवाच
    iast: "kiṃsvidātmā manuṣyas kiṃsviddaivakṛtaḥ sakhā | upajīvanaṃ kisvidas kiṃsvidasya parāyaṇam | yudhiṣṭhira uvāca"
  - id: 'vana-3-314-74'
    kind: verse
    lines:
      - पुत्र आत्मा मनुष्यस्य भार्या दैवकृतः सखा
      - उपजीवनं च पर्जन्यो दानमस् परायणम्
      - यक्ष उवाच
    iast: "putra ātmā manuṣyasya bhāryā daivakṛtaḥ sakhā | upajīvanaṃ ca parjanyo dānamas parāyaṇam | yakṣa uvāca"
  - id: 'vana-3-314-75'
    kind: verse
    lines:
      - धन्यानामुत्तमं किंस्विद्धनानां स्यात्किमुत्तमम्
      - लाभानामुत्तमं किंस्यात्सुखानां स्यात्किमुत्तमं
    iast: "dhanyānāmuttamaṃ kiṃsviddhanānāṃ syātkimuttamam | lābhānāmuttamaṃ kiṃsyātsukhānāṃ syātkimuttamaṃ"
  - id: 'vana-3-314-76'
    kind: verse
    lines:
      - धन्यानामुत्तमं दाक्ष्यंधनानामुत्तमं श्रुतम्
      - लाभानां श्रेय आरोग्यं सुखानां तुष्टिरुत्तमा
      - यक्ष उवाच
    iast: "dhanyānāmuttamaṃ dākṣyaṃdhanānāmuttamaṃ śrutam | lābhānāṃ śreya ārogyaṃ sukhānāṃ tuṣṭiruttamā | yakṣa uvāca"
  - id: 'vana-3-314-77'
    kind: verse
    lines:
      - किंस्विद्धर्मपरंलके कश्च धर्मः सदाफलः
      - किं नियम्य न शोचन्ति कैश् सन्धिर्न जीर्यते
      - युधिष्ठिर उवाच
    iast: "kiṃsviddharmaparaṃlake kaśca dharmaḥ sadāphalaḥ | kiṃ niyamya na śocanti kaiś sandhirna jīryate | yudhiṣṭhira uvāca"
  - id: 'vana-3-314-78'
    kind: verse
    lines:
      - आनृशंस्यं परं धर्मात्रेताधर्मः सदाफलः
      - मनो यम्य न शोचन्ति सन्धिः सद्भिर्न जीर्यते
      - यक्ष उवाच
    iast: "ānṛśaṃsyaṃ paraṃ dharmātretādharmaḥ sadāphalaḥ | mano yamya na śocanti sandhiḥ sadbhirna jīryate | yakṣa uvāca"
  - id: 'vana-3-314-79'
    kind: verse
    lines:
      - किंनु हित्वाप्रियो भवति किंनु हित्वा न शोचति
      - किंनु हित्वाऽर्थवान्भवति किंनु हित्वा सुखी भवेत्
      - युधिष्ठिर उवाच
    iast: "kiṃnu hitvāpriyo bhavati kiṃnu hitvā na śocati | kiṃnu hitvā'rthavānbhavati kiṃnu hitvā sukhī bhavet | yudhiṣṭhira uvāca"
  - id: 'vana-3-314-80'
    kind: verse
    lines:
      - मानं हित्वाप्रियो भवति क्रोधं हित्वा न शोचति
      - कामं हित्वाऽर्थवान्भवति लोमं हित्वा सुखी भवेत्
      - यक्ष उवाच
    iast: "mānaṃ hitvāpriyo bhavati krodhaṃ hitvā na śocati | kāmaṃ hitvā'rthavānbhavati lomaṃ hitvā sukhī bhavet | yakṣa uvāca"
  - id: 'vana-3-314-89'
    kind: verse
    lines:
      - तपः किंलक्षणं प्रोक्तं को दमश्च प्रकीर्तितः
      - क्षमा च का परा प्रोक्ता का च ह्रीः परिकीर्तिता
      - युधिष्ठिर उवाच
    iast: "tapaḥ kiṃlakṣaṇaṃ proktaṃ ko damaśca prakīrtitaḥ | kṣamā ca kā parā proktā kā ca hrīḥ parikīrtitā | yudhiṣṭhira uvāca"
  - id: 'vana-3-314-90'
    kind: verse
    lines:
      - तपः स्वधर्मवर्तित्वं मनसो दमनं दमः
      - क्षमा द्वन्द्वसहिष्णुत्वंहीरकार्यनिवर्तनम्
      - यक्ष उवाच
    iast: "tapaḥ svadharmavartitvaṃ manaso damanaṃ damaḥ | kṣamā dvandvasahiṣṇutvaṃhīrakāryanivartanam | yakṣa uvāca"
  - id: 'vana-3-314-91'
    kind: verse
    lines:
      - किं ज्ञानं प्रोच्यते राजन्कः शमश्च प्रकीर्तितः
      - दया च का परा प्रोक्ता किं चार्जवमुदाहृतम्
      - युधिष्ठिर उवाच
    iast: "kiṃ jñānaṃ procyate rājankaḥ śamaśca prakīrtitaḥ | dayā ca kā parā proktā kiṃ cārjavamudāhṛtam | yudhiṣṭhira uvāca"
  - id: 'vana-3-314-92'
    kind: verse
    lines:
      - ज्ञानं तत्त्वार्थसम्बोधः शमश्चित्तप्रशान्तता
      - दयासर्वसुखैपित्वमार्जवं समचित्तता
      - यक्ष उवाच
    iast: "jñānaṃ tattvārthasambodhaḥ śamaścittapraśāntatā | dayāsarvasukhaipitvamārjavaṃ samacittatā | yakṣa uvāca"
  - id: 'vana-3-314-93'
    kind: verse
    lines:
      - कः शत्रुर्दुर्जयः पुंसां कश्चव्याधिरनन्तकः
      - कीदृशश्च स्मृतः साधुरसाधुः कीदृशः स्मृतः
      - युधिष्ठिर उवाच
    iast: "kaḥ śatrurdurjayaḥ puṃsāṃ kaścavyādhiranantakaḥ | kīdṛśaśca smṛtaḥ sādhurasādhuḥ kīdṛśaḥ smṛtaḥ | yudhiṣṭhira uvāca"
  - id: 'vana-3-314-94'
    kind: verse
    lines:
      - क्रोधः सुदुर्जयः शत्रुर्लोभोव्याधिरनन्तकः
      - सर्वभूतहितः साधुरसाधुर्निर्दयः स्मृतः
      - यक्ष उवाच
    iast: "krodhaḥ sudurjayaḥ śatrurlobhovyādhiranantakaḥ | sarvabhūtahitaḥ sādhurasādhurnirdayaḥ smṛtaḥ | yakṣa uvāca"
  - id: 'vana-3-314-97'
    kind: verse
    lines:
      - किं स्थैर्यमृषिभिः प्रोक्तं किं च धैर्यमुदाहृतम्
      - स्नानं च किं परं प्रोक्तं दानं च किमिहोच्यते
      - युधिष्ठि उवाच
    iast: "kiṃ sthairyamṛṣibhiḥ proktaṃ kiṃ ca dhairyamudāhṛtam | snānaṃ ca kiṃ paraṃ proktaṃ dānaṃ ca kimihocyate | yudhiṣṭhi uvāca"
  - id: 'vana-3-314-98'
    kind: verse
    lines:
      - स्वधर्मे स्थिरता स्थैर्यं धैर्यमिन्द्रियनिग्रहः
      - स्नानं मनोमलत्यागो दानं वै भूतरक्षणम्
      - यक्ष उवाच
    iast: "svadharme sthiratā sthairyaṃ dhairyamindriyanigrahaḥ | snānaṃ manomalatyāgo dānaṃ vai bhūtarakṣaṇam | yakṣa uvāca"
  - id: 'vana-3-314-116'
    kind: verse
    lines:
      - कोमोदतेकिमाश्चर्यं कः पन्थाः का च वार्तिका
      - वद मे चतुरः प्रश्नान्मृता जीवन्तु बान्धवाः
      - युधिष्ठिर उवाच
    iast: "komodatekimāścaryaṃ kaḥ panthāḥ kā ca vārtikā | vada me caturaḥ praśnānmṛtā jīvantu bāndhavāḥ | yudhiṣṭhira uvāca"
  - id: 'vana-3-314-118'
    kind: verse
    lines:
      - अहन्यहनि भूतानि गच्छन्तीह यमालयम्
      - शेषाः स्थावरमिच्छन्ति किमाश्चर्यमतः परम्
    iast: "ahanyahani bhūtāni gacchantīha yamālayam | śeṣāḥ sthāvaramicchanti kimāścaryamataḥ param"
  - id: 'vana-3-314-121'
    kind: verse
    lines:
      - व्याख्याता मे त्वया प्रश्ना यथातत्वं परंतप
      - पुरुषं त्विदानींव्याख्याहि यश्च सर्वधनी नरः
      - युधिष्टिर उवाच
    iast: "vyākhyātā me tvayā praśnā yathātatvaṃ paraṃtapa | puruṣaṃ tvidānīṃvyākhyāhi yaśca sarvadhanī naraḥ | yudhiṣṭira uvāca"
  - id: 'vana-3-314-125'
    kind: verse
    lines:
      - व्याख्यातः पुरुषो राजन्यश्च सर्वधनी नरः
      - तस्मात्त्वमेकं भ्रातृणां यमिच्छसि स जीवतु
      - युधिष्ठिर उवाच
    iast: "vyākhyātaḥ puruṣo rājanyaśca sarvadhanī naraḥ | tasmāttvamekaṃ bhrātṛṇāṃ yamicchasi sa jīvatu | yudhiṣṭhira uvāca"
  - id: 'vana-3-314-126'
    kind: verse
    lines:
      - श्यामो य एष रक्ताक्षो बृहत्साल इवोत्थितः
      - व्यूढोरस्को महाबाहुर्नकुलो यक्ष जीवतु
      - यक्ष उवाच
    iast: "śyāmo ya eṣa raktākṣo bṛhatsāla ivotthitaḥ | vyūḍhorasko mahābāhurnakulo yakṣa jīvatu | yakṣa uvāca"
  - id: 'vana-3-314-127'
    kind: verse
    lines:
      - प्रियस्ते भीमसेनोऽयमर्जुनो वः परायणम्
      - त्वं कस्मान्नकुलं राजन्सापत्नं जीवमिच्छसि
    iast: "priyaste bhīmaseno'yamarjuno vaḥ parāyaṇam | tvaṃ kasmānnakulaṃ rājansāpatnaṃ jīvamicchasi"
  - id: 'vana-3-314-132'
    kind: verse
    lines:
      - आनृशंस्यं परो धर्मः परमार्थाच्चमे मतम्
      - आनृशंस्यं चिकीर्षामि नकुलो यक्ष जीवतु
    iast: "ānṛśaṃsyaṃ paro dharmaḥ paramārthāccame matam | ānṛśaṃsyaṃ cikīrṣāmi nakulo yakṣa jīvatu"
  - id: 'vana-3-314-134'
    kind: verse
    lines:
      - कुन्ती चैव तु माद्री च द्वे भार्ये तु पितुर्मम
      - उभे सपुत्रे स्यातां वै इतिमे धीयते मतिः
    iast: "kuntī caiva tu mādrī ca dve bhārye tu piturmama | ubhe saputre syātāṃ vai itime dhīyate matiḥ"
  - id: 'vana-3-314-136'
    kind: verse
    lines:
      - यस् तेऽर्थाच्च कामच्च आनृशंस्यं परं मतम्
      - तस्मात्ते भ्रातरः सर्वे जीवन्तु भरतर्षभ
    iast: "yas te'rthācca kāmacca ānṛśaṃsyaṃ paraṃ matam | tasmātte bhrātaraḥ sarve jīvantu bharatarṣabha"
  - id: 'vana-3-315-6'
    kind: verse
    lines:
      - अहंते जनकस्तात धर्मो मृदुपराक्रम
      - त्वां रदिदृक्षुरनुप्राप्तो विद्धि मां भरतर्षभ
    iast: "ahaṃte janakastāta dharmo mṛduparākrama | tvāṃ radidṛkṣuranuprāpto viddhi māṃ bharatarṣabha"
  - id: 'vana-3-315-13'
    kind: verse
    lines:
      - आरणेयमिदं तस्य ब्राह्मणस्य हृतं मया
      - मृगवेषेण कौन्तेय जिज्ञालार्थं तवानघ
      - वैशंपायन उवाच
    iast: "āraṇeyamidaṃ tasya brāhmaṇasya hṛtaṃ mayā | mṛgaveṣeṇa kaunteya jijñālārthaṃ tavānagha | vaiśaṃpāyana uvāca"
  - id: 'vana-3-315-15'
    kind: verse
    lines:
      - वर्षाणि द्वादशारण्ये त्रयोदशमुपस्थितम्
      - तत्रनो नाभिजानीयुर्वसतो मनुजाः क्वचित्
    iast: "varṣāṇi dvādaśāraṇye trayodaśamupasthitam | tatrano nābhijānīyurvasato manujāḥ kvacit"
  - id: 'vana-3-315-18'
    kind: verse
    lines:
      - वर्षंत्रयोदशमिदं मत्प्रसादात्कुरूद्वहाः
      - विराटनगरे गूढा अविज्ञाताश्चरिष्यथ
    iast: "varṣaṃtrayodaśamidaṃ matprasādātkurūdvahāḥ | virāṭanagare gūḍhā avijñātāścariṣyatha"
  - id: 'vana-3-315-19'
    kind: verse
    lines:
      - यद्वः संकल्पितं रूपं मनसा यस् यादृशम्
      - तादृशं तादृशं सर्वे छन्दतो धारयिष्यथ
    iast: "yadvaḥ saṃkalpitaṃ rūpaṃ manasā yas yādṛśam | tādṛśaṃ tādṛśaṃ sarve chandato dhārayiṣyatha"
  - id: 'vana-3-315-20'
    kind: verse
    lines:
      - अरणीसहितं भाण्डं ब्राह्मणाय प्रयच्छत
      - जिज्ञासार्थं मया ह्येतदाहृतंमृगरूपिणा
    iast: "araṇīsahitaṃ bhāṇḍaṃ brāhmaṇāya prayacchata | jijñāsārthaṃ mayā hyetadāhṛtaṃmṛgarūpiṇā"
  - id: 'vana-3-315-26'
    kind: verse
    lines:
      - इत्युक्त्वान्तऽर्दधे धर्मो भगबाँल्लोकभावनः
      - समेताः पाण्डवाश्चैव सुखसुप्ता मनस्विनः
    iast: "ityuktvānta'rdadhe dharmo bhagabām̐llokabhāvanaḥ | sametāḥ pāṇḍavāścaiva sukhasuptā manasvinaḥ"
  - id: 'vana-3-315-27'
    kind: verse
    lines:
      - उपेत्यचाश्रमं वीराः सर्व एव गतक्लमाः
      - आरणेयं ददुस्तस्मै ब्राह्मणाय तपस्विने
    iast: "upetyacāśramaṃ vīrāḥ sarva eva gataklamāḥ | āraṇeyaṃ dadustasmai brāhmaṇāya tapasvine"
  - id: 'virata-4-1-10'
    kind: verse
    lines:
      - धर्मेण तेऽभ्यनुज्ञाताः पाण्डवाः सत्यविक्रमाः
      - अज्ञातवासं वत्स्यन्तश्छन्ना वर्षं त्रयोदशम्
    iast: "dharmeṇa te'bhyanujñātāḥ pāṇḍavāḥ satyavikramāḥ | ajñātavāsaṃ vatsyantaśchannā varṣaṃ trayodaśam"
  - id: 'virata-4-1-50'
    kind: verse
    lines:
      - पृथक् शास्त्रविदः सर्वे सर्वे मन्त्रविशारदाः
      - सन्धिविग्रहतत्वज्ञा मन्त्राय समुपाविशन्
    iast: "pṛthak śāstravidaḥ sarve sarve mantraviśāradāḥ | sandhivigrahatatvajñā mantrāya samupāviśan"
  - id: 'virata-4-2-22'
    kind: verse
    lines:
      - विराटं समनुप्राप्य राजानं मात्स्यनन्दनम्
      - सभास्तारो भविष्यामि विराटस्येति मे मतिः
    iast: "virāṭaṃ samanuprāpya rājānaṃ mātsyanandanam | sabhāstāro bhaviṣyāmi virāṭasyeti me matiḥ"
  - id: 'virata-4-2-23'
    kind: verse
    lines:
      - कङ्को नाम ब्रुवाणोऽहं मताक्षः साधुदेविता
      - वैडूर्यान्काञ्चनान्दानान्स्फाटिकान्राजतानपि
    iast: "kaṅko nāma bruvāṇo'haṃ matākṣaḥ sādhudevitā | vaiḍūryānkāñcanāndānānsphāṭikānrājatānapi"
  - id: 'virata-4-3-8'
    kind: verse
    lines:
      - सूदोऽहं वललो नाम्ना सूपकारो नराधिप
      - उपस्थास्यामि राजानं विराटमिति रोचये
    iast: "sūdo'haṃ valalo nāmnā sūpakāro narādhipa | upasthāsyāmi rājānaṃ virāṭamiti rocaye"
  - id: 'virata-4-3-44'
    kind: verse
    lines:
      - उभौ कम्बू प्रतीमुच्य कुण्डले परिपातुके
      - वेणीकृतशिरा भूत्वा भविष्यामि बृहन्नला
    iast: "ubhau kambū pratīmucya kuṇḍale paripātuke | veṇīkṛtaśirā bhūtvā bhaviṣyāmi bṛhannalā"
  - id: 'virata-4-3-46'
    kind: verse
    lines:
      - नृत्तं गीतं च वादित्रं दिव्यं च विविधं तथा
      - शिक्षयिष्याम्यहं राजन्विराटनगरे स्त्रियः
    iast: "nṛttaṃ gītaṃ ca vāditraṃ divyaṃ ca vividhaṃ tathā | śikṣayiṣyāmyahaṃ rājanvirāṭanagare striyaḥ"
  - id: 'virata-4-4-5'
    kind: verse
    lines:
      - अश्वाध्यक्षो भविष्यामि विराटस्येति मे मतिः
      - दामग्रन्थीति नाम्नाऽहं कर्मैतत्सुप्रियं मम
    iast: "aśvādhyakṣo bhaviṣyāmi virāṭasyeti me matiḥ | dāmagranthīti nāmnā'haṃ karmaitatsupriyaṃ mama"
  - id: 'virata-4-4-15'
    kind: verse
    lines:
      - गोसङ्ख्याता भविष्यामि विराटस्येति रोचये प्रतिभोक्ता च दोग्धा च सङ्ख्यानकुशलो गवाम्
      - तन्त्रीपालेति मे नाम स्वयं प्रोक्तं भविष्यति
    iast: "gosaṅkhyātā bhaviṣyāmi virāṭasyeti rocaye pratibhoktā ca dogdhā ca saṅkhyānakuśalo gavām | tantrīpāleti me nāma svayaṃ proktaṃ bhaviṣyati"
  - id: 'virata-4-4-32'
    kind: verse
    lines:
      - साऽहं ब्रुवाणा सैरन्ध्री कुशला केशकर्मणि
      - प्रमदाहरिका लोके पुरुषाणां प्रवासिनाम्
    iast: "sā'haṃ bruvāṇā sairandhrī kuśalā keśakarmaṇi | pramadāharikā loke puruṣāṇāṃ pravāsinām"
  - id: 'virata-4-4-35'
    kind: verse
    lines:
      - सुदेष्णां प्रत्युपस्थास्ये राजभार्यां यशस्विनीम्
      - सा रक्षिष्यति मां प्राप्तां मा ते भूद्दुःखमीदृशम्
    iast: "sudeṣṇāṃ pratyupasthāsye rājabhāryāṃ yaśasvinīm | sā rakṣiṣyati māṃ prāptāṃ mā te bhūdduḥkhamīdṛśam"
  - id: 'virata-4-6-8'
    kind: verse
    lines:
      - ते तस्या दक्षिणं तीरमन्वगच्छन्पदातयः
      - ततः प्रत्यक्प्रयातास्ते संक्रामन्तो वनाद्वनम्
    iast: "te tasyā dakṣiṇaṃ tīramanvagacchanpadātayaḥ | tataḥ pratyakprayātāste saṃkrāmanto vanādvanam"
  - id: 'virata-4-6-12'
    kind: verse
    lines:
      - विध्यन्तो मृगजातानि महेप्वासा महाबलाः उपित्वा द्वादशसमा वने परपुरंजयाः
      - लुब्धान्ब्रुवाणा मात्स्यस्य विपयं प्राविशंस्तदा
    iast: "vidhyanto mṛgajātāni mahepvāsā mahābalāḥ upitvā dvādaśasamā vane parapuraṃjayāḥ | lubdhānbruvāṇā mātsyasya vipayaṃ prāviśaṃstadā"
  - id: 'virata-4-7-8'
    kind: verse
    lines:
      - इयं वने मनुष्येन्द्र महती दृश्यते शमी
      - भीमशाखा दुरारोहा श्मशानस्य समीपतः
    iast: "iyaṃ vane manuṣyendra mahatī dṛśyate śamī | bhīmaśākhā durārohā śmaśānasya samīpataḥ"
  - id: 'virata-4-7-13'
    kind: verse
    lines:
      - धनुर्भिः पुरुषं कृत्वा चर्मकेशास्थिसंवृतम् उद्बन्धमिव कृत्वा च धनुर्ज्यापाशसंवृतम्
      - अस्यामायुधमासज्य गच्छाम नगरं वयम्
    iast: "dhanurbhiḥ puruṣaṃ kṛtvā carmakeśāsthisaṃvṛtam udbandhamiva kṛtvā ca dhanurjyāpāśasaṃvṛtam | asyāmāyudhamāsajya gacchāma nagaraṃ vayam"
  - id: 'virata-4-7-57'
    kind: verse
    lines:
      - वैशंपायन उवाच
      - दैवतेभ्यो नमस्कृत्य शमीं कृत्वा प्रदक्षिणम्
      - नगरं गन्तुमायाताः सर्वे ते भ्रातरः सह
    iast: "vaiśaṃpāyana uvāca | daivatebhyo namaskṛtya śamīṃ kṛtvā pradakṣiṇam | nagaraṃ gantumāyātāḥ sarve te bhrātaraḥ saha"
  - id: 'virata-4-7-64'
    kind: verse
    lines:
      - युधिष्ठिरश्च कृष्णा च राजपत्नी सुमध्यमा
      - ततो यथासमाज्ञप्तं नगरं प्राविशंस्तदा
    iast: "yudhiṣṭhiraśca kṛṣṇā ca rājapatnī sumadhyamā | tato yathāsamājñaptaṃ nagaraṃ prāviśaṃstadā"
  - id: 'virata-4-15-63'
    kind: verse
    lines:
      - एवं ते न्यवसंस्तत्र प्रच्छन्नाः पुरुषर्षभाः
      - कर्माणि तस्य कुर्वाणा विराटनृपतेस्तदा
    iast: "evaṃ te nyavasaṃstatra pracchannāḥ puruṣarṣabhāḥ | karmāṇi tasya kurvāṇā virāṭanṛpatestadā"
  - id: 'virata-4-16-4'
    kind: verse
    lines:
      - तस्मिन्वर्षे गतप्राये कीचकस्तु महाबलः
      - सेनापतिर्विराटस्य ददर्श द्रुपदात्मजाम्
    iast: "tasminvarṣe gataprāye kīcakastu mahābalaḥ | senāpatirvirāṭasya dadarśa drupadātmajām"
  - id: 'virata-4-20-17'
    kind: verse
    lines:
      - येषां न वैरी स्वपिति पदा भूमिमुपस्पृशन्
      - तेषां मां मानिनीं भार्यां सूतपुत्रः पदाऽवधीत्
    iast: "yeṣāṃ na vairī svapiti padā bhūmimupaspṛśan | teṣāṃ māṃ māninīṃ bhāryāṃ sūtaputraḥ padā'vadhīt"
  - id: 'virata-4-26-37'
    kind: verse
    lines:
      - गृहीत्वा कीचकं भीमो विरराज महाबलः
      - आमिषार्थे गृहीत्वैव शार्दूलो मृगयूथपम्
    iast: "gṛhītvā kīcakaṃ bhīmo virarāja mahābalaḥ | āmiṣārthe gṛhītvaiva śārdūlo mṛgayūthapam"
  - id: 'virata-4-29-6'
    kind: verse
    lines:
      - अथ वैः धार्तराष्ट्रेण प्रयुक्ता ये बहिश्चराः
      - मृगयित्वा बहून्देशान्ग्रामांश्च नगराणि च
    iast: "atha vaiḥ dhārtarāṣṭreṇa prayuktā ye bahiścarāḥ | mṛgayitvā bahūndeśāngrāmāṃśca nagarāṇi ca"
  - id: 'virata-4-29-8'
    kind: verse
    lines:
      - आगम्य हास्तिनपुरं धार्तराष्ट्रमरिन्दमम्
      - तत्र दृष्ट्वा तु राजानं कौरव्यं धृतराष्ट्रजम्
    iast: "āgamya hāstinapuraṃ dhārtarāṣṭramarindamam | tatra dṛṣṭvā tu rājānaṃ kauravyaṃ dhṛtarāṣṭrajam"
  - id: 'virata-4-29-24'
    kind: verse
    lines:
      - सर्वा च पृथिवी कृत्स्ना सशैलवनकानना सराष्ट्रनगरग्रामा पत्तनैश्च समन्विता
      - अन्वेषिता च सर्वत्र न च पश्यामा पाण्डवान्
    iast: "sarvā ca pṛthivī kṛtsnā saśailavanakānanā sarāṣṭranagaragrāmā pattanaiśca samanvitā | anveṣitā ca sarvatra na ca paśyāmā pāṇḍavān"
  - id: 'virata-4-29-27'
    kind: verse
    lines:
      - येन त्रिगर्ता निहता बलेन बहुशो नृप सूतेन राज्ञो मत्स्यस्य कीचकेन बलीयसा
      - स हतः पतितः शेते गन्धर्वैर्निशि भारत
    iast: "yena trigartā nihatā balena bahuśo nṛpa sūtena rājño matsyasya kīcakena balīyasā | sa hataḥ patitaḥ śete gandharvairniśi bhārata"
  - id: 'virata-4-29-32'
    kind: verse
    lines:
      - स हतो निशि गन्धैर्वः स्त्रीनिमित्तं नराधिप अमृष्यमाणो दुष्टात्मा निशीथे सह सोदरैः
      - सुहृदश्चास्य निहता योधाश्च प्रहरैर्हताः
    iast: "sa hato niśi gandhairvaḥ strīnimittaṃ narādhipa amṛṣyamāṇo duṣṭātmā niśīthe saha sodaraiḥ | suhṛdaścāsya nihatā yodhāśca praharairhatāḥ"
  - id: 'virata-4-30-7'
    kind: verse
    lines:
      - अज्ञातसमये ज्ञाताः कृच्छ्ररूपसमाश्रिताः
      - प्रविशेयुर्जितक्रोधास्तावदेव पुनर्वनम्
    iast: "ajñātasamaye jñātāḥ kṛcchrarūpasamāśritāḥ | praviśeyurjitakrodhāstāvadeva punarvanam"
  - id: 'virata-4-32-23'
    kind: verse
    lines:
      - शङ्के कृष्णानिमित्तं तु भीमसेनेन कीचकः
      - गन्धर्वव्यपदेशेन हतो निशि महाबलः
    iast: "śaṅke kṛṣṇānimittaṃ tu bhīmasenena kīcakaḥ | gandharvavyapadeśena hato niśi mahābalaḥ"
  - id: 'virata-4-32-28'
    kind: verse
    lines:
      - विराटनगरे मन्ये पाण्डवाश्छन्नचारिणः
      - निवसन्ति पुरे रम्ये तत्र यात्रा विधीयताम्
    iast: "virāṭanagare manye pāṇḍavāśchannacāriṇaḥ | nivasanti pure ramye tatra yātrā vidhīyatām"
  - id: 'virata-4-32-29'
    kind: verse
    lines:
      - मत्स्यराष्ट्रं गमिष्यामो ग्रहीष्यामश्च गोधनम्
      - गृहीते गोधने नूनं तेऽपि योत्स्यन्ति पाण्डवाः
    iast: "matsyarāṣṭraṃ gamiṣyāmo grahīṣyāmaśca godhanam | gṛhīte godhane nūnaṃ te'pi yotsyanti pāṇḍavāḥ"
  - id: 'virata-4-32-62'
    kind: verse
    lines:
      - ते स्म गत्वा यथोद्दिष्टं देशं मत्स्यमहीपतेः संनद्धा रथिनः सर्वे सपताका बलोत्कटाः
      - प्रतिवैरं चिकीर्षन्तो गोषु गृद्धा महाबलाः
    iast: "te sma gatvā yathoddiṣṭaṃ deśaṃ matsyamahīpateḥ saṃnaddhā rathinaḥ sarve sapatākā balotkaṭāḥ | prativairaṃ cikīrṣanto goṣu gṛddhā mahābalāḥ"
  - id: 'virata-4-32-64'
    kind: verse
    lines:
      - अपरे दिवसे सर्वे राजन्संभूय कौरवाः नवम्यां ते न्यगृह्णन्त गोकुलानि सहस्रशः
      - कौरवास्तु महावीर्या मत्स्यानां विषयान्तरे
    iast: "apare divase sarve rājansaṃbhūya kauravāḥ navamyāṃ te nyagṛhṇanta gokulāni sahasraśaḥ | kauravāstu mahāvīryā matsyānāṃ viṣayāntare"
  - id: 'virata-4-33-16'
    kind: verse
    lines:
      - श्रुत्वा तु वचनं तेषां गोपालानामरिंदमः स राजा महतीं सेनां मात्स्यानां समवाहयत्
      - रथनागाश्वकलिलां पत्तिध्वजसमाकुलाम्
    iast: "śrutvā tu vacanaṃ teṣāṃ gopālānāmariṃdamaḥ sa rājā mahatīṃ senāṃ mātsyānāṃ samavāhayat | rathanāgāśvakalilāṃ pattidhvajasamākulām"
  - id: 'virata-4-34-18'
    kind: verse
    lines:
      - युधिष्ठिरोऽपि धर्मात्मा भ्रातृभिः सहितस्तदा
      - व्यूहं कृत्वा विराटस्य अन्वयुध्यत पाण्डवः
    iast: "yudhiṣṭhiro'pi dharmātmā bhrātṛbhiḥ sahitastadā | vyūhaṃ kṛtvā virāṭasya anvayudhyata pāṇḍavaḥ"
  - id: 'virata-4-35-60'
    kind: verse
    lines:
      - निवृत्य गास्ततः सर्वाः पाण्डुपुत्रा महारथाः
      - अवजित्य सुशर्माणं धनं चादाय सर्वशः
    iast: "nivṛtya gāstataḥ sarvāḥ pāṇḍuputrā mahārathāḥ | avajitya suśarmāṇaṃ dhanaṃ cādāya sarvaśaḥ"
  - id: 'virata-4-35-71'
    kind: verse
    lines:
      - विसृज्य तु सुशर्माणं पाण्डवास्ते हतद्विषः स्वबाहुबलसंपन्ना हीनिषेवा यतव्रताः
      - संग्रामशिरसो मध्ये तां रात्रिं सुखिनोऽवसन्
    iast: "visṛjya tu suśarmāṇaṃ pāṇḍavāste hatadviṣaḥ svabāhubalasaṃpannā hīniṣevā yatavratāḥ | saṃgrāmaśiraso madhye tāṃ rātriṃ sukhino'vasan"
  - id: 'virata-4-37-1'
    kind: verse
    lines:
      - याते त्रिगर्तान्मात्स्ये तु पशूंस्तान्वै परीप्सति
      - दुर्योधनः सहामात्यैर्विराट पुरमभ्यगात्
    iast: "yāte trigartānmātsye tu paśūṃstānvai parīpsati | duryodhanaḥ sahāmātyairvirāṭa puramabhyagāt"
  - id: 'virata-4-37-4'
    kind: verse
    lines:
      - सर्वे मत्स्यानुपागम्य विराटस्य महीपतेः
      - गोपान्विद्राव्य तरसा गोधनं जह्रुरोजसा
    iast: "sarve matsyānupāgamya virāṭasya mahīpateḥ | gopānvidrāvya tarasā godhanaṃ jahrurojasā"
  - id: 'virata-4-37-5'
    kind: verse
    lines:
      - गवां शतसहस्राणि कुरवः कालयन्ति च
      - महता रथवंशेन परिगृह्य समन्ततः
    iast: "gavāṃ śatasahasrāṇi kuravaḥ kālayanti ca | mahatā rathavaṃśena parigṛhya samantataḥ"
  - id: 'virata-4-37-7'
    kind: verse
    lines:
      - गवाध्यक्षस्तु संत्रस्तो रथमास्थाय सत्वरः
      - जगाम नगरायैव परिक्रोशंस्तदाऽऽर्तवत्
    iast: "gavādhyakṣastu saṃtrasto rathamāsthāya satvaraḥ | jagāma nagarāyaiva parikrośaṃstadā''rtavat"
  - id: 'virata-4-37-9'
    kind: verse
    lines:
      - दृष्ट्वा भूमिंजयं नाम पुत्रं मात्स्यस्य मानिनम्
      - तस्मै च सर्वमाचष्ट राष्ट्रस्य पशुकर्षणम्
    iast: "dṛṣṭvā bhūmiṃjayaṃ nāma putraṃ mātsyasya māninam | tasmai ca sarvamācaṣṭa rāṣṭrasya paśukarṣaṇam"
  - id: 'virata-4-38-67'
    kind: verse
    lines:
      - आरुह्य प्रययौ वीरः सबृहन्नलसारथिः
      - अथोत्तरा च कन्याश्च स ख्यश्चैवाब्रुवंस्तदा
    iast: "āruhya prayayau vīraḥ sabṛhannalasārathiḥ | athottarā ca kanyāśca sa khyaścaivābruvaṃstadā"
  - id: 'virata-4-39-8'
    kind: verse
    lines:
      - दृष्टिप्रणाशो भूतानां दिवस्पृक्कुरुसत्तम तदनीकमथो वीक्ष्य गजाश्वरथसंकुलम्
    iast: "dṛṣṭipraṇāśo bhūtānāṃ divaspṛkkurusattama tadanīkamatho vīkṣya gajāśvarathasaṃkulam"
  - id: 'virata-4-39-9'
    kind: verse
    lines:
      - कर्णदुर्योधनकृपैर्गुप्तं शान्तनवेन च
      - द्रोणेन सह पुत्रेण महेष्वासेन धीमता
    iast: "karṇaduryodhanakṛpairguptaṃ śāntanavena ca | droṇena saha putreṇa maheṣvāsena dhīmatā"
  - id: 'virata-4-39-32'
    kind: verse
    lines:
      - इत्युक्त्वा प्राद्रवद्भीतो रथात्प्रस्कन्द्य कुण्डली
      - त्यक्त्वा मानं सुसंत्रस्तो विसृज्य सशरं धनुः
      - अर्जुन उवाच
    iast: "ityuktvā prādravadbhīto rathātpraskandya kuṇḍalī | tyaktvā mānaṃ susaṃtrasto visṛjya saśaraṃ dhanuḥ | arjuna uvāca"
  - id: 'virata-4-39-34'
    kind: verse
    lines:
      - एवमुक्त्वा तु कौरव्यः सोऽवप्लुत्य रथोत्तमात् तमन्वधावद्धावन्तं राजपुत्रं धनञ्जयः
      - दीर्घां वेणीं विधून्वानः साधु रक्ते च वाससी
    iast: "evamuktvā tu kauravyaḥ so'vaplutya rathottamāt tamanvadhāvaddhāvantaṃ rājaputraṃ dhanañjayaḥ | dīrghāṃ veṇīṃ vidhūnvānaḥ sādhu rakte ca vāsasī"
  - id: 'virata-4-39-35'
    kind: verse
    lines:
      - विक्रमन्तं पदन्यासैर्नमयन्तं च भूतलम् विधूय वेणीं धावन्तमजानन्तोऽर्जुनं तदा
      - सैनिकाः प्राहसन्केचिद्योषिद्रूपमवेक्ष्य तम्
    iast: "vikramantaṃ padanyāsairnamayantaṃ ca bhūtalam vidhūya veṇīṃ dhāvantamajānanto'rjunaṃ tadā | sainikāḥ prāhasankecidyoṣidrūpamavekṣya tam"
  - id: 'virata-4-39-51'
    kind: verse
    lines:
      - छन्नं तथा तं वेषेण पाण्डवं प्रेक्ष्य सैनिकाः अर्जुनेति च नेत्येव न व्यवस्यन्ति ते पुनः
      - इति स्म कुरवः सर्वे विमृशन्तः पुनः पुनः
    iast: "channaṃ tathā taṃ veṣeṇa pāṇḍavaṃ prekṣya sainikāḥ arjuneti ca netyeva na vyavasyanti te punaḥ | iti sma kuravaḥ sarve vimṛśantaḥ punaḥ punaḥ"
  - id: 'virata-4-39-78'
    kind: verse
    lines:
      - एवं ब्रुवाणो वैराटिं बीभत्सुरपराजितः
      - समाश्वास्य भयार्तं तमुत्तरं भरतर्षभः
    iast: "evaṃ bruvāṇo vairāṭiṃ bībhatsuraparājitaḥ | samāśvāsya bhayārtaṃ tamuttaraṃ bharatarṣabhaḥ"
  - id: 'virata-4-45-1'
    kind: verse
    lines:
      - उत्तरं सांरथिं कृत्वा शमीं कृत्वा प्रदक्षिणम्
      - आयुधं सर्वमादाय ततः प्रायाद्धनञ्जयः
    iast: "uttaraṃ sāṃrathiṃ kṛtvā śamīṃ kṛtvā pradakṣiṇam | āyudhaṃ sarvamādāya tataḥ prāyāddhanañjayaḥ"
  - id: 'virata-4-45-26'
    kind: verse
    lines:
      - एवमुक्त्वा महाबाहुः सव्यसाची परन्तपः ततः शङ्खमुपाध्मासीद्दारयन्निव पर्वतान्
      - गुहा गिरीणां च तदा दिशः शैलांस्तथैव च
    iast: "evamuktvā mahābāhuḥ savyasācī parantapaḥ tataḥ śaṅkhamupādhmāsīddārayanniva parvatān | guhā girīṇāṃ ca tadā diśaḥ śailāṃstathaiva ca"
  - id: 'virata-4-45-27'
    kind: verse
    lines:
      - ज्याघोषं तलघोषं च कृत्वा भूतान्यमोहयत् उत्तरश्चापि संलीनो रथोपस्थ उपाविशत्
      - तं समाश्वासयामास पुनरेव धनञ्जयः
    iast: "jyāghoṣaṃ talaghoṣaṃ ca kṛtvā bhūtānyamohayat uttaraścāpi saṃlīno rathopastha upāviśat | taṃ samāśvāsayāmāsa punareva dhanañjayaḥ"
  - id: 'virata-4-52-6'
    kind: verse
    lines:
      - सर्वं यथावच्चरितं यद्यदेभिः प्रतिश्रुतम्
      - एवमेतद्भ्रुवं ज्ञात्वा ततो बीभत्सुरागतः
    iast: "sarvaṃ yathāvaccaritaṃ yadyadebhiḥ pratiśrutam | evametadbhruvaṃ jñātvā tato bībhatsurāgataḥ"
  - id: 'virata-4-52-18'
    kind: verse
    lines:
      - एको हि समरे पार्थः पृथिवीं निर्दहेच्छरैः भ्रातृभिः सहितो भूत्वा किं पुनः कौरवान्रणे
      - तस्मात्सन्धिं कुरुश्रेष्ठ कुरुष्व यदि मन्यसे
      - दुर्योधन उवाच
    iast: "eko hi samare pārthaḥ pṛthivīṃ nirdaheccharaiḥ bhrātṛbhiḥ sahito bhūtvā kiṃ punaḥ kauravānraṇe | tasmātsandhiṃ kuruśreṣṭha kuruṣva yadi manyase | duryodhana uvāca"
  - id: 'virata-4-52-19'
    kind: verse
    lines:
      - नाहं राज्यं प्रदास्यामि पाण्डवेभ्यः पितामह ग्रामं सेनां च दासांश्च स्वल्पं द्रव्यमपि प्रभो
      - युद्धोपचारिकं यत्तु तत्सर्वं संविधीयताम्
      - वैशंपायन उवाच
    iast: "nāhaṃ rājyaṃ pradāsyāmi pāṇḍavebhyaḥ pitāmaha grāmaṃ senāṃ ca dāsāṃśca svalpaṃ dravyamapi prabho | yuddhopacārikaṃ yattu tatsarvaṃ saṃvidhīyatām | vaiśaṃpāyana uvāca"
  - id: 'virata-4-52-27'
    kind: verse
    lines:
      - भीष्मः प्रस्थाप्य राजानं गोधनं तदनन्तरम्
      - सेनामुख्यान्व्यवस्थाप्य व्यूहितुं संप्रचक्रमे
    iast: "bhīṣmaḥ prasthāpya rājānaṃ godhanaṃ tadanantaram | senāmukhyānvyavasthāpya vyūhituṃ saṃpracakrame"
  - id: 'virata-4-54-1'
    kind: verse
    lines:
      - तथा व्यूढेष्वनीकेषु कौरवेयैर्महारथैः
      - उपायादर्जुनंस्तूर्णं रथघोषेण नादयन्
    iast: "tathā vyūḍheṣvanīkeṣu kauraveyairmahārathaiḥ | upāyādarjunaṃstūrṇaṃ rathaghoṣeṇa nādayan"
  - id: 'virata-4-54-8'
    kind: verse
    lines:
      - ततोऽभ्यवादयत्पार्थो भीष्मं शान्तनवं कृपम्
      - द्वाभ्यांद्वाभ्यां तथाऽऽचार्यं द्रोणं प्रथमतः क्रमात्
    iast: "tato'bhyavādayatpārtho bhīṣmaṃ śāntanavaṃ kṛpam | dvābhyāṃdvābhyāṃ tathā''cāryaṃ droṇaṃ prathamataḥ kramāt"
  - id: 'virata-4-54-9'
    kind: verse
    lines:
      - द्रोणं कृपं च भीष्मं च पृषत्कैरभ्यवादयत्
      - ततस्तत्सर्वमालोक्य द्रोणो वचनमब्रवीत्
    iast: "droṇaṃ kṛpaṃ ca bhīṣmaṃ ca pṛṣatkairabhyavādayat | tatastatsarvamālokya droṇo vacanamabravīt"
  - id: 'virata-4-58-65'
    kind: verse
    lines:
      - अर्जुनस्तु हयान्नागान्रथांश्च विनिपातयन्
      - क्षोभयामास तत्सैन्यं कर्णं विव्याध चासकृत्
    iast: "arjunastu hayānnāgānrathāṃśca vinipātayan | kṣobhayāmāsa tatsainyaṃ karṇaṃ vivyādha cāsakṛt"
  - id: 'virata-4-58-77'
    kind: verse
    lines:
      - स पार्थमुक्तानविषह्य बाणान् गजो गजेनेव जितस्तरस्वी
      - विहाय संग्रामशिरोपयातो वैकर्तनः पार्थशराभितप्तः
    iast: "sa pārthamuktānaviṣahya bāṇān gajo gajeneva jitastarasvī | vihāya saṃgrāmaśiropayāto vaikartanaḥ pārthaśarābhitaptaḥ"
  - id: 'virata-4-67-13'
    kind: verse
    lines:
      - ततोऽस्रमस्त्रेण निवार्य तेषां गाण्डीवधन्वा कुरुपुङ्गवानाम्
      - संमोहनं शत्रुसहोऽन्यदस्त्रं प्रादुश्चकारैन्द्रमवारणीयम्
    iast: "tato'sramastreṇa nivārya teṣāṃ gāṇḍīvadhanvā kurupuṅgavānām | saṃmohanaṃ śatrusaho'nyadastraṃ prāduścakāraindramavāraṇīyam"
  - id: 'virata-4-67-16'
    kind: verse
    lines:
      - संमोहनास्त्रप्रभवैः शरौघैर्विनष्टदेहाश्च निपत्य योधाः
      - निःसत्ववेगाः कुरुराजसैन्याः कुडयोपमास्तस्थुरनीहमानाः
    iast: "saṃmohanāstraprabhavaiḥ śaraughairvinaṣṭadehāśca nipatya yodhāḥ | niḥsatvavegāḥ kururājasainyāḥ kuḍayopamāstasthuranīhamānāḥ"
  - id: 'virata-4-67-21'
    kind: verse
    lines:
      - रश्मीन्समुत्सृज्य ततो महात्मा रथादवप्लुत्य विराटपुत्रः
      - वस्त्राण्युपादाय महारथानां नानाविधान्यद्भुतवर्णकानि
    iast: "raśmīnsamutsṛjya tato mahātmā rathādavaplutya virāṭaputraḥ | vastrāṇyupādāya mahārathānāṃ nānāvidhānyadbhutavarṇakāni"
  - id: 'virata-4-67-22'
    kind: verse
    lines:
      - महान्ति चीनांशुदुकूलकानि पट्टांशुकानि विविधानि मनोज्ञकानि
      - हारांश्च राज्ञां मणिभूषणानि सुवर्णनिष्काभरणानि मारिष
    iast: "mahānti cīnāṃśudukūlakāni paṭṭāṃśukāni vividhāni manojñakāni | hārāṃśca rājñāṃ maṇibhūṣaṇāni suvarṇaniṣkābharaṇāni māriṣa"
  - id: 'virata-4-67-23'
    kind: verse
    lines:
      - माणिक्यबाह्वङ्गदकङ्कणानि अन्यानि राज्ञां मणिभूषणानि
      - वस्त्राण्युपादाय महारथानां तूर्णं पुनः खं रथमारुरोह
    iast: "māṇikyabāhvaṅgadakaṅkaṇāni anyāni rājñāṃ maṇibhūṣaṇāni | vastrāṇyupādāya mahārathānāṃ tūrṇaṃ punaḥ khaṃ rathamāruroha"
  - id: 'virata-4-67-38'
    kind: verse
    lines:
      - तेषामनीकानि निरीक्ष्य पार्थो विकीर्णयानध्वजकार्मुकाणि
      - गाण्डीवधन्वा प्रहसन्कुरूणां शङ्ख प्रदध्मौ बलवान्बलेन
    iast: "teṣāmanīkāni nirīkṣya pārtho vikīrṇayānadhvajakārmukāṇi | gāṇḍīvadhanvā prahasankurūṇāṃ śaṅkha pradadhmau balavānbalena"
  - id: 'virata-4-67-40'
    kind: verse
    lines:
      - तानर्जुनो दूरतरं विभज्य धनं च सर्वं निखिलं निवर्त्य आपृच्छ्य तान्दूरमनुप्रयात्वा धनञ्जयस्तत्र कुरून्महात्मा
      - गुरूंश्च सर्वानभिवाद्य बाणैर्न्यवर्ततोदग्रमनाः शरैः सह
    iast: "tānarjuno dūrataraṃ vibhajya dhanaṃ ca sarvaṃ nikhilaṃ nivartya āpṛcchya tāndūramanuprayātvā dhanañjayastatra kurūnmahātmā | gurūṃśca sarvānabhivādya bāṇairnyavartatodagramanāḥ śaraiḥ saha"
  - id: 'virata-4-68-19'
    kind: verse
    lines:
      - ततो निवृत्ताः कुरवः प्रभग्नाः शममास्थिताः
      - परस्परमवेक्ष्यैव जग्मुस्ते हृतवाससः
    iast: "tato nivṛttāḥ kuravaḥ prabhagnāḥ śamamāsthitāḥ | parasparamavekṣyaiva jagmuste hṛtavāsasaḥ"
  - id: 'virata-4-69-1'
    kind: verse
    lines:
      - स विजित्य धनं चापि विराटो वाहिनीपतिः
      - प्राविशन्नगरं हृष्टश्चतुर्भिः सह पाण्डवैः
    iast: "sa vijitya dhanaṃ cāpi virāṭo vāhinīpatiḥ | prāviśannagaraṃ hṛṣṭaścaturbhiḥ saha pāṇḍavaiḥ"
  - id: 'virata-4-69-18'
    kind: verse
    lines:
      - अथोत्तरेण प्रहिता दूतास्ते शीघ्रगामिनः
      - विराटनगरं प्राप्य जयं प्रावेदयंस्तदा
    iast: "athottareṇa prahitā dūtāste śīghragāminaḥ | virāṭanagaraṃ prāpya jayaṃ prāvedayaṃstadā"
  - id: 'virata-4-73-18'
    kind: verse
    lines:
      - इतिकर्तव्यतां सर्वे मन्त्रयित्वा तु पाण्डवाः
      - न्यवसंश्चैव तां रात्रिं धर्मज्ञा धर्मवत्सलाः
    iast: "itikartavyatāṃ sarve mantrayitvā tu pāṇḍavāḥ | nyavasaṃścaiva tāṃ rātriṃ dharmajñā dharmavatsalāḥ"
  - id: 'virata-4-74-1'
    kind: verse
    lines:
      - ततो द्वितीये दिवसे भ्रातरः पञ्च पाण्डवाः
      - स्नाताः शुक्लाम्बरधराः सर्वे सुचरितव्रताः
    iast: "tato dvitīye divase bhrātaraḥ pañca pāṇḍavāḥ | snātāḥ śuklāmbaradharāḥ sarve sucaritavratāḥ"
  - id: 'virata-4-74-2'
    kind: verse
    lines:
      - युधिष्ठिरं पुरस्कृत्य सर्वाभरणभूषिताः
      - अभिपन्ना महाभागा भ्राजमाना महारथाः
    iast: "yudhiṣṭhiraṃ puraskṛtya sarvābharaṇabhūṣitāḥ | abhipannā mahābhāgā bhrājamānā mahārathāḥ"
  - id: 'virata-4-74-3'
    kind: verse
    lines:
      - विराटस्य सभां प्राप्य भूमिपालासनेषु ते
      - निषेदुः पावकप्रख्याः सत्रे धिष्ण्येष्विवाग्नयः
    iast: "virāṭasya sabhāṃ prāpya bhūmipālāsaneṣu te | niṣeduḥ pāvakaprakhyāḥ satre dhiṣṇyeṣvivāgnayaḥ"
  - id: 'virata-4-74-5'
    kind: verse
    lines:
      - गोसुवर्णादिकं दत्त्वा ब्राह्मणेभ्यो यथाविधि
      - आजगाम सभां राजा उत्तरेण सह प्रभो
    iast: "gosuvarṇādikaṃ dattvā brāhmaṇebhyo yathāvidhi | ājagāma sabhāṃ rājā uttareṇa saha prabho"
  - id: 'virata-4-74-6'
    kind: verse
    lines:
      - स तान्दृष्ट्वा महासत्वाञ्ज्वलतः पावकानिव राजवेषानुपादाय पार्थिवो विस्मितोऽभवत्
    iast: "sa tāndṛṣṭvā mahāsatvāñjvalataḥ pāvakāniva rājaveṣānupādāya pārthivo vismito'bhavat"
  - id: 'virata-4-74-10'
    kind: verse
    lines:
      - परिहासेच्छया राज्ञो विराटस्य निशम्य तत्
      - स्मयमानोऽब्रवीद्वाक्यमर्जुनः परवीरहा
    iast: "parihāsecchayā rājño virāṭasya niśamya tat | smayamāno'bravīdvākyamarjunaḥ paravīrahā"
  - id: 'virata-4-74-18'
    kind: verse
    lines:
      - अयं कुरूणामृषभः कुन्तीपुत्रो युधिष्ठिरः
      - यस्य कीर्तिः स्थिता लोके सूर्यस्येवोद्यतः प्रभा
    iast: "ayaṃ kurūṇāmṛṣabhaḥ kuntīputro yudhiṣṭhiraḥ | yasya kīrtiḥ sthitā loke sūryasyevodyataḥ prabhā"
  - id: 'virata-4-75-3'
    kind: verse
    lines:
      - य एष बललोऽभूत्ते सूपकारश्च ते नृप
      - एष भीमो महाभाग भीमवेगपराक्रमः
    iast: "ya eṣa balalo'bhūtte sūpakāraśca te nṛpa | eṣa bhīmo mahābhāga bhīmavegaparākramaḥ"
  - id: 'virata-4-75-7'
    kind: verse
    lines:
      - यश्चासीदश्वबन्धस्ते नकुलोऽयं परन्तप
      - गोसङ्ख्यः सहदेवश्च माद्रीपुत्रौ महाबलौ
    iast: "yaścāsīdaśvabandhaste nakulo'yaṃ parantapa | gosaṅkhyaḥ sahadevaśca mādrīputrau mahābalau"
  - id: 'virata-4-75-9'
    kind: verse
    lines:
      - एषा पद्मपलाशाक्षी सुमध्या चारुहासिनी
      - सैरन्ध्री द्रौपदी राजन्यकृते कीचका हताः
    iast: "eṣā padmapalāśākṣī sumadhyā cāruhāsinī | sairandhrī draupadī rājanyakṛte kīcakā hatāḥ"
  - id: 'virata-4-75-22'
    kind: verse
    lines:
      - एवं निवेद्य तान्पार्थान्पाण्डवान्पञ्च भूपतेः
      - ततोऽर्जुनस्य वैराटिः कथयामास विक्रमम्
    iast: "evaṃ nivedya tānpārthānpāṇḍavānpañca bhūpateḥ | tato'rjunasya vairāṭiḥ kathayāmāsa vikramam"
  - id: 'virata-4-75-33'
    kind: verse
    lines:
      - तस्य तद्वचनं श्रुत्वा मात्स्यराजः प्रतापवान्
      - धनंजयं परिष्वज्य पाण्डवानथ सर्वशः
    iast: "tasya tadvacanaṃ śrutvā mātsyarājaḥ pratāpavān | dhanaṃjayaṃ pariṣvajya pāṇḍavānatha sarvaśaḥ"
  - id: 'virata-4-75-35'
    kind: verse
    lines:
      - संप्रीयमाणो राजानां युधिष्ठिरमथाब्रवीत् दिष्ट्या भवन्तः संप्राप्ताः सर्वे कुशलिनो वनात्
      - दिष्ट्या विचरितं कृच्छ्रमज्ञातं च दुरात्मभिः इदं राज्यं च वः सर्वं यच्चापि वसु किंचन विभक्तमेतद्भवतां नोत्कण्ठां कर्तुमर्हथ
      - अविभक्तं भवद्भिर्मे न सन्देहो नराधिपाः
    iast: "saṃprīyamāṇo rājānāṃ yudhiṣṭhiramathābravīt diṣṭyā bhavantaḥ saṃprāptāḥ sarve kuśalino vanāt | diṣṭyā vicaritaṃ kṛcchramajñātaṃ ca durātmabhiḥ idaṃ rājyaṃ ca vaḥ sarvaṃ yaccāpi vasu kiṃcana vibhaktametadbhavatāṃ notkaṇṭhāṃ kartumarhatha | avibhaktaṃ bhavadbhirme na sandeho narādhipāḥ"
  - id: 'virata-4-77-3'
    kind: verse
    lines:
      - उत्तरां प्रतिगृह्णातु सव्यसाची धनंजयः
      - अयं ह्यौपयिको भर्ता तस्याः पुरुषसत्तमः
      - वैशंपायन उवाच
    iast: "uttarāṃ pratigṛhṇātu savyasācī dhanaṃjayaḥ | ayaṃ hyaupayiko bhartā tasyāḥ puruṣasattamaḥ | vaiśaṃpāyana uvāca"
  - id: 'virata-4-77-4'
    kind: verse
    lines:
      - एवमुक्तो धर्मराजः पार्थपैक्षद्वनंजयम्
      - ईक्षितं चार्जुनो ज्ञात्वा मात्स्यं वचनमब्रवीत्
    iast: "evamukto dharmarājaḥ pārthapaikṣadvanaṃjayam | īkṣitaṃ cārjuno jñātvā mātsyaṃ vacanamabravīt"
  - id: 'virata-4-77-6'
    kind: verse
    lines:
      - प्रतिगृह्णाम्यहं राजन्स्रुषं दुहितरं तव
      - युक्तो ह्यावां हि संबन्धो मात्स्यभारतवंशयोः
      - विराट उवाच
    iast: "pratigṛhṇāmyahaṃ rājansruṣaṃ duhitaraṃ tava | yukto hyāvāṃ hi saṃbandho mātsyabhāratavaṃśayoḥ | virāṭa uvāca"
  - id: 'virata-4-77-8'
    kind: verse
    lines:
      - अन्तःपुरेऽहमुषितः सदा पश्यन्सुतां तव
      - सहस्यं च प्रकाशं च विश्वस्ता पितृवन्मयि
    iast: "antaḥpure'hamuṣitaḥ sadā paśyansutāṃ tava | sahasyaṃ ca prakāśaṃ ca viśvastā pitṛvanmayi"
  - id: 'virata-4-77-9'
    kind: verse
    lines:
      - प्रियो बहुमतश्चाहं नर्तने गीतवादिते
      - आचार्यवच्च मां नित्यं मन्यते दुहिता तव
    iast: "priyo bahumataścāhaṃ nartane gītavādite | ācāryavacca māṃ nityaṃ manyate duhitā tava"
  - id: 'virata-4-77-14'
    kind: verse
    lines:
      - स्वस्त्रीयो वासुदेवस्य साक्षाद्देवसुतो यथा
      - दयितश्चक्रहस्तस्य बलवानस्त्रकोविदः
    iast: "svastrīyo vāsudevasya sākṣāddevasuto yathā | dayitaścakrahastasya balavānastrakovidaḥ"
  - id: 'virata-4-77-15'
    kind: verse
    lines:
      - अभिमन्युर्गहाबाहुः पुत्रो मम विशांपते
      - जामाता तव युक्तो वै भर्ता च दुहितुस्तव
      - विराट उवाच
    iast: "abhimanyurgahābāhuḥ putro mama viśāṃpate | jāmātā tava yukto vai bhartā ca duhitustava | virāṭa uvāca"
  - id: 'virata-4-77-19'
    kind: verse
    lines:
      - दूतान्सर्वेषु मित्रेषु वासुदेवे च भारत प्रेषयामास कौन्तेयो विराटश्च महीपतिः
    iast: "dūtānsarveṣu mitreṣu vāsudeve ca bhārata preṣayāmāsa kaunteyo virāṭaśca mahīpatiḥ"
  - id: 'virata-4-77-25'
    kind: verse
    lines:
      - युद्धात्प्रयाताः कुरवो हि मार्गे समेत्य सर्वे हितमेव तत्र
      - आचार्यपुत्रः शकुनिश्च राजा दुर्योधनः सूतपुत्रश्च कर्णः संमन्त्र्य राजन्सहिताः समर्थाः समादिशन्दूतमथो समग्राः
    iast: "yuddhātprayātāḥ kuravo hi mārge sametya sarve hitameva tatra | ācāryaputraḥ śakuniśca rājā duryodhanaḥ sūtaputraśca karṇaḥ saṃmantrya rājansahitāḥ samarthāḥ samādiśandūtamatho samagrāḥ"
  - id: 'virata-4-77-26'
    kind: verse
    lines:
      - युधिष्ठिरश्चापि सुसंग्रहृष्टो दुर्योधनाद्दूतमपश्यदागतम्
      - स चाब्रवीद्धर्मराजं समेत्य युधिष्ठिरं पाण्डवमुग्रवीर्यम्
    iast: "yudhiṣṭhiraścāpi susaṃgrahṛṣṭo duryodhanāddūtamapaśyadāgatam | sa cābravīddharmarājaṃ sametya yudhiṣṭhiraṃ pāṇḍavamugravīryam"
  - id: 'virata-4-77-27'
    kind: verse
    lines:
      - धनञ्जयेनासि पुनर्वनाय प्रव्राजितः समये तिष्ठ पार्थः
      - त्रयोदशे ह्येव किरीटमाली संवत्सरे पाण्डवेयोऽद्य दृष्टः
      - वैशंपायन उवाच
    iast: "dhanañjayenāsi punarvanāya pravrājitaḥ samaye tiṣṭha pārthaḥ | trayodaśe hyeva kirīṭamālī saṃvatsare pāṇḍaveyo'dya dṛṣṭaḥ | vaiśaṃpāyana uvāca"
  - id: 'virata-4-77-28'
    kind: verse
    lines:
      - ततोऽब्रवीद्धर्मसुतः प्रहस्य क्षिप्रं गत्वा ब्रूहि सुयोधनं तम्
      - पितामहः शान्तनवो ब्रवीतु पूर्णो न पूर्णोऽद्य त्रयोदशो नः
    iast: "tato'bravīddharmasutaḥ prahasya kṣipraṃ gatvā brūhi suyodhanaṃ tam | pitāmahaḥ śāntanavo bravītu pūrṇo na pūrṇo'dya trayodaśo naḥ"
  - id: 'virata-4-77-30'
    kind: verse
    lines:
      - तेनैवमुक्तः स निवृत्य दूतो दुर्योधनं प्राप्य शशंस तत्त्वम्
    iast: "tenaivamuktaḥ sa nivṛtya dūto duryodhanaṃ prāpya śaśaṃsa tattvam"
  - id: 'virata-4-77-32'
    kind: verse
    lines:
      - संमन्त्र्य रात्रौ बहुभिः सुहृद्भिर्भीष्मोऽब्रवीद्धार्तराष्ट्रं महात्मा
      - तीर्णप्रतिज्ञेन धनंजयेन विष्फारितं गाण्डिवमाजिमध्ये
      - वैशंपायन उवाच
    iast: "saṃmantrya rātrau bahubhiḥ suhṛdbhirbhīṣmo'bravīddhārtarāṣṭraṃ mahātmā | tīrṇapratijñena dhanaṃjayena viṣphāritaṃ gāṇḍivamājimadhye | vaiśaṃpāyana uvāca"
  - id: 'virata-4-77-33'
    kind: verse
    lines:
      - नेच्छन्त्यसत्येन सुरेन्द्रलोकं पाण्डोः सुता ब्रह्मणश्चापि लोकम्
      - तथ्यं च ते पथ्यमहं ब्रवीमि स्वर्ग्यं यशस्यं परलोकपथ्यम्
    iast: "necchantyasatyena surendralokaṃ pāṇḍoḥ sutā brahmaṇaścāpi lokam | tathyaṃ ca te pathyamahaṃ bravīmi svargyaṃ yaśasyaṃ paralokapathyam"
  - id: 'virata-4-77-37'
    kind: verse
    lines:
      - ते धार्तराष्ट्राः समयं निशम्य तीर्णप्रतिज्ञस्य धनंजयस्य
      - संचिन्त्य सर्वे सहिताः सुहृद्भिः सपार्थिवाः स्वानि गृहाणि जग्मुः
    iast: "te dhārtarāṣṭrāḥ samayaṃ niśamya tīrṇapratijñasya dhanaṃjayasya | saṃcintya sarve sahitāḥ suhṛdbhiḥ sapārthivāḥ svāni gṛhāṇi jagmuḥ"
  - id: 'virata-4-78-1'
    kind: verse
    lines:
      - ततस्त्रयोदशे वर्षे निवृत्ते पञ्च पाण्डवाः
      - उपप्लाव्ये विराटस्य वासं चक्रुः पुरोत्तमे
    iast: "tatastrayodaśe varṣe nivṛtte pañca pāṇḍavāḥ | upaplāvye virāṭasya vāsaṃ cakruḥ purottame"
  - id: 'virata-4-78-4'
    kind: verse
    lines:
      - तस्मिन्काले निशम्याथ दूतवाक्यं जनार्दनः दयितं स्वस्त्रियं पुत्रं सुभद्रायाः सुमानितम्
      - अभिमन्युं समादाय रामेण सहितस्तदा
    iast: "tasminkāle niśamyātha dūtavākyaṃ janārdanaḥ dayitaṃ svastriyaṃ putraṃ subhadrāyāḥ sumānitam | abhimanyuṃ samādāya rāmeṇa sahitastadā"
  - id: 'virata-4-78-5'
    kind: verse
    lines:
      - सर्वयादवमुख्यैश्च संवृतः परवीरहा
      - शङ्खदुन्दुभिनिर्घोषैर्विराटनगरं ययौ
    iast: "sarvayādavamukhyaiśca saṃvṛtaḥ paravīrahā | śaṅkhadundubhinirghoṣairvirāṭanagaraṃ yayau"
  - id: 'virata-4-78-11'
    kind: verse
    lines:
      - वासुदेवं तथाऽऽयान्तं श्रुत्वा पाण्डुसुतास्तदा
      - मात्स्येन सहिताः सर्वे प्रत्युद्याता जनार्दनम्
    iast: "vāsudevaṃ tathā''yāntaṃ śrutvā pāṇḍusutāstadā | mātsyena sahitāḥ sarve pratyudyātā janārdanam"
  - id: 'virata-4-78-12'
    kind: verse
    lines:
      - शङ्खदुन्दुभिनिर्घोषैर्मङ्गलैश्च जनार्दनम् ववन्दुर्मुदिताः सर्वे पादयोस्तस्य पाण्डवाः
      - मात्स्येन सहिताः सर्वे आनन्दाश्रुपरिप्लुताः
      - पाण्डवा ऊचुः
    iast: "śaṅkhadundubhinirghoṣairmaṅgalaiśca janārdanam vavandurmuditāḥ sarve pādayostasya pāṇḍavāḥ | mātsyena sahitāḥ sarve ānandāśrupariplutāḥ | pāṇḍavā ūcuḥ"
  - id: 'virata-4-78-13'
    kind: verse
    lines:
      - तव कृष्ण प्रसादाद्वै वर्षाण्येतानि सर्वशः
      - त्रयोदशोपि दाशार्ह यथा स समयः कृतः
    iast: "tava kṛṣṇa prasādādvai varṣāṇyetāni sarvaśaḥ | trayodaśopi dāśārha yathā sa samayaḥ kṛtaḥ"
  - id: 'virata-4-78-14'
    kind: verse
    lines:
      - उषिताः स्मो जगन्नाथ त्वं नाथो नो जनार्दन
      - रक्षस्व देवदेवेश त्वामार्य शरणं गताः
      - वैशंपायन उवाच
    iast: "uṣitāḥ smo jagannātha tvaṃ nātho no janārdana | rakṣasva devadeveśa tvāmārya śaraṇaṃ gatāḥ | vaiśaṃpāyana uvāca"
  - id: 'virata-4-78-15'
    kind: verse
    lines:
      - तान्वन्दूमानान्सहसा परिष्वज्य जनार्दनः
      - विराटस्य सहायांस्तान्सर्वयादवसंवृतः
    iast: "tānvandūmānānsahasā pariṣvajya janārdanaḥ | virāṭasya sahāyāṃstānsarvayādavasaṃvṛtaḥ"
  - id: 'virata-4-78-16'
    kind: verse
    lines:
      - यथार्हं पूजयामास मुदा परमया युतः
      - वृष्णिवीराश्च तान्सर्वान्यथार्हं प्रतिपेदिरे
    iast: "yathārhaṃ pūjayāmāsa mudā paramayā yutaḥ | vṛṣṇivīrāśca tānsarvānyathārhaṃ pratipedire"
  - id: 'virata-4-78-17'
    kind: verse
    lines:
      - कृष्णा च देवकीपुत्रं ववन्दे पादयोस्तथा तामुद्यम्य सुकेशान्तां नयने परिमृज्य च
      - उवाच वाक्यं देवेशः सर्वयादवसन्निधौ
    iast: "kṛṣṇā ca devakīputraṃ vavande pādayostathā tāmudyamya sukeśāntāṃ nayane parimṛjya ca | uvāca vākyaṃ deveśaḥ sarvayādavasannidhau"
  - id: 'virata-4-78-18'
    kind: verse
    lines:
      - मा शोकं कुरु कल्याणि धार्तराष्ट्रान्समाहितान्
      - अचिराद्धातयित्वाऽहं पार्थेन सहितः क्षितिम्
    iast: "mā śokaṃ kuru kalyāṇi dhārtarāṣṭrānsamāhitān | acirāddhātayitvā'haṃ pārthena sahitaḥ kṣitim"
  - id: 'virata-4-78-19'
    kind: verse
    lines:
      - युधिष्ठिराय दास्यामि यातु ते मानसो ज्वरः
      - अभिमन्युना च पार्थेनरौक्मिणेयेन ते शपे
    iast: "yudhiṣṭhirāya dāsyāmi yātu te mānaso jvaraḥ | abhimanyunā ca pārthenaraukmiṇeyena te śape"
  - id: 'virata-4-78-30'
    kind: verse
    lines:
      - ततः शङ्खा मृदङ्गाश्च गोमुखा डिण्डिमास्तदा
      - अभिमन्योर्विवाहे तु नेदुर्मात्स्यस्य वेश्मनि
    iast: "tataḥ śaṅkhā mṛdaṅgāśca gomukhā ḍiṇḍimāstadā | abhimanyorvivāhe tu nedurmātsyasya veśmani"
  - id: 'virata-4-78-53'
    kind: verse
    lines:
      - पुरोहितैरमात्यैश्च पौरैर्जानपदैः सह विराटो नृपतिः श्रीमान्सौभद्रायाभिमन्यवे
      - तां सुतामुत्तरां दत्त्वा मुमुदे परमं तदा
      - जनमेजय उवाच
    iast: "purohitairamātyaiśca paurairjānapadaiḥ saha virāṭo nṛpatiḥ śrīmānsaubhadrāyābhimanyave | tāṃ sutāmuttarāṃ dattvā mumude paramaṃ tadā | janamejaya uvāca"
  - id: 'udyoga-5-1-1'
    kind: verse
    lines:
      - वैशंपायन उवाच
      - कृत्वा विवाहं तु कुरुप्रवीरास्तदाऽभिमन्योर्मुदिताः सपक्षाः
      - विश्रम्य रात्रावुषसि प्रतीताः सभां विराटस्य ततोऽभिजग्मुः
    iast: "vaiśaṃpāyana uvāca | kṛtvā vivāhaṃ tu kurupravīrāstadā'bhimanyormuditāḥ sapakṣāḥ | viśramya rātrāvuṣasi pratītāḥ sabhāṃ virāṭasya tato'bhijagmuḥ"
  - id: 'udyoga-5-1-9'
    kind: verse
    lines:
      - कथान्तमासाद्य च माधवेन संघट्टिताः पाण्डवकार्यहेतोः
      - ते राजसिंहाः सहिता ह्यश्रृण्वन्वाक्यं महार्थं सुमहोदयं च
      - श्रीकृष्ण उवाच
    iast: "kathāntamāsādya ca mādhavena saṃghaṭṭitāḥ pāṇḍavakāryahetoḥ | te rājasiṃhāḥ sahitā hyaśrṛṇvanvākyaṃ mahārthaṃ sumahodayaṃ ca | śrīkṛṣṇa uvāca"
  - id: 'udyoga-5-1-10'
    kind: verse
    lines:
      - सर्वैर्भवद्भिर्विदितं यथाऽयं युधिष्ठिरः सौबलेनाक्षवत्याम्
      - जितो निकृत्याऽपहृतं च राज्यं वनप्रवासे समयः कृतश्च
    iast: "sarvairbhavadbhirviditaṃ yathā'yaṃ yudhiṣṭhiraḥ saubalenākṣavatyām | jito nikṛtyā'pahṛtaṃ ca rājyaṃ vanapravāse samayaḥ kṛtaśca"
  - id: 'udyoga-5-1-13'
    kind: verse
    lines:
      - एवं गते धर्मसुतस्य राज्ञो दुर्योधनस्यापि च यद्धितं स्यात्
      - तच्चिन्तयध्वं कुरुपाण्डवानां धर्म्यं च युक्तं च यशस्करं च
    iast: "evaṃ gate dharmasutasya rājño duryodhanasyāpi ca yaddhitaṃ syāt | taccintayadhvaṃ kurupāṇḍavānāṃ dharmyaṃ ca yuktaṃ ca yaśaskaraṃ ca"
  - id: 'udyoga-5-1-25'
    kind: verse
    lines:
      - निशम्य वाक्यं तु जनार्दनस्य धर्मार्थयुक्तं मधुरं समं च
      - समाददे वाक्यमथाग्रजोऽस्य संपूज्य वाक्यं तदतीव राजन्
    iast: "niśamya vākyaṃ tu janārdanasya dharmārthayuktaṃ madhuraṃ samaṃ ca | samādade vākyamathāgrajo'sya saṃpūjya vākyaṃ tadatīva rājan"
  - id: 'udyoga-5-2-4'
    kind: verse
    lines:
      - दुर्योधनस्यापि मतं च वेत्तुं वक्तुं च वाक्यानि युधिष्ठिरस्य
      - प्रियं च मे स्याद्यदि तत्र कश्चिद्व्रजेच्छमार्थं कुरुपाण्डवानाम्
    iast: "duryodhanasyāpi mataṃ ca vettuṃ vaktuṃ ca vākyāni yudhiṣṭhirasya | priyaṃ ca me syādyadi tatra kaścidvrajecchamārthaṃ kurupāṇḍavānām"
  - id: 'udyoga-5-2-13'
    kind: verse
    lines:
      - तथा हि शक्यो धृतराष्ट्रपुत्रः स्वार्थें नियोक्तुं पुरुषेण तेन
      - अयुद्धमाकाङ्क्षत कौरवाणां साम्नैव दुर्योधनमाश्वसध्वम्
    iast: "tathā hi śakyo dhṛtarāṣṭraputraḥ svārtheṃ niyoktuṃ puruṣeṇa tena | ayuddhamākāṅkṣata kauravāṇāṃ sāmnaiva duryodhanamāśvasadhvam"
  - id: 'udyoga-5-4-1'
    kind: verse
    lines:
      - एवमेतन्महाबाहो भविष्यति न संशयः
      - न हि दुर्योधनो राज्यं मधुरेण प्रदास्यति
    iast: "evametanmahābāho bhaviṣyati na saṃśayaḥ | na hi duryodhano rājyaṃ madhureṇa pradāsyati"
  - id: 'udyoga-5-4-6'
    kind: verse
    lines:
      - मृदुं वै मन्यते पापो भाषमाणमशक्तिकम्
      - हितमर्थं न जानीयादबुद्धिर्मार्दवे सति
    iast: "mṛduṃ vai manyate pāpo bhāṣamāṇamaśaktikam | hitamarthaṃ na jānīyādabuddhirmārdave sati"
  - id: 'udyoga-5-4-7'
    kind: verse
    lines:
      - एतच्चैव करिष्यामो यत्नश्च क्रियतामिह
      - प्रस्थापयाम मित्रेभ्यो बलान्युद्योजयन्तु नः
    iast: "etaccaiva kariṣyāmo yatnaśca kriyatāmiha | prasthāpayāma mitrebhyo balānyudyojayantu naḥ"
  - id: 'udyoga-5-4-25'
    kind: verse
    lines:
      - अयं च ब्राह्मणो विद्वान्मम राजन्पुरोहितः
      - प्रेष्यतां धृतराष्ट्राय वाक्यमस्मै प्रदीयताम्
    iast: "ayaṃ ca brāhmaṇo vidvānmama rājanpurohitaḥ | preṣyatāṃ dhṛtarāṣṭrāya vākyamasmai pradīyatām"
  - id: 'udyoga-5-5-1'
    kind: verse
    lines:
      - द्रुपदेनैवमुक्ते तु वाक्ये वाक्यविदां वरः
      - वसुदेवसुतस्तत्र पृष्णिसिंहोऽब्रवीदिदम्
    iast: "drupadenaivamukte tu vākye vākyavidāṃ varaḥ | vasudevasutastatra pṛṣṇisiṃho'bravīdidam"
  - id: 'udyoga-5-5-3'
    kind: verse
    lines:
      - एतच्च पूर्वं कार्यं नः सुनीतिमभिकाङ्क्षताम्
      - अन्यथा ह्याचरन्कर्म पुरुषः स्यात्सुबालिशः
    iast: "etacca pūrvaṃ kāryaṃ naḥ sunītimabhikāṅkṣatām | anyathā hyācarankarma puruṣaḥ syātsubāliśaḥ"
  - id: 'udyoga-5-5-5'
    kind: verse
    lines:
      - ते विवाहार्थमानीता वयं सर्वे तथा भवान्
      - कृते विवाहे मुदिता गमिष्यामो गृहान्प्रति
    iast: "te vivāhārthamānītā vayaṃ sarve tathā bhavān | kṛte vivāhe muditā gamiṣyāmo gṛhānprati"
  - id: 'udyoga-5-5-8'
    kind: verse
    lines:
      - स भवान्प्रेषयत्वद्य पाण्डवार्थकरं वचः
      - सर्वेषां निश्चितं तन्नः प्रेषयिष्यति यद्भवान्
    iast: "sa bhavānpreṣayatvadya pāṇḍavārthakaraṃ vacaḥ | sarveṣāṃ niścitaṃ tannaḥ preṣayiṣyati yadbhavān"
  - id: 'udyoga-5-5-12'
    kind: verse
    lines:
      - ततः सत्कृत्य वार्ष्णेयं विराटः पृथिवीपतिः
      - गृहान्प्रस्थापयामास सगणं सहबान्धवम्
    iast: "tataḥ satkṛtya vārṣṇeyaṃ virāṭaḥ pṛthivīpatiḥ | gṛhānprasthāpayāmāsa sagaṇaṃ sahabāndhavam"
  - id: 'udyoga-5-5-19'
    kind: verse
    lines:
      - चालयन्तीव गां देवीं सपर्वतवनामिमाम् ततः प्रज्ञावयोवृद्धं पाञ्चाल्यः स्वपुरोहितम्
      - कुरुभ्यः प्रेषयामास युधिष्ठिरमते स्थितः
    iast: "cālayantīva gāṃ devīṃ saparvatavanāmimām tataḥ prajñāvayovṛddhaṃ pāñcālyaḥ svapurohitam | kurubhyaḥ preṣayāmāsa yudhiṣṭhiramate sthitaḥ"
  - id: 'udyoga-5-7-4'
    kind: verse
    lines:
      - सर्वमागमयामास पाण्डवानां विचेष्टितम्
      - धृतराष्ट्रात्मजो राजा गूढैः प्रणिहितैश्चरैः
    iast: "sarvamāgamayāmāsa pāṇḍavānāṃ viceṣṭitam | dhṛtarāṣṭrātmajo rājā gūḍhaiḥ praṇihitaiścaraiḥ"
  - id: 'udyoga-5-7-5'
    kind: verse
    lines:
      - स श्रुत्वा माधवं यान्तं सदश्वैरनिलोपमैः
      - बलेन नातिमहता द्वारकामभ्ययात्पुरीम्
    iast: "sa śrutvā mādhavaṃ yāntaṃ sadaśvairanilopamaiḥ | balena nātimahatā dvārakāmabhyayātpurīm"
  - id: 'udyoga-5-7-6'
    kind: verse
    lines:
      - तमेव दिवसं चापि कौन्तेयः पाण्डुनन्दनः
      - आनन्रतनगरीं रम्यां जगामाशु धनञ्जयः
    iast: "tameva divasaṃ cāpi kaunteyaḥ pāṇḍunandanaḥ | ānanratanagarīṃ ramyāṃ jagāmāśu dhanañjayaḥ"
  - id: 'udyoga-5-7-7'
    kind: verse
    lines:
      - तौ यात्वा पुरुषव्याघ्रौ द्वारकां कुरुनन्दनौ
      - सुप्तं ददृशतुः कृष्णं शयानं चाभिजग्मतुः
    iast: "tau yātvā puruṣavyāghrau dvārakāṃ kurunandanau | suptaṃ dadṛśatuḥ kṛṣṇaṃ śayānaṃ cābhijagmatuḥ"
  - id: 'udyoga-5-7-8'
    kind: verse
    lines:
      - दुर्योधनस्तु प्रथमं वासुदेवमुपाश्रयत्
      - उच्छीर्षतश्च कृष्णस्य निषसाद वरासने
    iast: "duryodhanastu prathamaṃ vāsudevamupāśrayat | ucchīrṣataśca kṛṣṇasya niṣasāda varāsane"
  - id: 'udyoga-5-7-9'
    kind: verse
    lines:
      - ततः किरीटी तस्यानु प्रविवेश महामनाः
      - पश्चार्धे तु स कृष्णस्य प्रह्वोऽतिष्ठत्कृताञ्जलिः
    iast: "tataḥ kirīṭī tasyānu praviveśa mahāmanāḥ | paścārdhe tu sa kṛṣṇasya prahvo'tiṣṭhatkṛtāñjaliḥ"
  - id: 'udyoga-5-7-10'
    kind: verse
    lines:
      - प्रतिबुद्धः स वार्ष्णेयो ददर्शाग्रे किरीटिनाम्
      - सिंहासनगतं पश्चात्परिवृत्य च दृष्टवान्
    iast: "pratibuddhaḥ sa vārṣṇeyo dadarśāgre kirīṭinām | siṃhāsanagataṃ paścātparivṛtya ca dṛṣṭavān"
  - id: 'udyoga-5-7-11'
    kind: verse
    lines:
      - स तयोः स्वागतं कृत्वा यथावत्प्रतिपूज्य तौ
      - तदागमनजं हेतुं पप्रच्छ मधुसूदनः
    iast: "sa tayoḥ svāgataṃ kṛtvā yathāvatpratipūjya tau | tadāgamanajaṃ hetuṃ papraccha madhusūdanaḥ"
  - id: 'udyoga-5-7-12'
    kind: verse
    lines:
      - ततो दुर्योधनः कृष्णामुवाच प्रहसन्निव
      - विग्रहेऽस्मिन्भवान्साह्यं मम दातुमिहार्हति
    iast: "tato duryodhanaḥ kṛṣṇāmuvāca prahasanniva | vigrahe'sminbhavānsāhyaṃ mama dātumihārhati"
  - id: 'udyoga-5-7-13'
    kind: verse
    lines:
      - समं हि भवतः सख्यं मम चैवार्जुनेऽपि च
      - तथा संबन्धकं तुल्यमस्माकं त्वयि माधव
    iast: "samaṃ hi bhavataḥ sakhyaṃ mama caivārjune'pi ca | tathā saṃbandhakaṃ tulyamasmākaṃ tvayi mādhava"
  - id: 'udyoga-5-7-14'
    kind: verse
    lines:
      - अहं चाभिगतं सन्तो भजन्ते पूर्वसारिणः त्वं च श्रेष्ठतमो लोके सतामद्य जनार्दन
    iast: "ahaṃ cābhigataṃ santo bhajante pūrvasāriṇaḥ tvaṃ ca śreṣṭhatamo loke satāmadya janārdana"
  - id: 'udyoga-5-7-16'
    kind: verse
    lines:
      - भवानभिगतः पूर्वमत्र मे नास्ति संशयः
      - दृष्टस्तु प्रथमं राजन्मया पार्थो धनञ्जयः
    iast: "bhavānabhigataḥ pūrvamatra me nāsti saṃśayaḥ | dṛṣṭastu prathamaṃ rājanmayā pārtho dhanañjayaḥ"
  - id: 'udyoga-5-7-17'
    kind: verse
    lines:
      - तव पूर्वाभिगमनात्पूर्वं चाप्यस्य दर्शनात्
      - साहाय्यमुभयोरेव करिष्यामि सुयोधन
    iast: "tava pūrvābhigamanātpūrvaṃ cāpyasya darśanāt | sāhāyyamubhayoreva kariṣyāmi suyodhana"
  - id: 'udyoga-5-7-18'
    kind: verse
    lines:
      - प्रवारणं तु बालानां पूर्वं कार्यमिति श्रुतिः
      - तस्मात्प्रवारणं पूर्वमर्हः पार्थो धनञ्जयः
    iast: "pravāraṇaṃ tu bālānāṃ pūrvaṃ kāryamiti śrutiḥ | tasmātpravāraṇaṃ pūrvamarhaḥ pārtho dhanañjayaḥ"
  - id: 'udyoga-5-7-19'
    kind: verse
    lines:
      - मत्संहननतुल्यानां गोपानामर्बुदं महत्
      - नारायणा इति ख्याताः सर्वे संग्रामयोधिनः
    iast: "matsaṃhananatulyānāṃ gopānāmarbudaṃ mahat | nārāyaṇā iti khyātāḥ sarve saṃgrāmayodhinaḥ"
  - id: 'udyoga-5-7-20'
    kind: verse
    lines:
      - ते वा युधि दुराधर्षा भवन्त्वेकस्य सैनिकाः
      - अयुध्यमानः संग्रामे न्यस्तशस्त्रोऽहमेकतः
    iast: "te vā yudhi durādharṣā bhavantvekasya sainikāḥ | ayudhyamānaḥ saṃgrāme nyastaśastro'hamekataḥ"
  - id: 'udyoga-5-7-21'
    kind: verse
    lines:
      - आभ्यामन्यतरं पार्थ यत्ते हृद्यतरं मतम्
      - तद्वृणीतां भवानग्रे प्रवार्यस्त्वं हि धर्मतः
    iast: "ābhyāmanyataraṃ pārtha yatte hṛdyataraṃ matam | tadvṛṇītāṃ bhavānagre pravāryastvaṃ hi dharmataḥ"
  - id: 'udyoga-5-7-23'
    kind: verse
    lines:
      - एवमुक्तस्तु कृष्णेन कुन्तीपुत्रे धनञ्जयः
      - अयुध्यमानं संग्रामे वरयामास केशवम्
    iast: "evamuktastu kṛṣṇena kuntīputre dhanañjayaḥ | ayudhyamānaṃ saṃgrāme varayāmāsa keśavam"
  - id: 'udyoga-5-7-25'
    kind: verse
    lines:
      - दुर्योधनस्तु तत्सैन्यं सर्वमावरयत्तदा
      - सहस्राणां महस्रं तु योधानां प्राप्य भारत
    iast: "duryodhanastu tatsainyaṃ sarvamāvarayattadā | sahasrāṇāṃ mahasraṃ tu yodhānāṃ prāpya bhārata"
  - id: 'udyoga-5-7-26'
    kind: verse
    lines:
      - कृष्णं चापहृतं ज्ञात्वा संप्राप परमां मुदम्
      - दुर्योधनस्तु तत्सैन्यं सर्वमादाय पार्थिवः
    iast: "kṛṣṇaṃ cāpahṛtaṃ jñātvā saṃprāpa paramāṃ mudam | duryodhanastu tatsainyaṃ sarvamādāya pārthivaḥ"
  - id: 'udyoga-5-7-39'
    kind: verse
    lines:
      - सारथ्यं तु त्वया कार्यमिति मे मानसं सदा
      - चिररात्रेप्सितं कामं तद्भवान्कर्तुमर्हति
      - वासुदेव उवाच
    iast: "sārathyaṃ tu tvayā kāryamiti me mānasaṃ sadā | cirarātrepsitaṃ kāmaṃ tadbhavānkartumarhati | vāsudeva uvāca"
  - id: 'udyoga-5-7-40'
    kind: verse
    lines:
      - उपपन्नमिदं पार्थ यत्स्पर्धसि मया सह
      - सारथ्यं ते करिष्यामि कामः संपद्यतां तव
      - वैशंपायन उवाच
    iast: "upapannamidaṃ pārtha yatspardhasi mayā saha | sārathyaṃ te kariṣyāmi kāmaḥ saṃpadyatāṃ tava | vaiśaṃpāyana uvāca"
  - id: 'udyoga-5-7-41'
    kind: verse
    lines:
      - एवं प्रमुदितः पार्थः कुष्णेन सहितस्तदा
      - वृतो दाशार्हप्रवरैः पुनरायाद्युधिष्ठिरम्
    iast: "evaṃ pramuditaḥ pārthaḥ kuṣṇena sahitastadā | vṛto dāśārhapravaraiḥ punarāyādyudhiṣṭhiram"
  - id: 'udyoga-5-8-1'
    kind: verse
    lines:
      - शल्यः श्रुत्वा तु दूतानां सैन्येन महता वृतः
      - अभ्यात्पाण्डवान्राजन्सह पुत्रैर्महारथैः
    iast: "śalyaḥ śrutvā tu dūtānāṃ sainyena mahatā vṛtaḥ | abhyātpāṇḍavānrājansaha putrairmahārathaiḥ"
  - id: 'udyoga-5-8-6'
    kind: verse
    lines:
      - व्यथयन्निव भूतानि कम्पयन्निव मेदिनीम्
      - शनैर्विश्रामयन्सेनां स ययौ यत्र पाण्डवः
    iast: "vyathayanniva bhūtāni kampayanniva medinīm | śanairviśrāmayansenāṃ sa yayau yatra pāṇḍavaḥ"
  - id: 'udyoga-5-8-8'
    kind: verse
    lines:
      - कारयामास पूजार्थं तस्य दुर्योधनः सभाः
      - रमणीयेषु देशेषु रत्नचित्राः स्वलङ्कृताः
    iast: "kārayāmāsa pūjārthaṃ tasya duryodhanaḥ sabhāḥ | ramaṇīyeṣu deśeṣu ratnacitrāḥ svalaṅkṛtāḥ"
  - id: 'udyoga-5-8-16'
    kind: verse
    lines:
      - संप्रहृष्टो यदा शल्यो दिदित्सुरपि जीवितम्
      - गूढो दुर्योधनस्तत्र दर्शयामास मातुलम्
    iast: "saṃprahṛṣṭo yadā śalyo diditsurapi jīvitam | gūḍho duryodhanastatra darśayāmāsa mātulam"
  - id: 'udyoga-5-8-17'
    kind: verse
    lines:
      - तं दृष्ट्वा मद्रराजश्च ज्ञात्वा यत्नं च तस्य तम्
      - परिष्वज्याब्रवीत्प्रीत इष्टोऽर्थो ध्रियतामिति
      - दुर्योधन उवाच
    iast: "taṃ dṛṣṭvā madrarājaśca jñātvā yatnaṃ ca tasya tam | pariṣvajyābravītprīta iṣṭo'rtho dhriyatāmiti | duryodhana uvāca"
  - id: 'udyoga-5-8-18'
    kind: verse
    lines:
      - सत्यवाग्भव कल्याण वरो वै मम दीयताम्
      - सर्वसेनाप्रणेता वै भवान्भवितुमर्हति
    iast: "satyavāgbhava kalyāṇa varo vai mama dīyatām | sarvasenāpraṇetā vai bhavānbhavitumarhati"
  - id: 'udyoga-5-8-20'
    kind: verse
    lines:
      - कृतमित्यब्रवीच्छल्यः किमन्यत्क्रियतामिति
      - कृतमित्येव गान्धारिः प्रत्युवाच पुनःपुनः
      - शल्य उवाच
    iast: "kṛtamityabravīcchalyaḥ kimanyatkriyatāmiti | kṛtamityeva gāndhāriḥ pratyuvāca punaḥpunaḥ | śalya uvāca"
  - id: 'udyoga-5-18-25'
    kind: verse
    lines:
      - ततस्त्वामन्त्र्य कौन्तेयाञ्छल्यो मद्राधिपस्तदा
      - जगाम सबलः श्रीमान्दुर्योधनमरिन्दम
    iast: "tatastvāmantrya kaunteyāñchalyo madrādhipastadā | jagāma sabalaḥ śrīmānduryodhanamarindama"
  - id: 'udyoga-5-19-14'
    kind: verse
    lines:
      - इतश्चेतश्च पाण्डूनां समाजग्मुर्महात्मनाम्
      - अक्षौहिण्यस्तु सप्तैव विविधध्वजसङ्कुलाः
    iast: "itaścetaśca pāṇḍūnāṃ samājagmurmahātmanām | akṣauhiṇyastu saptaiva vividhadhvajasaṅkulāḥ"
  - id: 'udyoga-5-19-18'
    kind: verse
    lines:
      - दुर्योधनमुपायातावक्षौहिण्या पृथक्पृथक्
      - कृतवर्मा च हार्दिक्यो भोजान्धकुकुरैः सह
    iast: "duryodhanamupāyātāvakṣauhiṇyā pṛthakpṛthak | kṛtavarmā ca hārdikyo bhojāndhakukuraiḥ saha"
  - id: 'udyoga-5-19-27'
    kind: verse
    lines:
      - तिस्रोऽन्याः समवर्तन्त वाहिन्यो भरतर्षभ
      - एवमेकादशावृत्ताः सेना दुर्योधनस्य ताः
    iast: "tisro'nyāḥ samavartanta vāhinyo bharatarṣabha | evamekādaśāvṛttāḥ senā duryodhanasya tāḥ"
  - id: 'udyoga-5-19-33'
    kind: verse
    lines:
      - यः स पाञ्चालराजेन प्रेषितः कौरवान्प्रति
    iast: "yaḥ sa pāñcālarājena preṣitaḥ kauravānprati"
  - id: 'udyoga-5-20-2'
    kind: verse
    lines:
      - सर्वकौशल्यमुक्त्वाऽऽदौ पृष्ट्वा चैवमनामयम्
      - सर्वसेनाप्रणेतॄणां मध्ये वाक्यमुवाच ह
    iast: "sarvakauśalyamuktvā''dau pṛṣṭvā caivamanāmayam | sarvasenāpraṇetṝṇāṃ madhye vākyamuvāca ha"
  - id: 'udyoga-5-20-12'
    kind: verse
    lines:
      - ते सर्वं पृष्ठतः कृत्वा तत्पूर्वं कर्म किल्विषम्
      - साम्नैव कुरुभिः सन्धिमिच्छन्ति कुरुपुङ्गवाः
    iast: "te sarvaṃ pṛṣṭhataḥ kṛtvā tatpūrvaṃ karma kilviṣam | sāmnaiva kurubhiḥ sandhimicchanti kurupuṅgavāḥ"
  - id: 'udyoga-5-20-21'
    kind: verse
    lines:
      - ते भवन्तो यथाधर्मं यथासमयमेव च
      - प्रयच्छन्तु प्रदातव्यं मा वः कालोऽत्यगादयम्
    iast: "te bhavanto yathādharmaṃ yathāsamayameva ca | prayacchantu pradātavyaṃ mā vaḥ kālo'tyagādayam"
  - id: 'udyoga-5-21-20'
    kind: verse
    lines:
      - अस्मद्धितं वाक्यमिदं भीष्मः शान्तनवोऽब्रवीत्
      - पाण्डवानां हितं चैव सर्वस्य जगतस्तथा
    iast: "asmaddhitaṃ vākyamidaṃ bhīṣmaḥ śāntanavo'bravīt | pāṇḍavānāṃ hitaṃ caiva sarvasya jagatastathā"
  - id: 'udyoga-5-21-21'
    kind: verse
    lines:
      - चिन्तयित्वा तु पार्थेभ्यः प्रेषयिष्यामि सञ्जयम्
      - स भवान्प्रतियात्वद्य पाण्डवानेव माचिरम्
    iast: "cintayitvā tu pārthebhyaḥ preṣayiṣyāmi sañjayam | sa bhavānpratiyātvadya pāṇḍavāneva māciram"
  - id: 'udyoga-5-22-1'
    kind: verse
    lines:
      - प्राप्तानाहुः सञ्जय पाण्डुपुत्रानुपप्लव्ये तान्विजानीहि गत्वा
      - अजातशत्रुं च सभाजयेथा दिष्ट्या वनाद्ग्राममुपस्थितस्त्वम्
    iast: "prāptānāhuḥ sañjaya pāṇḍuputrānupaplavye tānvijānīhi gatvā | ajātaśatruṃ ca sabhājayethā diṣṭyā vanādgrāmamupasthitastvam"
  - id: 'udyoga-5-22-39'
    kind: verse
    lines:
      - प्रियश्चैषामात्मसमश्च कृष्णो विद्वांश्चैषां कर्मणि नित्ययुक्तः
      - समानीतान्पाण्डवान्सृञ्जयांश्च जनार्दनं युयुधानं विराटम्
    iast: "priyaścaiṣāmātmasamaśca kṛṣṇo vidvāṃścaiṣāṃ karmaṇi nityayuktaḥ | samānītānpāṇḍavānsṛñjayāṃśca janārdanaṃ yuyudhānaṃ virāṭam"
  - id: 'udyoga-5-22-40'
    kind: verse
    lines:
      - अनामयं मद्वचनेन पृच्छेः सर्वांस्तथा द्रौपदेयांश्च पञ्च
      - यद्यत्तत्र प्राप्तकलं परेभ्यस्त्वं मन्येथा भारतानां हितं च तद्भाषेथाः सञ्जय राजमध्ये
      - न मूर्च्छयेद्यन्न च युद्धहेतुः
    iast: "anāmayaṃ madvacanena pṛccheḥ sarvāṃstathā draupadeyāṃśca pañca | yadyattatra prāptakalaṃ parebhyastvaṃ manyethā bhāratānāṃ hitaṃ ca tadbhāṣethāḥ sañjaya rājamadhye | na mūrcchayedyanna ca yuddhahetuḥ"
  - id: 'udyoga-5-23-2'
    kind: verse
    lines:
      - स तु राजानमासाद्य कुन्तीपुत्रं युधिष्ठिरम्
      - अभिवाद्य ततः पूर्वं सूतपुत्रोऽभ्यभाषत
    iast: "sa tu rājānamāsādya kuntīputraṃ yudhiṣṭhiram | abhivādya tataḥ pūrvaṃ sūtaputro'bhyabhāṣata"
  - id: 'udyoga-5-23-3'
    kind: verse
    lines:
      - गवल्गणिः सञ्जयः सूतसूनुरजातशत्रुमवदत्प्रतीतः
      - दिष्ट्या राजंस्त्वामरोगं प्रपश्ये सहायवन्तं च महेन्द्रकल्पम्
    iast: "gavalgaṇiḥ sañjayaḥ sūtasūnurajātaśatrumavadatpratītaḥ | diṣṭyā rājaṃstvāmarogaṃ prapaśye sahāyavantaṃ ca mahendrakalpam"
  - id: 'udyoga-5-23-4'
    kind: verse
    lines:
      - अनामयं पृच्छति त्वाम्बिकेयो वृद्धो राजा धृतराष्ट्रो मनीषी
      - कच्चिद्भीमः कुशली पाण्डवाग्र्यो धनञ्जयस्तौ च माद्रीतनूजौ
    iast: "anāmayaṃ pṛcchati tvāmbikeyo vṛddho rājā dhṛtarāṣṭro manīṣī | kaccidbhīmaḥ kuśalī pāṇḍavāgryo dhanañjayastau ca mādrītanūjau"
  - id: 'udyoga-5-25-4'
    kind: verse
    lines:
      - शमं राजा धृतराष्ट्रोऽभिनन्दन्नयोजयत्त्वरमाणो रथं मे
      - सभ्रातृपुत्रस्वजनस्य राज्ञस्तद्रोचतां पाण्डवानां शमोऽस्तु
    iast: "śamaṃ rājā dhṛtarāṣṭro'bhinandannayojayattvaramāṇo rathaṃ me | sabhrātṛputrasvajanasya rājñastadrocatāṃ pāṇḍavānāṃ śamo'stu"
  - id: 'udyoga-5-26-27'
    kind: verse
    lines:
      - सचेदेतां प्रतिपद्येत बुद्धिं वृद्धो राजा सह पुत्रेण सूत
      - एवं रणे पाण्डवकोपदग्धा न नश्येयुः सञ्जय धार्तराष्ट्राः
    iast: "sacedetāṃ pratipadyeta buddhiṃ vṛddho rājā saha putreṇa sūta | evaṃ raṇe pāṇḍavakopadagdhā na naśyeyuḥ sañjaya dhārtarāṣṭrāḥ"
  - id: 'udyoga-5-26-29'
    kind: verse
    lines:
      - अद्यापि सा तत्र तथैव वर्ततां यान्ति गमिष्यामि यथा न्वमात्थ
      - द्वन्द्राप्रव्ये भवतु ममैव राज्यं सूयोधनो यच्छतु भाग्नाग्र्यः
    iast: "adyāpi sā tatra tathaiva vartatāṃ yānti gamiṣyāmi yathā nvamāttha | dvandrāpravye bhavatu mamaiva rājyaṃ sūyodhano yacchatu bhāgnāgryaḥ"
  - id: 'udyoga-5-28-10'
    kind: verse
    lines:
      - यदि ह्यहं विसृजत्साम गर्ह्यो नियुध्यमानो यदि जह्यां स्वधर्मम्
      - महायशाः केशवस्तद्ब्रवीतु वासुदेवस्तूभयोरर्थकामः
    iast: "yadi hyahaṃ visṛjatsāma garhyo niyudhyamāno yadi jahyāṃ svadharmam | mahāyaśāḥ keśavastadbravītu vāsudevastūbhayorarthakāmaḥ"
  - id: 'udyoga-5-28-14'
    kind: verse
    lines:
      - ईदृशोऽयं केशवस्तात विद्वान् विद्धि ह्येनं कर्मणां निश्चयज्ञम्
      - प्रियश्च नः साधुतमश्च कृष्णो नातिक्रामे वचनं केशवस्य
    iast: "īdṛśo'yaṃ keśavastāta vidvān viddhi hyenaṃ karmaṇāṃ niścayajñam | priyaśca naḥ sādhutamaśca kṛṣṇo nātikrāme vacanaṃ keśavasya"
  - id: 'udyoga-5-29-1'
    kind: verse
    lines:
      - अविनाशं सञ्जय पाण्डवानामिच्छाम्यहं भूतिमेषां प्रियं च
      - तथा राज्ञो धृतराष्ट्रस्य सूत समाशंसे बहुपुत्रस्य वृद्धिम्
    iast: "avināśaṃ sañjaya pāṇḍavānāmicchāmyahaṃ bhūtimeṣāṃ priyaṃ ca | tathā rājño dhṛtarāṣṭrasya sūta samāśaṃse bahuputrasya vṛddhim"
  - id: 'udyoga-5-29-47'
    kind: verse
    lines:
      - स्वयं त्वहं प्रार्थये तत्र गन्तुं समाधातुं कार्यमेतद्विपन्नम्
      - जानासि त्वं धार्तराष्ट्रस्य मोहं दुरात्मनः पापवशानुगस्य
    iast: "svayaṃ tvahaṃ prārthaye tatra gantuṃ samādhātuṃ kāryametadvipannam | jānāsi tvaṃ dhārtarāṣṭrasya mohaṃ durātmanaḥ pāpavaśānugasya"
  - id: 'udyoga-5-29-48'
    kind: verse
    lines:
      - अहापयित्वा यदि पाण्डवार्थं शमं कुरूणामपि चेच्छकेयम्
      - पुण्यं च मे स्याच्चरितं महोदयं मुच्येरंश्च कुरवो मृत्युपाशात्
    iast: "ahāpayitvā yadi pāṇḍavārthaṃ śamaṃ kurūṇāmapi cecchakeyam | puṇyaṃ ca me syāccaritaṃ mahodayaṃ mucyeraṃśca kuravo mṛtyupāśāt"
  - id: 'udyoga-5-29-59'
    kind: verse
    lines:
      - स्थिताः शुश्रूषितुं पार्थाः स्थिता योद्धुमरिन्दमाः
      - यत्कृत्यं धृतराष्ट्रस्य तत्करोतु नराधिपः
    iast: "sthitāḥ śuśrūṣituṃ pārthāḥ sthitā yoddhumarindamāḥ | yatkṛtyaṃ dhṛtarāṣṭrasya tatkarotu narādhipaḥ"
  - id: 'udyoga-5-31-4'
    kind: verse
    lines:
      - गावल्गणे कुरून्गत्वा धृतराष्ट्रं महाबलम्
      - अभिवाद्योपसंगृह्य ततः पृच्छेरनामयम्
    iast: "gāvalgaṇe kurūngatvā dhṛtarāṣṭraṃ mahābalam | abhivādyopasaṃgṛhya tataḥ pṛccheranāmayam"
  - id: 'udyoga-5-31-5'
    kind: verse
    lines:
      - ब्रूयाश्चैनं त्वमासीनं कुरुभिः परिवारितम्
      - तवैव राजन्वीर्येण सुखं जीवन्ति पाण्डवाः
    iast: "brūyāścainaṃ tvamāsīnaṃ kurubhiḥ parivāritam | tavaiva rājanvīryeṇa sukhaṃ jīvanti pāṇḍavāḥ"
  - id: 'udyoga-5-31-6'
    kind: verse
    lines:
      - तव प्रसादाद्बालास्ते प्राप्ता राज्यमरिन्दम
      - राज्ये तान्स्थापयित्वाऽग्रे नोपेक्षस्व विनश्यतः
    iast: "tava prasādādbālāste prāptā rājyamarindama | rājye tānsthāpayitvā'gre nopekṣasva vinaśyataḥ"
  - id: 'udyoga-5-31-7'
    kind: verse
    lines:
      - सर्वमप्येतदेकस्य नालं सञ्जय कस्यचित्
      - तात संहत्य जीवामो द्विषतां मा वशं गमः
    iast: "sarvamapyetadekasya nālaṃ sañjaya kasyacit | tāta saṃhatya jīvāmo dviṣatāṃ mā vaśaṃ gamaḥ"
  - id: 'udyoga-5-31-9'
    kind: verse
    lines:
      - अभिवाद्य च वक्तव्यस्ततोऽस्माकं पितामहः
      - भवता शन्तनोर्वंशो निमग्नः पुनरुद्धृतः
    iast: "abhivādya ca vaktavyastato'smākaṃ pitāmahaḥ | bhavatā śantanorvaṃśo nimagnaḥ punaruddhṛtaḥ"
  - id: 'udyoga-5-31-10'
    kind: verse
    lines:
      - स त्वं कुरु तथा तात स्वमतेन पितामह
      - यथा जीवन्ति ते पौत्राः प्रीतिमन्तः परस्परम्
    iast: "sa tvaṃ kuru tathā tāta svamatena pitāmaha | yathā jīvanti te pautrāḥ prītimantaḥ parasparam"
  - id: 'udyoga-5-31-11'
    kind: verse
    lines:
      - तथैव विदुरं ब्रूयाः कुरूणां मन्त्रधारिणम्
      - अयुद्धं सौम्य भाषस्व हितकामो युधिष्ठिरे
    iast: "tathaiva viduraṃ brūyāḥ kurūṇāṃ mantradhāriṇam | ayuddhaṃ saumya bhāṣasva hitakāmo yudhiṣṭhire"
  - id: 'udyoga-5-31-12'
    kind: verse
    lines:
      - अथ दुर्योधनं ब्रूया राजपुत्रममर्षणम्
      - मध्ये कुरूणामासीनमनुनीय पुनः पुनः
    iast: "atha duryodhanaṃ brūyā rājaputramamarṣaṇam | madhye kurūṇāmāsīnamanunīya punaḥ punaḥ"
  - id: 'udyoga-5-31-15'
    kind: verse
    lines:
      - यन्नः प्रव्राजयेः सौम्य अजिनैः प्रतिवासितान्
      - तद्दुःखमतितिक्षाम मा वधीषय कुरूनिति
    iast: "yannaḥ pravrājayeḥ saumya ajinaiḥ prativāsitān | tadduḥkhamatitikṣāma mā vadhīṣaya kurūniti"
  - id: 'udyoga-5-31-16'
    kind: verse
    lines:
      - यत्कुन्तीं समतिक्रम्य कृष्णां केशेष्वधर्षयत्
      - दुःशासनस्तेऽनुमते तच्चास्माभिरुपेक्षितम्
    iast: "yatkuntīṃ samatikramya kṛṣṇāṃ keśeṣvadharṣayat | duḥśāsanaste'numate taccāsmābhirupekṣitam"
  - id: 'udyoga-5-31-17'
    kind: verse
    lines:
      - अथोचितं स्वकं भागं लभेमहि परन्तप
      - निवर्तय परद्रव्याद्बुद्धिं गृद्धां नरर्षभ
    iast: "athocitaṃ svakaṃ bhāgaṃ labhemahi parantapa | nivartaya paradravyādbuddhiṃ gṛddhāṃ nararṣabha"
  - id: 'udyoga-5-31-18'
    kind: verse
    lines:
      - शान्तिरेवं भवेद्राजन्प्रीतिश्चैव परस्परम्
      - राज्यैकदेशमपि नः प्रयच्छ शममिच्छताम्
    iast: "śāntirevaṃ bhavedrājanprītiścaiva parasparam | rājyaikadeśamapi naḥ prayaccha śamamicchatām"
  - id: 'udyoga-5-31-20'
    kind: verse
    lines:
      - भ्रातॄणां देहि पञ्चानां पञ्च ग्रामान्सुयोधन
      - शान्तिर्नोस्तु महाप्राज्ञ ज्ञातिभिः सह सञ्जय
    iast: "bhrātṝṇāṃ dehi pañcānāṃ pañca grāmānsuyodhana | śāntirnostu mahāprājña jñātibhiḥ saha sañjaya"
  - id: 'udyoga-5-31-22'
    kind: verse
    lines:
      - अक्षतान्कुरु पाञ्चालान्पश्येयमिति कामये
      - सर्वे सुमनसस्तात शाम्याय भरतर्षभ
    iast: "akṣatānkuru pāñcālānpaśyeyamiti kāmaye | sarve sumanasastāta śāmyāya bharatarṣabha"
  - id: 'udyoga-5-31-23'
    kind: verse
    lines:
      - अलमेव शमायास्मि तथा युद्धाय सञ्जय
      - धर्मार्थयोरलं चाहं मृदवे दारुणाय च
    iast: "alameva śamāyāsmi tathā yuddhāya sañjaya | dharmārthayoralaṃ cāhaṃ mṛdave dāruṇāya ca"
  - id: 'udyoga-5-32-8'
    kind: verse
    lines:
      - अनुज्ञातः पाण्डवेन प्रययौ सञ्जयस्तदा
      - शासनं धृतराष्ट्रस्यक सर्वं कृत्वा महात्मनः
    iast: "anujñātaḥ pāṇḍavena prayayau sañjayastadā | śāsanaṃ dhṛtarāṣṭrasyaka sarvaṃ kṛtvā mahātmanaḥ"
  - id: 'udyoga-5-32-9'
    kind: verse
    lines:
      - तदा तु सञ्जयः क्षिप्रमेकाहेन परन्तपः याति स्म हास्तिनपुरं निशाकाले परन्तप
    iast: "tadā tu sañjayaḥ kṣipramekāhena parantapaḥ yāti sma hāstinapuraṃ niśākāle parantapa"
  - id: 'udyoga-5-47-2'
    kind: verse
    lines:
      - तस्यां रजन्यां व्युष्टायां राजानः सर्व एव ते
      - सभामाविविशुर्हृष्टाःक सूतस्योपदिदृक्षया
    iast: "tasyāṃ rajanyāṃ vyuṣṭāyāṃ rājānaḥ sarva eva te | sabhāmāviviśurhṛṣṭāḥka sūtasyopadidṛkṣayā"
  - id: 'udyoga-5-47-3'
    kind: verse
    lines:
      - शुश्रूषमाणाः पार्थानां वाचो धर्मार्थसंहिताः
      - धृतराष्ट्रमुखाः सर्वे ययू राजन्सभां शुभाम्
    iast: "śuśrūṣamāṇāḥ pārthānāṃ vāco dharmārthasaṃhitāḥ | dhṛtarāṣṭramukhāḥ sarve yayū rājansabhāṃ śubhām"
  - id: 'udyoga-5-48-2'
    kind: verse
    lines:
      - दुर्योधनो वाचमिमां श्रृणोतु यदब्रवीदर्जुनो योत्स्यमानः
      - युधिष्ठिरस्यानुमते महात्मा धनञ्जयः श्रृण्वतः केशवस्य
    iast: "duryodhano vācamimāṃ śrṛṇotu yadabravīdarjuno yotsyamānaḥ | yudhiṣṭhirasyānumate mahātmā dhanañjayaḥ śrṛṇvataḥ keśavasya"
  - id: 'udyoga-5-48-94'
    kind: verse
    lines:
      - न चेदिदं पौरुषं कर्मबद्धं न चेदस्मान्मन्यतेऽसौ विशिष्टान्
      - आशंसेऽहं वासुदेवद्वितीयो दुर्योधनं सानुबन्धं निहन्तुम्
    iast: "na cedidaṃ pauruṣaṃ karmabaddhaṃ na cedasmānmanyate'sau viśiṣṭān | āśaṃse'haṃ vāsudevadvitīyo duryodhanaṃ sānubandhaṃ nihantum"
  - id: 'udyoga-5-48-102'
    kind: verse
    lines:
      - अनालब्धं जृम्भति गाण्डिवं धनुरनाहता कम्पति मे धनुर्ज्या
      - बाणाश्च मे तूणमुखाद्विसृत्य मुहुर्मुहुर्गन्तुमुशन्ति चैव
    iast: "anālabdhaṃ jṛmbhati gāṇḍivaṃ dhanuranāhatā kampati me dhanurjyā | bāṇāśca me tūṇamukhādvisṛtya muhurmuhurgantumuśanti caiva"
  - id: 'udyoga-5-48-108'
    kind: verse
    lines:
      - ये वैजय्याः समरे सूत लब्ध्वा देवानपीन्द्रग्रमुखान्समेतात्
      - तैर्मन्मते कलहं संप्रसह्य स धार्तराष्ट्रः पश्यत मोहमस्य
    iast: "ye vaijayyāḥ samare sūta labdhvā devānapīndragramukhānsametāt | tairmanmate kalahaṃ saṃprasahya sa dhārtarāṣṭraḥ paśyata mohamasya"
  - id: 'udyoga-5-48-109'
    kind: verse
    lines:
      - वृद्धो भीष्मः शान्तनवः कृपश्च द्रोणः सपुत्रो विदुरश्च धीमान्
      - एते सर्वे यद्वदन्ते तदस्तु आयुष्मन्तः कुरवः सन्तु सर्वे
    iast: "vṛddho bhīṣmaḥ śāntanavaḥ kṛpaśca droṇaḥ saputro viduraśca dhīmān | ete sarve yadvadante tadastu āyuṣmantaḥ kuravaḥ santu sarve"
  - id: 'udyoga-5-49-1'
    kind: verse
    lines:
      - समवेतेषु सर्वेषु तेषु राजसु भारत
      - दुर्योधनमिदं वाक्यं भीष्मः शान्तनवोऽब्रवीत्
    iast: "samaveteṣu sarveṣu teṣu rājasu bhārata | duryodhanamidaṃ vākyaṃ bhīṣmaḥ śāntanavo'bravīt"
  - id: 'udyoga-5-49-19'
    kind: verse
    lines:
      - वासुदेवार्जुनौ वीरौ समवेतौ महारथौ
      - नरनारायणौ देवौ पूर्वदेवाविति श्रुतिः
    iast: "vāsudevārjunau vīrau samavetau mahārathau | naranārāyaṇau devau pūrvadevāviti śrutiḥ"
  - id: 'udyoga-5-49-23'
    kind: verse
    lines:
      - शङ्खचक्रगदाहस्तं यदा द्रक्ष्यसि केशवम्
      - पर्याददानं चास्त्राणि भीमधन्वानमर्जुनम्
    iast: "śaṅkhacakragadāhastaṃ yadā drakṣyasi keśavam | paryādadānaṃ cāstrāṇi bhīmadhanvānamarjunam"
  - id: 'udyoga-5-49-24'
    kind: verse
    lines:
      - सनातनौ महात्मानौ कृष्णावेकरथे स्थितौ
      - दुर्योधन तदा तात स्मर्तासि वचनं मम
    iast: "sanātanau mahātmānau kṛṣṇāvekarathe sthitau | duryodhana tadā tāta smartāsi vacanaṃ mama"
  - id: 'udyoga-5-49-31'
    kind: verse
    lines:
      - नाचरं वृजिनं किञ्चिद्धार्तराष्ट्रस्य नित्यशः
      - अहं हि पाण्डवान्सर्वान्हनिष्यामि रणे स्थितान्
    iast: "nācaraṃ vṛjinaṃ kiñciddhārtarāṣṭrasya nityaśaḥ | ahaṃ hi pāṇḍavānsarvānhaniṣyāmi raṇe sthitān"
  - id: 'udyoga-5-49-32'
    kind: verse
    lines:
      - प्राग्विरुद्धैः शमं सद्भिः कथं वा क्रियते पुनः राज्ञो हि धृतराष्ट्रस्य सर्वं कार्यं प्रियं मया
      - तथा दुर्योधनस्यापि स हि राज्ये समाहितः
      - वैशंपायन उवाच
    iast: "prāgviruddhaiḥ śamaṃ sadbhiḥ kathaṃ vā kriyate punaḥ rājño hi dhṛtarāṣṭrasya sarvaṃ kāryaṃ priyaṃ mayā | tathā duryodhanasyāpi sa hi rājye samāhitaḥ | vaiśaṃpāyana uvāca"
  - id: 'udyoga-5-49-33'
    kind: verse
    lines:
      - कर्णस्य तु वचः श्रुत्वा भीष्मः शान्तनवः पुनः
      - धृतराष्ट्रं महाराजमाभाष्येदं वचोऽब्रवीत्
    iast: "karṇasya tu vacaḥ śrutvā bhīṣmaḥ śāntanavaḥ punaḥ | dhṛtarāṣṭraṃ mahārājamābhāṣyedaṃ vaco'bravīt"
  - id: 'udyoga-5-49-34'
    kind: verse
    lines:
      - यदयं कत्थते नित्यं हन्ताहं पाण्डवानिति
      - नायं कलापि संपूर्णा पाण्डवानां महात्मनाम्
    iast: "yadayaṃ katthate nityaṃ hantāhaṃ pāṇḍavāniti | nāyaṃ kalāpi saṃpūrṇā pāṇḍavānāṃ mahātmanām"
  - id: 'udyoga-5-49-35'
    kind: verse
    lines:
      - अनयो योयमागन्ता पुत्राणां ते दुरात्मनाम्
      - तदस्य कर्म जानीहि सूतपुत्रस्य दुर्मतेः
    iast: "anayo yoyamāgantā putrāṇāṃ te durātmanām | tadasya karma jānīhi sūtaputrasya durmateḥ"
  - id: 'udyoga-5-49-40'
    kind: verse
    lines:
      - सहितान्हि कुरून्सर्वानभियातो धनञ्जयः
      - प्रमथ्य चाच्छिनद्वासः किमयं प्रोषितस्तदा
    iast: "sahitānhi kurūnsarvānabhiyāto dhanañjayaḥ | pramathya cācchinadvāsaḥ kimayaṃ proṣitastadā"
  - id: 'udyoga-5-49-41'
    kind: verse
    lines:
      - गन्धर्वैर्घोषयात्रायां ह्रियते यत्सुतस्तव
      - क्व तदा सूतपुत्रोऽभूद्य इदानीं वृषायते
    iast: "gandharvairghoṣayātrāyāṃ hriyate yatsutastava | kva tadā sūtaputro'bhūdya idānīṃ vṛṣāyate"
  - id: 'udyoga-5-49-42'
    kind: verse
    lines:
      - ननु तत्रापि भीमेन पार्थेन च महात्मना
      - यमाभ्यामेव संगम्य गन्धर्वास्ते पराजिताः
    iast: "nanu tatrāpi bhīmena pārthena ca mahātmanā | yamābhyāmeva saṃgamya gandharvāste parājitāḥ"
  - id: 'udyoga-5-49-45'
    kind: verse
    lines:
      - यदाह भरतश्रेष्ठो भीष्मस्तत्क्रियतां नृप
      - न काममवलिप्तानां वचनं कर्तुमर्हसि
    iast: "yadāha bharataśreṣṭho bhīṣmastatkriyatāṃ nṛpa | na kāmamavaliptānāṃ vacanaṃ kartumarhasi"
  - id: 'udyoga-5-49-46'
    kind: verse
    lines:
      - पुरा युद्धात्साधु मन्ये पाण्डवैः सह सङ्गतम्
      - यद्वाक्यमर्जुनेनोक्तं सञ्जयेन निवेदितम्
    iast: "purā yuddhātsādhu manye pāṇḍavaiḥ saha saṅgatam | yadvākyamarjunenoktaṃ sañjayena niveditam"
  - id: 'udyoga-5-49-47'
    kind: verse
    lines:
      - सर्वं तदभिजानामि करिष्यति च पाण्डवः
      - न ह्यस्य त्रिषु लोकेषु सदृशोऽस्ति धनुर्धरः
      - वैशंपायन उवाच
    iast: "sarvaṃ tadabhijānāmi kariṣyati ca pāṇḍavaḥ | na hyasya triṣu lokeṣu sadṛśo'sti dhanurdharaḥ | vaiśaṃpāyana uvāca"
  - id: 'udyoga-5-51-26'
    kind: verse
    lines:
      - क्रोशतो मे न श्रृण्वन्ति बालाः पण्डितमानिनः
      - विषमं न हि मन्यन्ते प्रापतं मधुदर्शिनः
    iast: "krośato me na śrṛṇvanti bālāḥ paṇḍitamāninaḥ | viṣamaṃ na hi manyante prāpataṃ madhudarśinaḥ"
  - id: 'udyoga-5-53-15'
    kind: verse
    lines:
      - एषा मे परमा बुद्धिर्यया शाम्यति मे मनः
      - यदि त्वयुद्धमिष्टं वो वयं शान्त्यै यतामहे
    iast: "eṣā me paramā buddhiryayā śāmyati me manaḥ | yadi tvayuddhamiṣṭaṃ vo vayaṃ śāntyai yatāmahe"
  - id: 'udyoga-5-55-1'
    kind: verse
    lines:
      - न भेतव्यं महाराज न शोच्या भवतां वयम्
      - समर्थाः स्म पराञ्जेतुं बलिनः समरे विभो
    iast: "na bhetavyaṃ mahārāja na śocyā bhavatāṃ vayam | samarthāḥ sma parāñjetuṃ balinaḥ samare vibho"
  - id: 'udyoga-5-55-30'
    kind: verse
    lines:
      - युधिष्ठिरः पुरं हित्वा पञ्चग्रामान्स याचते
      - भीतो हि मामकात्सैन्यात्प्रभावाच्चैव मे विभो
    iast: "yudhiṣṭhiraḥ puraṃ hitvā pañcagrāmānsa yācate | bhīto hi māmakātsainyātprabhāvāccaiva me vibho"
  - id: 'udyoga-5-55-66'
    kind: verse
    lines:
      - अक्षौहिण्यो हि मे राजन्दशैका च समाहृताः
      - न्यूना परेषां सप्तैव कस्मान्मे स्यात्पराजयः
    iast: "akṣauhiṇyo hi me rājandaśaikā ca samāhṛtāḥ | nyūnā pareṣāṃ saptaiva kasmānme syātparājayaḥ"
  - id: 'udyoga-5-55-69'
    kind: verse
    lines:
      - एतत्सर्वं समाज्ञाय बलाग्र्यं मम भारत
      - न्यूनतां पाण्डवानां च न मोहं गन्तुमर्हसि
    iast: "etatsarvaṃ samājñāya balāgryaṃ mama bhārata | nyūnatāṃ pāṇḍavānāṃ ca na mohaṃ gantumarhasi"
  - id: 'udyoga-5-58-2'
    kind: verse
    lines:
      - दुर्योधन निवर्तस्व युद्धाद्भरतसत्तम
      - न हि युद्धं प्रशंसन्ति सर्वावस्थमरिन्दम
    iast: "duryodhana nivartasva yuddhādbharatasattama | na hi yuddhaṃ praśaṃsanti sarvāvasthamarindama"
  - id: 'udyoga-5-58-3'
    kind: verse
    lines:
      - अलमर्धं पृथिव्यास्ते सहामात्यस्य जीवितुम्
      - प्रयच्छ पाण्डुपुत्राणां यथोचितमरिन्दम
    iast: "alamardhaṃ pṛthivyāste sahāmātyasya jīvitum | prayaccha pāṇḍuputrāṇāṃ yathocitamarindama"
  - id: 'udyoga-5-58-18'
    kind: verse
    lines:
      - यावद्धि सूच्यास्तीक्ष्णाया विध्येदग्रेण मारिष
      - तावदप्यपरित्याज्यं भूमेर्नः पाण्डवान्प्रति
      - धृतराष्ट्र उवाच
    iast: "yāvaddhi sūcyāstīkṣṇāyā vidhyedagreṇa māriṣa | tāvadapyaparityājyaṃ bhūmernaḥ pāṇḍavānprati | dhṛtarāṣṭra uvāca"
  - id: 'udyoga-5-66-1'
    kind: verse
    lines:
      - दुर्योधने धार्तराष्ट्रे तद्वचो नाभिनन्दति
      - तूष्णींभूतेषु सर्वेषु समुत्तस्थुर्नरर्षभाः
    iast: "duryodhane dhārtarāṣṭre tadvaco nābhinandati | tūṣṇīṃbhūteṣu sarveṣu samuttasthurnararṣabhāḥ"
  - id: 'udyoga-5-71-3'
    kind: verse
    lines:
      - सञ्जये प्रतियाते तु धर्मराजो युधिष्ठिरः
      - अर्जुनं भीमसेनं च माद्रीपुत्रौ च भारत
    iast: "sañjaye pratiyāte tu dharmarājo yudhiṣṭhiraḥ | arjunaṃ bhīmasenaṃ ca mādrīputrau ca bhārata"
  - id: 'udyoga-5-71-8'
    kind: verse
    lines:
      - जनार्दनं समासाद्य कुन्तीपुत्रो युधिष्ठिरः अब्रवीत्परवीरध्नं दाशार्हं पाण्डुनन्दनः
    iast: "janārdanaṃ samāsādya kuntīputro yudhiṣṭhiraḥ abravītparavīradhnaṃ dāśārhaṃ pāṇḍunandanaḥ"
  - id: 'udyoga-5-71-9'
    kind: verse
    lines:
      - अयं स कालः संप्राप्तो मित्राणां मित्रवत्सल
      - न च त्वदन्यं पश्यामि यो न आपत्सु तारयेत्
    iast: "ayaṃ sa kālaḥ saṃprāpto mitrāṇāṃ mitravatsala | na ca tvadanyaṃ paśyāmi yo na āpatsu tārayet"
  - id: 'udyoga-5-71-13'
    kind: verse
    lines:
      - श्रुतं ते धृतराष्ट्रस्य सपुत्रस्य चिकीर्षितम् एतद्धि सकलं कृष्ण सञ्जयो मां यदब्रवीत् मृदुपूर्वं साममिश्रं सममुग्रं च माधव न कतृं न्यायमास्थाय गर्हिताश्च ततो वयम्
    iast: "śrutaṃ te dhṛtarāṣṭrasya saputrasya cikīrṣitam etaddhi sakalaṃ kṛṣṇa sañjayo māṃ yadabravīt mṛdupūrvaṃ sāmamiśraṃ samamugraṃ ca mādhava na katṛṃ nyāyamāsthāya garhitāśca tato vayam"
  - id: 'udyoga-5-71-16'
    kind: verse
    lines:
      - अप्रदानेन राज्यस्य शान्तिमस्मासु मार्गति
      - लुब्धः पापेन मनसा चरन्नसममात्मनः
    iast: "apradānena rājyasya śāntimasmāsu mārgati | lubdhaḥ pāpena manasā carannasamamātmanaḥ"
  - id: 'udyoga-5-71-21'
    kind: verse
    lines:
      - इतो दुःखतरं किं नु यदहं मातरं ततः
      - संविधातुं न शक्नोमि मित्राणां वा जनार्दन
    iast: "ito duḥkhataraṃ kiṃ nu yadahaṃ mātaraṃ tataḥ | saṃvidhātuṃ na śaknomi mitrāṇāṃ vā janārdana"
  - id: 'udyoga-5-71-25'
    kind: verse
    lines:
      - न च तानपि दुष्टात्मा धार्तराष्ट्रोऽनुमन्यते
      - स्वाम्यमात्मनि मत्वाऽसावतो दुःखतरं नु किं
    iast: "na ca tānapi duṣṭātmā dhārtarāṣṭro'numanyate | svāmyamātmani matvā'sāvato duḥkhataraṃ nu kiṃ"
  - id: 'udyoga-5-71-85'
    kind: verse
    lines:
      - ईदृशेऽत्यर्थकृच्छ्रेऽस्मिन्कमन्यं मधुसूदन
      - उपसंप्रष्टुमर्हामि त्वामृते पुरुषोत्तम
    iast: "īdṛśe'tyarthakṛcchre'sminkamanyaṃ madhusūdana | upasaṃpraṣṭumarhāmi tvāmṛte puruṣottama"
  - id: 'udyoga-5-71-87'
    kind: verse
    lines:
      - एवमुक्तः प्रत्युवाच धर्मराजं जनार्दनः
      - उभयोरेव वामर्थे यास्यामि कुरुसंसदम्
    iast: "evamuktaḥ pratyuvāca dharmarājaṃ janārdanaḥ | ubhayoreva vāmarthe yāsyāmi kurusaṃsadam"
  - id: 'udyoga-5-71-88'
    kind: verse
    lines:
      - शमं तत्र लभेयं चेद्युष्मदर्थमहापयन्
      - पुण्यं मे सुमहद्राजंश्चरितं स्यान्महाफलम्
    iast: "śamaṃ tatra labheyaṃ cedyuṣmadarthamahāpayan | puṇyaṃ me sumahadrājaṃścaritaṃ syānmahāphalam"
  - id: 'udyoga-5-71-89'
    kind: verse
    lines:
      - मोचयेयं मृत्युपाशात्संरब्धान्कुरुसृञ्जयान्
      - पाण्डवान्धार्तराष्ट्रांश्च सर्वां च पृथिवीमिमाम्
      - युधिष्ठिर उवाच
    iast: "mocayeyaṃ mṛtyupāśātsaṃrabdhānkurusṛñjayān | pāṇḍavāndhārtarāṣṭrāṃśca sarvāṃ ca pṛthivīmimām | yudhiṣṭhira uvāca"
  - id: 'udyoga-5-71-90'
    kind: verse
    lines:
      - न ममैतन्मतं कृष्ण यत्त्वं यायाः कुरून्प्रति
      - सुयोधनः सूक्तमपि न करिष्यति ते वचः
    iast: "na mamaitanmataṃ kṛṣṇa yattvaṃ yāyāḥ kurūnprati | suyodhanaḥ sūktamapi na kariṣyati te vacaḥ"
  - id: 'udyoga-5-71-91'
    kind: verse
    lines:
      - समेतं पार्थिवं क्षत्रं दुर्योधनवशानुगम्
      - तेषां मध्यावतरणं तव कृष्ण न रोचये
    iast: "sametaṃ pārthivaṃ kṣatraṃ duryodhanavaśānugam | teṣāṃ madhyāvataraṇaṃ tava kṛṣṇa na rocaye"
  - id: 'udyoga-5-71-92'
    kind: verse
    lines:
      - न हि नः प्रीणयेद्द्रव्यं न देवत्वं कुतः सुखम्
      - न च सर्वामरैश्वर्यं तव द्रोहेण माधव
      - श्रीभगवानुवाच
    iast: "na hi naḥ prīṇayeddravyaṃ na devatvaṃ kutaḥ sukham | na ca sarvāmaraiśvaryaṃ tava droheṇa mādhava | śrībhagavānuvāca"
  - id: 'udyoga-5-71-93'
    kind: verse
    lines:
      - जानाम्येतां महाराज धार्तराष्ट्रस्य पापताम्
      - अवाच्यास्तु भविष्यामः सर्वलोके महीक्षितां
    iast: "jānāmyetāṃ mahārāja dhārtarāṣṭrasya pāpatām | avācyāstu bhaviṣyāmaḥ sarvaloke mahīkṣitāṃ"
  - id: 'udyoga-5-71-95'
    kind: verse
    lines:
      - अथ चेत्ते प्रवर्तेरन्मयि किंचिदसांप्रतम्
      - निर्दहेयं कुरून्सर्वानिति मे धीयते मतिः
    iast: "atha cette pravarteranmayi kiṃcidasāṃpratam | nirdaheyaṃ kurūnsarvāniti me dhīyate matiḥ"
  - id: 'udyoga-5-71-96'
    kind: verse
    lines:
      - न जातु गमनं पार्थ भवेत्तत्र निरर्थकम् अर्थप्राप्तिः कदाचित्स्यादन्ततो वाप्यवाच्यता
    iast: "na jātu gamanaṃ pārtha bhavettatra nirarthakam arthaprāptiḥ kadācitsyādantato vāpyavācyatā"
  - id: 'udyoga-5-71-98'
    kind: verse
    lines:
      - यत्तुभ्यं रोचते कृष्ण स्वस्ति प्राप्नुहि कौरवान्
      - कृतार्थं स्वस्तिमन्तं त्वां द्रक्ष्यामि पुनरागतम्
    iast: "yattubhyaṃ rocate kṛṣṇa svasti prāpnuhi kauravān | kṛtārthaṃ svastimantaṃ tvāṃ drakṣyāmi punarāgatam"
  - id: 'udyoga-5-71-101'
    kind: verse
    lines:
      - अस्मान्वेत्थ परान्वेत्थ वेत्थार्थान्वेत्थ भाषितुम्
      - यद्यदस्मद्धितं कृष्ण तत्तद्वाच्यः सुयोधनः
    iast: "asmānvettha parānvettha vetthārthānvettha bhāṣitum | yadyadasmaddhitaṃ kṛṣṇa tattadvācyaḥ suyodhanaḥ"
  - id: 'udyoga-5-72-1'
    kind: verse
    lines:
      - सञ्जयस्य श्रुतं वाक्यं भवतश्च श्रुतं मया
      - सर्वं जानाम्यभिप्रायं तेषां च भवतश्च यः
    iast: "sañjayasya śrutaṃ vākyaṃ bhavataśca śrutaṃ mayā | sarvaṃ jānāmyabhiprāyaṃ teṣāṃ ca bhavataśca yaḥ"
  - id: 'udyoga-5-72-2'
    kind: verse
    lines:
      - तव धर्माश्रिता बुद्धिस्तेषां वैराश्रया मतिः
      - यदयुद्धेन लभ्येत तत्ते बहुमतं भवेत्
    iast: "tava dharmāśritā buddhisteṣāṃ vairāśrayā matiḥ | yadayuddhena labhyeta tatte bahumataṃ bhavet"
  - id: 'udyoga-5-72-38'
    kind: verse
    lines:
      - सर्वथा युद्धमेवाहमाशंसापि परैः सह
      - निमित्तानि हि सर्वाणि तथा प्रादुर्भवन्ति मे
    iast: "sarvathā yuddhamevāhamāśaṃsāpi paraiḥ saha | nimittāni hi sarvāṇi tathā prādurbhavanti me"
  - id: 'udyoga-5-82-21'
    kind: verse
    lines:
      - तं मेरुशिखरप्रख्यं मेघदुन्दुभिनिस्वनम्
      - आरुरोह रथं सौरिर्विमानमिव कामगम्
    iast: "taṃ meruśikharaprakhyaṃ meghadundubhinisvanam | āruroha rathaṃ saurirvimānamiva kāmagam"
  - id: 'udyoga-5-89-4'
    kind: verse
    lines:
      - धार्तराष्ट्रास्तमायान्तं प्रत्युञ्जग्मुः स्वलङ्कृताः
      - दुर्योधनादृते सर्वे भीष्मद्रोणकृपादयः
    iast: "dhārtarāṣṭrāstamāyāntaṃ pratyuñjagmuḥ svalaṅkṛtāḥ | duryodhanādṛte sarve bhīṣmadroṇakṛpādayaḥ"
  - id: 'udyoga-5-89-16'
    kind: verse
    lines:
      - ततो राजानमासाद्य धृतराष्ट्रं यशस्विनम्
      - सभीष्मं पूजयामास वार्ष्णेयो वाग्भिरञ्जसा
    iast: "tato rājānamāsādya dhṛtarāṣṭraṃ yaśasvinam | sabhīṣmaṃ pūjayāmāsa vārṣṇeyo vāgbhirañjasā"
  - id: 'udyoga-5-90-1'
    kind: verse
    lines:
      - अथोपगम्य विदुरमपराह्णे जनार्दनः
      - पितृष्वसारं स पृथामभ्यगच्छदरिन्दमः
    iast: "athopagamya viduramaparāhṇe janārdanaḥ | pitṛṣvasāraṃ sa pṛthāmabhyagacchadarindamaḥ"
  - id: 'udyoga-5-90-2'
    kind: verse
    lines:
      - सा दृष्ट्वा कृष्णमायान्तं प्रसन्नादित्यवर्चसम्
      - कण्ठे गृहीत्वा प्राक्रोशत्स्मरन्ती तनयान्पृथा
    iast: "sā dṛṣṭvā kṛṣṇamāyāntaṃ prasannādityavarcasam | kaṇṭhe gṛhītvā prākrośatsmarantī tanayānpṛthā"
  - id: 'udyoga-5-90-90'
    kind: verse
    lines:
      - तत आश्वासयामास पुत्राधिभिरभिप्लुताम्
      - पितृष्वसारं शोचन्तीं शौरिः पार्थसखः पृथाम्
      - वासुदेव उवाच
    iast: "tata āśvāsayāmāsa putrādhibhirabhiplutām | pitṛṣvasāraṃ śocantīṃ śauriḥ pārthasakhaḥ pṛthām | vāsudeva uvāca"
  - id: 'udyoga-5-91-1'
    kind: verse
    lines:
      - पृथामामन्त्र्य गोविन्दः कृत्वा चाभिप्रदक्षिणम्
      - दुर्योधनगृहं शौरिरभ्यगच्छदरिन्दमः
    iast: "pṛthāmāmantrya govindaḥ kṛtvā cābhipradakṣiṇam | duryodhanagṛhaṃ śaurirabhyagacchadarindamaḥ"
  - id: 'udyoga-5-91-6'
    kind: verse
    lines:
      - दुर्योधनसमीपे तानासनस्थान्ददर्श सः
      - अभ्यागच्छति दाशार्हे धार्तराष्ट्रो महायशाः
    iast: "duryodhanasamīpe tānāsanasthāndadarśa saḥ | abhyāgacchati dāśārhe dhārtarāṣṭro mahāyaśāḥ"
  - id: 'udyoga-5-91-7'
    kind: verse
    lines:
      - उदतिष्ठत्सहामात्यः पूजयन्मधुसूदनम्
      - समेत्य धार्तराष्ट्रेण महामात्येन केशवः
    iast: "udatiṣṭhatsahāmātyaḥ pūjayanmadhusūdanam | sametya dhārtarāṣṭreṇa mahāmātyena keśavaḥ"
  - id: 'udyoga-5-91-13'
    kind: verse
    lines:
      - न्यमन्त्रयद्भोजनेन नाभ्यनन्दच्च केशवः
      - ततो दुर्योधनः कृष्णमब्रवीत्कुरुसंसदि
    iast: "nyamantrayadbhojanena nābhyanandacca keśavaḥ | tato duryodhanaḥ kṛṣṇamabravītkurusaṃsadi"
  - id: 'udyoga-5-91-26'
    kind: verse
    lines:
      - संप्रीतिभोज्यान्यन्नानि आपद्भोज्यानि वा पुनः
      - न च संप्रीयते राजन्न चैवापद्गता वयम्
    iast: "saṃprītibhojyānyannāni āpadbhojyāni vā punaḥ | na ca saṃprīyate rājanna caivāpadgatā vayam"
  - id: 'udyoga-5-91-27'
    kind: verse
    lines:
      - द्विषदन्नं न भोक्तव्यं द्विषन्तं नैव भोजयेत् पाण्डवान्द्विषसे राजन्मम प्राणा हि पाण्डवाः
    iast: "dviṣadannaṃ na bhoktavyaṃ dviṣantaṃ naiva bhojayet pāṇḍavāndviṣase rājanmama prāṇā hi pāṇḍavāḥ"
  - id: 'udyoga-5-91-30'
    kind: verse
    lines:
      - यस्तान्द्वेष्टि स मां द्वेष्टि यस्ताननु समामनु
      - ऐकात्म्यं मां गतं विद्धि पाण्डवैर्धर्मचारिभिः
    iast: "yastāndveṣṭi sa māṃ dveṣṭi yastānanu samāmanu | aikātmyaṃ māṃ gataṃ viddhi pāṇḍavairdharmacāribhiḥ"
  - id: 'udyoga-5-91-34'
    kind: verse
    lines:
      - सर्वमेतन्न भोक्तव्यमन्नं दुष्टाभिसंहितम्
      - क्षुत्तुरेकस्य भोक्तव्यमिति मे धीयते मतिः
    iast: "sarvametanna bhoktavyamannaṃ duṣṭābhisaṃhitam | kṣutturekasya bhoktavyamiti me dhīyate matiḥ"
  - id: 'udyoga-5-91-35'
    kind: verse
    lines:
      - एवमुक्त्वा महाबाहुर्दुर्योधनममर्षणम्
      - निश्चक्राम ततः शुभ्राद्धार्तराष्ट्रनिवेशनात्
    iast: "evamuktvā mahābāhurduryodhanamamarṣaṇam | niścakrāma tataḥ śubhrāddhārtarāṣṭraniveśanāt"
  - id: 'udyoga-5-91-36'
    kind: verse
    lines:
      - निर्याय च महाबाहुर्वासुदेवो महामनाः
      - निवेशाय ययौ वेश्य विदुरस्य महात्मनः
    iast: "niryāya ca mahābāhurvāsudevo mahāmanāḥ | niveśāya yayau veśya vidurasya mahātmanaḥ"
  - id: 'udyoga-5-91-45'
    kind: verse
    lines:
      - ततोऽनुयायिभिः सार्धं मरुद्भिरिव वासवः
      - विदुरान्नानि बुभुजे शुचीनि गुणवन्ति च
    iast: "tato'nuyāyibhiḥ sārdhaṃ marudbhiriva vāsavaḥ | vidurānnāni bubhuje śucīni guṇavanti ca"
  - id: 'udyoga-5-92-1'
    kind: verse
    lines:
      - तं भुक्तवन्तमाश्वस्तं निशायां विदुरोऽब्रवीत्
      - नेदं सम्यग्व्यवसितं केशवागमनं तव
    iast: "taṃ bhuktavantamāśvastaṃ niśāyāṃ viduro'bravīt | nedaṃ samyagvyavasitaṃ keśavāgamanaṃ tava"
  - id: 'udyoga-5-92-13'
    kind: verse
    lines:
      - यत्र सूक्तं दुरुक्तं च समं स्यान्मधुसूदन
      - न तत्र प्रलपेत्प्राज्ञो बधिरेष्विव गायनः
    iast: "yatra sūktaṃ duruktaṃ ca samaṃ syānmadhusūdana | na tatra pralapetprājño badhireṣviva gāyanaḥ"
  - id: 'udyoga-5-93-15'
    kind: verse
    lines:
      - हिते प्रयतमानं मां शङ्केद्दुर्योधनो यदि
      - हृदयस्य च मे प्रीतिरानृण्यं च भविष्यति
    iast: "hite prayatamānaṃ māṃ śaṅkedduryodhano yadi | hṛdayasya ca me prītirānṛṇyaṃ ca bhaviṣyati"
  - id: 'udyoga-5-93-19'
    kind: verse
    lines:
      - मम धर्मार्थयुक्तं हि श्रुत्वा वाक्यमनामयम्
      - न चेदादास्यते बालो दिष्टस्य वशमेष्यति
    iast: "mama dharmārthayuktaṃ hi śrutvā vākyamanāmayam | na cedādāsyate bālo diṣṭasya vaśameṣyati"
  - id: 'udyoga-5-94-1'
    kind: verse
    lines:
      - तथा कथयतोरेव तयोर्बुद्धिमतोस्तदा
      - शिवा नक्षत्रसंपन्ना सा व्यतीयाय शर्वरी
    iast: "tathā kathayatoreva tayorbuddhimatostadā | śivā nakṣatrasaṃpannā sā vyatīyāya śarvarī"
  - id: 'udyoga-5-94-6'
    kind: verse
    lines:
      - कृतोदकानुजप्यः स हुताग्निः समलङ्कृतः
      - ततश्चादित्यमुद्यन्तमुपातिष्ठत माधवः
    iast: "kṛtodakānujapyaḥ sa hutāgniḥ samalaṅkṛtaḥ | tataścādityamudyantamupātiṣṭhata mādhavaḥ"
  - id: 'udyoga-5-94-44'
    kind: verse
    lines:
      - नवमेघप्रतीकाशां ज्वलन्तीमिव तेजसा
      - महेन्द्रसदनप्रख्यां प्रविवेश सभां ततः
    iast: "navameghapratīkāśāṃ jvalantīmiva tejasā | mahendrasadanaprakhyāṃ praviveśa sabhāṃ tataḥ"
  - id: 'udyoga-5-94-48'
    kind: verse
    lines:
      - अभ्यागच्छति दाशार्हे प्रज्ञाचक्षुर्नरेश्वर
      - सहैव द्रोणभीष्माभ्यामुदतिष्ठन्महायशाः
    iast: "abhyāgacchati dāśārhe prajñācakṣurnareśvara | sahaiva droṇabhīṣmābhyāmudatiṣṭhanmahāyaśāḥ"
  - id: 'udyoga-5-94-49'
    kind: verse
    lines:
      - उत्तिष्ठति महाराजे धृतराष्ट्रे जनेश्वरे
      - तानि राजसहस्राणि समुत्तस्थुः समन्ततः
    iast: "uttiṣṭhati mahārāje dhṛtarāṣṭre janeśvare | tāni rājasahasrāṇi samuttasthuḥ samantataḥ"
  - id: 'udyoga-5-94-59'
    kind: verse
    lines:
      - तेषु तत्रोपविष्टेषु गृहीतार्घ्येषु भारत निषसादासने कृष्णो राजानश्च यथासनम्
    iast: "teṣu tatropaviṣṭeṣu gṛhītārghyeṣu bhārata niṣasādāsane kṛṣṇo rājānaśca yathāsanam"
  - id: 'udyoga-5-94-61'
    kind: verse
    lines:
      - अविदूरे तु कृष्णस्य कर्णदुर्योधनावुभौ एकासने महात्मानौ निषीदतुरमर्षणौ
    iast: "avidūre tu kṛṣṇasya karṇaduryodhanāvubhau ekāsane mahātmānau niṣīdaturamarṣaṇau"
  - id: 'udyoga-5-94-63'
    kind: verse
    lines:
      - विदुरो मणिपीठे तु शुक्लस्पर्ध्याजिनोत्तरे संस्पृशन्नासनं शौरेर्महामतिरुपाविशत्
    iast: "viduro maṇipīṭhe tu śuklaspardhyājinottare saṃspṛśannāsanaṃ śaurermahāmatirupāviśat"
  - id: 'udyoga-5-94-66'
    kind: verse
    lines:
      - ततस्तूष्णीं सर्वमासीद्गोविन्दगतमानसम्
      - न तत्र कश्चित्किंचिद्वा व्याजहार पुमान्क्वचित्
    iast: "tatastūṣṇīṃ sarvamāsīdgovindagatamānasam | na tatra kaścitkiṃcidvā vyājahāra pumānkvacit"
  - id: 'udyoga-5-95-1'
    kind: verse
    lines:
      - तेष्वासीनेषु सर्वेषु तूष्णींभूतेषु राजसु
      - वाक्यमभ्याददे कृष्णः सुदंष्ट्रो दुन्दुभिस्वनः
    iast: "teṣvāsīneṣu sarveṣu tūṣṇīṃbhūteṣu rājasu | vākyamabhyādade kṛṣṇaḥ sudaṃṣṭro dundubhisvanaḥ"
  - id: 'udyoga-5-95-2'
    kind: verse
    lines:
      - जीमूत इव धर्मान्ते सर्वां संश्रावयन्सभाम्
      - धृतराष्ट्रमभिप्रेक्ष्य समभाषत माधवः
      - श्रीभगवानुवाच
    iast: "jīmūta iva dharmānte sarvāṃ saṃśrāvayansabhām | dhṛtarāṣṭramabhiprekṣya samabhāṣata mādhavaḥ | śrībhagavānuvāca"
  - id: 'udyoga-5-95-3'
    kind: verse
    lines:
      - कुरूणां पाण्डवानां च शमः स्यादिति भारत
      - अप्रणशेन वीराणामेतद्याचितुमागतः
    iast: "kurūṇāṃ pāṇḍavānāṃ ca śamaḥ syāditi bhārata | apraṇaśena vīrāṇāmetadyācitumāgataḥ"
  - id: 'udyoga-5-95-9'
    kind: verse
    lines:
      - ते पुत्रास्तव कौरव्य दुर्योधनपुरोगमाः
      - धर्मार्थौ पृष्ठतः कृत्वा प्रचरन्ति नृशंसवत्
    iast: "te putrāstava kauravya duryodhanapurogamāḥ | dharmārthau pṛṣṭhataḥ kṛtvā pracaranti nṛśaṃsavat"
  - id: 'udyoga-5-95-11'
    kind: verse
    lines:
      - सेयमापन्महाघोरा कुरुष्वेव समुत्थिता
      - उपेक्ष्यमाणा कौरव्य पृथिवीं घातयिष्यति
    iast: "seyamāpanmahāghorā kuruṣveva samutthitā | upekṣyamāṇā kauravya pṛthivīṃ ghātayiṣyati"
  - id: 'udyoga-5-95-12'
    kind: verse
    lines:
      - शक्या चेयं शमयितुं त्वं चेदिच्छसि भारत
      - न दुष्करो ह्यत्र शमो मतो मे भरतर्षभ
    iast: "śakyā ceyaṃ śamayituṃ tvaṃ cedicchasi bhārata | na duṣkaro hyatra śamo mato me bharatarṣabha"
  - id: 'udyoga-5-95-13'
    kind: verse
    lines:
      - त्वय्यधीनः शमो राजन्मयि चैव विशांपते
      - पुत्रान्स्थापय कौरव्य स्थापयिष्याम्यहं परान्
    iast: "tvayyadhīnaḥ śamo rājanmayi caiva viśāṃpate | putrānsthāpaya kauravya sthāpayiṣyāmyahaṃ parān"
  - id: 'udyoga-5-95-54'
    kind: verse
    lines:
      - प्रशाम्य भरतश्रेष्ठ मा मन्युवशमन्वगाः पित्र्यं तेभ्यः प्रदायांशं पाण्डवेभ्यो यथोचितम्
      - ततः सपुत्रः सिद्धार्थो भुङ्क्ष भोगान्परन्तप
    iast: "praśāmya bharataśreṣṭha mā manyuvaśamanvagāḥ pitryaṃ tebhyaḥ pradāyāṃśaṃ pāṇḍavebhyo yathocitam | tataḥ saputraḥ siddhārtho bhuṅkṣa bhogānparantapa"
  - id: 'udyoga-5-95-60'
    kind: verse
    lines:
      - अहं तु तव तेषां च श्रेय इच्छामि भारत
      - धर्मादर्थात्सुखाच्चैव मा राजन्नीनशः प्रजाः
    iast: "ahaṃ tu tava teṣāṃ ca śreya icchāmi bhārata | dharmādarthātsukhāccaiva mā rājannīnaśaḥ prajāḥ"
  - id: 'udyoga-5-95-61'
    kind: verse
    lines:
      - अनर्थमर्थं मन्वानोऽप्यर्थं चानर्थमात्मनः
      - लोभेऽतिप्रसृतान्पुत्रान्निगृह्णीष्व विशांपते
    iast: "anarthamarthaṃ manvāno'pyarthaṃ cānarthamātmanaḥ | lobhe'tiprasṛtānputrānnigṛhṇīṣva viśāṃpate"
  - id: 'udyoga-5-95-62'
    kind: verse
    lines:
      - स्थिताः शुश्रूषितुं पार्थाः स्थिता योद्धुमरिन्दमाः
      - यत्ते पथ्यतमं राजंस्तस्मिंतिष्ठ परन्तप
      - वैशंपायन उवाच
    iast: "sthitāḥ śuśrūṣituṃ pārthāḥ sthitā yoddhumarindamāḥ | yatte pathyatamaṃ rājaṃstasmiṃtiṣṭha parantapa | vaiśaṃpāyana uvāca"
  - id: 'udyoga-5-95-63'
    kind: verse
    lines:
      - तद्वाक्यं पार्थिवाः सर्वे हृदयैः समपूजयन्
      - न तत्र कश्चिद्वक्तुं हि वाचं प्राक्रामदग्रतः
    iast: "tadvākyaṃ pārthivāḥ sarve hṛdayaiḥ samapūjayan | na tatra kaścidvaktuṃ hi vācaṃ prākrāmadagrataḥ"
  - id: 'udyoga-5-124-2'
    kind: verse
    lines:
      - एवमुक्त्वा ततः कृष्णमभ्यभाषत कौरवः
      - स्वर्ग्यं लोक्यं च मामात्थ धर्म्यं न्याय्यं च केशव
    iast: "evamuktvā tataḥ kṛṣṇamabhyabhāṣata kauravaḥ | svargyaṃ lokyaṃ ca māmāttha dharmyaṃ nyāyyaṃ ca keśava"
  - id: 'udyoga-5-124-3'
    kind: verse
    lines:
      - न त्वहं स्ववशस्तात क्रियमाणं न मे प्रियम् न मंस्यन्ते दुरात्मानः पुत्रा मम जनार्दन
    iast: "na tvahaṃ svavaśastāta kriyamāṇaṃ na me priyam na maṃsyante durātmānaḥ putrā mama janārdana"
  - id: 'udyoga-5-124-4'
    kind: verse
    lines:
      - अङ्ग दुर्योधनं कृष्ण मन्दं शास्त्रातिगं मम
      - अनुनेतुं महाबाहो यतस्व पुरुषोत्तम
    iast: "aṅga duryodhanaṃ kṛṣṇa mandaṃ śāstrātigaṃ mama | anunetuṃ mahābāho yatasva puruṣottama"
  - id: 'udyoga-5-124-6'
    kind: verse
    lines:
      - स त्वं पापमतिं क्रूरं पापचित्तमचेतनम्
      - अनुशाधि दुरात्मानं स्वयं दुर्योधनं नृपम्
    iast: "sa tvaṃ pāpamatiṃ krūraṃ pāpacittamacetanam | anuśādhi durātmānaṃ svayaṃ duryodhanaṃ nṛpam"
  - id: 'udyoga-5-124-7'
    kind: verse
    lines:
      - सुहृत्कार्यं तु सुमहत्कृतं ते स्याञ्जनार्दन
      - वैशंपायन उवाच
    iast: "suhṛtkāryaṃ tu sumahatkṛtaṃ te syāñjanārdana | vaiśaṃpāyana uvāca"
  - id: 'udyoga-5-124-8'
    kind: verse
    lines:
      - ततोऽभ्यावृत्य वार्ष्णेयो दुर्योधनममर्षणम्
      - अब्रवीन्मधुरां वाचं सर्वधर्मार्थतत्त्ववित्
    iast: "tato'bhyāvṛtya vārṣṇeyo duryodhanamamarṣaṇam | abravīnmadhurāṃ vācaṃ sarvadharmārthatattvavit"
  - id: 'udyoga-5-124-9'
    kind: verse
    lines:
      - दुर्योधन निबोधेदं मद्वाक्यं कुरुसत्तम
      - शर्मार्थं ते विशेषेण सानुबन्धस्य भारत
    iast: "duryodhana nibodhedaṃ madvākyaṃ kurusattama | śarmārthaṃ te viśeṣeṇa sānubandhasya bhārata"
  - id: 'udyoga-5-124-21'
    kind: verse
    lines:
      - रोचते ते पितुस्तात पाण्डवैः सह सङ्गमः
      - सामात्यस्य कुरुश्रेष्ठ तत्तुभ्यां तात रोचताम्
    iast: "rocate te pitustāta pāṇḍavaiḥ saha saṅgamaḥ | sāmātyasya kuruśreṣṭha tattubhyāṃ tāta rocatām"
  - id: 'udyoga-5-124-60'
    kind: verse
    lines:
      - त्वामेव स्थापयिष्यन्ति यौवराज्ये महारथाः
      - महाराज्येऽपि पितरं धृतराष्ट्रं जनेश्वरम्
    iast: "tvāmeva sthāpayiṣyanti yauvarājye mahārathāḥ | mahārājye'pi pitaraṃ dhṛtarāṣṭraṃ janeśvaram"
  - id: 'udyoga-5-124-61'
    kind: verse
    lines:
      - मा तात श्रियमायान्तीमवमंस्थाः समुद्यताम्
      - अर्धं प्रदाय पार्थेभ्यो महतीं श्रियमाप्नुहि
    iast: "mā tāta śriyamāyāntīmavamaṃsthāḥ samudyatām | ardhaṃ pradāya pārthebhyo mahatīṃ śriyamāpnuhi"
  - id: 'udyoga-5-124-62'
    kind: verse
    lines:
      - पाण्डवैः संशमं कृत्वा कृत्वा च सुहृदां वचः
      - संप्रीयमाणो मित्रैश्च चिरं भद्राण्यवाप्स्यसि
    iast: "pāṇḍavaiḥ saṃśamaṃ kṛtvā kṛtvā ca suhṛdāṃ vacaḥ | saṃprīyamāṇo mitraiśca ciraṃ bhadrāṇyavāpsyasi"
  - id: 'udyoga-5-125-1'
    kind: verse
    lines:
      - ततः शान्तनवो भीष्मो दुर्योधनममर्षणम्
      - केशवस्य वचः श्रुत्वा प्रोवाच भरतर्षभ
    iast: "tataḥ śāntanavo bhīṣmo duryodhanamamarṣaṇam | keśavasya vacaḥ śrutvā provāca bharatarṣabha"
  - id: 'udyoga-5-125-2'
    kind: verse
    lines:
      - कृष्णेन वाक्यमुक्तोऽसि सृहृदां शममिच्छता अन्वपद्यस्व तत्तात मा मन्युवशमन्वगाः
    iast: "kṛṣṇena vākyamukto'si sṛhṛdāṃ śamamicchatā anvapadyasva tattāta mā manyuvaśamanvagāḥ"
  - id: 'udyoga-5-125-3'
    kind: verse
    lines:
      - अकृत्वा वचनं तात केशवस्य महात्मनः
      - श्रेयो न जातु न सुखं न कल्याणमवाप्स्यसि
    iast: "akṛtvā vacanaṃ tāta keśavasya mahātmanaḥ | śreyo na jātu na sukhaṃ na kalyāṇamavāpsyasi"
  - id: 'udyoga-5-125-8'
    kind: verse
    lines:
      - मा कुलघ्नः कुपुरुषो दुर्मतिः कापथं गमः
      - मातरं पितरं चैव मा मञ्जीः शोकसागरे
    iast: "mā kulaghnaḥ kupuruṣo durmatiḥ kāpathaṃ gamaḥ | mātaraṃ pitaraṃ caiva mā mañjīḥ śokasāgare"
  - id: 'udyoga-5-125-9'
    kind: verse
    lines:
      - अथ द्रोणोऽब्रवीत्तत्र दुर्योधनमिदं वचः
      - अमर्षवशमापन्नं निःश्वसन्तं पुनःपुनः
    iast: "atha droṇo'bravīttatra duryodhanamidaṃ vacaḥ | amarṣavaśamāpannaṃ niḥśvasantaṃ punaḥpunaḥ"
  - id: 'udyoga-5-125-15'
    kind: verse
    lines:
      - एतच्चैव मतं सत्यं सुहृदोः कृष्णभीष्मयोः
      - यदि नादास्यसे तात पश्चात्तप्स्यसि भारत
    iast: "etaccaiva mataṃ satyaṃ suhṛdoḥ kṛṣṇabhīṣmayoḥ | yadi nādāsyase tāta paścāttapsyasi bhārata"
  - id: 'udyoga-5-125-18'
    kind: verse
    lines:
      - तस्मिन्वाक्यान्तरे वाक्यं क्षत्ताऽपि विदुरोऽब्रवीत्
      - दुर्योधनमभिप्रेक्ष्य धार्तराष्ट्रममर्षणम्
    iast: "tasminvākyāntare vākyaṃ kṣattā'pi viduro'bravīt | duryodhanamabhiprekṣya dhārtarāṣṭramamarṣaṇam"
  - id: 'udyoga-5-125-19'
    kind: verse
    lines:
      - दुर्योधन न शोचामि त्वामहं भरतर्षभ
      - इमो तु वृद्धौ शोचामि गान्धारीं पितरं च ते
    iast: "duryodhana na śocāmi tvāmahaṃ bharatarṣabha | imo tu vṛddhau śocāmi gāndhārīṃ pitaraṃ ca te"
  - id: 'udyoga-5-125-21'
    kind: verse
    lines:
      - भिक्षुकौ विचरिष्येते शोचन्तौ पृथिवीमिमाम्
      - कुलघ्नमीदृशं पापं जनयित्वा कुपूरुषम्
    iast: "bhikṣukau vicariṣyete śocantau pṛthivīmimām | kulaghnamīdṛśaṃ pāpaṃ janayitvā kupūruṣam"
  - id: 'udyoga-5-125-22'
    kind: verse
    lines:
      - अथ दुर्योधं राजा धृतराष्ट्रोऽभ्यभाषत
      - आसीनं भ्रातृभिः सार्धं राजभिः परिवारितम्
    iast: "atha duryodhaṃ rājā dhṛtarāṣṭro'bhyabhāṣata | āsīnaṃ bhrātṛbhiḥ sārdhaṃ rājabhiḥ parivāritam"
  - id: 'udyoga-5-125-27'
    kind: verse
    lines:
      - शमं चेद्याचमानं त्वं प्रत्याख्यास्यसि केशवम्
      - त्वदर्थमभिजल्पन्तं न तवास्त्यपराभवः
    iast: "śamaṃ cedyācamānaṃ tvaṃ pratyākhyāsyasi keśavam | tvadarthamabhijalpantaṃ na tavāstyaparābhavaḥ"
  - id: 'udyoga-5-127-1'
    kind: verse
    lines:
      - श्रुत्वा दुर्योधनो वाक्यमप्रियं कुरुसंसदि
      - प्रत्युवाच महाबाहुं वासुदेवं यशस्विनम्
    iast: "śrutvā duryodhano vākyamapriyaṃ kurusaṃsadi | pratyuvāca mahābāhuṃ vāsudevaṃ yaśasvinam"
  - id: 'udyoga-5-127-3'
    kind: verse
    lines:
      - भक्तिवादेन पार्थानामकस्मान्मधुसूदन
      - भवान्गर्हयति नित्यं किं समीक्ष्य बलाबलम्
    iast: "bhaktivādena pārthānāmakasmānmadhusūdana | bhavāngarhayati nityaṃ kiṃ samīkṣya balābalam"
  - id: 'udyoga-5-127-4'
    kind: verse
    lines:
      - भवान्क्षत्ता च राजा वाऽप्याचार्यो वा पितामहः
      - मामेव परिगर्हन्ते नान्यं कंचन पाण्डवम्
    iast: "bhavānkṣattā ca rājā vā'pyācāryo vā pitāmahaḥ | māmeva parigarhante nānyaṃ kaṃcana pāṇḍavam"
  - id: 'udyoga-5-127-5'
    kind: verse
    lines:
      - न चाहं लक्षये कंचिद्व्यभिचारमिहात्मनः
      - अथ सर्वे भवन्तो मां विद्विषन्ति सराजकाः
    iast: "na cāhaṃ lakṣaye kaṃcidvyabhicāramihātmanaḥ | atha sarve bhavanto māṃ vidviṣanti sarājakāḥ"
  - id: 'udyoga-5-127-14'
    kind: verse
    lines:
      - न हि भीष्मकृपद्रोणाः सकर्णा मधुसूदन
      - देवैरपि युधा जेतुं शक्याः किमुत पाण्डवैः
    iast: "na hi bhīṣmakṛpadroṇāḥ sakarṇā madhusūdana | devairapi yudhā jetuṃ śakyāḥ kimuta pāṇḍavaiḥ"
  - id: 'udyoga-5-127-17'
    kind: verse
    lines:
      - ते वयं वीरशयनं प्राप्स्यामो यदि संयुगे
      - अप्रणम्यैव शत्रूणां न नस्तप्स्यन्ति माधव
    iast: "te vayaṃ vīraśayanaṃ prāpsyāmo yadi saṃyuge | apraṇamyaiva śatrūṇāṃ na nastapsyanti mādhava"
  - id: 'udyoga-5-127-22'
    kind: verse
    lines:
      - राज्यांशश्चाभ्यनुज्ञातो यो मे पित्रा पुराऽभवत्
      - न स लभ्यः पुनर्जातु मयि जीवति केशव
    iast: "rājyāṃśaścābhyanujñāto yo me pitrā purā'bhavat | na sa labhyaḥ punarjātu mayi jīvati keśava"
  - id: 'udyoga-5-127-25'
    kind: verse
    lines:
      - ध्रियमाणे महाबाहौ मयि संप्रति केशव यावद्धि तीक्ष्णया सूच्या विद्ध्येदग्रेण केशव
      - तावदप्यपरित्याज्यं भूमेर्नः पाण्डवान्प्रति
    iast: "dhriyamāṇe mahābāhau mayi saṃprati keśava yāvaddhi tīkṣṇayā sūcyā viddhyedagreṇa keśava | tāvadapyaparityājyaṃ bhūmernaḥ pāṇḍavānprati"
  - id: 'udyoga-5-128-1'
    kind: verse
    lines:
      - ततः प्रहस्य दाशार्हः क्रोधपर्याकुलेक्षणः
      - दुर्योधनमिदं वाक्यमब्रवीत्कुरुसंसदि
    iast: "tataḥ prahasya dāśārhaḥ krodhaparyākulekṣaṇaḥ | duryodhanamidaṃ vākyamabravītkurusaṃsadi"
  - id: 'udyoga-5-128-2'
    kind: verse
    lines:
      - लप्स्यसे वीरशयनं काममेतदवाप्स्यसि
      - स्थिरो भव सहामात्यो विमर्दो भविता महान्
    iast: "lapsyase vīraśayanaṃ kāmametadavāpsyasi | sthiro bhava sahāmātyo vimardo bhavitā mahān"
  - id: 'udyoga-5-128-18'
    kind: verse
    lines:
      - यच्चैभ्यो याचमानेभ्यः पित्र्यमंशं न दित्सति
      - तच्च पाप प्रदाताऽसि भ्रष्टैश्वर्यो निपातितः
    iast: "yaccaibhyo yācamānebhyaḥ pitryamaṃśaṃ na ditsati | tacca pāpa pradātā'si bhraṣṭaiśvaryo nipātitaḥ"
  - id: 'udyoga-5-128-23'
    kind: verse
    lines:
      - एवं ब्रुवति दाशार्हे दुर्योधनममर्षणम्
      - दुःशासन इदं वाक्यमब्रवीत्करुसंसदि
    iast: "evaṃ bruvati dāśārhe duryodhanamamarṣaṇam | duḥśāsana idaṃ vākyamabravītkarusaṃsadi"
  - id: 'udyoga-5-128-26'
    kind: verse
    lines:
      - भ्रातुरेतद्वचः श्रुत्वा धार्तराष्ट्रः सुयोधनः
      - क्रुद्धः प्रातिष्ठतोत्थाय महानाग इव श्वसन्
    iast: "bhrāturetadvacaḥ śrutvā dhārtarāṣṭraḥ suyodhanaḥ | kruddhaḥ prātiṣṭhatotthāya mahānāga iva śvasan"
  - id: 'udyoga-5-128-29'
    kind: verse
    lines:
      - तं प्रस्थितमभिप्रेक्ष्य भ्रातरो मनुजर्षभम्
      - अनुजग्मुः सहामात्या राजानश्चापि सर्वशः
    iast: "taṃ prasthitamabhiprekṣya bhrātaro manujarṣabham | anujagmuḥ sahāmātyā rājānaścāpi sarvaśaḥ"
  - id: 'udyoga-5-128-34'
    kind: verse
    lines:
      - भीष्मस्याथ वचः श्रुत्वा दाशार्हः पुष्करेक्षणः
      - भीष्मद्रोणमुखान्सर्वानभ्यभाषत वीर्यवान्
    iast: "bhīṣmasyātha vacaḥ śrutvā dāśārhaḥ puṣkarekṣaṇaḥ | bhīṣmadroṇamukhānsarvānabhyabhāṣata vīryavān"
  - id: 'udyoga-5-128-35'
    kind: verse
    lines:
      - सर्वेषां कुरुवृद्धानां महानयमतिक्रमः
      - प्रसह्य मन्दमैश्वर्ये न नियच्छन्ति यन्नृपम्
    iast: "sarveṣāṃ kuruvṛddhānāṃ mahānayamatikramaḥ | prasahya mandamaiśvarye na niyacchanti yannṛpam"
  - id: 'udyoga-5-128-51'
    kind: verse
    lines:
      - राजन्दुर्योधनं बद्ध्वा ततः संशाम्य पाण्डवैः
      - त्वत्कृते न विनश्येयुः क्षत्रियाः क्षत्रियर्षभ
    iast: "rājanduryodhanaṃ baddhvā tataḥ saṃśāmya pāṇḍavaiḥ | tvatkṛte na vinaśyeyuḥ kṣatriyāḥ kṣatriyarṣabha"
  - id: 'udyoga-5-129-1'
    kind: verse
    lines:
      - कृष्णस्य तु वचः श्रुत्वा धृतराष्ट्रो जनेश्वरः
      - विदुरं सर्वधर्मज्ञं त्वरमाणोऽभ्यभाषत
    iast: "kṛṣṇasya tu vacaḥ śrutvā dhṛtarāṣṭro janeśvaraḥ | viduraṃ sarvadharmajñaṃ tvaramāṇo'bhyabhāṣata"
  - id: 'udyoga-5-129-2'
    kind: verse
    lines:
      - गच्छ तात महाप्राज्ञ गान्धारीं दीर्घदर्शिनीम्
      - आनयेह तया सार्धमनुनेष्यामि दुर्मतिम्
    iast: "gaccha tāta mahāprājña gāndhārīṃ dīrghadarśinīm | ānayeha tayā sārdhamanuneṣyāmi durmatim"
  - id: 'udyoga-5-129-5'
    kind: verse
    lines:
      - शमयेच्चिररात्राय योगक्षेमवदव्ययम् राज्ञस्तु वचनं श्रुत्वा विदुरो दीर्घदर्शिनीम्
    iast: "śamayeccirarātrāya yogakṣemavadavyayam rājñastu vacanaṃ śrutvā viduro dīrghadarśinīm"
  - id: 'udyoga-5-129-6'
    kind: verse
    lines:
      - आनयामास गान्धारीं धृतराष्ट्रस्य शासनात्
      - धृतराष्ट्र उवाच
    iast: "ānayāmāsa gāndhārīṃ dhṛtarāṣṭrasya śāsanāt | dhṛtarāṣṭra uvāca"
  - id: 'udyoga-5-129-7'
    kind: verse
    lines:
      - एष गान्धारि पुत्रस्ते दुरात्मा शासनातिगः
      - ऐश्वर्यलोभादैश्वर्यं जीवितं च प्रहास्यति
    iast: "eṣa gāndhāri putraste durātmā śāsanātigaḥ | aiśvaryalobhādaiśvaryaṃ jīvitaṃ ca prahāsyati"
  - id: 'udyoga-5-129-8'
    kind: verse
    lines:
      - अशिष्टवदमर्यादः पापैः सह दुरात्मवान्
      - सभाया निर्गतो मूढो व्यतिक्रम्य सुहृद्वचः
      - वैशंपायन उवाच
    iast: "aśiṣṭavadamaryādaḥ pāpaiḥ saha durātmavān | sabhāyā nirgato mūḍho vyatikramya suhṛdvacaḥ | vaiśaṃpāyana uvāca"
  - id: 'udyoga-5-129-10'
    kind: verse
    lines:
      - आनायय सुतं क्षिप्रं राज्यकामुकमातुरम् नहि राज्यमशिष्टेन शक्यं धर्मार्थलोपिना
      - आप्तुमाप्तं तथाऽपीदमविनीतेन सर्वथा
    iast: "ānāyaya sutaṃ kṣipraṃ rājyakāmukamāturam nahi rājyamaśiṣṭena śakyaṃ dharmārthalopinā | āptumāptaṃ tathā'pīdamavinītena sarvathā"
  - id: 'udyoga-5-129-16'
    kind: verse
    lines:
      - शासनाद्धृतराष्ट्रस्य दुर्योधनममर्षणम्
      - मातुश्च वचनात्क्षत्ता सभां प्रावेशयत्पुनः
    iast: "śāsanāddhṛtarāṣṭrasya duryodhanamamarṣaṇam | mātuśca vacanātkṣattā sabhāṃ prāveśayatpunaḥ"
  - id: 'udyoga-5-129-18'
    kind: verse
    lines:
      - तं प्रविष्टमभिप्रेक्ष्य पुत्रमुत्पथमास्थितम्
      - विगर्हमाणा गान्धारी शमार्थं वाक्यमब्रवीत्
    iast: "taṃ praviṣṭamabhiprekṣya putramutpathamāsthitam | vigarhamāṇā gāndhārī śamārthaṃ vākyamabravīt"
  - id: 'udyoga-5-129-20'
    kind: verse
    lines:
      - दुर्योधन यदाह त्वां पिता भरतसत्तम
      - भीष्मो द्रोणः कृपः क्षत्ता सुहृदां कुरु तद्वचः
    iast: "duryodhana yadāha tvāṃ pitā bharatasattama | bhīṣmo droṇaḥ kṛpaḥ kṣattā suhṛdāṃ kuru tadvacaḥ"
  - id: 'udyoga-5-129-38'
    kind: verse
    lines:
      - प्रपद्यष्व महाबाहुं कृष्णमक्लिष्टकारिणम्
      - प्रसन्नो हि सुखाय स्यादुभयोरेव केशवः
    iast: "prapadyaṣva mahābāhuṃ kṛṣṇamakliṣṭakāriṇam | prasanno hi sukhāya syādubhayoreva keśavaḥ"
  - id: 'udyoga-5-129-43'
    kind: verse
    lines:
      - प्रयच्छ पाण्डुपुत्राणां यथोचितमरिन्दम
      - यदीच्छसि सहामात्यो भोक्तुमर्धं प्रदीयताम्
    iast: "prayaccha pāṇḍuputrāṇāṃ yathocitamarindama | yadīcchasi sahāmātyo bhoktumardhaṃ pradīyatām"
  - id: 'udyoga-5-130-1'
    kind: verse
    lines:
      - तत्तु वाक्यमनादृत्य सोऽर्थवन्मातृभाषितम्
      - पुनः प्रतस्थे संरम्भात्सकाशमकृतात्मनाम्
    iast: "tattu vākyamanādṛtya so'rthavanmātṛbhāṣitam | punaḥ pratasthe saṃrambhātsakāśamakṛtātmanām"
  - id: 'udyoga-5-130-6'
    kind: verse
    lines:
      - एकान्तमुपसृत्येह मन्त्रं पुनरमन्त्रयत् सौबलेन मताक्षेण राज्ञा शकुनिना सह
    iast: "ekāntamupasṛtyeha mantraṃ punaramantrayat saubalena matākṣeṇa rājñā śakuninā saha"
  - id: 'udyoga-5-130-9'
    kind: verse
    lines:
      - वयमेव हृषीकेशं निगृह्णीम बलादिव
      - प्रसह्य पुरुषव्याघ्रमिन्द्रो वैरोचनिं यथा
    iast: "vayameva hṛṣīkeśaṃ nigṛhṇīma balādiva | prasahya puruṣavyāghramindro vairocaniṃ yathā"
  - id: 'udyoga-5-130-13'
    kind: verse
    lines:
      - तेषां पापमभिप्रायं पापानां दुष्टचेतसाम्
      - इङ्गितज्ञः कविः क्षिप्रमन्वबुद्ध्यत सात्यकिः
    iast: "teṣāṃ pāpamabhiprāyaṃ pāpānāṃ duṣṭacetasām | iṅgitajñaḥ kaviḥ kṣipramanvabuddhyata sātyakiḥ"
  - id: 'udyoga-5-130-21'
    kind: verse
    lines:
      - सात्यकेस्तद्वचः श्रुत्वा विदुरो दीर्घदर्शिवान्
      - धृतराष्ट्रं महाबाहुमब्रवीत्कुरुसंसदि
    iast: "sātyakestadvacaḥ śrutvā viduro dīrghadarśivān | dhṛtarāṣṭraṃ mahābāhumabravītkurusaṃsadi"
  - id: 'udyoga-5-130-46'
    kind: verse
    lines:
      - ततो दुर्योधनं क्षत्ता पुनः प्रावेशयत्मभाम्
      - अकामं भ्रातृभिः सार्धं राजभिः परिवारितम्
    iast: "tato duryodhanaṃ kṣattā punaḥ prāveśayatmabhām | akāmaṃ bhrātṛbhiḥ sārdhaṃ rājabhiḥ parivāritam"
  - id: 'udyoga-5-130-47'
    kind: verse
    lines:
      - अथ दुरोयधनं राजा धृतराष्ट्रोऽभ्यभाषत
      - कर्णदुःशासनाभ्यां च राजभिश्चापि संवृतम्
    iast: "atha duroyadhanaṃ rājā dhṛtarāṣṭro'bhyabhāṣata | karṇaduḥśāsanābhyāṃ ca rājabhiścāpi saṃvṛtam"
  - id: 'udyoga-5-130-50'
    kind: verse
    lines:
      - त्वमिमं पुण्डरीकाक्षमप्रधृष्यं दुरासदम्
      - पापैः सहायैः संहत्य निग्रहीतुं किलेच्छसि
    iast: "tvamimaṃ puṇḍarīkākṣamapradhṛṣyaṃ durāsadam | pāpaiḥ sahāyaiḥ saṃhatya nigrahītuṃ kilecchasi"
  - id: 'udyoga-5-130-54'
    kind: verse
    lines:
      - इत्युक्ते धृतराष्ट्रेण क्षत्ताऽपि विदुरोऽब्रवीत्
      - दुर्योधनमभिप्रेक्ष्य धार्तराष्ट्रममर्षणम्
    iast: "ityukte dhṛtarāṣṭreṇa kṣattā'pi viduro'bravīt | duryodhanamabhiprekṣya dhārtarāṣṭramamarṣaṇam"
  - id: 'udyoga-5-131-1'
    kind: verse
    lines:
      - विदुरेणैवमुक्तस्तु केशवः शत्रुपूगहा
      - दुर्योधनं धार्तराष्ट्रमभ्यभाषत वीर्यवान्
    iast: "vidureṇaivamuktastu keśavaḥ śatrupūgahā | duryodhanaṃ dhārtarāṣṭramabhyabhāṣata vīryavān"
  - id: 'udyoga-5-131-2'
    kind: verse
    lines:
      - एकोऽहमिति यन्मोहान्मन्यसे मां सुयोधन
      - परिभूय सुदुर्बुद्धे ग्रहीतुं मां चिकीर्षसि
    iast: "eko'hamiti yanmohānmanyase māṃ suyodhana | paribhūya sudurbuddhe grahītuṃ māṃ cikīrṣasi"
  - id: 'udyoga-5-131-3'
    kind: verse
    lines:
      - इहैव पाण्डवाः सर्वे तथैवान्धकवृष्णयः
      - इहादित्याश्च रुद्राश्च वसवश्च महर्षिभिः
    iast: "ihaiva pāṇḍavāḥ sarve tathaivāndhakavṛṣṇayaḥ | ihādityāśca rudrāśca vasavaśca maharṣibhiḥ"
  - id: 'udyoga-5-131-4'
    kind: verse
    lines:
      - एवमुक्त्वा जाहासोच्चैः केशवः परवीरहा तस्य संस्मयतः शौरेर्विद्युद्रूपा महात्मनः
      - युगपच्च विनिष्पेतुः साक्षात्सर्वास्तु देवताः
    iast: "evamuktvā jāhāsoccaiḥ keśavaḥ paravīrahā tasya saṃsmayataḥ śaurervidyudrūpā mahātmanaḥ | yugapacca viniṣpetuḥ sākṣātsarvāstu devatāḥ"
  - id: 'udyoga-5-131-17'
    kind: verse
    lines:
      - तं दृष्ट्वा घोरमात्मानं केशवस्य महात्मनः
      - न्यमीलयन्त नेत्राणि राजानस्त्रस्तचेतसः
    iast: "taṃ dṛṣṭvā ghoramātmānaṃ keśavasya mahātmanaḥ | nyamīlayanta netrāṇi rājānastrastacetasaḥ"
  - id: 'udyoga-5-131-19'
    kind: verse
    lines:
      - प्रादात्तेषां स भगवान्दिव्यं चक्षुर्जनार्दनः
    iast: "prādātteṣāṃ sa bhagavāndivyaṃ cakṣurjanārdanaḥ"
  - id: 'udyoga-5-131-21'
    kind: verse
    lines:
      - ततो देवाः सगन्धर्वाः किन्नराश्च महोरगाः ऋषयश्च महाभागा लोकपालैः समन्विताः
      - प्रणम्य शिरसा देवं तुष्टुवुः प्राञ्जलिस्थिताः
    iast: "tato devāḥ sagandharvāḥ kinnarāśca mahoragāḥ ṛṣayaśca mahābhāgā lokapālaiḥ samanvitāḥ | praṇamya śirasā devaṃ tuṣṭuvuḥ prāñjalisthitāḥ"
  - id: 'udyoga-5-131-32'
    kind: verse
    lines:
      - ततः स पुरुषव्याघ्रः सञ्जहार वपुः स्वकम्
      - तां दिव्यामद्भुतां चित्रामृद्धिमत्तामरिन्दमः
    iast: "tataḥ sa puruṣavyāghraḥ sañjahāra vapuḥ svakam | tāṃ divyāmadbhutāṃ citrāmṛddhimattāmarindamaḥ"
  - id: 'udyoga-5-131-40'
    kind: verse
    lines:
      - उपस्थितरथं शौरिं प्रयास्यन्तमरिन्दमम्
      - धृतराष्ट्रो महाराजः पुनरेवाभ्यभाषत
    iast: "upasthitarathaṃ śauriṃ prayāsyantamarindamam | dhṛtarāṣṭro mahārājaḥ punarevābhyabhāṣata"
  - id: 'udyoga-5-131-41'
    kind: verse
    lines:
      - यावद्बलं मे पुत्रेषु पश्यतस्ते जनार्दन
      - प्रत्यक्षं ते न ते किंचित्परोक्षं शत्रुकर्शन
    iast: "yāvadbalaṃ me putreṣu paśyataste janārdana | pratyakṣaṃ te na te kiṃcitparokṣaṃ śatrukarśana"
  - id: 'udyoga-5-131-42'
    kind: verse
    lines:
      - कुरूणां शममिच्छन्तं यतमानं च केशव
      - विदित्वैतामवस्थां मे नातिशङ्कितुमर्हसि
    iast: "kurūṇāṃ śamamicchantaṃ yatamānaṃ ca keśava | viditvaitāmavasthāṃ me nātiśaṅkitumarhasi"
  - id: 'udyoga-5-131-45'
    kind: verse
    lines:
      - ततोऽब्रवीन्महाबाहुर्धृतराष्ट्रं जनार्दनः
      - द्रोणं पितामहं भीष्मं क्षत्तारं बाह्लिकं कृपम्
    iast: "tato'bravīnmahābāhurdhṛtarāṣṭraṃ janārdanaḥ | droṇaṃ pitāmahaṃ bhīṣmaṃ kṣattāraṃ bāhlikaṃ kṛpam"
  - id: 'udyoga-5-131-46'
    kind: verse
    lines:
      - प्रत्यक्षमेतद्भवतां यद्वृत्तं कुरुसंसदि
      - यथा चाशिष्टवन्मन्दो रोषादद्य समुत्थितः
    iast: "pratyakṣametadbhavatāṃ yadvṛttaṃ kurusaṃsadi | yathā cāśiṣṭavanmando roṣādadya samutthitaḥ"
  - id: 'udyoga-5-131-47'
    kind: verse
    lines:
      - वदत्यनीशमात्मानं धृतराष्ट्रो महीपतिः
      - आपृच्छे भवतः सर्वान्गमिष्यामि युधिष्ठिरम्
    iast: "vadatyanīśamātmānaṃ dhṛtarāṣṭro mahīpatiḥ | āpṛcche bhavataḥ sarvāngamiṣyāmi yudhiṣṭhiram"
  - id: 'udyoga-5-131-50'
    kind: verse
    lines:
      - ततो रथेन शुभ्रेण महता किङ्किणीकिना
      - कुरूणां पश्यतां द्रष्टुं स्वसारं स पितुर्ययौ
    iast: "tato rathena śubhreṇa mahatā kiṅkiṇīkinā | kurūṇāṃ paśyatāṃ draṣṭuṃ svasāraṃ sa pituryayau"
  - id: 'udyoga-5-132-1'
    kind: verse
    lines:
      - प्रविश्याथ गृहं तस्याश्चरणावभिवाद्य च
      - आचख्यौ तत्समासेन यद्वृत्तं कुरुसंसदि
      - वासुदेव उवाच
    iast: "praviśyātha gṛhaṃ tasyāścaraṇāvabhivādya ca | ācakhyau tatsamāsena yadvṛttaṃ kurusaṃsadi | vāsudeva uvāca"
  - id: 'udyoga-5-132-2'
    kind: verse
    lines:
      - उक्तं बहुविधं वाक्यं ग्रहणीयं सहेतुकम्
      - ऋषिभिश्चैव च मया न चासौ तद्गृहीतवान्
    iast: "uktaṃ bahuvidhaṃ vākyaṃ grahaṇīyaṃ sahetukam | ṛṣibhiścaiva ca mayā na cāsau tadgṛhītavān"
  - id: 'udyoga-5-132-3'
    kind: verse
    lines:
      - कालपक्वमिदं सर्वं सुयोधनवशानुगम् सर्वक्षत्रं क्षणेनैव दह्यते पार्थवह्निना
      - आपृच्छे भवतीं शीघ्रं प्रयास्ये पाण्डवान्प्रति
    iast: "kālapakvamidaṃ sarvaṃ suyodhanavaśānugam sarvakṣatraṃ kṣaṇenaiva dahyate pārthavahninā | āpṛcche bhavatīṃ śīghraṃ prayāsye pāṇḍavānprati"
  - id: 'udyoga-5-132-4'
    kind: verse
    lines:
      - किं वाच्याः पाण्डवेयास्ते भवत्या वचनान्मया
      - तद्ब्रूहि त्वं महाप्रज्ञे शुश्रूषे वचनं तव
      - कुन्त्युवाच
    iast: "kiṃ vācyāḥ pāṇḍaveyāste bhavatyā vacanānmayā | tadbrūhi tvaṃ mahāprajñe śuśrūṣe vacanaṃ tava | kuntyuvāca"
  - id: 'udyoga-5-132-5'
    kind: verse
    lines:
      - ब्रूयाः केशव राजानं धर्मात्मानं युधिष्ठिरम्
      - भूयांस्ते हीयते धर्मो मा पुत्रक वृथा कृथाः
    iast: "brūyāḥ keśava rājānaṃ dharmātmānaṃ yudhiṣṭhiram | bhūyāṃste hīyate dharmo mā putraka vṛthā kṛthāḥ"
  - id: 'udyoga-5-132-33'
    kind: verse
    lines:
      - इतो दुःखतरं किं नु यदहं दीनबान्धवा
      - परपिण्डमुदीक्षे वै त्वां सूत्वा मित्रनन्दन
    iast: "ito duḥkhataraṃ kiṃ nu yadahaṃ dīnabāndhavā | parapiṇḍamudīkṣe vai tvāṃ sūtvā mitranandana"
  - id: 'udyoga-5-132-34'
    kind: verse
    lines:
      - युध्यस्व राजधर्मेण मा निमञ्जीः पितामहान्
      - मा गमः क्षीणपुण्यस्त्वं सानुजः पापिकां गतिं
    iast: "yudhyasva rājadharmeṇa mā nimañjīḥ pitāmahān | mā gamaḥ kṣīṇapuṇyastvaṃ sānujaḥ pāpikāṃ gatiṃ"
  - id: 'udyoga-5-137-10'
    kind: verse
    lines:
      - यदर्थं क्षत्रिया सूते तस्य कालोऽयमागतः
      - न हि वैरं समासाद्य सीदन्ति पुरुषर्षभाः
    iast: "yadarthaṃ kṣatriyā sūte tasya kālo'yamāgataḥ | na hi vairaṃ samāsādya sīdanti puruṣarṣabhāḥ"
  - id: 'udyoga-5-137-24'
    kind: verse
    lines:
      - मां वै कुशलिनीं ब्रूयास्तेषु भूयो जनार्दन
      - अरिष्टं गच्छ पन्थानं पुत्रान्मे प्रतिपालय
      - वैशंपायन उवाच
    iast: "māṃ vai kuśalinīṃ brūyāsteṣu bhūyo janārdana | ariṣṭaṃ gaccha panthānaṃ putrānme pratipālaya | vaiśaṃpāyana uvāca"
  - id: 'udyoga-5-137-25'
    kind: verse
    lines:
      - अभिवाद्याथ तां कृष्णः कृत्वा चापि प्रदक्षिणम्
      - निश्चक्राम महाबाहुः सिंहखेलगतिस्ततः
    iast: "abhivādyātha tāṃ kṛṣṇaḥ kṛtvā cāpi pradakṣiṇam | niścakrāma mahābāhuḥ siṃhakhelagatistataḥ"
  - id: 'udyoga-5-137-26'
    kind: verse
    lines:
      - ततो विसर्जयामास भीष्मादीन्कुरुपुङ्गवान्
      - आरोप्याथ रथे कर्णं प्रायात्सात्यकिना सह
    iast: "tato visarjayāmāsa bhīṣmādīnkurupuṅgavān | āropyātha rathe karṇaṃ prāyātsātyakinā saha"
  - id: 'udyoga-5-140-11'
    kind: verse
    lines:
      - मया सार्धमितो यातमद्य त्वां तात पाण्डवाः
      - अभिजानन्तु कौन्तेयं पूर्वजातं युधिष्ठिरात्
    iast: "mayā sārdhamito yātamadya tvāṃ tāta pāṇḍavāḥ | abhijānantu kaunteyaṃ pūrvajātaṃ yudhiṣṭhirāt"
  - id: 'udyoga-5-140-12'
    kind: verse
    lines:
      - पादौ तव ग्रहीष्यन्ति भ्रातरः पञ्च पाण्डवाः
      - द्रौपदेयास्तथा पञ्च सौभद्रश्चापराजितः
    iast: "pādau tava grahīṣyanti bhrātaraḥ pañca pāṇḍavāḥ | draupadeyāstathā pañca saubhadraścāparājitaḥ"
  - id: 'udyoga-5-140-18'
    kind: verse
    lines:
      - द्रौपदेयास्तथा पञ्च पाञ्चालाश्चेदयस्तथा
      - अहं च त्वाऽभिषेक्ष्यामि राजानं पृथिवीपतिम्
    iast: "draupadeyāstathā pañca pāñcālāścedayastathā | ahaṃ ca tvā'bhiṣekṣyāmi rājānaṃ pṛthivīpatim"
  - id: 'udyoga-5-140-28'
    kind: verse
    lines:
      - स त्वं परिवृतः पार्थैर्नक्षत्रैरिव चन्द्रमाः
      - प्रशाधि राज्यं कौन्तेय कुन्तीं च प्रतिनन्दय
    iast: "sa tvaṃ parivṛtaḥ pārthairnakṣatrairiva candramāḥ | praśādhi rājyaṃ kaunteya kuntīṃ ca pratinandaya"
  - id: 'udyoga-5-141-2'
    kind: verse
    lines:
      - सर्वं चैवाभिजानामि पाण्डोः पुत्रोऽस्मि धर्मतः
      - निश्चयाद्धर्मशास्त्राणां यथा त्वं कृष्ण मन्यसे
    iast: "sarvaṃ caivābhijānāmi pāṇḍoḥ putro'smi dharmataḥ | niścayāddharmaśāstrāṇāṃ yathā tvaṃ kṛṣṇa manyase"
  - id: 'udyoga-5-141-3'
    kind: verse
    lines:
      - कन्या गर्भं समाधत्त भास्करान्मां जनार्दन
      - आदित्यवचनाच्चैव जातं मां सा व्यसर्जयत्
    iast: "kanyā garbhaṃ samādhatta bhāskarānmāṃ janārdana | ādityavacanāccaiva jātaṃ māṃ sā vyasarjayat"
  - id: 'udyoga-5-141-4'
    kind: verse
    lines:
      - सोस्मि कृष्ण तथाजातः पाण्डोः पुत्रोस्मि धर्मतः
      - कुन्त्या त्वहमपाकीर्णो यथा न कुशलं तथा
    iast: "sosmi kṛṣṇa tathājātaḥ pāṇḍoḥ putrosmi dharmataḥ | kuntyā tvahamapākīrṇo yathā na kuśalaṃ tathā"
  - id: 'udyoga-5-141-5'
    kind: verse
    lines:
      - सूतो हि मामधिरथो दृष्ट्वैवाभ्यानयद्गृहान्
      - राधायाश्चैव मां प्रादात्सौहार्दान्मधुसूदन
    iast: "sūto hi māmadhiratho dṛṣṭvaivābhyānayadgṛhān | rādhāyāścaiva māṃ prādātsauhārdānmadhusūdana"
  - id: 'udyoga-5-141-6'
    kind: verse
    lines:
      - मत्स्नेहाच्चैव राधायां सद्यः क्षीरमवातरत्
      - सा मे मूत्रं पुरीषं च प्रतिजग्राह माधव
    iast: "matsnehāccaiva rādhāyāṃ sadyaḥ kṣīramavātarat | sā me mūtraṃ purīṣaṃ ca pratijagrāha mādhava"
  - id: 'udyoga-5-141-8'
    kind: verse
    lines:
      - तथा मामभिजानाति सूतश्चाधिरथः सुतम्
      - पितरं चाभिजानामि तमहं सौहृदात्सदा
    iast: "tathā māmabhijānāti sūtaścādhirathaḥ sutam | pitaraṃ cābhijānāmi tamahaṃ sauhṛdātsadā"
  - id: 'udyoga-5-141-10'
    kind: verse
    lines:
      - नाम वै वसुषेणेति कारयामास वै द्विजैः
      - भार्याश्चोढा मम प्राप्ते यौवने तत्परिग्रहात्
    iast: "nāma vai vasuṣeṇeti kārayāmāsa vai dvijaiḥ | bhāryāścoḍhā mama prāpte yauvane tatparigrahāt"
  - id: 'udyoga-5-141-11'
    kind: verse
    lines:
      - तासु पुत्राश्च पौत्राश्च मम जाता जनार्दन
      - तासु मे हृदयं कृष्ण संजातं कामबन्धनम्
    iast: "tāsu putrāśca pautrāśca mama jātā janārdana | tāsu me hṛdayaṃ kṛṣṇa saṃjātaṃ kāmabandhanam"
  - id: 'udyoga-5-141-12'
    kind: verse
    lines:
      - न पृथिव्या सकलया न सुवर्णस्य राशिभिः
      - हर्षाद्भयाद्वा गोविन्द मिथ्या कर्तुं तदुत्सहे
    iast: "na pṛthivyā sakalayā na suvarṇasya rāśibhiḥ | harṣādbhayādvā govinda mithyā kartuṃ tadutsahe"
  - id: 'udyoga-5-141-13'
    kind: verse
    lines:
      - धृतराष्ट्रकुले कृष्ण दुर्योधनसमाश्रयात्
      - मया त्रयोदशसमा भुक्तं राज्यमकण्टकम्
    iast: "dhṛtarāṣṭrakule kṛṣṇa duryodhanasamāśrayāt | mayā trayodaśasamā bhuktaṃ rājyamakaṇṭakam"
  - id: 'udyoga-5-141-15'
    kind: verse
    lines:
      - मां च कृष्ण समासाद्य कृतः शस्त्रसमुद्यमः
      - दुर्योधनेन वार्ष्णेय विग्रहश्चापि पाण्डवैः
    iast: "māṃ ca kṛṣṇa samāsādya kṛtaḥ śastrasamudyamaḥ | duryodhanena vārṣṇeya vigrahaścāpi pāṇḍavaiḥ"
  - id: 'udyoga-5-141-17'
    kind: verse
    lines:
      - वधाद्बन्धाद्भयाद्वापि लोभाद्वापि जनार्दन
      - अनृतं नोत्सहे कर्तुं धार्तराष्ट्रस्य धीमतः
    iast: "vadhādbandhādbhayādvāpi lobhādvāpi janārdana | anṛtaṃ notsahe kartuṃ dhārtarāṣṭrasya dhīmataḥ"
  - id: 'udyoga-5-141-18'
    kind: verse
    lines:
      - यदि ह्यद्य न गच्छेयं द्वैरथं सव्यसाचिना
      - अकीर्तिः स्याद्धृपीकेश मम पार्थस्य चोभयोः
    iast: "yadi hyadya na gaccheyaṃ dvairathaṃ savyasācinā | akīrtiḥ syāddhṛpīkeśa mama pārthasya cobhayoḥ"
  - id: 'udyoga-5-141-21'
    kind: verse
    lines:
      - यदि जानाति मां राजा धर्मात्मा संयतेन्द्रियः
      - कुन्त्याः प्रथमजं पुत्रं न स राज्यं ग्रहीष्यति
    iast: "yadi jānāti māṃ rājā dharmātmā saṃyatendriyaḥ | kuntyāḥ prathamajaṃ putraṃ na sa rājyaṃ grahīṣyati"
  - id: 'udyoga-5-141-22'
    kind: verse
    lines:
      - प्राप्य चापि महद्राज्यं तदहं मधुसूदन
      - स्फीतं दुर्योधनायैव संप्रदद्यामरिन्दम
    iast: "prāpya cāpi mahadrājyaṃ tadahaṃ madhusūdana | sphītaṃ duryodhanāyaiva saṃpradadyāmarindama"
  - id: 'udyoga-5-141-23'
    kind: verse
    lines:
      - स एव राजा धर्मात्मा शाश्वतोऽस्तु युधिष्ठिरः
      - नेता यस्य हृषीकेसो योद्धा यस्य धनञ्जयः
    iast: "sa eva rājā dharmātmā śāśvato'stu yudhiṣṭhiraḥ | netā yasya hṛṣīkeso yoddhā yasya dhanañjayaḥ"
  - id: 'udyoga-5-141-57'
    kind: verse
    lines:
      - समुपानय कौन्तेयं युद्धाय मम केशव
      - मन्त्रसंवरणं कुर्वन्नित्यमेव परन्तप
    iast: "samupānaya kaunteyaṃ yuddhāya mama keśava | mantrasaṃvaraṇaṃ kurvannityameva parantapa"
  - id: 'udyoga-5-143-50'
    kind: verse
    lines:
      - इत्युक्त्वा माधवं कर्णः परिष्वज्य च पीडितम्
      - विसर्जितः केशवेन रथोपस्थादवातरत्
    iast: "ityuktvā mādhavaṃ karṇaḥ pariṣvajya ca pīḍitam | visarjitaḥ keśavena rathopasthādavātarat"
  - id: 'udyoga-5-143-51'
    kind: verse
    lines:
      - ततः स्वरथामस्थाय जाम्बूनदविभूषितम्
      - महात्मा वै निववृते राधेयो दीनमानसः
    iast: "tataḥ svarathāmasthāya jāmbūnadavibhūṣitam | mahātmā vai nivavṛte rādheyo dīnamānasaḥ"
  - id: 'udyoga-5-144-30'
    kind: verse
    lines:
      - आपृष्ठतापाञ्जप्त्वा स परिवृत्त्य यतव्रतः
      - दृष्ट्वा कुन्तीमुपातिष्ठदभिवाद्य कृताञ्जलिः
    iast: "āpṛṣṭhatāpāñjaptvā sa parivṛttya yatavrataḥ | dṛṣṭvā kuntīmupātiṣṭhadabhivādya kṛtāñjaliḥ"
  - id: 'udyoga-5-145-1'
    kind: verse
    lines:
      - राधेयोऽहमाधिरथिः कर्णस्त्वामभिवादये
      - प्राप्ता किमर्थं भवती ब्रूहि किं करवामि ते
      - कुन्त्युवाच
    iast: "rādheyo'hamādhirathiḥ karṇastvāmabhivādaye | prāptā kimarthaṃ bhavatī brūhi kiṃ karavāmi te | kuntyuvāca"
  - id: 'udyoga-5-145-2'
    kind: verse
    lines:
      - कौन्तेयस्त्वं न राधेयो न तवाधिरथः पिता
      - नासि सूतकुले जातः कर्ण तद्विद्धि मे वचः
    iast: "kaunteyastvaṃ na rādheyo na tavādhirathaḥ pitā | nāsi sūtakule jātaḥ karṇa tadviddhi me vacaḥ"
  - id: 'udyoga-5-145-3'
    kind: verse
    lines:
      - कानीनस्त्वं मया जातः पूर्वजः कुक्षिणा धृतः
      - कुन्तिराजस्य भवने पार्थस्त्वमसि पुत्रक
    iast: "kānīnastvaṃ mayā jātaḥ pūrvajaḥ kukṣiṇā dhṛtaḥ | kuntirājasya bhavane pārthastvamasi putraka"
  - id: 'udyoga-5-145-9'
    kind: verse
    lines:
      - अद्य पश्यन्तु कुरवः कर्णार्जुनसमागमम् सौभ्रात्रेण समालक्ष्य संनमन्तामसाधवः
    iast: "adya paśyantu kuravaḥ karṇārjunasamāgamam saubhrātreṇa samālakṣya saṃnamantāmasādhavaḥ"
  - id: 'udyoga-5-146-8'
    kind: verse
    lines:
      - न वै मम हितं पूर्वं मातृवच्चेष्टितं त्वया
      - सा मां संबोधयस्यद्य केवलात्महितैषिणी
    iast: "na vai mama hitaṃ pūrvaṃ mātṛvacceṣṭitaṃ tvayā | sā māṃ saṃbodhayasyadya kevalātmahitaiṣiṇī"
  - id: 'udyoga-5-146-10'
    kind: verse
    lines:
      - अभ्राता विदितः पूर्वं युद्धकाले प्रकाशितः
      - पाण्डवान्यदि गच्छामि किं मां क्षत्रं वदिष्यति
    iast: "abhrātā viditaḥ pūrvaṃ yuddhakāle prakāśitaḥ | pāṇḍavānyadi gacchāmi kiṃ māṃ kṣatraṃ vadiṣyati"
  - id: 'udyoga-5-146-12'
    kind: verse
    lines:
      - उपनह्य परैर्वैरं ये मां नित्यमुपासते
      - नमस्कुर्वन्ति च सदा वसवो वासवं यथा
    iast: "upanahya parairvairaṃ ye māṃ nityamupāsate | namaskurvanti ca sadā vasavo vāsavaṃ yathā"
  - id: 'udyoga-5-146-13'
    kind: verse
    lines:
      - मम प्राणेन ये शत्रूञ्शक्ताः प्रतिसमासितुम्
      - मन्यन्ते ते कथं तेषामहं छिन्द्यां मनोरथम्
    iast: "mama prāṇena ye śatrūñśaktāḥ pratisamāsitum | manyante te kathaṃ teṣāmahaṃ chindyāṃ manoratham"
  - id: 'udyoga-5-146-18'
    kind: verse
    lines:
      - धृतराष्ट्रस्य पुत्राणामर्थे योत्स्यामि ते सुतैः
      - बलं च शक्तिं चास्थाय न वै त्वय्यनृतं वदे
    iast: "dhṛtarāṣṭrasya putrāṇāmarthe yotsyāmi te sutaiḥ | balaṃ ca śaktiṃ cāsthāya na vai tvayyanṛtaṃ vade"
  - id: 'udyoga-5-146-20'
    kind: verse
    lines:
      - न च तेऽयं समारम्भो मयि मोघो भविष्यति
      - वध्यान्विषह्यान्संग्रामे न हनिष्यामि ते सुतान्
    iast: "na ca te'yaṃ samārambho mayi mogho bhaviṣyati | vadhyānviṣahyānsaṃgrāme na haniṣyāmi te sutān"
  - id: 'udyoga-5-146-21'
    kind: verse
    lines:
      - युधिष्ठिरं च भीमं च यमौ चैवार्जुनादृते
      - अर्जुनेन समं युद्धमपि यौधिष्ठिरे बले
    iast: "yudhiṣṭhiraṃ ca bhīmaṃ ca yamau caivārjunādṛte | arjunena samaṃ yuddhamapi yaudhiṣṭhire bale"
  - id: 'udyoga-5-146-23'
    kind: verse
    lines:
      - न ते जातु नशिष्यन्ति पुत्राः पञ्च यशस्विनि
      - निरर्जुनाः सकर्णा वा सार्जुना वा हते मयि
    iast: "na te jātu naśiṣyanti putrāḥ pañca yaśasvini | nirarjunāḥ sakarṇā vā sārjunā vā hate mayi"
  - id: 'udyoga-5-146-27'
    kind: verse
    lines:
      - अनामयं स्वस्ति चेति पृथाथो कर्णमब्रवीत्
      - तां कर्णोऽभ्यवदत्प्रीतस्ततस्तौ जग्मतुः पृथक्
    iast: "anāmayaṃ svasti ceti pṛthātho karṇamabravīt | tāṃ karṇo'bhyavadatprītastatastau jagmatuḥ pṛthak"
  - id: 'udyoga-5-147-1'
    kind: verse
    lines:
      - आगम्य हास्तिनपुरादुपप्लाव्यमरिन्दमः
      - पाण्डवानां यथावृत्तं केशवः सर्वमुक्तवान्
    iast: "āgamya hāstinapurādupaplāvyamarindamaḥ | pāṇḍavānāṃ yathāvṛttaṃ keśavaḥ sarvamuktavān"
  - id: 'udyoga-5-147-6'
    kind: verse
    lines:
      - मया नागपुरं गत्वा सभायां धृतराष्ट्रजः तथ्यं पथ्यं हितं चोक्तो न च गृह्णाति दुर्मतिः
      - युधिष्ठिर उवाच तस्मिन्नुत्पथमापन्ने कुरुवृद्धः पितामहः
      - किमुक्तवान्हृषीकेश दुर्योधनममर्षणम्
    iast: "mayā nāgapuraṃ gatvā sabhāyāṃ dhṛtarāṣṭrajaḥ tathyaṃ pathyaṃ hitaṃ cokto na ca gṛhṇāti durmatiḥ | yudhiṣṭhira uvāca tasminnutpathamāpanne kuruvṛddhaḥ pitāmahaḥ | kimuktavānhṛṣīkeśa duryodhanamamarṣaṇam"
  - id: 'udyoga-5-150-18'
    kind: verse
    lines:
      - एवमुक्तोऽपि दुष्टात्मा नैव भागं व्यमुञ्चत
      - दण्डं चतुर्थं पश्यामि तेषु पापेषु नान्यथा
    iast: "evamukto'pi duṣṭātmā naiva bhāgaṃ vyamuñcata | daṇḍaṃ caturthaṃ paśyāmi teṣu pāpeṣu nānyathā"
  - id: 'udyoga-5-150-19'
    kind: verse
    lines:
      - निर्याताश्च विनाशाय कुरुक्षेत्रं नराधिपाः
      - एतत्ते कथितं राजन्यद्वृत्तं कुरुसंसदि
    iast: "niryātāśca vināśāya kurukṣetraṃ narādhipāḥ | etatte kathitaṃ rājanyadvṛttaṃ kurusaṃsadi"
  - id: 'udyoga-5-151-1'
    kind: verse
    lines:
      - जनार्दनवचः श्रुत्वा धर्मराजो युधिष्ठिरः
      - भ्रातॄनुवाच धर्मात्मा समक्षं केशवस्य ह
    iast: "janārdanavacaḥ śrutvā dharmarājo yudhiṣṭhiraḥ | bhrātṝnuvāca dharmātmā samakṣaṃ keśavasya ha"
  - id: 'udyoga-5-151-3'
    kind: verse
    lines:
      - तस्मात्सेनाविभागं मे कुरुध्वं नरसत्तमाः
      - अक्षौहिण्यश्च सप्तैताः समेता विजयाय वै
    iast: "tasmātsenāvibhāgaṃ me kurudhvaṃ narasattamāḥ | akṣauhiṇyaśca saptaitāḥ sametā vijayāya vai"
  - id: 'udyoga-5-151-39'
    kind: verse
    lines:
      - तस्य तद्वचनं श्रुत्वा धर्मराजस्य धीमतः
      - अब्रवीत्पुण्डरीकाक्षो धनञ्जयमवेक्ष्य ह
    iast: "tasya tadvacanaṃ śrutvā dharmarājasya dhīmataḥ | abravītpuṇḍarīkākṣo dhanañjayamavekṣya ha"
  - id: 'udyoga-5-151-69'
    kind: verse
    lines:
      - तेऽवगाह्य कुरुक्षेत्रं शङ्खान्दध्मुररिन्दमाः
      - तथैव दध्मतुः शङ्खं वासुदेवधनञ्जयौ
    iast: "te'vagāhya kurukṣetraṃ śaṅkhāndadhmurarindamāḥ | tathaiva dadhmatuḥ śaṅkhaṃ vāsudevadhanañjayau"
  - id: 'udyoga-5-156-1'
    kind: verse
    lines:
      - ततः शान्तनवं भीष्मं प्राञ्जलिर्धृतराष्ट्रजः
      - सह सर्वैर्महीपालैरिदं वचनमब्रवीत्
    iast: "tataḥ śāntanavaṃ bhīṣmaṃ prāñjalirdhṛtarāṣṭrajaḥ | saha sarvairmahīpālairidaṃ vacanamabravīt"
  - id: 'udyoga-5-156-15'
    kind: verse
    lines:
      - प्रयातु नो भवानग्रे देवानामिव पावकिः
      - वयं त्वामनुयास्यामः सौरभेया इवर्षभम्
      - भीष्म उवाच
    iast: "prayātu no bhavānagre devānāmiva pāvakiḥ | vayaṃ tvāmanuyāsyāmaḥ saurabheyā ivarṣabham | bhīṣma uvāca"
  - id: 'udyoga-5-156-16'
    kind: verse
    lines:
      - एवमेतन्महाबाहो यथा वदसि भारत
      - यथैव हि भवन्तो मे तथैव मम पाण्डवाः
    iast: "evametanmahābāho yathā vadasi bhārata | yathaiva hi bhavanto me tathaiva mama pāṇḍavāḥ"
  - id: 'udyoga-5-156-21'
    kind: verse
    lines:
      - न त्वेवोत्सादनीया मे पाण्डोः पुत्रा जनाधिप
      - तस्माद्योधान्हनिष्यामि प्रयोगेणायुतं सदा
    iast: "na tvevotsādanīyā me pāṇḍoḥ putrā janādhipa | tasmādyodhānhaniṣyāmi prayogeṇāyutaṃ sadā"
  - id: 'udyoga-5-156-23'
    kind: verse
    lines:
      - सेनापतिस्त्वहं राजन्समयेनापरेण ते
      - भविष्यामि यथाकामं तन्मे श्रोतुमिहार्हसि
    iast: "senāpatistvahaṃ rājansamayenāpareṇa te | bhaviṣyāmi yathākāmaṃ tanme śrotumihārhasi"
  - id: 'udyoga-5-156-24'
    kind: verse
    lines:
      - कर्णो वा युध्यतां पूर्वमहं वा पृथिवीपते
      - स्पर्धते हि सदात्यर्थं सूतपुत्रो मया रणे
      - कर्ण उवाच
    iast: "karṇo vā yudhyatāṃ pūrvamahaṃ vā pṛthivīpate | spardhate hi sadātyarthaṃ sūtaputro mayā raṇe | karṇa uvāca"
  - id: 'udyoga-5-156-25'
    kind: verse
    lines:
      - नाहं जीवति गाङ्गेये राजन्योत्स्ये कथंचन
      - हते भीष्मे तु योत्स्यामि सह गाण्डीवधन्वना
      - वैशंपायन उवाच
    iast: "nāhaṃ jīvati gāṅgeye rājanyotsye kathaṃcana | hate bhīṣme tu yotsyāmi saha gāṇḍīvadhanvanā | vaiśaṃpāyana uvāca"
  - id: 'udyoga-5-195-1'
    kind: verse
    lines:
      - ततः प्रभाते विमले धार्तराष्ट्रेण चोदिताः
      - दुर्योधनेन राजानः प्रययुः पाण्डवान्प्रति
    iast: "tataḥ prabhāte vimale dhārtarāṣṭreṇa coditāḥ | duryodhanena rājānaḥ prayayuḥ pāṇḍavānprati"
  - id: 'udyoga-5-196-1'
    kind: verse
    lines:
      - तथैव राजा कौन्तेयो धर्मपुत्रो युधिष्ठिरः
      - धृष्टद्युम्नमुखान्वीरांश्चोदयामास भारत
    iast: "tathaiva rājā kaunteyo dharmaputro yudhiṣṭhiraḥ | dhṛṣṭadyumnamukhānvīrāṃścodayāmāsa bhārata"
  - id: 'bhisma-6-1-26'
    kind: verse
    lines:
      - ततस्ते समयं चक्रुः कुरुपाण्डवसोमकाः
      - धर्मान्संस्थापयामासुर्युद्धानां भरतर्षभ
    iast: "tataste samayaṃ cakruḥ kurupāṇḍavasomakāḥ | dharmānsaṃsthāpayāmāsuryuddhānāṃ bharatarṣabha"
  - id: 'bhisma-6-1-27'
    kind: verse
    lines:
      - निवृत्ते विहिते युद्धे स्यात्प्रीतिर्नः परस्परम्
      - यथापरं यथायोगं न च स्यात्कस्यचित्पुनः
    iast: "nivṛtte vihite yuddhe syātprītirnaḥ parasparam | yathāparaṃ yathāyogaṃ na ca syātkasyacitpunaḥ"
  - id: 'bhisma-6-1-28'
    kind: verse
    lines:
      - वाचा युद्धे प्रवृत्तानां वाचैव प्रतियोधनम्
      - निष्क्रान्ताः पृतनामध्यान्न हन्तव्याः कदाचन
    iast: "vācā yuddhe pravṛttānāṃ vācaiva pratiyodhanam | niṣkrāntāḥ pṛtanāmadhyānna hantavyāḥ kadācana"
  - id: 'bhisma-6-1-29'
    kind: verse
    lines:
      - रथी च रथिना योध्यो गजेन गजधूर्गतः
      - अश्वेनाश्वी पदातिश्च पादातेनैव भारत
    iast: "rathī ca rathinā yodhyo gajena gajadhūrgataḥ | aśvenāśvī padātiśca pādātenaiva bhārata"
  - id: 'bhisma-6-1-31'
    kind: verse
    lines:
      - परेण सह संयुक्तः प्रमत्तो विमुखस्तथा
      - क्षीणशस्त्रो विवर्मा च न हन्तव्यः कदाचन
    iast: "pareṇa saha saṃyuktaḥ pramatto vimukhastathā | kṣīṇaśastro vivarmā ca na hantavyaḥ kadācana"
  - id: 'bhisma-6-21-1'
    kind: verse
    lines:
      - बृहतीं धार्तराष्ट्रस्य सेनां दृष्ट्वा समुद्यताम्
      - विषादमगमद्राजा कुन्तीपुत्रो युधिष्ठिरः
    iast: "bṛhatīṃ dhārtarāṣṭrasya senāṃ dṛṣṭvā samudyatām | viṣādamagamadrājā kuntīputro yudhiṣṭhiraḥ"
  - id: 'bhisma-6-21-1#2'
    kind: verse
    lines:
      - बृहतीं धार्तराष्ट्रस्य सेनां दृष्ट्वा समुद्यताम्
      - विषादमगमद्राजा कुन्तीपुत्रो युधिष्ठिरः
    iast: "bṛhatīṃ dhārtarāṣṭrasya senāṃ dṛṣṭvā samudyatām | viṣādamagamadrājā kuntīputro yudhiṣṭhiraḥ"
  - id: 'bhisma-6-21-3'
    kind: verse
    lines:
      - धनञ्जय कथं शक्यमस्माभिर्योद्धुमाहवे
      - धार्तराष्ट्रैर्महाबाहो येषां योद्धा पितामहः
    iast: "dhanañjaya kathaṃ śakyamasmābhiryoddhumāhave | dhārtarāṣṭrairmahābāho yeṣāṃ yoddhā pitāmahaḥ"
  - id: 'bhisma-6-21-7'
    kind: verse
    lines:
      - प्रज्ञयाभ्यधिकाञ्शूरान्गुणयुक्तान्बहूनपि
      - जयन्त्यल्पतरा येन तन्निबोध विशांपते
    iast: "prajñayābhyadhikāñśūrānguṇayuktānbahūnapi | jayantyalpatarā yena tannibodha viśāṃpate"
  - id: 'bhisma-6-21-10'
    kind: verse
    lines:
      - न तथा बलवीर्याभ्यां जयन्ति विजिगीषवः
      - यथा सत्यानृशंस्याभ्यां धर्मेणैवोद्यमेन च
    iast: "na tathā balavīryābhyāṃ jayanti vijigīṣavaḥ | yathā satyānṛśaṃsyābhyāṃ dharmeṇaivodyamena ca"
  - id: 'bhisma-6-21-11'
    kind: verse
    lines:
      - त्वक्त्वाऽधर्मं तथा सर्वे धर्मं चोत्तममास्थिताः
      - युध्यध्वमतहंकारा यतो धर्मस्ततो जयः
    iast: "tvaktvā'dharmaṃ tathā sarve dharmaṃ cottamamāsthitāḥ | yudhyadhvamatahaṃkārā yato dharmastato jayaḥ"
  - id: 'bhisma-6-21-12'
    kind: verse
    lines:
      - एवं राजन्विजानीहि ध्रुवोऽस्माकं रणे जयः
      - यथा तु नारदः प्राह यतः कृष्णस्ततो जयः
    iast: "evaṃ rājanvijānīhi dhruvo'smākaṃ raṇe jayaḥ | yathā tu nāradaḥ prāha yataḥ kṛṣṇastato jayaḥ"
  - id: 'bhisma-6-21-13'
    kind: verse
    lines:
      - गुणभूतो जयः कृष्णे पृष्ठतोऽभ्येति माधवम्
      - तद्यथा विजयश्चास्य सन्नतिश्चापरो गुणः
    iast: "guṇabhūto jayaḥ kṛṣṇe pṛṣṭhato'bhyeti mādhavam | tadyathā vijayaścāsya sannatiścāparo guṇaḥ"
  - id: 'bhisma-6-22-1'
    kind: verse
    lines:
      - ततो युधिष्ठिरो राजा स्वां सेनां समचोदयत्
      - प्रतिव्यूहन्ननीकानि भीष्मस्य भरतर्षभ
    iast: "tato yudhiṣṭhiro rājā svāṃ senāṃ samacodayat | prativyūhannanīkāni bhīṣmasya bharatarṣabha"
  - id: 'bhisma-6-22-3'
    kind: verse
    lines:
      - मध्ये शिखण्डिनोऽनीकं रक्षितं सव्यसाचिना
      - धृष्टद्युम्नश्चरन्नग्रे भीमसेनेन पालितः
    iast: "madhye śikhaṇḍino'nīkaṃ rakṣitaṃ savyasācinā | dhṛṣṭadyumnaścarannagre bhīmasenena pālitaḥ"
  - id: 'bhisma-6-22-9'
    kind: verse
    lines:
      - सहस्रसूर्यः शतकिङ्किणीकः परार्ध्यजाम्बूनदहेमचित्रः
      - रथोऽर्जुनस्याग्निरिवार्चिमाली विभ्राजते श्वेतहयः सुचक्रः
    iast: "sahasrasūryaḥ śatakiṅkiṇīkaḥ parārdhyajāmbūnadahemacitraḥ | ratho'rjunasyāgnirivārcimālī vibhrājate śvetahayaḥ sucakraḥ"
  - id: 'bhisma-6-22-10'
    kind: verse
    lines:
      - तमास्थितः केशवसंगृहीतं कपिध्वजो गाण्डिवबाणपाणिः
      - धनुर्धरो यस्य समः पृथिव्यां न विद्यते नो भविता कदाचित्
    iast: "tamāsthitaḥ keśavasaṃgṛhītaṃ kapidhvajo gāṇḍivabāṇapāṇiḥ | dhanurdharo yasya samaḥ pṛthivyāṃ na vidyate no bhavitā kadācit"
  - id: 'bhisma-6-25-26'
    kind: verse
    lines:
      - तत्रापश्यत्स्थितान्पार्थः पितॄनथ पितामहान्
      - आचार्यान्मातुलान्भ्रातॄन्पुत्रान्पौत्रान्सखींस्तथा
    iast: "tatrāpaśyatsthitānpārthaḥ pitṝnatha pitāmahān | ācāryānmātulānbhrātṝnputrānpautrānsakhīṃstathā"
  - id: 'bhisma-6-25-27'
    kind: verse
    lines:
      - श्वशुरान्सुहृदश्चैव सेनयोरुभयोरपि
      - तान्समीक्ष्य स कौन्तेयः सर्वान्बन्धूनवस्थितान्
    iast: "śvaśurānsuhṛdaścaiva senayorubhayorapi | tānsamīkṣya sa kaunteyaḥ sarvānbandhūnavasthitān"
  - id: 'bhisma-6-25-28'
    kind: verse
    lines:
      - कृपया परयाऽविष्टो विषीदन्निदमब्रवीत्
      - अर्जुन उवाच
      - दृष्ट्वेमं स्वजनं कृष्ण युयुत्सुं समुपस्थितम्
    iast: "kṛpayā parayā'viṣṭo viṣīdannidamabravīt | arjuna uvāca | dṛṣṭvemaṃ svajanaṃ kṛṣṇa yuyutsuṃ samupasthitam"
  - id: 'bhisma-6-25-29'
    kind: verse
    lines:
      - सीदन्ति मम गात्राणि मुखं च परिशुष्यति
      - वेपथुश्च शरीरे मे रोमहर्षश्च जायते
    iast: "sīdanti mama gātrāṇi mukhaṃ ca pariśuṣyati | vepathuśca śarīre me romaharṣaśca jāyate"
  - id: 'bhisma-6-25-30'
    kind: verse
    lines:
      - गाण्डीवं स्रंसते हस्तात्त्वक्वैव परिदह्यते
      - न च शक्नोम्यवस्थातुं भ्रमतीव च मे मनः
    iast: "gāṇḍīvaṃ sraṃsate hastāttvakvaiva paridahyate | na ca śaknomyavasthātuṃ bhramatīva ca me manaḥ"
  - id: 'bhisma-6-25-32'
    kind: verse
    lines:
      - न काङ्क्षे विजयं कृष्ण न च राज्यं सुखानि च
      - किं नो राज्येन गोविन्द किं भोगैर्जीवितेन वा
    iast: "na kāṅkṣe vijayaṃ kṛṣṇa na ca rājyaṃ sukhāni ca | kiṃ no rājyena govinda kiṃ bhogairjīvitena vā"
  - id: 'bhisma-6-25-37'
    kind: verse
    lines:
      - तस्मान्नार्हा यवं हन्तुं धार्तराष्ट्रान्स्वबान्धवान्
      - स्वजनं हि कथं हत्वा सुखिनः स्याम माधव
    iast: "tasmānnārhā yavaṃ hantuṃ dhārtarāṣṭrānsvabāndhavān | svajanaṃ hi kathaṃ hatvā sukhinaḥ syāma mādhava"
  - id: 'bhisma-6-25-45'
    kind: verse
    lines:
      - अहो बत महत्पापं कर्तुं व्यवसिता वयम्
      - यद्राज्यसुखलोभेन हन्तुं स्वजनमुद्यताः
    iast: "aho bata mahatpāpaṃ kartuṃ vyavasitā vayam | yadrājyasukhalobhena hantuṃ svajanamudyatāḥ"
  - id: 'bhisma-6-26-9'
    kind: verse
    lines:
      - एवमुकत्वा हृषीकेशं गुडाकेशं परंतप
      - न योत्स्य इति गोविन्दमुक्त्वा तूष्णीं बभूव ह
    iast: "evamukatvā hṛṣīkeśaṃ guḍākeśaṃ paraṃtapa | na yotsya iti govindamuktvā tūṣṇīṃ babhūva ha"
  - id: 'bhisma-6-26-10'
    kind: verse
    lines:
      - तमुवाच हृषीकेशः प्रहसन्निव भारत
      - सेनयोरुभयोर्मध्ये विषीदन्तमिदं वचः
      - श्रीभगवानुवाच
    iast: "tamuvāca hṛṣīkeśaḥ prahasanniva bhārata | senayorubhayormadhye viṣīdantamidaṃ vacaḥ | śrībhagavānuvāca"
  - id: 'bhisma-6-26-31'
    kind: verse
    lines:
      - स्वधर्ममपि चावेक्ष्य न विकम्पितुमर्हसि
      - धर्म्याद्धि युद्धाच्छ्रेयोऽन्यत्क्षत्रियस्य न विद्यते
    iast: "svadharmamapi cāvekṣya na vikampitumarhasi | dharmyāddhi yuddhācchreyo'nyatkṣatriyasya na vidyate"
  - id: 'bhisma-6-26-33'
    kind: verse
    lines:
      - अथ चेत्त्वमिमं धर्म्यं संग्रामं न करिष्यसि
      - ततः स्वधर्मं कीर्तिं च हित्वा पापमवाप्स्यसि
    iast: "atha cettvamimaṃ dharmyaṃ saṃgrāmaṃ na kariṣyasi | tataḥ svadharmaṃ kīrtiṃ ca hitvā pāpamavāpsyasi"
  - id: 'bhisma-6-26-35'
    kind: verse
    lines:
      - भयाद्रणादुपरतं मंस्यन्ते त्वां महारथाः
      - येषां च त्वं बहुमतो भूत्वा यास्यसि लाघवम्
    iast: "bhayādraṇāduparataṃ maṃsyante tvāṃ mahārathāḥ | yeṣāṃ ca tvaṃ bahumato bhūtvā yāsyasi lāghavam"
  - id: 'bhisma-6-26-37'
    kind: verse
    lines:
      - हतो वा प्राप्स्यसि स्वर्गं जित्वा वा भोक्ष्यसे महीम्
      - तस्मादुत्तिष्ठ कौन्तेय युद्धाय कृतनिश्चयः
    iast: "hato vā prāpsyasi svargaṃ jitvā vā bhokṣyase mahīm | tasmāduttiṣṭha kaunteya yuddhāya kṛtaniścayaḥ"
  - id: 'bhisma-6-26-38'
    kind: verse
    lines:
      - सुखदुःखे समे कृत्वा लाभालाभौ जयाजयौ
      - ततो युद्धाय युज्यस्व नैवं पापमवाप्स्यसि
    iast: "sukhaduḥkhe same kṛtvā lābhālābhau jayājayau | tato yuddhāya yujyasva naivaṃ pāpamavāpsyasi"
  - id: 'bhisma-6-26-47'
    kind: verse
    lines:
      - कर्मण्येवाधिकारस्ते मा फलेषु कदा च न
      - मा कर्मफलहेतुर्भूर्मा ते सङ्गोऽस्त्वकर्मणि
    iast: "karmaṇyevādhikāraste mā phaleṣu kadā ca na | mā karmaphalaheturbhūrmā te saṅgo'stvakarmaṇi"
  - id: 'bhisma-6-27-5'
    kind: verse
    lines:
      - न हि कश्चित्क्षणमपि जातु तिष्ठत्यकर्मकृत्
      - कार्यते ह्यवशः कर्म सर्वः प्रकृतिजैर्गुणैः
    iast: "na hi kaścitkṣaṇamapi jātu tiṣṭhatyakarmakṛt | kāryate hyavaśaḥ karma sarvaḥ prakṛtijairguṇaiḥ"
  - id: 'bhisma-6-27-22'
    kind: verse
    lines:
      - न मे पार्थास्ति कर्तव्यं त्रिषु लोकेषु किंचन
      - नानवाप्तमवाप्तव्यं वर्त एव च कर्मणि
    iast: "na me pārthāsti kartavyaṃ triṣu lokeṣu kiṃcana | nānavāptamavāptavyaṃ varta eva ca karmaṇi"
  - id: 'bhisma-6-27-30'
    kind: verse
    lines:
      - मयि सर्वाणि कर्माणि संन्यस्याध्यात्मचेतसा
      - निराशीर्निर्ममो भूत्वा युध्यस्व विगतज्वरः
    iast: "mayi sarvāṇi karmāṇi saṃnyasyādhyātmacetasā | nirāśīrnirmamo bhūtvā yudhyasva vigatajvaraḥ"
  - id: 'bhisma-6-27-35'
    kind: verse
    lines:
      - श्रेयान्स्वधर्मो विगुणः परधर्मात्स्वनुष्ठितात्
      - स्वधर्मे निधनं श्रेयः परधर्मो भयावहः
      - अर्जुन उवाच
    iast: "śreyānsvadharmo viguṇaḥ paradharmātsvanuṣṭhitāt | svadharme nidhanaṃ śreyaḥ paradharmo bhayāvahaḥ | arjuna uvāca"
  - id: 'bhisma-6-30-1'
    kind: verse
    lines:
      - अनाश्रितः कर्मफलं कार्यं कर्म करोति यः
      - स संन्यासी च योगी च न निरग्निर्न चाक्रियः
    iast: "anāśritaḥ karmaphalaṃ kāryaṃ karma karoti yaḥ | sa saṃnyāsī ca yogī ca na niragnirna cākriyaḥ"
  - id: 'bhisma-6-35-32'
    kind: verse
    lines:
      - कालोऽस्मि लोकक्षयकृत्प्रवृद्धो लोकान्समाहर्तुमिह प्रवृत्तः
      - ऋतेऽपि त्वा न भविष्यन्ति सर्वे येऽवस्थिताः प्रत्यनीकेषु योधाः
    iast: "kālo'smi lokakṣayakṛtpravṛddho lokānsamāhartumiha pravṛttaḥ | ṛte'pi tvā na bhaviṣyanti sarve ye'vasthitāḥ pratyanīkeṣu yodhāḥ"
  - id: 'bhisma-6-35-33'
    kind: verse
    lines:
      - तस्मात्त्वमुत्तिष्ठ यशो लभस्व जित्वा शत्रून्भुङ्क्ष्व राज्यं समृद्धम्
      - मयैवैते निहताः पूर्वमेव निमित्तमात्रं भव सव्यसाचिन्
    iast: "tasmāttvamuttiṣṭha yaśo labhasva jitvā śatrūnbhuṅkṣva rājyaṃ samṛddham | mayaivaite nihatāḥ pūrvameva nimittamātraṃ bhava savyasācin"
  - id: 'bhisma-6-42-58'
    kind: verse
    lines:
      - मच्चित्तः सर्वदुर्गाणि मत्प्रसादात्तरिष्यसि
      - अथ चेत्त्वमहङ्कारान्न श्रोष्यसि विनङ्क्ष्यसि
    iast: "maccittaḥ sarvadurgāṇi matprasādāttariṣyasi | atha cettvamahaṅkārānna śroṣyasi vinaṅkṣyasi"
  - id: 'bhisma-6-42-59'
    kind: verse
    lines:
      - यदहङ्कारमाश्रित्य न योत्स्य इति मन्यसे
      - मिथ्यैष व्यवसायस्ते प्रकृतिस्त्वां नियोक्ष्यति
    iast: "yadahaṅkāramāśritya na yotsya iti manyase | mithyaiṣa vyavasāyaste prakṛtistvāṃ niyokṣyati"
  - id: 'bhisma-6-42-60'
    kind: verse
    lines:
      - स्वभावजेन कौन्तेय निबद्धः स्वेन कर्मणा
      - कर्तुं नेच्छसि यन्मोहात्करिष्यस्यवशोपि तत्
    iast: "svabhāvajena kaunteya nibaddhaḥ svena karmaṇā | kartuṃ necchasi yanmohātkariṣyasyavaśopi tat"
  - id: 'bhisma-6-42-61'
    kind: verse
    lines:
      - ईश्वरः सर्वभूतानां हृद्देशेऽर्जुन तिष्ठति
      - भ्रामयन्सर्वभूतानि यन्त्रारूढानि मायया
    iast: "īśvaraḥ sarvabhūtānāṃ hṛddeśe'rjuna tiṣṭhati | bhrāmayansarvabhūtāni yantrārūḍhāni māyayā"
  - id: 'bhisma-6-42-62'
    kind: verse
    lines:
      - तमेव शरणं गच्छ सर्वभावेन भारत
      - तत्प्रसादात्परां शान्तिं स्थानं प्राप्स्यसि शाश्वतं
    iast: "tameva śaraṇaṃ gaccha sarvabhāvena bhārata | tatprasādātparāṃ śāntiṃ sthānaṃ prāpsyasi śāśvataṃ"
  - id: 'bhisma-6-42-66'
    kind: verse
    lines:
      - सर्वधर्मान्परित्यज्य मामेकं शरणं व्रज
      - अहं त्वा सर्वपापेभ्यो मोक्षयिष्यामि मा शुचः
    iast: "sarvadharmānparityajya māmekaṃ śaraṇaṃ vraja | ahaṃ tvā sarvapāpebhyo mokṣayiṣyāmi mā śucaḥ"
  - id: 'bhisma-6-42-73'
    kind: verse
    lines:
      - नष्टो मोहः स्मृतिर्लब्धा त्वत्प्रसादान्मयाऽच्युत
      - स्थितोऽस्मि गतसंदेहः करिष्ये वचनं तव
      - सञ्जय उवाच
    iast: "naṣṭo mohaḥ smṛtirlabdhā tvatprasādānmayā'cyuta | sthito'smi gatasaṃdehaḥ kariṣye vacanaṃ tava | sañjaya uvāca"
  - id: 'bhisma-6-43-6'
    kind: verse
    lines:
      - ततो धनंजयं दृष्ट्वा बाणगाण्डीवधारिणम्
      - पुनरेव महानादं व्यसृजन्त महारथाःक
    iast: "tato dhanaṃjayaṃ dṛṣṭvā bāṇagāṇḍīvadhāriṇam | punareva mahānādaṃ vyasṛjanta mahārathāḥka"
  - id: 'bhisma-6-43-13'
    kind: verse
    lines:
      - ततो युधिष्ठिरो दृष्ट्वा युद्धाय समवस्थिते
      - ते सेने सागरप्रख्ये मुहुः प्रज्वलिते नृप
    iast: "tato yudhiṣṭhiro dṛṣṭvā yuddhāya samavasthite | te sene sāgaraprakhye muhuḥ prajvalite nṛpa"
  - id: 'bhisma-6-43-14'
    kind: verse
    lines:
      - विमुच्य कवचं वीरो निक्षिप्य च वरायुधम्
      - अवरुह्य रथात्क्षिप्रं पद्म्यामेव कृताञ्जलिः
    iast: "vimucya kavacaṃ vīro nikṣipya ca varāyudham | avaruhya rathātkṣipraṃ padmyāmeva kṛtāñjaliḥ"
  - id: 'bhisma-6-43-37'
    kind: verse
    lines:
      - सोऽवगाह्य चमूं शत्रोः शरशक्तिसमाकुलाम्
      - भीष्ममेवाभ्यात्तूर्णं भ्रातृभिः परिवारितः
    iast: "so'vagāhya camūṃ śatroḥ śaraśaktisamākulām | bhīṣmamevābhyāttūrṇaṃ bhrātṛbhiḥ parivāritaḥ"
  - id: 'bhisma-6-43-38'
    kind: verse
    lines:
      - तमुवाच ततः पादौ कारभ्यां पीड्य पाण्डवः
      - भीष्मं शान्तनवं राजा युद्धाय समुपस्थितम्
      - युधिष्ठिर उवाच
    iast: "tamuvāca tataḥ pādau kārabhyāṃ pīḍya pāṇḍavaḥ | bhīṣmaṃ śāntanavaṃ rājā yuddhāya samupasthitam | yudhiṣṭhira uvāca"
  - id: 'bhisma-6-43-39'
    kind: verse
    lines:
      - आमन्त्रये त्वां दुर्धर्ष त्वया योत्स्यामहे सह
      - अनजानीहि मां तात आशिषश्च प्रयोजय
      - भीष्म उवाच
    iast: "āmantraye tvāṃ durdharṣa tvayā yotsyāmahe saha | anajānīhi māṃ tāta āśiṣaśca prayojaya | bhīṣma uvāca"
  - id: 'bhisma-6-43-41'
    kind: verse
    lines:
      - प्रीतोऽहं पुत्र युध्यस्व जयमाप्नुहि पाण्डव
      - यत्तेऽभिलषितं चान्यत्तदवाप्नुहि संयुगे
    iast: "prīto'haṃ putra yudhyasva jayamāpnuhi pāṇḍava | yatte'bhilaṣitaṃ cānyattadavāpnuhi saṃyuge"
  - id: 'bhisma-6-43-52'
    kind: verse
    lines:
      - प्रायात्पुनर्महाबाहुराचार्यस्य रथं प्रति
      - पश्यतां सर्वसैन्यानां मध्येन भ्रातृभिः सह
    iast: "prāyātpunarmahābāhurācāryasya rathaṃ prati | paśyatāṃ sarvasainyānāṃ madhyena bhrātṛbhiḥ saha"
  - id: 'bhisma-6-43-53'
    kind: verse
    lines:
      - स द्रोणमभिवाद्याथ कृत्वं चाभिप्रदक्षिणम्
      - उवाच राजा दुर्धर्षमात्मनिःश्रेयसं वचः
    iast: "sa droṇamabhivādyātha kṛtvaṃ cābhipradakṣiṇam | uvāca rājā durdharṣamātmaniḥśreyasaṃ vacaḥ"
  - id: 'bhisma-6-43-54'
    kind: verse
    lines:
      - आमन्त्रये त्वां भगवन्योत्स्ये विगितकल्मषः
      - कथं जये रिपून्सर्वाननुज्ञातस्त्वया द्विज
      - द्रोण उवाच
    iast: "āmantraye tvāṃ bhagavanyotsye vigitakalmaṣaḥ | kathaṃ jaye ripūnsarvānanujñātastvayā dvija | droṇa uvāca"
  - id: 'bhisma-6-43-61'
    kind: verse
    lines:
      - ध्रुवस्ते विजयो राजन्यस्य मन्त्री हरिस्तव
      - अहं त्वामभिजानामि रणे शत्रून्विजेष्यसि
    iast: "dhruvaste vijayo rājanyasya mantrī haristava | ahaṃ tvāmabhijānāmi raṇe śatrūnvijeṣyasi"
  - id: 'bhisma-6-43-62'
    kind: verse
    lines:
      - यतो धर्मस्ततः कृष्णो यतः कृष्णस्ततो जयः
      - युध्यस्व गच्छ कौन्तेय पृच्छ मां किं ब्रवीमि ते
      - युधिष्ठिर उवाच
    iast: "yato dharmastataḥ kṛṣṇo yataḥ kṛṣṇastato jayaḥ | yudhyasva gaccha kaunteya pṛccha māṃ kiṃ bravīmi te | yudhiṣṭhira uvāca"
  - id: 'bhisma-6-43-69'
    kind: verse
    lines:
      - एतच्छ्रुत्वा महाराज भारद्वाजस्य धीमतः
      - अनुमान्य तमाचार्यं प्रायाच्छारद्वतं प्रति
    iast: "etacchrutvā mahārāja bhāradvājasya dhīmataḥ | anumānya tamācāryaṃ prāyācchāradvataṃ prati"
  - id: 'bhisma-6-43-76'
    kind: verse
    lines:
      - तं गौतमः प्रत्युवाच विज्ञायास्य विवक्षितम्
      - अवध्योऽहं महीपाल यद्ध्यस्व जयमाप्नुहि
    iast: "taṃ gautamaḥ pratyuvāca vijñāyāsya vivakṣitam | avadhyo'haṃ mahīpāla yaddhyasva jayamāpnuhi"
  - id: 'bhisma-6-43-90'
    kind: verse
    lines:
      - अनुमान्याथ कौन्तेयो मातुलं मद्रकेश्वरम्
      - निर्जगाम महासैन्याद्भ्रतृभिः परिवारितः
    iast: "anumānyātha kaunteyo mātulaṃ madrakeśvaram | nirjagāma mahāsainyādbhratṛbhiḥ parivāritaḥ"
  - id: 'bhisma-6-43-91'
    kind: verse
    lines:
      - वासुदेवस्तु राधेयमाहवेऽभिजगाम वै
      - तत एनमुवाचेदं पाण्डवार्थे गदाग्रजः
    iast: "vāsudevastu rādheyamāhave'bhijagāma vai | tata enamuvācedaṃ pāṇḍavārthe gadāgrajaḥ"
  - id: 'bhisma-6-43-92'
    kind: verse
    lines:
      - श्रुतं मे कर्ण भीष्मस्य द्वोषात्किल न योत्स्यसे
      - अस्मान्वरय राधेय यावद्भीष्मो न हन्यते
    iast: "śrutaṃ me karṇa bhīṣmasya dvoṣātkila na yotsyase | asmānvaraya rādheya yāvadbhīṣmo na hanyate"
  - id: 'bhisma-6-43-94'
    kind: verse
    lines:
      - न विप्रियं करिष्यामि धार्तराष्ट्रस्य केशव
      - त्यक्तप्राणं हि मां विद्धि दुर्योधनहितैषिणम्
      - सञ्जय उवाच
    iast: "na vipriyaṃ kariṣyāmi dhārtarāṣṭrasya keśava | tyaktaprāṇaṃ hi māṃ viddhi duryodhanahitaiṣiṇam | sañjaya uvāca"
  - id: 'bhisma-6-43-96'
    kind: verse
    lines:
      - अथ सैन्यस्य मध्ये तु प्राक्रोशत्पाण्डवाग्रजः
      - योऽस्मान्वृणोति तमहं वरये साह्यकारणात्
    iast: "atha sainyasya madhye tu prākrośatpāṇḍavāgrajaḥ | yo'smānvṛṇoti tamahaṃ varaye sāhyakāraṇāt"
  - id: 'bhisma-6-43-102'
    kind: verse
    lines:
      - ततो युयुत्सुः कौरव्यान्परित्यज्य सुतांस्तव
      - जगाम पाण्डुपुत्राणां सेनां विश्राव्य दुन्दुभिं
    iast: "tato yuyutsuḥ kauravyānparityajya sutāṃstava | jagāma pāṇḍuputrāṇāṃ senāṃ viśrāvya dundubhiṃ"
  - id: 'bhisma-6-45-8'
    kind: verse
    lines:
      - अथ शान्तनवो राजन्नभ्यधावद्धनञ्जयम्
      - प्रगृह्य कार्मुकं घोरं कालदण्डोपमं रणे
    iast: "atha śāntanavo rājannabhyadhāvaddhanañjayam | pragṛhya kārmukaṃ ghoraṃ kāladaṇḍopamaṃ raṇe"
  - id: 'bhisma-6-45-9'
    kind: verse
    lines:
      - अर्जुनोऽपि धनुर्गृह्य गाण्डीवं लोकविश्रुतम्
      - अभ्यधावत तेजस्वी गाङ्गेयं रणमूर्धनि
    iast: "arjuno'pi dhanurgṛhya gāṇḍīvaṃ lokaviśrutam | abhyadhāvata tejasvī gāṅgeyaṃ raṇamūrdhani"
  - id: 'bhisma-6-59-6'
    kind: verse
    lines:
      - प्रावर्तत ततो युद्धं तुमुलं रोमहर्षणम्
      - अस्माकं पाण्डवैः सार्धमनायात्तव भारत
    iast: "prāvartata tato yuddhaṃ tumulaṃ romaharṣaṇam | asmākaṃ pāṇḍavaiḥ sārdhamanāyāttava bhārata"
  - id: 'bhisma-6-59-20'
    kind: verse
    lines:
      - तत्र भीष्मः शान्तनवो नित्यं मण्डलकार्मुकः
      - मुमीच बाणान्दीप्ताग्रानहीनाशीविषानिव
    iast: "tatra bhīṣmaḥ śāntanavo nityaṃ maṇḍalakārmukaḥ | mumīca bāṇāndīptāgrānahīnāśīviṣāniva"
  - id: 'bhisma-6-59-22'
    kind: verse
    lines:
      - स नृत्यन्वै रथोपस्थे दर्शयन्पाणिलाघवम्
      - अलातचक्रवद्राजंस्तत्र तत्र स्म दृश्यते
    iast: "sa nṛtyanvai rathopasthe darśayanpāṇilāghavam | alātacakravadrājaṃstatra tatra sma dṛśyate"
  - id: 'bhisma-6-59-60'
    kind: verse
    lines:
      - अदर्शयद्वासुदेवो हययाने परं बलम्
      - मोघान्कुर्वञ्शरांस्तस्य मण्डलान्व्यचरल्लुघु
    iast: "adarśayadvāsudevo hayayāne paraṃ balam | moghānkurvañśarāṃstasya maṇḍalānvyacarallughu"
  - id: 'bhisma-6-59-61'
    kind: verse
    lines:
      - तथा भीष्मस्तु सुदृढं वासुदेवधनंजयौ
      - विव्याध निशितैर्बाणैः सर्वगात्रेषु भारत
    iast: "tathā bhīṣmastu sudṛḍhaṃ vāsudevadhanaṃjayau | vivyādha niśitairbāṇaiḥ sarvagātreṣu bhārata"
  - id: 'bhisma-6-59-65'
    kind: verse
    lines:
      - ततस्तु कृष्णः समरे दृष्ट्वा भीष्मपराक्रमम्
      - संप्रेक्ष्य च महाबाहुः पार्थस्य मृदुयुद्धताम्
    iast: "tatastu kṛṣṇaḥ samare dṛṣṭvā bhīṣmaparākramam | saṃprekṣya ca mahābāhuḥ pārthasya mṛduyuddhatām"
  - id: 'bhisma-6-59-71'
    kind: verse
    lines:
      - प्राद्रवन्ति रणे दृष्ट्वा हर्षयन्तः पितामहम्
      - सोहं भीष्मं निहन्म्यद्य पाण्डवार्थाय दंशितः
    iast: "prādravanti raṇe dṛṣṭvā harṣayantaḥ pitāmaham | sohaṃ bhīṣmaṃ nihanmyadya pāṇḍavārthāya daṃśitaḥ"
  - id: 'bhisma-6-59-88'
    kind: verse
    lines:
      - इतीदमुक्त्वा स महानुभावः सस्मार चक्रं निशितं पुराणम्
      - सुदर्शनं चिन्तितमात्रमेव तस्याग्रहस्तं स्वयमारुरोह
    iast: "itīdamuktvā sa mahānubhāvaḥ sasmāra cakraṃ niśitaṃ purāṇam | sudarśanaṃ cintitamātrameva tasyāgrahastaṃ svayamāruroha"
  - id: 'bhisma-6-59-91'
    kind: verse
    lines:
      - ततः सुनाभं वसुदेवपुत्रः सूर्यप्रभं वज्रसमप्रभावम्
      - क्षुरान्तमुद्यम्य भुजेन चक्रं रथादवप्लुत्य विसृज्य वाहान् संकम्पयन्गां चरणैर्महात्मा वेगेन कृष्मः प्रससार भीष्मम्
    iast: "tataḥ sunābhaṃ vasudevaputraḥ sūryaprabhaṃ vajrasamaprabhāvam | kṣurāntamudyamya bhujena cakraṃ rathādavaplutya visṛjya vāhān saṃkampayangāṃ caraṇairmahātmā vegena kṛṣmaḥ prasasāra bhīṣmam"
  - id: 'bhisma-6-59-95'
    kind: verse
    lines:
      - तमाद्रवन्तं प्रगृहीतचक्रं दृष्ट्वा देवं शान्तनवस्तदानीम्
      - असंभ्रमं तद्विचकर्ष दोर्भ्यां महाधनुर्गामडिवतुल्यघोषम् उवाच भीष्मस्तमनन्तपौरुषं गोविन्दमाजावविमूढचेताः
    iast: "tamādravantaṃ pragṛhītacakraṃ dṛṣṭvā devaṃ śāntanavastadānīm | asaṃbhramaṃ tadvicakarṣa dorbhyāṃ mahādhanurgāmaḍivatulyaghoṣam uvāca bhīṣmastamanantapauruṣaṃ govindamājāvavimūḍhacetāḥ"
  - id: 'bhisma-6-59-96'
    kind: verse
    lines:
      - एह्येहि देवेश जगन्निवास नमोस्तु ते माधव चक्रपाणे
      - प्रसह्य मां पातय लोकनाथ रथोत्तमात्सर्वशरण्य सङ्ख्ये
    iast: "ehyehi deveśa jagannivāsa namostu te mādhava cakrapāṇe | prasahya māṃ pātaya lokanātha rathottamātsarvaśaraṇya saṅkhye"
  - id: 'bhisma-6-59-97'
    kind: verse
    lines:
      - त्वया हतस्यापि ममाऽद्य कृष्ण श्रेयः परिस्मिन्निह चैव लोके
      - संभावितोऽस्म्यन्धकवृष्णिनाथ लोकैस्त्रिभिर्वीर तवाभियानात्
    iast: "tvayā hatasyāpi mamā'dya kṛṣṇa śreyaḥ parisminniha caiva loke | saṃbhāvito'smyandhakavṛṣṇinātha lokaistribhirvīra tavābhiyānāt"
  - id: 'bhisma-6-59-98'
    kind: verse
    lines:
      - रथादवप्लुत्य ततस्त्वरावान् पार्थोऽप्यनुद्रुत्य यदुप्रवीरम्
      - जग्राह पीनोत्तमलम्बबाहुं बाह्वोर्हरिं व्यायतपीनबाहुः
    iast: "rathādavaplutya tatastvarāvān pārtho'pyanudrutya yadupravīram | jagrāha pīnottamalambabāhuṃ bāhvorhariṃ vyāyatapīnabāhuḥ"
  - id: 'bhisma-6-59-100'
    kind: verse
    lines:
      - पार्थस्तु विष्टभ्य बलेन पादौ भीष्मान्तिकं तूर्णमभिद्रवन्तम्
      - बलान्निजग्राह हरिं किरीटी पदेऽथ राजन्दशमे कथंचित्
    iast: "pārthastu viṣṭabhya balena pādau bhīṣmāntikaṃ tūrṇamabhidravantam | balānnijagrāha hariṃ kirīṭī pade'tha rājandaśame kathaṃcit"
  - id: 'bhisma-6-59-101'
    kind: verse
    lines:
      - अवस्थितं च प्रणिपत्य कृष्णं प्रीतोऽर्जुनः काञ्चनचित्रमाली
      - उवाच कोपे प्रतिसंहरेति गतिर्भवान्केशव पाण्डवानाम्
    iast: "avasthitaṃ ca praṇipatya kṛṣṇaṃ prīto'rjunaḥ kāñcanacitramālī | uvāca kope pratisaṃhareti gatirbhavānkeśava pāṇḍavānām"
  - id: 'bhisma-6-59-103'
    kind: verse
    lines:
      - ततः प्रतिज्ञां समयं च तस्य जनार्दनः प्रीतमना निशम्य
      - स्थितः प्रिये कौरवसत्तमस्य रथं सचक्रः पुनरारुरोह
    iast: "tataḥ pratijñāṃ samayaṃ ca tasya janārdanaḥ prītamanā niśamya | sthitaḥ priye kauravasattamasya rathaṃ sacakraḥ punarāruroha"
  - id: 'bhisma-6-109-34'
    kind: verse
    lines:
      - दशमेऽहनि भीष्मस्तु दर्शयञ्शक्तिमात्मनः
      - राजञ्शतसहस्राणि सोऽवधीत्कुरुनन्दन
    iast: "daśame'hani bhīṣmastu darśayañśaktimātmanaḥ | rājañśatasahasrāṇi so'vadhītkurunandana"
  - id: 'bhisma-6-109-37'
    kind: verse
    lines:
      - पूर्णे शतसहस्रे द्वे पादातानां नरोत्तमः
      - प्रजज्वाल रणे भीष्मो विधूम इव पावकः
    iast: "pūrṇe śatasahasre dve pādātānāṃ narottamaḥ | prajajvāla raṇe bhīṣmo vidhūma iva pāvakaḥ"
  - id: 'bhisma-6-116-62'
    kind: verse
    lines:
      - ततोऽर्जुनो महाराज भीष्ममभ्यद्रवद्द्रुतम् शिखण्डिनं पुरस्कृत्य ततो युद्धमवर्तत
    iast: "tato'rjuno mahārāja bhīṣmamabhyadravaddrutam śikhaṇḍinaṃ puraskṛtya tato yuddhamavartata"
  - id: 'bhisma-6-117-1'
    kind: verse
    lines:
      - शिखण्डी तु रणे भीष्ममासाद्य पुरुषर्षभम्
      - दशभिर्निशितैर्भल्लैराजघान स्तनान्तरे
    iast: "śikhaṇḍī tu raṇe bhīṣmamāsādya puruṣarṣabham | daśabhirniśitairbhallairājaghāna stanāntare"
  - id: 'bhisma-6-117-2'
    kind: verse
    lines:
      - शिखण्डिनं तु गाङ्गेयः क्रोधदीप्तेन चक्षुषा
      - संप्रेक्षत कटाक्षेण निर्दहन्निव भारत
    iast: "śikhaṇḍinaṃ tu gāṅgeyaḥ krodhadīptena cakṣuṣā | saṃprekṣata kaṭākṣeṇa nirdahanniva bhārata"
  - id: 'bhisma-6-117-3'
    kind: verse
    lines:
      - स्त्रीत्वं तस्य स्मरन्राजन्सर्वलोकस्य पश्यतः
      - नाजघान रणे भीष्मः स च तन्नावबुद्धवान्
    iast: "strītvaṃ tasya smaranrājansarvalokasya paśyataḥ | nājaghāna raṇe bhīṣmaḥ sa ca tannāvabuddhavān"
  - id: 'bhisma-6-119-45'
    kind: verse
    lines:
      - नाकम्पत महाराज क्षितिकम्पे यथाऽचलः
      - ततः प्रहस्य बीभत्सुर्व्याक्षिपन्गाण्डिवं धनुः
    iast: "nākampata mahārāja kṣitikampe yathā'calaḥ | tataḥ prahasya bībhatsurvyākṣipangāṇḍivaṃ dhanuḥ"
  - id: 'bhisma-6-119-49'
    kind: verse
    lines:
      - निवारयामास शरैः समं सन्नतपर्वभिः
      - शिखण्डी तु रणे बाणान्यान्मुमोच महारथः
    iast: "nivārayāmāsa śaraiḥ samaṃ sannataparvabhiḥ | śikhaṇḍī tu raṇe bāṇānyānmumoca mahārathaḥ"
  - id: 'bhisma-6-119-60'
    kind: verse
    lines:
      - ततो दुःशासनं भीष्मः स्मयमान इवाब्रवीत्
      - अर्दितो निशितैर्बाणैर्भृशं गाण्डीवधन्वना
    iast: "tato duḥśāsanaṃ bhīṣmaḥ smayamāna ivābravīt | ardito niśitairbāṇairbhṛśaṃ gāṇḍīvadhanvanā"
  - id: 'bhisma-6-119-66'
    kind: verse
    lines:
      - अर्जुनस्य इमे बाणा नेमे बाणाः शिखण्डिनः
      - कृन्तन्ति मम गात्राणि माघमां सेगवा इव
    iast: "arjunasya ime bāṇā neme bāṇāḥ śikhaṇḍinaḥ | kṛntanti mama gātrāṇi māghamāṃ segavā iva"
  - id: 'bhisma-6-119-89'
    kind: verse
    lines:
      - निहत्य समरे राजञ्शतशोऽथ सहस्रशः
      - न तस्यासीदनिर्भिन्नं गात्रे द्व्यङ्गुलमन्तरम्
    iast: "nihatya samare rājañśataśo'tha sahasraśaḥ | na tasyāsīdanirbhinnaṃ gātre dvyaṅgulamantaram"
  - id: 'bhisma-6-119-90'
    kind: verse
    lines:
      - एवंभूतस्तव पिता शरैर्विशकलीकृतः
      - शिताग्रैः फल्गुनेनाजौ प्राक्शिराः प्रापतद्रथात्
    iast: "evaṃbhūtastava pitā śarairviśakalīkṛtaḥ | śitāgraiḥ phalgunenājau prākśirāḥ prāpatadrathāt"
  - id: 'bhisma-6-119-93'
    kind: verse
    lines:
      - सह भीष्मेण सर्वेषां प्रापतन्हृदयानि नः
      - स पपात महाबाहुर्वसुधामनुनादयन्
    iast: "saha bhīṣmeṇa sarveṣāṃ prāpatanhṛdayāni naḥ | sa papāta mahābāhurvasudhāmanunādayan"
  - id: 'bhisma-6-119-94'
    kind: verse
    lines:
      - इन्द्रध्वज इवोत्सृष्टः केतुः सर्वधनुष्मताम्
      - धरणीं न स पस्पर्श शरसङ्घैः समावृतः
    iast: "indradhvaja ivotsṛṣṭaḥ ketuḥ sarvadhanuṣmatām | dharaṇīṃ na sa pasparśa śarasaṅghaiḥ samāvṛtaḥ"
  - id: 'bhisma-6-119-95'
    kind: verse
    lines:
      - शलतल्पे महेष्वासं शयानं पुरुषर्षभम्
      - रथात्प्रपतितं चैनं दिव्यो भावः समाविशत्
    iast: "śalatalpe maheṣvāsaṃ śayānaṃ puruṣarṣabham | rathātprapatitaṃ cainaṃ divyo bhāvaḥ samāviśat"
  - id: 'bhisma-6-120-30'
    kind: verse
    lines:
      - व्युपरम्य ततो युद्धाद्योधाः शतसहस्रशः
      - उपतस्थुर्महात्मानं प्रजापतिमिवामराः
    iast: "vyuparamya tato yuddhādyodhāḥ śatasahasraśaḥ | upatasthurmahātmānaṃ prajāpatimivāmarāḥ"
  - id: 'bhisma-6-120-32'
    kind: verse
    lines:
      - अथ पाण्डून्कुरूंश्चैव प्रणिपत्याग्रतः स्थितान्
      - अभ्यभाषत धर्मात्मा भीष्मः शान्तनवस्तदा
    iast: "atha pāṇḍūnkurūṃścaiva praṇipatyāgrataḥ sthitān | abhyabhāṣata dharmātmā bhīṣmaḥ śāntanavastadā"
  - id: 'bhisma-6-120-34'
    kind: verse
    lines:
      - अभिनन्द्य स तानेवं शिरसा लम्बताऽब्रवीत् परपार्श्वे तव सुतान्स्थितानुद्वीक्ष्य भारत
      - शिरो मे लम्बतेऽत्यर्थमुपधानं प्रदीयताम्
    iast: "abhinandya sa tānevaṃ śirasā lambatā'bravīt parapārśve tava sutānsthitānudvīkṣya bhārata | śiro me lambate'tyarthamupadhānaṃ pradīyatām"
  - id: 'bhisma-6-120-35'
    kind: verse
    lines:
      - ततो नृपाः समाजह्रुस्तनूनि च मृदूनि च
      - उपधानानि मुख्यानि नैच्छत्तानि पितामहः
    iast: "tato nṛpāḥ samājahrustanūni ca mṛdūni ca | upadhānāni mukhyāni naicchattāni pitāmahaḥ"
  - id: 'bhisma-6-120-36'
    kind: verse
    lines:
      - अथाब्रवीन्नरव्याघ्रः प्रसहन्निव तान्नृपान्
      - नैतानि वीरशय्यासु युक्तरूपाणि पार्थिवाः
    iast: "athābravīnnaravyāghraḥ prasahanniva tānnṛpān | naitāni vīraśayyāsu yuktarūpāṇi pārthivāḥ"
  - id: 'bhisma-6-120-38'
    kind: verse
    lines:
      - धनञ्जय महाबाहो शिरो मे तात लम्बते
      - दीयतामुपधानं वै यद्युक्तमिह मन्यसे
      - सञ्जय उवाच
    iast: "dhanañjaya mahābāho śiro me tāta lambate | dīyatāmupadhānaṃ vai yadyuktamiha manyase | sañjaya uvāca"
  - id: 'bhisma-6-120-45'
    kind: verse
    lines:
      - त्रिभिस्तीक्ष्णैर्महावेगैरुदगृह्णाच्छिरः शरैः
      - अभिप्राये तु विदिते धर्मात्मा स्वयसाचिना
    iast: "tribhistīkṣṇairmahāvegairudagṛhṇācchiraḥ śaraiḥ | abhiprāye tu vidite dharmātmā svayasācinā"
  - id: 'bhisma-6-120-46'
    kind: verse
    lines:
      - अतुष्यद्भरतश्रेष्ठो भीष्मो धर्मार्थतत्त्ववित्
      - उपधानेन दत्तेन प्रत्यनन्दद्धनञ्जयम्
    iast: "atuṣyadbharataśreṣṭho bhīṣmo dharmārthatattvavit | upadhānena dattena pratyanandaddhanañjayam"
  - id: 'bhisma-6-120-51'
    kind: verse
    lines:
      - पश्यध्वमुपधानं मे पाणडवेनाभिसन्धितम्
      - शयेयमस्यां शय्यायां यावदावर्तनं रवेः
    iast: "paśyadhvamupadhānaṃ me pāṇaḍavenābhisandhitam | śayeyamasyāṃ śayyāyāṃ yāvadāvartanaṃ raveḥ"
  - id: 'bhisma-6-120-52'
    kind: verse
    lines:
      - ये तदा धारयिष्यन्ति ते च प्रेक्ष्यन्ति मां नृपाः
      - दिशं वैश्रवणाक्रान्तां यदा गन्ता दिवाकरः
    iast: "ye tadā dhārayiṣyanti te ca prekṣyanti māṃ nṛpāḥ | diśaṃ vaiśravaṇākrāntāṃ yadā gantā divākaraḥ"
  - id: 'bhisma-6-121-18'
    kind: verse
    lines:
      - तं दृष्ट्वा पाण्डवं राजन्नभिवाद्याग्रतः स्थितम्
      - अभ्यभाषत धर्मात्मा भीष्मः प्रीतो धनंजयम्
    iast: "taṃ dṛṣṭvā pāṇḍavaṃ rājannabhivādyāgrataḥ sthitam | abhyabhāṣata dharmātmā bhīṣmaḥ prīto dhanaṃjayam"
  - id: 'bhisma-6-121-20'
    kind: verse
    lines:
      - वेदनार्तशरीरस्य प्रयच्छापो ममार्जुन
      - त्वं हि शक्तो महेष्वास दातुमापो यथाविधि
      - सञ्जय उवाच
    iast: "vedanārtaśarīrasya prayacchāpo mamārjuna | tvaṃ hi śakto maheṣvāsa dātumāpo yathāvidhi | sañjaya uvāca"
  - id: 'bhisma-6-121-24'
    kind: verse
    lines:
      - संधाय च शरं दीप्तमभिमन्त्र्य स पाण्डवः
      - पर्जन्यास्त्रेण संयोज्य सर्वलोकस्य पश्यतः
    iast: "saṃdhāya ca śaraṃ dīptamabhimantrya sa pāṇḍavaḥ | parjanyāstreṇa saṃyojya sarvalokasya paśyataḥ"
  - id: 'bhisma-6-121-25'
    kind: verse
    lines:
      - अविध्यत्पृथिवीं पार्थः पार्श्वे भीष्मस्य दक्षिणे
      - उत्पपात ततो धारा वारिणो विमला शुभा
    iast: "avidhyatpṛthivīṃ pārthaḥ pārśve bhīṣmasya dakṣiṇe | utpapāta tato dhārā vāriṇo vimalā śubhā"
  - id: 'bhisma-6-121-30'
    kind: verse
    lines:
      - शङ्खदुन्दुभिनिर्घोषस्तुमुलः सर्वतोऽभवत्
      - तृप्तः शान्तनवश्चापि राजन्बीभत्सुमब्रवीत्
    iast: "śaṅkhadundubhinirghoṣastumulaḥ sarvato'bhavat | tṛptaḥ śāntanavaścāpi rājanbībhatsumabravīt"
  - id: 'bhisma-6-121-31'
    kind: verse
    lines:
      - सर्वपार्थिववीराणां सन्निधौ पूजयन्निव
      - नैतच्चित्रं महाबाहो त्वयि कौरवनन्दन
    iast: "sarvapārthivavīrāṇāṃ sannidhau pūjayanniva | naitaccitraṃ mahābāho tvayi kauravanandana"
  - id: 'bhisma-6-121-40'
    kind: verse
    lines:
      - दृष्टं दुर्योधनैतत्ते यथा पार्थेन धीमता
      - जलस्य धारा जनिता शीतस्यामृतगन्धिनः
    iast: "dṛṣṭaṃ duryodhanaitatte yathā pārthena dhīmatā | jalasya dhārā janitā śītasyāmṛtagandhinaḥ"
  - id: 'bhisma-6-121-41'
    kind: verse
    lines:
      - एतस्य कर्ता लोकेऽस्मिन्नान्यः कश्चन विद्यते
      - आग्नेयं वारुणं सौम्यं वायव्यमथ वैष्णवम्
    iast: "etasya kartā loke'sminnānyaḥ kaścana vidyate | āgneyaṃ vāruṇaṃ saumyaṃ vāyavyamatha vaiṣṇavam"
  - id: 'bhisma-6-121-44'
    kind: verse
    lines:
      - अशक्यः पाण्डवस्तात युद्धे जेतुं कथंचन
      - अमानुषाणि कर्माणि यस्यैतानि महात्मनः
    iast: "aśakyaḥ pāṇḍavastāta yuddhe jetuṃ kathaṃcana | amānuṣāṇi karmāṇi yasyaitāni mahātmanaḥ"
  - id: 'bhisma-6-121-45'
    kind: verse
    lines:
      - तेन सत्ववता सङ्ख्ये शूरेणाहवशोभिना
      - जिष्णुना समरे राजन्संधिर्भवतु मा चिरम्
    iast: "tena satvavatā saṅkhye śūreṇāhavaśobhinā | jiṣṇunā samare rājansaṃdhirbhavatu mā ciram"
  - id: 'bhisma-6-121-51'
    kind: verse
    lines:
      - तावत्ते पाण्डवैर्वीरैः सौहार्दं मम रोचते
      - युद्धं मदन्तमेवास्तु तात संशाम्य पाण्डवैः
    iast: "tāvatte pāṇḍavairvīraiḥ sauhārdaṃ mama rocate | yuddhaṃ madantamevāstu tāta saṃśāmya pāṇḍavaiḥ"
  - id: 'bhisma-6-121-58'
    kind: verse
    lines:
      - धर्मार्थसहितं वाक्यं श्रुत्वा हितमनामयम्
      - नारोचयत पुत्रस्ते मुमूर्षुरिव भेषजम्
    iast: "dharmārthasahitaṃ vākyaṃ śrutvā hitamanāmayam | nārocayata putraste mumūrṣuriva bheṣajam"
  - id: 'bhisma-6-122-1'
    kind: verse
    lines:
      - ततस्ते पार्थिवाः सर्वे जग्मुः स्वानालयान्पुनः
      - तूष्णींभूते महाराज भीष्मे शन्तनुनन्दने
    iast: "tataste pārthivāḥ sarve jagmuḥ svānālayānpunaḥ | tūṣṇīṃbhūte mahārāja bhīṣme śantanunandane"
  - id: 'bhisma-6-122-2'
    kind: verse
    lines:
      - श्रुत्वा तु निहतं भीष्मं राधेयः पुरुषर्षभः
      - ईषदागतसंत्रासस्त्वरयोपजगाम ह
    iast: "śrutvā tu nihataṃ bhīṣmaṃ rādheyaḥ puruṣarṣabhaḥ | īṣadāgatasaṃtrāsastvarayopajagāma ha"
  - id: 'bhisma-6-122-3'
    kind: verse
    lines:
      - स ददर्श महात्मानं शरतल्पगतं तदा
      - जन्मशय्यागतं वीरं कार्तिकेयमिव प्रभुम्
    iast: "sa dadarśa mahātmānaṃ śaratalpagataṃ tadā | janmaśayyāgataṃ vīraṃ kārtikeyamiva prabhum"
  - id: 'bhisma-6-122-4'
    kind: verse
    lines:
      - निमीलिताक्षं तं वीरं साश्रुकण्ठस्तदा वृषा
      - अभ्येत्य पादयोस्तस्य निपपात महाद्युतिः
    iast: "nimīlitākṣaṃ taṃ vīraṃ sāśrukaṇṭhastadā vṛṣā | abhyetya pādayostasya nipapāta mahādyutiḥ"
  - id: 'bhisma-6-122-5'
    kind: verse
    lines:
      - राधेयोऽहं कुरुश्रेष्ठ नित्यमक्षिगतस्तव
      - द्वेभ्योऽत्यन्तमनागाः सन्निति चैनमुवाच ह
    iast: "rādheyo'haṃ kuruśreṣṭha nityamakṣigatastava | dvebhyo'tyantamanāgāḥ sanniti cainamuvāca ha"
  - id: 'bhisma-6-122-6'
    kind: verse
    lines:
      - तच्छ्रुत्वा कुरुवृद्धो हि शरैः संवृतलोचनः
      - रहितं धिष्ण्यमालोक्य समुत्सार्य च रक्षिणः
    iast: "tacchrutvā kuruvṛddho hi śaraiḥ saṃvṛtalocanaḥ | rahitaṃ dhiṣṇyamālokya samutsārya ca rakṣiṇaḥ"
  - id: 'bhisma-6-122-7'
    kind: verse
    lines:
      - पितेव पुत्रं गाङ्गेयः परिरभ्यैकपाणिना
      - शनैरुद्वीक्ष्य सस्नेहमिदं वचनमब्रवीत्
    iast: "piteva putraṃ gāṅgeyaḥ parirabhyaikapāṇinā | śanairudvīkṣya sasnehamidaṃ vacanamabravīt"
  - id: 'bhisma-6-122-9'
    kind: verse
    lines:
      - कौन्तेयस्त्वं न राधेयो न तवाधिरथः पिता
      - सूर्यजस्त्वं महाबाहो विदितो नारदान्मया
    iast: "kaunteyastvaṃ na rādheyo na tavādhirathaḥ pitā | sūryajastvaṃ mahābāho vidito nāradānmayā"
  - id: 'bhisma-6-122-10'
    kind: verse
    lines:
      - कृष्णद्वैपायनाच्चैव तेजसा च न संशयः
      - न च द्वेषोस्ति मे तात त्वयि सत्यं ब्रवीमि ते
    iast: "kṛṣṇadvaipāyanāccaiva tejasā ca na saṃśayaḥ | na ca dveṣosti me tāta tvayi satyaṃ bravīmi te"
  - id: 'bhisma-6-122-11'
    kind: verse
    lines:
      - तेजोवधनिमित्तं तु परुषं त्वाहमब्रुवम्
      - अकस्मात्पाण्डवान्हि त्वं द्विषसीति मतिर्मम
    iast: "tejovadhanimittaṃ tu paruṣaṃ tvāhamabruvam | akasmātpāṇḍavānhi tvaṃ dviṣasīti matirmama"
  - id: 'bhisma-6-122-13'
    kind: verse
    lines:
      - नीचाश्रयान्मत्सरेण द्वेषिणी गुमिनामपि
      - तेनासि बहुशो रूक्षं श्रावितः कुरुसंसदि
    iast: "nīcāśrayānmatsareṇa dveṣiṇī gumināmapi | tenāsi bahuśo rūkṣaṃ śrāvitaḥ kurusaṃsadi"
  - id: 'bhisma-6-122-14'
    kind: verse
    lines:
      - जानामि समरे वीर्यं शत्रुभिर्दुःसहं भुवि
      - ब्रह्मण्यतां च शौर्यं च दाने च परमां स्थितिम्
    iast: "jānāmi samare vīryaṃ śatrubhirduḥsahaṃ bhuvi | brahmaṇyatāṃ ca śauryaṃ ca dāne ca paramāṃ sthitim"
  - id: 'bhisma-6-122-16'
    kind: verse
    lines:
      - इष्वस्त्रे भारसंधाने लाघवेऽस्त्रबले तथा
      - सदृशः फल्गुनेनासि कृष्णेन च महात्मना
    iast: "iṣvastre bhārasaṃdhāne lāghave'strabale tathā | sadṛśaḥ phalgunenāsi kṛṣṇena ca mahātmanā"
  - id: 'bhisma-6-122-21'
    kind: verse
    lines:
      - सोदर्याः पाण्डवा वीरा भ्रातरस्तेऽरिसूदन
      - संगच्छ तैर्महाबाहो मम चेदिच्छसि प्रियम्
    iast: "sodaryāḥ pāṇḍavā vīrā bhrātaraste'risūdana | saṃgaccha tairmahābāho mama cedicchasi priyam"
  - id: 'bhisma-6-122-22'
    kind: verse
    lines:
      - मया भवतु निर्वृत्तं वैरमादित्यनन्दन
      - पृथिव्यां सर्वराजानो भवन्त्वद्य निरामयाः
      - कर्ण उवाच
    iast: "mayā bhavatu nirvṛttaṃ vairamādityanandana | pṛthivyāṃ sarvarājāno bhavantvadya nirāmayāḥ | karṇa uvāca"
  - id: 'bhisma-6-122-23'
    kind: verse
    lines:
      - जानाम्येव महाबाहो सर्वमेतन्न संशयः
      - यथा वदसि मे भीष्म कौन्तेयोऽहं न सूतजः
    iast: "jānāmyeva mahābāho sarvametanna saṃśayaḥ | yathā vadasi me bhīṣma kaunteyo'haṃ na sūtajaḥ"
  - id: 'bhisma-6-122-24'
    kind: verse
    lines:
      - अवकीर्णस्त्वहं कुन्त्या सूतेन च विवर्धितः
      - भुक्त्वा दुर्योधनैश्वर्यं न मिथ्या कर्तुमुत्सहे
    iast: "avakīrṇastvahaṃ kuntyā sūtena ca vivardhitaḥ | bhuktvā duryodhanaiśvaryaṃ na mithyā kartumutsahe"
  - id: 'bhisma-6-122-32'
    kind: verse
    lines:
      - अनुजानीष्व मां तात युद्धाय कृतनिश्चयम्
      - अनुज्ञातस्त्वया वीर युध्येयमिति मे मतिः
    iast: "anujānīṣva māṃ tāta yuddhāya kṛtaniścayam | anujñātastvayā vīra yudhyeyamiti me matiḥ"
  - id: 'bhisma-6-122-33'
    kind: verse
    lines:
      - दुरुक्तं विप्रतीपं वा रभसाच्चापलात्तथा
      - यन्मयेह कृतं किंचित्तन्मे त्वं क्षन्तुमर्हसि
      - भीष्म उवाच
    iast: "duruktaṃ vipratīpaṃ vā rabhasāccāpalāttathā | yanmayeha kṛtaṃ kiṃcittanme tvaṃ kṣantumarhasi | bhīṣma uvāca"
  - id: 'bhisma-6-122-34'
    kind: verse
    lines:
      - न चेच्छक्यमवस्रष्टुं वैरमेतत्सुदारुणम्
      - अनुजानामि कर्ण त्वां युध्यस्व स्वर्गकाम्यया
    iast: "na cecchakyamavasraṣṭuṃ vairametatsudāruṇam | anujānāmi karṇa tvāṃ yudhyasva svargakāmyayā"
  - id: 'bhisma-6-122-38'
    kind: verse
    lines:
      - प्रशमे हि कृतो यत्नः सुमहान्सुचिरं मया
      - न चैव शकितः कर्तुं यतो धर्मस्ततो जयः
      - सञ्जय उवाच
    iast: "praśame hi kṛto yatnaḥ sumahānsuciraṃ mayā | na caiva śakitaḥ kartuṃ yato dharmastato jayaḥ | sañjaya uvāca"
  - id: 'bhisma-6-122-39'
    kind: verse
    lines:
      - इत्युक्तवति गाङ्गेये अभिवाद्योपमन्त्र्य च
      - राधेयो रथमारुह्य प्रायात्तव सुतं प्रति
      - वैशंपायन उवाच
    iast: "ityuktavati gāṅgeye abhivādyopamantrya ca | rādheyo rathamāruhya prāyāttava sutaṃ prati | vaiśaṃpāyana uvāca"
  - id: 'drona-7-7-6'
    kind: verse
    lines:
      - अथाभिषिषिचुर्द्रोणं दुर्योधनमुखा नृपाः स्वस्तिवादरवैश्चान्यैः श्लक्ष्णैश्चान्यैर्मनोरमैः
      - सैनापत्ये यथा स्कन्दं पुरा शक्रमुखाः सुराः
    iast: "athābhiṣiṣicurdroṇaṃ duryodhanamukhā nṛpāḥ svastivādaravaiścānyaiḥ ślakṣṇaiścānyairmanoramaiḥ | saināpatye yathā skandaṃ purā śakramukhāḥ surāḥ"
  - id: 'drona-7-12-2'
    kind: verse
    lines:
      - सेनापतित्वं सम्प्राप्य भारद्वाजो महारथः
      - मध्ये सर्वस्य सैन्यस्य पुत्रं ते वाक्यमब्रवीत्
    iast: "senāpatitvaṃ samprāpya bhāradvājo mahārathaḥ | madhye sarvasya sainyasya putraṃ te vākyamabravīt"
  - id: 'drona-7-12-4'
    kind: verse
    lines:
      - सदृशं कर्मणस्तस्य फलं प्राप्नुहि भारत
      - करोमि कामं कं तेऽद्य प्रवृणीष्व यमिच्छसि
      - सञ्जय उवाच
    iast: "sadṛśaṃ karmaṇastasya phalaṃ prāpnuhi bhārata | karomi kāmaṃ kaṃ te'dya pravṛṇīṣva yamicchasi | sañjaya uvāca"
  - id: 'drona-7-12-6'
    kind: verse
    lines:
      - ददासि चेद्वरं मह्यं जीवग्राहं युधिष्ठिरम्
      - गृहीत्वा रयिनां श्रेष्ठं मत्समीपमिहानय
    iast: "dadāsi cedvaraṃ mahyaṃ jīvagrāhaṃ yudhiṣṭhiram | gṛhītvā rayināṃ śreṣṭhaṃ matsamīpamihānaya"
  - id: 'drona-7-12-21'
    kind: verse
    lines:
      - सत्यप्रतिज्ञे त्वानीते पुनर्द्यूतेन निर्जिते तस्मिञ्जीवति चायाते ह्युपायैर्बहुभिः कृतैः
      - पुनर्यास्यन्त्यरण्याय पाण्डवास्तमनुव्रताः
    iast: "satyapratijñe tvānīte punardyūtena nirjite tasmiñjīvati cāyāte hyupāyairbahubhiḥ kṛtaiḥ | punaryāsyantyaraṇyāya pāṇḍavāstamanuvratāḥ"
  - id: 'drona-7-12-22'
    kind: verse
    lines:
      - सोऽयं मम जयो व्यक्तं दीर्घकालं भविष्यति
      - अतो न वधमिच्छामि धर्मराजस्य कर्हिचित्
      - सञ्जय उवाच
    iast: "so'yaṃ mama jayo vyaktaṃ dīrghakālaṃ bhaviṣyati | ato na vadhamicchāmi dharmarājasya karhicit | sañjaya uvāca"
  - id: 'drona-7-12-24'
    kind: verse
    lines:
      - न चेद्युधिष्ठिरं वीरः पालयेदर्जुनो युधि
      - मन्यस्व पाण्डवश्रेष्ठमानीतं वशमात्मनः
    iast: "na cedyudhiṣṭhiraṃ vīraḥ pālayedarjuno yudhi | manyasva pāṇḍavaśreṣṭhamānītaṃ vaśamātmanaḥ"
  - id: 'drona-7-33-18'
    kind: verse
    lines:
      - तत्र द्रोणेन विहितो व्यूहो राजन्व्यरोचत
      - चरन्मध्यन्दिने सूर्यः प्रतपन्निव दुर्दृशः
    iast: "tatra droṇena vihito vyūho rājanvyarocata | caranmadhyandine sūryaḥ pratapanniva durdṛśaḥ"
  - id: 'drona-7-33-19'
    kind: verse
    lines:
      - तं चाभिमन्युर्वचनात्पितुर्ज्येष्ठस्य भारत
      - बिभेद दुर्भिदं सङ्ख्ये चक्रव्यूहमनेकधा
    iast: "taṃ cābhimanyurvacanātpiturjyeṣṭhasya bhārata | bibheda durbhidaṃ saṅkhye cakravyūhamanekadhā"
  - id: 'drona-7-33-20'
    kind: verse
    lines:
      - स कृत्वा दुष्करं कर्म हत्वा वीरान्सहस्रशः
      - राजपुत्रशतं हत्वा कौसल्यं च बृहद्बलम्
    iast: "sa kṛtvā duṣkaraṃ karma hatvā vīrānsahasraśaḥ | rājaputraśataṃ hatvā kausalyaṃ ca bṛhadbalam"
  - id: 'drona-7-37-32'
    kind: verse
    lines:
      - स शराचितसर्वाङ्गः क्रुद्धः शक्रात्मजात्मजः
      - विचरन्ददृशे सैन्ये पाशहस्त इवान्तकः
    iast: "sa śarācitasarvāṅgaḥ kruddhaḥ śakrātmajātmajaḥ | vicarandadṛśe sainye pāśahasta ivāntakaḥ"
  - id: 'drona-7-41-13'
    kind: verse
    lines:
      - स कक्षेऽग्निरिवोत्सृष्टो निर्दहंस्तरसा रिपून्
      - मध्ये भारतसैन्यानामार्जुनिः पर्यवर्तत
    iast: "sa kakṣe'gnirivotsṛṣṭo nirdahaṃstarasā ripūn | madhye bhāratasainyānāmārjuniḥ paryavartata"
  - id: 'drona-7-45-23'
    kind: verse
    lines:
      - एकधा शतधा राजन्दृश्यते स्म सहस्रधा
      - अलातचक्रवत्सङ्ख्ये क्षिप्रमस्त्राणि दर्शयन्
    iast: "ekadhā śatadhā rājandṛśyate sma sahasradhā | alātacakravatsaṅkhye kṣipramastrāṇi darśayan"
  - id: 'drona-7-47-4'
    kind: verse
    lines:
      - तं तु द्रोणः कृपः कर्णो द्रौणिश्च सबृहद्बलः
      - कृतवर्मा च हार्दिक्यः षड्रथाः पर्यवारयन्
    iast: "taṃ tu droṇaḥ kṛpaḥ karṇo drauṇiśca sabṛhadbalaḥ | kṛtavarmā ca hārdikyaḥ ṣaḍrathāḥ paryavārayan"
  - id: 'drona-7-48-16'
    kind: verse
    lines:
      - सूर्यभासं च पञ्चैतान्हत्वा विव्याध सौबलम्
      - तं सौबलस्त्रिभिर्विद्ध्वा दुर्योधनमथाब्रवीत्
    iast: "sūryabhāsaṃ ca pañcaitānhatvā vivyādha saubalam | taṃ saubalastribhirviddhvā duryodhanamathābravīt"
  - id: 'drona-7-48-17'
    kind: verse
    lines:
      - सर्व एनं विमथ्नीमः पुरैकैकं हिनस्ति नः
      - अथाब्रवीत्पुनर्द्रोणं कर्णो वैकर्तनो रणे
    iast: "sarva enaṃ vimathnīmaḥ puraikaikaṃ hinasti naḥ | athābravītpunardroṇaṃ karṇo vaikartano raṇe"
  - id: 'drona-7-48-24'
    kind: verse
    lines:
      - अथ कर्णः पुनर्द्रोणमाहार्जुनिशराहतः
      - स्थातव्यमिति तिष्ठामि पीड्यमानोऽभिमन्युना
    iast: "atha karṇaḥ punardroṇamāhārjuniśarāhataḥ | sthātavyamiti tiṣṭhāmi pīḍyamāno'bhimanyunā"
  - id: 'drona-7-48-26'
    kind: verse
    lines:
      - तमाचार्योऽब्रवीत्कर्णं शनकैः प्रहसन्निव
      - अभेद्यमस्य कवचं युवा चाशुपराक्रमः
    iast: "tamācāryo'bravītkarṇaṃ śanakaiḥ prahasanniva | abhedyamasya kavacaṃ yuvā cāśuparākramaḥ"
  - id: 'drona-7-48-29'
    kind: verse
    lines:
      - एतत्कुरु महेष्वास राधेय यदि शक्यते
      - अथैनं विमुखीकृत्य पश्चात्प्रहरणं कुरु
    iast: "etatkuru maheṣvāsa rādheya yadi śakyate | athainaṃ vimukhīkṛtya paścātpraharaṇaṃ kuru"
  - id: 'drona-7-48-30'
    kind: verse
    lines:
      - सधनुष्को न शक्योऽयमपि जेतुं सुरासुरैः
      - विरथं विधनुष्कं च कुरुष्वैनं यदीच्छसि
      - पुनः स्थितेन केनापि दुःशको जेतुमार्जुनिः
      - सञ्जय उवाच
    iast: "sadhanuṣko na śakyo'yamapi jetuṃ surāsuraiḥ | virathaṃ vidhanuṣkaṃ ca kuruṣvainaṃ yadīcchasi | punaḥ sthitena kenāpi duḥśako jetumārjuniḥ | sañjaya uvāca"
  - id: 'drona-7-48-31'
    kind: verse
    lines:
      - तदाचार्यवचः श्रुत्वा कर्णो वैकर्तनस्त्वरन्
      - अस्यतो लघुहस्तस्य पृष्ठतो धनुराच्छिनत्
    iast: "tadācāryavacaḥ śrutvā karṇo vaikartanastvaran | asyato laghuhastasya pṛṣṭhato dhanurācchinat"
  - id: 'drona-7-48-32'
    kind: verse
    lines:
      - अश्वानस्यावधीद्दोणो गौतमः पार्ष्णिसारथी
      - शेषास्तु च्छिन्नधन्वानं शरवर्षैरवाकिरन्
    iast: "aśvānasyāvadhīddoṇo gautamaḥ pārṣṇisārathī | śeṣāstu cchinnadhanvānaṃ śaravarṣairavākiran"
  - id: 'drona-7-48-33'
    kind: verse
    lines:
      - त्वरमाणास्त्वराकाले विरथं षण्महारथाः
      - शरवर्षैरकरुणा बालमेकमवाकिरन्
    iast: "tvaramāṇāstvarākāle virathaṃ ṣaṇmahārathāḥ | śaravarṣairakaruṇā bālamekamavākiran"
  - id: 'drona-7-48-34'
    kind: verse
    lines:
      - स च्छिन्नधन्वा विरथः स्वधर्ममनुपालयन्
      - खङ्गचर्मधरः श्रीमानुत्पपात विहायसा
    iast: "sa cchinnadhanvā virathaḥ svadharmamanupālayan | khaṅgacarmadharaḥ śrīmānutpapāta vihāyasā"
  - id: 'drona-7-48-39'
    kind: verse
    lines:
      - व्यसिचर्मेषुपूर्णाङ्गः सोऽन्तरिक्षात्पुनः क्षितिम्
      - आस्थितश्चक्रमुद्यम्य द्रोणं क्रुद्धोऽभ्यधावत
    iast: "vyasicarmeṣupūrṇāṅgaḥ so'ntarikṣātpunaḥ kṣitim | āsthitaścakramudyamya droṇaṃ kruddho'bhyadhāvata"
  - id: 'drona-7-49-4'
    kind: verse
    lines:
      - तच्चक्रं भृशमुद्विग्नाः संचिच्छिदुरनेकधा
      - महारथस्ततः कार्ष्मिः स जग्राह महागदाम्
    iast: "taccakraṃ bhṛśamudvignāḥ saṃcicchiduranekadhā | mahārathastataḥ kārṣmiḥ sa jagrāha mahāgadām"
  - id: 'drona-7-49-7'
    kind: verse
    lines:
      - तस्याश्वान्गदया हत्वा तथोभौ पार्ष्णिसारथी
      - शराचिताङ्गः सौभद्रः श्वाविद्वत्समदृश्यत
    iast: "tasyāśvāngadayā hatvā tathobhau pārṣṇisārathī | śarācitāṅgaḥ saubhadraḥ śvāvidvatsamadṛśyata"
  - id: 'drona-7-49-10'
    kind: verse
    lines:
      - ततो दौःशसनिः क्रुद्धो गदामुद्यम्य मारिष
      - अभिदुद्राव सौभद्रं तिष्ठतिष्ठेति चाब्रवीत्
    iast: "tato dauḥśasaniḥ kruddho gadāmudyamya māriṣa | abhidudrāva saubhadraṃ tiṣṭhatiṣṭheti cābravīt"
  - id: 'drona-7-49-12'
    kind: verse
    lines:
      - तावन्योन्यं गदाग्राभ्यामाहत्य पतितौ क्षितौ
      - इन्द्रध्वजाविवोत्सृष्टौ रणमध्ये परंतपौ
    iast: "tāvanyonyaṃ gadāgrābhyāmāhatya patitau kṣitau | indradhvajāvivotsṛṣṭau raṇamadhye paraṃtapau"
  - id: 'drona-7-49-13'
    kind: verse
    lines:
      - दौःशासनिरथोत्थाय कुरूणां कीर्तिवर्धनः
      - उत्तिष्ठमानं सौभद्रं गदया मूर्ध्न्यताडयत्
    iast: "dauḥśāsanirathotthāya kurūṇāṃ kīrtivardhanaḥ | uttiṣṭhamānaṃ saubhadraṃ gadayā mūrdhnyatāḍayat"
  - id: 'drona-7-49-15'
    kind: verse
    lines:
      - एवं विनिहतो राजन्नेको बहुभिराहवे
      - क्षोभयित्वा चमूं सर्वां नलिनीमिव कुञ्जरः
    iast: "evaṃ vinihato rājanneko bahubhirāhave | kṣobhayitvā camūṃ sarvāṃ nalinīmiva kuñjaraḥ"
  - id: 'drona-7-49-19'
    kind: verse
    lines:
      - पूर्णचन्द्राभवदनं काकपक्षवृतालिकम् तं भूमौ पतितं दृष्ट्वा तावकास्ते महारथाः
      - मुदा परमया युक्ताश्चुक्रुशुः सिंहवन्मुहुः
    iast: "pūrṇacandrābhavadanaṃ kākapakṣavṛtālikam taṃ bhūmau patitaṃ dṛṣṭvā tāvakāste mahārathāḥ | mudā paramayā yuktāścukruśuḥ siṃhavanmuhuḥ"
  - id: 'drona-7-49-20'
    kind: verse
    lines:
      - आसीत्परमको हर्षस्तावकानां विशाम्पते
      - इतरेषां तु वीराणां नेत्रेभ्यः प्रापतज्जलम्
    iast: "āsītparamako harṣastāvakānāṃ viśāmpate | itareṣāṃ tu vīrāṇāṃ netrebhyaḥ prāpatajjalam"
  - id: 'drona-7-49-21'
    kind: verse
    lines:
      - अन्तरिक्षे च भूतानि प्राक्रोशन्त विशाम्पते
      - दृष्ट्वा निपतितं वीरं च्युतं चन्द्रमिवाम्बरात्
    iast: "antarikṣe ca bhūtāni prākrośanta viśāmpate | dṛṣṭvā nipatitaṃ vīraṃ cyutaṃ candramivāmbarāt"
  - id: 'drona-7-49-22'
    kind: verse
    lines:
      - द्रोणकर्णमुखैः षड्भिर्धार्तराष्ट्रैर्महारथैः
      - एकोऽयं निहतः शेते नैष धर्मो मतो हि नः
    iast: "droṇakarṇamukhaiḥ ṣaḍbhirdhārtarāṣṭrairmahārathaiḥ | eko'yaṃ nihataḥ śete naiṣa dharmo mato hi naḥ"
  - id: 'drona-7-72-8'
    kind: verse
    lines:
      - व्यपयातेषु वासाय सर्वेषु भरतर्षभ
      - हत्वा संशप्तकव्रातान्दिव्यैरस्त्रैः कपिध्वजः
    iast: "vyapayāteṣu vāsāya sarveṣu bharatarṣabha | hatvā saṃśaptakavrātāndivyairastraiḥ kapidhvajaḥ"
  - id: 'drona-7-72-9'
    kind: verse
    lines:
      - प्रायात्स्वशिबिरं जिष्णुर्जैत्रमास्थाय तं रथम्
      - गच्छन्नेव च गोविन्दं साश्रुकण्ठोऽभ्यभाषत
    iast: "prāyātsvaśibiraṃ jiṣṇurjaitramāsthāya taṃ ratham | gacchanneva ca govindaṃ sāśrukaṇṭho'bhyabhāṣata"
  - id: 'drona-7-72-24'
    kind: verse
    lines:
      - दृष्ट्वा भ्रातृंश्च पुत्रांश्च विमना वानरध्वजः
      - अपश्यंश्चैव सौभद्रमिदं वचनमब्रवीत्
    iast: "dṛṣṭvā bhrātṛṃśca putrāṃśca vimanā vānaradhvajaḥ | apaśyaṃścaiva saubhadramidaṃ vacanamabravīt"
  - id: 'drona-7-72-25'
    kind: verse
    lines:
      - मुखवर्णोऽप्रसन्नो वः सर्वेषामेव लक्ष्यते
      - न चाभिमन्युं पश्यामि न च मां प्रतिनन्दथ
    iast: "mukhavarṇo'prasanno vaḥ sarveṣāmeva lakṣyate | na cābhimanyuṃ paśyāmi na ca māṃ pratinandatha"
  - id: 'drona-7-73-1'
    kind: verse
    lines:
      - त्वयि याते महाबाहो संशप्तकबलं प्रति
      - प्रयत्नमकरोत्तीव्रमाचार्यो प्रहणे मम
    iast: "tvayi yāte mahābāho saṃśaptakabalaṃ prati | prayatnamakarottīvramācāryo prahaṇe mama"
  - id: 'drona-7-73-4'
    kind: verse
    lines:
      - ते पीड्यमाना द्रोणेन द्रोणानीकं न शक्नुमः
      - प्रतिवीक्षितुमप्याजौ भेत्तुं तत्कुत एव तु
    iast: "te pīḍyamānā droṇena droṇānīkaṃ na śaknumaḥ | prativīkṣitumapyājau bhettuṃ tatkuta eva tu"
  - id: 'drona-7-73-5'
    kind: verse
    lines:
      - ततस्तमप्रतिरथमहं सौभद्रमब्रवम्
      - द्रोणानीकमिदं भिन्द्धि द्वारं सञ्जनयस्व नः
    iast: "tatastamapratirathamahaṃ saubhadramabravam | droṇānīkamidaṃ bhinddhi dvāraṃ sañjanayasva naḥ"
  - id: 'drona-7-73-7'
    kind: verse
    lines:
      - स तवास्त्रोपदेशेन वीर्येण च समन्वितः
      - प्राविशत्तद्बलं बालः सुपर्ण इव सागरम्
    iast: "sa tavāstropadeśena vīryeṇa ca samanvitaḥ | prāviśattadbalaṃ bālaḥ suparṇa iva sāgaram"
  - id: 'drona-7-73-8'
    kind: verse
    lines:
      - तेऽनुयाता वयं वीरं सात्वतीपुत्रमाहवे
      - प्रवेष्टुकामास्तेनैव येन स प्राविशच्चमूम्
    iast: "te'nuyātā vayaṃ vīraṃ sātvatīputramāhave | praveṣṭukāmāstenaiva yena sa prāviśaccamūm"
  - id: 'drona-7-73-9'
    kind: verse
    lines:
      - ततः सैन्धवको राजा क्षुद्रस्तात जयद्रथः
      - वरदानेन रुद्रस्य सर्वान्नः समवारयत्
    iast: "tataḥ saindhavako rājā kṣudrastāta jayadrathaḥ | varadānena rudrasya sarvānnaḥ samavārayat"
  - id: 'drona-7-73-11'
    kind: verse
    lines:
      - परिवार्य तु तैः सर्वैर्युधि बालो महारथैः
      - यतमानः परं शक्त्या बहुभिर्विरथीकृतः
    iast: "parivārya tu taiḥ sarvairyudhi bālo mahārathaiḥ | yatamānaḥ paraṃ śaktyā bahubhirvirathīkṛtaḥ"
  - id: 'drona-7-73-16'
    kind: verse
    lines:
      - दौःशासनिरथोत्थाय कुरूणां कीर्तिवर्धनः
      - उत्तिष्ठमानं सौभद्रं गदया मूर्ध्न्यताडयत्
    iast: "dauḥśāsanirathotthāya kurūṇāṃ kīrtivardhanaḥ | uttiṣṭhamānaṃ saubhadraṃ gadayā mūrdhnyatāḍayat"
  - id: 'drona-7-73-22'
    kind: verse
    lines:
      - एतावदेव निर्वृत्तमस्माकं शोकवर्धनम्
      - स चैवं पुरुषव्याघ्रः स्वर्गलोकमवाप्तवान्
      - सञ्जय उवाच
    iast: "etāvadeva nirvṛttamasmākaṃ śokavardhanam | sa caivaṃ puruṣavyāghraḥ svargalokamavāptavān | sañjaya uvāca"
  - id: 'drona-7-73-23'
    kind: verse
    lines:
      - ततोऽर्जुनो वचः श्रुत्वा धर्मराजेन भाषितम्
      - हा पुत्र इति निःश्वस्य व्यथितो न्यपतद्भुवि
    iast: "tato'rjuno vacaḥ śrutvā dharmarājena bhāṣitam | hā putra iti niḥśvasya vyathito nyapatadbhuvi"
  - id: 'drona-7-73-26'
    kind: verse
    lines:
      - पाणिं पाणौ विनिष्पिष्य दन्तान्कटकटाय्य च त्रिशिखां भ्रुकुटीं कृत्वा क्रोधसंरक्तलोचनः
      - उन्मत्त इव विप्रेक्षन्निदं वचनमब्रवीत्
      - अर्जुन उवाच
    iast: "pāṇiṃ pāṇau viniṣpiṣya dantānkaṭakaṭāyya ca triśikhāṃ bhrukuṭīṃ kṛtvā krodhasaṃraktalocanaḥ | unmatta iva viprekṣannidaṃ vacanamabravīt | arjuna uvāca"
  - id: 'drona-7-73-27'
    kind: verse
    lines:
      - सत्यं वः प्रतिजानामि श्वोऽस्मि हन्ताऽजयद्रथम्
      - न चेद्वधभयाद्भीतो धार्तराष्ट्रान्प्रहास्यति
    iast: "satyaṃ vaḥ pratijānāmi śvo'smi hantā'jayadratham | na cedvadhabhayādbhīto dhārtarāṣṭrānprahāsyati"
  - id: 'drona-7-74-1'
    kind: verse
    lines:
      - श्रुत्वा तु तं महाशब्दं पाण्डूनां पुत्रगृद्धिनाम्
      - चारैः प्रवेदितस्त्रस्तः समुत्थाय जयद्रथः
    iast: "śrutvā tu taṃ mahāśabdaṃ pāṇḍūnāṃ putragṛddhinām | cāraiḥ praveditastrastaḥ samutthāya jayadrathaḥ"
  - id: 'drona-7-74-22'
    kind: verse
    lines:
      - एवमाश्वासितो राजन्पुत्रेण तव सैन्धवः
      - दुर्योधनेन सहितो द्रोणं रात्रावुपागमत्
    iast: "evamāśvāsito rājanputreṇa tava saindhavaḥ | duryodhanena sahito droṇaṃ rātrāvupāgamat"
  - id: 'drona-7-74-28'
    kind: verse
    lines:
      - न हि मद्बाहुगुप्तस्य प्रभवन्त्यमरा अपि
      - व्यूहयिष्यामि तं व्यूहं यं पार्थो न तरिष्यति
    iast: "na hi madbāhuguptasya prabhavantyamarā api | vyūhayiṣyāmi taṃ vyūhaṃ yaṃ pārtho na tariṣyati"
  - id: 'drona-7-74-29'
    kind: verse
    lines:
      - तस्माद्युध्यस्व माभैस्त्वं स्वधर्ममनुपालय
      - पितृपैतामहं मार्गमनुयाहि महारथ
    iast: "tasmādyudhyasva mābhaistvaṃ svadharmamanupālaya | pitṛpaitāmahaṃ mārgamanuyāhi mahāratha"
  - id: 'drona-7-74-35'
    kind: verse
    lines:
      - एवमाश्वासितो राजा भारद्वाजेन सैन्धवः
      - अपानुदद्भयं पार्थाद्युद्धाय च मनो दधे
    iast: "evamāśvāsito rājā bhāradvājena saindhavaḥ | apānudadbhayaṃ pārthādyuddhāya ca mano dadhe"
  - id: 'drona-7-87-1'
    kind: verse
    lines:
      - तस्यां निशायां व्युष्टायां द्रोणः शस्त्रभृतां वरः
      - स्वान्यनीकानि सर्वाणि प्राक्रामद्व्यूहितुं ततः
    iast: "tasyāṃ niśāyāṃ vyuṣṭāyāṃ droṇaḥ śastrabhṛtāṃ varaḥ | svānyanīkāni sarvāṇi prākrāmadvyūhituṃ tataḥ"
  - id: 'drona-7-88-21'
    kind: verse
    lines:
      - रथप्रवरमास्थाय नरो नारायणानुगः
      - विधुन्वन्गाण्डिवं सङ्ख्ये बभौ सूर्य इवोदितः
    iast: "rathapravaramāsthāya naro nārāyaṇānugaḥ | vidhunvangāṇḍivaṃ saṅkhye babhau sūrya ivoditaḥ"
  - id: 'drona-7-91-1'
    kind: verse
    lines:
      - दुःशसनबलं हत्वा सव्यसाची महारथः
      - सिन्धुराजं परीप्सन्वै द्रोणानीकमुपाद्रवत्
    iast: "duḥśasanabalaṃ hatvā savyasācī mahārathaḥ | sindhurājaṃ parīpsanvai droṇānīkamupādravat"
  - id: 'drona-7-147-43'
    kind: verse
    lines:
      - विनिवार्य स वीराणामस्त्रैरस्त्राणि सर्वतः
      - दर्शयन्रौद्रमात्मानमुग्रे कर्मणि धिष्ठितः
    iast: "vinivārya sa vīrāṇāmastrairastrāṇi sarvataḥ | darśayanraudramātmānamugre karmaṇi dhiṣṭhitaḥ"
  - id: 'drona-7-147-48'
    kind: verse
    lines:
      - तथा सर्वा दिशो राजन्सर्वांश्च रथिनो रणे आकुलीकृत्य कौन्तेयो जयद्रथमुपाद्रवत्
      - विव्याध च चतुःषष्ट्या शराणां नतपर्वणाम्
    iast: "tathā sarvā diśo rājansarvāṃśca rathino raṇe ākulīkṛtya kaunteyo jayadrathamupādravat | vivyādha ca catuḥṣaṣṭyā śarāṇāṃ nataparvaṇām"
  - id: 'drona-7-147-61'
    kind: verse
    lines:
      - आदित्यं प्रेक्षमाणस्तु बीभत्सुः सृक्विणी लिहन्
      - अपश्यन्नान्तरं तस्य रक्षिभिः संवृतस्य वै
    iast: "ādityaṃ prekṣamāṇastu bībhatsuḥ sṛkviṇī lihan | apaśyannāntaraṃ tasya rakṣibhiḥ saṃvṛtasya vai"
  - id: 'drona-7-147-62'
    kind: verse
    lines:
      - अभवक्त्रोधरक्ताक्षो व्यात्तानन इवान्तकः
      - अथाब्रवीद्वासुदेवः कुन्तीपुत्रं धनञ्जयम्
    iast: "abhavaktrodharaktākṣo vyāttānana ivāntakaḥ | athābravīdvāsudevaḥ kuntīputraṃ dhanañjayam"
  - id: 'drona-7-147-63'
    kind: verse
    lines:
      - नैव शक्यस्त्वया हन्तुं निर्व्याजं भरतर्षभ स्रक्ष्याम्यहमुपायं तमादित्यस्यापवारणे ततोऽस्तं गतमादित्यं मंस्यते सिन्धुराडिह
    iast: "naiva śakyastvayā hantuṃ nirvyājaṃ bharatarṣabha srakṣyāmyahamupāyaṃ tamādityasyāpavāraṇe tato'staṃ gatamādityaṃ maṃsyate sindhurāḍiha"
  - id: 'drona-7-147-65'
    kind: verse
    lines:
      - अस्तङ्गतमिवादित्यं दृष्ट्वा मोहेन बालिशः
      - न हि शक्ष्यत्यथाऽऽत्मानं रक्षितुं हर्षसम्भवात्
    iast: "astaṅgatamivādityaṃ dṛṣṭvā mohena bāliśaḥ | na hi śakṣyatyathā''tmānaṃ rakṣituṃ harṣasambhavāt"
  - id: 'drona-7-147-66'
    kind: verse
    lines:
      - एतस्मिन्नेव काले तु प्रहर्तव्यं धनञ्जय
      - जयद्रथस्य क्षुद्रस्य सविदुर्दर्शनार्थिनः
      - सञ्जय उवाच
    iast: "etasminneva kāle tu prahartavyaṃ dhanañjaya | jayadrathasya kṣudrasya savidurdarśanārthinaḥ | sañjaya uvāca"
  - id: 'drona-7-147-67'
    kind: verse
    lines:
      - एवमुक्त्वा ततः पार्थं क्षिप्रमेवाहरत्प्रभाम्
      - जनार्दनेन सृष्टं वै तम आदित्यनाशनम्
    iast: "evamuktvā tataḥ pārthaṃ kṣipramevāharatprabhām | janārdanena sṛṣṭaṃ vai tama ādityanāśanam"
  - id: 'drona-7-147-70'
    kind: verse
    lines:
      - वीक्षमाणे ततस्तस्मिन्सिन्धुराजे दिवाकरम् उन्नमय्य शिरोग्रीवां वीक्षते सूर्यमण्डलम्
      - तस्य शीघ्रं पृषत्केन कायाच्छीर्षमपाहर
    iast: "vīkṣamāṇe tatastasminsindhurāje divākaram unnamayya śirogrīvāṃ vīkṣate sūryamaṇḍalam | tasya śīghraṃ pṛṣatkena kāyācchīrṣamapāhara"
  - id: 'drona-7-147-72'
    kind: verse
    lines:
      - एवं तूणीशयं घोरमिन्द्राशनिसमप्रभम् वर्मभेदिनमत्यर्थं गन्धमाल्यार्चितं सदा
      - विससर्ज ततस्तूर्णं सैन्धवस्य रथं प्रति
    iast: "evaṃ tūṇīśayaṃ ghoramindrāśanisamaprabham varmabhedinamatyarthaṃ gandhamālyārcitaṃ sadā | visasarja tatastūrṇaṃ saindhavasya rathaṃ prati"
  - id: 'drona-7-147-73'
    kind: verse
    lines:
      - स तु गाण्डीवनिर्मुक्तः शरः श्येन इवाशुनः
      - शकुन्तमिव वृक्षाग्रात्सैन्धवस्याहरच्छिरः
    iast: "sa tu gāṇḍīvanirmuktaḥ śaraḥ śyena ivāśunaḥ | śakuntamiva vṛkṣāgrātsaindhavasyāharacchiraḥ"
  - id: 'drona-7-157-62'
    kind: verse
    lines:
      - शूलमुद्गरधारिण्या शैलपादपहस्तया
      - रक्षसां घोररूपाणामक्षौहिण्या समावृतः
    iast: "śūlamudgaradhāriṇyā śailapādapahastayā | rakṣasāṃ ghorarūpāṇāmakṣauhiṇyā samāvṛtaḥ"
  - id: 'drona-7-157-137'
    kind: verse
    lines:
      - ततो घटोत्कचः क्रुद्धो रक्षसां भीमकर्मणाम्
      - द्रौणिं हतेति महतीं चोदयामास तां चमूम्
    iast: "tato ghaṭotkacaḥ kruddho rakṣasāṃ bhīmakarmaṇām | drauṇiṃ hateti mahatīṃ codayāmāsa tāṃ camūm"
  - id: 'drona-7-164-1'
    kind: verse
    lines:
      - वर्तमाने यथा यद्धे घोररूपे भयावहे
      - तमसा संवृते लोके रजसा च महीपते
    iast: "vartamāne yathā yaddhe ghorarūpe bhayāvahe | tamasā saṃvṛte loke rajasā ca mahīpate"
  - id: 'drona-7-164-2'
    kind: verse
    lines:
      - नापश्यन्त रणे योधाः परस्परमवस्थिताः
      - अनुमानेन संज्ञाभिर्युद्धं तद्ववृधे महत्
    iast: "nāpaśyanta raṇe yodhāḥ parasparamavasthitāḥ | anumānena saṃjñābhiryuddhaṃ tadvavṛdhe mahat"
  - id: 'drona-7-165-3'
    kind: verse
    lines:
      - प्रदीपानां सहस्रैश्च दीप्यमानैः समन्ततः
      - रत्नाचितैः स्वर्णदण्डैर्गन्धतैलावसिञ्चितैः
    iast: "pradīpānāṃ sahasraiśca dīpyamānaiḥ samantataḥ | ratnācitaiḥ svarṇadaṇḍairgandhatailāvasiñcitaiḥ"
  - id: 'drona-7-165-5'
    kind: verse
    lines:
      - उल्काशतैः प्रज्वलितै रणभूमिर्व्यराजत
      - दह्यमानेव लोकानामभावे च वसुन्धरा
    iast: "ulkāśataiḥ prajvalitai raṇabhūmirvyarājata | dahyamāneva lokānāmabhāve ca vasundharā"
  - id: 'drona-7-174-69'
    kind: verse
    lines:
      - तयोः समभवद्युद्धं कर्णराक्षसयोर्निशि
      - गर्जतो राजशार्दूल शक्रप्रह्लादयोरिव
    iast: "tayoḥ samabhavadyuddhaṃ karṇarākṣasayorniśi | garjato rājaśārdūla śakraprahlādayoriva"
  - id: 'drona-7-180-33'
    kind: verse
    lines:
      - तां राक्षसीं भीमरूपां सुघोरां वृष्टिं महाशस्त्रमयीं पतन्तीम्
      - दृष्ट्वा बलौघांश्च निपात्यमानान्महद्भयं तव पुत्रान्विवेश
    iast: "tāṃ rākṣasīṃ bhīmarūpāṃ sughorāṃ vṛṣṭiṃ mahāśastramayīṃ patantīm | dṛṣṭvā balaughāṃśca nipātyamānānmahadbhayaṃ tava putrānviveśa"
  - id: 'drona-7-180-48'
    kind: verse
    lines:
      - ततोऽब्रुवन्कुरवः सर्व एव कर्णं दृष्ट्वा घोररूपां च मायाम्
      - शक्त्या रक्षो जहि कर्णाद्य तूर्णं नश्यन्त्येते कुरवो धार्तराष्ट्राः
    iast: "tato'bruvankuravaḥ sarva eva karṇaṃ dṛṣṭvā ghorarūpāṃ ca māyām | śaktyā rakṣo jahi karṇādya tūrṇaṃ naśyantyete kuravo dhārtarāṣṭrāḥ"
  - id: 'drona-7-180-51'
    kind: verse
    lines:
      - स वध्यमानो रक्षसा वै निशीथे दृष्ट्वा राजंस्त्रास्यमानं बलं च
      - महच्छ्रुत्वा निनदं कौरवाणां मतिं दध्रे शक्तिमोक्षाय कर्णः
    iast: "sa vadhyamāno rakṣasā vai niśīthe dṛṣṭvā rājaṃstrāsyamānaṃ balaṃ ca | mahacchrutvā ninadaṃ kauravāṇāṃ matiṃ dadhre śaktimokṣāya karṇaḥ"
  - id: 'drona-7-180-53'
    kind: verse
    lines:
      - याऽसौ राजन्निहिता वर्षपूगान्वधायाजौ सत्कृता फल्गुनस्य
      - यां वै प्रादात्सूत पुत्राय शक्रः शक्तिं श्रेष्ठां कुण्डलाभ्यां निमाय
    iast: "yā'sau rājannihitā varṣapūgānvadhāyājau satkṛtā phalgunasya | yāṃ vai prādātsūta putrāya śakraḥ śaktiṃ śreṣṭhāṃ kuṇḍalābhyāṃ nimāya"
  - id: 'drona-7-180-54'
    kind: verse
    lines:
      - तां वै शक्तिं लेलिहानां प्रदीप्तां पाशैर्युक्तामन्तकस्येव जिह्वाम्
      - मृत्योः स्वसारं ज्वलितामिवोल्कां वैकर्तनः प्राहिणोद्राक्षसाय
    iast: "tāṃ vai śaktiṃ lelihānāṃ pradīptāṃ pāśairyuktāmantakasyeva jihvām | mṛtyoḥ svasāraṃ jvalitāmivolkāṃ vaikartanaḥ prāhiṇodrākṣasāya"
  - id: 'drona-7-180-60'
    kind: verse
    lines:
      - ततोऽन्तरिक्षादपतद्गतासुः स राक्षसेन्द्रो भुवि भिन्नदेहः
      - अवाक्शिराः स्तब्धगात्रो विजिह्वो घटोत्कचो महदास्थाय रूपम्
    iast: "tato'ntarikṣādapatadgatāsuḥ sa rākṣasendro bhuvi bhinnadehaḥ | avākśirāḥ stabdhagātro vijihvo ghaṭotkaco mahadāsthāya rūpam"
  - id: 'drona-7-188-2'
    kind: verse
    lines:
      - उदिते तु सहस्रांशौ तप्तकाञ्चनसप्रभे
      - प्रकाशितेषु लोकेषु पुनर्युद्धमवर्तत
    iast: "udite tu sahasrāṃśau taptakāñcanasaprabhe | prakāśiteṣu lokeṣu punaryuddhamavartata"
  - id: 'drona-7-191-5'
    kind: verse
    lines:
      - वध्यमानेषु सङ्ग्रामे पाञ्चालेषु महात्मना
      - उदीर्यमाणे द्रोणास्त्रे पाण़्डवान्भयमाविशत्
    iast: "vadhyamāneṣu saṅgrāme pāñcāleṣu mahātmanā | udīryamāṇe droṇāstre pāṇḍavānbhayamāviśat"
  - id: 'drona-7-191-9'
    kind: verse
    lines:
      - त्रस्तान्कुन्तीसुतान्दृष्ट्वा द्रोणसायकपीडितान्
      - मतिमाञ्श्रेयसे युक्तः केशवोऽर्जुनमब्रवीत्
    iast: "trastānkuntīsutāndṛṣṭvā droṇasāyakapīḍitān | matimāñśreyase yuktaḥ keśavo'rjunamabravīt"
  - id: 'drona-7-191-10'
    kind: verse
    lines:
      - नैष युद्धेन सङ्ग्रामे जेतुं शक्यः कथञ्चन
      - सधनुर्धन्विनां श्रेष्ठो देवैरपि सवासवैः
    iast: "naiṣa yuddhena saṅgrāme jetuṃ śakyaḥ kathañcana | sadhanurdhanvināṃ śreṣṭho devairapi savāsavaiḥ"
  - id: 'drona-7-191-11'
    kind: verse
    lines:
      - न्यस्तशस्त्रस्तु सङ्गारमे शक्यो हन्तुं भवेन्नृभिः आस्थीयतां जये योगो धर्ममुत्सृज्य पाण्डवाः
      - यथा न संयुगे सर्वान्निहन्याद्रुक्मवाहनः
    iast: "nyastaśastrastu saṅgārame śakyo hantuṃ bhavennṛbhiḥ āsthīyatāṃ jaye yogo dharmamutsṛjya pāṇḍavāḥ | yathā na saṃyuge sarvānnihanyādrukmavāhanaḥ"
  - id: 'drona-7-191-12'
    kind: verse
    lines:
      - अश्वत्थाम्नि हते नैष युध्येदिति मतिर्मम
      - तं हतं संयुगे कश्चिदस्मै शंसतु मानवः
    iast: "aśvatthāmni hate naiṣa yudhyediti matirmama | taṃ hataṃ saṃyuge kaścidasmai śaṃsatu mānavaḥ"
  - id: 'drona-7-191-13'
    kind: verse
    lines:
      - एतन्नारोचयद्राजन्कुन्तीपुत्रो धनञ्जयः
      - अन्ये त्वरोचयन्सर्वे कृच्छ्रेण तु युधिष्ठिरः
    iast: "etannārocayadrājankuntīputro dhanañjayaḥ | anye tvarocayansarve kṛcchreṇa tu yudhiṣṭhiraḥ"
  - id: 'drona-7-191-14'
    kind: verse
    lines:
      - ततो भीमो महाबाहुरनीकेषु महागजम् जघान गदया राजन्नश्वत्थामानमित्युत
      - परप्रमथनं घोरं मालवस्येन्द्रवर्मणः
    iast: "tato bhīmo mahābāhuranīkeṣu mahāgajam jaghāna gadayā rājannaśvatthāmānamityuta | parapramathanaṃ ghoraṃ mālavasyendravarmaṇaḥ"
  - id: 'drona-7-191-15'
    kind: verse
    lines:
      - भीमसेनस्तु सव्रीडमुपेत्य द्रोणमाहवे
      - अश्वत्थामा हत इति शब्दमुच्चैश्चकार ह
    iast: "bhīmasenastu savrīḍamupetya droṇamāhave | aśvatthāmā hata iti śabdamuccaiścakāra ha"
  - id: 'drona-7-191-18'
    kind: verse
    lines:
      - शङ्कमानः स तन्मिथ्या वीर्यज्ञः स्वसुतस्य वै
      - हतः स इति च श्रुत्वा नैव धैर्यादकम्पत
    iast: "śaṅkamānaḥ sa tanmithyā vīryajñaḥ svasutasya vai | hataḥ sa iti ca śrutvā naiva dhairyādakampata"
  - id: 'drona-7-191-23'
    kind: verse
    lines:
      - विधूय तान्बाणगणान्पाञ्चालानां महारथः
      - प्रादुश्चक्रे ततो द्रोणो ब्राह्ममस्त्रं परन्तपः
    iast: "vidhūya tānbāṇagaṇānpāñcālānāṃ mahārathaḥ | prāduścakre tato droṇo brāhmamastraṃ parantapaḥ"
  - id: 'drona-7-191-31'
    kind: verse
    lines:
      - क्षत्रियाणामभावाय दृष्ट्वा द्रोणमवस्थितम्
      - ऋषयोऽभ्यागतास्तूर्णं हव्यवाहपुरोगमाः
    iast: "kṣatriyāṇāmabhāvāya dṛṣṭvā droṇamavasthitam | ṛṣayo'bhyāgatāstūrṇaṃ havyavāhapurogamāḥ"
  - id: 'drona-7-191-34'
    kind: verse
    lines:
      - त एनमब्रुवन्सर्वे द्रोणमाहरवशोभिनम्
      - अधर्मतः कृतं युद्धं समयो निधनस्य ते
    iast: "ta enamabruvansarve droṇamāharavaśobhinam | adharmataḥ kṛtaṃ yuddhaṃ samayo nidhanasya te"
  - id: 'drona-7-191-36'
    kind: verse
    lines:
      - वेदवेदाङ्गविदुषः सत्यधर्मरतस्य ते
      - ब्राह्मणस्य विशेषेण तवैतन्नोपपद्यते
    iast: "vedavedāṅgaviduṣaḥ satyadharmaratasya te | brāhmaṇasya viśeṣeṇa tavaitannopapadyate"
  - id: 'drona-7-191-38'
    kind: verse
    lines:
      - ब्रह्मास्त्रेण त्वया दग्धा अनस्त्रज्ञा नरा भुवि
      - यदेतदीदृशं विप्र कृतं कर्म न साधु तत्
    iast: "brahmāstreṇa tvayā dagdhā anastrajñā narā bhuvi | yadetadīdṛśaṃ vipra kṛtaṃ karma na sādhu tat"
  - id: 'drona-7-191-39'
    kind: verse
    lines:
      - न्यस्यायुधं रणे विप्र द्रोण मा त्वं चिरं कृथाः
      - मा पापिष्ठतरं कर्म करिष्यसि पुनर्द्विज
    iast: "nyasyāyudhaṃ raṇe vipra droṇa mā tvaṃ ciraṃ kṛthāḥ | mā pāpiṣṭhataraṃ karma kariṣyasi punardvija"
  - id: 'drona-7-191-40'
    kind: verse
    lines:
      - इति तेषां वचः श्रुत्वा भीमसेनवचः स्मरन्
      - धृष्टद्युम्नं च सम्प्रेक्ष्य रणे स विमनाऽभवत्
    iast: "iti teṣāṃ vacaḥ śrutvā bhīmasenavacaḥ smaran | dhṛṣṭadyumnaṃ ca samprekṣya raṇe sa vimanā'bhavat"
  - id: 'drona-7-191-41'
    kind: verse
    lines:
      - सन्दिह्यमानो व्यथितः कुन्तीपुत्रं युधिष्ठिरम्
      - अहतं वा हतं वेति पप्रच्छ सुतमात्मनः
    iast: "sandihyamāno vyathitaḥ kuntīputraṃ yudhiṣṭhiram | ahataṃ vā hataṃ veti papraccha sutamātmanaḥ"
  - id: 'drona-7-191-42'
    kind: verse
    lines:
      - स्थिरा बुद्धिर्हि द्रोणस्य न पार्थो वक्ष्यतेऽनृतम्
      - त्रयाणामपि लोकानामैश्वर्यार्थे कथञ्चन
    iast: "sthirā buddhirhi droṇasya na pārtho vakṣyate'nṛtam | trayāṇāmapi lokānāmaiśvaryārthe kathañcana"
  - id: 'drona-7-191-43'
    kind: verse
    lines:
      - तस्मात्तं परिपप्रच्छ नान्यं कञ्छिद्द्विजर्षभः
      - तस्मिंस्तस्य हि सत्याशा बाल्यात्प्रभृति पाण्डवे
    iast: "tasmāttaṃ paripapraccha nānyaṃ kañchiddvijarṣabhaḥ | tasmiṃstasya hi satyāśā bālyātprabhṛti pāṇḍave"
  - id: 'drona-7-191-44'
    kind: verse
    lines:
      - ततो निष्पाण्डवामुर्वीं करिष्यन्तं युधाम्पतिम्
      - द्रोणं ज्ञात्वा धर्मराजं गोविन्दो व्यथितोऽब्रवीत्
    iast: "tato niṣpāṇḍavāmurvīṃ kariṣyantaṃ yudhāmpatim | droṇaṃ jñātvā dharmarājaṃ govindo vyathito'bravīt"
  - id: 'drona-7-191-46'
    kind: verse
    lines:
      - स भवांस्त्रातु नो द्रोणात्सत्याज्ज्यायोऽनृतं वचः
      - अनृतं जीवितस्यार्थे वदन्न स्पृश्यतेऽनृतैः
    iast: "sa bhavāṃstrātu no droṇātsatyājjyāyo'nṛtaṃ vacaḥ | anṛtaṃ jīvitasyārthe vadanna spṛśyate'nṛtaiḥ"
  - id: 'drona-7-191-54'
    kind: verse
    lines:
      - तमतथ्यभये मग्नो जये सक्तो युधिष्ठिरः अश्वत्थामा हति शब्दमुच्चैश्चकार ह
      - अव्यक्तमब्रवीद्राजन्हतः कुञ्जर इत्युत
    iast: "tamatathyabhaye magno jaye sakto yudhiṣṭhiraḥ aśvatthāmā hati śabdamuccaiścakāra ha | avyaktamabravīdrājanhataḥ kuñjara ityuta"
  - id: 'drona-7-191-55'
    kind: verse
    lines:
      - तस्य पूर्वं रथः पृथ्व्याश्चतुरङ्गुलमुच्छ्रितः
      - बभूवैवं च तेनोक्ते तस्य वाहाः स्पृशन्महीम्
    iast: "tasya pūrvaṃ rathaḥ pṛthvyāścaturaṅgulamucchritaḥ | babhūvaivaṃ ca tenokte tasya vāhāḥ spṛśanmahīm"
  - id: 'drona-7-191-56'
    kind: verse
    lines:
      - युधिष्ठिरात्तु तद्वाक्यं श्रुत्वा द्रोणो महारथः
      - पुत्रव्यसनसन्तप्तो निराशो जीवितेऽभवत्
    iast: "yudhiṣṭhirāttu tadvākyaṃ śrutvā droṇo mahārathaḥ | putravyasanasantapto nirāśo jīvite'bhavat"
  - id: 'drona-7-193-36'
    kind: verse
    lines:
      - ततो भीमो दृढक्रोधो द्रोणस्याश्लिष्य तं रथम्
      - शनकैरिव राजेन्द्र द्रोणं वचनमब्रवीत्
    iast: "tato bhīmo dṛḍhakrodho droṇasyāśliṣya taṃ ratham | śanakairiva rājendra droṇaṃ vacanamabravīt"
  - id: 'drona-7-193-37'
    kind: verse
    lines:
      - यदि नाम न युध्येरञ्शिक्षिता ब्रह्मबन्धवः
      - स्वकर्मभिरसन्तुष्टा न स्म क्षत्रं क्षयं व्रजेत्
    iast: "yadi nāma na yudhyerañśikṣitā brahmabandhavaḥ | svakarmabhirasantuṣṭā na sma kṣatraṃ kṣayaṃ vrajet"
  - id: 'drona-7-193-38'
    kind: verse
    lines:
      - अहिंसां सर्वभूतेषु धर्मं ज्यायस्तरं विदुः
      - तस्य च ब्राह्मणो मूलं भवांश्च ब्रह्मवित्तमः
    iast: "ahiṃsāṃ sarvabhūteṣu dharmaṃ jyāyastaraṃ viduḥ | tasya ca brāhmaṇo mūlaṃ bhavāṃśca brahmavittamaḥ"
  - id: 'drona-7-193-40'
    kind: verse
    lines:
      - अज्ञानान्मूढवद्ब्रह्मन्पुत्रदारधनेप्सया एकस्यार्थे बहून्हत्वा पुत्रस्याधर्मविद्यया
      - स्वकर्मस्थान्विकर्मस्थो न व्यपत्रपसे कथम्
    iast: "ajñānānmūḍhavadbrahmanputradāradhanepsayā ekasyārthe bahūnhatvā putrasyādharmavidyayā | svakarmasthānvikarmastho na vyapatrapase katham"
  - id: 'drona-7-193-44'
    kind: verse
    lines:
      - एवमुक्तस्ततो द्रोणो भीमेनोत्सृज्य तद्वनुः सन्न्यासाय शरीरस्य योक्ष्यमाणः स वै द्विजः
      - सर्वाण्यस्त्राणि धर्मात्मा हातुकामोऽभ्यभापत
    iast: "evamuktastato droṇo bhīmenotsṛjya tadvanuḥ sannyāsāya śarīrasya yokṣyamāṇaḥ sa vai dvijaḥ | sarvāṇyastrāṇi dharmātmā hātukāmo'bhyabhāpata"
  - id: 'drona-7-193-47'
    kind: verse
    lines:
      - उत्सृज्य च रणे शस्त्रं रथोपस्थे निविश्य च
      - अभयं सर्वभूतानां प्रददौ योगमीयिवान्
    iast: "utsṛjya ca raṇe śastraṃ rathopasthe niviśya ca | abhayaṃ sarvabhūtānāṃ pradadau yogamīyivān"
  - id: 'drona-7-193-54'
    kind: verse
    lines:
      - स्मरित्वा देवदेवेशमक्षरं परमं प्रभुम्
      - दिवमाक्रामदाचार्यः साक्षात्सद्भिर्दुराक्रमाम्
    iast: "smaritvā devadeveśamakṣaraṃ paramaṃ prabhum | divamākrāmadācāryaḥ sākṣātsadbhirdurākramām"
  - id: 'drona-7-194-43'
    kind: verse
    lines:
      - आकर्णपलितश्यामो वयसाऽशीतिपञ्चकः
      - रणे पर्यचरद्द्रोणो वृद्धः षोडशवर्षवत्
    iast: "ākarṇapalitaśyāmo vayasā'śītipañcakaḥ | raṇe paryacaraddroṇo vṛddhaḥ ṣoḍaśavarṣavat"
  - id: 'drona-7-202-104'
    kind: verse
    lines:
      - ततः प्रत्यवहारोऽभूत्पाण्डवानां विशाम्पते
      - कौरवाणां च दीनानां द्रोणे युधि निपातिते
    iast: "tataḥ pratyavahāro'bhūtpāṇḍavānāṃ viśāmpate | kauravāṇāṃ ca dīnānāṃ droṇe yudhi nipātite"
  - id: 'karna-8-7-45'
    kind: verse
    lines:
      - सैनापत्येन सत्कर्तुं कर्णं स्कन्दमिवामराः
      - ततोऽभिषिषिचुः कर्णं विधिदृष्टेन कर्मणा
    iast: "saināpatyena satkartuṃ karṇaṃ skandamivāmarāḥ | tato'bhiṣiṣicuḥ karṇaṃ vidhidṛṣṭena karmaṇā"
  - id: 'karna-8-30-15'
    kind: verse
    lines:
      - स शल्यसङ्गृहीताश्वे रथे कर्णः स्थितो बभौ
      - धनुर्विष्फारयन्घोरं परिवेषीव भास्करः
    iast: "sa śalyasaṅgṛhītāśve rathe karṇaḥ sthito babhau | dhanurviṣphārayanghoraṃ pariveṣīva bhāskaraḥ"
  - id: 'karna-8-43-79'
    kind: verse
    lines:
      - ततः पुनः समाजग्मुरभीताः कुरुपाण्डवाः
      - युधिष्ठिरमुखाः पार्थाः सूतपुत्रमुखा वयम्
    iast: "tataḥ punaḥ samājagmurabhītāḥ kurupāṇḍavāḥ | yudhiṣṭhiramukhāḥ pārthāḥ sūtaputramukhā vayam"
  - id: 'karna-8-61-1'
    kind: verse
    lines:
      - तेषां प्रवृत्ते सङ्ग्रामे विपुले शोणितोदके
      - रराज लोहितेनोर्वी संसिक्ता बहुधा भृशम्
    iast: "teṣāṃ pravṛtte saṅgrāme vipule śoṇitodake | rarāja lohitenorvī saṃsiktā bahudhā bhṛśam"
  - id: 'karna-8-86-13'
    kind: verse
    lines:
      - विस्फार्य गाण्डीवमथोग्रघोषं ज्यया समाहत्य तले भृशं च
      - बाणान्धकारं सहसैव कृत्वा जघान नागाश्वरथध्वजांश्च
    iast: "visphārya gāṇḍīvamathograghoṣaṃ jyayā samāhatya tale bhṛśaṃ ca | bāṇāndhakāraṃ sahasaiva kṛtvā jaghāna nāgāśvarathadhvajāṃśca"
  - id: 'karna-8-86-14'
    kind: verse
    lines:
      - प्रतिश्रुतः प्राचरदन्तरिक्षे गुहा गिरीणामपतन्वयांसि
      - यन्मण्डलज्येन विजृम्भमाणो रौद्रे मुहूर्तेऽभ्यपतत्किरीटी
    iast: "pratiśrutaḥ prācaradantarikṣe guhā girīṇāmapatanvayāṃsi | yanmaṇḍalajyena vijṛmbhamāṇo raudre muhūrte'bhyapatatkirīṭī"
  - id: 'karna-8-86-15'
    kind: verse
    lines:
      - तं भीमसेनोऽनुययौ रथेन पृष्ठे रक्षन्पाण्डवमेकवीरः
      - तौ राजपुत्रौ त्वरितौ रथाभ्यां कर्णाय यातावरिभिर्विषक्तौ
    iast: "taṃ bhīmaseno'nuyayau rathena pṛṣṭhe rakṣanpāṇḍavamekavīraḥ | tau rājaputrau tvaritau rathābhyāṃ karṇāya yātāvaribhirviṣaktau"
  - id: 'karna-8-86-31'
    kind: verse
    lines:
      - तथागतं भीममभीस्तवात्मजः ससार राजावरजः किरञ्शरैः
      - तमभ्यधावत्त्वरितो वृकोदरो महारुरुं सिंह इवाभिपेदिवान्
    iast: "tathāgataṃ bhīmamabhīstavātmajaḥ sasāra rājāvarajaḥ kirañśaraiḥ | tamabhyadhāvattvarito vṛkodaro mahāruruṃ siṃha ivābhipedivān"
  - id: 'karna-8-86-36'
    kind: verse
    lines:
      - दिष्ट्याऽसि दुःशासन अद्य दृष्टः क्षणं प्रतीच्छे सहवृद्धि मूलम्
      - चिरोदितं यन्मया ते सभायां कृष्णाभिमर्शेन गृहाण मत्तः
    iast: "diṣṭyā'si duḥśāsana adya dṛṣṭaḥ kṣaṇaṃ pratīcche sahavṛddhi mūlam | ciroditaṃ yanmayā te sabhāyāṃ kṛṣṇābhimarśena gṛhāṇa mattaḥ"
  - id: 'karna-8-87-8'
    kind: verse
    lines:
      - ततः क्रोधाद्भीमसेनः कृतानि सर्वाणि दुःखान्यनुसंस्मरन्वै
      - संस्मृत्य संस्मृत्य तथा प्रतिज्ञामुग्रामसौ राजपुत्रौ व्यषीदत्
    iast: "tataḥ krodhādbhīmasenaḥ kṛtāni sarvāṇi duḥkhānyanusaṃsmaranvai | saṃsmṛtya saṃsmṛtya tathā pratijñāmugrāmasau rājaputrau vyaṣīdat"
  - id: 'karna-8-87-9'
    kind: verse
    lines:
      - सञ्चिन्तितं रोषमतीव वेगात्त्रयोदशाब्दं पुरुषप्रवीरः
      - प्रगृह्य वज्राशनितुल्यवेगां गदां करेणाथ वृकोदरो रुषा
    iast: "sañcintitaṃ roṣamatīva vegāttrayodaśābdaṃ puruṣapravīraḥ | pragṛhya vajrāśanitulyavegāṃ gadāṃ kareṇātha vṛkodaro ruṣā"
  - id: 'karna-8-87-10'
    kind: verse
    lines:
      - निपातयित्वा पृथिवीतले भृशं स ताजयामा वृकोदरो बली
      - अतीव सन्ताडितभिन्नगात्रो दुःशासनो वै निपपात भूमौ
    iast: "nipātayitvā pṛthivītale bhṛśaṃ sa tājayāmā vṛkodaro balī | atīva santāḍitabhinnagātro duḥśāsano vai nipapāta bhūmau"
  - id: 'karna-8-87-15'
    kind: verse
    lines:
      - निगृह्य चैनं परमेण कर्मणा उत्क्षिप्य चोत्क्षिप्य च तूर्णमेनम्
      - भूमौ तदा निष्पिपेषाथ वीर असिं विकोशं विमलं चकार
    iast: "nigṛhya cainaṃ parameṇa karmaṇā utkṣipya cotkṣipya ca tūrṇamenam | bhūmau tadā niṣpipeṣātha vīra asiṃ vikośaṃ vimalaṃ cakāra"
  - id: 'karna-8-87-20'
    kind: verse
    lines:
      - इत्येवमुक्त्वा सहसाभ्यधावन्निहन्तुकामोऽतिबलस्तरस्वी
      - तथा तु विक्रम्य रमे वृकोदरो महागजं केसरिको यथैव निगृह्य दुःशासनमेकवीरः सुयोधनस्याधिरथेः समक्षम्
    iast: "ityevamuktvā sahasābhyadhāvannihantukāmo'tibalastarasvī | tathā tu vikramya rame vṛkodaro mahāgajaṃ kesariko yathaiva nigṛhya duḥśāsanamekavīraḥ suyodhanasyādhiratheḥ samakṣam"
  - id: 'karna-8-87-22'
    kind: verse
    lines:
      - ये राजसूयावभृथे पवित्रा जाताः कछा याज्ञसेन्या दुरात्मन्
      - ते पाणिना कतरेणावकृष्टास्तद्ब्रूहि त्वां पृच्छति भीमसेनः
    iast: "ye rājasūyāvabhṛthe pavitrā jātāḥ kachā yājñasenyā durātman | te pāṇinā katareṇāvakṛṣṭāstadbrūhi tvāṃ pṛcchati bhīmasenaḥ"
  - id: 'karna-8-87-27'
    kind: verse
    lines:
      - उवाच यस्यास्ति बलं स रक्षत्वसौ भवेदद्य निरस्तबाहुः
      - दुःशानं जीवितं प्रोत्सृजन्तमाक्षिप्य योधांस्तरसा महाबलः
    iast: "uvāca yasyāsti balaṃ sa rakṣatvasau bhavedadya nirastabāhuḥ | duḥśānaṃ jīvitaṃ protsṛjantamākṣipya yodhāṃstarasā mahābalaḥ"
  - id: 'karna-8-87-28'
    kind: verse
    lines:
      - एवं क्रुद्धो भीमसेनः करेण उत्पाटयामास भुजं महात्मा
      - दुःशासनं तेन स वीरमध्ये जघान वज्राशनिसन्निभेन
    iast: "evaṃ kruddho bhīmasenaḥ kareṇa utpāṭayāmāsa bhujaṃ mahātmā | duḥśāsanaṃ tena sa vīramadhye jaghāna vajrāśanisannibhena"
  - id: 'karna-8-87-29'
    kind: verse
    lines:
      - कण्ठे समाक्रम्य च वेपमानं कृत्वाऽनु रूपं परमं सुघोरम्
      - कालान्तकाभ्यां सदृशं तदानीं विदार्य वक्षश्च महारथस्य
    iast: "kaṇṭhe samākramya ca vepamānaṃ kṛtvā'nu rūpaṃ paramaṃ sughoram | kālāntakābhyāṃ sadṛśaṃ tadānīṃ vidārya vakṣaśca mahārathasya"
  - id: 'karna-8-87-30'
    kind: verse
    lines:
      - दुःशासनस्य निपुशासनस्य उद्धृत्य वक्षः पतितस्य भूमौ
      - ततोऽपिबच्छोणितमस्य कोष्णमास्वाद्य चास्वाद्य च वीक्षमाणः
    iast: "duḥśāsanasya nipuśāsanasya uddhṛtya vakṣaḥ patitasya bhūmau | tato'pibacchoṇitamasya koṣṇamāsvādya cāsvādya ca vīkṣamāṇaḥ"
  - id: 'karna-8-88-13'
    kind: verse
    lines:
      - दुःशासने यादृशं संश्रुतं नस्तदवाप्तं पाण्डवैः सर्वमेव
      - अत्रैवमाप्स्याम्यपरं द्वितीयं दुर्योधनं यज्ञपशुं विशस्य
    iast: "duḥśāsane yādṛśaṃ saṃśrutaṃ nastadavāptaṃ pāṇḍavaiḥ sarvameva | atraivamāpsyāmyaparaṃ dvitīyaṃ duryodhanaṃ yajñapaśuṃ viśasya"
  - id: 'karna-8-88-16'
    kind: verse
    lines:
      - एतावदुक्त्वा वचनं प्रहृष्टः प्राक्रोशदुच्चै रुधिरार्द्रवक्रः
      - ननर्त चैवातिबलो महात्मा वृत्रं निहत्येव सहस्रनेत्रः
    iast: "etāvaduktvā vacanaṃ prahṛṣṭaḥ prākrośaduccai rudhirārdravakraḥ | nanarta caivātibalo mahātmā vṛtraṃ nihatyeva sahasranetraḥ"
  - id: 'karna-8-88-25'
    kind: verse
    lines:
      - ततः कर्णं महाराज प्रविवेश महद्भयम्
      - दृष्ट्वा भीमस्य विक्रान्तमन्तकस्य प्रजास्विव
    iast: "tataḥ karṇaṃ mahārāja praviveśa mahadbhayam | dṛṣṭvā bhīmasya vikrāntamantakasya prajāsviva"
  - id: 'karna-8-88-28'
    kind: verse
    lines:
      - एते द्रवन्ति राजानो भीमसेनभयार्दिताः
      - दुर्योधनश्च सम्मूढो भ्रातृव्यसनकर्शितः
    iast: "ete dravanti rājāno bhīmasenabhayārditāḥ | duryodhanaśca sammūḍho bhrātṛvyasanakarśitaḥ"
  - id: 'karna-8-88-30'
    kind: verse
    lines:
      - उपासते त्वामेते हि परिवार्य महारथाः
      - कृपप्रभृतयः कर्ण हतशेषाः सहोदराः
    iast: "upāsate tvāmete hi parivārya mahārathāḥ | kṛpaprabhṛtayaḥ karṇa hataśeṣāḥ sahodarāḥ"
  - id: 'karna-8-88-32'
    kind: verse
    lines:
      - स त्वं पुरुषशार्दूल पौरुषे महति स्थितः
      - क्षत्रधर्मं पुरस्कृत्य प्रत्युद्याहि धनञ्जयम्
    iast: "sa tvaṃ puruṣaśārdūla pauruṣe mahati sthitaḥ | kṣatradharmaṃ puraskṛtya pratyudyāhi dhanañjayam"
  - id: 'karna-8-88-33'
    kind: verse
    lines:
      - भारो हि धार्तराष्ट्रेण त्वयि सर्वः समाहितः
      - तमुद्वह महाबाहो यथाशक्ति यथाबलम्
    iast: "bhāro hi dhārtarāṣṭreṇa tvayi sarvaḥ samāhitaḥ | tamudvaha mahābāho yathāśakti yathābalam"
  - id: 'karna-8-88-34'
    kind: verse
    lines:
      - जये स्याद्विपुला कीर्तिर्ध्रुवः स्वर्गः पराजये वृषसेनश्च राधेय सङ्क्रुद्धस्तनयस्तव
      - त्वयि मोहं समापन्ने पाण़्डवानभिधावति
      - सञ्जय उवाच
    iast: "jaye syādvipulā kīrtirdhruvaḥ svargaḥ parājaye vṛṣasenaśca rādheya saṅkruddhastanayastava | tvayi mohaṃ samāpanne pāṇḍavānabhidhāvati | sañjaya uvāca"
  - id: 'karna-8-88-35'
    kind: verse
    lines:
      - एतच्छ्रुत्वा तु वचनं शल्यस्यामिततोजसः
      - हृदि मानुष्यकं भावं कृत्वा युद्वाय सुस्थिरम्
    iast: "etacchrutvā tu vacanaṃ śalyasyāmitatojasaḥ | hṛdi mānuṣyakaṃ bhāvaṃ kṛtvā yudvāya susthiram"
  - id: 'karna-8-91-2'
    kind: verse
    lines:
      - रथेन कर्णस्तेजस्वी जगामाभिमुखो रिपुम्
      - युद्धायामर्पताम्राक्षः समाहूय धनञ्जयम्
    iast: "rathena karṇastejasvī jagāmābhimukho ripum | yuddhāyāmarpatāmrākṣaḥ samāhūya dhanañjayam"
  - id: 'karna-8-94-20'
    kind: verse
    lines:
      - अथाब्रवीद्द्रोणसुतस्तवात्मजं करं करेण प्रतिपीड्य सान्त्वयन्
      - प्रसीद दुर्योधन शाम्य पाण्डवैरलं विरोधेन धिगस्तु विग्रहम्
    iast: "athābravīddroṇasutastavātmajaṃ karaṃ kareṇa pratipīḍya sāntvayan | prasīda duryodhana śāmya pāṇḍavairalaṃ virodhena dhigastu vigraham"
  - id: 'karna-8-94-41'
    kind: verse
    lines:
      - निहत्य दुःशासनमुक्तवान्बहु प्रहस्य शार्दूलवदेष दुर्मतिः
      - वृकोदरस्तद्वृदये मम स्थितं न तत्परोक्षं भवतः कुतः शमः
    iast: "nihatya duḥśāsanamuktavānbahu prahasya śārdūlavadeṣa durmatiḥ | vṛkodarastadvṛdaye mama sthitaṃ na tatparokṣaṃ bhavataḥ kutaḥ śamaḥ"
  - id: 'karna-8-94-46'
    kind: verse
    lines:
      - तमेवमुक्त्वाऽप्यनुनीय चासकृत्तवात्मजः स्वाननुशास्ति सैनिकान्
      - द्रुतं घ्नताभिद्रवताहितानिमानहीनसत्वाः किमु जोषमासते
    iast: "tamevamuktvā'pyanunīya cāsakṛttavātmajaḥ svānanuśāsti sainikān | drutaṃ ghnatābhidravatāhitānimānahīnasatvāḥ kimu joṣamāsate"
  - id: 'karna-8-97-5'
    kind: verse
    lines:
      - ततो विमर्दः सुमहान्बभूव तत्रार्जुनस्याधिरथेश्च राजन्
      - अन्योन्यमासादयतोः पृषत्कैर्विषाणघातैर्द्विपयोरिवाजौ
    iast: "tato vimardaḥ sumahānbabhūva tatrārjunasyādhiratheśca rājan | anyonyamāsādayatoḥ pṛṣatkairviṣāṇaghātairdvipayorivājau"
  - id: 'karna-8-97-20'
    kind: verse
    lines:
      - ततो रिपुघ्नं समधत्त कर्णः सुसञ्चितं सर्पमुखं ज्वलन्तम्
      - रौद्रं शरं सन्नतमुग्रधौतं पार्थार्थमित्येव चिराभिगुप्तम्
    iast: "tato ripughnaṃ samadhatta karṇaḥ susañcitaṃ sarpamukhaṃ jvalantam | raudraṃ śaraṃ sannatamugradhautaṃ pārthārthamityeva cirābhiguptam"
  - id: 'karna-8-97-22'
    kind: verse
    lines:
      - प्रदीप्तमैरावतवंशसम्भवं शिरो जिहीर्षुर्युधि सव्यसाचिनः
      - ततः प्रजज्वाल दिशो नभश्च उल्काश्च घोराः शतशः प्रपेतुः
    iast: "pradīptamairāvatavaṃśasambhavaṃ śiro jihīrṣuryudhi savyasācinaḥ | tataḥ prajajvāla diśo nabhaśca ulkāśca ghorāḥ śataśaḥ prapetuḥ"
  - id: 'karna-8-97-30'
    kind: verse
    lines:
      - तमापतन्तं ज्वलितं निरीक्ष्य वियद्गतं वृष्णिकुलप्रवीरः
      - रथस्य चक्रं सहसा निपीड्य पञ्चाङ्गुलं मज्जयति स्म वीरः
    iast: "tamāpatantaṃ jvalitaṃ nirīkṣya viyadgataṃ vṛṣṇikulapravīraḥ | rathasya cakraṃ sahasā nipīḍya pañcāṅgulaṃ majjayati sma vīraḥ"
  - id: 'karna-8-97-30#2'
    kind: verse
    lines:
      - तमापतन्तं ज्वलितं निरीक्ष्य वियद्गतं वृष्णिकुलप्रवीरः
      - रथस्य चक्रं सहसा निपीड्य पञ्चाङ्गुलं मज्जयति स्म वीरः
    iast: "tamāpatantaṃ jvalitaṃ nirīkṣya viyadgataṃ vṛṣṇikulapravīraḥ | rathasya cakraṃ sahasā nipīḍya pañcāṅgulaṃ majjayati sma vīraḥ"
  - id: 'karna-8-97-33'
    kind: verse
    lines:
      - ततः किरीटं तपनीयचित्रं पार्थोत्तमाङ्गादहरत्तरस्वी
      - तद्धेमजालावनतं सुघोरं सम्प्रज्वलत्तन्निपपात भूमौ
    iast: "tataḥ kirīṭaṃ tapanīyacitraṃ pārthottamāṅgādaharattarasvī | taddhemajālāvanataṃ sughoraṃ samprajvalattannipapāta bhūmau"
  - id: 'karna-8-97-96'
    kind: verse
    lines:
      - ततोऽग्निसदृशं घोरं शरं सर्पविषोपमम् अश्मसारमं दिव्यमभिमन्त्र्यं परन्तपः
      - रौद्रमस्त्रं समाधाय क्षेप्तुकामः किरीटिने
    iast: "tato'gnisadṛśaṃ ghoraṃ śaraṃ sarpaviṣopamam aśmasāramaṃ divyamabhimantryaṃ parantapaḥ | raudramastraṃ samādhāya kṣeptukāmaḥ kirīṭine"
  - id: 'karna-8-97-97'
    kind: verse
    lines:
      - ततोऽग्रसन्मही चक्रं राधेयस्य तदा नृप
    iast: "tato'grasanmahī cakraṃ rādheyasya tadā nṛpa"
  - id: 'karna-8-97-100'
    kind: verse
    lines:
      - ग्रस्तचक्रस्तु राधेयः क्रोधादश्रूण्यवर्तयत्
      - अर्जुनं वीक्ष्य संरब्धमिदं वचनमब्रवीत्
    iast: "grastacakrastu rādheyaḥ krodhādaśrūṇyavartayat | arjunaṃ vīkṣya saṃrabdhamidaṃ vacanamabravīt"
  - id: 'karna-8-97-101'
    kind: verse
    lines:
      - भोभो पार्थ महेष्वास मुहुर्तं परिपालय
      - यावच्चक्रमिदं ग्रस्तमुद्धरामि महीतलात्
    iast: "bhobho pārtha maheṣvāsa muhurtaṃ paripālaya | yāvaccakramidaṃ grastamuddharāmi mahītalāt"
  - id: 'karna-8-97-106'
    kind: verse
    lines:
      - त्वं च शूरतमो लोके साधुवृत्तश्च पाण्डव
      - अभिज्ञो युद्धधर्माणां तस्मात्क्षम मुहूर्तकम्
    iast: "tvaṃ ca śūratamo loke sādhuvṛttaśca pāṇḍava | abhijño yuddhadharmāṇāṃ tasmātkṣama muhūrtakam"
  - id: 'karna-8-98-1'
    kind: verse
    lines:
      - अथाब्रवीद्वासुदेवो महात्मा राधेय दिष्ट्या स्मरसीह धर्मम्
      - धर्मे हि बद्धा सततं हि पार्थास्तेभ्यस्ततो वृद्धिसौ ददाति
    iast: "athābravīdvāsudevo mahātmā rādheya diṣṭyā smarasīha dharmam | dharme hi baddhā satataṃ hi pārthāstebhyastato vṛddhisau dadāti"
  - id: 'karna-8-98-3'
    kind: verse
    lines:
      - कृष्णां सभां कर्ण यदेकवस्त्रामानीतवांस्त्वं च सुयोधनश्च
      - दुःशासनः शकुनिः सौबलश्च धर्मस्तदा ते रुचितो न कस्मात्
    iast: "kṛṣṇāṃ sabhāṃ karṇa yadekavastrāmānītavāṃstvaṃ ca suyodhanaśca | duḥśāsanaḥ śakuniḥ saubalaśca dharmastadā te rucito na kasmāt"
  - id: 'karna-8-98-4'
    kind: verse
    lines:
      - यदा सभायां राजानमनक्षज्ञं युधिष्ठिरम्
      - आनीय जितवन्तो वै क्व ते धर्मस्तदा गतः
    iast: "yadā sabhāyāṃ rājānamanakṣajñaṃ yudhiṣṭhiram | ānīya jitavanto vai kva te dharmastadā gataḥ"
  - id: 'karna-8-98-5'
    kind: verse
    lines:
      - वनवासे व्यतीते च कर्ण वर्षे त्रयोदशे
      - न प्रयच्छसि यद्राज्यं क्व ते धर्मस्तदा गतः
    iast: "vanavāse vyatīte ca karṇa varṣe trayodaśe | na prayacchasi yadrājyaṃ kva te dharmastadā gataḥ"
  - id: 'karna-8-98-6'
    kind: verse
    lines:
      - यद्भीमसेनं सर्पैश्च विषयुक्तैश्च भोजनैः
      - आचरत्त्वन्मते राजा क्व ते धर्मस्तदा गतः
    iast: "yadbhīmasenaṃ sarpaiśca viṣayuktaiśca bhojanaiḥ | ācarattvanmate rājā kva te dharmastadā gataḥ"
  - id: 'karna-8-98-7'
    kind: verse
    lines:
      - यद्वारणावते पार्थान्सुप्ताञ्जतुगृहे तदा
      - हन्तुकामास्तदा यूयं क्व ते धर्मस्तदा गतः
    iast: "yadvāraṇāvate pārthānsuptāñjatugṛhe tadā | hantukāmāstadā yūyaṃ kva te dharmastadā gataḥ"
  - id: 'karna-8-98-8'
    kind: verse
    lines:
      - यदा रजस्वलां कृष्णां दुःशासनवशे स्थिताम्
      - सभायां प्राहसः कर्ण क्व ते धर्मस्तदा गतः
    iast: "yadā rajasvalāṃ kṛṣṇāṃ duḥśāsanavaśe sthitām | sabhāyāṃ prāhasaḥ karṇa kva te dharmastadā gataḥ"
  - id: 'karna-8-98-9'
    kind: verse
    lines:
      - यदनार्यैः पुरा कृष्णां क्लिश्यमानामनागसम्
      - उपप्रेक्षसि राधेय क्व ते धर्मस्तदा गतः
    iast: "yadanāryaiḥ purā kṛṣṇāṃ kliśyamānāmanāgasam | upaprekṣasi rādheya kva te dharmastadā gataḥ"
  - id: 'karna-8-98-10'
    kind: verse
    lines:
      - विनष्टाः पाण्डवाः कृष्णे शाश्वतं नरकं गताः पतिमन्यं वृणीष्वेति वदंस्त्वं गजगामिनीम्
      - उपप्रेक्षसि राधेय क्व ते धर्मस्तदा गतः
    iast: "vinaṣṭāḥ pāṇḍavāḥ kṛṣṇe śāśvataṃ narakaṃ gatāḥ patimanyaṃ vṛṇīṣveti vadaṃstvaṃ gajagāminīm | upaprekṣasi rādheya kva te dharmastadā gataḥ"
  - id: 'karna-8-98-11'
    kind: verse
    lines:
      - राज्यलुब्धः पुनः कर्ण समाह्वयसि पाण्डवान्
      - यदा शकुनिमाश्रित्य क्व ते धर्मस्तदा गतः
    iast: "rājyalubdhaḥ punaḥ karṇa samāhvayasi pāṇḍavān | yadā śakunimāśritya kva te dharmastadā gataḥ"
  - id: 'karna-8-98-12'
    kind: verse
    lines:
      - यदाऽभिमन्युं बहवो युद्धे जघ्नुर्महारथाः
      - परिवार्य रणे बालं क्व ते धर्मस्तदा गतः
    iast: "yadā'bhimanyuṃ bahavo yuddhe jaghnurmahārathāḥ | parivārya raṇe bālaṃ kva te dharmastadā gataḥ"
  - id: 'karna-8-98-16'
    kind: verse
    lines:
      - एवमुक्तस्तदा कर्णो वासुदेवेन भारत
      - लज्जयावनतो भूत्वा नोत्तरं किञ्चिदुक्तवान्
    iast: "evamuktastadā karṇo vāsudevena bhārata | lajjayāvanato bhūtvā nottaraṃ kiñciduktavān"
  - id: 'karna-8-98-17'
    kind: verse
    lines:
      - क्रोधात्प्रस्फुरमाणौष्ठो धनुरुद्यम्य भारत
      - योधयामास वै पार्थं महावेगपराक्रमः
    iast: "krodhātprasphuramāṇauṣṭho dhanurudyamya bhārata | yodhayāmāsa vai pārthaṃ mahāvegaparākramaḥ"
  - id: 'karna-8-98-26'
    kind: verse
    lines:
      - ततः शरं महाघोरं ज्वलन्तिमिव पावकम्
      - आददे पाण्डुपुत्रस्य सूतपुत्रो जिघांसया
    iast: "tataḥ śaraṃ mahāghoraṃ jvalantimiva pāvakam | ādade pāṇḍuputrasya sūtaputro jighāṃsayā"
  - id: 'karna-8-98-31'
    kind: verse
    lines:
      - स राढविद्धः समरे महात्मा विधूर्णमानः श्लथहस्तगाण्डिवः
      - चचाल वीभत्सुरमित्रमर्दनः क्षितेः प्रकम्पे च यथाऽचलोत्तमः
    iast: "sa rāḍhaviddhaḥ samare mahātmā vidhūrṇamānaḥ ślathahastagāṇḍivaḥ | cacāla vībhatsuramitramardanaḥ kṣiteḥ prakampe ca yathā'calottamaḥ"
  - id: 'karna-8-98-32'
    kind: verse
    lines:
      - तदन्तरं प्राप्य वृषो महारथो रथाङ्गसुर्वीगतमुज्जिहीर्षुः
      - रथादवप्लुत्य निगृह्य दोर्भ्यां शशाक दैवान्न महाबलोऽपि
    iast: "tadantaraṃ prāpya vṛṣo mahāratho rathāṅgasurvīgatamujjihīrṣuḥ | rathādavaplutya nigṛhya dorbhyāṃ śaśāka daivānna mahābalo'pi"
  - id: 'karna-8-98-33'
    kind: verse
    lines:
      - ततः किरीटि प्रतिलभ्य संज्ञां जग्राह बाणं यमदण्डकल्पम्
      - ततोऽर्जुनः प्राञ्जलिकं महात्मा ततोऽब्रवीद्वासुदेवोऽपि पार्थम्
    iast: "tataḥ kirīṭi pratilabhya saṃjñāṃ jagrāha bāṇaṃ yamadaṇḍakalpam | tato'rjunaḥ prāñjalikaṃ mahātmā tato'bravīdvāsudevo'pi pārtham"
  - id: 'karna-8-98-34'
    kind: verse
    lines:
      - छिन्ध्यस्य मूर्धानमरेः शरेण न यावदारोहति वै रथं वृषः
      - तथैव सम्पूज्य स तद्वचः प्रभोस्ततः शरं प्रज्वलितं प्रगृह्य जघान कक्षाममलार्कवर्णां महारथे रथचक्रे विमग्ने
    iast: "chindhyasya mūrdhānamareḥ śareṇa na yāvadārohati vai rathaṃ vṛṣaḥ | tathaiva sampūjya sa tadvacaḥ prabhostataḥ śaraṃ prajvalitaṃ pragṛhya jaghāna kakṣāmamalārkavarṇāṃ mahārathe rathacakre vimagne"
  - id: 'karna-8-98-50'
    kind: verse
    lines:
      - सैन्यान्यनेकानि च विप्रमोह्य गाण्डीवमुक्तेन ततो महात्मा
      - तेनार्जुनस्तन्महनीयमस्य शिरोऽहरत्सूतपुत्रस्य राजन्
    iast: "sainyānyanekāni ca vipramohya gāṇḍīvamuktena tato mahātmā | tenārjunastanmahanīyamasya śiro'haratsūtaputrasya rājan"
  - id: 'karna-8-100-25'
    kind: verse
    lines:
      - पाञ्चजन्यस्य निर्घोषो देवदत्तस्य चोभयोः
      - पृथिवीमन्तरिक्षं च दिशश्च समपूरयत्
    iast: "pāñcajanyasya nirghoṣo devadattasya cobhayoḥ | pṛthivīmantarikṣaṃ ca diśaśca samapūrayat"
  - id: 'karna-8-101-1'
    kind: verse
    lines:
      - हते वैकर्तने कर्णे कुरवो भयपीडिताः
      - वीक्षमाणा दिशः सर्वाः पलायन्त सहस्रशः
    iast: "hate vaikartane karṇe kuravo bhayapīḍitāḥ | vīkṣamāṇā diśaḥ sarvāḥ palāyanta sahasraśaḥ"
  - id: 'shalya-9-3-2'
    kind: verse
    lines:
      - निहते सूतपुत्रे च फल्गुनेन महात्मना
      - विद्रुतेषु च सैन्येषु समानीतेषु चासकृत्
    iast: "nihate sūtaputre ca phalgunena mahātmanā | vidruteṣu ca sainyeṣu samānīteṣu cāsakṛt"
  - id: 'shalya-9-3-3'
    kind: verse
    lines:
      - विमुखे तव पुत्रे च शोकोपहतचेतसि
      - भृशोद्विग्नेषु सैन्येषु दृष्ट्वा पार्थस्य विक्रमम्
    iast: "vimukhe tava putre ca śokopahatacetasi | bhṛśodvigneṣu sainyeṣu dṛṣṭvā pārthasya vikramam"
  - id: 'shalya-9-3-13'
    kind: verse
    lines:
      - येषु भारं समासज्य राज्ये मतिमकुर्महि
      - ते सन्त्यज्य तनूर्याताः शूरा ब्रह्मविदां गतिम्
    iast: "yeṣu bhāraṃ samāsajya rājye matimakurmahi | te santyajya tanūryātāḥ śūrā brahmavidāṃ gatim"
  - id: 'shalya-9-3-41'
    kind: verse
    lines:
      - ते वयं पाण्डुपुत्रेभ्यो हीनाः स्म बलशक्तितः
      - अत्र ते पाण्डवैः सार्धं सन्धिं मन्ये क्षमं प्रभो
    iast: "te vayaṃ pāṇḍuputrebhyo hīnāḥ sma balaśaktitaḥ | atra te pāṇḍavaiḥ sārdhaṃ sandhiṃ manye kṣamaṃ prabho"
  - id: 'shalya-9-4-27'
    kind: verse
    lines:
      - नायं क्लीबायितुं कालः संयोद्वुं काल एव नः
    iast: "nāyaṃ klībāyituṃ kālaḥ saṃyodvuṃ kāla eva naḥ"
  - id: 'shalya-9-4-45'
    kind: verse
    lines:
      - पातयित्वा वयस्यांश्च भ्रातृनथ पितामहान्
      - जीवितं यदि रक्षेयं लोको मां गर्हयेद्व्रुवम्
    iast: "pātayitvā vayasyāṃśca bhrātṛnatha pitāmahān | jīvitaṃ yadi rakṣeyaṃ loko māṃ garhayedvruvam"
  - id: 'shalya-9-4-46'
    kind: verse
    lines:
      - कीदृशं च भवेद्राज्यं मम हीनस्य बन्धुभिः
      - सखिभिश्च विशेषेण प्रणिपत्य च पाण्डवम्
    iast: "kīdṛśaṃ ca bhavedrājyaṃ mama hīnasya bandhubhiḥ | sakhibhiśca viśeṣeṇa praṇipatya ca pāṇḍavam"
  - id: 'shalya-9-4-48'
    kind: verse
    lines:
      - एं दुर्योधनेनोक्ते सर्वे सम्पूज्य तद्वचः
      - साधुसाध्विति राजानं क्षत्रियाः सम्बभाषिरे
    iast: "eṃ duryodhanenokte sarve sampūjya tadvacaḥ | sādhusādhviti rājānaṃ kṣatriyāḥ sambabhāṣire"
  - id: 'shalya-9-6-14'
    kind: verse
    lines:
      - एवमुक्तस्ततो राजा मद्राधिपतिमञ्जसा अभ्यषिञ्चत सेनाया मध्ये भरतसत्तम
      - विधिना शास्त्रदृष्टेन क्लिष्टरूपो विशाम्पते
    iast: "evamuktastato rājā madrādhipatimañjasā abhyaṣiñcata senāyā madhye bharatasattama | vidhinā śāstradṛṣṭena kliṣṭarūpo viśāmpate"
  - id: 'shalya-9-7-44'
    kind: verse
    lines:
      - ततः प्रववृते युद्धं घोररूपं भयानकम्
      - तावकानां परेषां च निघ्नतामितरेतरम्
    iast: "tataḥ pravavṛte yuddhaṃ ghorarūpaṃ bhayānakam | tāvakānāṃ pareṣāṃ ca nighnatāmitaretaram"
  - id: 'shalya-9-15-47'
    kind: verse
    lines:
      - युधिष्ठिरस्तु मद्रेशमभ्यधावदमर्षितः
      - स्वयं सन्नोदयन्नश्वान्दन्तवर्णान्मनोजवान्
    iast: "yudhiṣṭhirastu madreśamabhyadhāvadamarṣitaḥ | svayaṃ sannodayannaśvāndantavarṇānmanojavān"
  - id: 'shalya-9-15-48'
    kind: verse
    lines:
      - तत्राश्चर्यपमश्याम कुन्तीपुत्रे युधिष्ठिरे
      - पुरा भूत्वा मृदुर्दान्तो यत्तदा दारुणोऽभवत्
    iast: "tatrāścaryapamaśyāma kuntīputre yudhiṣṭhire | purā bhūtvā mṛdurdānto yattadā dāruṇo'bhavat"
  - id: 'shalya-9-16-42'
    kind: verse
    lines:
      - बलप्रयत्नादनिरोधवेगां मन्त्रैश्च घोरैरपि पूरयित्वा
      - ससर्ज मार्गेण च तां खगानां वधाय मद्राधिपतेस्तदानीम्
    iast: "balaprayatnādanirodhavegāṃ mantraiśca ghorairapi pūrayitvā | sasarja mārgeṇa ca tāṃ khagānāṃ vadhāya madrādhipatestadānīm"
  - id: 'shalya-9-16-50'
    kind: verse
    lines:
      - ततो निपतितः सोऽभूदिन्द्रध्वज इवोच्छ्रितः बाहू प्रसार्याभिमुखो धर्मराजस्य मद्रराट्
      - स तथा भिन्नसर्वाङ्गो रुधिरेण समुक्षितः
    iast: "tato nipatitaḥ so'bhūdindradhvaja ivocchritaḥ bāhū prasāryābhimukho dharmarājasya madrarāṭ | sa tathā bhinnasarvāṅgo rudhireṇa samukṣitaḥ"
  - id: 'shalya-9-25-3'
    kind: verse
    lines:
      - समेत्य समरे राजन्हतशेषाः सुतास्तव अदृश्यमाने कौरव्ये पुत्रे दुर्योधने तव
      - सोदर्याः सहिता भूत्वा भीमसेनमुपाद्रवन्
    iast: "sametya samare rājanhataśeṣāḥ sutāstava adṛśyamāne kauravye putre duryodhane tava | sodaryāḥ sahitā bhūtvā bhīmasenamupādravan"
  - id: 'shalya-9-25-5'
    kind: verse
    lines:
      - दुर्मर्षणः सुजातश्च जैत्रो भूरिबलो रविः इत्येते सहिता भूत्वा तव पुत्राः समन्ततः
      - भीमसेनमभिद्रुत्य रुरुधुः सर्वतो दिशम्
    iast: "durmarṣaṇaḥ sujātaśca jaitro bhūribalo raviḥ ityete sahitā bhūtvā tava putrāḥ samantataḥ | bhīmasenamabhidrutya rurudhuḥ sarvato diśam"
  - id: 'shalya-9-25-37'
    kind: verse
    lines:
      - भीमसेनस्तु कौन्तेयो हत्वा युद्धे सुतांस्तव
      - मेने कृतार्थमात्मानं सफलं जन्म च प्रभो
    iast: "bhīmasenastu kaunteyo hatvā yuddhe sutāṃstava | mene kṛtārthamātmānaṃ saphalaṃ janma ca prabho"
  - id: 'shalya-9-27-46'
    kind: verse
    lines:
      - स्वमंशमवशिष्टं तं संस्मृत्य शकुनिं नृप
      - रथेन काञ्चनाङ्गेन सहदेवः समभ्ययात्
    iast: "svamaṃśamavaśiṣṭaṃ taṃ saṃsmṛtya śakuniṃ nṛpa | rathena kāñcanāṅgena sahadevaḥ samabhyayāt"
  - id: 'shalya-9-27-48'
    kind: verse
    lines:
      - भृशमभ्यहन्त्कुद्धस्तोत्रैरिव महाद्विपम्
      - उवाच चैनं मेधावी विगृह्य स्मारयन्निव
    iast: "bhṛśamabhyahantkuddhastotrairiva mahādvipam | uvāca cainaṃ medhāvī vigṛhya smārayanniva"
  - id: 'shalya-9-27-49'
    kind: verse
    lines:
      - क्षत्रधर्मे स्थिरो भूत्वा युध्यस्व पुरुषो भव यत्तदा भाषसे मूढ गृह्णन्नक्षान्सभातले
      - फलमद्य प्रपद्यस्व कर्मणस्तस्य दुर्मते
    iast: "kṣatradharme sthiro bhūtvā yudhyasva puruṣo bhava yattadā bhāṣase mūḍha gṛhṇannakṣānsabhātale | phalamadya prapadyasva karmaṇastasya durmate"
  - id: 'shalya-9-27-58'
    kind: verse
    lines:
      - माद्रीसुतस्तस्य समुद्यतं तं प्रासं सुवृत्तौ च भुजौ रणाग्रे
      - भल्लैस्त्रिभिर्युगपत्सञ्चकर्त ननाद चोच्चैस्तरसाऽऽजिमध्ये
    iast: "mādrīsutastasya samudyataṃ taṃ prāsaṃ suvṛttau ca bhujau raṇāgre | bhallaistribhiryugapatsañcakarta nanāda coccaistarasā''jimadhye"
  - id: 'shalya-9-27-59'
    kind: verse
    lines:
      - तस्याशुकारी सुसमाहितेन सुवर्णपुङ्खेन दृढायसेन
      - भल्लेन सर्वावरणातिगेन शिरः शरीरात्प्रममाथ भूयः
    iast: "tasyāśukārī susamāhitena suvarṇapuṅkhena dṛḍhāyasena | bhallena sarvāvaraṇātigena śiraḥ śarīrātpramamātha bhūyaḥ"
  - id: 'shalya-9-27-61'
    kind: verse
    lines:
      - स तच्छिरो वेगवता शरेण सुवर्णपुङ्खेन शिलाशितेन
      - प्रावेरयत्कुपितः पाण्डुपुत्रो यत्तत्कुरूणामनयस्य मूलम्
    iast: "sa tacchiro vegavatā śareṇa suvarṇapuṅkhena śilāśitena | prāverayatkupitaḥ pāṇḍuputro yattatkurūṇāmanayasya mūlam"
  - id: 'shalya-9-28-15'
    kind: verse
    lines:
      - अक्षौहिण्यः समेतास्तु तव पुत्रस्य भारत
      - एकादश हता युद्धे ताः प्रभो पाण्डुसृञ्जयैः
    iast: "akṣauhiṇyaḥ sametāstu tava putrasya bhārata | ekādaśa hatā yuddhe tāḥ prabho pāṇḍusṛñjayaiḥ"
  - id: 'shalya-9-28-16'
    kind: verse
    lines:
      - तेषु राजसहस्रेषु तावकेषु महात्मसु
      - एको दुर्योधनो राजन्नदृश्यत भृशं क्षतः
    iast: "teṣu rājasahasreṣu tāvakeṣu mahātmasu | eko duryodhano rājannadṛśyata bhṛśaṃ kṣataḥ"
  - id: 'shalya-9-28-19'
    kind: verse
    lines:
      - दुर्योधनो महाराज कश्मलेनाभिसंवृतः
      - अपयो मनश्चक्रे विहीनबलवाहनः
    iast: "duryodhano mahārāja kaśmalenābhisaṃvṛtaḥ | apayo manaścakre vihīnabalavāhanaḥ"
  - id: 'shalya-9-29-7'
    kind: verse
    lines:
      - एकादशचमूभर्ता पुत्रो दुर्योधनस्तव
      - गदामादाय तेजस्वी पदातिः प्रस्थितो हदम्
    iast: "ekādaśacamūbhartā putro duryodhanastava | gadāmādāya tejasvī padātiḥ prasthito hadam"
  - id: 'shalya-9-29-8'
    kind: verse
    lines:
      - नातिदूरं ततो गत्वा पद्भ्यामेव नराधिपः
      - सस्मार वचनं क्षत्रुर्धर्मशीलस्य धीमतः
    iast: "nātidūraṃ tato gatvā padbhyāmeva narādhipaḥ | sasmāra vacanaṃ kṣatrurdharmaśīlasya dhīmataḥ"
  - id: 'shalya-9-29-9'
    kind: verse
    lines:
      - इदं नूनं महाप्राज्ञो विदुरो दृष्ट्वान्पुरा
      - महद्व्सनमस्माकं क्षत्रियाणां च सर्वशः
    iast: "idaṃ nūnaṃ mahāprājño viduro dṛṣṭvānpurā | mahadvsanamasmākaṃ kṣatriyāṇāṃ ca sarvaśaḥ"
  - id: 'shalya-9-29-10'
    kind: verse
    lines:
      - एवं विचिन्तयानस्तु प्रविविक्षुर्हदं नृपः
      - दुःखसन्तप्तहृदयो दृष्ट्वा राजन्बलक्षयम्
    iast: "evaṃ vicintayānastu pravivikṣurhadaṃ nṛpaḥ | duḥkhasantaptahṛdayo dṛṣṭvā rājanbalakṣayam"
  - id: 'shalya-9-30-60'
    kind: verse
    lines:
      - युधिष्ठिरश्च राजेन्द्र तं हदं सह सोदरैः
      - आजगाम महाराज तव पुत्रवधाय वै
    iast: "yudhiṣṭhiraśca rājendra taṃ hadaṃ saha sodaraiḥ | ājagāma mahārāja tava putravadhāya vai"
  - id: 'shalya-9-31-16'
    kind: verse
    lines:
      - इत्युक्तो वासुदेवेन पाण्डवः संशितव्रतः जलस्थं तं महाराज तव पुत्रं महाबलम्
      - अभ्यभाषत कौन्तेयः प्रहसन्निव भारत
    iast: "ityukto vāsudevena pāṇḍavaḥ saṃśitavrataḥ jalasthaṃ taṃ mahārāja tava putraṃ mahābalam | abhyabhāṣata kaunteyaḥ prahasanniva bhārata"
  - id: 'shalya-9-31-17'
    kind: verse
    lines:
      - सुयोधन किमर्थोऽयमारम्भोऽप्सु कृतस्त्वया
      - सर्वं क्षत्रं घातयित्वा स्वकुलं च विशाम्पते
    iast: "suyodhana kimartho'yamārambho'psu kṛtastvayā | sarvaṃ kṣatraṃ ghātayitvā svakulaṃ ca viśāmpate"
  - id: 'shalya-9-31-18'
    kind: verse
    lines:
      - जलाशयं प्रविष्टोऽद्य वाञ्छञ्जीवितमात्मनः
      - उत्तिष्ठ राजन्युध्यस्व सहास्माभिः सुयोधन
    iast: "jalāśayaṃ praviṣṭo'dya vāñchañjīvitamātmanaḥ | uttiṣṭha rājanyudhyasva sahāsmābhiḥ suyodhana"
  - id: 'shalya-9-31-19'
    kind: verse
    lines:
      - स ते दर्पो नरश्रेष्ठ स च मानः क्व ते गतः
      - यस्त्वं संस्तभ्य सलिलं भीतो राजन्व्यवस्थितः
    iast: "sa te darpo naraśreṣṭha sa ca mānaḥ kva te gataḥ | yastvaṃ saṃstabhya salilaṃ bhīto rājanvyavasthitaḥ"
  - id: 'shalya-9-31-21'
    kind: verse
    lines:
      - उत्तिष्ठ राजन्युध्यस्व क्षत्रियोऽसि कुलोद्भवः
      - कौरवेयो विशेषेण कुलं जन्म च संस्मर
    iast: "uttiṣṭha rājanyudhyasva kṣatriyo'si kulodbhavaḥ | kauraveyo viśeṣeṇa kulaṃ janma ca saṃsmara"
  - id: 'shalya-9-31-39'
    kind: verse
    lines:
      - न प्राणहेतोर्न भयाश्च विषादाद्विशाम्पते
      - इदमम्भः प्रविष्टोऽस्मि श्रमात्त्विदमनुष्ठितम्
    iast: "na prāṇahetorna bhayāśca viṣādādviśāmpate | idamambhaḥ praviṣṭo'smi śramāttvidamanuṣṭhitam"
  - id: 'shalya-9-31-46'
    kind: verse
    lines:
      - न त्विदानीमहं मन्ये कार्यं युद्धेन कर्हिचित्
      - द्रोणे कर्णे च संशान्ते निहते च पितामहे
    iast: "na tvidānīmahaṃ manye kāryaṃ yuddhena karhicit | droṇe karṇe ca saṃśānte nihate ca pitāmahe"
  - id: 'shalya-9-31-49'
    kind: verse
    lines:
      - अहं वनं गमिष्यामि ह्यजिनैः प्रतिवासितः
      - रतिर्हि नास्ति मे राज्ये हतपक्षस्य भारत
    iast: "ahaṃ vanaṃ gamiṣyāmi hyajinaiḥ prativāsitaḥ | ratirhi nāsti me rājye hatapakṣasya bhārata"
  - id: 'shalya-9-31-50'
    kind: verse
    lines:
      - हतबान्धवभूयिष्ठा हताश्वा हतकुञ्जरा
      - एषा ते पृथिवी राजन्भुङ्क्षैनां विगतज्वरः
    iast: "hatabāndhavabhūyiṣṭhā hatāśvā hatakuñjarā | eṣā te pṛthivī rājanbhuṅkṣaināṃ vigatajvaraḥ"
  - id: 'shalya-9-31-59'
    kind: verse
    lines:
      - धर्मतो याचमानानां प्रशमार्थं कुलस्य नः
      - वार्ष्णेयं प्रथमं राजन्प्रत्याख्याय महाबालम्
    iast: "dharmato yācamānānāṃ praśamārthaṃ kulasya naḥ | vārṣṇeyaṃ prathamaṃ rājanpratyākhyāya mahābālam"
  - id: 'shalya-9-31-64'
    kind: verse
    lines:
      - सूच्यग्रं नात्यजः पूर्वं स कथं त्यजसि क्षितिम्
    iast: "sūcyagraṃ nātyajaḥ pūrvaṃ sa kathaṃ tyajasi kṣitim"
  - id: 'shalya-9-31-70'
    kind: verse
    lines:
      - दहने हि कृतो यत्नस्त्वयाऽस्मासु विशेषतः आशीविषैर्विषैश्चापि जले जापि प्रवेशनैः
      - त्वया विनिकृता राजन्राज्यस्य हरणेन च
    iast: "dahane hi kṛto yatnastvayā'smāsu viśeṣataḥ āśīviṣairviṣaiścāpi jale jāpi praveśanaiḥ | tvayā vinikṛtā rājanrājyasya haraṇena ca"
  - id: 'shalya-9-31-71'
    kind: verse
    lines:
      - अप्रियाणां च वचनैर्द्रौपद्याः कर्षणेन च
      - एतस्मात्कारणात्पाप जीवितं न विद्यते
    iast: "apriyāṇāṃ ca vacanairdraupadyāḥ karṣaṇena ca | etasmātkāraṇātpāpa jīvitaṃ na vidyate"
  - id: 'shalya-9-32-38'
    kind: verse
    lines:
      - स भित्त्वा स्तम्भितं तोयं स्कन्धे कृत्वायसीं गदाम्
      - उदतिष्ठत पुत्रस्ते प्रतपन्रश्मिवानिव
    iast: "sa bhittvā stambhitaṃ toyaṃ skandhe kṛtvāyasīṃ gadām | udatiṣṭhata putraste pratapanraśmivāniva"
  - id: 'shalya-9-32-48'
    kind: verse
    lines:
      - उत्थिन्तश्च जलात्तस्मात्पुत्रो दुर्योधनस्तव
      - अतिष्ठत गदापाणी रुधिरेण समुक्षितः
    iast: "utthintaśca jalāttasmātputro duryodhanastava | atiṣṭhata gadāpāṇī rudhireṇa samukṣitaḥ"
  - id: 'shalya-9-32-52'
    kind: verse
    lines:
      - एकैकेन च मां यूयमासीदत युधिष्ठिर
      - न ह्येको बहुभिर्न्याय्यो वीरो योधयितुं युधि
    iast: "ekaikena ca māṃ yūyamāsīdata yudhiṣṭhira | na hyeko bahubhirnyāyyo vīro yodhayituṃ yudhi"
  - id: 'shalya-9-32-53'
    kind: verse
    lines:
      - न्यस्तवर्मा विशेषेण श्रान्तश्चाप्सु परिप्लुतः
      - भृशं विक्षतगात्रश्च हतवाहनसैनिकः
    iast: "nyastavarmā viśeṣeṇa śrāntaścāpsu pariplutaḥ | bhṛśaṃ vikṣatagātraśca hatavāhanasainikaḥ"
  - id: 'shalya-9-32-58'
    kind: verse
    lines:
      - यद्येकस्तु न हन्तव्यो बहुभिर्धर्म एव तु
      - तदाऽभिमन्युं बहवो निजघ्नुस्त्वन्मते कथम्
    iast: "yadyekastu na hantavyo bahubhirdharma eva tu | tadā'bhimanyuṃ bahavo nijaghnustvanmate katham"
  - id: 'shalya-9-32-59'
    kind: verse
    lines:
      - सर्वो विमृशते जन्तुः कृच्छ्रस्थो धर्मदर्शनम् पदस्थः पिहितं द्वारं परलोकस्य पश्यति
    iast: "sarvo vimṛśate jantuḥ kṛcchrastho dharmadarśanam padasthaḥ pihitaṃ dvāraṃ paralokasya paśyati"
  - id: 'shalya-9-32-61'
    kind: verse
    lines:
      - इममेकं च ते कामं वीर भूयो ददाम्यहम्
      - पञ्चानां पाण़्डवेयानां येन त्वं योद्धुमिच्छसि
    iast: "imamekaṃ ca te kāmaṃ vīra bhūyo dadāmyaham | pañcānāṃ pāṇḍaveyānāṃ yena tvaṃ yoddhumicchasi"
  - id: 'shalya-9-32-62'
    kind: verse
    lines:
      - तं हत्वा वै भवाराजा हतो वा स्वर्गमाप्नुहि
      - ऋते च जीविताद्वीर युद्धे किं कुर्म ते प्रियम्
      - सञ्जय उवाच
    iast: "taṃ hatvā vai bhavārājā hato vā svargamāpnuhi | ṛte ca jīvitādvīra yuddhe kiṃ kurma te priyam | sañjaya uvāca"
  - id: 'shalya-9-33-31'
    kind: verse
    lines:
      - ततो भीमबलो भीमो युधिष्ठिरमथाब्रवीत्
      - सृञ्जयैः सह तिष्ठन्तं तपन्तमिव भास्करम्
    iast: "tato bhīmabalo bhīmo yudhiṣṭhiramathābravīt | sṛñjayaiḥ saha tiṣṭhantaṃ tapantamiva bhāskaram"
  - id: 'shalya-9-33-32'
    kind: verse
    lines:
      - अहमेतेन सङ्गम्य संयुगे योद्धुमुत्सहे
      - न हि शक्तो रणे जेतुं मामेष पुरुषाधमः
    iast: "ahametena saṅgamya saṃyuge yoddhumutsahe | na hi śakto raṇe jetuṃ māmeṣa puruṣādhamaḥ"
  - id: 'shalya-9-33-36'
    kind: verse
    lines:
      - राजा च धृतराष्ट्रोऽद्य श्रुत्वा पुत्रं मया हतम्
      - स्मरिष्यत्यशुभं कर्म यत्तच्छकुनिबुद्धिजम्
    iast: "rājā ca dhṛtarāṣṭro'dya śrutvā putraṃ mayā hatam | smariṣyatyaśubhaṃ karma yattacchakunibuddhijam"
  - id: 'shalya-9-57-27'
    kind: verse
    lines:
      - राजा च धृतराष्ट्रोऽद्य श्रुत्वा पुत्रं निपातितम्
      - स्मरिष्यत्यशुभं कर्म यत्तच्छकुनिबुद्धिजम्
    iast: "rājā ca dhṛtarāṣṭro'dya śrutvā putraṃ nipātitam | smariṣyatyaśubhaṃ karma yattacchakunibuddhijam"
  - id: 'shalya-9-58-20'
    kind: verse
    lines:
      - उपन्यस्तमपन्यस्तं गदायुद्धविशारदौ
      - एवं तौ विचरन्तौ तु न्यघ्नतां वै परस्परम्
    iast: "upanyastamapanyastaṃ gadāyuddhaviśāradau | evaṃ tau vicarantau tu nyaghnatāṃ vai parasparam"
  - id: 'shalya-9-59-26'
    kind: verse
    lines:
      - मण्डलानि बिचित्राणि चरतोर्नृपभीमयोः
      - गदासम्पातजास्तत्र प्रजज्ञुः पावकार्चिषः
    iast: "maṇḍalāni bicitrāṇi caratornṛpabhīmayoḥ | gadāsampātajāstatra prajajñuḥ pāvakārciṣaḥ"
  - id: 'shalya-9-59-44'
    kind: verse
    lines:
      - अबुध्यद्भीमसेनस्तु राज्ञस्तस्य चिकीर्षितम्
      - अचास्य सममिद्रुत्य समुत्पत्य च सिंहवत्
    iast: "abudhyadbhīmasenastu rājñastasya cikīrṣitam | acāsya samamidrutya samutpatya ca siṃhavat"
  - id: 'shalya-9-59-45'
    kind: verse
    lines:
      - सत्या वञ्चवतो राजन्पुनरेवोत्पतिष्यतः
      - ऊरुभ्यां प्राहिणोद्राजन्गदां वेगेन पाण्डवः
    iast: "satyā vañcavato rājanpunarevotpatiṣyataḥ | ūrubhyāṃ prāhiṇodrājangadāṃ vegena pāṇḍavaḥ"
  - id: 'shalya-9-59-47'
    kind: verse
    lines:
      - स पपात नरव्याघ्रो वसुधामनुनादयन्
      - भग्नोरुर्भीमसेनेन पुत्रस्तव महीपते
    iast: "sa papāta naravyāghro vasudhāmanunādayan | bhagnorurbhīmasenena putrastava mahīpate"
  - id: 'shalya-9-60-3'
    kind: verse
    lines:
      - ततो दुर्योधनं हत्वा भीमसेनः प्रतापवान्
      - पातितं कौरवेन्द्रं तमुपगम्येदमब्रवीत्
    iast: "tato duryodhanaṃ hatvā bhīmasenaḥ pratāpavān | pātitaṃ kauravendraṃ tamupagamyedamabravīt"
  - id: 'shalya-9-60-5'
    kind: verse
    lines:
      - एवमुक्त्वा स वामेन पदा मौलिमुपास्पृशत्
      - शिरश्च राजसिंहस्य पादेन समलोडयत्
    iast: "evamuktvā sa vāmena padā maulimupāspṛśat | śiraśca rājasiṃhasya pādena samaloḍayat"
  - id: 'shalya-9-60-14'
    kind: verse
    lines:
      - तव पुत्रं तथा हत्वा कत्थमानं वृकोदरम्
      - नृत्यमानं च बहुशो धर्मराजोऽब्रवीदिदम्
    iast: "tava putraṃ tathā hatvā katthamānaṃ vṛkodaram | nṛtyamānaṃ ca bahuśo dharmarājo'bravīdidam"
  - id: 'shalya-9-60-15'
    kind: verse
    lines:
      - गतोऽसि वैरस्यानृण्यं प्रतिज्ञा पूरिता त्वया
      - शुभेनाथाशुभेनैव कर्मणा विरमाधुना
    iast: "gato'si vairasyānṛṇyaṃ pratijñā pūritā tvayā | śubhenāthāśubhenaiva karmaṇā viramādhunā"
  - id: 'shalya-9-60-16'
    kind: verse
    lines:
      - मा शिरोऽस्य पदाऽमर्दीर्मा धर्मस्तेऽतिगो भवेत्
      - राजा ज्ञातिर्हतश्चायं नैतन्न्याय्यं तवानघ
    iast: "mā śiro'sya padā'mardīrmā dharmaste'tigo bhavet | rājā jñātirhataścāyaṃ naitannyāyyaṃ tavānagha"
  - id: 'shalya-9-60-21'
    kind: verse
    lines:
      - इत्युक्त्वा भीमसेनं तु साश्रुकण्ठो युधिष्ठिरः
      - उपसृत्याब्रवीद्दीनो दुर्योधनमरिन्दमम्
    iast: "ityuktvā bhīmasenaṃ tu sāśrukaṇṭho yudhiṣṭhiraḥ | upasṛtyābravīddīno duryodhanamarindamam"
  - id: 'shalya-9-60-24'
    kind: verse
    lines:
      - आत्मनो ह्यपराधेन महद्व्यसनमीहशम्
      - प्राप्तवानसि यल्लोभान्मदाद्बाल्याच्च भारत
    iast: "ātmano hyaparādhena mahadvyasanamīhaśam | prāptavānasi yallobhānmadādbālyācca bhārata"
  - id: 'shalya-9-60-27'
    kind: verse
    lines:
      - आत्मा न शोचनीयस्ते श्लाघ्यो मृत्युस्तवानघ
      - वयमेवाधुना शोच्याः सर्वावस्थासु कौरव
    iast: "ātmā na śocanīyaste ślāghyo mṛtyustavānagha | vayamevādhunā śocyāḥ sarvāvasthāsu kaurava"
  - id: 'shalya-9-62-22'
    kind: verse
    lines:
      - रथेष्वारोहत क्षिप्रं गच्छामो वसुधाधिपाः
      - दिष्ट्या हतोऽयं पापात्मा सामात्यज्ञातिबान्धवः
    iast: "ratheṣvārohata kṣipraṃ gacchāmo vasudhādhipāḥ | diṣṭyā hato'yaṃ pāpātmā sāmātyajñātibāndhavaḥ"
  - id: 'shalya-9-62-23'
    kind: verse
    lines:
      - इति श्रुत्वा त्वधिक्षेपं कृष्णाद्दुर्योधनो नृपः
      - अमर्षवशमापन्न उदतिष्ठद्विशाम्पते
    iast: "iti śrutvā tvadhikṣepaṃ kṛṣṇādduryodhano nṛpaḥ | amarṣavaśamāpanna udatiṣṭhadviśāmpate"
  - id: 'shalya-9-62-24'
    kind: verse
    lines:
      - स्फिग्देशेनोपविष्टः स दोर्भ्यां विष्टभ्य मेदिनीम्
      - दृष्टिं भ्रूसङ्कटां कृत्वा वासुदेवे न्यपातयत्
    iast: "sphigdeśenopaviṣṭaḥ sa dorbhyāṃ viṣṭabhya medinīm | dṛṣṭiṃ bhrūsaṅkaṭāṃ kṛtvā vāsudeve nyapātayat"
  - id: 'shalya-9-62-28'
    kind: verse
    lines:
      - किं न विज्ञातमेतन्मे यदर्जुनमवोचथाः घातयित्वा महीपालानृजुयुद्धान्सहस्रशः
      - जिह्मैरुपायैर्बहुभिर्न ते लज्जा न ते घृणा
    iast: "kiṃ na vijñātametanme yadarjunamavocathāḥ ghātayitvā mahīpālānṛjuyuddhānsahasraśaḥ | jihmairupāyairbahubhirna te lajjā na te ghṛṇā"
  - id: 'shalya-9-62-36'
    kind: verse
    lines:
      - यदि मां चापि कर्णं च भीष्मद्रोणौ च संयुगे
      - ऋजुना प्रतियुध्येथा न ते स्याद्विजयो ध्रुवम्
    iast: "yadi māṃ cāpi karṇaṃ ca bhīṣmadroṇau ca saṃyuge | ṛjunā pratiyudhyethā na te syādvijayo dhruvam"
  - id: 'shalya-9-62-58'
    kind: verse
    lines:
      - लोभेनातिबलेन त्वं तृष्णया च वशीकृतः कृतवानस्यकार्याणि विपाकस्तस्य भुज्यताम्
      - दुर्योधन उवाच
    iast: "lobhenātibalena tvaṃ tṛṣṇayā ca vaśīkṛtaḥ kṛtavānasyakāryāṇi vipākastasya bhujyatām | duryodhana uvāca"
  - id: 'shalya-9-62-60'
    kind: verse
    lines:
      - यदिष्टं क्षत्रबन्धूनां स्वधर्ममनुपश्यताम्
      - तदिदं निधनं प्राप्तं को नु स्वन्ततरो मया
    iast: "yadiṣṭaṃ kṣatrabandhūnāṃ svadharmamanupaśyatām | tadidaṃ nidhanaṃ prāptaṃ ko nu svantataro mayā"
  - id: 'shalya-9-62-62'
    kind: verse
    lines:
      - ससुहृत्सानुबन्धस्च स्वर्गं गन्ताऽहमच्युत
      - यूयं गर्हितसङ्कल्पाः शोचन्तो वर्तयिष्यथ
    iast: "sasuhṛtsānubandhasca svargaṃ gantā'hamacyuta | yūyaṃ garhitasaṅkalpāḥ śocanto vartayiṣyatha"
  - id: 'shalya-9-62-63'
    kind: verse
    lines:
      - न मे विषादो भीमेन पादेन शिर आहतम्
      - काका वा कङ्कगृध्रा वा निधास्यन्ति पदं क्षणात्
      - सञ्जय उवाच
    iast: "na me viṣādo bhīmena pādena śira āhatam | kākā vā kaṅkagṛdhrā vā nidhāsyanti padaṃ kṣaṇāt | sañjaya uvāca"
  - id: 'shalya-9-62-64'
    kind: verse
    lines:
      - अस्य वाक्यस्य निधने कुरुराजस्य धीमतः
      - अपतत्सुमहद्वर्षं पुष्पाणां पुण्यगन्धिनाम्
    iast: "asya vākyasya nidhane kururājasya dhīmataḥ | apatatsumahadvarṣaṃ puṣpāṇāṃ puṇyagandhinām"
  - id: 'shalya-9-63-1'
    kind: verse
    lines:
      - ततस्ते प्रययुः सर्वे निवासाय महीक्षितः
      - शङ्खान्प्रध्मापयन्तो वै हृष्टाः परिघबाहवः
    iast: "tataste prayayuḥ sarve nivāsāya mahīkṣitaḥ | śaṅkhānpradhmāpayanto vai hṛṣṭāḥ parighabāhavaḥ"
  - id: 'shalya-9-63-45'
    kind: verse
    lines:
      - अथाब्रवीन्महाराज वासुदेवो महायशाः
      - अस्माभिर्मङ्गलार्थाय वस्तव्यं शिबिराद्बहिः
    iast: "athābravīnmahārāja vāsudevo mahāyaśāḥ | asmābhirmaṅgalārthāya vastavyaṃ śibirādbahiḥ"
  - id: 'shalya-9-63-46'
    kind: verse
    lines:
      - तथेत्युक्त्वा हि ते सर्वे पाण्डवाः सात्यकिस्तथा
      - वासुदेवेन सहिता मङ्गलार्थं बहिर्ययुः
    iast: "tathetyuktvā hi te sarve pāṇḍavāḥ sātyakistathā | vāsudevena sahitā maṅgalārthaṃ bahiryayuḥ"
  - id: 'shalya-9-63-49'
    kind: verse
    lines:
      - तत्र ते गमनं माप्तं रोचते तव माधव
      - गान्धार्याः क्रोधदीप्तायाः प्रशमार्थमरिन्दम
    iast: "tatra te gamanaṃ māptaṃ rocate tava mādhava | gāndhāryāḥ krodhadīptāyāḥ praśamārthamarindama"
  - id: 'shalya-9-63-51'
    kind: verse
    lines:
      - ततः सम्प्रेषयामासुर्यादवं नागसाह्वयम्
    iast: "tataḥ sampreṣayāmāsuryādavaṃ nāgasāhvayam"
  - id: 'shalya-9-64-38'
    kind: verse
    lines:
      - स मुहूर्तादिवोत्सृज्य बाष्पं शोकसमुद्भवम् प्रक्षाल्य वारिणा नेत्रे ह्याचम्य च यथाविधि
      - उवाच प्रश्रितं वाक्यं धृतराष्ट्रमरिन्दमः
    iast: "sa muhūrtādivotsṛjya bāṣpaṃ śokasamudbhavam prakṣālya vāriṇā netre hyācamya ca yathāvidhi | uvāca praśritaṃ vākyaṃ dhṛtarāṣṭramarindamaḥ"
  - id: 'shalya-9-64-45'
    kind: verse
    lines:
      - भीष्मेण सोमदत्तेन बाह्लीकेन कृपेण च द्रोणेन च सपुत्रेण विदुरेण च धीमता
      - याचितस्त्वं शमं नित्यं न च तत्कृतवानसि
    iast: "bhīṣmeṇa somadattena bāhlīkena kṛpeṇa ca droṇena ca saputreṇa vidureṇa ca dhīmatā | yācitastvaṃ śamaṃ nityaṃ na ca tatkṛtavānasi"
  - id: 'shalya-9-64-48'
    kind: verse
    lines:
      - अल्पोप्यतिक्रमो नास्ति पाण्डवानां महात्मनाम्
      - धर्मतो न्यायतश्चैव स्नेहतश्च परन्तप
    iast: "alpopyatikramo nāsti pāṇḍavānāṃ mahātmanām | dharmato nyāyataścaiva snehataśca parantapa"
  - id: 'shalya-9-64-50'
    kind: verse
    lines:
      - कुलं वंशश्च पिण्डाश्च यच्च पुत्रकृत फलम्
      - गान्धार्यास्तव वै नाथ पाण्डवेषु प्रतिष्ठितम्
    iast: "kulaṃ vaṃśaśca piṇḍāśca yacca putrakṛta phalam | gāndhāryāstava vai nātha pāṇḍaveṣu pratiṣṭhitam"
  - id: 'shalya-9-64-52'
    kind: verse
    lines:
      - एतत्सर्वमनुध्याय आत्मनश्च व्यतिक्रमम्
      - शिवेन पाण्डवान्ध्याहि नमस्ते भरतर्षभ
    iast: "etatsarvamanudhyāya ātmanaśca vyatikramam | śivena pāṇḍavāndhyāhi namaste bharatarṣabha"
  - id: 'shalya-9-64-57'
    kind: verse
    lines:
      - एवमुक्त्वा महाराज धृतराष्ट्रं यदूत्तमः
      - उवाच परमं वाक्यं गान्धारीं शोककर्शिताम्
    iast: "evamuktvā mahārāja dhṛtarāṣṭraṃ yadūttamaḥ | uvāca paramaṃ vākyaṃ gāndhārīṃ śokakarśitām"
  - id: 'shalya-9-64-59'
    kind: verse
    lines:
      - जानासि च यथा राज्ञि सभायां मम सन्निधौ
      - धर्मार्थसहितं वाक्यमुभयोः पक्षयोर्हितम्
    iast: "jānāsi ca yathā rājñi sabhāyāṃ mama sannidhau | dharmārthasahitaṃ vākyamubhayoḥ pakṣayorhitam"
  - id: 'shalya-9-64-60'
    kind: verse
    lines:
      - उक्तवत्यसि कल्याणि न च ते तनयैः कृतम्
      - दुर्योधनस्त्वया चोक्तो जयार्थी परुषं वचः
    iast: "uktavatyasi kalyāṇi na ca te tanayaiḥ kṛtam | duryodhanastvayā cokto jayārthī paruṣaṃ vacaḥ"
  - id: 'a6-64-61'
    kind: verse
    lines:
      - शृणु मूढ वचो मह्यं यतो धर्मस्ततो जयः
      - तदिदं समनुप्राप्तं तव वाक्यं नृपात्मजे
    iast: "śṛṇu mūḍha vaco mahyaṃ yato dharmastato jayaḥ | tadidaṃ samanuprāptaṃ tava vākyaṃ nṛpātmaje"
  - id: 'shalya-9-64-62'
    kind: verse
    lines:
      - एवं विदित्वा कल्याणि मा स्म शोके मनः कृथाः
      - पाण्डवानां विनाशाय मा ते बुद्धिः कदाचन
    iast: "evaṃ viditvā kalyāṇi mā sma śoke manaḥ kṛthāḥ | pāṇḍavānāṃ vināśāya mā te buddhiḥ kadācana"
  - id: 'shalya-9-64-69'
    kind: verse
    lines:
      - समाश्वास्य च गान्धारीं धृतराष्ट्रं च माधवः
      - द्रौणिसङ्कल्पितं भावमन्वबुध्यत केशवः
    iast: "samāśvāsya ca gāndhārīṃ dhṛtarāṣṭraṃ ca mādhavaḥ | drauṇisaṅkalpitaṃ bhāvamanvabudhyata keśavaḥ"
  - id: 'shalya-9-64-78'
    kind: verse
    lines:
      - आगम्य शिबिरं रात्रौ सोऽभ्यगच्छत पाण्डवान्
      - तच्च तेभ्यः समाख्याय सहितस्तैः समाहितः
    iast: "āgamya śibiraṃ rātrau so'bhyagacchata pāṇḍavān | tacca tebhyaḥ samākhyāya sahitastaiḥ samāhitaḥ"
  - id: 'shalya-9-66-2'
    kind: verse
    lines:
      - विनिर्भिन्नाः शितैर्बाणैर्णदातोमरशक्तिभिः अश्वत्थामा कृपश्चैव कृतवर्मा च सात्वतः
      - त्वरिता जवनैरश्वैरायोधनमुपागमन्
    iast: "vinirbhinnāḥ śitairbāṇairṇadātomaraśaktibhiḥ aśvatthāmā kṛpaścaiva kṛtavarmā ca sātvataḥ | tvaritā javanairaśvairāyodhanamupāgaman"
  - id: 'shalya-9-66-3'
    kind: verse
    lines:
      - तत्रापश्यन्महात्मानं धार्तराष्ट्रं निपातितम्
      - प्रभग्नं वायुवेगेन महासालं यथा वने
    iast: "tatrāpaśyanmahātmānaṃ dhārtarāṣṭraṃ nipātitam | prabhagnaṃ vāyuvegena mahāsālaṃ yathā vane"
  - id: 'shalya-9-66-31'
    kind: verse
    lines:
      - तथा दृष्ट्वा तु राजानं बाष्पशोकसमन्वितम्
      - द्रौणिः क्रोधेन जज्वाल यथा वह्निर्जगत्क्षये
    iast: "tathā dṛṣṭvā tu rājānaṃ bāṣpaśokasamanvitam | drauṇiḥ krodhena jajvāla yathā vahnirjagatkṣaye"
  - id: 'shalya-9-66-35'
    kind: verse
    lines:
      - अद्याहं सर्वपाञ्चालान्वासुदेवस्य पश्यतः
      - अद्य रात्रौ महाराज निहनिष्यामि पाण्डवान्
    iast: "adyāhaṃ sarvapāñcālānvāsudevasya paśyataḥ | adya rātrau mahārāja nihaniṣyāmi pāṇḍavān"
  - id: 'shalya-9-66-41'
    kind: verse
    lines:
      - राज्ञस्तु वचनं श्रुत्वा कृपः शारद्वतस्ततः
      - द्रौणिं राज्ञो नियोगेन सैनापत्येऽभ्यषेचयत्
    iast: "rājñastu vacanaṃ śrutvā kṛpaḥ śāradvatastataḥ | drauṇiṃ rājño niyogena saināpatye'bhyaṣecayat"
  - id: 'sauptika-10-1-24'
    kind: verse
    lines:
      - ततोऽस्तं पर्वतश्रेष्ठमनुप्राप्ते दिवाकरे
      - सर्वस्य जगतो धात्री शर्वरी प्रत्यपद्यत
    iast: "tato'staṃ parvataśreṣṭhamanuprāpte divākare | sarvasya jagato dhātrī śarvarī pratyapadyata"
  - id: 'sauptika-10-1-27'
    kind: verse
    lines:
      - रात्रिञ्चराणां सत्वानां निनादोऽभूत्सुदारुणः
      - क्रव्यादाश्च प्रमुदिता घोरा प्राप्ता च शर्वरी
    iast: "rātriñcarāṇāṃ satvānāṃ ninādo'bhūtsudāruṇaḥ | kravyādāśca pramuditā ghorā prāptā ca śarvarī"
  - id: 'sauptika-10-6-2'
    kind: verse
    lines:
      - कृतवर्माणमामन्त्र्य कृपं च स महारथः
      - द्रौणिर्मन्युपरीतात्मा शिबिरद्वारमासदत्
    iast: "kṛtavarmāṇamāmantrya kṛpaṃ ca sa mahārathaḥ | drauṇirmanyuparītātmā śibiradvāramāsadat"
  - id: 'sauptika-10-8-14'
    kind: verse
    lines:
      - धृष्टद्युम्नस्य निलयं शनकैरभ्युपागमत्
    iast: "dhṛṣṭadyumnasya nilayaṃ śanakairabhyupāgamat"
  - id: 'sauptika-10-8-23'
    kind: verse
    lines:
      - तस्य कण्ठेऽथ बद्ध्वा तां त्वरितः क्रोधमूर्च्छितः द्रौणिः क्रूरं मनः कृत्वा पाञ्चाल्यमवधीत्तदा
    iast: "tasya kaṇṭhe'tha baddhvā tāṃ tvaritaḥ krodhamūrcchitaḥ drauṇiḥ krūraṃ manaḥ kṛtvā pāñcālyamavadhīttadā"
  - id: 'sauptika-10-8-46'
    kind: verse
    lines:
      - संसुप्तानेव राजेन्द्र तत्र तत्र महारथान् पाञ्चालवीरानाक्रम्य क्रुद्धो न्यहनदन्तिके
      - स्फुरतो वेपमानांश्च शमितेव पशून्मखे
    iast: "saṃsuptāneva rājendra tatra tatra mahārathān pāñcālavīrānākramya kruddho nyahanadantike | sphurato vepamānāṃśca śamiteva paśūnmakhe"
  - id: 'sauptika-10-8-54'
    kind: verse
    lines:
      - स घोररूपो व्यचरत्कालवच्छिबिरे तदा
      - अपश्यद्द्रौपदीपुत्रानवशिष्टांश्च सोमकान्
    iast: "sa ghorarūpo vyacaratkālavacchibire tadā | apaśyaddraupadīputrānavaśiṣṭāṃśca somakān"
  - id: 'sauptika-10-8-72'
    kind: verse
    lines:
      - स तु क्रोधसमाविष्टो द्रोणपुत्रो महाबलः
      - शिखण्डिनं समासाद्य द्विधा चिच्छेद सोसिना
    iast: "sa tu krodhasamāviṣṭo droṇaputro mahābalaḥ | śikhaṇḍinaṃ samāsādya dvidhā ciccheda sosinā"
  - id: 'sauptika-10-8-115'
    kind: verse
    lines:
      - नामुच्यत तयोः कश्चिन्निष्क्रान्तः शिबिराद्बहिः कृपश्चैव महाराज हार्दिक्यश्चैव दुर्मतिः
    iast: "nāmucyata tayoḥ kaścinniṣkrāntaḥ śibirādbahiḥ kṛpaścaiva mahārāja hārdikyaścaiva durmatiḥ"
  - id: 'sauptika-10-8-116'
    kind: verse
    lines:
      - भूयश्चैव चिकीर्षन्तौ द्रौणपुत्रस्य तौ प्रियम्
      - त्रिषु देशेषु ददतुः शिबिरस्य हुताशनम्
    iast: "bhūyaścaiva cikīrṣantau drauṇaputrasya tau priyam | triṣu deśeṣu dadatuḥ śibirasya hutāśanam"
  - id: 'sauptika-10-8-137'
    kind: verse
    lines:
      - तस्या रजन्यास्त्वर्धेन पाण्डवानां महद्बलम्
      - गमयामास राजेन्द्र द्रौणिर्यमनिवेशनम्
    iast: "tasyā rajanyāstvardhena pāṇḍavānāṃ mahadbalam | gamayāmāsa rājendra drauṇiryamaniveśanam"
  - id: 'sauptika-10-8-159'
    kind: verse
    lines:
      - निष्क्रम्य शिबिरात्तस्मात्ताभ्यां सङ्गम्य वीर्यवान्
      - आचख्यौ कर्म तत्सर्वं हृष्टः संहर्षयन्विभो
    iast: "niṣkramya śibirāttasmāttābhyāṃ saṅgamya vīryavān | ācakhyau karma tatsarvaṃ hṛṣṭaḥ saṃharṣayanvibho"
  - id: 'sauptika-10-9-47'
    kind: verse
    lines:
      - इत्येवमुक््वा राजानं भग्नसक्थमचेतसम्
      - अश्वत्थामा लघुप्राणं पुनर्वचनमब्रवीत्
    iast: "ityevamukvā rājānaṃ bhagnasakthamacetasam | aśvatthāmā laghuprāṇaṃ punarvacanamabravīt"
  - id: 'sauptika-10-9-48'
    kind: verse
    lines:
      - दुर्योधन जीवसि चेद्वाक्यं श्रोत्रमुखं शृणु
      - सप् पाण्डवतः शिष्टा धार्तराष्ट्रास्त्रयो वयम्
    iast: "duryodhana jīvasi cedvākyaṃ śrotramukhaṃ śṛṇu | sap pāṇḍavataḥ śiṣṭā dhārtarāṣṭrāstrayo vayam"
  - id: 'sauptika-10-9-50'
    kind: verse
    lines:
      - द्रौपदेया हताः सर्वे धृष्टद्युम्नस्य चात्मजाः
      - पञ्चाला निहताः सर्वे मत्स्यशेषं च भारत
    iast: "draupadeyā hatāḥ sarve dhṛṣṭadyumnasya cātmajāḥ | pañcālā nihatāḥ sarve matsyaśeṣaṃ ca bhārata"
  - id: 'sauptika-10-9-51'
    kind: verse
    lines:
      - कृते प्रतिकृतं पश्य हतपुत्रा हि पाण्डवाः
      - सौप्तिके शिबिरं तेषां हतं सनरवाहनम्
    iast: "kṛte pratikṛtaṃ paśya hataputrā hi pāṇḍavāḥ | sauptike śibiraṃ teṣāṃ hataṃ sanaravāhanam"
  - id: 'sauptika-10-9-54'
    kind: verse
    lines:
      - न मेऽकरोत्द्गाङ्गेयो न कर्णो न च ते पिता
      - यत्त्वया कृपभोजाभ्यां सहितेनाद्य मे कृतम्
    iast: "na me'karotdgāṅgeyo na karṇo na ca te pitā | yattvayā kṛpabhojābhyāṃ sahitenādya me kṛtam"
  - id: 'sauptika-10-9-58'
    kind: verse
    lines:
      - एवं ते निधनं यातः पुत्रो दुर्योधनो नृप
      - अग्रे यात्वा रणे शूरः पश्राद्विनिहतः परैः
    iast: "evaṃ te nidhanaṃ yātaḥ putro duryodhano nṛpa | agre yātvā raṇe śūraḥ paśrādvinihataḥ paraiḥ"
  - id: 'sauptika-10-10-1'
    kind: verse
    lines:
      - तस्यां रात्र्यां व्यतीतायां धृष्टद्युम्नस्य सारथिः
      - गत्वा शशंस पाण्डुभ्यः सौप्तिके कदनं कृतम्
      - सूत उवाच
    iast: "tasyāṃ rātryāṃ vyatītāyāṃ dhṛṣṭadyumnasya sārathiḥ | gatvā śaśaṃsa pāṇḍubhyaḥ sauptike kadanaṃ kṛtam | sūta uvāca"
  - id: 'sauptika-10-10-10'
    kind: verse
    lines:
      - अगम्या गतिरर्थानां कर्मणामीश्वरस्य च दुर्विदा गतिरर्थानामपि ये दिव्यचक्षुषः
      - जीयमाना जयन्त्यन्ये जयमाना वयं जिताः
    iast: "agamyā gatirarthānāṃ karmaṇāmīśvarasya ca durvidā gatirarthānāmapi ye divyacakṣuṣaḥ | jīyamānā jayantyanye jayamānā vayaṃ jitāḥ"
  - id: 'sauptika-10-10-16'
    kind: verse
    lines:
      - क्रुद्धस्य नरसिंहस्य सङ्ग्रामेष्वपलायिनः
      - ये व्यमुञ्चन्त कर्णस्य प्रमादात्त इमे हताः
    iast: "kruddhasya narasiṃhasya saṅgrāmeṣvapalāyinaḥ | ye vyamuñcanta karṇasya pramādātta ime hatāḥ"
  - id: 'sauptika-10-10-19'
    kind: verse
    lines:
      - न हि प्रमादात्परमस्ति कश्चद्वधो नराणामिह जीवलोके
      - प्रमत्तमर्था हि नरं समन्तात्त्यजन्त्यनर्थाश्च समाविशन्ति
    iast: "na hi pramādātparamasti kaścadvadho narāṇāmiha jīvaloke | pramattamarthā hi naraṃ samantāttyajantyanarthāśca samāviśanti"
  - id: 'sauptika-10-10-23'
    kind: verse
    lines:
      - इन्द्रोपमान्पार्थिवपुत्रपौत्रान्पश्याविशेषेण हतान्प्रमादात्
      - तीर्त्वा समुद्रं जणिजः समृद्वा मग्नाः कुनद्यामिव सीदमानाः
    iast: "indropamānpārthivaputrapautrānpaśyāviśeṣeṇa hatānpramādāt | tīrtvā samudraṃ jaṇijaḥ samṛdvā magnāḥ kunadyāmiva sīdamānāḥ"
  - id: 'sauptika-10-11-7'
    kind: verse
    lines:
      - कम्पमानेव कदली वातेनाभिसमीरिता
      - कृष्णा राजानमासाद्य शोकार्ता न्यपतद्भुवि
    iast: "kampamāneva kadalī vātenābhisamīritā | kṛṣṇā rājānamāsādya śokārtā nyapatadbhuvi"
  - id: 'sauptika-10-11-10'
    kind: verse
    lines:
      - सा समाश्वासिता तेन भीमसेनेन भामिनी
      - रुदती पाण्डवज्येष्ठमिदं वचनमब्रवीत्
    iast: "sā samāśvāsitā tena bhīmasenena bhāminī | rudatī pāṇḍavajyeṣṭhamidaṃ vacanamabravīt"
  - id: 'sauptika-10-11-21'
    kind: verse
    lines:
      - द्रोणपुत्रस्य सहजो मणिः शिरसि मे श्रुतः निहत्य सङ्ख्ये तं पापं पश्येयं मणिमाहृतम्
      - द्रौणेः शिरस उत्कृत्य जीवेयमिति मे मतिः
    iast: "droṇaputrasya sahajo maṇiḥ śirasi me śrutaḥ nihatya saṅkhye taṃ pāpaṃ paśyeyaṃ maṇimāhṛtam | drauṇeḥ śirasa utkṛtya jīveyamiti me matiḥ"
  - id: 'sauptika-10-13-16'
    kind: verse
    lines:
      - तमभ्यधावत्कौन्तेयः प्रगृह्य सशरं धनुः
      - भीमसेनो महाबाहुस्तिष्ठतिष्ठेति चाब्रवीत्
    iast: "tamabhyadhāvatkaunteyaḥ pragṛhya saśaraṃ dhanuḥ | bhīmaseno mahābāhustiṣṭhatiṣṭheti cābravīt"
  - id: 'sauptika-10-13-18'
    kind: verse
    lines:
      - स तद्दिव्यमदीनात्मा परमास््रमचिन्तयत्
      - जग्राह च शरैषीकां द्रौणिः सव्येन पाणिना
    iast: "sa taddivyamadīnātmā paramāsramacintayat | jagrāha ca śaraiṣīkāṃ drauṇiḥ savyena pāṇinā"
  - id: 'sauptika-10-13-20'
    kind: verse
    lines:
      - इत्युक्त्वा राजशार्दूल द्रोणपुत्रः प्रतापवान्
      - सर्वलोकप्रमोहार्थं तदस््रं प्रमुमोच ह
    iast: "ityuktvā rājaśārdūla droṇaputraḥ pratāpavān | sarvalokapramohārthaṃ tadasraṃ pramumoca ha"
  - id: 'sauptika-10-14-3'
    kind: verse
    lines:
      - भ्रातॄणामात्मनश्चैव परित्राणाय भारत
      - विसृजैतत्त्वमप्याजावस्त्रमस्त्रनिवारणम्
    iast: "bhrātṝṇāmātmanaścaiva paritrāṇāya bhārata | visṛjaitattvamapyājāvastramastranivāraṇam"
  - id: 'sauptika-10-14-4'
    kind: verse
    lines:
      - केशवेनैवमुक्तोऽथ पाण्डवः परवीरहा
      - अवातरद्रथात्तूर्णं प्रगृह्य सशरं धनुः
    iast: "keśavenaivamukto'tha pāṇḍavaḥ paravīrahā | avātaradrathāttūrṇaṃ pragṛhya saśaraṃ dhanuḥ"
  - id: 'sauptika-10-14-6'
    kind: verse
    lines:
      - देवताभ्यो नमस्कृत्य गुरुभ्यश्चैव सर्वशः
      - उत्ससर्ज शिवं ध्यायन्नस्त्रमस्त्रेण शाम्यताम्
    iast: "devatābhyo namaskṛtya gurubhyaścaiva sarvaśaḥ | utsasarja śivaṃ dhyāyannastramastreṇa śāmyatām"
  - id: 'sauptika-10-14-12'
    kind: verse
    lines:
      - नारदः सर्वधर्मात्मा भरतानां पितामहः
      - उभौ शमयितुं वीरौ भारद्वाजधनञ्जयौ
    iast: "nāradaḥ sarvadharmātmā bharatānāṃ pitāmahaḥ | ubhau śamayituṃ vīrau bhāradvājadhanañjayau"
  - id: 'sauptika-10-14-13'
    kind: verse
    lines:
      - तौ मुनी सर्वधर्मज्ञौ सर्वभूतहितैपिणौ
      - दीप्तयोरस््रयोर्मध्ये स्थितौ परमतेजसौ
    iast: "tau munī sarvadharmajñau sarvabhūtahitaipiṇau | dīptayorasrayormadhye sthitau paramatejasau"
  - id: 'sauptika-10-15-1'
    kind: verse
    lines:
      - दृष्टैव मुनिशार्दूलौ तावग्निसमतेजसौ गाण्डीवधन्वा सञ्चिन्त्य प्राप्तकालं महारथः
      - सञ्जहार शरं दिव्यं त्वरमाणो धनञ्जयः
    iast: "dṛṣṭaiva muniśārdūlau tāvagnisamatejasau gāṇḍīvadhanvā sañcintya prāptakālaṃ mahārathaḥ | sañjahāra śaraṃ divyaṃ tvaramāṇo dhanañjayaḥ"
  - id: 'sauptika-10-15-12'
    kind: verse
    lines:
      - अशक्तः प्रतिसंहारे परमास्त्रस्य संयुगे
      - द्रौणिर्दीनमना राजन्द्वैपायनमभाषत
    iast: "aśaktaḥ pratisaṃhāre paramāstrasya saṃyuge | drauṇirdīnamanā rājandvaipāyanamabhāṣata"
  - id: 'sauptika-10-15-43'
    kind: verse
    lines:
      - ततः परममस्त्रं तु द्रौणिरुद्यतमाहवे
      - द्वैपायनमनादृत्य गर्भेषु प्रमुमोच ह
    iast: "tataḥ paramamastraṃ tu drauṇirudyatamāhave | dvaipāyanamanādṛtya garbheṣu pramumoca ha"
  - id: 'sauptika-10-16-1'
    kind: verse
    lines:
      - तदाज्ञाय हृषीकेशो विकृष्टं पापकर्मणा
      - हृष्यमाण इदं वाक्यं द्रौणिं प्रत्यब्रवीत्तदा
    iast: "tadājñāya hṛṣīkeśo vikṛṣṭaṃ pāpakarmaṇā | hṛṣyamāṇa idaṃ vākyaṃ drauṇiṃ pratyabravīttadā"
  - id: 'sauptika-10-16-4'
    kind: verse
    lines:
      - तस्य तद्वचनं साधोः सत्यमेद्भविष्यति
      - परिक्षिद्भविता ह्येषां पुनर्वंशकरः सुतः
    iast: "tasya tadvacanaṃ sādhoḥ satyamedbhaviṣyati | parikṣidbhavitā hyeṣāṃ punarvaṃśakaraḥ sutaḥ"
  - id: 'sauptika-10-16-12'
    kind: verse
    lines:
      - परिक्षिन्नाम नृपतिर्मिषतस्ते सुदुर्मते अहं तं जीवयिष्यामि दग्धं शस्त्राग्नितेजसा
    iast: "parikṣinnāma nṛpatirmiṣataste sudurmate ahaṃ taṃ jīvayiṣyāmi dagdhaṃ śastrāgnitejasā"
  - id: 'sauptika-10-16-16'
    kind: verse
    lines:
      - प्रदायाथ मणिं द्रौणिः पाण्डवानां महात्मनाम्
      - जगाम विमनास्तेषां सर्वेषां पश्यतां वनम्
    iast: "pradāyātha maṇiṃ drauṇiḥ pāṇḍavānāṃ mahātmanām | jagāma vimanāsteṣāṃ sarveṣāṃ paśyatāṃ vanam"
  - id: 'sauptika-10-16-18'
    kind: verse
    lines:
      - द्रोणपुत्रस्य सहजं मणिमादाय सत्वराः
      - द्रौपदीमभ्यधावन्त प्रायोपेतां मनस्विनीम्
      - वैशम्पयन उवाच
    iast: "droṇaputrasya sahajaṃ maṇimādāya satvarāḥ | draupadīmabhyadhāvanta prāyopetāṃ manasvinīm | vaiśampayana uvāca"
  - id: 'sauptika-10-16-30'
    kind: verse
    lines:
      - केवलानृण्यमाप्ताऽस्मि गुरुपुत्रो गुरुर्मम
      - शिरस्येतं मणिं राजा ग्रहीतुमनघोऽर्हति
    iast: "kevalānṛṇyamāptā'smi guruputro gururmama | śirasyetaṃ maṇiṃ rājā grahītumanagho'rhati"
  - id: 'sauptika-10-16-32'
    kind: verse
    lines:
      - ततो दिव्यं मणिवरं शिरसा धारयन्प्रभुः
      - शुशुभे स तदा राजा सचन्द्र इव पर्वतः
    iast: "tato divyaṃ maṇivaraṃ śirasā dhārayanprabhuḥ | śuśubhe sa tadā rājā sacandra iva parvataḥ"
  - id: 'strI-11-9-8'
    kind: verse
    lines:
      - ततः प्रणादः सञ्जज्ञे सर्वेषु कुरुवेश्मसु
      - आकुमारं पुरं सर्वमभवच्छोककर्शितम्
    iast: "tataḥ praṇādaḥ sañjajñe sarveṣu kuruveśmasu | ākumāraṃ puraṃ sarvamabhavacchokakarśitam"
  - id: 'strI-11-9-9'
    kind: verse
    lines:
      - अदृष्टपूर्वा या नार्यः पुरा देवगणैरपि
      - पृथग्जनेन दृश्यन्ते तास्तदा निहतेश्वराः
    iast: "adṛṣṭapūrvā yā nāryaḥ purā devagaṇairapi | pṛthagjanena dṛśyante tāstadā nihateśvarāḥ"
  - id: 'strI-11-9-17'
    kind: verse
    lines:
      - ताभिः परिवृतो राजा रुदतीभिः सहस्रशः
      - निर्ययौ नगराद्दीनस्तूर्णमायोधनं प्रति
    iast: "tābhiḥ parivṛto rājā rudatībhiḥ sahasraśaḥ | niryayau nagarāddīnastūrṇamāyodhanaṃ prati"
  - id: 'strI-11-11-1'
    kind: verse
    lines:
      - हतेषु सर्वेसैन्येषु धर्मराजो युधिष्ठिरः
      - शुश्रुवे पितरं वृद्धं निर्यान्तं गजसाह्वयात्
    iast: "hateṣu sarvesainyeṣu dharmarājo yudhiṣṭhiraḥ | śuśruve pitaraṃ vṛddhaṃ niryāntaṃ gajasāhvayāt"
  - id: 'strI-11-11-2'
    kind: verse
    lines:
      - सोऽभ्ययात्पुत्रशोकार्तं पुत्रशोकपरिप्लुतः
      - शोचमानो महाराज भ्रातृभिः सहितस्तदा
    iast: "so'bhyayātputraśokārtaṃ putraśokapariplutaḥ | śocamāno mahārāja bhrātṛbhiḥ sahitastadā"
  - id: 'strI-11-11-3'
    kind: verse
    lines:
      - अन्वीयमानो वीरेण दाशार्हेण महात्मना
      - युयुधानेन च तथा तथैव च युयुत्सुना
    iast: "anvīyamāno vīreṇa dāśārheṇa mahātmanā | yuyudhānena ca tathā tathaiva ca yuyutsunā"
  - id: 'strI-11-11-10'
    kind: verse
    lines:
      - अतीत्य ता महाबाहुः क्रोशन्तीः कुररीरिव
      - ववन्दे पितरं ज्येष्ठं धर्मराजो युधिष्ठिरः
    iast: "atītya tā mahābāhuḥ krośantīḥ kurarīriva | vavande pitaraṃ jyeṣṭhaṃ dharmarājo yudhiṣṭhiraḥ"
  - id: 'strI-11-11-12'
    kind: verse
    lines:
      - तमात्मजान्तकरणं पिता पुत्रवधार्दितः
      - अप्रीयमाणः शोकार्तः पाण्डवं परिषस्वजे
    iast: "tamātmajāntakaraṇaṃ pitā putravadhārditaḥ | aprīyamāṇaḥ śokārtaḥ pāṇḍavaṃ pariṣasvaje"
  - id: 'strI-11-11-13'
    kind: verse
    lines:
      - धर्मराजं परिष्वज्य सान्त्वयित्वा च भारत
      - दुष्टात्मा भीममन्वैच्छद्दिधक्षुरिव पावकः
    iast: "dharmarājaṃ pariṣvajya sāntvayitvā ca bhārata | duṣṭātmā bhīmamanvaicchaddidhakṣuriva pāvakaḥ"
  - id: 'strI-11-11-15'
    kind: verse
    lines:
      - तस्य संकल्पमाज्ञाय भीमं प्रत्यशुभं हरिः
      - भीममाक्षिप्य पाणिभ्यां प्रददौ भीममायसम्
    iast: "tasya saṃkalpamājñāya bhīmaṃ pratyaśubhaṃ hariḥ | bhīmamākṣipya pāṇibhyāṃ pradadau bhīmamāyasam"
  - id: 'strI-11-11-17'
    kind: verse
    lines:
      - उपगुह्यैव पाणिभ्यां भीमसेनमयस्मयम्
      - बभञ्ज बलवान्राजा मन्यमानो वृकोदरम्
    iast: "upaguhyaiva pāṇibhyāṃ bhīmasenamayasmayam | babhañja balavānrājā manyamāno vṛkodaram"
  - id: 'strI-11-11-21'
    kind: verse
    lines:
      - हतो भीम इति ज्ञात्वा गतमन्युर्महामनाः
      - हाहाभीमेति चुक्रोश नृपः शोकसमन्वितः
    iast: "hato bhīma iti jñātvā gatamanyurmahāmanāḥ | hāhābhīmeti cukrośa nṛpaḥ śokasamanvitaḥ"
  - id: 'strI-11-11-22'
    kind: verse
    lines:
      - तं विदित्वा गतक्रोधं भीमसेनवधार्दितम्
      - वासुदेवो वरः पुंसामिदं वचनमब्रवीत्
    iast: "taṃ viditvā gatakrodhaṃ bhīmasenavadhārditam | vāsudevo varaḥ puṃsāmidaṃ vacanamabravīt"
  - id: 'strI-11-11-23'
    kind: verse
    lines:
      - मा शुचो धृतराष्ट्र त्वं नैव भीमस्त्वया हतः
      - आयसी प्रतिमा ह्येषा त्वया निष्पातिता विभो
    iast: "mā śuco dhṛtarāṣṭra tvaṃ naiva bhīmastvayā hataḥ | āyasī pratimā hyeṣā tvayā niṣpātitā vibho"
  - id: 'strI-11-12-15'
    kind: verse
    lines:
      - इदानीं त्वहमव्यग्रो गतमन्युर्गतज्वरः
      - मध्यमं पाण्डवं वीरं स्पष्टुमिच्छामि माधव
    iast: "idānīṃ tvahamavyagro gatamanyurgatajvaraḥ | madhyamaṃ pāṇḍavaṃ vīraṃ spaṣṭumicchāmi mādhava"
  - id: 'strI-11-12-16'
    kind: verse
    lines:
      - हतेषु पारथिवेन्द्रेषु पुत्रेषु निहतेषु च
      - पाण्डुपुत्रेषु मे धर्मः प्रीतिश्चाप्यवतिष्ठते
    iast: "hateṣu pārathivendreṣu putreṣu nihateṣu ca | pāṇḍuputreṣu me dharmaḥ prītiścāpyavatiṣṭhate"
  - id: 'strI-11-13-1'
    kind: verse
    lines:
      - धृतराष्ट्राभ्यनुज्ञातास्ततस्ते कुरुपुङ्गवाः
      - अभ्ययुर्भ्रातरः सर्वे गान्धारीं सहकेशवाः
    iast: "dhṛtarāṣṭrābhyanujñātāstataste kurupuṅgavāḥ | abhyayurbhrātaraḥ sarve gāndhārīṃ sahakeśavāḥ"
  - id: 'strI-11-15-9'
    kind: verse
    lines:
      - एवं सञ्चेष्टमानांस्तानितश्चेतश्च भारत
      - गान्धारी विगतक्रोधा सांत्वयामास मातृवत्
    iast: "evaṃ sañceṣṭamānāṃstānitaścetaśca bhārata | gāndhārī vigatakrodhā sāṃtvayāmāsa mātṛvat"
  - id: 'strI-11-15-10'
    kind: verse
    lines:
      - ते पाण्डवा अनुज्ञाता मातरं वीतमत्सराः
      - अभ्यगच्छन्त सहिताः पृथां पृथुवलक्षसः
    iast: "te pāṇḍavā anujñātā mātaraṃ vītamatsarāḥ | abhyagacchanta sahitāḥ pṛthāṃ pṛthuvalakṣasaḥ"
  - id: 'strI-11-15-11'
    kind: verse
    lines:
      - चिरस्य दृष्ट्वा पुत्रान्सा पुत्राधिभिरभिप्लुता
      - बाष्पमाहारयद्देवी वस्त्रेणावृत्य वै मुखम्
    iast: "cirasya dṛṣṭvā putrānsā putrādhibhirabhiplutā | bāṣpamāhārayaddevī vastreṇāvṛtya vai mukham"
  - id: 'strI-11-15-13'
    kind: verse
    lines:
      - सा तानेकैकशः पुत्रान्संस्पृशन्ती पुनःपुनः अन्वशोचत दुःखार्ता द्रौपदीं निहतात्मजाम्
      - रुदन्तीमथ पाञ्चालीं ददर्श पतितां भुवि
      - द्रौपद्युवाच
    iast: "sā tānekaikaśaḥ putrānsaṃspṛśantī punaḥpunaḥ anvaśocata duḥkhārtā draupadīṃ nihatātmajām | rudantīmatha pāñcālīṃ dadarśa patitāṃ bhuvi | draupadyuvāca"
  - id: 'strI-11-25-38'
    kind: verse
    lines:
      - ततः कोपपरीताङ्गी पुत्रशोकपरिप्लुता
      - जगाद शौरिं दोषेण गान्धारी व्यथितेन्द्रिया
      - गान्धार्युवाच
    iast: "tataḥ kopaparītāṅgī putraśokapariplutā | jagāda śauriṃ doṣeṇa gāndhārī vyathitendriyā | gāndhāryuvāca"
  - id: 'strI-11-25-43'
    kind: verse
    lines:
      - यस्मात्परस्परं घ्नन्तो ज्ञातयः कुरुपाण्डवाः
      - उपेक्षितास्ते गोविन्द तस्माज्ज्ञातीन्वधिष्यसि
    iast: "yasmātparasparaṃ ghnanto jñātayaḥ kurupāṇḍavāḥ | upekṣitāste govinda tasmājjñātīnvadhiṣyasi"
  - id: 'strI-11-25-44'
    kind: verse
    lines:
      - त्वमप्युपस्थिते वर्षे षट््त्रिंशे मधुसूदन
      - हतज्ञातिर्हतामात्यो हतपुत्रो वनेचरः
    iast: "tvamapyupasthite varṣe ṣaṭtriṃśe madhusūdana | hatajñātirhatāmātyo hataputro vanecaraḥ"
  - id: 'strI-11-25-45'
    kind: verse
    lines:
      - अनाथवदविज्ञातो लोकेष्वनभिलक्षितः
      - कुत्सितेनाभ्युपायेन निधनं समवाप्स्यसि
    iast: "anāthavadavijñāto lokeṣvanabhilakṣitaḥ | kutsitenābhyupāyena nidhanaṃ samavāpsyasi"
  - id: 'strI-11-25-47'
    kind: verse
    lines:
      - तच्छ्रुत्वा वचनं घोरं वासुदेवो महामनाः
      - उवाच देवीं गान्धारीमीषदभ्युत्स्मयन्निव
    iast: "tacchrutvā vacanaṃ ghoraṃ vāsudevo mahāmanāḥ | uvāca devīṃ gāndhārīmīṣadabhyutsmayanniva"
  - id: 'strI-11-25-49'
    kind: verse
    lines:
      - संहर्ता वृष्णिचक्रस्य नान्यो मद्विद्यते शुभे
      - अवध्यास्ते नरैरन्यैरपि वा देवदानवैः
    iast: "saṃhartā vṛṣṇicakrasya nānyo madvidyate śubhe | avadhyāste narairanyairapi vā devadānavaiḥ"
  - id: 'strI-11-27-3'
    kind: verse
    lines:
      - ततः पितॄणां भ्रातॄणां पौत्राणां स्वजनस्य च
      - पुत्राणामार्यकाणां च पतीनां च कुरुस्त्रियः
    iast: "tataḥ pitṝṇāṃ bhrātṝṇāṃ pautrāṇāṃ svajanasya ca | putrāṇāmāryakāṇāṃ ca patīnāṃ ca kurustriyaḥ"
  - id: 'strI-11-27-4'
    kind: verse
    lines:
      - उदकं चक्रिरे सर्वा रुदन्त्यो भृशदुःखिताः
      - सुहृदां चापि धर्मज्ञाः प्रचक्रुः सलिलक्रियाम्
    iast: "udakaṃ cakrire sarvā rudantyo bhṛśaduḥkhitāḥ | suhṛdāṃ cāpi dharmajñāḥ pracakruḥ salilakriyām"
  - id: 'strI-11-27-7'
    kind: verse
    lines:
      - ततः कुन्ती महाराज रुदन्ती शोककर्शिता
      - व्रीडया मन्दया वाचा पुत्रान्वचनमब्रवीत्
    iast: "tataḥ kuntī mahārāja rudantī śokakarśitā | vrīḍayā mandayā vācā putrānvacanamabravīt"
  - id: 'strI-11-27-9'
    kind: verse
    lines:
      - यं सूतपुत्रं मन्यध्वं राधेयमिति पाण्डवाः
      - यो व्यराजच्चमूमध्ये दिवाकर इव प्रभुः
    iast: "yaṃ sūtaputraṃ manyadhvaṃ rādheyamiti pāṇḍavāḥ | yo vyarājaccamūmadhye divākara iva prabhuḥ"
  - id: 'strI-11-27-12'
    kind: verse
    lines:
      - कर्णस्य सत्यसन्धस्य सङ्ग्रामेष्वपलायिनः
      - कुरुध्वमुदकं तस्य भ्रातुरक्लिष्टकर्मणः
    iast: "karṇasya satyasandhasya saṅgrāmeṣvapalāyinaḥ | kurudhvamudakaṃ tasya bhrāturakliṣṭakarmaṇaḥ"
  - id: 'strI-11-27-13'
    kind: verse
    lines:
      - स हि वः पूर्वजो भ्राता भास्करान्मय्यजायत
      - कुण्डली कवची शूरो दिवाकरसमप्रभः
    iast: "sa hi vaḥ pūrvajo bhrātā bhāskarānmayyajāyata | kuṇḍalī kavacī śūro divākarasamaprabhaḥ"
  - id: 'strI-11-27-14'
    kind: verse
    lines:
      - श्रुत्वा तु पाण्डवाः सर्वे मातुर्वचनमप्रियम्
      - कर्णमेवानुशोचन्तो भूयश्चात्यातुरा भवन्
    iast: "śrutvā tu pāṇḍavāḥ sarve māturvacanamapriyam | karṇamevānuśocanto bhūyaścātyāturā bhavan"
  - id: 'shanti-12-6-12'
    kind: verse
    lines:
      - स राजा पुत्रपौत्राणां संबन्धिसुहृदां तदा
      - स्मरन्नुद्विग्नहृदयो बभूवोद्विग्नचेतनः
    iast: "sa rājā putrapautrāṇāṃ saṃbandhisuhṛdāṃ tadā | smarannudvignahṛdayo babhūvodvignacetanaḥ"
  - id: 'shanti-12-6-13'
    kind: verse
    lines:
      - ततः शोकपरीतात्मा सधूम इव पावकः
      - निर्वेदमगमद्धीमान्राज्ये संतापपीडितः
    iast: "tataḥ śokaparītātmā sadhūma iva pāvakaḥ | nirvedamagamaddhīmānrājye saṃtāpapīḍitaḥ"
  - id: 'shanti-12-36-27'
    kind: verse
    lines:
      - सोऽनुनीतो नरव्याघ्र विष्टरश्रवसा स्वयम्
      - द्वैपायनेन च तथा देवस्थानेन जिष्णुना
    iast: "so'nunīto naravyāghra viṣṭaraśravasā svayam | dvaipāyanena ca tathā devasthānena jiṣṇunā"
  - id: 'shanti-12-36-30'
    kind: verse
    lines:
      - स तैः परिवृतो राजा नक्षत्रैरिव चन्द्रमाः
      - धृतराष्ट्रं पुरस्कृत्य स्वपुरं प्रविवेश ह
    iast: "sa taiḥ parivṛto rājā nakṣatrairiva candramāḥ | dhṛtarāṣṭraṃ puraskṛtya svapuraṃ praviveśa ha"
  - id: 'shanti-12-39-1'
    kind: verse
    lines:
      - ततः कुन्तीसुतो राजा गतमन्युर्गतज्वरः
      - काञ्चने प्राड्भुखो हृष्टो न्यषीदत्परमासने
    iast: "tataḥ kuntīsuto rājā gatamanyurgatajvaraḥ | kāñcane prāḍbhukho hṛṣṭo nyaṣīdatparamāsane"
  - id: 'shanti-12-39-8'
    kind: verse
    lines:
      - ततः प्रकृतयः सर्वाः पुरस्कृत्य पुरोहितम्
      - ददृशुर्धर्मराजानमादाय बहुमङ्गलम्
    iast: "tataḥ prakṛtayaḥ sarvāḥ puraskṛtya purohitam | dadṛśurdharmarājānamādāya bahumaṅgalam"
  - id: 'shanti-12-39-13'
    kind: verse
    lines:
      - व्याघ्रचर्मोत्तरे शुक्ले सर्वतोभद्र आसने
      - दृढपादप्रतिष्ठाने हुताशनसमत्विपि
    iast: "vyāghracarmottare śukle sarvatobhadra āsane | dṛḍhapādapratiṣṭhāne hutāśanasamatvipi"
  - id: 'shanti-12-39-14'
    kind: verse
    lines:
      - उपवेश्य महात्मानं कृष्णां च द्रुपदात्मजाम्
      - जुहाव पावकं धीमान्विधिमन्त्रपुरस्कृतम्
    iast: "upaveśya mahātmānaṃ kṛṣṇāṃ ca drupadātmajām | juhāva pāvakaṃ dhīmānvidhimantrapuraskṛtam"
  - id: 'shanti-12-39-15'
    kind: verse
    lines:
      - तत उत्थाय दाशार्हः शङ्खमादाय पूरितम् अभ्यषिञ्चत्पतिं पृथ्व्याः कुन्तीपुत्रं युधिष्ठिरम्
      - धृतराष्ट्रश्च राजर्षिः सर्वाः प्रकृतयस्तथा
    iast: "tata utthāya dāśārhaḥ śaṅkhamādāya pūritam abhyaṣiñcatpatiṃ pṛthvyāḥ kuntīputraṃ yudhiṣṭhiram | dhṛtarāṣṭraśca rājarṣiḥ sarvāḥ prakṛtayastathā"
  - id: 'shanti-12-40-9'
    kind: verse
    lines:
      - पौरजानपदान्सर्वान्विसृज्य कुरुनन्दनः
      - यौवराज्येन कौन्तेयं भीमसेनमयोजयत्
    iast: "paurajānapadānsarvānvisṛjya kurunandanaḥ | yauvarājyena kaunteyaṃ bhīmasenamayojayat"
  - id: 'shanti-12-44-17'
    kind: verse
    lines:
      - सोऽभिगम्य महात्मानं विष्णुं पुरुषसत्तमम्
      - उवाच मधुरं राजा स्मितपूर्वमिदं तदा
    iast: "so'bhigamya mahātmānaṃ viṣṇuṃ puruṣasattamam | uvāca madhuraṃ rājā smitapūrvamidaṃ tadā"
  - id: 'shanti-12-44-19'
    kind: verse
    lines:
      - तथैवोपश्रिता देवी बुद्धिर्बुद्धिमतां वर
      - वयं राज्यमनुप्राप्ताः पृथिवी च वशे स्थिता
    iast: "tathaivopaśritā devī buddhirbuddhimatāṃ vara | vayaṃ rājyamanuprāptāḥ pṛthivī ca vaśe sthitā"
  - id: 'shanti-12-44-20'
    kind: verse
    lines:
      - तव प्रसादाद्भगवंस्त्रिलोकगतिविक्रम
      - जयं प्राप्ता यशश्चाग्र्यं न च धर्मच्युता वयम्
    iast: "tava prasādādbhagavaṃstrilokagativikrama | jayaṃ prāptā yaśaścāgryaṃ na ca dharmacyutā vayam"
  - id: 'shanti-12-44-21'
    kind: verse
    lines:
      - तं तथा भाषमाणं तु धर्मराजमरिंदमम्
      - नोवाच भगवान्किंचिद्ध्यानमेवान्वपद्यत
    iast: "taṃ tathā bhāṣamāṇaṃ tu dharmarājamariṃdamam | novāca bhagavānkiṃciddhyānamevānvapadyata"
  - id: 'shanti-12-45-1'
    kind: verse
    lines:
      - किमिदं परमाश्चर्यं ध्यायस्यमितविक्रम
      - कच्चिल्लोकत्रयस्यास्य स्वस्ति लोकपरायण
    iast: "kimidaṃ paramāścaryaṃ dhyāyasyamitavikrama | kaccillokatrayasyāsya svasti lokaparāyaṇa"
  - id: 'shanti-12-45-11'
    kind: verse
    lines:
      - शरतल्पगतो भीष्मः शाम्यन्निव हुताशनः
      - मां ध्याति पुरुषव्याघ्रस्ततो मे तद्गतं मनः
    iast: "śaratalpagato bhīṣmaḥ śāmyanniva hutāśanaḥ | māṃ dhyāti puruṣavyāghrastato me tadgataṃ manaḥ"
  - id: 'shanti-12-45-19'
    kind: verse
    lines:
      - स हि भूतं भविष्यच्च भवच्च भरतर्षभ
      - वेत्ति धर्मविदां श्रेष्ठस्तमस्मि मनसा गतः
    iast: "sa hi bhūtaṃ bhaviṣyacca bhavacca bharatarṣabha | vetti dharmavidāṃ śreṣṭhastamasmi manasā gataḥ"
  - id: 'shanti-12-45-20'
    kind: verse
    lines:
      - तस्मिन्हि पुरुषव्याघ्रे शान्ते भीष्मे महात्मनि
      - भविष्यति मही पार्थ नष्टचन्द्रेव शर्वरी
    iast: "tasminhi puruṣavyāghre śānte bhīṣme mahātmani | bhaviṣyati mahī pārtha naṣṭacandreva śarvarī"
  - id: 'shanti-12-45-21'
    kind: verse
    lines:
      - तद्युधिष्ठिर गाङ्गेयं भीष्मं भीमपराक्रमम्
      - अभिगम्योपसंगृह्य पृच्छ यत्ते मनोगतम्
    iast: "tadyudhiṣṭhira gāṅgeyaṃ bhīṣmaṃ bhīmaparākramam | abhigamyopasaṃgṛhya pṛccha yatte manogatam"
  - id: 'shanti-12-45-23'
    kind: verse
    lines:
      - तस्मिन्नस्तमिते भीष्मे कौरवाणां धुंरधरे
      - ज्ञानान्यल्पीभविष्यन्ति तस्मात्त्वां चोदयाम्यहम्
    iast: "tasminnastamite bhīṣme kauravāṇāṃ dhuṃradhare | jñānānyalpībhaviṣyanti tasmāttvāṃ codayāmyaham"
  - id: 'shanti-12-47-1'
    kind: verse
    lines:
      - ततः स च हृषीकेशः स च राजा युधिष्ठिरः
      - कृपादयश्च ते सर्वे चत्वारः पाण्डवाश्च ते
    iast: "tataḥ sa ca hṛṣīkeśaḥ sa ca rājā yudhiṣṭhiraḥ | kṛpādayaśca te sarve catvāraḥ pāṇḍavāśca te"
  - id: 'shanti-12-47-2'
    kind: verse
    lines:
      - रथैस्तैर्नगरप्रख्यैः पताकाध्वजशोभितैः
      - ययुराशु कुरुक्षेत्रं वाजिभिः शीघ्रगामिभिः
    iast: "rathaistairnagaraprakhyaiḥ patākādhvajaśobhitaiḥ | yayurāśu kurukṣetraṃ vājibhiḥ śīghragāmibhiḥ"
  - id: 'shanti-12-49-6'
    kind: verse
    lines:
      - ततस्ते ददृशुर्भीष्मं शरप्रस्तरशायिनम्
      - स्वरश्मिमालासंवीतं सायंसूर्यसमप्रभम्
    iast: "tataste dadṛśurbhīṣmaṃ śaraprastaraśāyinam | svaraśmimālāsaṃvītaṃ sāyaṃsūryasamaprabham"
  - id: 'shanti-12-49-7'
    kind: verse
    lines:
      - उपास्यमानं मुनिभिर्देवैरिव शतक्रतुम्
      - देशे परमधर्मिष्ठे नदीमोघवतीमनु
    iast: "upāsyamānaṃ munibhirdevairiva śatakratum | deśe paramadharmiṣṭhe nadīmoghavatīmanu"
  - id: 'shanti-12-49-12'
    kind: verse
    lines:
      - ततो निशाम्य गाङ्गेयं शाम्यमानमिवानलम्
      - किंचिद्दीनमना भीष्ममितिहोवाच केशवः
    iast: "tato niśāmya gāṅgeyaṃ śāmyamānamivānalam | kiṃciddīnamanā bhīṣmamitihovāca keśavaḥ"
  - id: 'shanti-12-49-39'
    kind: verse
    lines:
      - स पाण्डवेयस्य मनःसमुत्थितं नरेन्द्र शोकं व्यपकर्ष मेधया
      - भवद्विधा ह्युत्तमबुद्धिर्विस्तरा विमुह्यमानस्य जनस्य शान्तये
    iast: "sa pāṇḍaveyasya manaḥsamutthitaṃ narendra śokaṃ vyapakarṣa medhayā | bhavadvidhā hyuttamabuddhirvistarā vimuhyamānasya janasya śāntaye"
  - id: 'shanti-12-53-23'
    kind: verse
    lines:
      - युवेवास्मि समावृत्तस्त्वदनुध्यानबृंहितः
      - वक्तुं श्रेयः समर्थोऽस्मि त्वत्प्रसादाज्जनार्दन
    iast: "yuvevāsmi samāvṛttastvadanudhyānabṛṃhitaḥ | vaktuṃ śreyaḥ samartho'smi tvatprasādājjanārdana"
  - id: 'shanti-12-55-10'
    kind: verse
    lines:
      - नमो धर्माय महते नमः कृष्णाय वेधसे
      - ब्राह्मणेभ्यो नमस्कृत्य धर्मान्वक्ष्यामि शाश्वतान्
    iast: "namo dharmāya mahate namaḥ kṛṣṇāya vedhase | brāhmaṇebhyo namaskṛtya dharmānvakṣyāmi śāśvatān"
  - id: 'shanti-12-55-12'
    kind: verse
    lines:
      - आदावेव कुरुश्रेष्ठ राज्ञा रञ्जनमिच्छता
      - देवतानां द्विजानां च वर्तितव्यं यथाविधि
    iast: "ādāveva kuruśreṣṭha rājñā rañjanamicchatā | devatānāṃ dvijānāṃ ca vartitavyaṃ yathāvidhi"
  - id: 'shanti-12-55-14'
    kind: verse
    lines:
      - उत्थानेन सदा पुत्र प्रयतेथा युधिष्ठिर
      - न ह्युत्थानमृते दैवं राज्ञामर्थं प्रसाधयेत्
    iast: "utthānena sadā putra prayatethā yudhiṣṭhira | na hyutthānamṛte daivaṃ rājñāmarthaṃ prasādhayet"
  - id: 'shanti-12-55-15'
    kind: verse
    lines:
      - साधारणं द्वयं ह्येतद्दैवमुत्थानमेव च
      - पौरुषं हि परं मन्ये दैवं निश्चित्य मुह्यते
    iast: "sādhāraṇaṃ dvayaṃ hyetaddaivamutthānameva ca | pauruṣaṃ hi paraṃ manye daivaṃ niścitya muhyate"
  - id: 'shanti-12-55-17'
    kind: verse
    lines:
      - न हि सत्यादृते किंचिद्राज्ञां वै सिद्धिकारकम्
      - सत्ये हि राजा निरतः प्रेत्य चेह च नन्दति
    iast: "na hi satyādṛte kiṃcidrājñāṃ vai siddhikārakam | satye hi rājā nirataḥ pretya ceha ca nandati"
  - id: 'shanti-12-55-20'
    kind: verse
    lines:
      - आर्जवं सर्वकार्येषु श्रयेथाः कुरुनन्दन पुनर्नयविचारेण त्रयीसंवरणेन च
      - आर्जवेन समायुक्ता मोदन्ते ऋषयो दिवि
    iast: "ārjavaṃ sarvakāryeṣu śrayethāḥ kurunandana punarnayavicāreṇa trayīsaṃvaraṇena ca | ārjavena samāyuktā modante ṛṣayo divi"
  - id: 'shanti-12-55-21'
    kind: verse
    lines:
      - मृदुर्हि राजा सततं लङ्घ्यो भवति सर्वशः
      - तीक्ष्णाच्चोद्विजते लोकस्तस्मादुभयमाचरेत्
    iast: "mṛdurhi rājā satataṃ laṅghyo bhavati sarvaśaḥ | tīkṣṇāccodvijate lokastasmādubhayamācaret"
  - id: 'shanti-12-55-42'
    kind: verse
    lines:
      - व्यसनानि च सर्वाणि त्यजेथा भूरिदक्षिण
      - नचैतानि प्रयुञ्जीथाः सङ्गं तु परिवर्जय
    iast: "vyasanāni ca sarvāṇi tyajethā bhūridakṣiṇa | nacaitāni prayuñjīthāḥ saṅgaṃ tu parivarjaya"
  - id: 'shanti-12-55-46'
    kind: verse
    lines:
      - वर्तितव्यं कुरुश्रेष्ठ सदा धर्मानुवर्तिना
      - स्वं प्रियं तु परित्यज्य यद्यल्लोकहितं भवेत्
    iast: "vartitavyaṃ kuruśreṣṭha sadā dharmānuvartinā | svaṃ priyaṃ tu parityajya yadyallokahitaṃ bhavet"
  - id: 'shanti-12-56-33'
    kind: verse
    lines:
      - पुत्रा इव पितुर्गेहे विषये यस्य मानवाः
      - निर्भया विचरिष्यन्ति स राजा राजसत्तमः
    iast: "putrā iva piturgehe viṣaye yasya mānavāḥ | nirbhayā vicariṣyanti sa rājā rājasattamaḥ"
  - id: 'shanti-12-68-4'
    kind: verse
    lines:
      - आत्मा जेयः सदा राज्ञा ततो जेयाश्च शत्रवः
      - अजितात्मा नरपतिर्विजयेत कथं रिपून्
    iast: "ātmā jeyaḥ sadā rājñā tato jeyāśca śatravaḥ | ajitātmā narapatirvijayeta kathaṃ ripūn"
  - id: 'shanti-12-71-6'
    kind: verse
    lines:
      - आर्जवेन च संपन्नो धृत्या बुद्ध्या च भारत
      - धर्मार्थौ प्रतिगृह्णीयात्कामक्रोधौ च वर्जयेत्
    iast: "ārjavena ca saṃpanno dhṛtyā buddhyā ca bhārata | dharmārthau pratigṛhṇīyātkāmakrodhau ca varjayet"
  - id: 'shanti-12-71-15'
    kind: verse
    lines:
      - अर्थमूलोऽपि हिंसां च कुरुते स्वयमात्मनः
      - करैरशास्त्रदृष्टैर्हि मोहात्संपीडयन्प्रजाः
    iast: "arthamūlo'pi hiṃsāṃ ca kurute svayamātmanaḥ | karairaśāstradṛṣṭairhi mohātsaṃpīḍayanprajāḥ"
  - id: 'shanti-12-86-24'
    kind: verse
    lines:
      - कृपणानाथवृद्धानां विधवानां च योषिताम्
      - योगक्षेमं च वृत्तिं च नित्यमेव प्रकल्पयेत्
    iast: "kṛpaṇānāthavṛddhānāṃ vidhavānāṃ ca yoṣitām | yogakṣemaṃ ca vṛttiṃ ca nityameva prakalpayet"
  - id: 'shanti-12-88-24'
    kind: verse
    lines:
      - मा ते राष्ट्रे याचनका भवेयुर्मा च दस्यवः
      - उपादातार एवैते नैते भूतस्य भावकाः
    iast: "mā te rāṣṭre yācanakā bhaveyurmā ca dasyavaḥ | upādātāra evaite naite bhūtasya bhāvakāḥ"
  - id: 'shanti-12-91-14'
    kind: verse
    lines:
      - दुर्बलस्य च यच्चक्षुर्मुनेराशीविषस्य च
      - अविषह्यतमं मन्ये मा स्म दुर्बलमासदः
    iast: "durbalasya ca yaccakṣurmunerāśīviṣasya ca | aviṣahyatamaṃ manye mā sma durbalamāsadaḥ"
  - id: 'shanti-12-91-15'
    kind: verse
    lines:
      - दुर्बलांस्तात मन्येथा नित्यमेवाविमानि तान्
      - मा त्वां दुर्बलचक्षूंषि प्रदहेयुः सबान्धवम्
    iast: "durbalāṃstāta manyethā nityamevāvimāni tān | mā tvāṃ durbalacakṣūṃṣi pradaheyuḥ sabāndhavam"
  - id: 'shanti-12-91-18'
    kind: verse
    lines:
      - विमानितो हतः क्लिष्टस्त्रातारं चेन्न विन्दन्ते
      - अमानुषकृतस्तत्र दण्डो हन्ति नराधिपम्
    iast: "vimānito hataḥ kliṣṭastrātāraṃ cenna vindante | amānuṣakṛtastatra daṇḍo hanti narādhipam"
  - id: 'shanti-12-91-19'
    kind: verse
    lines:
      - मा स्म तात बलस्थस्त्वं भुञ्जीथा दुर्बलं जनम्
      - मा त्वां दुर्बलचक्षूंषि दहन्त्वग्निरिवाशयम्
    iast: "mā sma tāta balasthastvaṃ bhuñjīthā durbalaṃ janam | mā tvāṃ durbalacakṣūṃṣi dahantvagnirivāśayam"
  - id: 'shanti-12-91-20'
    kind: verse
    lines:
      - यानि मिथ्याभिशस्तानां पतन्त्यश्रूणि रोदताम्
      - तानि पुत्रान्पशून्घ्नन्ति तेषां मिथ्याभिशंसिनां
    iast: "yāni mithyābhiśastānāṃ patantyaśrūṇi rodatām | tāni putrānpaśūnghnanti teṣāṃ mithyābhiśaṃsināṃ"
  - id: 'shanti-12-94-1'
    kind: verse
    lines:
      - अयुद्धेनैव विजयं वर्धयेद्वसुधाधिपः
      - जघन्यमाहुर्विजयं युद्धेन च नराधिप
    iast: "ayuddhenaiva vijayaṃ vardhayedvasudhādhipaḥ | jaghanyamāhurvijayaṃ yuddhena ca narādhipa"
  - id: 'shanti-12-95-21'
    kind: verse
    lines:
      - कर्म चैतदसाधूनां साधून्योऽसाधुना जयेत्
      - धर्मेण निधनं श्रेयो न जयः पापकर्मणा
    iast: "karma caitadasādhūnāṃ sādhūnyo'sādhunā jayet | dharmeṇa nidhanaṃ śreyo na jayaḥ pāpakarmaṇā"
  - id: 'shanti-12-156-2'
    kind: verse
    lines:
      - पापस्य यदधिष्ठानं तच्छृणुष्व नराधिप
      - एको लोभो महाग्राहो लोभात्पापं प्रवर्तते
    iast: "pāpasya yadadhiṣṭhānaṃ tacchṛṇuṣva narādhipa | eko lobho mahāgrāho lobhātpāpaṃ pravartate"
  - id: 'shanti-12-156-3'
    kind: verse
    lines:
      - अतः पापमधर्मश्च तथा दुःखमनुत्तमम्
      - निकृत्या मूलमेतद्धि येन पापकृतो जनाः
    iast: "ataḥ pāpamadharmaśca tathā duḥkhamanuttamam | nikṛtyā mūlametaddhi yena pāpakṛto janāḥ"
  - id: 'shanti-12-156-14'
    kind: verse
    lines:
      - ज्ञायते नृप तत्त्वेन सर्वैर्भूतगणैस्तथा
      - स लोभः सह मोहेन विजेतव्यो जितात्मना
    iast: "jñāyate nṛpa tattvena sarvairbhūtagaṇaistathā | sa lobhaḥ saha mohena vijetavyo jitātmanā"
  - id: 'shanti-12-157-6'
    kind: verse
    lines:
      - रागो द्वेषस्तथा मोहो हर्षः शोकोऽभिमानिता
      - कामः क्रोधश्च दर्पश्च तन्द्री चालस्यमेव च
    iast: "rāgo dveṣastathā moho harṣaḥ śoko'bhimānitā | kāmaḥ krodhaśca darpaśca tandrī cālasyameva ca"
  - id: 'shanti-12-157-7'
    kind: verse
    lines:
      - इच्छा द्वेषस्तथा तापः परवृद्ध्युपतापिता
      - अज्ञानमेन्निर्दिष्टं पापानां चैव याः क्रियाः
    iast: "icchā dveṣastathā tāpaḥ paravṛddhyupatāpitā | ajñānamennirdiṣṭaṃ pāpānāṃ caiva yāḥ kriyāḥ"
  - id: 'shanti-12-158-10'
    kind: verse
    lines:
      - दमेन सदृशं धर्मं नान्यं लोकेषु शुश्रुम्
      - दमो हि परमो लोके प्रशस्तः सर्वधर्मिणाम्
    iast: "damena sadṛśaṃ dharmaṃ nānyaṃ lokeṣu śuśrum | damo hi paramo loke praśastaḥ sarvadharmiṇām"
  - id: 'shanti-12-158-15'
    kind: verse
    lines:
      - क्षमा धृतिरार्हेसा च समता सत्यमार्जवम्
      - इन्द्रियाभिजयो दाक्ष्यं मार्दवं ह्रीरचापलम्
    iast: "kṣamā dhṛtirārhesā ca samatā satyamārjavam | indriyābhijayo dākṣyaṃ mārdavaṃ hrīracāpalam"
  - id: 'shanti-12-158-16'
    kind: verse
    lines:
      - अकार्पण्यमसंरम्भः संतोषः प्रियवादिता
      - अविहसाऽनसूया चाप्येषां समुदयो दमः
    iast: "akārpaṇyamasaṃrambhaḥ saṃtoṣaḥ priyavāditā | avihasā'nasūyā cāpyeṣāṃ samudayo damaḥ"
  - id: 'shanti-12-160-5'
    kind: verse
    lines:
      - सत्यं धर्मस्तपोयोगः सत्यं ब्रह्म सनातनम्
      - सत्यं यज्ञः परः प्रोक्तः सर्वं सत्ये प्रतिष्ठितम्
    iast: "satyaṃ dharmastapoyogaḥ satyaṃ brahma sanātanam | satyaṃ yajñaḥ paraḥ proktaḥ sarvaṃ satye pratiṣṭhitam"
  - id: 'shanti-12-160-7'
    kind: verse
    lines:
      - प्राप्यते च यथा सत्यं तच्च वेत्तुमिहार्हसि
      - सत्यं त्रयोदशावधं सर्वलोकेषु भारत
    iast: "prāpyate ca yathā satyaṃ tacca vettumihārhasi | satyaṃ trayodaśāvadhaṃ sarvalokeṣu bhārata"
  - id: 'shanti-12-160-8'
    kind: verse
    lines:
      - सत्यं च समता चैव दमश्चैव न संशयः
      - अमात्सर्यं क्षमा चैव ह्रीस्तितिक्षाऽनसूयता
    iast: "satyaṃ ca samatā caiva damaścaiva na saṃśayaḥ | amātsaryaṃ kṣamā caiva hrīstitikṣā'nasūyatā"
  - id: 'shanti-12-160-9'
    kind: verse
    lines:
      - त्यागो ध्यानमथार्यत्वं धृतिश्च सततं दया
      - अहिंसा चैव राजेन्द्र सत्याकारास्त्रयोदश
    iast: "tyāgo dhyānamathāryatvaṃ dhṛtiśca satataṃ dayā | ahiṃsā caiva rājendra satyākārāstrayodaśa"
  - id: 'shanti-12-173-47'
    kind: verse
    lines:
      - यच्च कामसुखं लोके यच्च दिव्यं महत्सुखम्
      - तृष्णाक्षयसुखस्यैते नार्हतः षोडशीं कलाम्
    iast: "yacca kāmasukhaṃ loke yacca divyaṃ mahatsukham | tṛṣṇākṣayasukhasyaite nārhataḥ ṣoḍaśīṃ kalām"
  - id: 'shanti-12-173-52'
    kind: verse
    lines:
      - यदा संहरते कामान्कूर्मोऽङ्गानीव सर्वशः
      - तदात्मज्योतिरात्मश्रीरात्मन्येव प्रसीदति
    iast: "yadā saṃharate kāmānkūrmo'ṅgānīva sarvaśaḥ | tadātmajyotirātmaśrīrātmanyeva prasīdati"
  - id: 'shanti-12-173-54'
    kind: verse
    lines:
      - न बिभेति यदा चायं यदा चास्मान्न विभ्यति
      - यदा नेच्छति न द्वेष्टि ब्रह्म संपद्यते तदा
    iast: "na bibheti yadā cāyaṃ yadā cāsmānna vibhyati | yadā necchati na dveṣṭi brahma saṃpadyate tadā"
  - id: 'shanti-12-173-56'
    kind: verse
    lines:
      - यदा न कुरुते धीरः सर्वभूतेषु पापकम्
      - कर्मणा मनसा वाचा ब्रह्म संपद्यते तदा
    iast: "yadā na kurute dhīraḥ sarvabhūteṣu pāpakam | karmaṇā manasā vācā brahma saṃpadyate tadā"
  - id: 'shanti-12-174-9'
    kind: verse
    lines:
      - मृत्युनाभ्याहतो लोको जरया परिवारितः अहोरात्राः पतन्त्येते ननु कस्मान्न बुध्यसे
      - अमोघा रात्रयश्चापि नित्यमायान्ति यान्ति च
      - पितोवाच
    iast: "mṛtyunābhyāhato loko jarayā parivāritaḥ ahorātrāḥ patantyete nanu kasmānna budhyase | amoghā rātrayaścāpi nityamāyānti yānti ca | pitovāca"
  - id: 'shanti-12-174-14'
    kind: verse
    lines:
      - अद्यैव कुरु यच्छ्रेयो मा त्वां कालोऽत्यगादयम्
      - अकृतेष्वेव कार्येषु मृत्युर्वै संप्रकर्षति
    iast: "adyaiva kuru yacchreyo mā tvāṃ kālo'tyagādayam | akṛteṣveva kāryeṣu mṛtyurvai saṃprakarṣati"
  - id: 'shanti-12-174-30'
    kind: verse
    lines:
      - अमृतं चैव मृत्युश्च द्वयं देहे प्रतिष्ठितम्
      - मृत्युरापद्यते मोहात्सत्येनापद्यतेऽमृतम्
    iast: "amṛtaṃ caiva mṛtyuśca dvayaṃ dehe pratiṣṭhitam | mṛtyurāpadyate mohātsatyenāpadyate'mṛtam"
  - id: 'shanti-12-174-35'
    kind: verse
    lines:
      - नास्ति विद्यासमं चक्षुर्नास्ति सत्यसमं तपः
      - नास्ति रागसमंदुःखं नास्ति त्यागसमं सुखम्
    iast: "nāsti vidyāsamaṃ cakṣurnāsti satyasamaṃ tapaḥ | nāsti rāgasamaṃduḥkhaṃ nāsti tyāgasamaṃ sukham"
  - id: 'shanti-12-175-5'
    kind: verse
    lines:
      - तयोरेकतरो मार्गो यदेनमुपसन्नयेत्
      - न सुखं प्राप्य संहृष्येन्नासुखं प्राप्य संज्वरेत्
    iast: "tayorekataro mārgo yadenamupasannayet | na sukhaṃ prāpya saṃhṛṣyennāsukhaṃ prāpya saṃjvaret"
  - id: 'shanti-12-175-8'
    kind: verse
    lines:
      - आकिञ्चन्यं सुखं लोके पथ्यं शिवमनामयम्
      - अनमित्रपथो ह्येष दुर्लभः सुलभः सताम्
    iast: "ākiñcanyaṃ sukhaṃ loke pathyaṃ śivamanāmayam | anamitrapatho hyeṣa durlabhaḥ sulabhaḥ satām"
  - id: 'shanti-12-175-9'
    kind: verse
    lines:
      - अकिञ्चनस्य शुद्धस्य उपपन्नस्य सर्वतः
      - अवेक्षमाणस्त्रील्लोँकान्न तुल्यमिह लक्षये
    iast: "akiñcanasya śuddhasya upapannasya sarvataḥ | avekṣamāṇastrīllom̐kānna tulyamiha lakṣaye"
  - id: 'shanti-12-175-10'
    kind: verse
    lines:
      - आकिञ्चन्यं च राज्यं च तुलया समतोलयम्
      - अत्यरिच्यत दारिद्र्यं राज्यादपि गुणाधिकम्
    iast: "ākiñcanyaṃ ca rājyaṃ ca tulayā samatolayam | atyaricyata dāridryaṃ rājyādapi guṇādhikam"
  - id: 'shanti-12-175-11'
    kind: verse
    lines:
      - आकिञ्चन्ये च राज्ये च विशेषः सुमहानयम्
      - नित्योद्विग्नो हि धनवान्मृत्योरास्यगतो यथा
    iast: "ākiñcanye ca rājye ca viśeṣaḥ sumahānayam | nityodvigno hi dhanavānmṛtyorāsyagato yathā"
  - id: 'shanti-12-175-16'
    kind: verse
    lines:
      - श्रिया ह्यभीक्ष्णं संवासो मोहयत्यविचक्षणम्
      - सा तस्य चित्तं हरति शारदाभ्रमिवानिलः
    iast: "śriyā hyabhīkṣṇaṃ saṃvāso mohayatyavicakṣaṇam | sā tasya cittaṃ harati śāradābhramivānilaḥ"
  - id: 'shanti-12-175-17'
    kind: verse
    lines:
      - अथैनं रूपमानश्च धनपानश्च विन्दति अभिजातोऽस्मि सिद्धोऽस्मि नास्मि केवलमानुषः
      - इत्येभिः कारणैस्तस्य त्रिभिश्चित्तं प्रमाद्यति
    iast: "athainaṃ rūpamānaśca dhanapānaśca vindati abhijāto'smi siddho'smi nāsmi kevalamānuṣaḥ | ityebhiḥ kāraṇaistasya tribhiścittaṃ pramādyati"
  - id: 'shanti-12-175-22'
    kind: verse
    lines:
      - नात्यक्त्वा सुखमाप्नोति नात्यक्त्वा विन्दते परम्
      - नात्यक्त्वा चाभयः शेते त्यक्त्वा सर्वं सुखी भवेत्
    iast: "nātyaktvā sukhamāpnoti nātyaktvā vindate param | nātyaktvā cābhayaḥ śete tyaktvā sarvaṃ sukhī bhavet"
  - id: 'shanti-12-176-2'
    kind: verse
    lines:
      - सर्वसाम्यमनायासः सत्यवाक्यं च भारत
      - निर्वेदश्चाविधित्सा च यस्य स्यात्स सखी नरः
    iast: "sarvasāmyamanāyāsaḥ satyavākyaṃ ca bhārata | nirvedaścāvidhitsā ca yasya syātsa sakhī naraḥ"
  - id: 'shanti-12-176-16'
    kind: verse
    lines:
      - यः कामानाप्नुयात्सर्वान्यश्चैतान्केवलांस्त्यजेत्
      - प्रापणात्सर्वकामानां परित्यागो विशिष्यते
    iast: "yaḥ kāmānāpnuyātsarvānyaścaitānkevalāṃstyajet | prāpaṇātsarvakāmānāṃ parityāgo viśiṣyate"
  - id: 'shanti-12-176-17'
    kind: verse
    lines:
      - नान्तं सर्वविधित्सानां गतपूर्वोऽस्ति कश्चन
      - शरीरे जीविते चैव तृष्णा मर्त्यस्य वर्धते
    iast: "nāntaṃ sarvavidhitsānāṃ gatapūrvo'sti kaścana | śarīre jīvite caiva tṛṣṇā martyasya vardhate"
  - id: 'shanti-12-176-18'
    kind: verse
    lines:
      - निवर्तस्य विधित्साभ्यः शाम्य निर्विद्य कामुक
      - असकृच्चासि निकृतो न च निर्विद्यसे मनः
    iast: "nivartasya vidhitsābhyaḥ śāmya nirvidya kāmuka | asakṛccāsi nikṛto na ca nirvidyase manaḥ"
  - id: 'shanti-12-178-2'
    kind: verse
    lines:
      - प्रज्ञा प्रतिष्ठा भूतानां प्रज्ञा लाभः परो मतः
      - प्रज्ञा निःश्रेयसी लोके प्रज्ञा स्वर्गो मतः सताम्
    iast: "prajñā pratiṣṭhā bhūtānāṃ prajñā lābhaḥ paro mataḥ | prajñā niḥśreyasī loke prajñā svargo mataḥ satām"
  - id: 'shanti-12-178-26'
    kind: verse
    lines:
      - न तृप्तिः प्रियलाभेऽस्ति तृष्णा नाद्भिः प्रशाम्यति
      - संप्रज्वलति सा भूयः समिद्भिरिव पावकः
    iast: "na tṛptiḥ priyalābhe'sti tṛṣṇā nādbhiḥ praśāmyati | saṃprajvalati sā bhūyaḥ samidbhiriva pāvakaḥ"
  - id: 'shanti-12-179-8'
    kind: verse
    lines:
      - पुलाका इव धान्येषु पुत्तिका इव पक्षिषु
      - तद्विधास्ते मनुष्येषु येषां धर्मो न कारणम्
    iast: "pulākā iva dhānyeṣu puttikā iva pakṣiṣu | tadvidhāste manuṣyeṣu yeṣāṃ dharmo na kāraṇam"
  - id: 'shanti-12-188-1'
    kind: verse
    lines:
      - सत्यं ब्रह्म तपः सत्यं सत्यं सृजति च प्रजाः
      - सत्येन धार्यते लोकः स्वर्गं सत्येन गच्छति
    iast: "satyaṃ brahma tapaḥ satyaṃ satyaṃ sṛjati ca prajāḥ | satyena dhāryate lokaḥ svargaṃ satyena gacchati"
  - id: 'shanti-12-188-2'
    kind: verse
    lines:
      - अनृतं तमसो रूपं तमसा नीयते ह्यधः
      - तमोग्रस्ता न पश्यन्ति प्रकाशं तमसाऽऽवृतम्
    iast: "anṛtaṃ tamaso rūpaṃ tamasā nīyate hyadhaḥ | tamograstā na paśyanti prakāśaṃ tamasā''vṛtam"
  - id: 'shanti-12-188-3'
    kind: verse
    lines:
      - स्वर्गः प्रकाश इत्याहुर्नरकं तम एव च
      - सत्यानृतात्तदुभयं प्राप्यते जगतीचरैः
    iast: "svargaḥ prakāśa ityāhurnarakaṃ tama eva ca | satyānṛtāttadubhayaṃ prāpyate jagatīcaraiḥ"
  - id: 'shanti-12-189-14'
    kind: verse
    lines:
      - वत्सलाः सर्वभूतानां वाच्याः श्रोत्रसुखा गिरः
      - परिवादापवादौ च पारुष्यं चात्र गर्हितम्
    iast: "vatsalāḥ sarvabhūtānāṃ vācyāḥ śrotrasukhā giraḥ | parivādāpavādau ca pāruṣyaṃ cātra garhitam"
  - id: 'shanti-12-189-15'
    kind: verse
    lines:
      - अवज्ञानमहंकारो दम्भश्चैव विगर्हितः
      - अहिंसा सत्यमक्रोधः सर्वाश्रमगतं तपः
    iast: "avajñānamahaṃkāro dambhaścaiva vigarhitaḥ | ahiṃsā satyamakrodhaḥ sarvāśramagataṃ tapaḥ"
  - id: 'shanti-12-233-6'
    kind: verse
    lines:
      - संतापाद्धश्यते रूपं संतापाद्धश्यते श्रियः
      - संतापाद्धश्यते चायुर्धर्मश्चैव सुरेश्वर
    iast: "saṃtāpāddhaśyate rūpaṃ saṃtāpāddhaśyate śriyaḥ | saṃtāpāddhaśyate cāyurdharmaścaiva sureśvara"
  - id: 'shanti-12-234-4'
    kind: verse
    lines:
      - विशोकता सुखं धत्ते धत्ते चारोग्यमुत्तमम् आरोग्याच्च शरीरस्य स पुनर्विन्दते श्रियम्
    iast: "viśokatā sukhaṃ dhatte dhatte cārogyamuttamam ārogyācca śarīrasya sa punarvindate śriyam"
  - id: 'shanti-12-305-8'
    kind: verse
    lines:
      - नारुतुदः स्यान्न नृशंसवादी न हीनतः परमभ्याददीत
      - ययाऽस्य वाचा पर उद्विजेत न तां वदेदुशतिं पापलोक्याम्
    iast: "nārutudaḥ syānna nṛśaṃsavādī na hīnataḥ paramabhyādadīta | yayā'sya vācā para udvijeta na tāṃ vadeduśatiṃ pāpalokyām"
  - id: 'shanti-12-305-13'
    kind: verse
    lines:
      - वेदस्योपनिषत्सत्यं सत्यस्योपनिषद्दमः
      - दमस्योपनिषन्मोक्ष एतत्सर्वानुशासनम्
    iast: "vedasyopaniṣatsatyaṃ satyasyopaniṣaddamaḥ | damasyopaniṣanmokṣa etatsarvānuśāsanam"
  - id: 'shanti-12-305-36'
    kind: verse
    lines:
      - विश्नोदरे ये निरताः सदैव स्तेना नरा वाक्यरुषाश्च नित्यम्
      - अपेतधर्मानिति तान्विदित्वा दूराद्देवः संपरिवर्जयन्ति
    iast: "viśnodare ye niratāḥ sadaiva stenā narā vākyaruṣāśca nityam | apetadharmāniti tānviditvā dūrāddevaḥ saṃparivarjayanti"
  - id: 'anuzAsana-13-161-6'
    kind: verse
    lines:
      - आचाराल्लभते ह्यायुराचाराल्लभते श्रियम्
      - आचारात्कीर्तिमाप्नोति पुरुषः प्रेत्य चेह च
    iast: "ācārāllabhate hyāyurācārāllabhate śriyam | ācārātkīrtimāpnoti puruṣaḥ pretya ceha ca"
  - id: 'anuzAsana-13-161-21'
    kind: verse
    lines:
      - परदारा न गन्तव्याः सर्ववर्णेषु कर्हिचित्
      - नहीदृशमनायुष्यं लोके किञ्चन विद्यते
    iast: "paradārā na gantavyāḥ sarvavarṇeṣu karhicit | nahīdṛśamanāyuṣyaṃ loke kiñcana vidyate"
  - id: 'anuzAsana-13-161-37'
    kind: verse
    lines:
      - नास्तिक्यं वेदनिन्दां च परनिन्दां च कुत्सनम्
      - द्वेषस्तम्भाभिमानं च तैक्ष्ण्यं च परिवर्जयेत्
    iast: "nāstikyaṃ vedanindāṃ ca paranindāṃ ca kutsanam | dveṣastambhābhimānaṃ ca taikṣṇyaṃ ca parivarjayet"
  - id: 'anuzAsana-13-161-119'
    kind: verse
    lines:
      - वृद्धो ज्ञातिस्तथा मित्रमनाथा च स्वसा गुरुः कुलीनः पण्डित इति रक्ष्या निःस्वः स्वशक्तितः
      - गृहे वासयितव्यास्ते धन्यमायुष्यमेव च
    iast: "vṛddho jñātistathā mitramanāthā ca svasā guruḥ kulīnaḥ paṇḍita iti rakṣyā niḥsvaḥ svaśaktitaḥ | gṛhe vāsayitavyāste dhanyamāyuṣyameva ca"
  - id: 'anuzAsana-13-161-148'
    kind: verse
    lines:
      - न चेर्ष्या स्त्रीषु कर्तव्या रक्ष्या दाराश्च सर्वशः
      - अनायुष्या भवेदीर्ष्या तस्मादीर्ष्यां विवर्जयेत्
    iast: "na cerṣyā strīṣu kartavyā rakṣyā dārāśca sarvaśaḥ | anāyuṣyā bhavedīrṣyā tasmādīrṣyāṃ vivarjayet"
  - id: 'anuzAsana-13-170-3'
    kind: verse
    lines:
      - अगाधे विमले शुद्धे सत्यतीर्थे धृतिह्रदे
      - स्नातव्यं मानसे तीर्थे सत्वमालम्ब्य शाश्वतम्
    iast: "agādhe vimale śuddhe satyatīrthe dhṛtihrade | snātavyaṃ mānase tīrthe satvamālambya śāśvatam"
  - id: 'anuzAsana-13-170-4'
    kind: verse
    lines:
      - तीर्थशौचं तपो ज्ञानं मार्दवं सत्यमार्जवम्
      - अहिंसा सर्वभूतानामानृशंस्यं दमः शमः
    iast: "tīrthaśaucaṃ tapo jñānaṃ mārdavaṃ satyamārjavam | ahiṃsā sarvabhūtānāmānṛśaṃsyaṃ damaḥ śamaḥ"
  - id: 'anuzAsana-13-170-12'
    kind: verse
    lines:
      - वृत्तं शौचं महाशौचं तीर्थशौचमतः परम्
      - ज्ञानोत्पन्नं च यच्छौचं तच्छौचं परमं स्मृतम्
    iast: "vṛttaṃ śaucaṃ mahāśaucaṃ tīrthaśaucamataḥ param | jñānotpannaṃ ca yacchaucaṃ tacchaucaṃ paramaṃ smṛtam"
  - id: 'anuzAsana-13-177-36'
    kind: verse
    lines:
      - धन्यं यशस्यामायुष्यं स्वर्ग्यं स्वस्त्ययनं महत्
      - मांसस्याभक्षणं प्राहुर्नियताः परमर्षयः
    iast: "dhanyaṃ yaśasyāmāyuṣyaṃ svargyaṃ svastyayanaṃ mahat | māṃsasyābhakṣaṇaṃ prāhurniyatāḥ paramarṣayaḥ"
  - id: 'anuzAsana-13-242-26'
    kind: verse
    lines:
      - कामक्रोधाद्भयाद्वाऽपि यदि चेत्संत्यजेत्तनुम्
      - सोऽनन्तं नरकं याति आत्महन्तृत्वकारणात्
    iast: "kāmakrodhādbhayādvā'pi yadi cetsaṃtyajettanum | so'nantaṃ narakaṃ yāti ātmahantṛtvakāraṇāt"
  - id: 'anuzAsana-13-244-3'
    kind: verse
    lines:
      - शोकस्थानसहस्राणि भयस्थानशतानि च
      - दिवसेदिवसे मूढमाविशन्ति न पण्डितम्
    iast: "śokasthānasahasrāṇi bhayasthānaśatāni ca | divasedivase mūḍhamāviśanti na paṇḍitam"
  - id: 'anuzAsana-13-244-14'
    kind: verse
    lines:
      - सुखमेकान्ततो नास्ति शक्रस्यापि त्रिविष्टपे
      - तत्रापि सुमहद्दुःखं न नित्यं लभते सुखम्
    iast: "sukhamekāntato nāsti śakrasyāpi triviṣṭape | tatrāpi sumahadduḥkhaṃ na nityaṃ labhate sukham"
  - id: 'anuzAsana-13-244-15'
    kind: verse
    lines:
      - सुखस्यान्तरं दुःखं दुःखस्यानन्तरं सुखम्
      - क्षया निचयाः सर्वे पतनान्ताः समुच्छ्रयाः
    iast: "sukhasyāntaraṃ duḥkhaṃ duḥkhasyānantaraṃ sukham | kṣayā nicayāḥ sarve patanāntāḥ samucchrayāḥ"
  - id: 'anuzAsana-13-244-16'
    kind: verse
    lines:
      - संयोगा मरणान्तं च जीवितम् उच्छ्रयांश्च निपाताश्च दृष्ट्या प्रत्यक्षतस्त्रयम्
      - अनित्यमसुखं चेति व्यवस्येत्सर्वमेव च
    iast: "saṃyogā maraṇāntaṃ ca jīvitam ucchrayāṃśca nipātāśca dṛṣṭyā pratyakṣatastrayam | anityamasukhaṃ ceti vyavasyetsarvameva ca"
  - id: 'anuzAsana-13-244-17'
    kind: verse
    lines:
      - अर्थानामार्जने दुःखमार्जितानां तु रक्षणे
      - नाशे दुःखं व्यये दुःखं धिगर्थं दुःखभाजनम्
    iast: "arthānāmārjane duḥkhamārjitānāṃ tu rakṣaṇe | nāśe duḥkhaṃ vyaye duḥkhaṃ dhigarthaṃ duḥkhabhājanam"
  - id: 'anuzAsana-13-244-70'
    kind: verse
    lines:
      - जायामानांश्च सम्प्रेक्ष्य म्रियमाणांस्तथैव च
      - न संवेगोस्ति चेत्पुंसः काष्ठलोसमो हि सः
    iast: "jāyāmānāṃśca samprekṣya mriyamāṇāṃstathaiva ca | na saṃvegosti cetpuṃsaḥ kāṣṭhalosamo hi saḥ"
  - id: 'anuzAsana-13-253-2'
    kind: verse
    lines:
      - उपायोऽयं परप्राप्तौ परमः परिकीर्तितः
      - नारायणास्यानुध्यानमर्चनं यजनं स्तुतिः
    iast: "upāyo'yaṃ paraprāptau paramaḥ parikīrtitaḥ | nārāyaṇāsyānudhyānamarcanaṃ yajanaṃ stutiḥ"
  - id: 'anuzAsana-13-254-4'
    kind: verse
    lines:
      - जगत्प्रभुं देवदेवमनन्तं पुरुषोत्तमम्
      - स्तुवन्नामसहस्रेण पुरुषः सततोत्थितः
    iast: "jagatprabhuṃ devadevamanantaṃ puruṣottamam | stuvannāmasahasreṇa puruṣaḥ satatotthitaḥ"
  - id: 'anuzAsana-13-254-8'
    kind: verse
    lines:
      - एष मे सर्वधर्माणां धर्मोऽधिकतमो मतः
      - यद्भक्त्या पुण्डरीकाक्षं स्तवैरर्चेन्नरः सदा
    iast: "eṣa me sarvadharmāṇāṃ dharmo'dhikatamo mataḥ | yadbhaktyā puṇḍarīkākṣaṃ stavairarcennaraḥ sadā"
  - id: 'anuzAsana-13-254-135'
    kind: verse
    lines:
      - न क्रोधो न च मात्सर्यं न लोभो नाशुभा मतिः
      - भन्ति कृतपुण्यानां भक्तानां पुरुषोत्तमे
    iast: "na krodho na ca mātsaryaṃ na lobho nāśubhā matiḥ | bhanti kṛtapuṇyānāṃ bhaktānāṃ puruṣottame"
  - id: 'anuzAsana-13-254-142'
    kind: verse
    lines:
      - एको विष्णुर्महद्भूतं पृथग्भूतान्यनेकशः
      - त्रींल्लोकान्व्याप्य भूतात्मा भुङ्क्ते विश्वभुगव्ययः
    iast: "eko viṣṇurmahadbhūtaṃ pṛthagbhūtānyanekaśaḥ | trīṃllokānvyāpya bhūtātmā bhuṅkte viśvabhugavyayaḥ"
  - id: 'anuzAsana-13-254-148'
    kind: verse
    lines:
      - नमोस्त्वनन्ताय सहस्रमूर्तये सहस्रपादाक्षिशिरोरुबाहवे
      - सहस्रनाम्ने पुरुषाय शाश्वते सहस्रकोटियुगधारिणे नमः श्रीसहस्रकोटियुगधारिणे नम इति
    iast: "namostvanantāya sahasramūrtaye sahasrapādākṣiśirorubāhave | sahasranāmne puruṣāya śāśvate sahasrakoṭiyugadhāriṇe namaḥ śrīsahasrakoṭiyugadhāriṇe nama iti"
  - id: 'anuzAsana-13-271-63'
    kind: verse
    lines:
      - पालय त्वं प्रजाः सर्वाः शान्तात्मा त्वनुशासिता
      - द्वैपायनः स्वयंचक्षुः कृष्णस्तेऽस्तु परायणम्
      - वैशम्पायन उवाच
    iast: "pālaya tvaṃ prajāḥ sarvāḥ śāntātmā tvanuśāsitā | dvaipāyanaḥ svayaṃcakṣuḥ kṛṣṇaste'stu parāyaṇam | vaiśampāyana uvāca"
  - id: 'anuzAsana-13-271-64'
    kind: verse
    lines:
      - इत्युक्त्वोपासनार्थाय विरराम महामतिः
    iast: "ityuktvopāsanārthāya virarāma mahāmatiḥ"
  - id: 'anuzAsana-13-272-4'
    kind: verse
    lines:
      - अभून्मुहूर्तं स्तिमितं सर्वं तद्राजमण्डलम्
      - तूष्णींभूते ततस्तस्मिन्पटे चित्रमिवार्पितम्
    iast: "abhūnmuhūrtaṃ stimitaṃ sarvaṃ tadrājamaṇḍalam | tūṣṇīṃbhūte tatastasminpaṭe citramivārpitam"
  - id: 'anuzAsana-13-272-6'
    kind: verse
    lines:
      - राजन्प्रकृतिमापन्नः कुरुराजो युधिष्ठिरः
      - सहितो भ्रातृभिः सर्वैः पार्तिवैश्चानुयायिभिः
    iast: "rājanprakṛtimāpannaḥ kururājo yudhiṣṭhiraḥ | sahito bhrātṛbhiḥ sarvaiḥ pārtivaiścānuyāyibhiḥ"
  - id: 'anuzAsana-13-272-7'
    kind: verse
    lines:
      - उपास्ते त्वां नरव्याघ्र सह कृष्णेन धीमता
      - तमिमं पुरयानाय समनुज्ञातुमर्हसि
    iast: "upāste tvāṃ naravyāghra saha kṛṣṇena dhīmatā | tamimaṃ purayānāya samanujñātumarhasi"
  - id: 'anuzAsana-13-272-8'
    kind: verse
    lines:
      - एवमुक्तो भगवता व्यासेन पृथिवीपतिः
      - युधिष्ठिरं सहामात्यमनुजज्ञे नदीसुतः
    iast: "evamukto bhagavatā vyāsena pṛthivīpatiḥ | yudhiṣṭhiraṃ sahāmātyamanujajñe nadīsutaḥ"
  - id: 'anuzAsana-13-272-9'
    kind: verse
    lines:
      - उवाच चैनं मधुरं नृपं शान्तनवो नृपः
      - प्रविशस्व पुरीं राजन्धर्मे च ध्रियतां मनः
    iast: "uvāca cainaṃ madhuraṃ nṛpaṃ śāntanavo nṛpaḥ | praviśasva purīṃ rājandharme ca dhriyatāṃ manaḥ"
  - id: 'anuzAsana-13-272-11'
    kind: verse
    lines:
      - क्षत्रधर्मरतः पार्थ पितॄन्देवांश्च तर्पय
      - श्रेयसा योक्ष्यसे चैव व्येतु ते मानसो ज्वरः
    iast: "kṣatradharmarataḥ pārtha pitṝndevāṃśca tarpaya | śreyasā yokṣyase caiva vyetu te mānaso jvaraḥ"
  - id: 'anuzAsana-13-272-14'
    kind: verse
    lines:
      - आगन्तव्यं च भवता समये मम पार्थिव
      - विनिवृत्ते दिनकरे प्रवृत्ते चोत्तरायणे
    iast: "āgantavyaṃ ca bhavatā samaye mama pārthiva | vinivṛtte dinakare pravṛtte cottarāyaṇe"
  - id: 'anuzAsana-13-272-15'
    kind: verse
    lines:
      - तथेत्युक्त्वा च कौन्तेयः सोभिवाद्य पितामहम्
      - प्रययौ सपरीवारो नगरं नागसाह्वयम्
    iast: "tathetyuktvā ca kaunteyaḥ sobhivādya pitāmaham | prayayau saparīvāro nagaraṃ nāgasāhvayam"
  - id: 'anuzAsana-13-273-5'
    kind: verse
    lines:
      - उषित्वा शर्वरीः श्रीमान्पञ्चाशन्नगरोत्तमे
      - समयं कौरवाग्र्यस्य सस्मार पुरुषर्षभः
    iast: "uṣitvā śarvarīḥ śrīmānpañcāśannagarottame | samayaṃ kauravāgryasya sasmāra puruṣarṣabhaḥ"
  - id: 'anuzAsana-13-273-6'
    kind: verse
    lines:
      - स निर्ययौ जगपुराद्यजकैः परिवारितः
      - दृष्ट्वा निवृत्तमादित्यं प्रवृत्तं चोत्तरायणम्
    iast: "sa niryayau jagapurādyajakaiḥ parivāritaḥ | dṛṣṭvā nivṛttamādityaṃ pravṛttaṃ cottarāyaṇam"
  - id: 'anuzAsana-13-273-12'
    kind: verse
    lines:
      - निश्चक्राम पुरात्तस्माद्यथा देवपतिस्तथा
      - आससाद कुरुक्षेत्रे ततः शान्तनवं नृपः
    iast: "niścakrāma purāttasmādyathā devapatistathā | āsasāda kurukṣetre tataḥ śāntanavaṃ nṛpaḥ"
  - id: 'anuzAsana-13-273-19'
    kind: verse
    lines:
      - युधिष्ठिरोऽहं नृपते नमस्ते जाह्नवीसुत
      - शृणोषि चेन्महाबाहो ब्रूहि किं करवाणि ते
    iast: "yudhiṣṭhiro'haṃ nṛpate namaste jāhnavīsuta | śṛṇoṣi cenmahābāho brūhi kiṃ karavāṇi te"
  - id: 'anuzAsana-13-273-21'
    kind: verse
    lines:
      - पुत्रश्च ते महातेजा धृतराष्ट्रो जनेश्वरः
      - उपस्थितः सहामात्यो वासुदेवश्च वीर्यवान्
    iast: "putraśca te mahātejā dhṛtarāṣṭro janeśvaraḥ | upasthitaḥ sahāmātyo vāsudevaśca vīryavān"
  - id: 'anuzAsana-13-273-26'
    kind: verse
    lines:
      - दिष्ट्या प्राप्तोसि कौन्तेय सहामात्यो युधिष्ठिर
      - परिवृत्तो हि भगवान्सहस्रांशुर्दिवाकरः
    iast: "diṣṭyā prāptosi kaunteya sahāmātyo yudhiṣṭhira | parivṛtto hi bhagavānsahasrāṃśurdivākaraḥ"
  - id: 'anuzAsana-13-273-29'
    kind: verse
    lines:
      - एवमुक्त्वा तु गाङ्गेयो धर्मपुत्रं युधिष्ठिरम्
      - धृतराष्ट्रमथामन्त्र्य काले वचनमब्रवीत्
      - भीष्म उवाच
    iast: "evamuktvā tu gāṅgeyo dharmaputraṃ yudhiṣṭhiram | dhṛtarāṣṭramathāmantrya kāle vacanamabravīt | bhīṣma uvāca"
  - id: 'anuzAsana-13-273-33'
    kind: verse
    lines:
      - यथा पाण्डोः सुता राजंस्तथैव तव धर्मतः
      - तान्पालय स्थितो धर्मे गुरुशुश्रूषणे रतान्
    iast: "yathā pāṇḍoḥ sutā rājaṃstathaiva tava dharmataḥ | tānpālaya sthito dharme guruśuśrūṣaṇe ratān"
  - id: 'anuzAsana-13-273-35'
    kind: verse
    lines:
      - तव पुत्रा दुरात्मानः क्रोधलोभपरायणाः
      - ईर्ष्याभिभूता दुर्वृत्तास्तान्न शोचितुमर्हसि
      - वैशम्पायन उवाच
    iast: "tava putrā durātmānaḥ krodhalobhaparāyaṇāḥ | īrṣyābhibhūtā durvṛttāstānna śocitumarhasi | vaiśampāyana uvāca"
  - id: 'anuzAsana-13-273-36'
    kind: verse
    lines:
      - एतावधुक्त्वा वचनं धृतराष्ट्रं मनीषिणम्
      - वासुदेवं महाबाहुमभ्यभाषय कौरवः
      - भीष्म उवाच
    iast: "etāvadhuktvā vacanaṃ dhṛtarāṣṭraṃ manīṣiṇam | vāsudevaṃ mahābāhumabhyabhāṣaya kauravaḥ | bhīṣma uvāca"
  - id: 'anuzAsana-13-273-37'
    kind: verse
    lines:
      - भगवन्देवदेवेश सुरासुरनमस्कृत
      - त्रिविक्रम नमस्तुभ्यं शङ्खचक्रगदाधर
    iast: "bhagavandevadeveśa surāsuranamaskṛta | trivikrama namastubhyaṃ śaṅkhacakragadādhara"
  - id: 'anuzAsana-13-273-43'
    kind: verse
    lines:
      - त्वां तु जानाम्यहं देवं पुराणमृषिसत्तमम्
      - नरेण सहितं देव बदर्यां सुचिरोषितम्
    iast: "tvāṃ tu jānāmyahaṃ devaṃ purāṇamṛṣisattamam | nareṇa sahitaṃ deva badaryāṃ suciroṣitam"
  - id: 'anuzAsana-13-273-45'
    kind: verse
    lines:
      - स मां त्वमनुजानीहि कृष्ण मोक्ष्ये कलेवरम्
      - त्वयाऽहं समनुज्ञातो गच्छेयं परमां गतिम्
      - वासुदेव उवाच
    iast: "sa māṃ tvamanujānīhi kṛṣṇa mokṣye kalevaram | tvayā'haṃ samanujñāto gaccheyaṃ paramāṃ gatim | vāsudeva uvāca"
  - id: 'anuzAsana-13-273-46'
    kind: verse
    lines:
      - अनुजानामि भीष्म त्वां वसून्प्राप्नुहि पार्थिव
      - न तेऽस्ति वृजिनं किञ्चिच्छुद्धात्मैश्वर्यसंयुतः
    iast: "anujānāmi bhīṣma tvāṃ vasūnprāpnuhi pārthiva | na te'sti vṛjinaṃ kiñcicchuddhātmaiśvaryasaṃyutaḥ"
  - id: 'anuzAsana-13-273-49'
    kind: verse
    lines:
      - प्राणानुत्स्रष्टुमिच्छामि तत्रानुज्ञातुमर्हथ
      - सत्येषु यतितव्यं वः सत्यं हि परमं बलम्
    iast: "prāṇānutsraṣṭumicchāmi tatrānujñātumarhatha | satyeṣu yatitavyaṃ vaḥ satyaṃ hi paramaṃ balam"
  - id: 'anuzAsana-13-274-1'
    kind: verse
    lines:
      - एवमुक्त्वा कुरून्सर्वान्भीष्मः शान्तनवस्तदा
      - तूष्णीं बभूव कौरव्यः स मुहूर्तमरिंदम
    iast: "evamuktvā kurūnsarvānbhīṣmaḥ śāntanavastadā | tūṣṇīṃ babhūva kauravyaḥ sa muhūrtamariṃdama"
  - id: 'anuzAsana-13-274-6'
    kind: verse
    lines:
      - सन्निरुद्धस्तु तेनात्मा सर्वेष्वायतनेषु च
      - जगाम भित्त्वा मूर्धानं दिवमभ्युत्पपात ह
    iast: "sanniruddhastu tenātmā sarveṣvāyataneṣu ca | jagāma bhittvā mūrdhānaṃ divamabhyutpapāta ha"
  - id: 'anuzAsana-13-274-7'
    kind: verse
    lines:
      - देवदुन्दुभिनादश्च पुष्पवर्षैः सहाभवत्
      - सिद्धा ब्रह्मर्षयश्चैव सादुसाध्विति हर्षिताः
    iast: "devadundubhinādaśca puṣpavarṣaiḥ sahābhavat | siddhā brahmarṣayaścaiva sādusādhviti harṣitāḥ"
  - id: 'anuzAsana-13-274-17'
    kind: verse
    lines:
      - संस्कृत्य च कुरुश्रेष्ठं गाङ्गेयं कुरुसत्तमाः
      - जग्मुर्भागीरथीं पुण्यामृषिजुष्टां कुरूद्वहाः
    iast: "saṃskṛtya ca kuruśreṣṭhaṃ gāṅgeyaṃ kurusattamāḥ | jagmurbhāgīrathīṃ puṇyāmṛṣijuṣṭāṃ kurūdvahāḥ"
  - id: 'Azvamedhika-14-1-3'
    kind: verse
    lines:
      - उत्तीर्य तु महाबाहुर्बाष्पव्याकुललोचनः
      - पपात तीरे गङ्गाया व्याधविद्ध इव द्विपः
    iast: "uttīrya tu mahābāhurbāṣpavyākulalocanaḥ | papāta tīre gaṅgāyā vyādhaviddha iva dvipaḥ"
  - id: 'Azvamedhika-14-14-2'
    kind: verse
    lines:
      - सोऽनुनीतो भगवता विष्टरश्रवसा स्वयम्
      - द्वैपायनेन कृष्णेनि देवस्थानेन चाभिभूः
    iast: "so'nunīto bhagavatā viṣṭaraśravasā svayam | dvaipāyanena kṛṣṇeni devasthānena cābhibhūḥ"
  - id: 'Azvamedhika-14-15-1'
    kind: verse
    lines:
      - स समाश्वास्य पितरं प्रज्ञाचक्षुषमीश्वरम्
      - अन्वशासत धर्मात्मा पृथिवीं भ्रातृभिः सह
    iast: "sa samāśvāsya pitaraṃ prajñācakṣuṣamīśvaram | anvaśāsata dharmātmā pṛthivīṃ bhrātṛbhiḥ saha"
  - id: 'Azvamedhika-14-15-2'
    kind: verse
    lines:
      - यथा मनुर्महाराजो रामो दाशरथिर्यथा
      - तथा भरतसिंहोऽपि पालयामास मेदिनीम्
    iast: "yathā manurmahārājo rāmo dāśarathiryathā | tathā bharatasiṃho'pi pālayāmāsa medinīm"
  - id: 'Azvamedhika-14-15-3'
    kind: verse
    lines:
      - नाधर्म्यमभवत्तत्र सर्वो धर्मरुचिर्जनः
      - बभूव नरशार्दूल यथा कृतयुगे तथा
    iast: "nādharmyamabhavattatra sarvo dharmarucirjanaḥ | babhūva naraśārdūla yathā kṛtayuge tathā"
  - id: 'Azvamedhika-14-118-57'
    kind: verse
    lines:
      - अन्वारुरोह चाप्येन प्रेम्या राजा युधिष्ठिरः अपास्य चाशु यन्तारं दारुकं सूतसत्तमम्
      - अभीशून्प्रतिजग्राह स्वयं कुरुपतिस्तदा
    iast: "anvāruroha cāpyena premyā rājā yudhiṣṭhiraḥ apāsya cāśu yantāraṃ dārukaṃ sūtasattamam | abhīśūnpratijagrāha svayaṃ kurupatistadā"
  - id: 'Azvamedhika-14-118-58'
    kind: verse
    lines:
      - उपारुह्यार्जुनश्चापि चामरव्यजनं शुभम्
      - रुक्मदण्डं बृहन्मूर्ध्नि दुधावाभिप्रदक्षिणम्
    iast: "upāruhyārjunaścāpi cāmaravyajanaṃ śubham | rukmadaṇḍaṃ bṛhanmūrdhni dudhāvābhipradakṣiṇam"
  - id: 'Azvamedhika-14-118-61'
    kind: verse
    lines:
      - उपारुह्य रथं शीघ्रं चामरव्यजने सिते
      - नकुलः सहदेवश्च धूयमानौ जनार्दनम्
    iast: "upāruhya rathaṃ śīghraṃ cāmaravyajane site | nakulaḥ sahadevaśca dhūyamānau janārdanam"
  - id: 'Azvamedhika-14-118-63'
    kind: verse
    lines:
      - त्रियोजने व्यतीते तु परिष्वज्य च पाण्डवान्
      - विसृज्य कृष्णस्तान्सर्वान्प्रणतान्द्वारका ययौ
    iast: "triyojane vyatīte tu pariṣvajya ca pāṇḍavān | visṛjya kṛṣṇastānsarvānpraṇatāndvārakā yayau"
  - id: 'Azvamedhika-14-118-66'
    kind: verse
    lines:
      - युधिष्ठिरस्तु धर्मात्मा हृदि कृत्वा जनार्दनम्
      - तद्भक्तस्तन्मना युक्तस्तद्याजी तत्परोऽभवत्
    iast: "yudhiṣṭhirastu dharmātmā hṛdi kṛtvā janārdanam | tadbhaktastanmanā yuktastadyājī tatparo'bhavat"
  - id: 'mausala-15-1-1'
    kind: verse
    lines:
      - वैशम्पायन उवाच
      - षट्त्रिंशे त्वथ् संप्राप्ते वर्षे कौरवन्दनः
      - ददर्श विपरीतानि निमित्तानि युधिष्टिरः
    iast: "vaiśampāyana uvāca | ṣaṭtriṃśe tvath saṃprāpte varṣe kauravandanaḥ | dadarśa viparītāni nimittāni yudhiṣṭiraḥ"
  - id: 'mausala-15-3-18'
    kind: verse
    lines:
      - एवं पश्यन्हृषिकेशः संप्राप्तं कालपर्ययम्
      - त्रयोदश्याममावास्यां तान्दृष्ट्वा प्राब्रवीदिदम्
    iast: "evaṃ paśyanhṛṣikeśaḥ saṃprāptaṃ kālaparyayam | trayodaśyāmamāvāsyāṃ tāndṛṣṭvā prābravīdidam"
  - id: 'mausala-15-3-21'
    kind: verse
    lines:
      - पुत्रशोकाभिसंतप्ता गान्धारी हतबान्धवा
      - यदनुव्याजहारार्ता तदिदं समुपागमत्
    iast: "putraśokābhisaṃtaptā gāndhārī hatabāndhavā | yadanuvyājahārārtā tadidaṃ samupāgamat"
  - id: 'mausala-15-3-23'
    kind: verse
    lines:
      - इत्युक्त्वा वासुदेवस्तु चिकीर्षुः सत्यमेव तत्
      - आज्ञापयामास तदा तीर्थयात्रामरिंदमः
    iast: "ityuktvā vāsudevastu cikīrṣuḥ satyameva tat | ājñāpayāmāsa tadā tīrthayātrāmariṃdamaḥ"
  - id: 'mausala-15-4-11'
    kind: verse
    lines:
      - ततः प्रभासे न्यवसन्यथोद्दिष्टं यथागृहम्
      - प्रभूतभक्ष्यपेयास्ते सदारा यादवास्तदा
    iast: "tataḥ prabhāse nyavasanyathoddiṣṭaṃ yathāgṛham | prabhūtabhakṣyapeyāste sadārā yādavāstadā"
  - id: 'mausala-15-4-16'
    kind: verse
    lines:
      - ततस्तूर्यशताकीर्णं नटनर्तकसंकुलम्
      - अवर्तत महापानं प्रभासे तिग्मतेजसाम्
    iast: "tatastūryaśatākīrṇaṃ naṭanartakasaṃkulam | avartata mahāpānaṃ prabhāse tigmatejasām"
  - id: 'mausala-15-4-38'
    kind: verse
    lines:
      - ततोऽन्धकाश्च भोजाश्च शैनेया वृष्णयस्तथा
      - जघ्नुरन्योन्यमाक्रन्दे मुसलैः कालचोदिताः
    iast: "tato'ndhakāśca bhojāśca śaineyā vṛṣṇayastathā | jaghnuranyonyamākrande musalaiḥ kālacoditāḥ"
  - id: 'mausala-15-4-42'
    kind: verse
    lines:
      - अवधीत्पितरं पुत्रः पिता पुत्रं च भारत
      - मत्ताः परिपतन्ति स्म योधयन्तः परस्परम्
    iast: "avadhītpitaraṃ putraḥ pitā putraṃ ca bhārata | mattāḥ paripatanti sma yodhayantaḥ parasparam"
  - id: 'mausala-15-5-2'
    kind: verse
    lines:
      - ततः समासाद्य महानुभावः कृष्णस्तदा दारुकमन्वशासत्
      - गत्वा कुरून्सर्वमिमं महान्तं पार्थाय शंसस्व वधं यदूनाम्
    iast: "tataḥ samāsādya mahānubhāvaḥ kṛṣṇastadā dārukamanvaśāsat | gatvā kurūnsarvamimaṃ mahāntaṃ pārthāya śaṃsasva vadhaṃ yadūnām"
  - id: 'mausala-15-5-7'
    kind: verse
    lines:
      - ततः पुरीं द्वारवतीं पविश्य जनार्दनः पितरं प्राह वाक्यम्
      - सर्वं भवान्रक्षतु नः समग्रं धनंजयस्यागमनं प्रतीक्षन्
    iast: "tataḥ purīṃ dvāravatīṃ paviśya janārdanaḥ pitaraṃ prāha vākyam | sarvaṃ bhavānrakṣatu naḥ samagraṃ dhanaṃjayasyāgamanaṃ pratīkṣan"
  - id: 'mausala-15-5-9'
    kind: verse
    lines:
      - नाहं विना यदुभिर्यादवानां पुरीमिमामशकं द्रष्टुमद्य
      - तपश्चरिष्यामि निबोध तन्मे रामेणि सार्धं वनमभ्युपेत्य
    iast: "nāhaṃ vinā yadubhiryādavānāṃ purīmimāmaśakaṃ draṣṭumadya | tapaścariṣyāmi nibodha tanme rāmeṇi sārdhaṃ vanamabhyupetya"
  - id: 'mausala-15-5-12'
    kind: verse
    lines:
      - ततो गत्वा केशवस्तं ददर्श रामं वने स्थितमेकं विविक्ते
    iast: "tato gatvā keśavastaṃ dadarśa rāmaṃ vane sthitamekaṃ vivikte"
  - id: 'mausala-15-5-13'
    kind: verse
    lines:
      - अथापश्यद्योगयुक्तस्य तस्य नागं मुखान्निस्सरन्तं महान्तम्
      - श्वेतं ययौ सततः प्रेक्षमाणो महार्णवो येन महानुभावः
      - सहस्रशीर्षः पर्वताभोगवर्ष्मा रक्ताननः स्वां तनुं तां विमुच्य
    iast: "athāpaśyadyogayuktasya tasya nāgaṃ mukhānnissarantaṃ mahāntam | śvetaṃ yayau satataḥ prekṣamāṇo mahārṇavo yena mahānubhāvaḥ | sahasraśīrṣaḥ parvatābhogavarṣmā raktānanaḥ svāṃ tanuṃ tāṃ vimucya"
  - id: 'mausala-15-5-14'
    kind: verse
    lines:
      - संदृश्यन्तं सागरान्तं विशन्तं सम्यक्तदा सागरः प्रत्यगृह्णात्
      - नागा दिव्याः सरितश्चैव पुण्याः कर्कोटको वासुकिस्तक्षकश्च
    iast: "saṃdṛśyantaṃ sāgarāntaṃ viśantaṃ samyaktadā sāgaraḥ pratyagṛhṇāt | nāgā divyāḥ saritaścaiva puṇyāḥ karkoṭako vāsukistakṣakaśca"
  - id: 'mausala-15-5-20'
    kind: verse
    lines:
      - संचिन्तयन्नन्धकवृष्णिनाशं कुरुक्षयं चैव महानुभावः
      - मेने ततः संक्रमणस्य कालं ततश्चकारेन्द्रियसन्निरोधम्
    iast: "saṃcintayannandhakavṛṣṇināśaṃ kurukṣayaṃ caiva mahānubhāvaḥ | mene tataḥ saṃkramaṇasya kālaṃ tataścakārendriyasannirodham"
  - id: 'mausala-15-5-22'
    kind: verse
    lines:
      - स सन्निरुद्धेन्द्रियवाङ्मनास्तु शिश्ये महायोगमुपेत्य कृष्णः
      - जरोथ तं देशमुपाजगाम लुब्धस्तदानीं मृगलिप्सुरुग्रः
    iast: "sa sanniruddhendriyavāṅmanāstu śiśye mahāyogamupetya kṛṣṇaḥ | jarotha taṃ deśamupājagāma lubdhastadānīṃ mṛgalipsurugraḥ"
  - id: 'mausala-15-5-28'
    kind: verse
    lines:
      - ततो राजन्भगवानुग्रतेजा नारायणः प्रभवश्चाव्ययश्च
      - योगाचार्यो रोदसी व्याप्य लक्ष्म्या स्थानं प्राप स्वं महात्माऽप्रमेयम्
    iast: "tato rājanbhagavānugratejā nārāyaṇaḥ prabhavaścāvyayaśca | yogācāryo rodasī vyāpya lakṣmyā sthānaṃ prāpa svaṃ mahātmā'prameyam"
  - id: 'mausala-15-6-1'
    kind: verse
    lines:
      - दारुकोपि कुरून्गत्वा दृष्ट्वा पार्थान्महारथान्
      - आचष्ट मौसले वृष्णीनन्योन्येनोपसंहृतान्
    iast: "dārukopi kurūngatvā dṛṣṭvā pārthānmahārathān | ācaṣṭa mausale vṛṣṇīnanyonyenopasaṃhṛtān"
  - id: 'mausala-15-6-2'
    kind: verse
    lines:
      - श्रुत्वा विनष्टान्वार्ष्णेयान्सभोजान्धककौकुरान्
      - पाण्डवाः शोकसंतप्ता वित्रस्तमनसोऽभवन्
    iast: "śrutvā vinaṣṭānvārṣṇeyānsabhojāndhakakaukurān | pāṇḍavāḥ śokasaṃtaptā vitrastamanaso'bhavan"
  - id: 'mausala-15-6-3'
    kind: verse
    lines:
      - ततोऽर्जुनस्तानामन्त्र्य केशवस्य प्रियः सखा
      - प्रययौ मातुलं द्रष्टुं नेदमस्तीति चाब्रवीत्
    iast: "tato'rjunastānāmantrya keśavasya priyaḥ sakhā | prayayau mātulaṃ draṣṭuṃ nedamastīti cābravīt"
  - id: 'mausala-15-7-4'
    kind: verse
    lines:
      - समालिङ्ग्यार्जुनं वृद्धः स भुजाभ्यां महाभुजः रुरोदाथ स्मरञ्शौरिं विललाप सुविह्वलः
      - भ्रातॄन्पुत्रांश्च पौत्रांश्च दौहित्रान्स सखीनपि
      - वसुदेव उवाच
    iast: "samāliṅgyārjunaṃ vṛddhaḥ sa bhujābhyāṃ mahābhujaḥ rurodātha smarañśauriṃ vilalāpa suvihvalaḥ | bhrātṝnputrāṃśca pautrāṃśca dauhitrānsa sakhīnapi | vasudeva uvāca"
  - id: 'mausala-15-8-9'
    kind: verse
    lines:
      - तान्दीनमनसः सर्वान्विमूढान्गतचेतसः
      - उवाचेदं वचः काले पार्थो दीनतरस्तथा
    iast: "tāndīnamanasaḥ sarvānvimūḍhāngatacetasaḥ | uvācedaṃ vacaḥ kāle pārtho dīnatarastathā"
  - id: 'mausala-15-8-10'
    kind: verse
    lines:
      - शक्रप्रस्थमहं नेष्ये पृष्णन्धकजनं स्वयम्
      - इदं तु नगरं सर्वं समुद्रः प्लावयिष्यति
    iast: "śakraprasthamahaṃ neṣye pṛṣṇandhakajanaṃ svayam | idaṃ tu nagaraṃ sarvaṃ samudraḥ plāvayiṣyati"
  - id: 'mausala-15-8-11'
    kind: verse
    lines:
      - सज्जीकुरुत यानानि रत्नानि विविधानि च
      - वज्रोऽयं भवतां राजा शक्रप्रस्थे भविष्यति
    iast: "sajjīkuruta yānāni ratnāni vividhāni ca | vajro'yaṃ bhavatāṃ rājā śakraprasthe bhaviṣyati"
  - id: 'mausala-15-8-15'
    kind: verse
    lines:
      - श्वोभूतेऽथ ततः शौरिर्वसुदेवः प्रतापवान्
      - युक्त्वाऽऽत्मानं महातेजा जगाम गतिमुत्तमां
    iast: "śvobhūte'tha tataḥ śaurirvasudevaḥ pratāpavān | yuktvā''tmānaṃ mahātejā jagāma gatimuttamāṃ"
  - id: 'mausala-15-8-33'
    kind: verse
    lines:
      - स तेषां विधिवत्कृत्वा प्रेतकार्याणि पाण्डवः
      - सप्तमे दिवसे प्रायाद्रथमारुह्य सत्वरः
    iast: "sa teṣāṃ vidhivatkṛtvā pretakāryāṇi pāṇḍavaḥ | saptame divase prāyādrathamāruhya satvaraḥ"
  - id: 'mausala-15-8-34'
    kind: verse
    lines:
      - अश्वयुक्तै रथैश्चापि गोखरोष्ट्रयुतैरपि
      - स्त्रियस्ता वृष्णिवीराणां रुदन्त्यः शोककर्शिताः
    iast: "aśvayuktai rathaiścāpi gokharoṣṭrayutairapi | striyastā vṛṣṇivīrāṇāṃ rudantyaḥ śokakarśitāḥ"
  - id: 'mausala-15-8-43'
    kind: verse
    lines:
      - यद्यद्धि पुरुषव्याघ्रो भूमेस्तस्या व्यमुञ्चत
      - तत्तत्संप्लावयामास सलिलेन स सागरः
    iast: "yadyaddhi puruṣavyāghro bhūmestasyā vyamuñcata | tattatsaṃplāvayāmāsa salilena sa sāgaraḥ"
  - id: 'mausala-15-8-47'
    kind: verse
    lines:
      - ततो लोभः समभवद्दस्यूनां निहतेश्वराः
      - दृष्ट्वा स्त्रियो नीयमानाः पार्थेनैकेन भारत
    iast: "tato lobhaḥ samabhavaddasyūnāṃ nihateśvarāḥ | dṛṣṭvā striyo nīyamānāḥ pārthenaikena bhārata"
  - id: 'mausala-15-8-51'
    kind: verse
    lines:
      - महता सिंहनादेन त्रासयन्तः पृथग्जनम्
      - अभिपेतुर्धनार्थं ते कालपर्यायचोदिताः
    iast: "mahatā siṃhanādena trāsayantaḥ pṛthagjanam | abhipeturdhanārthaṃ te kālaparyāyacoditāḥ"
  - id: 'mausala-15-8-59'
    kind: verse
    lines:
      - कलत्रस्य बहुत्वाद्धि सम्पतन्सु ततस्ततः
      - प्रयत्नमकरोत्पार्थो जनस्य परिरक्षणे
    iast: "kalatrasya bahutvāddhi sampatansu tatastataḥ | prayatnamakarotpārtho janasya parirakṣaṇe"
  - id: 'mausala-15-8-66'
    kind: verse
    lines:
      - अस्त्राणां च प्रणाशेन बाहुवीर्यस्य च क्षयात्
      - धनुषश्चाविधेयत्वाच्छराणां संक्षयेण च
    iast: "astrāṇāṃ ca praṇāśena bāhuvīryasya ca kṣayāt | dhanuṣaścāvidheyatvāccharāṇāṃ saṃkṣayeṇa ca"
  - id: 'mausala-15-8-67'
    kind: verse
    lines:
      - बभूव विमनाः पार्थो दैवमित्युनुचिन्तयन्
      - न्यवर्तत ततो राजन्नेदमस्तीति चिन्तयन्
    iast: "babhūva vimanāḥ pārtho daivamityunucintayan | nyavartata tato rājannedamastīti cintayan"
  - id: 'mausala-15-8-68'
    kind: verse
    lines:
      - ततः शेषं समादाय कलत्रस्य महामतिः
      - हृतभूयिष्ठरत्नस्य कुरुक्षेत्रमवातरत्
    iast: "tataḥ śeṣaṃ samādāya kalatrasya mahāmatiḥ | hṛtabhūyiṣṭharatnasya kurukṣetramavātarat"
  - id: 'mausala-15-8-69'
    kind: verse
    lines:
      - युधिष्ठिरस्यानुमते वंशकर्तॄन्कुमारकान्
      - न्यवेशयत कौरव्यस्तत्रतत्र धनंजयः
    iast: "yudhiṣṭhirasyānumate vaṃśakartṝnkumārakān | nyaveśayata kauravyastatratatra dhanaṃjayaḥ"
  - id: 'mausala-15-8-77'
    kind: verse
    lines:
      - स तत्कृत्वा प्राप्तकालं बाष्णेणापिहितोऽर्जुनः
      - कृष्णद्वैपायनं व्यासं ददर्शासीनमाश्रमे
    iast: "sa tatkṛtvā prāptakālaṃ bāṣṇeṇāpihito'rjunaḥ | kṛṣṇadvaipāyanaṃ vyāsaṃ dadarśāsīnamāśrame"
  - id: 'mausala-15-9-7'
    kind: verse
    lines:
      - यः स मेघवपुः श्रीमान्बृहत्पङ्कजलोचनः
      - स कृष्णः सह रामेण त्यक्त्वा देहं दिवं गतः
    iast: "yaḥ sa meghavapuḥ śrīmānbṛhatpaṅkajalocanaḥ | sa kṛṣṇaḥ saha rāmeṇa tyaktvā dehaṃ divaṃ gataḥ"
  - id: 'mausala-15-9-10'
    kind: verse
    lines:
      - मौसले वृष्णिवीराणां विनाशो ब्रह्मशापजः
      - बभूव वीरान्तकरः प्रभासे रोमहर्षणः
    iast: "mausale vṛṣṇivīrāṇāṃ vināśo brahmaśāpajaḥ | babhūva vīrāntakaraḥ prabhāse romaharṣaṇaḥ"
  - id: 'mausala-15-9-15'
    kind: verse
    lines:
      - शोषणं सागरस्येव मन्दरस्येव चालनम्
      - नभसः पतनं चैव शैत्यमग्नेस्तथैव च
    iast: "śoṣaṇaṃ sāgarasyeva mandarasyeva cālanam | nabhasaḥ patanaṃ caiva śaityamagnestathaiva ca"
  - id: 'mausala-15-9-16'
    kind: verse
    lines:
      - अश्रद्धेयमहं मन्ये विनाशं शार्ङ्गधन्वनः
      - न चेह स्थातुमिच्छामि लोके कृष्णविनाकृतः
    iast: "aśraddheyamahaṃ manye vināśaṃ śārṅgadhanvanaḥ | na ceha sthātumicchāmi loke kṛṣṇavinākṛtaḥ"
  - id: 'mausala-15-9-17'
    kind: verse
    lines:
      - इतः कष्टतरं चान्यच्छृणु तद्वै तपोधन
      - मनो मे दीर्यते येन चिन्तयानस्य वै मुहुः
    iast: "itaḥ kaṣṭataraṃ cānyacchṛṇu tadvai tapodhana | mano me dīryate yena cintayānasya vai muhuḥ"
  - id: 'mausala-15-9-18'
    kind: verse
    lines:
      - पश्यतो वृष्णिदाराश्च मम ब्रह्मन्सहस्रशः
      - आभीरैरभिभूयाजौ हृताः पञ्चनदालयैः
    iast: "paśyato vṛṣṇidārāśca mama brahmansahasraśaḥ | ābhīrairabhibhūyājau hṛtāḥ pañcanadālayaiḥ"
  - id: 'mausala-15-9-19'
    kind: verse
    lines:
      - धनुरादाय तत्राहं नाशकं तस्य पूरणे
      - यथापुरा च मे वीर्यं भुजयोर्न तथाऽभवत्
    iast: "dhanurādāya tatrāhaṃ nāśakaṃ tasya pūraṇe | yathāpurā ca me vīryaṃ bhujayorna tathā'bhavat"
  - id: 'mausala-15-9-27'
    kind: verse
    lines:
      - उपदेष्टुं मम श्रेयो भवानर्हति सत्तम
      - व्यास उवाच
    iast: "upadeṣṭuṃ mama śreyo bhavānarhati sattama | vyāsa uvāca"
  - id: 'mausala-15-9-28'
    kind: verse
    lines:
      - देवांशा देवभूतेन सम्भूतास्ते गतास्सह
      - धर्मव्यवस्थारक्षार्थं देवेन समुपेक्षिताः
    iast: "devāṃśā devabhūtena sambhūtāste gatāssaha | dharmavyavasthārakṣārthaṃ devena samupekṣitāḥ"
  - id: 'mausala-15-9-29'
    kind: verse
    lines:
      - ब्रह्मशापविनिर्दग्धा वृष्ण्यन्धकसमहारथाः
      - विनष्टाः कुरुशार्दूल न ताञ्शोचितुमर्हसि
    iast: "brahmaśāpavinirdagdhā vṛṣṇyandhakasamahārathāḥ | vinaṣṭāḥ kuruśārdūla na tāñśocitumarhasi"
  - id: 'mausala-15-9-34'
    kind: verse
    lines:
      - कृत्वा भारावतरणं पृथिव्याः पृथुलोचनः
      - मोक्षयित्वा तनुं प्राप्तः कृष्णः स्वस्थानमुत्तमम्
    iast: "kṛtvā bhārāvataraṇaṃ pṛthivyāḥ pṛthulocanaḥ | mokṣayitvā tanuṃ prāptaḥ kṛṣṇaḥ svasthānamuttamam"
  - id: 'mausala-15-9-35'
    kind: verse
    lines:
      - त्वयाऽपीह महत्कर्म देवानां पुरुषर्षभ
      - कृतं भीमसहायेन यमाभ्यां च महाभुज
    iast: "tvayā'pīha mahatkarma devānāṃ puruṣarṣabha | kṛtaṃ bhīmasahāyena yamābhyāṃ ca mahābhuja"
  - id: 'mausala-15-9-37'
    kind: verse
    lines:
      - बलं बुद्धिश्च तेजश्च प्रतिपत्तिश्च भारत
      - भवन्ति भवकालेषु विपद्यन्ते विपर्यये
    iast: "balaṃ buddhiśca tejaśca pratipattiśca bhārata | bhavanti bhavakāleṣu vipadyante viparyaye"
  - id: 'mausala-15-9-38'
    kind: verse
    lines:
      - कालमूलमिदं सर्वं जगद्बीजं धनंजय
      - काल एव समादत्ते पुनरेव यदृच्छया
    iast: "kālamūlamidaṃ sarvaṃ jagadbījaṃ dhanaṃjaya | kāla eva samādatte punareva yadṛcchayā"
  - id: 'mausala-15-9-41'
    kind: verse
    lines:
      - कालो गन्तुं गतिं मुख्यां भवतामपि भारत
      - एतच्छ्रेयो हि वो मन्ये परमं भरतर्षभ
      - वैशम्पायन उवाच
    iast: "kālo gantuṃ gatiṃ mukhyāṃ bhavatāmapi bhārata | etacchreyo hi vo manye paramaṃ bharatarṣabha | vaiśampāyana uvāca"
  - id: 'mausala-15-9-42'
    kind: verse
    lines:
      - एतद्वचनमाज्ञाय व्यासस्यामिततेजसः
      - अनुज्ञातो ययौ पार्थो नगरं नागसाह्वयम्
    iast: "etadvacanamājñāya vyāsasyāmitatejasaḥ | anujñāto yayau pārtho nagaraṃ nāgasāhvayam"
  - id: 'mausala-15-9-43'
    kind: verse
    lines:
      - प्रविश्य च पुरीं वीरः समासाद्य युधिष्ठिरम्
      - आचष्ट तद्यथावृत्तं वृष्ण्यन्धककुलं प्रति
    iast: "praviśya ca purīṃ vīraḥ samāsādya yudhiṣṭhiram | ācaṣṭa tadyathāvṛttaṃ vṛṣṇyandhakakulaṃ prati"
  - id: 'mahAprasthAnika-17-1-2'
    kind: verse
    lines:
      - श्रुत्वैवं कौरवो राजा वृष्णीनां कदनं महत्
      - प्रस्थाने मतिमाधाय वाक्यमर्जुनमब्रवीत्
    iast: "śrutvaivaṃ kauravo rājā vṛṣṇīnāṃ kadanaṃ mahat | prasthāne matimādhāya vākyamarjunamabravīt"
  - id: 'mahAprasthAnika-17-1-6'
    kind: verse
    lines:
      - ततो युयुत्सुमानाय्य प्रव्रजन्धर्मकाम्यया
      - राज्यं परिददौ सर्वं वैश्यापुत्रे युधिष्ठिरः
    iast: "tato yuyutsumānāyya pravrajandharmakāmyayā | rājyaṃ paridadau sarvaṃ vaiśyāputre yudhiṣṭhiraḥ"
  - id: 'mahAprasthAnika-17-1-7'
    kind: verse
    lines:
      - अभिंषिच्य स्वराज्ये च राजानं च परिक्षितम्
      - दुःखार्तश्चाब्रवीद्राजा सुभद्रां पाण्डवाग्रजः
    iast: "abhiṃṣicya svarājye ca rājānaṃ ca parikṣitam | duḥkhārtaścābravīdrājā subhadrāṃ pāṇḍavāgrajaḥ"
  - id: 'mahAprasthAnika-17-1-21'
    kind: verse
    lines:
      - श्रुत्वा तु दुर्मना राजा पर्याप्तं जीवनं मम इति स्म राजा कौरव्यो धर्मपुत्रो युधिष्ठिरः
      - उत्सृज्याभरणान्यङ्गाज्जगृहे वल्कलान्युत
    iast: "śrutvā tu durmanā rājā paryāptaṃ jīvanaṃ mama iti sma rājā kauravyo dharmaputro yudhiṣṭhiraḥ | utsṛjyābharaṇānyaṅgājjagṛhe valkalānyuta"
  - id: 'mahAprasthAnika-17-1-22'
    kind: verse
    lines:
      - भीमार्जुनयमाश्चैव द्रौपदी च यशस्विनी
      - तथैव जगृहुः सर्वे वल्कलानि नराधिप
    iast: "bhīmārjunayamāścaiva draupadī ca yaśasvinī | tathaiva jagṛhuḥ sarve valkalāni narādhipa"
  - id: 'mahAprasthAnika-17-1-25'
    kind: verse
    lines:
      - हर्षोऽभवच्च सर्वेषां भ्रातॄणां गमनं प्रति युधिष्ठिरमतं ज्ञात्वा वृष्णिक्षयमवेक्ष्य च
    iast: "harṣo'bhavacca sarveṣāṃ bhrātṝṇāṃ gamanaṃ prati yudhiṣṭhiramataṃ jñātvā vṛṣṇikṣayamavekṣya ca"
  - id: 'mahAprasthAnika-17-1-26'
    kind: verse
    lines:
      - भ्रातरः पञ्च कृष्णा च षष्ठी श्वा चैव सप्तमः आत्मना सप्तमो राजा निर्ययौ गजसाह्वयात्
      - पौरैरनुगतो दूरं सर्वैरन्तःपुरैस्तथा
    iast: "bhrātaraḥ pañca kṛṣṇā ca ṣaṣṭhī śvā caiva saptamaḥ ātmanā saptamo rājā niryayau gajasāhvayāt | paurairanugato dūraṃ sarvairantaḥpuraistathā"
  - id: 'mahAprasthAnika-17-2-1'
    kind: verse
    lines:
      - ततस्ते नियतात्मान उदीचीं दिशमास्थिताः
      - ददृशुर्योगयुक्ताश्च हिमवन्तं महागिरिम्
    iast: "tataste niyatātmāna udīcīṃ diśamāsthitāḥ | dadṛśuryogayuktāśca himavantaṃ mahāgirim"
  - id: 'mahAprasthAnika-17-2-3'
    kind: verse
    lines:
      - तेषां तु गच्छतां शीघ्रं सर्वेषां योगधार्मिणाम्
      - याज्ञसेनी भ्रष्टयोगा निपपात महीतले
    iast: "teṣāṃ tu gacchatāṃ śīghraṃ sarveṣāṃ yogadhārmiṇām | yājñasenī bhraṣṭayogā nipapāta mahītale"
  - id: 'mahAprasthAnika-17-2-4'
    kind: verse
    lines:
      - तां तु प्रपतितां दृष्ट्वा भीमसेनो महाबलः
      - उवाच धर्मराजानं याज्ञसेनीमवेक्ष्य ह
    iast: "tāṃ tu prapatitāṃ dṛṣṭvā bhīmaseno mahābalaḥ | uvāca dharmarājānaṃ yājñasenīmavekṣya ha"
  - id: 'mahAprasthAnika-17-2-5'
    kind: verse
    lines:
      - नाधर्मश्चरितः कश्चिद्राजपुत्र्या परंतप
      - कारणं किंनु तद्ब्रूहि यत्कृष्णा पतिता भुवि
      - युधिष्ठिर उवाच
    iast: "nādharmaścaritaḥ kaścidrājaputryā paraṃtapa | kāraṇaṃ kiṃnu tadbrūhi yatkṛṣṇā patitā bhuvi | yudhiṣṭhira uvāca"
  - id: 'mahAprasthAnika-17-2-6'
    kind: verse
    lines:
      - पक्षपातो महानस्या विशेषेण धनंजये
      - तस्यैतत्फलमद्यैषा भुङ्क्ते पुरुषसत्तम
      - वैशम्पायन उवाच
    iast: "pakṣapāto mahānasyā viśeṣeṇa dhanaṃjaye | tasyaitatphalamadyaiṣā bhuṅkte puruṣasattama | vaiśampāyana uvāca"
  - id: 'mahAprasthAnika-17-2-8'
    kind: verse
    lines:
      - सहदेवस्ततो विद्वान्निपपात महीतले
      - तं चापि पतितं दृष्ट्वा भीमो राजानमब्रवीत्
    iast: "sahadevastato vidvānnipapāta mahītale | taṃ cāpi patitaṃ dṛṣṭvā bhīmo rājānamabravīt"
  - id: 'mahAprasthAnika-17-2-9'
    kind: verse
    lines:
      - योऽयमस्मासु सर्वेषु शुश्रूषुरनहंकृतः
      - सोयं माद्रवतीपुत्रः कस्मान्निपतितो भुवि
      - युधिष्ठिर उवाच
    iast: "yo'yamasmāsu sarveṣu śuśrūṣuranahaṃkṛtaḥ | soyaṃ mādravatīputraḥ kasmānnipatito bhuvi | yudhiṣṭhira uvāca"
  - id: 'mahAprasthAnika-17-2-10'
    kind: verse
    lines:
      - आत्मनः सदृशं प्राज्ञं नैषोऽमन्यत कञ्चन
      - तेन दोषेण पतितो विद्वानेष नृपात्मजः
      - वैशम्पायन उवाच
    iast: "ātmanaḥ sadṛśaṃ prājñaṃ naiṣo'manyata kañcana | tena doṣeṇa patito vidvāneṣa nṛpātmajaḥ | vaiśampāyana uvāca"
  - id: 'mahAprasthAnika-17-2-14'
    kind: verse
    lines:
      - योऽयमक्षतधर्मात्मा भ्राता वचनकारकः
      - रूपेणाप्रतिमो लोके नकुलः पतितो भुवि
    iast: "yo'yamakṣatadharmātmā bhrātā vacanakārakaḥ | rūpeṇāpratimo loke nakulaḥ patito bhuvi"
  - id: 'mahAprasthAnika-17-2-16'
    kind: verse
    lines:
      - रूपेणि मत्समो नास्ति कश्चिदित्यस्य दर्शनम्
      - अधिकश्चाहमेवैक इत्यस्य मनसि स्थितम्
    iast: "rūpeṇi matsamo nāsti kaścidityasya darśanam | adhikaścāhamevaika ityasya manasi sthitam"
  - id: 'mahAprasthAnika-17-2-18'
    kind: verse
    lines:
      - तांस्तु प्रपतितान्दृष्ट्वा पाण्डवः श्वेतवाहनः
      - पपात शोकसंतप्तस्ततोनु परवीरहा
    iast: "tāṃstu prapatitāndṛṣṭvā pāṇḍavaḥ śvetavāhanaḥ | papāta śokasaṃtaptastatonu paravīrahā"
  - id: 'mahAprasthAnika-17-2-19'
    kind: verse
    lines:
      - तस्मिंस्तु पुरुषव्याघ्रे पतिते शक्रतेजसि
      - म्रियमाणे दुराधर्षे भीमो राजानमब्रवीत्
    iast: "tasmiṃstu puruṣavyāghre patite śakratejasi | mriyamāṇe durādharṣe bhīmo rājānamabravīt"
  - id: 'mahAprasthAnika-17-2-20'
    kind: verse
    lines:
      - अनृतं न स्मराम्यस्य स्वैरेष्वपि महात्मनः
      - अथ कस्य विकारोऽयं येनायं पतितो भुवि
      - युधिष्ठिर उवाच
    iast: "anṛtaṃ na smarāmyasya svaireṣvapi mahātmanaḥ | atha kasya vikāro'yaṃ yenāyaṃ patito bhuvi | yudhiṣṭhira uvāca"
  - id: 'mahAprasthAnika-17-2-21'
    kind: verse
    lines:
      - एकोहं निर्दहेयं वै शत्रूनित्यर्जुनोऽब्रवीत्
      - न च तत्कृतवानेष शूरमानी ततोपतत्
    iast: "ekohaṃ nirdaheyaṃ vai śatrūnityarjuno'bravīt | na ca tatkṛtavāneṣa śūramānī tatopatat"
  - id: 'mahAprasthAnika-17-2-23'
    kind: verse
    lines:
      - इत्युक्त्वा प्रस्थितो राजा भीमोथ निपपात ह
      - पतितश्चाब्रवीद्भीमो धर्मराजं युधिष्ठिरम्
    iast: "ityuktvā prasthito rājā bhīmotha nipapāta ha | patitaścābravīdbhīmo dharmarājaṃ yudhiṣṭhiram"
  - id: 'mahAprasthAnika-17-2-24'
    kind: verse
    lines:
      - भोभो राजन्नवेक्षस्व पतितोहं प्रियस्तव
      - किंनिमित्तं च पतनं ब्रूहि मे यदि वेत्थ ह
      - युधिष्ठिर उवाच
    iast: "bhobho rājannavekṣasva patitohaṃ priyastava | kiṃnimittaṃ ca patanaṃ brūhi me yadi vettha ha | yudhiṣṭhira uvāca"
  - id: 'mahAprasthAnika-17-2-25'
    kind: verse
    lines:
      - अतिभुक्तं च भवता प्राणेन च विकत्थसे
      - अनवेक्ष्य परं पार्थ तेनासि पतितः क्षितौ
    iast: "atibhuktaṃ ca bhavatā prāṇena ca vikatthase | anavekṣya paraṃ pārtha tenāsi patitaḥ kṣitau"
  - id: 'mahAprasthAnika-17-2-26'
    kind: verse
    lines:
      - इत्युक्त्वा तं महाबाहुर्जगामानवलोकयन्
      - श्वाप्येकोनुययौ यस्ते बहुशः कीर्तितो मया
    iast: "ityuktvā taṃ mahābāhurjagāmānavalokayan | śvāpyekonuyayau yaste bahuśaḥ kīrtito mayā"
  - id: 'mahAprasthAnika-17-3-1'
    kind: verse
    lines:
      - ततः सन्नादयञ्शक्रो दिवं भूमिं च सर्वशः
      - रथेनोपययौ पार्थमारोहेत्यब्रवीच्च तम्
    iast: "tataḥ sannādayañśakro divaṃ bhūmiṃ ca sarvaśaḥ | rathenopayayau pārthamārohetyabravīcca tam"
  - id: 'mahAprasthAnika-17-3-3'
    kind: verse
    lines:
      - भ्रातरः पतिता मेऽत्र गच्छेयुस्ते मया सह
      - न विना भ्रातृभिः स्वर्गमिच्छे गन्तुं सुरेश्वर
    iast: "bhrātaraḥ patitā me'tra gaccheyuste mayā saha | na vinā bhrātṛbhiḥ svargamicche gantuṃ sureśvara"
  - id: 'mahAprasthAnika-17-3-4'
    kind: verse
    lines:
      - सुकुमारी सुखार्हा च राजपुत्री पुरंदर
      - साऽस्माभिः सह गच्छेत तद्भवाननुमन्यताम्
      - शक्र उवाच
    iast: "sukumārī sukhārhā ca rājaputrī puraṃdara | sā'smābhiḥ saha gaccheta tadbhavānanumanyatām | śakra uvāca"
  - id: 'mahAprasthAnika-17-3-6'
    kind: verse
    lines:
      - निक्षिप्य मानुषं देहं गतास्ते भरतर्षभ
      - अनेन त्वं शरीरेण स्वर्गं गन्ता न संशयः
      - युधिष्ठिर उवाच
    iast: "nikṣipya mānuṣaṃ dehaṃ gatāste bharatarṣabha | anena tvaṃ śarīreṇa svargaṃ gantā na saṃśayaḥ | yudhiṣṭhira uvāca"
  - id: 'mahAprasthAnika-17-3-7'
    kind: verse
    lines:
      - अयं श्वा भूतभव्येश भक्तो मां नित्यमेव ह
      - स गच्छेत मया सार्धमानृशंस्या हि मे मतिः
      - शक्र उवाच
    iast: "ayaṃ śvā bhūtabhavyeśa bhakto māṃ nityameva ha | sa gaccheta mayā sārdhamānṛśaṃsyā hi me matiḥ | śakra uvāca"
  - id: 'mahAprasthAnika-17-3-8'
    kind: verse
    lines:
      - अमर्त्यत्वं मत्समत्वं च राजञ्श्रियं कृत्स्नां महतीं चैव सिद्धिम्
      - संप्राप्तोद्य स्वर्गसुखानि च त्वं त्यज श्वानं नात्र नृशंसमस्ति
      - युधिष्ठिर उवाच
    iast: "amartyatvaṃ matsamatvaṃ ca rājañśriyaṃ kṛtsnāṃ mahatīṃ caiva siddhim | saṃprāptodya svargasukhāni ca tvaṃ tyaja śvānaṃ nātra nṛśaṃsamasti | yudhiṣṭhira uvāca"
  - id: 'mahAprasthAnika-17-3-9'
    kind: verse
    lines:
      - अनार्यमार्येणि सहस्रनेत्र शक्यं कर्तुं दुष्करमेतदार्य
      - मा मे श्रिया सङ्गमनं तयाऽस्तु यस्याः कृते भक्तजनं त्यजेयम्
      - इन्द्र उवाच
    iast: "anāryamāryeṇi sahasranetra śakyaṃ kartuṃ duṣkarametadārya | mā me śriyā saṅgamanaṃ tayā'stu yasyāḥ kṛte bhaktajanaṃ tyajeyam | indra uvāca"
  - id: 'mahAprasthAnika-17-3-14'
    kind: verse
    lines:
      - त्यक्त्वा भ्रातॄन्दयितां चापि कृष्णां प्राप्तो लोकः कर्मणा स्वेन वीर
      - श्वानं चैनं न त्यजसे कथं नु त्यागं कृत्स्नं चास्थितो मुह्यसेऽद्य
      - युधिष्ठिर उवाच
    iast: "tyaktvā bhrātṝndayitāṃ cāpi kṛṣṇāṃ prāpto lokaḥ karmaṇā svena vīra | śvānaṃ cainaṃ na tyajase kathaṃ nu tyāgaṃ kṛtsnaṃ cāsthito muhyase'dya | yudhiṣṭhira uvāca"
  - id: 'mahAprasthAnika-17-3-15'
    kind: verse
    lines:
      - न विद्यते संधिरथापि विग्रहो मृतैर्मर्त्यैरिति लोकेषु निष्ठा
      - न ते मया जीवयितुं हि शक्यास्ततस्त्यागस्तेषु कृतो न जीवताम्
    iast: "na vidyate saṃdhirathāpi vigraho mṛtairmartyairiti lokeṣu niṣṭhā | na te mayā jīvayituṃ hi śakyāstatastyāgasteṣu kṛto na jīvatām"
  - id: 'mahAprasthAnika-17-3-17'
    kind: verse
    lines:
      - तद्धर्मराजस्य वचो निशम्य धर्मस्वरूपी भगवानुवाच
      - युधिष्ठिरं प्रीतियुक्तो नरेन्द्रं श्लक्ष्णैर्वाक्यैः संस्तवसंप्रयुक्तैः
    iast: "taddharmarājasya vaco niśamya dharmasvarūpī bhagavānuvāca | yudhiṣṭhiraṃ prītiyukto narendraṃ ślakṣṇairvākyaiḥ saṃstavasaṃprayuktaiḥ"
  - id: 'mahAprasthAnika-17-3-18'
    kind: verse
    lines:
      - अभिजातोसि राजेन्द्र पितुर्वृत्तेन मेधया
      - अनुक्रोशेनि चानेन सर्वभूतेषु भारत
    iast: "abhijātosi rājendra piturvṛttena medhayā | anukrośeni cānena sarvabhūteṣu bhārata"
  - id: 'mahAprasthAnika-17-3-19'
    kind: verse
    lines:
      - पुरा द्वैतवने चासि मया पुत्र परीक्षितः
      - पानीयार्थे पराक्रान्ता यत्र ते भ्रातरो हताः
    iast: "purā dvaitavane cāsi mayā putra parīkṣitaḥ | pānīyārthe parākrāntā yatra te bhrātaro hatāḥ"
  - id: 'mahAprasthAnika-17-3-20'
    kind: verse
    lines:
      - भीमार्जुनौ परित्यज्य यत्र त्वं भ्रातरावुभौ
      - मात्रोः साम्यमभीप्सन्वै नकुलं जीवमिच्छसि
    iast: "bhīmārjunau parityajya yatra tvaṃ bhrātarāvubhau | mātroḥ sāmyamabhīpsanvai nakulaṃ jīvamicchasi"
  - id: 'mahAprasthAnika-17-3-21'
    kind: verse
    lines:
      - अयं श्वा भक्त इत्येवं त्यक्तो देवरथस्त्वया
      - तस्मात्स्वर्गे न ते तुल्यः कश्चिदस्ति नराधिपः
    iast: "ayaṃ śvā bhakta ityevaṃ tyakto devarathastvayā | tasmātsvarge na te tulyaḥ kaścidasti narādhipaḥ"
  - id: 'mahAprasthAnika-17-3-22'
    kind: verse
    lines:
      - अतस्तवाक्षया लोकाः स्वशरीरेण भारत
      - प्राप्तोसि भरतश्रेष्ठ दिव्यां गतिमनुत्तमाम्
      - वैशम्पायन उवाच
    iast: "atastavākṣayā lokāḥ svaśarīreṇa bhārata | prāptosi bharataśreṣṭha divyāṃ gatimanuttamām | vaiśampāyana uvāca"
  - id: 'mahAprasthAnika-17-3-25'
    kind: verse
    lines:
      - स तं रथं समास्थाय राजा कुरुकुलोद्वहः
      - ऊर्ध्वमाचक्रमे शीघ्रं तेजसाऽऽवृत्यरोदसी
    iast: "sa taṃ rathaṃ samāsthāya rājā kurukulodvahaḥ | ūrdhvamācakrame śīghraṃ tejasā''vṛtyarodasī"
  - id: 'svargArohana-18-1-4'
    kind: verse
    lines:
      - स्वर्गं त्रिविष्टपं प्राप्य धर्मराजो युधिष्ठिरः
      - दुर्योधनं श्रिया जुष्टं ददर्शासीनमासने
    iast: "svargaṃ triviṣṭapaṃ prāpya dharmarājo yudhiṣṭhiraḥ | duryodhanaṃ śriyā juṣṭaṃ dadarśāsīnamāsane"
  - id: 'svargArohana-18-1-22'
    kind: verse
    lines:
      - ये ते वीरी महात्मानो भ्रातरो मे महाव्रताः सत्यप्रतिज्ञा लोकस्य शूरा वै सत्यवादिनः
      - तेषामिदानीं के लोका द्रष्टुमिच्छामि तानहम्
    iast: "ye te vīrī mahātmāno bhrātaro me mahāvratāḥ satyapratijñā lokasya śūrā vai satyavādinaḥ | teṣāmidānīṃ ke lokā draṣṭumicchāmi tānaham"
  - id: 'svargArohana-18-1-23'
    kind: verse
    lines:
      - कर्णं चैव महात्मानं कौन्तेयं सत्यसङ्गरम्
      - धृष्टद्युम्नं सात्यकिं च धृष्टद्युम्नस्य चात्मजान्
    iast: "karṇaṃ caiva mahātmānaṃ kaunteyaṃ satyasaṅgaram | dhṛṣṭadyumnaṃ sātyakiṃ ca dhṛṣṭadyumnasya cātmajān"
  - id: 'svargArohana-18-2-9'
    kind: verse
    lines:
      - तमहं यत्रतत्रस्थं द्रष्टुमिच्छामि सूर्यजम्
      - अविज्ञातो मया योसौ घातितः सव्यसाचिना
    iast: "tamahaṃ yatratatrasthaṃ draṣṭumicchāmi sūryajam | avijñāto mayā yosau ghātitaḥ savyasācinā"
  - id: 'svargArohana-18-2-11'
    kind: verse
    lines:
      - द्रष्टुमिच्छामि तां चाहं पाञ्चालीं धर्मचारिणीम्
      - न चेह स्थातुमिच्छामि सत्यमेवं ब्रवीमि वः
    iast: "draṣṭumicchāmi tāṃ cāhaṃ pāñcālīṃ dharmacāriṇīm | na ceha sthātumicchāmi satyamevaṃ bravīmi vaḥ"
  - id: 'svargArohana-18-2-12'
    kind: verse
    lines:
      - किं मे भ्रातृविहीनस्य स्वर्गेण सुरसत्तमाः
      - यत्र ते मम स स्वर्गो नायं स्वर्गो मतो मम
      - देवा ऊचुः
    iast: "kiṃ me bhrātṛvihīnasya svargeṇa surasattamāḥ | yatra te mama sa svargo nāyaṃ svargo mato mama | devā ūcuḥ"
  - id: 'svargArohana-18-2-13'
    kind: verse
    lines:
      - यदि वै तत्र ते श्रद्धा गम्यतां तत्र माचिरम्
      - प्रिये हि तव वर्तामो देवराजस्य शासनात्
      - वैशम्पायन उवाच
    iast: "yadi vai tatra te śraddhā gamyatāṃ tatra māciram | priye hi tava vartāmo devarājasya śāsanāt | vaiśampāyana uvāca"
  - id: 'svargArohana-18-2-14'
    kind: verse
    lines:
      - इत्युक्त्वा तं ततो देवा देवदूतमुपादिशन्
      - युधिष्ठिरस्य सुहृदो दर्शयेतदि परंतप
    iast: "ityuktvā taṃ tato devā devadūtamupādiśan | yudhiṣṭhirasya suhṛdo darśayetadi paraṃtapa"
  - id: 'svargArohana-18-2-15'
    kind: verse
    lines:
      - ततः कुन्तीसुतो राजा देवदूतश्च जग्मतुः
      - सहितौ राजशार्दूल यत्र ते पुरुषर्षभाः
    iast: "tataḥ kuntīsuto rājā devadūtaśca jagmatuḥ | sahitau rājaśārdūla yatra te puruṣarṣabhāḥ"
  - id: 'svargArohana-18-2-16'
    kind: verse
    lines:
      - अग्रतो देवदूतश्च ययौ राजा च पृष्ठतः
      - पन्थानमशुभं दुर्गं सेवितं पापकर्मभिः
    iast: "agrato devadūtaśca yayau rājā ca pṛṣṭhataḥ | panthānamaśubhaṃ durgaṃ sevitaṃ pāpakarmabhiḥ"
  - id: 'svargArohana-18-2-25'
    kind: verse
    lines:
      - कूटशाल्मलिकं तापि दुःस्पर्शं तीक्ष्णकण्टकम्
      - ददर्शान्याश्च कौन्तेयो यातनाः पापकर्मिणाम्
    iast: "kūṭaśālmalikaṃ tāpi duḥsparśaṃ tīkṣṇakaṇṭakam | dadarśānyāśca kaunteyo yātanāḥ pāpakarmiṇām"
  - id: 'svargArohana-18-2-26'
    kind: verse
    lines:
      - स तं दुर्गन्धमालक्ष्य देवदूतमुवाच ह
      - कियदध्वानमस्माभिर्गन्तव्यमिममीदृशम्
    iast: "sa taṃ durgandhamālakṣya devadūtamuvāca ha | kiyadadhvānamasmābhirgantavyamimamīdṛśam"
  - id: 'svargArohana-18-2-28'
    kind: verse
    lines:
      - स संनिववृते श्रुत्वा धर्मराजस्य भाषितम्
      - देवदूतोऽब्रवीचैनमेतावद्गमनं तव
    iast: "sa saṃnivavṛte śrutvā dharmarājasya bhāṣitam | devadūto'bravīcainametāvadgamanaṃ tava"
  - id: 'svargArohana-18-2-31'
    kind: verse
    lines:
      - सं संनिवृत्तो धर्मात्मा दुःखशोकसमाहतः
      - शुश्राव तत्र वदतां दीना वाचः समन्ततः
    iast: "saṃ saṃnivṛtto dharmātmā duḥkhaśokasamāhataḥ | śuśrāva tatra vadatāṃ dīnā vācaḥ samantataḥ"
  - id: 'svargArohana-18-2-32'
    kind: verse
    lines:
      - भोभो धर्मज राजर्षे पुण्याभिजन पाण्वन
      - अनुग्रहार्थमस्माकं तिष्ठ तावन्मुहूर्तकम्
    iast: "bhobho dharmaja rājarṣe puṇyābhijana pāṇvana | anugrahārthamasmākaṃ tiṣṭha tāvanmuhūrtakam"
  - id: 'svargArohana-18-2-35'
    kind: verse
    lines:
      - संतिष्ठस्व महाबाहो मुहूर्तमिह भारत
      - त्वयि तिष्ठति कौरव्य यातनाऽस्मान्न बाधते
    iast: "saṃtiṣṭhasva mahābāho muhūrtamiha bhārata | tvayi tiṣṭhati kauravya yātanā'smānna bādhate"
  - id: 'svargArohana-18-2-37'
    kind: verse
    lines:
      - तेषां तु वचनं श्रुत्वा दयावान्दीनभाषिणाम्
      - अहो कृच्छ्रमिति प्राह तस्थौ स च युधिष्ठिरः
    iast: "teṣāṃ tu vacanaṃ śrutvā dayāvāndīnabhāṣiṇām | aho kṛcchramiti prāha tasthau sa ca yudhiṣṭhiraḥ"
  - id: 'svargArohana-18-2-39'
    kind: verse
    lines:
      - अबुध्यमानस्ता वाचो धर्मपुत्रो युधिष्ठिरः
      - उवाच के भवन्तो वै किमर्थमिह तिष्ठथ
    iast: "abudhyamānastā vāco dharmaputro yudhiṣṭhiraḥ | uvāca ke bhavanto vai kimarthamiha tiṣṭhatha"
  - id: 'svargArohana-18-2-40'
    kind: verse
    lines:
      - इत्युक्तास्ते ततः सर्वे समन्तादवभाषिरे
      - कर्णोऽहं भीमसेनोऽहमर्जुनोऽहमिति प्रभो
    iast: "ityuktāste tataḥ sarve samantādavabhāṣire | karṇo'haṃ bhīmaseno'hamarjuno'hamiti prabho"
  - id: 'svargArohana-18-2-43'
    kind: verse
    lines:
      - किन्तु तत्कलुषं कर्म कृतमेभिर्महात्मभिः
      - कर्णेन द्रौपदेयैर्वा पाञ्चाल्या वा सुमध्यया
    iast: "kintu tatkaluṣaṃ karma kṛtamebhirmahātmabhiḥ | karṇena draupadeyairvā pāñcālyā vā sumadhyayā"
  - id: 'svargArohana-18-2-44'
    kind: verse
    lines:
      - य इमे पापगन्धेऽस्मिन्देशे सन्ति सुदारुणे
      - नाहं जानामि सर्वेषां दुष्कृतं पुण्यकर्मणाम्
    iast: "ya ime pāpagandhe'smindeśe santi sudāruṇe | nāhaṃ jānāmi sarveṣāṃ duṣkṛtaṃ puṇyakarmaṇām"
  - id: 'svargArohana-18-2-50'
    kind: verse
    lines:
      - क्रोधमाहारयच्चैव तीव्रं धर्मसुतो नृपः
      - देवांश्च गर्हयामास धर्मं चैव युधिष्ठिरः
    iast: "krodhamāhārayaccaiva tīvraṃ dharmasuto nṛpaḥ | devāṃśca garhayāmāsa dharmaṃ caiva yudhiṣṭhiraḥ"
  - id: 'svargArohana-18-2-51'
    kind: verse
    lines:
      - स तीव्रशोकसंतप्तो देवदूतमुवाच ह
      - गम्यतां तत्र येषां त्वं दूतस्तेषामुपान्तिकम्
    iast: "sa tīvraśokasaṃtapto devadūtamuvāca ha | gamyatāṃ tatra yeṣāṃ tvaṃ dūtasteṣāmupāntikam"
  - id: 'svargArohana-18-2-52'
    kind: verse
    lines:
      - न ह्यहं तत्र यास्यामि स्थितोस्मीति निवेद्यताम्
      - मत्संश्रयादिमे दूनाः सुखिनो भ्रातरो हि मे
    iast: "na hyahaṃ tatra yāsyāmi sthitosmīti nivedyatām | matsaṃśrayādime dūnāḥ sukhino bhrātaro hi me"
  - id: 'svargArohana-18-3-1'
    kind: verse
    lines:
      - स्थिते मुहूर्तं पार्थे तु धर्मराजे युधिष्ठिष्ठिरे
      - आजग्मुस्तत्र कौरव्यं देवाः शक्रपुरोगमाः
    iast: "sthite muhūrtaṃ pārthe tu dharmarāje yudhiṣṭhiṣṭhire | ājagmustatra kauravyaṃ devāḥ śakrapurogamāḥ"
  - id: 'svargArohana-18-3-9'
    kind: verse
    lines:
      - सर्वे तत्र समाजग्मुः सिद्धाश्च परमर्षयः
      - यत्र राजा महातेजा धर्मपुत्रः स्थितोऽभवत्
    iast: "sarve tatra samājagmuḥ siddhāśca paramarṣayaḥ | yatra rājā mahātejā dharmaputraḥ sthito'bhavat"
  - id: 'svargArohana-18-3-13'
    kind: verse
    lines:
      - न च मन्युस्त्वया कार्यः शृणु चेदं वचो मम
      - अवश्यं नरकस्तात द्रष्टव्यः सर्वराजभिः
    iast: "na ca manyustvayā kāryaḥ śṛṇu cedaṃ vaco mama | avaśyaṃ narakastāta draṣṭavyaḥ sarvarājabhiḥ"
  - id: 'svargArohana-18-3-17'
    kind: verse
    lines:
      - व्याजेन हि त्वया द्रोण उपचीर्णः सुतं प्रति
      - व्याजेनैव ततो राजन्दर्शितो नरकस्तव
    iast: "vyājena hi tvayā droṇa upacīrṇaḥ sutaṃ prati | vyājenaiva tato rājandarśito narakastava"
  - id: 'svargArohana-18-3-19'
    kind: verse
    lines:
      - स्वपक्ष्याश्चैव ये तुभ्यं पार्थिवा निहता रणे
      - सर्वे स्वर्गमनुप्राप्तास्तान्पश्य भरतर्षभ
    iast: "svapakṣyāścaiva ye tubhyaṃ pārthivā nihatā raṇe | sarve svargamanuprāptāstānpaśya bharatarṣabha"
  - id: 'svargArohana-18-3-29'
    kind: verse
    lines:
      - एषा देवनदी पुण्या पार्थ त्रैलोक्यपावनी
      - आकाशगङ्गा राजेन्र्र तत्राप्लुत्य गमिष्यसि
    iast: "eṣā devanadī puṇyā pārtha trailokyapāvanī | ākāśagaṅgā rājenrra tatrāplutya gamiṣyasi"
  - id: 'svargArohana-18-3-30'
    kind: verse
    lines:
      - अत्र स्नातस्य भावस्ते मानुषो विगमिष्यति
      - गतशोको निरायासो मुक्तवैरो भविष्यसि
    iast: "atra snātasya bhāvaste mānuṣo vigamiṣyati | gataśoko nirāyāso muktavairo bhaviṣyasi"
  - id: 'svargArohana-18-3-32'
    kind: verse
    lines:
      - भोभो राजन्महाप्राज्ञ प्रीतोस्मि तव पुत्रक
      - मद्भक्त्या सत्यवाक्यैश्च क्षमया च दमेन च
    iast: "bhobho rājanmahāprājña prītosmi tava putraka | madbhaktyā satyavākyaiśca kṣamayā ca damena ca"
  - id: 'svargArohana-18-3-34'
    kind: verse
    lines:
      - पूर्वं परीक्षितो हि त्वं प्रश्नाद्द्वैतवने मया
      - अरणीसहितस्यार्थे तच्च निस्तीर्णवानसि
    iast: "pūrvaṃ parīkṣito hi tvaṃ praśnāddvaitavane mayā | araṇīsahitasyārthe tacca nistīrṇavānasi"
  - id: 'svargArohana-18-3-35'
    kind: verse
    lines:
      - सोदर्येषु विनष्टेषु द्रौपद्या तत्र भारत
      - श्वरूपधारिणा तत्र पुनस्त्वं मे परीक्षितः
    iast: "sodaryeṣu vinaṣṭeṣu draupadyā tatra bhārata | śvarūpadhāriṇā tatra punastvaṃ me parīkṣitaḥ"
  - id: 'svargArohana-18-3-36'
    kind: verse
    lines:
      - इदं तृतीयं भ्रातॄणामर्थे यतस्थातुमिच्छसि
      - विशुद्धोसि महाभाग सुखी विगतकल्मषः
    iast: "idaṃ tṛtīyaṃ bhrātṝṇāmarthe yatasthātumicchasi | viśuddhosi mahābhāga sukhī vigatakalmaṣaḥ"
  - id: 'svargArohana-18-3-37'
    kind: verse
    lines:
      - न च ते भ्रातरः पार्थ नरकार्हा विशांपतै
      - मायैषा देवराजेन महेन्द्रेणि प्रयोजिता
    iast: "na ca te bhrātaraḥ pārtha narakārhā viśāṃpatai | māyaiṣā devarājena mahendreṇi prayojitā"
  - id: 'svargArohana-18-3-40'
    kind: verse
    lines:
      - न कृष्णा राजपुत्री च नरकार्हा कथञ्चन
      - एह्येहि भरतश्रेष्ठ पश्य चेमांस्त्रिलोकगान्
      - वैशम्पायन उवाच
    iast: "na kṛṣṇā rājaputrī ca narakārhā kathañcana | ehyehi bharataśreṣṭha paśya cemāṃstrilokagān | vaiśampāyana uvāca"
  - id: 'svargArohana-18-3-42'
    kind: verse
    lines:
      - गङ्गां देवनदीं पुण्यां पावनीमृषिसंस्तुताम्
      - अवगाह्य ततो राजा तनुं तत्याज मानुषीम्
    iast: "gaṅgāṃ devanadīṃ puṇyāṃ pāvanīmṛṣisaṃstutām | avagāhya tato rājā tanuṃ tatyāja mānuṣīm"
  - id: 'svargArohana-18-3-43'
    kind: verse
    lines:
      - ततो विव्यवपुर्भूत्वा धर्मराजो युधिष्ठिरः
      - निर्वैरो गतसंतापो जले तस्मिन्समाप्लुतः
    iast: "tato vivyavapurbhūtvā dharmarājo yudhiṣṭhiraḥ | nirvairo gatasaṃtāpo jale tasminsamāplutaḥ"
  - id: 'svargArohana-18-4-6'
    kind: verse
    lines:
      - अपरस्मिन्नथोद्देशे कर्णं शस्त्रभृतां वरम्
      - द्वादशादित्यसहितं ददर्श कुरुनन्दनः
    iast: "aparasminnathoddeśe karṇaṃ śastrabhṛtāṃ varam | dvādaśādityasahitaṃ dadarśa kurunandanaḥ"
  - id: 'svargArohana-18-4-7'
    kind: verse
    lines:
      - अथापरस्मिन्नुद्देशे मरुद्गणवृतं विभुम्
      - भीमसेनमथापश्यत्तेनैव वपुषाऽन्वितम्
    iast: "athāparasminnuddeśe marudgaṇavṛtaṃ vibhum | bhīmasenamathāpaśyattenaiva vapuṣā'nvitam"
  - id: 'svargArohana-18-4-9'
    kind: verse
    lines:
      - अश्विनोस्तु तथा स्थाने दीप्यमानौ स्वतेजसा
      - नकुलं सहदेवं च ददर्श कुरुनन्दनः
    iast: "aśvinostu tathā sthāne dīpyamānau svatejasā | nakulaṃ sahadevaṃ ca dadarśa kurunandanaḥ"
  - id: 'svargArohana-18-4-10'
    kind: verse
    lines:
      - तथा ददर्श पाञ्चालीं कमलोत्पलमालिनीम्
      - वपुषा स्वर्गमाक्रम्य तिष्ठन्तीमर्कवर्चसम्
    iast: "tathā dadarśa pāñcālīṃ kamalotpalamālinīm | vapuṣā svargamākramya tiṣṭhantīmarkavarcasam"
  - id: 'svargArohana-18-5-11'
    kind: verse
    lines:
      - वसूनेव महातेजा भीष्मः प्राप महाद्युतिः
      - अष्टावेव हि दृश्यन्ते वसवो भरतर्षभ
    iast: "vasūneva mahātejā bhīṣmaḥ prāpa mahādyutiḥ | aṣṭāveva hi dṛśyante vasavo bharatarṣabha"
  - id: 'svargArohana-18-5-12'
    kind: verse
    lines:
      - बृहस्पतिं विवेशाथ द्रोणो ह्यङ्गिरसां वरम्
      - कृतवर्मा तु हार्दिक्यः प्रविवेश मरुद्गणान्
    iast: "bṛhaspatiṃ viveśātha droṇo hyaṅgirasāṃ varam | kṛtavarmā tu hārdikyaḥ praviveśa marudgaṇān"
  - id: 'svargArohana-18-5-13'
    kind: verse
    lines:
      - सनत्कुमारं प्रद्युम्नः प्रविवेश यथागतम्
      - धृतराष्ट्रो धनेशस्य लोकान्प्राप दुरासदान्
    iast: "sanatkumāraṃ pradyumnaḥ praviveśa yathāgatam | dhṛtarāṣṭro dhaneśasya lokānprāpa durāsadān"
  - id: 'svargArohana-18-5-14'
    kind: verse
    lines:
      - धृतराष्ट्रो सहिता गन्धारी च यशस्विनी
      - पत्नीभ्यां सहितः पाण्डुमहेन्द्रसदनं ययौ
    iast: "dhṛtarāṣṭro sahitā gandhārī ca yaśasvinī | patnībhyāṃ sahitaḥ pāṇḍumahendrasadanaṃ yayau"
  - id: 'svargArohana-18-5-20'
    kind: verse
    lines:
      - आविवेश रविं कर्णो निहतः पुरुषर्षभ
      - द्वापरं शकुनिः प्राप धृष्टद्युम्नस्तु पावकम्
    iast: "āviveśa raviṃ karṇo nihataḥ puruṣarṣabha | dvāparaṃ śakuniḥ prāpa dhṛṣṭadyumnastu pāvakam"
  - id: 'svargArohana-18-5-21'
    kind: verse
    lines:
      - धृतराष्ट्रात्मजाः सर्वे यातुधानान्प्रपेदिरे
      - धर्ममेवाविशत्क्षत्ता राजा चैव युधिष्ठिरः
    iast: "dhṛtarāṣṭrātmajāḥ sarve yātudhānānprapedire | dharmamevāviśatkṣattā rājā caiva yudhiṣṭhiraḥ"
  - id: 'svargArohana-18-5-23'
    kind: verse
    lines:
      - यः स नारायणो नाम देवदेवः सनातनः
      - तस्यांशो वासुदेवस्तु कर्मणोन्ते विवेश ह
    iast: "yaḥ sa nārāyaṇo nāma devadevaḥ sanātanaḥ | tasyāṃśo vāsudevastu karmaṇonte viveśa ha"
  - id: 'svargArohana-18-5-29'
    kind: verse
    lines:
      - एतत्ते सर्वमाख्यातं विस्तरेण महाद्युते
      - कुरूणां चरितं कृत्स्नं पाण्डवानां च भारत
      - सौतिरुवाच
    iast: "etatte sarvamākhyātaṃ vistareṇa mahādyute | kurūṇāṃ caritaṃ kṛtsnaṃ pāṇḍavānāṃ ca bhārata | sautiruvāca"
  - id: 'svargArohana-18-5-35'
    kind: verse
    lines:
      - पुण्योऽयमितिहासाख्यः पवित्रं चेदमुत्तमम्
      - कृष्णेन मुनिना विप्र निर्मितं सत्यवादिना
    iast: "puṇyo'yamitihāsākhyaḥ pavitraṃ cedamuttamam | kṛṣṇena muninā vipra nirmitaṃ satyavādinā"
  - id: 'svargArohana-18-5-38'
    kind: verse
    lines:
      - कीर्तिं प्रथयता लोके पाण्डवानां महात्मनाम्
      - अन्येषां क्षत्रियाणां च भूरिद्रविणतेजसाम्
    iast: "kīrtiṃ prathayatā loke pāṇḍavānāṃ mahātmanām | anyeṣāṃ kṣatriyāṇāṃ ca bhūridraviṇatejasām"
  - id: 'svargArohana-18-5-39'
    kind: verse
    lines:
      - क्रीडां च वासुदेवस्य देवदेवस्य शाङ्गिणः विश्वेषां देवभागानां जन्मसायुज्यमेव च
    iast: "krīḍāṃ ca vāsudevasya devadevasya śāṅgiṇaḥ viśveṣāṃ devabhāgānāṃ janmasāyujyameva ca"
  - id: 'svargArohana-18-5-43'
    kind: verse
    lines:
      - अह्ना यदेनः कुरुते इन्द्रियैर्मनसाऽपि वा
      - महाभारतमाख्याय सर्पपापैः प्रमुच्यते
    iast: "ahnā yadenaḥ kurute indriyairmanasā'pi vā | mahābhāratamākhyāya sarpapāpaiḥ pramucyate"
  - id: 'svargArohana-18-5-50'
    kind: verse
    lines:
      - धर्मे चार्थे च कामे च मोक्षे च भरतर्षभ
      - यदिहास्ति तदन्यत्र यन्नेहास्ति न कुत्रिचित्
    iast: "dharme cārthe ca kāme ca mokṣe ca bharatarṣabha | yadihāsti tadanyatra yannehāsti na kutricit"
  - id: 'svargArohana-18-5-51'
    kind: verse
    lines:
      - वाच्यते यत्र सततं जयाख्यं भारतं महत्
      - श्रीश्व कीर्तिश्च विद्या च भवन्ति मुदिताः सदा
    iast: "vācyate yatra satataṃ jayākhyaṃ bhārataṃ mahat | śrīśva kīrtiśca vidyā ca bhavanti muditāḥ sadā"
