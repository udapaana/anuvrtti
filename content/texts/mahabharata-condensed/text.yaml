      - एतन्मम धनं राजंस्तेन दीव्याम्यहं त्वया
      - वैशम्पायन उवाच
    iast: "rājaputrā ime rājañchomante yairvibhūṣitāḥ kumḍalāni ca niṣkāśca sarvaṃ rājavibhūṣaṇam | etanmama dhanaṃ rājaṃstena dīvyāmyahaṃ tvayā | vaiśampāyana uvāca"
  - id: 'sabha-2-88-11'
