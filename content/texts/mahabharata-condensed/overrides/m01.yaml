      - { form: सुमहत्, lemma: सुमहत्, a: प्रथमा एकवचन नपुंसकलिङ्ग, gloss: "very great" }
      - { form: पापम्, lemma: पाप, a: प्रथमा एकवचन नपुंसकलिङ्ग, gloss: "sin" }
    note: "Two words, not a compound: in a कर्मधारय महत् would become महा- (6.3.46)."
  संप्राप्तं:
    split:
      - { form: संप्राप्तम्, lemma: संप्राप्, a: प्रथमा एकवचन नपुंसकलिङ्ग क्त, gloss: "come upon, incurred" }
  ते:
    fix:
      1: { lemma: युष्मद्, a: षष्ठी एकवचन, gloss: "by you, to you" }
  सुगर्हितम्:
    fix:
      1: { gloss: "deeply censured" }
  गङ्गोवाच:
    fix:
      1: { gloss: "Gaṅgā" }
      2: { gloss: "said" }
