# Mahābhārata condensed, sauptika-10-10-1 – shanti-12-71-15 (batch m21). Format: see
# the header of content/texts/pancatantra-kilotpatin/overrides.yaml.
# SARIT prints the Kumbhakonam text in saṃhitā without compound hyphens; the
# compound boundaries below are the author's. "स््र" in the SARIT text is a broken
# conjunct for स्त्र (अस्त्र, "weapon"); typing slips stay in text.yaml and are
# corrected here, each with a note.

'sauptika-10-10-1':
