      1: { gloss: "O son of Kuntī" }
  सहामात्यो:
    fix:
      1: { gloss: "with your ministers" }
  परिवृत्तो:
    fix:
      1: { gloss: "has turned (northward)" }
  भगवान्सहस्रांशुर्दिवाकरः:
