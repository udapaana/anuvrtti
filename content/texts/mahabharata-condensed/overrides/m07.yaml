      - { form: पापिष्ठम्, lemma: पापिष्ठ, a: द्वितीया एकवचन नपुंसकलिङ्ग, gloss: "the worst" }
      - { form: अकरोः, lemma: कृ, a: लङ् मध्यमपुरुष एकवचन परस्मैपद, gloss: "you have done" }
      - { form: यत्, lemma: यद्, a: अव्यय, gloss: "that, in that" }
