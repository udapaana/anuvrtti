    split:
      - { form: माधुर्य, lemma: माधुर्य, member: true, gloss: "sweetness, charm" }
      - { form: रूप, lemma: रूप, member: true, gloss: "beauty" }
      - { form: संपद्, lemma: संपद्, member: true, gloss: "excellence, wealth" }
