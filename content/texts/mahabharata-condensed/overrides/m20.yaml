      1: { a: द्वितीया एकवचन नपुंसकलिङ्ग, gloss: "head" }
      2: { gloss: "his" }
  पदाऽमर्दीर्मा:
    split:
      - { form: पदा, lemma: पद्, a: तृतीया एकवचन पुंलिङ्ग, gloss: "with (your) foot" }
      - { form: मर्दीः, lemma: मृद्, a: लुङ् मध्यमपुरुष एकवचन परस्मैपद, gloss: "trample (मा … मर्दीः 'do not trample')" }
      - { form: मा, lemma: मा, a: अव्यय, gloss: "let not" }
    note: "मा takes the aorist without its augment (6.4.74): मा … मर्दीः, 'do not trample'. The book prints पदा मर्दीः; SARIT's पदाऽमर्दीः would give the augmented अमर्दीः, which मा does not take. Read मर्दीः."
  धर्मस्तेऽतिगो:
    fix:
      2: { lemma: युष्मद्, a: षष्ठी एकवचन, gloss: "your" }
      3: { gloss: "transgressed, overstepped" }
  भवेत्:
    fix:
      1: { gloss: "may be" }
  ज्ञातिर्हतश्चायं:
    split:
      - { form: ज्ञातिः, lemma: ज्ञाति, a: प्रथमा एकवचन पुंलिङ्ग, gloss: "a kinsman" }
      - { form: हतः, lemma: हन्, a: प्रथमा एकवचन पुंलिङ्ग क्त, gloss: "struck down" }
      - { form: च, lemma: च, a: अव्यय, gloss: "and" }
      - { form: अयम्, lemma: इदम्, a: प्रथमा एकवचन पुंलिङ्ग, gloss: "he, this man" }
  नैतन्न्याय्यं:
    fix:
      3: { gloss: "right, proper" }
  तवानघ:
    fix:
      1: { gloss: "for you" }
      2: { gloss: "O sinless one" }
