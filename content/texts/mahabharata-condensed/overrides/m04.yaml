  चत्वरेषु:
    fix:
      1: { gloss: "in squares, at crossroads" }

'adi-1-152-6':
  प्रज्ञाश्चक्षुरचक्षुष्ट्वाद्धृतराष्ट्रो:
    split:
      - { form: प्रज्ञा, lemma: प्रज्ञा, member: true, gloss: "wisdom" }
      - { form: चक्षुः, lemma: चक्षुस्, a: प्रथमा एकवचन पुंलिङ्ग, gloss: "eye (प्रज्ञाचक्षुस् 'whose eye is wisdom', i.e. blind)" }
      - { form: अचक्षुष्ट्वात्, lemma: अचक्षुष्ट्व, a: पञ्चमी एकवचन नपुंसकलिङ्ग, gloss: "because of blindness" }
      - { form: धृतराष्ट्रः, lemma: धृतराष्ट्र, a: प्रथमा एकवचन पुंलिङ्ग, gloss: "Dhṛtarāṣṭra" }
    note: "The print has प्रज्ञाश्चक्षुः; the epithet is the बहुव्रीहि प्रज्ञाचक्षुस् (as the other recensions read), so the श् is taken as a misprint."
  जनेश्वरः:
    split:
      - { form: जन, lemma: जन, member: true, gloss: "people" }
      - { form: ईश्वरः, lemma: ईश्वर, a: प्रथमा एकवचन पुंलिङ्ग, gloss: "lord (जनेश्वर 'lord of men, king')" }
  राज्यं:
    fix:
      1: { a: द्वितीया एकवचन नपुंसकलिङ्ग, gloss: "the kingship, the throne" }
  प्राप्तवान्पूर्वं:
    split:
      - { form: प्राप्तवान्, lemma: प्राप्, a: प्रथमा एकवचन पुंलिङ्ग क्तवतु, gloss: "obtained" }
      - { form: पूर्वम्, lemma: पूर्वम्, a: अव्यय, gloss: "before, formerly" }
  नृपतिर्भवेत्:
    fix:
      2: { gloss: "could become" }
