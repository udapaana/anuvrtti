# K. M. Ganguli, The Mahabharata of Krishna-Dwaipayana Vyasa translated into English prose (Calcutta, 1883–1896).
# Public domain (Ganguli d. 1908). Text: the proofread Project Gutenberg etexts 15474–15477, pinned in data/sources/ocr/.
# Ganguli translates the Calcutta (vulgate) text; ours is the Kumbhakonam (Southern) edition. So his section numbers
# differ, every verse is aligned by content, and a verse he does not translate has no entry (the page shows nothing).
# Each entry was aligned, then checked against our Sanskrit by a second pass: wrong sentences were replaced, sentences
# that ran into verses our condensed text omits were cut (" … " marks each cut; his words are never rewritten), and an
# entry with no sentence of his that translates it was deleted.
# `ganguli`: his parvan and printed section numeral. `text`: his wording, footnote markers removed and OCR slips mended.
# `speaker`: his "Vaisampayana said," etc. `modern`: the same sense in plain present-day English.
# `departs`: where his English and our Sanskrit part (often a difference of edition). `(with X)`: rendered in X's sentence.
source:
  translator: Kisari Mohan Ganguli
  title: The Mahabharata of Krishna-Dwaipayana Vyasa, translated into English prose
  publisher: Bharata Press
  year: 1883–1896
  gutenberg:
  - 15474
  - 15475
  - 15476
  - 15477
adi-1-1-1:
  ganguli: 1 I
  text: 'Having bowed down to Narayana and Nara, the most exalted male being, and also to the goddess Saraswati, must the word Jaya be uttered.

    '
  modern: 'After bowing to Nārāyaṇa and Nara, the most exalted of men, and to the goddess Sarasvatī, one should say the word Jaya.

    '
adi-1-1-28:
  ganguli: 1 I
  speaker: Sauti then said
  text: 'Having bowed down to the primordial being Isana, to whom multitudes make offerings, and who is adored by the multitude; who is the true incorruptible one, Brahma, perceptible, imperceptible, eternal; who is both a non-existing and an existing-non-existing being; who is the universe and also distinct from the existing and non-existing universe; who is the creator of high and low; the ancient, exalted, inexhaustible one; who is Vishnu, beneficent and the beneficence itself, worthy of all preference, pure and immaculate; who is Hari, the ruler of the faculties, the guide of all things moveable and immoveable; I will declare the sacred thoughts of the illustrious sage Vyasa, of marvellous deeds and worshipped here by all.

    '
  modern: 'Having bowed down to the primordial being Īśāna, to whom multitudes make offerings and whom multitudes adore; who is the true, imperishable Brahmā, perceptible and imperceptible, eternal; who is both non-existent and existent-non-existent; who is the universe and also distinct from it; the creator of high and low, ancient, exalted, inexhaustible; who is Viṣṇu, beneficent and beneficence itself, worthy of all choice, pure and spotless; who is Hari, ruler of the senses, guide of all things that move and do not move: I will declare the sacred thoughts of the illustrious sage Vyāsa, of marvelous deeds and honored here by all.

    '
  speakerModern: 'Sauti said:'
adi-1-1-30:
  ganguli: 1 I
  text: '(with adi-1-1-28)

    '
adi-1-1-31:
  ganguli: 1 I
  text: '(with adi-1-1-28)

    '
adi-1-62-22:
  ganguli: 1 LXII
  text: 'A person, however cruel and sinful, by hearing this history, escapes from all his sins like the Sun from Rahu (after the eclipse is over). This history is called Jaya. It should be heard by those desirous of victory.

    '
  modern: 'A person, however cruel and sinful, is freed from all sins by hearing this history, as the Sun is freed from Rāhu when the eclipse is over. This history is called Jaya. Those who want victory should hear it.

    '
  departs: The Sanskrit says the Moon (candramā), not the Sun, is freed from Rāhu.
adi-1-62-42:
  ganguli: 1 LXII
  text: 'The sins that are committed daily by our senses or the mind, those that are committed knowingly or unknowingly by any man, are all destroyed by hearing the Mahabharata. The history of the exalted birth of the Bharata princes is called the Mahabharata.

    '
  modern: 'The sins that our senses or minds commit every day, knowingly or unknowingly, are all destroyed by hearing the Mahābhārata. The history of the exalted birth of the Bharata princes is called the Mahābhārata.

    '
adi-1-100-12:
  ganguli: 1 LXXIV
  text: 'It is that Bharata from whom have emanated so many mighty achievements. It is from him that the great race called after him in his race are called after him.

    '
  modern: 'It is from this Bharata that so many mighty achievements have come. The great race that bears his name is called after him.

    '
adi-1-101-61:
  ganguli: 1 LXXIV
  text: 'And in the Bharata race there have been born many godlike monarchs gifted with great energy, and like unto Brahman himself. …

    '
  modern: 'In the Bharata race many godlike monarchs have been born, full of great energy and like Brahmā himself. …

    '
adi-1-103-1:
  ganguli: 1 XCVII
  text: 'There was a king of the name of Pratipa, who was kind to all creatures. He spent many years in ascetic penances at the source of the river Ganga.

    '
  modern: 'There was a king named Pratīpa, who was kind to all creatures. He spent many years in ascetic penances at the source of the river Gaṅgā.

    '
adi-1-103-19:
  ganguli: 1 XCVII
  text: 'About this time Pratipa, that light of the Kuru race, that bull amongst Kshatriyas, was engaged, along with his wife, in austerities from desire of offspring. And when they had grown old, a son was born unto them.

    '
  modern: 'About this time Pratīpa, light of the Kuru race and bull among Kṣatriyas, was practicing austerities with his wife, out of desire for a child. When they had grown old, a son was born to them.

    '
adi-1-103-22:
  ganguli: 1 XCVII
  text: 'This was no other than Mahabhisha. And the child was called Santanu because he was born when his father had controlled his passions by ascetic penances.

    '
  modern: 'This was none other than Mahābhiṣa. The child was called Śāntanu because he was born when his father had controlled his passions by ascetic penances.

    '
adi-1-103-31:
  ganguli: 1 XCVII
  speaker: Vaisampayana continued
  text: 'Pratipa, having thus commanded his son Santanu and installed him on his throne, retired into the woods.

    '
  modern: 'Having given these commands to his son Śāntanu and installed him on his throne, Pratīpa retired into the woods.

    '
  speakerModern: 'Vaiśampāyana continued:'
adi-1-103-32:
  ganguli: 1 C
  speaker: Vaisampayana said
  text: 'The monarch Santanu, the most adored of the gods and royal sages, was known in all the worlds for his wisdom, virtues, and truthfulness (of speech).

    '
  modern: 'King Śāntanu, most beloved of the gods and royal sages, was known in all the worlds for his wisdom, his virtues, and his truthful speech.

    '
  speakerModern: 'Vaiśampāyana said:'
adi-1-103-34:
  ganguli: 1 C
  text: 'All the kings of the earth, beholding him devoted to virtue, bestowed upon that foremost of virtuous men the title of King of kings.

    '
  modern: 'All the kings of the earth, seeing him devoted to virtue, gave that foremost of virtuous men the title of King of kings.

    '
adi-1-103-43:
  ganguli: 1 C
  text: 'And Santanu was the king and father of all--of those that were miserable and those that had no protectors, of birds and beasts, in fact, of every created thing.

    '
  modern: 'Śāntanu was king and father to all: to the wretched and those without protectors, to birds and beasts, in fact to every created thing.

    '
adi-1-103-46:
  ganguli: 1 XCVII
  text: 'And king Santanu endued with great intelligence and equal unto Indra himself in splendour, became addicted to hunting and passed much of his time in the woods. And the best of monarchs always slew deer and buffaloes.

    '
  modern: 'King Śāntanu, highly intelligent and as splendid as Indra himself, grew fond of hunting and spent much of his time in the woods. The best of monarchs always killed deer and buffaloes.

    '
adi-1-104-1:
  ganguli: 1 XCVIII
  speaker: Vaisampayana said
  text: 'The maiden then, hearing those soft and sweet words of the smiling monarch, and remembering her promise to the Vasus, addressed the king in reply.

    '
  modern: 'The maiden heard the soft, sweet words of the smiling king, and remembering her promise to the Vasus, she answered him.

    '
  speakerModern: 'Vaiśampāyana said:'
adi-1-104-5:
  ganguli: 1 XCVIII
  text: 'Of faultless features, the damsel sending a thrill of pleasure into the heart by every word she uttered, said, ''O king, I shall become thy wife and obey thy commands. But, O monarch, thou must not interfere with me in anything I do, be it agreeable or disagreeable.

    '
  modern: 'With faultless features, the damsel thrilled his heart with every word and said, "O king, I will become your wife and obey your commands. But, O monarch, you must not interfere with anything I do, whether you like it or not.

    '
adi-1-104-7:
  ganguli: 1 XCVIII
  text: 'Nor shall thou ever address me unkindly. As long as thou shalt behave kindly I promise to live with thee. But I shall certainly leave thee the moment thou interferest with me or speakest to me an unkind word.

    '
  modern: 'And you must never speak to me unkindly. As long as you are kind, I promise to live with you. But I will certainly leave you the moment you interfere with me or speak an unkind word to me."

    '
adi-1-105-2:
  ganguli: 1 XCVIII
  text: 'And king Santanu also, obtaining her for his wife, enjoyed to the full the pleasure of her company.

    '
  modern: 'King Śāntanu, having won her as his wife, enjoyed the pleasure of her company to the full.

    '
adi-1-105-3:
  ganguli: 1 XCVIII
  text: 'And the king, while thus enjoying himself with his wife, had eight children born unto him who in beauty were like the very celestials themselves.

    '
  modern: 'While the king lived happily with his wife, eight children were born to him, as beautiful as the gods themselves.

    '
adi-1-105-4:
  ganguli: 1 XCVIII
  text: 'But, O Bharata, those children, one after another, as soon as they were born, were thrown into the river by Ganga who said, ''This is for thy good. And the children sank to rise no more.

    '
  modern: 'But, O Bharata, as soon as each child was born, Gaṅgā threw it into the river, saying, "This is for your good." And the children sank and did not rise again.

    '
adi-1-105-8:
  ganguli: 1 XCVIII
  text: 'The king, however, could not be pleased with such conduct. But he spoke not a word about it lest his wife should leave him.

    '
  modern: 'The king was not pleased with such conduct, but he said nothing about it, for fear his wife would leave him.

    '
adi-1-105-10:
  ganguli: 1 XCVIII
  text: 'But when the eighth child was born, and when his wife as before was about to throw it smilingly into the river, the king with a sorrowful countenance and desirous of saving it from destruction, addressed her and said, ''Kill it not!

    '
  modern: 'But when the eighth child was born and his wife was about to throw it into the river, smiling as before, the king, with a sorrowful face and wanting to save the child, said to her, "Do not kill it!

    '
adi-1-105-11:
  ganguli: 1 XCVIII
  text: 'Who art thou and whose? Why dost thou kill thy own children? Murderess of thy sons, the load of thy sins is great!

    '
  modern: 'Who are you, and whose? Why do you kill your own children? You murder your sons; the load of your sin is great!"

    '
adi-1-105-12:
  ganguli: 1 XCVIII
  text: 'His wife, thus addressed, replied, ''O thou desirous of offspring, thou hast already become the first of those that have children. I shall not destroy this child of thine. But according to our agreement, the period of my stay with thee is at an end.

    '
  modern: 'His wife replied, "O you who wanted a child, you have already become the foremost of those who have children. I will not destroy this child of yours. But by our agreement, the time of my stay with you is over.

    '
adi-1-105-18:
  ganguli: 1 XCVIII
  text: 'I have thus freed them from the curse of the Rishi Apava. Blest be thou; I leave thee, O king! But rear thou this child of rigid vows.

    '
  modern: 'I have now freed them from the curse of the sage Āpava. Blessings on you; I leave you, O king! But raise this child of firm vows."

    '
adi-1-106-48:
  ganguli: 1 XCIX
  speaker: Vaisampayana continued
  text: 'Having said this, the goddess disappeared then and there. And taking with her the child, she went away to the region she chose.

    '
  modern: 'Having said this, the goddess vanished there and then. She took the child with her and went to whatever place she chose.

    '
  speakerModern: 'Vaiśampāyana continued:'
adi-1-106-49:
  ganguli: 1 XCIX
  text: 'And that child of Santanu was named both Gangeya and Devavrata and excelled his father in all accomplishments.

    '
  modern: 'Śāntanu''s son was named both Gāṅgeya and Devavrata, and he surpassed his father in every accomplishment.

    '
adi-1-107-41:
  ganguli: 1 C
  text: 'O king of superior courage, take this thy own heroic child given unto thee by me. … Thus commanded by Ganga, Santanu took his child resembling the Sun himself in glory and returned to his capital.

    '
  modern: 'O king of great courage, take this heroic child of yours, whom I give back to you. … Thus commanded by Gaṅgā, Śāntanu took his child, who shone like the Sun, and returned to his capital.

    '
adi-1-107-44:
  ganguli: 1 C
  text: 'And having summoned all the Pauravas together, for the protection of his kingdom he installed his son as his heir-apparent.

    '
  modern: 'He called all the Pauravas together and, to protect his kingdom, installed his son as heir apparent.

    '
adi-1-107-45:
  ganguli: 1 C
  text: 'And O bull of Bharata''s race, the prince soon gratified by his behaviour his father and the other members of the Paurava race: in fact, all the subjects of the kingdom. And the king of incomparable prowess lived happily with that son of his.

    '
  modern: 'And, O bull of Bharata''s race, the prince soon pleased his father, the other Pauravas, and all the people of the kingdom by his conduct. The king of unmatched prowess lived happily with his son.

    '
adi-1-107-46:
  ganguli: 1 C
  text: 'Four years had thus passed away, when the king one day went into the woods on the bank of the Yamuna.

    '
  modern: 'Four years went by in this way. Then one day the king went into the woods on the bank of the Yamunā.

    '
adi-1-107-51:
  ganguli: 1 C
  text: 'And Santanu, beholding that maiden of celestial form endued with beauty, amiableness, and such fragrance, desired her for his wife. And repairing unto her father, the king solicited his consent to the proposed match.

    '
  modern: 'Śāntanu saw that maiden of celestial form, with her beauty, her sweetness, and her fragrance, and wanted her for his wife. He went to her father and asked for his consent to the match.

    '
adi-1-107-52:
  ganguli: 1 C
  text: 'But the chief of the fishermen replied to the monarch, saying, …

    '
  modern: 'But the chief of the fishermen said to the king, …

    '
adi-1-107-55:
  ganguli: 1 C
  text: 'O sinless one, thou art truthful: if thou desirest to obtain this maiden as a gift from me, give, me then this pledge. If, indeed, thou givest the pledge, I will of course bestow my daughter upon thee for truly I can never obtain a husband for her equal to thee.

    '
  modern: 'O sinless one, you are truthful. If you want to receive this maiden as a gift from me, give me this pledge first. If you do, I will gladly give you my daughter, for I could never find her a husband equal to you."

    '
adi-1-107-57:
  ganguli: 1 C
  speaker: The fisherman said
  text: 'O king, what I ask of thee is this: the son born of this maiden shall be installed by thee on thy throne and none else shall thou make thy successor.

    '
  modern: 'O king, what I ask is this: the son born of this maiden shall be the one you install on your throne, and you shall make no one else your successor."

    '
  speakerModern: 'The fisherman said:'
adi-1-107-58:
  ganguli: 1 C
  speaker: Vaisampayana continued
  text: 'O Bharata, when Santanu heard this, he felt no inclination to grant such a boon, though the fire of desire sorely burnt him within.

    '
  modern: 'O Bharata, when Śāntanu heard this, he did not want to grant such a boon, though the fire of desire burned him sorely within.

    '
  speakerModern: 'Vaiśampāyana continued:'
adi-1-107-59:
  ganguli: 1 C
  text: 'The king with his heart afflicted by desire returned to Hastinapura, thinking all the way of the fisherman''s daughter. …

    '
  modern: 'His heart afflicted by desire, the king returned to Hāstinapura, thinking all the way of the fisherman''s daughter. …

    '
adi-1-107-64:
  ganguli: 1 C
  text: 'Thus addressed by his son, Santanu answered, ''Thou sayest truly, O son, that I have become melancholy. I will also tell thee why I am so.

    '
  modern: 'Thus addressed by his son, Śāntanu answered, "You are right, my son, that I have become melancholy. I will also tell you why.

    '
adi-1-107-83:
  ganguli: 1 C
  text: 'I have now told thee fully the causes of my sorrow.'' "Vaisampayana continued, ''Devavrata who was endued with great intelligence, having ascertained all this from the king, reflected within himself for a while.

    '
  modern: 'I have now told you fully the causes of my sorrow." Devavrata, a man of great intelligence, having learned all this from the king, thought for a while.

    '
adi-1-107-84:
  ganguli: 1 C
  text: 'Then Devavrata, accompanied by many Kshatriya chiefs of venerable age, personally repaired to the chief of the fishermen and begged of him his daughter on behalf of the king.

    '
  modern: 'Then Devavrata, with many aged Kṣatriya chiefs, went in person to the chief of the fishermen and asked him for his daughter on the king''s behalf.

    '
adi-1-107-108:
  ganguli: 1 C
  text: 'I shall now settle the matter of my children. O fisherman, from this day I adopt the vow of Brahmacharya (study and meditation in celibacy).

    '
  modern: 'Now I will settle the matter of my children. O fisherman, from this day I take the vow of Brahmacarya (study and meditation in celibacy).

    '
adi-1-107-109:
  ganguli: 1 C
  text: 'If I die sonless, I shall yet attain to regions of perennial bliss in heaven!

    '
  modern: 'If I die without a son, I shall still reach the regions of lasting bliss in heaven!"

    '
adi-1-107-111:
  ganguli: 1 C
  text: 'Ye kings, I have already relinquished my right to the throne …

    '
  modern: 'Kings, I have already given up my right to the throne …

    '
adi-1-107-112:
  ganguli: 1 C
  speaker: Vaisampayana continued
  text: 'Upon these words of the son of Ganga, the hair on the fisherman''s body stood on end from glee, and he replied, ''I bestow my daughter!

    '
  modern: 'At these words of the son of Gaṅgā, the hair on the fisherman''s body stood on end with joy, and he replied, "I give my daughter!

    '
  speakerModern: 'Vaiśampāyana continued:'
adi-1-107-113:
  ganguli: 1 C
  text: 'Immediately after, the Apsaras and the gods with diverse tribes of Rishis began to rain down flowers from the firmament upon the head of Devavrata and exclaimed, ''This one is Bhishma (the terrible). … Bhishma then, to serve his father, addressed the illustrious damsel and said, …

    '
  modern: 'At once the Apsarases and the gods, with many tribes of Ṛṣis, began to rain flowers from the sky on Devavrata''s head, and they cried, "This one is Bhīṣma (the terrible). … Then Bhīṣma, to serve his father, spoke to the glorious maiden: …

    '
adi-1-107-114:
  ganguli: 1 C
  text: '(with adi-1-107-113)

    '
adi-1-107-115:
  ganguli: 1 C
  text: 'Bhishma then, to serve his father, addressed the illustrious damsel and said, ''O mother, ascend this chariot, and let us go unto our house.'' "Vaisampayana continued, ''Having said this, Bhishma helped the beautiful maiden into his chariot.

    '
  modern: 'Then Bhīṣma, to serve his father, spoke to the glorious maiden: "O mother, get into this chariot, and let us go to our house." Having said this, Bhīṣma helped the beautiful maiden into his chariot.

    '
adi-1-107-116:
  ganguli: 1 C
  text: 'On arriving with her at Hastinapura, he told Santanu everything as it had happened. And the assembled kings, jointly and individually, applauded his extraordinary act and said, ''He is really Bhishma (the terrible)!

    '
  modern: 'When he reached Hāstinapura with her, he told Śāntanu everything just as it had happened. And the assembled kings, together and one by one, praised his extraordinary act and said, "He is truly Bhīṣma (the terrible)!

    '
adi-1-107-118:
  ganguli: 1 C
  text: 'And Santanu also, hearing of the extraordinary achievements of his son, became highly gratified and bestowed upon the high-souled prince the boon of death at will, saying, ''Death shall never come to thee as long as thou desirest to live.

    '
  modern: 'Hearing of his son''s extraordinary deeds, Śāntanu was highly pleased and gave the high-souled prince the boon of dying at will, saying, "Death shall never come to you as long as you want to live.

    '
adi-1-107-120:
  ganguli: 1 C
  text: 'Truly death shall approach thee, O sinless one, having first obtained thy command.

    '
  modern: 'Death will approach you, O sinless one, only after first obtaining your permission."

    '
adi-1-108-3:
  ganguli: 1 CI
  speaker: Vaisampayana said
  text: 'O monarch, after the nuptials were over, king Santanu established his beautiful bride in his household. Soon after was born of Satyavati an intelligent and heroic son of Santanu named Chitrangada.

    '
  modern: 'After the wedding, King Śāntanu settled his beautiful bride in his household. Soon a son was born to Śāntanu by Satyavatī, an intelligent and heroic boy named Citrāṅgada.

    '
  speakerModern: 'Vaiśampāyana said:'
adi-1-108-4:
  ganguli: 1 CI
  text: 'The lord Santanu of great prowess also begat upon Satyavati another son named Vichitravirya, who became a mighty bowman and who became king after his father.

    '
  modern: 'The lord Śāntanu, of great prowess, also had another son by Satyavatī, named Vicitravīrya, who became a mighty bowman and king after his father.

    '
adi-1-108-6:
  ganguli: 1 CI
  text: 'And after Santanu had ascended to heaven. Bhishma, placing himself under the command of Satyavati, installed that suppressor of foes, viz., Chitrangada, on the throne, …

    '
  modern: 'And after Śāntanu had gone up to heaven, Bhīṣma, acting on Satyavatī''s command, installed that suppressor of foes, Citrāṅgada, on the throne. …

    '
adi-1-108-8:
  ganguli: 1 CI
  text: 'And beholding that he could vanquish men, Asuras, and the very gods, his namesake, the powerful king of the Gandharvas, approached him for an encounter.

    '
  modern: 'Seeing that he could defeat men, Asuras, and even the gods, the powerful king of the Gandharvas, who had the same name, came to fight him.

    '
adi-1-108-11:
  ganguli: 1 CI
  text: 'Between that Gandharva and that foremost one of the Kurus, who were both very powerful, there occurred on the field of Kurukshetra a fierce combat which lasted full three years on the banks of the Saraswati.

    '
  modern: 'There was a fierce combat between that Gandharva and that foremost of the Kurus, both very powerful, on the field of Kurukṣetra, on the banks of the Sarasvatī, and it lasted three full years.

    '
adi-1-108-13:
  ganguli: 1 CI
  text: 'In that terrible encounter characterised by thick showers of weapons and in which the combatants ground each other fiercely, the Gandharva, who had greater prowess or strategic deception, slew the Kuru prince. …

    '
  modern: 'In that terrible fight, with thick showers of weapons, in which the fighters ground each other down, the Gandharva, who had greater power or skill in deception, killed the Kuru prince. …

    '
adi-1-108-15:
  ganguli: 1 CI
  text: 'When that tiger among men endued with great prowess was slain, Bhishma, the son of Santanu, performed, O king, all his obsequies.

    '
  modern: 'When that tiger among men of great prowess was killed, Bhīṣma, the son of Śāntanu, performed, O king, all his funeral rites.

    '
adi-1-108-16:
  ganguli: 1 CI
  text: 'He then installed the boy Vichitravirya of mighty arms, still in his minority, on the throne of the Kurus. And Vichitravirya, placing himself under the command of Bhishma, ruled the ancestral kingdom.

    '
  modern: 'He then installed the boy Vicitravīrya of mighty arms, still a minor, on the throne of the Kurus. Vicitravīrya ruled his ancestral kingdom under Bhīṣma''s command.

    '
adi-1-109-2:
  ganguli: 1 CII
  text: 'When he saw that his brother, who was the foremost of intelligent men, attained to majority, Bhishma set his heart upon marrying Vichitravirya.

    '
  modern: 'When Bhīṣma saw that his brother, the foremost of intelligent men, had come of age, he set his heart on marrying Vicitravīrya.

    '
adi-1-109-3:
  ganguli: 1 CII
  text: 'At this time he heard that the three daughters of the king of Kasi, all equal in beauty to the Apsaras themselves, would be married on the same occasion, selecting their husbands at a self-choice ceremony.

    '
  modern: 'At this time he heard that the three daughters of the king of Kāśī, each as beautiful as an Apsaras, were to be married on the same occasion, choosing their husbands at a svayaṃvara.

    '
adi-1-109-60:
  ganguli: 1 CII
  text: 'And Bhishma of mighty arms, impelled by the desire of benefiting his brother, having by his prowess brought them thus, then offered those maidens possessing every accomplishment unto Vichitravirya.

    '
  modern: 'Bhīṣma of mighty arms, wanting to benefit his brother, had won the maidens by his prowess, and now he offered those maidens, who had every accomplishment, to Vicitravīrya.

    '
adi-1-109-62:
  ganguli: 1 CII
  text: 'And when everything about the wedding had been settled by Bhishma in consultation with Satyavati, the eldest daughter of the king of Kasi, with a soft smile, told him these words, ''At heart I had chosen the king of Saubha for my husband.

    '
  modern: 'When Bhīṣma had settled everything about the wedding with Satyavatī, the eldest daughter of the king of Kāśī told him, with a soft smile, "In my heart I had chosen the king of Saubha for my husband.

    '
adi-1-109-63:
  ganguli: 1 CII
  text: 'He had, in his heart, accepted me for his wife. This was also approved by my father.

    '
  modern: 'He had accepted me in his heart as his wife, and my father approved this too.

    '
adi-1-109-68:
  ganguli: 1 CII
  text: 'As he was conversant with the rules of virtue, he consulted with the Brahmanas who had mastered the Vedas, and permitted Amba, the eldest daughter of the ruler of Kasi to do as she liked.

    '
  modern: 'Since he knew the rules of virtue, he consulted Brāhmaṇas who had mastered the Vedas, and he allowed Ambā, the eldest daughter of the ruler of Kāśī, to do as she wished.

    '
adi-1-109-69:
  ganguli: 1 CII
  text: 'But he bestowed with due rites the two other daughters, Ambika and Ambalika on his younger brother Vichitravirya.

    '
  modern: 'But he gave the other two daughters, Ambikā and Ambālikā, with due rites to his younger brother Vicitravīrya.

    '
adi-1-109-70:
  ganguli: 1 CII
  text: 'And though Vichitravirya was virtuous and abstemious, yet, proud of youth and beauty, he soon became lustful after his marriage.

    '
  modern: 'Vicitravīrya was virtuous and self-controlled, but he was proud of his youth and beauty, and soon after his marriage he became lustful.

    '
adi-1-111-6:
  ganguli: 1 CII
  text: 'And the prince passed seven years uninterruptedly in the company of his wives. He was attacked while yet in the prime of youth, with phthisis.

    '
  modern: 'The prince spent seven years without a break in the company of his wives. In the prime of his youth he was struck by consumption.

    '
adi-1-111-7:
  ganguli: 1 CII
  text: 'Friends and relatives in consultation with one another tried to effect a cure. But in spite of all efforts, the Kuru prince died, setting like the evening sun.

    '
  modern: 'His friends and relatives consulted together and tried to cure him. But in spite of all their efforts the Kuru prince died, setting like the evening sun.

    '
adi-1-112-1:
  ganguli: 1 CIII
  speaker: Vaisampayana said
  text: 'The unfortunate Satyavati then became plunged in grief on account of her son. And after performing with her daughters-in-law the funeral rites of the deceased, consoled, as best she could, her weeping daughters-in-law and Bhishma, that foremost of all wielders of weapons.

    '
  modern: 'The unfortunate Satyavatī was plunged in grief for her son. She performed the funeral rites of the dead prince with her daughters-in-law, and she comforted, as best she could, her weeping daughters-in-law and Bhīṣma, the foremost of all wielders of weapons.

    '
  speakerModern: 'Vaiśampāyana said:'
adi-1-112-21:
  ganguli: 1 CIII
  text: 'Thus addressed by her son endued with wealth of energy, Satyavati said unto Bhishma, ''O thou whose prowess is truth, I know of thy firmness in truth. Thou canst, if so minded, create, by the help of thy energy, three worlds other than those that exist. …

    '
  modern: 'Thus addressed by her son, who was rich in energy, Satyavatī said to Bhīṣma, "O you whose prowess is truth, I know how firm you are in truth. If you wish, you can create, by your own energy, three worlds other than those that exist. …

    '
adi-1-112-23:
  ganguli: 1 CIII
  text: 'O punisher of foes, act in such a way that the lineal link may not be broken and our friends and relatives may not grieve.

    '
  modern: 'O punisher of foes, act so that the family line is not broken and our friends and relatives do not grieve.

    '
adi-1-114-17:
  ganguli: 1 CV
  speaker: Vaisampayana continued
  text: 'Satyavati, then, smiling softly and in voice broken in bashfulness, addressed Bhishma saying, ''O Bharata of mighty arms, what thou sayest is true. From my confidence in thee I shall now indicate the means of perpetuating our line.

    '
  modern: 'Satyavatī, smiling softly and in a voice broken by shyness, said to Bhīṣma, "O Bharata of mighty arms, what you say is true. Because I trust you, I will now tell you the means of continuing our line.

    '
  speakerModern: 'Vaiśampāyana continued:'
adi-1-114-35:
  ganguli: 1 CV
  text: 'And the child of Parasara so born of me in my maidenhood hath become a great Rishi endued with large ascetic powers and known by the name of Dwaipayana (the island-born). …

    '
  modern: 'The child of Parāśara, born to me while I was still a maiden, has become a great ṛṣi of large ascetic powers, known as Dvaipāyana (the island-born). …

    '
adi-1-114-38:
  ganguli: 1 CV
  text: 'Appointed by me and thee also, that Rishi of incomparable splendour will certainly beget good children upon the wives of thy brother.

    '
  modern: 'Appointed by me and by you as well, that ṛṣi of incomparable splendor will surely father good children on your brother''s wives.

    '
adi-1-114-41:
  ganguli: 1 CV
  speaker: Vaisampayana continued
  text: 'Mention being made of the great Rishi, Bhishma with joined palms said, ''That man is truly intelligent who fixes his eyes judiciously on virtue, profit, and pleasure, and who after reflecting with patience, acteth in such a way that virtue may lead to future virtue, profit to future profit and pleasure to future pleasure.

    '
  modern: 'When the great ṛṣi was mentioned, Bhīṣma folded his hands and said, "That man is truly intelligent who looks carefully at virtue, profit, and pleasure, and who, after reflecting patiently, acts so that virtue leads to further virtue, profit to further profit, and pleasure to further pleasure.

    '
  speakerModern: 'Vaiśampāyana continued:'
adi-1-114-44:
  ganguli: 1 CV
  text: 'Therefore, that which hath been said by thee and which, besides being beneficial to us, is consistent with virtue, is certainly the best advice and hath my full approval.

    '
  modern: 'So what you have said, which is good for us and consistent with virtue, is certainly the best advice, and I fully approve it."

    '
adi-1-114-46:
  ganguli: 1 CV
  text: 'And when Bhishma had said this, O thou of Kuru''s race, Kali (Satyavati) thought of the Muni Dwaipayana and Dwaipayana who was then engaged in interpreting the Vedas, learning that he was being called up by his mother, came instantly unto her without anybody''s knowing it. Satayavati then duly greeted her son and embraced him with arms, bathing him in her tears, for the daughter of the fisherman wept bitterly at the sight of her son after so long a time.

    '
  modern: 'When Bhīṣma had said this, O you of Kuru''s race, Kālī (Satyavatī) thought of the sage Dvaipāyana. He was then busy interpreting the Vedas, but learning that his mother was calling him, he came to her at once, with no one knowing it. Satyavatī greeted her son properly and embraced him, bathing him in her tears, for the fisherman''s daughter wept bitterly at the sight of her son after so long a time.

    '
adi-1-114-49:
  ganguli: 1 CV
  text: 'Therefore, O virtuous one, command me without delay. I shall accomplish thy desire.

    '
  modern: 'So command me without delay, O virtuous one. I will do what you wish.

    '
adi-1-115-47:
  ganguli: 1 CVI
  text: 'Thus were born, in the field of Vichitravirya, even of Dwaipayana those sons of the splendour of celestial children, those propagators of the Kuru race.

    '
  modern: 'Thus were born, in the field of Vicitravīrya, from Dvaipāyana, those sons who shone like children of the gods and who would carry on the Kuru race.

    '
adi-1-118-17:
  ganguli: 1 CIX
  text: 'And Dhritarashtra and Pandu and Vidura of great intelligence were from their birth brought up by Bhishma, as if they were his own sons.

    '
  modern: 'Dhṛtarāṣṭra, Pāṇḍu, and the wise Vidura were raised by Bhīṣma from their birth as if they were his own sons.

    '
adi-1-118-18:
  ganguli: 1 CIX
  text: 'And the children, having passed through the usual rites of their order, devoted themselves to vows and study. And they grew up into fine young men skilled in the Vedas and all athletic sports.

    '
  modern: 'The children went through the usual rites of their order and devoted themselves to vows and study. They grew into fine young men, skilled in the Vedas and in all athletic sports.

    '
adi-1-118-21:
  ganguli: 1 CIX
  text: 'And they became well-skilled in the practice of bow, in horsemanship, in encounters with mace, sword and shield, in the management of elephants in battle, and in the science of morality. Well-read in history and the Puranas and various branches of learning, and acquainted with the truths of the Vedas and their branches they acquired knowledge, which was versatile and deep.

    '
  modern: 'They became skilled in the bow, in horsemanship, in fighting with mace, sword, and shield, in handling elephants in battle, and in the science of morality. Well read in history, the Purāṇas, and the various branches of learning, and acquainted with the truths of the Vedas and their branches, they gained wide and deep knowledge.

    '
adi-1-118-27:
  ganguli: 1 CIX
  text: '… while in the three worlds there was no one equal to Vidura in devotion to virtue and in the knowledge of the dictates of morality.

    '
  modern: '… and in the three worlds there was no one equal to Vidura in devotion to virtue and knowledge of the rules of morality.

    '
adi-1-118-30:
  ganguli: 1 CIX
  text: 'Pandu became king, for Dhritarashtra, owing to the blindness, and Vidura, for his birth by a Sudra woman, did not obtain the kingdom.

    '
  modern: 'Pāṇḍu became king, for Dhṛtarāṣṭra, because of his blindness, and Vidura, because he was born of a Śūdra woman, did not obtain the kingdom.

    '
adi-1-118-33:
  ganguli: 1 CIX
  text: 'One day Bhishma, the foremost of those acquainted with the duties of a statesman and dictates of morality, properly addressing Vidura conversant with the truth of religion and virtue, said as follows.

    '
  modern: 'One day Bhīṣma, the foremost of those who knew a statesman''s duties and the rules of morality, addressed Vidura, who knew the truth of religion and virtue, and said as follows.

    '
adi-1-119-5:
  ganguli: 1 CX
  text: 'It hath been heard by me that there are three maidens worthy of being allied to our race. One is the daughter of (Surasena of) the Yadava race; the other is the daughter of Suvala; and the third is the princess of Madra.

    '
  modern: 'I have heard that there are three maidens worthy of an alliance with our race. One is the daughter of the Yādava line (of Śūrasena); another is the daughter of Suvala; and the third is the princess of Madra.

    '
adi-1-119-6:
  ganguli: 1 CX
  text: 'O son, all these maidens are of course of blue blood. Possessed of beauty and pure blood, they are eminently fit for an alliance with our family.

    '
  modern: 'My son, all these maidens are of noble blood. Beautiful and of pure descent, they are well suited to an alliance with our family.

    '
adi-1-119-7:
  ganguli: 1 CX
  text: 'O thou foremost of intelligent men, I think we should choose them for the growth of our race. Tell me what thou thinkest.

    '
  modern: 'O foremost of intelligent men, I think we should choose them for the growth of our race. Tell me what you think."

    '
adi-1-119-8:
  ganguli: 1 CX
  text: 'Thus addressed, Vidura replied, ''Thou art our father and thou art our mother, too. Thou art our respected spiritual instructor. Therefore, do thou what may be best for us in thy eyes.''

    '
  modern: 'Thus addressed, Vidura replied, "You are our father and our mother, and our respected teacher. So do whatever you think best for us."

    '
adi-1-119-15:
  ganguli: 1 CX
  text: '… and the chaste Gandhari hearing that Dhritarashtra was blind and that her parents had consented to marry her to him, from love and respect for her future husband, blindfolded her own eyes.

    '
  modern: '… The chaste Gāndhārī heard that Dhṛtarāṣṭra was blind and that her parents had agreed to marry her to him, and out of love and respect for her future husband she blindfolded her own eyes.

    '
adi-1-119-16:
  ganguli: 1 CX
  text: 'Sakuni, the son of Suvala, bringing unto the Kurus his sister endued with youth and beauty, formally gave her away unto Dhritarashtra. And Gandhari was received with great respect and the nuptials were celebrated with great pomp under Bhishma''s directions.

    '
  modern: 'Śakuni, the son of Suvala, brought his sister, who was young and beautiful, to the Kurus and formally gave her to Dhṛtarāṣṭra. Gāndhārī was received with great respect, and the wedding was celebrated with great pomp under Bhīṣma''s direction.

    '
adi-1-120-1:
  ganguli: 1 CXI
  speaker: Vaisampayana continued
  text: 'There was amongst the Yadavas a chief named Sura. He was the father of Vasudeva. And he had a daughter called Pritha, who was unrivalled for beauty on earth.

    '
  modern: 'There was among the Yādavas a chief named Śūra. He was the father of Vasudeva. He had a daughter called Pṛthā, who was unrivaled in beauty on earth.

    '
  speakerModern: 'Vaiśampāyana continued:'
adi-1-121-9:
  ganguli: 1 CXII
  text: 'Her father Kuntibhoja seeing this, invited, O best of monarchs, the princes and kings of other countries and desired his daughter to select her husband from among her guests.

    '
  modern: "Her father Kuntibhoja saw this and, O best of monarchs, invited the princes and kings of other countries and asked his daughter to choose her husband from among her guests."
adi-1-122-2:
  ganguli: 1 CXIII
  text: 'Accompanied by an army composed of four kinds of force, and also by aged councillors and Brahmanas and great Rishis, he went to the capital of the king of Madra.

    '
  modern: 'Accompanied by an army of the four kinds of forces, by aged councillors, Brāhmaṇas, and great ṛṣis, he went to the capital of the king of Madra.

    '
adi-1-122-17:
  ganguli: 1 CXIII
  text: 'Then the wise Bhishma, the son of the oceangoing Ganga, rejoiced at the issue of his mission, took Madri with him, and returned to the Kuru capital named after the elephant.

    '
  modern: 'Then the wise Bhīṣma, son of the ocean-going Gaṅgā, was pleased with the success of his mission. He took Mādrī with him and returned to the Kuru capital named after the elephant.

    '
adi-1-122-18:
  ganguli: 1 CXIII
  text: 'Then selecting on auspicious day and moment as indicated by the wise for the ceremony, King Pandu was duly united with Madri.

    '
  modern: 'Choosing an auspicious day and moment, as the wise indicated for the ceremony, King Pāṇḍu was duly united with Mādrī.

    '
adi-1-122-21:
  ganguli: 1 CXIII
  text: 'And, O king of kings, that best of monarchs then gave himself up to enjoyment in the company of his two wives as best he liked and to the limit of his desires. And after thirty days had elapsed, the Kuru king, O monarch, started from his capital for the conquest of the world.

    '
  modern: 'And, O king of kings, that best of monarchs then enjoyed himself in the company of his two wives as he liked, to the limit of his desires. After thirty days had passed, the Kuru king, O monarch, set out from his capital to conquer the world.

    '
adi-1-122-32:
  ganguli: 1 CXIII
  text: 'And all kings of the world, thus vanquished by him, regarded him as the one single hero on earth even as the celestials regard Indra in heaven.

    '
  modern: 'All the kings of the world, thus conquered by him, regarded him as the one hero on earth, as the celestials regard Indra in heaven.

    '
adi-1-123-6:
  ganguli: 1 CXIV
  text: 'A little while after, O bull of Bharata''s race, Pandu who had achieved a victory over sloth and lethargy, accompanied by his two wives, Kunti and Madri, retired into the woods. Leaving his excellent palace with its luxurious beds, he became a permanent inhabitant of the woods, devoting the whole of his time to the chase of the deer.

    '
  modern: 'A little while after, O bull of Bharata''s race, Pāṇḍu, who had overcome sloth and lethargy, retired into the woods with his two wives, Kuntī and Mādrī. Leaving his excellent palace with its luxurious beds, he made the woods his permanent home, spending all his time hunting deer.

    '
adi-1-126-1:
  ganguli: 1 CXIV
  text: 'Meanwhile the son of the ocean-going Ganga heard that king Devaka had a daughter endued with youth and beauty and begotten upon a Sudra wife.

    '
  modern: 'Meanwhile the son of the ocean-going Gaṅgā heard that King Devaka had a daughter, young and beautiful, born of a Śūdra wife.

    '
adi-1-126-2:
  ganguli: 1 CXIV
  text: 'Bringing her from her father''s abode, Bhishma married her to Vidura of great wisdom.

    '
  modern: 'Bhīṣma brought her from her father''s house and married her to the wise Vidura.

    '
adi-1-126-3:
  ganguli: 1 CXIV
  text: 'And Vidura begot upon her many children like unto himself in accomplishments.

    '
  modern: 'And Vidura had many children by her, like himself in accomplishments.

    '
adi-1-126-13:
  ganguli: 1 CXX
  speaker: Vaisampayana continued
  text: 'Hearing these words of the ascetics, Pandu, remembering the loss of his procreative powers owing to the curse of the deer, began to reflect deeply.

    '
  modern: 'Hearing these words of the ascetics, Pāṇḍu remembered that he had lost his power to father children because of the deer''s curse, and he began to think deeply.

    '
  speakerModern: 'Vaiśampāyana continued:'
adi-1-126-15:
  ganguli: 1 CXX
  text: 'And, O bull of Bharata''s race, having acquired after a long time great ascetic merit coupled with complete singleness, Pandu became even like a Brahmarshi (though he was a Kshatriya by birth).

    '
  modern: 'And, O bull of Bharata''s race, after a long time Pāṇḍu gained great ascetic merit together with complete single-mindedness, and he became like a Brahmarṣi, though he was a Kṣatriya by birth.

    '
adi-1-126-16:
  ganguli: 1 CXX
  text: 'Men are born on this earth with four debts, viz. those due unto the (deceased) ancestors, the gods, the Rishis, and other men.

    '
  modern: 'Men are born on this earth with four debts: to their ancestors, the gods, the ṛṣis, and other men.

    '
adi-1-126-19:
  ganguli: 1 CXX
  text: 'I have justly discharged my obligations to the Rishis, the gods, and other men. But those others than these three are sure to perish with the dissolution of my body!

    '
  modern: 'I have properly paid my debts to the ṛṣis, the gods, and other men. But the others, my ancestors, will surely perish when my body dissolves!

    '
adi-1-126-26:
  ganguli: 1 CXX
  text: 'The wise expounders of the eternal religion declare that a son, O Kunti, is the cause of virtuous fame in the three worlds.

    '
  modern: 'The wise expounders of the eternal religion declare that a son, O Kuntī, is the cause of virtuous fame in the three worlds.

    '
adi-1-128-60:
  ganguli: 1 CXXI
  speaker: Vaisampayana said
  text: 'Thus addressed, Kunti replied unto her heroic lord, king Pandu, that bull amongst the Kurus, saying, ''O virtuous one, it behoveth thee not to say so unto me.

    '
  modern: 'Thus addressed, Kuntī replied to her heroic lord, King Pāṇḍu, that bull among the Kurus: "O virtuous one, you should not speak to me so.

    '
  speakerModern: 'Vaiśampāyana said:'
adi-1-128-62:
  ganguli: 1 CXXII
  text: 'I used to wait respectfully upon Brahmanas of rigid vows and great ascetic merit. …

    '
  modern: 'I used to wait respectfully on Brāhmaṇas of strict vows and great ascetic merit. …

    '
adi-1-128-64:
  ganguli: 1 CXXII
  text: 'Pleased with my services, that Brahmana gave me a boon in the form of a mantra (formula of invocation) for calling into my presence any one of the celestials I liked. And the Rishi, addressing me, said, ''Anyone among the celestials whom thou callest by this shall, O girl, approach thee and be obedient to thy will, whether he liketh it or not. …

    '
  modern: 'Pleased with my service, that Brāhmaṇa gave me a boon in the form of a mantra (a formula of invocation) for calling into my presence any of the celestials I liked. And the ṛṣi said to me, "Any of the celestials whom you call by this shall come to you, O girl, and obey your will, whether he wants to or not. …

    '
adi-1-128-67:
  ganguli: 1 CXXII
  text: 'The words uttered by the Brahmana can never be false. The time also hath come when they may yield fruit.

    '
  modern: 'The words of the Brāhmaṇa can never be false. The time has also come when they may bear fruit.

    '
adi-1-128-68:
  ganguli: 1 CXXII
  text: 'Commanded by thee, O royal sage, I can by that mantra summon any of the celestials, so that we may have good children.

    '
  modern: 'Commanded by you, O royal sage, I can summon any of the celestials with that mantra, so that we may have good children.

    '
adi-1-129-7:
  ganguli: 1 CXXII
  text: 'Fortunate one, summon thou the god of justice. He is the most virtuous of the celestials.

    '
  modern: 'Fortunate one, summon the god of justice. He is the most virtuous of the celestials.

    '
adi-1-129-22:
  ganguli: 1 CXXIII
  text: 'Then the handsome Kunti was united (in intercourse) with the god of justice in his spiritual form and obtained from him a son devoted to the good of all creatures. And she brought his excellent child, who lived to acquire a great fame, … And as soon as the child was born, an incorporeal voice (from the skies) said, …

    '
  modern: 'Then the lovely Kuntī was united with the god of justice in his spiritual form, and she received from him a son devoted to the good of all creatures. She gave birth to that excellent child, who would win great fame, … As soon as the child was born, a voice without a body spoke from the sky: …

    '
adi-1-129-22#2:
  ganguli: 1 CXXIII
  text: '(with adi-1-129-22)

    '
adi-1-129-23:
  ganguli: 1 CXXIII
  text: 'And as soon as the child was born, an incorporeal voice (from the skies) said, ''This child shall be the best of men, the foremost of those that are virtuous. Endued with great prowess and truthful in speech, he shall certainly be the ruler of the earth.

    '
  modern: 'As soon as the child was born, a voice without a body spoke from the sky: "This child will be the best of men, the foremost of the virtuous. Endowed with great prowess and truthful in speech, he will surely rule the earth.

    '
adi-1-129-24:
  ganguli: 1 CXXIII
  text: 'And this first child of Pandu shall be known by the name of Yudhishthira. Possessed of prowess and honesty of disposition, he shall be a famous king, known throughout the three worlds.

    '
  modern: 'This first child of Pāṇḍu will be known by the name Yudhiṣṭhira. Possessing prowess and honesty, he will be a famous king, known throughout the three worlds."

    '
adi-1-129-44:
  ganguli: 1 CXXIII
  text: 'Pandu, having obtained that virtuous son, again addressed his wife and said. ''The wise have declared that a Kshatriya must be endued with physical strength, otherwise he is no Kshatriya.

    '
  modern: 'Pāṇḍu, having obtained that virtuous son, spoke to his wife again and said, "The wise have declared that a Kṣatriya must have physical strength, otherwise he is no Kṣatriya.

    '
adi-1-129-45:
  ganguli: 1 CXXIII
  text: 'Therefore, ask thou for an offspring of superior strength.

    '
  modern: 'Therefore ask for a child of superior strength."

    '
adi-1-129-49:
  ganguli: 1 CXXIII
  text: 'Thus commanded by her lord, Kunti then invoked Vayu. …

    '
  modern: 'Thus commanded by her lord, Kuntī then invoked Vāyu. …

    '
adi-1-129-52:
  ganguli: 1 CXXIII
  text: 'The god of wind thereupon begat upon her the child afterwards known as Bhima of mighty arms and fierce prowess. … And upon the birth of that child endued with extraordinary strength, an incorporeal voice, O Bharata, as before, said, …

    '
  modern: 'The god of the wind then fathered the child afterward known as Bhīma, of mighty arms and fierce prowess. … When that child of extraordinary strength was born, a voice without a body, O Bharata, said as before, …

    '
adi-1-129-53:
  ganguli: 1 CXXIII
  text: 'And upon the birth of that child endued with extraordinary strength, an incorporeal voice, O Bharata, as before, said, ''This child shall be the foremost of all endued with strength.

    '
  modern: 'When that child of extraordinary strength was born, a voice without a body, O Bharata, said as before, "This child will be the foremost of all who have strength."

    '
adi-1-129-56:
  ganguli: 1 CXXIII
  text: 'While he fell from the lap of his mother upon the mountain breast, the violence of the fall broke into fragments the stone upon which he fell without his infant body being injured in the least. …

    '
  modern: 'When he fell from his mother''s lap onto the mountainside, the force of the fall broke into pieces the stone he fell on, while his infant body was not hurt in the least. …

    '
adi-1-129-68:
  ganguli: 1 CXXIII
  text: 'And it so happened that that very day on which Vrikodara was born, was also, O best of Bharatas, the birthday of Duryodhana who afterwards became the ruler of the whole earth.

    '
  modern: 'And it so happened that the very day Vṛkodara was born was also, O best of Bharatas, the birthday of Duryodhana, who was afterward to rule the whole earth.

    '
adi-1-129-69:
  ganguli: 1 CXV
  text: 'As soon as Duryodhana was born, he began to cry and bray like an ass.

    '
  modern: 'As soon as Duryodhana was born, he began to cry and bray like an ass.

    '
adi-1-129-77:
  ganguli: 1 CXV
  text: '… And marking those frightful omens all around, the assembled Brahmanas and the wise Vidura replied, ''O king, O bull among men, when these frightful omens are noticeable at the birth of thy eldest son, …

    '
  modern: '… Seeing those frightful omens all around, the assembled Brāhmaṇas and the wise Vidura replied, "O king, O bull among men, when such frightful omens appear at the birth of your eldest son, …

    '
adi-1-129-79:
  ganguli: 1 CXV
  text: '… it is evident that he shall be the exterminator of thy race. The prosperity of all dependeth on his abandonment. Calamity there must be in keeping him.

    '
  modern: '… it is plain that he will be the destroyer of your race. Everyone''s prosperity depends on abandoning him. If you keep him, there will certainly be calamity.

    '
adi-1-129-81:
  ganguli: 1 CXV
  text: 'O king, if thou abandonest him, there remain yet thy nine and ninety sons. If thou desirest the good of thy race, abandon him, O Bharata!

    '
  modern: 'O king, if you abandon him, you still have your ninety-nine sons. If you want the good of your race, abandon him, O Bharata!

    '
adi-1-129-83:
  ganguli: 1 CXV
  text: 'It hath been said that an individual should be cast off for the sake of the family; that a family should be cast off for the sake of a village; that a village may be abandoned for the sake of the whole country; and that the earth itself may be abandoned for the sake of the soul. … When Vidura and those Brahmanas had stated so, king Dhritarashtra out of affection for his son had not the heart to follow that advice. Then, O king, within a month, were born a full hundred sons unto Dhritarashtra and a daughter also in excess of this hundred. …

    '
  modern: 'It has been said that an individual should be given up for the sake of the family, a family for the sake of a village, a village for the sake of the whole country, and the earth itself for the sake of the soul." … When Vidura and those Brāhmaṇas had spoken so, King Dhṛtarāṣṭra, out of love for his son, did not have the heart to follow their advice. Then, O king, within a month a full hundred sons were born to Dhṛtarāṣṭra, and a daughter besides the hundred. …

    '
adi-1-129-84:
  ganguli: 1 CXV
  text: 'When Vidura and those Brahmanas had stated so, king Dhritarashtra out of affection for his son had not the heart to follow that advice. Then, O king, within a month, were born a full hundred sons unto Dhritarashtra and a daughter also in excess of this hundred.

    '
  modern: 'When Vidura and those Brāhmaṇas had spoken so, King Dhṛtarāṣṭra, out of love for his son, did not have the heart to follow their advice. Then, O king, within a month a full hundred sons were born to Dhṛtarāṣṭra, and a daughter besides the hundred.

    '
adi-1-129-85:
  ganguli: 1 CXV
  text: '(with adi-1-129-84)

    '
adi-1-129-88:
  ganguli: 1 CXV
  text: '… Thus were born unto the wise Dhritarashtra a hundred sons who were all heroes and mighty chariot-fighters, and a daughter over and above the hundred, and another son Yuyutsu of great energy and prowess begotten upon a Vaisya woman.''"

    '
  modern: '… Thus Dhṛtarāṣṭra the wise had a hundred sons, all heroes and mighty chariot-fighters, and a daughter besides the hundred, and another son, Yuyutsu, of great energy and prowess, born to a Vaiśya woman.

    '
adi-1-131-17:
  ganguli: 1 CXVII
  text: 'And, O, king, worthy wives were in time selected for all of them by Dhritarashtra after proper examination.

    '
  modern: 'And, O king, in time Dhṛtarāṣṭra chose suitable wives for all of them, after proper examination.

    '
adi-1-131-18:
  ganguli: 1 CXVII
  text: 'And king Dhritarashtra, O monarch, also bestowed Duhsala, in proper time and with proper rites, upon Jayadratha (the king of Sindhu).

    '
  modern: 'And King Dhṛtarāṣṭra, O monarch, gave Duḥśalā in due time and with due rites to Jayadratha, the king of Sindhu.

    '
adi-1-132-1:
  ganguli: 1 CXXIII
  text: 'After the birth of Vrikodara, Pandu again began to think, ''How am I to obtain a very superior son who shall achieve world-wide fame?

    '
  modern: 'After Vṛkodara''s birth, Pāṇḍu began to think again: "How can I obtain a far better son, one who will win fame throughout the world?

    '
adi-1-132-6:
  ganguli: 1 CXXIII
  text: 'After this, the Kuru king Pandu, taking counsel with the great Rishis commanded Kunti to observe an auspicious vow for one full year, …

    '
  modern: 'After this, the Kuru king Pāṇḍu took counsel with the great ṛṣis and commanded Kuntī to keep an auspicious vow for one full year. …

    '
adi-1-132-16:
  ganguli: 1 CXXIII
  speaker: Vaisampayana continued
  text: 'The celebrated Kunti, thus addressed by her lord, invoked Sakra (the king of the gods) who thereupon came unto her and begat him that was afterwards called Arjuna.

    '
  modern: 'The renowned Kuntī, thus addressed by her lord, invoked Śakra (the king of the gods), who came to her and fathered the child later called Arjuna.

    '
  speakerModern: 'Vaiśampāyana continued:'
adi-1-132-18:
  ganguli: 1 CXXIII
  text: 'And as soon as this child was born, an incorporeal voice, loud and deep as that of the clouds and filling the whole welkin, distinctly said, addressing Kunti in the hearing of every creature dwelling in that asylum, …

    '
  modern: 'As soon as this child was born, a voice without a body, loud and deep as a cloud and filling the whole sky, said clearly to Kuntī, in the hearing of every creature in that hermitage, …

    '
adi-1-132-20:
  ganguli: 1 CXXIII
  text: 'This child of thine, O Kunti, will be equal unto Kartavirya in energy and Siva in prowess. Invincible like Sakra himself he will spread thy fame far and wide.

    '
  modern: 'This child of yours, O Kuntī, will equal Kārtavīrya in energy and Śiva in prowess. Invincible like Śakra himself, he will spread your fame far and wide.

    '
adi-1-132-21:
  ganguli: 1 CXXIII
  text: 'As Vishnu (the youngest of Aditi''s sons) had enhanced Aditi''s joy, so shall this child enhance thy joy.

    '
  modern: 'As Viṣṇu (the youngest of Aditi''s sons) increased Aditi''s joy, so this child will increase yours.

    '
adi-1-133-9:
  ganguli: 1 CXXIV
  speaker: Vaisampayana continued
  text: 'After this, Pandu addressed Kunti in private, saying, ''O Kunti, grant me some more offspring for the expansion of my race and for the benefit of the world.

    '
  modern: 'After this, Pāṇḍu spoke to Kuntī in private: "O Kuntī, give me some more children, for the growth of my race and the benefit of the world.

    '
  speakerModern: 'Vaiśampāyana continued:'
adi-1-133-16:
  ganguli: 1 CXXIV
  text: 'Thus addressed by her lord, Kunti readily yielded, and said unto Madri, ''Think thou, without loss of time, of some celestial, and thou shall certainly obtain from him a child like unto him.

    '
  modern: 'Thus addressed by her lord, Kuntī readily agreed and said to Mādrī, "Think at once of some celestial, and you will surely get from him a child like himself.

    '
adi-1-133-18:
  ganguli: 1 CXXIV
  text: 'Reflecting for a few moments. Madri thought of the twin Aswins, who coming unto her with speed begat upon her two sons that were twins named Nakula and Sahadeva, unrivalled on earth for personal beauty.

    '
  modern: 'Mādrī reflected for a few moments. She thought of the twin Aśvins, who came to her quickly and fathered two sons, the twins Nakula and Sahadeva, unrivaled on earth for beauty.

    '
adi-1-133-19:
  ganguli: 1 CXXIV
  text: 'And as soon as they were born, an incorporeal voice said, …

    '
  modern: 'As soon as they were born, a voice without a body said, …

    '
adi-1-133-20:
  ganguli: 1 CXXIV
  text: 'In energy and beauty these twins shall transcend even the twin Aswins themselves. Indeed possessed of great energy and beauty, they illumined the whole region.

    '
  modern: 'In energy and beauty these twins will surpass even the twin Aśvins themselves. And they had great energy and beauty, and they lit up the whole region.

    '
adi-1-133-58:
  ganguli: 1 CXXIV
  text: 'And the five Pandavas and the hundred sons of Dhritarashtra--that propagator of the Kuru race--grew up rapidly like a cluster of lotuses in a lake.

    '
  modern: 'And the five Pāṇḍavas and the hundred sons of Dhṛtarāṣṭra, that propagator of the Kuru race, grew up quickly, like a cluster of lotuses in a lake.

    '
adi-1-134-15:
  ganguli: 1 CXXV
  text: 'One day in the season of spring which maddens every creature the king accompanied by his wife (Madri), began to rove in the woods where every tree had put forth new blossoms.

    '
  modern: 'One day, in the spring season that maddens every creature, the king and his wife Mādrī began to roam the woods, where every tree had put out new blossoms.

    '
adi-1-134-18:
  ganguli: 1 CXXV
  text: 'Roving like a celestial with a light heart amidst such scenery, Pandu was alone with his wife Madri in semi-transparent attire.

    '
  modern: 'Roaming like a celestial with a light heart amid such scenery, Pāṇḍu was alone with his wife Mādrī, who wore a thin, nearly transparent garment.

    '
adi-1-134-22:
  ganguli: 1 CXXV
  text: 'The king then seized her against her will, but Madri trembling in fear resisted him to the best of her might.

    '
  modern: 'The king then seized her against her will, but Mādrī, trembling in fear, resisted him with all her strength.

    '
adi-1-134-26:
  ganguli: 1 CXXV
  text: 'And the Kuru king Pandu, of virtuous soul, thus succumbed to the inevitable influence of Time, while united in intercourse with his wife.

    '
  modern: 'And the Kuru king Pāṇḍu, of virtuous soul, thus yielded to the inevitable power of Time, while he was united with his wife.

    '
adi-1-134-29:
  ganguli: 1 CXXV
  text: 'Then, O king, Madri addressing Kunti in a piteous voice, said, ''Come hither alone, O Kunti, and let the children stay there.

    '
  modern: 'Then, O king, Mādrī called to Kuntī in a piteous voice, "Come here alone, O Kuntī, and let the children stay there.

    '
adi-1-134-90:
  ganguli: 1 CXXV
  text: 'O revered one, if I survive thee, it is certain I shall not be able to rear thy children as if they were mine.

    '
  modern: 'O revered one, if I survive you, I am sure I will not be able to raise your children as if they were mine.

    '
adi-1-134-91:
  ganguli: 1 CXXV
  text: 'My appetite hath not been appeased. Thou art my older sister, O let me have thy sanction. This foremost one of the Bharata princes had approached me, desiring to have intercourse. His appetite unsatiated, shall I not follow him in the region of Yama to gratify him?

    '
  modern: 'My desire has not been satisfied. You are my older sister; please let me have your leave. This foremost one of the Bharata princes came to me wanting to be with me. His desire unsatisfied, shall I not follow him to the region of Yama to satisfy him?

    '
adi-1-134-110:
  ganguli: 1 CXXV
  speaker: Vaisampayana continued
  text: 'Having said this, the daughter of the king of Madras, the wedded wife of Pandu, ascended the funeral pyre of her lord, that bull among men.

    '
  modern: 'Having said this, the daughter of the king of Madra, Pāṇḍu''s wedded wife, climbed onto the funeral pyre of her lord, that bull among men.

    '
  speakerModern: 'Vaiśampāyana continued:'
adi-1-134-111:
  ganguli: 1 CXXV
  text: '(with adi-1-134-110)

    '
adi-1-135-1:
  ganguli: 1 CXXVI
  speaker: Vaisampayana said
  text: 'The godlike Rishis, wise in counsels, beholding the death of Pandu, consulted with one another, and said, …

    '
  modern: 'The godlike ṛṣis, wise in counsel, saw that Pāṇḍu was dead, and they consulted together. They said, …

    '
  speakerModern: 'Vaiśampāyana said:'
adi-1-135-6:
  ganguli: 1 CXXVI
  speaker: Vaisampayana continued
  text: 'Then those godlike Rishis of magnanimous hearts, and crowned with ascetic success, summoning one another, resolved to go to Hastinapura with Pandu''s children ahead, desiring to place them in the hands of Bhishma and Dhritarashtra. …

    '
  modern: 'Then those godlike ṛṣis of noble hearts, perfected through austerity, called to one another and resolved to go to Hāstinapura with Pāṇḍu''s children in front, wishing to place them in the hands of Bhīṣma and Dhṛtarāṣṭra. …

    '
  speakerModern: 'Vaiśampāyana continued:'
adi-1-137-1:
  ganguli: 1 CXXVIII
  speaker: Vaisampayana said
  text: 'Then Bhishma and Kunti with their friends celebrated the Sraddha of the deceased monarch, and offered the Pinda.

    '
  modern: 'Then Bhīṣma and Kuntī, with their friends, performed the śrāddha of the dead king and offered the piṇḍa.

    '
  speakerModern: 'Vaiśampāyana said:'
adi-1-137-14:
  ganguli: 1 CXXVIII
  speaker: Vaisampayana continued
  text: 'Then the sons of king Pandu, having gone through all the purifying rites prescribed in the Vedas, began to grow up in princely style in the home of their father.

    '
  modern: 'Then the sons of King Pāṇḍu, having gone through all the purifying rites the Vedas prescribe, began to grow up in princely style in their father''s house.

    '
  speakerModern: 'Vaiśampāyana continued:'
adi-1-137-15:
  ganguli: 1 CXXVIII
  text: 'Whenever they were engaged in play with the sons of Dhritarashtra, their superiority of strength became marked.

    '
  modern: 'Whenever they played with Dhṛtarāṣṭra''s sons, their superior strength was plain to see.

    '
adi-1-137-18:
  ganguli: 1 CXXVIII
  text: 'And Vrikodara easily defeated those hundred and one children of great energy as if they were one instead of being a hundred and one.

    '
  modern: 'And Vṛkodara easily defeated those hundred and one children of great energy as if they were one instead of a hundred and one.

    '
adi-1-137-26:
  ganguli: 1 CXXVIII
  text: 'Seeing these wonderful exhibitions of the might of Bhima, the powerful Duryodhana, the eldest son of Dhritarashtra, began to conceive hostility towards him. And the wicked and unrighteous Duryodhana, through ignorance and ambition, prepared himself for an act of sin.

    '
  modern: 'Seeing these wonderful displays of Bhīma''s might, the powerful Duryodhana, Dhṛtarāṣṭra''s eldest son, began to feel hostile toward him. And the wicked and unrighteous Duryodhana, through ignorance and ambition, prepared to commit a sin.

    '
adi-1-137-31:
  ganguli: 1 CXXVIII
  text: '… Afterwards, confining his eldest brother Yudhishthira and his younger brother Arjuna, I shall reign sole king without molestation. Determined thus, the wicked Duryodhana was ever on the watch to find out an opportunity for injuring Bhima.

    '
  modern: '… Then I shall imprison his elder brother Yudhiṣṭhira and his younger brother Arjuna, and rule as sole king without trouble." Having decided this, the wicked Duryodhana was always on the watch for a chance to harm Bhīma.

    '
adi-1-137-40:
  ganguli: 1 CXXVIII
  text: 'Seeing this Duryodhana bound him with chords of shrubs, and threw him into the water. …

    '
  modern: 'Seeing this, Duryodhana bound him with cords of shrubs and threw him into the water. …

    '
adi-1-137-41:
  ganguli: 1 CXXVIII
  text: 'On regaining consciousness, the son of Kunti burst his bands and began to press the snakes down under the ground.

    '
  modern: 'When he regained consciousness, the son of Kuntī burst his bonds and began to press the snakes down into the ground.

    '
adi-1-137-43:
  ganguli: 1 CXXVIII
  text: 'Nagas, furnished with fangs containing virulent venom, bit him by thousands.

    '
  modern: 'The Nāgas, with fangs full of virulent venom, bit him by thousands.

    '
adi-1-137-45:
  ganguli: 1 CXXVIII
  text: '(with adi-1-137-41)

    '
adi-1-137-46:
  ganguli: 1 CXXIX
  text: 'Some time after, Duryodhana again mixed in the food of Bhima a poison that was fresh, virulent, and very deadly.

    '
  modern: 'Some time after, Duryodhana again mixed into Bhīma''s food a poison that was fresh, virulent, and deadly.

    '
adi-1-137-47:
  ganguli: 1 CXXIX
  text: '(with adi-1-137-46)

    '
adi-1-137-48:
  ganguli: 1 CXXIX
  text: '… Vrikodara, however, swallowed it without any hesitation, and digested it completely. And, though virulent the poison produced no effects on Bhima.

    '
  modern: '… Vṛkodara swallowed it without hesitating and digested it completely. And though the poison was virulent, it had no effect on Bhīma.

    '
adi-1-137-52:
  ganguli: 1 CXXIX
  text: 'But Yuyutsu (Dhritarashtra''s son by a Vaisya wife), moved by his friendship for the Pandavas, informed them of this. … And though every one of these contrivances was fully known to the Pandavas, yet in accordance with the advice of Vidura they suppressed their indignation.

    '
  modern: 'But Yuyutsu (Dhṛtarāṣṭra''s son by a Vaiśya wife), out of friendship for the Pāṇḍavas, told them of this. … And although the Pāṇḍavas knew every one of these schemes, they held back their anger, following Vidura''s advice.

    '
adi-1-142-18:
  ganguli: 1 CXXXIV
  text: 'Then Drona endued with great prowess taught the sons of Pandu (the use of) many weapons both celestial and human.

    '
  modern: 'Then the mighty Droṇa taught the sons of Pāṇḍu the use of many weapons, both celestial and human.

    '
adi-1-142-19:
  ganguli: 1 CXXXIV
  text: 'And, O bull of the Bharata race, many other princes also flocked to that best of Brahmanas for instruction in arms.

    '
  modern: 'And, O bull of the Bharata race, many other princes also came to that best of Brāhmaṇas to learn the use of arms.

    '
adi-1-142-21:
  ganguli: 1 CXXXIV
  text: 'But of them all, the Suta child Karna, from jealousy, frequently defied Arjuna, and supported by Duryodhana, used to disregard the Pandavas.

    '
  modern: 'But of them all, the Sūta''s son Karṇa, out of jealousy, often challenged Arjuna, and with Duryodhana''s support he used to scorn the Pāṇḍavas.

    '
adi-1-142-22:
  ganguli: 1 CXXXIV
  text: 'Arjuna, however, from devotion to the science of arms, always stayed by the side of his preceptor, and in skill, strength of arms, and perseverance, excelled all (his class-fellows).

    '
  modern: 'Arjuna, however, devoted to the science of arms, always stayed by his teacher''s side, and in skill, strength of arm, and perseverance he surpassed all his classmates.

    '
adi-1-142-24:
  ganguli: 1 CXXXIV
  text: 'Indeed, although the instruction the preceptor gave, was the same in the case of all, yet in lightness and skill Arjuna became the foremost of all his fellow-pupils. And Drona was convinced that none of his pupils would (at any time) be able to be equal to that son of Indra.

    '
  modern: 'Although the teacher gave the same instruction to all, in lightness of hand and skill Arjuna became the foremost of his fellow pupils. And Droṇa was convinced that none of his pupils would ever equal that son of Indra.

    '
adi-1-142-29:
  ganguli: 1 CXXXIV
  text: 'Arjuna''s devotion to the service of his preceptor as also to arms was very great and he soon became the favourite of his preceptor.

    '
  modern: 'Arjuna''s devotion to his teacher and to arms was very great, and he soon became his teacher''s favorite.

    '
adi-1-142-30:
  ganguli: 1 CXXXIV
  text: 'And Drona, beholding his pupil''s devotion to arms, …

    '
  modern: 'And Droṇa, seeing his pupil''s devotion to arms, …

    '
adi-1-143-27:
  ganguli: 1 CXXXIV
  text: 'And, O Bharata, Drona, hearing the twang of his bowstring in the night, came to him, and clasping him, said, ''Truly do I tell thee that I shall do that unto thee by which there shall not be an archer equal to thee in this world.''

    '
  modern: 'And, O Bharata, Droṇa heard the twang of his bowstring in the night, came to him, and embraced him, saying, "I tell you truly that I will make you such that there will be no archer in this world equal to you."

    '
adi-1-144-1:
  ganguli: 1 CXXXVI
  speaker: Vaisampayana said
  text: 'O thou of Bharata''s race, beholding the sons of Dhritarashtra and Pandu accomplished in arms, Drona, O monarch, addressed king Dhritarashtra, in the presence of Kripa, Somadatta, Valhika, the wise son of Ganga (Bhishma), Vyasa, and Vidura, and said, …

    '
  modern: 'O descendant of Bharata, Droṇa saw that the sons of Dhṛtarāṣṭra and of Pāṇḍu were accomplished in arms. In the presence of Kṛpa, Somadatta, Bāhlīka, the wise son of Gaṅgā (Bhīṣma), Vyāsa, and Vidura, he addressed King Dhṛtarāṣṭra: …

    '
  speakerModern: 'Vaiśampāyana said:'
adi-1-144-3:
  ganguli: 1 CXXXVI
  text: 'O best of Kuru kings, thy children have completed their education. With thy permission, O king, let them now show their proficiency.

    '
  modern: 'O best of Kuru kings, your children have completed their education. With your permission, O king, let them now show what they have learned."

    '
adi-1-144-8:
  ganguli: 1 CXXXVI
  text: 'And Drona endued with great wisdom, then measured out a piece of land that was void of trees and thickets and furnished with wells and springs.

    '
  modern: 'Then the wise Droṇa measured out a piece of land that was free of trees and thickets and had wells and springs.

    '
adi-1-144-10:
  ganguli: 1 CXXXVI
  text: 'And upon the spot of land so measured out, Drona, that first of eloquent men, selecting a lunar day when the star ascendant was auspicious, offered up sacrifice unto the gods in the presence of the citizens assembled by proclamation to witness the same.

    '
  modern: 'On the land so measured out, Droṇa, the first of eloquent men, chose a lunar day when the ruling star was auspicious. He made a sacrifice to the gods in the presence of the citizens, who had been called together by proclamation to watch.

    '
adi-1-144-11:
  ganguli: 1 CXXXVI
  text: 'And then, O bull among men, the artificers of the king built thereon a large and elegant stage according to the rules laid down in the scriptures, and it was furnished with all kinds of weapons. They also built another elegant hall for the lady-spectators.

    '
  modern: 'Then, O bull among men, the king''s craftsmen built on that spot a large and handsome stage, following the rules of the scriptures, and furnished it with all kinds of weapons. They also built another handsome hall for the women spectators.

    '
adi-1-144-13:
  ganguli: 1 CXXXVI
  text: 'When the day fixed for the Tournament came, the king accompanied by his ministers, with Bhishma and Kripa, the foremost of preceptors, walking ahead, came unto that theatre of almost celestial beauty constructed of pure gold, and decked with strings of pearls and stones of lapis lazuli.

    '
  modern: 'When the day fixed for the tournament came, the king with his ministers, preceded by Bhīṣma and Kṛpa, the foremost of teachers, came to that theater of almost heavenly beauty, built of pure gold and decked with strings of pearls and lapis lazuli.

    '
adi-1-144-16:
  ganguli: 1 CXXXVI
  text: '(with adi-1-144-13)

    '
adi-1-144-17:
  ganguli: 1 CXXXVI
  text: 'And, O first of victorious men, Gandhari blessed with great good fortune and Kunti, and the other ladies of the royal house-hold, in gorgeous attire and accompanied by their waiting women, joyfully ascended the platforms, like celestial ladies ascending the Sumeru mountain.

    '
  modern: 'And, O first of victorious men, the fortunate Gāndhārī and Kuntī and the other ladies of the royal household, in splendid dress and with their waiting women, gladly climbed onto the platforms, like celestial women climbing Mount Sumeru.

    '
adi-1-144-18:
  ganguli: 1 CXXXVI
  text: '… joyfully ascended the platforms, like celestial ladies ascending the Sumeru mountain. And the four orders including the Brahmanas and Kshatriyas, desirous of beholding the princes'' skill in arms, left the city and came running to the spot.

    '
  modern: '… gladly climbed onto the platforms, like celestial women climbing Mount Sumeru. And the four orders, including Brāhmaṇas and Kṣatriyas, wanting to see the princes'' skill in arms, left the city and came running to the spot.

    '
adi-1-144-20:
  ganguli: 1 CXXXVI
  text: '… And with the sounds of trumpets and drums and the noise of many voices, that vast concourse appeared like an agitated ocean.

    '
  modern: '… With the sound of trumpets and drums and the noise of many voices, that vast assembly looked like a troubled ocean.

    '
adi-1-144-21:
  ganguli: 1 CXXXVI
  text: 'At last, Drona accompanied by his son, dressed in white (attire), with a white sacred thread, white locks, white beard, white garlands, and white sandal-paste rubbed over his body, entered the lists.

    '
  modern: 'At last Droṇa, with his son, entered the lists dressed in white, with a white sacred thread, white hair, white beard, white garlands, and white sandal paste on his body.

    '
adi-1-144-22:
  ganguli: 1 CXXXVI
  text: 'At last, Drona accompanied by his son, … entered the lists. It seemed as if the Moon himself accompanied by the planet Mars appeared in an unclouded sky.

    '
  modern: 'At last Droṇa, with his son, … entered the lists. It seemed as if the Moon himself, with the planet Mars, had appeared in a cloudless sky.

    '
adi-1-144-26:
  ganguli: 1 CXXXVI
  text: 'And then having girded up their loins, those mighty warriors, those foremost ones of Bharata''s race (the princes) entered, furnished with finger-protectors (gauntlet), and bows, and quivers.

    '
  modern: 'Then those mighty warriors, the foremost of Bharata''s race, the princes, girded up their loins and entered, equipped with finger guards, bows, and quivers.

    '
adi-1-144-32:
  ganguli: 1 CXXXVI
  text: '… And seeing the prowess of the princes armed with bows and arrows, the spectators thought that they were beholding the city of the Gandharvas, became filled with amazement.

    '
  modern: '… Seeing the prowess of the princes armed with bows and arrows, the spectators thought they were looking at the city of the Gandharvas, and were filled with amazement.

    '
adi-1-144-33:
  ganguli: 1 CXXXVI
  text: 'And with Yudhishthira at their head, the valiant princes entered in order of age and began to show wonderful skill with their weapons.

    '
  modern: 'With Yudhiṣṭhira at their head, the brave princes entered in order of age and began to show wonderful skill with their weapons.

    '
adi-1-144-42:
  ganguli: 1 CXXXVI
  text: 'And having repeatedly displayed their skill and dexterity in the use of bows and arrows and in the management of cars, the mighty warriors took up their swords and bucklers, and began to range the lists, playing their weapons. The spectators saw (with wonder) their agility, the symmetry of their bodies, their grace, their calmness, the firmness of their grasp and their deftness in the use of sword and buckler.

    '
  modern: 'After showing their skill and dexterity again and again with bows and arrows and in handling chariots, the mighty warriors took up swords and shields and began to range the lists, playing with their weapons. The spectators saw with wonder their agility, the symmetry of their bodies, their grace, their calm, the firmness of their grip, and their skill with sword and shield.

    '
adi-1-144-43:
  ganguli: 1 CXXXVI
  text: 'Then Vrikodara and Suyodhana, internally delighted (at the prospect of fight), entered the arena, mace in hand, like two single-peaked mountains.

    '
  modern: 'Then Vṛkodara and Suyodhana, inwardly delighted at the prospect of a fight, entered the arena with maces in hand, like two single-peaked mountains.

    '
adi-1-144-45:
  ganguli: 1 CXXXVI
  text: '… like two infuriated elephants those mighty heroes faultlessly (in consonance with the dictates of the science of arm) careered right and left, circling the lists.

    '
  modern: '… like two furious elephants they circled the lists, right and left, flawlessly, according to the science of arms.

    '
adi-1-145-1:
  ganguli: 1 CXXXVII
  speaker: Vaisampayana continued
  text: 'Upon the Kuru king and Bhima, the foremost of all endued with strength, having entered the arena, the spectators were divided into two parties in consequence of the partiality swaying their affections.

    '
  modern: 'When the Kuru king and Bhīma, the foremost of the strong, had entered the arena, the spectators were divided into two parties by their partiality.

    '
  speakerModern: 'Vaiśampāyana continued:'
adi-1-145-2:
  ganguli: 1 CXXXVII
  speaker: Some cried
  text: 'Behold the heroic king of the Kurus!''--some--''Behold Bhima!''--And on account of these cries, there was, all on a sudden, a loud uproar.

    '
  modern: 'Behold the heroic king of the Kurus!" Others cried, "Behold Bhīma!" And with these cries a loud uproar suddenly arose.

    '
  speakerModern: 'Some cried:'
adi-1-145-6:
  ganguli: 1 CXXXVII
  speaker: Vaisampayana continued
  text: 'Then the son of the preceptor of the princes restrained those combatants with their maces uplifted and resembling two swollen oceans agitated by the winds that blow at the universal dissolution.

    '
  modern: 'Then the teacher''s son restrained those two fighters, who had raised their maces and looked like two swollen oceans stirred by the winds of the universal dissolution.

    '
  speakerModern: 'Vaiśampāyana continued:'
adi-1-145-7:
  ganguli: 1 CXXXVII
  text: 'And Drona himself entering the yard of the arena commanded the musicians to stop, and with a voice deep as that of the clouds addressed these words, ''Behold ye now that Partha who is dearer to me than my own son, the master of all arms, the son of Indra himself, and like unto the younger brother of Indra, (Vishnu)!

    '
  modern: 'And Droṇa himself entered the yard of the arena and commanded the musicians to stop. In a voice deep as a cloud''s he said, "Behold now that Pārtha who is dearer to me than my own son, the master of all arms, the son of Indra himself, and like the younger brother of Indra (Viṣṇu)!

    '
adi-1-145-8:
  ganguli: 1 CXXXVII
  text: '(with adi-1-145-7)

    '
adi-1-145-9:
  ganguli: 1 CXXXVII
  text: 'And having performed the propitiatory rites, the youthful Phalguna, equipped with the finger protector (gauntlet) and his quiver full of shafts and bow in hand, donning his golden mail, appeared in the lists even like an evening cloud reflecting the rays of the setting sun and illumined by the hues of the rainbow and flashes of lightning.

    '
  modern: 'Then, having performed the auspicious rites, the youthful Phālguna, with his gauntlet, his quiver full of arrows, and his bow in hand, wearing his golden mail, appeared in the lists like an evening cloud that catches the rays of the setting sun and is lit by the colors of the rainbow and flashes of lightning.

    '
adi-1-145-10:
  ganguli: 1 CXXXVII
  text: '(with adi-1-145-9)

    '
adi-1-145-11:
  ganguli: 1 CXXXVII
  text: 'On seeing Arjuna, the whole assembly were delighted and conchs began to be blown all around with other musical instruments.

    '
  modern: 'On seeing Arjuna, the whole assembly was delighted, and conch shells began to blow all around, along with other musical instruments.

    '
adi-1-145-12:
  ganguli: 1 CXXXVII
  text: 'And there arose a great uproar in consequence of the spectators'' exclaiming,--''This is the graceful son of Kunti!''--''This is the middle (third) Pandava!''--''This is the son of the mighty Indra!''--''This is the protector of the Kurus''--''This is the foremost of those versed in arms!''--''This is the foremost of all cherishers of virtue!''--''This is the foremost of the persons of correct behaviour, the great repository of the knowledge of manners!

    '
  modern: 'And a great uproar arose as the spectators cried out: "This is the graceful son of Kuntī!" "This is the middle Pāṇḍava!" "This is the son of mighty Indra!" "This is the protector of the Kurus!" "This is the foremost of those who know arms!" "This is the foremost of those who uphold virtue!" "This is the foremost of those of correct behavior, the great store of knowledge of manners!"

    '
adi-1-145-13:
  ganguli: 1 CXXXVII
  text: '(with adi-1-145-12)

    '
adi-1-145-14:
  ganguli: 1 CXXXVII
  text: 'At those exclamations, the tears of Kunti, mixing with the milk of her breast, wetted her bosom.

    '
  modern: 'At those cries, Kuntī''s tears, mixed with the milk of her breast, wetted her bosom.

    '
adi-1-145-19:
  ganguli: 1 CXXXVII
  speaker: Vaisampayana continued
  text: 'When the spectators, excited with delight, had somewhat regained their equanimity, Vibhatsu began to display his lightness in the use of weapons.

    '
  modern: 'When the delighted spectators had somewhat calmed down, Bībhatsu began to display his lightness of hand with weapons.

    '
  speakerModern: 'Vaiśampāyana continued:'
adi-1-145-27:
  ganguli: 1 CXXXVII
  text: 'And, O Bharata, when the exhibition had well-nigh ended, the excitement of the spectators had cooled, and the sounds of instruments had died out there was heard proceeding from the gate, the slapping of arms, betokening might and strength, and even like unto the roar of the thunder.

    '
  modern: 'And, O Bharata, when the show was almost over, the spectators'' excitement had cooled, and the sound of instruments had died away, there came from the gate the slapping of arms that signals might and strength, like the roar of thunder.

    '
adi-1-146-1:
  ganguli: 1 CXXXVIII
  speaker: Vaisampayana continued
  text: 'When the spectators, with eyes expanded with wonder, made way for that subjugator of hostile cities, Karna, that hero with his natural mail and face brightened with ear-rings, took up his bow and girded on his sword, and then entered the spacious lists, like a walking cliff.

    '
  modern: 'The spectators, their eyes wide with wonder, made way for Karṇa, the conqueror of hostile cities. That hero, with his natural armor and his face brightened by earrings, took up his bow, girded on his sword, and entered the spacious lists like a walking cliff.

    '
  speakerModern: 'Vaiśampāyana continued:'
adi-1-146-2:
  ganguli: 1 CXXXVIII
  text: '(with adi-1-146-1)

    '
adi-1-146-6:
  ganguli: 1 CXXXVIII
  text: 'The mighty-armed warrior, eyeing all around the arena, bowed indifferently to Drona and Kripa.

    '
  modern: 'The mighty-armed warrior looked all around the arena and bowed indifferently to Droṇa and Kṛpa.

    '
adi-1-146-7:
  ganguli: 1 CXXXVIII
  text: 'And the entire assembly, motionless and with steadfast gaze, thought, ''Who is he? And they became agitated in their curiosity to know the warrior.

    '
  modern: 'And the whole assembly, motionless, gazing fixedly, thought, "Who is he?" They grew restless with curiosity to know the warrior.

    '
adi-1-146-8:
  ganguli: 1 CXXXVIII
  text: 'And that foremost of eloquent men, the offspring of the Sun, in a voice deep as that of the clouds, addressed his unknown brother, the son of the subduer of the Asura, Paka (Indra), saying, …

    '
  modern: 'And that foremost of eloquent men, the offspring of the Sun, in a voice deep as a cloud''s, spoke to his unknown brother, the son of the subduer of the Asura Pāka (Indra): …

    '
adi-1-146-9:
  ganguli: 1 CXXXVIII
  text: 'O Partha, I shall perform feats before this gazing multitude; excelling all thou hast performed! Beholding them, thou shall be amazed.

    '
  modern: 'O Pārtha, I shall perform feats before this watching multitude that excel all you have done! When you see them, you will be amazed."

    '
adi-1-146-10:
  ganguli: 1 CXXXVIII
  text: 'And, O thou best of those blest with speech, he had hardly done when the spectators stood up all at once, uplifted by some instrument, as it were.

    '
  modern: 'And, O best of those gifted with speech, he had barely finished when the spectators all stood up at once, as if lifted by some machine.

    '
adi-1-146-11:
  ganguli: 1 CXXXVIII
  text: 'And, O tiger among men, Duryodhana was filled with delight, while Vibhatsu was instantly all abashment and anger.

    '
  modern: 'And, O tiger among men, Duryodhana was filled with delight, while Bībhatsu was at once full of shame and anger.

    '
adi-1-146-12:
  ganguli: 1 CXXXVIII
  text: 'Then with the permission of Drona, the mighty Karna, delighting in battle, there did all that Partha had done before.

    '
  modern: 'Then, with Droṇa''s permission, the mighty Karṇa, who delighted in battle, did all that Pārtha had done before.

    '
adi-1-146-13:
  ganguli: 1 CXXXVIII
  text: 'And, O Bharata, Duryodhana with his brothers thereupon embraced Karna in joy and then addressed him saying, …

    '
  modern: 'And, O Bharata, Duryodhana and his brothers joyfully embraced Karṇa and said to him, …

    '
adi-1-146-14:
  ganguli: 1 CXXXVIII
  text: 'Welcome O mighty-armed warrior! I have obtained thee by good fortune, O polite one! Live thou as thou pleasest, and command me, and the kingdom of the Kurus.

    '
  modern: 'Welcome, O mighty-armed warrior! I have found you by good fortune, O courteous one! Live as you please, and command me and the kingdom of the Kurus."

    '
adi-1-146-17:
  ganguli: 1 CXXXVIII
  speaker: Duryodhana said
  text: 'Do thou with me enjoy the good things of life! Be thou the benefactor of thy friend, and, O represser of enemies, place thou thy feet on the heads of all foes.

    '
  modern: 'Enjoy the good things of life with me! Be the benefactor of your friend, and, O repressor of enemies, put your feet on the heads of all our foes."

    '
  speakerModern: 'Duryodhana said:'
adi-1-146-18:
  ganguli: 1 CXXXVIII
  text: 'Vaisampayanacontinued, ''Arjuna, after this, deeming himself disgraced, said unto Karna stationed amidst the brothers like unto a cliff, ''That path which the unwelcome intruder and the uninvited talker cometh to, shall be thine, O Karna, for thou shall be slain by me.

    '
  modern: 'Arjuna, after this, felt disgraced and said to Karṇa, who stood among the brothers like a cliff, "The path that an unwelcome intruder and an uninvited talker comes to will be yours, O Karṇa, for I shall kill you.

    '
adi-1-146-19:
  ganguli: 1 CXXXVIII
  text: '(with adi-1-146-18)

    '
adi-1-146-22:
  ganguli: 1 CXXXVIII
  speaker: Vaisampayana continued
  text: 'Hastily embraced by his brothers, Partha that subduer of hostile cities, with the permission of Drona, advanced for the combat.

    '
  modern: 'Quickly embraced by his brothers, Pārtha, conqueror of hostile cities, advanced for the fight with Droṇa''s permission.

    '
  speakerModern: 'Vaiśampāyana continued:'
adi-1-146-23:
  ganguli: 1 CXXXVIII
  text: 'On the other side, Karna, having been embraced by Duryodhana with his brothers, taking up his bow and arrows, stood ready for the fight.

    '
  modern: 'On the other side, Karṇa, embraced by Duryodhana and his brothers, took up his bow and arrows and stood ready to fight.

    '
adi-1-146-27:
  ganguli: 1 CXXXVIII
  text: 'And the son of Dhritarashtra stood by Karna, and Bharadwaja and Kripa and Bhishma remained with Partha.

    '
  modern: 'And the son of Dhṛtarāṣṭra stood by Karṇa, while Bhāradvāja, Kṛpa, and Bhīṣma stood with Pārtha.

    '
adi-1-146-28:
  ganguli: 1 CXXXVIII
  text: 'And the assembly was divided, as also the female spectators. And knowing the state of things, Kunti the daughter of Bhoja, swooned away.

    '
  modern: 'The assembly was divided, and so were the women spectators. And knowing how things stood, Kuntī, the daughter of Bhoja, fainted.

    '
adi-1-146-31:
  ganguli: 1 CXXXVIII
  text: 'And beholding both the warriors with bows strung in their hands the son of Saradwat, viz., Kripa, knowing all duties and cognisant of the rules regulating duels, addressed Karna, saying ''This Pandava, who is the youngest son of Kunti, belongeth to the Kaurava race: he will engage in combat with thee.

    '
  modern: 'Seeing both warriors with their bows strung in their hands, Kṛpa, the son of Śaradvat, who knew all the duties and the rules for duels, addressed Karṇa: "This Pāṇḍava, the youngest son of Kuntī, belongs to the Kaurava race. He will fight you.

    '
adi-1-146-32:
  ganguli: 1 CXXXVIII
  text: '(with adi-1-146-31)

    '
adi-1-146-33:
  ganguli: 1 CXXXVIII
  text: 'But, O mighty-armed one, thou too must tell us thy lineage and the names of thy father and mother and the royal line of which thou art the ornament.

    '
  modern: 'But you too, O mighty-armed one, must tell us your lineage and the names of your father and mother and the royal line whose ornament you are.

    '
adi-1-146-34:
  ganguli: 1 CXXXVIII
  text: 'Learning all this, Partha will fight with thee or not (as he will think fit). Sons of kings never fight with men of inglorious lineage.

    '
  modern: 'Learning all this, Pārtha will fight you or not, as he thinks fit. Sons of kings never fight with men of inglorious lineage."

    '
adi-1-146-39:
  ganguli: 1 CXXXVIII
  speaker: Vaisampayana said
  text: 'At that very moment, seated on a golden seat, with parched paddy and with flowers and water-pots and much gold, the mighty warrior Karna was installed king by Brahmanas versed in mantras.

    '
  modern: 'At that very moment, seated on a golden seat, with parched grain, flowers, water pots, and much gold, the mighty warrior Karṇa was installed as king by Brāhmaṇas learned in the mantras.

    '
  speakerModern: 'Vaiśampāyana said:'
adi-1-146-40:
  ganguli: 1 CXXXVIII
  text: '(with adi-1-146-39)

    '
adi-1-146-44:
  ganguli: 1 CXXXVIII
  text: 'And the cheers, having ceased, king (Karna) said unto the Kaurava Duryodhana, ''O tiger among monarchs, what shall I give unto thee that may compare with thy gift of a kingdom?

    '
  modern: 'When the cheers had ceased, King Karṇa said to Duryodhana the Kaurava, "O tiger among monarchs, what can I give you that would match your gift of a kingdom?

    '
adi-1-146-45:
  ganguli: 1 CXXXVIII
  text: 'O king, I will do all thou biddest! And Suyodhana said unto him, ''I eagerly wish for thy friendship.

    '
  modern: 'O king, I will do all you ask!" And Suyodhana said to him, "I eagerly wish for your friendship."

    '
adi-1-146-46:
  ganguli: 1 CXXXVIII
  text: 'Thus spoken to, Karna replied, ''Be it so. And they embraced each other in joy, and experienced great happiness.''

    '
  modern: 'Thus addressed, Karṇa replied, "So be it." And they embraced each other with joy and were very happy.

    '
adi-1-147-1:
  ganguli: 1 CXXXIX
  speaker: Vaisampayana said
  text: 'After this, with his sheet loosely hanging down, Adhiratha entered the lists, perspiring and trembling, and supporting himself on a staff.

    '
  modern: 'After this, Adhiratha entered the lists with his upper cloth hanging loose, sweating and trembling, and supporting himself on a staff.

    '
  speakerModern: 'Vaiśampāyana said:'
adi-1-147-2:
  ganguli: 1 CXXXIX
  text: 'Seeing him, Karna left his bow and impelled by filial regard bowed down his head still wet with the water of inauguration.

    '
  modern: 'Seeing him, Karṇa put down his bow and, out of respect for his father, bowed his head, still wet with the water of his consecration.

    '
adi-1-147-5:
  ganguli: 1 CXXXIX
  text: 'Seeing the charioteer, the Pandava Bhimasena took Karna for a charioteer''s son, and said by way of ridicule, …

    '
  modern: 'Seeing the charioteer, the Pāṇḍava Bhīmasena took Karṇa for a charioteer''s son and said mockingly, …

    '
adi-1-147-6:
  ganguli: 1 CXXXIX
  text: 'O son of a charioteer, thou dost not deserve death in fight at the hands of Partha. As befits thy race take thou anon the whip.

    '
  modern: 'O son of a charioteer, you do not deserve to die in battle at Pārtha''s hands. Take up the whip at once, as befits your family.

    '
adi-1-147-7:
  ganguli: 1 CXXXIX
  text: 'And, O worst of mortals, surely thou art not worthy to sway the kingdom of Anga, even as a dog doth not deserve the butter placed before the sacrificial fire.

    '
  modern: 'And, O worst of mortals, you are certainly not worthy to rule the kingdom of Aṅga, any more than a dog deserves the butter placed before the sacrificial fire."

    '
adi-1-147-9:
  ganguli: 1 CXXXIX
  text: 'And even as a mad elephant riseth from an assemblage of lotuses, the mighty Duryodhana rose in wrath from among his brothers, and addressed that performer of dreadful deeds, Bhimasena, present there, ''O Vrikodara, it behoveth thee not to speak such words.

    '
  modern: 'Like a mad elephant rising from a bed of lotuses, the mighty Duryodhana rose in anger from among his brothers and said to Bhīmasena, that doer of dreadful deeds, who stood there, "O Vṛkodara, it is not right for you to speak such words.

    '
adi-1-147-10:
  ganguli: 1 CXXXIX
  text: '(with adi-1-147-9)

    '
adi-1-147-11:
  ganguli: 1 CXXXIX
  text: 'Might is the cardinal virtue of a Kshatriya, and even a Kshatriya of inferior birth deserveth to be fought with. The lineage of heroes, like the sources of a lordly river, is ever unknown.

    '
  modern: 'Strength is the first virtue of a Kṣatriya, and even a Kṣatriya of low birth deserves to be fought. The lineage of heroes, like the sources of a mighty river, is always unknown.

    '
adi-1-147-16:
  ganguli: 1 CXXXIX
  text: 'Your own births, ye Pandava princes, are known to me. Can a she-deer bring forth a tiger (like Karna), of the splendour of the Sun, and endued with every auspicious mark, and born also with a natural mail and ear-rings?

    '
  modern: 'I know your own births too, you Pāṇḍava princes. Can a doe bring forth a tiger like Karṇa, with the splendor of the Sun, every auspicious mark, and a natural armor and earrings from birth?

    '
adi-1-147-17:
  ganguli: 1 CXXXIX
  text: 'This prince among men deserveth the sovereignty of the world, not of Anga only, in consequence of the might of his arm and my swearing to obey him in everything.

    '
  modern: 'This prince among men deserves the sovereignty of the world, not only of Aṅga, because of the might of his arm and because I have sworn to obey him in everything.

    '
adi-1-147-18:
  ganguli: 1 CXXXIX
  text: 'If there be anybody here to whom all that I have done unto Karna hath become intolerable, let him ascend his chariot and bend his bow with the help of his feet.

    '
  modern: 'If anyone here cannot bear what I have done for Karṇa, let him get into his chariot and bend his bow with the help of his feet."

    '
adi-1-147-19:
  ganguli: 1 CXXXIX
  speaker: Vaisampayana continued
  text: 'Then there arose a confused murmur amongst the spectators approving of Duryodhana''s speech. The sun, however, went down, but prince Duryodhana taking Karna''s hand led him out of the arena lighted with countless lamps.

    '
  modern: 'Then a confused murmur arose among the spectators, approving Duryodhana''s speech. But the sun went down, and Prince Duryodhana took Karṇa''s hand and led him out of the arena, lit by countless lamps.

    '
  speakerModern: 'Vaiśampāyana continued:'
adi-1-147-20:
  ganguli: 1 CXXXIX
  text: '(with adi-1-147-19)

    '
adi-1-147-21:
  ganguli: 1 CXXXIX
  text: 'And, O king, the Pandavas also, accompanied by Drona and Kripa and Bhishma, returned to their abodes.

    '
  modern: 'And, O king, the Pāṇḍavas also, with Droṇa, Kṛpa, and Bhīṣma, went back to their homes.

    '
adi-1-147-22:
  ganguli: 1 CXXXIX
  text: 'And the people, too, came away, some naming Arjuna, some Karna, and some Duryodhana (as the victor of the day).

    '
  modern: 'And the people too went away, some naming Arjuna, some Karṇa, and some Duryodhana as the victor of the day.

    '
adi-1-147-24:
  ganguli: 1 CXXXIX
  text: 'And Duryodhana, O monarch, having obtained Karna (in this way), banished his fears arising out of Arjuna''s proficiency in arms.

    '
  modern: 'And Duryodhana, O monarch, having won Karṇa in this way, lost his fear of Arjuna''s skill in arms.

    '
adi-1-151-1:
  ganguli: 1 CXLI
  speaker: Vaisampayana continued
  text: 'After the expiration, O king, of a year from this, Dhritarashtra, moved by kindness for the people, installed Yudhishthira, the son of Pandu, as the heir-apparent of the kingdom on account of his firmness, fortitude, patience, benevolence, frankness and unswerving honesty (of heart).

    '
  modern: 'After a year, O king, Dhṛtarāṣṭra, moved by kindness for the people, installed Yudhiṣṭhira, the son of Pāṇḍu, as heir apparent of the kingdom, because of his firmness, fortitude, patience, benevolence, frankness, and unswerving honesty of heart.

    '
  speakerModern: 'Vaiśampāyana continued:'
adi-1-151-3:
  ganguli: 1 CXLI
  text: '(with adi-1-151-1)

    '
adi-1-151-4:
  ganguli: 1 CXLI
  text: 'And within a short time Yudhishthira, the son of Kunti, by his good behaviour, manners and close application to business, overshadowed the deeds of his father.

    '
  modern: 'And within a short time Yudhiṣṭhira, the son of Kuntī, by his good behavior, manners, and close attention to business, overshadowed the deeds of his father.

    '
adi-1-151-39:
  ganguli: 1 CXLI
  text: '… And that bull among the Kuru princes thereupon pledged his word unto Drona and touching his feet, went away northward.

    '
  modern: '… And that bull among the Kuru princes gave his word to Droṇa, touched his feet, and went northward.

    '
adi-1-151-45:
  ganguli: 1 CXLI
  text: 'And the king of the Yavanas himself whom the powerful Pandu even had failed to bring under subjection was brought by Arjuna under control.

    '
  modern: 'And the king of the Yavanas, whom even the powerful Pāṇḍu had failed to subdue, was brought under control by Arjuna.

    '
adi-1-151-47:
  ganguli: 1 CXLI
  text: 'And Arjuna also repressed by means of his arrows (the pride of) king Sumitra of Sauvira, also known by the name of Dattamitra who had resolutely sought an encounter with him.

    '
  modern: 'Arjuna also checked with his arrows the pride of King Sumitra of Sauvīra, also called Dattāmitra, who had boldly sought a fight with him.

    '
adi-1-151-48:
  ganguli: 1 CXLI
  text: 'The third of the Pandava princes, assisted by Bhima, on only a single car subjugated all the kings of the East backed by ten thousand cars.

    '
  modern: 'The third of the Pāṇḍava princes, helped by Bhīma, conquered on a single chariot all the kings of the East, who had ten thousand chariots behind them.

    '
adi-1-151-49:
  ganguli: 1 CXLI
  text: 'In the same way, having conquered on a single car the whole of the south, Dhananjaya sent unto the kingdom of the Kurus a large booty.

    '
  modern: 'In the same way, after conquering the whole South on a single chariot, Dhanañjaya sent a large booty to the kingdom of the Kurus.

    '
adi-1-151-50:
  ganguli: 1 CXLI
  text: '(with adi-1-151-55)

    '
adi-1-151-54:
  ganguli: 1 CXLI
  text: 'Thus did those foremost of men, the illustrious Pandavas, conquering the territories of other kings, extend the limits of their own kingdom.

    '
  modern: 'Thus those foremost of men, the illustrious Pāṇḍavas, conquered the territories of other kings and extended the limits of their own kingdom.

    '
adi-1-151-55:
  ganguli: 1 CXLI
  text: 'But beholding the great prowess and strength of those mighty bowmen, king Dhritarashtra''s sentiments towards the Pandavas became suddenly poisoned, and from that day the monarch became so anxious that he could hardly sleep.

    '
  modern: 'But when King Dhṛtarāṣṭra saw the great prowess and strength of those mighty bowmen, his feelings toward the Pāṇḍavas were suddenly poisoned, and from that day he was so anxious that he could hardly sleep.

    '
adi-1-152-4:
  ganguli: 1 CXLIII
  text: 'Then the citizens, beholding the son of Pandu possessed of accomplishments, began, O Bharata, to speak of them in all places of public resort.

    '
  modern: 'Then the citizens, seeing the son of Pāṇḍu so accomplished, began, O Bharata, to speak of him in all places of public gathering.

    '
adi-1-152-5:
  ganguli: 1 CXLIII
  text: 'And assembled in courtyards and other places of gathering, they talked of the eldest son of Pandu (Yudhishthira) as possessed of the qualifications for ruling the kingdom.

    '
  modern: 'Gathered in courtyards and other meeting places, they spoke of Pāṇḍu''s eldest son, Yudhiṣṭhira, as having the qualities needed to rule the kingdom.

    '
adi-1-152-6:
  ganguli: 1 CXLIII
  speaker: And they said
  text: 'Dhritarashtra, though possessed of the eye of knowledge, having been (born) blind, had not obtained the kingdom before. How can he (therefore) become king now?

    '
  modern: 'Dhṛtarāṣṭra, though he has the eye of knowledge, was born blind and did not obtain the kingdom before. How can he become king now?

    '
  speakerModern: 'And they said:'
adi-1-152-7:
  ganguli: 1 CXLIII
  text: 'Then Bhishma, the son of Santanu, of rigid vows and devoted to truth, having formerly relinquished the sovereignty would never accept it now.

    '
  modern: 'Bhīṣma, the son of Śāntanu, of strict vows and devoted to truth, gave up the sovereignty long ago and will never accept it now.

    '
adi-1-152-8:
  ganguli: 1 CXLIII
  text: 'We shall, therefore, now install (on the throne) with proper ceremonies the eldest of the Pandavas endued with youth, accomplished in battle, versed in the Vedas, and truthful and kind.

    '
  modern: 'So now let us install with proper ceremony the eldest of the Pāṇḍavas: young, accomplished in battle, learned in the Vedas, truthful and kind.

    '
adi-1-152-10:
  ganguli: 1 CXLIII
  text: 'The wretched Duryodhana, hearing these words of the parting partisans of Yudhishthira, became very much distressed. Deeply afflicted, the wicked prince could not put up with those speeches.

    '
  modern: 'The wretched Duryodhana, hearing these words of the citizens who favored Yudhiṣṭhira, was greatly distressed. Deeply troubled, the wicked prince could not bear those speeches.

    '
adi-1-152-12:
  ganguli: 1 CXLIII
  text: 'Inflamed with jealousy, he went unto Dhritarashtra, and finding him alone he saluted him with reverence and distressed at (the sight of) the partiality of the citizens for Yudhishthira, he addressed the monarch and said, …

    '
  modern: 'Burning with jealousy, he went to Dhṛtarāṣṭra and, finding him alone, saluted him respectfully. Distressed at the citizens'' partiality for Yudhiṣṭhira, he said to the king, …

    '
adi-1-152-13:
  ganguli: 1 CXLIII
  text: 'O father, I have heard the parting citizens utter words of ill omen. Passing thee by, and Bhishma too, they desire the son of Pandu to be their king.

    '
  modern: 'O father, I have heard the citizens say ill-omened things. Passing you by, and Bhīṣma too, they want the son of Pāṇḍu to be their king.

    '
adi-1-152-14:
  ganguli: 1 CXLIII
  text: 'Bhishma will sanction this, for he will not rule the kingdom. It seems, therefore, that the citizens are endeavouring to inflict a great injury on us.

    '
  modern: 'Bhīṣma will agree to this, for he will not rule the kingdom. It seems, therefore, that the citizens are working to do us great harm.

    '
adi-1-152-15:
  ganguli: 1 CXLIII
  text: 'Pandu obtained of old the ancestral kingdom by virtue of his own accomplishments, but thou, from blindness, didst not obtain the kingdom, though fully qualified to have it.

    '
  modern: 'Pāṇḍu obtained the ancestral kingdom long ago through his own accomplishments, but you, because of your blindness, did not obtain it, though fully qualified.

    '
adi-1-152-16:
  ganguli: 1 CXLIII
  text: 'If Pandu''s son now obtaineth the kingdom as his inheritance from Pandu, his son will obtain it after him and that son''s son also, and so on will it descend in Pandu''s line.

    '
  modern: 'If Pāṇḍu''s son now obtains the kingdom as his inheritance from Pāṇḍu, his son will obtain it after him, and that son''s son after that, and so it will descend in Pāṇḍu''s line.

    '
adi-1-152-17:
  ganguli: 1 CXLIII
  text: 'In that case, O king of the world, ourselves with our children, excluded from the royal line, shall certainly be disregarded by all men.

    '
  modern: 'In that case, O king of the world, we and our children, shut out of the royal line, will certainly be disregarded by everyone.

    '
adi-1-152-18:
  ganguli: 1 CXLIII
  text: 'Therefore, O monarch, adopt such counsels that we may not suffer perpetual distress, becoming dependent on others for our food.

    '
  modern: 'Therefore, O monarch, adopt such a plan that we do not suffer constant distress, depending on others for our food.

    '
adi-1-152-19:
  ganguli: 1 CXLIII
  text: 'O king, if thou hadst obtained the sovereignty before, we would certainly have succeeded to it, however much the people might be unfavourable to us.

    '
  modern: 'O king, if you had obtained the sovereignty earlier, we would certainly have succeeded to it, however unfavorable the people might be to us."

    '
adi-1-152-20:
  ganguli: 1 CXLIV
  text: 'Dhritarashtra, on hearing these words uttered by his son, reflected for a moment and replied unto Duryodhana, saying, ''Pandu, ever devoted to virtue, always behaved dutifully towards all his relatives but particularly towards me.

    '
  modern: 'Dhṛtarāṣṭra, hearing these words from his son, thought for a moment and answered Duryodhana, "Pāṇḍu, ever devoted to virtue, always behaved dutifully toward all his relatives, but especially toward me.

    '
adi-1-152-21:
  ganguli: 1 CXLIV
  text: '(with adi-1-152-20)

    '
adi-1-152-23:
  ganguli: 1 CXLIV
  text: 'His son is as much devoted to virtue as he, and is possessed of every accomplishment. Of world-wide fame, he is again the favourite of the people.

    '
  modern: 'His son is as devoted to virtue as he was, and has every accomplishment. He is famous throughout the world, and he is the favorite of the people.

    '
adi-1-152-24:
  ganguli: 1 CXLIV
  text: 'He is possessed of allies; how can we by force exile him from his ancestral kingdom?

    '
  modern: 'He has allies. How can we exile him by force from his ancestral kingdom?

    '
adi-1-154-20:
  ganguli: 1 CXLIV
  text: 'Prince Duryodhana said unto Dhritarashtra, ''Send, O father, by some clever contrivance, the Pandavas to the town of Varanavata. We shall then have no fear of them.

    '
  modern: 'Duryodhana said to Dhṛtarāṣṭra, "Father, send the Pāṇḍavas by some clever means to the town of Vāraṇāvata. Then we will have no fear of them.

    '
adi-1-154-31:
  ganguli: 1 CXLIV
  text: 'Therefore, it behoveth thee now to banish, by some gentle means, the Pandavas to the town of Varanavata; O king, when the sovereignty shall have been vested in me, then, O Bharata, may Kunti with her children come back from that place.

    '
  modern: 'So please banish the Pāṇḍavas by some gentle means to the town of Vāraṇāvata. O king, when the sovereignty has been placed in my hands, then, O Bharata, Kuntī and her children may come back from that place."

    '
adi-1-155-1:
  ganguli: 1 CXLV
  text: 'Vaisampayana said, Then prince Duryodhana, along with his brothers began to gradually win over the people to his side by grants of wealth and honours.

    '
  modern: 'Then Prince Duryodhana and his brothers began gradually to win the people to his side by gifts of wealth and honors.

    '
adi-1-155-2:
  ganguli: 1 CXLV
  text: 'Meanwhile, some clever councillors, instructed by Dhritarashtra, one day began to describe (in court) the town of Varanavata as a charming place.

    '
  modern: 'Meanwhile some clever councillors, instructed by Dhṛtarāṣṭra, began one day to describe the town of Vāraṇāvata in court as a charming place.

    '
adi-1-155-5:
  ganguli: 1 CXLV
  text: 'Thus did those councillors, instructed by Dhritarashtra, speak of Varanavata, and whilst they were so speaking, the Pandavas, O king, felt the desire of going to that delightful town.

    '
  modern: 'Thus the councillors, instructed by Dhṛtarāṣṭra, spoke of Vāraṇāvata, and as they spoke, the Pāṇḍavas, O king, felt a desire to go to that delightful town.

    '
adi-1-155-6:
  ganguli: 1 CXLV
  text: 'And when the king (Dhritarashtra) ascertained that the curiosity of the Pandavas had been awakened, the son of Ambika addressed them, saying, …

    '
  modern: 'When the king saw that the Pāṇḍavas'' curiosity had been awakened, the son of Ambikā said to them, …

    '
adi-1-155-10:
  ganguli: 1 CXLV
  text: 'If therefore, ye children, ye desire to witness that festival, go to Varanavata with your followers and friends and enjoy yourselves there like the celestials.

    '
  modern: 'So, children, if you want to see that festival, go to Vāraṇāvata with your followers and friends and enjoy yourselves there like the celestials.

    '
adi-1-155-12:
  ganguli: 1 CXLV
  text: 'And sporting there for some time as ye please like the resplendent celestials and enjoying as much pleasure as ye like, return ye to Hastinapura again.

    '
  modern: 'After amusing yourselves there as you please for some time, and enjoying as much pleasure as you like, return to Hāstinapura."

    '
adi-1-155-14:
  ganguli: 1 CXLV
  speaker: Vaisampayana continued
  text: 'Yudhishthira, fully understanding the motives of Dhritarashtra and considering that he himself was weak and friendless, replied unto the king, saying, ''So be it.

    '
  modern: 'Yudhiṣṭhira understood Dhṛtarāṣṭra''s motives, and considering that he himself was weak and friendless, replied to the king, "So be it."

    '
  speakerModern: 'Vaiśampāyana continued:'
adi-1-156-1:
  ganguli: 1 CXLVI
  speaker: Vaisampayana said
  text: 'The wicked Duryodhana became very pleased when the king, O Bharata, had said so unto Pandavas.

    '
  modern: 'The wicked Duryodhana was very pleased when the king, O Bharata, had said this to the Pāṇḍavas.

    '
  speakerModern: 'Vaiśampāyana said:'
adi-1-156-3:
  ganguli: 1 CXLVI
  text: 'And, O bull of Bharata''s race, Duryodhana, then, summoning his counsellor, Purochana in private, took hold of his right hand and said, …

    '
  modern: 'And, O bull of Bharata''s race, Duryodhana summoned his counselor Purocana in private, took his right hand, and said, …

    '
adi-1-156-7:
  ganguli: 1 CXLVI
  text: 'The Pandavas have, by Dhritarashtra, been sent to Varanavata, where they will, at Dhritarashtra''s command, enjoy themselves during the festivities.

    '
  modern: 'The Pāṇḍavas have been sent to Vāraṇāvata by Dhṛtarāṣṭra, and there, at Dhṛtarāṣṭra''s command, they will enjoy themselves during the festivities.

    '
adi-1-156-9:
  ganguli: 1 CXLVI
  text: '… Repairing thither, cause thou to be erected a quadrangular palace in the neighbourhood of the arsenal, rich in the materials and furniture, and guard thou the mansion well (with prying eyes).

    '
  modern: '… Go there and have a four-hall palace built near the arsenal, rich in materials and furnishings, and guard the mansion well with watchful eyes.

    '
adi-1-156-12:
  ganguli: 1 CXLVI
  text: 'And use thou (in erecting that house) hemp and resin and all other inflammable materials that are procurable. … and scatter thou all around that house hemp and oil and clarified butter and lac and wood in such a way that the Pandavas, or any others, may not, even with scrutiny behold them there or conclude the house to be an inflammable one. …

    '
  modern: 'Use hemp, resin, and all the other inflammable materials you can get in building that house. … Scatter hemp, oil, clarified butter, lac, and wood all around the house, in such a way that the Pāṇḍavas, or anyone else, however closely they look, will not see them there or conclude that the house is inflammable. …

    '
adi-1-156-15:
  ganguli: 1 CXLVI
  text: 'And having erected such mansion, cause thou the Pandavas, after worshipping them with great reverence, to dwell in it with Kunti and all their friends.

    '
  modern: 'When you have built such a mansion, honor the Pāṇḍavas greatly and have them live in it with Kuntī and all their friends.

    '
adi-1-156-16:
  ganguli: 1 CXLVI
  text: 'And place thou there seats and conveyances and beds, all of the best workmanship, for the Pandavas, so that Dhritarashtra may have no reason to complain.

    '
  modern: 'Put seats, vehicles, and beds of the best workmanship there for the Pāṇḍavas, so that Dhṛtarāṣṭra will have no reason to complain.

    '
adi-1-156-18:
  ganguli: 1 CXLVI
  text: 'And assuring thyself that the Pandavas are sleeping within in confidence and without fear, thou must then set fire to that mansion beginning at the outer door.

    '
  modern: 'And when you are sure the Pāṇḍavas are sleeping inside, trusting and unafraid, set fire to the mansion, starting at the outer door.

    '
adi-1-156-20:
  ganguli: 1 CXLVI
  text: 'Saying, ''So be it'' unto the Kuru prince, Purochana repaired to Varanavata in a car drawn by fleet mules.

    '
  modern: 'Saying "So be it" to the Kuru prince, Purocana went to Vāraṇāvata in a car drawn by fast mules.

    '
adi-1-157-3:
  ganguli: 1 CXLVII
  text: 'Then saluting with reverence all the older men, and embracing their equals, receiving the farewell of even the children, and taking leave of all the venerable ladies in their household, and walking round them respectfully, and bidding farewell unto all the citizens, the Pandavas, ever mindful of their vows, set out for Varanavata.

    '
  modern: 'Then the Pāṇḍavas, always mindful of their vows, respectfully saluted all the older men, embraced their equals, received the farewells even of the children, took leave of all the venerable ladies of the household, walked around them respectfully, bade farewell to all the citizens, and set out for Vāraṇāvata.

    '
adi-1-157-4:
  ganguli: 1 CXLVII
  text: '(with adi-1-157-3)

    '
adi-1-157-19:
  ganguli: 1 CXLVII
  text: 'And after the citizens had ceased following the Pandavas, Vidura, conversant with all the dictates of morality, desirous of awakening the eldest of the Pandavas (to a sense of his dangers), addressed him in these words. …

    '
  modern: 'After the citizens had stopped following the Pāṇḍavas, Vidura, who knew all the rules of morality, wanted to warn the eldest Pāṇḍava of his dangers and spoke to him. …

    '
adi-1-157-22:
  ganguli: 1 CXLVII
  text: 'He liveth who protecteth himself by the knowledge that neither the consumer of straw and wood nor the drier of the dew burneth the inmates of a hole in the deep woods.

    '
  modern: 'He lives who protects himself by knowing that neither the consumer of straw and wood nor the drier of dew burns the dwellers in a hole in the deep woods.

    '
adi-1-157-27:
  ganguli: 1 CXLVII
  text: 'Then Vidura, having instructed the Pandavas and followed them (thus far), walked around them and bidding them farewell returned to his own abode.

    '
  modern: 'Then Vidura, having instructed the Pāṇḍavas and followed them this far, walked around them, said farewell, and returned to his own home.

    '
adi-1-158-5:
  ganguli: 1 CXLVIII
  text: 'And those sinless ones, welcomed by the citizens and welcoming the citizens in return, then entered the populous town of Varanavata decked with every ornament.

    '
  modern: 'Those sinless ones, welcomed by the citizens and welcoming them in return, then entered the populous town of Vāraṇāvata, decked with every ornament.

    '
adi-1-158-9:
  ganguli: 1 CXLVIII
  text: '… Purochana then began to place before them food and drink and beds and carpets, all of the first and most agreeable order.

    '
  modern: '… Purocana then began to place before them food, drink, beds, and carpets, all of the best and most agreeable kind.

    '
adi-1-158-11:
  ganguli: 1 CXLVIII
  text: 'After the Pandavas had thus lived for ten nights, Purochana spoke to them of the mansion (he had built) called ''The Blessed Home,'' but in reality the cursed house.

    '
  modern: 'After the Pāṇḍavas had lived there for ten nights, Purocana told them of the mansion he had built, called "The Blessed Home," but in truth the cursed house.

    '
adi-1-159-1:
  ganguli: 1 CXLIX
  speaker: Vaisampayana continued
  text: 'A friend of Vidura''s, well-skilled in mining, coming unto the Pandavas, addressed them in secret, saying, …

    '
  modern: 'A friend of Vidura''s, well skilled in mining, came to the Pāṇḍavas and said to them in secret, …

    '
  speakerModern: 'Vaiśampāyana continued:'
adi-1-159-16:
  ganguli: 1 CXLIX
  text: 'On hearing these words, the miner said, ''So be it,'' and carefully beginning his work of excavation, made a large subterranean passage. And the mouth of that passage was in the centre of that house, and it was on a level with the floor and closed up with planks.

    '
  modern: 'On hearing these words, the miner said, "So be it," and carefully began his digging and made a large underground passage. Its mouth was in the middle of the house, level with the floor and closed with planks.

    '
adi-1-159-17:
  ganguli: 1 CXLIX
  text: 'The mouth was so covered from fear of Purochana, that wicked wretch who kept a constant watch at the door of the house. …

    '
  modern: 'The mouth was covered like this out of fear of Purocana, that wicked man who kept constant watch at the door of the house. …

    '
adi-1-159-18:
  ganguli: 1 CXLIX
  text: '… while, during the day, they went a-hunting from forest to forest. Thus, O king, they lived (in that mansion) very guardedly, deceiving Purochana by a show of trustfulness and contentment while in reality they were trustless and discontented.

    '
  modern: '… during the day they went hunting from forest to forest. Thus, O king, they lived in that mansion on their guard, deceiving Purocana by a show of trust and contentment while in reality they trusted no one and were discontented.

    '
adi-1-160-13:
  ganguli: 1 CL
  text: 'O king, she, and her children, intoxicated with the wine they drank, became incapable. Deprived of consciousness and more dead than alive, she with all her sons lay down in that mansion to sleep. Then when all the inmates of the house lay down to sleep, there began to blow a violent wind in the night.

    '
  modern: 'O king, she and her sons, drunk with the wine they had drunk, became helpless. Unconscious and more dead than alive, she lay down to sleep in that mansion with all her sons. Then, when everyone in the house had lain down to sleep, a violent wind began to blow in the night.

    '
adi-1-160-14:
  ganguli: 1 CL
  text: 'Bhima then set fire to the house just where Purochana was sleeping. Then the son of Pandu set fire to the door of that house of lac.

    '
  modern: 'Then Bhīma set fire to the house just where Purocana was sleeping. Then the son of Pāṇḍu set fire to the door of that house of lac.

    '
adi-1-160-17:
  ganguli: 1 CL
  text: 'Then when the sons of Pandu were satisfied that the house had caught fire in several parts those chastisers of foes with their mother, entered the subterranean passage without losing any time.

    '
  modern: 'When the sons of Pāṇḍu were satisfied that the house had caught fire in several places, those chastisers of foes entered the underground passage with their mother without losing any time.

    '
adi-1-160-24:
  ganguli: 1 CL
  text: 'The Pandavas, however, accompanied by their mother coming out of the subterranean passage, fled in haste unnoticed.

    '
  modern: 'The Pāṇḍavas, with their mother, came out of the underground passage and fled in haste, unnoticed.

    '
adi-1-161-5:
  ganguli: 1 CLI
  speaker: Vaisampayana said
  text: 'About this time, the learned Vidura had sent into those woods a man of pure character and much trusted by him. This person going to where he had been directed, saw the Pandavas with their mother in the forest employed in a certain place in measuring the depth of a river. …

    '
  modern: 'About this time the learned Vidura had sent a man of pure character, whom he trusted much, into those woods. Going where he had been told, this man saw the Pāṇḍavas with their mother in the forest, busy measuring the depth of a river. …

    '
  speakerModern: 'Vaiśampāyana said:'
adi-1-161-6:
  ganguli: 1 CLI
  text: 'Sent by Vidura unto them, he showed the Pandavas on the sacred banks of the Ganga a boat with engines and flags, constructed by trusted artificers and capable of withstanding wind and wave and endued with the speed of the tempest or of thought.

    '
  modern: 'Sent by Vidura, he showed the Pāṇḍavas on the sacred bank of the Gaṅgā a boat with engines and flags, built by trusted craftsmen, able to withstand wind and wave, and as fast as the tempest or as thought.

    '
adi-1-161-22:
  ganguli: 1 CLI
  text: 'The illustrious Pandavas also sending through that person some message to Vidura, began, after having crossed the Ganga, to proceed with haste and in great secrecy.

    '
  modern: 'The illustrious Pāṇḍavas also sent a message to Vidura through that man, and then, after crossing the Gaṅgā, began to hurry on, in great secrecy.

    '
adi-1-161-28:
  ganguli: 1 CLII
  text: 'O Bharata, taking us on thyself, proceed thou as before. Thou alone amongst us art strong and swift as the wind.'' "Thus addressed by Yudhishthira the just, the mighty Bhimasena, taking up on his body Kunti and his brothers, began to proceed with great celerity.''"

    '
  modern: 'O Bharata, take us on yourself and go on as before. You alone among us are as strong and swift as the wind." Thus addressed by Yudhiṣṭhira the just, the mighty Bhīmasena took Kuntī and his brothers on his body and began to move with great speed.

    '
adi-1-163-19:
  ganguli: 1 CLIII
  text: 'Then Bhima, proceeding through that terrible and extensive forest without a living soul, saw a beautiful banian tree with widespreading branches.

    '
  modern: 'Then Bhīma, going through that terrible, vast forest with not a living soul in it, saw a beautiful banyan tree with widespread branches.

    '
adi-1-163-20:
  ganguli: 1 CLIII
  text: 'Setting down there his brothers and mother, O bull of Bharata''s race; he said unto them, ''Rest you here, while I go in quest of water. …

    '
  modern: 'Setting his brothers and mother down there, O bull of Bharata''s race, he said to them, "Rest here while I go in search of water. …

    '
adi-1-164-1:
  ganguli: 1 CLIV
  speaker: Vaisampayana said
  text: 'Not far from the place where the Pandavas were asleep, a Rakshasa by name Hidimva dwelt on the Sala tree.

    '
  modern: 'Not far from where the Pāṇḍavas lay asleep, a Rākṣasa named Hiḍimba lived in a sāla tree.

    '
  speakerModern: 'Vaiśampāyana said:'
adi-1-165-41:
  ganguli: 1 CLV
  speaker: Vaisampayana continued
  text: 'Saying this, the cannibal, extending his arms ran in wrath towards Bhimasena, that chastiser of foes.

    '
  modern: 'Saying this, the cannibal stretched out his arms and ran in anger at Bhīmasena, that chastiser of foes.

    '
  speakerModern: 'Vaiśampāyana continued:'
adi-1-165-43:
  ganguli: 1 CLV
  text: 'Then seizing the struggling Rakshasa with violence, Bhima dragged him from that spot full thirty-two cubits like a lion dragging a little animal.

    '
  modern: 'Then Bhīma seized the struggling Rākṣasa with violence and dragged him from that spot a full thirty-two cubits, like a lion dragging a small animal.

    '
adi-1-169-6:
  ganguli: 1 CLVII
  text: 'Endued with the speed of the mind, she sported with Bhima in all these regions, till in time, she conceived and brought forth a mighty son begotten upon her by the Pandava.

    '
  modern: 'Moving at the speed of thought, she sported with Bhīma in all these regions, until in time she conceived and bore a mighty son fathered on her by the Pāṇḍava.

    '
adi-1-169-11:
  ganguli: 1 CLVII
  text: 'The Rakshasa women bring forth the very day they conceive, and capable of assuming any forms at will, they always change their forms.

    '
  modern: 'Rākṣasa women give birth on the very day they conceive, and, able to take any form they wish, they always change their forms.

    '
adi-1-169-19:
  ganguli: 1 CLVII
  text: 'And Ghatotkacha also--that foremost of Rakshasas--promising unto his father that he would come when wanted on business, saluted them and went away northward.

    '
  modern: 'And Ghaṭotkaca, that foremost of Rākṣasas, promised his father that he would come when needed on business, saluted them, and went away to the north.

    '
adi-1-169-22:
  ganguli: 1 CLVII
  text: 'Then Hidimva, knowing that the period of her stay (with her husband) had come to an end, saluted the Pandavas and making a new appointment with them went away whithersoever she liked.

    '
  modern: 'Then Hiḍimbā, knowing that the period of her stay with her husband had come to an end, saluted the Pāṇḍavas, made a new appointment with them, and went away wherever she liked.

    '
adi-1-169-23:
  ganguli: 1 CLVII
  text: '(with adi-1-169-22)

    '
adi-1-171-2:
  ganguli: 1 CLIX
  speaker: Vaisampayana said
  text: 'Those mighty car-warriors, the sons of Kunti, on arriving at Ekachakra, lived for a short time in the abode of a Brahmana.

    '
  modern: 'The mighty warriors, the sons of Kuntī, on arriving at Ekacakrā, lived for a short time in the house of a Brāhmaṇa.

    '
  speakerModern: 'Vaiśampāyana said:'
adi-1-171-5:
  ganguli: 1 CLIX
  text: 'Leading an eleemosynary life, they behold (in course of their wanderings) various delightful forests and earthly regions, and many rivers and lakes, and they became great favourites of the inhabitants of that town in consequence of their own accomplishments.

    '
  modern: 'Living on alms, they saw in the course of their wanderings various delightful forests and regions, and many rivers and lakes, and by their own accomplishments they became great favorites of the people of that town.

    '
adi-1-174-4:
  ganguli: 1 CLXII
  text: 'Not far from this town, there liveth a Rakshasa of the name of Vaka, which cannibal is the lord of this country and town.

    '
  modern: 'Not far from this town there lives a Rākṣasa named Baka, a cannibal who is lord of this country and town.

    '
adi-1-177-28:
  ganguli: 1 CLXV
  text: 'The mighty son of Pandu, approaching the forest where the Rakshasa dwelt, began to eat himself the food he carried, calling loudly to the Rakshasa by name.

    '
  modern: "The mighty son of Pāṇḍu went to the forest where the Rākṣasa lived and began himself to eat the food he carried, calling loudly to the Rākṣasa by name."
adi-1-178-7:
  ganguli: 1 CLXVI
  text: 'Those Rakshasas hearing this speech of Bhima, said, ''So be it,'' and gave, O king, the desired promise. From that day, O Bharata, the Rakshasas (of the region) were seen by the inhabitants of that town to be very peaceful towards mankind.

    '
  modern: 'Hearing this speech of Bhīma, those Rākṣasas said, "So be it," and gave, O king, the promise he asked. From that day, O Bharata, the Rākṣasas of the region were seen by the people of that town to be very peaceful toward mankind.

    '
adi-1-184-1:
  ganguli: 1 CLXXI
  speaker: Vaisampayana said
  text: 'While the illustrious Pandavas were living disguised in the abode of the Brahmana, Vyasa, the son of Satyavati, once went to see them.

    '
  modern: 'While the illustrious Pāṇḍavas were living in disguise in the Brāhmaṇa''s house, Vyāsa, the son of Satyavatī, once went to see them.

    '
  speakerModern: 'Vaiśampāyana said:'
adi-1-184-6:
  ganguli: 1 CLXXI
  text: '… An illustrious Rishi, living in a certain hermitage, had a daughter of tender waist, fair lips, and fine eye-brows, and possessing every accomplishment.

    '
  modern: '… An illustrious ṛṣi, living in a certain hermitage, had a daughter with a slender waist, fair lips, and fine eyebrows, who had every accomplishment.

    '
adi-1-184-7:
  ganguli: 1 CLXXI
  text: 'As a consequence of her own acts (in a past life) the fair maid became very unfortunate. Though chaste and beautiful, the damsel obtained not a husband.

    '
  modern: 'As a result of her own acts in a past life, the fair girl became very unfortunate. Though chaste and beautiful, she did not find a husband.

    '
adi-1-184-8:
  ganguli: 1 CLXXI
  text: 'With a sorrowful heart she thereupon began to practise ascetic penances with the object of obtaining a husband. She soon gratified by her severe asceticism the god Sankara (Mahadeva), …

    '
  modern: 'With a sorrowful heart she then began to practice ascetic penances to obtain a husband. By her severe asceticism she soon pleased the god Śaṅkara (Mahādeva), …

    '
adi-1-184-11:
  ganguli: 1 CLXXI
  text: 'Then Isana (Mahadeva), that foremost of all speakers, replied unto her, saying, ''O blessed one, thou shall have five husbands from among the Bharata princes.

    '
  modern: 'Then Īśāna (Mahādeva), that foremost of speakers, answered her, "O blessed one, you shall have five husbands from among the Bharata princes."

    '
adi-1-184-14:
  ganguli: 1 CLXXI
  text: 'Thou shalt, therefore, in another life have five husbands! Ye princes of Bharata''s line, that damsel of celestial beauty hath been born in the line of Drupada.

    '
  modern: '"So in another life you will have five husbands!" Princes of Bharata''s line, that damsel of celestial beauty has been born in the line of Drupada.

    '
adi-1-184-15:
  ganguli: 1 CLXXI
  text: 'The faultless Krishna of Prishata''s line hath been appointed to be the wife of you all. Ye mighty ones, go therefore, to the capital of the Panchalas and dwell ye there. There is no doubt that having obtained her as wife ye shall be very happy.

    '
  modern: 'The faultless Kṛṣṇā of Pṛṣata''s line has been appointed to be the wife of you all. Mighty ones, go to the capital of the Pañcālas and live there. There is no doubt that when you have won her as your wife you will be very happy."

    '
adi-1-200-1:
  ganguli: 1 CLXXXVI
  speaker: Vaisampayana said
  text: 'Then those tigers among men--those brothers--the five Pandavas, set out for Panchala to behold that country and Draupadi and the festivities (in view of her marriage).

    '
  modern: 'Then those tigers among men, the five Pāṇḍava brothers, set out for Pañcāla to see that country and Draupadī and the festivities for her marriage.

    '
  speakerModern: 'Vaiśampāyana said:'
adi-1-200-6:
  ganguli: 1 CLXXXVII
  text: 'And beholding the capital, as also the fort, they took up their quarters in the house of a potter …

    '
  modern: 'And seeing the capital and the fort, they took up their quarters in the house of a potter. …

    '
adi-1-200-7:
  ganguli: 1 CLXXXVII
  text: 'Adopting the Brahmanical profession, they began to lead an eleemosynary life. And no men recognised those heroes during their stay in Drupada''s capital.

    '
  modern: 'Adopting the Brāhmaṇa''s way of life, they began to live on alms. And no one recognized those heroes during their stay in Drupada''s capital.

    '
adi-1-200-10:
  ganguli: 1 CLXXXVII
  text: 'Yajnasena always cherished the desire of bestowing his daughter on Kiriti (Arjuna), the son of Pandu.

    '
  modern: 'Yajñasena always cherished the wish to give his daughter to Kirīṭin (Arjuna), the son of Pāṇḍu.

    '
adi-1-200-11:
  ganguli: 1 CLXXXVII
  text: 'But he never spoke of it to anybody.

    '
  modern: 'But he never spoke of it to anyone.

    '
adi-1-200-12:
  ganguli: 1 CLXXXVII
  text: 'And, O Janamejaya, the king of Panchala thinking of Arjuna caused a very stiff bow to be made that was incapable of being bent by any except Arjuna.

    '
  modern: 'And, O Janamejaya, the king of Pañcāla, thinking of Arjuna, had a very stiff bow made that no one but Arjuna could bend.

    '
adi-1-200-17:
  ganguli: 1 CLXXXVII
  text: 'Causing some machinery to be erected in the sky, the king set up a mark attached to that machinery.

    '
  modern: 'He had some machinery set up in the sky, and fixed a mark to that machinery.

    '
adi-1-200-18:
  ganguli: 1 CLXXXVII
  speaker: And Drupada said
  text: 'He that will string this bow and with these well-adorned arrows shoot the mark above the machine shall obtain my daughter.

    '
  modern: 'Whoever strings this bow and, with these well-made arrows, shoots the mark above the machine shall win my daughter."

    '
  speakerModern: 'And Drupada said:'
adi-1-200-19:
  ganguli: 1 CLXXXVII
  speaker: Vaisampayana continued
  text: 'With these words king Drupada proclaimed the Swayamvara. On hearing of them, O Bharata, the kings of other lands came to his capital.

    '
  modern: 'With these words King Drupada proclaimed the svayaṃvara. On hearing of it, O Bharata, kings of other lands came to his capital.

    '
  speakerModern: 'Vaiśampāyana continued:'
adi-1-200-20:
  ganguli: 1 CLXXXVII
  text: 'And there came also many illustrious Rishis desirous of beholding the Swayamvara. And there came also, O king, Duryodhana and the Kurus accompanied by Kama.

    '
  modern: 'Many illustrious ṛṣis who wanted to see the svayaṃvara came too. And Duryodhana and the Kurus came, with Karṇa.

    '
adi-1-200-22:
  ganguli: 1 CLXXXVII
  text: 'There also came many superior Brahmanas from every country.

    '
  modern: 'Many excellent Brāhmaṇas also came from every country.

    '
adi-1-200-23:
  ganguli: 1 CLXXXVII
  text: 'The Pandavas, too, entering that amphitheatre, sat with the Brahmanas and beheld the unequalled affluence of the king of the Panchalas.

    '
  modern: 'The Pāṇḍavas, too, entering that amphitheater, sat with the Brāhmaṇas and saw the unequaled wealth of the king of the Pañcālas.

    '
adi-1-200-35:
  ganguli: 1 CLXXXVII
  text: 'And the inhabitants of the city and the country who had come to behold Krishna and taken their seats on the excellent platforms erected around, beheld seated within those mansions those lions among kings who were all endued with the energy of great souls.

    '
  modern: 'And the people of the city and the country who had come to see Kṛṣṇā took their seats on the excellent platforms built around, and saw, seated inside those mansions, those lions among kings, all full of the energy of great souls.

    '
adi-1-200-54:
  ganguli: 1 CLXXXVII
  text: '… the daughter of Drupada, O thou bull of the Bharata race, having washed herself clean entered the amphitheatre, richly attired and adorned with every ornament and bearing in her hand a dish of gold (whereon were the usual offerings of Arghya) and a garland of flowers.

    '
  modern: '… the daughter of Drupada, O bull of the Bharata race, having bathed, entered the amphitheater richly dressed and adorned with every ornament, carrying in her hand a golden dish (with the usual offerings of arghya) and a garland of flowers.

    '
adi-1-202-1:
  ganguli: 1 CLXXXIX
  speaker: Vaisampayana said
  text: 'Then those youthful princes adorned with ear-rings, vying with one another and each regarding himself accomplished in arms and gifted with might, stood up brandishing their weapons.

    '
  modern: 'Then those young princes, adorned with earrings, each vying with the others and thinking himself accomplished in arms and strong, stood up brandishing their weapons.

    '
  speakerModern: 'Vaiśampāyana said:'
adi-1-202-3:
  ganguli: 1 CLXXXIX
  text: 'And beholding each other with jealousy and influenced by the god of desire, they suddenly rose up from their royal seats, exclaiming ''Krishna shall be mine.

    '
  modern: 'Looking at each other with jealousy and driven by the god of desire, they suddenly rose from their royal seats, crying, "Kṛṣṇā shall be mine."

    '
adi-1-202-15:
  ganguli: 1 CLXXXIX
  text: 'Then those princes--Karna, Duryodhana, Salwa, Salya, Aswatthaman, Kratha, Sunitha, Vakra, the ruler of Kalinga and Banga, Pandya, Paundra, the ruler of Videha, the chief of the Yavanas, and many other sons and grandsons of kings,--sovereigns of territories with eyes like lotus-petals,--one after another began to exhibit prowess for (winning) that maiden of unrivalled beauty.

    '
  modern: 'Then those princes, Karṇa, Duryodhana, Śālva, Śalya, Aśvatthāman, Kratha, Sunītha, Vakra, the rulers of Kaliṅga and Baṅga, Pāṇḍya, Pauṇḍra, the ruler of Videha, the chief of the Yavanas, and many other sons and grandsons of kings, lords of territories, with eyes like lotus petals, one after another began to show their prowess to win that maiden of unrivaled beauty.

    '
adi-1-202-18:
  ganguli: 1 CLXXXIX
  text: '… those princes could not, even in imagination, string that bow of extraordinary stiffness. And (some amongst) those kings in exerting with swelling lips each according to his strength, education, skill, and energy,--to string that bow, were tossed on the ground and lay perfectly motionless for some time.

    '
  modern: '… those princes could not, even in imagination, string that bow of extraordinary stiffness. And some of those kings, straining with swelling lips, each according to his strength, learning, skill, and energy, to string that bow, were thrown to the ground and lay perfectly still for some time.

    '
adi-1-203-1:
  ganguli: 1 CXC
  speaker: Vaisampayana continued
  text: 'When all the monarchs had desisted from stringing that bow, the high-souled Jishnu arose from among the crowd of Brahmanas seated in that assembly.

    '
  modern: 'When all the monarchs had given up trying to string that bow, the high-souled Jiṣṇu rose from among the crowd of Brāhmaṇas seated in that assembly.

    '
  speakerModern: 'Vaiśampāyana continued:'
adi-1-203-22:
  ganguli: 1 CXC
  text: 'And walking round that bow, and bending his head unto that giver of boons--the lord Isana--and remembering Krishna also, he took it up.

    '
  modern: 'He walked around that bow, bowed his head to that giver of boons, the lord Īśāna, remembered Kṛṣṇā too, and took it up.

    '
adi-1-203-24:
  ganguli: 1 CXC
  text: 'And that bow … Arjuna, the son of Indra, that foremost of all persons endued with energy and like unto the younger brother of Indra (Vishnu) in might, strung in the twinkling of an eye. And taking up the five arrows …

    '
  modern: 'That bow … Arjuna, the son of Indra, foremost of all who have energy and like the younger brother of Indra (Viṣṇu) in might, strung in the twinkling of an eye. And taking up the five arrows, …

    '
adi-1-203-25:
  ganguli: 1 CXC
  text: 'And taking up the five arrows he shot the mark and caused it to fall down on the ground through the hole in the machine above which it had been placed. Then there arose a loud uproar in the firmament, and the amphitheatre also resounded with a loud clamour.

    '
  modern: 'And taking up the five arrows, he shot the mark and made it fall to the ground through the hole in the machine above which it had been placed. Then a great uproar arose in the sky, and the amphitheater also resounded with a loud clamor.

    '
adi-1-203-33:
  ganguli: 1 CXC
  text: 'And Krishna beholding the mark shot and beholding Partha also like unto Indra himself, who had shot the mark, was filled with joy, and approached the son of Kunti with a white robe and a garland of flowers. …

    '
  modern: 'Kṛṣṇā saw the mark shot, and saw Pārtha, who had shot it, like Indra himself, and she was filled with joy. She went to the son of Kuntī with a white robe and a garland of flowers. …

    '
adi-1-206-15:
  ganguli: 1 CXCIII
  text: 'And Yudhishthira, the son of Kunti, beholding his younger brothers, understood what was passing in their minds. And that bull among men immediately recollected the words of Krishna-Dwaipayana.

    '
  modern: 'And Yudhiṣṭhira, the son of Kuntī, looking at his younger brothers, understood what was passing in their minds. That bull among men at once remembered the words of Kṛṣṇa Dvaipāyana.

    '
adi-1-206-16:
  ganguli: 1 CXCIII
  text: 'And the king, then, from fear of a division amongst the brothers, addressing all of them, said, ''The auspicious Draupadi shall be the common wife of us all.''

    '
  modern: 'And the king, fearing a division among the brothers, said to them all, "The auspicious Draupadī shall be the common wife of us all."

    '
adi-1-210-1:
  ganguli: 1 CXCVII
  speaker: Vaisampayana said
  text: 'Then the illustrious king of Panchala, addressing prince Yudhishthira in the form applicable to Brahmanas, cheerfully enquired of that illustrious son of Kunti, saying, ''Are we to know you as Kshatriyas, or Brahamanas, or are we to know you as celestials who disguising themselves as Brahmanas are ranging the earth and come hither for the hand of Krishna?

    '
  modern: 'Then the illustrious king of Pañcāla spoke to Prince Yudhiṣṭhira in the form of address used for Brāhmaṇas and asked the illustrious son of Kuntī cheerfully, "Are we to know you as Kṣatriyas, or as Brāhmaṇas, or as celestials who have disguised themselves as Brāhmaṇas and are roaming the earth and have come here for Kṛṣṇā''s hand?

    '
  speakerModern: 'Vaiśampāyana said:'
adi-1-210-2:
  ganguli: 1 CXCVII
  text: '(with adi-1-210-1)

    '
adi-1-210-15:
  ganguli: 1 CXCVII
  text: 'The virtuous monarch enquired how the Pandavas had escaped from the town of Varanavata. The son of Pandu told the monarch every particular in detail of their escape from the burning palace of lac.

    '
  modern: 'The virtuous king asked how the Pāṇḍavas had escaped from the town of Vāraṇāvata. The son of Pāṇḍu told the king every detail of their escape from the burning palace of lac.

    '
adi-1-215-14:
  ganguli: 1 CC
  text: 'Then those princes of the Kuru line, endued with youth and adorned with ear-rings, attired in costly robes and perfumed with sandal-paste, bathed and performed the usual religious rites …

    '
  modern: 'Then those princes of the Kuru line, young and wearing earrings, dressed in costly robes and perfumed with sandal paste, bathed and performed the usual religious rites. …

    '
adi-1-215-22:
  ganguli: 1 CC
  text: 'Then those mighty car-warriors,--those perpetuators of the Kuru line,--those princes attired in gorgeous dresses, took the hand of that best of women, day by day in succession, aided by that priest.

    '
  modern: 'Then those mighty warriors, perpetuators of the Kuru line, the princes in their splendid clothes, took the hand of that best of women, one after another on successive days, with the priest''s help.

    '
adi-1-218-72:
  ganguli: 1 CXCIII
  text: 'The hero of the Vrishni race (Krishna suspecting the five persons he had seen at the Swayamvara to be none else than the heroes of the Kuru race), came accompanied by the son of Rohini (Valadeva), to the house of the potter where those foremost of men had taken up their quarters. On arriving there, Krishna and Valadeva beheld seated in that potter''s house Ajatasanu (Yudhishthira) of well developed and long arms, and his younger brothers passing the splendour of fire sitting around him.

    '
  modern: 'Kṛṣṇa, the hero of the Vṛṣṇi race, suspected that the five persons he had seen at the svayaṃvara were none other than the heroes of the Kuru race, and he came with the son of Rohiṇī (Baladeva) to the potter''s house where those foremost of men had taken up their quarters. Arriving there, Kṛṣṇa and Baladeva saw Yudhiṣṭhira (Ajātaśatru), long-armed and strongly built, seated there, with his younger brothers, blazing like fire, sitting around him.

    '
adi-1-219-14:
  ganguli: 1 CCII
  text: 'Then Vidura, having learnt that Draupadi had been won by the Pandavas and that the sons of Dhritarashtra had come back (to Hastinapura) in shame, their pride humiliated, became filled with joy.

    '
  modern: 'Then Vidura learned that the Pāṇḍavas had won Draupadī and that the sons of Dhṛtarāṣṭra had come back to Hāstinapura in shame, their pride humbled, and he was filled with joy.

    '
adi-1-219-15:
  ganguli: 1 CCII
  text: 'And, O king, approaching Dhritarashtra, Kshattri said, ''The Kurus are prospering by good luck!

    '
  modern: 'And, O king, Vidura went to Dhṛtarāṣṭra and said, "The Kurus are prospering, by good luck!"

    '
adi-1-219-20:
  ganguli: 1 CCII
  text: 'It was then that Vidura told the monarch that Draupadi had chosen the Pandavas for her lords, and that those heroes were all alive and at peace, and that they had been received with great respect by king Drupada. …

    '
  modern: 'Then Vidura told the king that Draupadī had chosen the Pāṇḍavas as her lords, that those heroes were all alive and at peace, and that King Drupada had received them with great respect. …

    '
adi-1-219-22:
  ganguli: 1 CCII
  text: 'Hearing those words of Vidura, the son of Vichitravirya, wondering, said in great glee, ''What good luck, O Vidura! What good luck!

    '
  modern: 'Hearing those words of Vidura, the son of Vicitravīrya answered in great delight, "What good luck, Vidura! What good luck!"

    '
adi-1-219-34:
  ganguli: 1 CCII
  text: 'Then, O monarch, there came unto Dhritarashtra, Duryodhana and the son of Radha, Karna.

    '
  modern: 'Then, O monarch, Duryodhana and Karṇa, the son of Rādhā, came to Dhṛtarāṣṭra.

    '
adi-1-219-35:
  ganguli: 1 CCII
  text: 'Addressing the monarch, they said, ''We cannot, O king, speak of any transgression in the presence of Vidura! We have now found thee alone, and will, therefore, say all we like! What is this that thou hast, O monarch, desired to do?

    '
  modern: 'They said to the king, "We cannot speak of any wrong in Vidura''s presence. Now we have found you alone, so we will say all we like. What is this that you have wanted to do?

    '
adi-1-219-36:
  ganguli: 1 CCII
  text: 'Dost thou regard the prosperity of thy foes as if it were thy own, that thou hast been applauding the Pandavas, O foremost of men, in the presence of Vidura?

    '
  modern: 'Do you regard the prosperity of your foes as if it were your own, so that you applauded the Pāṇḍavas, O foremost of men, in Vidura''s presence?

    '
adi-1-219-37:
  ganguli: 1 CCII
  text: 'O sinless one, thou actest not, O king, in the way thou shouldst! O father, we should now act every day in such a way as to weaken (the strength of) the Pandavas.

    '
  modern: 'O sinless one, O king, you are not acting as you should! O father, we should now act every day so as to weaken the Pāṇḍavas.

    '
adi-1-220-2:
  ganguli: 1 CCIII
  speaker: Vaisampayana said
  text: 'Dhritarashtra replied saying, I desire to do exactly what you would recommend. But I do not wish to inform Vidura of it even by a change of muscle.

    '
  modern: 'I want to do exactly what you would recommend. But I do not want Vidura to learn of it, even by a change in my expression.

    '
  speakerModern: 'Vaiśampāyana said:'
adi-1-221-24:
  ganguli: 1 CCIV
  text: 'But let Bhishma, and Drona, and Vidura, and you two, take counsel together and adopt that proposal which may lead to our benefit.

    '
  modern: 'But let Bhīṣma, Droṇa, Vidura, and you two take counsel together and adopt the proposal that may lead to our benefit."

    '
adi-1-221-25:
  ganguli: 1 CCIV
  speaker: Vaisampayana continued
  text: 'Then king Dhritarashtra called unto him, all those celebrated ministers and took counsel with them.

    '
  modern: 'Then King Dhṛtarāṣṭra called all those famous ministers to him and took counsel with them.

    '
  speakerModern: 'Vaiśampāyana continued:'
adi-1-222-1:
  ganguli: 1 CCV
  text: 'O Dhritarashtra, a quarrel with the Pandavas is what I can never approve of. As thou art to me, so was Pandu without doubt.

    '
  modern: 'O Dhṛtarāṣṭra, I can never approve of a quarrel with the Pāṇḍavas. As you are to me, so was Pāṇḍu, without doubt.

    '
  speaker: Asked by Dhritarashtra to give his opinion, Bhishma replied
  speakerModern: 'Asked by Dhṛtarāṣṭra for his opinion, Bhīṣma replied:'
adi-1-222-8:
  ganguli: 1 CCV
  text: 'Give them half the kingdom quietly. This, O tiger among men, is beneficial to all.

    '
  modern: 'Give them half the kingdom quietly. This, O tiger among men, is good for all.

    '
adi-1-222-17:
  ganguli: 1 CCV
  text: 'Know, O thou of Kuru''s race, that as long as those heroes live, the wielder of the thunder himself cannot deprive them of their ancestral share in the kingdom.

    '
  modern: 'Know, O Kuru, that as long as those heroes live, even the wielder of the thunderbolt cannot deprive them of their ancestral share in the kingdom.

    '
adi-1-223-2:
  ganguli: 1 CCVI
  text: 'O sire, I am of the same mind in this matter with the illustrious Bhishma. Let a share of the kingdom be given unto the Pandavas. This is eternal virtue.

    '
  modern: 'O sire, I am of the same mind in this matter as the illustrious Bhīṣma. Let a share of the kingdom be given to the Pāṇḍavas. This is eternal virtue.

    '
adi-1-224-2:
  ganguli: 1 CCVII
  speaker: Vaisampayana said
  text: 'After Drona had ceased, Vidura spoke, saying, ''O monarch, thy friends without doubt, are saying unto thee what is for thy good. But as thou art unwilling to listen to what they say, their words scarcely find a place in thy ears. What that foremost one of Kuru''s race, viz., Bhishma, the son of Santanu, hath said, is excellent and is for thy good.

    '
  modern: "After Droṇa had finished, Vidura spoke: \"O monarch, your friends are surely saying what is for your good. But since you will not listen to what they say, their words scarcely reach your ears. What Bhīṣma, that foremost one of Kuru's race, has said is excellent and for your good."
  speakerModern: 'Vaiśampāyana said:'
adi-1-224-3:
  ganguli: 1 CCVII
  text: 'The preceptor Drona also hath said much that is for thy good which however Karna, the son of Radha, doth not regard to be such.

    '
  modern: 'The teacher Droṇa has also said much that is for your good, which Karṇa, the son of Rādhā, does not regard as such.

    '
adi-1-224-11:
  ganguli: 1 CCVII
  text: 'What they have said, O Bharata, I regard highly beneficial to thee. Without doubt, O monarch, the Pandavas are thy sons as much as Duryodhana and others are.

    '
  modern: 'What they have said, O Bharata, I consider highly beneficial to you. Without doubt, O monarch, the Pāṇḍavas are your sons as much as Duryodhana and the others are.

    '
adi-1-224-15:
  ganguli: 1 CCVII
  text: 'What these bulls among men have said regarding the invincibility of the Pandavas is perfectly true.

    '
  modern: 'What those bulls among men have said about the Pāṇḍavas being invincible is perfectly true.

    '
adi-1-224-29:
  ganguli: 1 CCVII
  text: 'O king, who, unless cursed by the gods, would seek, to effect that by means of war which can be effected by conciliation?

    '
  modern: 'O king, who, unless cursed by the gods, would try to do by war what can be done by conciliation?

    '
adi-1-224-30:
  ganguli: 1 CCVII
  text: 'Hearing that the sons of Pritha are alive, the citizens and other subjects of the realm have become exceedingly glad and eager for beholding them. O monarch, act in a way that is agreeable to them.

    '
  modern: 'When they hear that the sons of Pṛthā are alive, the citizens and other subjects of the realm are exceedingly glad and eager to see them. O monarch, act in a way that pleases them.

    '
adi-1-224-31:
  ganguli: 1 CCVII
  text: 'Duryodhana and Karna and Sakuni, the son of Suvala, are sinful, foolish and young; listen not to them.

    '
  modern: 'Duryodhana, Karṇa, and Śakuni, the son of Subala, are sinful, foolish, and young. Do not listen to them.

    '
adi-1-225-5:
  ganguli: 1 CCVIII
  text: 'From sheer good fortune the sons of Pritha are alive; and from good fortune alone those mighty car-warriors have obtained the daughter of Drupada.

    '
  modern: 'It is by sheer good fortune that the sons of Pṛthā are alive, and by good fortune alone that those mighty warriors have won the daughter of Drupada.

    '
adi-1-225-7:
  ganguli: 1 CCVIII
  text: 'Therefore, hasten to bring hither the Pandavas along with their mother, treating them with affectionate consideration. O thou of Bharata''s race, bring also Krishna of celestial beauty along with them. … Then Vidura, at the command of Dhritarashtra, repaired, O Bharata, unto Yajnasena and the Pandavas.

    '
  modern: 'So hurry to bring the Pāṇḍavas here with their mother, treating them with affectionate consideration. And, O descendant of Bharata, bring Kṛṣṇā of celestial beauty with them too. … Then Vidura, at Dhṛtarāṣṭra''s command, went, O Bharata, to Yajñasena and the Pāṇḍavas.

    '
adi-1-225-12:
  ganguli: 1 CCVIII
  text: 'Vidura then saw there the Pandavas and Vasudeva. As soon as he saw them he embraced them from affection and enquired after their well being.

    '
  modern: 'Vidura then saw the Pāṇḍavas and Vāsudeva there. As soon as he saw them he embraced them with affection and asked after their well-being.

    '
adi-1-226-17:
  ganguli: 1 CCIX
  speaker: Vaisampayana continued
  text: 'Commanded by the illustrious Drupada, the Pandavas, then, O king, and Krishna and Vidura, taking with them Krishna, the daughter of Drupada, and the renowned Kunti, journeyed towards the city called after the elephant, stopping at various places along the way for purposes of pleasure and enjoyment.

    '
  modern: 'Commanded by the illustrious Drupada, the Pāṇḍavas, O king, with Kṛṣṇa and Vidura, taking with them Kṛṣṇā, the daughter of Drupada, and the renowned Kuntī, journeyed toward the city named after the elephant, stopping at various places along the way for pleasure and enjoyment.

    '
  speakerModern: 'Vaiśampāyana continued:'
adi-1-226-19:
  ganguli: 1 CCIX
  text: '(with adi-1-226-17)

    '
adi-1-226-31:
  ganguli: 1 CCIX
  text: 'The whole city became radiant, as it were, with the gay throng of sight-seers animated by curiosity.

    '
  modern: 'The whole city seemed to shine with the cheerful crowd of sightseers, stirred by curiosity.

    '
adi-1-226-42:
  ganguli: 1 CCIX
  text: 'At last, at the command of Dhritarashtra they entered the chambers that had been assigned to them.

    '
  modern: 'At last, at Dhṛtarāṣṭra''s command, they entered the chambers that had been assigned to them.

    '
adi-1-227-11:
  ganguli: 1 CCIX
  text: 'After they had rested there for some time, they were summoned (to the court) by king Dhritarashtra and Bhishma, the son of Santanu.

    '
  modern: 'After they had rested for some time, they were summoned to the court by King Dhṛtarāṣṭra and Bhīṣma, the son of Śāntanu.

    '
adi-1-227-12:
  ganguli: 1 CCIX
  text: 'When they came, king Dhritarashtra addressing Yudhishthira, said, ''Listen, O son of Kunti, with thy brothers, to what I say.

    '
  modern: 'When they came, King Dhṛtarāṣṭra said to Yudhiṣṭhira, "Listen, O son of Kuntī, you and your brothers, to what I say.

    '
adi-1-227-17:
  ganguli: 1 CCIX
  text: 'Protected by Partha (Arjuna), like the celestials by the thunderbolt, reside ye at Khandavaprastha, taking half of the kingdom.

    '
  modern: 'Live at Khāṇḍavaprastha, protected by Pārtha (Arjuna) as the celestials are protected by the thunderbolt, and take half of the kingdom."

    '
adi-1-227-49:
  ganguli: 1 CCIX
  speaker: Vaisampayana continued
  text: 'Agreeing to what Dhritarashtra said, those bulls among men worshipping the king set out from Hastinapura.

    '
  modern: 'Agreeing to what Dhṛtarāṣṭra said, those bulls among men honored the king and set out from Hāstinapura.

    '
  speakerModern: 'Vaiśampāyana continued:'
adi-1-227-50:
  ganguli: 1 CCIX
  text: 'And content with half the kingdom, they removed to Khandavaprastha, which was in unreclaimed desert.

    '
  modern: 'Content with half the kingdom, they moved to Khāṇḍavaprastha, which was an unreclaimed wilderness.

    '
adi-1-227-53:
  ganguli: 1 CCIX
  text: 'Then those heroes of unfading splendour, viz., the Pandavas, with Krishna at their head, arriving there, beautified the place and made it a second heaven.

    '
  modern: 'Then those heroes of unfading splendor, the Pāṇḍavas, with Kṛṣṇā at their head, arrived there, made the place beautiful, and turned it into a second heaven.

    '
adi-1-227-55:
  ganguli: 1 CCIX
  text: 'And decked with innumerable mansions, the city became like unto Amaravati and came to be called Indraprastha (like unto Indra''s city).

    '
  modern: 'Decked with countless mansions, the city became like Amarāvatī and came to be called Indraprastha (like Indra''s city).

    '
adi-1-227-59:
  ganguli: 1 CCIX
  text: 'And those mighty car-warriors, selecting with Dwaipayana''s assistance a sacred and auspicious region, performed certain propitiatory ceremonies and measured out a piece of land for their city.

    '
  modern: 'And those mighty warriors, choosing with Dvaipāyana''s help a sacred and auspicious region, performed certain rites to ensure success and measured out a piece of land for their city.

    '
adi-1-227-60:
  ganguli: 1 CCIX
  text: 'Then surrounded by a trench wide as the sea and by walls reaching high up to the heavens and white as the fleecy clouds or the rays of the moon, that foremost of cities looked resplendent like Bhogavati (the capital of the nether kingdom) decked with the Nagas.

    '
  modern: 'Then, surrounded by a trench as wide as the sea and by walls reaching up to the heavens and as white as fleecy clouds or the rays of the moon, that foremost of cities shone like Bhogavatī, the capital of the nether world, decked with the Nāgas.

    '
adi-1-227-68:
  ganguli: 1 CCIX
  text: 'When the city was built, there came, O king, numerous Brahmanas well-acquainted with all the Vedas and conversant with every language, wishing to dwell there.

    '
  modern: 'When the city was built, O king, many Brāhmaṇas came who knew all the Vedas and every language, wishing to live there.

    '
adi-1-227-69:
  ganguli: 1 CCIX
  text: 'And there came also unto that town numerous merchants from every direction, in the hope of earning wealth.

    '
  modern: 'And many merchants came to that town from every direction, hoping to earn wealth.

    '
adi-1-227-70:
  ganguli: 1 CCIX
  text: 'There also came numerous persons well-skilled in all the arts, wishing to take up their abode there. And around the city were laid out many delightful gardens adorned with numerous trees bearing both fruits and flowers.

    '
  modern: 'Many people skilled in all the arts also came, wishing to settle there. And around the city many delightful gardens were laid out, adorned with numerous trees bearing fruits and flowers.

    '
adi-1-227-78:
  ganguli: 1 CCIX
  text: 'And there were many delicious pools overgrown with fine aquatic plants. And there were also diverse ponds of great beauty and large dimension.

    '
  modern: 'There were many lovely pools overgrown with fine water plants, and many large and beautiful ponds as well.

    '
adi-1-247-36:
  ganguli: 1 CCXXIII
  text: 'Those illustrious heroes of the Kuru, the Vrishni, and the Andhaka races passed their days in pleasure and merriment there like virtuous men (after death) in the celestial regions. The Kurus and the Vrishnis with joyous hearts amused themselves there, setting up at times loud shouts mingled with clappings of the hand.

    '
  modern: 'Those illustrious heroes of the Kuru, Vṛṣṇi, and Andhaka races spent their days there in pleasure and merriment, like virtuous men in the celestial regions after death. The Kurus and the Vṛṣṇis amused themselves with joyful hearts, now and then raising loud shouts mixed with clapping of hands.

    '
adi-1-247-62:
  ganguli: 1 CCXXIII
  text: 'Then Subhadra, the favourite sister of Kesava, gave birth to an illustrious son, like Puloma''s daughter, (the queen of heaven) bringing forth Jayanta. And the son that Subhadra brought forth was of long arms, broad chest, and eyes as large as those of a bull.

    '
  modern: 'Then Subhadrā, Keśava''s favorite sister, gave birth to an illustrious son, as Puloman''s daughter, the queen of heaven, bore Jayanta. The son Subhadrā brought forth had long arms, a broad chest, and eyes as large as a bull''s.

    '
adi-1-247-73:
  ganguli: 1 CCXXIII
  text: 'Like Maghavat beholding Arjuna, the latter beheld his son Abhimanyu and became exceedingly happy.

    '
  modern: 'As Maghavat looked on Arjuna, so Arjuna looked on his son Abhimanyu and was exceedingly happy.

    '
adi-1-247-75:
  ganguli: 1 CCXXIII
  text: 'Prativindhya by Yudhishthira, Sutasoma by Vrikodara, Srutakarman by Arjuna, Satanika by Nakula, and Srutasena by Sahadeva,--these were the five heroes and great warriors that Panchali brought forth, like Aditi bringing forth the Adityas.

    '
  modern: 'These were the five heroes and great warriors that Pāñcālī bore, as Aditi bore the Ādityas: Prativindhya by Yudhiṣṭhira, Sutasoma by Vṛkodara, Śrutakarman by Arjuna, Śatānīka by Nakula, and Śrutasena by Sahadeva.

    '
adi-1-247-76:
  ganguli: 1 CCXXIII
  text: '(with adi-1-247-75)

    '
adi-1-247-85:
  ganguli: 1 CCXXIII
  text: 'And, O tiger among kings, the Pandavas, having obtained sons all of whom were equal unto the children of the celestials and endued with broad chests, and all of whom became great warriors, were filled with joy.

    '
  modern: 'And, O tiger among kings, the Pāṇḍavas, having sons who were all equal to the children of the celestials, broad-chested, and all great warriors, were filled with joy.

    '
adi-1-248-14:
  ganguli: 1 CCXXIV
  text: 'After a few days, Vibhatsu, addressing Krishna, said, ''The summer days have set in, O Krishna! Therefore, let us go to the banks of the Yamuna. O slayer of Madhu, sporting there in the company of friends, we will, O Janardana, return in the evening''.

    '
  modern: 'After a few days Bībhatsu said to Kṛṣṇa, "The summer days have come, O Kṛṣṇa! So let us go to the bank of the Yamunā. O slayer of Madhu, we will play there with our friends, O Janārdana, and come back in the evening."

    '
adi-1-248-17:
  ganguli: 1 CCXXIV
  speaker: Vaisampayana continued
  text: 'Then, O Bharata, having consulted thus with each other, Partha and Govinda, with Yudhishthira''s leave, set out, surrounded by friends.

    '
  modern: 'Then, O Bharata, having talked it over, Pārtha and Govinda set out, surrounded by friends, with Yudhiṣṭhira''s leave.

    '
  speakerModern: 'Vaiśampāyana continued:'
adi-1-248-40:
  ganguli: 1 CCXXIV
  text: 'O monarch, the high-souled Krishna, and that subjugators of hostile cities, viz., Arjuna, going thither, sat down upon two very costly seats.

    '
  modern: 'O monarch, the high-souled Kṛṣṇa and Arjuna, subduer of hostile cities, went there and sat down on two very costly seats.

    '
adi-1-248-42:
  ganguli: 1 CCXXIV
  text: 'Unto Vasudeva and Dhananjaya happily sitting there like the Aswins in heaven, a certain Brahmana came.

    '
  modern: 'As Vāsudeva and Dhanañjaya sat there happily, like the Aśvins in heaven, a certain Brāhmaṇa came to them.

    '
adi-1-249-1:
  ganguli: 1 CCXXV
  speaker: Vaisampayana said
  text: 'Then that Brahmana addressed Arjuna and Vasudeva of the Satwata race, saying, ''Ye who are now staying so near unto Khandava are the two foremost of heroes on earth.

    '
  modern: 'That Brāhmaṇa spoke to Arjuna and Vāsudeva of the Sātvata race: "You who are staying so near Khāṇḍava are the two foremost heroes on earth.

    '
  speakerModern: 'Vaiśampāyana said:'
adi-1-249-2:
  ganguli: 1 CCXXV
  text: 'I am a voracious Brahmana that always eateth much. O thou of the Vrishni race, and O Partha, I solicit you to gratify me by giving me sufficient food.

    '
  modern: 'I am a voracious Brāhmaṇa who always eats a great deal. O you of the Vṛṣṇi race, and O Pārtha, I ask you to satisfy me by giving me enough food."

    '
adi-1-249-10:
  ganguli: 1 CCXXV
  text: 'I have now come to you--you who are both skilled in weapons! If you help me I will surely consume this forest: for even this is the food that is desired by me!

    '
  modern: 'I have now come to you, who are both skilled in weapons! If you help me, I will surely burn this forest, for that is the food I want!"

    '
adi-1-251-9:
  ganguli: 1 CCXXVII
  text: 'And it was always worshipped both by the celestials and the Gandharvas. Varuna also gave two inexhaustible quivers, …

    '
  modern: 'And it was always worshipped by the celestials and the Gandharvas. Varuṇa also gave two inexhaustible quivers, …

    '
adi-1-251-10:
  ganguli: 1 CCXXVII
  text: '… and he also gave a car furnished with celestial weapons and whose banner bore a large ape. Yoked unto that car were steeds white as silver of the fleecy clouds, and born in the region of the Gandharvas, and decked with golden harness, and resembling in fleetness the wind or the mind.

    '
  modern: '… and a chariot furnished with celestial weapons, whose banner bore a large ape. Yoked to that chariot were horses white as silver or fleecy clouds, born in the region of the Gandharvas, decked with golden harness, and as swift as the wind or the mind.

    '
adi-1-251-23:
  ganguli: 1 CCXXVII
  text: 'And having obtained that car and that bow, and the two inexhaustible quivers, the son of Kunti became glad and thought himself competent to assist at the task. And Pavaka then gave unto Krishna a discus with an iron pole attached to a hole in the centre.

    '
  modern: 'Having obtained that chariot, that bow, and the two inexhaustible quivers, the son of Kuntī became glad and thought himself able to help in the task. And Pāvaka gave Kṛṣṇa a discus with an iron pole fixed through a hole in its center.

    '
adi-1-251-29:
  ganguli: 1 CCXXVII
  text: 'Then Arjuna and Achyuta, filled with joy said unto Pavaka, ''O exalted one, furnished with weapons and knowing their use, possessed of cars with flags and flagstaffs, we are now able to fight with even all the celestials and the Asuras (together), let alone the wielder of the thunderbolt desirous of fighting for the sake of the Naga (his friend Takshaka).

    '
  modern: 'Then Arjuna and Acyuta, filled with joy, said to Pāvaka, "O exalted one, we have weapons and know how to use them, and we have chariots with flags and flagstaffs. We are now able to fight even all the celestials and Asuras together, let alone the wielder of the thunderbolt, who wants to fight for the Nāga (his friend Takṣaka)."

    '
adi-1-251-33:
  ganguli: 1 CCXXVII
  text: 'Therefore, O lord, blaze thou forth as thou likest, surrounding this large forest on every side. We are quite able to help thee.

    '
  modern: 'So, O lord, blaze forth as you like, surrounding this large forest on every side. We are quite able to help you."

    '
adi-1-251-35:
  ganguli: 1 CCXXVII
  speaker: Vaisampayana continued
  text: 'Thus addressed both by Dasarha and Arjuna, the illustrious god then put forth his most energetic form, and prepared to consume the forest.

    '
  modern: 'Thus addressed by Dāśārha and Arjuna, the illustrious god put forth his most energetic form and prepared to burn the forest.

    '
  speakerModern: 'Vaiśampāyana continued:'
adi-1-251-36:
  ganguli: 1 CCXXVII
  text: 'Surrounding it on all sides with his seven flames, he began to consume the forest of Khandava, exhibiting his all-consuming form like that at the end of the Yuga (cycle). …

    '
  modern: 'Surrounding it on all sides with his seven flames, he began to burn the forest of Khāṇḍava, showing his all-consuming form like that at the end of the yuga. …

    '
adi-1-252-17:
  ganguli: 1 CCXXVIII
  speaker: Vaisampayana continued
  text: 'Hearing these words of the gods, and himself beholding what Agni was doing, the slayer of Vritra set out for the protection of the forest of Khandava.

    '
  modern: 'Hearing these words of the gods, and himself seeing what Agni was doing, the slayer of Vṛtra set out to protect the forest of Khāṇḍava.

    '
  speakerModern: 'Vaiśampāyana continued:'
adi-1-253-46:
  ganguli: 1 CCXXIX
  speaker: Vaisampayana said
  text: 'Then Vibhatsu, the son of Pandu, invoking his excellent weapons, prevented that shower of rain by Indra, by means of a shower of his own weapons.

    '
  modern: 'Then Bībhatsu, the son of Pāṇḍu, called on his excellent weapons and stopped Indra''s shower of rain with a shower of his own weapons.

    '
  speakerModern: 'Vaiśampāyana said:'
adi-1-254-47:
  ganguli: 1 CCXXX
  text: 'And while the forest burned Agni spared only six of its dwellers, viz., Aswasena, Maya, and four birds called Sarngakas.

    '
  modern: 'And while the forest burned, Agni spared only six of its dwellers: Aśvasena, Maya, and four birds called Śārṅgakas.

    '
adi-1-260-15:
  ganguli: 1 CCXXXVI
  text: 'Agni also, having burnt that forest with its animals and birds for five and ten days, became gratified and ceased to burn.

    '
  modern: 'Agni, having burned that forest with its animals and birds for fifteen days, was satisfied and stopped burning.

    '
  departs: The Sanskrit says ekaviṃśadbhir ahobhiḥ, twenty-one days, not fifteen.
adi-1-260-20:
  ganguli: 1 CCXXXVI
  text: '(with adi-1-260-21)

    '
adi-1-260-21:
  ganguli: 1 CCXXXVI
  text: 'Thus addressed by the illustrious Agni, Arjuna and Vasudeva and the Danava Maya also--these three,--having wandered a little at last sat themselves down on the delightful banks of a river.

    '
  modern: 'Thus addressed by the illustrious Agni, Arjuna, Vāsudeva, and the Dānava Maya, after wandering a little, at last sat down on the delightful bank of a river.

    '
sabha-2-1-6:
  ganguli: 2 I
  speaker: Vaisampayana said
  text: 'Then, in the presence of Vasudeva, Maya Danava, having worshipped Arjuna, repeatedly spoke unto him with joined hands and in amiable words,--''O son of Kunti, saved have I been by thee from this Krishna in spate and from Pavaka (fire) desirous of consuming me.

    '
  modern: 'Then, in Vāsudeva''s presence, the Dānava Maya honored Arjuna and spoke to him again and again with joined hands and friendly words: "O son of Kuntī, you have saved me from this Kṛṣṇa in flood and from Pāvaka (fire), who wanted to burn me.

    '
  speakerModern: 'Vaiśampāyana said:'
sabha-2-1-8:
  ganguli: 2 I
  text: 'Tell me what I have to do for thee.

    '
  modern: 'Tell me what I may do for you."

    '
sabha-2-1-21:
  ganguli: 2 I
  text: 'Krishna, the Lord of the universe and the Creator of every object, having reflected in his mind, thus commanded Maya,--''Let a palatial sabha (meeting hall) as thou choosest, be built (by thee), if thou, O son of Diti, who art the foremost of all artists, desirest to do good to Yudhishthira the just.

    '
  modern: 'Kṛṣṇa, the Lord of the universe and creator of every object, thought it over and commanded Maya: "Build a palatial hall (sabhā) of your own choosing, O son of Diti, foremost of all artists, if you wish to do good to Yudhiṣṭhira the just.

    '
sabha-2-2-2:
  ganguli: 2 II
  speaker: Vaisampayana said
  text: 'Janardana deserving the worship of all, having lived happily at Khandavaprastha for some time, and having been treated all the while with respectful love and affection by the sons of Pritha, became desirous one day of leaving Khandavaprastha to behold his father.

    '
  modern: 'After living happily at Khāṇḍavaprastha for some time, treated all the while with respectful love by the sons of Pṛthā, Janārdana, who deserves the worship of all, wished one day to leave Khāṇḍavaprastha and see his father.

    '
  speakerModern: 'Vaiśampāyana said:'
sabha-2-3-21:
  ganguli: 2 III
  text: 'Bringing them, the Asura constructed therewith a peerless palace, which was of great beauty and of celestial make, composed entirely of gems and precious stones, and celebrated throughout the three worlds.

    '
  modern: 'Bringing them, the Asura built with them a peerless palace of great beauty and celestial make, made entirely of gems and precious stones and famed throughout the three worlds.

    '
sabha-2-4-1:
  ganguli: 2 III
  text: 'And eight thousand Rakshasas called Kinkaras, fierce, huge-bodied and endued with great strength, of red coppery eyes and arrowy ears, well-armed and capable of ranging through the air, used to guard and protect that palace.

    '
  modern: 'Eight thousand Rākṣasas called Kiṅkaras, fierce, huge-bodied and very strong, with red coppery eyes and arrow-shaped ears, well armed and able to range through the air, guarded and protected that palace.

    '
sabha-2-5-1:
  ganguli: 2 V
  speaker: Vaisampayana said
  text: 'While the illustrious Pandavas were seated in that Sabha along with the principal Gandharvas, there came, O Bharata, unto that assembly the celestial Rishi Narada …

    '
  modern: 'While the illustrious Pāṇḍavas were seated in that hall with the chief Gandharvas, the celestial ṛṣi Nārada came to the assembly, O Bharata. …

    '
  speakerModern: 'Vaiśampāyana said:'
sabha-2-5-19:
  ganguli: 2 V
  text: 'Receiving that worship from Yudhishthira in proper form, the Rishi became gratified. Thus worshipped by the Pandavas and the great Rishis, Narada possessing a complete mastery over the Vedas, said unto Yudhishthira the following words bearing upon religion, wealth, pleasures and salvation.

    '
  modern: 'Receiving that worship from Yudhiṣṭhira in the proper form, the ṛṣi was pleased. Thus honored by the Pāṇḍavas and the great ṛṣis, Nārada, who had complete mastery of the Vedas, spoke these words to Yudhiṣṭhira on religion, wealth, pleasure, and liberation.

    '
sabha-2-5-20:
  ganguli: 2 V
  speaker: Narada said
  text: '"Narada said--''Is the wealth thou art earning being spent on proper objects? Doth thy mind take pleasure in virtue? Art thou enjoying the pleasures of life? Doth not thy mind sink under their weight?

    '
  modern: 'Is the wealth you earn spent on proper objects? Does your mind take pleasure in virtue? Are you enjoying the pleasures of life? Does your mind not sink under their weight?

    '
  speakerModern: 'Nārada said:'
sabha-2-5-30:
  ganguli: 2 V
  text: 'And, O hero, hast thou made persons like thyself, persons that are old, continent in behaviour, capable of understanding what should be done and what should not, pure as regards birth and blood, and devoted to thee, thy ministers?

    '
  modern: 'And, O hero, have you made your ministers persons like yourself: old, disciplined in behavior, able to understand what should and should not be done, pure in birth and blood, and devoted to you?

    '
sabha-2-5-39:
  ganguli: 2 V
  text: 'Are thy forts always filled with treasure, food, weapons, water, engines and instruments, as also with engineers and bowmen?

    '
  modern: 'Are your forts always filled with treasure, food, weapons, water, machines and instruments, and with engineers and archers?

    '
sabha-2-5-43:
  ganguli: 2 V
  text: 'Is the priest thou honourest, possessed of humility, and purity of blood, and renown, and without jealousy and illiberality?

    '
  modern: 'Is the priest you honor humble, of pure blood and good repute, and free from jealousy and illiberality?

    '
sabha-2-5-52:
  ganguli: 2 V
  text: 'Givest thou to thy troops their sanctioned rations and pay in the appointed time? Thou dost not oppress them by withholding these?

    '
  modern: 'Do you give your troops their fixed rations and pay at the proper time? You do not oppress them by withholding these?

    '
sabha-2-5-57:
  ganguli: 2 V
  text: 'I hope thou rewardest persons of learning and humility, and skill in every kind of knowledge with gifts of wealth and honour proportionate to their qualifications.

    '
  modern: 'I hope you reward men of learning and humility and skill in every kind of knowledge with gifts of wealth and honor in proportion to their qualifications.

    '
sabha-2-5-58:
  ganguli: 2 V
  text: 'Dost thou support, O bull in the Bharata race, the wives and children of men that have given their lives for thee and have been distressed on thy account?

    '
  modern: 'Do you support, O bull of the Bharata race, the wives and children of men who gave their lives for you and were left in distress on your account?

    '
sabha-2-5-74:
  ganguli: 2 V
  text: 'Is thy expenditure always covered by a fourth, a third or a half of thy income?

    '
  modern: 'Is your expenditure always covered by a quarter, a third, or a half of your income?

    '
sabha-2-5-75:
  ganguli: 2 V
  text: 'Cherishest thou always, with food and wealth, relatives, superiors, merchants, the aged, and other proteges, and the distressed?

    '
  modern: 'Do you always support with food and wealth your relatives, elders, merchants, the aged, and other dependents, and the distressed?

    '
sabha-2-5-77:
  ganguli: 2 V
  text: 'Dismissest thou without fault servants accomplished in business and popular and devoted to thy welfare?

    '
  modern: 'Do you dismiss without fault servants who are skilled in business, popular, and devoted to your welfare?

    '
sabha-2-5-81:
  ganguli: 2 V
  text: 'Are large tanks and lakes constructed all over thy kingdom at proper distances, without agriculture being in thy realm entirely dependent on the showers of heaven?

    '
  modern: 'Have large tanks and lakes been built all over your kingdom at proper distances, so that your farming does not depend entirely on the rains of heaven?

    '
sabha-2-5-83:
  ganguli: 2 V
  text: 'O child, are the four professions of agriculture, trade, cattle-rearing, and lending at interest, carried on by honest men? Upon these O monarch, depends the happiness of thy people.

    '
  modern: 'O child, are the four occupations of farming, trade, cattle rearing, and lending at interest carried on by honest men? The happiness of your people depends on them, O monarch.

    '
sabha-2-5-123:
  ganguli: 2 V
  text: 'Is any servant of thine, who hath accomplished well a particular business by the employment of special ability, disappointed in obtaining from thee a little more regard, and an increase of food and pay?

    '
  modern: 'Is any servant of yours who has done a particular task well, by his special ability, disappointed in getting from you a little more regard and an increase of food and pay?

    '
sabha-2-5-127:
  ganguli: 2 V
  text: 'Protectest thou thy kingdom from the fear of fire, of snakes and other animals destructive of life, of disease, and Rakshasas?

    '
  modern: 'Do you protect your kingdom from the danger of fire, of snakes and other deadly animals, of disease, and of Rākṣasas?

    '
sabha-2-5-128:
  ganguli: 2 V
  text: 'As acquainted thou art with every duty, cherishest thou like a father, the blind, the dumb, the lame, the deformed, the friendless, and ascetics that have no homes.

    '
  modern: 'Knowing every duty, do you care like a father for the blind, the dumb, the lame, the deformed, the friendless, and ascetics who have no homes?

    '
sabha-2-5-129:
  ganguli: 2 V
  text: 'Hast thou banished these six evils, O monarch, viz., sleep, idleness, fear, anger, weakness of mind, and procrastination?

    '
  modern: 'Have you banished these six evils, O monarch: sleep, idleness, fear, anger, weakness of mind, and delay?"

    '
sabha-2-12-28:
  ganguli: 2 XII
  text: 'O king of the Kuru race, O son of Kunti, thy father Pandu, beholding the good fortune of Harischandra and wondering much thereat, hath told thee something.

    '
  modern: 'O king of the Kuru race, O son of Kuntī, your father Pāṇḍu, seeing Hariścandra''s good fortune and wondering greatly at it, has told you something.

    '
sabha-2-12-30:
  ganguli: 2 XII
  text: '… Thou shouldst tell Yudhishthira, O Rishi, that he can subjugate the whole Earth inasmuch as his brothers are all obedient to him. And having done this let him commence the grand sacrifice called Rajasuya.

    '
  modern: '… Tell Yudhiṣṭhira, O ṛṣi, that he can conquer the whole earth, since his brothers are all obedient to him. And when he has done this, let him begin the great sacrifice called the Rājasūya.

    '
sabha-2-13-1:
  ganguli: 2 XIII
  speaker: Vaisampayana said
  text: 'Yudhishthira, having heard these words of Narada, began to sigh heavily.

    '
  modern: 'Hearing these words of Nārada, Yudhiṣṭhira began to sigh heavily.

    '
  speakerModern: 'Vaiśampāyana said:'
sabha-2-13-46:
  ganguli: 2 XIII
  text: '… Yudhishthira, the son of Pritha, having come to this settled resolution soon sent a messenger unto that master of all beings, conveying through him blessings and speeches such as one senior in age might send to one that is younger. And that messenger riding in a swift car arrived amongst the Yadavas and approached Krishna who was then residing in Dwaravati.

    '
  modern: '… Yudhiṣṭhira, the son of Pṛthā, soon sent a messenger to that master of all beings, conveying through him the blessings and words one elder might send to a younger. The messenger, riding in a swift car, arrived among the Yādavas and approached Kṛṣṇa, who was then living in Dvāravatī.

    '
sabha-2-26-11:
  ganguli: 2 XXV
  text: 'And Bhimasena also, and those bull among men, the twins, dismissed with affection by Yudhishthira the just set out, each at the head of a large army. And Arjuna, the son of the chastiser of Paka then brought under subjugation that direction (the North) which was presided over by the Lord of treasures.

    '
  modern: 'And Bhīmasena and those bulls among men, the twins, sent off affectionately by Yudhiṣṭhira the just, set out, each at the head of a large army. And Arjuna, the son of the chastiser of Pāka, brought under his sway the direction (the North) that is ruled by the Lord of treasures.

    '
sabha-2-26-12:
  ganguli: 2 XXV
  text: 'And Bhimasena overcome by force the East and Sahadeva the South, and Nakula, O king, acquainted with all the weapons, conquered the West.

    '
  modern: 'And Bhīmasena conquered the East by force, Sahadeva the South, and Nakula, O king, who knew all weapons, the West.

    '
sabha-2-36-13:
  ganguli: 2 XXXII
  text: 'And Madhava, that tiger among men enhancing that limitless mass of wealth the Pandavas had by that inexhaustible ocean of gems he had brought, enhanced the sorrows of the enemies of the Pandavas.

    '
  modern: 'And Madhava, that tiger among men, added to the Pāṇḍavas'' limitless wealth with the inexhaustible ocean of gems he had brought, and added to the sorrows of the Pāṇḍavas'' enemies.

    '
sabha-2-36-13#2:
  ganguli: 2 XXXII
  text: '(with sabha-2-36-13)

    '
sabha-2-36-18:
  ganguli: 2 XXXII
  text: 'O Krishna it is for thee that the whole earth is under my sway. And, O thou of the Vrishni race, it is through thy grace that vast wealth had been got by me.

    '
  modern: '"O Kṛṣṇa, it is for you that the whole earth is under my sway. And, O you of the Vṛṣṇi race, it is by your grace that I have gained vast wealth.

    '
sabha-2-36-22:
  ganguli: 2 XXXII
  text: 'Or, O exalted one, grant permission for myself being installed at the sacrifice along with these my younger brothers, for permitted by thee, O Krishna.

    '
  modern: 'Or, O exalted one, grant me permission to be installed at the sacrifice with my younger brothers, since I would be permitted by you, O Kṛṣṇa.

    '
sabha-2-36-24:
  ganguli: 2 XXXII
  text: 'I am always engaged in seeking good. Perform thou then the sacrifice thou desirest. Employ me also in some office for that purpose, for I should obey all thy commands.

    '
  modern: 'I am always working for good. Perform the sacrifice you desire. Employ me too in some office for that purpose, for I will obey all your commands."

    '
sabha-2-36-26:
  ganguli: 2 XXXII
  speaker: Vaisampayana continued
  text: 'Commanded by Krishna, the son of Pandu along with his brothers set himself upon collecting the materials for the performance of the Rajasuya sacrifice.

    '
  modern: 'Commanded by Kṛṣṇa, the son of Pāṇḍu and his brothers set about collecting the materials for the Rājasūya sacrifice.

    '
  speakerModern: 'Vaiśampāyana continued:'
sabha-2-36-43:
  ganguli: 2 XXXII
  text: '… Endued with speed, these messengers then, thus commanded, invited everybody according to the orders of the Pandava, without losing any time, and brought with them many persons, both friends and strangers.

    '
  modern: '… Swiftly, as commanded, the messengers invited everybody at the Pāṇḍava''s order without delay, and brought with them many people, both friends and strangers.

    '
sabha-2-36-44:
  ganguli: 2 XXXII
  text: 'Then that bull among men, king Yudhishthira despatched Nakula the son of Pandu unto Hastinapura to bring Bhishma and Drona, Dhritarashtra and Vidura and Kripa and those amongst his cousins that were well-disposed towards him. …

    '
  modern: 'Then that bull among men, King Yudhiṣṭhira, sent Nakula, son of Pāṇḍu, to Hāstinapura to bring Bhīṣma, Droṇa, Dhṛtarāṣṭra, Vidura, Kṛpa, and those of his cousins who were well disposed toward him. …

    '
sabha-2-36-47:
  ganguli: 2 XXXII
  text: 'Then, O Bharata, the Brahmanas at the proper time installed Yudhishthira the son of Kunti at the Rajasuya sacrifice. And after the ceremony of installation was over, that foremost of men, the virtuous king Yudhishthira the just like the god Dharma himself in human frame, entered the sacrificial compound, surrounded by thousands of Brahmanas and his brothers and the relatives and friends and counsellors, and by a large number of Kshatriya kings who had come from various countries, and by the officers of State.

    '
  modern: 'Then, O Bharata, at the proper time the Brāhmaṇas installed Yudhiṣṭhira, son of Kuntī, at the Rājasūya sacrifice. When the installation was over, the virtuous King Yudhiṣṭhira, like the god Dharma himself in human form, entered the sacrificial compound, surrounded by thousands of Brāhmaṇas, his brothers, relatives, friends, and counselors, a large number of Kṣatriya kings who had come from various countries, and the officers of state.

    '
sabha-2-36-48:
  ganguli: 2 XXXIII
  text: '(with sabha-2-36-47)

    '
sabha-2-39-45:
  ganguli: 2 XXXV
  text: 'Vaisampayana continued,--Then, O Bharata, Bhishma the son of Santanu, judged it by his intelligence that on earth Krishna was the foremost of all.

    '
  modern: 'Then, O Bharata, Bhīṣma, the son of Śāntanu, judged with his intelligence that Kṛṣṇa was the foremost of all on earth.

    '
sabha-2-39-46:
  ganguli: 2 XXXV
  speaker: And he said
  text: 'As is the sun among all luminous objects, so is the one (meaning Krishna) (who shines like the sun) among us all, in consequence of his energy, strength and prowess. And this our sacrificial mansion is illuminated and gladdened by him as a sunless region by the sun, or a region of still air by a gust of breeze.

    '
  modern: 'As the sun is among all shining things, so is this one (meaning Kṛṣṇa) among us all, in energy, strength, and prowess. And this sacrificial hall of ours is lit up and gladdened by him, as a sunless region by the sun, or a place of still air by a gust of wind."

    '
  speakerModern: 'And he said:'
sabha-2-39-48:
  ganguli: 2 XXXV
  text: 'Thus commanded by Bhishma, Sahadeva endued with great prowess duly presented the first Arghya of excellent ingredients unto Krishna of the Vrishni race.

    '
  modern: 'Thus commanded by Bhīṣma, the very powerful Sahadeva duly presented the first arghya, of excellent ingredients, to Kṛṣṇa of the Vṛṣṇi race.

    '
sabha-2-39-51:
  ganguli: 2 XXXV
  text: 'Krishna also accepted it according to the forms of the ordinance. But Sisupala could not bear to see that worship offered unto Vasudeva.

    '
  modern: 'Kṛṣṇa also accepted it according to the rules. But Śiśupāla could not bear to see that worship offered to Vāsudeva.

    '
sabha-2-39-57:
  ganguli: 2 XXXVI
  text: 'How doth he of the Dasarha race, who is not even a king, accept worship before these kings and how is it that he hath been worshipped by ye?

    '
  modern: 'How can he of the Daśārha race, who is not even a king, accept worship before these kings, and how is it that you have worshipped him?

    '
sabha-2-40-25:
  ganguli: 2 XXXVI
  text: 'If the helpless sons of Kunti were affrighted and disposed to meanness, thou, O Madhava, ought to have enlightened them as to thy claims to the first worship?

    '
  modern: 'If the helpless sons of Kuntī were frightened and inclined to meanness, you, O Mādhava, should have explained to them your claim to the first worship.

    '
sabha-2-40-27:
  ganguli: 2 XXXVI
  text: 'Thou thinkest much of the worship unworthily offered unto thee, like a dog that lappeth in solitude a quantity of clarified butter that it hath obtained.

    '
  modern: 'You think much of the worship unworthily offered to you, like a dog lapping up in private a quantity of clarified butter it has found.

    '
sabha-2-68-2:
  ganguli: 2 XLIV
  text: 'Vaisampayana said,--Hearing these words of Bhishma, the ruler of Chedi endued with exceeding prowess, desirous of combating with Vasudeva addressed him and said,--O Janarddana, I challenge thee. Come, fight with me until I slay thee today with all the Pandavas.

    '
  modern: 'Hearing these words of Bhīṣma, the very powerful ruler of Cedi, wanting to fight Vāsudeva, said to him, "O Janārdana, I challenge you. Come and fight me until I kill you today along with all the Pāṇḍavas.

    '
sabha-2-68-6:
  ganguli: 2 XLIV
  text: 'Having said this, that tiger among kings stood there roaring in anger.

    '
  modern: 'Having said this, that tiger among kings stood there roaring in anger.

    '
sabha-2-70-50:
  ganguli: 2 XLIV
  text: 'Having said this, the chief of the Yadus, that slayer of all foes, in anger, instantly cut off the head of the ruler of Chedi by means of his discus. And the mighty-armed one fell down like a cliff struck with thunder.

    '
  modern: 'Having said this, the chief of the Yadus, that slayer of all foes, in anger instantly cut off the ruler of Cedi''s head with his discus. And the mighty-armed one fell down like a cliff struck by thunder.

    '
sabha-2-71-1:
  ganguli: 2 XLIV
  text: 'Then that sacrifice, O monarch, of the king of the Kurus possessed of great energy, blessed with every kind of prosperity, became exceedingly handsome and pleasing unto all young men. And commenced auspiciously, and all impediments removed, and furnished with abundance of wealth and corn, as also with plenty of rice and every kind of food, it was properly watched by Kesava.

    '
  modern: 'Then that sacrifice, O monarch, of the king of the Kurus, a man of great energy, blessed with every kind of prosperity, became very handsome and pleasing to all the young men. Begun auspiciously, with all obstacles removed and supplied with plenty of wealth and grain, rice and every kind of food, it was properly watched over by Keśava.

    '
sabha-2-72-9:
  ganguli: 2 XLIV
  text: 'And all the Kshatriya monarchs, having approached the virtuous Yudhishthira who had bathed after the conclusion of the sacrifice, said these words …

    '
  modern: 'And all the Kṣatriya kings approached the virtuous Yudhiṣṭhira, who had bathed after the end of the sacrifice, and said these words …

    '
sabha-2-72-10:
  ganguli: 2 XLIV
  text: 'By good fortune thou hast come out successful. O virtuous one, thou hast obtained the imperial dignity. O thou of the Ajamida race, by thee hath been spread the fame of thy whole race.

    '
  modern: 'By good fortune you have come out successful. O virtuous one, you have obtained the imperial dignity. O you of the Ajamīḍha race, you have spread the fame of your whole race.

    '
sabha-2-72-11:
  ganguli: 2 XLIV
  text: 'And, O king of kings, by this act of thine, thou hast also acquired great religious merit. We have been worshipped by thee to the full extent of our desires.

    '
  modern: 'And, O king of kings, by this act you have also earned great religious merit. We have been honored by you to the full extent of our wishes.

    '
sabha-2-72-12:
  ganguli: 2 XLIV
  text: 'We now tell thee that we are desirous of returning to our own kingdoms. It behoveth thee to grant us permission.

    '
  modern: 'We now tell you that we wish to return to our own kingdoms. Please give us permission."

    '
sabha-2-72-15:
  ganguli: 2 XLIV
  text: 'Hearing these words of their brother, the virtuous Pandava princes followed the kings, one after another as each deserved.

    '
  modern: 'Hearing these words of their brother, the virtuous Pāṇḍava princes followed the kings one after another, as each deserved.

    '
sabha-2-72-32:
  ganguli: 2 XLIV
  text: 'And Krishna and Yudhishthira having thus talked unto each other took each other''s leave and returned to their respective homes.

    '
  modern: 'And Kṛṣṇa and Yudhiṣṭhira, having talked together in this way, took leave of each other and went back to their own homes.

    '
sabha-2-73-35:
  ganguli: 2 XLV
  text: 'And Yudhishthira, upon beholding him quickly rose from his seat, surrounded by his brothers, and worshipped the Rishi who was his grand-father, with water to wash his feet and the offer of a seat.

    '
  modern: 'And Yudhiṣṭhira, seeing him, quickly rose from his seat, with his brothers around him, and honored the ṛṣi, who was his grandfather, with water to wash his feet and the offer of a seat.

    '
sabha-2-74-14:
  ganguli: 2 XLVI
  text: 'And beholding the monarch once more draw up his clothes to cross a piece of dry land which he had mistaken for water, they all laughed again.

    '
  modern: 'And seeing the king once more draw up his clothes to cross a piece of dry land that he had mistaken for water, they all laughed again.

    '
sabha-2-74-15:
  ganguli: 2 XLVI
  text: 'And, O monarch, king Duryodhana beholding that vast wealth in the Rajasuya sacrifice and having become the victim of those numerous errors within the assembly house at last returned, with the leave of the Pandavas, to Hastinapore.

    '
  modern: 'And, O monarch, King Duryodhana, having seen the vast wealth at the Rājasūya sacrifice and having been the victim of those many mistakes in the assembly hall, at last returned to Hāstinapura with the Pāṇḍavas'' leave.

    '
sabha-2-74-17:
  ganguli: 2 XLVI
  text: 'And beholding the Pandavas happy and all the kings of the earth paying homage to them, as also everybody, young and old, engaged in doing good unto them, and reflecting also on the splendour and prosperity of the illustrious sons of Pandu, Duryodhana, the son of Dhritarashtra, became pale.

    '
  modern: 'Seeing the Pāṇḍavas happy and all the kings of the earth paying homage to them, with everyone, young and old, busy doing good to them, and thinking of the splendor and prosperity of the illustrious sons of Pāṇḍu, Duryodhana, the son of Dhṛtarāṣṭra, grew pale.

    '
sabha-2-76-21:
  ganguli: 2 XLVIII
  speaker: Duryodhana said
  text: 'I eat and dress myself like a wretch and pass my time all the while a prey to fierce jealousy.

    '
  modern: 'I eat and dress like a wretch and pass my time all the while a prey to fierce jealousy.

    '
  speakerModern: 'Duryodhana said:'
sabha-2-76-25:
  ganguli: 2 XLVIII
  text: 'Having beheld Yudhishthira''s prosperity, whatever I enjoy brings me no gratification. The prosperity of Kunti''s son that is possessed of such splendour maketh me pale.

    '
  modern: 'Having seen Yudhiṣṭhira''s prosperity, whatever I enjoy gives me no satisfaction. The splendid prosperity of Kuntī''s son makes me pale.

    '
sabha-2-76-59:
  ganguli: 2 XLVIII
  text: 'Beholding all this I became feverish with jealousy.

    '
  modern: 'Seeing all this, I became feverish with jealousy.

    '
sabha-2-76-62:
  ganguli: 2 XLVII
  text: 'But, O king, I know the means by which Yudhishthira himself may be vanquished. Listen to me and adopt it.

    '
  modern: 'But, O king, I know the means by which Yudhiṣṭhira himself can be defeated. Listen to me and adopt it."

    '
sabha-2-76-63:
  ganguli: 2 XLVII
  text: 'I am skillful at dice. There is none equal to me in this respect on earth, no, not even in the three worlds, O son of Kuru.

    '
  modern: 'I am skilled at dice. There is no one equal to me in this on earth, no, not even in the three worlds, O son of Kuru.

    '
sabha-2-76-64:
  ganguli: 2 XLVII
  speaker: Sakuni said
  text: 'The son of Kunti is very fond of dice-play although he doth not know how to play. That king if asked to play, is ill able to refuse.

    '
  modern: 'The son of Kuntī is very fond of dice, although he does not know how to play. If he is asked to play, that king can hardly refuse.

    '
  speakerModern: 'Śakuni said:'
sabha-2-76-65:
  ganguli: 2 XLVII
  text: 'Therefore, ask him to play at dice. Skilled at dice, I will win his kingdom, and that splendid prosperity of his for thee, O bull among men.

    '
  modern: 'So ask him to play at dice. Skilled at dice, I will win his kingdom and that splendid prosperity of his for you, O bull among men.

    '
sabha-2-76-67:
  ganguli: 2 XLVII
  text: 'But, O Duryodhana, represent all this unto the king (Dhritarashtra). Commanded by thy father I will win without doubt the whole of Yudhishthira''s possessions.''

    '
  modern: 'But, O Duryodhana, put all this to the king (Dhṛtarāṣṭra). Commanded by your father, I will surely win all of Yudhiṣṭhira''s possessions.

    '
sabha-2-76-72:
  ganguli: 2 XLVIII
  speaker: Vaisampayana continued
  text: 'Dhritarashtra, hearing these words of affliction uttered by Duryodhana from mixed feeling, himself ready to what Duryodhana had dictated, commanded his servant …

    '
  modern: 'Hearing these words of distress from Duryodhana, and himself ready to do what Duryodhana asked, Dhṛtarāṣṭra, with mixed feelings, commanded his servant …

    '
  speakerModern: 'Vaiśampāyana continued:'
sabha-2-76-75:
  ganguli: 2 XLVIII
  text: 'And, O monarch, king Dhritarashtra having made this resolution for the pacification of Duryodhana, sent messengers unto Vidura for summoning him.

    '
  modern: 'And, O monarch, King Dhṛtarāṣṭra, having made this resolution to pacify Duryodhana, sent messengers to summon Vidura.

    '
sabha-2-76-76:
  ganguli: 2 XLVIII
  text: 'For without taking counsel with Vidura never did the monarch form any resolution. But as regards the matter at hand, the king although he knew the evils of gambling, was yet attracted towards it.

    '
  modern: 'For the king never made any resolution without taking counsel with Vidura. But in this matter, although he knew the evils of gambling, the king was drawn to it.

    '
sabha-2-76-77:
  ganguli: 2 XLVIII
  text: 'The intelligent Vidura, however, as soon as he heard of it, knew that the arrival of Kali was at hand. And seeing that the way to destruction was about to open, he quickly came to Dhritarashtra.

    '
  modern: 'The intelligent Vidura, as soon as he heard of it, knew that Kali''s arrival was at hand. Seeing that the way to destruction was about to open, he quickly came to Dhṛtarāṣṭra.

    '
sabha-2-76-79:
  ganguli: 2 XLVIII
  text: 'O exalted king, I do not approve of this resolution that thou hast formed. It behave thee, O king, to act in such a way that no dispute may arise between thy children on account of this gambling match.

    '
  modern: '"O exalted king, I do not approve of this resolution you have formed. You should act so that no dispute may arise between your children because of this gambling match."

    '
sabha-2-76-81:
  ganguli: 2 XLVIII
  text: 'Therefore, auspicious or otherwise, beneficial or otherwise, let this friendly challenge at dice proceed.

    '
  modern: 'So, whether it is auspicious or not, beneficial or not, let this friendly challenge at dice go forward.

    '
sabha-2-76-82:
  ganguli: 2 XLVIII
  text: 'And, O son of the Bharata race, when I am near, and Drona and Bhishma and thou too, nothing evil that even Fate might have ordained is likely to happen.

    '
  modern: 'And, O descendant of Bharata, when I am near, and Droṇa and Bhīṣma and you as well, nothing evil, even if Fate had ordained it, is likely to happen.

    '
sabha-2-76-83:
  ganguli: 2 XLVIII
  text: 'Therefore, go thou on a car yoking thereto horses endued with the speed of the wind, so that thou mayest reach Khandavaprastha even today and bring thou Yudhishthira with thee.

    '
  modern: 'So go in a chariot with horses as swift as the wind, so that you may reach Khāṇḍavaprastha even today and bring Yudhiṣṭhira with you."

    '
sabha-2-83-1:
  ganguli: 2 LVII
  speaker: Vaisampayana said
  text: 'Vidura then, thus commanded against his will by king Dhritarashtra, set out, with the help of horses of high mettle and endued with great speed and strength, and quiet and patient, for the abode of the wise sons of Pandu.

    '
  modern: 'Vidura, commanded against his will by King Dhṛtarāṣṭra, set out with horses of high mettle, very swift and strong, yet quiet and patient, for the home of the wise sons of Pāṇḍu.

    '
  speakerModern: 'Vaiśampāyana said:'
sabha-2-83-4:
  ganguli: 2 LVII
  text: 'Then the illustrious Ajamida devoted to truth and having no enemy on earth, reverentially saluted Vidura, and asked him about Dhritarashtra and his sons.

    '
  modern: 'Then the illustrious Ajamīḍha, devoted to truth and having no enemy on earth, saluted Vidura respectfully and asked him about Dhṛtarāṣṭra and his sons.

    '
sabha-2-83-6:
  ganguli: 2 LVII
  speaker: Vidura said
  text: 'The illustrious king, with his sons, is well and happy, and surrounded by his relatives he reigneth even like Indra himself. The king is happy with his sons who are all obedient to him and hath no grief.

    '
  modern: 'The illustrious king and his sons are well and happy, and surrounded by his relatives he reigns like Indra himself. The king is happy with his sons, who all obey him, and has no grief.

    '
  speakerModern: 'Vidura said:'
sabha-2-83-7:
  ganguli: 2 LVII
  text: 'The king of the Kurus hath commanded me to enquire after thy peace and prosperity, and to ask thee to repair to Hastinapore with thy brothers and to say, after beholding king Dhritarashtra''s newly erected palace, whether that one is equal to thy own.

    '
  modern: 'The king of the Kurus has commanded me to ask after your peace and prosperity and to ask you to come to Hāstinapura with your brothers and, after seeing King Dhṛtarāṣṭra''s newly built palace, to say whether it equals your own.

    '
sabha-2-83-8:
  ganguli: 2 LVII
  text: 'Repairing thither, O son of Pritha, with thy brothers, enjoy ye in that mansion and sit to a friendly match at dice. We shall be glad if thou goest, as the Kurus have already arrived there.

    '
  modern: 'Go there, O son of Pṛthā, with your brothers, enjoy that mansion, and sit down to a friendly match at dice. We shall be glad if you go, for the Kurus have already arrived there.

    '
sabha-2-83-11:
  ganguli: 2 LVII
  speaker: Vidura said
  text: 'I know that gambling is the root of misery, and I strove to dissuade the king from it. The king, however, hath sent me to thee. Having known all this, O learned one, do what is beneficial.

    '
  modern: 'I know that gambling is the root of misery, and I tried to dissuade the king from it. But the king has sent me to you. Knowing all this, O learned one, do what is beneficial.

    '
  speakerModern: 'Vidura said:'
sabha-2-83-16:
  ganguli: 2 LVII
  text: 'Unwilling as I am to gamble, I will not do so, if the wicked Sakuni doth not summon me to it in the Sabha? If, however, he challengeth me, I will never refuse. For that, as settled, is my eternal vow.

    '
  modern: 'Unwilling as I am to gamble, I will not do so unless the wicked Śakuni summons me to it in the hall. But if he challenges me, I will never refuse. For that, as settled, is my eternal vow."

    '
sabha-2-83-17:
  ganguli: 2 LVII
  speaker: Vaisampayana continued
  text: 'King Yudhishthira the just having said this unto Vidura, commanded that preparations for his journey might be made without loss of time. And the next day, the king accompanied by his relatives and attendants and taking with him also the women of the household with Draupadi in their midst, set out for the capital of the Kurus.

    '
  modern: 'King Yudhiṣṭhira the just, having said this to Vidura, ordered that preparations for his journey be made without delay. And the next day the king, with his relatives and attendants, and with the women of the household and Draupadī among them, set out for the capital of the Kurus.

    '
  speakerModern: 'Vaiśampāyana continued:'
sabha-2-83-47:
  ganguli: 2 LVII
  text: 'And arriving at Hastinapore he went to the palace of Dhritarashtra. And going there, the son of Pandu approached the king.

    '
  modern: 'Arriving at Hāstinapura, he went to Dhṛtarāṣṭra''s palace. There the son of Pāṇḍu approached the king.

    '
sabha-2-83-51:
  ganguli: 2 LVII
  text: '… and then to Jayadratha and next to all the Kurus one after another. And the mighty-armed one, then surrounded by all his brothers …

    '
  modern: '… then to Jayadratha, and next to all the Kurus one after another. And the mighty-armed one, with all his brothers around him …

    '
sabha-2-83-63:
  ganguli: 2 LVII
  text: 'And waked by the bards with sweet music, they rose from their beds, and having passed the night thus in happiness, they rose at dawn and having gone through the usual rites, they entered into the assembly house and were saluted by those that were ready there for gambling.

    '
  modern: 'Awakened by the bards with sweet music, they rose from their beds, and having passed the night happily, they rose at dawn, did the usual rites, entered the assembly hall, and were greeted by those who were ready there for gambling.

    '
sabha-2-84-3:
  ganguli: 2 LVIII
  text: 'After they had taken their seats, as also all the kings, Sakuni the son of Suvala addressed Yudhishthira and said, ''O king, the assembly is full.

    '
  modern: 'After they and all the kings had taken their seats, Śakuni, the son of Subala, said to Yudhiṣṭhira, "O king, the assembly is full.

    '
sabha-2-84-4:
  ganguli: 2 LVIII
  text: 'All had been waiting for thee. Let, therefore, the dice be cast and the rules of play be fixed, O Yudhishthira.

    '
  modern: 'Everyone has been waiting for you. So let the dice be cast and the rules of the play be fixed, O Yudhiṣṭhira."

    '
sabha-2-84-5:
  ganguli: 2 LVIII
  speaker: Yudhishthira replied
  text: 'Deceitful gambling is sinful. There is no Kshatriya prowess in it. There is certainly no morality in it. Why, then, O king, dost thou praise gambling so?

    '
  modern: 'Deceitful gambling is sinful. There is no Kṣatriya valor in it. There is certainly no morality in it. Why, then, O king, do you praise gambling so?

    '
  speakerModern: 'Yudhiṣṭhira replied:'
sabha-2-84-18:
  ganguli: 2 LVIII
  speaker: Yudhishthira said
  text: 'Summoned, I do not withdraw. This is my established vow. And, O king, Fate is all powerful. We all are under the control of Destiny.

    '
  modern: 'Summoned, I do not withdraw. This is my settled vow. And, O king, Fate is all-powerful. We are all under the control of Destiny.

    '
  speakerModern: 'Yudhiṣṭhira said:'
sabha-2-84-18#2:
  ganguli: 2 LVIII
  text: '(with sabha-2-84-18)

    '
sabha-2-84-20:
  ganguli: 2 LVIII
  speaker: Duryodhana said
  text: 'O monarch, I shall supply jewels and gems and every kind of wealth. And it is for me that this Sakuni, my uncle, will play.

    '
  modern: 'O monarch, I shall supply jewels, gems, and every kind of wealth. And it is for me that my uncle Śakuni will play."

    '
  speakerModern: 'Duryodhana said:'
sabha-2-84-21:
  ganguli: 2 LVIII
  speaker: Yudhishthira said
  text: 'Gambling for one''s sake by the agency of another seemeth to me to be contrary to rule. Thou also, O learned one, will admit this. If, however, thou art still bent on it, let the play begin.

    '
  modern: 'Gambling for one''s own sake through another seems to me against the rule. You too, O learned one, will admit this. But if you are still set on it, let the play begin."

    '
  speakerModern: 'Yudhiṣṭhira said:'
sabha-2-85-11:
  ganguli: 2 LX
  text: 'I have many beautiful jars each full of a thousand Nishkas in my treasury, inexhaustible gold, and much silver and other minerals.

    '
  modern: 'I have many beautiful jars, each full of a thousand niṣkas, in my treasury, inexhaustible gold, and much silver and other minerals.

    '
sabha-2-85-17:
  ganguli: 2 LX
  speaker: Yudhishthira said
  text: 'I have a hundred thousand serving-girls, all young, and decked with golden bracelets on their wrists and upper arms, and with nishkas round their necks and other ornaments …

    '
  modern: 'I have a hundred thousand serving girls, all young, wearing golden bracelets on their wrists and upper arms and niṣkas round their necks and other ornaments …

    '
  speakerModern: 'Yudhiṣṭhira said:'
sabha-2-85-24:
  ganguli: 2 LX
  speaker: Yudhishthira said
  text: 'I have, O son of Suvala, one thousand musty elephants with golden girdles, decked with ornaments, with the mark of the lotus on their temples and necks and other parts, adorned with golden garlands …

    '
  modern: 'O son of Subala, I have a thousand rutting elephants with golden girdles, decked with ornaments, marked with lotuses on their temples, necks, and other parts, adorned with golden garlands …

    '
  speakerModern: 'Yudhiṣṭhira said:'
sabha-2-88-6:
  ganguli: 2 LXIV
  speaker: Yudhishthira said
  text: 'I have, O son of Suvala, immeasurable kine and horses and milch cows with calves and goats and sheep in the country extending from the Parnasa to the eastern bank of the Sindu.

    '
  modern: 'O son of Subala, I have immeasurable cattle, horses, milch cows with calves, goats, and sheep in the country extending from the Parṇāśā to the eastern bank of the Sindhu.

    '
  speakerModern: 'Yudhiṣṭhira said:'
sabha-2-88-8:
  ganguli: 2 LXIV
  speaker: Yudhishthira said
  text: 'I have my city, the country, land, the wealth of all dwelling therein except of the Brahmanas, and all those persons themselves except Brahmanas still remaining to me.

    '
  modern: 'I have my city, the country, the land, the wealth of all who live there except the Brāhmaṇas, and all those people themselves except the Brāhmaṇas, still remaining to me.

    '
  speakerModern: 'Yudhiṣṭhira said:'
sabha-2-88-9:
  ganguli: 2 LXIV
  speaker: Vaisampayana said
  text: 'Hearing this, Sakuni, ready with the dice, adopting foul means, said unto Yudhishthira, ''Lo! I have won.''

    '
  modern: 'Hearing this, Śakuni, dice in hand and using foul means, said to Yudhiṣṭhira, "Look! I have won."

    '
  speakerModern: 'Vaiśampāyana said:'
sabha-2-88-10:
  ganguli: 2 LXIV
  text: 'Yudhishthira said,--These princes here, O king, who look resplendent in their ornaments and their ear-rings and Nishkas and all the royal ornaments on their persons are now my wealth. With this wealth, O king, I play with thee.

    '
  modern: 'Yudhiṣṭhira said, "These princes here, O king, who shine in their ornaments, earrings, niṣkas, and all the royal ornaments on their bodies, are now my wealth. With this wealth, O king, I play with you."

    '
sabha-2-88-11:
  ganguli: 2 LXIV
  speaker: Vaisampayana said
  text: 'Hearing this, Sakuni, ready with his dice, adopting foul means, said unto Yudhishthira, ''Lo! I have won them.''

    '
  modern: 'Hearing this, Śakuni, dice in hand and using foul means, said to Yudhiṣṭhira, "Look! I have won them."

    '
  speakerModern: 'Vaiśampāyana said:'
sabha-2-88-12:
  ganguli: 2 LXIV
  speaker: Yudhishthira said
  text: 'This Nakula here, of mighty arms and leonine neck, of red eyes and endued with youth, is now my one stake. Know that he is my wealth.

    '
  modern: 'This Nakula here, of mighty arms and lion''s neck, red-eyed and young, is now my one stake. Know that he is my wealth."

    '
  speakerModern: 'Yudhiṣṭhira said:'
sabha-2-88-14:
  ganguli: 2 LXIV
  speaker: Vaisampayana said
  text: 'Saying this, Sakuni cast those dice, and said unto Yudhishthira, ''Lo! He hath been won by us.''

    '
  modern: 'Saying this, Śakuni cast the dice and said to Yudhiṣṭhira, "Look! We have won him."

    '
  speakerModern: 'Vaiśampāyana said:'
sabha-2-88-15:
  ganguli: 2 LXIV
  speaker: Yudhishthira said
  text: 'This Sahadeva administereth justice. He hath also acquired a reputation for learning in this world. However undeserving he may be to be staked in play, with him as stake I will play, with such a dear object as it, indeed, he were not so!

    '
  modern: 'This Sahadeva administers justice, and he has a reputation for learning in this world. Though he does not deserve to be staked in play, I will play with him as the stake, as if he were not dear to me."

    '
  speakerModern: 'Yudhiṣṭhira said:'
sabha-2-88-16:
  ganguli: 2 LXIV
  speaker: Vaisampayana said
  text: 'Hearing this, Sakuni, ready with the dice, adopting foul means, said unto Yudhishthira, ''Lo! I have won.''

    '
  modern: 'Hearing this, Śakuni, dice in hand and using foul means, said to Yudhiṣṭhira, "Look! I have won."

    '
  speakerModern: 'Vaiśampāyana said:'
sabha-2-88-21:
  ganguli: 2 LXIV
  text: 'Yudhishthira said,--He that taketh us like a boat to the other shore of the sea of battle, he that is ever victorious over foes, the prince who is endued with great activity, he who is the one hero in this world, (is here). With that Falguna as stake, however, undeserving of being made so, I will now play with thee.

    '
  modern: 'Yudhiṣṭhira said, "He who takes us like a boat across the sea of battle, who is always victorious over foes, the prince of great activity, the one hero in this world, is here. Though he does not deserve to be made a stake, I will now play with you with that Phālguna as the stake."

    '
sabha-2-88-22:
  ganguli: 2 LXIV
  speaker: Vaisampayana said
  text: 'Hearing this, Sakuni, ready with the dice, adopting foul means, said unto Yudhishthira, ''Lo! I have won.''

    '
  modern: 'Hearing this, Śakuni, dice in hand and using foul means, said to Yudhiṣṭhira, "Look! I have won."

    '
  speakerModern: 'Vaiśampāyana said:'
sabha-2-88-25:
  ganguli: 2 LXIV
  speaker: Yudhishthira said
  text: 'O king, however, undeserving he may be of being made a stake, I will now play with thee by staking Bhimasena, that prince who is our leader, who is the foremost in fight,--even like the wielder of the thunder-bolt--the one enemy of the Danavas,--the high-souled one with leonine neck and arched eye-brows and eyes looking askance, who is incapable of putting up with an insult, who hath no equal in might in the world, who is the foremost of all wielders of the mace, and who grindeth all foes,

    '
  modern: 'O king, though he does not deserve to be made a stake, I will now play with you by staking Bhīmasena, that prince who is our leader, foremost in fight, like the wielder of the thunderbolt, the one enemy of the Dānavas, the high-souled one with a lion''s neck, arched eyebrows, and a sidelong glance, who cannot bear an insult, who has no equal in might in the world, who is the foremost of all wielders of the mace, and who crushes all foes."

    '
  speakerModern: 'Yudhiṣṭhira said:'
sabha-2-88-25#2:
  ganguli: 2 LXIV
  text: '(with sabha-2-88-25)

    '
sabha-2-88-26:
  ganguli: 2 LXIV
  speaker: Vaisampayana said
  text: 'Hearing this, Sakuni, ready with the dice adopting foul means, said unto Yudhishthira. ''Lo! I have won.''

    '
  modern: 'Hearing this, Śakuni, dice in hand and using foul means, said to Yudhiṣṭhira, "Look! I have won."

    '
  speakerModern: 'Vaiśampāyana said:'
sabha-2-88-27:
  ganguli: 2 LXIV
  text: 'Sakuni continued,--Thou hast, O son of Kunti, lost much wealth, horses and elephants and thy brothers as well. Say, if thou hast anything which thou hast not lost.

    '
  modern: 'Śakuni continued, "You have lost much wealth, O son of Kuntī, horses and elephants and your brothers as well. Say, do you have anything you have not lost?"

    '
sabha-2-88-28:
  ganguli: 2 LXIV
  text: 'Yudhishthira, said--''I alone, the eldest of all my brothers and dear unto them, am still unwon. Won by thee, I will do what he that is won will have to do.

    '
  modern: 'Yudhiṣṭhira said, "I alone, the eldest of all my brothers and dear to them, am still not won. Won by you, I will do what a man who has been won must do."

    '
sabha-2-88-29:
  ganguli: 2 LXIV
  speaker: Vaisampayana said
  text: 'Hearing this Sakuni, ready with the dice, adopting foul means, said unto Yudhishthira, ''Lo! I have won.''

    '
  modern: 'Hearing this, Śakuni, dice in hand and using foul means, said to Yudhiṣṭhira, "Look! I have won."

    '
  speakerModern: 'Vaiśampāyana said:'
sabha-2-88-30:
  ganguli: 2 LXIV
  speaker: Sakuni continued
  text: 'Thou hast permitted thyself to be won. This is very sinful. There is wealth still left to thee, O king. Therefore, thy having lost thyself is certainly sinful.

    '
  modern: '"You have let yourself be won. This is very sinful. You still have wealth left, O king. So it is certainly sinful that you lost yourself."

    '
  speakerModern: 'Śakuni continued:'
sabha-2-88-32:
  ganguli: 2 LXIV
  speaker: Vaisampayana continued
  text: '… The son of Suvala then, addressing Yudhishthira said,--''O king, there is still one stake dear to thee that is still unwon. Stake thou Krishna, the princess of Panchala. By her, win thyself back.

    '
  modern: '… Then the son of Subala said to Yudhiṣṭhira, "O king, there is still one stake dear to you that is not yet won. Stake Kṛṣṇā, the princess of Pañcāla. With her, win yourself back."

    '
  speakerModern: 'Vaiśampāyana continued:'
sabha-2-88-36:
  ganguli: 2 LXIV
  speaker: Yudhishthira said
  text: '… Possessed of every accomplishment and compassionate and sweet-speeched, she is such a woman as a man may desire for wife in respect of her fitness for the acquisition of virtue and pleasure and wealth.

    '
  modern: '… Accomplished, compassionate, and sweet-spoken, she is the kind of woman a man could desire as a wife for the pursuit of virtue, pleasure, and wealth.

    '
  speakerModern: 'Yudhiṣṭhira said:'
sabha-2-88-39:
  ganguli: 2 LXIV
  text: 'O king, making the slender-waisted Draupadi, who is even such as my stake, I will play with thee, O son of Suvala.

    '
  modern: 'O king, I will play with you, O son of Subala, making the slender-waisted Draupadī, such as she is, my stake."

    '
sabha-2-88-40:
  ganguli: 2 LXIV
  speaker: Vaisampayana continued
  text: 'When the intelligent king Yudhishthira the just has spoken thus,--''Fie! ''Fie!'' were the words that were uttered by all the aged persons that were in the assembly.

    '
  modern: 'When the intelligent King Yudhiṣṭhira the just had spoken thus, all the aged persons in the assembly cried out, "Shame! Shame!"

    '
  speakerModern: 'Vaiśampāyana continued:'
sabha-2-88-41:
  ganguli: 2 LXIV
  text: 'And the whole conclave was agitated, and the kings who were present there all gave way to grief. And Bhishma and Drona and Kripa were covered with perspiration.

    '
  modern: 'The whole assembly was stirred, and the kings who were present all gave way to grief. Bhīṣma, Droṇa, and Kṛpa broke into a sweat.

    '
sabha-2-88-42:
  ganguli: 2 LXIV
  text: 'And Vidura holding his head between his hands sat like one that had lost his reason. He sat with face downwards giving way to his reflections and sighing like a snake.

    '
  modern: 'And Vidura, holding his head between his hands, sat like one who had lost his reason. He sat with his face down, brooding and sighing like a snake.

    '
sabha-2-88-44:
  ganguli: 2 LXIV
  text: 'But Dhritarashtra glad, at heart, asked repeatedly, ''Hath the stake been won? ''Hath the stake been won?'' and could not conceal his emotions.

    '
  modern: 'But Dhṛtarāṣṭra, glad at heart, asked again and again, "Has the stake been won? Has the stake been won?" and could not hide his feelings.

    '
sabha-2-88-45:
  ganguli: 2 LXIV
  text: 'Karna with Dussassana and others laughed aloud, while tears began to flow from the eyes of all other present in the assembly.

    '
  modern: 'Karṇa, with Duḥśāsana and the others, laughed aloud, while tears began to flow from the eyes of all the others in the assembly.

    '
sabha-2-88-46:
  ganguli: 2 LXIV
  text: 'And the son of Suvala, proud of success and flurried with excitement and repeating. Thou hast one stake, dear to thee, etc. said,--''Lo! I have won'' and took up the dice that had been cast.

    '
  modern: 'And the son of Subala, proud of his success and flushed with excitement, said, "You have one stake, dear to you, and so on. Look! I have won," and took up the dice that had been cast.

    '
sabha-2-89-1:
  ganguli: 2 LXV
  speaker: Duryodhana said
  text: 'Come, Kshatta, bring hither Draupadi the dear and loved wife of the Pandavas. Let her sweep the chambers, force her thereto, and let the unfortunate one stay where our serving-women are.''

    '
  modern: 'Come, Kṣattṛ, bring Draupadī here, the dear and beloved wife of the Pāṇḍavas. Let her sweep the chambers; force her to it, and let the unfortunate woman stay where our serving women are.

    '
  speakerModern: 'Duryodhana said:'
sabha-2-89-2:
  ganguli: 2 LXV
  speaker: Vidura said
  text: 'Dost thou not know, O wretch, that by uttering such harsh words thou art tying thyself with cords? Dost thou not understand that thou art hanging on the edge of a precipice? Dost thou not know that being a deer thou provokest so many tigers to rage?

    '
  modern: 'Do you not know, you wretch, that by uttering such harsh words you are tying yourself with cords? Do you not understand that you are hanging on the edge of a precipice? Do you not know that, being a deer, you provoke so many tigers to rage?

    '
  speakerModern: 'Vidura said:'
sabha-2-89-2#2:
  ganguli: 2 LXV
  text: '(with sabha-2-89-2)

    '
sabha-2-89-4:
  ganguli: 2 LXV
  text: 'In my judgement, slavery does not attach to Krishna, in as much as she was staked by the King after he had lost himself and ceased to be his own master.

    '
  modern: 'In my judgment, slavery does not attach to Kṛṣṇā, since the king staked her after he had lost himself and was no longer his own master.

    '
sabha-2-89-13:
  ganguli: 2 LXVI
  speaker: Vaisampayana said
  text: 'Intoxicated with pride, the son of Dhritarashtra spake,--''Fie on Kshatta! and casting his eyes upon the Pratikamin in attendance, commanded him, in the midst of all those reverend seniors, saying,--''Go Pratikamin, and bring thou Draupadi hither.

    '
  modern: 'Intoxicated with pride, the son of Dhṛtarāṣṭra said, "Shame on Kṣattṛ!" and looking at the Prātikāmin who was in attendance, he commanded him, in the midst of all those reverend elders, "Go, Prātikāmin, and bring Draupadī here.

    '
  speakerModern: 'Vaiśampāyana said:'
sabha-2-89-14:
  ganguli: 2 LXVI
  text: 'Thou hast no fear from the sons of Pandu. It is Vidura alone that raveth in fear. Besides, he never wisheth our prosperity!

    '
  modern: 'You have nothing to fear from the sons of Pāṇḍu. Only Vidura raves in fear. Besides, he never wishes for our prosperity!"

    '
sabha-2-89-15:
  ganguli: 2 LXVI
  speaker: Vaisampayana continued
  text: 'Thus commanded, the Pratikamin, who was of the Suta caste, hearing the words of the king, proceeded with haste, and entering the abode of the Pandavas, like a dog in a lion''s den, approached the queen of the sons of Pandu.

    '
  modern: 'Thus commanded, the Prātikāmin, of the Sūta caste, hearing the king''s words, went in haste, entered the Pāṇḍavas'' house like a dog entering a lion''s den, and approached the queen of the sons of Pāṇḍu.

    '
  speakerModern: 'Vaiśampāyana continued:'
sabha-2-89-16:
  ganguli: 2 LXVI
  speaker: And he said
  text: 'Yudhishthira having been intoxicated with dice, Duryodhana, O Draupadi, hath won thee. Come now, therefore, to the abode of Dhritarashtra. I will take thee, O Yajnaseni, and put thee in some menial work.

    '
  modern: 'Yudhiṣṭhira, intoxicated with dice, has lost you, O Draupadī, to Duryodhana. So come now to Dhṛtarāṣṭra''s house. I will take you, O Yājñasenī, and put you to some menial work."

    '
  speakerModern: 'And he said:'
sabha-2-89-17:
  ganguli: 2 LXVI
  speaker: Draupadi said
  text: 'Why, O Pratikamin, dost thou say so? What prince is there who playeth staking his wife? The king was certainly intoxicated with dice. Else, could he not find any other object to stake?

    '
  modern: 'Why, O Prātikāmin, do you say so? What prince plays staking his wife? The king was certainly intoxicated with dice. Could he not find any other thing to stake?"

    '
  speakerModern: 'Draupadī said:'
sabha-2-89-18:
  ganguli: 2 LXVI
  speaker: The Pratikamin said
  text: 'When he had nothing else to stake, it was then that Ajatasatru, the son of Pandu, staked thee. The king had first staked his brothers, then himself, and then thee, O princess.

    '
  modern: 'When he had nothing else to stake, it was then that Ajātaśatru, the son of Pāṇḍu, staked you. The king first staked his brothers, then himself, and then you, O princess."

    '
  speakerModern: 'The Pratikamin said:'
sabha-2-89-19:
  ganguli: 2 LXVI
  speaker: Draupadi said
  text: 'O son of the Suta race, go, and ask that gambler present in the assembly, whom he hath lost first, himself, or me. Ascertaining this, come hither, and then take me with thee, O son of the Suta race.

    '
  modern: 'O son of the Sūta, go and ask that gambler in the assembly whom he lost first, himself or me. When you have found out, come here, and then take me with you, O son of the Sūta."

    '
  speakerModern: 'Draupadī said:'
sabha-2-89-21:
  ganguli: 2 LXVI
  speaker: Vaisampayana continued
  text: 'The messenger coming back to the assembly told all present the words of Draupadi. And he spoke unto Yudhishthira sitting in the midst of the kings, these words …

    '
  modern: 'The messenger went back to the assembly and told all present Draupadī''s words. And he said to Yudhiṣṭhira, who was sitting among the kings …

    '
  speakerModern: 'Vaiśampāyana continued:'
sabha-2-89-23:
  ganguli: 2 LXVI
  text: 'Yudhishthira, however sat there like one demented and deprived of reason and gave no answer good or ill to the Suta.

    '
  modern: 'But Yudhiṣṭhira sat there like one out of his mind, deprived of reason, and gave the Sūta no answer, good or bad.

    '
sabha-2-89-24:
  ganguli: 2 LXVI
  speaker: Duryodhana then said
  text: 'Let the princess of Panchala come hither and put her question. Let every one hear in this assembly the words that pass between her and Yudhishthira.

    '
  modern: 'Let the princess of Pañcāla come here and put her question. Let everyone in this assembly hear the words that pass between her and Yudhiṣṭhira."

    '
  speakerModern: 'Duryodhana said:'
sabha-2-89-37:
  ganguli: 2 LXVI
  text: 'Duryodhana, hearing this, said,--''O Dussasana, this son of my Suta, of little intelligence, feareth Vrikodara. Therefore, go thou thyself and forcibly bring hither the daughter of Yajnasena, Our enemies at present are dependent on our will. What can they do thee?

    '
  modern: 'Duryodhana, hearing this, said, "O Duḥśāsana, this Sūta son of mine, of little intelligence, fears Vṛkodara. So go yourself and bring the daughter of Yajñasena here by force. Our enemies are now dependent on our will. What can they do to you?"

    '
sabha-2-89-38:
  ganguli: 2 LXVI
  text: 'Hearing the command of his brother, prince Dussasana rose with blood-red eyes, and entering the abode of those great warriors, spake these words unto the princess …

    '
  modern: 'Hearing his brother''s command, Prince Duḥśāsana rose with blood-red eyes, entered the house of those great warriors, and said to the princess …

    '
sabha-2-89-39:
  ganguli: 2 LXVI
  text: 'Come, come, O Krishna, princess of Panchala, thou hast been won by us. And O thou of eyes large as lotus leaves, come now and accept the Kurus for thy lords. Thou hast been won virtuously, come to the assembly.

    '
  modern: '"Come, come, O Kṛṣṇā, princess of Pañcāla, you have been won by us. And, O you with eyes large as lotus leaves, come now and accept the Kurus as your lords. You have been won rightfully; come to the assembly."

    '
sabha-2-89-40:
  ganguli: 2 LXVI
  text: 'At these words, Draupadi, rising up in great affliction, rubbed her pale face with her hands, and distressed she ran to the place where the ladies of Dhritarashtra''s household were.

    '
  modern: 'At these words Draupadī rose in great distress, wiped her pale face with her hands, and ran in her misery to the place where the ladies of Dhṛtarāṣṭra''s household were.

    '
sabha-2-89-41:
  ganguli: 2 LXVI
  text: 'At this, Dussasana roaring in anger, ran after her and seized the queen by her locks, so long and blue and wavy. …

    '
  modern: 'At this, Duḥśāsana, roaring in anger, ran after her and seized the queen by her long, dark, wavy hair. …

    '
sabha-2-89-44:
  ganguli: 2 LXVI
  text: 'And dragged by him, with body bent, she faintly cried--''Wretch! it ill behoveth thee to take me before the assembly. My season hath come, and I am now clad in one piece of attire.

    '
  modern: 'And dragged by him, bent over, she cried out faintly, "Wretch! It does not become you to take me before the assembly. My season has come, and I am wearing only one piece of cloth."

    '
sabha-2-89-45:
  ganguli: 2 LXVI
  text: 'But Dussasana dragging Draupadi forcibly by her black locks while she was praying piteously unto Krishna and Vishnu who were Narayana and Nara (on earth), said unto her--''Whether thy season hath come or not, whether thou art attired in one piece of cloth or entirely naked, when thou hast been won at dice and made our slave, thou art to live amongst our serving-women as thou pleasest.

    '
  modern: 'But Duḥśāsana dragged Draupadī by force by her black hair while she was praying piteously to Kṛṣṇa and Viṣṇu, who are Nārāyaṇa and Nara on earth. He said to her, "Whether your season has come or not, whether you wear one piece of cloth or are entirely naked, since you have been won at dice and made our slave, you must live among our serving women as you please."

    '
sabha-2-89-46:
  ganguli: 2 LXVI
  text: '(with sabha-2-89-45)

    '
sabha-2-89-47:
  ganguli: 2 LXVI
  speaker: Vaisampayana continued
  text: 'With hair dishevelled and half her attire loosened, all the while dragged by Dussasana, the modest Krishna consumed with anger, faintly said …

    '
  modern: 'With her hair loose and her clothes half undone, dragged all the while by Duḥśāsana, the modest Kṛṣṇā, burning with anger, said faintly …

    '
  speakerModern: 'Vaiśampāyana continued:'
sabha-2-89-51:
  ganguli: 2 LXVI
  text: 'Thou draggest me who am in my season before these Kuru heroes. This is truly an unworthy act. But no one here rebuketh thee.

    '
  modern: 'You drag me, who am in my season, before these Kuru heroes. This is truly an unworthy act. But no one here rebukes you.

    '
sabha-2-89-53:
  ganguli: 2 LXVI
  text: 'Oh! both Drona and Bhishma have lost their energy, and so also hath the high-souled Kshatta, and so also this king. Else, why do these foremost of the Kuru elders look silently on this great crime?

    '
  modern: 'Oh! Both Droṇa and Bhīṣma have lost their strength, and so has the high-souled Kṣattṛ, and so has this king. Why else do these foremost of the Kuru elders look on in silence at this great crime?"

    '
sabha-2-89-56:
  ganguli: 2 LXVI
  text: 'And Dussasana, beholding Krishna looking at her helpless lords, dragging her still more forcibly, and addressed her, ''Slave, Slave'' and laughed aloud.

    '
  modern: 'And Duḥśāsana, seeing Kṛṣṇā look at her helpless husbands, dragged her still harder, called her "Slave, slave," and laughed aloud.

    '
sabha-2-89-57:
  ganguli: 2 LXVI
  text: 'And at those words Karna became very glad and approved of them by laughing aloud. And Sakuni, the son of Suvala, the Gandhara king, similarly applauded Dussasana.

    '
  modern: 'At those words Karṇa was very glad and approved of them with loud laughter. And Śakuni, the son of Subala, the Gāndhāra king, likewise applauded Duḥśāsana.

    '
sabha-2-89-59:
  ganguli: 2 LXVI
  text: 'And beholding it all, Bhishma said, ''O blessed one, morality is subtle. I therefore am unable to duly decide this point that thou hast put, beholding that on the one hand one that hath no wealth cannot stake the wealth belonging to others, while on the other hand wives are always under the orders and at the disposal of their lords.

    '
  modern: 'Seeing all this, Bhīṣma said, "O blessed one, morality is subtle. So I cannot properly decide the point you have put, since on the one hand a man who has no wealth cannot stake what belongs to others, while on the other hand wives are always under the orders of their lords.

    '
sabha-2-89-60:
  ganguli: 2 LXVI
  text: 'Yudhishthira can abandon the whole world full of wealth, but he will never sacrifice morality. The son of Pandu hath said--''I am won. Therefore, I am unable to decide this matter.

    '
  modern: 'Yudhiṣṭhira can give up the whole world full of wealth, but he will never give up morality. The son of Pāṇḍu has said, "I am won." Therefore I am unable to decide this matter.

    '
sabha-2-90-19:
  ganguli: 2 LXVI
  speaker: And at last the prince said
  text: 'Ye kings of the earth, ye Kauravas, whether ye answer this question or not, I will say what I regard as just and proper.

    '
  modern: 'Kings of the earth, Kauravas, whether you answer this question or not, I will say what I think just and proper.

    '
  speakerModern: 'And at last the prince said:'
sabha-2-90-23:
  ganguli: 2 LXVI
  text: 'The innocent Draupadi is, besides, the common wife of all the sons of Pandu. And the king, having first lost himself offered her as a stake.

    '
  modern: 'The innocent Draupadī is, besides, the common wife of all the sons of Pāṇḍu. And the king first lost himself and then offered her as a stake.

    '
sabha-2-90-24:
  ganguli: 2 LXVI
  text: 'And Suvala himself desirous of a stake, indeed prevailed upon the king to stake this Krishna. Reflecting upon all these circumstances, I regard Draupadi as not won.

    '
  modern: 'And Subala''s son himself, wanting a stake, prevailed on the king to stake this Kṛṣṇā. Considering all these circumstances, I regard Draupadī as not won."

    '
sabha-2-90-25:
  ganguli: 2 LXVI
  text: 'Hearing these words, a loud uproar rose from among those present in that assembly. And they all applauded Vikarna and censured the son of Suvala.

    '
  modern: 'Hearing these words, a loud uproar rose from those present in the assembly. They all applauded Vikarṇa and blamed the son of Subala.

    '
sabha-2-90-26:
  ganguli: 2 LXVI
  text: 'And at that sound, the son of Radha, deprived of his senses by anger, waving his well-shaped arms, said these words …

    '
  modern: 'And at that sound the son of Rādhā, robbed of his senses by anger, waved his shapely arms and said …

    '
sabha-2-90-33:
  ganguli: 2 LXVI
  text: 'Draupadi had been mentioned (by Suvala) and approved of as a stake by the Pandavas. For what reason then dost thou yet regard her as not won?

    '
  modern: 'Draupadī had been named (by Subala) as a stake and approved as a stake by the Pāṇḍavas. For what reason then do you still regard her as not won?

    '
sabha-2-90-34:
  ganguli: 2 LXVI
  text: 'Or, if thou thinkest that bringing her hither attired in a single piece of cloth, is an action of impropriety, listen to certain excellent reasons I will give.

    '
  modern: 'Or, if you think that bringing her here in a single piece of cloth is improper, listen to the excellent reasons I will give.

    '
sabha-2-90-35:
  ganguli: 2 LXVI
  text: 'O son of the Kuru race, the gods have ordained only one husband for one woman. This Draupadi, however, hath many husbands. Therefore, certain it is that she is an unchaste woman.

    '
  modern: 'O son of the Kuru race, the gods have ordained only one husband for one woman. But Draupadī has many husbands. Therefore she is certainly an unchaste woman.

    '
sabha-2-90-36:
  ganguli: 2 LXVI
  text: 'To bring her, therefore, into this assembly attired though she be in one piece of cloth--even to uncover her is not at all an act that may cause surprise.

    '
  modern: 'So to bring her into this assembly in one piece of cloth, even to uncover her, is not at all a cause for surprise.

    '
sabha-2-90-38:
  ganguli: 2 LXVI
  text: 'O Dussasana, this Vikarna speaking words of (apparent) wisdom is but a boy. Take off the robes of the Pandavas as also the attire of Draupadi.

    '
  modern: 'O Duḥśāsana, this Vikarṇa, speaking words of apparent wisdom, is only a boy. Take off the robes of the Pāṇḍavas and the clothing of Draupadī."

    '
sabha-2-90-39:
  ganguli: 2 LXVI
  text: 'Hearing these words the Pandavas, O Bharata, took of their upper garments and throwing them down sat in that assembly.

    '
  modern: 'Hearing these words, the Pāṇḍavas, O Bharata, took off their upper garments, threw them down, and sat in that assembly.

    '
sabha-2-90-40:
  ganguli: 2 LXVI
  text: 'Then Dussasana, O king, forcibly seizing Draupadi''s attire before the eyes of all, began to drag it off her person.

    '
  modern: 'Then Duḥśāsana, O king, seized Draupadī''s cloth by force before the eyes of all and began to drag it off her.

    '
sabha-2-90-42:
  ganguli: 2 LXVI
  speaker: Vaisampayana continued
  text: 'When the attire of Draupadi was being thus dragged, the thought of Hari, (And she herself cried aloud, saying), …

    '
  modern: 'When Draupadī''s cloth was being dragged off, she thought of Hari and cried aloud: …

    '
  speakerModern: 'Vaiśampāyana continued:'
sabha-2-90-43:
  ganguli: 2 LXVI
  text: '… ''O Govinda, O thou who dwellest in Dwaraka, O Krishna, O thou who art fond of cow-herdesses (of Vrindavana).

    '
  modern: '… "O Govinda, O you who dwell in Dvārakā, O Kṛṣṇa, O you who love the cowherd girls of Vṛndāvana.

    '
sabha-2-90-44:
  ganguli: 2 LXVI
  text: 'O Kesava, seest thou not that the Kauravas are humiliating me.

    '
  modern: 'O Keśava, do you not see that the Kauravas are humiliating me?

    '
sabha-2-90-47:
  ganguli: 2 LXVI
  text: 'O Krishna, O Krishna, O thou great yogin, thou soul of the universe, Thou creator of all things, O Govinda, save me who am distressed,--who am losing my senses in the midst of the Kurus.

    '
  modern: 'O Kṛṣṇa, Kṛṣṇa, great yogin, soul of the universe, creator of all things, O Govinda, save me, who am in distress and losing my senses among the Kurus."

    '
sabha-2-90-48:
  ganguli: 2 LXVI
  text: 'Thus did that afflicted lady resplendent still in her beauty, O king covering her face cried aloud, thinking of Krishna, of Hari, of the lord of the three worlds.

    '
  modern: 'Thus that afflicted lady, still resplendent in her beauty, O king, covered her face and cried aloud, thinking of Kṛṣṇa, of Hari, the lord of the three worlds.

    '
sabha-2-90-49:
  ganguli: 2 LXVI
  text: '… the illustrious Dharma, remaining unseen, covered her with excellent clothes of many hues. And, O monarch as the attire of Draupadi was being dragged, after one was taken off, another of the same kind, appeared covering her.

    '
  modern: '… the illustrious Dharma, remaining unseen, covered her with excellent clothes of many colors. And, O monarch, as Draupadī''s clothing was dragged off, after one was taken away another of the same kind appeared covering her.

    '
sabha-2-90-51:
  ganguli: 2 LXVI
  text: 'And there arose then a deep uproar of many many voices. And the kings present in that assembly beholding that most extraordinary of all sights in the world, began to applaud Draupadi and censure the son of Dhritarashtra.

    '
  modern: 'And a deep uproar of many voices arose. The kings in that assembly, seeing that most extraordinary sight in the world, began to praise Draupadī and blame the son of Dhṛtarāṣṭra.

    '
sabha-2-90-52:
  ganguli: 2 LXVI
  text: 'And beholding the sons of Kunti in that state, the persons--those gods among men--that were in that assembly all uttered the word ''Fie!''(on the son of Dhritarashtra). …

    '
  modern: 'And seeing the sons of Kuntī in that state, those gods among men who were in the assembly all cried "Shame!" on the son of Dhṛtarāṣṭra. …

    '
sabha-2-90-53:
  ganguli: 2 LXVI
  text: 'And when a mass of clothes had been gathered in that assembly, all dragged from the person of Draupadi, Dussasana, tired and ashamed, sat down.

    '
  modern: 'And when a mass of clothes had been gathered in that assembly, all dragged from Draupadī''s body, Duḥśāsana, tired and ashamed, sat down.

    '
sabha-2-90-91:
  ganguli: 2 LXVI
  speaker: Vaisampayana continued
  text: 'The kings that were there hearing these words of Vidura, answered not a word, yet Karna alone spoke unto Dussasana, telling him. Take away this serving-woman Krishna into the inner apartments.

    '
  modern: 'The kings who were there, hearing these words of Vidura, answered not a word, but Karṇa alone spoke to Duḥśāsana. "Take this serving woman Kṛṣṇā away into the inner apartments."

    '
  speakerModern: 'Vaiśampāyana continued:'
sabha-2-90-92:
  ganguli: 2 LXVI
  text: 'And thereupon Dussasana began to drag before all the spectators the helpless and modest Draupadi, trembling and crying piteously unto the Pandavas her lords.

    '
  modern: 'And then Duḥśāsana began to drag the helpless and modest Draupadī before all the spectators, trembling and crying piteously to the Pāṇḍavas, her lords.

    '
sabha-2-92-79:
  ganguli: 2 LXX
  text: 'And beholding this, Bhimasena expanding his red eyes, said unto Duryodhana in the midst of all those kings and as if piercing them (with his dart-like words),--''Let not Vrikodara attain to the regions, obtained by his ancestors, if he doth not break that thigh of thine in the great conflict.

    '
  modern: 'And seeing this, Bhīmasena opened his red eyes wide and said to Duryodhana in the midst of all those kings, as if piercing them with his dart-like words, "Let Vṛkodara not reach the regions his ancestors have reached, if he does not break that thigh of yours in the great battle."

    '
sabha-2-92-80:
  ganguli: 2 LXVI
  text: 'Tearing open in battle, by sheer force, the breast of this wretch, this wicked-minded scoundrel of the Bharata race, if I do not drink his life-blood, let me not obtain the region of my ancestors.

    '
  modern: '"If I do not tear open in battle, by sheer force, the breast of this wretch, this wicked-minded scoundrel of the Bharata race, and drink his life blood, let me not obtain the region of my ancestors."

    '
sabha-2-93-14:
  ganguli: 2 LXXI
  text: 'Then Yudhishthira forbade the mighty hero, embracing him with his arms and telling him ''Be not so.

    '
  modern: 'Then Yudhiṣṭhira stopped the mighty hero, embracing him and saying, "Do not do so.

    '
sabha-2-93-15:
  ganguli: 2 LXXI
  text: '(with sabha-2-93-14)

    '
sabha-2-93-16:
  ganguli: 2 LXXI
  speaker: Bhima said
  text: 'Shall I, O king, slay, without loss of time all these foes assembled together, even here, or shall I destroy them, O Bharata, by the roots, outside this palace? Or, what need is there of words or of command? I shall slay all these even now, and rule thou the whole earth, O king, without a rival.

    '
  modern: "\"Shall I, O king, kill all these foes gathered together, without delay, right here, or shall I destroy them, O Bharata, root and all, outside this palace? Or what need is there of words or commands? I will kill them all even now, and you will rule the whole earth, O king, without a rival.\""
  speakerModern: 'Bhīma said:'
sabha-2-93-17:
  ganguli: 2 LXXI
  text: 'Stay in silence and peace. …

    '
  modern: 'Be silent and calm." …

    '
sabha-2-93-21:
  ganguli: 2 LXX
  speaker: Vaisampayana continued
  text: 'Just then, a jackal began to cry loudly in the homa-chamber of king Dhritarashtra''s palace.

    '
  modern: 'Just then a jackal began to cry loudly in the homa chamber of King Dhṛtarāṣṭra''s palace.

    '
  speakerModern: 'Vaiśampāyana continued:'
sabha-2-93-22:
  ganguli: 2 LXX
  text: 'And Vidura conversant with everything and the daughter of Suvala, both understood the meaning of those terrible sounds. And Bhishma and Drona and the learned Gautama loudly cried,--Swashti! Swashti!

    '
  modern: 'And Vidura, who knew everything, and the daughter of Subala both understood the meaning of those terrible sounds. And Bhīṣma, Droṇa, and the learned Gautama (Kṛpa) cried out loudly, "Svasti! Svasti!"

    '
sabha-2-93-23:
  ganguli: 2 LXX
  text: 'Then Gandhari and the learned Vidura beholding that frightful omen, represented everything, in great affliction, unto the king.

    '
  modern: 'Then Gāndhārī and the learned Vidura, seeing that frightful omen, told the king everything in great distress.

    '
sabha-2-93-24:
  ganguli: 2 LXX
  speaker: And the king (Dhritarashtra) thereupon said
  text: 'Thou wicked-minded Duryodhana, thou wretch, destruction hath all ready overtaken thee when thou insultest in language such as this the wife of these bulls among the Kurus, especially their wedded wife Draupadi.

    '
  modern: 'You wicked-minded wretch Duryodhana, destruction has already overtaken you, when you insult in such language the wife of these bulls among the Kurus, especially their wedded wife Draupadī."

    '
  speakerModern: 'And the king (Dhṛtarāṣṭra) thereupon said:'
sabha-2-93-25:
  ganguli: 2 LXX
  text: 'And having spoken those words, the wise Dhritarashtra endued with knowledge, reflecting with the aid of his wisdom and desirous of saving his relatives and friends from destruction, began to console Krishna, the princess of Panchala, and addressing her, the monarch said,--''Ask of me any boon, O princess of Panchala, that thou desirest, Chaste and devoted to virtue, thou art the first of all my daughters-in-law.

    '
  modern: 'Having said these words, the wise Dhṛtarāṣṭra, thinking it over with the help of his wisdom and wanting to save his relatives and friends from destruction, began to console Kṛṣṇā, the princess of Pañcāla, and said to her, "Ask of me any boon you like, O princess of Pañcāla. Chaste and devoted to virtue, you are the first of all my daughters-in-law."

    '
sabha-2-93-26:
  ganguli: 2 LXX
  text: '(with sabha-2-93-25)

    '
sabha-2-93-27:
  ganguli: 2 LXX
  speaker: Draupadi said
  text: 'O bull of the Bharata race, if thou will grant me a boon, I ask the handsome Yudhishthira, obedient to every duty, be freed from slavery.

    '
  modern: 'O bull of the Bharata race, if you will grant me a boon, I ask that the handsome Yudhiṣṭhira, who is faithful to every duty, be freed from slavery."

    '
  speakerModern: 'Draupadī said:'
sabha-2-93-30:
  ganguli: 2 LXX
  speaker: Dhritarashtra said unto her
  text: 'O auspicious one, let it be as thou sayest. O excellent one, ask thou another boon, for I will give it. My heart inclineth to give thee a second boon. Thou dost not deserve only one boon.

    '
  modern: "O auspicious one, let it be as you say. Ask another boon, excellent one, for I will give it. My heart is inclined to give you a second boon. You do not deserve only one boon.\""
  speakerModern: 'Dhṛtarāṣṭra said unto her:'
sabha-2-93-31:
  ganguli: 2 LXX
  speaker: Draupadi said
  text: 'I ask, O king, that Bhimasena and Dhananjaya and the twins also, with their cars and bows, freed from bondage, regain their liberty.

    '
  modern: 'I ask, O king, that Bhīmasena, Dhanañjaya, and the twins, freed from bondage, regain their liberty, with their chariots and bows."

    '
  speakerModern: 'Draupadī said:'
sabha-2-93-32:
  ganguli: 2 LXX
  speaker: Dhritarashtra said
  text: 'O blessed daughter, let it be as thou desirest. Ask thou a third boon, for thou hast not been sufficiently honoured with two boons. Virtuous in thy behaviour, thou art the foremost of all my daughters-in-law.

    '
  modern: 'O blessed daughter, let it be as you wish. Ask a third boon, for you have not been honored enough with two. Virtuous in your conduct, you are the foremost of all my daughters-in-law.

    '
  speakerModern: 'Dhṛtarāṣṭra said:'
sabha-2-93-33:
  ganguli: 2 LXX
  speaker: Draupadi said
  text: 'O best of kings, O illustrious one, covetousness always bringeth about loss of virtue. I do not deserve a third boon.

    '
  modern: 'O best of kings, O illustrious one, covetousness always leads to loss of virtue. I do not deserve a third boon.

    '
  speakerModern: 'Draupadī said:'
sabha-2-93-35:
  ganguli: 2 LXX
  text: 'O king, these my husbands freed from the wretched state of bondage, will be able to achieve prosperity by their own virtuous acts!

    '
  modern: 'O king, these husbands of mine, freed from the wretched state of bondage, will be able to win prosperity by their own virtuous acts!"

    '
sabha-2-95-2:
  ganguli: 2 LXXII
  speaker: Dhritarashtra replied.
  text: 'O Ajatasatru, blest be thou. Go thou in peace and safety. Commanded by me, go, rule thy own kingdom with thy wealth.

    '
  modern: 'O Ajātaśatru, blessings on you. Go in peace and safety. At my command, go and rule your own kingdom with your wealth.

    '
  speakerModern: 'Dhṛtarāṣṭra replied.:'
sabha-2-95-10:
  ganguli: 2 LXXII
  text: 'They are the best of men that remember not the acts of hostility of their foes; that behold only the merits, not the faults, of their enemies; and that never enter into hostilities themselves. They that are good remember only the good deeds of their foes and not the hostile acts their foes might have done unto them.

    '
  modern: 'Those are the best of men who do not remember their foes'' hostile acts, who see only their enemies'' merits and not their faults, and who never start hostilities themselves. The good remember only the good deeds of their foes and not the hostile acts their foes may have done to them.

    '
sabha-2-95-11:
  ganguli: 2 LXXII
  text: 'Thou hast acted even as good men of prepossessing countenance do, who transgress not the limits of virtue, wealth, pleasure and salvation.

    '
  modern: 'You have acted as good men of pleasing countenance do, who do not transgress the limits of virtue, wealth, pleasure, and liberation.

    '
sabha-2-95-12:
  ganguli: 2 LXXII
  text: 'O child, remember not the harsh words of Duryodhana. Look at thy mother Gandhari and myself also, if thou desirest to remember only what is good.

    '
  modern: 'O child, do not remember Duryodhana''s harsh words. Look at your mother Gāndhārī and at me too, if you wish to remember only what is good.

    '
sabha-2-95-16:
  ganguli: 2 LXXII
  text: '… and the twins, those foremost of men, is pure reverence for superiors. Blest be thou, O Ajatasatru. Return to Khandavaprastha, and let there be brotherly love between thee and thy cousins. Let thy heart also be ever fixed on virtue.''"

    '
  modern: '… and in the twins, those foremost of men, is pure reverence for superiors. Blessings on you, O Ajātaśatru. Return to Khāṇḍavaprastha, and let there be brotherly love between you and your cousins. Let your heart also always be fixed on virtue.

    '
sabha-2-95-17:
  ganguli: 2 LXXII
  speaker: Vaisampayana continued
  text: 'That foremost of the Bharatas--king Yudhishthira the just--then, thus addressed by his uncle, having gone through every ceremony of politeness, set out with his brothers for Khandavaprastha. And accompanied by Draupadi and ascending their cars which were all of the hue of the clouds, with cheerful hearts they all set out for that best of cities called Indraprastha.

    '
  modern: 'Thus addressed by his uncle, that foremost of the Bharatas, King Yudhiṣṭhira the just, went through every courtesy and set out with his brothers for Khāṇḍavaprastha. With Draupadī, they mounted their chariots, all the color of clouds, and set out with cheerful hearts for that best of cities, called Indraprastha.

    '
  speakerModern: 'Vaiśampāyana continued:'
sabha-2-96-5:
  ganguli: 2 LXXIII
  text: 'At these words, Duryodhana and Karna and Sakuni, the son of Suvala, all of whom were guided by vanity, united together, and desirous of counteracting the sons of Pandu, approaching in haste saw privately the wise king Dhritarashtra--the son of Vichitravirya and spake unto him these pleasing and artful words.

    '
  modern: 'At these words Duryodhana, Karṇa, and Śakuni, son of Subala, all guided by vanity, joined together, and, wanting to counter the sons of Pāṇḍu, went in haste and privately saw the wise King Dhṛtarāṣṭra, son of Vicitravīrya, and spoke to him these pleasing and artful words.

    '
sabha-2-96-6:
  ganguli: 2 LXXIII
  text: '(with sabha-2-96-5)

    '
sabha-2-96-8:
  ganguli: 2 LXXIII
  text: 'Hast thou not heard, O king, what the learned Vrihaspati the preceptor of the celestials, said in course of counselling Sakra about mortals and politics? Even these, O slayer of foes, were the words of Vrihaspati, ''Those enemies that always do wrong by stratagem or force, should be slain by every means.

    '
  modern: '"Have you not heard, O king, what the learned Bṛhaspati, the teacher of the celestials, said when advising Śakra about mortals and politics? These were Bṛhaspati''s words: ''Those enemies who always do wrong by trickery or force should be killed by every means.

    '
sabha-2-96-15:
  ganguli: 2 LXXIII
  text: 'Having ascended their cars that are full of all kinds of arms, they are whipping their horses (for going to Khandava soon) and assembling their forces.

    '
  modern: 'Having mounted their chariots, which are full of weapons of every kind, they are whipping their horses (to reach Khāṇḍava soon) and gathering their forces.

    '
sabha-2-96-16:
  ganguli: 2 LXXIII
  text: 'Persecuted thus by us they are incapable of forgiving us those injuries. Who is there among them that will forgive that insult to Draupadi?

    '
  modern: 'Persecuted by us in this way, they cannot forgive us those injuries. Who among them will forgive that insult to Draupadī?

    '
sabha-2-97-80:
  ganguli: 2 LXXIII
  text: 'We will again gamble with the son of Pandu for sending them to exile. O bull among men, we are competent to bring them thus under our sway.

    '
  modern: 'We will gamble again with the son of Pāṇḍu to send them into exile. O bull among men, we are able to bring them under our power in this way.

    '
sabha-2-97-84:
  ganguli: 2 LXXIII
  text: 'O bull of the Bharata race, O king, even this is our highest duty. This Sakuni knoweth well the whole science of dice.

    '
  modern: 'O bull of the Bharata race, O king, this is our highest duty. Śakuni knows the whole science of dice well.

    '
sabha-2-97-85:
  ganguli: 2 LXXIII
  text: 'Even if they succeed in observing this vow for thirteen years, we shall be in the meantime firmly rooted in the kingdom and making alliances, assemble a vast invincible host and keep them content, so that we shall, O king, defeat the sons of Pandu if they reappear.

    '
  modern: 'Even if they succeed in keeping this vow for thirteen years, in the meantime we shall be firmly rooted in the kingdom and making alliances; we shall assemble a vast, invincible army and keep them content, so that we shall, O king, defeat the sons of Pāṇḍu if they reappear."

    '
sabha-2-97-86:
  ganguli: 2 LXXIII
  text: '(with sabha-2-97-85)

    '
sabha-2-97-87:
  ganguli: 2 LXXIII
  text: 'Dhritarashtra said,--Bring back the Pandavas then, indeed, even if they have gone a great way. Let them come at once again to cast dice.

    '
  modern: 'Dhṛtarāṣṭra said, "Bring the Pāṇḍavas back, then, even if they have gone a long way. Let them come at once to cast dice again."

    '
sabha-2-97-91:
  ganguli: 2 LXXIV
  speaker: Vaisampayana said
  text: 'O monarch, it was then that the virtuous Gandhari, afflicted with grief on account of her affection for her sons, addressed king Dhritarashtra and said, …

    '
  modern: 'It was then, O monarch, that the virtuous Gāndhārī, afflicted with grief out of love for her sons, spoke to King Dhṛtarāṣṭra: …

    '
  speakerModern: 'Vaiśampāyana said:'
sabha-2-97-95:
  ganguli: 2 LXXIV
  text: 'Be not thou the cause of the terrible destruction of this race. Who is there that will break an embankment which hath been completed, or re-kindle a conflagration which hath been extinguished?

    '
  modern: 'Do not be the cause of the terrible destruction of this race. Who would break an embankment that has been completed, or rekindle a fire that has been put out?

    '
sabha-2-97-96:
  ganguli: 2 LXXIV
  text: 'O bull of the Bharata race, who is there that will provoke the peaceful sons of Pritha? Thou rememberest, O Ajamida, everything, but still I will call thy attention to this.

    '
  modern: 'O bull of the Bharata race, who would provoke the peaceful sons of Pṛthā? You remember everything, O Ajamīḍha, but still I will call your attention to this.

    '
sabha-2-97-98:
  ganguli: 2 LXXIV
  text: 'Let thy sons follow thee as their leader. Let them not be separated from thee for ever (by losing their lives). Therefore, at my word, O king, abandon this wretch of our race.

    '
  modern: 'Let your sons follow you as their leader. Do not let them be separated from you forever, by losing their lives. So, at my word, O king, abandon this wretch of our race.

    '
sabha-2-97-101:
  ganguli: 2 LXXIV
  text: 'The king, thus addressed by Gandhari who pointed out to him in such language the path of virtue, replied unto her, saying,--''If the destruction of our race is come, let it take place freely.

    '
  modern: 'The king, thus addressed by Gāndhārī, who pointed out to him in such language the path of virtue, replied to her, "If the destruction of our race has come, let it take place freely.

    '
sabha-2-97-102:
  ganguli: 2 LXXIV
  text: 'I am ill able to prevent it. Let it be as they (these my sons) desire. Let the Pandavas return. And let my sons again gamble with the sons of Pandu.

    '
  modern: 'I cannot prevent it. Let it be as they (these sons of mine) wish. Let the Pāṇḍavas return. And let my sons gamble again with the sons of Pāṇḍu."

    '
sabha-2-98-1:
  ganguli: 2 LXXV
  speaker: Vaisampayana said
  text: 'The royal messenger, agreeably to the commands of the intelligent king Dhritarashtra, coming upon Yudhishthira, the son of Pritha who had by that time gone a great way, addressed the monarch and said, …

    '
  modern: 'The royal messenger, following the commands of the intelligent King Dhṛtarāṣṭra, came up to Yudhiṣṭhira, son of Pṛthā, who had by then gone a long way, and said to the king, …

    '
  speakerModern: 'Vaiśampāyana said:'
sabha-2-98-2:
  ganguli: 2 LXXV
  text: '''Even these are the words of thy father-like uncle, O Bharata, spoken unto thee, ''The assembly is ready. O son of Pandu, O king Yudhisthira, come and cast the dice.

    '
  modern: '"These are the words of your father-like uncle, O Bharata, spoken to you: ''The assembly is ready. O son of Pāṇḍu, O King Yudhiṣṭhira, come and cast the dice.''"

    '
sabha-2-98-3:
  ganguli: 2 LXXV
  speaker: Yudhishthira said
  text: 'Creatures obtain fruits good and ill according to the dispensation of the Ordainer of the creation. Those fruits are inevitable whether I play or not.

    '
  modern: 'Creatures obtain good and bad fruits according to the dispensation of the Ordainer of creation. Those fruits are inevitable whether I play or not.

    '
  speakerModern: 'Yudhiṣṭhira said:'
sabha-2-98-4:
  ganguli: 2 LXXV
  text: 'This is a summons to dice; it is, besides the command of the old king. Although I know that it will prove destructive to me, yet I cannot refuse.

    '
  modern: 'This is a summons to dice, and besides it is the command of the old king. Although I know that it will destroy me, I cannot refuse."

    '
sabha-2-98-6:
  ganguli: 2 LXXV
  text: 'Yudhishthira, therefore, having said these words, retraced his steps along with his brothers. And knowing full well the deception practised by Sakuni, the son of Pritha came back to sit at dice with him again.

    '
  modern: 'Yudhiṣṭhira, having said these words, turned back with his brothers. Knowing full well the deceit Śakuni had practiced, the son of Pṛthā came back to sit down at dice with him again.

    '
sabha-2-98-10:
  ganguli: 2 LXXV
  text: 'Either defeated by ye at dice, dressed in deer skins we shall enter the great forest and live there for twelve years passing the whole of the thirteenth year in some inhabited region, unrecognised, and if recognised return to an exile of another twelve years; or vanquished by us, dressed in deer skins ye shall, with Krishna, live for twelve years in the woods passing the whole of the thirteenth year unrecognised, in some inhabited region.

    '
  modern: '"If you defeat us at dice, we will go into the great forest dressed in deerskins and live there twelve years, spending the whole thirteenth year unrecognized in some inhabited region, and if we are recognized, we will return to an exile of another twelve years. Or if we defeat you, you will live in the woods for twelve years, dressed in deerskins, with Kṛṣṇā, spending the whole thirteenth year unrecognized in some inhabited region.

    '
sabha-2-98-11:
  ganguli: 2 LXXV
  text: 'If recognised, an exile of another twelve years is to be the consequence.

    '
  modern: 'If recognized, another exile of twelve years will follow.

    '
sabha-2-98-12:
  ganguli: 2 LXXV
  text: '(with sabha-2-98-10)

    '
sabha-2-98-13:
  ganguli: 2 LXXV
  text: '(with sabha-2-98-11)

    '
sabha-2-98-15:
  ganguli: 2 LXXV
  text: 'O Yudhishthira, with this resolution, play with us, O Bharata, casting the dice.

    '
  modern: 'O Yudhiṣṭhira, with this resolution, play with us, O Bharata, and cast the dice."

    '
sabha-2-98-24:
  ganguli: 2 LXXV
  text: 'Vaisampayana continued,--King Yudhishthira, even hearing these various remarks, from shame and a sense of virtue again sat at dice.

    '
  modern: 'King Yudhiṣṭhira, even hearing these various remarks, sat down again at dice, out of shame and a sense of virtue.

    '
sabha-2-98-29:
  ganguli: 2 LXXV
  speaker: And Yudhishthira said
  text: 'The son of Pritha, however, accepted it and Sakuni took up the dice. And casting them he said unto Yudhishthira,--''Lo, I have won."

    '
  modern: 'The son of Pṛthā accepted it, and Śakuni took up the dice. And casting them he said to Yudhiṣṭhira, "Lo, I have won."

    '
  speakerModern: 'And Yudhiṣṭhira said:'
sabha-2-99-2:
  ganguli: 2 LXXVI
  text: 'And they, one after another, in due order, casting off their royal robes, attired themselves in deer-skins. And Dussasana, beholding those chastisers of foes, dressed in deer-skins and deprived of their kingdom and ready to go into exile, exclaimed …

    '
  modern: 'One by one, in due order, they cast off their royal robes and put on deerskins. And Duḥśāsana, seeing those chastisers of foes in deerskins, deprived of their kingdom and ready to go into exile, cried out …

    '
sabha-2-99-6:
  ganguli: 2 LXXVI
  text: 'They who, proud of their wealth, laughed in derision at the son of Dhritarashtra, will now have to go into the woods, defeated and deprived by us of all their wealth.

    '
  modern: 'Those who, proud of their wealth, laughed at the son of Dhṛtarāṣṭra, will now have to go into the woods, defeated and deprived by us of all their wealth.

    '
sabha-2-99-10:
  ganguli: 2 LXXVI
  text: 'The wise Yajnasena of the Somake race, having bestowed his daughter--the princess of Panchala--on the sons of Pandu, acted most unfortunately for the husbands of Yajnaseni--these sons of Pritha are as eunuchs.

    '
  modern: 'The wise Yajñasena of the Somaka race acted most unfortunately, when he gave his daughter, the princess of Pañcāla, to the sons of Pāṇḍu: these sons of Pṛthā are like eunuchs to her.

    '
sabha-2-99-11:
  ganguli: 2 LXXVI
  text: 'And O Yajnaseni, what joy will be thine upon beholding in the woods these thy husbands dressed in skins and thread-bare rags, deprived of their wealth and possessions. Elect thou a husband, whomsoever thou likest, from among all these present here.

    '
  modern: 'And O Yājñasenī, what joy will you have when you see in the woods these husbands of yours, dressed in skins and threadbare rags, deprived of their wealth and possessions? Choose a husband, whomever you like, from among all those present here.

    '
sabha-2-99-16:
  ganguli: 2 LXXVI
  text: 'Boastest thou thus in the midst of the kings, advanced as thou art by the skill of the king of Gandhara.

    '
  modern: 'You boast like this in the midst of the kings, raised up as you are by the skill of the king of Gāndhāra.

    '
sabha-2-99-17:
  ganguli: 2 LXXVI
  text: 'As thou piercest our hearts hear with these thy arrowy words, so shall I pierce thy heart in battle, recalling all this to thy mind.

    '
  modern: 'As you pierce our hearts with your arrowy words, so I will pierce your heart in battle, reminding you of all this.

    '
sabha-2-99-20:
  ganguli: 2 LXXVI
  text: 'Bhima at this once more said,--Wretch darest thou, O Dussasana, use harsh words as these? Whom doth it behove to boast, thus having won wealth by foul means?

    '
  modern: 'Bhīma again said, "Wretch, do you dare, O Duḥśāsana, to use such harsh words? Whom does it suit to boast, having won wealth by foul means?

    '
sabha-2-99-22:
  ganguli: 2 LXXVI
  text: 'I tell thee that if Vrikodara, the son of Pritha, drinketh not thy life-blood, piercing open thy breast in battle, let him not attain to regions of blessedness, I tell thee truly that by slaying the sons of Dhritarashtra in battle, before the very eyes of all the warriors, I shall pacify this wrath of mine soon enough.

    '
  modern: 'I tell you that if Vṛkodara, the son of Pṛthā, does not drink your life blood, tearing open your breast in battle, let him not reach the regions of the blessed. I tell you truly that by killing the sons of Dhṛtarāṣṭra in battle before the eyes of all the warriors, I will soon satisfy this anger of mine."

    '
sabha-2-99-26:
  ganguli: 2 LXXVI
  speaker: And Arjuna said
  text: '… also spake these words while going out of the Kaurava court, ''I will slay Duryodhana, and Dhananjaya will slay Karna, and Sahadeva will slay Sakuni that gambler with dice.

    '
  modern: '… and said as he went out of the Kaurava court, "I will slay Duryodhana, and Dhanañjaya will slay Karṇa, and Sahadeva will slay Śakuni, that gambler with dice.

    '
  speakerModern: 'And Arjuna said:'
sabha-2-99-28:
  ganguli: 2 LXXVI
  speaker: And Bhima again said
  text: '… I will slay this wretched Duryodhana in battle with my mace, and prostrating him on the ground I will place my foot on his head.

    '
  modern: '… I will slay this wretched Duryodhana in battle with my mace, and when he lies on the ground I will place my foot on his head.

    '
  speakerModern: 'And Bhīma again said:'
sabha-2-99-29:
  ganguli: 2 LXXVI
  speaker: Vaisampayana continued
  text: 'And as regards this (other) wicked person--Dussasana who is audacious in speech, I will drink his blood like a lion.

    '
  modern: 'And as for this other wicked man, Duḥśāsana, bold in speech, I will drink his blood like a lion.

    '
  speakerModern: 'Vaiśampāyana continued:'
sabha-2-99-31:
  ganguli: 2 LXXVI
  text: 'And Arjuna said,--O Bhima, the resolutions of superior men are not known in words only. On the fourteenth year from this day, they shall see what happeneth.

    '
  modern: 'And Arjuna said, "O Bhīma, the resolutions of superior men are not known by words alone. On the fourteenth year from today, they will see what happens."

    '
sabha-2-99-48:
  ganguli: 2 LXXVI
  speaker: Vaisampayana continued
  text: 'And those tigers among men, all endued with long arms, having thus pledged themselves to virtuous promises approached king Dhritarashtra.

    '
  modern: 'And those tigers among men, all long-armed, having made these virtuous promises, approached King Dhṛtarāṣṭra.

    '
  speakerModern: 'Vaiśampāyana continued:'
sabha-2-101-61:
  ganguli: 2 LXXVIII
  speaker: Vaisampayana continued
  text: 'The Pandavas then consoled their weeping mother and with hearts plunged in grief set out for the woods. …

    '
  modern: 'The Pāṇḍavas then comforted their weeping mother and, with hearts full of grief, set out for the woods. …

    '
  speakerModern: 'Vaiśampāyana continued:'
sabha-2-102-31:
  ganguli: 2 LXXIX
  text: 'And as those foremost of men had gone away from Hastinapore, flashes of lightning appeared in the sky though without clouds and the earth itself began to tremble.

    '
  modern: 'And as those foremost of men went away from Hāstinapura, flashes of lightning appeared in a cloudless sky and the earth itself began to tremble.

    '
vana-3-1-10:
  ganguli: 3 I
  text: 'And issuing through Vardhamana gate of the city, the Pandavas bearing their weapons and accompanied by Draupadi set out in a northernly direction.

    '
  modern: 'Leaving by the Vardhamāna gate of the city, the Pāṇḍavas, carrying their weapons and accompanied by Draupadī, set out toward the north.

    '
vana-3-1-11:
  ganguli: 3 I
  text: 'Indrasena and others, with servants numbering altogether fourteen, with their wives, followed them on swift cars.

    '
  modern: 'Indrasena and the others, fourteen servants in all, with their wives, followed them on swift chariots.

    '
vana-3-1-13:
  ganguli: 3 I
  text: 'And the citizens learning of their departure became overwhelmed with sorrow, and began to censure Bhishma and Vidura and Drona and Gautama.

    '
  modern: 'And the citizens, learning of their departure, were overwhelmed with sorrow and began to blame Bhīṣma, Vidura, Droṇa, and Gautama.

    '
vana-3-1-17:
  ganguli: 3 I
  text: 'The whole earth is doomed when Duryodhana becometh its ruler. Thither, therefore, let us proceed whither the merciful and high-minded sons of Pandu with passions under control and victorious over foes, and possessed of modesty and renown, and devoted to pious practices, repair!''

    '
  modern: 'The whole earth is doomed when Duryodhana becomes its ruler. Let us go where the merciful and high-minded sons of Pāṇḍu go—men who control their passions, who defeat their foes, who are modest and renowned, and devoted to pious practices!

    '
vana-3-1-19:
  ganguli: 3 I
  speaker: Vaisampayana said
  text: 'And saying this, the citizens went after the Pandavas, and having met them, they all, with joined hands, thus addressed the sons of Kunti and Madri.

    '
  modern: 'Saying this, the citizens went after the Pāṇḍavas, and having met them, they all spoke with joined hands to the sons of Kuntī and Mādrī.

    '
  speakerModern: 'Vaiśampāyana said:'
vana-3-1-35:
  ganguli: 3 I
  text: 'Our grandfather Bhishma, the king (Dhritarashtra), Vidura, my mother and most of my well-wishers, are all in the city of Hastinapura.

    '
  modern: 'Our grandfather Bhīṣma, the king (Dhṛtarāṣṭra), Vidura, my mother, and most of my well-wishers are all in the city of Hāstinapura.

    '
vana-3-1-36:
  ganguli: 3 I
  text: 'Therefore, if ye are minded to seek our welfare, cherish ye them with care, uniting together as they are overwhelmed with sorrow and afflictions.

    '
  modern: 'So if you want to do us good, take care of them, and unite, for they are overwhelmed with sorrow and distress.

    '
vana-3-1-37:
  ganguli: 3 I
  text: 'Grieved at our departure, ye have come far! Go ye back, and let your hearts be directed with tenderness towards the relatives I entrust to you as pledges!

    '
  modern: 'You have come far, grieved at our departure! Go back, and turn your hearts with tenderness to the relatives I entrust to you as pledges.

    '
vana-3-1-39:
  ganguli: 3 I
  speaker: Vaisampayana continued
  text: 'Thus exhorted by Yudhishthira the just, the people in a body set up a loud wail exclaiming,--Alas, O king!

    '
  modern: 'Thus exhorted by Yudhiṣṭhira the just, the people in a body set up a loud wail, crying, "Alas, O king!"

    '
  speakerModern: 'Vaiśampāyana continued:'
vana-3-1-40:
  ganguli: 3 I
  text: 'And afflicted and overwhelmed with sorrow on remembering the virtues of Pritha''s son, they unwillingly retraced their steps asking leave of the Pandavas.

    '
  modern: 'Afflicted and overwhelmed with sorrow, remembering the virtues of Pṛthā''s son, they unwillingly turned back, asking leave of the Pāṇḍavas.

    '
vana-3-5-3:
  ganguli: 3 V
  text: 'And at length they saw before them the woods, Kamyaka, the favourite haunt of Munis, situated by a level and wild plain on the banks of the Saraswati.

    '
  modern: 'At length they saw before them the woods of Kāmyaka, the favorite haunt of ascetics, on a level, wild plain on the bank of the Sarasvatī.

    '
vana-3-5-4:
  ganguli: 3 V
  text: 'And in those woods, O Bharata, abounding in birds and deer, those heroes began to dwell, entertained and comforted by the Munis.

    '
  modern: 'And in those woods, O Bharata, full of birds and deer, those heroes began to live, entertained and comforted by the ascetics.

    '
vana-3-12-1:
  ganguli: 3 XII
  speaker: Vaisampayana said
  text: 'Hearing that the Pandavas had been banished, the Bhojas, the Vrishnis, and the Andhakas went to those heroes residing in affliction in the great forest.

    '
  modern: 'Hearing that the Pāṇḍavas had been banished, the Bhojas, the Vṛṣṇis, and the Andhakas went to those heroes who were living in distress in the great forest.

    '
  speakerModern: 'Vaiśampāyana said:'
vana-3-12-2:
  ganguli: 3 XII
  text: 'And the consanguineous relatives of Panchala, and Dhrishtaketu the king of Chedi, and those celebrated and powerful brothers--the Kaikeyas, their hearts fired with wrath, went to the forest to see the sons of Pritha.

    '
  modern: 'And the kinsmen of Pañcāla, and Dhṛṣṭaketu, the king of Cedi, and the famous and powerful Kaikeya brothers, their hearts burning with wrath, went to the forest to see the sons of Pṛthā.

    '
vana-3-12-4:
  ganguli: 3 XII
  text: 'And those bulls of the Kshatriya race, with Vasudeva at their head, sat themselves down round Yudhishthira the just.

    '
  modern: 'And those bulls of the Kṣatriya race, with Vāsudeva at their head, sat down around Yudhiṣṭhira the just.

    '
vana-3-12-61:
  ganguli: 3 XII
  text: 'The rulers of the several worlds, those worlds themselves, the stellar conjunctions, the ten points of the horizon, the firmament, the moon, and the sun, are all established in thee!

    '
  modern: 'The rulers of the several worlds, those worlds themselves, the constellations, the ten points of the horizon, the sky, the moon, and the sun are all established in you!

    '
vana-3-12-63:
  ganguli: 3 XII
  text: 'Thou art the Supreme lord of all creatures, celestial or human! Therefore it is, O slayer of Madhu, that impelled by the affection thou bearest me that I will relate to thee my griefs!

    '
  modern: 'You are the supreme lord of all creatures, celestial or human! Therefore, O slayer of Madhu, moved by the affection you have for me, I will tell you my griefs!

    '
vana-3-12-64:
  ganguli: 3 XII
  text: 'O Krishna, how could one like me, the wife of Pritha''s sons, the sister of Dhrishtadyumna, and the friend of thee, be dragged to the assembly!

    '
  modern: 'O Kṛṣṇa, how could one like me, the wife of Pṛthā''s sons, the sister of Dhṛṣṭadyumna, and your friend, be dragged into the assembly!

    '
vana-3-12-67:
  ganguli: 3 XII
  text: 'O slayer of Madhu, while the sons of Pandu and the Panchalas and the Vrishnis lived, they dared express the desire of using me as their slave!

    '
  modern: 'O slayer of Madhu, while the sons of Pāṇḍu, the Pañcālas, and the Vṛṣṇis were alive, they dared to wish to use me as their slave!

    '
vana-3-12-71:
  ganguli: 3 XII
  text: 'This eternal course of morality is ever followed by the virtuous--viz., that the husband, however weak, protecteth his wedded wife!

    '
  modern: 'This is the eternal course of morality, always followed by the virtuous: that the husband, however weak, protects his wedded wife!

    '
vana-3-12-74:
  ganguli: 3 XII
  text: 'The Pandavas never forsake the person that soliciteth their protection, and yet they abandoned me who solicited it!

    '
  modern: 'The Pāṇḍavas never abandon a person who asks for their protection, and yet they abandoned me when I asked for it!

    '
vana-3-12-79:
  ganguli: 3 XII
  text: 'Deprived of their kingdom by deception, the Pandavas were made bondsmen and I myself was dragged to the assembly while in my season, and having only a single cloth on!

    '
  modern: 'The Pāṇḍavas were robbed of their kingdom by deception and made bondsmen, and I myself was dragged into the assembly in my season, wearing only a single cloth!

    '
vana-3-12-81:
  ganguli: 3 XII
  text: '… Fie on the strength of Bhima, and fie on the prowess of Arjuna, since, O Krishna, Duryodhana (after what he had done) hath drawn breath even for a moment!

    '
  modern: '… Shame on Bhīma''s strength, and shame on Arjuna''s prowess, since, O Kṛṣṇa, Duryodhana (after what he did) has drawn breath even for a moment!

    '
vana-3-12-123:
  ganguli: 3 XII
  text: 'Born I was in a great race, coming into the world in an extraordinary way! I am also the beloved wife of the Pandavas, and the daughter-in-law of the illustrious Pandu!

    '
  modern: 'I was born in a great family, and came into the world in an extraordinary way! I am also the beloved wife of the Pāṇḍavas and the daughter-in-law of the illustrious Pāṇḍu!

    '
vana-3-12-124:
  ganguli: 3 XII
  text: 'The foremost of women and devoted to my husbands, even I, O Krishna, was seized by hair, O slayer of Madhu, in the sight of the Pandavas, each of whom is like an Indra himself!

    '
  modern: 'I, the foremost of women and devoted to my husbands, O Kṛṣṇa, was seized by the hair, O slayer of Madhu, in the sight of the Pāṇḍavas, each of whom is like an Indra himself!

    '
vana-3-12-128:
  ganguli: 3 XII
  text: '… ''Husbands, or sons, or friends, or brothers, or father, have I none! Nor have I thee, O thou slayer of Madhu, for ye all, beholding me treated so cruelly by inferior foes, sit still unmoved!

    '
  modern: '… "I have no husbands, or sons, or friends, or brothers, or father! And I have none in you either, O slayer of Madhu, for all of you, seeing me treated so cruelly by lesser foes, sit still, unmoved!

    '
vana-3-12-130:
  ganguli: 3 XII
  text: 'On these grounds I deserve to be ever protected by thee, O Kesava, viz., our relationship, thy respect (for me), our friendship, and thy lordship (over me)

    '
  modern: 'For these reasons I deserve always to be protected by you, O Keśava: our relationship, your respect for me, our friendship, and your lordship over me.

    '
vana-3-12-133:
  ganguli: 3 XII
  text: 'Weep not, lady, for I will exert to the utmost of my powers for the sons of Pandu! I promise thou shalt (once more) be the queen of kings!

    '
  modern: 'Do not weep, lady, for I will do all I can for the sons of Pāṇḍu! I promise you will once more be the queen of kings!

    '
vana-3-13-1:
  ganguli: 3 XIII
  text: 'Vasudeva said, O lord of earth, if I had been present at Dwaraka, then, O king, this evil would not have befallen thee!

    '
  modern: 'Vāsudeva said, "O lord of the earth, if I had been in Dvārakā, O king, this evil would not have come upon you!

    '
vana-3-13-2:
  ganguli: 3 XIII
  text: 'And, O irrepressible one, coming unto the gambling-match, even if uninvited by the son of Amvika (Dhritarashtra), or Duryodhana, or by the other Kauravas, I would have prevented the game from taking place, by showing its many evils …

    '
  modern: 'And, O irrepressible one, even if I had not been invited to the gambling match by the son of Ambikā (Dhṛtarāṣṭra), by Duryodhana, or by the other Kauravas, I would have come, and I would have prevented the game by showing its many evils …

    '
vana-3-13-7:
  ganguli: 3 XIII
  text: 'Women, dice, hunting and drinking to which people become addicted in consequence of temptation, have been regarded as the four evils that deprive a man of prosperity.

    '
  modern: 'Women, dice, hunting, and drinking, to which people become addicted through temptation, have been counted as the four evils that rob a man of prosperity.

    '
vana-3-13-9:
  ganguli: 3 XIII
  text: 'O thou of mighty arms, appearing before the son of Amvika, I would have pointed out that through dice men in a day lose their possessions, and fall into distress, and are deprived of their untasted wealth, and exchange harsh words!

    '
  modern: 'O mighty-armed one, appearing before the son of Ambikā, I would have pointed out that through dice men lose their possessions in a day, fall into distress, lose their untasted wealth, and trade harsh words!

    '
vana-3-22-44:
  ganguli: 3 XXII
  speaker: Vaisampayana continued
  text: 'Having addressed the Kaurava thus, that foremost of male persons, of mighty arms, the slayer of Madhu, possessed of every grace, saluting the Pandavas, prepared for departure.

    '
  modern: 'Having spoken thus to the Kaurava, that foremost of men, mighty-armed and endowed with every grace, the slayer of Madhu, saluted the Pāṇḍavas and prepared to leave.

    '
  speakerModern: 'Vaiśampāyana continued:'
vana-3-22-47:
  ganguli: 3 XXII
  text: 'And causing Subhadra and Abhimanyu to ascend his golden car, Krishna, mounted it himself, worshipped by the Pandavas.

    '
  modern: 'Kṛṣṇa made Subhadrā and Abhimanyu climb onto his golden chariot, and mounted it himself, honored by the Pāṇḍavas.

    '
vana-3-22-48:
  ganguli: 3 XXII
  text: 'And consoling Yudhishthira, Krishna set out for Dwaraka on his car resplendent as the sun and unto which were yoked the horses Saivya and Sugriva.

    '
  modern: 'And after consoling Yudhiṣṭhira, Kṛṣṇa set out for Dvārakā in his chariot, which shone like the sun and to which the horses Śaibya and Sugrīva were yoked.

    '
vana-3-22-49:
  ganguli: 3 XXII
  text: 'And after he of the Dasharha race had departed, Dhristadyumna, the son of Prishata, also set out for his own city, taking with him the sons of Draupadi.

    '
  modern: 'After he of the Daśārha race had left, Dhṛṣṭadyumna, the son of Pṛṣata, also set out for his own city, taking with him the sons of Draupadī.

    '
vana-3-24-16:
  ganguli: 3 XXIV
  speaker: Vaisampayana continued
  text: 'Then the virtuous son of Pandu, accompanied by numerous Brahmanas, all went to the sacred lake called Dwaitavana.

    '
  modern: 'Then the virtuous son of Pāṇḍu, with many Brāhmaṇas, went to the sacred lake called Dvaitavana.

    '
  speakerModern: 'Vaiśampāyana continued:'
vana-3-27-2:
  ganguli: 3 XXVII
  text: 'And the handsome and well informed Krishna dear unto her lords and devoted to them, thus spake unto Yudhishthira …

    '
  modern: 'And the beautiful and well-informed Kṛṣṇā, dear to her lords and devoted to them, spoke to Yudhiṣṭhira …

    '
vana-3-27-35:
  ganguli: 3 XXVII
  text: 'Truly, O thou best of the Bharatas, thou hast no anger, else why is it that thy mind is not moved at sight of thy brothers and myself (in such distress)?

    '
  modern: 'Truly, O best of the Bharatas, you have no anger, or why is your mind not moved at the sight of your brothers and me in such distress?

    '
vana-3-30-3:
  ganguli: 3 XXX
  text: 'It seemeth that man can never attain prosperity in this world by virtue, gentleness, forgiveness, straight-forwardness and fear of censure!

    '
  modern: 'It seems that a man can never attain prosperity in this world by virtue, gentleness, forgiveness, straightforwardness, or fear of censure!

    '
vana-3-30-40:
  ganguli: 3 XXX
  text: 'Beholding this thy distress and the prosperity of Suyodhana, I do not speak highly of the Great Ordainer who suffereth such inequality!

    '
  modern: 'Seeing this distress of yours and Suyodhana''s prosperity, I do not speak highly of the Great Ordainer who allows such inequality!

    '
vana-3-31-2:
  ganguli: 3 XXXI
  text: 'O princess, I never act, solicitous of the fruits of my actions. I give away, because it is my duty to give; I sacrifice because it is my duty to sacrifice!

    '
  modern: 'O princess, I never act in the hope of reward for my actions. I give because it is my duty to give; I sacrifice because it is my duty to sacrifice!

    '
vana-3-31-5:
  ganguli: 3 XXXI
  text: 'My heart, O Krishna, is naturally attracted towards virtue. The man who wisheth to reap the fruits of virtue is a trader in virtue. His nature is mean and he should never be counted amongst the virtuous.

    '
  modern: 'My heart, O Kṛṣṇā, is naturally drawn toward virtue. The man who wants to reap the fruits of virtue is a trader in virtue. His nature is mean, and he should never be counted among the virtuous.

    '
vana-3-31-6:
  ganguli: 3 XXXI
  text: 'Nor doth he ever obtain the fruits of his virtues! Nor doth he of sinful heart, who having accomplished a virtuous act doubteth in his mind, obtain the fruits of his act, in consequence of that scepticism of his!

    '
  modern: 'Nor will he ever obtain the fruits of his virtues! Nor does the sinful-hearted man who, having done a virtuous act, doubts it in his mind, obtain the fruits of his act, because of that doubt!

    '
vana-3-31-24:
  ganguli: 3 XXXI
  text: 'O daughter of Drupada, religion is the only raft for those desirous of going to heaven, like a ship to merchants desirous of crossing the ocean.

    '
  modern: 'O daughter of Drupada, religion is the only raft for those who wish to go to heaven, like a ship to merchants who wish to cross the ocean.

    '
vana-3-31-41:
  ganguli: 3 XXXI
  text: 'Slander not God, who is the lord of all creatures. Learn how to know him. Bow down unto him. Let not thy mind be such.

    '
  modern: 'Do not slander God, the lord of all creatures. Learn how to know him. Bow down to him. Do not let your mind be like this.

    '
vana-3-32-1:
  ganguli: 3 XXXII
  speaker: Draupadi said
  text: 'I do not ever disregard or slander religion, O son of Pritha! Why should I disregard God, the lord of all creatures?

    '
  modern: 'I never disregard or slander religion, O son of Pṛthā! Why should I disregard God, the lord of all creatures?

    '
  speakerModern: 'Draupadī said:'
vana-3-32-2:
  ganguli: 3 XXXII
  text: 'Afflicted with woe, know me, O Bharata, to be only raving I will once more indulge in lamentations; listen to me with attention O persecutor of all enemies …

    '
  modern: 'Afflicted with woe, know me, O Bharata, to be only raving. I will once more indulge in lamentations; listen to me with attention, O persecutor of all enemies …

    '
vana-3-33-6:
  ganguli: 3 XXXIII
  text: 'It was for thy carelessness, O king, that our kingdom protected by the wielder of the Gandiva and therefore, incapable of being wrested by Indra himself, was snatched from us in our very sight.

    '
  modern: 'It was through your carelessness, O king, that our kingdom, protected by the wielder of the Gāṇḍīva and so impossible even for Indra to seize, was taken from us before our eyes.

    '
vana-3-33-13:
  ganguli: 3 XXXIII
  text: 'Afflicted with the vows, thy cry is Religion! Religion! Hast thou from despair been deprived of thy manliness?

    '
  modern: 'Afflicted with vows, your cry is Religion! Religion! Has despair robbed you of your manliness?

    '
vana-3-35-35:
  ganguli: 3 XXXV
  text: 'Therefore, O king resolve thou to slay thy enemies. There is no virtue higher than fighting, for every Kshatriya!

    '
  modern: 'Therefore, O king, resolve to kill your enemies. For every Kṣatriya there is no virtue higher than fighting!"

    '
vana-3-36-3:
  ganguli: 3 XXXVI
  text: '… Knowing as I do the true course of virtue, which, however is so very difficult of being known, how can I forcibly grind virtue down like grinding the mountains of Meru?

    '
  modern: '… Knowing as I do the true course of virtue, which is so very hard to know, how can I forcibly grind virtue down, as one grinds the mountains of Meru?

    '
vana-3-36-11:
  ganguli: 3 XXXVI
  text: 'Those kings and chiefs of the earth also who have been injured by us, have all adopted the side of the Kauravas, and are bound by ties of affection to them.

    '
  modern: 'Those kings and chiefs of the earth whom we have injured have all taken the Kauravas'' side and are bound to them by ties of affection.

    '
vana-3-36-19:
  ganguli: 3 XXXVI
  text: 'Without first vanquishing in battle all those foremost of men, unaided as thou art, how canst thou slay Duryodhana?

    '
  modern: 'Without first defeating in battle all those foremost of men, unaided as you are, how can you kill Duryodhana?

    '
vana-3-36-20:
  ganguli: 3 XXXVI
  text: 'O Vrikodara, I cannot sleep thinking of the lightness of hand of that Suta''s son, who, I regard, is the foremost of all wielders of the bow!

    '
  modern: 'O Vṛkodara, I cannot sleep for thinking of the lightness of hand of that Sūta''s son, whom I regard as the foremost of all wielders of the bow!"

    '
vana-3-36-21:
  ganguli: 3 XXXVI
  speaker: Vaisampayana continued
  text: 'Hearing these words of Yudhishthira, the impetuous Bhima became alarmed, and forbore from speaking anything.

    '
  modern: 'Hearing these words of Yudhiṣṭhira, the impetuous Bhīma became alarmed and said nothing more.

    '
  speakerModern: 'Vaiśampāyana continued:'
vana-3-36-22:
  ganguli: 3 XXXVI
  text: 'And while the sons of Pandu were thus conversing with each other, there came to that spot the great ascetic Vyasa, the son of Satyavati.

    '
  modern: 'And while the sons of Pāṇḍu were talking together in this way, the great ascetic Vyāsa, the son of Satyavatī, came to that place.

    '
vana-3-36-26:
  ganguli: 3 XXXVI
  text: 'The fear that is in thy heart, arising from Bhishma, and Drona, and Kripa, and Karna, and Drona''s son, and prince Duryodhana, and Dussasana, I will dispell, O slayer of all foes, by means of an act enjoined by the ordinance.

    '
  modern: 'The fear in your heart, arising from Bhīṣma, Droṇa, Kṛpa, Karṇa, Droṇa''s son, and Prince Duryodhana and Duḥśāsana, I will dispel, O slayer of all foes, by means of an act enjoined by the ordinance.

    '
vana-3-36-30:
  ganguli: 3 XXXVI
  text: 'Uttered by me and like unto success personified, accept from me this knowledge called Pratismriti that I impart to thee, knowing thou art capable of receiving it.

    '
  modern: 'Spoken by me, and like success itself, accept from me this knowledge called Pratismṛti, which I give you knowing you are able to receive it.

    '
vana-3-36-31:
  ganguli: 3 XXXVI
  text: 'Receiving it (from thee), Arjuna will be able to accomplish his desire. And let Arjuna, O son of Pandu, go unto Mahendra and Rudra, and Varuna, and Kuvera, and Yama, for receiving weapon from them.

    '
  modern: 'Receiving it from you, Arjuna will be able to accomplish his desire. And let Arjuna, O son of Pāṇḍu, go to Mahendra, Rudra, Varuṇa, Kubera, and Yama, to receive weapons from them.

    '
vana-3-36-35:
  ganguli: 3 XXXVI
  text: '… think also of going from this to some other forest that may, O king, be fit for thy abode. To reside in one place for any length of time is scarcely pleasant. In thy case, it might also be productive of anxiety to the ascetics.

    '
  modern: '… think of going from here to some other forest that may be fit for your home, O king. To stay in one place for a long time is hardly pleasant. In your case it might also cause anxiety to the ascetics.

    '
vana-3-36-41:
  ganguli: 3 XXXVI
  text: 'Glad of the advice given him by Vyasa, the son of Kunti then, leaving the wood Dwaitavana went to the forest of Kamyaka on the banks of the Saraswati.

    '
  modern: 'Glad of the advice Vyāsa had given him, the son of Kuntī left the wood of Dvaitavana and went to the forest of Kāmyaka on the bank of the Sarasvatī.

    '
vana-3-37-1:
  ganguli: 3 XXXVII
  speaker: Vaisampayana said
  text: 'After some time, Yudhishthira the just, remembering the command of the Muni (Vyasa) and calling unto himself that bull among men--Arjuna--possessed of great wisdom, addressed him in private.

    '
  modern: 'After some time, Yudhiṣṭhira the just remembered the command of the sage Vyāsa. He called Arjuna, that bull among men, a man of great wisdom, and spoke to him in private.

    '
  speakerModern: 'Vaiśampāyana said:'
vana-3-37-18:
  ganguli: 3 XXXVII
  text: 'And the elder brother having communicated with due rites the knowledge unto his heroic brother, with speech and body and mind under perfect control, commanded him to depart.

    '
  modern: 'And the elder brother, having taught the knowledge to his heroic brother with due rites, with speech, body, and mind under perfect control, told him to depart.

    '
vana-3-37-21:
  ganguli: 3 XXXVII
  text: 'The strong-armed son of Pandu then, having walked round his brothers and round Dhaumya also, and taking up his handsome bow, set out.

    '
  modern: 'The strong-armed son of Pāṇḍu then walked around his brothers and around Dhaumya too, took up his handsome bow, and set out.

    '
vana-3-38-22:
  ganguli: 3 XXXVIII
  text: 'Passing over those difficult and woody regions at the foot of the great mountains, Arjuna soon reached the breast of the Himavat; and staying there for sometime began to shine in his brilliancy.

    '
  modern: 'Passing over those difficult, wooded regions at the foot of the great mountains, Arjuna soon reached the breast of the Himavat, and, staying there for some time, shone in his brilliance.

    '
vana-3-39-73:
  ganguli: 3 XXXIX
  text: 'Bending down on his knee and bowing with his head, that conqueror of hostile cities-the son of Pritha-worshipped Hara and inclined him to grace.

    '
  modern: 'Bending his knee and bowing his head, that conqueror of hostile cities, the son of Pṛthā, worshipped Hara and won his favor.

    '
vana-3-39-83:
  ganguli: 3 XXXIX
  speaker: Vaisampayana continued
  text: 'Endued with great might, the god whose sign was the bull, taking into his the handsome hands of Arjuna, smilingly replied unto him, saying, ''I have pardoned thee.

    '
  modern: 'The mighty god whose sign was the bull took Arjuna''s handsome hands in his and said to him with a smile, "I have pardoned you."

    '
  speakerModern: 'Vaiśampāyana continued:'
vana-3-40-15:
  ganguli: 3 XL
  text: 'I will give to thee that favourite weapon of mine called the Pasuputa. O son of Pandu, thou art capable of holding, hurling, and withdrawing it.

    '
  modern: 'I will give you that favorite weapon of mine called Pāśupata. O son of Pāṇḍu, you are able to hold it, hurl it, and withdraw it.

    '
vana-3-40-21:
  ganguli: 3 XL
  speaker: Vaisampayana continued
  text: 'Hearing these words, the son of Pritha purified himself. And approaching the lord of the universe with rapt attention, he said, ''Instruct me!

    '
  modern: 'Hearing these words, the son of Pṛthā purified himself. And approaching the lord of the universe with rapt attention, he said, "Instruct me!"

    '
  speakerModern: 'Vaiśampāyana continued:'
vana-3-41-48:
  ganguli: 3 XLI
  text: 'Beholding those protectors of the worlds assembled together on the heights of Himavat, Dhananjaya, the son of Kunti, wondered much, Endued with great energy, he then duly worshipped the assembled Lokapalas, with words, water, and fruits.

    '
  modern: "Seeing those guardians of the worlds assembled on the heights of the Himavat, Dhanañjaya, son of Kuntī, was greatly astonished. Endowed with great energy, he then duly worshipped the assembled Lokapālas with words, water, and fruits."
vana-3-41-50:
  ganguli: 3 XLI
  text: 'That bull among men--Arjuna--having obtained weapons thus, was filled with pleasure. And he regarded himself as one whose desires had been fulfilled and who was crowned with success.

    '
  modern: 'That bull among men, Arjuna, having obtained weapons in this way, was filled with pleasure. He regarded himself as one whose desires had been fulfilled and who had been crowned with success.

    '
vana-3-42-42:
  ganguli: 3 XLII
  text: 'And the celebrated Arjuna having thus passed through successive regions of heaven at last beheld Amaravati, the city of Indra.

    '
  modern: 'And the celebrated Arjuna, having passed in this way through successive regions of heaven, at last saw Amarāvatī, the city of Indra.

    '
vana-3-43-16:
  ganguli: 3 XLIII
  text: '… And the mighty son of Kunti, approaching Indra, saluted him by bending his head to the ground.

    '
  modern: '… And the mighty son of Kuntī, approaching Indra, saluted him, bending his head to the ground.

    '
vana-3-43-37:
  ganguli: 3 XLIV
  text: 'And the son of Pandu, after he had obtained those weapons, recollected his brothers. And at the command of Indra, however, he lived for full five years in heaven, surrounded by every comfort and luxury.

    '
  modern: 'And the son of Pāṇḍu, after he had obtained those weapons, remembered his brothers. At Indra''s command, however, he lived for full five years in heaven, surrounded by every comfort and luxury.

    '
vana-3-78-4:
  ganguli: 3 LXXX
  speaker: Vaisampayana said
  text: 'After Arjuna of unbaffled prowess had gone away from Kamyaka, the sons of Pandu, O son, were filled with sorrow and grief.

    '
  modern: 'After Arjuna of unfailing prowess had left Kāmyaka, the sons of Pāṇḍu, O son, were filled with sorrow and grief.

    '
  speakerModern: 'Vaiśampāyana said:'
vana-3-78-7:
  ganguli: 3 LXXX
  text: 'And, O Janamejaya, those tigers among men--the sons of Pandu--deprived of the company of Arjuna, continued to live in Kamyaka in perfect cheerlessness.

    '
  modern: 'And, O Janamejaya, those tigers among men, the sons of Pāṇḍu, deprived of Arjuna''s company, went on living in Kāmyaka in complete cheerlessness.

    '
vana-3-147-21:
  ganguli: 3 CXLIV
  text: 'After having thus passed many countries, and also the Uttarakurus, they saw that foremost of mountains, the Kailasa, containing many wonders.

    '
  modern: 'After passing through many countries, and the Uttarakurus as well, they saw that foremost of mountains, Kailāsa, full of wonders.

    '
vana-3-147-22:
  ganguli: 3 CXLIV
  text: 'And by the side of it, they beheld the hermitage of Nara and Narayana, with celestial trees bearing flowers and fruits in all seasons.

    '
  modern: 'And beside it they saw the hermitage of Nara and Nārāyaṇa, with celestial trees bearing flowers and fruits in every season.

    '
vana-3-148-1:
  ganguli: 3 CXLV
  text: 'Vaisampayana said, "There observing cleanliness, those tigers among men dwelt for six nights, in expectation of beholding Dhananjaya.

    '
  modern: "Vaiśampāyana said, \"There, keeping themselves clean, those tigers among men stayed six nights, waiting to see Dhanañjaya."
vana-3-156-33:
  ganguli: 3 CLXXVI
  text: 'Then all those magnanimous men having reached the place of Narayana, continued to live there, bereft of all sorrow, at beholding Kuvera''s favourite lake, frequented by gods and Siddhas.

    '
  modern: 'Then those great-minded men reached the place of Nārāyaṇa and lived there, free of all sorrow, seeing Kubera''s favorite lake, visited by gods and Siddhas.

    '
vana-3-168-1:
  ganguli: 3 CLXVI
  speaker: Vaisampayana continued
  text: 'When Sakra had gone to his proper place, Vibhatsu together with his brothers and Krishna, paid homage unto the son of Dharma.

    '
  modern: 'When Śakra had gone to his own place, Bībhatsu, with his brothers and Kṛṣṇā, paid homage to the son of Dharma.

    '
  speakerModern: 'Vaiśampāyana continued:'
vana-3-178-5:
  ganguli: 3 CLXXVI
  text: 'Addicted to hunting as their chief occupation, the sons of Pritha peacefully dwelt in that forest for one year.

    '
  modern: 'Hunting was their chief occupation, and the sons of Pṛthā lived peacefully in that forest for one year.

    '
vana-3-179-11:
  ganguli: 3 CLXXVI
  text: 'Then all those warriors having in due course happily lived at Badari for one month, proceeded towards the realm of Suvahu, king of the Kiratas, by following the same track by which they had come.

    '
  modern: 'Then, having lived happily at Badari for one month, those warriors went toward the realm of Suvāhu, king of the Kirātas, by the same route by which they had come.

    '
vana-3-179-12:
  ganguli: 3 CLXXVI
  text: 'And crossing the difficult Himalayan regions, and the countries of China, Tukhara, Darada and all the climes of Kulinda, rich in heaps of jewels, those warlike men reached the capital of Suvahu.

    '
  modern: 'Crossing the difficult Himalayan regions and the countries of China, Tukhāra, Darada, and all the lands of Kulinda, rich in heaps of jewels, those warlike men reached the capital of Suvāhu.

    '
vana-3-179-15:
  ganguli: 3 CLXXVI
  text: 'Then taking all the chariots and chariot-men and dismissing Ghatotkacha together with his followers, they next repaired to the monarch of mountains in the vicinity of the Yamuna.

    '
  modern: 'Then they took all the chariots and charioteers, sent Ghaṭotkaca and his followers away, and went on to the king of mountains near the Yamunā.

    '
vana-3-179-17:
  ganguli: 3 CLXXVI
  text: 'In the midst of the mountain abounding in waterfalls and having grey and orange-coloured slopes and summits covered with a sheet of snow, those warlike men having then found the great forest of Visakhayupa like unto the forest of Chitraratha and inhabited by wild boars and various kinds of deer and birds, made it their home.

    '
  modern: 'On that mountain, rich in waterfalls, with gray and orange slopes and summits covered with a sheet of snow, those warlike men found the great forest of Viśākhayūpa, which was like Citraratha''s forest and was full of wild boars and many kinds of deer and birds, and made it their home.

    '
vana-3-179-20:
  ganguli: 3 CLXXVI
  text: 'And the twelfth year of their sojourn in forests having arrived, those scions of the race of Kuru, blazing in effulgence, and engaged in asceticism, always devoted principally to the practice of archery, repaired cheerfully from that Chitraratha-like forest to the borders of the desert, and desirous of dwelling by the Saraswati they went there, and from the banks of that river they reached the lake of Dwaitabana.

    '
  modern: 'When the twelfth year of their stay in the forests came, those scions of the Kuru race, blazing with splendor, engaged in asceticism and always mainly devoted to archery, left that forest like Citraratha''s and went cheerfully to the edge of the desert, and wishing to live by the Sarasvatī, they went there, and from the banks of that river they reached the lake of Dvaitavana.

    '
vana-3-179-21:
  ganguli: 3 CLXXVI
  text: '(with vana-3-179-20)

    '
vana-3-179-24:
  ganguli: 3 CLXXVI
  text: 'Wandering about with contentment in (the vicinity of) the Saraswati which was, as it were, the home of the celestials, and the favourite (resort) of Yakshas and Gandharvas and Maharshis, those sons of kings lived there in happiness.

    '
  modern: 'Wandering contentedly near the Sarasvatī, which was like a home of the celestials and a favorite resort of Yakṣas, Gandharvas, and great ṛṣis, those sons of kings lived there happily.

    '
vana-3-184-16:
  ganguli: 3 CLXXXI
  text: 'And, O Janamejaya, the holiest night, that of the full moon in the month of Kartika in the season of autumn, was spent by them while dwelling there!

    '
  modern: 'And, O Janamejaya, they spent there the holiest night, that of the full moon in the month of Kārttika, in the autumn season!

    '
vana-3-184-18:
  ganguli: 3 CLXXXI
  text: 'And as soon as the dark fortnight set in immediately after, the sons of Pandu entered the forest named the Kamyaka, accompanied by Dhananjaya and their charioteers and cooks.

    '
  modern: 'And as soon as the dark fortnight began, right after, the sons of Pāṇḍu entered the forest called Kāmyaka, with Dhanañjaya and their charioteers and cooks.

    '
vana-3-185-7:
  ganguli: 3 CLXXXII
  text: 'And the very moment that he was uttering these words, there was beheld Krishna, coming thitherward upon a car unto which were yoked the horses Saivya and Sugriva,--he the best of those that ride on cars, accompanied by Satyabhama, is like Indra by Sachi, the daughter of Pulaman.

    '
  modern: 'And at that very moment, as he was speaking these words, Kṛṣṇa was seen coming there in a chariot yoked with the horses Śaibya and Sugrīva, the best of those who ride in chariots, with Satyabhāmā, like Indra with Śacī, the daughter of Pulomān.

    '
vana-3-185-17:
  ganguli: 3 CLXXXII
  speaker: And he said
  text: 'O king, Virtue is preferable to the winning of kingdoms; it is, in fact, practice of austerities! By you who have obeyed with truth and candour what your duty prescribed, have been won both this world and that to come!

    '
  modern: 'O king, virtue is better than the winning of kingdoms; it is in fact the practice of austerities! You have obeyed with truth and honesty what your duty required, and so you have won both this world and the next!

    '
  speakerModern: 'And he said:'
vana-3-185-33:
  ganguli: 3 CLXXXII
  text: 'O lord of men, let the army of the tribe of Madhus, (resistless) like the wind, with their bows and led by Balarama whose weapon is the plough--let that army, equipped (for war), consisting of horsemen and foot soldiers and horses and cars and elephants, prepare to do your bidding.

    '
  modern: "O lord of men, let the army of the Madhus, as irresistible as the wind, with their bows and led by Balarāma, whose weapon is the plow, equipped for war and consisting of horsemen, foot soldiers, horses, chariots, and elephants, be ready to do your bidding."
vana-3-185-35:
  ganguli: 3 CLXXXII
  text: 'You, O ruler of men, are welcome to stick to that stipulation which was made in the assembly-hall--but let the city of Hastina be made ready for you, when the hostile force has been slain by the soldiers of the Dasarha tribe!

    '
  modern: 'You, O ruler of men, are welcome to keep to the agreement made in the assembly hall. But let the city of Hāstina be made ready for you when the hostile force has been slain by the soldiers of the Daśārha tribe!

    '
vana-3-185-38:
  ganguli: 3 CLXXXII
  text: 'When the time will come, there is no doubt that thou wilt do all the work just mentioned by thee; and even more than the same!

    '
  modern: 'When the time comes, there is no doubt that you will do all the work you have mentioned, and even more!

    '
vana-3-185-39:
  ganguli: 3 CLXXXII
  text: 'As promised by us, we have spent all the twelve years in lonely forests. O Kesava, having in the prescribed way completed the period for living unrecognised, the sons of Pandu will take refuge in thee.

    '
  modern: 'As we promised, we have spent all the twelve years in lonely forests. O Keśava, when the sons of Pāṇḍu have completed in the proper way the period of living unrecognized, they will take refuge in you.

    '
vana-3-236-18:
  ganguli: 3 CCXXXIII
  text: 'And having done so the beautiful Satyabhama mounted the car of Krishna. And the chief of the Yadavas, comforting Draupadi with a smile and causing the Pandavas to return, set out for his own city, with swift horses (yoked unto his car).

    '
  modern: 'And the beautiful Satyabhāmā got into Kṛṣṇa''s chariot. And the chief of the Yādavas, comforting Draupadī with a smile and sending the Pāṇḍavas back, set out for his own city with swift horses yoked to his chariot.

    '
vana-3-240-23:
  ganguli: 3 CCXXXVII
  text: 'And permitted by the monarch the Bharata prince born of Gandhari started, accompanied by Karna and surrounded by a large host.

    '
  modern: 'And permitted by the monarch, the Bharata prince born of Gāndhārī set out, accompanied by Karṇa and surrounded by a large army.

    '
vana-3-240-24:
  ganguli: 3 CCXXXVII
  text: 'And he was also accompanied by Dussasana and Suvala''s son of great intelligence and by many other brothers of his and by ladies in thousands.

    '
  modern: 'He was also accompanied by Duḥśāsana and Subala''s intelligent son and by many other brothers of his and by thousands of ladies.

    '
vana-3-241-1:
  ganguli: 3 CCXXXVIII
  speaker: Vaisampayana said
  text: 'King Duryodhana then moving from forest to forest, at last approached the cattle-stations, and encamped his troops.

    '
  modern: 'King Duryodhana, moving from forest to forest, at last came to the cattle stations and camped his troops.

    '
  speakerModern: 'Vaiśampāyana said:'
vana-3-241-15:
  ganguli: 3 CCXXXVIII
  text: 'And the king graced with high prosperity proceeded thither like the thunder-wielding chief of the celestials himself.

    '
  modern: 'And the king, endowed with great prosperity, went there like the chief of the celestials himself, wielder of the thunderbolt.

    '
vana-3-241-21:
  ganguli: 3 CCXXXVIII
  text: 'For, O monarch, the king of the Gandharvas accompanied by his followers, had come thither beforehand, from the abode of Kuvera.

    '
  modern: 'For, O monarch, the king of the Gandharvas, with his followers, had come there beforehand from Kubera''s abode.

    '
vana-3-242-13:
  ganguli: 3 CCXXXIX
  text: 'And seeing the mighty host of the Gandharvas rushing towards him, Radheya checked them by a perfect shower of arrows.

    '
  modern: 'Seeing the mighty host of the Gandharvas rushing at him, Rādheya (Karṇa) stopped them with a perfect shower of arrows.

    '
vana-3-243-1:
  ganguli: 3 CCXL
  speaker: Vaisampayana said
  text: 'After that great warrior Karna had been routed by the Gandharvas, the whole of the Kuru army, O monarch, fled from the field in the very sight of Dhritarashtra''s son.

    '
  modern: 'After that great warrior Karṇa had been routed by the Gandharvas, the whole Kuru army, O monarch, fled from the field before the very eyes of Dhṛtarāṣṭra''s son.

    '
  speakerModern: 'Vaiśampāyana said:'
vana-3-243-6:
  ganguli: 3 CCXL
  text: 'And when Duryodhana, deprived of his car, fell on the ground, the strong-armed Chitrasena rushed towards him and seized him in such a way that it seemed his life itself was taken.

    '
  modern: 'And when Duryodhana, deprived of his chariot, fell on the ground, the strong-armed Citrasena rushed at him and seized him so that it seemed his very life had been taken.

    '
vana-3-243-13:
  ganguli: 3 CCXL
  text: 'Dussasana, Durvishasa, Durmukha, and Durjaya, are all being led away as captives in chains by the Gandharvas, as also all the ladies of the royal household!

    '
  modern: 'Duḥśāsana, Durviṣaha, Durmukha, and Durjaya are all being led away in chains as captives by the Gandharvas, as are all the ladies of the royal household!"

    '
vana-3-243-14:
  ganguli: 3 CCXL
  text: 'Crying thus, the followers of Duryodhana, afflicted with grief and melancholy, approached Yudhishthira, desirous of effecting the release of the king.

    '
  modern: 'Crying out like this, Duryodhana''s followers, afflicted with grief and gloom, approached Yudhiṣṭhira, wanting to get the king released.

    '
vana-3-243-17:
  ganguli: 3 CCXL
  text: 'Bhima then answered those old attendants of Duryodhana, who, afflicted with grief and melancholy, were thus soliciting (the aid of Yudhishthira), saying, ''What we should have done with great efforts, arraying ourselves in line of battle, supported by horses and elephants hath, indeed, been done by the Gandharvas!

    '
  modern: 'Bhīma then answered those old attendants of Duryodhana, who in their grief and gloom were asking Yudhiṣṭhira''s help: "What we should have done with great effort, drawn up in battle line with horses and elephants, the Gandharvas have indeed done!

    '
vana-3-243-20:
  ganguli: 3 CCXL
  text: 'It seems that there is still fortunately some person in the world who is desirous of doing us good who hath, indeed, taken upon his own shoulders our pleasant load, although we are sitting idly!

    '
  modern: 'It seems that there is still, fortunately, someone in the world who wants to do us good and who has taken our pleasant burden on his own shoulders, though we sit idle!

    '
vana-3-243-24:
  ganguli: 3 CCXL
  text: 'And while Bhima, the son of Kunti, was speaking thus in a voice of sarcasm, king Yudhishthira told him, ''This is not time for cruel words!''

    '
  modern: 'And while Bhīma, the son of Kuntī, was speaking in this sarcastic tone, King Yudhiṣṭhira told him, "This is no time for cruel words!"

    '
vana-3-244-2:
  ganguli: 3 CCXLI
  text: 'O Vrikodara, disunions and disputes do take place amongst those that are connected in blood. Hostilities such as these do go on. But the honour of the family is never suffered to be interfered with.

    '
  modern: "\"O Vṛkodara, splits and quarrels do occur among kinsmen. Such hostilities go on. But the honor of the family must never be allowed to be touched."
vana-3-244-10:
  ganguli: 3 CCXLI
  text: 'With Indrasena and other charioteers skilled in arms, for guiding them, ride ye on these everfurnished cars of deep rattle! And riding on these, exert ye with activity for fighting with the Gandharvas to liberate Duryodhana.

    '
  modern: 'With Indrasena and the other charioteers, skilled in arms, to drive them, ride these ever-ready chariots of deep rattle! And riding in them, make every effort to fight the Gandharvas and set Duryodhana free."

    '
vana-3-244-11:
  ganguli: 3 CCXLI
  text: 'If any stranger seeketh to insult the honour of a family, they that are good never tolerate such insult coming from the stranger.

    '
  modern: 'If any stranger tries to insult the honor of a family, good men never tolerate such an insult coming from a stranger.

    '
vana-3-245-1:
  ganguli: 3 CCXLII
  speaker: Vaisampayana said
  text: 'Hearing the words of Yudhishthira, those bulls among men, headed by Bhimasena, rose up with faces beaming in joy.

    '
  modern: 'Hearing the words of Yudhiṣṭhira, those bulls among men, led by Bhīmasena, rose up with faces bright with joy.

    '
  speakerModern: 'Vaiśampāyana said:'
vana-3-245-21:
  ganguli: 3 CCXLII
  text: 'And the battle then, O Bharata, that ranged between the active and agile Gandharvas and the impetuous son of Pandu was fierce in the extreme.

    '
  modern: "And the battle that took place, O Bharata, between the active and agile Gandharvas and the impetuous son of Pāṇḍu was extremely fierce."
vana-3-247-1:
  ganguli: 3 CCXLIV
  speaker: Vaisampayana said
  text: 'Then that mighty bowman of blazing splendour, Arjuna, smilingly said unto Chitrasena in the midst of the Gandharva host, ''What purpose dost thou serve, O hero, in punishing the Kauravas?

    '
  modern: 'Then Arjuna, that mighty bowman of blazing splendor, said to Citrasena with a smile, in the midst of the Gandharva host, "What purpose do you serve, O hero, in punishing the Kauravas?

    '
  speakerModern: 'Vaiśampāyana said:'
vana-3-247-2:
  ganguli: 3 CCXLIV
  text: 'O, why also hath Suyodhana with his wives been thus punished?

    '
  modern: 'And why has Suyodhana been punished like this along with his wives?"

    '
vana-3-247-4:
  ganguli: 3 CCXLIV
  text: 'The purpose was even this,--knowing that ye are exiles in the forest and suffering great afflictions as if ye had none to take care of you, himself in prosperity, this wretch entertained the desire of beholding you plunged in adversity and misfortune.

    '
  modern: 'The purpose was this: knowing that you were exiles in the forest, suffering great afflictions as if you had no one to take care of you, this wretch, prosperous himself, wanted to see you plunged into adversity and misfortune.

    '
vana-3-247-5:
  ganguli: 3 CCXLIV
  text: 'They came hither for mocking you and the illustrious daughter of Drupada.

    '
  modern: 'They came here to mock you and the illustrious daughter of Drupada.

    '
vana-3-247-7:
  ganguli: 3 CCXLIV
  text: 'The lord of the celestials also, having ascertained this purpose of theirs, told me, ''Go thou and bring Duryodhana hither in chains along with his counsellors. Dhananjaya also with his brother should always be protected by thee in battle, for he is thy dear friend and disciple.

    '
  modern: 'The lord of the celestials, learning of this purpose of theirs, told me, "Go and bring Duryodhana here in chains with his counselors. You should also always protect Dhanañjaya and his brother in battle, for he is your dear friend and disciple.

    '
vana-3-247-13:
  ganguli: 3 CCXLIV
  text: 'And Ajatasatru, hearing everything that the Gandharvas had said, liberated all the Kauravas and applauded the Gandharvas.

    '
  modern: 'And Ajātaśatru, hearing everything the Gandharvas had said, set all the Kauravas free and praised the Gandharvas.

    '
vana-3-247-26:
  ganguli: 3 CCXLIV
  text: 'And Yudhishthira then addressing the liberated Duryodhana in the midst of his brothers, from affection, told him these words: ''O child, never again do such a rash act.

    '
  modern: 'Yudhiṣṭhira then spoke to the freed Duryodhana, in the midst of his brothers, out of affection: "Child, never do such a rash thing again.

    '
vana-3-247-27:
  ganguli: 3 CCXLIV
  text: 'O Bharata, a rash wight never cometh by happiness.

    '
  modern: 'O Bharata, a rash man never finds happiness.

    '
vana-3-247-28:
  ganguli: 3 CCXLIV
  text: 'O son of the Kuru race, pleased be thou with all thy brothers. Go back to thy capital as pleaseth thee, without yielding thyself to despondency or cheerlessness!

    '
  modern: 'O son of the Kuru race, be pleased, with all your brothers. Go back to your capital as you like, without giving way to despondency or gloom!"

    '
vana-3-247-29:
  ganguli: 3 CCXLIV
  speaker: Vaisampayana continued
  text: 'Thus dismissed by the son of Pandu, king Duryodhana then saluted king Yudhishthira the just and overwhelmed with shame, and his heart rent in twain, mechanically set out for his capital, like one destitute of life.

    '
  modern: 'Thus dismissed by the son of Pāṇḍu, King Duryodhana saluted King Yudhiṣṭhira the just, overwhelmed with shame and his heart torn in two, and set out for his capital mechanically, like one without life.

    '
  speakerModern: 'Vaiśampāyana continued:'
vana-3-312-3:
  ganguli: 3 CCCVIII
  speaker: Vaisampayana said
  text: 'Having defeated the chief of the Saindhavas, and rescued Krishna, and having outlived the entire term of their painful exile in the woods, and having listened to the ancient stories about gods and Rishis recited by Markandeya, those heroes among men returned from their asylum in Kamyaka to the sacred Dwaitavana, with all their cars, and followers, and accompanied by their charioteers, their kine, and the citizens who had followed them.

    '
  modern: 'Having defeated the chief of the Saindhavas, rescued Kṛṣṇā, lived out the whole term of their painful exile in the woods, and heard the ancient stories about gods and ṛṣis told by Mārkaṇḍeya, those heroes among men returned from their hermitage in Kāmyaka to the sacred Dvaitavana, with all their chariots and followers, accompanied by their charioteers, their cattle, and the citizens who had followed them.

    '
  speakerModern: 'Vaiśampāyana said:'
vana-3-312-11:
  ganguli: 3 CCCIX
  text: 'And approaching without loss of time Ajatasatru seated in that forest with his brothers, the Brahmana, in great distress, spake these words, …

    '
  modern: 'And the Brāhmaṇa came without delay to Ajātaśatru, who was sitting in that forest with his brothers, and in great distress said, …

    '
vana-3-312-12:
  ganguli: 3 CCCIX
  text: '… ''As a deer was butting about, it happened, O king, that my fire-sticks and churning staff which had been placed against a large tree stuck fast to its antlers.

    '
  modern: '… "As a deer was butting about, O king, my fire sticks and churning staff, which were placed against a large tree, stuck fast in its antlers.

    '
vana-3-312-13:
  ganguli: 3 CCCIX
  text: 'And, thereupon, O king, that powerful deer of exceeding fleetness with long bounds, speedily went out of the hermitage, taking those articles away.

    '
  modern: 'And then, O king, that powerful, very swift deer went out of the hermitage with long bounds, carrying those things away.

    '
vana-3-312-14:
  ganguli: 3 CCCIX
  text: 'Tracking that powerful deer, O king, by its foot-prints, do ye, ye sons of Pandu, bring back those articles of mine, so that my Agnihotra may not be stopped!

    '
  modern: 'Track that powerful deer, O king, by its footprints, you sons of Pāṇḍu, and bring back those things of mine, so that my Agnihotra may not be stopped!

    '
vana-3-312-16:
  ganguli: 3 CCCIX
  text: 'And the son of Kunti taking up his bow sallied out with his brothers. And putting on their corselets and equipped with their bows, those bulls among men, intent upon serving the Brahmana, swiftly sallied out in the wake of the deer.

    '
  modern: 'And the son of Kuntī took up his bow and went out with his brothers. Putting on their armor and taking their bows, those bulls among men, eager to serve the Brāhmaṇa, went out swiftly after the deer.

    '
vana-3-313-5:
  ganguli: 3 CCCX
  speaker: Vaisampayana continued
  text: 'Then king Yudhishthira addressed Nakula saying, ''Do thou, O son of Madri, climb this tree and look around the ten points of the horizon.

    '
  modern: "Then King Yudhiṣṭhira said to Nakula, \"Son of Mādrī, climb this tree and look around in the ten directions."
  speakerModern: 'Vaiśampāyana continued:'
vana-3-313-6:
  ganguli: 3 CCCX
  text: 'Do thou see whether there is water near us or such trees as grow on watery grounds!

    '
  modern: 'See whether there is water near us, or the kind of trees that grow on watery ground!"

    '
vana-3-313-10:
  ganguli: 3 CCCX
  text: 'Saying, ''So be it,'' at the command of his eldest brother Nakula quickly proceeded towards the place where there was water and soon came upon it.

    '
  modern: 'Saying "So be it," at the command of his eldest brother, Nakula quickly went to the place where there was water and soon came upon it.

    '
vana-3-313-11:
  ganguli: 3 CCCX
  text: 'And beholding a crystal lake inhabited by cranes he desired to drink of it, when he heard these words from the sky, …

    '
  modern: 'Seeing a crystal-clear lake with cranes around it, he wanted to drink from it, when he heard these words from the sky: …

    '
vana-3-313-12:
  ganguli: 3 CCCX
  text: '… ''O child, do not commit this rash act! This lake hath already been in my possession. Do thou, O son of Madri, first answer my questions and then drink of this water and take away (as much as thou requirest).

    '
  modern: '… "My child, do not do this rash thing! This lake has already been in my possession. Son of Mādrī, first answer my questions, and then drink of this water and take away as much as you need."

    '
vana-3-313-13:
  ganguli: 3 CCCX
  text: 'Nakula, however, who was exceedingly thirsty, disregarding these words, drank of the cool water, and having drunk of it, dropped down dead.

    '
  modern: 'Nakula, however, who was very thirsty, disregarded these words, drank the cool water, and having drunk it, fell down dead.

    '
vana-3-313-25:
  ganguli: 3 CCCX
  text: 'But he found none in that mighty forest. And, being fatigued, he who was capable of drawing the bow by his left hand as well, rushed in the direction of the water.

    '
  modern: 'But he found no one in that mighty forest. And, tired, he who could draw the bow with his left hand as well rushed toward the water.

    '
vana-3-313-40:
  ganguli: 3 CCCX
  speaker: Vaisampayana continued
  text: 'Thus addressed by that Yaksha of immeasurable energy, Bhima, without answering his questions, drank of the water.

    '
  modern: 'Thus addressed by that Yakṣa of immeasurable energy, Bhīma drank the water without answering his questions.

    '
  speakerModern: 'Vaiśampāyana continued:'
vana-3-313-42:
  ganguli: 3 CCCX
  text: 'Then thinking that his brothers had left him long since, Yudhishthira waited for some time.

    '
  modern: 'Then, thinking that his brothers had left him long ago, Yudhiṣṭhira waited for some time.

    '
vana-3-314-1:
  ganguli: 3 CCCXI
  speaker: Vaisampayana said
  text: 'Yudhishthira saw his brothers, each possessed of the glory of Indra himself, lying dead like the Regents of the world dropped from their spheres at the end of the Yuga.

    '
  modern: 'Yudhiṣṭhira saw his brothers, each with the glory of Indra himself, lying dead like the Regents of the world dropped from their spheres at the end of the yuga.

    '
  speakerModern: 'Vaiśampāyana said:'
vana-3-314-29:
  ganguli: 3 CCCXI
  text: 'Earnestly shall I ponder over this, or, let me first drink of the water, and then know all.

    '
  modern: 'Let me think this over carefully, or, let me first drink the water, and then I will know everything.

    '
vana-3-314-44:
  ganguli: 3 CCCXI
  text: 'Do not, O child, act rashly! This lake hath already been in my possession. Having answered my questions first, do thou, O Kunti''s son, drink and carry away (as much as thou requirest)!

    '
  modern: 'Do not, child, act rashly! This lake has already been in my possession. Answer my questions first, then, O son of Kuntī, drink and take away as much as you need!

    '
vana-3-314-46:
  ganguli: 3 CCCXI
  speaker: Yudhishthira said
  text: 'I do not, O Yaksha, covet, what is already in thy possession! O bull among male beings, virtuous persons never approve that one should applaud his own self (without boasting, I shall, therefore, answer thy questions, according to my intelligence). Do thou ask me!

    '
  modern: 'I do not covet, O Yakṣa, what is already in your possession! O bull among men, virtuous people never approve of anyone praising himself (so, without boasting, I shall answer your questions according to my understanding). Ask me!"

    '
  speakerModern: 'Yudhiṣṭhira said:'
vana-3-314-71:
  ganguli: 3 CCCXI
  speaker: The Yaksha asked
  text: 'What is the highest refuge of virtue? What of fame? What of heaven? And what, of happiness?

    '
  modern: 'What is the highest refuge of virtue? What of fame? What of heaven? And what of happiness?"

    '
  speakerModern: 'The Yaksha asked:'
vana-3-314-72:
  ganguli: 3 CCCXI
  speaker: Yudhishthira answered
  text: 'Liberality is the highest refuge of virtue: gift, of fame: truth, of heaven: and good behaviour, of happiness.

    '
  modern: 'Liberality is the highest refuge of virtue, giving of fame, truth of heaven, and good behavior of happiness."

    '
  speakerModern: 'Yudhiṣṭhira answered:'
vana-3-314-73:
  ganguli: 3 CCCXI
  speaker: The Yaksha asked
  text: 'What is the soul of man? Who is that friend bestowed on man by the gods? What is man''s chief support? And what also is his chief refuge?

    '
  modern: 'What is the soul of a man? Who is the friend the gods have given him? What is his chief support? And what is his chief refuge?"

    '
  speakerModern: 'The Yaksha asked:'
vana-3-314-74:
  ganguli: 3 CCCXI
  speaker: Yudhishthira answered
  text: 'The son is a man''s soul: the wife is the friend bestowed on man by the gods; the clouds are his chief support; and gift is his chief refuge.

    '
  modern: 'The son is a man''s soul; the wife is the friend the gods have given him; the clouds are his chief support; and giving is his chief refuge."

    '
  speakerModern: 'Yudhiṣṭhira answered:'
vana-3-314-75:
  ganguli: 3 CCCXI
  speaker: The Yaksha asked
  text: 'What is the best of all laudable things? What is the most valuable of all his possessions? What is the best of all gains?

    '
  modern: 'What is the best of all praiseworthy things? What is the most valuable of all possessions? What is the best of all gains?"

    '
  speakerModern: 'The Yaksha asked:'
vana-3-314-76:
  ganguli: 3 CCCXI
  speaker: Yudhishthira answered
  text: 'The best of all laudable things is skill; the best of all possessions is knowledge: the best of all gains is health: and contentment is the best of all kinds of happiness.

    '
  modern: 'The best of all praiseworthy things is skill; the best of all possessions is knowledge; the best of all gains is health; and contentment is the best of all kinds of happiness."

    '
  speakerModern: 'Yudhiṣṭhira answered:'
vana-3-314-77:
  ganguli: 3 CCCXI
  speaker: The Yaksha asked
  text: 'What is the highest duty in the world? What is that virtue which always beareth fruit? What is that which if controlled, leadeth not to regret?

    '
  modern: 'What is the highest duty in the world? What is the virtue that always bears fruit? What is it that, if controlled, leads to no regret?"

    '
  speakerModern: 'The Yaksha asked:'
vana-3-314-78:
  ganguli: 3 CCCXI
  speaker: Yudhishthira answered
  text: 'The highest of duties is to refrain from injury: the rites ordained in the Three (Vedas) always bear fruit: the mind, if controlled, leadeth to no regret: and an alliance with the good never breaketh.

    '
  modern: 'The highest duty is to refrain from injury; the rites ordained in the three Vedas always bear fruit; the mind, if controlled, leads to no regret; and an alliance with the good never breaks."

    '
  speakerModern: 'Yudhiṣṭhira answered:'
vana-3-314-79:
  ganguli: 3 CCCXI
  speaker: The Yaksha asked
  text: 'What is that which, if renounced, maketh one agreeable? What is that which, if renounced, leadeth to no regret? What is that which, if renounced, maketh one wealthy? And what is that which if renounced, maketh one happy?''

    '
  modern: 'What is it that, if given up, makes one agreeable? What is it that, if given up, leads to no regret? What is it that, if given up, makes one wealthy? And what is it that, if given up, makes one happy?"

    '
  speakerModern: 'The Yaksha asked:'
vana-3-314-80:
  ganguli: 3 CCCXI
  speaker: Yudhishthira answered
  text: 'Pride, if renounced, maketh one agreeable; wrath, if renounced leadeth to no regret: desire, if renounced, maketh one wealthy: and avarice, if renounced, maketh one happy.

    '
  modern: 'Pride, if given up, makes one agreeable; wrath, if given up, leads to no regret; desire, if given up, makes one wealthy; and greed, if given up, makes one happy."

    '
  speakerModern: 'Yudhiṣṭhira answered:'
vana-3-314-89:
  ganguli: 3 CCCXI
  speaker: The Yaksha asked
  text: 'What hath been said to be the sign of asceticism? And what is true restraint? What constitutes forgiveness. And what is shame?

    '
  modern: 'What is said to be the sign of asceticism? What is true restraint? What is forgiveness? And what is shame?"

    '
  speakerModern: 'The Yaksha asked:'
vana-3-314-90:
  ganguli: 3 CCCXI
  speaker: Yudhishthira answered
  text: 'Staying in one''s own religion is asceticism: the restraint of the mind is of all restraints the true one: forgiveness consists in enduring enmity; and shame, in withdrawing from all unworthy acts.

    '
  modern: 'Staying in one''s own religion is asceticism; restraint of the mind is the true restraint; forgiveness is enduring enmity; and shame is withdrawing from all unworthy acts."

    '
  speakerModern: 'Yudhiṣṭhira answered:'
vana-3-314-91:
  ganguli: 3 CCCXI
  speaker: The Yaksha asked
  text: 'What, O king is said to be knowledge? What, tranquillity? What constitutes mercy? And what hath been called simplicity?

    '
  modern: 'What, O king, is said to be knowledge? What is tranquillity? What is mercy? And what is called simplicity?"

    '
  speakerModern: 'The Yaksha asked:'
vana-3-314-92:
  ganguli: 3 CCCXI
  speaker: Yudhishthira answered
  text: 'True knowledge is that of Divinity. True tranquillity is that of the heart. Mercy consists in wishing happiness to all. And simplicity is equanimity of heart.

    '
  modern: 'True knowledge is knowledge of the Divine. True tranquillity is that of the heart. Mercy is wishing happiness to all. And simplicity is evenness of heart."

    '
  speakerModern: 'Yudhiṣṭhira answered:'
vana-3-314-93:
  ganguli: 3 CCCXI
  speaker: The Yaksha asked
  text: 'What enemy is invincible? What constitutes an incurable disease for man? What sort of a man is called honest and what dishonest?

    '
  modern: 'What enemy cannot be conquered? What is an incurable disease for a man? What sort of man is called honest, and what sort dishonest?"

    '
  speakerModern: 'The Yaksha asked:'
vana-3-314-94:
  ganguli: 3 CCCXI
  speaker: Yudhishthira answered
  text: 'Anger is an invincible enemy. Covetousness constitutes an incurable disease. He is honest that desires the weal of all creatures, and he is dishonest who is unmerciful.

    '
  modern: 'Anger is the unconquerable enemy. Greed is the incurable disease. He is honest who wants the good of all creatures, and he is dishonest who is merciless."

    '
  speakerModern: 'Yudhiṣṭhira answered:'
vana-3-314-97:
  ganguli: 3 CCCXI
  speaker: The Yaksha asked
  text: 'What hath steadiness been said by the Rishis to be? And what, patience? What also is a real ablution? And what is charity?

    '
  modern: 'What have the ṛṣis said steadiness is? And what is patience? What is a real ablution? And what is charity?"

    '
  speakerModern: 'The Yaksha asked:'
vana-3-314-98:
  ganguli: 3 CCCXI
  speaker: Yudhishthira answered
  text: 'Steadiness consists in one''s staying in one''s own religion, and true patience consists in the subjugation of the senses. A true bath consists in washing the mind clean of all impurities, and charity consists in protecting all creatures.

    '
  modern: 'Steadiness is staying in one''s own religion, and true patience is mastery of the senses. A true bath is washing the mind clean of all impurities, and charity is protecting all creatures."

    '
  speakerModern: 'Yudhiṣṭhira answered:'
vana-3-314-116:
  ganguli: 3 CCCXI
  speaker: The Yaksha asked
  text: 'Who is truly happy? What is most wonderful? What is the path? And what is the news? Answer these four questions of mine and let thy dead brothers revive.

    '
  modern: 'Who is truly happy? What is most wonderful? What is the path? And what is the news? Answer these four questions of mine, and let your dead brothers revive."

    '
  speakerModern: 'The Yaksha asked:'
vana-3-314-118:
  ganguli: 3 CCCXI
  speaker: Yudhishthira answered
  text: '… Day after day countless creatures are going to the abode of Yama, yet those that remain behind believe themselves to be immortal. What can be more wonderful than this?

    '
  modern: '… Day after day countless creatures go to the abode of Yama, yet those who remain believe themselves immortal. What can be more wonderful than this?

    '
  speakerModern: 'Yudhiṣṭhira answered:'
vana-3-314-121:
  ganguli: 3 CCCXI
  speaker: The Yaksha asked
  text: 'Thou hast, O represser of foes, truly answered all my questions! Tell us now who is truly a man, and what man truly possesseth every kind of wealth.

    '
  modern: "You have truly answered all my questions, O repressor of foes! Now tell us who is truly a man, and what man truly possesses every kind of wealth.\""
  speakerModern: 'The Yaksha asked:'
vana-3-314-125:
  ganguli: 3 CCCXI
  speaker: Yudhishthira answered
  text: 'The report of one''s good action reacheth heaven and spreadeth over the earth. As long as that report lasteth, so long is a person to whom the agreeable and the disagreeable, weal and woe, the past and the future, are the same, is said to possess every kind of wealth.

    '
  modern: 'The report of one''s good action reaches heaven and spreads over the earth. As long as that report lasts, so long is a person to whom the agreeable and the disagreeable, weal and woe, the past and the future, are the same said to possess every kind of wealth."

    '
  speakerModern: 'Yudhiṣṭhira answered:'
vana-3-314-126:
  ganguli: 3 CCCXI
  speaker: Yudhishthira answered
  text: 'Let this one that is of darkish hue, whose eyes are red, who is tall like a large Sala tree, whose chest is broad and arms long, let this Nakula, O Yaksha, get up with life!

    '
  modern: 'Let this one who is dark, whose eyes are red, who is tall like a large sāla tree, whose chest is broad and arms long, let this Nakula, O Yakṣa, get up alive!"

    '
  speakerModern: 'Yudhiṣṭhira answered:'
vana-3-314-127:
  ganguli: 3 CCCXI
  text: 'The Yaksha rejoined,-''This Bhimasena is dear unto thee, and this Arjuna also is one upon whom all of you depend! Why, then, O king dost thou, wish a step-brother to get up with his life!

    '
  modern: 'The Yakṣa said, "This Bhīmasena is dear to you, and this Arjuna is the one on whom all of you depend! Why then, O king, do you wish a half brother to get up alive?

    '
vana-3-314-132:
  ganguli: 3 CCCXI
  text: 'Abstention from injury is the highest virtue, and is, I ween, even higher than the highest object of attainment. I endeavour to practise that virtue. Therefore, let Nakula, O Yaksha, revive!

    '
  modern: 'Abstention from injury is the highest virtue, and is, I think, even higher than the highest object of attainment. I try to practice that virtue. Therefore let Nakula, O Yaksha, revive!

    '
vana-3-314-134:
  ganguli: 3 CCCXI
  text: 'My father had two wives, Kunti and Madri. Let both of them have children. This is what I wish.

    '
  modern: 'My father had two wives, Kuntī and Mādrī. Let both of them have children. This is what I wish.

    '
vana-3-314-136:
  ganguli: 3 CCCXI
  speaker: The Yaksha said
  text: 'Since abstention from injury is regarded by thee as higher than both profit and pleasure, therefore, let all thy brothers live, O bull of Bharata race!

    '
  modern: 'Since you regard abstention from injury as higher than both profit and pleasure, therefore let all your brothers live, O bull of Bharata''s race!"

    '
  speakerModern: 'The Yaksha said:'
vana-3-315-6:
  ganguli: 3 CCCXII
  text: 'At this the Yaksha replied,-''O child, I am even thy father, the Lord of justice, possessed of great prowess! Know, bull of the Bharata race, that I came hither desirous of beholding thee!

    '
  modern: 'At this the Yakṣa replied, "Child, I am your father, the Lord of justice, of great prowess! Know, bull of the Bharata race, that I came here wanting to see you!

    '
vana-3-315-13:
  ganguli: 3 CCCXII
  speaker: The Yaksha said
  text: 'O Kunti''s son endued with splendour, it was I who for examining thee, was carrying away, in the guise of a deer, that Brahmana''s fire-sticks!

    '
  modern: 'O son of Kuntī, endowed with splendor, it was I who, to test you, carried away that Brāhmaṇa''s fire sticks in the form of a deer!"

    '
  speakerModern: 'The Yaksha said:'
vana-3-315-15:
  ganguli: 3 CCCXII
  speaker: Yudhishthira said
  text: 'We have spent these twelve years in the forest; and the thirteenth year is come. May no one recognise us, as we spend this year somewhere.

    '
  modern: 'We have spent these twelve years in the forest, and the thirteenth year has come. May no one recognize us as we spend this year somewhere."

    '
  speakerModern: 'Yudhiṣṭhira said:'
vana-3-315-18:
  ganguli: 3 CCCXII
  text: 'Vaisampayana continued,-''Thereat that worshipful one replied,--''I give this boon unto thee! And then reassuring Kunti''s son having truth for prowess, he also said, ''Even if, O Bharata, ye range this (entire) earth in your proper forms none in the three worlds shall recognise you. Ye perpetuators of the Kuru race, through my grace, ye will spend this thirteenth year, secretly and unrecognised, in Virata''s kingdom!

    '
  modern: "Vaiśampāyana continued: Then that worshipful one replied, \"I grant you this boon!\" And then, reassuring Kuntī's son, whose prowess was truth, he also said, \"Even if, O Bharata, you range over this whole earth in your own forms, no one in the three worlds will recognize you. Through my grace, you perpetuators of the Kuru race, you will spend this thirteenth year secretly and unrecognized in Virāṭa's kingdom!"
vana-3-315-19:
  ganguli: 3 CCCXII
  text: 'And every one of you will be able at will to assume any form he likes!

    '
  modern: 'And each of you will be able to take any form you like at will!

    '
vana-3-315-20:
  ganguli: 3 CCCXII
  text: 'Do ye now present the Brahmana with his fire-sticks.

    '
  modern: 'Now give the Brāhmaṇa his fire sticks."

    '
vana-3-315-26:
  ganguli: 3 CCCXII
  speaker: Vaisampayana continued
  text: 'Having said these words, the worshipful Lord of justice, who is the object of contemplation of all the worlds, vanished therefrom; and the high-souled Pandavas after they had slept sweetly were united with one another.

    '
  modern: 'Having said these words, the worshipful Lord of justice, whom all the worlds contemplate, vanished from there; and the high-souled Pāṇḍavas, after they had slept sweetly, were united with one another.

    '
  speakerModern: 'Vaiśampāyana continued:'
vana-3-315-27:
  ganguli: 3 CCCXII
  text: 'And their fatigue dispelled, those heroes returned to the hermitage, and gave back that Brahmana his firesticks.

    '
  modern: 'And their fatigue gone, those heroes returned to the hermitage and gave the Brāhmaṇa back his fire sticks.

    '
virata-4-1-10:
  ganguli: 4 I
  text: 'Having in this way obtained boons from the god of Justice, that best of virtuous men, Yudhishthira, returned to the asylum and related unto the Brahmanas all that had happened.

    '
  modern: 'Having obtained boons from the god of Justice in this way, Yudhiṣṭhira, best of the virtuous, returned to the hermitage and told the Brāhmaṇas all that had happened.

    '
virata-4-2-22:
  ganguli: 4 I
  text: 'Presenting myself as a Brahmana, Kanka by name, skilled in dice and fond of play, I shall become a courtier of that high-souled king.

    '
  modern: 'I will present myself as a Brāhmaṇa named Kaṅka, skilled in dice and fond of play, and I will become a courtier of that high-souled king.

    '
virata-4-2-23:
  ganguli: 4 I
  text: 'And moving upon chess-boards beautiful pawns made of ivory, of blue and yellow and red and white hue, by throws of black and red dice.

    '
  modern: 'And moving beautiful ivory pieces, blue, yellow, red, and white, on the boards by throws of black and red dice, ...

    '
virata-4-3-8:
  ganguli: 4 II
  speaker: Bhima said
  text: 'I intend to present myself before the lord of Virata as a cook bearing the name of Vallabha.

    '
  modern: 'I intend to present myself to the lord of Virāṭa as a cook called Vallabha.

    '
  speakerModern: 'Bhīma said:'
virata-4-3-44:
  ganguli: 4 II
  text: 'Wearing brilliant rings on my ears and conch-bangles on my wrists and causing a braid to hang down from my head, I shall, O king, appear as one of the third sex, Brihannala by name.

    '
  modern: 'Wearing bright earrings and conch bangles on my wrists, and letting a braid hang down from my head, I shall appear, O king, as one of the third sex, called Bṛhannaḍā.

    '
virata-4-3-46:
  ganguli: 4 II
  text: 'And, O king, I shall also instruct the women of Virata''s palace in singing and delightful modes of dancing and in musical instruments of diverse kinds.

    '
  modern: 'And, O king, I shall also teach the women of Virāṭa''s palace singing, graceful dancing, and various kinds of musical instruments.

    '
virata-4-4-5:
  ganguli: 4 III
  speaker: Nakula said
  text: 'Under the name of Granthika, I shall become the keeper of the horses of king Virata.

    '
  modern: 'Under the name of Granthika, I shall become the keeper of King Virāṭa''s horses.

    '
  speakerModern: 'Nakula said:'
virata-4-4-15:
  ganguli: 4 III
  speaker: Sahadeva replied
  text: 'I will become a keeper of the kine of Virata''s king. I am skilled in milking kine and taking their history as well as in taming their fierceness. Passing under the name of Tantripal, I shall perform my duties deftly.

    '
  modern: 'I will become a keeper of King Virāṭa''s cattle. I am skilled in milking cows, in learning their history, and in taming their fierceness. Under the name of Tantripāla I shall do my duties skillfully.

    '
  speakerModern: 'Sahadeva replied:'
virata-4-4-32:
  ganguli: 4 III
  text: 'I shall give myself out as a Sairindhri, skilled in dressing hair.

    '
  modern: 'I will say that I am a Sairandhrī, skilled in dressing hair.

    '
virata-4-4-35:
  ganguli: 4 III
  text: 'And I shall serve the famous Sudeshna, the wife of the king. Surely, obtaining me she will cherish me (duly).

    '
  modern: 'And I shall serve the famous Sudeṣṇā, the king''s wife. Surely, if she takes me, she will take good care of me.

    '
virata-4-6-8:
  ganguli: 4 V
  speaker: Vaisampayana said
  text: 'Girding their waists with swords, and equipped with finger-protectors made of iguana skins and with various weapons, those heroes proceeded in the direction of the river Yamuna. And those bowmen desirous of (speedily) recovering their kingdom, hitherto living in inaccessible hills and forest fastnesses, now terminated their forest-life and proceeded to the southern bank of that river.

    '
  modern: 'Girding their waists with swords, wearing finger guards made of iguana skin, and carrying various weapons, those heroes went toward the river Yamunā. And those bowmen, wanting to recover their kingdom soon, ended their life in the forest, where they had lived in inaccessible hills and forest hideouts, and went to the southern bank of that river.

    '
  speakerModern: 'Vaiśampāyana said:'
virata-4-6-12:
  ganguli: 4 V
  text: 'And those mighty warriors endued with great strength and hitherto leading the lives of hunters by killing the deer of the forest … And those bowmen, looking wan and wearing beards and equipped with swords, entered Matsya''s dominions leaving the forest, giving themselves out as hunters.

    '
  modern: 'Those mighty, powerful warriors, who until then had lived as hunters, killing the deer of the forest … And those bowmen, looking wan, wearing beards, and equipped with swords, left the forest and entered Matsya''s dominions, giving themselves out as hunters.

    '
virata-4-7-8:
  ganguli: 4 V
  speaker: Arjuna said
  text: 'Hard by yon cemetery and near that inaccessible peak is a mighty Sami tree, throwing-about its gigantic branches and difficult to ascend.

    '
  modern: 'Near that cemetery, close to that inaccessible peak, is a great śamī tree, spreading its huge branches and hard to climb.

    '
  speakerModern: 'Arjuna said:'
virata-4-7-13:
  ganguli: 4 V
  text: 'And the Pandavas hung up a corpse (on the tree), knowing that people smelling the stench of the corpse would say--here sure, is a dead body, and avoid the tree from a distance.

    '
  modern: 'And the Pāṇḍavas hung a corpse on the tree, knowing that people smelling its stench would say, "Surely there is a dead body here," and would keep away from the tree.

    '
virata-4-7-57:
  ganguli: 4 V
  text: 'And then those resisters of foes approached the city.

    '
  modern: 'And then those resisters of foes approached the city.

    '
virata-4-7-64:
  ganguli: 4 V
  text: 'Then they entered the great city, with the view to passing the thirteenth year undiscovered in that kingdom, agreeably to the promise (to Duryodhana).

    '
  modern: 'Then they entered the great city, intending to spend the thirteenth year undiscovered in that kingdom, as they had promised Duryodhana.

    '
virata-4-15-63:
  ganguli: 4 XII
  text: 'And it was in this manner then the sons of Pandu, the very sight of whom had never been fruitless, continued to live in the country of the Matsyas.

    '
  modern: 'And this is how the sons of Pāṇḍu, whose very sight was never without fruit, went on living in the country of the Matsyas.

    '
virata-4-16-4:
  ganguli: 4 XIV
  text: 'And it came to pass that as the year was about to expire, the redoubtable Kichaka, the Commander of Virata''s forces, chanced to behold the daughter of Drupada.

    '
  modern: 'As the year was about to end, the mighty Kīcaka, commander of Virāṭa''s forces, happened to see the daughter of Drupada.

    '
virata-4-26-37:
  ganguli: 4 XXII
  text: 'And having seized Kichaka, the mighty ''Bhima began to roar like a hungry tiger that hath killed a large animal.

    '
  modern: 'Having seized Kīcaka, the mighty Bhīma roared like a hungry tiger that has killed a large animal.

    '
virata-4-29-6:
  ganguli: 4 XXV
  text: 'Meanwhile, the spies employed by Dhritarashtra''s son, having searched various villages and towns and kingdoms and done all that they had been commanded to do and completed their examination, in the manner directed, of the countries indicated in their orders, returned to Nagarupa, gratified with at least one thing that they had learnt.

    '
  modern: 'Meanwhile the spies employed by Dhṛtarāṣṭra''s son had searched many villages, towns and kingdoms. They had done all they were commanded to do and examined the countries named in their orders, in the manner directed. They returned to Nāgapura, pleased with at least one thing they had learned.

    '
virata-4-29-8:
  ganguli: 4 XXV
  text: 'And seeing Dhritarashtra''s son king Duryodhana of the Kuru race seated in his court with Drona and Karna and Kripa, with the high-souled Bhishma, his own brothers, and those great warriors--the Trigartas, they addressed him, saying, ''O lord of men, great hath been the care always bestowed by us in the search after the sons of Pandu in that mighty forest.

    '
  modern: 'Seeing King Duryodhana of the Kuru race, Dhṛtarāṣṭra''s son, seated in his court with Droṇa, Karṇa and Kṛpa, with the high-souled Bhīṣma, his own brothers, and those great warriors the Trigartas, they said to him, "O lord of men, we have always taken great care in searching for the sons of Pāṇḍu in that mighty forest.

    '
virata-4-29-24:
  ganguli: 4 XXV
  text: 'Searched have we through the solitary wilderness abounding with deer and other animals and overgrown with trees and creepers of diverse kind.

    '
  modern: 'We have searched the lonely wilderness full of deer and other animals and overgrown with trees and creepers of every kind.

    '
virata-4-29-27:
  ganguli: 4 XXV
  text: 'King Matsya''s commander, Kichaka of wicked soul, by whom the Trigartas, O monarch, were repeatedly vanquished and slain with mighty force, now lieth low on the ground with all his brothers, slain, O monarch, by invisible Gandharvas during the hours of darkness, O thou of unfading glory.

    '
  modern: 'King Matsya''s commander, the wicked Kīcaka, by whom the Trigartas were beaten and slaughtered again and again with mighty force, O monarch, now lies on the ground with all his brothers, killed by unseen Gandharvas in the dark of night, O you of unfading glory.

    '
virata-4-29-32:
  ganguli: 4 XXV
  text: '(with virata-4-29-27)

    '
virata-4-30-7:
  ganguli: 4 XXVI
  text: 'It behoveth ye, therefore, to make such efforts without loss of time as may induce the sons of Pandu, acquainted as they are with the proprieties of time, and staying as they now are in painful disguise, to re-enter the woods suppressing their rage.

    '
  modern: 'You must therefore make such efforts, without delay, as may induce the sons of Pāṇḍu, who know what the times require and are now living in painful disguise, to go back into the woods and swallow their rage.

    '
virata-4-32-23:
  ganguli: 4 XXX
  text: 'Crooked and wrathful and of wicked soul, of prowess famed over all the world, sinful in deeds and highly cruel, that wretch, however, hath been slain by the Gandharvas …

    '
  modern: 'Crooked, wrathful and wicked, famed for his prowess across the world, sinful in deeds and very cruel, that wretch has been killed by the Gandharvas …

    '
virata-4-32-28:
  ganguli: 4 XXX
  text: 'Let us, therefore, repair to Virata''s kingdom abounding in corn.

    '
  modern: 'Let us, then, go to Virāṭa''s kingdom, rich in corn.

    '
virata-4-32-29:
  ganguli: 4 XXX
  text: 'Or, invading his city by force, let us carry off by thousands his excellent kine of various species. Uniting, O king, the forces of the Kauravas and the Trigartas, let us lift his cattle in droves.

    '
  modern: 'Or let us invade his city by force and carry off thousands of his excellent cattle of every kind. Uniting the forces of the Kauravas and the Trigartas, O king, let us lift his cattle in droves.

    '
virata-4-32-62:
  ganguli: 4 XXX
  speaker: Vaisampayana continued
  text: 'Then, O Lord of earth, those warriors, the Trigartas, accompanied by their infantry of terrible prowess, marched towards the south-eastern direction, intending to wage hostilities with Virata from the desire of seizing his kine.

    '
  modern: 'Then, O lord of earth, those warriors, the Trigartas, with their terrible infantry, marched toward the south-east, meaning to make war on Virāṭa in order to seize his cattle.

    '
  speakerModern: 'Vaiśampāyana continued:'
virata-4-32-64:
  ganguli: 4 XXX
  text: 'And then, O king, on the eighth day following of the dark fortnight, the Kauravas also accompanied by all their troops, began to seize the kine by thousands.

    '
  modern: 'And then, O king, on the eighth day of the dark fortnight, the Kauravas also, with all their troops, began to seize the cattle by thousands.

    '
virata-4-33-16:
  ganguli: 4 XXXI
  text: 'Hearing these words, the king arrayed for battle the Matsya force abounding in cars and elephants and horses and infantry and standards.

    '
  modern: 'Hearing these words, the king drew up for battle the Matsya force, rich in chariots, elephants, horses, infantry and standards.

    '
virata-4-35-60:
  ganguli: 4 XXXIII
  text: '… the mighty sons of Pandu, endued with modesty and observant of vows and relying on the might of their own arms, after having vanquished Susarman, and rescued the kine as well as other kinds of wealth and having thus dispelled Virata''s anxiety, stood together before that monarch.

    '
  modern: '… the mighty sons of Pāṇḍu, modest and faithful to their vows and relying on the might of their own arms, having defeated Suśarman, rescued the cattle and the other wealth, and so ended Virāṭa''s anxiety, stood together before that monarch.

    '
virata-4-35-71:
  ganguli: 4 XXXIV
  text: 'And the Pandavas also replying on the might of their own arms, and endued with modesty and observant of vows, having slain their enemies and liberated Susarman, passed that night happily on the field of battle.

    '
  modern: 'And the Pāṇḍavas, relying on the might of their own arms, modest and faithful to their vows, having killed their enemies and freed Suśarman, spent that night happily on the field of battle.

    '
virata-4-37-1:
  ganguli: 4 XXXV
  speaker: Vaisampayana said
  text: 'When the king of the Matsyas, anxious of recovering the kine, had set out in pursuit of the Trigartas, Duryodhana with his counsellors invaded the dominions of Virata.

    '
  modern: 'When the king of the Matsyas, anxious to recover the cattle, had set out in pursuit of the Trigartas, Duryodhana and his counselors invaded Virāṭa''s dominions.

    '
  speakerModern: 'Vaiśampāyana said:'
virata-4-37-4:
  ganguli: 4 XXXV
  text: 'And Bhishma and Drona, and Karna, and Kripa acquainted with the best of weapons, Aswatthaman, and Suvala''s son, and Dussasana, O lord of men, and Vivingsati and Vikarna and Chitrasena endued with great energy, and Durmukha and Dussaha,--these and many other great warriors, coming upon the Matsya dominion speedily drove off the cowherds of king Virata and forcibly took away the kine.

    '
  modern: 'Bhīṣma, Droṇa, Karṇa, Kṛpa, who knows the best of weapons, Aśvatthāman, Suvala''s son, Duḥśāsana, O lord of men, Viviṃśati, Vikarṇa, the very energetic Citrasena, Durmukha and Duḥsaha, these and many other great warriors came upon the Matsya dominion, quickly drove off King Virāṭa''s cowherds, and took the cattle by force.

    '
virata-4-37-5:
  ganguli: 4 XXXV
  text: 'And the Kauravas, surrounding all sides with a multitude of cars, seized sixty thousands of kine.

    '
  modern: 'Surrounding the cattle on all sides with a mass of chariots, the Kauravas seized sixty thousand cows.

    '
virata-4-37-7:
  ganguli: 4 XXXV
  text: 'And the chief of the cowherds, greatly affrighted speedily mounted on a chariot and set out for the city, bewailing in affliction.

    '
  modern: 'The chief of the cowherds, badly frightened, quickly mounted a chariot and set out for the city, wailing in distress.

    '
virata-4-37-9:
  ganguli: 4 XXXV
  text: 'And beholding the proud son of Matsya, named Bhuminjaya, he told him everything about the seizure of the royal kine. And he said, the Kauravas are taking away sixty thousand kine.

    '
  modern: 'He saw the proud son of Matsya, named Bhūmiñjaya, and told him everything about the seizure of the royal cattle. He said, "The Kauravas are taking away sixty thousand cows."

    '
virata-4-38-67:
  ganguli: 4 XXXVII
  text: 'And with Vrihannala to hold his reins, the hero set out, taking with him many costly bows and a large number of beautiful arrows.

    '
  modern: 'With Bṛhannalā holding his reins, the hero set out, taking many costly bows and a large number of beautiful arrows.

    '
virata-4-39-8:
  ganguli: 4 XXXVIII
  text: 'And then was seen, O best among the Kurus, the dust raised by that moving army which reached the sky and obstructed the sight of all creatures.

    '
  modern: 'Then, O best among the Kurus, the dust raised by that moving army was seen; it reached the sky and shut out the sight of all creatures.

    '
virata-4-39-9:
  ganguli: 4 XXXVIII
  text: 'And beholding that mighty host abounding in elephants, horses and chariots, and protected by Karna and Duryodhana and Kripa and Santanu''s son, and that intelligent and great bowman Drona, with his son (Aswatthaman) …

    '
  modern: 'And seeing that mighty host, rich in elephants, horses, and chariots, and protected by Karṇa, Duryodhana, Kṛpa, Śāntanu''s son, and the intelligent and great bowman Droṇa with his son (Aśvatthāman) …

    '
virata-4-39-32:
  ganguli: 4 XXXVIII
  speaker: Vaisampayana continued
  text: 'Saying this, that much affrighted prince decked in ear-ring jumped down from his car, and throwing down his bow and arrows began to flee, sacrificing honour and pride.

    '
  modern: 'Saying this, the frightened prince in earrings jumped down from his chariot, threw down his bow and arrows, and began to flee, giving up honor and pride.

    '
  speakerModern: 'Vaiśampāyana continued:'
virata-4-39-34:
  ganguli: 4 XXXVIII
  text: 'Having said this, Dhananjaya, the son of Kunti, coming down from that excellent car ran after that prince thus running away, his own long braid and pure red garments fluttering in the air.

    '
  modern: 'Having said this, Dhanañjaya, son of Kuntī, got down from that excellent chariot and ran after the fleeing prince, his own long braid and pure red garments fluttering in the air.

    '
virata-4-39-35:
  ganguli: 4 XXXVIII
  text: 'And some soldiers, not knowing that it was Arjuna who was thus running with his braid fluttering in the air, burst out into laughter at the sight.

    '
  modern: 'Some soldiers, not knowing that it was Arjuna running with his braid fluttering in the air, burst out laughing at the sight.

    '
virata-4-39-51:
  ganguli: 4 XXXVIII
  text: 'And beholding him thus running, the Kurus began to argue, ''Who is this person, thus disguised like fire concealed in ashes? He is partly a man and partly a woman. Although bearing a neuter form, he yet resembleth Arjuna. His are the same head and neck, and his the same arms like unto a couple of maces. And this one''s gait also is like unto his. He can be none else than Dhananjaya.

    '
  modern: 'Seeing him run, the Kurus began to argue, "Who is this person, disguised like fire hidden in ashes? He is partly a man and partly a woman. Though he has a neuter form, he looks like Arjuna. He has the same head and neck, the same arms like a pair of maces. His gait is like Arjuna''s too. He can be none other than Dhanañjaya."

    '
virata-4-39-78:
  ganguli: 4 XXXVIII
  text: 'And the son of Pritha then addressed the affrighted prince who had nearly lost his senses, saying, ''If, O chastiser of foes, thou dost not venture to fight with enemy, come thou and hold the reins of the steeds as I fight with the foe.

    '
  modern: 'Then the son of Pṛthā spoke to the frightened prince, who had nearly lost his senses: "If, O chastiser of foes, you do not dare to fight the enemy, come and hold the reins of the horses while I fight."

    '
virata-4-45-1:
  ganguli: 4 XLVI
  speaker: Vaisampayana said
  text: 'Making Uttara his charioteer, and circumambulating the Sami tree, the son of Pandu set out taking all his weapons with him.

    '
  modern: 'Making Uttara his charioteer and walking around the śamī tree with his right side toward it, the son of Pāṇḍu set out with all his weapons.

    '
  speakerModern: 'Vaiśampāyana said:'
virata-4-45-26:
  ganguli: 4 XLVI
  speaker: Vaisampayana said
  text: 'Arjuna then blew his conch again, that conch which filled foes with grief and enhanced the joy of friends. And the sound was so loud that it seemed to split hills and mountains, and pierce mountain-caves and the cardinal points.

    '
  modern: 'Arjuna then blew his conch again, the conch that filled foes with grief and increased the joy of friends. The sound was so loud that it seemed to split hills and mountains and to pierce mountain caves and the points of the compass.

    '
  speakerModern: 'Vaiśampāyana said:'
virata-4-45-27:
  ganguli: 4 XLVI
  text: 'And Uttara once again sat down on the car, clinging to it in fear. And with the blare of the conch and the rattle of the car-wheels, and the twang of the Gandiva, the earth itself seemed to tremble. And beholding Uttara''s fight, Dhananjaya began to comfort him again.

    '
  modern: 'Uttara again sat down on the chariot, clinging to it in fear. With the blare of the conch, the rattle of the chariot wheels and the twang of the Gāṇḍīva, the earth itself seemed to tremble. Seeing Uttara''s fright, Dhanañjaya began to comfort him again.

    '
virata-4-52-6:
  ganguli: 4 LII
  text: 'Everything, therefore, that the sons of Pandu had promised, hath been exactly fulfilled by them. Knowing this to be certain, Vibhatsu hath made his appearance.

    '
  modern: 'So everything the sons of Pāṇḍu had promised has been exactly fulfilled by them. Knowing this for certain, Bībhatsu has made his appearance.

    '
virata-4-52-19:
  ganguli: 4 LII
  speaker: Duryodhana said
  text: 'I will not, O grandsire, give back the Pandavas their kingdom. Let every preparation, therefore, for battle be made without delay.

    '
  modern: 'I will not, O grandsire, give back the kingdom to the Pāṇḍavas. So let every preparation for battle be made without delay.

    '
  speakerModern: 'Duryodhana said:'
virata-4-52-27:
  ganguli: 4 LII
  text: 'And having sent away the king and then the kine, Bhishma began to array the soldiers in order of battle.

    '
  modern: 'Having sent away the king and then the cattle, Bhīṣma began to draw up the soldiers in battle order.

    '
virata-4-54-1:
  ganguli: 4 LIII
  speaker: Vaisampayana said
  text: 'After the Kauravas, O Bharata, had taken their stand in this order, Arjuna, filling the air with the rattle and din of his car, advanced quickly towards them.

    '
  modern: 'After the Kauravas had taken their stand in this order, O Bharata, Arjuna, filling the air with the rattle and din of his chariot, quickly advanced toward them.

    '
  speakerModern: 'Vaiśampāyana said:'
virata-4-54-8:
  ganguli: 4 LIII
  text: 'Behold, these two shafts coming together fall at my feet, and two others pass off barely touching my ears. Completing the period of exile and having achieved many wonderful feats, Partha saluteth me and whispereth in my ears.

    '
  modern: 'Look, two arrows fall together at my feet, and two others pass by, barely touching my ears. Having completed the period of exile and achieved many wonderful feats, Pārtha salutes me and whispers in my ears.

    '
virata-4-54-9:
  ganguli: 4 LIII
  text: '(with virata-4-54-8)

    '
virata-4-58-65:
  ganguli: 4 LIV
  text: 'And afflicting by means of his shafts, Vikartana''s son along with his steeds, car and car-driver, Kiritin impetuously poured an arrowy shower on him, casting his eyes on the grandsire and Drona and Kripa.

    '
  modern: 'Afflicting Karṇa, the son of Vikartana, along with his horses, chariot and charioteer, with his shafts, Kirīṭin impetuously poured a shower of arrows on him, looking at the grandsire, Droṇa and Kṛpa.

    '
virata-4-58-77:
  ganguli: 4 LIV
  text: 'And mangled and afflicted by the arrows shot by Partha the son of Pandu, Vikartana''s son, quitted the van of battle, and quickly took to flight, like one elephant vanquished by another.

    '
  modern: 'Struck and hurt by the arrows shot by Pārtha, the son of Pāṇḍu, Karṇa, the son of Vikartana, left the front of the battle and quickly fled, like one elephant beaten by another.

    '
virata-4-67-13:
  ganguli: 4 LXV
  text: '… And warding off with weapons, all the weapons of those bulls among the Kurus, the wielder of the Gandiva who was capable of enduring all foes, evolved another irresistible weapon obtained from Indra, called Sanmohana.

    '
  modern: '… Warding off with his own weapons all the weapons of those bulls among the Kurus, the wielder of the Gāṇḍīva, who could endure any foe, brought out another irresistible weapon, got from Indra, called Saṃmohana.

    '
virata-4-67-16:
  ganguli: 4 LXV
  text: 'And those foremost of the Kuru heroes were all deprived of their senses by the sound of that conch blown by Partha. And all of them stood still, their bows, from which they were never separated, dropping down from their hands.

    '
  modern: 'Those foremost Kuru heroes lost their senses at the sound of the conch blown by Pārtha. All of them stood still, their bows, which they never put down, dropping from their hands.

    '
virata-4-67-21:
  ganguli: 4 LXV
  text: 'And when the Kuru army became insensible, Partha calling to mind the words of Uttara, addressed the son of the Matsya king, saying, ''O best of men, go thou among the Kurus, so long as they remain insensible, and bring away the white garments of Drona and Kripa, and the yellow and handsome ones of Karna, as also the blue ones of the king and Drona''s son. Methinks, Bhishma is not stupefied, for he knoweth how to counteract this weapon of mine. So, pass thou on, keeping his steeds to thy left; for those that are sensible should thus be avoided,'' Hearing these words, the illustrious son of Matsya, giving up the reins of the steeds, jumped down from the car and taking off the garments of the warriors, came back to his place.

    '
  modern: 'When the Kuru army had lost its senses, Pārtha, remembering Uttara''s words, said to the son of the Matsya king, "O best of men, go among the Kurus while they remain insensible, and bring away the white garments of Droṇa and Kṛpa, the handsome yellow ones of Karṇa, and the blue ones of the king and Droṇa''s son. I think Bhīṣma is not stupefied, for he knows how to counter this weapon of mine. So pass by him, keeping his horses on your left, for those who are conscious should be avoided." Hearing this, the illustrious son of Matsya gave up the reins, jumped down from the chariot, took the garments off the warriors, and came back to his place.

    '
virata-4-67-22:
  ganguli: 4 LXV
  text: '(with virata-4-67-21)

    '
virata-4-67-23:
  ganguli: 4 LXV
  text: '(with virata-4-67-21)

    '
virata-4-67-38:
  ganguli: 4 LXV
  text: 'And suddenly blowing his conch called Devadatta, the hero pierced the hearts of all his foes.

    '
  modern: 'Suddenly blowing his conch called Devadatta, the hero pierced the hearts of all his foes.

    '
virata-4-67-40:
  ganguli: 4 LXV
  text: 'And beholding those foremost of Kuru heroes departing for their city, Dhananjaya, the son of Pritha, with a cheerful heart followed them for a while, desirous of addressing and worshipping them. And having worshipped the aged grandsire--the son of Santanu, as also the preceptor Drona, and having saluted with beautiful arrows Drona''s son and Kripa and other venerable ones among the Kurus, …

    '
  modern: 'Seeing those foremost Kuru heroes leaving for their city, Dhanañjaya, son of Pṛthā, followed them a while with a cheerful heart, wanting to address and honor them. Having honored the aged grandsire, the son of Śāntanu, and the teacher Droṇa, and having saluted Droṇa''s son, Kṛpa and other elders among the Kurus with beautiful arrows, …

    '
virata-4-68-19:
  ganguli: 4 LXV
  text: 'And reflecting that the advice of Bhishma was beneficial and seeing that the Pandavas gaining in strength, the other warriors also, desirous of protecting Duryodhana, resolved to return.

    '
  modern: 'Seeing that the advice of Bhīṣma was beneficial, and that the Pāṇḍavas were gaining in strength, the other warriors also, wanting to protect Duryodhana, resolved to return.

    '
virata-4-69-1:
  ganguli: 4 LXVII
  speaker: Vaisampayana said
  text: 'Having speedily recovered his wealth Virata owning a large army entered his city with a cheerful heart, accompanied by the four Pandavas.

    '
  modern: 'Having quickly recovered his wealth, Virāṭa, owner of a large army, entered his city cheerfully, accompanied by the four Pāṇḍavas.

    '
  speakerModern: 'Vaiśampāyana said:'
virata-4-69-18:
  ganguli: 4 LXVI
  speaker: Vaisampayana continued
  text: 'Agreeable to Arjuna''s words, Uttara speedily ordered the messengers, saying, ''Go ye and proclaim the king''s victory. The foe hath been routed, and the kine have been recovered.

    '
  modern: 'As Arjuna had said, Uttara quickly ordered the messengers, "Go and proclaim the king''s victory. The enemy has been routed, and the cattle have been recovered."

    '
  speakerModern: 'Vaiśampāyana continued:'
virata-4-74-1:
  ganguli: 4 LXX
  speaker: Vaisampayana said
  text: 'Then, on the third day, attired in white robes after a bath, and decked in ornaments of all kinds, those great car-warriors, the five Pandava brothers, having accomplished their row, and with Yudhishthira at their head, looked resplendent as they entered the palace-gate like five intoxicated elephants.

    '
  modern: 'Then, on the third day, the five Pāṇḍava brothers, great chariot-warriors, bathed and dressed in white robes and decked in ornaments of every kind, having fulfilled their vow, with Yudhiṣṭhira at their head, entered the palace gate, looking splendid like five intoxicated elephants.

    '
  speakerModern: 'Vaiśampāyana said:'
virata-4-74-2:
  ganguli: 4 LXX
  text: '(with virata-4-74-1)

    '
virata-4-74-3:
  ganguli: 4 LXX
  text: 'And having entered the council-hall of Virata, they took their seats on the thrones reserved for kings, and shone brilliantly like fires on the sacrificial altar.

    '
  modern: 'Entering Virāṭa''s council hall, they sat on the thrones reserved for kings and shone brightly like fires on a sacrificial altar.

    '
virata-4-74-5:
  ganguli: 4 LXX
  text: 'And after Pandavas had taken their seats, Virata, that lord of earth, came there for holding his council and discharging other royal offices.

    '
  modern: 'After the Pāṇḍavas had taken their seats, Virāṭa, lord of earth, came there to hold his council and carry out his other royal duties.

    '
virata-4-74-6:
  ganguli: 4 LXX
  text: 'And beholding the illustrious Pandavas blazing like fires, the king reflected for a moment.

    '
  modern: 'Seeing the illustrious Pāṇḍavas blazing like fires, the king thought for a moment.

    '
virata-4-74-10:
  ganguli: 4 LXX
  speaker: Vaisampayana continued
  text: 'Hearing these words of Virata, O king, and desirous of jesting with him, Arjuna smilingly said in reply, ''This person, O king, deserveth to occupy the same seat with Indra himself.

    '
  modern: 'Hearing these words of Virāṭa, O king, and wishing to jest with him, Arjuna said with a smile in reply, "This person, O king, deserves to sit on the same seat as Indra himself.

    '
  speakerModern: 'Vaiśampāyana continued:'
virata-4-74-18:
  ganguli: 4 LXX
  text: 'Kind unto all creatures he is no other than the bull of the Kuru race, king Yudhishthira the just. The achievements of this king resemble the sun himself of blazing effulgence. And his fame hath travelled in all directions like the rays of that luminary.

    '
  modern: 'Kind to all creatures, he is none other than the bull of the Kuru race, King Yudhiṣṭhira the just. This king''s achievements are like the blazing sun itself. His fame has traveled in all directions like that luminary''s rays.

    '
virata-4-75-3:
  ganguli: 4 LXXI
  speaker: Arjuna said
  text: 'Even this one, O king, who is called Vallava and is thy cook, is that Bhima of mighty arms and terrible prowess and furious impetus.

    '
  modern: 'This one, O king, who is called Vallava and is your cook, is Bhīma of mighty arms, terrible prowess and furious force.

    '
  speakerModern: 'Arjuna said:'
virata-4-75-7:
  ganguli: 4 LXXI
  text: 'He who had been the keeper of thy horse is that slayer of foes called Nakula, and this one is Sahadeva, the keeper of thy kine.

    '
  modern: 'He who was the keeper of your horses is Nakula, slayer of foes, and this is Sahadeva, the keeper of your cattle.

    '
virata-4-75-9:
  ganguli: 4 LXXI
  text: 'And even this lady of eyes like lotus-petals and slender-waist and sweet smiles is Drupada''s daughter, thy wife''s Sairindhri, for whose sake, O king, the Kichakas were slain.

    '
  modern: 'And this lady with eyes like lotus petals, slender waist and sweet smiles is Drupada''s daughter, your wife''s maid Sairandhrī, for whose sake, O king, the Kīcakas were killed.

    '
virata-4-75-22:
  ganguli: 4 LXXI
  speaker: Vaisampayana continued
  text: 'After Arjuna had pointed out those heroes--the five Pandavas, the son of Virata then spoke of Arjuna''s prowess.

    '
  modern: 'After Arjuna had pointed out those heroes, the five Pāṇḍavas, the son of Virāṭa then spoke of Arjuna''s prowess.

    '
  speakerModern: 'Vaiśampāyana continued:'
virata-4-75-33:
  ganguli: 4 LXXI
  text: 'And addressing all the Pandavas, and especially Dhananjaya, the mighty king of the Matsyas repeatedly said, ''By good luck it is that I see you.'' And having again and again embraced Yudhishthira and Bhima and the sons of Madri, and smelt their heads, Virata, that owner of a large army, was not satiated with gazing at them.

    '
  modern: 'Addressing all the Pāṇḍavas, and especially Dhanañjaya, the mighty king of the Matsyas said again and again, "By good luck I see you." Having embraced Yudhiṣṭhira, Bhīma and the sons of Mādrī again and again, and smelled their heads, Virāṭa, owner of a large army, could not get enough of looking at them.

    '
virata-4-75-35:
  ganguli: 4 LXXI
  text: 'And being highly pleased, he said unto king Yudhishthira, ''By good luck it is that I see you safe from woods. By good luck it is that ye have accomplished with difficulty the period of exile, undiscovered by those wicked wights. I make over my entire kingdom to the sons of Pritha, and what else I have. Let the sons of Pandu accept these without the slightest hesitation.

    '
  modern: 'Being very pleased, he said to King Yudhiṣṭhira, "By good luck I see you safe out of the woods. By good luck you have gotten through the period of exile, with difficulty, undiscovered by those wicked men. I make over my entire kingdom to the sons of Pṛthā, and whatever else I have. Let the sons of Pāṇḍu accept these without the slightest hesitation.

    '
virata-4-77-3:
  ganguli: 4 LXXI
  text: 'And let Dhananjaya, called also Savyasachin, accept the hand of Uttara: for that best of men is fit to be her lord.

    '
  modern: 'And let Dhanañjaya, also called Savyasācin, accept Uttarā''s hand, for that best of men is fit to be her husband.

    '
virata-4-77-4:
  ganguli: 4 LXXI
  text: 'Thus addressed, king Yudhishthira the just cast a look upon Dhananjaya, the son of Pritha.

    '
  modern: 'Thus addressed, King Yudhiṣṭhira the just looked at Dhanañjaya, the son of Pṛthā.

    '
virata-4-77-6:
  ganguli: 4 LXXI
  text: 'And looked at by his brother, Arjuna said unto the Matsya king, ''O monarch, I accept thy daughter as my daughter-in-law. And alliance of this kind between the Matsya and the Bharatas is, indeed, desirable.''

    '
  modern: 'Looked at by his brother, Arjuna said to the Matsya king, "O monarch, I accept your daughter as my daughter-in-law. Such an alliance between the Matsyas and the Bharatas is indeed desirable."

    '
virata-4-77-8:
  ganguli: 4 LXXII
  speaker: Arjuna said
  text: 'Residing in thy inner apartments, I had occasion always to behold thy daughter, and she too, alone or in company trusted me as her father.

    '
  modern: 'Living in your inner apartments, I always had occasion to see your daughter, and she, alone or in company, trusted me as her father.

    '
  speakerModern: 'Arjuna said:'
virata-4-77-9:
  ganguli: 4 LXXII
  text: 'Well-versed in singing and dancing, I was liked and regarded by her, and, indeed, thy daughter always regardeth me as her protector.

    '
  modern: 'Skilled in singing and dancing, I was liked and respected by her, and your daughter always regards me as her protector.

    '
virata-4-77-14:
  ganguli: 4 LXXII
  text: 'Surpassing all in knowledge of weapons, resembling a celestial youth in beauty, my son, the mighty-armed Abhimanyu is the favourite nephew of Vasudeva, the wielder of the discus.

    '
  modern: 'My son, the mighty-armed Abhimanyu, who surpasses all in knowledge of weapons and resembles a celestial youth in beauty, is the favorite nephew of Vāsudeva, the wielder of the discus.

    '
virata-4-77-15:
  ganguli: 4 LXXII
  text: 'He, O king, is fit to be thy son-in-law and the husband of thy daughter.

    '
  modern: 'He, O king, is fit to be your son-in-law and the husband of your daughter.

    '
virata-4-77-19:
  ganguli: 4 LXXII
  text: 'And, O Bharata, the son of Kunti sent invitations to Vasudeva and to all his friends and relatives, and Virata also did the same.

    '
  modern: 'And, O Bharata, the son of Kuntī sent invitations to Vāsudeva and to all his friends and relatives, and Virāṭa did the same.

    '
virata-4-78-1:
  ganguli: 4 LXXII
  text: 'And then, after the expiry of the thirteenth year, the five Pandavas took up their abode in one of Virata''s towns called Upaplavya, and Vibhatsu, the son of Pandu, brought over Abhimanyu and Janardana, and also many people of the Dasarha race from the Anarta country.

    '
  modern: 'Then, after the thirteenth year had ended, the five Pāṇḍavas took up their abode in Upaplavya, one of Virāṭa''s towns, and Bībhatsu, the son of Pāṇḍu, brought over Abhimanyu and Janārdana, and also many people of the Daśārha race from the Ānarta country.

    '
virata-4-78-4:
  ganguli: 4 LXXII
  text: '(with virata-4-78-1)

    '
virata-4-78-5:
  ganguli: 4 LXXII
  text: 'And after the kings had come there from different parts of the country, there came Vasudeva decked in floral garlands, and Halayudha, and Kritavarman, the son of Hridika, and Yuyudhana, the son of Satyaki, and Anadhristi and Akrura, and Samva and Nisatha.

    '
  modern: 'After the kings had come from different parts of the country, there came Vāsudeva, wearing garlands of flowers, and Halāyudha, Kṛtavarman, the son of Hṛdika, Yuyudhāna, the son of Satyaki, Anādhṛṣṭi, Akrūra, Sāmba and Niśaṭha.

    '
virata-4-78-30:
  ganguli: 4 LXXII
  text: 'And then conchs and cymbals and horns and drums and other musical instruments appointed by the Pandavas, began to play in the palace of Virata.

    '
  modern: 'Then conches, cymbals, horns, drums and other musical instruments, set up by the Pāṇḍavas, began to play in Virāṭa''s palace.

    '
virata-4-78-53:
  ganguli: 4 LXXII
  text: 'And then Dhananjaya, the son of Kunti, accepted Virata''s daughter of faultless limbs on behalf of his son by Subhadra.

    '
  modern: 'Then Dhanañjaya, son of Kuntī, accepted Virāṭa''s daughter of faultless limbs for his son by Subhadrā.

    '
udyoga-5-1-1:
  ganguli: 5 I
  speaker: Vaisampayana said,
  speakerModern: 'Vaiśaṃpāyana said:'
  text: Then those valiant descendants of Kuru, who belonged to the same party (with Virata), having joyfully celebrated the nuptials of Abhimanyu and rested themselves that night, presented themselves at dawn, well pleased, in the court of Virata, …
  modern: Then those valiant descendants of Kuru who were on Virāṭa's side celebrated Abhimanyu's wedding with joy and rested that night. At dawn, well pleased, they went to Virāṭa's court. …
udyoga-5-1-9:
  ganguli: 5 I
  text: And at the end of their talk, Krishna drew their attention to the affairs of the Pandavas. And those powerful kings together listened to Krishna’s speech, pregnant and lofty.
  modern: At the end of their talk, Kṛṣṇa drew their attention to the affairs of the Pāṇḍavas. The powerful kings all listened to Kṛṣṇa's speech, which was weighty and lofty.
udyoga-5-1-10:
  ganguli: 5 I
  speaker: Krishna said,
  speakerModern: 'Kṛṣṇa said:'
  text: It is known to you all, how this Yudhishthira was deceitfully defeated at dice by the son of Suvala, and how he was robbed of his kingdom and how a stipulation was made by him concerning his exile in the forest.
  modern: You all know how Yudhiṣṭhira was cheated at dice by the son of Suvala, how he lost his kingdom, and how he agreed to go into exile in the forest.
udyoga-5-1-13:
  ganguli: 5 I
  text: This being so, it is for you to consider what will be for the good of both Yudhishthira and Duryodhana, and what, as regards the Kurus and the Pandavas, will be consistent with the rules of righteousness and, propriety and what will meet with the approbation of all.
  modern: This being so, it is for you to consider what will be good for both Yudhiṣṭhira and Duryodhana, what will accord with righteousness and propriety for the Kurus and the Pāṇḍavas, and what will win everyone's approval.
udyoga-5-1-25:
  ganguli: 5 I
  text: Having listened to the speech of Krishna, marked by prudence and a regard for virtue and showing a pacific and impartial spirit, his elder brother then addressed the assembly bestowing high encomiums on the words of the younger brother.
  modern: When he had heard Kṛṣṇa's speech, which was wise, regarded virtue, and was peaceable and fair, his elder brother then addressed the assembly and warmly praised his younger brother's words.
udyoga-5-2-4:
  ganguli: 5 II
  text: And I should be well-pleased if somebody from here, with the view of pacifying both the Kurus and the Pandavas, should undertake a journey and ascertain what is the mind of Duryodhana and explain the views of Yudhishthira.
  modern: I would be glad if someone from here went to find out what is in Duryodhana's mind and to explain the views of Yudhiṣṭhira, so as to make peace between the Kurus and the Pāṇḍavas.
udyoga-5-2-13:
  ganguli: 5 II
  text: The messenger may thus bring round Dhritarashtra’s son to his own views. Do not seek war with the Kurus; address Duryodhana in only a conciliatory tone, …
  modern: In this way the messenger may bring Dhṛtarāṣṭra's son round to his own view. Do not seek war with the Kurus; speak to Duryodhana only in a conciliatory tone. …
udyoga-5-4-1:
  ganguli: 5 IV
  speaker: Drupada said,
  speakerModern: 'Drupada said:'
  text: O mighty-armed one, it will, without doubt, be even as thou hast said! Never will Duryodhana give up the kingdom by peaceful means, …
  modern: O mighty-armed one, it will surely be as you have said. Duryodhana will never give up the kingdom by peaceful means, …
udyoga-5-4-6:
  ganguli: 5 IV
  text: If any one were to speak mild words to Duryodhana, vicious by nature that wicked wight would consider the speaker to be an imbecile person. If a mild course is adopted towards him, the fool will think that he has won.
  modern: If anyone speaks mild words to Duryodhana, that wicked man, vicious by nature, will take the speaker for a weakling. If a mild course is taken with him, the fool will think he has won.
udyoga-5-4-7:
  ganguli: 5 IV
  text: Let us do even this, let us make preparations; let us send word to our friends that they may collect an army for us.
  modern: 'Let us do this: let us make preparations and send word to our friends to collect an army for us.'
udyoga-5-4-25:
  ganguli: 5 IV
  text: And let this my priest, learned Brahmana, be sent, O king, to Dhritarashtra.
  modern: And let this priest of mine, a learned brāhmaṇa, be sent to Dhṛtarāṣṭra, O king.
udyoga-5-5-3:
  ganguli: 5 V
  text: As we are desirous of adopting a politic course, this is, no doubt, our first duty; a man acting otherwise would be a great fool.
  modern: Since we want to follow a politic course, this is surely our first duty. A man who acted otherwise would be a great fool.
udyoga-5-5-5:
  ganguli: 5 V
  text: Both you and we have been invited here on the occasion of a marriage. The marriage having now been celebrated, let us go home well-pleased.
  modern: You and we have all been invited here for a marriage. The marriage is over, so let us go home well pleased.
udyoga-5-5-8:
  ganguli: 5 V
  text: I, therefore, ask you to send a message (to the Kurus) in the interests of the Pandavas. We all resolve even upon this that you should send a message unto them.
  modern: I therefore ask you to send a message to the Kurus on behalf of the Pāṇḍavas. We have all resolved that you should send it.
udyoga-5-5-12:
  ganguli: 5 V
  speaker: Vaisampayana said,
  speakerModern: 'Vaiśaṃpāyana said:'
  text: King Virata, then having honoured Krishna, sent him home with his followers and relatives.
  modern: King Virāṭa then honored Kṛṣṇa and sent him home with his followers and relatives.
udyoga-5-5-19:
  ganguli: 5 V
  text: And the king of the Panchalas, having consulted the wishes of Yudhishthira, despatched to the Kurus his own priest, who was old both in years and understanding.
  modern: The king of the Pañcālas, having consulted Yudhiṣṭhira's wishes, sent his own priest to the Kurus, a man old in years and in understanding.
udyoga-5-7-4:
  ganguli: 5 VII
  text: … the royal son of Dhritarashtra had, by sending secret emissaries, furnished himself with information of all the doings of the Pandavas.
  modern: … Dhṛtarāṣṭra's royal son sent out secret emissaries and learned everything the Pāṇḍavas were doing.
udyoga-5-7-5:
  ganguli: 5 VII
  text: And learning that Krishna was on his way, the prince went to the city of Dwaraka by means of fine horses possessing the speed of the wind, and taking with him a small number of troops.
  modern: Hearing that Kṛṣṇa was on his way, the prince set out for the city of Dvārakā with a small force, on fine horses swift as the wind.
udyoga-5-7-6:
  ganguli: 5 VII
  text: And on that very day the son of Kunti and Pandu, Dhananjaya, also speedily arrived at the beautiful city of the Anarta land.
  modern: On that very day Dhanañjaya, the son of Kuntī and Pāṇḍu, also came quickly to the beautiful city in the land of the Ānartas.
udyoga-5-7-7:
  ganguli: 5 VII
  text: And the two scions of the Kuru race, those tigers among men, on arriving there saw that Krishna was asleep, and drew near him as he lay down.
  modern: Those two scions of the Kuru race, those tigers among men, reached Dvārakā, saw Kṛṣṇa asleep, and went up to him as he lay there.
udyoga-5-7-8:
  ganguli: 5 VII
  text: And as Krishna was sleeping, Duryodhana entered the room, and sat down on a fine seat at the head of the bed.
  modern: While Kṛṣṇa slept, Duryodhana entered the room and sat down on a fine seat at the head of the bed.
udyoga-5-7-9:
  ganguli: 5 VII
  text: And after him entered that wearer of the diadem the magnanimous Arjuna. And stood at the back of the bed, bowing and joining his hands.
  modern: After him the great-souled Arjuna, the wearer of the diadem, came in. He stood at the foot of the bed, bowing with joined hands.
udyoga-5-7-10:
  ganguli: 5 VII
  text: And when the descendant of Vrishni, Krishna awoke, he first cast his eyes on Arjuna.
  modern: When Kṛṣṇa, the descendant of Vṛṣṇi, woke up, his eyes fell first on Arjuna.
udyoga-5-7-11:
  ganguli: 5 VII
  text: And having asked them as to the safety of their journey, and having fitly bestowed his greetings upon them, the slayer of Madhu questioned them as to the occasion of their visit.
  modern: After asking them whether their journey had been safe, and welcoming them as was fitting, the slayer of Madhu asked why they had come.
udyoga-5-7-12:
  ganguli: 5 VII
  text: Then Duryodhana addressed Krishna, with a cheerful countenance, saying, It behoveth you to lend me your help in the impending war.
  modern: Then Duryodhana, with a cheerful look, said to Kṛṣṇa, "You ought to help me in the coming war.
udyoga-5-7-13:
  ganguli: 5 VII
  text: Arjuna and myself are both equally your friends. And, O descendant of Madhu, you also bear the same relationship to both of us.
  modern: Arjuna and I are equally your friends, and, O descendant of Madhu, you are equally related to both of us.
udyoga-5-7-14:
  ganguli: 5 VII
  text: And today, O slayer of Madhu, I have been the first to come to you. Right-minded persons take up the cause of him who comes first to them. This is how the ancients acted. And, O Krishna, you stand at the very top of all right-minded persons in the world, and are always respected.
  modern: Today, O slayer of Madhu, I am the first to come to you. Good men take up the cause of whoever comes to them first. This is how the ancients acted. And, O Kṛṣṇa, you stand at the very top of all good men in the world, and are always respected.
udyoga-5-7-16:
  ganguli: 5 VII
  speaker: Thereat Krishna replied,
  speakerModern: 'Kṛṣṇa replied:'
  text: That you have come first, O king, I do not in the least doubt. But, O king, the son of Kunti, Dhananjaya, has been first beheld by me.
  modern: I do not doubt that you came first, O king. But I saw Dhanañjaya, the son of Kuntī, first.
udyoga-5-7-17:
  ganguli: 5 VII
  text: On account of your first arrival, and on account of my having beheld Arjuna first, I shall, no doubt, lend my assistance, O Suyodhana, to both.
  modern: Because you came first, and because I saw Arjuna first, I will certainly help you both, O Suyodhana.
udyoga-5-7-18:
  ganguli: 5 VII
  text: But it is said that those who are junior in years should have the first choice. Therefore, Dhananjaya, the son of Kunti, is entitled to first choice.
  modern: But it is said that the younger should have the first choice. So Dhanañjaya, the son of Kuntī, has the right to choose first.
udyoga-5-7-19:
  ganguli: 5 VII
  text: There is a large body of cowherds numbering ten crores, rivalling me in strength and known as the Narayanas, all of whom are able to fight in the thick of battle.
  modern: There is a large body of cowherds, ten crores of them, as strong as I am. They are known as the Nārāyaṇas, and all of them can fight in the thick of battle.
udyoga-5-7-20:
  ganguli: 5 VII
  text: These soldiers, irresistible in battle, shall be sent to one of you and I alone, resolved not to fight on the field, and laying down my arms, will go to the other.
  modern: These soldiers, irresistible in battle, shall go to one of you. And I alone, resolved not to fight, with my weapons laid down, will go to the other.
udyoga-5-7-21:
  ganguli: 5 VII
  text: You may, O son of Kunti, first select whichever of these two commends itself to you. For, according to law, you have the right to the first choice.
  modern: Son of Kuntī, you may choose first whichever of the two you prefer. By law, you have the right to choose first.
udyoga-5-7-23:
  ganguli: 5 VII
  speaker: Vaisampayana continued,
  speakerModern: 'Vaiśaṃpāyana continued:'
  text: Thus addressed by Krishna, Dhananjaya the son of Kunti selected Kesava who was not to fight on the battle-field, …
  modern: Thus addressed by Kṛṣṇa, Dhanañjaya, son of Kuntī, chose Keśava, who would not fight in the battle. …
udyoga-5-7-25:
  ganguli: 5 VII
  text: And Duryodhana selected for himself that entire army (composed of the Narayanas).
  modern: And Duryodhana chose for himself that entire army, the Nārāyaṇas.
udyoga-5-7-26:
  ganguli: 5 VII
  text: And, O descendant of Bharata, having obtained those troops numbering thousands upon thousands, he was exceedingly delighted, although he knew that Krishna was not on his side. And having secured that army possessed of terrible prowess, …
  modern: Having gained those troops, thousands upon thousands, he was delighted, though he knew that Kṛṣṇa was not on his side. Having secured that fearsome army, …
udyoga-5-7-39:
  ganguli: 5 VII
  text: It hath been always my desire to have you for driving my car. I, therefore, ask you to fulfil my desire cherished for a long time.
  modern: I have always wanted you to drive my chariot. So I ask you to fulfill the wish I have cherished for a long time.
udyoga-5-7-40:
  ganguli: 5 VII
  speaker: Vasudeva’s son thereupon said,
  speakerModern: 'Vāsudeva''s son then said:'
  text: It beseems thee well, O Kunti’s son, that thou measurest thyself with me. I will act as thy charioteer; let thy wish be fulfilled.
  modern: It is fitting, son of Kuntī, that you should measure yourself against me. I will be your charioteer. Let your wish be fulfilled.
udyoga-5-7-41:
  ganguli: 5 VII
  speaker: Vaisampayana continued,
  speakerModern: 'Vaiśaṃpāyana continued:'
  text: Then with a glad heart, Kunti’s son, accompanied by Krishna as well as by the flower of the Dasarha race, came back to Yudhishthira.
  modern: Then, with a glad heart, Kuntī's son came back to Yudhiṣṭhira, accompanied by Kṛṣṇa and by the best of the Dāśārha race.
udyoga-5-8-1:
  ganguli: 5 VIII
  speaker: Vaisampayana said,
  speakerModern: 'Vaiśaṃpāyana said:'
  text: O king, having learnt the news from the messengers, Salya, accompanied by a large body of troops and by his sons, all of whom were mighty in battle, was coming to the Pandavas.
  modern: O king, Śalya learned the news from the messengers and was on his way to the Pāṇḍavas with a large army and his sons, all mighty in battle.
udyoga-5-8-6:
  ganguli: 5 VIII
  text: And he proceeded by slow marches, giving rest to his troops, towards the place where the Pandava was. And the creatures of the earth felt oppressed and the earth trembled under the tread of his troops.
  modern: He advanced by slow marches, resting his troops, toward the place where the Pāṇḍava was. All creatures felt oppressed, and the earth trembled under the tread of his troops.
udyoga-5-8-8:
  ganguli: 5 VIII
  text: And king Duryodhana, … caused finely decorated places of entertainment to be constructed at different spots for his reception, on beautiful sites, …
  modern: King Duryodhana … had finely decorated resting-places built at different spots for his reception, on beautiful sites, …
udyoga-5-8-16:
  ganguli: 5 VIII
  text: And when Salya was exceedingly pleased and ready to grant even his life, Duryodhana, who had remained concealed, came forward and showed himself to his maternal uncle.
  modern: When Śalya was greatly pleased and ready to give even his life, Duryodhana, who had stayed hidden, came forward and showed himself to his maternal uncle.
udyoga-5-8-17:
  ganguli: 5 VIII
  text: And the kind of the Madras saw him and understood that it was Duryodhana who had taken all the trouble to receive him. And Salya embraced Duryodhana and said, ‘Accept something that you may desire.’
  modern: The king of the Madras saw him and understood that it was Duryodhana who had gone to all this trouble to receive him. Śalya embraced Duryodhana and said, "Ask for something you desire."
udyoga-5-8-18:
  ganguli: 5 VIII
  speaker: Duryodhana thereupon said,
  speakerModern: 'Duryodhana said:'
  text: O thou auspicious one, let thy word be true, grant me a boon. I ask thee to be the leader of all my army.
  modern: O auspicious one, let your word be true and grant me a boon. I ask you to be the leader of all my army.
udyoga-5-8-20:
  ganguli: 5 VIII
  speaker: Vaisampayana continued,
  speakerModern: 'Vaiśaṃpāyana continued:'
  text: And hearing this, Salya said, ‘Be it so! What else is to be done?’ And the son of Gandhari repeated again and again, ‘It is done.’
  modern: Hearing this, Śalya said, "So be it! What else is there to do?" And Gāndhārī's son said again and again, "It is done."
udyoga-5-18-25:
  ganguli: 5 XVIII
  speaker: Vaisampayana continued,
  speakerModern: 'Vaiśaṃpāyana continued:'
  text: Then Salya, the king of the Madras, bade farewell to the sons of Kunti. And that handsome man then went with his army to Duryodhana, O repressor of foes.
  modern: Then Śalya, king of the Madras, took leave of the sons of Kuntī. And that handsome man went with his army to Duryodhana, O repressor of foes.
udyoga-5-19-14:
  ganguli: 5 XIX
  text: And for the high-souled sons of Pandu there were thus assembled from various directions, seven Akshauhini of troops, bristling with banners of various forms.
  modern: Thus, from various directions, seven akṣauhiṇīs of troops, bristling with banners of many kinds, gathered around the high-souled sons of Pāṇḍu.
udyoga-5-19-18:
  ganguli: 5 XIX
  text: And Kritavarman, the son of Hridika, accompanied by the Bhojas, the Andhas, and the Kukuras, came to Duryodhana with an Akshauhini of troops.
  modern: And Kṛtavarman, the son of Hṛdika, came to Duryodhana with an akṣauhiṇī of troops, accompanied by the Bhojas, the Andhakas and the Kukuras.
udyoga-5-19-27:
  ganguli: 5 XIX
  text: And from the illustrious king, of other quarters there came, O best of Bharata’s race, three large divisions of troops. And thus Duryodhana had a force which numbered eleven Akshauhinis all eager to fight with the sons of Kunti, and bristling with banners of various forms.
  modern: From other quarters, O best of Bharata's race, three more large divisions came from the illustrious kings. And so Duryodhana had a force of eleven akṣauhiṇīs, all eager to fight the sons of Kuntī and bristling with banners of many kinds.
udyoga-5-19-33:
  ganguli: 5 XIX
  text: And that army, so arranged, was beheld by the priest who had been sent by the king of the Panchalas to the Kurus.
  modern: The priest whom the king of the Pañcālas had sent to the Kurus saw that army so arranged.
udyoga-5-20-2:
  ganguli: 5 XX
  text: And having first told the news of the welfare of the Pandavas, he enquired about the welfare of the Kauravas. And he spoke the following words in the midst of all the leaders of Duryodhana’s army, …
  modern: 'He first told them the news of the Pāṇḍavas'' welfare and asked after the welfare of the Kauravas. Then, in the midst of all the leaders of Duryodhana''s army, he spoke these words: …'
udyoga-5-20-12:
  ganguli: 5 XX
  text: … Ye best of Kuru’s race, overlooking all these injuries of yore they desire nothing but a peaceful settlement with the Kurus!
  modern: … You best of Kuru's race, overlooking all these old injuries, they want nothing but a peaceful settlement with the Kurus!
udyoga-5-20-21:
  ganguli: 5 XX
  text: Therefore, I ask you to give back what should be given, as dictated by morality and compact. Do not let the opportunity pass!
  modern: Therefore I ask you to give back what should be given, as morality and your agreement require. Do not let the moment pass."
udyoga-5-21-20:
  ganguli: 5 XXI
  text: … What Bhishma, Santanu’s son, hath said is salutary for us, as also for the Pandavas, and likewise for the whole universe.
  modern: … What Bhīṣma, Śāntanu's son, has said is good for us, for the Pāṇḍavas, and for the whole world.
udyoga-5-21-21:
  ganguli: 5 XXI
  text: I shall, however, after deliberation, send Sanjaya to the sons of Pandu. So thou needst not wait. Go thou to the son of Pandu this very day.
  modern: But I will think it over and send Sañjaya to the sons of Pāṇḍu. So you need not wait. Go to the son of Pāṇḍu this very day."
udyoga-5-22-1:
  ganguli: 5 XXII
  speaker: Dhritarashtra said,
  speakerModern: 'Dhṛtarāṣṭra said:'
  text: They say, O Sanjaya, that the Pandavas have arrived at Upaplavya. Go thou and enquire after them. Thou must greet Ajatasatru in the following words, ‘By good luck it is that (emerged from the woods) thou hast reached such a city.
  modern: 'They say, O Sañjaya, that the Pāṇḍavas have arrived at Upaplavya. Go and ask after them. Greet Ajātaśatru with these words: "It is good fortune that you have come out of the woods and reached such a city.'
udyoga-5-22-39:
  ganguli: 5 XXII
  text: … Kesava is as dear to them as their own selves. Possessed of great learning, he is ever devoted to their cause. Thou wilt also enquire about the welfare of all the assembled sons of Pandu and the Srinjayas and Satyaki and Virata and all the five sons of Draupadi, professing to be a messenger from me.
  modern: … Keśava is as dear to them as their own selves. He is very learned and always devoted to their cause. Ask also, as my messenger, after the welfare of all the assembled sons of Pāṇḍu, the Sṛñjayas, Sātyaki, Virāṭa, and all five sons of Draupadī.
udyoga-5-22-40:
  ganguli: 5 XXII
  text: And whatsoever also thou mayst deem to be opportune, and beneficial for the Bharata race, all that, O Sanjaya, thou must say in the midst of those kings,--everything, in sooth, that may not be unpalatable or provocative of war.
  modern: And whatever you think timely and good for the Bhārata race, you must say in the midst of those kings, everything that is not unpleasant and does not provoke war.
udyoga-5-23-2:
  ganguli: 5 XXIII
  text: And having approached king Yudhishthira, the son of Kunti, he made obeisance to him first and then spoke.
  modern: Having approached King Yudhiṣṭhira, son of Kuntī, he first bowed to him and then spoke.
udyoga-5-23-3:
  ganguli: 5 XXIII
  text: And the son of Gavalgana, by name Sanjaya and by caste a Suta, cheerfully spoke unto Ajatasatru, ‘How lucky, O king, that I see you hale, attended by friends and little inferior to the great Indra.
  modern: Sañjaya, the Sūta, son of Gavalgaṇa, said to Ajātaśatru with joy, "How fortunate, O king, that I see you well, with your friends about you, and little less than great Indra.
udyoga-5-23-4:
  ganguli: 5 XXIII
  text: The aged and wise king Dhritarashtra, the son of Ambika, hath enquired about your welfare. I hope Bhimasena is well, and that Dhananjaya, that foremost of the Pandavas, and these two sons of Madri, are well.
  modern: The aged and wise King Dhṛtarāṣṭra, son of Ambikā, asks after your welfare. Is Bhīmasena well? Is Dhanañjaya, the foremost of the Pāṇḍavas, well, and these two sons of Mādrī?
udyoga-5-25-4:
  ganguli: 5 XXV
  text: King Dhritarashtra, eagerly welcoming the chance of peace, hastened the preparation of my car for this journey here. Let it be acceptable to king Yudhishthira with his brothers and sons and relations. Let the son of Pandu prefer peace.
  modern: King Dhṛtarāṣṭra, eager to take the chance of peace, had my chariot made ready in haste for this journey. Let it be acceptable to King Yudhiṣṭhira, with his brothers, sons and relatives. Let the son of Pāṇḍu choose peace.
udyoga-5-26-27:
  ganguli: 5 XXVI
  text: O charioteer, the old king with his son still entertains the notion that his sons will not be perished, O Sanjaya, on the field of battle, consumed by the fiery wrath of Pandu’s sons.
  modern: O charioteer, the old king and his son still think that his sons will not perish on the field of battle, burned up by the fiery wrath of Pāṇḍu's sons, O Sañjaya.
udyoga-5-26-29:
  ganguli: 5 XXVI
  text: Let the same state of things still continue, I shall seek peace, as thou counsellest me to do. Let me have Indraprastha for my kingdom, Let this be given to me by Duryodhana, the chief of Bharata’s race.
  modern: Let things stay as they are. I will seek peace, as you advise. Let me have Indraprastha for my kingdom, and let Duryodhana, chief of Bharata's race, give it to me."
udyoga-5-28-10:
  ganguli: 5 XXVIII
  text: Let the celebrated Krishna say whether I would be censurable if I dismiss all idea of peace, of whether if I fight, I should be abandoning the duties of my caste, for Krishna seeketh the welfare of both sides.
  modern: Let the famous Kṛṣṇa say whether I would be to blame if I gave up all idea of peace, or whether, if I fight, I would be abandoning the duties of my caste, for Kṛṣṇa seeks the welfare of both sides.
udyoga-5-28-14:
  ganguli: 5 XXVIII
  text: Him you must know as the great judge of the propriety or otherwise of all acts. Krishna is dear to us, and is the most illustrious of men. I never disregard what Krishna sayeth.
  modern: You must know him as the great judge of what is proper and improper in every act. Kṛṣṇa is dear to us and is the most illustrious of men. I never disregard what Kṛṣṇa says."
udyoga-5-29-1:
  ganguli: 5 XXIX
  speaker: Krishna said,
  speakerModern: 'Kṛṣṇa said:'
  text: I desire, O Sanjaya, that the sons of Pandu may not be ruined; that they may prosper, and attain their wishes. Similarly, I pray for the prosperity of king Dhritarashtra whose sons are many.
  modern: I wish, O Sañjaya, that the sons of Pāṇḍu may not be ruined, that they may prosper and gain their wishes. In the same way I pray for the prosperity of King Dhṛtarāṣṭra, who has many sons.
udyoga-5-29-47:
  ganguli: 5 XXIX
  text: I desire to go personally to the Kurus, in order to settle this difficult matter.
  modern: I wish to go to the Kurus myself, to settle this difficult matter.
udyoga-5-29-48:
  ganguli: 5 XXIX
  text: If without injury to the Pandava cause I succeed in bringing about this peace with the Kurus, an act of religious merit, resulting in very great blessings, will then have been done by me; and the Kurus also will have been extricated from the meshes of death.
  modern: If I can bring about this peace with the Kurus without harming the Pāṇḍava cause, I will have done a meritorious act with very great blessings, and the Kurus will have been pulled out of the jaws of death.
udyoga-5-29-59:
  ganguli: 5 XXIX
  text: The sons of Pritha are ready to wait upon Dhritarashtra as, indeed, those repressors of foes are ready for war. Let king Dhritarashtra now do what may be proper for him to do.
  modern: The sons of Pṛthā are ready to serve Dhṛtarāṣṭra, just as those repressors of foes are ready for war. Let King Dhṛtarāṣṭra now do what he thinks proper.
udyoga-5-31-4:
  ganguli: 5 XXXI
  text: O son of Gavalgana, repairing unto the Kurus, thou wilt salute the mighty Dhritarashtra, and touching his feet enquire after his welfare speaking in our name.
  modern: O son of Gavalgaṇa, go to the Kurus, greet the mighty Dhṛtarāṣṭra, touch his feet, and ask after his welfare in our name.
udyoga-5-31-5:
  ganguli: 5 XXXI
  text: And when seated in the midst of the Kurus, tell him from us.--The sons of Pandu, O king, are living happily in consequence of thy prowess.
  modern: 'When he is seated among the Kurus, tell him from us: "The sons of Pāṇḍu, O king, live happily because of your strength.'
udyoga-5-31-6:
  ganguli: 5 XXXI
  text: It was through thy grace, O repressor of foes, that those children of tender years had obtained a kingdom. Having first bestowed a kingdom on them, thou shouldst not now be indifferent to them, for destruction then would overtake them!
  modern: It was by your grace, O repressor of foes, that those young children obtained a kingdom. Having first given them a kingdom, you should not now neglect them, for destruction would then overtake them.
udyoga-5-31-7:
  ganguli: 5 XXXI
  text: The whole of this kingdom, O Sanjaya, is not fit to be owned by one person. Tell him again, from us.--O sire, we wish to live united. Do not suffer thyself to be vanquished by foes. …
  modern: 'This whole kingdom, O Sañjaya, is not fit to be owned by one person." Tell him again from us: "O sire, we wish to live united. Do not let yourself be conquered by your foes." …'
udyoga-5-31-9:
  ganguli: 5 XXXI
  text: Having saluted our grandsire, he should then be told.--By thee, when Santanu’s race was about to be extinct, it was revived.
  modern: 'Having greeted our grandsire, tell him: "When Śāntanu''s line was about to die out, you revived it.'
udyoga-5-31-10:
  ganguli: 5 XXXI
  text: Therefore, O sire, do that according to thy own judgment by which thy grandsons may all live in amity with one another.
  modern: Therefore, O sire, act on your own judgment so that all your grandsons may live in friendship with one another."
udyoga-5-31-11:
  ganguli: 5 XXXI
  text: Thou shouldst then address Vidura also, that adviser of the Kurus, saying.--Counseleth peace, O amiable one, from desire of doing good unto Yudhishthira.--Thou shouldst address the unforbearing prince Duryodhana also, when seated in the midst of the Kurus, beseeching him again and again, saying, …
  modern: "Then address Vidura also, the Kurus' adviser, saying: \"O amiable one, counsel peace, out of a wish to do good to Yudhiṣṭhira.\" Address the intolerant Prince Duryodhana too, when he is seated among the Kurus, begging him again and again: …"
udyoga-5-31-12:
  ganguli: 5 XXXI
  text: (with udyoga-5-31-11)
udyoga-5-31-15:
  ganguli: 5 XXXI
  text: O amiable one, thou hadst even exiled us dressed in deer-skins. We are bearing that also because we do not want to see the Kurus slain.
  modern: O amiable one, you even sent us into exile dressed in deerskins. We bear that too, because we do not want to see the Kurus slain.
udyoga-5-31-16:
  ganguli: 5 XXXI
  text: Dussasana, in obedience to thee, had dragged Krishna, disregarding Kunti. That act also will be forgiven by us.
  modern: Duḥśāsana, at your word, dragged Kṛṣṇā along, disregarding Kuntī. That act also we will forgive.
udyoga-5-31-17:
  ganguli: 5 XXXI
  text: But, O chastiser of foes, we must have our proper share of the kingdom. O bull among men, turn thy coveting heart from what belongeth to others.
  modern: But, O chastiser of foes, we must have our proper share of the kingdom. O bull among men, turn your covetous heart away from what belongs to others.
udyoga-5-31-18:
  ganguli: 5 XXXI
  text: Peace then, O king, will be amongst our gladdened selves. We are desirous of peace; give us even a single province of the empire.
  modern: Then, O king, peace and joy will be among us. We want peace; give us even a single province of the empire.
udyoga-5-31-20:
  ganguli: 5 XXXI
  text: O Suyodhana, give unto thy five brothers at least five villages,--O Sanjaya, O thou of great wisdom, let there be peace between us and our cousins.
  modern: O Suyodhana, give your five brothers at least five villages. O Sañjaya, O wise one, let there be peace between us and our cousins.
udyoga-5-31-22:
  ganguli: 5 XXXI
  text: That I may see the Kurus and the Panchalas whole and sound, is what I desire. O bull of the Bharata race, with, cheerful hearts let us make peace.
  modern: I want to see the Kurus and the Pañcālas safe and sound. O bull of the Bharata race, let us make peace with cheerful hearts.
udyoga-5-31-23:
  ganguli: 5 XXXI
  text: O Sanjaya, I am equally capable of war and peace. I am prepared to acquire wealth as well as to earn virtue. I am fit enough for severity as for softness.
  modern: O Sañjaya, I am equally able to make war or peace. I am ready to gain wealth as well as to earn merit. I am as fit for severity as for gentleness."
udyoga-5-32-8:
  ganguli: 5 XXXII
  speaker: Vaisampayana said,
  speakerModern: 'Vaiśaṃpāyana said:'
  text: Dismissed with salutation by the Pandavas, Sanjaya set out for (Hastinapura) having executed all the commands of the illustrious Dhritarashtra.
  modern: Dismissed with a salutation by the Pāṇḍavas, Sañjaya set out for Hāstinapura, having carried out all the commands of the illustrious Dhṛtarāṣṭra.
udyoga-5-32-9:
  ganguli: 5 XXXII
  text: Reaching Hastinapura he quickly entered it, and presented himself at the gate of the inner apartments of the palace.
  modern: Reaching Hāstinapura, he quickly entered the city and presented himself at the gate of the inner apartments of the palace.
udyoga-5-47-2:
  ganguli: 5 XLVII
  text: And after the night had passed away, all the princes and chiefs, entered the court-hall with joyous hearts and desirous of seeing that Suta (who had returned).
  modern: When the night had passed, all the princes and chiefs entered the court-hall with joyful hearts, wanting to see the Sūta who had returned.
udyoga-5-47-3:
  ganguli: 5 XLVII
  text: And anxious to hear the message of Partha’s, fraught with virtue and profit, all the kings with Dhritarashtra at their head, went to that beautiful hall.
  modern: Eager to hear Pārtha's message, full of virtue and profit, all the kings, with Dhṛtarāṣṭra at their head, went to that beautiful hall.
udyoga-5-48-2:
  ganguli: 5 XLVIII
  speaker: Sanjaya said,
  speakerModern: 'Sañjaya said:'
  text: Let Duryodhana listen to the words which the high-souled Arjuna, eager for fight, uttered, with Yudhishthira’s sanction and in the hearing of Kesava.
  modern: Let Duryodhana listen to the words that the high-souled Arjuna, eager to fight, spoke with Yudhiṣṭhira's consent, in the hearing of Keśava.
udyoga-5-48-94:
  ganguli: 5 XLVIII
  text: If man is affected by his acts, if we be superior to Duryodhana, then, I hope that, with Vasudeva as my second, I shall slay Duryodhana, with all his kinsmen.
  modern: If a man is bound by his deeds, and if we are better than Duryodhana, then I hope that, with Vāsudeva as my second, I shall kill Duryodhana together with all his kinsmen.
udyoga-5-48-102:
  ganguli: 5 XLVIII
  text: My bow, Gandiva, yawneth without being handled; my bow-string trembleth without being stretched; and arrows also, issuing from my quiver’s mouth, are again and again seeking to fly.
  modern: My bow Gāṇḍīva yawns without being handled. My bowstring trembles without being drawn. And arrows, coming out of my quiver's mouth, again and again want to fly.
udyoga-5-48-108:
  ganguli: 5 XLVIII
  text: Look at the folly of Duryodhana! O Suta, they that are invincible in battle even if encountered with the aid of the very gods headed by Indra,--even against them that son of Dhritarashtra thinketh of warring!
  modern: Look at Duryodhana's folly! O Sūta, those who cannot be conquered in battle even with the aid of the gods headed by Indra, even against them Dhṛtarāṣṭra's son thinks of making war!
udyoga-5-48-109:
  ganguli: 5 XLVIII
  text: But so let it be even as the aged Bhishma, the son of Santanu, and Kripa, and Drona with his son, and Vidura endued with great wisdom, are saying, ‘May the Kauravas all live long!
  modern: 'But let it be as the aged Bhīṣma, Śāntanu''s son, and Kṛpa, and Droṇa with his son, and the very wise Vidura say: ''May all the Kauravas live long!'''
udyoga-5-49-1:
  ganguli: 5 XLIX
  speaker: Vaisampayana said,
  speakerModern: 'Vaiśaṃpāyana said:'
  text: In the midst, O Bharata, of all those assembled kings, Bhishma, the son of Santanu, then said these words unto Duryodhana, …
  modern: 'In the midst of all those assembled kings, O Bhārata, Bhīṣma, son of Śāntanu, then spoke these words to Duryodhana: …'
udyoga-5-49-19:
  ganguli: 5 XLIX
  text: It hath been heard by us that the two heroic and mighty car-warriors, Vasudeva and Arjuna, that are now united with each other, are those same ancient gods, the divine Nara and Narayana.
  modern: We have heard that the two heroic and mighty chariot-warriors Vāsudeva and Arjuna, now united, are those same ancient gods, the divine Nara and Nārāyaṇa.
udyoga-5-49-23:
  ganguli: 5 XLIX
  text: When thou, O Duryodhana, wilt see Kesava with conch-shell and discus, and mace in hand, and that terrible wielder of the bow, Arjuna, armed with weapons, when thou wilt behold those eternal and illustrious ones, the two Krishnas seated on the same car, then wilt thou, O child, remember these my words.
  modern: When you see Keśava with conch, discus and mace in hand, and the terrible bowman Arjuna taking up his weapons, when you see those two eternal and illustrious Kṛṣṇas on one chariot, then, O child, you will remember my words.
udyoga-5-49-24:
  ganguli: 5 XLIX
  text: (with udyoga-5-49-23)
udyoga-5-49-31:
  ganguli: 5 XLIX
  text: Besides, what wickedness is there in me? I have no sin known to any one of Dhritarashtra’s people. I have never done any injury to Dhritarashtra’s son; on the other hand, I will slay all the Pandavas in battle.
  modern: Besides, what wickedness is there in me? No one among Dhṛtarāṣṭra's people knows of any sin of mine. I have never done any harm to Dhṛtarāṣṭra's son. On the contrary, I will kill all the Pāṇḍavas in battle.
udyoga-5-49-32:
  ganguli: 5 XLIX
  text: How can they that are wise make peace again with those that have before been injured? It is always my duty to do all that is agreeable to king Dhritarashtra, and especially to Duryodhana, for he is in possession of the kingdom.
  modern: How can the wise make peace again with those they have wronged before? It is always my duty to do whatever pleases King Dhṛtarāṣṭra, and especially Duryodhana, since he holds the kingdom.
udyoga-5-49-33:
  ganguli: 5 XLIX
  speaker: Vaisampayana continued,
  speakerModern: 'Vaiśaṃpāyana continued:'
  text: Having listened to these words of Karna, Bhishma the son of Santanu, addressing king Dhritarashtra, again said, ‘Although this one often boasteth saying,--I shall slay the Pandavas,--yet he is not equal to even a sixteenth part of high-souled Pandavas.
  modern: 'Having heard these words of Karṇa, Bhīṣma, son of Śāntanu, spoke again to King Dhṛtarāṣṭra: "Though this man often boasts, ''I shall kill the Pāṇḍavas,'' he is not equal to even a sixteenth part of the high-souled Pāṇḍavas.'
udyoga-5-49-34:
  ganguli: 5 XLIX
  text: (with udyoga-5-49-33)
udyoga-5-49-35:
  ganguli: 5 XLIX
  text: Know that the great calamity that is about to overtake thy sons of wicked souls, is the act of this wretched son of a Suta!
  modern: Know that the great calamity about to fall on your wicked-souled sons is the work of this wretched son of a Sūta!
udyoga-5-49-40:
  ganguli: 5 XLIX
  text: When Dhananjaya, rushing against all the assembled Kurus, crushed them and took away their robes, was this one not there then?
  modern: When Dhanañjaya rushed against all the assembled Kurus, crushed them and took away their clothes, was this man not there?
udyoga-5-49-41:
  ganguli: 5 XLIX
  text: When thy son was being led away as a captive by the Gandharvas on the occasion of the tale of the cattle, where was this son of a Suta then who now belloweth like a bull?
  modern: When your son was being carried off as a captive by the Gandharvas, on the occasion of the cattle raid, where was this son of a Sūta, who now bellows like a bull?
udyoga-5-49-42:
  ganguli: 5 XLIX
  text: Even there, it was Bhima, and the illustrious Partha, and the twins, that encountered the Gandharvas and vanquished them.
  modern: There too, it was Bhīma, the illustrious Pārtha, and the twins who met the Gandharvas and defeated them.
udyoga-5-49-45:
  ganguli: 5 XLIX
  text: … Do that, O king, which the best of the Bharatas, Bhishma, hath said. It behoveth thee not to act according to the words of those that are covetous of wealth.
  modern: … Do what Bhīṣma, the best of the Bhāratas, has said, O king. You should not act on the words of those who are greedy for wealth.
udyoga-5-49-46:
  ganguli: 5 XLIX
  text: Peace with the Pandavas, before the war breaks out, seems to be the best.
  modern: Peace with the Pāṇḍavas, before war breaks out, seems best.
udyoga-5-49-47:
  ganguli: 5 XLIX
  text: Everything said by Arjuna and repeated here by Sanjaya, will, I know, be accomplished by that son of Pandu, for there is no bowman equal unto him in the three worlds!
  modern: I know that everything Arjuna said, and Sañjaya repeated here, will be carried out by that son of Pāṇḍu, for there is no bowman equal to him in the three worlds!"
udyoga-5-51-26:
  ganguli: 5 LI
  text: Fools in reality though boasting of their wisdom, alas, my children do not listen to me even though I cry out. Beholding only the honey they do not see the terrible fall that is before them.
  modern: They are fools who boast of their wisdom. Alas, my children do not listen to me, though I cry out. They see only the honey and do not see the terrible fall before them.
udyoga-5-53-15:
  ganguli: 5 LIII
  text: This appears to me very clearly, and if we act accordingly, my mind may have peace. If war with them doth not seem beneficial to you, then we will strive to bring about peace.
  modern: This is very clear to me, and if we act on it, my mind may have peace. If war with them does not seem good to you, then let us try to bring about peace.
udyoga-5-55-1:
  ganguli: 5 LV
  speaker: Duryodhana said,
  speakerModern: 'Duryodhana said:'
  text: Fear not, O king. Nor shouldest thou grieve for us. O monarch, O lord, we are quite able to vanquish the foe in battle.
  modern: Do not be afraid, O king, and do not grieve for us. O monarch, O lord, we are quite able to defeat the enemy in battle.
udyoga-5-55-30:
  ganguli: 5 LV
  text: Having given up all hopes of a city, Yudhishthira craveth only five villages, affrighted, O lord, at the army I have assembled and at my power.
  modern: Having given up all hope of a city, Yudhiṣṭhira begs for only five villages, frightened, O lord, by the army I have gathered and by my power.
udyoga-5-55-66:
  ganguli: 5 LV
  text: O king, I have assembled one and ten Akshauhinis. The army of the enemy is less than mine, amounting only to seven Akshauhinis.
  modern: O king, I have gathered eleven akṣauhiṇīs. The enemy's army is smaller than mine, only seven akṣauhiṇīs.
udyoga-5-55-69:
  ganguli: 5 LV
  text: … Knowing all this, O Bharata, as also the superiority of my force and the inferiority of the Pandavas, it behoveth thee not to lose thy senses.
  modern: … Knowing all this, O Bhārata, and knowing my force is superior and the Pāṇḍavas' inferior, you should not lose your wits.
udyoga-5-58-2:
  ganguli: 5 LVIII
  text: I ask thee, O Duryodhana, O foremost of the Bharata race, desist from hostility. O chastiser of foes, under any circumstances, war is never applauded.
  modern: I ask you, O Duryodhana, foremost of the Bharata race, to give up this hostility. O chastiser of foes, war is never praised, whatever the circumstances.
udyoga-5-58-3:
  ganguli: 5 LVIII
  text: Half the earth is quite enough for the maintenance of thyself and all thy followers. Give back unto the sons of Pandu, O chastiser of foes, their proper share.
  modern: Half the earth is quite enough to support you and all your followers. Give the sons of Pāṇḍu their proper share, O chastiser of foes.
udyoga-5-58-18:
  ganguli: 5 LVIII
  text: O venerable one, I will not surrender to the Pandavas even that much of land which may be covered by the sharp point of a needle.
  modern: O venerable one, I will not give up to the Pāṇḍavas even as much land as the sharp point of a needle can cover.
udyoga-5-66-1:
  ganguli: 5 LXVII
  speaker: Vaisampayana said,
  speakerModern: 'Vaiśaṃpāyana said:'
  text: When Duryodhana, the son of Dhritarashtra, showed little regard for the words spoken by Sanjaya, and when the rest remained silent, the assembled kings rose up and retired.
  modern: Duryodhana, son of Dhṛtarāṣṭra, showed little regard for the words Sañjaya had spoken, and the rest stayed silent. The assembled kings rose up and left.
udyoga-5-71-8:
  ganguli: 5 LXXII
  speaker: Vaisampayana said,
  speakerModern: 'Vaiśaṃpāyana said:'
  text: After Sanjaya had gone, Yudhishthira the just, addressed Krishna of the Dasarha race--that chief of all the Sattwatas, saying, …
  modern: 'After Sañjaya had gone, Yudhiṣṭhira the just spoke to Kṛṣṇa of the Dāśārha race, the chief of all the Sātvatas: …'
udyoga-5-71-9:
  ganguli: 5 LXXII
  text: O thou that art devoted to friends, the time hath come for friends to show their friendship. I do not see any other persons besides thee that can save us in this season of distress.
  modern: O you who are devoted to your friends, the time has come for friends to show their friendship. I see no one but you who can save us in this time of distress.
udyoga-5-71-13:
  ganguli: 5 LXXII
  speaker: Yudhishthira said,
  speakerModern: 'Yudhiṣṭhira said:'
  text: Thou hast heard what the intention is of Dhritarashtra and his own. All that Sanjaya, O Krishna, said unto me hath certainly the assent of Dhritarashtra. …
  modern: "You have heard what Dhṛtarāṣṭra and his own people intend. Everything Sañjaya said to me, O Kṛṣṇa, certainly has Dhṛtarāṣṭra's assent. …"
udyoga-5-71-16:
  ganguli: 5 LXXII
  text: Without looking equally on all that are his, moved by avarice and a sinful heart, Dhritarashtra seeketh to make peace with us without giving us back our kingdom.
  modern: Without treating all his sons alike, moved by greed and a sinful heart, Dhṛtarāṣṭra seeks to make peace with us without giving back our kingdom.
udyoga-5-71-21:
  ganguli: 5 LXXII
  text: What can be more sorrowful, O Janardana, than this, that I am unable to maintain my mother and my friends?
  modern: What could be more sorrowful, O Janārdana, than that I am unable to support my mother and my friends?
udyoga-5-71-25:
  ganguli: 5 LXXII
  text: … The wicked-minded son of Dhritarashtra, however, regarding the lordship of the world to be; in him, doth not agree to even that. What can be more sorrowful than this?
  modern: … But Dhṛtarāṣṭra's wicked-minded son, thinking himself lord of the world, does not agree even to that. What could be more sorrowful than this?
udyoga-5-71-85:
  ganguli: 5 LXXII
  text: Whom also, besides thee, O slayer of Madhu, and foremost of men, shall we consult in this difficult affair? What other friend have we, O Krishna, who like thee is so dear to us, who seeketh our welfare so, who is so conversant with the course of all actions, and who is so well-acquainted with truth?
  modern: Besides you, O slayer of Madhu, foremost of men, whom else can we consult in this difficult matter? What other friend do we have, O Kṛṣṇa, who is as dear to us as you, who seeks our welfare so, who knows so well the course of all actions, and who knows the truth so well?
udyoga-5-71-87:
  ganguli: 5 LXXII
  speaker: Vaisampayana continued,
  speakerModern: 'Vaiśaṃpāyana continued:'
  text: Thus addressed, Janardana replied unto Yudhishthira the just, saying, ‘I will go to the court of the Kurus for the sake of both of You.
  modern: Thus addressed, Janārdana replied to Yudhiṣṭhira the just, "I will go to the court of the Kurus for the sake of you both.
udyoga-5-71-88:
  ganguli: 5 LXXII
  text: If without sacrificing your interests I can obtain peace, O king, an act of great religious merit will be mine, productive of great fruits.
  modern: If I can obtain peace without sacrificing your interests, O king, I will have done a great act of merit, bearing great fruit.
udyoga-5-71-89:
  ganguli: 5 LXXII
  text: I shall then also save from the meshes of death the Kurus and the Srinjayas inflamed with wrath, the Pandavas and the Dhritarashtras, and, in fact, this entire earth.
  modern: I will then also save from the snares of death the Kurus and the Sṛñjayas, inflamed with wrath, the Pāṇḍavas and the Dhārtarāṣṭras, and indeed this entire earth."
udyoga-5-71-90:
  ganguli: 5 LXXII
  speaker: Yudhishthira said,
  speakerModern: 'Yudhiṣṭhira said:'
  text: It is not my wish, O Krishna, that thou wilt go to the Kurus, for Suyodhana will never act according to thy words, even if thou advisest him well.
  modern: I do not want you to go to the Kurus, O Kṛṣṇa, for Suyodhana will never act on your words, however well you advise him.
udyoga-5-71-91:
  ganguli: 5 LXXII
  text: All the Kshatriyas of the world, obedient to Duryodhana’s command, are assembled there. I do not like that thou, O Krishna, shouldst proceed into their midst, …
  modern: All the Kṣatriyas of the world, obedient to Duryodhana's command, are assembled there. I do not like the thought of you going into their midst, O Kṛṣṇa. …
udyoga-5-71-92:
  ganguli: 5 LXXII
  text: … If any mischief be done to thee, O Madhava, let alone happiness; nothing, not even divinity, nor even the sovereignty over all the gods will delight us.
  modern: "… If any harm were done to you, O Mādhava, nothing would delight us, let alone happiness: not even divinity, nor even sovereignty over all the gods."
udyoga-5-71-93:
  ganguli: 5 LXXII
  speaker: The holy one said,
  speakerModern: 'The Blessed One said:'
  text: I know, O monarch, the sinfulness of Dhritarashtra’s son, but by going there we will escape the blame of all the kings of the earth.
  modern: I know, O monarch, the sinfulness of Dhṛtarāṣṭra's son, but by going there we will escape the blame of all the kings of the earth.
udyoga-5-71-95:
  ganguli: 5 LXXII
  text: If, after all, they do me any injury, then I will consume all the Kurus. Even this is my intention.
  modern: If, after all, they do me any harm, I will burn up all the Kurus. That is my intention.
udyoga-5-71-96:
  ganguli: 5 LXXII
  text: My going thither, O Partha, will not be fruitless, for if our object be not fulfilled, we shall at least escape all blame.
  modern: My going there, O Pārtha, will not be fruitless. If our aim is not achieved, we will at least escape all blame.
udyoga-5-71-98:
  ganguli: 5 LXXII
  speaker: Yudhishthira said,
  speakerModern: 'Yudhiṣṭhira said:'
  text: Do, O Krishna, as it pleaseth thee. Blessed be thou, go then to the Kurus. I hope to behold thee return successful and prosperous.
  modern: Do as you please, O Kṛṣṇa. Blessings on you; go then to the Kurus. I hope to see you return successful and prosperous.
udyoga-5-71-101:
  ganguli: 5 LXXII
  text: Thou wilt, O Krishna, say unto Suyodhana such words as are for our benefit.
  modern: You will say to Suyodhana, O Kṛṣṇa, such words as are for our benefit.
udyoga-5-72-1:
  ganguli: 5 LXXIII
  speaker: The holy one said,
  speakerModern: 'The Blessed One said:'
  text: I have heard Sanjaya’s words and now I have heard thine. I know all about his purposes as also of thyself.
  modern: I have heard Sañjaya's words and now I have heard yours. I know his purposes, and yours as well.
udyoga-5-72-2:
  ganguli: 5 LXXIII
  text: Thy heart inclineth to righteousness, whereas their inclination is towards enmity. That which is obtained without war is of great value to thee.
  modern: Your heart inclines to righteousness, while theirs inclines to enmity. What is gained without war is of great value to you.
udyoga-5-72-38:
  ganguli: 5 LXXIII
  text: I think war with the enemy to be certain. All the omens that are noticeable by me point to that.
  modern: I think war with the enemy is certain. All the omens I see point to it.
udyoga-5-82-21:
  ganguli: 5 LXXXIII
  text: And Saurin then mounted on that car, high as the summit of the Meru, and producing a rattle, deep and loud as the sound of the kettle-drum or the clouds and which resembled the celestial car coursing at the will of the rider.
  modern: Then Śauri mounted that chariot, tall as the peak of Meru. It rumbled deep and loud like a kettledrum or thunderclouds, and it was like a celestial car that moves at the rider's will.
udyoga-5-89-4:
  ganguli: 5 LXXXIX
  text: And all the Dhartarashtras except Duryodhana, attired in excellent robes, and with Bhishma, Drona, Kripa, and others, went out to meet him.
  modern: All the Dhārtarāṣṭras except Duryodhana, in fine robes, went out to meet him, with Bhīṣma, Droṇa, Kṛpa and others.
udyoga-5-89-16:
  ganguli: 5 LXXXIX
  text: And the Vrishni hero, having approached king Dhritarashtra of great fame, worshipped him and Bhishma with proper words and without losing any time.
  modern: The Vṛṣṇi hero then approached King Dhṛtarāṣṭra of great fame and, without delay, honored him and Bhīṣma with fitting words.
udyoga-5-90-1:
  ganguli: 5 XC
  speaker: Vaisampayana said,
  speakerModern: 'Vaiśaṃpāyana said:'
  text: Janardana, the chastiser of foes, after his meeting with Vidura, went then in the afternoon to his paternal aunt, Pritha.
  modern: After meeting Vidura, Janārdana, chastiser of foes, went in the afternoon to his paternal aunt Pṛthā.
udyoga-5-90-2:
  ganguli: 5 XC
  text: And beholding Krishna whose countenance beamed with the effulgence of the radiant sun arrived at her abode, she encircled his neck with her arms and began to pour forth her lamentations remembering her sons. And at the sight, after a long time, of Govinda of Vrishni’s race, the companion of those mighty children of hers, the tears of Pritha flowed fast.
  modern: When she saw Kṛṣṇa arrive at her house, his face bright as the radiant sun, she threw her arms around his neck and began to lament, remembering her sons. After so long she saw Govinda of Vṛṣṇi's race, the companion of her mighty sons, and the tears of Pṛthā flowed fast.
udyoga-5-90-90:
  ganguli: 5 XC
  speaker: Vaisampayana continued,
  speakerModern: 'Vaiśaṃpāyana continued:'
  text: Thus addressed by her, Sauri the friend of Partha, then comforted his paternal aunt, Pritha, afflicted with grief on account of her sons. And Vasudeva said, …
  modern: Thus addressed by her, Śauri, the friend of Pārtha, comforted his paternal aunt Pṛthā, who was grieving for her sons. And Vāsudeva said, …
udyoga-5-91-1:
  ganguli: 5 XC
  speaker: Vaisampayana continued,
  speakerModern: 'Vaiśaṃpāyana continued:'
  text: Bidding her farewell and respectfully walking round her, the mighty-armed Govinda then departed for Duryodhana’s mansion.
  modern: Taking leave of her and walking respectfully around her, the mighty-armed Govinda then went to Duryodhana's mansion.
udyoga-5-91-6:
  ganguli: 5 XCI
  text: And he also beheld there Dussasana and Karna and Sakuni, the son of Suvala, seated on their respective seats by the side of Duryodhana. And on that scion of Dasarha’s race entering the court, Dhritarashtra’s son of great fame rose up from his seat with his counsellors for honouring the slayer of Madhu.
  modern: He also saw Duḥśāsana, Karṇa and Śakuni, son of Suvala, sitting in their places beside Duryodhana. When that scion of Dāśārha's race entered the court, Dhṛtarāṣṭra's famous son rose from his seat with his counselors to honor the slayer of Madhu.
udyoga-5-91-7:
  ganguli: 5 XCI
  text: And on that scion of Dasarha’s race entering the court, Dhritarashtra’s son of great fame rose up from his seat with his counsellors for honouring the slayer of Madhu. And Kesava then greeted Dhritarashtra’s sons and all his counsellors as also all the kings that were present there, according to their respective ages.
  modern: When that scion of Dāśārha's race entered the court, Dhṛtarāṣṭra's famous son rose from his seat with his counselors to honor the slayer of Madhu. Keśava then greeted Dhṛtarāṣṭra's sons, all his counselors, and all the kings present, according to their ages.
udyoga-5-91-13:
  ganguli: 5 XCI
  text: The worship being over, king Duryodhana invited him of Vrishni’s race--that foremost of victors--to eat at his house, Kesava, however did not accept the invitation. The Kuru king Duryodhana seated in the midst of the Kurus, in a gentle voice but with deception lurking behind his words, eyeing Karna, and addressing Kesava, then said, …
  modern: 'When the worship was over, King Duryodhana invited the Vṛṣṇi hero, foremost of victors, to eat at his house, but Keśava did not accept. Then Duryodhana, seated in the midst of the Kurus, spoke to Keśava in a gentle voice with deception hidden behind his words, glancing at Karṇa: …'
udyoga-5-91-26:
  ganguli: 5 XCI
  text: … One taketh another’s food when one is in distress. At present, however, O king, thou hast not inspired love in me by any act of thine, nor have I myself been plunged into distress.
  modern: … One takes another's food when one is in distress. At present, O king, you have not inspired love in me by any act of yours, nor am I in distress.
udyoga-5-91-27:
  ganguli: 5 XCI
  text: Without any reason, O king, thou hatest, from the moment of their birth, thy dear and gentle brothers,--the Pandavas--endued with every virtue. This unreasonable hatred of thine for the sons of Pritha ill becometh thee.
  modern: Without any reason, O king, you have hated the Pāṇḍavas, your dear and gentle brothers, endowed with every virtue, since the moment of their birth. This unreasonable hatred of yours for the sons of Pṛthā does not become you.
udyoga-5-91-30:
  ganguli: 5 XCI
  text: He that hateth them, hateth me; he that loveth them, loveth me. Know that the virtuous Pandavas and my own self have but a common soul.
  modern: He who hates them hates me; he who loves them loves me. Know that the virtuous Pāṇḍavas and I are one soul.
udyoga-5-91-34:
  ganguli: 5 XCI
  text: Defiled by wickedness, all this food, therefore, deserveth not to be eaten by me. The food supplied by Vidura alone, should, I think, be eaten by me.
  modern: Tainted by wickedness, all this food does not deserve to be eaten by me. I think only the food Vidura provides should be eaten by me."
udyoga-5-91-35:
  ganguli: 5 XCI
  text: Having said this unto Duryodhana who was ever incapable of bearing anything against his own wishes, Kesava of mighty arms then came out of that blazing palace of Dhritarashtra’s son.
  modern: Having said this to Duryodhana, who could never bear anything against his wishes, the mighty-armed Keśava came out of the blazing palace of Dhṛtarāṣṭra's son.
udyoga-5-91-36:
  ganguli: 5 XCI
  text: And the high-souled Vasudeva of mighty arms, coming out of that mansion, directed his steps towards the abode of the illustrious Vidura.
  modern: The high-souled, mighty-armed Vāsudeva, coming out of that mansion, walked to the house of the illustrious Vidura.
udyoga-5-91-45:
  ganguli: 5 XCI
  text: … and then with his attendants, like Vasava in the midst of the Marutas, he dined on what remained of the clean and savoury food supplied by Vidura.
  modern: … and then, with his attendants, like Vāsava among the Maruts, he ate what remained of the clean and tasty food supplied by Vidura.
udyoga-5-92-1:
  ganguli: 5 XCII
  speaker: Vaisampayana said,
  speakerModern: 'Vaiśaṃpāyana said:'
  text: After Kesava had dined and been refreshed, Vidura said unto him during the night, ‘O Kesava, this advent of thine hath not been a well judged one, …
  modern: After Keśava had dined and rested, Vidura said to him during the night, "O Keśava, this coming of yours was not well judged. …
udyoga-5-92-13:
  ganguli: 5 XCII
  text: Where, O slayer of Madhu, words, good or bad, are of the same effect, no wise man would spend his breath for nothing, like a singer before the deaf.
  modern: Where, O slayer of Madhu, good words and bad words have the same effect, no wise man would waste his breath, like a singer before the deaf.
udyoga-5-93-15:
  ganguli: 5 XCIII
  text: If while endeavouring to bring about the good (of my friends), Duryodhana judgeth me wrongly, I shall have the satisfaction of my own conscience, and a true friend is one who assumeth the functions of an intercessor when dissensions break out between kinsmen.
  modern: If, while I work for the good of my friends, Duryodhana judges me wrongly, I shall still have the satisfaction of my own conscience. And a true friend is one who steps in as an intercessor when quarrels break out between kinsmen.
udyoga-5-93-19:
  ganguli: 5 XCIII
  text: If after listening to my auspicious words, fraught with virtue and profit, the foolish Duryodhana accept them not, he will only invite his fate.
  modern: If, after hearing my auspicious words, full of virtue and profit, the foolish Duryodhana does not accept them, he will only bring on his fate.
udyoga-5-94-1:
  ganguli: 5 XCIV
  speaker: Vaisampayana said,
  speakerModern: 'Vaiśaṃpāyana said:'
  text: In such conversation between those two distinguished persons, both of whom were endued with great intelligence, that night, lit with bright stars, passed away. Indeed, the night passed away against the wishes of the illustrious Vidura, who had been listening to the varied conversation of Krishna fraught with virtue, profit, and desire, and made up of delightful words and syllables of agreeable import; and also those of Krishna himself, of ‘immeasurable prowess, listening to discourses equal in style and character.
  modern: While those two intelligent men talked in this way, the night, bright with stars, passed away. Indeed, the night passed against the wishes of the illustrious Vidura, who had been listening to Kṛṣṇa's varied conversation, full of virtue, profit and desire, made up of delightful words and agreeable meaning, and to Kṛṣṇa himself, of immeasurable prowess, listening to speeches equal in style and character.
udyoga-5-94-6:
  ganguli: 5 XCIV
  text: Madhava decked his person and began to worship the rising sun.
  modern: Mādhava dressed himself and began to worship the rising sun.
udyoga-5-94-44:
  ganguli: 5 XCIV
  text: And having reached the gate of the court, Sauri, that bull among the Satwatas, alighting from his car, that resembled the summit of Kailasa, entered the court which looked like a mass of newly-risen clouds, and blazed forth with beauty, and resembled the very abode of the great Indra.
  modern: Having reached the gate of the court, Śauri, bull among the Sātvatas, got down from his chariot, which looked like the peak of Kailāsa, and entered the court. It looked like a mass of newly risen clouds, blazing with beauty, and like the very abode of great Indra.
udyoga-5-94-48:
  ganguli: 5 XCIV
  text: Indeed, as soon as he, of Dasarha’s race, came, the illustrious blind monarch, Drona and Bhishma, all rose up from their seats.
  modern: As soon as he of Dāśārha's race came, the illustrious blind king, Droṇa and Bhīṣma all rose from their seats.
udyoga-5-94-49:
  ganguli: 5 XCIV
  text: And when that mighty ruler of men, king Dhritarashtra, rose up from his seat, those kings by thousands around him all rose up also.
  modern: When the mighty ruler of men, King Dhṛtarāṣṭra, rose from his seat, the thousands of kings around him all rose too.
udyoga-5-94-59:
  ganguli: 5 XCIV
  text: And after the Rishis, O Bharata, had taken their seats and accepted the Arghyas offered to them, Krishna took his seat, so also all the kings.
  modern: After the Rishis, O Bhārata, had taken their seats and accepted the arghya offered to them, Kṛṣṇa took his seat, and so did all the kings.
udyoga-5-94-61:
  ganguli: 5 XCIV
  text: And not far from where Krishna sat, that illustrious and wrathful pair, Karna and Duryodhana, sat together on the same seat.
  modern: Not far from where Kṛṣṇa sat, that illustrious and wrathful pair, Karṇa and Duryodhana, sat together on the same seat.
udyoga-5-94-63:
  ganguli: 5 XCIV
  text: And the high-souled Vidura sat on a begemmed seat covered with a white deer-skin that almost touched Krishna’s seat.
  modern: The high-souled Vidura sat on a jeweled seat covered with a white deerskin, almost touching Kṛṣṇa's seat.
udyoga-5-94-66:
  ganguli: 5 XCIV
  text: And after Govinda had taken his seat, a perfect silence ensued, for none present there spoke a single word.
  modern: After Govinda had taken his seat, a perfect silence fell, for no one there spoke a single word.
udyoga-5-95-1:
  ganguli: 5 XCV
  speaker: Vaisampayana said,
  speakerModern: 'Vaiśaṃpāyana said:'
  text: And after all the kings had been seated and perfect silence had ensued, Krishna possessing fine teeth and having a voice deep as that of the drum, began to speak.
  modern: When all the kings were seated and perfect silence had fallen, Kṛṣṇa, with his fine teeth and a voice deep as a drum, began to speak.
udyoga-5-95-2:
  ganguli: 5 XCV
  text: And Madhava although he addressed Dhritarashtra, spoke in a voice deep as the roll of clouds in the rainy season, making the whole assembly hear.
  modern: Though Mādhava addressed Dhṛtarāṣṭra, he spoke in a voice deep as the roll of clouds in the rainy season, so that the whole assembly heard.
udyoga-5-95-3:
  ganguli: 5 XCV
  speaker: And he said,
  speakerModern: 'He said:'
  text: In order that, O Bharata, peace may be established between the Kurus and the Pandavas without a slaughter of the heroes, I have come hither.
  modern: O Bhārata, I have come here so that peace may be made between the Kurus and the Pāṇḍavas without the slaughter of heroes.
udyoga-5-95-9:
  ganguli: 5 XCV
  text: Know, O thou of Kuru’s race, that those wicked sons of thine, headed by Duryodhana, abandoning both virtue and profit, disregarding morality, and deprived of their senses by avarice, are now acting most unrighteously towards, O bull of men, their foremost of kinsmen.
  modern: Know, O descendant of Kuru, that those wicked sons of yours, headed by Duryodhana, have abandoned both virtue and profit, disregard morality, and have lost their senses through greed. They are now acting most unrighteously toward their foremost kinsmen, O bull among men.
udyoga-5-95-11:
  ganguli: 5 XCV
  text: That terrible danger (which threatens all) hath its origin in the conduct of the Kurus. If thou becomest indifferent to it, it will then produce a universal slaughter.
  modern: That terrible danger, which threatens all, has its origin in the conduct of the Kurus. If you ignore it, it will bring universal slaughter.
udyoga-5-95-12:
  ganguli: 5 XCV
  text: If, O Bharata, thou art willing, thou mayest be able to allay that danger even yet, for, O bull of Bharata’s race, peace, I think, is not difficult of acquisition.
  modern: If you are willing, O Bhārata, you can still put an end to that danger, for peace, I think, is not hard to gain, O bull of Bharata's race.
udyoga-5-95-13:
  ganguli: 5 XCV
  text: The establishment of peace, O king, depends on thee and myself, O monarch. Set right thy sons, O thou of Kuru’s race, and I will set the Pandavas right.
  modern: The making of peace depends on you and on me, O monarch. Set your sons right, O descendant of Kuru, and I will set the Pāṇḍavas right.
udyoga-5-95-54:
  ganguli: 5 XCV
  text: Effect peace, O chief of Bharata’s race, and yield not to anger. Giving unto the Pandavas their just share of the paternal kingdom, enjoy thou then, with thy sons, O chastiser of foes, happiness and luxury, thy wishes being all crowned with success.
  modern: Make peace, O chief of Bharata's race, and do not yield to anger. Give the Pāṇḍavas their just share of the paternal kingdom, and then, with your sons, O chastiser of foes, enjoy happiness and luxury, with all your wishes fulfilled.
udyoga-5-95-60:
  ganguli: 5 XCV
  text: For the sake of virtue, of profit, of happiness, make peace, O king, and do not allow the Earth’s population to be slaughtered, …
  modern: For the sake of virtue, profit and happiness, make peace, O king, and do not let the people of the earth be slaughtered, …
udyoga-5-95-61:
  ganguli: 5 XCV
  text: … regarding evil as good and good as evil. Restrain thy sons, O monarch, who have from covetousness proceeded too far.
  modern: … taking evil for good and good for evil. Restrain your sons, O monarch, who have gone too far out of greed.
udyoga-5-95-62:
  ganguli: 5 XCV
  text: As regards the sons of Pritha, they are equally ready to wait upon thee in dutiful service or to fight. That which, O chastiser of foes, seems to thee to be for thy good, do thou adopt!
  modern: The sons of Pṛthā are equally ready to serve you dutifully or to fight. Do what seems to you best, O chastiser of foes."
udyoga-5-95-63:
  ganguli: 5 XCV
  speaker: Vaisampayana continued,
  speakerModern: 'Vaiśaṃpāyana continued:'
  text: All the rulers of earth there present highly applauded these words of Kesava within their hearts, but none of them ventured to say anything in the presence of Duryodhana.
  modern: All the rulers of the earth present silently applauded these words of Keśava in their hearts, but none of them ventured to speak in the presence of Duryodhana.
udyoga-5-124-2:
  ganguli: 5 CXXIV
  speaker: Vaisampayana continued,
  speakerModern: 'Vaiśaṃpāyana continued:'
  text: The Kuru king, having said these words unto Narada, then addressed Krishna and said, ‘Thou hast, O Kesava, told me that which leadeth to heaven, what is beneficial to the world, consistent with virtue, and fraught with reason.
  modern: The Kuru king, having said these words to Nārada, then turned to Kṛṣṇa and said, "You have told me, O Keśava, what leads to heaven, what benefits the world, what is consistent with virtue and full of reason.
udyoga-5-124-3:
  ganguli: 5 CXXIV
  text: I am not, however, O sire, independent. Duryodhana never doth what is agreeable to me.
  modern: "But I am not independent, O sire. Duryodhana never does what pleases me."
udyoga-5-124-4:
  ganguli: 5 CXXIV
  text: Do thou, therefore, O mighty-armed Krishna, O best of persons, strive to persuade that foolish and wicked son of mine, who disobeyeth my commands. …
  modern: So, O mighty-armed Kṛṣṇa, best of persons, try to persuade that foolish and wicked son of mine, who disobeys my commands. …
udyoga-5-124-6:
  ganguli: 5 CXXIV
  text: Do thou, therefore, thyself counsel that crooked, senseless, and wicked-souled prince, of evil disposition and sinful heart.
  modern: So you yourself, O Kṛṣṇa, should counsel that crooked, senseless, wicked-souled prince, of evil disposition and sinful heart.
udyoga-5-124-7:
  ganguli: 5 CXXIV
  text: By doing this, O Janardana, thou shalt have done that noble act which a friend should ever do.
  modern: By doing this, O Janārdana, you will have done the noble deed that a friend should always do."
udyoga-5-124-8:
  ganguli: 5 CXXIV
  text: Thus addressed, he of Vrishni’s race, conversant with the truths of virtue and profit, approached nearer to the ever-wrathful Duryodhana and said unto him these sweet words, …
  modern: 'Thus addressed, the Vṛṣṇi hero, who knew the truths of virtue and profit, went nearer to the ever-wrathful Duryodhana and spoke these sweet words to him: …'
udyoga-5-124-9:
  ganguli: 5 CXXIV
  text: O Duryodhana, O best of the Kurus, listen to these words of mine, uttered especially for thy good, as also, O Bharata, for that of thy followers, …
  modern: O Duryodhana, best of the Kurus, listen to these words of mine, spoken especially for your good, and for that of your followers, O Bhārata. …
udyoga-5-124-21:
  ganguli: 5 CXXIV
  text: Peace with the Pandavas, O sire, recommend itself to thy father. Let it, therefore, O chief of the Kurus recommend itself to thee also with thy counsellors.
  modern: "Peace with the Pāṇḍavas, O sire, appeals to your father. So let it appeal to you also, O chief of the Kurus, with your counselors."
udyoga-5-124-60:
  ganguli: 5 CXXIV
  text: Those mighty car-warriors, the Pandavas (if peace be made) will install thee as the Yuvaraja, and thy father Dhritarashtra, that lord of men, as the sovereign of this extensive empire.
  modern: If peace is made, those mighty chariot-warriors, the Pāṇḍavas, will install you as heir apparent and your father Dhṛtarāṣṭra, lord of men, as sovereign of this vast empire.
udyoga-5-124-61:
  ganguli: 5 CXXIV
  text: Do not, O sire, disregard the prosperity that is awaiting thee and is sure to come. Giving to the sons of Pritha half the kingdom, win thou great prosperity.
  modern: "Do not disregard, O sire, the prosperity that awaits you and is sure to come. Give half the kingdom to the sons of Pṛthā and win great prosperity."
udyoga-5-124-62:
  ganguli: 5 CXXIV
  text: Making peace with the Pandavas and acting according to the counsels of thy friends, and rejoicing with them, thou art sure to obtain what is for thy good for ever and ever.
  modern: Make peace with the Pāṇḍavas, act on your friends' counsel, and rejoice with them, and you will surely gain what is good for you forever."
udyoga-5-125-1:
  ganguli: 5 CXXV
  speaker: Vaisampayana said,
  speakerModern: 'Vaiśaṃpāyana said:'
  text: Hearing, O bull of Bharata’s race, these words of Kesava, Bhishma, the son of Santanu, then said unto vindictive Duryodhana, …
  modern: 'Hearing these words of Keśava, O bull of Bharata''s race, Bhīṣma, son of Śāntanu, said to the vindictive Duryodhana: …'
udyoga-5-125-2:
  ganguli: 5 CXXV
  text: Krishna hath spoken to thee, desirous of bringing about peace between kinsmen. O sire, follow those counsels, and do not yield to the influence of wrath.
  modern: "Kṛṣṇa has spoken to you, wishing to bring peace between kinsmen. Follow his counsel, O sire, and do not yield to anger."
udyoga-5-125-3:
  ganguli: 5 CXXV
  text: If thou dost not act, O sire, according to the words of the high-souled Kesava, neither prosperity, nor happiness nor what is for thy good, wilt thou ever have.
  modern: "If you do not act, O sire, on the words of the high-souled Keśava, you will never have prosperity, happiness, or anything that is good for you."
udyoga-5-125-8:
  ganguli: 5 CXXV
  text: Be not the exterminator of thy race, be not a wicked man, let not thy heart be sinful, do not tread the path of unrighteousness. Do not sink thy father and mother into an ocean of grief.
  modern: Do not be the destroyer of your race, do not be a wicked man, do not let your heart be sinful, do not walk the path of unrighteousness. Do not sink your father and mother in an ocean of grief."
udyoga-5-125-9:
  ganguli: 5 CXXV
  text: After Bhishma had concluded, Drona also said these words unto Duryodhana, who, filled with wrath, was then breathing heavily, …
  modern: 'When Bhīṣma had finished, Droṇa also spoke to Duryodhana, who was filled with wrath and breathing heavily: …'
udyoga-5-125-15:
  ganguli: 5 CXXV
  text: If, O Bharata, thou dost not accept the truthful words of thy friends, Krishna and Bhishma, then, O sire, thou wilt surely have to repent.
  modern: "If you do not accept the truthful words of your friends Kṛṣṇa and Bhīṣma, then, O sire, you will surely repent."
udyoga-5-125-18:
  ganguli: 5 CXXV
  speaker: Vaisampayana continued,
  speakerModern: 'Vaiśaṃpāyana continued:'
  text: After Drona had ceased, Vidura also, otherwise called Kshattri, casting his eyes on Duryodhana, said unto that vindictive son of Dhritarashtra, …
  modern: 'After Droṇa had finished, Vidura, also called Kṣattṛ, looked at Duryodhana and said to that vindictive son of Dhṛtarāṣṭra: …'
udyoga-5-125-19:
  ganguli: 5 CXXV
  text: O Duryodhana, O bull of Bharata’s race, I do not grieve for thee. I grieve, however, for this old couple, viz., Gandhari and thy father.
  modern: O Duryodhana, bull of Bharata's race, I do not grieve for you. I grieve for this aged couple, Gāndhārī and your father.
udyoga-5-125-21:
  ganguli: 5 CXXV
  text: Having begotten such a wicked son who is the exterminator of his race, alas, these two will have to wander over the earth in sorrow, subsisting on alms.
  modern: They have begotten such a wicked son, the destroyer of his race, and now, alas, these two will wander over the earth in sorrow, living on alms."
udyoga-5-125-22:
  ganguli: 5 CXXV
  text: After this, king Dhritarashtra, addressing Duryodhana, seated in the midst of his brothers and surrounded by all the kings, said, …
  modern: 'After this, King Dhṛtarāṣṭra spoke to Duryodhana, who sat among his brothers, surrounded by all the kings: …'
udyoga-5-125-27:
  ganguli: 5 CXXV
  text: If, however, thou disregardest Kesava, who from a desire of achieving what is for good, is soliciting thee to make peace, then victory will never be thine.
  modern: But if you reject Keśava, who asks you to make peace out of a wish to do what is good, then you will never have victory."
udyoga-5-127-1:
  ganguli: 5 CXXVII
  speaker: Vaisampayana said,
  speakerModern: 'Vaiśaṃpāyana said:'
  text: Hearing in that assembly of the Kurus these words that were disagreeable to him, Duryodhana replied unto the mighty-armed Kesava of great fame, saying.
  modern: 'Hearing these unwelcome words in that assembly of the Kurus, Duryodhana replied to the mighty-armed and famous Keśava:'
udyoga-5-127-3:
  ganguli: 5 CXXVII
  text: Indeed, uttering such harsh words, thou, without any reason, findest fault with me alone, addressed regardfully as thou always art by the sons of Pritha, O slayer of Madhu. But dost thou censure me, having surveyed the strength and weakness (of both sides)?
  modern: '"You speak harsh words, O slayer of Madhu, and find fault with me alone, for no reason, though the sons of Pṛthā always address you with respect. But do you blame me after weighing the strength and weakness of both sides?'
udyoga-5-127-4:
  ganguli: 5 CXXVII
  text: Indeed, thyself and Kshattri, the King, the Preceptor, and the Grandsire, all reproach me alone and not any other monarch.
  modern: You, Kṣattṛ, the king, the preceptor and the grandsire all reproach me alone and no other monarch.
udyoga-5-127-5:
  ganguli: 5 CXXVII
  text: I, however, do not find the least fault in myself. Yet all of you, including the (old) king himself, hate me.
  modern: I do not find the least fault in myself. Yet all of you, even the old king himself, hate me.
udyoga-5-127-14:
  ganguli: 5 CXXVII
  text: Let alone the Pandavas, O slayer of Madhu, the very gods are not competent to vanquish Bhishma, Kripa, Drona and Karna, in battle.
  modern: Not to speak of the Pāṇḍavas, O slayer of Madhu, even the gods cannot defeat Bhīṣma, Kṛpa, Droṇa and Karṇa in battle.
udyoga-5-127-17:
  ganguli: 5 CXXVII
  text: If, without bowing to our enemies, ours be the bed of arrows in battle, that, O Madhava, will never grieve us.
  modern: If, without bowing to our enemies, we die on a bed of arrows in battle, that, O Mādhava, will never grieve us.
udyoga-5-127-22:
  ganguli: 5 CXXVII
  text: That share in the kingdom which was formerly given them by my father shall never again, O Kesava, be obtainable by them as long as I live.
  modern: The share of the kingdom that my father formerly gave them shall never again, O Keśava, be theirs as long as I live.
udyoga-5-127-25:
  ganguli: 5 CXXVII
  text: At present, O Kesava of mighty arms, as long as I live, even that much of our land which may be covered by the point of a sharp needle shall not, O Madhava, be given by us unto the Pandavas.
  modern: As long as I live, O mighty-armed Keśava, we will not give the Pāṇḍavas even as much of our land as the point of a sharp needle can cover."
udyoga-5-128-1:
  ganguli: 5 CXXVIII
  speaker: Vaisampayana said,
  speakerModern: 'Vaiśaṃpāyana said:'
  text: Reflecting (for a moment), with eyes red in anger, he, of Dasarha’s race, addressing Duryodhana in that assembly of the Kurus, then said these words, …
  modern: 'After a moment''s reflection, with eyes red with anger, he of Dāśārha''s race spoke to Duryodhana in that assembly of the Kurus: …'
udyoga-5-128-2:
  ganguli: 5 CXXVIII
  text: Wishest thou for a bed of heroes? Verily, thou shalt have it, with thy counsellors. Wait (for a short while), a great slaughter will ensue.
  modern: Do you wish for a bed of heroes? You shall have it, with your counselors. Wait a little; a great slaughter will follow.
udyoga-5-128-18:
  ganguli: 5 CXXVIII
  text: Thou art not, O sinful man, willing to give them their paternal share in the kingdom, although they are begging it of thee. Thou shalt have to give it them, this, when divested of prosperity, thou shalt be laid low.
  modern: You are unwilling, O sinful man, to give them their paternal share of the kingdom, though they beg it of you. You will have to give it to them when you are stripped of prosperity and laid low.
udyoga-5-128-23:
  ganguli: 5 CXXVIII
  speaker: Vaisampayana continued,
  speakerModern: 'Vaiśaṃpāyana continued:'
  text: While he, of Dasarha’s race, was saying this, Dussasana addressed vindictive Duryodhana and said unto him these words in the midst of the Kurus, …
  modern: 'While he of Dāśārha''s race was speaking, Duḥśāsana said to the vindictive Duryodhana in the midst of the Kurus: …'
udyoga-5-128-26:
  ganguli: 5 CXXVIII
  speaker: Vaisampayana continued,
  speakerModern: 'Vaiśaṃpāyana continued:'
  text: Hearing these words of his brother, Dhritarashtra’s son, wicked, shameless, disobedient, disrespectful, and vain Suyodhana, breathing heavily like a great snake rose up from his seat in anger, …
  modern: Hearing his brother's words, the wicked, shameless, disobedient, disrespectful and vain Suyodhana, Dhṛtarāṣṭra's son, breathing heavily like a great snake, rose from his seat in anger. …
udyoga-5-128-29:
  ganguli: 5 CXXVIII
  text: And beholding that bull among men leave the court, his brother and all his counsellors, and all the kings, followed him.
  modern: "When they saw that bull among men leave, his brother, all his counselors and all the kings followed him."
udyoga-5-128-34:
  ganguli: 5 CXXVIII
  text: Hearing these words of Bhishma, the lotus-eyed hero of Dasarha’s race, possessed of great powers, addressing all those (that were still there) headed by Bhishma and Drona, said, ‘Even this is great transgression, of which all the elders of the Kuru race are becoming guilty, for they do not forcibly seize and bind this wicked king in the enjoyment of sovereignty.
  modern: "Hearing Bhīṣma's words, the lotus-eyed, mighty hero of Dāśārha's race spoke to all those still there, headed by Bhīṣma and Droṇa: \"This is a great transgression, of which all the elders of the Kuru race are guilty, for they do not seize by force and bind this wicked king who enjoys sovereignty."
udyoga-5-128-35:
  ganguli: 5 CXXVIII
  text: (with udyoga-5-128-34)
udyoga-5-128-51:
  ganguli: 5 CXXVIII
  text: O monarch, binding Duryodhana fast, make peace with the Pandavas. O bull among Kshatriyas, let not the whole Kshatriya race be slaughtered on thy account.
  modern: O monarch, bind Duryodhana and make peace with the Pāṇḍavas. O bull among Kṣatriyas, do not let the whole Kṣatriya race be slaughtered on your account."
udyoga-5-129-1:
  ganguli: 5 CXXIX
  speaker: Vaisampayana said,
  speakerModern: 'Vaiśaṃpāyana said:'
  text: Hearing these words of Krishna, king Dhritarashtra lost no time in addressing Vidura, who was conversant with all dictates of virtue.
  modern: Hearing these words of Kṛṣṇa, King Dhṛtarāṣṭra lost no time in speaking to Vidura, who knew all the dictates of virtue.
udyoga-5-129-2:
  ganguli: 5 CXXIX
  speaker: And the king said,
  speakerModern: 'And the king said:'
  text: Go, O child, unto Gandhari, possessed of great wisdom and foresight and bring her hither. With her I will solicit this wicked-hearted (son of mine).
  modern: '"Go, my child, to Gāndhārī, who has great wisdom and foresight, and bring her here. With her I will appeal to this wicked-hearted son of mine.'
udyoga-5-129-5:
  ganguli: 5 CXXIX
  text: … If she can pacify this wicked wretch, of evil heart, we may yet be able to act according to the words of our friend Krishna.
  modern: … If she can calm this wretch of evil heart, we may yet be able to act on the words of our friend Kṛṣṇa."
udyoga-5-129-6:
  ganguli: 5 CXXIX
  text: Hearing these words of the king, Vidura, at Dhritarashtra’s command, brought (thither) Gandhari, possessed of great foresight.
  modern: Hearing the king's words, Vidura, at Dhṛtarāṣṭra's command, brought Gāndhārī, who had great foresight.
udyoga-5-129-7:
  ganguli: 5 CXXIX
  speaker: Dhritarashtra then addressed Gandhari and said,
  speakerModern: 'Dhṛtarāṣṭra then spoke to Gāndhārī:'
  text: Behold, O Gandhari, this thy son of wicked soul, transgressing all my commands, is about to sacrifice both sovereignty and life in consequence of his lust for sovereignty.
  modern: '"Look, Gāndhārī, at this wicked-souled son of yours, who disobeys all my commands. In his lust for sovereignty he is about to lose both sovereignty and life.'
udyoga-5-129-8:
  ganguli: 5 CXXIX
  text: Of wicked soul and little understanding, he hath, like one of uncultivated mind, left the court, with his sinful counsellors, disregarding his superiors and setting at naught the words of his well-wishers.
  modern: Wicked and of little understanding, he has left the court like an uncultured man, with his sinful counselors, ignoring his superiors and disregarding the words of those who wish him well."
udyoga-5-129-10:
  ganguli: 5 CXXIX
  text: Bring hither, without loss of time, that kingdom-coveting, sick son of mine. He that is of uncultivated heart and sacrificeth both virtue and profit, doth not deserve to govern a kingdom. For all that, however, Duryodhana, who is destitute of humility hath, by every means, obtained a kingdom.
  modern: Bring here at once that kingdom-coveting, sick son of mine. A man of uncultivated heart who gives up both virtue and profit does not deserve to govern a kingdom. Even so, Duryodhana, who has no humility, has by every means obtained a kingdom.
udyoga-5-129-16:
  ganguli: 5 CXXIX
  speaker: Vaisampayana continued,
  speakerModern: 'Vaiśaṃpāyana continued:'
  text: Kshattri then, and at Dhritarashtra’s command, and of his mother’s also, once more caused vindictive Duryodhana to enter the court.
  modern: Then Kṣattṛ, at Dhṛtarāṣṭra's command and at his mother's word, brought the vindictive Duryodhana into the court once more.
udyoga-5-129-18:
  ganguli: 5 CXXIX
  text: And beholding her son, who was treading in a wrong path, enter the court, Gandhari rebuked him severely and said these words for bringing about peace.
  modern: When Gāndhārī saw her son, who was treading a wrong path, enter the court, she rebuked him severely and spoke words aimed at making peace.
udyoga-5-129-20:
  ganguli: 5 CXXIX
  text: O Duryodhana, obey thou the words of thy well-wishers, those words, viz., which that best of the Bharatas--thy father--and Bhishma, and Drona, and Kripa, and Kshattri, have spoken.
  modern: O Duryodhana, obey the words of those who wish you well, the words that your father, the best of the Bhāratas, and Bhīṣma, Droṇa, Kṛpa and Kṣattṛ have spoken.
udyoga-5-129-38:
  ganguli: 5 CXXIX
  text: Seek thou, therefore, the protection of this mighty-armed one, this one that is not worried by exertion, for if Kesava becometh gracious, both sides will be happy.
  modern: Therefore take refuge in this mighty-armed one, who is never wearied by effort, for if Keśava is gracious, both sides will be happy.
udyoga-5-129-43:
  ganguli: 5 CXXIX
  text: Give, O chastiser of foes, unto the son of Pandu what is their due. If thou wishest to enjoy, with the counsellors even half (the empire), let their share then be given unto them.
  modern: Give the sons of Pāṇḍu what is their due, O chastiser of foes. If you wish to enjoy even half the empire with your counselors, let their share be given to them.
udyoga-5-130-1:
  ganguli: 5 CXXX
  speaker: Vaisampayana said,
  speakerModern: 'Vaiśaṃpāyana said:'
  text: Disregarding these words of grave import, spoken by his mother, Duryodhana went away, in anger, from that place to the presence of wicked persons.
  modern: Disregarding these weighty words of his mother, Duryodhana went away in anger to the company of wicked men.
udyoga-5-130-6:
  ganguli: 5 CXXX
  text: And wending away from the court, the Kuru prince began to consult with Suvala’s royal son, Sakuni, most clever in dice.
  modern: Leaving the court, the Kuru prince began to consult with Śakuni, Suvala's royal son, who was most skilled at dice.
udyoga-5-130-9:
  ganguli: 5 CXXX
  text: We, however, shall forcibly seize this tiger among men, Hrishikesa, first, like Indra forcibly seizing Virochana’s son (Vali).
  modern: We shall seize this tiger among men, Hṛṣīkeśa, by force, first, as Indra seized Virocana's son, Bali."
udyoga-5-130-13:
  ganguli: 5 CXXX
  text: After those sinful men of wicked souls had come to this sinful resolution, highly intelligent Satyaki, capable of reading the heart by signs, soon came to know of it.
  modern: After those sinful men of wicked souls had reached this sinful resolve, the highly intelligent Sātyaki, who could read the heart from signs, soon came to know of it.
udyoga-5-130-21:
  ganguli: 5 CXXX
  text: Hearing these words of Satyaki, Vidura, endued with great foresight, said these words unto the mighty-armed Dhritarashtra in the midst of the Kurus, …
  modern: 'Hearing Sātyaki''s words, the far-sighted Vidura said to the mighty-armed Dhṛtarāṣṭra in the midst of the Kurus: …'
udyoga-5-130-46:
  ganguli: 5 CXXX
  text: Thus addressed by Dhritarashtra, Kshattri once more caused unwilling Duryodhana to enter the court with his brothers, and surrounded by the kings (that followed him).
  modern: Thus addressed by Dhṛtarāṣṭra, Kṣattṛ again brought the unwilling Duryodhana into the court with his brothers, and surrounded by the kings who followed him.
udyoga-5-130-47:
  ganguli: 5 CXXX
  text: King Dhritarashtra then addressed Duryodhana, surrounded by Karna and Dussasana and all those kings, saying, …
  modern: 'King Dhṛtarāṣṭra then spoke to Duryodhana, who was surrounded by Karṇa, Duḥśāsana and all those kings: …'
udyoga-5-130-50:
  ganguli: 5 CXXX
  text: Uniting with sinful allies, wishest thou to chastise this invincible and irresistible one of eyes like lotus-leaves?
  modern: "Do you really wish, together with your sinful allies, to chastise this invincible, irresistible one with eyes like lotus petals?"
udyoga-5-130-54:
  ganguli: 5 CXXX
  text: After Dhritarashtra had said these words, Vidura (casting) his eyes on Duryodhana, addressed that vindictive son of Dhritarashtra, saying, …
  modern: 'After Dhṛtarāṣṭra had spoken, Vidura looked at Duryodhana and said to that vindictive son of Dhṛtarāṣṭra: …'
udyoga-5-131-1:
  ganguli: 5 CXXXI
  speaker: Vaisampayana said,
  speakerModern: 'Vaiśaṃpāyana said:'
  text: After Vidura had said this, Kesava, that slayer of hostile divisions, endued with great energy, addressed Dhritarashtra’s son, Duryodhana, and said, ‘From delusion, O Suyodhana, thou regardest me to be alone, and it is for this, O thou of little understanding, that thou seekest to make me a captive after vanquishing me by violence.
  modern: 'After Vidura had said this, Keśava, slayer of hostile divisions, full of great energy, spoke to Duryodhana, Dhṛtarāṣṭra''s son: "In your delusion, O Suyodhana, you think I am alone, and so, O fool, you seek to defeat me by force and take me captive.'
udyoga-5-131-2:
  ganguli: 5 CXXXI
  text: (with udyoga-5-131-1)
udyoga-5-131-3:
  ganguli: 5 CXXXI
  text: Here, however, are all the Pandavas and all the Vrishnis and Andhakas. Here are all the Adityas, the Rudras, and the Vasus, with all the great Rishis.
  modern: But here are all the Pāṇḍavas and all the Vṛṣṇis and Andhakas. Here are all the Ādityas, the Rudras and the Vasus, with all the great Rishis."
udyoga-5-131-4:
  ganguli: 5 CXXXI
  text: Saying this Kesava, that slayer of hostile heroes burst out into a loud laughter. And as the high-souled Sauri laughed, from his body, that resembled a blazing fire, issued myriads of gods, each of lightning effulgence, and not bigger than the thumb.
  modern: Saying this, Keśava, slayer of hostile heroes, burst into loud laughter. As the high-souled Śauri laughed, myriads of gods, each with the brilliance of lightning and no bigger than a thumb, came out of his body, which was like a blazing fire.
udyoga-5-131-17:
  ganguli: 5 CXXXI
  text: And beholding that awful form of the high-souled Kesava, all the kings closed their eyes with affrighted hearts, except Drona, and Bhishma, and Vidura, endued with great intelligence, greatly blessed Sanjaya, and the Rishis, possessed of wealth of asceticism, for the divine Janardana gave unto them this divine sight on the occasion.
  modern: Seeing that awful form of the high-souled Keśava, all the kings closed their eyes in fear, except Droṇa, Bhīṣma, the very intelligent Vidura, the greatly blessed Sañjaya, and the Rishis rich in asceticism, for the divine Janārdana gave them divine sight on that occasion.
udyoga-5-131-19:
  ganguli: 5 CXXXI
  text: (with udyoga-5-131-17)
udyoga-5-131-32:
  ganguli: 5 CXXXI
  text: Then that tiger among men, that chastiser of foes, withdrew that divine and highly wonderful, and extremely varied and auspicious form.
  modern: Then that tiger among men, chastiser of foes, withdrew that divine, wonderful, varied and auspicious form.
udyoga-5-131-40:
  ganguli: 5 CXXXI
  text: And that chastiser of foes, Sauri, who had his car ready, was about to depart, king Dhritarashtra addressed him once more and said, …
  modern: 'As Śauri, chastiser of foes, was about to leave, with his chariot ready, King Dhṛtarāṣṭra spoke to him once more: …'
udyoga-5-131-41:
  ganguli: 5 CXXXI
  text: Thou hast seen, O Janardana, the power I wield over my sons! Thou hast, indeed, witnessed all with thy own eyes. Nothing now is unknown to thee.
  modern: You have seen the power I have over my sons, O Janārdana! You have witnessed it all with your own eyes. Nothing is now unknown to you.
udyoga-5-131-42:
  ganguli: 5 CXXXI
  text: Seeing me endeavour to bring about peace between the Kurus, and the Pandavas, in fact, knowing the state (in which I am), it behoveth thee not to entertain any suspicion regarding me.
  modern: Seeing me work to bring about peace between the Kurus and the Pāṇḍavas, and knowing the state I am in, you should not entertain any suspicion about me.
udyoga-5-131-45:
  ganguli: 5 CXXXI
  speaker: Vaisampayana continued,
  speakerModern: 'Vaiśaṃpāyana continued:'
  text: The mighty-armed Janardana then addressed Dhritarashtra, Drona, grandsire Bhishma, Kshattri, Vahlika, and Kripa and said, ‘Ye have yourselves witnessed all that hath happened in the assembly of the Kurus, viz., how wicked Duryodhana, like an uneducated wretch, left the court from anger, and how king Dhritarashtra also describeth himself to be powerless.
  modern: 'The mighty-armed Janārdana then spoke to Dhṛtarāṣṭra, Droṇa, the grandsire Bhīṣma, Kṣattṛ, Bāhlika and Kṛpa: "You have yourselves witnessed all that happened in the assembly of the Kurus: how wicked Duryodhana left the court in anger like an uneducated wretch, and how King Dhṛtarāṣṭra declares himself powerless.'
udyoga-5-131-46:
  ganguli: 5 CXXXI
  text: (with udyoga-5-131-45)
udyoga-5-131-47:
  ganguli: 5 CXXXI
  text: With the permission of you all, I shall now go back to Yudhishthira.
  modern: With the permission of you all, I shall now go back to Yudhiṣṭhira."
udyoga-5-131-50:
  ganguli: 5 CXXXI
  text: Saluting them, that bull amongst men, Sauri then mounted his car and set out. … And Kesava, on his large white car, furnished with rows of tinkling bells, proceeded then, in the very sight of the Kurus, to the abode of his paternal aunt (Kunti).
  modern: Saluting them, that bull among men, Śauri, mounted his chariot and set out. … And Keśava, on his large white chariot hung with rows of tinkling bells, went in full sight of the Kurus to the house of his paternal aunt, Kuntī.
udyoga-5-132-1:
  ganguli: 5 CXXXII
  speaker: Vaisampayana said,
  speakerModern: 'Vaiśaṃpāyana said:'
  text: Entering her abode and worshipping her feet, Kesava represented to her briefly all that had transpired in the assembly of the Kurus.
  modern: Entering her house and worshipping her feet, Keśava told her briefly all that had happened in the assembly of the Kurus.
udyoga-5-132-2:
  ganguli: 5 CXXXII
  speaker: Vasudeva said,
  speakerModern: 'Vāsudeva said:'
  text: Diverse words, worthy of being accepted and fraught with reasons, were said both by myself and the Rishis, but Duryodhana accepted them not.
  modern: Many reasoned words, worth accepting, were spoken both by me and by the Rishis, but Duryodhana did not accept them.
udyoga-5-132-3:
  ganguli: 5 CXXXII
  text: As regards Suyodhana and his followers, their hour is come. With thy leave now, I shall speedily repair unto the Pandavas.
  modern: 'Suyodhana and his followers: their hour has come. With your leave, I shall now go quickly to the Pāṇḍavas.'
udyoga-5-132-4:
  ganguli: 5 CXXXII
  text: What should I say unto the Pandavas as thy instructions to them?
  modern: What shall I say to the Pāṇḍavas as your message to them?
udyoga-5-132-5:
  ganguli: 5 CXXXII
  speaker: Kunti said,
  speakerModern: 'Kuntī said:'
  text: O Kesava, say unto king Yudhishthira of virtuous soul these words, ‘Thy virtue, O son, is decreasing greatly. Do not act vainly.
  modern: 'O Keśava, say these words to King Yudhiṣṭhira, of virtuous soul: "Your virtue, my son, is greatly decreasing. Do not act in vain.'
udyoga-5-132-33:
  ganguli: 5 CXXXII
  text: What can be a matter of greater grief than that I, deprived of friends, should live upon food supplied by others, after having brought thee forth, thou enhancer of the joys of friends?
  modern: What could be a greater grief than that I, deprived of friends, should live on food provided by others, after bearing you, you who increase your friends' joy?
udyoga-5-132-34:
  ganguli: 5 CXXXII
  text: Fight, according to the practices of kings. Do not sink thy ancestors (in infamy).
  modern: Fight according to the practices of kings. Do not sink your ancestors in infamy.
udyoga-5-137-10:
  ganguli: 5 CXXXV
  text: The fit hour hath come for exhibiting thy prowess.
  modern: The hour has come to show your prowess.
udyoga-5-137-24:
  ganguli: 5 CXXXVII
  text: Say unto them, O Janardana, that I am well. Go thou on thy auspicious way, and protect my sons!
  modern: Tell them, O Janārdana, that I am well. Go on your auspicious way, and protect my sons."
udyoga-5-137-25:
  ganguli: 5 CXXXVII
  speaker: Vaisampayana continued,
  speakerModern: 'Vaiśaṃpāyana continued:'
  text: Saluting and walking round her, the mighty-armed Krishna whose gait resembled the majestic gait of the lion, then issued out of Pritha’s abode.
  modern: Saluting her and walking around her, the mighty-armed Kṛṣṇa, whose gait was like the majestic gait of a lion, then came out of Pṛthā's house.
udyoga-5-137-26:
  ganguli: 5 CXXXVII
  text: And he then dismissed those chiefs among the Kurus with Bhishma at their head (who had followed him), and taking Karna upon his chariot, left (the Kuru city), accompanied by Satyaki.
  modern: He then dismissed those chiefs of the Kurus, headed by Bhīṣma, who had followed him, took Karṇa up on his chariot, and left the city, accompanied by Sātyaki.
udyoga-5-140-11:
  ganguli: 5 CXL
  text: Proceeding this very day with me hence, O sire, let the Pandavas know thee as a son of Kunti born before Yudhishthira.
  modern: "Come with me from here this very day, O sire, and let the Pāṇḍavas know you as a son of Kuntī, born before Yudhiṣṭhira."
udyoga-5-140-12:
  ganguli: 5 CXL
  text: The brothers, the five Pandavas, the son of Draupadi, and the invincible son of Subhadra, will all embrace thy feet.
  modern: The five Pāṇḍava brothers, the sons of Draupadī, and the invincible son of Subhadrā will all embrace your feet.
udyoga-5-140-18:
  ganguli: 5 CXL
  text: Let …and the five sons of Draupadi, and the Panchalas, and the Chedis, and myself also, install thee as the lord of the whole earth.
  modern: Let … and the five sons of Draupadī, and the Pañcālas and Cedis, and I myself, install you as lord of the whole earth.
udyoga-5-140-28:
  ganguli: 5 CXL
  text: Surrounded by the Pandavas, like the moon by the stars, rule thou the kingdom, O son of Kunti, and gladden Kunti herself.
  modern: Surrounded by the Pāṇḍavas like the moon by the stars, rule the kingdom, son of Kuntī, and gladden Kuntī herself.
udyoga-5-141-2:
  ganguli: 5 CXLI
  text: Morally, I am the son of Pandu, as also in consequence of the injunctions of the scriptures, as thou, O Krishna, thinkest.
  modern: Morally I am the son of Pāṇḍu, as the injunctions of the scriptures also say, as you think, O Kṛṣṇa.
udyoga-5-141-3:
  ganguli: 5 CXLI
  text: My mother, while a maiden, bore me in her womb, O Janardana, through her connection with Surya. And at the command of Surya himself, she abandoned me as soon as I was born.
  modern: My mother, while still a maiden, conceived me by Sūrya, O Janārdana. And at the command of Sūrya himself, she abandoned me as soon as I was born.
udyoga-5-141-4:
  ganguli: 5 CXLI
  text: Even thus, O Krishna, I came into the world. Morally, therefore, I am the son of Pandu. Kunti, however, abandoned me without thinking of my welfare.
  modern: This is how I came into the world, O Kṛṣṇa. Morally, therefore, I am the son of Pāṇḍu. But Kuntī abandoned me without thinking of my welfare.
udyoga-5-141-5:
  ganguli: 5 CXLI
  text: The Suta, Adhiratha, as soon as he beheld me, took me to his home, and from her affection for me, Radha’s breasts were filled with milk that very day, and she, O Madhava, cleansed my urine and evacuations.
  modern: The Sūta Adhiratha, as soon as he saw me, took me to his home. Out of affection for me, Rādhā's breasts filled with milk that very day, and she, O Mādhava, cleaned up my urine and filth.
udyoga-5-141-6:
  ganguli: 5 CXLI
  text: (with udyoga-5-141-5)
udyoga-5-141-8:
  ganguli: 5 CXLI
  text: So also Adhiratha of the Suta class regardeth me as a son, and I too, from affection, always regard him as (my) father.
  modern: In the same way Adhiratha of the Sūta class regards me as his son, and I, out of affection, have always regarded him as my father.
udyoga-5-141-10:
  ganguli: 5 CXLI
  text: It is that Adhiratha, again, who caused the name Vasusena to be bestowed upon me by the Brahmanas. When also I attained to youth, I married wives according to his selections.
  modern: It was Adhiratha, too, who had the Brāhmaṇas give me the name Vasuṣeṇa. And when I reached youth, I married wives of his choosing.
udyoga-5-141-11:
  ganguli: 5 CXLI
  text: Through them have been born my sons and grandsons, O Janardana. My heart also, O Krishna, and all the bonds of affection and love, are fixed on them.
  modern: By them I have sons and grandsons, O Janārdana. My heart, O Kṛṣṇa, and all the bonds of affection and love are fixed on them.
udyoga-5-141-12:
  ganguli: 5 CXLI
  text: From joy or fear, O Govinda, I cannot venture to destroy those bonds even for the sake of the whole earth or heaps of gold.
  modern: I cannot venture to break those bonds, O Govinda, whether from joy or fear, not for the whole earth or heaps of gold.
udyoga-5-141-13:
  ganguli: 5 CXLI
  text: In consequence also of my connection with Duryodhana of Dhritarashtra’s race, I have, O Krishna, enjoyed sovereignty for thirteen years, without a thorn on my side.
  modern: Through my connection with Duryodhana, in Dhṛtarāṣṭra's family, I have also, O Kṛṣṇa, enjoyed sovereignty for thirteen years, without a thorn at my side.
udyoga-5-141-15:
  ganguli: 5 CXLI
  text: Obtaining me, O Krishna, Duryodhana hath, O thou of Vrishni’s race, made this preparations for an armed encounter and provoked hostilities with the sons of Pandu.
  modern: Having gained me, O Kṛṣṇa, O you of Vṛṣṇi's race, Duryodhana has prepared for an armed encounter and provoked hostilities with the sons of Pāṇḍu.
udyoga-5-141-17:
  ganguli: 5 CXLI
  text: For the sake of death, or the ties of blood, or fear, or temptation, I cannot venture, O Janardana, to behave falsely towards the intelligent son of Dhritarashtra.
  modern: Not for death, nor for ties of blood, nor for fear, nor for temptation, O Janārdana, will I venture to act falsely toward the wise son of Dhṛtarāṣṭra.
udyoga-5-141-18:
  ganguli: 5 CXLI
  text: If I do not now engage in a single combat with Arjuna, this will, O Hrishikesa, be inglorious for both myself and Partha.
  modern: If I do not now fight a single combat with Arjuna, O Hṛṣīkeśa, it will bring disgrace on both myself and Pārtha.
udyoga-5-141-21:
  ganguli: 5 CXLI
  text: If king Yudhishthira, of virtuous soul and well-controlled senses, cometh to know me as the firstborn son of Kunti, he will never accept the kingdom.
  modern: If King Yudhiṣṭhira, of virtuous soul and controlled senses, comes to know me as the firstborn son of Kuntī, he will never accept the kingdom.
udyoga-5-141-22:
  ganguli: 5 CXLI
  text: If, again, O slayer of Madhu, this mighty and swelling empire becometh mine. I shall, O repressor of foes, certainly make it over to Duryodhana only.
  modern: And if, O slayer of Madhu, this mighty and swelling empire becomes mine, I shall, O repressor of foes, certainly hand it over to Duryodhana alone.
udyoga-5-141-23:
  ganguli: 5 CXLI
  text: Let Yudhishthira of virtuous soul become king for ever. He that hath Hrishikesa for his guide, and Dhananjaya and that mighty car-warrior Bhima for his combatants, as also Nakula and Sahadeva, and the sons of Draupadi, is fit, O Madhava, to rule over the whole earth.
  modern: Let Yudhiṣṭhira, of virtuous soul, be king forever. He has Hṛṣīkeśa for his guide, and Dhanañjaya and the mighty chariot-warrior Bhīma, as well as Nakula, Sahadeva and the sons of Draupadī, for his fighters. He is fit, O Mādhava, to rule the whole earth.
udyoga-5-141-57:
  ganguli: 5 CXLI
  text: O Kesava, bring Kunti’s son (Arjuna) before me for battle, keeping for ever this our discourse a secret, O chastiser of foes.
  modern: O Keśava, bring Kuntī's son Arjuna before me for battle, and keep this talk of ours secret forever, O chastiser of foes."
udyoga-5-143-50:
  ganguli: 5 CXLIII
  speaker: Sanjaya said,
  speakerModern: 'Sañjaya said:'
  text: Having spoken these words, Karna closely pressed Madhava to his bosom. Dismissed by Kesava, he then descended from the car.
  modern: Having spoken these words, Karṇa pressed Mādhava closely to his bosom. Dismissed by Keśava, he got down from the chariot.
udyoga-5-143-51:
  ganguli: 5 CXLIII
  text: … And riding on his own car decked with gold, Radha’s son greatly dejected, came back with us!
  modern: … And riding his own gold-decked chariot, Rādhā's son came back with us, greatly dejected.
udyoga-5-144-30:
  ganguli: 5 CXLIV
  text: Then turning behind, he behold Kunti and was filled with surprise. And saluting him in proper form and with joined palms that foremost of virtuous persons, endued with great energy and pride, viz., Vrisha, the son of Vikartana, bowed to her and said (the following words).”’
  modern: Then, turning around, he saw Kuntī and was filled with surprise. Saluting her properly with joined palms, that foremost of virtuous persons, full of great energy and pride, Vṛṣa, the son of Vikartana, bowed to her and spoke these words.
udyoga-5-145-1:
  ganguli: 5 CXLV
  speaker: Karna said,
  speakerModern: 'Karṇa said:'
  text: I am Karna, son of Radha and Adhiratha. For what, O lady, hast thou come here? Tell me what I am to do for thee?
  modern: I am Karṇa, son of Rādhā and Adhiratha. For what, O lady, have you come here? Tell me what I am to do for you.
udyoga-5-145-2:
  ganguli: 5 CXLV
  speaker: Kunti said,
  speakerModern: 'Kuntī said:'
  text: Thou art Kunti’s son, and not Radha’s. Nor is Adhiratha thy father. Thou, O Karna, art not born in the Suta order. Believe what I say.
  modern: You are Kuntī's son, not Rādhā's. Adhiratha is not your father. You, O Karṇa, were not born in the Sūta order. Believe what I say.
udyoga-5-145-3:
  ganguli: 5 CXLV
  text: Thou wert brought forth by me while a maiden. I held thee first in my womb. O son, thou wert born in the palace of Kuntiraja.
  modern: I brought you forth while I was a maiden. I carried you first in my womb. O son, you were born in the palace of Kuntirāja.
udyoga-5-145-9:
  ganguli: 5 CXLV
  text: Let the Kurus behold today the union of Karna and Arjuna. Beholding thee and thy brother united together in bonds of brotherly love, let those wicked persons bow down unto ye.
  modern: Let the Kurus see today the union of Karṇa and Arjuna. Seeing you and your brother joined in bonds of brotherly love, let those wicked men bow down to you both.
udyoga-5-146-8:
  ganguli: 5 CXLVI
  text: Thou hadst never before sought my good as a mother should. Thou addressest me today, however, desiring to do good to thyself.
  modern: You never before sought my good as a mother should. Yet today you speak to me because you want to do good for yourself.
udyoga-5-146-10:
  ganguli: 5 CXLVI
  text: If, giving out on the eve of battle that I am their brother, I go to the Pandavas, what would all the Kshatriyas say?
  modern: If I go to the Pāṇḍavas on the eve of battle, declaring that I am their brother, what will all the Kṣatriyas say?
udyoga-5-146-12:
  ganguli: 5 CXLVI
  text: Having provoked hostilities with others, they always wait on me respectfully, and always bow down to me, as the Vasus bow down to Vasava.
  modern: Having made enemies of others, they always wait on me with respect and bow down to me, as the Vasus bow to Vāsava.
udyoga-5-146-13:
  ganguli: 5 CXLVI
  text: They think that aided by my might, they are capable of encountering the foe. How can I then frustrate that cherished hope of theirs?
  modern: They think that, with my strength behind them, they can face the foe. How can I then shatter that cherished hope of theirs?
udyoga-5-146-18:
  ganguli: 5 CXLVI
  text: For the sake of Dhritarashtra’s son, I shall fight against thy sons to the best of my strength and might.
  modern: "For the sake of Dhṛtarāṣṭra's son, I shall fight against your sons with all my strength and might."
udyoga-5-146-20:
  ganguli: 5 CXLVI
  text: This thy solicitation to me will not yet be fruitless. Except Arjuna, thy other sons, Yudhishthira, Bhima, and the twins, though capable of being withstood by me in fight and capable also of being slain, shall not yet be slain by me.
  modern: "Yet this request of yours will not be fruitless after all. Except for Arjuna, your other sons, Yudhiṣṭhira, Bhīma and the twins, though I could withstand them in a fight and even kill them, I shall not kill."
udyoga-5-146-21:
  ganguli: 5 CXLVI
  text: It is with Arjuna alone, among all the combatants of Yudhishthira, that I will fight.
  modern: Among all Yudhiṣṭhira's fighters, it is with Arjuna alone that I will fight.
udyoga-5-146-23:
  ganguli: 5 CXLVI
  text: O famous lady, the number of thy sons will never be less than five. Five it will always be,--either with me, or with Arjuna, and myself slain.
  modern: 'O famous lady, the number of your sons will never be less than five. It will always be five: either with me, if Arjuna is slain, or with Arjuna, if I am slain."'
udyoga-5-146-27:
  ganguli: 5 CXLVI
  text: And having told all this, Pritha also addressed Karna, saying, ‘Blessed be thou, and let health be thine.’ And Karna replied unto her, saying, ‘Be it so!’
  modern: Having said all this, Pṛthā said to Karṇa, "Blessings on you, and health." And Karṇa answered her, "So be it!"
udyoga-5-147-1:
  ganguli: 5 CXLVII
  speaker: Vaisampayana said,
  speakerModern: 'Vaiśaṃpāyana said:'
  text: Coming back to Upaplavya from Hastinapura, that chastiser of foes, Kesava, represented unto the Pandavas all that had happened, …
  modern: Coming back to Upaplavya from Hāstinapura, Keśava, chastiser of foes, told the Pāṇḍavas all that had happened. …
udyoga-5-147-6:
  ganguli: 5 CXLVII
  speaker: Vasudeva said,
  speakerModern: 'Vāsudeva said:'
  text: Having gone to Nagapura, I addressed Dhritarashtra’s son in the assembly such words as were true, reasonable, and beneficial. That wicked minded fellow did not, however, accept them.
  modern: Having gone to Nāgapura, I spoke to Dhṛtarāṣṭra's son in the assembly with words that were true, reasonable and beneficial. That wicked-minded man did not accept them.
udyoga-5-150-18:
  ganguli: 5 CL
  text: Though addressed thus, that wicked soul do not still give you your share. I, therefore, see that chastisement, and nothing else, is now the means that should be employed against those sinful persons.
  modern: Though addressed in this way, that wicked soul still does not give you your share. I therefore see that punishment, and nothing else, is the means to use against those sinful persons.
udyoga-5-150-19:
  ganguli: 5 CL
  text: Indeed, all those kings have already marched to Kurukshetra. I have now told thee everything that had happened in the assembly of the Kurus.
  modern: All those kings have already marched to Kurukshetra. I have now told you everything that happened in the assembly of the Kurus.
udyoga-5-151-1:
  ganguli: 5 CLI
  speaker: Vaisampayana said,
  speakerModern: 'Vaiśaṃpāyana said:'
  text: Hearing these words of Janardana, king Yudhishthira the Just, of virtuous soul, addressed his brothers in the presence of Kesava and said, …
  modern: 'Hearing these words of Janārdana, King Yudhiṣṭhira the Just, of virtuous soul, spoke to his brothers in the presence of Keśava: …'
udyoga-5-151-3:
  ganguli: 5 CLI
  text: Ye, best of men, draw up, therefore, my troops now in battle-array in which they are to fight. Here are seven Akshauhinis of troops assembled for our victory.
  modern: So, best of men, draw up my troops now in the battle formation in which they are to fight. Here are seven akṣauhiṇīs of troops assembled for our victory.
udyoga-5-151-39:
  ganguli: 5 CLI
  speaker: Vaisampayana continued,
  speakerModern: 'Vaiśaṃpāyana continued:'
  text: Hearing these words of the intelligent king, Yudhishthira the Just, the lotus-eyed Krishna said, eyeing Dhananjaya, …
  modern: Hearing these words of the wise King Yudhiṣṭhira the Just, lotus-eyed Kṛṣṇa looked at Dhanañjaya, …
udyoga-5-151-69:
  ganguli: 5 CLII
  text: And entering the field, those chastisers of foes blew their conchs. And Vasudeva and Dhananjaya also blew their conchs.
  modern: Entering the field, those chastisers of foes blew their conchs. And Vāsudeva and Dhanañjaya also blew their conchs.
udyoga-5-156-1:
  ganguli: 5 CLVII
  speaker: Vaisampayana said,
  speakerModern: 'Vaiśaṃpāyana said:'
  text: Dhritarashtra’s son, accompanied by all the kings, then addressed Bhishma, son of Santanu, and with joined hands said these words, …
  modern: 'Dhṛtarāṣṭra''s son, accompanied by all the kings, then spoke to Bhīṣma, son of Śāntanu, with joined hands: …'
udyoga-5-156-15:
  ganguli: 5 CLVII
  text: … Like Agni’s son (Kumara) at the head of the gods, march thou at our head, and let us follow thee like calves following the lead of a mighty bull.
  modern: … Like Agni's son Kumāra at the head of the gods, march at our head, and let us follow you like calves following a mighty bull."
udyoga-5-156-16:
  ganguli: 5 CLVII
  speaker: Bhishma said,
  speakerModern: 'Bhīṣma said:'
  text: O mighty-armed one, it is even so, O Bharata, as thou sayest. But the Pandavas are as dear to me as ye yourselves.
  modern: O mighty-armed one, it is as you say, O Bhārata. But the Pāṇḍavas are as dear to me as you yourselves.
udyoga-5-156-21:
  ganguli: 5 CLVII
  text: The sons of Pandu, however, O king, are incapable of being exterminated by me. I shall, therefore, slay every day ten thousand warriors.
  modern: The sons of Pāṇḍu, however, O king, I cannot destroy. So I shall kill ten thousand warriors every day.
udyoga-5-156-23:
  ganguli: 5 CLVII
  text: There is another understanding on which I may willingly become the commander of thy forces. It behoveth thee to listen to that.
  modern: There is another condition on which I will willingly become the commander of your forces. You should listen to it.
udyoga-5-156-24:
  ganguli: 5 CLVII
  text: O lord of earth, either Karna should fight first, or I will fight first. The Suta’s son always boasts of his prowess in battle, comparing it with mine.
  modern: O lord of the earth, either Karṇa should fight first, or I will. The Sūta's son always boasts of his prowess in battle, comparing it with mine."
udyoga-5-156-25:
  ganguli: 5 CLVII
  speaker: Karna said,
  speakerModern: 'Karṇa said:'
  text: As long as Ganga’s son liveth, O king, I shall never fight. After Bhishma is slain, I shall fight with the wielder of Gandiva.
  modern: As long as Gaṅgā's son lives, O king, I shall never fight. After Bhīṣma is slain, I shall fight the wielder of Gāṇḍīva.
udyoga-5-195-1:
  ganguli: 5 CXCVIII
  speaker: Vaisampayana said,
  speakerModern: 'Vaiśaṃpāyana said:'
  text: Next morning, under a cloudless sky, all the kings, urged by Dhritarashtra’s son, Duryodhana,--set out against the Pandavas.
  modern: The next morning, under a cloudless sky, all the kings, urged on by Duryodhana, Dhṛtarāṣṭra's son, set out against the Pāṇḍavas.
udyoga-5-196-1:
  ganguli: 5 CXCIX
  speaker: Vaisampayana said,
  speakerModern: 'Vaiśaṃpāyana said:'
  text: Like Duryodhana, king Yudhishthira also, the son of Kunti and Dharma, ordered out, O Bharata, his heroic warriors headed by Dhrishtadyumna.
  modern: Like Duryodhana, King Yudhiṣṭhira, son of Kuntī and Dharma, also ordered out his heroic warriors, headed by Dhṛṣṭadyumna, O Bhārata.
bhisma-6-1-26:
  ganguli: 6 I
  text: … Then the Kurus, the Pandavas, and the Somakas made certain covenants, and settled the rules, O bull of Bharata’s race, regarding the different kinds of combat.
  modern: … Then the Kurus, the Pāṇḍavas and the Somakas made certain covenants, and settled the rules of combat, O bull of Bharata's race, for the different kinds of fighting.
bhisma-6-1-27:
  ganguli: 6 I
  text: Persons equally circumstanced must encounter each other, fighting fairly. And if having fought fairly the combatants withdraw (without fear of molestation), even that would be gratifying to us.
  modern: Those equally matched must meet each other, fighting fairly. And if combatants who have fought fairly withdraw, without fear of attack, that too would please us.
bhisma-6-1-28:
  ganguli: 6 I
  text: Those who engaged in contests of words should be fought against with words. Those that left the ranks should never be slain.
  modern: Those who engage in contests of words should be fought with words. Those who leave the ranks should never be slain.
bhisma-6-1-29:
  ganguli: 6 I
  text: … A car-warrior should have a car-warrior for his antagonist; he on the neck of an elephant should have a similar combatant for his foe; a horse should be met by a horse, and a foot-soldier, O Bharata; should be met by a foot-soldier.
  note: i.e., stragglers should not be slain.
  modern: … A chariot-warrior should have a chariot-warrior as his opponent; one on an elephant should face one on an elephant; a horseman should be met by a horseman, and a foot-soldier, O Bhārata, by a foot-soldier.
bhisma-6-1-31:
  ganguli: 6 I
  text: No one should strike another that is unprepared or panic-struck. One engaged with another, one seeking quarter, one retreating, one whose weapon is rendered unfit, uncased in mail, should never be struck.
  note: Literally, "confiding."
  modern: No one should strike another who is unprepared or panic-struck. One who is engaged with another, one who asks for quarter, one who retreats, one whose weapon has failed, one without armor should never be struck.
bhisma-6-21-1:
  ganguli: 6 XXI
  speaker: Sanjaya said,
  speakerModern: 'Sañjaya said:'
  text: Beholding the vast Dhartarashtra army ready for battle, king Yudhisthira, the son of Kunti, gave way to grief.
  modern: Seeing the vast Dhārtarāṣṭra army ready for battle, King Yudhiṣṭhira, son of Kuntī, gave way to grief.
bhisma-6-21-1#2:
  ganguli: 6 XXI
  text: (with bhisma-6-21-1)
bhisma-6-21-3:
  ganguli: 6 XXI
  text: … O, mighty-armed Dhananjaya, how shall we be able to fight in battle with the Dhartarashtras who have the Grandsire for their (chief) combatant?
  modern: … O mighty-armed Dhanañjaya, how can we fight in battle against the Dhārtarāṣṭras, whose chief fighter is the Grandsire?
bhisma-6-21-7:
  ganguli: 6 XXI
  text: … Hear, O king, how soldiers that are few in number may vanquish the many that are possessed of every quality.
  modern: … Hear, O king, how a few soldiers may defeat many who have every quality.
bhisma-6-21-10:
  ganguli: 6 XXI
  text: … They that are desirous of victory do not conquer by might and energy so much as by truth, compassion, righteousness and energy. Discriminating then between righteousness, and unrighteousness, and understanding what is meant by covetousness and having recourse to exertion fight without arrogance, for victory is there where righteousness is. …
  modern: … Those who want victory do not conquer so much by might and energy as by truth, compassion, righteousness and effort. Discerning between righteousness and unrighteousness, understanding what greed is, and making an effort, fight without arrogance, for victory is where righteousness is." …
bhisma-6-21-11:
  ganguli: 6 XXI
  text: (with bhisma-6-21-10)
bhisma-6-21-12:
  ganguli: 6 XXI
  text: For this know, O king, that to us victory is certain in (this) battle. Indeed, as Narada said,--There is victory where Krishna is. …
  modern: Know from this, O king, that victory is certain for us in this battle. Indeed, as Nārada said, "Victory is where Kṛṣṇa is." …
bhisma-6-21-13:
  ganguli: 6 XXI
  text: … Victory is inherent to Krishna. Indeed, it followeth Madhava. And as victory is one of its attributes, so humility is his another attribute.
  modern: … Victory is inherent in Kṛṣṇa. Indeed, it follows Mādhava. And as victory is one of his attributes, so humility is another.
bhisma-6-22-1:
  ganguli: 6 XXII
  speaker: Sanjaya said,
  speakerModern: 'Sañjaya said:'
  text: Then, O bull of Bharata’s race, king Yudhishthira, disposing his own troops in counter array against the divisions of Bhishma, urged them on, saying, …
  modern: Then, O bull of Bharata's race, King Yudhiṣṭhira, setting his own troops in counter-array against Bhīṣma's divisions, urged them on, saying, …
bhisma-6-22-3:
  ganguli: 6 XXII
  text: … In the centre (of the Pandava army) was Sikhandin and his troops, protected by Arjuna. And Dhristadyumna moved in the van, protected by Bhima.
  modern: … In the center of the Pāṇḍava army was Śikhaṇḍin with his troops, protected by Arjuna. And Dhṛṣṭadyumna moved in front, protected by Bhīma.
bhisma-6-22-9:
  ganguli: 6 XXII
  text: The car of Arjuna, furnished with a hundred bells, decked with Jamvunada gold of the best kind, endued with excellent wheels, possessed of the effulgence of fire, and unto which were yoked white steeds, looked exceedingly brilliant like a thousand suns. …
  modern: Arjuna's chariot, hung with a hundred bells, decked with the best Jāmbūnada gold, with excellent wheels, bright as fire, and drawn by white horses, looked as brilliant as a thousand suns. …
bhisma-6-22-10:
  ganguli: 6 XXII
  text: And on that ape-bannered car the reins of which were held by Kesava, stood Arjuna with Gandiva and arrows in hand--a bowman whose peer exists not on earth, nor ever will.
  modern: On that ape-bannered chariot, with its reins held by Keśava, stood Arjuna with Gāṇḍīva and arrows in hand, a bowman whose equal does not exist on earth and never will.
bhisma-6-25-26:
  ganguli: 6 XXV
  speaker: Sanjaya continued,
  speakerModern: 'Sañjaya continued:'
  text: … And there the son of Pritha beheld, standing (his) sires and grandsons, and friends, and father-in-law and well-wishers, in both the armies.
  modern: "… And there the son of Pṛthā saw standing in both armies his sires, grandsons, friends, father-in-law and well-wishers."
bhisma-6-25-27:
  ganguli: 6 XXV
  text: (with bhisma-6-25-26)
bhisma-6-25-28:
  ganguli: 6 XXV
  text: Beholding all those kinsmen standing (there), the son of Kunti, possessed by excessive pity, despondingly said (these words). “Arjuna said,--‘Beholding these kinsmen, O Krishna, assembled together and eager for the fight, …
  modern: 'Seeing all those kinsmen standing there, the son of Kuntī, overcome by excessive pity, said despondently: "Seeing these kinsmen, O Kṛṣṇa, gathered and eager to fight, …'
bhisma-6-25-29:
  ganguli: 6 XXV
  text: … my limbs, become languid, and my mouth becomes dry. My body trembles, and my hair stands on end.
  modern: … my limbs grow weak and my mouth goes dry. My body trembles, and my hair stands on end.
bhisma-6-25-30:
  ganguli: 6 XXV
  text: Gandiva slips from my hand, and my skin burns. I am unable to stand (any longer); my mind seems to wander.
  modern: Gāṇḍīva slips from my hand, and my skin burns. I cannot stand any longer; my mind seems to wander.
bhisma-6-25-32:
  ganguli: 6 XXV
  text: I do not desire victory, O Krishna, not sovereignty, nor pleasures. Of what use would sovereignty be to us, O Govinda, or enjoyments, or even life, …
  modern: I do not want victory, O Kṛṣṇa, nor sovereignty, nor pleasures. What use are sovereignty, enjoyments or even life to us, O Govinda, …
bhisma-6-25-37:
  ganguli: 6 XXV
  text: Therefore, it behoveth us not to slay the sons of Dhritarashtra who are our own kinsmen. How, O Madhava can we be happy by killing our own kinsmen?
  modern: Therefore we should not kill the sons of Dhṛtarāṣṭra, who are our own kinsmen. How, O Mādhava, can we be happy after killing our own kinsmen?
bhisma-6-25-45:
  ganguli: 6 XXV
  text: Alas, we have resolved to perpetrate a great sin, for we are ready to slay our own kinsmen from lust of the sweets of sovereignty.
  modern: Alas, we have resolved to commit a great sin, for we are ready to kill our own kinsmen out of greed for the pleasures of sovereignty.
bhisma-6-26-9:
  ganguli: 6 XXVI
  speaker: Sanjaya said,
  speakerModern: 'Sañjaya said:'
  text: Having said this unto Hrishikesa, that chastiser of foes-Gudakesa--(once more) addressed Govinda, saying,--‘I will not fight,’--and then remained silent. Unto him overcome by despondency, Hrishikesa, in the midst of the two armies, said.
  modern: 'Having said this to Hṛṣīkeśa, Guḍākeśa, chastiser of foes, spoke once more to Govinda: "I will not fight." Then he fell silent. To him, overcome by despondency, Hṛṣīkeśa spoke in the midst of the two armies.'
bhisma-6-26-10:
  ganguli: 6 XXVI
  text: (with bhisma-6-26-9)
bhisma-6-26-31:
  ganguli: 6 XXVI
  text: Casting thy eyes on the (prescribed) duties of thy order, it behoveth thee not to waver, for there is nothing else that is better for a Kshatriya than a battle fought fairly.
  modern: Look to the duties of your order. You should not waver, for there is nothing better for a Kṣatriya than a battle fought fairly.
bhisma-6-26-33:
  ganguli: 6 XXVI
  text: But if thou dost not fight such a just battle, thou shalt then incur sin by abandoning the duties of thy order and thy fame.
  modern: But if you do not fight this just battle, you will incur sin by abandoning the duties of your order and your good name.
bhisma-6-26-35:
  ganguli: 6 XXVI
  text: All great car-warriors will regard thee as abstaining from battle from fear, and thou wilt be thought lightly by those that had (hitherto) esteemed thee highly.
  modern: All the great chariot-warriors will think you stayed out of the battle from fear, and those who held you in high esteem will think lightly of you.
bhisma-6-26-37:
  ganguli: 6 XXVI
  text: Slain, thou wilt attain to heaven; or victorious, thou wilt enjoy the Earth. Therefore, arise, O son of Kunti, resolved for battle.
  modern: If slain, you will reach heaven; if victorious, you will enjoy the earth. Therefore rise, son of Kuntī, resolved to fight.
bhisma-6-26-38:
  ganguli: 6 XXVI
  text: Regarding pleasure and pain, gain and loss, victory and defeat, as equal, do battle for battle’s sake and sin will not be thine. …
  modern: Regarding pleasure and pain, gain and loss, victory and defeat as the same, fight for the sake of fighting, and you will incur no sin. …
bhisma-6-26-47:
  ganguli: 6 XXVI
  text: … Thy concern is with work only, but not with the fruit (of work). Let not the fruit be thy motive for work; nor let thy inclination be for inaction.
  modern: … Your concern is with work only, not with its fruit. Do not let the fruit be your motive for work, and do not let your inclination be toward inaction.
bhisma-6-27-5:
  ganguli: 6 XXVII
  text: No one can abide even for a moment without doing work. …
  modern: No one can remain even for a moment without doing work. …
bhisma-6-27-22:
  ganguli: 6 XXVII
  text: … There is nothing whatever for me, O Partha, to do in the three worlds, (since I have) nothing for me which hath not been acquired; still I engage in action. …
  modern: … For me, O Pārtha, there is nothing to do in the three worlds, nothing that I have not already obtained. Yet I engage in action. …
bhisma-6-27-30:
  ganguli: 6 XXVII
  text: … Devoting all work to me, with (thy) mind directed to self, engage in battle, without desire, without affection and with thy (heart’s) weakness dispelled. …
  note: Devoting all work to me, i.e., in the belief that all you do is for me or my sake.
  modern: … Giving all your work to me, with your mind fixed on the Self, fight without desire, without attachment, and with your heart's weakness dispelled. …
bhisma-6-27-35:
  ganguli: 6 XXVII
  text: … One’s own duty, even if imperfectly performed, is better than being done by other even if well performed. Death in (performance of) one’s own duty is preferable. (The adoption of) the duty of another carries fear (with it).
  modern: … One's own duty, even when imperfectly done, is better than another's duty well done. Death in the performance of one's own duty is preferable. Taking up another's duty brings fear.
bhisma-6-30-1:
  ganguli: 6 XXX
  speaker: The Holy One said,
  speakerModern: 'The Holy One said:'
  text: Regardless of fruit of action, he that performs the actions which should be performed, is a renouncer and devotee, and not one who discards the (sacrificial) fire, nor one that abstains from action. …
  note: Renouncer and devotee Sannyasin and Yogin.
  modern: He who performs the actions that should be performed, regardless of their fruit, is a renouncer and a devotee, not one who gives up the sacrificial fire or abstains from action. …
bhisma-6-35-32:
  ganguli: 6 XXXV
  speaker: The Holy One said,
  speakerModern: 'The Holy One said:'
  text: I am Death, the destroyer of the worlds, fully developed. I am now engaged in slaying the race of men. Without thee all these warriors standing in the different divisions shall cease to be.
  modern: I am Death, the destroyer of the worlds, fully grown. I am now engaged in slaying the race of men. Without you, all these warriors standing in the different divisions will cease to be.
bhisma-6-35-33:
  ganguli: 6 XXXV
  text: … Wherefore, arise, gain glory, (and) vanquishing the foe, enjoy (this) swelling kingdom. By me have all these been already slain. Be only (my) instrument.
  note: Kala here is death. Mr. Davies renders it Time, following some other translators. Pravriddha is not (as Mr. Davies renders it) "old" or "very old," but swelling or fully developed. Then again, Mr. Davies commits a ludicrous blunder in rendering Rite twam as "Except thee." This is one of those idioms at which a foreigner is sure to stumble who has only the lexicons for his guide. What Krishna says is not that all would perish save Arjuna, but that without Arjuna (i.e., even if he did not fight) all would perish.
  modern: … So rise, gain glory, defeat the foe, and enjoy a prosperous kingdom. I have already slain all these. Be only my instrument.
bhisma-6-42-58:
  ganguli: 6 XLII
  text: Fixing thy thoughts on Me, thou wilt surmount all difficulties through my grace. But if from self-conceit thou wilt not listen, thou wilt (then) utterly perish.
  modern: Fixing your thoughts on me, you will cross all difficulties by my grace. But if, from self-conceit, you will not listen, you will utterly perish.
bhisma-6-42-59:
  ganguli: 6 XLII
  text: If, having recourse to self-conceit, thou thinkest--I will not fight,--that resolution of thine would be vain, (for) Nature will constrain thee.
  modern: If, relying on self-conceit, you think "I will not fight," that resolution of yours is vain, for nature will compel you.
bhisma-6-42-60:
  ganguli: 6 XLII
  text: That which, from delusion, thou dost not wish to do, thou wilt do involuntarily, bound by thy own duty springing from (thy own) nature.
  modern: What you do not wish to do out of delusion, you will do against your will, bound by your own duty, which springs from your own nature.
bhisma-6-42-61:
  ganguli: 6 XLII
  text: The Lord, O Arjuna, dwelleth in the region of the heart of beings, turning all beings as if mounted on a machine, by his illusive power.
  modern: The Lord, O Arjuna, dwells in the region of the heart of all beings, turning all beings, as if mounted on a machine, by his power of illusion.
bhisma-6-42-62:
  ganguli: 6 XLII
  text: Seek shelter with Him in every way, O Bharata. Through his grace thou wilt obtain supreme tranquillity, the eternal seat.
  modern: Take shelter with him in every way, O Bhārata. By his grace you will gain supreme tranquillity, the eternal abode.
bhisma-6-42-66:
  ganguli: 6 XLII
  text: Forsaking all (religious) duties, come to Me as thy sole refuge. I will deliver thee from all sins. Do not grieve.
  modern: Give up all duties and come to me as your only refuge. I will free you from all sins. Do not grieve.
bhisma-6-42-73:
  ganguli: 6 XLII
  speaker: Arjuna said,
  speakerModern: 'Arjuna said:'
  text: My delusion hath been destroyed, and the recollection (of what I am) hath been gained by me, O Undeteriorating one, through thy favour. I am now firm. My doubts have been dispelled. I will do thy bidding.
  modern: My delusion has been destroyed, and by your favor, O unfailing one, I have regained the memory of what I am. I am now steady. My doubts are gone. I will do your bidding.
bhisma-6-43-6:
  ganguli: 6 XLIII
  speaker: Sanjaya said,
  speakerModern: 'Sañjaya said:'
  text: Beholding Dhananjaya then to take up once again (his) arrows and Gandiva, the mighty car-warriors (of the Pandava party) uttered a tremendous shout.
  modern: Seeing Dhanañjaya take up his arrows and Gāṇḍīva again, the mighty chariot-warriors of the Pāṇḍava side raised a tremendous shout.
bhisma-6-43-13:
  ganguli: 6 XLIII
  text: Then, O king, beholding the two armies, that looked like two oceans, ready for the encounter and continuously moving, the heroic king Yudhishthira, the Just, putting off his coat of mail and casting aside his excellent weapon and quickly descending from his car, with joined hands, proceeded on foot, …
  modern: Then, O king, seeing the two armies, like two oceans, ready for the encounter and continually moving, the heroic King Yudhiṣṭhira the Just took off his coat of mail, put aside his excellent weapon, got quickly down from his chariot, and walked on foot with joined hands, …
bhisma-6-43-14:
  ganguli: 6 XLIII
  text: (with bhisma-6-43-13)
bhisma-6-43-37:
  ganguli: 6 XLIII
  text: The king (meanwhile), penetrating the hostile array bristling with arrows and darts, proceeded quickly towards Bhishma, surrounded by his brothers.
  modern: Meanwhile the king, breaking through the hostile array bristling with arrows and darts, went quickly toward Bhīṣma, surrounded by his brothers.
bhisma-6-43-38:
  ganguli: 6 XLIII
  text: Seizing his feet with his two hands, the royal son of Pandu then said unto Santanu’s son Bhishma who was there ready for battle, (these words).
  modern: Seizing his feet with both hands, the royal son of Pāṇḍu spoke to Bhīṣma, Śāntanu's son, who stood ready for battle.
bhisma-6-43-39:
  ganguli: 6 XLIII
  speaker: Yudhishthira said,
  speakerModern: 'Yudhiṣṭhira said:'
  text: I salute thee, O invincible one. With thee we will do battle. Grant (us) thy permission in that matter. Give (us) also (thy) blessing.
  modern: I salute you, O invincible one. We will fight with you. Give us your permission for it, and give us your blessing too.
bhisma-6-43-41:
  ganguli: 6 XLIII
  text: I am gratified (with thee), O son. Do battle, and obtain victory, O son of Pandu, What else may be desired by thee, obtain thou in battle.
  modern: I am pleased with you, my son. Fight, and win, son of Pāṇḍu. Whatever else you want, win it in battle.
bhisma-6-43-52:
  ganguli: 6 XLIII
  text: And that mighty-armed one then proceeded towards the car of the preceptor ( Drona) through the midst of all the soldiers who were eyeing him, accompanied by his brothers.
  modern: That mighty-armed one then went toward the chariot of the preceptor Droṇa, through the midst of all the soldiers who watched him, with his brothers.
bhisma-6-43-53:
  ganguli: 6 XLIII
  text: Then saluting Drona and walking round him, the king spoke to that invincible warrior words that were for his own benefit.
  modern: Then, saluting Droṇa and walking around him, the king spoke to that invincible warrior words for his own good.
bhisma-6-43-54:
  ganguli: 6 XLIII
  speaker: Yudhishthira said,
  speakerModern: 'Yudhiṣṭhira said:'
  text: I ask thee, O invincible one, how I may fight without incurring sin, and how, with thy permission, O regenerate one, I may vanquish all my foes?
  modern: I ask you, O invincible one, how I may fight without incurring sin, and how, with your permission, O twice-born, I may defeat all my foes?
bhisma-6-43-61:
  ganguli: 6 XLIII
  speaker: Drona said,
  speakerModern: 'Droṇa said:'
  text: Victory, O king, is certain for thee that hast Hari for thy counsellor. I (also) grant thee that thou wilt vanquish thy foes in battle.
  modern: Victory is certain for you, O king, since Hari is your counselor. I also grant that you will defeat your foes in battle.
bhisma-6-43-62:
  ganguli: 6 XLIII
  text: Thither where righteousness is, thither is Krishna, and thither where Krishna is, thither is victory. Go, fight, O son of Kunti! Ask me, what shall I say unto thee?
  modern: Where righteousness is, there is Kṛṣṇa, and where Kṛṣṇa is, there is victory. Go and fight, son of Kuntī! Ask me, what shall I say to you?
bhisma-6-43-69:
  ganguli: 6 XLIII
  speaker: Sanjaya continued,
  speakerModern: 'Sañjaya continued:'
  text: Hearing these words, O king, of the wise son of Bharadwaja, and honouring the preceptor, (Yudhishthira then) proceeded towards the son of Saradwat.
  modern: Hearing these words of the wise son of Bharadvāja, and honoring the preceptor, Yudhiṣṭhira then went toward the son of Śaradvat.
bhisma-6-43-76:
  ganguli: 6 XLIII
  text: Understanding, however, what he intended to say, Gautama (Kripa) replied to him, saying,--I am incapable of being slain, O king. Fight, and obtain victory.
  modern: Understanding what Yudhiṣṭhira meant to say, Gautama (Kṛpa) replied, "I cannot be slain, O king. Fight, and win."
  speaker: Sanjaya continued,
  speakerModern: 'Sañjaya continued:'
bhisma-6-43-90:
  ganguli: 6 XLIII
  speaker: Sanjaya continued,
  speakerModern: 'Sañjaya continued:'
  text: Having obtained the permission of his maternal uncle, the ruler of the Madra, the son of Kunti, surrounded by his brothers, came out of that vast army.
  modern: Having obtained the permission of his maternal uncle, the ruler of the Madras, the son of Kuntī, surrounded by his brothers, came out of that vast army.
bhisma-6-43-91:
  ganguli: 6 XLIII
  text: Vasudeva then went to Radha’s son on the field of battle.
  modern: Vāsudeva then went to Rādhā's son on the field of battle.
bhisma-6-43-92:
  ganguli: 6 XLIII
  text: And the elder brother of Gada, for the sake of the Pandavas, then said to Karna,--It hath been heard by me, O Karna, that from hatred of Bhishma thou wilt not fight. Come to our side, O son of Radha, and (stay with us) as long as Bhishma is not slain.
  modern: 'And the elder brother of Gada, for the sake of the Pāṇḍavas, said to Karṇa: "I have heard, O Karṇa, that out of hatred of Bhīṣma you will not fight. Come over to our side, O son of Rādhā, and stay with us as long as Bhīṣma is not slain.'
bhisma-6-43-94:
  ganguli: 6 XLIII
  speaker: Karna said,
  speakerModern: 'Karṇa said:'
  text: I will not do anything that is disagreeable to Dhritarashtra’s son, O Kesava. Devoted to Duryodhana’s good, know that I have cast off my life (for him). …
  modern: I will not do anything that Dhṛtarāṣṭra's son would dislike, O Keśava. Devoted to Duryodhana's good, know that I have given up my life for him." …
bhisma-6-43-96:
  ganguli: 6 XLIII
  text: Then amid all the warriors the eldest son of Pandu, loudly exclaimed,--He who will choose us, him we shall choose for our ally! …
  modern: Then, in the midst of all the warriors, the eldest son of Pāṇḍu called out loudly, "Whoever chooses us, we shall choose him as our ally!" …
bhisma-6-43-102:
  ganguli: 6 XLIII
  speaker: Sanjaya continued,
  speakerModern: 'Sañjaya continued:'
  text: Yuvutsu then, abandoning the Kurus thy sons, went over to the army of the Pandavas, with beat of drums and cymbals.
  modern: Yuyutsu then left the Kurus, your sons, and went over to the army of the Pāṇḍavas, to the beating of drums and cymbals.
bhisma-6-45-8:
  ganguli: 6 XLV
  text: And Santanu’s son himself, taking up a terrible bow that resembled the rod of Death, rushed, O king, on the field of battle, against Dhananjaya.
  modern: And Śāntanu's son himself, taking up a terrible bow like the rod of Death, rushed on the battlefield against Dhanañjaya, O king.
bhisma-6-45-9:
  ganguli: 6 XLV
  text: And Arjuna also, endued with great energy, taking up the bow Gandiva celebrated overall the world, rushed, on the field of battle, against Ganga’s son.
  modern: And Arjuna, full of great energy, took up the bow Gāṇḍīva, famed throughout the world, and rushed on the battlefield against Gaṅgā's son.
bhisma-6-59-6:
  ganguli: 6 LIX
  text: Then, O Bharata, in consequence of thy sinful policy, commenced a dreadful battle, making the hair stand on end, between ourselves and the Pandavas.
  modern: Then, O Bhārata, because of your sinful policy, a dreadful battle began between us and the Pāṇḍavas, making the hair stand on end.
bhisma-6-59-20:
  ganguli: 6 LIX
  text: And in that combat Bhishma, the son of Santanu, with bow incessantly drawn to a circle, shot shafts of blazing points, resembling snakes of virulent poison.
  modern: In that combat Bhīṣma, Śāntanu's son, with his bow always drawn to a circle, shot arrows with blazing points, like snakes of virulent poison.
bhisma-6-59-22:
  ganguli: 6 LIX
  text: And displaying his extreme lightness of hands, and dancing (as it were) along the track of his car, he seemed, O king, to be present everywhere like a circle of fire.
  modern: "Showing his extreme lightness of hand, and dancing, as it were, along the track of his chariot, he seemed, O king, to be everywhere at once, like a circle of fire."
bhisma-6-59-60:
  ganguli: 6 LIX
  text: Vasudeva, however, endued with great might fearlessly and summoning all his patience, began to guide those steeds mangled by Bhishma’s shafts.
  modern: Vāsudeva, though, full of great might, fearlessly gathered all his patience and went on guiding the horses, which were mangled by Bhīṣma's arrows.
bhisma-6-59-61:
  ganguli: 6 LIX
  text: Then, O sire, Bhishma with great strength pierced both Vasudeva and Dhananjaya with keen shafts all over their bodies.
  modern: Then, O sire, Bhīṣma, with great strength, pierced both Vāsudeva and Dhanañjaya with keen arrows all over their bodies.
bhisma-6-59-65:
  ganguli: 6 LIX
  text: Then the mighty-armed Krishna, beholding the prowess of Bhishma in battle as also the mildness with which Arjuna fought, …
  modern: Then the mighty-armed Kṛṣṇa saw Bhīṣma's prowess in battle, and saw how gently Arjuna fought. …
bhisma-6-59-71:
  ganguli: 6 LIX
  text: And the Kauravas also beholding the Somakas routed, are rushing to battle cheerfully, gladdening the grandsire. Accoutred in mail, even I will stay Bhishma to-day for the sake of the Pandavas.
  modern: And the Kauravas, seeing the Somakas routed, are rushing cheerfully to battle, gladdening the grandsire. Armored, I myself will stop Bhīṣma today for the sake of the Pāṇḍavas.
bhisma-6-59-91:
  ganguli: 6 LIX
  text: Saying this, Vasudeva’s son, abandoning (the reins of) the steeds, jumped down from the car, whirling with his (right) arm his discus of beautiful nave with edge sharp as a razor, effulgent as the sun and possessed of force equal to that of a thousand bolts of heaven. And making the earth tremble under his tread, the high-souled Krishna rushed impetuously towards Bhishma.
  modern: Saying this, Vāsudeva's son abandoned the reins of the horses and jumped down from the chariot, whirling with his right arm his discus of beautiful hub and razor-sharp edge, bright as the sun, with the force of a thousand thunderbolts. Making the earth tremble under his tread, the high-souled Kṛṣṇa rushed furiously toward Bhīṣma.
bhisma-6-59-95:
  ganguli: 6 LIX
  text: And beholding that foremost of bipeds, that divine personage, advancing armed with the discus, Santanu’s son stationed on his car, bow and arrow in hand, fearlessly said, …
  modern: 'Seeing that foremost of bipeds, that divine person, advancing with the discus in his hand, Śāntanu''s son, standing on his chariot with bow and arrow in hand, said fearlessly: …'
bhisma-6-59-96:
  ganguli: 6 LIX
  text: Come, Come, O Lord of the gods, O thou that hast the universe for thy abode. I bow to thee, O thou that art armed with mace, sword and Saranga. O lord of the universe, forcibly throw me down from this excellent car, O thou that art the refuge of all creatures in this battle.
  modern: Come, come, O Lord of the gods, you who have the universe for your dwelling. I bow to you, who bear the mace, sword and Śārṅga bow. O lord of the universe, throw me down by force from this excellent chariot, you who are the refuge of all creatures in this battle.
bhisma-6-59-97:
  ganguli: 6 LIX
  text: Slain here by thee, O Krishna, great will be my good fortune both in this world and the next. Great is the respect thou payest me, O Lord of the Vrishnis and the Andhakas. My dignity will be celebrated in the three worlds.
  modern: Slain by you here, O Kṛṣṇa, I will have great good fortune in this world and the next. You do me great honor, O Lord of the Vṛṣṇis and Andhakas. My dignity will be celebrated in the three worlds."
bhisma-6-59-98:
  ganguli: 6 LIX
  text: Meanwhile, jumping down from his car, Partha, himself of massive and long arms, quickly ran on foot after that chief of Yadu’s race possessed of massive and long arms, and seized him by his two hands.
  modern: "Meanwhile Pārtha, of massive long arms, jumped down from his chariot, quickly ran on foot after that chief of Yadu's race, who also had massive long arms, and seized him by both hands."
bhisma-6-59-100:
  ganguli: 6 LIX
  text: The high-souled Partha, however, seizing them with great force his legs as he was proceeding at a quick pace towards Bhishma, succeeded, O king, in stopping him with difficulty at the tenth step.
  modern: The high-souled Pārtha, though, seized his legs with great force as he was hurrying toward Bhīṣma, and managed, O king, to stop him with difficulty at the tenth step.
bhisma-6-59-101:
  ganguli: 6 LIX
  text: And when Krishna stopped, decked as he was with a beautiful garland of gold, cheerfully bowed down to him and said, ‘Quell this wrath of thine. Thou art the refuge of the Pandavas, O Kesava.
  modern: When Kṛṣṇa, decked with a beautiful garland of gold, had stopped, Arjuna bowed to him cheerfully and said, "Quell this wrath of yours. You are the refuge of the Pāṇḍavas, O Keśava.
bhisma-6-59-103:
  ganguli: 6 LIX
  text: Hearing that promise and oath of his, Janardana became gratified. And ever engaged as he was in doing what was agreeable to Arjuna--that best of the Kurus.--he once more, discus on arm, mounted on his car. …
  modern: Hearing that promise and oath, Janārdana was gratified. Always doing what pleased Arjuna, that best of the Kurus, he mounted his chariot once more with the discus on his arm. …
bhisma-6-109-34:
  ganguli: 6 CX
  text: Indeed, O king, on that tenth day of the battle, Bhishma, displaying his might, slew, O son of Kuru’s race, hundreds of thousands.
  modern: Indeed, O king, on that tenth day of the battle, Bhīṣma, showing his might, killed hundreds of thousands, O son of Kuru's race.
bhisma-6-109-37:
  ganguli: 6 CX
  text: Having slain … full two hundred thousands of foot-soldiers, that best of men, viz., Bhishma, shone resplendent in battle like a fire without a curl of smoke.
  modern: Having killed … fully two hundred thousand foot-soldiers, O king, that best of men, Bhīṣma, shone in battle like a fire without a wisp of smoke.
bhisma-6-116-62:
  ganguli: 6 CXV
  text: Then all the Parthas with Yudhishthira at their head, placing Sikhandin in the van, and uniting with the Srinjayas, fought with Bhishma in battle.
  modern: Then all the Pārthas, with Yudhiṣṭhira at their head, putting Śikhaṇḍin in front and joining the Sṛñjayas, fought Bhīṣma in battle.
bhisma-6-117-1:
  ganguli: 6 CXVIII
  speaker: Sanjaya said,
  speakerModern: 'Sañjaya said:'
  text: Sikhandin, O bull among men, approaching Bhishma in battle, struck him in the centre of the chest with ten broad-headed arrows The son of Ganga, however, O Bharata, only looked at Sikhandin with wrath and as if consuming the Panchala prince with that look.
  modern: Śikhaṇḍin, O bull among men, approached Bhīṣma in battle and struck him in the middle of the chest with ten broad-headed arrows. The son of Gaṅgā, O Bhārata, only looked at Śikhaṇḍin with wrath, as if consuming the Pañcāla prince with that look.
bhisma-6-117-2:
  ganguli: 6 CXVIII
  text: (with bhisma-6-117-1)
bhisma-6-117-3:
  ganguli: 6 CXVIII
  text: Remembering his femininity, O king, Bhishma, in the very sight of all, struck him not. Sikhandin, however, understood it not.
  modern: Remembering that Śikhaṇḍin had been a woman, O king, Bhīṣma did not strike him, in full view of everyone. Śikhaṇḍin, however, did not understand this.
bhisma-6-119-45:
  ganguli: 6 CXX
  text: The Kuru grandsire Bhishma, however, though struck by him in battle, thus, trembled not, O monarch, but remained unmoved like a mountain during an earthquake. Then Vibhatsu, drawing his bow Gandiva with a laugh, …
  modern: The Kuru grandsire Bhīṣma, though struck by him in battle, did not tremble, O monarch, but stood unmoved like a mountain in an earthquake. Then Vibhatsu drew his bow Gāṇḍīva with a laugh …
bhisma-6-119-49:
  ganguli: 6 CXX
  text: And as regards the arrows shot by those warriors, Bhishma, possessed of prowess in battle that was incapable of being baffled, equally checked them all with his own straight arrows. Those arrows, however, endued with wings of gold and whetted on stone, which the mighty car-warrior Sikhandin shot in that battle, scarcely caused Bhishma any pain.
  modern: Bhīṣma, whose prowess in battle could not be thwarted, stopped all the arrows those warriors shot with his own straight arrows. But the gold-winged, stone-sharpened arrows that the mighty chariot-warrior Śikhaṇḍin shot in that battle scarcely hurt Bhīṣma at all.
bhisma-6-119-60:
  ganguli: 6 CXX
  text: Then Bhishma, deeply and excessively pierced by the wielder of Gandiva with keen-pointed shafts, once more addressed Dussasana with a smile and said, …
  modern: 'Then Bhīṣma, deeply pierced by the wielder of Gāṇḍīva with keen-pointed arrows, spoke to Duḥśāsana again with a smile: …'
bhisma-6-119-66:
  ganguli: 6 CXX
  text: These are not Sikhandin’s. Cutting me to the quick, piercing through even my hard coat of mail, and striking me with the force of mushalas, these arrows are not Sikhandin’s.
  modern: These are not Śikhaṇḍin's. They cut me to the quick, pierce even my hard coat of mail, and strike me with the force of clubs. These arrows are not Śikhaṇḍin's.
bhisma-6-119-89:
  ganguli: 6 CXX
  text: Having slain in that battle, O monarch, (his foes) by hundreds and thousands, there was not in Bhishma’s body space of even two fingers’ breadth that was not pierced with arrows.
  modern: Having killed his foes in that battle by hundreds and thousands, O monarch, Bhīṣma had no space on his body, not even two fingers' breadth, that was not pierced with arrows.
bhisma-6-119-90:
  ganguli: 6 CXX
  text: Thus was thy sire mangled with arrows of keen points by Phalguni in that battle. And then he fell down from his car with his head to the east, a little before sunset, in the very sight of thy sons.
  modern: Thus your sire was mangled in that battle by Phalguna's keen-pointed arrows. And then, a little before sunset, he fell from his chariot with his head to the east, in full view of your sons.
bhisma-6-119-93:
  ganguli: 6 CXX
  text: … And beholding the high-souled grandsire falling down (from his car), the hearts of all of us fell with him.
  modern: … And seeing the high-souled grandsire fall from his chariot, the hearts of all of us fell with him.
bhisma-6-119-94:
  ganguli: 6 CXX
  text: That foremost of all bowmen, that mighty-armed hero, fell down, like an uprooted standard of Indra, making the earth tremble the while. Pierced all over with arrows, his body touched not the ground.
  modern: That foremost of bowmen, that mighty-armed hero, fell like an uprooted banner of Indra, making the earth tremble. Pierced all over with arrows, his body did not touch the ground.
bhisma-6-119-95:
  ganguli: 6 CXX
  text: At that moment, O bull of Bharata’s race, a divine nature took possession of that great bowman lying on a bed of arrows.
  modern: At that moment, O bull of Bharata's race, a divine state took possession of that great bowman lying on his bed of arrows.
bhisma-6-120-30:
  ganguli: 6 CXXI
  text: Desisting from the fight, thousands of (other) warriors then, proceeded towards the high-souled Bhishma like the celestials towards the Lord of all creatures.
  modern: Leaving the fight, thousands of warriors went to the high-souled Bhīṣma, like the celestials going to the Lord of all creatures.
bhisma-6-120-32:
  ganguli: 6 CXXI
  text: Approaching Bhishma who was then, O bull of Bharata’s race, lying (on his bed of arrows), the Pandavas and the Kurus stood there, having offered him their salutations. Then Santanu’s son Bhishma of righteous soul addressed the Pandavas and the Kurus who having reverenced him thus, stood before him.
  modern: Approaching Bhīṣma, O bull of Bharata's race, as he lay on his bed of arrows, the Pāṇḍavas and the Kurus stood there, having saluted him. Then Bhīṣma, Śāntanu's son, of righteous soul, spoke to the Pāṇḍavas and the Kurus who stood before him in reverence.
bhisma-6-120-34:
  ganguli: 6 CXXI
  text: Gratified am I with your sight, ye that are the equals of the very gods.--Thus addressing them with his head hanging down, he once more said,--‘My head is hanging down greatly. Let a pillow be given to me!
  modern: '"I am pleased to see you, who are equal to the very gods." Speaking to them in this way with his head hanging down, he said again, "My head is hanging down greatly. Let a pillow be given to me!"'
bhisma-6-120-35:
  ganguli: 6 CXXI
  text: … The kings (standing there) then fetched many excellent pillows that were very soft and made of very delicate fabrics. The grandsire, however, desired them not.
  modern: … The kings standing there then fetched many excellent pillows, very soft and made of very delicate fabrics. But the grandsire did not want them.
bhisma-6-120-36:
  ganguli: 6 CXXI
  text: That tiger among men then said unto those kings with a laugh,--These, ye kings, do not become a hero’s bed. …
  modern: That tiger among men said to the kings with a laugh, "These, O kings, are not fit for a hero's bed." …
bhisma-6-120-38:
  ganguli: 6 CXXII
  text: O Dhananjaya, O thou of mighty arms, my head hangeth down, O sire! Give me a pillow such as thou regardest to be fit!
  modern: "O Dhanañjaya, mighty-armed one, my head is hanging down, O sire! Give me a pillow that you think fit."
bhisma-6-120-45:
  ganguli: 6 CXXII
  text: Taking up Gandiva and a number of straight shafts, and inspiring them with mantras, and obtaining the permission of that illustrious and mighty car-warrior of Bharata’s race, Arjuna then, with three keen shafts endued with great force, supported Bhishma’s head.
  modern: Taking up Gāṇḍīva and a number of straight arrows, inspiring them with mantras, and getting the permission of that illustrious, mighty chariot-warrior of Bharata's race, Arjuna then supported Bhīṣma's head with three keen arrows of great force.
bhisma-6-120-46:
  ganguli: 6 CXXII
  text: Then that chief of the Bharatas, viz., Bhishma of virtuous soul, conversant with the truths of religion, seeing that Arjuna, having divined his thought, had achieved that feat, became highly gratified. And after that pillow had thus been given to him, he applauded Dhananjaya.
  modern: Then that chief of the Bhāratas, Bhīṣma, of virtuous soul, who knew the truths of religion, saw that Arjuna had divined his thought and carried it out, and was highly gratified. After the pillow had been given to him, he praised Dhanañjaya.
bhisma-6-120-51:
  ganguli: 6 CXXII
  text: I will sleep on this bed till the Sun turneth to the northern solstice!
  modern: I will sleep on this bed till the sun turns to the northern solstice.
bhisma-6-120-52:
  ganguli: 6 CXXII
  text: Those king that will then come to me will behold me (yield up my life)! When the Sun on his car of great speed and unto which are yoked seven steeds, will proceed towards the direction occupied by Vaisravana, verily, even then, will I yield up my life like a dear friend dismissing a dear friend!
  modern: The kings who come to me then will see me give up my life. When the sun, on his swift chariot yoked with seven horses, goes toward the direction of Vaiśravaṇa, even then I will give up my life, like a dear friend taking leave of a dear friend.
bhisma-6-121-18:
  ganguli: 6 CXXIII
  text: … Beholding then that son of Pandu, O monarch, thus standing before him after having offered him respectful salutations, Bhishma of righteous soul cheerfully addressed Dhananjaya, saying, …
  modern: '… Seeing the son of Pāṇḍu standing before him after offering respectful salutations, Bhīṣma of righteous soul spoke cheerfully to Dhanañjaya: …'
bhisma-6-121-20:
  ganguli: 6 CXXIII
  text: All the vital parts of my body are in agony. My mouth is dry. Staying as I am with body afflicted with agony, give me water, O Arjuna! Thou art a great bowman! Thou art capable of giving me water duly! …
  modern: All the vital parts of my body are in agony. My mouth is dry. Give me water, O Arjuna, for my body is afflicted with agony. You are a great bowman. You are able to give me water properly." …
bhisma-6-121-24:
  ganguli: 6 CXXIII
  text: Aiming then a blazing arrow, after having inspired it with Mantras and identified it with the Parjanya weapon, in the very sight of the entire army, …
  modern: Then Pārtha, the son of Pāṇḍu, aimed a blazing arrow, inspired it with mantras and joined it to the Parjanya weapon. In full view of the entire army, …
bhisma-6-121-25:
  ganguli: 6 CXXIII
  text: … the son of Pandu, viz., Partha, pierced the Earth a little to the south of where Bhishma lay. Then there arose a jet of water that was pure, and auspicious, and cool, and that resembling the nectar itself, was of celestial scent and taste.
  modern: … he pierced the earth a little to the south of where Bhīṣma lay. A jet of water rose up, pure, auspicious and cool, like nectar itself, with a celestial scent and taste.
bhisma-6-121-30:
  ganguli: 6 CXXIII
  text: And loud was the blare of conchs and the beat of drums that were then heard all over the field.
  modern: Loud was the blare of conches and the beat of drums that was then heard all over the field.
bhisma-6-121-31:
  ganguli: 6 CXXIII
  text: And Santanu’s son, his thirst quenched, then addressed Jishnu, O monarch, and said, applauding him highly in the presence of all those kings, these words, viz.,--O thou of mighty arms, this is not wonderful in thee, O son of Kuru’s race!
  modern: 'And Śāntanu''s son, his thirst quenched, spoke to Jiṣṇu, O monarch, praising him highly in the presence of all those kings: "O mighty-armed one, this is not wonderful in you, O son of Kuru''s race!'
bhisma-6-121-40:
  ganguli: 6 CXXIII
  text: Thou hast seen, O Duryodhana how the intelligent Partha created that jet of cool and nectar-scented water!
  modern: You have seen, O Duryodhana, how the wise Pārtha created that jet of cool, nectar-scented water.
bhisma-6-121-41:
  ganguli: 6 CXXIII
  text: The weapons appertaining to Agni, Varuna, Soma, Vayu, and Vishnu, as also those appertaining to Indra, Pasupati, and Paramesthi, and those of Prajapati, Dhatri, Tashtri, Savitri, and Vivaswat, all these are known to Dhananjaya alone in this world of men!
  modern: The weapons of Agni, Varuṇa, Soma, Vāyu and Viṣṇu, those of Indra, Paśupati and Parameṣṭhin, and those of Prajāpati, Dhātṛ, Tvaṣṭṛ, Savitṛ and Vivasvat, all these are known to Dhanañjaya alone in this world of men.
bhisma-6-121-44:
  ganguli: 6 CXXIII
  text: This son of Pandu, O sire, is incapable of being defeated in battle by even the gods and the Asuras together. The feats of this high-souled one are superhuman.
  modern: This son of Pāṇḍu, O sire, cannot be defeated in battle even by the gods and Asuras together. The feats of this high-souled one are superhuman.
bhisma-6-121-45:
  ganguli: 6 CXXIII
  text: With that truthful hero, that ornament of battle, that warrior accomplished in fight, let peace, O king, be soon made!
  modern: With that truthful hero, that ornament of battle, that warrior accomplished in fighting, let peace be made soon, O king.
bhisma-6-121-51:
  ganguli: 6 CXXIII
  text: As long as Nakula, and Sahadeva, and Bhimasena, the sons of Pandu, do not, O monarch, exterminate thy army, it seems to me that friendly relations should be restored between thee and the heroic Pandavas! Let this battle end with my death, O sire!
  modern: As long as Nakula, Sahadeva and Bhīmasena, the sons of Pāṇḍu, do not destroy your army, O monarch, it seems to me that friendly relations should be restored between you and the heroic Pāṇḍavas. Let this battle end with my death, O sire.
bhisma-6-121-58:
  ganguli: 6 CXXIII
  text: Having heard these beneficial and peaceful words fraught with both virtue and profit, thy son, however, accepted them not, like a dying man refusing medicine.
  modern: Having heard these beneficial and peaceful words, full of both virtue and profit, your son did not accept them, like a dying man refusing medicine.
  speaker: Sanjaya continued,
  speakerModern: 'Sañjaya continued:'
bhisma-6-122-1:
  ganguli: 6 CXXIV
  speaker: Sanjaya said,
  speakerModern: 'Sañjaya said:'
  text: After Santanu’s son Bhishma, O monarch, had become silent, all those rulers of earth, there present, then returned to their respective quarters.
  modern: After Bhīṣma, Śāntanu's son, had fallen silent, O monarch, all the rulers of the earth who were present returned to their quarters.
bhisma-6-122-2:
  ganguli: 6 CXXIV
  text: Hearing of Bhishma’s slaughter that bull among men, viz., Radha’s son (Karna), partially inspired with fear quickly came there.
  modern: Hearing of Bhīṣma's fall, Rādhā's son Karṇa, that bull among men, came there quickly, a little afraid.
bhisma-6-122-3:
  ganguli: 6 CXXIV
  text: He beheld that illustrious hero lying on his bed of reeds.
  modern: He saw that illustrious hero lying on his bed of arrows.
bhisma-6-122-4:
  ganguli: 6 CXXIV
  text: Then Vrisha (Karna) endued with great glory, with voice choked in tears, approaching that hero lying with eyes closed, fell at his feet.
  modern: Then Vṛṣa, endowed with great glory, his voice choked with tears, approached that hero, who lay with his eyes closed, and fell at his feet.
bhisma-6-122-5:
  ganguli: 6 CXXIV
  speaker: And he said,
  speakerModern: 'He said:'
  text: 'O chief of the Kurus, I am Radha’s son, who while before thy eyes, was everywhere looked upon by thee with hate!--Hearing these words, the aged chief of the Kurus, the son of Ganga, whose eyes were covered with film slowly raising his eyelids, and causing the guards to be removed, and seeing the place deserted by all, embraced Karna with one arm, like a sire embracing his son, and said these words with great affection: …'
  modern: '"O chief of the Kurus, I am Rādhā''s son, whom you always looked on with hatred, even before your eyes!" Hearing these words, the aged chief of the Kurus, the son of Gaṅgā, whose eyes were covered with a film, slowly raised his eyelids. He had the guards removed, and seeing the place deserted by all, he embraced Karṇa with one arm, like a father embracing his son, and said with great affection: …'
bhisma-6-122-6:
  ganguli: 6 CXXIV
  text: (with bhisma-6-122-5)
bhisma-6-122-7:
  ganguli: 6 CXXIV
  text: (with bhisma-6-122-5)
bhisma-6-122-9:
  ganguli: 6 CXXIV
  text: Thou art Kunti’s son, not Radha’s! Nor is Adhiratha thy father!
  modern: You are Kuntī's son, not Rādhā's. Adhiratha is not your father.
bhisma-6-122-10:
  ganguli: 6 CXXIV
  text: O thou of mighty arms, I heard all this about thee from Narada as also from Krishna-Dwaipayana! Without doubt, all this is true! I tell thee truly, O son, that I bear thee no malice!
  modern: O mighty-armed one, I heard all this about you from Nārada and from Kṛṣṇa Dvaipāyana. Without doubt, it is all true. I tell you truly, my son, that I bear you no malice.
bhisma-6-122-11:
  ganguli: 6 CXXIV
  text: It was only for abating thy energy that I used to say such harsh words to thee! O thou of excellent vows without any reason thou speakest ill of all the Pandavas!
  modern: I used to speak harshly to you only to abate your energy. O you of excellent vows, you speak ill of all the Pāṇḍavas for no reason.
bhisma-6-122-13:
  ganguli: 6 CXXIV
  text: Through pride, and owning also to thy companionship with the low, thy heart hateth even persons of merit! It is for this that I spoke such harsh words about thee in the Kuru camp!
  modern: Through pride, and through your company with the low, your heart hates even persons of merit. That is why I spoke such harsh words about you in the Kuru camp.
bhisma-6-122-14:
  ganguli: 6 CXXIV
  text: I know thy prowess in battle, which can with difficulty be borne on earth by foes! I know also thy regard for Brahmanas. thy courage, and thy great attachment to alms-giving!
  modern: I know your prowess in battle, which foes can hardly bear on earth. I also know your regard for Brāhmaṇas, your courage, and your great devotion to giving alms.
bhisma-6-122-16:
  ganguli: 6 CXXIV
  text: In bowmanship, in aiming weapon, in lightness of hand and in strength of weapons, thou art equal to Phalguni himself, or the high-souled Krishna!
  modern: In archery, in aiming weapons, in lightness of hand and in the strength of your weapons, you are equal to Phālguna himself, or to the high-souled Kṛṣṇa.
bhisma-6-122-21:
  ganguli: 6 CXXIV
  text: O slayer of foes, the heroic sons of Pandu are thy uterine brothers! If thou wishest to do what is agreeable to me, unite with them, O thou of mighty arms!
  modern: O slayer of foes, the heroic sons of Pāṇḍu are your brothers by the same mother. If you wish to do what pleases me, join them, O mighty-armed one.
bhisma-6-122-22:
  ganguli: 6 CXXIV
  text: O son of Surya, let these hostilities end with me! Let all the kings of Earth be to-day freed from danger!--
  modern: Let these hostilities end with me, O son of Sūrya. Let all the kings of the earth be free from danger today."
bhisma-6-122-23:
  ganguli: 6 CXXIV
  text: I know this, O thou of mighty arms! All this without doubt, is (as thou sayest)! As thou tellest me, O, Bhishma, I am Kunti’s son, and not the son of a Suta!
  modern: I know this, O mighty-armed one. All this is no doubt as you say. As you tell me, O Bhīṣma, I am Kuntī's son and not the son of a Sūta.
  speaker: Karna said,
  speakerModern: 'Karṇa said:'
bhisma-6-122-24:
  ganguli: 6 CXXIV
  text: I was, however, abandoned by Kunti, and I have been reared by a Suta. Having (so long) enjoyed the wealth of Duryodhana, I dare not falsify it now.
  modern: But I was abandoned by Kuntī and raised by a Sūta. Having enjoyed Duryodhana's wealth for so long, I dare not betray him now.
bhisma-6-122-32:
  ganguli: 6 CXXIV
  text: Firmly resolved that I am on battle, grant me thy permission, O hero! I will fight. Even this is my wish.
  modern: I am firmly resolved on battle. Give me your permission, O hero. I will fight. This is my wish.
bhisma-6-122-33:
  ganguli: 6 CXXIV
  text: It behoveth thee to forgive me also any harsh words that I may have at any time uttered against thee or any act that I may have done against thee from anger or inconsiderateness!--
  modern: Please forgive me also for any harsh words I may have said to you, or anything I may have done against you out of anger or thoughtlessness."
bhisma-6-122-34:
  ganguli: 6 CXXIV
  text: If, indeed, thou art unable to cast off this fierce animosity, I permit thee, O Karna! Fight, moved by the desire of heaven!
  modern: If you cannot give up this fierce animosity, I permit you, O Karṇa. Fight, moved by the desire for heaven.
  speaker: Bhishma said,
  speakerModern: 'Bhīṣma said:'
bhisma-6-122-38:
  ganguli: 6 CXXIV
  text: For a long while I made great efforts for bringing about peace! But I succeeded not, O Karna, in the task! Truly do I say this unto thee!--
  modern: For a long time I made great efforts to bring about peace. But I did not succeed, O Karṇa. I tell you this truly."
bhisma-6-122-39:
  ganguli: 6 CXXIV
  text: After the son of Ganga had said this, Radha’s son (Karna) having saluted Bhishma and obtained his forgiveness, got up on his car and proceeded towards (the quarters of) thy son.
  modern: After the son of Gaṅgā had said this, Rādhā's son Karṇa saluted Bhīṣma, obtained his forgiveness, got on his chariot and went toward your son.
  speaker: Sanjaya continued,
  speakerModern: 'Sañjaya continued:'
drona-7-7-6:
  ganguli: 7 VII
  text: And the kings (in the Kaurava army) headed by Duryodhana performed the investiture of Drona in the command of the forces, like the celestials headed by Indra in days of yore performing the investiture of Skanda.
  modern: The kings of the Kaurava army, headed by Duryodhana, installed Droṇa as commander of the forces, as the gods headed by Indra had once installed Skanda.
drona-7-12-2:
  ganguli: 7 XII
  text: Having obtained the command of the troops, that mighty car-warrior, viz., Bharadwaja’s son, said these words unto thy son in the midst of all the troops, …
  modern: 'Having received the command of the troops, the mighty chariot-warrior, Bharadvāja''s son, said to your son in the midst of all the troops: …'
drona-7-12-4:
  ganguli: 7 XII
  text: … take thou, O Bharata, the adequate fruit of that act of thine. What business of thine shall I now achieve? Ask thou the boon that thou desirest.
  modern: … Take, O Bhārata, the fitting reward for that act of yours. What shall I now do for you? Ask for the boon you want.
drona-7-12-6:
  ganguli: 7 XII
  text: … If thou wouldst give me a boon, then, seizing that foremost of car-warriors, viz., Yudhishthira, alive, bring him unto me here.’
  modern: … If you would give me a boon, then seize that foremost chariot-warrior Yudhiṣṭhira alive and bring him here to me."
drona-7-12-21:
  ganguli: 7 XII
  text: If brought hither (alive), vanquished once more at dice, the Pandavas will once more go to the woods, for they are all obedient to Yudhishthira.
  modern: If he is brought here alive and beaten once more at dice, the Pāṇḍavas will go to the woods again, for they are all obedient to Yudhiṣṭhira.
drona-7-12-22:
  ganguli: 7 XII
  text: It is evident that such a victory will be an enduring one. It is for this that I do not, by any means, desire the slaughter of king Yudhishthira the just.
  modern: Clearly such a victory will last. That is why I do not at all want King Yudhiṣṭhira the just to be slain."
drona-7-12-24:
  ganguli: 7 XII
  speaker: Drona said,
  speakerModern: 'Droṇa said:'
  text: If the heroic Arjuna do not protect Yudhishthira in battle, thou mayst think the eldest Pandava as already brought under thy control.
  modern: If the heroic Arjuna does not protect Yudhiṣṭhira in battle, you may consider the eldest Pāṇḍava as already brought under your control.
drona-7-33-18:
  ganguli: 7 XXXII
  text: And at the head of that army was the commander Drona looking like the rising sun. …
  modern: At the head of that army stood the commander Droṇa, looking like the rising sun. …
drona-7-33-19:
  ganguli: 7 XXXIV
  text: And during the progress of that awful battle, Arjuna’s son, in the very sight of Drona, breaking that array, penetrated into it.
  modern: During that awful battle, Arjuna's son broke that array in the very sight of Droṇa and penetrated into it.
drona-7-37-32:
  ganguli: 7 XXXV
  text: Covered all over with arrows, that son of Sakra’s son, filled with rage, careered over the field. And he was regarded by all the troops as Yama’s self armed with the noose.
  modern: Covered all over with arrows, that son of Śakra's son, filled with rage, moved about the field. All the troops saw him as Yama himself with the noose in his hand.
drona-7-41-13:
  ganguli: 7 XXXIX
  text: … Quickly consuming his foes, like a fire playing in the midst of a heap of dry grass, the son of Arjuna was seen careering through the midst of the Bharata army.
  modern: … Quickly burning up his foes like a fire in a heap of dry grass, the son of Arjuna was seen moving through the midst of the Bhārata army.
drona-7-45-23:
  ganguli: 7 XLIII
  text: Quickly displaying his weapons, he careered in that battle like a circle of fire, and was, O king, seen sometimes as a single individual, sometimes as a hundred, and sometimes as a thousand ones.
  modern: Quickly displaying his weapons, he moved through that battle like a circle of fire, and was seen, O king, sometimes as one man, sometimes as a hundred, and sometimes as a thousand.
drona-7-47-4:
  ganguli: 7 XLV
  text: Then Drona, and Kripa, and Karna, and Drona’s son, and Vrihadvala and Kritavarman, the son of Hridika,--these six car-warriors,--encompassed him.
  modern: Then Droṇa, Kṛpa, Karṇa, Droṇa's son, Bṛhadbala and Kṛtavarman, the son of Hṛdika, these six chariot-warriors, surrounded him.
drona-7-48-16:
  ganguli: 7 XLVI
  text: He then pierced Suvala’s son. The latter piercing Abhimanyu with three arrows, said unto Duryodhana, …
  modern: He then pierced Suvala's son. The latter pierced Abhimanyu with three arrows and said to Duryodhana, …
drona-7-48-17:
  ganguli: 7 XLVI
  text: … Let us all together grind this one, else, fighting singly with us he will slay us all. … Then Karna, the son of Vikartana, said unto Drona, …
  modern: … Let us all together crush this one, or else, fighting us one at a time, he will kill us all. … Then Karṇa, son of Vikartana, said to Droṇa, …
drona-7-48-24:
  ganguli: 7 XLVI
  text: Hearing these words, Karna, afflicted with the shafts of Arjuna’s son, once more said unto Drona, ‘Exceedingly afflicted with the shafts of Abhimanyu, I am staying in battle, only because (as a warrior) I should stay here. …
  modern: 'Hearing these words, Karṇa, hurt by the arrows of Arjuna''s son, said again to Droṇa: "Hurt badly by Abhimanyu''s arrows, I am staying in battle only because, as a warrior, I should stay here. …'
drona-7-48-26:
  ganguli: 7 XLVI
  text: The preceptor then, slowly and with a smile, said unto Karna, ‘Abhimanyu is young, his prowess is great. His coat of mail is impenetrable.
  modern: 'The preceptor then said to Karṇa, slowly and with a smile: "Abhimanyu is young, and his prowess is great. His coat of mail is impenetrable.'
drona-7-48-29:
  ganguli: 7 XLVI
  text: … O mighty bowman, O son of Radha, if competent, do this. Making him turn back from the fight (by this means), strike him then.
  modern: … O mighty bowman, son of Rādhā, do this if you can. Make him turn back from the fight in this way, and then strike him.
drona-7-48-30:
  ganguli: 7 XLVI
  text: With his bow in hand he is incapable of being vanquished by the very gods and the Asuras together. If you wish, deprive him of his car, and divest him of his bow.’.
  modern: With his bow in hand he cannot be conquered even by the gods and Asuras together. If you wish, deprive him of his chariot and take away his bow."
drona-7-48-31:
  ganguli: 7 XLVI
  text: Hearing these words of the preceptor, Vikartana’s son Karna quickly cut off, by means of his shafts, the bow of Abhimanyu, as the latter was shooting with great activity.
  modern: Hearing the preceptor's words, Karṇa, son of Vikartana, quickly cut off Abhimanyu's bow with his arrows as Abhimanyu was shooting with great speed.
drona-7-48-32:
  ganguli: 7 XLVI
  text: He, of Bhoja’s race (viz., Kritavarman) then slew his steeds, and Kripa slew his two Parshni charioteers. The others covered him with showers of arrows after he had been divested of his bow.
  modern: Kṛtavarman, of the Bhoja race, then killed his horses, and Kṛpa killed his two rear charioteers. The others covered him with showers of arrows after he had lost his bow.
drona-7-48-33:
  ganguli: 7 XLVI
  text: … Those six great car-warriors, with great speed, when speed was so necessary, ruthlessly covered that carless youth, fighting single-handed with them, with showers of arrows.
  modern: … Those six great chariot-warriors, with great speed when speed was needed, ruthlessly covered that chariotless youth, who fought them alone, with showers of arrows.
drona-7-48-34:
  ganguli: 7 XLVI
  text: Bowless and carless, with an eye, however, to his duty (as a warrior), handsome Abhimanyu, taking up a sword and a shield, jumped into the sky. …
  modern: Without bow or chariot, but mindful of his duty as a warrior, handsome Abhimanyu took up a sword and a shield and leapt into the sky. …
drona-7-48-39:
  ganguli: 7 XLVI
  text: Then taking up a car-wheel, he rushed in wrath against Drona.
  modern: Then he took up a chariot wheel and rushed at Droṇa in wrath.
drona-7-49-4:
  ganguli: 7 XLVII
  text: The kings beholding it and the wheel in his hands, became filled with anxiety, and cut that off in a hundred fragments. Then that great car-warrior, the son of Arjuna, took up a mighty mace.
  modern: The kings, seeing it and the wheel in his hands, became anxious and cut it into a hundred fragments. Then that great chariot-warrior, the son of Arjuna, took up a mighty mace.
drona-7-49-7:
  ganguli: 7 XLVII
  text: Slaying Aswatthaman’s steeds and two Parshni charioteers with that mace of his, Subhadra’s son, pierced all over with arrows, looked like a porcupine.
  modern: With that mace he killed Aśvatthāman's horses and his two rear charioteers. Subhadrā's son, pierced all over with arrows, looked like a porcupine.
drona-7-49-10:
  ganguli: 7 XLVII
  text: The invincible son of Duhsasan, then, O sire, taking up his mace, rushed at Abhimanyu. saying, ‘Wait, Wait!’
  modern: Then the invincible son of Duḥśāsana, O sire, took up his mace and rushed at Abhimanyu, saying, "Wait, wait!"
drona-7-49-12:
  ganguli: 7 XLVII
  text: … Each of those chastisers of foes, struck with the other’s mace-ends fell down on the earth, like two uprooted standards erected to the honour of Indra.
  modern: … Each of those chastisers of foes, struck by the other's mace-end, fell to the earth like two uprooted banners raised in honor of Indra.
drona-7-49-13:
  ganguli: 7 XLVII
  text: Then Duhsasana’s son, that enhancer of the fame of the Kurus, rising up first, struck Abhimanyu with the mace on the crown of his head, as the latter, was on the point of rising.
  modern: Duḥśāsana's son, who increased the fame of the Kurus, got up first and struck Abhimanyu on the crown of the head with his mace as Abhimanyu was about to rise.
drona-7-49-15:
  ganguli: 7 XLVII
  text: Thus, O king, was one slain by many in battle,--one who had ground the whole army, like an elephant grinding lotus-stalks in a lake.
  modern: So, O king, one man was slain by many in battle, one who had ground down the whole army like an elephant grinding lotus stalks in a lake.
drona-7-49-19:
  ganguli: 7 XLVII
  text: The mighty car-warriors of thy army beholding Abhimanyu whose face had the splendour of the full moon, and whose eyes were rendered beautiful in consequence of lashes black as the feathers of the raven, lying prostrate on the bare earth, were filled with great joy.
  modern: Seeing Abhimanyu lying prostrate on the bare earth, his face as splendid as the full moon, his eyes beautiful with lashes black as raven feathers, the mighty chariot-warriors of your army were filled with great joy.
drona-7-49-20:
  ganguli: 7 XLVII
  text: Indeed, O monarch, thy troops were in transports of joy, while tears fell fast from the eyes of the Pandava heroes.
  modern: Your troops, O monarch, were in transports of joy, while tears fell fast from the eyes of the Pāṇḍava heroes.
drona-7-49-21:
  ganguli: 7 XLVII
  text: Beholding the heroic Abhimanyu lying on the field of battle, like the moon dropped from the firmament, diverse creatures, O king, in the welkin, said aloud, …
  modern: 'Seeing the heroic Abhimanyu lying on the battlefield like the moon fallen from the sky, various beings in the heavens cried out, O king: …'
drona-7-49-22:
  ganguli: 7 XLVII
  text: … Alas, this one lieth on the field, slain, while fighting singly, by six mighty car-warriors of the Dhartarashtra army, headed by Drona and Karna. This act hath been, we hold, an unrighteous one.
  modern: … Alas, this one lies here slain, fighting alone against six mighty chariot-warriors of the Dhārtarāṣṭra army, headed by Droṇa and Karṇa. This act, we hold, was unrighteous.
drona-7-72-8:
  ganguli: 7 LXXII
  text: Then the ape-bannered Jishnu, having slain a large number of Samsaptakas by means of his celestial weapons, proceeded towards his tent, mounted on that victorious car of his.
  modern: Then Jiṣṇu of the ape banner, having killed a large number of Saṃśaptakas with his celestial weapons, went toward his tent, riding that victorious chariot of his.
drona-7-72-9:
  ganguli: 7 LXXII
  text: (with drona-7-72-8)
drona-7-72-24:
  ganguli: 7 LXXII
  text: Beholding his brothers and sons, the ape-bannered Arjuna became very cheerless.
  modern: Seeing his brothers and sons, Arjuna of the ape banner became very cheerless.
drona-7-72-25:
  ganguli: 7 LXXII
  text: Not seeing the son of Subhadra there, Arjuna said, ‘Pale is the colour I behold of the faces of you all. I do not, again, see Abhimanyu.
  modern: Not seeing the son of Subhadrā there, Arjuna said, "The color of all your faces is pale. And I do not see Abhimanyu.
drona-7-73-1:
  ganguli: 7 LXXIII
  speaker: Yudhishthira said,
  speakerModern: 'Yudhiṣṭhira said:'
  text: O mighty-armed one, after thou hadst gone towards the army of the Samsaptakas, the preceptor Drona made fierce endeavours for seizing me.
  modern: O mighty-armed one, after you went toward the army of the Saṃśaptakas, the preceptor Droṇa made fierce efforts to seize me.
drona-7-73-4:
  ganguli: 7 LXXIII
  text: Thus afflicted by him, we could not then even gaze at his army, far less face it in battle.
  modern: Afflicted by him in this way, we could not even look at his army, far less face it in battle.
drona-7-73-5:
  ganguli: 7 LXXIII
  text: All of us then, addressing thy son by Subhadra, who was equal to thyself, O lord, in prowess said unto him, [O son, pierce this array of Drona!] …
  modern: 'Then all of us said to your son by Subhadrā, who equaled you, O lord, in prowess: "Son, break through this array of Droṇa!" …'
drona-7-73-7:
  ganguli: 7 LXXIII
  text: Endued as he was with thy energy, aided by that knowledge of weapons which he derived from thee, that child then penetrated unto that array, like Garuda penetrating into the ocean.
  modern: Full of your energy, and aided by the knowledge of weapons he had from you, that child then entered that array like Garuḍa plunging into the ocean.
drona-7-73-8:
  ganguli: 7 LXXIII
  text: As regards ourselves, we followed that hero, that son of Subhadra, desirous in that battle, of penetrating (into the Dhritarashtra army) by the same path by which Abhimanyu had entered it.
  modern: As for us, we followed that hero, the son of Subhadrā, wishing in that battle to enter the Dhṛtarāṣṭra army by the same path by which Abhimanyu had entered.
drona-7-73-9:
  ganguli: 7 LXXIII
  text: Then, O sire, the wretched king of the Sindhus, viz., Jayadratha, in consequence of the boon granted to him by Rudra, checked all of us!
  modern: Then, O sire, the wretched king of the Sindhus, Jayadratha, by virtue of the boon Rudra had granted him, held all of us back.
drona-7-73-11:
  ganguli: 7 LXXIII
  text: Having surrounded that child all those great car-warriors--too many for him although he was contending to the utmost of his power, deprived him of his car.
  modern: All those great chariot-warriors surrounded that child, too many for him though he fought with all his strength, and deprived him of his chariot.
drona-7-73-16:
  ganguli: 7 LXXIII
  text: After he had been deprived of his car, Dussasana’s son, though he himself had a hair-breadth escape, succeeded, as chance would have it, in making Abhimanyu, meet with his end.
  modern: When he had been deprived of his chariot, Duḥśāsana's son, though he himself narrowly escaped, managed, as chance would have it, to bring Abhimanyu to his end.
drona-7-73-22:
  ganguli: 7 LXXIII
  text: Thus hath occurred this event that so enhances our grief! That tiger among men hath even thus ascended to heaven!
  modern: This is how this event, which so increases our grief, came about. That tiger among men has gone to heaven in this way.
drona-7-73-23:
  ganguli: 7 LXXIII
  text: Hearing these words uttered by king Yudhishthira, Arjuna, saying--Oh son!--and breathing a deep sigh, fell down on the earth in great pain.
  modern: Hearing these words of King Yudhiṣṭhira, Arjuna cried "Oh, my son!", breathed a deep sigh, and fell to the ground in great pain.
drona-7-73-26:
  ganguli: 7 LXXIII
  text: Squeezing his hands, drawing deep breaths, with eyes bathed in tears, and casting his glances like a mad man, he said these words.
  modern: Wringing his hands, drawing deep breaths, his eyes bathed in tears, and glancing about like a madman, he said these words.
drona-7-73-27:
  ganguli: 7 LXXIII
  speaker: Arjuna said,
  speakerModern: 'Arjuna said:'
  text: Truly do I swear that tomorrow I will slay Jayadratha! If from fear of death, he doth not forsake the Dhritarashtras, or implore our protection, or the protection of Krishna that foremost of men or of thine, O king, I shall assuredly slay him tomorrow!
  modern: I swear truly that tomorrow I will slay Jayadratha! If, out of fear of death, he does not abandon the Dhārtarāṣṭras, or beg for our protection, or the protection of Kṛṣṇa, the foremost of men, or yours, O king, I will surely slay him tomorrow.
drona-7-74-1:
  ganguli: 7 LXXIV
  speaker: Sanjaya said,
  speakerModern: 'Sañjaya said:'
  text: When the spies (of Duryodhana), having heard that loud uproar made by the Pandavas desirous of victory, informed (their masters of the cause), Jayadratha, overwhelmed with sorrow, and with heart stupefied with grief, and like one sinking in a fathomless ocean of distress, slowly rose up …
  modern: When Duryodhana's spies heard that loud uproar made by the Pāṇḍavas, who wanted victory, and reported its cause, Jayadratha was overwhelmed with sorrow and his heart was stupefied with grief, like one sinking in a fathomless ocean of distress. He slowly rose, …
drona-7-74-22:
  ganguli: 7 LXXIV
  speaker: Sanjaya continued,
  speakerModern: 'Sañjaya continued:'
  text: Thus comforted, O monarch, by thy son, the king of the Sindhus then, accompanied by Duryodhana, repaired that very night to Drona (the generalissimo of the Kuru army).
  modern: Comforted in this way by your son, O monarch, the king of the Sindhus went that very night with Duryodhana to Droṇa, the commander of the Kuru army.
drona-7-74-28:
  ganguli: 7 LXXIV
  text: … The very gods, cannot prevail over him who is protected by my arms! I will form an array which Partha will not succeed in piercing! …
  modern: … Even the gods cannot prevail against one protected by my arms. I will form an array that Pārtha will not be able to pierce. …
drona-7-74-29:
  ganguli: 7 LXXIV
  text: Therefore contend thou in battle, do not fear, observing the duties of thy own order! O mighty car-warrior, tread in the track of thy sires and grandsires!
  modern: Therefore fight in battle, do not fear, and keep to the duties of your own order. O mighty chariot-warrior, tread the path of your fathers and grandfathers.
drona-7-74-35:
  ganguli: 7 LXXIV
  text: Even thus was the ruler of the Sindhus consoled by Bharadwaja’s son. Banishing his fear of Partha, he set his heart on battle.
  modern: In this way the ruler of the Sindhus was consoled by Bharadvāja's son. Giving up his fear of Pārtha, he set his heart on battle.
drona-7-87-1:
  ganguli: 7 LXXXVII
  speaker: Sanjaya said,
  speakerModern: 'Sañjaya said:'
  text: After that fight had passed away, Drona, that foremost of all wielders of weapons, began to array all his divisions for battle.
  modern: After that fight was over, Droṇa, foremost of all weapon-bearers, began to array all his divisions for battle.
drona-7-88-21:
  ganguli: 7 LXXXVIII
  text: … mounted on his own foremost of cars, (the incarnate) Nara, accompanied by Narayana, shaking his Gandiva in battle, shone brilliantly like the risen sun.
  modern: … mounted on his own foremost chariot, Nara incarnate, accompanied by Nārāyaṇa, shaking his Gāṇḍīva in battle, shone brilliantly like the risen sun.
drona-7-91-1:
  ganguli: 7 XC
  speaker: Sanjaya said,
  speakerModern: 'Sañjaya said:'
  text: Slaying the force of Duhsasana, the mighty car-warrior, Savyasachin, desirous of getting at the ruler of the Sindhus, proceeded against the division of Drona, …
  modern: Slaying Duḥśāsana's force, the mighty chariot-warrior Savyasācin, wanting to get at the ruler of the Sindhus, advanced against Droṇa's division, …
drona-7-147-43:
  ganguli: 7 CXLV
  text: Baffling with his own the weapons of all those heroes, and showing by the terrible achievements in which he was engaged that he was a warrior of fierce feats.
  modern: Baffling the weapons of all those heroes with his own, and showing by the terrible feats he was engaged in that he was a warrior of fierce deeds.
drona-7-147-48:
  ganguli: 7 CXLV
  text: Then, O king, filling all the points of the compass with his shafts and afflicting all the car-warriors in battle, the son of Kunti proceeded towards Jayadratha and pierced him with four and sixty straight arrows.
  modern: Then, O king, filling all the directions with his arrows and afflicting all the chariot-warriors in battle, the son of Kuntī went toward Jayadratha and pierced him with sixty-four straight arrows.
drona-7-147-63:
  ganguli: 7 CXLV
  text: Without vanquishing those six car-warriors in battle, O bull among men, thou wilt never be able to slay the ruler of the Sindhus even if thou exertest thyself without intermission. I shall, therefore, resort to Yoga for shrouding the sun. Then the ruler of the Sindhus will (in consequence) behold the sun to have set.
  modern: Unless you defeat those six chariot-warriors in battle, O bull among men, you will never be able to slay the ruler of the Sindhus, even if you strive without rest. I shall therefore resort to Yoga to shroud the sun. Then the ruler of the Sindhus will see the sun as having set.
drona-7-147-65:
  ganguli: 7 CXLV
  text: Desirous of life, O lord, through joy that wicked wight will no longer, for his destruction, conceal himself.
  modern: Eager for life, O lord, that wicked man will, out of joy, no longer hide himself, to his own destruction.
drona-7-147-66:
  ganguli: 7 CXLV
  text: Availing yourself of that opportunity, thou shouldst then, O best of the Kurus, strike him. Thou shouldst not give up the enterprise, thinking the sun to have really set.
  modern: Taking that opportunity, best of the Kurus, strike him. Do not give up the enterprise, thinking the sun has really set."
drona-7-147-67:
  ganguli: 7 CXLV
  text: Then Krishna otherwise called Hari, possessed of ascetic powers, that lord of all ascetics, having taken recourse to Yoga, created that darkness.
  modern: Then Kṛṣṇa, also called Hari, rich in ascetic power, lord of all ascetics, used Yoga to create that darkness.
drona-7-147-70:
  ganguli: 7 CXLV
  text: This is the hour, O mighty-armed one, for the slaughter of that wicked-souled wretch. Speedily cut off the head and make thy vow true.
  modern: '"This is the hour, O mighty-armed one, to kill that wicked-souled wretch. Cut off his head quickly and make your vow true."'
drona-7-147-72:
  ganguli: 7 CXLV
  text: Hearing these words (of Krishna), Dhananjaya, licking the corners of his mouth, quickly shot that arrow which he had taken up for Jayadratha’s slaughter, that arrow, viz., whose touch resembled that of Indra’s thunder, which was inspired with mantras and converted into a celestial weapon, which was capable of bearing any strain, and which had always been worshipped with incense and garlands.
  modern: Hearing these words of Kṛṣṇa, Dhanañjaya, licking the corners of his mouth, quickly shot the arrow he had taken up for Jayadratha's slaughter. Its touch was like Indra's thunderbolt; it was inspired with mantras and made into a celestial weapon; it could bear any strain; and it had always been worshipped with incense and garlands.
drona-7-147-73:
  ganguli: 7 CXLV
  text: That shaft, sped from Gandiva, coursing swiftly, snatched Jayadratha’s head away, like a hawk snatching away a smaller bird from the top of a tree.
  modern: That arrow, shot from Gāṇḍīva, flew swiftly and snatched away Jayadratha's head like a hawk snatching a small bird from the top of a tree.
drona-7-157-62:
  ganguli: 7 CLV
  text: Riding on it, Ghatotkacha was surrounded by a full Akshauhini of fierce-looking Rakshasas armed with lances and heavy clubs and rocks and trees.
  modern: Riding on it, Ghaṭotkaca was surrounded by a full akṣauhiṇī of fierce-looking Rākṣasas armed with lances, heavy clubs, rocks and trees.
drona-7-157-137:
  ganguli: 7 CLV
  text: Then Ghatotkacha, filled with rage, urged that vast Rakshasa force on, saying, ‘Slay the son of Drona!’
  modern: Then Ghaṭotkaca, filled with rage, urged on that vast Rākṣasa force, saying, "Kill the son of Droṇa!"
drona-7-164-1:
  ganguli: 7 CLXII
  speaker: Sanjaya said,
  speakerModern: 'Sañjaya said:'
  text: During the progress of that fierce and terrible battle, when the world was enveloped with darkness and dust, O king, the combatants, as they stood on the field, could not see one another. Those foremost of Kshatriyas fought with each other, guided by conjectures and the personal and other names (they uttered).
  modern: During that fierce and terrible battle, when the world was enveloped in darkness and dust, O king, the combatants standing on the field could not see one another. Those foremost of Kṣatriyas fought each other, guided by guesses and by the names they called out.
drona-7-164-2:
  ganguli: 7 CLXIII
  text: (with drona-7-164-1)
drona-7-165-3:
  ganguli: 7 CLXIII
  text: With thousands of lamps blazing all around and with the more blazing lamps of the gods and the Gandharvas, set upon golden stands decked with jewels, and fed with fragrant oil, the field of battle, O Bharata, looked resplendent like the firmament bespangled with stars.
  modern: With thousands of lamps blazing all around, and the brighter lamps of the gods and Gandharvas, set on golden stands studded with jewels and fed with fragrant oil, the battlefield, O Bhārata, looked as splendid as the sky strewn with stars.
drona-7-165-5:
  ganguli: 7 CLXIII
  text: Indeed, the earth seemed to be in a conflagration, like what happens at the universal destruction. …
  modern: Indeed, the earth seemed to be in flames, as at the universal destruction. …
drona-7-174-69:
  ganguli: 7 CLXXV
  text: And Karna proceeded against the smiling Rakshasa, smiting him in return from a near point, like an elephant against an elephant or the leader of a bovine herd against the leader of another herd.
  modern: And Karṇa went against the smiling Rākṣasa and struck him in return from close range, like an elephant against an elephant, or the leader of one herd of cattle against the leader of another.
drona-7-180-33:
  ganguli: 7 CLXXIX
  text: Beholding that exceedingly frightful and awful shower of mighty weapons, caused by the Rakshasa’s illusion, failing upon the field, and seeing their vast army incessantly slaughtered, the sons became inspired with great fear.
  modern: Seeing that frightful and awful shower of mighty weapons falling on the field, caused by the Rākṣasa's illusion, and seeing their vast army slaughtered without pause, your sons were filled with great fear.
drona-7-180-48:
  ganguli: 7 CLXXIX
  text: At that time all the Kauravas, beholding Karna and that terrible illusion (of the Rakshasa) cried out saying, ‘O Karna, slay the Rakshasa soon with thy dart. These Kauravas and the Dhartarashtras are on the point of being annihilated.
  modern: At that time all the Kauravas, seeing Karṇa and that terrible illusion of the Rākṣasa, cried out, "O Karṇa, kill the Rākṣasa quickly with your dart. These Kauravas and Dhārtarāṣṭras are on the point of being annihilated."
drona-7-180-51:
  ganguli: 7 CLXXIX
  text: Then Karna, seeing the Rakshasa alive at dead of night, and the Kuru army struck with fear, and hearing also the loud wails of the latter set his heart upon hurling his dart.
  modern: Then Karṇa, seeing the Rākṣasa still alive at dead of night, and the Kuru army struck with fear, and hearing its loud wails, set his heart on hurling his dart.
drona-7-180-53:
  ganguli: 7 CLXXIX
  text: Indeed, that dart, O king, which he had kept and adored for years for (achieving) the slaughter of Pandu’s son in battle, that foremost of darts which Sakra himself had given to the Suta’s son in exchange for the latter’s ear-rings, …
  modern: That dart, O king, which he had kept and honored for years to kill Pāṇḍu's son in battle, that foremost of darts which Śakra himself had given to the Sūta's son in exchange for his earrings, …
drona-7-180-54:
  ganguli: 7 CLXXIX
  text: … that blazing and terrible missile twined with strings and which seemed to thirst for blood, that fierce weapon which looked like the very tongue of the Destroyer or the sister of Death himself, that terrible and effulgent dart, Naikartana, was now hurled at the Rakshasa.
  modern: … that blazing and terrible missile, hung with cords, that seemed to thirst for blood, that fierce weapon like the very tongue of the Destroyer or the sister of Death himself, that terrible and shining dart, Naikartana, was now hurled at the Rākṣasa.
drona-7-180-60:
  ganguli: 7 CLXXIX
  text: Indeed, having assumed that terrible and awful form, Bhimasena’s son of frightful deeds fell down.
  modern: Having taken that terrible and awful form, Bhīmasena's son of frightful deeds fell down.
drona-7-188-2:
  ganguli: 7 CLXXXVI
  text: Soon, however, the morning sun rose.
  modern: Soon, however, the morning sun rose.
drona-7-191-5:
  ganguli: 7 CXCI
  text: Beholding the slaughter of the Panchalas in that battle by the illustrious Drona, and seeing his, weapons overwhelm all sides, fear entered the hearts of the Pandavas.
  modern: Seeing the Pāñcālas slaughtered in that battle by the illustrious Droṇa, and seeing his weapons overwhelm every side, fear entered the hearts of the Pāṇḍavas.
drona-7-191-9:
  ganguli: 7 CXCI
  text: Beholding the sons of Kunti afflicted with the shafts of Drona and inspired with fear, Kesava, endued with great intelligence and, devoted to their welfare, addressed Arjuna and said, ‘This foremost of all bowmen is incapable of being ever vanquished by force in battle, by the very gods with Vasava at their head.
  modern: 'Seeing the sons of Kuntī afflicted by Droṇa''s arrows and filled with fear, Keśava, who was very intelligent and devoted to their welfare, spoke to Arjuna: "This foremost of all bowmen can never be defeated by force in battle, even by the gods with Vāsava at their head.'
drona-7-191-10:
  ganguli: 7 CXCI
  text: (with drona-7-191-9)
drona-7-191-11:
  ganguli: 7 CXCI
  text: When, however, he lays aside his weapons, he becomes capable of being slain on the field even by human beings. Casting aside virtue, ye sons of Pandu, adopt now some contrivance for gaining the victory, so that Drona of the golden car may not slay us all in battle.
  modern: But when he lays aside his weapons, he can be killed on the field even by human beings. Set aside virtue, sons of Pāṇḍu, and adopt some contrivance to gain the victory, so that Droṇa of the golden chariot may not kill us all in battle.
drona-7-191-12:
  ganguli: 7 CXCI
  text: Upon the full of (his son) Aswatthaman he will cease to fight, I think. Let sonic man, therefore, tell him that Aswatthaman, hath been slain in battle.
  modern: I think he will stop fighting if Aśvatthāman falls. So let someone tell him that Aśvatthāman has been slain in battle."
drona-7-191-13:
  ganguli: 7 CXCI
  text: This advice, however, O kin was not approved by Kunti’s son, Dhananjaya. Others approved of it. But Yudhishthira accepted it with great difficulty.
  modern: This advice, O king, was not approved by Kuntī's son Dhanañjaya. Others approved of it. Yudhiṣṭhira accepted it, but only with great difficulty.
drona-7-191-14:
  ganguli: 7 CXCI
  text: Then the mighty-armed Bhima, O king, slew with a mace a foe-crushing, terrible and huge elephant named Aswatthaman, of his own army, belonging to Indravarman, the chief of the Malavas.
  modern: Then the mighty-armed Bhīma, O king, struck down with his mace a huge, terrible, foe-crushing elephant of his own army named Aśvatthāman, belonging to Indravarman, the chief of the Mālavas.
drona-7-191-15:
  ganguli: 7 CXCI
  text: Approaching Drona then in that battle with some bashfulness Bhimasena began to exclaim aloud, ‘Aswatthaman hath been slain.’ …
  modern: Approaching Droṇa in that battle with some shame, Bhīmasena called out loudly, "Aśvatthāman has been slain." …
drona-7-191-18:
  ganguli: 7 CXCI
  text: Hearing, therefore, of his slaughter, Drona did not become unmanned.
  modern: Hearing of his death, Droṇa was not unmanned.
drona-7-191-23:
  ganguli: 7 CXCI
  text: Filled with wrath and desirous of compassing the destruction of those brave Panchalas, that mighty car-warrior, that scorcher of foes, viz., Drona, dispelling all those shafts of the Panchalas, then invoked into existence the Brahma weapon.
  modern: Filled with wrath and wishing to destroy those brave Pāñcālas, that mighty chariot-warrior, scorcher of foes, Droṇa, scattering all those arrows of the Pāñcālas, then called into being the Brahmā weapon.
drona-7-191-31:
  ganguli: 7 CXCI
  text: Beholding Drona stationed on the field for the extermination of the Kshatriya race, the Rishis Viswamitra, and Jamadagni, and Bharadwaja, and Gautama, and Vasishtha, and Kasyapa, and Atri, and the Srikatas, the Prisnis, Garga, the Valkhilyas, the Marichis, the descendants of Bhrigu and Angiras, and diverse other sages of subtle forms quickly came thither, with the Bearer of sacrificial libations at their head, …
  modern: Seeing Droṇa stationed on the field for the extermination of the Kṣatriya race, the Rishis Viśvāmitra, Jamadagni, Bharadvāja, Gautama, Vasiṣṭha, Kaśyapa, Atri, the Śṛkatas, the Pṛśnis, Garga, the Vālakhilyas, the Marīcis, the descendants of Bhṛgu and Aṅgiras, and many other sages of subtle form quickly came there, with Agni, the bearer of sacrificial offerings, at their head. …
drona-7-191-34:
  ganguli: 7 CXCI
  text: … addressed Drona, that ornament of battle, and said, ‘Thou art fighting unrighteously. The hour of thy death is come. Laying aside thy weapons in battle, O Drona, behold us stationed here.
  modern: '… they spoke to Droṇa, that ornament of battle: "You are fighting unrighteously. The hour of your death has come. Lay aside your weapons in battle, O Droṇa, and look at us standing here.'
drona-7-191-36:
  ganguli: 7 CXCI
  text: Thou art versed in the Vedas and their branches. Thou art devoted to the duties enjoined by truth, especially, thou art a Brahmana. Such acts do not become thee.
  modern: You are versed in the Vedas and their branches. You are devoted to the duties that truth enjoins, and above all you are a Brāhmaṇa. Such acts do not become you.
drona-7-191-38:
  ganguli: 7 CXCI
  text: Thou hast, with the Brahma weapon, burnt men on earth that are unacquainted with weapons. This act that thou hast perpetrated, O regenerate one, is not righteous.
  modern: With the Brahmā weapon you have burned men on earth who knew nothing of weapons. This act you have done, O twice-born one, is not righteous.
drona-7-191-39:
  ganguli: 7 CXCI
  text: Lay aside thy weapons in battle without delay, O Drona, do not wait longer on earth. Do not, O regenerate one, perpetrate such a sinful act.
  modern: Lay aside your weapons in battle without delay, O Droṇa; do not wait longer on earth. Do not, O twice-born, commit such a sinful act."
drona-7-191-40:
  ganguli: 7 CXCI
  text: Hearing these words of their as also those spoken by Bhimasena, and beholding Dhrishtadyumna before him, Drona became exceedingly cheerless in battle.
  modern: Hearing these words of theirs and those Bhīmasena had spoken, and seeing Dhṛṣṭadyumna before him, Droṇa became very dejected in battle.
drona-7-191-41:
  ganguli: 7 CXCI
  text: Burning with grief and exceedingly afflicted, he enquired of Kunti’s son Yudhishthira as to whether his son (Aswatthaman) had been slain or not.
  modern: Burning with grief and greatly afflicted, he asked Kuntī's son Yudhiṣṭhira whether his son Aśvatthāman had been slain or not.
drona-7-191-42:
  ganguli: 7 CXCI
  text: Drona firmly believed that Yudhishthira would never speak an untruth even for the sake of the sovereignty of the three worlds.
  modern: Droṇa firmly believed that Yudhiṣṭhira would never speak an untruth, not even for sovereignty over the three worlds.
drona-7-191-43:
  ganguli: 7 CXCI
  text: For this reason, that bull among Brahmanas asked Yudhishthira and not any body else. He had hoped for truth from Yudhishthira from the latter’s infancy.
  modern: That is why that bull among Brāhmaṇas asked Yudhiṣṭhira and no one else. He had hoped for truth from Yudhiṣṭhira since Yudhiṣṭhira's childhood.
drona-7-191-44:
  ganguli: 7 CXCI
  text: Meanwhile, O monarch, Govinda, knowing that Drona, that foremost of warriors, was capable of sweeping all the Pandavas off the face of the earth, became much distressed.
  modern: Meanwhile, O monarch, Govinda, knowing that Droṇa, foremost of warriors, could sweep all the Pāṇḍavas off the face of the earth, became very distressed.
drona-7-191-46:
  ganguli: 7 CXCI
  text: Save us, then, from Drona. under such circumstances, falsehood is better than truth. By telling an untruth for saving a life, one is not touched by sin.
  modern: '"Save us, then, from Droṇa. In such circumstances falsehood is better than truth. One who tells an untruth to save a life is not touched by sin."'
drona-7-191-54:
  ganguli: 7 CXCI
  text: Fearing to utter an untruth, but earnestly desirous of victory, Yudhishthira distinctly said that Aswatthaman was dead, adding indistinctly the world elephant (after the name), Before this, Yudhishthira’s car had stayed at a height of four fingers’ breadth from the surface of the earth; after, however, he had said that untruth, his (vehicle and) animals touched the earth.
  modern: Afraid of uttering an untruth but eager for victory, Yudhiṣṭhira said clearly that Aśvatthāman was dead, adding indistinctly the word "elephant" after the name. Before this, Yudhiṣṭhira's chariot had stood four fingers' breadth above the ground; after he told that untruth, his chariot and horses touched the earth.
drona-7-191-55:
  ganguli: 7 CXCI
  text: (with drona-7-191-54)
drona-7-191-56:
  ganguli: 7 CXCI
  text: Hearing those words from Yudhishthira, the mighty car-warrior Drona, afflicted with grief, for the (supposed) death of his son, yielded to the influence of despair.
  modern: Hearing those words from Yudhiṣṭhira, the mighty chariot-warrior Droṇa, afflicted with grief over his son's supposed death, gave way to despair.
drona-7-193-36:
  ganguli: 7 CXCIII
  text: 'Then Bhima, of great wrath, holding the car of Drona, O monarch, slowly said these words unto him: If wretches amongst Brahmanas, discontented with the avocations of their own order, but well-versed in arms, did not fight, the Kshatriya order then would not have been thus exterminated.'
  modern: 'Then Bhīma, in great wrath, held Droṇa''s chariot, O monarch, and slowly said to him: "If wretched Brāhmaṇas, dissatisfied with the occupations of their own order, but skilled in arms, did not fight, the Kṣatriya order would not have been exterminated like this.'
drona-7-193-37:
  ganguli: 7 CXCIII
  text: (with drona-7-193-36)
drona-7-193-38:
  ganguli: 7 CXCIII
  text: Abstention from injury to all creatures hath been said to be the highest of all virtues. The Brahmana is the root of that virtue.
  modern: Non-injury to all creatures is said to be the highest of all virtues. The Brāhmaṇa is the root of that virtue.
drona-7-193-40:
  ganguli: 7 CXCIII
  text: Slaying all those Mlecchas and other warriors, who, however, are all engaged in the proper avocations of their order, moved thereto by ignorance and folly, O Brahmana, and by the desire of wealth for benefiting sons and wives; indeed, for the sake of an only son, why dost thou not feel ashamed? …
  modern: "You kill all those warriors, even Mlecchas, who are doing the proper work of their order, out of ignorance and folly, O Brāhmaṇa, and out of desire for wealth to benefit sons and wives. For the sake of one son, why are you not ashamed? …"
drona-7-193-44:
  ganguli: 7 CXCIII
  text: Thus addressed by Bhima, Drona laid aside his bow. Desirous of laying aside all his weapons also, Bharadwaja’s son of virtuous soul said aloud, …
  modern: Thus addressed by Bhīma, Droṇa laid aside his bow. Wishing to lay aside all his weapons, Bharadvāja's virtuous son said aloud, …
drona-7-193-47:
  ganguli: 7 CXCIII
  text: Laying aside his weapons then in that battle, and sitting down on the terrace of his car, he devoted himself to Yoga and assured all creatures, dispelling their fears.
  modern: Having laid aside his weapons in that battle, and sitting on the platform of his chariot, he devoted himself to Yoga and assured all creatures, dispelling their fears.
drona-7-193-54:
  ganguli: 7 CXCIII
  text: … remembering the puissant, supreme, and indestructible God of gods, the radiant Drona of high ascetic merit, the preceptor (of the Kurus and the Pandavas) repaired to heaven that is so difficult of being attained even by the pious.
  modern: … remembering the powerful, supreme, indestructible God of gods, the radiant Droṇa, of high ascetic merit, the preceptor of the Kurus and the Pāṇḍavas, went to heaven, which even the pious find hard to reach.
drona-7-194-43:
  ganguli: 7 CXCIII
  text: Of a dark complexion, with white locks hanging down to his ears, that old man of five and eighty years of age, used, for thy sake only, to career on the field of battle with the activity of a youth of sixteen.
  modern: Dark-complexioned, with white locks hanging to his ears, that old man of eighty-five years used to move on the battlefield, for your sake alone, with the energy of a sixteen-year-old.
drona-7-202-104:
  ganguli: 7 CCI
  text: Indeed, when, after the fall of Drona, the cheerless Kurus retired from the field, the Pandavas also, O monarch, caused their army to be withdrawn.
  modern: When the Kurus, dejected after Droṇa's fall, retired from the field, the Pāṇḍavas also, O monarch, withdrew their army.
karna-8-7-45:
  ganguli: 8 X
  text: Then, O monarch, all the kings headed by Duryodhana, desirous of victory, installed Karna in the command, according to the rites enjoined by the ordinance.
  modern: Then, O monarch, all the kings headed by Duryodhana, eager for victory, installed Karṇa in the command by the rites the ordinance requires.
karna-8-30-15:
  ganguli: 8 XXXVI
  text: Karna stood on that car, the reins of whose steeds were held by Shalya, stretching his formidable bow, like the Sun himself within a halo of circular light.
  modern: Karṇa stood on that chariot, whose horses' reins Śalya held, stretching his formidable bow, like the sun within a halo of circular light.
karna-8-43-79:
  ganguli: 8 XLVIII
  text: And the Kurus and the Pandavas once more fearlessly encountered each other, the former headed by the Suta’s son and the latter by Yudhishthira.
  modern: And the Kurus and the Pāṇḍavas met once more without fear, the Kurus led by the Sūta's son and the Pāṇḍavas by Yudhiṣṭhira.
karna-8-61-1:
  ganguli: 8 LIX
  text: Then commenced a terrible battle, making the hair to stand on end, between Karna and the Pandavas, that increased the population of Yama’s kingdom. After that furious battle, producing rivers of blood, had commenced …
  modern: Then a terrible battle began between Karṇa and the Pāṇḍavas, one to make the hair stand on end, and it filled Yama's kingdom with new people. After that furious battle, which made rivers of blood, had begun …
karna-8-86-13:
  ganguli: 8 LXXXII
  text: Stretching his Gandiva of loud twang and fiercely striking his palms with her bow-string, he suddenly created a darkness by means of his arrows and destroyed large numbers of men and steeds and cars and standards.
  modern: Stretching his Gāṇḍīva with its loud twang and striking his palms fiercely against the bowstring, he suddenly made a darkness of arrows and destroyed large numbers of men, horses, cars and standards.
karna-8-86-14:
  ganguli: 8 LXXXII
  text: The echoes (of that twang) travelled through the welkin. The birds, (no longer finding room in their own element), took shelter in the caverns of mountains.
  modern: The echoes of that twang travelled through the sky. The birds, finding no room in their own element, took shelter in the caves of the mountains.
karna-8-86-15:
  ganguli: 8 LXXXII
  text: Indeed, as the diadem-decked Partha, at that terrible moment, fell upon the foe, Bhimasena, that foremost of heroes, proceeded on his car behind that son of Pandu, protecting his rear. Those two princes then, on their cars, proceeded with great speed towards Karna, encountering their foes along the way.
  modern: As the diadem-decked Pārtha fell on the foe at that terrible moment, Bhīmasena, the foremost of heroes, drove his car behind that son of Pāṇḍu, guarding his rear. Those two princes then raced on their cars towards Karṇa, meeting their foes along the way.
karna-8-86-31:
  ganguli: 8 LXXXIII
  speaker: Sanjaya said,
  speakerModern: 'Sañjaya said:'
  text: Fighting fiercely, prince Duhshasana achieved the most difficult feats in that encounter. With a single shaft he cut off Bhima’s bow, and then with six shafts he pierced his foe’s driver. Having achieved those feats, the prince, endued with great activity, pierced Bhima himself with nine shafts.
  modern: Fighting fiercely, Prince Duḥśāsana did most difficult deeds in that encounter. With a single arrow he cut off Bhīma's bow, and then with six arrows he pierced his foe's charioteer. Having done this, the prince, very active, pierced Bhīma himself with nine arrows.
karna-8-87-8:
  ganguli: 8 LXXXIII
  text: Endued with great activity, Bhimasena then recollected, in the midst of that terrible battle and standing as he did amid many foremost warriors of the Kuru army, all the acts of hostility (done towards the Pandavas) by thy sons.
  modern: Then Bhīmasena, very active, remembered in the midst of that terrible battle, standing among many foremost warriors of the Kuru army, all the hostile acts your sons had done against the Pāṇḍavas.
karna-8-87-10:
  ganguli: 8 LXXXIII
  text: With that weapon, Bhimasena forcibly threw Duhshasana down from his car at a distance measured by the length of ten bows. Struck with the impetuous mace, Duhshasana, thrown down on the ground, began to tremble.
  modern: With that weapon, Bhīmasena threw Duḥśāsana down from his chariot with great force, to a distance of ten bow-lengths. Struck by the violent mace, Duḥśāsana lay on the ground and began to tremble.
karna-8-87-20:
  ganguli: 8 LXXXIII
  text: Having said this, Bhima of exceeding strength and great activity suddenly rushed, from desire of slaying Duhshasana. Like a lion of fierce impetuosity rushing towards a mighty elephant, Vrikodara, that foremost of heroes, rushed towards Duhshasana in that battle and attacked him in the very sight of Suyodhana and Karna.
  modern: Having said this, Bhīma, of exceeding strength and great energy, suddenly rushed forward, wanting to kill Duḥśāsana. Like a fiercely rushing lion attacking a mighty elephant, Vṛkodara, foremost of heroes, attacked Duḥśāsana in that battle, in full view of Suyodhana and Karṇa.
karna-8-87-27:
  ganguli: 8 LXXXIII
  text: Let all the warriors protect him (if they can).
  modern: Let all the warriors protect him, if they can."
karna-8-87-29:
  ganguli: 8 LXXXIII
  text: Drawing then his whetted sword of keen edge, and trembling with rage, he placed his foot upon the throat of Duhshasana, and ripping open the breast of his enemy stretched on the ground, quaffed his warm life-blood.
  modern: Drawing his keen, whetted sword, trembling with rage, he placed his foot on Duḥśāsana's throat, ripped open the breast of his enemy lying on the ground and drank his warm life-blood.
karna-8-87-30:
  ganguli: 8 LXXXIII
  text: Then throwing him down and cutting off, O king, with that sword the head of thy son, Bhima of great intelligence, desirous of accomplishing his vow, again quaffed his enemy’s blood little by little, as if for enjoying its taste.
  modern: Then he threw him down and cut off the head of your son with that sword, O king. Bhīma, of great intelligence, wishing to fulfill his vow, drank his enemy's blood again, little by little, as if to enjoy its taste.
karna-8-88-13:
  ganguli: 8 LXXXIII
  text: Indeed, bathed in blood, with blood flowing from his wounds, with face exceedingly red, filled with great wrath, Bhimasena endued with great activity, said these words, Ye heroes, that which I had vowed in respect of Duhshasana in battle, I have accomplished today. I will soon accomplish my other vow by slaying that second beast, viz., Duryodhana, in this sacrifice of battle.
  modern: 'Bathed in blood, with blood flowing from his wounds, his face deep red and filled with great wrath, Bhīmasena of great energy said these words: “Heroes, what I vowed in battle about Duḥśāsana, I have accomplished today. I will soon fulfil my other vow by killing that second beast, Duryodhana, in this sacrifice of battle.'
karna-8-88-16:
  ganguli: 8 LXXXIII
  text: Having said these words, Bhima, filled with great joy, drenched with blood, uttered loud shouts, even as the mighty and high-souled Indra of a 1,000 eyes had roared after slaying (the Asura) Vritra.
  modern: Having said this, Bhīma, overjoyed and drenched in blood, shouted loudly, as Indra of the thousand eyes had roared after slaying Vṛtra.
karna-8-88-25:
  ganguli: 8 LXXXIV
  text: Then, O king, great fear entered the heart of Karna at sight of Bhima’s prowess which resembled that of the Destroyer himself unto living creatures.
  modern: Then, O king, great fear entered Karṇa's heart at the sight of Bhīma's prowess, which was like that of Death himself toward living creatures.
karna-8-88-28:
  ganguli: 8 LXXXIV
  text: Afflicted with the fear of Bhimasena, these kings are all flying away. Exceedingly pained by the calamity that has befallen his brother Duhshasana in consequence of his blood having been quaffed by the high-souled Bhima, Duryodhana is stupefied!
  modern: Afflicted with fear of Bhīmasena, these kings are all fleeing. Duryodhana, deeply pained by the calamity that has befallen his brother Duḥśāsana, whose blood the high-souled Bhīma drank, is stupefied.
karna-8-88-30:
  ganguli: 8 LXXXIV
  text: Kripa and others, and those of the king’s brothers that are still alive, with afflicted hearts, their rage quelled by sorrow, are tending Duryodhana, sitting around him.
  modern: Kṛpa and the others, and those of the king's brothers who are still alive, their anger quelled by sorrow, are sitting around Duryodhana and tending him.
karna-8-88-32:
  ganguli: 8 LXXXIV
  text: For these reasons, O tiger among men, mustering all thy prowess and keeping the duties of a Kshatriya before thy eyes, proceed against Dhananjaya.
  modern: For these reasons, O tiger among men, gather all your prowess, keep a Kṣatriya's duties before your eyes, and go against Dhanañjaya.
karna-8-88-33:
  ganguli: 8 LXXXIV
  text: The entire burthen (of this battle) has been placed upon thee by the son of Dhritarashtra. O thou of mighty arms, bear that burthen to the best of thy power and might.
  modern: Dhṛtarāṣṭra's son has placed the entire burden of this battle on you. O mighty-armed one, bear that burden with all your power and might.
karna-8-88-34:
  ganguli: 8 LXXXIV
  text: In victory there will be great fame. In defeat, heaven is certain. There, O son of Radha, thy son, Vrishasena, filled with wrath at sight of the stupefaction that has overwhelmed thee, is rushing towards the Pandavas.
  modern: In victory there will be great fame. In defeat, heaven is certain. Look, O son of Rādhā, your son Vṛṣasena, enraged at seeing the stupor that has overwhelmed you, is rushing toward the Pāṇḍavas."
karna-8-88-35:
  ganguli: 8 LXXXIV
  text: Hearing these words of Shalya of immeasurable energy, Karna, reflecting, concluded unalterably that fighting had become unavoidable.
  modern: Hearing these words of Śalya of immeasurable energy, Karṇa reflected and concluded firmly that fighting was now unavoidable.
karna-8-91-2:
  ganguli: 8 LXXXVII
  text: Endued with great energy, with eyes red as copper from rage, Karna proceeded in the face of his foe, having summoned Dhananjaya to battle.
  modern: Full of energy, his eyes red as copper with rage, Karṇa drove at his foe, having challenged Dhanañjaya to battle.
karna-8-94-20:
  ganguli: 8 LXXXVIII
  text: Then Drona’s son, catching hold of Duryodhana’s hand, and adopting a soothing tone, addressed thy son, saying, Be gratified, O Duryodhana! Make peace with the Pandavas. There is no need for quarrel. Fie on war!
  modern: 'Then Droṇa''s son took Duryodhana''s hand and spoke to him soothingly: “Be at peace, O Duryodhana! Make peace with the Pāṇḍavas. There is no need for quarrel. Shame on war!'
karna-8-94-41:
  ganguli: 8 LXXXVIII
  text: The wicked-hearted Vrikodara, having slain Duhshasana like a tiger, spoke words that still dwell in my heart. Thou also heardest the same. How then can there be peace?
  modern: The wicked-hearted Vṛkodara, after killing Duḥśāsana like a tiger, spoke words that still dwell in my heart. You heard them too. How can there be peace?
karna-8-94-46:
  ganguli: 8 LXXXVIII
  text: Having with humility said these words repeatedly unto the preceptor’s son, thy son commanded his own troops, saying, “Armed with arrows, rush against and slay these foes. Why stand ye inactive?”
  modern: 'Having said these words humbly and more than once to the preceptor''s son, your son commanded his own troops: “Armed with arrows, rush at these foes and kill them. Why do you stand idle?”'
karna-8-97-5:
  ganguli: 8 XC
  text: While they were thus contending with each other in battle, sometimes the Suta’s son prevailed over his rival and sometimes the diadem-decked Partha prevailed over his, in prowess and weapons and lightness of hands.
  modern: While they fought, sometimes the Sūta's son prevailed over his rival, and sometimes diadem-wearing Pārtha prevailed over his, in prowess, in weapons and in lightness of hand.
karna-8-97-20:
  ganguli: 8 XC
  text: The Suta’s son then fixed on his bow-string that foe-killing, exceedingly keen, snake-mouthed, blazing, and fierce shaft, which had been polished according to rule, and which he had long kept for the sake of Partha’s destruction.
  modern: Then the Sūta's son fixed on his bowstring that foe-killing, exceedingly keen, snake-mouthed, blazing and fierce arrow, polished according to rule, which he had long kept for Pārtha's destruction.
karna-8-97-22:
  ganguli: 8 XC
  text: Sped from Karna’s arms, that shaft of awful whizz, resembling fire or the sun in splendour, as it left the bow-string, blazed up in the welkin and seemed to divide it by a line such as is visible on the crown of a woman dividing her tresses.
  modern: Shot from Karṇa's arms, that arrow of awful whizzing, bright as fire or the sun, blazed up in the sky as it left the bowstring and seemed to divide the sky with a line, like the parting on a woman's head.
karna-8-97-30:
  ganguli: 8 XC
  text: Beholding that shaft blazing in the welkin, the slayer of Kamsa, Madhava, with great speed and the greatest ease, pressed down with his feet that excellent car, causing it to sink about a cubit deep.
  modern: Seeing that arrow blazing in the sky, Madhava, slayer of Kaṃsa, with great speed and ease pressed down with his feet on that excellent chariot, making it sink about a cubit into the earth.
karna-8-97-30#2:
  ganguli: 8 XC
  text: (with karna-8-97-30)
karna-8-97-33:
  ganguli: 8 XC
  text: Endued with great activity, that wicked-natured snake of fierce form and false vows, falling upon that diadem-decked with gold and gems, swept it away from Arjuna’s head.
  modern: That wicked snake of fierce form and false vows, falling on Arjuna's diadem decked with gold and gems, swept it away from his head.
karna-8-97-96:
  ganguli: 8 XC
  text: Then Dhananjaya, filled with rage, inspiring with mantras another celestial weapons that looked like fire and that resembled the poison of the snake and that was as hard as the essence of adamant, and uniting the Raudra weapon with it, became desirous of shooting it at his foe.
  modern: Then Dhanañjaya, filled with rage, charged with mantras another celestial weapon that looked like fire, was like snake poison and was as hard as the essence of adamant, and joined the Raudra weapon to it, wishing to shoot it at his foe.
karna-8-97-97:
  ganguli: 8 XC
  text: At that time, O king, the earth swallowed up one of wheels of Karna’s car.
  modern: At that time, O king, the earth swallowed one of the wheels of Karṇa's chariot.
karna-8-97-100:
  ganguli: 8 XC
  text: Seeing his wheel swallowed, the son of Radha shed tears from wrath, and beholding Arjuna, filled with rage he said these words, “O Partha, O Partha, wait for a moment, that is, till I lift this sunken wheel.
  modern: Seeing his wheel swallowed, Rādhā's son shed tears of wrath, looked at Arjuna and said in rage, "O Pārtha, O Pārtha, wait a moment, until I lift this sunken wheel.
karna-8-97-101:
  ganguli: 8 XC
  text: Beholding, O Partha, the left wheel of my car swallowed through accident by the earth, abandon (instead of cherishing) this purpose (of striking and slaying me) that is capable of being harboured by only a coward. …
  modern: Seeing, O Pārtha, that the left wheel of my chariot has been swallowed by the earth by accident, give up this purpose of striking and killing me, which only a coward could hold. …
karna-8-97-106:
  ganguli: 8 XC
  text: Thou art the bravest of men in the world. Thou art also of righteous behaviour, O son of Pandu! Thou art well-acquainted with the rules of battle.
  modern: You are the bravest of men in the world. You are also of righteous conduct, O son of Pāṇḍu. You know well the rules of battle.
karna-8-98-1:
  ganguli: 8 XCI
  speaker: Sanjaya said,
  speakerModern: 'Sañjaya said:'
  text: Then Vasudeva, stationed on the car, addressed Karna, saying, “By good luck it is, O son of Radha, that thou rememberest virtue!
  modern: 'Then Vāsudeva, standing on the chariot, spoke to Karṇa: "It is good fortune, O son of Rādhā, that you remember virtue!'
karna-8-98-3:
  ganguli: 8 XCI
  text: Thyself and Suyodhana and Duhshasana and Shakuni, the son of Subala, had caused Draupadi, clad in a single piece of raiment, to be brought into the midst of the assembly.
  modern: You, Suyodhana, Duḥśāsana and Śakuni, son of Subala, had Draupadī brought into the middle of the assembly, wearing a single garment.
karna-8-98-4:
  ganguli: 8 XCI
  text: When at the assembly Shakuni, an adept in dice, vanquished Kunti’s son Yudhishthira who was unacquainted with it, whither had this virtue of thine gone?
  modern: When Śakuni, skilled at dice, defeated Yudhiṣṭhira, son of Kuntī, who did not know the game, in the assembly, where had your virtue gone?
karna-8-98-5:
  ganguli: 8 XCI
  text: When the period of exile into the woods was over as also the thirteenth year, thou didst not make over to the Pandavas their kingdom. Whither had this virtue of thine then gone?
  modern: When the period of exile in the woods was over, and the thirteenth year too, you did not give the Pāṇḍavas their kingdom. Where had your virtue gone then?
karna-8-98-6:
  ganguli: 8 XCI
  text: When the Kuru king (Duryodhana), acting under thy counsels, treated Bhimasena in that way with the aid of snakes and poisoned food, whither had this virtue of thine then gone?
  modern: When the Kuru king Duryodhana, on your advice, treated Bhīmasena like that, with snakes and poisoned food, where had your virtue gone then?
karna-8-98-7:
  ganguli: 8 XCI
  text: Thou didst set fire to the house of lac at Varanavata for burning to death the sleeping Pandavas. Whither then, O son of Radha, had this virtue of thine gone?
  modern: You set fire to the house of lac at Vāraṇāvata to burn the sleeping Pāṇḍavas to death. Where had your virtue gone then, O son of Rādhā?
karna-8-98-8:
  ganguli: 8 XCI
  text: Thou laughedest at Krishna while she stood in the midst of the assembly, scantily dressed because in her season and obedient to Duhshasana’s will, whither, then, O Karna, had this virtue of thine gone?
  modern: You laughed at Kṛṣṇā as she stood in the middle of the assembly, scantily dressed because she was in her season and in Duḥśāsana's power. Where had your virtue gone then, O Karṇa?
karna-8-98-9:
  ganguli: 8 XCI
  text: When from the apartment reserved for the females innocent Krishna was dragged, thou didst not interfere. Whither, O son of Radha, had this virtue of thine gone?
  modern: When innocent Kṛṣṇā was dragged from the women's apartment, you did not interfere. Where had your virtue gone then, O son of Rādhā?
karna-8-98-10:
  ganguli: 8 XCI
  text: Thyself addressing the princess Draupadi, that lady whose tread is as dignified as that of the elephant, in these words, viz., ‘The Pandavas, O Krishna, are lost. They have sunk into eternal hell. Do thou choose another husband!’ thou lookedest on the scene with delight.
  modern: You said to Princess Draupadī, whose tread is as stately as an elephant's, "The Pāṇḍavas are lost, O Kṛṣṇā. They have sunk into eternal hell. Choose another husband!" and you watched the scene with delight.
karna-8-98-11:
  ganguli: 8 XCI
  text: Covetous of kingdom and relying on the ruler of the Gandharvas, thou summonedest the Pandavas (to a match of dice). Whither then had this virtue of thine gone?
  modern: Greedy for the kingdom and relying on the ruler of the Gandhāras, you summoned the Pāṇḍavas to the dice match. Where had your virtue gone then?
karna-8-98-12:
  ganguli: 8 XCI
  text: When many mighty car-warriors, encompassing the boy Abhimanyu in battle, slew him, whither had this virtue of thine then gone?
  modern: When many mighty chariot-warriors surrounded the boy Abhimanyu in battle and slew him, where had your virtue gone then?
karna-8-98-16:
  ganguli: 8 XCI
  speaker: Sanjaya continued,
  speakerModern: 'Sañjaya continued:'
  text: Thus addressed, O Bharata, by Vasudeva, Karna hung down his head in shame and gave no answer.
  modern: Thus addressed by Vāsudeva, O Bhārata, Karṇa hung his head in shame and gave no answer.
karna-8-98-17:
  ganguli: 8 XCI
  text: With lips quivering in rage, he raised his bow, O Bharata, and, being endued with great energy and prowess, he continued to fight with Partha.
  modern: With lips quivering in rage, O Bhārata, he raised his bow and, with great energy and prowess, went on fighting Pārtha.
karna-8-98-26:
  ganguli: 8 XCI
  text: The Suta’s son then, for slaying the son of Pandu, took up a terrible arrow blazing like fire.
  modern: The Sūta's son then took up a terrible arrow, blazing like fire, to kill the son of Pāṇḍu.
karna-8-98-31:
  ganguli: 8 XCI
  text: That grinder of foes, viz., the high-souled Vibhatsu, thus deeply pierced in that encounter, began to reel. His grasp became loosened, at which his bow Gandiva dropped from his hand. He trembled like the prince of mountains in an earthquake.
  modern: That grinder of foes, the high-souled Bībhatsu, deeply pierced in that encounter, began to reel. His grip loosened and his bow Gāṇḍīva dropped from his hand. He trembled like the king of mountains in an earthquake.
karna-8-98-32:
  ganguli: 8 XCI
  text: Availing himself of that opportunity, the mighty car-warrior Vrisha, desirous of extricating his car-wheel that had been swallowed up by the earth, jumped down from his vehicle. Seizing the wheel with his two arms he endeavoured to drag it up, but though possessed of great strength, he failed in his efforts, as destiny would have it.
  modern: Taking that opportunity, the mighty chariot-warrior Vṛṣa jumped down from his chariot, wanting to pull out the wheel that the earth had swallowed. He seized the wheel with both arms and tried to drag it up, but though very strong he failed, as destiny would have it.
karna-8-98-33:
  ganguli: 8 XCI
  text: Meanwhile the diadem-decked and high-souled Arjuna, recovering his senses, took up a shaft, fatal as the rod of Death, and called anjalika.
  modern: Meanwhile the high-souled, diadem-wearing Arjuna recovered his senses and took up an arrow, fatal as the rod of Death, called an añjalika.
karna-8-98-34:
  ganguli: 8 XCI
  text: Then Vasudeva, addressing Partha, said, “Cut off with thy arrow the head of this enemy of thine, viz., Vrisha, before he succeeds in getting upon his car.” Applauding those words of the lord Vasudeva, and while the wheel of his enemy was still sunk, the mighty car-warrior Arjuna took up a razor-headed arrow of blazing effulgence and struck the standard (of Karna) bearing the elephant’s rope and bright as the spotless sun.
  modern: Then Vāsudeva said to Pārtha, "Cut off with your arrow the head of this enemy, Vṛṣa, before he gets back on his chariot." Applauding the lord Vāsudeva's words, while the enemy's wheel was still sunk, the mighty chariot-warrior Arjuna took up a razor-headed arrow of blazing brilliance and struck Karṇa's standard, which bore the elephant's rope and shone like the spotless sun.
karna-8-98-50:
  ganguli: 8 XCI
  text: Indeed, O king, with that excellent Anjalika weapon inspired with mantras into a mighty weapon, the son of Indra cut off the head of Vaikartana in the afternoon.
  modern: With that excellent añjalika weapon, charged with mantras into a mighty weapon, the son of Indra cut off Vaikartana's head in the afternoon, O king.
karna-8-100-25:
  ganguli: 8 XCIV
  text: The blare of pancajanya and that of devadatta filled the earth, the sky, and heaven.
  modern: The blare of Pāñcajanya and Devadatta filled the earth, the sky and heaven.
karna-8-101-1:
  ganguli: 8 XCV
  speaker: Sanjaya said,
  speakerModern: 'Sañjaya said:'
  text: Upon the fall of Karna otherwise called Vaikartana, the Kauravas, afflicted with fear, fled away on all sides, casting their eyes on empty space.
  modern: "When Karṇa, also called Vaikartana, had fallen, the Kauravas, afflicted with fear, fled in all directions, looking around at empty space."
shalya-9-3-2:
  ganguli: 9 III
  text: After the Suta’s son had been slain by the illustrious son of Pandu, and after thy troops had been repeatedly rallied and had repeatedly fled away, and after a terrible carnage had taken place, O foremost of men, of human beings in battle subsequent to Karna’s death, Partha began to utter leonine roars.
  modern: After the Sūta's son had been slain by the famous son of Pāṇḍu, after your troops had been rallied again and again and had fled again and again, and after a terrible slaughter had taken place, O foremost of men, Pārtha began to roar like a lion.
shalya-9-3-3:
  ganguli: 9 IV
  text: Beholding the fallen boxes of cars, … witnessing also the prowess of Partha after the retreat of thy son with grief-stricken heart and when thy troops, filled with anxiety and fallen into great distress, O Bharata, were deliberating as to what they should next do, …
  modern: Seeing … the prowess of Pārtha after your son had withdrawn with a grief-stricken heart, and while your troops, anxious and in great distress, O Bhārata, were deliberating what to do next, …
shalya-9-3-13:
  ganguli: 9 IV
  text: They upon whom we had rested all burdens of sovereignty we had been enjoying, have all gone to regions of blessedness attainable by persons conversant with Brahma, casting off their bodies.
  modern: Those on whom we rested all the burdens of the sovereignty we have been enjoying have cast off their bodies and gone to the blessed regions that those who know Brahman attain.
shalya-9-3-41:
  ganguli: 9 IV
  text: We are now inferior to the sons of Pandu as regards the strength of our army. Therefore, O lord, I think, peace with the Pandavas is for our good.
  modern: We are now weaker than the sons of Pāṇḍu in the strength of our army. So, my lord, I think peace with the Pāṇḍavas is right for us.
shalya-9-4-27:
  ganguli: 9 V
  text: This is not the time for acting like a eunuch. On the other hand, that is time for the battle.
  modern: This is not the time to act like a eunuch. It is the time for battle.
shalya-9-4-45:
  ganguli: 9 V
  text: If, having caused my friends and brothers and grandsires to be slain, I save my own life, the world will without doubt, censure me.
  modern: If, after causing my friends, brothers and grandsires to be slain, I save my own life, the world will surely blame me.
shalya-9-4-46:
  ganguli: 9 V
  text: What kind of sovereignty will that be which I will enjoy, destitute of kinsmen and friends and well-wishers, and bowing down unto the son of Pandu?
  modern: What kind of sovereignty would it be that I enjoyed, deprived of kinsmen, friends and well-wishers, and bowing down to the son of Pāṇḍu?
shalya-9-4-48:
  ganguli: 9 V
  text: Thus addressed by Duryodhana, all the Kshatriyas there applauded that speech and cheered the king, saying, “Excellent, Excellent.”
  modern: Thus addressed by Duryodhana, all the Kṣatriyas there applauded his speech and cheered the king, saying, "Excellent, excellent!"
shalya-9-6-14:
  ganguli: 9 VII
  text: Thus addressed (by Shalya), king Duryodhana cheerfully poured sanctified water, without losing any time, O best of the Bharatas, on the ruler of the Madras, in the midst of his troops, according to the rites ordained in the scriptures, O monarch.
  modern: Thus addressed by Śalya, King Duryodhana cheerfully poured sanctified water on the ruler of the Madras, at once, O best of the Bhāratas, in the midst of his troops, according to the rites laid down in the scriptures, O monarch.
shalya-9-7-44:
  ganguli: 9 VIII
  text: Then commenced a fierce and terrible battle between thy troops and the enemy, the combatants being all engaged in striking and slaughtering one another.
  modern: Then a fierce and terrible battle began between your troops and the enemy, the fighters all striking and slaughtering one another.
shalya-9-15-47:
  ganguli: 9 XVI
  text: Then Yudhishthira, excited with rage, rushed against the ruler of the Madras, himself urging his steeds white as ivory and fleet as thought.
  modern: Then Yudhiṣṭhira, excited with rage, rushed at the ruler of the Madras, himself urging on his horses, white as ivory and swift as thought.
shalya-9-15-48:
  ganguli: 9 XVI
  text: We then saw something that was wonderful in Yudhishthira, the son of Kunti, for though very mild and soft, he then became exceedingly fierce.
  modern: 'We then saw something wonderful in Yudhiṣṭhira, the son of Kuntī: though very mild and soft, he now became exceedingly fierce.'
shalya-9-16-42:
  ganguli: 9 XVII
  text: Having carefully inspired it with many fierce mantras, and endued it with terrible velocity by the exercise of great might and great care, king Yudhishthira hurled it along the best of tracks for the destruction of the ruler of the Madras.
  modern: Having carefully charged it with many fierce mantras and given it terrible speed by great strength and great care, King Yudhiṣṭhira hurled it along the best of paths to destroy the ruler of the Madras.
shalya-9-16-50:
  ganguli: 9 XVII
  text: Stretching his arms, the ruler of the Madras fell down on the Earth, with face directed towards king Yudhishthira the just, like a tall banner erected to the honour of Indra falling down on the ground. Like a dear wife advancing to receive her dear lord about to fall on her breast, the Earth then seemed, from affection, to rise a little for receiving that bull among men as he fell down with mangled limbs bathed in blood.
  modern: Stretching out his arms, the ruler of the Madras fell to the ground, his face towards King Yudhiṣṭhira the just, like a tall banner raised in honour of Indra falling down. As he fell with his limbs mangled and bathed in blood, the Earth seemed, out of love, to rise a little to receive that bull among men, like a dear wife going to meet her dear lord as he falls on her breast.
shalya-9-25-3:
  ganguli: 9 XXVI
  speaker: Sanjaya said,
  speakerModern: 'Sañjaya said:'
  text: After that elephant-division had been destroyed, O Bharata, by the son of Pandu, and while thy army was being thus slaughtered by Bhimasena in battle, beholding the latter, that chastiser of foes, careering like the all-killing Destroyer himself in rage armed with his club, the remnant of thy unslaughtered sons, those uterine brothers, O king, united together at that time when he of Kuru’s race, thy son Duryodhana, could not be seen, and rushed against Bhimasena.
  modern: After that elephant division had been destroyed by the son of Pāṇḍu, and while your army was being slaughtered by Bhīmasena in battle, the rest of your unslain sons, the brothers by the same mother, O king, seeing him move like the all-killing Destroyer himself, in rage, with his club, joined together at a time when your son Duryodhana could not be seen, and rushed at Bhīmasena.
shalya-9-25-5:
  ganguli: 9 XXVI
  text: They were Durmarshana and Srutanta and Jaitra and Bhurivala and Ravi, and Jayatsena and Sujata and that slayer of foes, Durvishaha, and he called Durvimochana, and Dushpradharsha and the mighty-armed Srutarvan.
  modern: They were Durmarṣaṇa, Śrutānta, Jaitra, Bhūribala and Ravi, Jayatsena, Sujāta and the slayer of foes Durviṣaha, and the one called Durvimocana, Duṣpradharṣa and the mighty-armed Śrutarvan.
shalya-9-25-37:
  ganguli: 9 XXVI
  text: Indeed, Bhimasena, the son of Kunti, having slain thy sons in battle, regarded his object achieved, O lord, and the purpose of his birth accomplished.
  modern: Having slain your sons in battle, Bhīmasena, son of Kuntī, considered his purpose achieved, O lord, and the purpose of his birth fulfilled.
shalya-9-27-46:
  ganguli: 9 XXVIII
  text: Recollecting, O king, that Shakuni, who had fallen to his share, was still alive, Sahadeva, on his car adorned with gold, pursued that warrior.
  modern: Remembering, O king, that Śakuni, who had fallen to his share, was still alive, Sahadeva pursued that warrior on his gold-adorned chariot.
shalya-9-27-48:
  ganguli: 9 XXVIII
  text: Stringing his formidable bow and drawing it with great force, Sahadeva, filled with rage, pursued the son of Subala and vigorously struck him with many shafts equipped with vulturine feathers and whetted on stone, even like a person striking a mighty elephant with pointed lances. Endued with great energy of mind, Sahadeva, having afflicted his foe thus, addressed him, as if for calling back to mind (his past misdeeds), in these words, ‘Adhering to the duties of a Kshatriya, fight (with me) and be a man!
  modern: 'Stringing his formidable bow and drawing it with great force, Sahadeva, full of rage, pursued the son of Subala and struck him vigorously with many stone-sharpened arrows with vulture feathers, like a man striking a mighty elephant with pointed lances. Having hurt his foe in this way, Sahadeva, of great mental energy, spoke to him as if to call his past misdeeds to mind: "Keep to the duties of a Kṣatriya, fight me, and be a man!'
shalya-9-27-49:
  ganguli: 9 XXVIII
  text: Thou hadst, O fool, rejoiced greatly in the midst of the assembly, while gambling with dice! Receive now, O thou of wicked understanding, the fruit of that act!
  modern: You rejoiced greatly, you fool, in the middle of the assembly, gambling with dice! Now receive the fruit of that act, you of wicked understanding!
shalya-9-27-58:
  ganguli: 9 XXVIII
  text: The son of Madri, however, with three broad-headed arrows, simultaneously cut off, without losing a moment, that uplifted lance as also the two well-rounded arms of his enemy at the van of battle, and then uttered a loud roar.
  modern: The son of Mādrī, though, in the same moment, with three broad-headed arrows, cut off that raised lance and also the two well-rounded arms of his enemy at the head of the battle, and then gave a loud roar.
shalya-9-27-59:
  ganguli: 9 XXVIII
  text: Endued with great activity, the heroic Sahadeva then, with a broad-headed arrow, made of hard iron, equipped with wings of gold, capable of penetrating every armour, and sped with great force and care, cut off from his trunk his enemy’s head.
  modern: Then the heroic Sahadeva, very active, with a broad-headed arrow of hard iron, fitted with gold wings and able to pierce any armor, shot with great force and care, cut his enemy's head from his trunk.
shalya-9-27-61:
  ganguli: 9 XXVIII
  text: Indeed, the son of Pandu, filled with rage, struck off that head which was the root of the evil policy of the Kurus, with that impetuous shaft winged with gold and whetted on stone.
  modern: The son of Pāṇḍu, filled with rage, struck off that head, which was the root of the Kurus' evil policy, with that swift, gold-winged, stone-whetted arrow.
shalya-9-28-15:
  ganguli: 9 XXIX
  text: Eleven Akshauhinis, O Bharata, of troops had been assembled for thy son! All those, O lord, were slain by the Pandus and the Srinjayas!
  modern: Eleven akṣauhiṇīs of troops had been assembled for your son, O Bhārata! All of those, O lord, were slain by the Pāṇḍavas and the Sṛñjayas!
shalya-9-28-16:
  ganguli: 9 XXIX
  text: Amongst those thousands upon thousands of high-souled kings on thy side, only Duryodhana now, O monarch, exceedingly wounded, was seen to be alive, casting his eyes on all sides, and seeing the earth empty, himself destitute of all his troops while the Pandavas, filled with joy in that battle, were roaring aloud in consequence of the accomplishment of all their objects.
  modern: Of those thousands upon thousands of high-souled kings on your side, only Duryodhana now, O monarch, badly wounded, was seen alive, looking around in every direction and seeing the earth empty, himself without any troops, while the Pāṇḍavas, filled with joy, roared aloud because all their aims were achieved.
shalya-9-28-19:
  ganguli: 9 XXIX
  text: Duryodhana, O monarch, unable to endure the whiz of the shafts shot by those high-souled heroes, became stupefied! Destitute of troops and animals, he set his heart on retreat from the field.
  modern: Duryodhana, O monarch, unable to bear the whizzing of the arrows shot by those high-souled heroes, became stupefied. Without troops or animals, he set his heart on leaving the field.
shalya-9-29-7:
  ganguli: 9 XXIX
  text: That lord of eleven Akshauhinis, thy son Duryodhana, of great energy, taking up his mace, fled on foot towards a lake.
  modern: That lord of eleven Akṣauhiṇīs, your son Duryodhana, of great energy, took up his mace and fled on foot towards a lake.
shalya-9-29-8:
  ganguli: 9 XXIX
  text: Before he had proceeded far on foot, the king recalled the words of the intelligent and virtuous Vidura.
  modern: Before he had gone far on foot, the king remembered the words of the wise and virtuous Vidura.
shalya-9-29-9:
  ganguli: 9 XXIX
  text: Without doubt, this had been foreseen by Vidura of great wisdom, this great carnage of Kshatriyas and of ourselves in battle.
  modern: Without doubt, wise Vidura had foreseen this great slaughter of the Kṣatriyas and of ourselves in battle.
shalya-9-29-10:
  ganguli: 9 XXIX
  text: Reflecting on this, the king, with heart burning in grief at having witnessed the extermination of his army, desired to penetrate into the depths of that lake.
  modern: Thinking this over, the king, his heart burning with grief at the destruction of his army, wished to plunge into the depths of that lake.
shalya-9-30-60:
  ganguli: 9 XXX
  text: Possessed of great valour, king Yudhishthira the just, O monarch, arrived at the lake known by the name of Dvaipayana within which Duryodhana then was.
  modern: King Yudhiṣṭhira the just, of great valor, O monarch, arrived at the lake called Dvaipāyana, in which Duryodhana was then hiding.
shalya-9-31-16:
  ganguli: 9 XXXI
  speaker: Sanjaya continued,
  speakerModern: 'Sañjaya continued:'
  text: Thus addressed by Vasudeva, Pandu’s son of rigid vows, smiling the while, addressed, O monarch, thy son of great might, who, O Bharata, was then within the waters of that lake, saying, “Why, O Suyodhana, hast thou entered these waters, after having caused all the Kshatriyas to perish and after having, O king, caused thy own race to be annihilated?
  modern: 'Thus addressed by Vāsudeva, Pāṇḍu''s son of firm vows smiled and spoke to your mighty son, O monarch, who was then in the waters of that lake: "Why, O Suyodhana, have you entered these waters, after causing all the Kṣatriyas to perish and your own race to be destroyed?'
shalya-9-31-17:
  ganguli: 9 XXXI
  text: Why hast thou entered into this lake today, wishing to save thy own life?
  modern: Why have you entered this lake today, wishing to save your own life?
shalya-9-31-18:
  ganguli: 9 XXXI
  text: Arise, O king, and fight us, O Suyodhana!
  modern: Rise, O king, and fight us, O Suyodhana!
shalya-9-31-19:
  ganguli: 9 XXXI
  text: Where, O foremost of men, hath that pride and that sense of honour which thou hadst now gone, since, O king, thou hast enchanted these waters and art now lying within them? …
  modern: Where has that pride of yours gone, and that sense of honor, O foremost of men, now that you have enchanted these waters and lie hidden in them? …
shalya-9-31-21:
  ganguli: 9 XXXI
  text: Arise, O king, and fight, for thou art a Kshatriya born of a noble race! Thou art Kauraveya in particular! Remember thy birth!
  modern: Rise, O king, and fight, for you are a Kṣatriya born of a noble race. You are a Kauraveya in particular. Remember your birth!
shalya-9-31-39:
  ganguli: 9 XXXI
  text: As regards myself, however, O Bharata, I have not fled from the field of battle actuated by the fear of life! …
  modern: As for me, O Bhārata, I did not flee from the battlefield out of fear for my life. …
shalya-9-31-46:
  ganguli: 9 XXXI
  text: There is, however, no longer any need for battle when Drona and Karna have been quieted and when our grandsire Bhishma hath been slain!
  modern: But there is no longer any need for battle, now that Droṇa and Karṇa have been silenced and our grandsire Bhīṣma has been slain.
shalya-9-31-49:
  ganguli: 9 XXXI
  text: Clad in deer-skins I would retire into the woods! I have no desire for kingdom, deprived as I am of friends and allies, O Bharata!
  modern: Dressed in deerskins I would go into the woods. I have no desire for the kingdom, deprived as I am of friends and allies, O Bhārata.
shalya-9-31-50:
  ganguli: 9 XXXI
  text: Reft almost entirely of friends and allies, of heroes and elephants, this earth exists for thee, O king! Do thou enjoy her now cheerfully!
  modern: This earth, almost bereft of friends and allies, of heroes and elephants, is yours, O king. Enjoy her now with an easy mind.
shalya-9-31-59:
  ganguli: 9 XXXI
  text: Why, O king, didst thou not then give us the earth when we, observant of the rules of righteousness and desirous of the welfare of our race, had begged thee for our portion? Having first refused the request of the mighty Krishna, why dost thou now desire to give away the earth?
  modern: Why did you not give us the earth then, when we, keeping to righteousness and wishing the welfare of our family, begged you for our share? Having first refused the request of mighty Kṛṣṇa, why do you now wish to give the earth away?
shalya-9-31-64:
  ganguli: 9 XXXI
  text: Thou didst not formerly agree to give me even that much of the earth which would be covered by the point of a needle! How then, O monarch, dost thou make me a gift of the whole earth? How is it that thou, who couldst not formerly abandon even that much of land which the point of a needle would cover, now wishest to abandon the whole earth?
  modern: You would not agree before to give even as much land as the point of a needle would cover. How, O monarch, can you now give me the whole earth? How is it that you, who could not give up even that much land, now wish to give up the whole earth?
shalya-9-31-70:
  ganguli: 9 XXXI
  text: Thou hadst at one time especially endeavoured to burn us to death and to take our lives by means of snakes and other kinds of poison and by drowning us!
  modern: You once made special efforts to burn us to death and to take our lives with snakes and other poisons and by drowning us!
shalya-9-31-71:
  ganguli: 9 XXXI
  text: We were also wronged by thee, O king, by the deprivation of our kingdom, by the cruel words spoken by thee, and by thy maltreatment of Draupadi! For these reasons, O wretch, thy life must be taken!
  modern: You also wronged us, O king, by taking our kingdom, by the cruel words you spoke, and by your ill-treatment of Draupadī! For these reasons, wretch, your life must be taken!
shalya-9-32-38:
  ganguli: 9 XXXII
  text: Agitating the waters with great force, that valiant warrior rose like a prince of elephants from within the lake, breathing heavily in rage, and armed with his heavy mace that was endued with the strength of adamant and decked with gold. Piercing the solidified waters, thy son rose, shouldering his mace of iron, like the sun himself scorching everything with his rays.
  modern: Churning the waters with great force, that valiant warrior rose from the lake like a prince of elephants, breathing hard in rage, armed with his heavy mace of adamant, decked with gold. Piercing the solidified waters, your son rose with his iron mace on his shoulder, like the sun scorching everything with his rays.
shalya-9-32-48:
  ganguli: 9 XXXII
  text: Rising from the water, thy son Duryodhana stood there, armed with mace, and with limbs bathed in blood.
  modern: Rising from the water, your son Duryodhana stood there, armed with his mace, his limbs bathed in blood.
shalya-9-32-52:
  ganguli: 9 XXXII
  speaker: Duryodhana said,
  speakerModern: 'Duryodhana said:'
  text: You will have, O Yudhishthira, to encounter me one at a time!
  modern: You will have, O Yudhiṣṭhira, to meet me one at a time!
shalya-9-32-53:
  ganguli: 9 XXXII
  text: It is not proper, that one hero should fight with many at the same time, especially when that single warrior is divested of armour, fatigued with exertion, covered with water, exceedingly mangled in limbs, and without cars, animals and troops!
  modern: It is not right that one hero should fight many at the same time, especially when that one has no armour, is tired from exertion, is soaked with water, is badly wounded in his limbs and has no cars, animals or troops!
shalya-9-32-58:
  ganguli: 9 XXXII
  text: If this be your duty, that one should never be slain by many, why is it then that Abhimanyu was slain by many, acting in accord with thy counsels?
  modern: If this be your rule, that one should never be killed by many, why was Abhimanyu killed by many, acting on your counsel?
shalya-9-32-59:
  ganguli: 9 XXXII
  text: All creatures, when in difficulty forget considerations of virtue. They then view the gates of the other world to be closed.
  modern: All creatures, when in difficulty, forget considerations of virtue. They then see the gates of the other world closed.
shalya-9-32-61:
  ganguli: 9 XXXII
  text: This another wish of thine, O hero, I grant thee in addition, that if thou canst slay him amongst the five Pandavas with whom thou wishest an encounter, thou shalt then be king!
  modern: 'I grant you this other wish, O hero, in addition: if you can kill whichever of the five Pāṇḍavas you wish to fight, you shall then be king!'
shalya-9-32-62:
  ganguli: 9 XXXII
  text: Otherwise, slain (by him), thou shalt proceed to heaven! Except thy life, O hero, tell us what boon we may grant thee.
  modern: Otherwise, slain by him, you shall go to heaven. Except for your life, O hero, tell us what boon we may grant you.
shalya-9-33-31:
  ganguli: 9 XXXIII
  text: Then Bhima of terrible might addressed Yudhishthira, who was staying amid the Srinjayas like the blazing sun himself, saying, “Encountering this one in battle, I venture to fight with him!
  modern: 'Then terribly mighty Bhīma spoke to Yudhiṣṭhira, who stood among the Sṛñjayas like the blazing sun: "I will fight this one in battle.'
shalya-9-33-32:
  ganguli: 9 XXXIII
  text: This wretch among men is not competent to vanquish me in fight!
  modern: This wretch among men cannot defeat me in a fight.
shalya-9-33-36:
  ganguli: 9 XXXIII
  text: Today king Dhritarashtra also, hearing of his son’s slaughter, will remember all those wrongs (that he did unto us) arising from the suggestions of Shakuni!
  modern: Today King Dhṛtarāṣṭra too, hearing of his son's slaughter, will remember all the wrongs he did us at Śakuni's suggestion!
shalya-9-57-27:
  ganguli: 9 LVI
  text: Today king Dhritarashtra also, hearing of the fall of his son, shall recollect all those evil acts that were born of Shakuni’s brain!
  modern: Today King Dhṛtarāṣṭra, hearing of his son's fall, will recall all those evil deeds that came from Śakuni's brain!"
shalya-9-58-20:
  ganguli: 9 LVII
  text: Both accomplished in encounters with the mace, Bhima and Duryodhana thus careered and fought, and struck each other.
  modern: Both skilled in combat with the mace, Bhīma and Duryodhana moved about like this, fighting and striking each other.
shalya-9-59-26:
  ganguli: 9 LVIII
  text: While the king and Bhima careered in beautiful circles, their maces clashed, and sparks of fire were generated by those repeated clashes.
  modern: While the king and Bhīma moved in beautiful circles, their maces clashed, and those repeated clashes threw off sparks of fire.
shalya-9-59-44:
  ganguli: 9 LVIII
  text: Bhimasena fully understood the intentions of his adversary. Rushing, therefore, at him, with a loud leonine roar, …
  modern: Bhīmasena understood his enemy's intention completely. So he rushed at him with a loud roar like a lion's, …
shalya-9-59-45:
  ganguli: 9 LVIII
  text: Rushing, therefore, at him, with a loud leonine roar, he fiercely hurled his mace at the thighs of the Kuru king as the latter had jumped up for baffling the first aim.
  modern: Rushing at him with a loud lion's roar, he fiercely hurled his mace at the thighs of the Kuru king as the latter jumped up to dodge the first aim.
shalya-9-59-47:
  ganguli: 9 LVIII
  text: That mace, endued with the force of the thunder and hurled by Bhima of terrible feats, fractured the two handsome thighs of Duryodhana. That tiger among men, thy son, after his thighs had been broken by Bhimasena, fell down, causing the earth to echo with his fall.
  modern: That mace, with the force of thunder, hurled by Bhīma of terrible deeds, broke the two handsome thighs of Duryodhana. That tiger among men, your son, his thighs broken by Bhīmasena, fell, and the earth echoed with his fall.
shalya-9-60-3:
  ganguli: 9 LIX
  text: Having struck Duryodhana down, the valiant Bhimasena, approaching the Kuru chief, addressed him, saying, …
  modern: Having struck Duryodhana down, the valiant Bhīmasena went up to the Kuru chief and spoke to him, …
shalya-9-60-5:
  ganguli: 9 LIX
  text: Having said these words, he touched the head of his fallen foe with his left foot. Indeed, he struck the head of that lion among kings with his foot.
  modern: Having said these words, he touched the head of his fallen foe with his left foot. Indeed, he struck the head of that lion among kings with his foot.
shalya-9-60-14:
  ganguli: 9 LIX
  text: While Vrikodara, after having struck down thy son, was thus bragging and dancing madly, king Yudhishthira addressed him, saying, …
  modern: While Vṛkodara, having struck down your son, was boasting and dancing wildly like this, King Yudhiṣṭhira spoke to him, …
shalya-9-60-15:
  ganguli: 9 LIX
  text: Thou hast paid off thy hostility (towards Duryodhana) and accomplished thy vow by a fair or an unfair act! Cease now, O Bhima!
  modern: You have paid off your hostility towards Duryodhana and fulfilled your vow by a fair or an unfair act! Stop now, O Bhīma!
shalya-9-60-16:
  ganguli: 9 LIX
  text: Do not crush his head with thy foot! Do not act sinfully! Duryodhana is a king! He is, again, thy kinsman! He is fallen! This conduct of thine, O sinless one, is not proper.
  modern: Do not crush his head with your foot! Do not act sinfully! Duryodhana is a king! He is also your kinsman! He is fallen! This conduct of yours, O sinless one, is not proper.
shalya-9-60-21:
  ganguli: 9 LIX
  text: Having said these words unto Bhimasena, Yudhishthira, with voice choked in tears, and afflicted with grief, approached Duryodhana, that chastiser of foes, and said unto him, “O sire, thou shouldst not give way to anger nor grieve for thyself.
  modern: After saying these words to Bhīmasena, Yudhiṣṭhira, his voice choked with tears and afflicted with grief, went up to Duryodhana, chastiser of foes, and said to him, "O sire, you should not give way to anger or grieve for yourself.
shalya-9-60-24:
  ganguli: 9 LIX
  text: Through thy own fault this great calamity has come upon thee, due to avarice and pride and folly, O Bharata! Having caused thy companions and brothers and sires and sons and grandsons and others to be all slain, thou comest now by thy own death. In consequence of thy fault, thy brothers, mighty car-warriors all, and thy kinsmen have been slain by us.
  modern: This great calamity has come on you through your own fault, out of greed, pride and folly, O Bhārata. You caused your companions, brothers, fathers, sons, grandsons and others to be slain, and now you come to your own death. Through your fault, your brothers, all mighty chariot-warriors, and your kinsmen were slain by us.
shalya-9-60-27:
  ganguli: 9 LIX
  text: It is we that deserve to be pitied in every respect, O Kaurava! We shall have to drag on a miserable existence, reft of all our dear friends and kinsmen.
  modern: It is we who deserve pity in every respect, O Kaurava. We shall have to drag out a wretched existence, deprived of all our dear friends and kinsmen.
shalya-9-62-22:
  ganguli: 9 LXI
  text: Mount your cars quickly, ye kings, for we should leave this place! By good luck, this sinful wretch hath been slain with his counsellors and kinsmen and friends!
  modern: Mount your cars quickly, kings, for we should leave this place! By good luck, this sinful wretch has been killed with his counsellors, kinsmen and friends!
shalya-9-62-23:
  ganguli: 9 LXI
  text: Hearing these rebukes from Krishna, king Duryodhana, O monarch, gave way to wrath and endeavoured to rise.
  modern: Hearing these rebukes from Kṛṣṇa, King Duryodhana, O monarch, gave way to wrath and tried to rise.
shalya-9-62-24:
  ganguli: 9 LXI
  text: Sitting on his haunches and supporting himself on his two arms, he contracted his eyebrows and cast angry glances at Vasudeva.
  modern: Sitting on his haunches and propping himself on his two arms, he knit his brows and cast angry glances at Vāsudeva.
shalya-9-62-28:
  ganguli: 9 LXI
  text: Dost thou think I did not mark it when Arjuna (acting under thy advice) hinted it to Bhima? Having caused thousands of kings, who always fought fairly, to be slain through diverse kinds of unfair means, feelest thou no shame or no abhorrence for those acts?
  modern: Did you think I did not notice it when Arjuna, on your advice, hinted it to Bhīma? Having had thousands of kings, who always fought fairly, killed by many kinds of unfair means, do you feel no shame or disgust for those acts?
shalya-9-62-36:
  ganguli: 9 LXI
  text: If ye had fought me and Karna and Bhishma and Drona by fair means, victory then, without doubt, would never have been yours.
  modern: If you had fought me, Karṇa, Bhīṣma and Droṇa by fair means, victory would never have been yours.
shalya-9-62-58:
  ganguli: 9 LXI
  text: Enslaved by ungovernable covetousness and thirst of gain, thou didst perpetrate many unrighteous acts! Bear now the consequences of those acts of thine!
  modern: Enslaved by ungovernable greed and thirst for gain, you did many unrighteous acts. Bear now the consequences of those acts of yours!
shalya-9-62-60:
  ganguli: 9 LXI
  text: That end again which is courted by Kshatriyas observant of the duties of their own order, death in battle, hath become mine. Who, therefore, is so fortunate as myself?
  modern: That end which Kṣatriyas who keep the duties of their order seek, death in battle, has become mine. Who, then, is so fortunate as I?
shalya-9-62-62:
  ganguli: 9 LXI
  text: With all my well-wishers, and my younger brothers, I am going to heaven, O thou of unfading glory! As regards yourselves, with your purposes unachieved and torn by grief, live ye in this unhappy world!
  modern: "With all my well-wishers and my younger brothers, I am going to heaven, O unfailing one. As for you, with your aims unachieved and torn by grief, live on in this unhappy world!"
shalya-9-62-64:
  ganguli: 9 LXI
  text: Upon the conclusion of these words of the intelligent king of the Kurus, a thick shower of fragrant flowers fell from the sky.
  modern: When the intelligent king of the Kurus had finished speaking, a thick shower of fragrant flowers fell from the sky.
shalya-9-63-1:
  ganguli: 9 LXII
  speaker: Sanjaya said,
  speakerModern: 'Saṃjaya said:'
  text: All those kings, possessed of arms that resembled spiked bludgeons, then proceeded towards their tents, filled with joy and blowing their conchs on their way.
  modern: All those kings, their arms like spiked bludgeons, then went towards their tents, full of joy and blowing their conches on the way.
shalya-9-63-45:
  ganguli: 9 LXII
  text: Then Vasudeva of great renown said, We should, as an initiatory act of blessedness, remain out of the camp for this night.
  modern: Then Vāsudeva of great renown said, “For good luck, we should stay outside the camp for this night.”
shalya-9-63-46:
  ganguli: 9 LXII
  text: Answering, ‘So be it!’ the Pandavas and Satyaki, accompanied by Vasudeva, went out of the camp for the sake of doing that which was regarded as an auspicious act.
  modern: Answering, “So be it!” the Pāṇḍavas and Sātyaki, with Vāsudeva, went out of the camp to do what was held to be an auspicious act.
shalya-9-63-49:
  ganguli: 9 LXIII
  text: It is time, O hero, I think, for pacifying her! Except thee, O foremost of men, what other person is there that is able to even behold that lady of eyes red like copper in wrath and exceedingly afflicted with the ills that have befallen her children? That thou shouldst go there, O Madhava, is what I think to be proper, for pacifying Gandhari, O chastiser of foes, who is blazing with wrath!
  modern: I think it is time, O hero, to pacify her. Besides you, O foremost of men, who is able even to look at that lady, her eyes red as copper with wrath and sorely afflicted by what has befallen her children? I think it right, O Mādhava, that you should go there to pacify Gāndhārī, who is blazing with wrath, O chastiser of foes."
shalya-9-63-51:
  ganguli: 9 LXII
  text: They despatched Keshava of Yadu’s race to Hastinapura.
  modern: They sent Keśava of Yadu's race to Hastināpura.
shalya-9-64-38:
  ganguli: 9 LXIII
  text: Having shed tears for a while from sorrow, he washed his eyes and his face with water according to rules. That chastiser of foes then said these softly flowing words unto Dhritarashtra, “Nothing is unknown to thee, O Bharata, about the past and the future!
  modern: 'After shedding tears for a while out of sorrow, he washed his eyes and face with water as the rules direct. That chastiser of foes then spoke these gently flowing words to Dhṛtarāṣṭra: "Nothing is unknown to you, O Bhārata, about the past and the future.'
shalya-9-64-45:
  ganguli: 9 LXIII
  text: Bhishma, and Somadatta, and Valhika, and Kripa, and Drona and his son, and the wise Vidura, always solicited thee for peace. Thou didst not, however, follow their counsels!
  modern: Bhīṣma, Somadatta, Bāhlika, Kṛpa, Droṇa and his son, and the wise Vidura always begged you for peace. But you did not follow their counsel.
shalya-9-64-48:
  ganguli: 9 LXIII
  text: The smallest transgression is not discernible in the high-souled Pandavas, judged by the rules of morality or reason or affection, O scorcher of foes!
  modern: Not the smallest transgression can be seen in the high-souled Pāṇḍavas, judged by morality, by reason or by affection, O scorcher of foes.
shalya-9-64-50:
  ganguli: 9 LXIII
  text: Race, line, funeral cake, and what else depends upon offspring, now depend on the Pandavas as regards both thyself and Gandhari!
  modern: Family, line, the funeral cake, and whatever else depends on offspring now depend on the Pāṇḍavas, for both you and Gāndhārī.
shalya-9-64-52:
  ganguli: 9 LXIII
  text: Reflecting upon all this, and thinking also of thy own transgressions, cherish good feeling towards the Pandavas, I bow to thee, O bull of Bharata’s race!
  modern: Reflect on all this, and on your own transgressions, and feel kindly toward the Pāṇḍavas. I bow to you, O bull of Bharata's race."
shalya-9-64-57:
  ganguli: 9 LXIII
  text: 'Having said these words unto Dhritarashtra, that foremost one of Yadu’s race, O monarch, addressed the grief-stricken Gandhari in these words of high import: “O daughter of Subala, thou of excellent vows, listen to what I say!'
  modern: 'Having said these words to Dhṛtarāṣṭra, that foremost of the Yadu race, O monarch, spoke these weighty words to the grief-stricken Gāndhārī: "O daughter of Subala, you of excellent vows, listen to what I say.'
shalya-9-64-59:
  ganguli: 9 LXIII
  text: Thou rememberest, O queen, those words that thou spokest in the assembly in my presence, those words fraught with righteousness and that were beneficial to both parties, which thy sons, O auspicious lady, did not obey!
  modern: You remember, O queen, the words you spoke in the assembly in my presence, words full of righteousness and good for both sides, which your sons, O auspicious lady, did not obey.
shalya-9-64-60:
  ganguli: 9 LXIII
  text: Duryodhana who coveted victory was addressed by thee in bitter words! Thou toldst him then.
  modern: 'You spoke bitter words to Duryodhana, who wanted victory. You told him then:'
a6-64-61:
  ganguli: 9 LXIII
  text: 'Listen, O fool, to these words of mine: “thither is victory where righteousness is.”’ Those words of thine, O princess, have now been accomplished!'
  modern: '"Listen, fool, to these words of mine: where righteousness is, there is victory." Those words of yours, O princess, have now come true.'
shalya-9-64-62:
  ganguli: 9 LXIII
  text: Knowing all this, O auspicious lady, do not set thy heart on sorrow. Let not thy heart incline towards the destruction of the Pandavas!
  modern: Knowing all this, O auspicious lady, do not set your heart on sorrow. Never let your mind turn toward the destruction of the Pāṇḍavas.
shalya-9-64-69:
  ganguli: 9 LXIII
  text: Having comforted Gandhari and Dhritarashtra, Keshava of Madhu’s race came to know (by intuition) the evil that was meditated by Drona’s son.
  modern: Having comforted Gāndhārī and Dhṛtarāṣṭra, Keśava of Madhu's race came to know, by intuition, the evil that Droṇa's son was planning.
shalya-9-64-78:
  ganguli: 9 LXIII
  text: Arrived at the camp, he proceeded to the presence of the Pandavas. Telling them everything (about his mission to the city), he took his seat with them.
  modern: Arriving at the camp, he went to the Pāṇḍavas. After telling them everything about his mission to the city, he took his seat with them.
shalya-9-66-2:
  ganguli: 9 LXV
  text: Having heard of Duryodhana’s fall from the messengers, those mighty car-warriors, the unslain remnant of the Kaurava army, exceedingly wounded with keen shafts, and maces and lances and darts, those three, Ashvatthama and Kripa and Kritavarma of the Satwata race, came quickly on their fleet steeds to the field of battle.
  modern: Having heard of Duryodhana's fall from the messengers, those mighty car-warriors, the unslain remnant of the Kaurava army, badly wounded by keen arrows, maces, lances and darts, those three, Aśvatthāman, Kṛpa and Kṛtavarman of the Sātvata race, came quickly on their fast horses to the field of battle.
shalya-9-66-3:
  ganguli: 9 LXV
  text: They beheld there the high-souled son of Dhritarashtra prostrate on the ground like a gigantic Sala tree laid low in the forest by a tempest.
  modern: There they saw the high-souled son of Dhṛtarāṣṭra lying on the ground, like a gigantic sāla tree in the forest laid low by a storm.
shalya-9-66-31:
  ganguli: 9 LXV
  text: Beholding the king in tears and grief, Drona’s son flamed up in anger like the fire that is seen at the universal destruction.
  modern: Seeing the king in tears and grief, Droṇa's son blazed up with anger like the fire at the destruction of the universe.
shalya-9-66-35:
  ganguli: 9 LXV
  text: I shall today, in the very presence of Vasudeva, despatch all the Pancalas, by all means in my power, to the abode of Yama?
  modern: Today, in the very presence of Vāsudeva, I will send all the Pāñcālas by every means in my power to the abode of Yama.
shalya-9-66-41:
  ganguli: 9 LXV
  text: Hearing these words of the king, Kripa, the son of Saradwat, installed Drona’s son as generalissimo, at the king’s command!
  modern: Hearing these words of the king, Kṛpa, son of Śaradvat, installed Droṇa's son as commander-in-chief at the king's command.
sauptika-10-1-24:
  ganguli: 10 I
  text: The Sun then reached the Asta mountains, and Night, the mother of the universe, came.
  modern: The Sun then reached the Asta mountains, and Night, the mother of the universe, came.
sauptika-10-1-27:
  ganguli: 10 I
  text: Those creatures that walk the night began to howl and utter their cries at will, while they that walk the day owned the influence of sleep. Awful became the noise of the night-wandering animals. The carnivorous creatures became full of glee, and the night, as it deepened, became dreadful.
  modern: The creatures that walk by night began to howl and cry at will, while those that walk by day fell under the power of sleep. Dreadful became the noise of the night-wandering animals. The flesh-eaters became full of glee, and the night, as it deepened, became fearful.
sauptika-10-6-2:
  ganguli: 10 VI
  speaker: Sanjaya said,
  speakerModern: 'Sañjaya said:'
  text: Inviting Kritavarma, as also the mighty car-warrior Kripa, Drona’s son, filled with rage, approached the gate of the camp.
  modern: "Calling Kṛtavarman and the mighty chariot-warrior Kṛpa to him, Droṇa's son, filled with rage, approached the gate of the camp."
sauptika-10-8-14:
  ganguli: 10 VIII
  text: The mighty-armed hero, having entered the camp, proceeded, guided by signs, very softly, towards the quarters of Dhrishtadyumna.
  modern: The mighty-armed hero, having entered the camp, went softly, guided by signs, towards the quarters of Dhṛṣṭadyumna.
sauptika-10-8-23:
  ganguli: 10 VIII
  text: Striking him with his foot, O king, on both his throat and breast while his victim writhed and roared, Drona’s son endeavoured to kill him as if he were an animal.
  modern: Striking him with his foot, O king, on both his throat and breast while his victim writhed and roared, Droṇa's son tried to kill him as if he were an animal.
sauptika-10-8-46:
  ganguli: 10 VIII
  text: Having slain Yudhamanyu thus, that hero proceeded against the other car-warriors of the king, who were all asleep. He slew all those trembling and shrieking warriors like animals in a sacrifice.
  modern: Having killed Yudhamanyu in this way, that hero went against the other car-warriors of the king, who were all asleep. He killed all those trembling and shrieking warriors like animals at a sacrifice.
sauptika-10-8-54:
  ganguli: 10 VIII
  text: Of terrible form, he careered in the camp like Yama himself, and at last saw the sons of Draupadi and the remnant of the Somakas.
  modern: Of terrible form, he moved through the camp like Yama himself, and at last saw the sons of Draupadī and the remnant of the Somakas.
sauptika-10-8-72:
  ganguli: 10 VIII
  text: Filled with rage at this, Drona’s son, possessed of great might, approached Shikhandi and cut him into twain with his sword.
  modern: Filled with rage at this, Droṇa's son, of great might, went up to Śikhaṇḍin and cut him in two with his sword.
sauptika-10-8-115:
  ganguli: 10 VIII
  text: None amongst those that escaped from the camp was let off by those two wicked persons, Kripa and Kritavarma.
  modern: None of those who escaped from the camp was let off by those two wicked men, Kṛpa and Kṛtavarman.
sauptika-10-8-116:
  ganguli: 10 VIII
  text: Then again, for doing that which was highly agreeable to Drona’s son, those two set fire to the Pandava camp in three places.
  modern: Then, to do what was most pleasing to Droṇa's son, those two set fire to the Pāṇḍava camp in three places.
sauptika-10-8-137:
  ganguli: 10 VIII
  text: Before half the night was over, the son of Drona, O monarch, despatched the large host of the Pandavas unto Yama’s abode.
  modern: Before half the night was over, the son of Droṇa, O monarch, sent the large host of the Pāṇḍavas to Yama's abode.
sauptika-10-8-159:
  ganguli: 10 VIII
  text: Having issued from the camp, the valiant Ashvatthama met his two companions and, filled with joy, told them of his feat, gladdening them, O king, by the intelligence.
  modern: Having come out of the camp, the valiant Aśvatthāman met his two companions and, full of joy, told them of his deed, gladdening them, O king, with the news.
sauptika-10-9-47:
  ganguli: 10 IX
  speaker: Sanjaya continued,
  speakerModern: 'Sañjaya continued:'
  text: Having said these words unto the king deprived of his senses and lying with broken thighs, Ashvatthama once more cast his eyes on him and uttered these words, “If, O Duryodhana, thou hast any life in thee still, listen to these words that are so pleasant to hear.
  modern: After saying these words to the king, who had lost his senses and lay with broken thighs, Aśvatthāman looked at him again and said, "O Duryodhana, if you have any life left, listen to these words, so pleasant to hear.
sauptika-10-9-48:
  ganguli: 10 IX
  text: On the side of the Pandavas, only seven are alive, and among the Dhartarashtras, only we three! The seven on their side are the five brothers and Vasudeva and Satyaki; on our side, we three are myself and Kripa and Kritavarma!
  modern: On the Pāṇḍava side only seven are alive, and among the Dhārtarāṣṭras only we three. The seven on their side are the five brothers, Vāsudeva and Sātyaki; on our side, the three of us are myself, Kṛpa and Kṛtavarman.
sauptika-10-9-50:
  ganguli: 10 IX
  text: All the Pancalas too have been slain, as also the remnant of the Matsyas, O Bharata!
  modern: All the Pāñcālas too have been slain, and the remnant of the Matsyas, O Bhārata.
sauptika-10-9-51:
  ganguli: 10 IX
  text: Behold the vengeance taken for what they had done! The Pandavas are now childless!
  modern: See how what they did has been repaid. The Pāṇḍavas now have no children."
sauptika-10-9-54:
  ganguli: 10 IX
  text: Duryodhana then, having heard those words that were so agreeable to his heart, regained his senses and said these words in reply, That which neither Ganga’s son, nor Karna, nor thy sire, could achieve, hath at last been achieved by thee today, accompanied by Kripa and Bhoja. …
  modern: 'Hearing those words, so pleasing to his heart, Duryodhana regained his senses and replied: "What neither Gaṅgā''s son, nor Karṇa, nor your father could achieve, you have at last achieved today, together with Kṛpa and the Bhoja. …'
sauptika-10-9-58:
  ganguli: 10 IX
  text: Even thus, O king, thy son Duryodhana breathed his last.
  modern: Even so, O king, your son Duryodhana breathed his last.
sauptika-10-10-1:
  ganguli: 10 X
  speaker: The driver said,
  speakerModern: 'The charioteer said:'
  text: The sons of Draupadi, O king, have been slain, with all the children of Drupada himself, while they were heedless and trustfully asleep in their own camp!
  modern: The sons of Draupadī, O king, have been slain, with all the children of Drupada himself, while they slept unaware and trusting in their own camp.
sauptika-10-10-10:
  ganguli: 10 X
  text: The course of events is difficult to be ascertained even by persons endued with spiritual sight. The foes, who were vanquished have become victorious! Ourselves, again, while victorious, are vanquished!
  modern: “Even people with spiritual sight can hardly make out the course of events. The foes we defeated have become the victors, and we, though victorious, are defeated.”
sauptika-10-10-16:
  ganguli: 10 X
  text: Alas, through heedlessness have they been slain that had escaped from even Karna, that warrior who had barbed arrows and nalikas for his teeth, the sword for his tongue, the bow for his gaping mouth, and the twang of the bowstring and the sound of palms for his roars--that angry Karna who never retreated from battle, and who was a very lion among men!
  modern: 'Alas, those who had escaped even Karṇa have been killed through heedlessness: Karṇa, who had barbed arrows and nālīkas for teeth, a sword for a tongue, a bow for his gaping mouth, and the twang of the bowstring and the slap of his palms for roars, that angry Karṇa who never retreated from battle and was a lion among men!'
sauptika-10-10-19:
  ganguli: 10 X
  text: There is, in this world, no more powerful cause of death, as regards men, than heedlessness! Prosperity abandons a heedless man from every side, and every kind of misery overtakes him.
  modern: In this world there is no more powerful cause of death for men than heedlessness. Prosperity abandons a heedless man from every side, and every kind of misery overtakes him.
sauptika-10-10-23:
  ganguli: 10 X
  text: Behold the survivors among our foes have, through our heedlessness, slain so many sons and grandsons of kings, each of whom was really like Indra himself. Alas, they have perished like merchants with rich freight perishing through carelessness in a shallow stream after having crossed the great ocean.
  modern: Look how the survivors among our foes, through our heedlessness, have killed so many sons and grandsons of kings, each of whom was like Indra himself. They have perished like merchants with rich cargo who cross the great ocean and then sink through carelessness in a shallow stream.
sauptika-10-11-7:
  ganguli: 10 XI
  text: Trembling like a plantain tree shaken by the wind, the princess Krishna, arrived at the presence of Yudhishthira, fell down, afflicted by grief.
  modern: Trembling like a plantain tree shaken by the wind, the princess Kṛṣṇā came to Yudhiṣṭhira's presence and fell down, struck by grief.
sauptika-10-11-10:
  ganguli: 10 XI
  text: The beautiful lady, comforted by Bhimasena, began to weep, and addressing the eldest son of Pandu with his brothers, said …
  modern: The beautiful lady, comforted by Bhīmasena, began to weep and, addressing the eldest son of Pāṇḍu in the presence of his brothers, said, …
sauptika-10-11-21:
  ganguli: 10 XI
  text: I shall see that gem brought to me after the slaughter of that wretch in battle, Placing that gem on thy head, O king, I shall endure to live.
  modern: I will see that jewel brought to me after that wretch has been killed in battle. Placing that jewel on your head, O king, I will bear to live."
sauptika-10-13-16:
  ganguli: 10 XIII
  text: The mighty-armed Bhimasena, the son of Kunti, taking up his bow with shaft fixed on it, rushed towards Ashvatthama, and said, Wait, wait!
  modern: The mighty-armed Bhīmasena, son of Kuntī, took up his bow with an arrow fitted to it and rushed at Aśvatthāman, saying, "Wait, wait!"
sauptika-10-13-18:
  ganguli: 10 XIII
  text: Of soul incapable of being depressed, he called to his mind that high weapon (which he had obtained from his sire).
  modern: With an unshaken soul he called to mind that supreme weapon which he had obtained from his father.
sauptika-10-13-20:
  ganguli: 10 XIII
  text: Having said these words, O tiger among kings, the valiant son of Drona let off that weapon for stupefying all the worlds.
  modern: Having said these words, O tiger among kings, the valiant son of Droṇa let off that weapon to stupefy all the worlds.
sauptika-10-14-3:
  ganguli: 10 XIV
  text: Addressing Arjuna, he said, O Arjuna, O son of Pandu, the time is come for the use of that celestial weapon which is in thy memory, knowledge of which was imparted to thee by Drona. For protecting thyself as also thy brothers, O Bharata, shoot in this battle that weapon which is capable of neutralising all weapons.
  modern: Addressing Arjuna, he said, “O Arjuna, son of Pāṇḍu, the time has come to use the celestial weapon in your memory, which Droṇa taught you. To protect yourself and your brothers, O Bhārata, shoot in this battle the weapon that can neutralise all weapons.”
sauptika-10-14-4:
  ganguli: 10 XIV
  text: Thus addressed by Keshava, Arjuna, that slayer of hostile heroes, quickly alighted from the car, taking with him his bow with shaft fixed on the string.
  modern: Thus addressed by Keśava, Arjuna, slayer of hostile heroes, quickly got down from his chariot, taking his bow with an arrow fitted to the string.
sauptika-10-14-6:
  ganguli: 10 XIV
  text: Softly wishing good unto the preceptor’s son and then unto himself, and unto all his brothers, that scorcher of foes then bowed unto all the gods and all his superiors and let off his weapon, thinking of the welfare of all the worlds and uttering the words, Let Ashvatthama’s weapon be neutralised by this weapon!
  modern: First wishing good to the preceptor's son, then to himself and all his brothers, that scorcher of foes bowed to all the gods and his elders and released his weapon, thinking of the welfare of all the worlds and saying, "Let Aśvatthāman's weapon be neutralized by this weapon!"
sauptika-10-14-12:
  ganguli: 10 XIV
  text: Then the two great rishis, Narada, who is the soul of every creature, and the grandsire of all the Bharata princes (Vyasa), beholding those two weapons scorching the three worlds, showed themselves there.
  modern: Then the two great Rishis, Nārada, the soul of every creature, and Vyāsa, the grandsire of all the Bharata princes, saw those two weapons scorching the three worlds and appeared there.
sauptika-10-14-13:
  ganguli: 10 XIV
  text: Conversant with all duties and desirous of the welfare of all creatures, the two sages, possessed of great energy, stood in the midst of those two blazing weapons.
  modern: Those two sages, who knew all duties and wished well to all creatures and were full of great energy, stood between those two blazing weapons.
sauptika-10-15-1:
  ganguli: 10 XV
  speaker: Vaishampayana said,
  speakerModern: 'Vaiśaṃpāyana said:'
  text: At the very sight, O tiger among men, of those two rishis possessed of splendour like that of fire, Dhananjaya quickly resolved to withdraw his celestial shaft.
  modern: At the very sight of those two Rishis, O tiger among men, whose splendor was like fire, Dhanañjaya quickly decided to withdraw his celestial arrow.
sauptika-10-15-12:
  ganguli: 10 XV
  text: Unable to withdraw the high weapon in battle, Drona’s son, O king, with a cheerless heart, said unto the island-born rishi these words, Threatened by a great danger, and desirous of protecting my life, I let off this weapon, through fear of Bhimasena, O sage!
  modern: "Unable to withdraw that high weapon in battle, Droṇa's son, O king, said cheerlessly to the island-born Rishi: \"Threatened by a great danger and wishing to save my life, I let off this weapon out of fear of Bhīmasena, O sage!"
sauptika-10-15-43:
  ganguli: 10 XV
  text: The son of Drona, having heard these words of the island-born, threw that uplifted weapon into the wombs of the Pandava women.
  modern: The son of Droṇa, having heard these words of the island-born sage, threw that raised weapon into the wombs of the Pāṇḍava women.
sauptika-10-16-1:
  ganguli: 10 XVI
  text: Understanding that that weapon was thrown (into the wombs of the Pandava women) by Drona’s son of sinful deeds, Hrishikesha, with a cheerful heart, said these words unto him …
  modern: 'Understanding that the weapon had been thrown into the wombs of the Pāṇḍava women by Droṇa''s son of sinful deeds, Hṛṣīkeśa said to him with a cheerful heart: …'
sauptika-10-16-4:
  ganguli: 10 XVI
  text: 'This thy son for that reason, will be called by the name of Parikshit.” The words of that pious man shall become true: the Pandavas shall have a son called Parikshit.'
  modern: '"For that reason your son will be called Parīkṣit." The words of that pious man shall come true: the Pāṇḍavas shall have a son called Parīkṣit.'
sauptika-10-16-12:
  ganguli: 10 XVI
  text: More than this, that boy shall become the mighty-armed king of the Kurus, known by the name of Parikshit, before thy very eyes, O thou of wicked soul!
  modern: More than this, that boy shall become the mighty-armed king of the Kurus, known by the name of Parīkṣit, before your very eyes, you of wicked soul!
sauptika-10-16-16:
  ganguli: 10 XVI
  speaker: Vaishampayana continued,
  speakerModern: 'Vaiśaṃpāyana continued:'
  text: Drona’s son, then, having made over his gem to the high-souled Pandavas, cheerlessly proceeded, before their eyes, to the forest.
  modern: Droṇa's son, having given his jewel to the high-souled Pāṇḍavas, went cheerlessly to the forest before their eyes.
sauptika-10-16-18:
  ganguli: 10 XVI
  text: The Pandavas who had killed and chastised all their foes, placed Govinda and the island-born Krishna and the great ascetic Narada at their head, and taking the gem that was born with Ashvatthama, quickly came back to the intelligent Draupadi who was sitting in observance of the praya vow.
  modern: The Pāṇḍavas, who had killed and punished all their foes, put Govinda, the island-born Kṛṣṇa and the great ascetic Nārada at their head. Taking the gem born with Aśvatthāman, they quickly went back to the wise Draupadī, who was fasting.
sauptika-10-16-30:
  ganguli: 10 XVI
  speaker: Draupadi said,
  speakerModern: 'Draupadī said:'
  text: I desired to only pay off our debt for the injury we have sustained. The preceptor’s son is worthy of my reverence as the preceptor himself. Let the king bind this gem on his head, O Bharata!
  modern: “I only wished to pay off our debt for the injury we have suffered. The preceptor's son deserves my reverence as the preceptor himself. Let the king bind this gem on his head, O Bhārata!”
sauptika-10-16-32:
  ganguli: 10 XVI
  text: Holding on his head that excellent and celestial gem, the puissant king looked beautiful like a mountain with the moon above it.
  modern: Holding that excellent celestial jewel on his head, the mighty king looked beautiful, like a mountain with the moon above it.
strI-11-9-8:
  ganguli: 11 X
  text: At that time a loud wail of woe arose from every Kuru house. The whole city, including the very children, became exceedingly afflicted with grief.
  modern: At that time a loud wail rose from every house of the Kurus. The whole city, down to the children, was deeply afflicted with grief.
strI-11-9-9:
  ganguli: 11 X
  text: Those ladies that had not before this been seen by the very gods were now helpless, as they were, for the loss of their lords, seen by the common people.
  modern: The ladies whom even the gods had never seen before were now, helpless for the loss of their lords, seen by common people.
strI-11-9-17:
  ganguli: 11 X
  text: Surrounded by those thousands of wailing ladies, the king cheerlessly issued out of the city and proceeded with speed towards the field of battle.
  modern: Surrounded by those thousands of wailing ladies, the king left the city, cheerless, and hurried towards the field of battle.
strI-11-11-1:
  ganguli: 11 XII
  speaker: Vaishampayana said,
  speakerModern: 'Vaiśaṃpāyana said:'
  text: After all the warriors had been slaughtered, king Yudhishthira the just heard that his uncle Dhritarashtra had set out from the city called after the elephant.
  modern: After all the warriors had been slaughtered, King Yudhiṣṭhira the just heard that his uncle Dhṛtarāṣṭra had set out from the city named after the elephant.
strI-11-11-2:
  ganguli: 11 XII
  text: Afflicted with grief on account of the death of his sons, Yudhishthira, O king, accompanied by his brothers, set out for meeting his uncle, filled with sorrow and overwhelmed with grief for the slaughter of his (hundred) sons.
  modern: Grieving for the death of his sons, Yudhiṣṭhira, O king, set out with his brothers to meet his uncle, sorrowful and overwhelmed with grief for the slaughter of his hundred sons.
strI-11-11-3:
  ganguli: 11 XII
  text: The son of Kunti was followed by the high-souled and heroic Krishna of Dasharhas race, and by Yuyudhana, as also by Yuyutsu.
  modern: The son of Kuntī was followed by the high-souled, heroic Kṛṣṇa of Dāśārha's race, by Yuyudhāna, and by Yuyutsu.
strI-11-11-10:
  ganguli: 11 XII
  text: Passing over those ladies crying like a flight of she-ospreys, the mighty-armed king Yudhishthira the just saluted the feet of his eldest uncle.
  modern: Passing those ladies, who were crying like a flight of she-ospreys, the mighty-armed King Yudhiṣṭhira the just saluted the feet of his eldest uncle.
strI-11-11-12:
  ganguli: 11 XII
  text: Dhritarashtra, exceedingly afflicted with grief on account of the slaughter of his sons, then reluctantly embraced the eldest son of Pandu, who was the cause of that slaughter.
  modern: Dhṛtarāṣṭra, greatly afflicted by the slaughter of his sons, reluctantly embraced the eldest son of Pāṇḍu, who was the cause of that slaughter.
strI-11-11-13:
  ganguli: 11 XII
  text: Having embraced Yudhishthira the just and spoken a few words of comfort to him, O Bharata, the wicked-souled Dhritarashtra sought for Bhima, like a blazing fire ready to burn everything that would approach it.
  modern: After embracing Yudhiṣṭhira the just and speaking a few words of comfort to him, O Bhārata, the wicked-souled Dhṛtarāṣṭra looked for Bhīma, like a blazing fire ready to burn whatever came near.
strI-11-11-15:
  ganguli: 11 XII
  text: Ascertaining the evil intentions cherished by him towards Bhima, Krishna, dragging away the real Bhima, presented an iron statue of the second son of Pandu to the old king.
  modern: Seeing the evil intentions he held toward Bhīma, Kṛṣṇa pulled the real Bhīma away and presented the old king with an iron statue of the second son of Pāṇḍu.
strI-11-11-17:
  ganguli: 11 XII
  text: Seizing with his two arms that iron Bhima, king Dhritarashtra, possessed of great strength, broke into pieces, thinking it to be Bhima himself in flesh and blood.
  modern: Seizing that iron Bhīma in his two arms, King Dhṛtarāṣṭra, who was very strong, broke it to pieces, thinking it was Bhīma himself in flesh and blood.
strI-11-11-21:
  ganguli: 11 XII
  text: The king then, having cast off his wrath and returned to his normal disposition, became filled with grief and began to weep aloud, saying, Alas, oh Bhima, alas, oh Bhima!
  modern: The king then, his anger gone and his usual temper returned, was filled with grief and wept aloud, saying, “Alas, Bhīma! Alas, Bhīma!”
strI-11-11-22:
  ganguli: 11 XII
  text: Understanding that he was no longer under the influence of wrath, and that he was truly sorry for having (as he believed) killed Bhima, Vasudeva, that foremost of men, said these words, Do not grieve, O Dhritarashtra, for thou hast not slain Bhimasena!
  modern: Seeing that the king's anger had left him and that he was truly sorry for having, as he believed, killed Bhīma, Vāsudeva, the foremost of men, said, “Do not grieve, O Dhṛtarāṣṭra, for you have not killed Bhīmasena!
strI-11-11-23:
  ganguli: 11 XII
  text: That is an iron statue, O king, which has been broken by thee!
  modern: That is an iron statue, O king, which you have broken.
strI-11-12-15:
  ganguli: 11 XII
  text: I desire eagerly, O Madhava, to embrace that hero, the second son of Pandu.
  modern: I long, O Mādhava, to embrace that hero, the second son of Pāṇḍu.
strI-11-12-16:
  ganguli: 11 XII
  text: When all the kings have been dead, when my children are no more, upon the sons of Pandu depend my welfare and happiness.
  modern: Now that all the kings are dead and my children are no more, my welfare and happiness depend on the sons of Pāṇḍu.
strI-11-13-1:
  ganguli: 11 XIV
  speaker: Vaishampayana said,
  speakerModern: 'Vaiśaṃpāyana said:'
  text: Commanded by Dhritarashtra, those bulls of Kuru’s race, the Pandava brothers, accompanied by Keshava, then proceeded to see Gandhari.
  modern: At Dhṛtarāṣṭra's command, those bulls of the Kuru race, the Pāṇḍava brothers, accompanied by Keśava, then went to see Gāndhārī.
strI-11-15-9:
  ganguli: 11 XV
  text: Gandhari then, having cast off her wrath, comforted the Pandavas as a mother should.
  modern: Gāndhārī then, her wrath gone, comforted the Pāṇḍavas as a mother should.
strI-11-15-10:
  ganguli: 11 XV
  text: Obtaining her leave, those heroes of broad chests then proceeded together to present themselves to their mother, that parent of heroes.
  modern: With her leave, those broad-chested heroes went together to present themselves to their mother, the mother of heroes.
strI-11-15-11:
  ganguli: 11 XV
  text: Having seen her sons after a long time, Kunti, who had been filled with anxiety on their account, covered her face with her cloth and began to weep.
  modern: Seeing her sons after a long time, Kuntī, who had been anxious about them, covered her face with her cloth and began to weep.
strI-11-15-13:
  ganguli: 11 XV
  text: She then repeatedly embraced and patted each of her sons, and afflicted with grief wept with Draupadi who had lost all her children and whom she saw lying on the bare earth, indulging in piteous lamentations.
  modern: She embraced and patted each of her sons again and again, and, in her grief, wept with Draupadī, who had lost all her children and whom she saw lying on the bare ground, lamenting piteously.
strI-11-25-38:
  ganguli: 11 XXV
  text: Filled with wrath and with sorrow at the death of her sons, Gandhari, with agitated heart, ascribed every fault to Keshava.
  modern: Filled with wrath and with sorrow at the death of her sons, Gāndhārī, her heart agitated, laid every fault on Keśava.
strI-11-25-43:
  ganguli: 11 XXV
  text: Since thou wert indifferent to the Kurus and the Pandavas whilst they slew each other, therefore, O Govinda, thou shalt be the slayer of thy own kinsmen!
  modern: Since you were indifferent to the Kurus and the Pāṇḍavas while they slew each other, therefore, O Govinda, you shall be the slayer of your own kinsmen.
strI-11-25-44:
  ganguli: 11 XXV
  text: In the thirty-sixth year from this, O slayer of Madhu, thou shalt, after causing the slaughter of thy kinsmen and friends and sons, perish by disgusting means in the wilderness.
  modern: In the thirty-sixth year from now, O slayer of Madhu, after causing the slaughter of your kinsmen, friends and sons, you shall perish in the wilderness by a wretched means.
strI-11-25-45:
  ganguli: 11 XXV
  text: (with strI-11-25-44)
strI-11-25-47:
  ganguli: 11 XXV
  speaker: Vaishampayana continued,
  speakerModern: 'Vaiśaṃpāyana continued:'
  text: Hearing these words, the high-souled Vasudeva, addressing the venerable Gandhari, said unto her these words, with a faint smile, There is none in the world, save myself, that is capable of exterminating the Vrishnis.
  modern: Hearing these words, the high-souled Vāsudeva said to the venerable Gāndhārī, with a faint smile, "There is no one in the world but me who is able to destroy the Vṛṣṇis.
strI-11-25-49:
  ganguli: 11 XXV
  text: The Vrishnis are incapable of being slain by others, be they human beings or gods or Danavas. The Yadavas, therefore shall fall by one anothers hand.
  modern: The Vṛṣṇis cannot be slain by others, whether humans, gods or Dānavas. The Yādavas will therefore fall by one another's hands."
strI-11-27-3:
  ganguli: 11 XXVII
  text: The Kuru ladies, crying and afflicted with great grief, offered oblations of water unto their sires and grandsons and brothers and kinsmen and sons and reverend seniors and husbands.
  modern: The Kuru ladies, crying and afflicted with great grief, offered water to their fathers and grandsons, their brothers, kinsmen, sons, elders and husbands.
strI-11-27-4:
  ganguli: 11 XXVII
  text: Conversant with duties, they also performed the water-rite in honour of their friends.
  modern: Knowing their duties, they also performed the water rite for their friends.
strI-11-27-7:
  ganguli: 11 XXVII
  text: Then Kunti, O king, in a sudden paroxysm of grief, weepingly addressed her sons in these soft words, That hero and great bowman, that leader of leaders of car-divisions, that warrior distinguished by every mark of heroism, who hath been slain by Arjuna in battle, that warrior whom, ye sons of Pandu, ye took forth, Sutas child born of Radha, that hero who shone in the midst of his forces like the lord Surya himself, who battled with all of you and your followers, who looked resplendent as he commanded the vast force of the Duryodhana, who had no equal on earth for energy, that hero who preferred glory to life, that unretiring warrior firm in truth and never fatigued with exertion, was your eldest brother.
  modern: 'Then Kuntī, O king, in a sudden fit of grief, spoke weeping to her sons in soft words: "That hero and great bowman, that leader of the leaders of chariot divisions, that warrior marked by every sign of heroism, who was slain by Arjuna in battle, that warrior whom you, sons of Pāṇḍu, called the Sūta''s child, born of Rādhā, that hero who shone in the midst of his forces like the lord Sūrya himself, who fought all of you and your followers, who looked resplendent commanding Duryodhana''s vast army, who had no equal on earth in energy, that hero who preferred glory to life, that unretreating warrior, firm in truth and never tired by exertion, was your eldest brother.'
strI-11-27-9:
  ganguli: 11 XXVII
  text: (with strI-11-27-7)
strI-11-27-12:
  ganguli: 11 XXVII
  text: Offer oblations of water unto that eldest brother of yours who was born of me by the god of day.
  modern: Offer water to that eldest brother of yours, who was born to me by the god of day.
strI-11-27-13:
  ganguli: 11 XXVII
  text: That hero was born with a pair of earrings and clad in armour, and resembled Surya himself in splendour!
  modern: That hero was born with a pair of earrings and clad in armor, resplendent like the sun, the day-maker.
strI-11-27-14:
  ganguli: 11 XXVII
  text: Hearing these painful words of their mother, the Pandavas began to express their grief for Karna. Indeed, they became more afflicted than ever.
  modern: Hearing their mother's painful words, all the Pāṇḍavas grieved for Karṇa. They became more afflicted than ever.
shanti-12-6-12:
  ganguli: 12 VI
  text: The king, then, recollecting his sons and grandsons and kinsmen and friends, became filled with anxiety and grief.
  modern: Then the king, remembering his sons, grandsons, kinsmen and friends, was filled with anxiety and grief.
shanti-12-6-13:
  ganguli: 12 VI
  text: Afflicted with sorrow, the intelligent king, resembling a fire covered with smoke, became overwhelmed with despair.
  modern: Afflicted with sorrow, the wise king, like a fire wrapped in smoke, was overwhelmed with despair.
shanti-12-36-27:
  ganguli: 12 XXXVIII
  text: The tiger among men, viz., Yudhishthira of great fame, besought by Krishna himself, by the Island-born (Vyasa), by Devasthana, by Jishnu, by these and many others, cast off his grief and anxiety.
  modern: That tiger among men, the famous Yudhiṣṭhira, was entreated by Kṛṣṇa himself, by the Island-born Vyāsa, by Devasthāna, by Jiṣṇu, and by these and many others, and he cast off his grief and anxiety.
shanti-12-36-30:
  ganguli: 12 XXXVIII
  text: Surrounded by all of them like the moon by the stars, the king, placing Dhritarashtra at the head of the train, set out for entering the city.
  modern: Surrounded by all of them like the moon by the stars, the king placed Dhṛtarāṣṭra at the head of the procession and set out to enter the city.
shanti-12-39-1:
  ganguli: 12 XLI
  speaker: Vaishampayana said,
  speakerModern: 'Vaiśaṃpāyana said:'
  text: The royal son of Kunti, freed from grief and the fever of his heart, took his seat, with face eastwards, on excellent seat made of gold.
  modern: The royal son of Kuntī, freed from grief and the fever of his heart, sat facing east on an excellent seat made of gold.
shanti-12-39-8:
  ganguli: 12 XLI
  text: Then all the subjects, headed by the priest, came to see king Yudhishthira, bringing with them diverse kinds of auspicious articles.
  modern: Then all the subjects, led by the priest, came to see King Yudhiṣṭhira, bringing many kinds of auspicious articles.
shanti-12-39-13:
  ganguli: 12 XLI
  text: Causing the high-souled Yudhishthira then, with Krishna the daughter of Drupada, to be seated upon a handsome seat, called Sarvatobhadra, with firm feet and covered with tiger-skin and blazing with effulgence, began to pour libations of clarified butter (upon the sacrificial fire) with proper mantras.
  modern: Then he had the high-souled Yudhiṣṭhira and Kṛṣṇā, Drupada's daughter, seated on a handsome seat called Sarvatobhadra, with firm feet, covered with tiger skin and blazing with splendor, and began to pour offerings of clarified butter on the sacrificial fire with the proper mantras.
shanti-12-39-14:
  ganguli: 12 XLI
  text: (with shanti-12-39-13)
shanti-12-39-15:
  ganguli: 12 XLI
  text: Then he of Dasaratha’s race, rising from his seat, took up the sanctified conch, poured the water it contained upon the head of that lord of earth, viz., Yudhishthira, the son of Kunti. The royal sage Dhritarashtra and all the subjects also did the same at the request of Krishna.
  modern: Then he of Daśārha's race rose from his seat, took up the sanctified conch, and poured the water it held on the head of Yudhiṣṭhira, son of Kuntī, lord of the earth. The royal sage Dhṛtarāṣṭra and all the subjects did the same at Kṛṣṇa's request.
shanti-12-40-9:
  ganguli: 12 XLII
  text: Having dismissed the citizens and the people of the provinces, the delighter of the Kurus appointed his brother Bhimasena as Yuvaraja.
  modern: Having dismissed the citizens and the people of the provinces, the delight of the Kurus appointed his brother Bhīmasena as heir apparent.
shanti-12-44-17:
  ganguli: 12 XLVI
  text: Approaching the high-souled one who was Vishnu himself in incarnate form, king Yudhishthira addressed him sweetly and smilingly, saying, …
  modern: Going up to the high-souled one, who was Viṣṇu himself in human form, King Yudhiṣṭhira spoke to him sweetly and with a smile, …
shanti-12-44-19:
  ganguli: 12 XLVI
  text: O foremost of intelligent persons, is it all right with thy understanding? We have got back our kingdom and the whole earth has come under our control, O divine lord, …
  modern: O foremost of the intelligent, is your understanding well? We have got back our kingdom, and the whole earth is under our control, O divine lord, …
shanti-12-44-20:
  ganguli: 12 XLVI
  text: We have got back our kingdom and the whole earth has come under our control, O divine lord, through thy grace, O refuge of the three worlds and, O thou of three steps, through thy grace have we won victory and obtained great fame and have not fallen away from the duties of our order!
  modern: We have got back our kingdom and the whole earth is under our control, O divine lord, through your grace, O refuge of the three worlds. O you of the three steps, through your grace we have won victory and great fame and have not fallen away from the duties of our order.
shanti-12-44-21:
  ganguli: 12 XLVI
  text: Unto that chastiser of foes, viz., king Yudhishthira the just who addressed him in that strain the divine Krishna said not a word, for he was then rapt in meditation.
  modern: To Yudhiṣṭhira the just, chastiser of foes, who spoke to him this way, the divine Kṛṣṇa said not a word, for he was lost in meditation.
shanti-12-45-1:
  ganguli: 12 XLVII
  text: O great refuge of the universe, is it all right with the three worlds?
  modern: O great refuge of the universe, is it well with the three worlds?
shanti-12-45-11:
  ganguli: 12 XLVII
  speaker: Vasudeva said,
  speakerModern: 'Vāsudeva said:'
  text: That tiger among men, Bhishma, who is now lying on a bed of arrows, and who is now like unto a fire that is about to go out, is thinking of me. Hence my mind also was concentrated on him.
  modern: That tiger among men, Bhīṣma, who lies on a bed of arrows like a fire about to go out, is thinking of me. That is why my mind too was fixed on him.
shanti-12-45-19:
  ganguli: 12 XLVII
  text: I was thinking of that foremost of all persons conversant with morality and duty, of him, O bull of Bharata’s race, who knows the Past, the Future, and the Present.
  modern: I was thinking of that foremost of all those who know morality and duty, O bull of Bharata's race, who knows the past, the future and the present.
shanti-12-45-20:
  ganguli: 12 XLVII
  text: After that tiger among kings shall have, in consequences of his own achievements, ascended to heaven, the earth, O son of Pritha, will look like a moonless night.
  modern: When that tiger among kings has ascended to heaven by his own merit, the earth, O son of Pṛthā, will be like a moonless night.
shanti-12-45-21:
  ganguli: 12 XLVII
  text: Therefore, O Yudhishthira, submissively approaching Ganga’s son, viz., Bhishma of terrible prowess, question him about what thou mayst desire to learn.
  modern: So, Yudhiṣṭhira, go humbly to Gaṅgā's son, Bhīṣma of terrible prowess, and ask him whatever you wish to learn.
shanti-12-45-23:
  ganguli: 12 XLVII
  text: When Bhishma, that foremost one of Kuru’s race, will disappear from the world, every kind of knowledge will disappear with him. It is for this that I urge thee (to go to him now).
  modern: When Bhīṣma, that foremost of Kuru's race, leaves the world, every kind of knowledge will disappear with him. That is why I urge you to go to him now."
shanti-12-47-1:
  ganguli: 12 XLIX
  speaker: Vaisampayana said,
  speakerModern: 'Vaiśaṃpāyana said:'
  text: Then Hrishikesa and king Yudhishthira, and all those persons headed by Kripa, and the four Pandavas, riding on those cars looking like fortified cities and decked with standards and banners, speedily proceeded to Kurukshetra with the aid of their fleet steeds.
  modern: Then Hṛṣīkeśa and King Yudhiṣṭhira, and all those headed by Kṛpa, and the four Pāṇḍavas, riding those chariots that looked like fortified cities and were decked with standards and banners, quickly went to Kurukṣetra with their swift horses.
shanti-12-47-2:
  ganguli: 12 XLIX
  text: (with shanti-12-47-1)
shanti-12-49-6:
  ganguli: 12 LI
  text: They then beheld Bhishma stretched on his arrowy bed and resembling in splendour the evening Sun covered with his own rays.
  modern: They then saw Bhīṣma stretched on his bed of arrows, shining like the evening sun covered with its own rays.
shanti-12-49-7:
  ganguli: 12 LI
  text: The Kuru hero was surrounded by many ascetics like he of a hundred sacrifices by the deities of heaven. The spot on which he lay was highly sacred, being situate on the banks of the river Oghavati.
  modern: The Kuru hero was surrounded by many ascetics, as the god of a hundred sacrifices is by the gods of heaven. The spot where he lay was highly sacred, on the bank of the river Oghavatī.
shanti-12-49-12:
  ganguli: 12 LI
  text: Seeing Bhishma looking like a fire about to die out, Kesava with a rather cheerless heart addressed him as follows.
  modern: Seeing Bhīṣma like a fire about to go out, Keśava, with a rather heavy heart, spoke to him as follows.
shanti-12-49-39:
  ganguli: 12 LI
  text: With the aid of thy intelligence, do thou, O prince of men, drive the sorrow felt by the son of Pandu.
  modern: With the help of your intelligence, O prince of men, drive away the sorrow the son of Pāṇḍu feels.
shanti-12-53-23:
  ganguli: 12 LIV
  text: Strengthened by meditation on thee, feel as if I have become a young man again. Through thy favour, O Janardana, I have become competent to discourse on what is beneficial (for the world).
  modern: Strengthened by meditating on you, I feel as if I have become a young man again. By your favour, O Janārdana, I have become able to speak of what is good for the world.
shanti-12-55-10:
  ganguli: 12 LVI
  speaker: Bhishma said,
  speakerModern: 'Bhīṣma said:'
  text: Bowing unto Dharma who is Supreme, unto Krishna who is Brahma in full, and unto the Brahmanas, I shall discourse on the eternal duties (of men).
  modern: Bowing to Dharma, who is supreme, to Kṛṣṇa, who is Brahmā in full, and to the Brāhmaṇas, I shall speak of the eternal duties of men.
shanti-12-55-12:
  ganguli: 12 LVI
  text: By worshipping the deities and the Brahmanas, O perpetuator of Kuru’s race, the king pays off his debt to duty and morality, and receives the respect of his subjects.
  modern: By worshipping the gods and the Brāhmaṇas, O perpetuator of Kuru's race, the king pays his debt to duty and morality and wins the respect of his subjects.
shanti-12-55-14:
  ganguli: 12 LVI
  text: O son, thou shouldst always exert with promptitude, O Yudhishthira, for without promptitude of exertion mere destiny never accomplishes the objects cherished by kings.
  modern: Always exert yourself promptly, my son Yudhiṣṭhira, for without prompt effort, destiny alone never accomplishes what kings desire.
shanti-12-55-15:
  ganguli: 12 LVI
  text: These two, viz., exertion and destiny, are equal (in their operation). Of them, I regard exertion to be superior, for destiny is ascertained from the results of what is begun with exertion.
  modern: "Exertion and destiny are equal in their working. Of the two, I regard exertion as superior, for destiny is known from the results of what is begun with exertion."
shanti-12-55-17:
  ganguli: 12 LVI
  text: There is nothing which contributes so much to the success of kings as Truth. The king who is devoted to Truth finds happiness both here and hereafter.
  modern: Nothing contributes so much to the success of kings as Truth. The king who is devoted to Truth is happy both here and hereafter.
shanti-12-55-20:
  ganguli: 12 LVI
  text: By administering justice, by attending to these three, viz., concealment of his own weaknesses, ascertainment of the weaknesses of foes, and keeping his own counsels, as also by the observance of conduct that is straightforward, the king, O delighter of the Kurus, obtains prosperity.
  modern: By administering justice, by attending to these three, namely hiding his own weaknesses, finding out the weaknesses of his foes and keeping his own counsels, and by straightforward conduct, the king, O delighter of the Kurus, gains prosperity.
shanti-12-55-21:
  ganguli: 12 LVI
  text: If the king becomes mild, everybody disregards him On the other hand, if he becomes fierce, his subjects then become troubled. Therefore, do thou observe both kinds of behaviour.
  modern: If the king becomes mild, everyone disregards him. If he becomes fierce, his subjects are troubled. So follow both kinds of conduct.
shanti-12-55-42:
  ganguli: 12 LVI
  text: O thou of great liberality, thou shouldst avoid all those evil practices that are called Vyasanas. It is not necessary that thou shouldst never indulge in them. What, however, is needed is that thou shouldst not be attached to them.
  modern: O man of great generosity, you should avoid all those evil habits called Vyasanas. You need not avoid them altogether, but you must not be attached to them.
shanti-12-55-46:
  ganguli: 12 LVI
  text: As the mother, disregarding those objects that are most cherished by her, seeks the good of her child alone, even so, without doubt, should kings conduct themselves (towards their subjects). The king that is righteous, O foremost one of Kuru’s race, should always behave in such a manner as to a\ old what is dear to him, for the sake of doing that which would benefit his people.
  modern: As a mother, setting aside what she holds most dear, seeks only the good of her child, so, without doubt, should kings act towards their subjects. The righteous king, O foremost of the Kurus, should always act so as to give up what is dear to himself for the sake of what benefits his people.
shanti-12-56-33:
  ganguli: 12 LVII
  text: He is the best of kings in whose dominions men live fearlessly like sons in the house of their sire.
  modern: He is the best of kings in whose realm people live fearlessly, like sons in their father's house.
shanti-12-68-4:
  ganguli: 12 LXIX
  text: How should a king who has not been able to conquer his own self be able to conquer his foes?
  modern: How can a king who has not conquered his own self conquer his foes?
shanti-12-71-6:
  ganguli: 12 LXXI
  text: Endued with sincerity, and wisdom and intelligence, O Bharata, thou shouldst adopt truth and avoid lust and wrath. That foolish king who pursues Profit without driving away lust and wrath, fails to acquire virtue and ultimately sacrifices Profit as well.
  modern: You should adopt truth, with sincerity, wisdom and intelligence, O Bhārata, and avoid lust and wrath. The foolish king who seeks Profit without driving away lust and wrath fails to gain virtue, and in the end loses Profit too.
shanti-12-71-15:
  ganguli: 12 LXXI
  text: The wealth again that he acquires (by such means) is seen to be lavished on unworthy objects. That avaricious king who through folly oppresses his subjects by levying taxes not sanctioned by the scriptures, is said to wrong his own self.
  modern: The wealth he gains by such means is seen to be wasted on unworthy objects. The greedy king who, through folly, oppresses his subjects with taxes the scriptures do not allow, wrongs himself.
shanti-12-86-24:
  ganguli: 12 LXXXVI
  text: He should always maintain and protect the helpless, the masterless, and the old, and women that are widows.
  modern: He should always support and protect the helpless, the masterless and the old, and women who are widows.
shanti-12-88-24:
  ganguli: 12 LXXXVIII
  text: Let there be no beggars in thy kingdom, nor robbers. It is the robbers (and not virtuous men) that give unto beggars.
  modern: Let there be no beggars in your kingdom, and no robbers. It is the robbers, not the virtuous, who give to beggars.
shanti-12-91-14:
  ganguli: 12 XCI
  text: The eyes of the weak, of the Muni, and of the snake of virulent poison, should be regarded as unbearable. Do not, therefore, come into (hostile) contact with the weak.
  modern: The eyes of the weak, of the sage and of the snake of virulent poison should be regarded as unbearable. So do not come into hostile contact with the weak.
shanti-12-91-15:
  ganguli: 12 XCI
  text: Thou shouldst regard the weak as always subject to humiliation. Take care that the eyes of the weak do not burn thee with thy kinsmen.
  modern: You should always regard the weak as subject to humiliation. Take care that the eyes of the weak do not burn you together with your kinsmen.
shanti-12-91-18:
  ganguli: 12 XCI
  text: If a person, who has been humiliated or struck, fails, while shrieking for assistance, to obtain a protector, divine chastisement overtakes the king and brings about his destruction.
  modern: If a person who has been humiliated or struck, shrieking for help, finds no protector, divine punishment overtakes the king and destroys him.
shanti-12-91-19:
  ganguli: 12 XCI
  text: Do not, O sire, while in enjoyment of Power, take wealth from those that are Weak. Take care that the eyes of the Weak do not burn thee like a blazing fire.
  modern: Do not, O sire, while you enjoy Power, take wealth from those who are Weak. Take care that the eyes of the Weak do not burn you like a blazing fire.
shanti-12-91-20:
  ganguli: 12 XCI
  text: The tears shed by weeping men afflicted with falsehood slay the children and animals of those that have uttered those falsehoods.
  modern: "The tears shed by weeping men wronged by falsehood slay the children and animals of those who spoke the falsehoods."
shanti-12-94-1:
  ganguli: 12 XCIV
  speaker: Vamadeva said,
  speakerModern: 'Vāmadeva said:'
  text: The king should win victories without battles. Victories achieved by battles are not spoken of highly.
  modern: "The king should win victories without battles. Victories won by battles are not spoken of highly."
shanti-12-95-21:
  ganguli: 12 XCV
  text: Such is the practice of those that are wicked. Even he that is wicked should be subdued by fair means. It is better to lay down life itself in the observance of righteousness than to win victory by sinful means.
  modern: Such is the practice of the wicked. Even the wicked should be subdued by fair means. It is better to give up life itself in keeping to righteousness than to win victory by sinful means.
shanti-12-156-2:
  ganguli: 12 CLVIII
  text: Hear, O King, what the foundation is of sin. Covetousness alone is a great destroyer (of merit and goodness). From covetousness proceeds sin.
  modern: Hear, O King, what the foundation of sin is. Covetousness alone is a great destroyer of merit and goodness. From covetousness proceeds sin.
shanti-12-156-3:
  ganguli: 12 CLVIII
  text: It is from this source that sin and irreligiousness flow, together with great misery. This covetousness is the spring of also all the cunning and hypocrisy in the world. It is covetousness that makes men commit sin.
  modern: It is from this source that sin and irreligion flow, together with great misery. This covetousness is also the spring of all the cunning and hypocrisy in the world. It is covetousness that makes men commit sin.
shanti-12-156-14:
  ganguli: 12 CLVIII
  text: The covetousness, however, which is never gratified by acquisitions and satiated by the accomplishment of desires, that which is not known in its real nature by the gods, the Gandharvas, the Asuras, the great snakes, and, in fact, by all classes of beings, that irresistible passion, along with that folly which invites the heart to the unrealities of the world, should ever be conquered by a person of cleansed soul.
  modern: The covetousness that is never satisfied by gaining things, that is not known in its real nature by the gods, the Gandharvas, the Asuras, the great snakes, or any class of beings, that irresistible passion, together with the folly that draws the heart to the unrealities of the world, should always be conquered by a person of cleansed soul.
shanti-12-157-6:
  ganguli: 12 CLIX
  text: Attachment, hate, loss of judgment, joy, sorrow, vanity, lust, anger, pride, procrastination, idleness, …
  modern: Attachment, hate, loss of judgment, joy, sorrow, vanity, lust, anger, pride, procrastination, idleness, …
shanti-12-157-7:
  ganguli: 12 CLIX
  text: … desire, aversion, jealousy, and all other sinful acts are all known by the common name of ignorance.
  modern: … desire, aversion, jealousy, and all other sinful acts are all known by the common name of ignorance.
shanti-12-158-10:
  ganguli: 12 CLX
  text: We have not heard that there is any other duty in all the worlds that can equal self-restraint. Self-restraint, according to all virtuous persons, is the highest of virtues in this world.
  modern: We have not heard of any other duty in all the worlds that can equal self-restraint. Self-restraint, according to all virtuous persons, is the highest of virtues in this world.
shanti-12-158-15:
  ganguli: 12 CLX
  text: Forgiveness, patience, abstention from injury, impartiality, truth, sincerity, conquest of the senses, cleverness, mildness, modesty, steadiness, …
  modern: Forgiveness, patience, abstention from injury, impartiality, truth, sincerity, mastery of the senses, cleverness, mildness, modesty, steadiness, …
shanti-12-158-16:
  ganguli: 12 CLX
  text: … liberality, freedom from wrath, contentment, sweetness of speech, benevolence, freedom from malice,--the union of all these is self-restraint.
  modern: '… generosity, freedom from wrath, contentment, pleasant speech, kindness and freedom from malice: the union of all these is self-restraint.'
shanti-12-160-5:
  ganguli: 12 CLXII
  text: Truth is duty; Truth is penance; Truth is Yoga; and Truth is the eternal Brahma.
  modern: Truth is duty; truth is penance; truth is yoga; and truth is the eternal Brahman.
shanti-12-160-7:
  ganguli: 12 CLXII
  text: It behoveth thee to hear also as to how Truth may be acquired. Truth, O Bharata, as it exists in all the world, is of thirteen kinds.
  modern: Hear also how Truth is gained. Truth, O Bhārata, as it exists in all the world, is of thirteen kinds.
shanti-12-160-8:
  ganguli: 12 CLXII
  text: The forms that Truth assumes are impartiality, self control, forgiveness, modesty, endurance, goodness, …
  modern: The forms Truth takes are impartiality, self-control, forgiveness, modesty, endurance, goodness, …
shanti-12-160-9:
  ganguli: 12 CLXII
  text: … renunciation, contemplation, dignity, fortitude, compassion, and abstention from injury. These, O great monarch, are the thirteen forms of Truth.
  modern: … renunciation, contemplation, dignity, fortitude, compassion and abstention from injury. These, O great monarch, are the thirteen forms of Truth.
shanti-12-173-47:
  ganguli: 12 CLXXIV
  text: Neither the happiness that is derived from a gratification of the senses nor that great felicity which one may enjoy in heaven, approaches to even a sixteenth part of the felicity which arises from the destruction of all desires.
  modern: Neither the happiness that comes from gratifying the senses nor the great felicity one may enjoy in heaven comes to even a sixteenth part of the bliss that arises from the destruction of all desires.
shanti-12-173-52:
  ganguli: 12 CLXXIV
  text: When a person succeeds in withdrawing all his desires like a tortoise withdrawing all its limbs, then his soul, which is self-luminous, succeeds in looking into itself. …
  modern: When a person withdraws all his desires like a tortoise drawing in all its limbs, his self-luminous soul succeeds in looking into itself. …
shanti-12-173-54:
  ganguli: 12 CLXXIV
  text: When a person himself feels no fear, and is feared by no one, when he cherishes no desire and no aversion, he is then said to attain to the state of Brahma.
  modern: When a person himself feels no fear and is feared by no one, when he cherishes no desire and no aversion, he is then said to attain the state of Brahma.
shanti-12-173-56:
  ganguli: 12 CLXXIV
  text: When a person abstains from doing wrong to any creature, in thought, word, or deed, he is then said to attain to a state of Brahma.
  modern: When a person abstains from doing wrong to any creature in thought, word or deed, he is then said to attain a state of Brahma.
shanti-12-174-9:
  ganguli: 12 CLXXV
  speaker: The son said,
  speakerModern: 'The son said:'
  text: Death is that by which the world is assailed. Decrepitude encompasses it. Those irresistible things that come and go away are the nights (that are continually lessening the period of human life).
  modern: "Death is that by which the world is struck. Old age surrounds it. Those irresistible things that come and go are the nights, which keep shortening human life."
shanti-12-174-14:
  ganguli: 12 CLXXV
  text: Do thou, this very day, accomplish that which is for thy good. Let not this Death come to thee. Death drags its victims before their acts are accomplished.
  modern: Do today whatever is for your good. Do not let this Death come to you. Death drags its victims away before their acts are done.
shanti-12-174-30:
  ganguli: 12 CLXXV
  text: Both Immortality and Death are planted in the body. One comes to Death through ignorance and loss of judgment; while Immortality is achieved through Truth.
  modern: Both Immortality and Death are planted in the body. One comes to Death through ignorance and loss of judgment, and to Immortality through Truth.
shanti-12-174-35:
  ganguli: 12 CLXXV
  text: There is no eye which is equal to (the eye of) Knowledge. There is no penance like (that involved in) Truth. There is no sorrow equal to (that involved in) attachment. There is no happiness (that which is obtainable from) renunciation.
  modern: There is no eye equal to the eye of Knowledge. There is no penance like Truth. There is no sorrow like attachment. There is no happiness like renunciation.
shanti-12-175-5:
  ganguli: 12 CLXXVI
  text: If he could ascribe either of them to the action of Destiny, he would not then feel glad when happiness came or miserable when sorrow overtook him.
  modern: If he could put either of them down to the action of Destiny, he would not feel glad when happiness came or wretched when sorrow overtook him.
shanti-12-175-8:
  ganguli: 12 CLXXVI
  text: Complete poverty, in this world, is happiness. It is a good regimen, it is the source of blessings, it is freedom from danger. This foeless path is unattainable (by persons cherishing desire) and is easily attainable (by those that are freed from desire).
  modern: Complete poverty, in this world, is happiness. It is a good regimen, it is the source of blessings, it is freedom from danger. This foeless path is unattainable by those who cherish desire and easily attained by those freed from desire.
shanti-12-175-9:
  ganguli: 12 CLXXVI
  text: Casting my eyes on every part of the three worlds, I do not behold the person who is equal to a poor man of pure conduct and without attachment (to worldly things).
  modern: Looking over every part of the three worlds, I do not see anyone equal to a poor man of pure conduct who is attached to nothing.
shanti-12-175-10:
  ganguli: 12 CLXXVI
  text: I weighed poverty and sovereignty in a balance. Poverty weighed heavier than sovereignty and seemed to possess greater merits.
  modern: I weighed poverty and sovereignty in a balance. Poverty weighed heavier than sovereignty and seemed to have greater merits.
shanti-12-175-11:
  ganguli: 12 CLXXVI
  text: Between poverty and sovereignty there is this great distinction, viz., that the sovereign, possessed of affluence, is always agitated by anxiety and seems to be within the very jaws of death. …
  modern: 'There is this great difference between poverty and sovereignty: the sovereign, rich as he is, is always agitated by anxiety and seems to be in the very jaws of death. …'
shanti-12-175-16:
  ganguli: 12 CLXXVI
  text: Constant companionship with Prosperity stupefies a person of weak judgment. It drives off his judgment like the wind driving off the autumnal clouds.
  modern: Constant company with Prosperity dulls the judgment of a person of weak understanding. It carries off his judgment, as the wind carries off the autumn clouds.
shanti-12-175-17:
  ganguli: 12 CLXXVI
  text: Companionship with Prosperity induces him to think,--I am possessed of beauty! I am possessed of wealth! I am high-born! I meet with success in whatever I undertake! I am not an ordinary human being!--His heart becomes intoxicated in consequence of these three reasons.
  modern: 'Company with Prosperity makes him think: “I am handsome! I am rich! I am high-born! I succeed in whatever I undertake! I am no ordinary human being!” His heart becomes intoxicated by these three reasons.'
shanti-12-175-22:
  ganguli: 12 CLXXVI
  text: Without Renunciation one can never attain to happiness. Without Renunciation one can never obtain what is for one’s highest good. Without Renunciation one can never sleep at case. Therefore, renouncing everything, make happiness thy own.
  modern: Without renunciation one can never find happiness. Without renunciation one can never reach what is highest. Without renunciation one can never sleep at ease. So give up everything and make happiness your own.
shanti-12-176-2:
  ganguli: 12 CLXXVII
  speaker: Bhishma said,
  speakerModern: 'Bhīṣma said:'
  text: He that regards everything (viz., joy and sorrow, honour and insult, etc.,) with an equal eye, that never exerts himself (for gratifying his desire for earthly possessions), that practises truthfulness of speech, that is freed from all kinds of attachment, and that has no desire for action, is, O Bharata, a happy man.
  modern: One who regards everything, joy and sorrow, honour and insult alike, who never strives to gratify his desire for earthly things, who speaks the truth, who is free of every attachment and has no desire for action, is a happy man, O Bhārata.
shanti-12-176-16:
  ganguli: 12 CLXXVII
  text: Ho, it was well said by Suka while going to the great forest from his father’s abode, renouncing everything!--Amongst these two, viz., one who obtains the fruition of all his wishes, and one who casts off every wish, the latter, who renounces all, is superior to the former who obtains the fruition of all.
  modern: “How well Śuka spoke when he left his father's house for the great forest, renouncing everything! Of these two, the one who gets everything he wishes and the one who gives up every wish, the one who renounces all is the better.”
shanti-12-176-17:
  ganguli: 12 CLXXVII
  text: No one could ever attain to the end of desire. Only he that is destitute of knowledge and judgments feels an avidity for protecting his body and life.--Forbear from every desire for action.
  modern: “No one has ever reached the end of desire. Only one without knowledge and judgment is greedy to protect his body and life. Hold back from every desire to act.”
shanti-12-176-18:
  ganguli: 12 CLXXVII
  text: O my Soul that art possessed by cupidity, adopt tranquillity by freeing thyself from all attachments! Repeatedly hast thou been deceived (by desire and hope). How is it that thou dost not still free thyself from attachments?
  modern: “O my soul, gripped by greed, free yourself from all attachments and take up tranquillity! Again and again you have been deceived by desire and hope. Why do you still not free yourself from attachments?”
shanti-12-178-2:
  ganguli: 12 CLXXX
  speaker: Bhishma said,
  speakerModern: 'Bhīṣma said:'
  text: Wisdom is the refuge of creatures. Wisdom is regarded as the highest of acquisitions. Wisdom is the highest felicity in the world. Wisdom is heaven in the estimation of the good and virtuous.
  modern: Wisdom is the refuge of creatures. Wisdom is regarded as the highest gain. Wisdom is the highest happiness in the world. Wisdom is heaven in the view of the good and the virtuous.
shanti-12-178-26:
  ganguli: 12 CLXXX
  text: Contentment does not result from acquisition of desirable objects. Thirst is never slaked although there is profusion of water. The thirst for acquisition only blazes up with each fresh acquisition like a fire with new faggots thrown into it.
  modern: Contentment does not come from gaining desirable things. Thirst is never slaked, though there is plenty of water. The thirst for acquisition only blazes up with each new acquisition, like a fire with fresh faggots thrown into it.
shanti-12-179-8:
  ganguli: 12 CLXXXI
  text: They that have no reverence for virtue are as vile among men as seedless grains among corn or the gnat among birds.
  modern: Those who have no reverence for virtue are as vile among men as seedless grains among corn or the gnat among birds.
shanti-12-188-1:
  ganguli: 12 CXC
  speaker: Bhrigu said,
  speakerModern: 'Bhṛgu said:'
  text: Truth is Brahma; Truth is Penance; it is Truth that creates all creatures. It is by Truth that the whole universe is upheld; and it is with the aid of Truth that one goes to heaven.
  modern: Truth is Brahman; truth is penance; it is truth that creates all creatures. Truth upholds the whole universe, and with the help of truth one goes to heaven.
shanti-12-188-2:
  ganguli: 12 CXC
  text: Untruth is only another form of Darkness. It is Darkness that leads downwards. Those who are afflicted by Darkness and covered by it fail to behold the lighted regions of heaven.
  modern: Untruth is only another form of darkness. Darkness leads downward. Those who are afflicted and covered by darkness fail to see the lighted regions of heaven.
shanti-12-188-3:
  ganguli: 12 CXC
  text: It has been said that Heaven is Light and that Hell is Darkness. The creatures that dwell in the universe may obtain both heaven and hell. In this world also, truth and untruth lead to opposite courses of conduct and opposite indications, such as Righteousness and Unrighteousness, light and darkness, pleasure and pain.
  modern: It is said that heaven is light and hell is darkness. Creatures living in the universe may obtain both heaven and hell. In this world too, truth and untruth lead to opposite courses of conduct and opposite signs, such as righteousness and unrighteousness, light and darkness, pleasure and pain.
shanti-12-189-14:
  ganguli: 12 CXCI
  text: One in the observance of this mode of life should speak upon all creatures words breathing affection and agreeable to the ears. To give pain, to inflict mortifications, and harsh words, are all censurable.
  modern: In this mode of life one should speak to all creatures words full of affection and pleasing to the ear. To give pain, to inflict mortifications and to use harsh words are all censurable.
shanti-12-189-15:
  ganguli: 12 CXCI
  text: Abstention from injury, truth, and absence of wrath, produce the merit of penances in all the (four) modes of life.
  modern: Non-injury, truth and freedom from anger produce the merit of penances in all four stages of life.
shanti-12-233-6:
  ganguli: 12 CCXXVI
  text: All this that thou seest hath one end. Indulgence in sorrow destroys personal comeliness, prosperity, life, and virtue itself, O chief of the deities!
  modern: "All this that you see has one end. Indulgence in sorrow destroys personal comeliness, prosperity, life and virtue itself, O chief of the deities!"
shanti-12-234-4:
  ganguli: 12 CCXXVII
  text: Grieflessness bears happiness within it, and also health that is a superior possession. In consequence again of this health of body, once may again acquire prosperity.
  modern: Grieflessness brings happiness within it, and also health, a superior possession. And from this health of body one may again acquire prosperity.
shanti-12-305-8:
  ganguli: 12 CCC
  text: One should not wound the vitals of others. One should not be an utterer of cruel speeches. One should never take scriptural lectures from a person that is mean. One should never utter such words as inflict pain on others, as cause others to burn (with misery), and as lead to hell.
  modern: One should not wound the vitals of others. One should not utter cruel speeches. One should never take scriptural lectures from a person who is mean. One should never utter such words as inflict pain on others, cause them to burn with misery and lead to hell.
shanti-12-305-13:
  ganguli: 12 CCC
  text: Truth is the arcanum of the Vedas. The arcanum of Truth is self-restraint. The arcanum of self-restraint is Emancipation. This is the teaching of all the scriptures.
  modern: Truth is the arcanum of the Vedas. The arcanum of Truth is self-restraint. The arcanum of self-restraint is Emancipation. This is the teaching of all the scriptures.
shanti-12-305-36:
  ganguli: 12 CCC
  text: The gods from a distance cast off those that are always devoted to the gratification of their organs of pleasure and the stomach, that are addicted to thieving, and that always indulge in harsh speeches, even if they expiate their offences by performing the proper rites.
  modern: The gods avoid from afar those who are always devoted to the gratification of their organs of pleasure and the stomach, who are addicted to thieving, and who always indulge in harsh speeches, even if they expiate their offences by performing the proper rites.
anuzAsana-13-161-6:
  ganguli: 13 CIV
  text: It is by conduct that one acquires longevity, and it is by conduct that one acquires wealth and prosperity.
  modern: It is by conduct that one gains long life, and it is by conduct that one gains wealth and prosperity.
anuzAsana-13-161-21:
  ganguli: 13 CIV
  text: Persons of every order should never have sexual congress with other people’s wives. There is nothing that shortens life so effectually as sexual congress with other people’s wives.
  modern: Persons of every order should never have sexual relations with other men's wives. Nothing shortens life so surely as sexual relations with other men's wives.
anuzAsana-13-161-37:
  ganguli: 13 CIV
  text: One should avoid atheism, calumniating the Vedas, censuring the deities, malice, pride, arrogance, and harshness.
  modern: One should avoid atheism, abuse of the Vedas, censure of the gods, malice, pride, arrogance and harshness.
anuzAsana-13-161-119:
  ganguli: 13 CIV
  text: One should always provide for friends, for Brahmanas, and for such as seek one’s protection. By doing this, O king, one acquires a long life.
  modern: One should always provide for friends, for Brahmins and for those who seek one's protection. By doing this, O king, one gains a long life.
anuzAsana-13-161-148:
  ganguli: 13 CIV
  text: One should never seek to injure women. Spouses should always be protected. Malice always shortens life. Hence, one should always abstain from cherishing malice.
  modern: One should never seek to injure women. Wives should always be protected. Malice always shortens life, so one should always avoid malice.
anuzAsana-13-170-3:
  ganguli: 13 CVIII
  text: Adhering to eternal Truth, one should bathe in the Tirtha called Manasa, which is unfathomable (for its depth), stainless, and pure, and which has Truth for its waters and the understanding for its lake.
  modern: Holding to eternal Truth, one should bathe in the Tīrtha called Mānasa, which is unfathomable, stainless and pure, with Truth for its water and the understanding for its lake.
anuzAsana-13-170-4:
  ganguli: 13 CVIII
  text: The fruits in the form of cleansing, that one acquires by bathing in that Tirtha, are freedom from cupidity, sincerity, truthfulness, mildness (of behaviour), compassion, abstention from injuring any creature, self-restraint, and tranquillity.
  modern: The fruits of the cleansing one gains by bathing in that Tīrtha are freedom from greed, sincerity, truthfulness, mildness of behaviour, compassion, abstention from injuring any creature, self-restraint and tranquillity.
anuzAsana-13-170-12:
  ganguli: 13 CVIII
  text: Purity of conduct constitutes the purity of the mind. The purity that one attains by ablutions in sacred waters is regarded as inferior. Verily, that purity which arises from knowledge, is regarded as the best.
  modern: Purity of conduct is the purity of the mind. The purity gained by bathing in sacred waters is regarded as inferior. The purity that arises from knowledge is regarded as the best.
anuzAsana-13-177-36:
  ganguli: 13 CXV
  text: The seven celestial Rishis, the Valakhilyas, and those Rishis who drink the rays of the sun, endued with great wisdom, applaud abstention from meat.
  modern: The seven celestial Rishis, the Vālakhilyas, and the Rishis who drink the rays of the sun, all very wise, praise abstention from meat.
anuzAsana-13-244-3:
  ganguli: 12 CLXXV
  text: Every day a thousand occasions for sorrow, and hundred occasions for fear assail the man of ignorance and folly but not the man that is possessed of wisdom.
  modern: Every day a thousand occasions for sorrow and a hundred occasions for fear assail the ignorant and foolish man, but never the man of wisdom.
anuzAsana-13-244-14:
  ganguli: 12 CLIII
  text: In this world which is enveloped by both happiness and misery, none of these two exists uninterruptedly.
  modern: In this world, which is wrapped in both happiness and misery, neither of the two lasts without a break.
anuzAsana-13-244-15:
  ganguli: 12 CLIII
  text: Happiness is followed by misery, and misery by happiness.
  modern: Happiness is followed by misery, and misery by happiness.
anuzAsana-13-244-16:
  ganguli: 12 CIV
  text: Who is there that would set his heart upon hoarding when destruction is its end, upon life when death is its end, and upon union when separation is its end? sometimes man renounces wealth, and sometimes wealth renounces man.
  modern: Who would set his heart upon hoarding when destruction is its end, upon life when death is its end, and upon union when separation is its end? Sometimes man renounces wealth, and sometimes wealth renounces man.
anuzAsana-13-253-2:
  ganguli: 13 CXLIX
  text: By always worshipping with reverence and devotion that immutable Being, by meditating on him, by hymning His praises and bowing the head unto Him, and by performing sacrifices unto Him, indeed by always praising Vishnu, who is without beginning and without end or destruction, who is the Supreme Lord of all the worlds, and who is the Master and Controller of the universe, one can succeed in transcending all sorrow.
  modern: One can cross beyond all sorrow by always worshipping that unchanging Being with reverence and devotion, by meditating on him, praising him, bowing the head to him and sacrificing to him; in short, by always praising Viṣṇu, who has no beginning or end or destruction, who is the supreme Lord of all the worlds, and the master and controller of the universe.
anuzAsana-13-254-4:
  ganguli: 13 CXLIX
  speaker: Bhishma said,
  speakerModern: 'Bhīṣma said:'
  text: One should always, with alacrity and throwing away all languor, hymn the praises of that Lord of the universe, that god of gods (viz., Vasudeva), who is Infinite and the foremost of all Beings, by uttering His thousand names.
  modern: One should always, eagerly and without any laziness, praise that Lord of the universe, that god of gods, Vāsudeva, who is infinite and foremost of all beings, by uttering his thousand names.
anuzAsana-13-254-8:
  ganguli: 13 CXLIX
  text: Even this, in my judgment, is the foremost religion of all religions, viz., one should always worship and hymn the praises of the lotus-eyed Vasudeva with devotion.
  modern: 'This, in my judgment, is the foremost of all religions: that one should always worship and praise the lotus-eyed Vāsudeva with devotion.'
anuzAsana-13-254-135:
  ganguli: 13 CXLIX
  text: Neither wrath, nor jealousy, nor cupidity, nor evil understanding ever appears in those men of righteousness who are devoted to that foremost of beings.
  modern: Neither wrath, nor jealousy, nor greed, nor an evil mind ever appears in those righteous men who are devoted to that foremost of beings.
anuzAsana-13-254-142:
  ganguli: 13 CXLIX
  text: Vishnu is the one great element or substance which has spread itself out into multifarious forms. Covering the three worlds, He the soul of all things, enjoys them all.
  modern: Viṣṇu is the one great substance that has spread itself out into many forms. Covering the three worlds, he, the soul of all things, enjoys them all.
anuzAsana-13-271-64:
  ganguli: 13 CLXVI
  text: When Bhishma became silent, …
  modern: When Bhīṣma fell silent, …
anuzAsana-13-272-4:
  ganguli: 13 CLXVI
  text: When Bhishma became silent, the entire circle of king (who were seated around him) became perfectly silent. Indeed, they all sat motionless there, like figures painted on canvass.
  modern: When Bhīṣma became silent, the entire circle of kings seated around him became perfectly silent. They all sat motionless, like figures painted on canvas.
anuzAsana-13-272-6:
  ganguli: 13 CLXVI
  text: O king, the Kuru chief Yudhishthira has been restored to his own nature, along with all brothers and followers.
  modern: "“O king, the Kuru chief Yudhiṣṭhira has returned to his natural state, together with all his brothers and followers."
anuzAsana-13-272-7:
  ganguli: 13 CLXVI
  text: With Krishna of great intelligence by his side, he bends his head in reverence unto thee. It behoveth thee to give him leave for returning to the city.
  modern: With wise Kṛṣṇa at his side, he bows his head in reverence to you. You should give him leave to return to the city.
anuzAsana-13-272-8:
  ganguli: 13 CLXVI
  text: Thus addressed by the holy Vyasa, the royal son of Santanu and Ganga dismissed Yudhishthira and his counsellors.
  modern: Thus addressed by the holy Vyāsa, the royal son of Śaṃtanu and Gaṅgā dismissed Yudhiṣṭhira and his counsellors.
anuzAsana-13-272-9:
  ganguli: 13 CLXVI
  text: Do thou return to the city, O king! Let fever of thy heart be dispelled.
  modern: "“Return to the city, O king! Let the fever of your heart be gone."
anuzAsana-13-272-11:
  ganguli: 13 CLXVI
  text: Devoted to the practice of the Kshatriya order, do thou, O son of Pritha, gratify the Pitris and the deities. Thou shalt then earn great benefits. Indeed, let the fever of thy heart be dispelled.
  modern: Devoted to the practice of the Kṣatriya order, gratify the Pitṛs and the gods, O son of Pṛthā. You will then gain great benefit. Let the fever of your heart go.
anuzAsana-13-272-14:
  ganguli: 13 CLXVI
  text: When the hour comes for my departure from this world, do thou come here, O king. The time when I shall take leave of my body is that period when the sun, stopping in his south-ward course, will begin to return northwards!
  modern: When the hour comes for my departure from this world, come here, O king. The time when I shall leave my body is when the sun, ceasing its southward course, begins to return north.
anuzAsana-13-272-15:
  ganguli: 13 CLXVI
  text: So be it! And saluted his grandsire with reverence and then set out, with all his relatives and followers, for the city called after the elephant.
  modern: The son of Kuntī answered, “So be it!” He saluted his grandsire with reverence and set out with all his relatives and followers for the city named after the elephant.
anuzAsana-13-273-5:
  ganguli: 13 CLXVII
  text: The blessed monarch having passed fifty nights in the capital recollected the time indicated by his grandsire as the hour of his departure from this world.
  modern: The blessed monarch passed fifty nights in the capital and then recalled the time his grandsire had named as the hour of his departure from this world.
anuzAsana-13-273-6:
  ganguli: 13 CLXVII
  text: Accompanied by a number of priests he then set out of the city named after the elephant, having seen that the sun ceasing to go southwards had begun to proceed in his northward course.
  modern: Accompanied by a number of priests, he then set out from the city named after the elephant, having seen that the sun had stopped going south and begun to move north.
anuzAsana-13-273-12:
  ganguli: 13 CLXVII
  text: Thus accompanied, the king set out from his city like a second chief of the deities. Soon he came upon the spot where the son of Santanu was till lying on his bed of arrows.
  modern: Thus accompanied, the king set out from his city like a second chief of the gods. Soon he came to the place where Śāntanu's son still lay on his bed of arrows.
anuzAsana-13-273-19:
  ganguli: 13 CLXVII
  text: Then king Yudhishthira the just, at the head of his brothers, addressed that foremost one of Kuru’s race, viz., the son of the River Ganga, as he lay on that bed of his, saying, ‘I am Yudhishthira, O king! Salutations to thee, O son of the River Janhavi! If thou hearest me still, tell me what I am to do for thee!
  modern: 'Then King Yudhiṣṭhira the just, at the head of his brothers, spoke to that foremost one of Kuru''s race, the son of the river Gaṅgā, as he lay on his bed: "I am Yudhiṣṭhira, O king! Salutations to you, son of the river Jāhnavī! If you can still hear me, tell me what I am to do for you.'
anuzAsana-13-273-21:
  ganguli: 13 CLXVII
  text: Preceptors of all branches of learning, Brahmanas, Ritwiks, all my brothers, thy son, viz., king Dhritarashtra of great energy, are all here with my counsellors as also Vasudeva of great prowess. …
  modern: Teachers of all branches of learning, Brāhmaṇas, priests, all my brothers, your son King Dhṛtarāṣṭra of great energy, my counselors, and the mighty Vāsudeva are all here. …
anuzAsana-13-273-26:
  ganguli: 13 CLXVII
  speaker: That thorough master of words said,
  speakerModern: 'That thorough master of words said:'
  text: By good luck, O son of Kunti, thou hast come here with all thy counsellors, O Yudhishthira! The thousand-rayed maker of day, the holy Surya has begun his northward course.
  modern: It is good fortune, son of Kuntī, that you have come here, Yudhiṣṭhira, with all your counselors. The thousand-rayed maker of day, the holy Sūrya, has begun his northward course.
anuzAsana-13-273-29:
  ganguli: 13 CLXVII
  text: Having said so unto Yudhishthira the son of Dharma, Ganga’s son Bhishma then saluted Dhritarashtra and said unto him as follows.
  modern: After saying this to Yudhiṣṭhira, son of Dharma, Gaṅgā's son Bhīṣma saluted Dhṛtarāṣṭra and spoke to him as follows.
anuzAsana-13-273-33:
  ganguli: 13 CLXVII
  text: Yudhishthira and his brothers are morally as much thy sons as they are the sons of Pandu. Observant of the duties of religion, do thou cherish and protect them.
  modern: Yudhiṣṭhira and his brothers are morally as much your sons as they are the sons of Pāṇḍu. Keep to the duties of religion, and cherish and protect them.
anuzAsana-13-273-35:
  ganguli: 13 CLXVII
  text: Thy sons were all wicked-souled. They were wedded to wrath and cupidity. Overwhelmed by envy, they were all of wicked behavior. It behoveth thee not to grieve for them!
  modern: Your sons were all wicked-souled. They were given to wrath and greed. Overcome by envy, they all behaved wickedly. You should not grieve for them."
anuzAsana-13-273-36:
  ganguli: 13 CLXVII
  speaker: Vaisampayana continued,
  speakerModern: 'Vaiśaṃpāyana continued:'
  text: Having said this much unto Dhritarashtra of great wisdom, the Kuru hero then addressed Vasudeva of mighty arms.
  modern: After saying this much to the very wise Dhṛtarāṣṭra, the Kuru hero then spoke to the mighty-armed Vāsudeva.
anuzAsana-13-273-37:
  ganguli: 13 CLXVII
  speaker: Bhishma said,
  speakerModern: 'Bhīṣma said:'
  text: O holy one, O god of all gods, O thou that art worshipped by all the deities and Asuras, O thou that didst cover the three worlds with three steps of thine, salutations to thee, O wielder of the conch, the discus, and the mace!
  modern: '"O holy one, god of all gods, worshipped by all gods and Asuras, you who covered the three worlds with three steps, salutations to you, wielder of the conch, discus and mace!'
anuzAsana-13-273-43:
  ganguli: 13 CLXVII
  text: Thee, O illustrious one, I know to be that ancient and best of Rishis who dwelt for many years in the company of Nara, in the retreat of Vadari.
  modern: I know you, O illustrious one, to be that ancient and best of Rishis who lived many years in the company of Nara, in the hermitage of Badarī.
anuzAsana-13-273-45:
  ganguli: 13 CLXVII
  text: Do thou, O Krishna, grant me leave, I shall cast off my body. Permitted by thee, I shall attain to the highest end!
  modern: Grant me leave, O Kṛṣṇa, to cast off my body. With your permission I shall reach the highest end."
anuzAsana-13-273-46:
  ganguli: 13 CLXVII
  speaker: Vasudeva said,
  speakerModern: 'Vāsudeva said:'
  text: I give thee leave, O Bhishma! Do thou, O king, attain to the status of the Vasus, O thou of great splendour, thou hast not been guilty of a single transgression in this world. …
  modern: "I give you leave, O Bhīṣma. Attain the status of the Vasus, O you of great splendor. You have not been guilty of a single transgression in this world. …"
anuzAsana-13-273-49:
  ganguli: 13 CLXVII
  text: It behoveth you to give me leave. Ye should strive for attaining to truth.
  modern: You should give me leave. Strive to attain truth.
anuzAsana-13-274-1:
  ganguli: 13 CLXVIII
  text: Having said so unto all the Kurus, Bhishma, the son of Santanu, remained silent for sometime, O chastiser of foes …
  modern: Having said this to all the Kurus, Bhīṣma, the son of Śaṃtanu, remained silent for a while, O chastiser of foes. …
anuzAsana-13-274-6:
  ganguli: 13 CLXVIII
  text: The life-breaths, restrained and unable to escape through any of the outlets, at last pierced through the crown of the head and proceeded upwards to heaven.
  modern: His life-breaths, restrained and unable to escape through any of the outlets, at last pierced through the crown of his head and went upward to heaven.
anuzAsana-13-274-7:
  ganguli: 13 CLXVIII
  text: The celestial kettle-drums began to play and floral showers were rained down. The Siddhas and regenerate Rishis, filled with delight, exclaimed, ‘Excellent, Excellent!’
  modern: Celestial kettledrums began to play and flowers rained down. The Siddhas and twice-born Rishis, filled with delight, cried, "Excellent, excellent!"
anuzAsana-13-274-17:
  ganguli: 13 CLXVIII
  text: Then covering the body of Ganga’s son with sandal wood and black aloe and the bark wood, other fragrant fuel, and setting fire to the same, the Kurus with Dhritarashtra and others, stood on the right sight of the funeral pyre. Those foremost ones of Kuru’s race, having thus cremated the body of the son of Ganga, proceeded to the sacred Bhagirathi, accompanied by the Rishis.
  modern: Then they covered the body of Gaṅgā's son with sandalwood, black aloe, bark and other fragrant fuel and set it on fire; the Kurus with Dhṛtarāṣṭra and the others stood on the right side of the funeral pyre. Having cremated the body of Gaṅgā's son, those foremost ones of Kuru's race went to the sacred Bhāgīrathī, accompanied by the Rishis.
Azvamedhika-14-1-3:
  ganguli: 14 I
  text: … the mighty-armed Yudhishthira, with his senses bewildered, placing the former in his front, ascended the banks (of the river), his eyes suffused with tears, and dropt down on the bank of the Ganga like an elephant pierced …
  modern: … the mighty-armed Yudhiṣṭhira, his senses bewildered, put Dhṛtarāṣṭra in front, climbed the bank of the river with eyes full of tears, and dropped down on the bank of the Gaṅgā like an elephant pierced …
Azvamedhika-14-14-2:
  ganguli: 14 XIV
  text: And O monarch, that lord of men exhorted by the worshipful Viswarasraba himself, and by Dwaipayana (Vyasa), Krishna Devasthana, Narada, Bhima, Nakula, Krishna (Draupadi), Sahadeva, and the sharpwitted Vijaya, as well as by other great men, and Brahmanas versed in the Sastras, became relieved of all mental affliction and sorrow arising from the death of his dear relations.
  modern: "And that lord of men, exhorted by the worshipful Viśvaśravas' son himself, and by Dvaipāyana, Kṛṣṇa, Devasthāna, Nārada, Bhīma, Nakula, Draupadī, Sahadeva and the sharp-witted Vijaya, as well as by other great men and by Brāhmaṇas versed in the scriptures, was relieved of all the grief and sorrow he felt for the death of his dear kinsmen."
Azvamedhika-14-15-1:
  ganguli: 14 XIV
  text: … and consoling his lordly uncle, possessed of eyes of wisdom, that virtuous prince continued to administer the earth with his brothers.
  modern: … and comforting his lordly uncle, who had the eyes of wisdom, that virtuous prince went on ruling the earth with his brothers.
mausala-15-1-1:
  ganguli: 16 I
  speaker: 'Vaishampayana said:'
  speakerModern: 'Vaiśaṃpāyana said:'
  text: When the thirty-sixth year (after the battle) was reached, the delighter of the Kurus, Yudhishthira, beheld many unusual portents.
  modern: When the thirty-sixth year after the battle had come, Yudhiṣṭhira, delight of the Kurus, saw many unusual portents.
mausala-15-3-18:
  ganguli: 16 II
  text: 'Beholding these signs that indicated the perverse course of Time, and seeing that the day of the new moon coincided with the thirteenth (and the fourteenth) lunation, Hrishikesa, summoning the Yadavas, said unto them these words: The fourteenth lunation has been made the fifteenth by Rahu once more.'
  modern: "Seeing these signs of the perverse course of Time, and seeing that the new-moon day fell on the thirteenth (and the fourteenth) lunar day, Hṛṣīkeśa called the Yādavas together and said to them, “Rāhu has once more made the fourteenth lunar day the fifteenth."
mausala-15-3-21:
  ganguli: 16 II
  text: The slayer of Keshi, Janardana, thinking upon the omens that Time showed, understood that the thirty-sixth year had come, and that what Gandhari, burning with grief on account of the death of her sons, and deprived of all her kinsmen, had said was about to transpire.
  modern: Janārdana, the slayer of Keśin, thinking about the omens Time showed, understood that the thirty-sixth year had come and that what Gāndhārī had said, burning with grief for her sons and robbed of all her kin, was about to come true.
mausala-15-3-23:
  ganguli: 16 II
  text: Vasudeva, having said so, endeavoured to bring about those occurrences which would make Gandhari’s words true. That chastiser of foes commanded the Vrishnis to make a pilgrimage to some sacred water.
  modern: Having said this, Vāsudeva set about making Gāndhārī's words come true. That chastiser of foes ordered the Vṛṣṇis to go on a pilgrimage to a sacred water.
mausala-15-4-11:
  ganguli: 16 III
  text: The Yadavas, then, with their wives, proceeded to Prabhasa and took up their residence there, each in the (temporary) habitation that was assigned to him, and all having an abundance of provisions consisting of edibles and drink.
  modern: The Yādavas, with their wives, went to Prabhāsa and took up residence there, each in the lodging assigned to him, all with plenty of food and drink.
mausala-15-4-16:
  ganguli: 16 III
  text: Those heroes of fierce energy then began their high revels, of which drinking formed the chief feature, at Prabhasa. The entire field echoed with the blare of hundreds of trumpets and abounded with actors and dancers plying their vocations.
  modern: Those heroes of fierce energy then began their great drinking revels at Prabhāsa. The whole field echoed with the blare of hundreds of trumpets and was crowded with actors and dancers at their trades.
mausala-15-4-38:
  ganguli: 16 III
  text: Then the Andhakas and the Bhojas, the Saineyas and the Vrishnis, urged by Time, struck one another in that fearful melee.
  modern: "Then the Andhakas and the Bhojas, the Śaineyas and the Vṛṣṇis, driven by Time, struck one another in that fearful melee."
mausala-15-4-42:
  ganguli: 16 III
  text: Son killed sire, and sire killed son, O Bharata. Inebriated with wine, they rushed and fell upon one another.
  modern: "Son killed father, and father killed son, O Bhārata. Drunk with wine, they rushed at one another and fell upon each other."
mausala-15-5-2:
  ganguli: 16 IV
  text: Finding Rama of great soul, Krishna commanded Daruka, saying, Going to the Kurus, inform Partha of this great slaughter of the Yadus. Let Arjuna come here quickly, hearing of the destruction of the Yadavas through the Brahmanas curse.
  modern: "Finding the great-souled Rāma, Kṛṣṇa ordered Dāruka: “Go to the Kurus and tell Pārtha about this great slaughter of the Yadus. Let Arjuna come here quickly, on hearing that the Yādavas were destroyed by the Brahmins' curse.”"
mausala-15-5-7:
  ganguli: 16 IV
  text: Entering the city of Dwaravati, Janardana said these words unto his father, Do thou protect all the ladies of our house, till Dhananjaya comes.
  modern: Entering the city of Dvāravatī, Janārdana said to his father, "Protect all the ladies of our house until Dhanañjaya comes.
mausala-15-5-9:
  ganguli: 16 IV
  text: It is impossible for me to see this city of the Yadavas without the Yadus beside me. Know that proceeding to the woods I shall practise penances with Rama in my company.
  modern: “I cannot bear to see this city of the Yādavas without the Yadus beside me. Know that I will go to the woods and practise austerities with Rāma for company.”
mausala-15-5-12:
  ganguli: 16 IV
  text: Proceeding then to the forest, Keshava beheld Rama sitting in a solitary spot thereof.
  modern: Going on to the forest, Keśava saw Rāma sitting in a solitary place.
mausala-15-5-13:
  ganguli: 16 IV
  text: He also saw that Rama had set himself to Yoga and that from out his mouth was issuing a mighty snake. The colour of that snake was white. Leaving the human body (in which he had dwelt so long), that high-souled naga of a 1,000 heads and having a form as large as that of a mountain, endued besides with red eyes, proceeded along that way which led to the ocean.
  modern: He also saw that Rāma had set himself to Yoga and that a mighty snake was coming out of his mouth. The snake was white. Leaving the human body he had lived in so long, that high-souled serpent, with a thousand heads, a form as huge as a mountain and red eyes, went along the way to the ocean.
mausala-15-5-14:
  ganguli: 16 IV
  text: Ocean himself, and many celestial snakes, and many sacred Rivers were there, for receiving him with honour. There were Karkotaka and Vasuki and Takshaka and Prithusravas and Varuna and Kunjara, and Misri and Sankha and Kumuda and Pundarika, and the high-souled Dhritarashtra, and Hrada and Kratha and Sitikantha of fierce energy, and Chakramanda and Atishanda, and that foremost of Nagas called Durmukha, and Amvarisha, and king Varuna himself, O monarch.
  modern: The Ocean himself, many celestial serpents and many sacred rivers were there to receive him with honor. There were Karkoṭaka, Vāsuki, Takṣaka, Pṛthuśravas, Varuṇa and Kuñjara, Miśri, Śaṅkha, Kumuda and Puṇḍarīka, the high-souled Dhṛtarāṣṭra, Hrāda, Krātha and the fierce Śitikaṇṭha, Cakramanda and Atiṣaṇḍa, the foremost of Nāgas called Durmukha, Ambarīṣa, and King Varuṇa himself, O monarch.
mausala-15-5-20:
  ganguli: 16 IV
  text: The high-souled one, thinking of the destruction of the Vrishnis and the Andhakas, as also of the previous slaughter of the Kurus, concluded that the hour (for his own departure from the world) had come. He then restrained his senses (in Yoga).
  modern: The high-souled one, thinking of the destruction of the Vṛṣṇis and the Andhakas and of the earlier slaughter of the Kurus, concluded that the hour of his own departure from the world had come. He then restrained his senses in Yoga.
mausala-15-5-22:
  ganguli: 16 IV
  text: Having restrained all his senses, speech, and mind, Krishna laid himself down in high Yoga. A fierce hunter of the name of Jara then came there, desirous of deer.
  modern: Having restrained all his senses, speech and mind, Kṛṣṇa lay down in deep Yoga. Then a fierce hunter named Jarā came there, hunting deer.
mausala-15-5-28:
  ganguli: 16 IV
  text: Then, O king, the illustrious Narayana of fierce energy, the Creator and Destroyer of all, that preceptor of Yoga, filling Heaven with his splendour, reached his own inconceivable region.
  modern: Then, O king, the illustrious Nārāyaṇa of fierce energy, creator and destroyer of all, teacher of Yoga, filling heaven with his splendor, reached his own inconceivable realm.
mausala-15-6-1:
  ganguli: 16 V
  speaker: 'Vaishampayana said:'
  speakerModern: 'Vaiśaṃpāyana said:'
  text: Meanwhile Daruka, going to the Kurus and seeing those mighty car-warriors, the son of Pritha, informed them of how the Vrishnis had slain one another with iron bolts.
  modern: Meanwhile Dāruka went to the Kurus and, seeing the mighty chariot-warriors, the sons of Pṛthā, told them how the Vṛṣṇis had slain one another with iron clubs.
mausala-15-6-2:
  ganguli: 16 V
  text: Hearing that the Vrishnis along with the Bhojas and Andhakas and Kukuras had all been slain, the Pandavas, burning with grief, became highly agitated.
  modern: Hearing that the Vṛṣṇis, with the Bhojas, Andhakas and Kukuras, had all been slain, the Pāṇḍavas, burning with grief, became greatly agitated.
mausala-15-6-3:
  ganguli: 16 V
  text: Then Arjuna, the dear friend of Keshava, bidding them farewell, set out for seeing his maternal uncle.
  modern: Then Arjuna, the dear friend of Keśava, took leave of them and set out to see his maternal uncle.
mausala-15-7-4:
  ganguli: 16 VI
  text: The old man of mighty arms, deeply afflicted, embraced Partha with his arms and wept aloud, remembering his sons, brothers, grandsons, daughters sons, and friends.
  modern: The old man of mighty arms, deeply afflicted, embraced Pārtha and wept aloud, remembering his sons, brothers, grandsons, daughters' sons and friends.
mausala-15-8-9:
  ganguli: 16 VII
  text: 'Then Partha, more grieved than they, addressed those grieving and cheerless citizens and officers who were more dead than alive, and said these words that were well suited to the occasion: …'
  modern: 'Then Pārtha, more grieved than they were, spoke to the grieving, cheerless citizens and officers, who were more dead than alive, with words suited to the moment: …'
mausala-15-8-10:
  ganguli: 16 VII
  text: The sea will soon engulf this city.
  modern: The sea will soon swallow this city.
mausala-15-8-11:
  ganguli: 16 VII
  text: Equip all your cars and place on them all your wealth. This Vajra (the grandson of Krishna) will be your king at Shakraprastha.
  modern: Make ready all your chariots and load them with all your wealth. This Vajra, Kṛṣṇa's grandson, will be your king at Śakraprastha.
mausala-15-8-15:
  ganguli: 16 VII
  text: When morning dawned, Vasudeva of great energy and prowess attained, through the aid of Yoga, to the highest goal.
  modern: When morning dawned, Vāsudeva of great energy and prowess reached, through Yoga, the highest goal.
mausala-15-8-33:
  ganguli: 16 VII
  text: The son of Pandu, having next performed duly those sraddha rites that are done to the dead, quickly set out on the seventh day, mounting on his car.
  modern: Having duly performed the funeral rites for the dead, the son of Pāṇḍu mounted his chariot and quickly set out on the seventh day.
mausala-15-8-34:
  ganguli: 16 VII
  text: The widows of the Vrishni heroes, wailing aloud, followed the high-souled son of Pandu.
  modern: The widows of the Vṛṣṇi heroes, wailing aloud, followed the high-souled son of Pāṇḍu.
mausala-15-8-43:
  ganguli: 16 VII
  text: After all the people had set out, the ocean, that home of sharks and alligators, flooded Dvaraka, which still teemed with wealth of every kind, with its waters.
  modern: After all the people had left, the ocean, home of sharks and crocodiles, flooded Dvārakā, which still teemed with wealth of every kind, with its waters.
mausala-15-8-47:
  ganguli: 16 VII
  text: Beholding those lordless widows escorted by Pritha’s son alone O Bharata, the robbers felt a great temptation (for plunder).
  modern: Seeing those widows without a lord escorted by Pṛthā's son alone, O Bhārata, the robbers felt a great temptation to plunder.
mausala-15-8-51:
  ganguli: 16 VII
  text: Urged by the perverse course of time they fell upon that vast concourse, frightening it with loud leonine shouts and desirous of slaughter.
  modern: Driven by the perverse course of time, they fell on that vast crowd, frightening it with loud lion-roars and eager to kill.
mausala-15-8-59:
  ganguli: 16 VII
  text: The concourse was very large. The robbers assailed it at different points. Arjuna tried his best to protect it, but could not succeed.
  modern: The crowd was very large, and the robbers attacked it at different points. Arjuna tried his best to protect it but could not.
mausala-15-8-66:
  ganguli: 16 VII
  text: Then Arjuna endeavoured to string his large, indestructible, celestial bow with some effort. He succeeded with great difficulty in stringing it, when the battle had become furious. He then began to think of his celestial weapons but they would not come to his mind. Beholding that furious battle, the loss of the might of his arm, and the non-appearance of his celestial weapons, Arjuna became greatly ashamed.
  modern: Then Arjuna tried, with some effort, to string his large, indestructible, celestial bow. He strung it with great difficulty, when the battle had become fierce. He then tried to call to mind his celestial weapons, but they would not come to him. Seeing that furious battle, the loss of the might of his arm and the failure of his celestial weapons to appear, Arjuna was deeply ashamed.
mausala-15-8-67:
  ganguli: 16 VII
  text: Regarding it all as the work of destiny, he became exceedingly cheerless. He then ceased, O king, to make further efforts, saying, he had not the power which he had before.
  modern: Regarding it all as the work of destiny, he became deeply dejected. He then stopped making further efforts, O king, saying he no longer had the power he once had.
mausala-15-8-68:
  ganguli: 16 VII
  text: The high-souled one, taking with him the remnant of the Vrishni women, and the wealth that was still with them, reached Kurukshetra.
  modern: The high-souled one took the remnant of the Vṛṣṇi women, and the wealth still left to them, and reached Kurukṣetra.
mausala-15-8-69:
  ganguli: 16 VII
  text: Thus bringing with him the remnant of the Vrishnis, he established them at different places. He established the son of Kritavarma at the city called Marttikavat, with the remnant of the women of the Bhoja king. Escorting the remainder, with children and old men and women, the son of Pandu established them, who were reft of heroes, in the city of Indraprastha. The dear son of Yuyudhana, with a company of old men and children and women, the righteous-souled Arjuna established on the banks of the Sarasvati.
  modern: So he brought the remnant of the Vṛṣṇis with him and settled them in different places. He settled the son of Kṛtavarman at the city called Mārttikāvata, with the remnant of the women of the Bhoja king. Escorting the rest, with children, old men and women, the son of Pāṇḍu settled those who were left without heroes in the city of Indraprastha. The dear son of Yuyudhāna, with a company of old men, children and women, the righteous Arjuna settled on the banks of the Sarasvatī.
mausala-15-8-77:
  ganguli: 16 VII
  text: Having done all these acts suited to the occasion, Arjuna, with eyes bathed in tears, then entered the retreat of Vyasa. There he beheld the Island-born Rishi seated at his ease.
  modern: Having done all these things the occasion required, Arjuna, his eyes bathed in tears, then entered Vyāsa's hermitage. There he saw the Island-born Rishi sitting at his ease.
mausala-15-9-7:
  ganguli: 16 VIII
  speaker: Arjuna said,
  speakerModern: 'Arjuna said:'
  text: He whose complexion was like that of a (newly-risen) cloud, he whose eyes were like a pair of large lotus petals, Krishna, has, with Rama, cast off his body and ascended to Heaven.
  modern: Kṛṣṇa, whose colour was like a cloud, whose eyes were like large lotus petals, has cast off his body with Rāma and gone to Heaven.
mausala-15-9-10:
  ganguli: 16 VIII
  text: The heroes of the Bhoja, the Andhaka, and the Vrishni races, O Brahmana, who were all endued with high souls, great might, and leonine pride, have slaughtered one another in battle. Possessed of arms that looked like maces of iron, and capable of bearing the strokes of heavy clubs and darts, alas, they have all been slain with blades of Eraka grass.
  modern: The heroes of the Bhoja, Andhaka and Vṛṣṇi races, O Brāhmaṇa, all high-souled, mighty and proud as lions, have killed one another in battle. Their arms were like iron clubs and could bear the blows of heavy maces and darts, yet alas, they have all been slain with blades of eraka grass.
mausala-15-9-15:
  ganguli: 16 VIII
  text: The death of the wielder of Sarnga is as incredible as the drying up of the ocean, the displacement of a mountain, the falling down of the vault of heaven, or the cooling property of fire.
  modern: The death of the wielder of the Śārṅga bow is as unbelievable as the drying up of the ocean, the moving of a mountain, the falling of the vault of heaven, or the coolness of fire.
mausala-15-9-16:
  ganguli: 16 VIII
  text: Deprived of the company of the Vrishni heroes, I desire not to live in this world.
  modern: Without the company of the Vṛṣṇi heroes, I do not want to live in this world.
mausala-15-9-17:
  ganguli: 16 VIII
  text: Another incident has happened that is more painful than this, O thou that art possessed of wealth of penances. Repeatedly thinking of it, my heart is breaking.
  modern: Another thing has happened that is more painful than this, O you who are rich in austerities. Thinking of it again and again, my heart is breaking.
mausala-15-9-18:
  ganguli: 16 VIII
  text: In my very sight, O Brahmana, thousands of Vrishni ladies were carried away by the Abhiras of the country of the five waters, who assailed us.
  modern: Before my very eyes, O Brāhmaṇa, thousands of Vṛṣṇi women were carried off by the Ābhīras of the land of the five rivers, who attacked us.
mausala-15-9-19:
  ganguli: 16 VIII
  text: Taking up my bow I found myself unequal to even string it.
  modern: When I took up my bow, I found I could not even string it.
mausala-15-9-27:
  ganguli: 16 VIII
  text: O best of men, it behoveth thee to tell me what is good for me now, for I am now a wanderer with an empty heart, despoiled of my kinsmen and of my possession.
  modern: O best of men, you should tell me what is good for me now, for I am a wanderer with an empty heart, robbed of my kinsmen and my possessions.
mausala-15-9-28:
  ganguli: 16 VIII
  text: That which has happened had been ordained. It was the destiny of those high-souled warriors. Krishna suffered it to take place although he was fully competent to baffle it.
  modern: What has happened had been ordained. It was the fate of those high-souled warriors. Kṛṣṇa let it happen, though he was fully able to prevent it.
mausala-15-9-29:
  ganguli: 16 VIII
  speaker: Vyasa said,
  speakerModern: 'Vyāsa said:'
  text: The mighty car-warriors of the Vrishni and the Andhaka races have all been consumed by the Brahmanas curse. O chief of Kuru’s race, it behoveth thee not to grieve for their destruction.
  modern: The mighty chariot-warriors of the Vṛṣṇi and Andhaka races have all been consumed by the Brāhmaṇas' curse. O chief of Kuru's race, you should not grieve for their destruction.
mausala-15-9-34:
  ganguli: 16 VIII
  text: That high-souled one of expansive eyes, Krishna, having lightened the burthen of the Earth and cast off his (human) body, has attained to his own high seat.
  modern: That high-souled one with wide eyes, Kṛṣṇa, having lightened the burden of the Earth and cast off his human body, has reached his own high seat.
mausala-15-9-35:
  ganguli: 16 VIII
  text: By thee also, O foremost of men, with Bhima for thy helpmate and the twins, O mighty-armed hero, has the great work of the gods been accomplished.
  modern: You too, O foremost of men, with Bhīma as your helper and the twins, O mighty-armed hero, have accomplished the great work of the gods.
mausala-15-9-37:
  ganguli: 16 VIII
  text: Even thus, understanding and prowess and foresight, O Bharata, arise when days of prosperity have not outrun.
  modern: In this way, O Bhārata, understanding, prowess and foresight arise when days of prosperity have not run out.
mausala-15-9-38:
  ganguli: 16 VIII
  text: Time is, indeed, the seed of the universe, O Dhananjaya. It is Time, again, that withdraws everything at its pleasure.
  modern: Time is indeed the seed of the universe, O Dhanañjaya. And it is Time that takes everything back at its pleasure.
mausala-15-9-41:
  ganguli: 16 VIII
  text: The time has come, O Bharata, for you all to attain to the highest goal. Even this is what I regard to be highly beneficial for you all, O chief of Bharata’s race.
  modern: The time has come, O Bhārata, for you all to attain the highest goal. This, I think, is greatly to your benefit, O chief of the Bharatas.
mausala-15-9-42:
  ganguli: 16 VIII
  speaker: 'Vaishampayana continued:'
  speakerModern: 'Vaiśaṃpāyana continued:'
  text: Having heard these words of Vyasa of immeasurable energy, the son of Pritha, receiving his permission, returned to the city named after the elephant.
  modern: Having heard these words of Vyāsa of immeasurable energy, and with his permission, the son of Pṛthā returned to the city named after the elephant.
mausala-15-9-43:
  ganguli: 16 VIII
  text: Entering it, the hero approached Yudhishthira and informed him of all that had taken place with reference to the Vrishnis.
  modern: Entering it, the hero went to Yudhiṣṭhira and told him all that had happened to the Vṛṣṇis.
mahAprasthAnika-17-1-2:
  ganguli: 17 I
  speaker: 'Vaishampayana said:'
  speakerModern: 'Vaiśaṃpāyana said:'
  text: Having heard the particulars of the great slaughter of the Vrishnis, the Kaurava king set his heart on leaving the world.
  modern: Having heard the details of the great slaughter of the Vṛṣṇis, the Kaurava king set his heart on leaving the world.
mahAprasthAnika-17-1-6:
  ganguli: 17 I
  text: Yudhishthira made over the kingdom to the son of his uncle by his Vaisya wife.
  modern: Yudhiṣṭhira gave the kingdom to his uncle's son by a Vaiśya wife.
mahAprasthAnika-17-1-7:
  ganguli: 17 I
  text: Installing Parikshit also on their throne, as king, the eldest brother of the Pandavas, filled with sorrow, addressed Subhadra, saying, This son of thy son will be the king of the Kurus.
  modern: He also installed Parīkṣit as king on their throne, and the eldest of the Pāṇḍavas, filled with sorrow, said to Subhadrā, "This son of your son will be king of the Kurus."
mahAprasthAnika-17-1-21:
  ganguli: 17 I
  text: Then Dharma’s son, Yudhishthira, the king of the Kurus, casting off his ornaments, wore barks of trees.
  modern: Then Yudhiṣṭhira, son of Dharma, king of the Kurus, took off his ornaments and put on bark garments.
mahAprasthAnika-17-1-22:
  ganguli: 17 I
  text: Bhima and Arjuna and the twins, and Draupadi also of great fame, similarly clad themselves in bark of trees, O king.
  modern: Bhīma, Arjuna, the twins and the famous Draupadī likewise put on garments of bark, O king.
mahAprasthAnika-17-1-25:
  ganguli: 17 I
  text: The brothers, however, were all very cheerful at the prospect of retirement. Ascertaining the intentions of Yudhishthira and seeing the destruction of the Vrishnis, no other course of action could please them then.
  modern: The brothers were all very cheerful at the prospect of retiring. Having learned Yudhiṣṭhira's intention and seen the destruction of the Vṛṣṇis, no other course could please them then.
mahAprasthAnika-17-1-26:
  ganguli: 17 I
  text: The five brothers, with Draupadi forming the sixth, and a dog forming the seventh, set out on their journey. Indeed, even thus did king Yudhishthira depart, himself the head of a party of seven, from the city named after the elephant. The citizen and the ladies of the royal household followed them for some distance.
  modern: The five brothers, with Draupadī as the sixth and a dog as the seventh, set out on their journey. So King Yudhiṣṭhira left the city named after the elephant, himself at the head of a party of seven. The citizens and the ladies of the royal household followed them for some distance.
mahAprasthAnika-17-2-1:
  ganguli: 17 II
  speaker: 'Vaishampayana said:'
  speakerModern: 'Vaiśaṃpāyana said:'
  text: Those princes of restrained souls and devoted to Yoga, proceeding to the north, beheld Himavat, that very large mountain.
  modern: Those princes of controlled souls, devoted to Yoga, went north and saw Himavat, that very great mountain.
mahAprasthAnika-17-2-3:
  ganguli: 17 II
  text: As those mighty ones were proceeding quickly, all rapt in Yoga, Yajnaseni, falling of from Yoga, dropped down on the Earth.
  modern: As those mighty ones went quickly on, all absorbed in Yoga, Yājñasenī lost her hold on Yoga and fell to the ground.
mahAprasthAnika-17-2-4:
  ganguli: 17 II
  text: Beholding her fallen down, Bhimasena of great strength addressed king Yudhishthira the just, saying, O scorcher of foes, this princess never did any sinful act.
  modern: Seeing her fallen, mighty Bhīmasena said to King Yudhiṣṭhira the just, "O scorcher of foes, this princess never did any sinful act.
mahAprasthAnika-17-2-5:
  ganguli: 17 II
  text: Tell us what the cause is for which Krishna has fallen down on the Earth!
  modern: Tell us the reason why Kṛṣṇā has fallen to the ground."
mahAprasthAnika-17-2-6:
  ganguli: 17 II
  speaker: 'Yudhishthira said:'
  speakerModern: 'Yudhiṣṭhira said:'
  text: O best of men, though we were all equal unto her she had great partiality for Dhananjaya. She obtains the fruit of that conduct today, O best of men.
  modern: '"Though we were all equal to her, O best of men, she was partial to Dhanañjaya. She reaps the fruit of that conduct today, O best of men."'
mahAprasthAnika-17-2-8:
  ganguli: 17 II
  text: Beholding him drop down, Bhima addressed the king, saying, He who with great humility used to serve us all, alas, why is that son of Madravati fallen down on the Earth?
  modern: Seeing him fall, Bhīma said to the king, "He who served us all with such humility, why has that son of Mādravatī fallen to the ground?"
mahAprasthAnika-17-2-9:
  ganguli: 17 II
  text: (with mahAprasthAnika-17-2-8)
mahAprasthAnika-17-2-10:
  ganguli: 17 II
  speaker: Yudhishthira said,
  speakerModern: 'Yudhiṣṭhira said:'
  text: He never thought anybody his equal in wisdom. It is for that fault that this prince has fallen down.
  modern: '"He thought no one his equal in wisdom. For that fault this prince has fallen."'
mahAprasthAnika-17-2-14:
  ganguli: 17 II
  text: Upon the falling down of the heroic Nakula of great personal beauty, Bhima once more addressed the king, saying, This brother of ours who was endued with righteousness without incompleteness, and who always obeyed our behests, this Nakula who was unrivalled for beauty, has fallen down.
  modern: 'Upon the fall of the heroic Nakula of great beauty, Bhima once more addressed the king: “This brother of ours, who was righteous without fault and always obeyed our orders, this Nakula, unrivalled for his beauty, has fallen down.'
mahAprasthAnika-17-2-16:
  ganguli: 17 II
  text: He, however, thought that there was nobody that equalled him in beauty of person.
  modern: But he thought that no one equaled him in beauty of person."
mahAprasthAnika-17-2-18:
  ganguli: 17 II
  text: Beholding Nakula and the others fall down, Pandus son Arjuna of white steeds, that slayer of hostile heroes, fell down in great grief of heart.
  modern: Seeing Nakula and the others fall, Pāṇḍu's son Arjuna of the white horses, slayer of hostile heroes, fell down, deeply grieved at heart.
mahAprasthAnika-17-2-19:
  ganguli: 17 II
  text: When that foremost of men, who was endued with the energy of Shakra, had fallen down, indeed, when that invincible hero was on the point of death, Bhima said unto the king, I do not recollect any untruth uttered by this high-souled one.
  modern: When that foremost of men, who had the energy of Śakra, had fallen, when that invincible hero was dying, Bhīma said to the king, "I do not remember any untruth spoken by this high-souled one.
mahAprasthAnika-17-2-20:
  ganguli: 17 II
  text: Indeed, not even in jest did he say anything false. What then is that for whose evil consequence this one has fallen down on the Earth?
  modern: Not even in jest did he say anything false. Then what is the cause of the evil consequence for which he has fallen to the earth?"
mahAprasthAnika-17-2-21:
  ganguli: 17 II
  speaker: Yudhishthira said,
  speakerModern: 'Yudhiṣṭhira said:'
  text: Arjuna had said that he would consume all our foes in a single day. Proud of his heroism, he did not, however, accomplish what he had said.
  modern: '"Arjuna said that he would burn up all our foes in a single day. Proud of his heroism, he did not do what he had said."'
mahAprasthAnika-17-2-23:
  ganguli: 17 II
  text: Then Bhima fell down.
  modern: Then Bhīma fell down.
mahAprasthAnika-17-2-24:
  ganguli: 17 II
  text: Having fallen down, Bhima addressed king Yudhishthira the just, saying, O king, behold, I who am thy darling have fallen down. For what reason have I dropped down? Tell me if thou knowest it.
  modern: Having fallen, Bhīma said to King Yudhiṣṭhira the just, "O king, look, I who am your darling have fallen. For what reason have I fallen? Tell me if you know."
mahAprasthAnika-17-2-25:
  ganguli: 17 II
  speaker: Yudhishthira said,
  speakerModern: 'Yudhiṣṭhira said:'
  text: Thou wert a great eater, and thou didst use to boast of thy strength. Thou never didst attend, O Bhima, to the wants of others while eating. It is for that, O Bhima, that thou hast fallen down.
  modern: '"You ate too much, and you used to boast of your strength. You never, Bhīma, thought of the needs of others while you ate. That is why you have fallen, Bhīma."'
mahAprasthAnika-17-2-26:
  ganguli: 17 II
  text: Having said these words, the mighty-armed Yudhishthira proceeded on, without looking back. He had only one companion, the dog of which I have repeatedly spoken to thee, that followed him now.
  modern: Having said these words, the mighty-armed Yudhiṣṭhira went on without looking back. He had only one companion, the dog I have spoken of to you many times, which now followed him.
mahAprasthAnika-17-3-1:
  ganguli: 17 III
  speaker: 'Vaishampayana said:'
  speakerModern: 'Vaiśaṃpāyana said:'
  text: Then Shakra, causing the firmament and the Earth to be filled by a loud sound, came to the son of Pritha on a car and asked him to ascend it.
  modern: Then Śakra, filling the sky and the earth with a loud sound, came to the son of Pṛthā on a chariot and told him to get in.
mahAprasthAnika-17-3-3:
  ganguli: 17 III
  text: 'Beholding his brothers fallen on the Earth, king Yudhishthira the just said unto that deity of a 1,000 eyes these words: My brothers have all dropped down here. They must go with me. Without them by me I do not wish to go to Heaven, O lord of all the deities.'
  modern: Seeing his brothers fallen to the earth, King Yudhiṣṭhira the just said to that god of a thousand eyes, "My brothers have all fallen here. They must go with me. I do not want to go to heaven without them, O lord of all the gods.
mahAprasthAnika-17-3-4:
  ganguli: 17 III
  text: The delicate princess (Draupadi) deserving of every comfort, O Purandara, should go with us. It behoveth thee to permit this.
  modern: The delicate princess Draupadī, who deserves every comfort, O Purandara, should go with us. You should permit this."
mahAprasthAnika-17-3-6:
  ganguli: 17 III
  speaker: Shakra said,
  speakerModern: 'Śakra said:'
  text: … Having cast off their human bodies they have gone there, O chief of Bharata’s race. As regards thee, it is ordained that thou shalt go thither in this very body of thine.
  modern: … They have cast off their human bodies and gone there, O chief of Bharata's race. As for you, it is ordained that you will go there in this very body of yours."
mahAprasthAnika-17-3-7:
  ganguli: 17 III
  speaker: Yudhishthira said,
  speakerModern: 'Yudhiṣṭhira said:'
  text: This dog, O lord of the Past and the Present, is exceedingly devoted to me. He should go with me. My heart is full of compassion for him.
  modern: '"This dog, O lord of the past and the present, is exceedingly devoted to me. He should go with me. My heart is full of compassion for him."'
mahAprasthAnika-17-3-8:
  ganguli: 17 III
  speaker: Shakra said,
  speakerModern: 'Śakra said:'
  text: Immortality and a condition equal to mine, O king, prosperity extending in all directions, and high success, and all the felicities of Heaven, thou hast won today. Do thou cast off this dog. In this there will be no cruelty.
  modern: '"Immortality, a condition equal to mine, O king, prosperity extending in all directions, high success and all the joys of heaven you have won today. Cast off this dog. There will be no cruelty in this."'
mahAprasthAnika-17-3-9:
  ganguli: 17 III
  speaker: Yudhishthira said,
  speakerModern: 'Yudhiṣṭhira said:'
  text: O thou of a 1,000 eyes. O thou that art of righteous behaviour, it is exceedingly difficult for one that is of righteous behaviour to perpetrate an act that is unrighteous. I do not desire that union with prosperity for which I shall have to cast off one that is devoted to me.
  modern: '"O you of a thousand eyes, O you of righteous conduct, it is very hard for one of righteous conduct to do an unrighteous act. I do not want union with prosperity if I must abandon one who is devoted to me to get it."'
mahAprasthAnika-17-3-14:
  ganguli: 17 III
  text: Having abandoned thy brothers and Krishna, thou hast, O hero, acquired a region of felicity by thy own deeds. Why art thou so stupefied? Thou hast renounced everything. Why then dost thou not renounce this dog?
  modern: Having abandoned your brothers and Kṛṣṇā, you have won a region of bliss by your own deeds, O hero. Why are you so bewildered? You have renounced everything. Why then do you not renounce this dog?"
mahAprasthAnika-17-3-15:
  ganguli: 17 III
  speaker: Yudhishthira said,
  speakerModern: 'Yudhiṣṭhira said:'
  text: This is well known in all the worlds that there is neither friendship nor enmity with those that are dead. When my brothers and Krishna died, I was unable to revive them. Hence it was that I abandoned them. I did not, however, abandon them as long as they were alive. …
  modern: '"It is well known in all the worlds that there is neither friendship nor enmity with the dead. When my brothers and Kṛṣṇā died, I could not bring them back to life. That is why I left them. But I did not abandon them as long as they were alive. …'
mahAprasthAnika-17-3-17:
  ganguli: 17 III
  speaker: 'Vaishampayana continued:'
  speakerModern: 'Vaiśaṃpāyana continued:'
  text: Hearing these words of king Yudhishthira the just, (the dog became transformed into) the deity of Righteousness, who, well pleased, said these words unto him in a sweet voice fraught with praise.
  modern: Hearing these words of King Yudhiṣṭhira the just, the dog became transformed into the god of Righteousness, who, well pleased, spoke to him in a sweet voice, full of praise.
mahAprasthAnika-17-3-18:
  ganguli: 17 III
  speaker: 'Dharma said:'
  speakerModern: 'Dharma said:'
  text: Thou art well born, O king of kings, and possessed of the intelligence and the good conduct of Pandu. Thou hast compassion for all creatures, O Bharata, of which this is a bright example.
  modern: '"You are well born, O king of kings, and have the intelligence and good conduct of Pāṇḍu. You have compassion for all creatures, O Bhārata, and this is a bright example of it.'
mahAprasthAnika-17-3-19:
  ganguli: 17 III
  text: Formerly, O son, thou wert once examined by me in the woods of Dwaita, where thy brothers of great prowess met with (an appearance of) death.
  modern: Once before, my son, I tested you in the woods of Dvaita, where your mighty brothers met with what seemed to be death.
mahAprasthAnika-17-3-20:
  ganguli: 17 III
  text: Disregarding both thy brothers Bhima and Arjuna, thou didst wish for the revival of Nakula from thy desire of doing good to thy (step-) mother.
  modern: Disregarding both your brothers Bhīma and Arjuna, you wished for the revival of Nakula, from your wish to do good to your stepmother.
mahAprasthAnika-17-3-21:
  ganguli: 17 III
  text: On the present occasion, thinking the dog to be devoted to thee, thou hast renounced the very car of the celestials instead of renouncing him. Hence.
  modern: Now, thinking the dog devoted to you, you have given up the very chariot of the gods rather than give up the dog. Therefore
mahAprasthAnika-17-3-22:
  ganguli: 17 III
  text: O king, there is no one in Heaven that is equal to thee. Hence, O Bharata, regions of inexhaustible felicity are thine. Thou hast won them, O chief of the Bharatas, and thine is a celestial and high goal.
  modern: there is no one in heaven equal to you, O king. So, O Bhārata, regions of inexhaustible happiness are yours. You have won them, O chief of the Bhāratas, and yours is a celestial and high goal."
mahAprasthAnika-17-3-25:
  ganguli: 17 III
  text: King Yudhishthira, that perpetuator of Kuru’s race, riding on that car, ascended quickly, causing the entire welkin to blaze with his effulgence.
  modern: King Yudhiṣṭhira, perpetuator of Kuru's race, riding in that chariot, rose quickly, filling the whole sky with his splendor.
svargArohana-18-1-4:
  ganguli: 18 I
  text: Arrived at Heaven, king Yudhishthira the just, beheld Duryodhana endued with prosperity and seated on an excellent seat.
  modern: Having reached heaven, King Yudhiṣṭhira the just saw Duryodhana, in all his splendor, seated on an excellent seat.
svargArohana-18-1-22:
  ganguli: 18 I
  text: Though thus addressed by Narada, the Kuru king Yudhishthira, endued with great intelligence, enquired about his brothers and said, … I desire to see what regions have been attained by those high-souled heroes, my brothers of high vows, steady achievers of promises, truthful in speech, and distinguished for courage.
  modern: 'Though Nārada had spoken to him in this way, King Yudhiṣṭhira, a man of great understanding, asked about his brothers: “… I wish to see what regions have been won by those high-souled heroes, my brothers of firm vows, who kept their promises, spoke the truth and were known for their courage.'
svargArohana-18-1-23:
  ganguli: 18 I
  text: The high-souled Karna, the son of Kunti, incapable of being baffled in battle, Dhrishtadyumna, Satyaki, the sons of Dhrishtadyumna and those other Kshatriyas who met with death in the observance of Kshatriya practices, where are those lords of Earth, O Brahmana?
  modern: 'Karṇa, the high-souled son of Kuntī, who could not be thwarted in battle, Dhṛṣṭadyumna, Sātyaki, the sons of Dhṛṣṭadyumna, and those other Kṣatriyas who died keeping to the practices of Kṣatriyas: where are those lords of the earth, O Brāhmaṇa?'
svargArohana-18-2-9:
  ganguli: 18 II
  text: Wherever may that child of Surya be, I desire to see him.
  modern: Wherever that child of Sūrya may be, I wish to see him.
svargArohana-18-2-11:
  ganguli: 18 II
  text: I wish to see the princess of Pancala, whose conduct was always righteous.
  modern: I want to see the princess of Pañcāla, whose conduct was always righteous.
svargArohana-18-2-12:
  ganguli: 18 II
  text: Ye foremost ones among the deities, what is Heaven to me if I am dissociated from my brothers? That is Heaven where those brothers of mine are.
  modern: Foremost of the gods, what is heaven to me if I am separated from my brothers? Heaven is wherever those brothers of mine are."
svargArohana-18-2-13:
  ganguli: 18 II
  speaker: The gods said,
  speakerModern: 'The gods said:'
  text: If thou longest to be there, go then, O son, without delay. At the command of the chief of the deities, we are ready to do what is agreeable to thee.
  modern: “If you long to be there, go without delay, O son. At the command of the chief of the gods, we are ready to do what pleases you.”
svargArohana-18-2-14:
  ganguli: 18 II
  speaker: 'Vaishampayana continued:'
  speakerModern: 'Vaiśaṃpāyana continued:'
  text: Having said so, the gods then ordered the celestial messenger, O scorcher of foes, saying, Do thou show unto Yudhishthira his friends and kinsmen.
  modern: 'Having said this, the gods ordered the divine messenger, O scorcher of foes: "Show Yudhiṣṭhira his friends and kinsmen."'
svargArohana-18-2-15:
  ganguli: 18 II
  text: Then the royal son of Kunti and the celestial messenger proceeded together, O foremost of kings, to that place where those chiefs of men (whom Yudhishthira had wished to see) were.
  modern: Then the royal son of Kuntī and the divine messenger went together, O foremost of kings, to the place where those chiefs of men, whom Yudhiṣṭhira had wished to see, were.
svargArohana-18-2-16:
  ganguli: 18 II
  text: The celestial messenger proceeded first, the king followed him behind.
  modern: The divine messenger went first, and the king followed behind.
svargArohana-18-2-25:
  ganguli: 18 II
  text: The son of Kunti beheld also the tortures inflicted upon sinful men.
  modern: The son of Kuntī also saw the tortures inflicted on sinful men.
svargArohana-18-2-26:
  ganguli: 18 II
  text: Beholding that inauspicious region abounding with every sort of foulness, Yudhishthira asked the celestial messenger, saying, How far shall we proceed along a path like this? It behoveth thee to tell me where those brothers of mine are.
  modern: Seeing that inauspicious region, full of every kind of foulness, Yudhiṣṭhira asked the divine messenger, "How far shall we go along a path like this? Please tell me where those brothers of mine are."
svargArohana-18-2-28:
  ganguli: 18 II
  text: Hearing these words of king Yudhishthira the just, the celestial messenger stopped in his course and replied, saying, Thus far is your way. The denizens of Heaven commanded me that having come thus far, I am to stop. If thou art tired, O king of kings, thou mayst return with me.
  modern: Hearing these words of King Yudhiṣṭhira the just, the divine messenger stopped and replied, "This is as far as your way goes. The dwellers of heaven commanded me that, having come this far, I should stop. If you are tired, O king of kings, you may return with me."
svargArohana-18-2-31:
  ganguli: 18 II
  text: Yudhishthira, however, was exceedingly disconsolate and stupefied by the foul odour. Resolved to return, O Bharata, he retraced his steps. Afflicted by sorrow and grief, the righteous-souled monarch turned back.
  modern: Yudhiṣṭhira, though, was very downcast and stupefied by the foul smell. He decided to return, O Bhārata, and retraced his steps. Afflicted with sorrow and grief, the righteous-souled monarch turned back.
svargArohana-18-2-32:
  ganguli: 18 II
  text: Just at that moment he heard piteous lamentations all around, O son of Dharma, O royal sage, O thou of sacred origin, O son of Pandu, do thou stay a moment for favouring us. …
  modern: 'Just then he heard piteous cries all around: "O son of Dharma, O royal sage, O you of sacred birth, O son of Pāṇḍu, stay a moment to do us a favor. …'
svargArohana-18-2-35:
  ganguli: 18 II
  text: O son of Pritha, let that happiness last longer through thy stay here, for a few moments more. Do thou remain here, O Bharata, for even a short while. As long as thou art here, O thou of Kuru’s race, torments cease to afflict us.
  modern: O son of Pṛthā, let that happiness last longer through your staying here a few moments more. Stay here, O Bhārata, even for a short while. As long as you are here, O you of Kuru's race, the torments cease to afflict us."
svargArohana-18-2-37:
  ganguli: 18 II
  text: Hearing those words of beings in woe, Yudhishthira of compassionate heart exclaimed aloud, Alas, how painful! And the king stood still.
  modern: Hearing those words of beings in woe, Yudhiṣṭhira, whose heart was full of compassion, cried out, "Alas, how painful!" And the king stood still.
svargArohana-18-2-39:
  ganguli: 18 II
  text: Unable to recognise voices, Dharma’s son, Yudhishthira, enquired, saying, Who are you? Why also do you stay here?
  modern: Unable to recognize the voices, Dharma's son Yudhiṣṭhira asked, "Who are you? And why do you stay here?"
svargArohana-18-2-40:
  ganguli: 18 II
  text: Thus addressed, they answered him from all sides, saying, I am Karna! I am Bhimasena! I am Arjuna! I am Nakula! I am Sahadeva! I am Dhrishtadyumna! I am Draupadi! We are the sons of Draupadi! Even thus, O king, did those voices speak.
  modern: 'Thus addressed, they answered him from all sides: "I am Karṇa! I am Bhīmasena! I am Arjuna! I am Nakula! I am Sahadeva! I am Dhṛṣṭadyumna! I am Draupadī! We are the sons of Draupadī!" So, O king, did those voices speak.'
svargArohana-18-2-43:
  ganguli: 18 II
  text: What are those sinful acts which were committed by those high-souled beings, Karna and the sons of Draupadi, and the slender-waisted princess of Pancala, so that their residence has been assigned in this region of foetid smell and great woe?
  modern: What are those sinful acts that these high-souled beings, Karṇa, the sons of Draupadī, and the slender-waisted princess of Pañcāla, committed, that their dwelling has been assigned in this region of foul smell and great woe?
svargArohana-18-2-44:
  ganguli: 18 II
  text: I am not aware of any transgression that can be attributed to these persons of righteous deeds.
  modern: I am not aware of any transgression that could be attributed to these persons of righteous deeds.
svargArohana-18-2-50:
  ganguli: 18 II
  text: The royal son of Dharma then gave way to great wrath. Indeed, Yudhishthira then censured the gods, as also Dharma himself.
  modern: The royal son of Dharma then gave way to great wrath. Yudhiṣṭhira then blamed the gods, and Dharma himself.
svargArohana-18-2-51:
  ganguli: 18 II
  text: Afflicted by the very foul odour, he addressed the celestial messenger, saying, Return to the presence of those whose messenger thou art.
  modern: Afflicted by the very foul smell, he said to the divine messenger, "Go back to those whose messenger you are.
svargArohana-18-2-52:
  ganguli: 18 II
  text: Tell them that I shall not go back to where they are, but shall stay even here, since, in consequence of my companionship, these afflicted brothers of mine have become comforted.
  modern: Tell them that I shall not go back to where they are, but will stay right here, since my companionship has comforted these afflicted brothers of mine."
svargArohana-18-3-1:
  ganguli: 18 III
  speaker: Vaishampayana said,
  speakerModern: 'Vaiśaṃpāyana said:'
  text: King Yudhishthira the just, the son of Pritha, had not stayed there for more than a moment when, O thou of Kuru’s race, all the gods with Indra at their head came to that spot.
  modern: King Yudhiṣṭhira the just, son of Pṛthā, had not stayed there more than a moment when, O you of Kuru's race, all the gods with Indra at their head came to that spot.
svargArohana-18-3-9:
  ganguli: 18 III
  text: The Maruts, with Indra, the Vasus with the twin Ashvinis, the Sadhyas, the Rudras, the Adityas, and the other denizens of Heaven, as also the Siddhas and the great Rishis, all came there where Dharma’s royal son of great energy was.
  modern: The Maruts with Indra, the Vasus with the twin Aśvins, the Sādhyas, the Rudras, the Ādityas and the other denizens of Heaven, as well as the Siddhas and the great Ṛṣis, all came to the place where Dharma's royal son of great energy stood.
svargArohana-18-3-13:
  ganguli: 18 III
  text: Thou shouldst not yield to wrath. Listen to these words of mine. Hell, O son, should without doubt be beheld by every king.
  modern: You should not give way to anger. Listen to my words. Hell, my son, must without doubt be seen by every king.
svargArohana-18-3-17:
  ganguli: 18 III
  text: Thou hadst, by a pretence, deceived Drona in the matter of his son. Thou hast, in consequence thereof, been shown Hell by an act of deception.
  modern: You deceived Droṇa by a pretense about his son. Because of that you have been shown hell by a deception.
svargArohana-18-3-19:
  ganguli: 18 III
  text: All those kings who had aided thee and who have been slain in battle, have all attained to Heaven. Come and behold them, O foremost one of Bharata’s race.
  modern: All those kings who aided you and were killed in battle have reached Heaven. Come and see them, O foremost of the Bharatas.
svargArohana-18-3-29:
  ganguli: 18 III
  text: Here is the celestial river, sacred and sanctifying the three worlds. It is called Heavenly Ganga. Plunging into it, thou wilt go to thy own regions.
  modern: Here is the celestial river, sacred, purifying the three worlds. It is called Heavenly Gaṅgā. Plunge into it and you will go to your own regions.
svargArohana-18-3-30:
  ganguli: 18 III
  text: Having bathed in this stream, thou wilt be divested of thy human nature. Indeed, thy grief dispelled, thy ailments conquered, thou wilt be freed from all enmities.
  modern: When you bathe in this stream, you will lose your human nature. Your grief gone, your ailments conquered, you will be freed from all enmities.
svargArohana-18-3-32:
  ganguli: 18 III
  text: While, O Kuru king, the chief of the gods was saying so unto Yudhishthira, the deity of Righteousness, in his embodied form, then addressed his own son and said, O king, I am greatly pleased, O thou of great wisdom, with thee, O son, by thy devotion to me, by thy truthfulness of speech, and forgiveness, and self-restraint.
  modern: 'While the chief of the gods was speaking thus to Yudhiṣṭhira, O Kuru king, the god of Righteousness, in his embodied form, spoke to his own son: "O king, I am greatly pleased with you, O you of great wisdom, because of your devotion to me, your truthful speech, your forgiveness and your self-restraint.'
svargArohana-18-3-34:
  ganguli: 18 III
  text: Before this, I had examined thee in the Dwaita woods by my questions, when thou hadst come to that lake for recovering a couple of fire sticks. Thou stoodst it well.
  modern: Before this, I examined you in the Dvaita woods with my questions, when you had come to that lake to recover a pair of fire-sticks. You stood the test well.
svargArohana-18-3-35:
  ganguli: 18 III
  text: Assuming the shape of a dog, I examined thee once more, O son, when thy brothers with Draupadi had fallen down.
  modern: Taking the shape of a dog, I tested you once more, my son, when your brothers had fallen with Draupadī.
svargArohana-18-3-36:
  ganguli: 18 III
  text: This has been thy third test; thou hast expressed thy wish to stay at Hell for the sake of thy brothers. Thou hast become cleansed, O highly blessed one.
  modern: This was your third test. You said you wished to stay in hell for the sake of your brothers. You have become cleansed, O greatly blessed one.
svargArohana-18-3-37:
  ganguli: 18 III
  text: O son of Pritha, thy brothers, O king, were not such as to deserve Hell. All this has been an illusion created by the chief of the gods.
  modern: Your brothers, O king, son of Pṛthā, were not such as to deserve hell. All this was an illusion created by the chief of the gods.
svargArohana-18-3-40:
  ganguli: 18 III
  text: O king, neither Arjuna, nor Bhima, nor any of those foremost of men, viz., the twins, nor Karna, ever truthful in speech and possessed of great courage, could be deserving of Hell for a long time. The princess Krishna too, O Yudhishthira, could not be deserving of that place of sinners. Come, come, O foremost one of the Bharatas, behold Ganga who spreads her current over the three worlds.
  modern: Neither Arjuna, nor Bhīma, nor the twins, nor Karṇa, ever truthful in speech and of great courage, could deserve Hell for long. The princess Kṛṣṇā too, O Yudhiṣṭhira, could not deserve that place of sinners. Come, come, O foremost of the Bharatas, and see the Gaṅgā who spreads her current over the three worlds.
svargArohana-18-3-42:
  ganguli: 18 III
  text: Having bathed in the celestial river Ganga, sacred and sanctifying and ever adored by the Rishis, he cast off his human body.
  modern: He bathed in the celestial river Gaṅgā, sacred, purifying and always praised by the Rishis, and cast off his human body.
svargArohana-18-3-43:
  ganguli: 18 III
  text: Assuming then a celestial form, king Yudhishthira the just, in consequence of that bath, became divested of all his enmities and grief.
  modern: Taking a celestial form, King Yudhiṣṭhira the just, through that bath, was freed of all his enmities and grief.
svargArohana-18-4-6:
  ganguli: 18 IV
  text: In another place, the delighter of the Kurus beheld Karna, that foremost one among all wielders of weapons, resembling a dozen Suryas in splendour.
  modern: In another place the delight of the Kurus saw Karṇa, foremost of all wielders of weapons, as bright as a dozen suns.
svargArohana-18-4-7:
  ganguli: 18 IV
  text: In another part he beheld Bhimasena of great puissance, sitting in the midst of the Maruts, and endued with a blazing form.
  modern: In another part he saw mighty Bhīmasena sitting in the midst of the Maruts, with a blazing form.
svargArohana-18-4-9:
  ganguli: 18 IV
  text: In place belonging to the Ashvinis, the delighter of the Kurus beheld Nakula and Sahadeva, each blazing with his own effulgence.
  modern: In the place that belongs to the Aśvins, the delight of the Kurus saw Nakula and Sahadeva, each blazing with his own radiance.
svargArohana-18-4-10:
  ganguli: 18 IV
  text: He also beheld the princess of Pancala, decked in garlands of lotuses. Having attained to Heaven, she was sitting there, endued with a form possessed of solar splendour.
  modern: He also saw the princess of Pañcāla, wearing garlands of lotuses. Having reached heaven, she sat there in a form as bright as the sun.
svargArohana-18-5-11:
  ganguli: 18 IV
  text: Behold the royal Bhishma, the son of Santanu, now in the midst of the Vasus.
  modern: See the royal Bhīṣma, son of Śāntanu, now among the Vasus.
svargArohana-18-5-12:
  ganguli: 18 V
  text: Drona entered into Brihaspati, that foremost one of Angirasa’s descendants. Hridika’s son Kritavarma entered the Maruts.
  modern: Droṇa entered Bṛhaspati, the foremost of the descendants of Aṅgiras. Kṛtavarman, the son of Hṛdika, entered the Maruts.
svargArohana-18-5-13:
  ganguli: 18 V
  text: Pradyumna entered Sanatkumara whence he had issued. Dhritarashtra obtained the regions, so difficult of acquisition, that belong to the Lord of treasures.
  modern: Pradyumna entered Sanatkumāra, from whom he had come. Dhṛtarāṣṭra reached the hard-to-reach realms of the Lord of Treasures.
svargArohana-18-5-14:
  ganguli: 18 V
  text: With his two wives, Pandu proceeded to the abode of the great Indra.
  modern: With his two wives, Pāṇḍu went to the abode of great Indra.
svargArohana-18-5-20:
  ganguli: 18 V
  text: Slain on the field of battle, O foremost of men, Karna entered Surya. Shakuni obtained absorption into Dwapara, and Dhrishtadyumna into the deity of fire.
  modern: Karṇa, slain in battle, O foremost of men, entered Sūrya. Śakuni was absorbed into Dvāpara, and Dhṛṣṭadyumna into the god of fire.
svargArohana-18-5-21:
  ganguli: 18 V
  text: The sons of Dhritarashtra were all Rakshasas of fierce might. Sanctified by death caused by weapons, those high-souled beings of prosperity all succeeded in attaining to Heaven. Both Kshattri and king Yudhishthira entered into the god of Righteousness.
  modern: The sons of Dhṛtarāṣṭra were all fierce and mighty Rākṣasas. Purified by death from weapons, those high-souled and prosperous beings all reached Heaven. Kṣattṛ and King Yudhiṣṭhira entered the god of Righteousness.
svargArohana-18-5-23:
  ganguli: 18 V
  text: Vasudeva was a portion of that eternal god of gods called Narayana.
  modern: Vāsudeva was a portion of that eternal god of gods called Nārāyaṇa.
svargArohana-18-5-29:
  ganguli: 18 V
  text: I have now told thee, O thou of great splendour, everything about the acts, O Bharata, of both the Kurus and the Pandavas.
  modern: I have now told you, O you of great splendor, everything about the deeds, O Bhārata, of both the Kurus and the Pāṇḍavas.
svargArohana-18-5-35:
  ganguli: 18 V
  text: Called a history, it is sacred, sanctifying and excellent. It has been composed by the ascetic Krishna, O Brahmana, of truthful speech.
  modern: Called a history, it is sacred, purifying and excellent. It was composed by the ascetic Kṛṣṇa, O Brahmin, who always spoke the truth.
svargArohana-18-5-38:
  ganguli: 18 V
  text: He has done this, desiring to spread the fame, throughout the world, of the high-souled Pandavas, as also of other Kshatriyas possessed of abundant wealth of energy.
  modern: He did this wishing to spread throughout the world the fame of the high-souled Pāṇḍavas and of other Kṣatriyas rich in energy.
svargArohana-18-5-43:
  ganguli: 18 V
  text: The sins that one commits during the day by one’s senses or the mind are all washed off before evening by reciting a portion of the Mahabharata.
  modern: The sins that one commits during the day with the senses or the mind are all washed away before evening by reciting a portion of the Mahābhārata.
svargArohana-18-5-50:
  ganguli: 18 V
  text: Such a man lives in righteousness, wealth, and pleasure, and attains to Emancipation also, O chief of Bharata’s race. That which occurs here occurs elsewhere. That which does not occur here occurs nowhere else.
  modern: Such a man lives in righteousness, wealth and pleasure, and attains Emancipation too, O chief of Bharata's race. What occurs here occurs elsewhere. What does not occur here occurs nowhere else.
