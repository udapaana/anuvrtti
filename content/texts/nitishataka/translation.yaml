# B. Hale Wortham, The Śatakas of Bhartrihari (Trübner & Co., London, 1886), the Nīti Śataka, pp. 1–20, with his Notes, pp. 21–36.
# Public domain (Wortham died 1928). Source scan: archive.org satakasofbhartri00bharuoft; OCR cleaned (no page images were available to check against).
# Wortham numbers the Nīti Śataka 1–110 and gives each verse as one numbered prose paragraph. `wortham` is his number, which differs from ours
#   after our 36 (we have no counterpart to his 2, 37, 85 and 104; our 39 has none in his book). Our 2 is his Vairāgya Śataka 2 (p. 37),
#   and our 69 is his "Miscellaneous Śatakas" 5 (p. 18).
# `text`: his wording and punctuation, line-end hyphens closed up; his space before : ; ? ! is dropped. His Sanskrit spelling is kept as printed
#   (Sastras, Kesava, Chataka); OCR for Ś (£, &, S') is read as Ś. `note`: a substantive footnote of his (interpretation, play on words,
#   reading), verbatim, with omissions marked …; parallel-passage and Biblical/classical cross-references are left out.
source:
  translator: B. Hale Wortham
  title: The Śatakas of Bhartrihari
  publisher: Trübner & Co.
  year: 1886
  pages: 1–20 (Nīti Śataka, with Miscellaneous 5 on p. 18), 21–36 (Notes), 37 (Vairāgya Śataka 2), 62 (Vairāgya note 2)
  archive: satakasofbhartri00bharuoft
'1':
  wortham: 1
  text: |
    SALUTATION to the deity who is not definable in time or space: infinite — pure intelligence in incarnate form: who is peace and glory: whose sole essence is self-knowledge.
  modern: |
    Salutation to the deity who cannot be defined by time or space. He is infinite, pure intelligence in bodily form, peace and glory, and his only nature is self-knowledge.
'2':
  wortham: "Vairāgya 2"
  text: |
    Learned men are eaten up with jealousy; mighty men are spoiled through pride; the minds of some men are obscured through ignorance: therefore the eloquent teachings of science are neglected.
  note: |
    Three classes of men exist: learned men, who are envious of the knowledge that others possess; mighty men, who care nothing for learning, through pride in their own greatness; and men who are too ignorant to take any interest in learning. Therefore, between these three, learning and science gains no hearing in the world.
  modern: |
    Learned men are eaten up with jealousy, and powerful men are spoiled by pride. Some are clouded by ignorance. So the eloquent teachings of science are neglected.
'3':
  wortham: 3
  text: |
    The man who is entirely ignorant is easily guided: the wise man is still more easily led: but even the Supreme Being himself cannot influence the smatterer.
  note: |
    Jñāna-lava-dur-vidagdham, "(The man) puffed up through smallness of knowledge." Durvidagdha is explained by the commentator as garvishta, arrogant.
  modern: "A completely ignorant man is easy to guide, and a wise man is even easier to lead. But even the Supreme Being himself cannot sway a man who knows only a little."
'4':
  wortham: 4
  text: |
    A man may forcibly get back a jewel from the teeth of a crocodile: he may cross over the raging waves of the sea: he may wear an angry serpent on his head as if it were a garland of flowers: but he cannot win over the mind of one who is foolish and obstinate.
  note: |
    Referring to the fable according to which crocodiles were supposed to have pearls between their teeth.
  modern: |
    A man might take a jewel by force from between a crocodile's teeth. He might cross the sea with its raging waves. He might wear an angry serpent on his head like a garland of flowers. But he cannot win over the mind of a foolish, obstinate man.
'5':
  wortham: 5
  text: |
    A man may get oil from sand by violent pressure: he may drink water from a mirage when oppressed by thirst: he may get possession of the horn of a hare: but he cannot win over the mind of one who is foolish and obstinate.
  note: |
    Satavishāna, "the horn of a hare;" proverbial for that which does not exist.
  modern: |
    A man might press oil out of sand if he squeezed hard enough. Parched with thirst, he might drink water from a mirage. He might get hold of a hare's horn. But he cannot win over the mind of a foolish, obstinate man.
'6':
  wortham: 6
  text: |
    He who would lead evil men into the path of virtue by a few soft words, is as one who binds an elephant with a young lotus-fibre: as one who tries to cut the diamond with a filament of Sirisha; or as one who desires to make the salt sea sweet with a drop of honey.
  note: |
    Vyāla may be translated either "elephant" or "serpent."
  modern: |
    Whoever tries to lead evil men onto the path of virtue with a few soft words is like a man binding an elephant with a young lotus-fibre, or cutting a diamond with a filament of the Sirisha flower, or trying to sweeten the salt sea with a drop of honey.
'7':
  wortham: 7
  text: |
    The Creator has given man, as it were, a cloak to conceal his ignorance: with that he can cover himself at all times, for it is always at hand. That gift is silence, the special ornament of the ignorant in the assembly of the wise.
  modern: |
    The Creator has given man a kind of cloak to hide his ignorance. It is always at hand, so he can cover himself with it at any time. That gift is silence, which is the special ornament of the ignorant in an assembly of the wise.
'8':
  wortham: 8
  text: |
    When I knew but a little, I was blinded by pride, as an elephant is blinded by passion: my mind was exalted, and in my arrogance I thought I knew all things. Then I came into the presence of the wise who know many kinds of wisdom, and my pride left me even like a fever.
  note: |
    Kinchid-jña, "knowing somewhat," is explained by Telang to refer not to the speaker's estimate of himself at the time of his "blindness," but to the view he takes of himself after his "intoxication" has left him. "When I knew (that which now I know was but) a little," is the idea to be conveyed.
  modern: |
    When I knew only a little, I was blind with pride, like an elephant blind with rut. My mind was swollen, and in my arrogance I thought I knew everything. Then I came into the presence of wise men who know many kinds of wisdom, and my pride left me like a fever.
'9':
  wortham: 9
  text: |
    A dog eats with delight putrid abominable bones, and though the king of the gods may stand before him, takes no heed: even so a mean man considers not the worthlessness of that which belongs to him.
  note: |
    As a dog prefers the carrion which he has before him to any sight however magnificent, so the fool keeps his eyes fixed on himself and his small acquirement, and
  modern: |
    A dog happily gnaws a foul, rotten bone, and takes no notice even if the king of the gods stands beside him. In the same way a mean man never sees how worthless his own possessions are.
'10':
  wortham: 10
  text: |
    The Ganges falls from heaven upon the head of Siva; from the head of Siva on to the mountain; from the top of the mountain to the earth, always falling lower and lower: even in so many ways is the fall of one whose judgment has departed from him.
  note: |
    continually falls lower and lower in the scale of intellect.
  modern: |
    The Ganges falls from heaven onto the head of Siva, from his head onto the mountain, from the mountain's top to the earth, always lower and lower. A man who has lost his judgment falls in just as many ways.
'11':
  wortham: 11
  text: |
    Fire can be quenched by water, the heat of the sun can be kept off by a parasol, a wild elephant can be guided by a sharp hook, an ox or an ass by a stick: sickness can be subdued by the help of physicians, poison by the assistance of various charms. A cure has been ordained by the Sastras for everything, but there is no medicine for the cure of a fool.
  modern: |
    Water puts out fire. A parasol keeps off the heat of the sun. A sharp hook guides a wild elephant, and a stick drives an ox or an ass. Physicians can subdue sickness, and various charms can subdue poison. The Sastras prescribe a cure for everything, but there is no medicine to cure a fool.
'12':
  wortham: 12
  text: |
    The man who has no sense of literature and music is like a beast, though he has not horns and a tail: he may not eat grass, but yet he lives a life exactly like that of the cattle.
  modern: |
    A man with no feeling for literature and music is like a beast, even though he has no horns and tail. He may not eat grass, but he lives a life exactly like that of cattle.
  departs: "The Sanskrit says it is the cattle's great good fortune that such a man lives without eating grass; the rendering loses that irony."
'13':
  wortham: 13
  text: |
    Those in whom is neither wisdom, nor penance, nor liberality, nor knowledge, nor good disposition, nor virtue, nor righteousness, may live in the world of mortals in the form of men, but they pass through the world like beasts encumbering the earth.
  modern: "Those who have no wisdom, no penance, no generosity, no knowledge, no good character, no virtue, and no righteousness may live in the world of mortals in human form. But they go through it like beasts, a burden on the earth."
'14':
  wortham: 14
  text: |
    It is better to wander in a mountain-pass with the wild beasts than to live in the palace of the gods with a fool.
  modern: |
    It is better to wander through a mountain pass among wild beasts than to live in the palace of the gods with a fool.
'15':
  wortham: 15
  text: |
    When wise men dwell in poverty — men whose words are adorned with polished sayings from the Sastras, and who impart sacred learning to their disciples — then that prince in whose kingdom they dwell is chargeable with folly, and the wise men, though poor, are the rulers of the land. Should not those bad examiners be worthy of condemnation who (through) carelessness cause jewels to fall from their true value?
  modern: |
    When wise men live in poverty, men whose words are polished with sayings from the Sastras and who pass on sacred learning to their pupils, the prince in whose kingdom they live is guilty of folly. Though poor, these wise men are the true rulers of the land. Those bad judges deserve condemnation who carelessly let jewels fall below their true value.
'16':
  wortham: 16
  text: |
    O kings! cast off your pride before those who have the inward treasure of wisdom: they are not despoiled by robbers, but their treasure, always increasing, grows greater when it is shared with the needy: not even at the end of the world does it perish. Who indeed may compare with them?
  modern: |
    O kings, put away your pride before those who hold the inner treasure of wisdom. Robbers cannot take it from them. When they share it with the needy, it only grows greater. Not even at the end of the world does it perish. Who can compare with them?
'17':
  wortham: 17
  text: |
    Despise not wise men who have attained to knowledge of the truth. They are not held bound by riches, for they count wealth even as grass. The stalk of a water-lily will not bind an elephant who is infuriated by passion.
  modern: |
    Do not despise wise men who have reached knowledge of the truth. Riches do not bind them, for they count wealth as grass. The stalk of a water-lily will not hold an elephant mad with rut.
'18':
  wortham: 18
  text: |
    The Creator in his anger may hinder the swan from sporting in the lotus-bed, his dwelling; but he cannot take away his faculty of separating milk from water.
  note: |
    The latter part of this sloka refers to a supposed faculty of the swan for separating milk from water which has been previously mixed in the act of drinking it, which has passed into a proverb. … Prof. M. Williams quotes this sloka of Bhartrihari in his note in Sak., and continues, "This reference is probably to the milky juice of the water-lily, which would be its (the hansa's) natural food, and to which allusion is often made by the Hindu poets."
  modern: "The Creator, in his anger, may keep the swan from playing in the lotus-bed where he lives. But he cannot take away the swan's skill at separating milk from water."
'19':
  wortham: 19
  text: |
    Bracelets are no ornament to a man, nor strings of pearls clear as the moon; nor yet bathing, nor perfumes, nor flowers, nor decorated hair. Perfect eloquence alone adorns a man. Adornments may perish, but the ornament of eloquence abides for ever.
  modern: |
    Bracelets do not adorn a man, nor do strings of pearls bright as the moon, nor bathing, perfumes, flowers, or dressed hair. Only perfect eloquence adorns a man. Other adornments perish, but the ornament of eloquence lasts for ever.
'20':
  wortham: 20
  text: |
    Wisdom, indeed, is the highest ornament that a man possesses. It is a valuable to be carefully guarded, for wisdom gains food, glory, and blessing. It is the lord of lords. Wisdom is as a friend to a man travelling in a distant land. Wisdom is honoured among kings even more than wealth. The man devoid of wisdom is but an animal.
  modern: |
    Wisdom is the highest ornament a man has. It is a treasure to be guarded with care, for wisdom brings food, glory, and blessing. It is the lord of lords. Wisdom is a friend to a man travelling in a distant land. Among kings, wisdom is honoured even more than wealth. A man without wisdom is no more than an animal.
  departs: "Sanskrit gurūṇāṃ guruḥ is \"teacher of teachers\", not \"lord of lords\"."
'21':
  wortham: 21
  text: |
    If a man has patience, what need has he of armour? If he has anger in his heart, what further enemy need he fear? If he has knowledge, what need of fire to consume evil? If a friend, what need has he of divine medicines? If there are malicious people about him, why should he be afraid of serpents? If he has perfect wisdom, what need of riches? If he is modest, what need has he of ornament? If he give his mind to poetry, what need has he of power?
  note: |
    Some editors have vachanena, "what is the use of words?" If the reading kavachena be taken, it means, "what is the use of armour?" … The man who has enemies within, i.e., the passions, can have no worse enemies to fear. The passions or faults of the mind are six in number — desire, wrath, covetousness, bewilderment, pride, and envy. … The end of the last line, sukavitā yadasti rājyena kim? "If there is good poetry, what need of a kingdom?" seems to mean that the man who is learned and intelligent has no need of external things to produce or add to his happiness.
  modern: |
    If a man has patience, what does he need armour for? If he has anger in his heart, what worse enemy can he fear? If he has knowledge, what does he need fire to burn away evil for? If he has a friend, what does he need divine medicines for? If there are malicious people around him, why should he fear serpents? If he has perfect wisdom, what does he need riches for? If he is modest, what does he need ornaments for? If he gives his mind to poetry, what does he need power for?
  departs: "The Sanskrit has jñātiḥ, kinsmen (who are as dangerous as fire), not jñāna, knowledge: \"If he has kinsmen, what need of fire?\""
'22':
  wortham: 22
  text: |
    Be well disposed towards relatives; liberal to inferiors: always hate the evil; love the good; be obedient to princes; honour the wise. Be firm towards enemies; be respectful to venerable men; deal shrewdly with women. The man who frames his life after these precepts prospers in the world.
  note: |
    Enumerates the virtues which a man must practise if he would live happily. Kalā, in l. 4, signifies here "qualities," referring to the virtues enumerated in the preceding lines.
  modern: |
    Be considerate to your relatives and generous to those beneath you. Always hate the evil and love the good. Obey princes and honour the wise. Be firm with enemies and respectful to elders. Deal shrewdly with women. The man who shapes his life by these precepts prospers in the world.
'23':
  wortham: 23
  text: |
    Intercourse with wise men takes away dulness of mind, elevates the intellect, inspires the speech with truthfulness. What will it not do for men?
  note: |
    Sinchate vāche satyam, "pours truth into the speech," or "impregnates the speech with truthfulness."
  modern: |
    Keeping company with wise men takes away dullness of mind, raises the intellect, and fills the speech with truth. What will it not do for men?
  departs: "The Sanskrit adds that such company also removes sin, gladdens the heart and spreads one's fame in all directions; the rendering leaves these out."
'24':
  wortham: 24
  text: |
    May there be glory to wise men who are learned and accomplished poets! There is no fear that their renown shall wither or perish.
  note: |
    Kavīśvarāh, "learned poets;" lit. "kings of poets." Rasa-siddhāh = well versed in or conversant with the poetical rasas or affections, accomplished in poetry.
  modern: |
    Glory to the wise men who are learned and accomplished poets! There is no fear that their renown will wither or die.
'25':
  wortham: 25
  text: |
    A virtuous son, an affectionate wife, a liberal master, a loving friend, a guileless kinsman, a mind not harassed by care, a handsome form, abiding riches, a mouth abounding in wisdom — these are the gifts which Hari, the giver of desires, the delight of the earth, bestows upon the man with whom he is pleased.
  modern: |
    A virtuous son, an affectionate wife, a generous master, a loving friend, an honest kinsman, a mind free from care, a handsome form, lasting riches, and a mouth full of wisdom — these are the gifts that Hari, who grants desires and delights the earth, gives to the man with whom he is pleased.
'26':
  wortham: 26
  text: |
    Abstinence from destroying life, keeping one's hands off another's wealth, speaking the truth, reasonable liberality according to one's power, not conversing with the wives of other men, checking the stream of covetousness, reverence towards spiritual fathers, compassion towards all creatures — this is the path of happiness, violating no ordinances, taught in all the Sastras.
  modern: |
    Not taking life, keeping your hands off another's wealth, speaking the truth, giving fittingly and as far as you can, not talking with other men's wives, checking the stream of greed, reverence for your spiritual fathers, and compassion for all creatures — this is the path of happiness. It breaks no ordinance, and all the Sastras teach it.
'27':
  wortham: 27
  text: |
    The low-minded man does not make even the least effort in the pursuit of wisdom through fear of difficulties: if he has made any attempt, he stops when obstacles meet him. The noble-minded man may meet with repeated hindrances, but when he has once begun the pursuit of wisdom he does not give it up.
  modern: |
    The low-minded man does not make even the least effort in pursuit of wisdom, for fear of difficulties. If he does try, he stops when obstacles meet him. The noble-minded man may be hindered again and again, but once he has begun the pursuit of wisdom he does not give it up.
'28':
  wortham: 28
  text: |
    Righteousness must be loved; evil must be avoided, even at the risk of death; wicked men must not be spoken to; a poor man, even though he be a friend, must not be asked for alms: even in adversity the foot must be constant, and the vow taught by good and great men must be conformed to, even if it be as difficult as to stand on the edge of a sword!
  note: |
    Even in adversity the foot must be constant; vipady-uchchaih stheyam = one must retain dignity in misfortune (Telang); uchchaih-stheya = firmness of character.
  modern: |
    Righteousness must be loved. Evil must be avoided, even at the risk of death. Wicked men must not be spoken to, and a poor man, even a friend, must not be asked for alms. Even in adversity one's step must stay firm, and one must keep the vow taught by good and great men, even if it is as hard as standing on the edge of a sword!
'29':
  wortham: 29
  text: |
    The lion, though overwhelmed by hunger and weakened by old age, though at the point of death and in a state of misery, and though his majesty may have left him and his life be vanishing away, yet his whole desire is to swallow at one mouthful the forehead of the kingly elephant which he has crushed in pieces. How should he, the mightiest of living things, feed upon withered grass!
  modern: |
    The lion may be overcome by hunger, weakened by old age, near death, and in misery. His majesty may have left him and his life be slipping away. Even so, his whole desire is to swallow in one mouthful the forehead of the kingly elephant he has crushed. How should the mightiest of living things feed on withered grass?
'30':
  wortham: 30
  text: |
    A dog rejoices over a small filthy bone of an ox which he has found stripped of flesh, though it satisfies not his hunger; but the lion passes by the jackal standing near him and attacks the elephant. So the man of firm mind, even though he may be in distress, desires that which is in accordance with his natural disposition.
  modern: |
    A dog is pleased to find a small, filthy ox-bone stripped of flesh, though it does not satisfy his hunger. But the lion passes by the jackal standing near him and attacks the elephant. In the same way, a man of firm mind, even in distress, wants what accords with his own nature.
'31':
  wortham: 31
  text: |
    The dog falls down low before the feet of one who gives him food, wagging his tail and opening his mouth wide; but the elephant, on the other hand, remains unmoved, and only eats after he is entreated with flattering words.
  note: |
    Vadana-udara-darśanam-kurute, "makes the showing of the interior of his mouth."
  modern: |
    The dog throws himself down at the feet of the man who feeds him, wagging his tail and opening his mouth wide. The elephant, on the other hand, stays unmoved and eats only after he has been coaxed with flattering words.
'32':
  wortham: 32
  text: |
    What man is not born again while he passes from one birth to another? But that man only is truly born by whose birth his family attains to dignity.
  note: |
    Parivartini saṃsāre, "while he passes from one birth to another," or while transmigrations go on; parivartini means "revolving, constantly recurring."
  modern: "What man is not born again as he passes from one birth to another? But only that man is truly born whose birth raises his family to dignity."
'33':
  wortham: 33
  text: |
    There are two uses both for a garland of flowers and also for a wise man — they may be exalted on the head or wither in the forest.
  modern: |
    A garland of flowers and a wise man each have two fates: to be raised on the head, or to wither in the forest.
'34':
  wortham: 34
  text: |
    Although the five or six planets, of which Vrihaspati is the head, are held in high esteem, yet Rahu, whose power and might are great, does not attack them. The lord of the demons, though he has nothing left him but his head, devours in his course only the lord of the day and the ruler of the night.
  note: |
    The fable to which this sloka refers is as follows: — After the deities had produced the amrita by churning the ocean, Rahu by a stratagem introduced himself among them, and drank some of it. The deities of the sun and moon discovered the theft, and told Vishnu, who cut off his head. The amrita had, however, made him immortal, and he was therefore placed among the stars, where he periodically shows his displeasure at the way in which the sun and moon behaved by swallowing them. This is supposed to take place whenever an eclipse occurs of either the sun or moon.
  modern: |
    There are five or six other planets, with Vrihaspati at their head, that are held in high esteem. Yet Rahu, whose power and might are great, does not attack them. The lord of the demons, though nothing is left of him but a head, devours on his course only the lord of the day and the ruler of the night.
'35':
  wortham: 35
  text: |
    Sesha bears all the worlds placed on his serpent-like head: he himself is always borne on the back of the king of the tortoises, who dwells, held without difficulty, in the bounds of ocean. Ah! with what ease do the mighty perform great marvels!
  note: |
    Phaṇā-phalaka-sthitam, "placed on the flat surface of his hood."
  modern: "Sesha carries all the worlds, set on his serpent head. He himself is always carried on the back of the king of the tortoises, who in turn is held without effort within the bounds of the ocean. Ah, with what ease the mighty perform great marvels!"
'36':
  wortham: 36
  text: |
    The son of Himalaya would have behaved far more nobly if he had allowed enraged Indra to cut off his wings with the thunderbolt breathing forth huge masses of flame, and had not, when his father was helplessly subject to calamity, sought a refuge by throwing himself into the ocean.
  note: |
    The explanation for this stanza may be supplied from the fable which represents Indra as cutting off the wings of the mountains. Mainaka, the son of Himalaya, took refuge in the ocean and so escaped. … Bhartrihari in this stanza appears to bring forward Mainaka as an example of want of firmness. It would have been better for him to meet his fate with resignation and firmness than to have fled, since his father Himalaya had been overpowered.
  modern: |
    The son of Himalaya would have done far more nobly to let angry Indra cut off his wings with the thunderbolt, which breathed out huge masses of flame. Instead, when his father was helpless in calamity, he sought refuge by throwing himself into the ocean.
'37':
  wortham: 38
  text: |
    The lion, though young, attacks the elephant infuriated with passion. The energy of the noble-minded man proceeds from his natural disposition, not from his youth.
  modern: |
    Even a young lion attacks an elephant mad with rut. The energy of a noble-minded man comes from his nature, not from his youth.
'38':
  wortham: 39
  text: |
    Our noble birth may go to the lower regions; our virtues may perish; our moral character may fall as if from a lofty mountain; our family may be consumed by fire; a thunderbolt may strike our might as it were an enemy: let us keep our money, for without this all the collected virtues are but a heap of grass.
  note: |
    Abhijana means, in this passage, "caste," or, according to Telang, "nobility of birth," … In the śīlam śailatatāt, "one's virtue may fall from a mountain slope," is contained a play upon the words śilā, a "stone," śaila, "stony," and śīlam, "disposition."
  modern: |
    Let our noble birth go down to the lower regions. Let our virtues perish, and our moral character fall as if from a lofty mountain. Let our family be burned by fire, and a thunderbolt strike our might like an enemy. Only let us keep our money, for without it all our collected virtues are a heap of grass.
'40':
  wortham: 40
  text: |
    These are all the same senses — exactly the same action — the same intellect undiminished: the same voice. But though a man may remain exactly what he was, yet, when deprived of the warmth which wealth gives him, he becomes some one altogether different. This is indeed wonderful!
  modern: |
    The senses are all the same, the actions exactly the same, the intellect undiminished, the voice the same. Yet when a man loses the warmth that wealth gives him, he becomes someone altogether different, though he remains exactly what he was. This is truly strange!
'41':
  wortham: 41
  text: |
    If a man be wealthy, he is of good family, he is wise, he is learned in the Scriptures, he is virtuous, eloquent, beautiful. All the virtues attach themselves to gold.
  modern: |
    If a man is wealthy, he is of good family, wise, learned in the Scriptures, virtuous, eloquent, and handsome. All the virtues attach themselves to gold.
'42':
  wortham: 42
  text: |
    A king is ruined through evil counsellors: an ascetic through society: a child by spoiling: a priest by not studying the Sacred Scriptures: a family by the evil behaviour of children: good manners by evil habits: modesty by wine: agriculture by want of care: affection by absence from home: friendship by want of love: possessions by mismanagement: money by waste and prodigality.
  note: |
    Sanga, translated "society," with the idea of "attachment to objects of sense," the detachment from all worldly desires being the devotee's chief aim.
  modern: |
    A king is ruined by evil counsellors, an ascetic by company, a child by spoiling, and a priest by not studying the Sacred Scriptures. A family is ruined by its children's bad behaviour, good manners by bad habits, modesty by wine, and farming by neglect. Affection is ruined by absence from home, friendship by lack of love, possessions by mismanagement, and money by waste and extravagance.
'43':
  wortham: 43
  text: |
    Giving, consuming, and loss, are the three ways by which wealth is diminished. The man who neither gives nor spends has yet the third way open to him.
  modern: |
    Giving, consuming, and losing are the three ways wealth is used up. The man who neither gives nor spends still has the third way open to him.
'44':
  wortham: 44
  text: |
    A jewel is cut by the polishing stone; a conqueror in war is killed by weapons; the elephant is weakened by passion; the islands in a river become dry in the autumn; the moon wanes; young women become languid through pleasure, yet is their beauty nothing lessened: so noble men who have diminished their wealth by giving to the needy are still illustrious.
  note: |
    Mada-kshino-nāgah, "the elephant is weakened by the flow of mada." All the things mentioned do not lose their beauty or glory through the diminution of their powers or their resources; a noble man who has given away his riches is not less noble because he is poor in consequence of his liberality.
  modern: "A jewel is cut by the polishing stone. A conqueror in war is killed by weapons. The elephant is weakened by the flow of rut. The river's sandbanks dry out in autumn, the moon wanes, and young women grow languid from pleasure. Yet their beauty is not lessened. So noble men who have used up their wealth in giving to the needy are still illustrious."
'45':
  wortham: 45
  text: |
    A man who is famishing longs for a handful of grain; but when he has revived, he looks on the whole earth as a mere handful of grass. So objects seem great or small according to the condition of the men who possess them: it is the change in men's fortune which makes things seem greater or smaller.
  note: |
    Sprihayati, "longs for," followed by dative prasrite, which the commentator explains by tusha, which means "grain," but the ordinary meaning of prasrite is a "handful." The meaning of this sloka, as explained by Telang, is as follows: — "Since in different states of life the same things are regarded as great or small, therefore it must be concluded that it is the state of life which causes the things to appear so." The word kalayate (kal) means in this place "to consider or reckon."
  modern: |
    A starving man longs for a handful of grain. When he has recovered, he looks on the whole earth as a mere handful of grass. So things seem great or small according to the condition of the men who have them. It is the change in a man's fortune that makes things seem greater or smaller.
'46':
  wortham: 46
  text: |
    If, O king! if you would enjoy this earth, which is as fruitful as a cow, nourish it as carefully as you would a calf. The earth brings forth fruits without end like the creeper of plenty if it is perpetually and carefully cultivated.
  note: |
    The comparison between the earth and a cow is a common one among the Hindus; in fact, the word go means both the earth and a cow. … Tena is used as correlative to yadi by an unusual construction (Telang).
  modern: |
    O king, if you wish to enjoy this earth, which is as fruitful as a cow, then nourish it as carefully as you would a calf. If the earth is cultivated carefully and without pause, it brings forth endless fruits, like the creeper of plenty.
'47':
  wortham: 47
  text: |
    The behaviour of kings is as uncertain as the way of a courtesan. Now it is false, now true — now with harsh, now with agreeable words — now cruel, now merciful — at one time liberal, at another covetous — either always squandering money or heaping it together.
  modern: |
    The conduct of kings is as uncertain as the ways of a courtesan. Now it is false, now true. Now they speak harshly, now agreeably. Now they are cruel, now merciful. At one time they are generous, at another greedy. They are always either squandering money or heaping it up.
'48':
  wortham: 48
  text: |
    Authority, fame, the guarding of Brahmans, liberality, feasting, protection of friends: what profit is there to those who serve kings if they have not gained these six blessings?
  modern: |
    Authority, fame, protection of Brahmans, generosity, feasting, and protection of friends: what do those who serve kings gain if they have not won these six?
'49':
  wortham: 49
  text: |
    Whatever fate has written on the forehead of each, that shall he obtain, whether it be poverty or riches. His abode may be the desert, but he shall gain no more if he live even on Mount Meru. Let your mind be constant. Do not be miserable through envy of the rich. The pitcher takes up the same quantity of water whether it be from the well or the ocean.
  note: |
    Man's life is predestined by fate, and the amount of enjoyment that he has is in proportion to his own capacity for enjoyment. Mount Meru is the Hindū equivalent for Olympus. It is generally used as a synonym for a wealthy place.
  modern: |
    Whatever fate has written on each man's forehead, poverty or riches, that is what he will get. He may live in the desert, but he will gain no more if he lives on Mount Meru. So keep your mind steady. Do not be miserable with envy of the rich. A pitcher takes up the same amount of water from a well as from the ocean.
'50':
  wortham: 50
  text: |
    "Who does not know that thou, O cloud, art the one support of the Chataka? Why, O most beneficent cloud! dost thou wait for our cry of misery?"
  note: |
    A dialogue supposed to take place between the chataka, a bird fabled to live solely on the drops of rain, and the rain-cloud.
  modern: |
    "Who does not know that you, O cloud, are the Chataka's one support? Why, O most generous cloud, do you wait for our cry of misery?"
'51':
  wortham: 51
  text: |
    "Ah! beloved Chataka, hear and listen attentively to what I tell thee. The heavens have many clouds, but they are not all alike; some water the earth, others thunder and pour forth no rain." Do not degrade yourself by asking alms of any one whom you may chance to meet.
  note: |
    The moral of the fable is contained in the last line of sloka 51. It is no use to ask favours of mean persons.
  modern: |
    "Ah, beloved Chataka, listen closely to what I tell you. The heavens hold many clouds, but they are not all alike. Some water the earth, and others thunder and give no rain." Do not degrade yourself by asking alms of just anyone you happen to meet.
'52':
  wortham: 52
  text: |
    Cruelty, causeless quarrels, the desire for another's wife or money, envy of the good, or of one's own relatives. These are the natural characteristics of wicked men.
  modern: |
    Cruelty, quarrels without cause, desire for another's wife or money, envy of the good and of one's own relatives: these are the natural marks of wicked men.
'53':
  wortham: 53
  text: |
    An evil man should be avoided though he be adorned with learning. Is a snake less feared because it is ornamented with jewels?
  modern: |
    An evil man should be avoided even if learning adorns him. Is a snake any less feared because it is decorated with jewels?
'54':
  wortham: 54
  text: |
    The moderate man's virtue is called dulness; the man who lives by rigid vows is considered arrogant; the pure-minded is deceitful; the hero is called unmerciful; the sage is contemptuous; the polite man is branded as servile, the noble man as proud; the eloquent man is called a chatterer; freedom from passion is said to be feebleness. Thus do evil-minded persons miscall the virtues of the good.
  note: |
    "Branded," ankitah. The virtues of the good are branded as vices by evil-disposed persons.
  modern: "The moderate man's virtue is called dullness. The man who keeps strict vows is called arrogant, and the pure-minded man is called deceitful. The hero is called merciless, the sage contemptuous, the polite man servile, and the noble man proud. The eloquent man is called a chatterer, and freedom from passion is called weakness. This is how evil-minded people miscall the virtues of the good."
'55':
  wortham: 55
  text: |
    If a man be greedy, what further vice can he have? What sin can be worse than backbiting? What need has the truthful man of penances? What need has the pure-minded man of a sacred bathing-place? What virtue is beyond generosity? If there be greatness of mind, what adornment is required? If a man be learned, what necessity is there of the society of others? If disgrace overtake a man, why need he fear death?
  modern: |
    If a man is greedy, what other vice does he need? What sin is worse than backbiting? What need has a truthful man of penances, or a pure-minded man of a sacred bathing-place? What virtue is higher than generosity? If a man has greatness of mind, what ornament does he need? If he is learned, why does he need the company of others? If disgrace has overtaken him, why should he fear death?
'56':
  wortham: 56
  text: |
    The moon obscured by the daylight, a woman no longer young, a pond destitute of water-lilies, a handsome man who talks nonsense, a prince entirely devoted to money, a good man always in calamity, an evil man dwelling in a king's court — these are seven thorns in my mind.
  note: |
    "These are the seven thorns in my mind." Śalya meaning a "dart," "arrow," "thorn," and secondarily "embarrassment" or "distress," is not uncommonly used to express this idea. … Mukham-anakṣaram svākṛteḥ, lit. "the inarticulate mouth of (one having) a handsome form."
  modern: |
    A moon dimmed by daylight, a woman no longer young, a pond without water-lilies, a handsome man who talks nonsense, a prince wholly devoted to money, a good man always in calamity, and an evil man living in a king's court: these are seven thorns in my mind.
'57':
  wortham: 57
  text: |
    A king full of wrath hath no friend. The sacred fire burns even the priest who offers the sacrifice if he touches it.
  modern: |
    A king full of wrath has no friend. The sacred fire burns even the priest who offers the sacrifice if he touches it.
'58':
  wortham: 58
  text: |
    The man who preserves a respectful silence is considered dumb; the man who talks agreeably is considered forward; the man who stands close by is thought troublesome; he who stands far off, cold-hearted; the patient man is counted as faint-hearted; the impetuous man is called ill-bred. So difficult, indeed, are the laws by which behaviour is regulated, impossible to be learnt even by an ascetic.
  modern: |
    The man who keeps a respectful silence is thought dumb, and the man who speaks agreeably is thought forward. The man who stands close by is thought a nuisance, and the one who stands far off is thought cold-hearted. The patient man is counted faint-hearted, and the impetuous man is called ill-bred. So difficult are the laws that regulate behaviour that even an ascetic cannot learn them.
'59':
  wortham: 59
  text: |
    Is it possible to take pleasure in the society of a low man, dissolute, whose evil is all evident, whose wicked acts are the result of former births, who hates virtue, and who lives by chance?
  modern: |
    Can anyone take pleasure in the company of a low man? He is dissolute, his evil is plain to see, and his wicked acts come from former births. He hates virtue and lives by chance.
'60':
  wortham: 60
  text: |
    The friendships formed between good and evil men differ. The friendship of the good, at first faint like the morning light, continually increases; the friendship of the evil at the very beginning is great, like the light of mid-day, and dies away like the light of evening.
  modern: |
    Friendships between good men and evil men are different. The friendship of the good is faint at first, like the morning light, and keeps growing. The friendship of the evil is great at the very start, like the midday light, and dies away like the light of evening.
'61':
  wortham: 61
  text: |
    Deer, fish, and virtuous men, who only require grass, water, and peace in the world, are wantonly pursued by huntsmen, fishermen, and envious people.
  modern: |
    Deer, fish, and virtuous men need only grass, water, and peace in the world. Yet huntsmen, fishermen, and envious people pursue them without cause.
'62':
  wortham: 62
  text: |
    Desire for the companionship of the good, love for the virtues of others, reverence for spiritual teachers, diligence in acquiring wisdom, love for their own wives, fear of the world's blame, reverence for Siva, self-restraint, freedom from the acquaintance with evil men — wherever men dwell endowed with virtues like these, they are always reverenced.
  modern: |
    Longing for the company of the good, love for the virtues of others, reverence for spiritual teachers, diligence in acquiring wisdom, love for one's own wife, fear of the world's blame, reverence for Siva, self-restraint, and keeping clear of acquaintance with evil men: wherever men live with such virtues, they are always revered.
'63':
  wortham: 63
  text: |
    Firmness in adversity, restraint in prosperity, eloquence in the assembly, boldness in war, the desire of glory, study in the Scriptures — these are the natural characteristics of the virtuous.
  modern: |
    Firmness in adversity, restraint in prosperity, eloquence in the assembly, boldness in war, the desire for glory, and devotion to study of the Scriptures: these are the natural marks of the virtuous.
'64':
  wortham: 64
  text: |
    Secret generosity, cheerful hospitality to strangers, not speaking in public about one's own good deeds, proclaiming the benefits received from others, freedom from pride in prosperity, due respect in speaking of others — this is the vow of exceeding difficulty, taught by the good.
  note: |
    "Cheerful hospitality to strangers" (sambhramavidhih), lit. "preparations conducted in a hurried manner, with the view of honouring a guest." Upakritih, "assistance," "favour," meaning here the favours which others have granted, in opposition to kritva priyam, "the kindness one has done oneself." Asidhārā vratam, "the vow to stand on the edge of a sword," used as a proverb to express a task which is impossible.
  modern: "Giving in secret, cheerful hospitality to strangers, not talking in public about one's own good deeds, proclaiming the benefits one has received from others, staying free of pride in prosperity, and speaking of others with due respect: this is the vow, exceedingly difficult, that the good have taught."
'65':
  wortham: 65
  text: |
    Liberality is the fitting virtue for the hand, reverence towards spiritual teachers for the head, true speech for the mouth, surpassing power for the arms of a mighty man, content for the heart, the holy Veda rightly understood for the ears; the man of noble mind who is the possessor of these adornments has no need of outward pomp.
  modern: |
    Generosity is the fitting virtue for the hand, reverence for spiritual teachers for the head, and true speech for the mouth. Surpassing strength is the fitting virtue for the arms of a mighty man, contentment for the heart, and the holy Veda rightly understood for the ears. The man of noble mind who has these adornments needs no outward show.
'66':
  wortham: 66
  text: |
    The heart of the wise is soft as a lotus flower in prosperity, but in adversity it is as firm as a mountain rock.
  modern: |
    In prosperity the heart of the wise is as soft as a lotus flower. In adversity it is as firm as a mountain rock.
'67':
  wortham: 67
  text: |
    Water will not remain on hot iron, but standing on a lotus leaf it shines with the beauty of a pearl; and if a drop of water fall under a favourable star into the middle of an oyster in the sea, it straightway becomes a pearl. So is the disposition of men, good, tolerable, or bad, according to the society in which they live.
  note: |
    Svāti = Arcturus, also any conspicuous constellation. The disposition of men is ranged in three degrees of an ascending scale, developing or the reverse according to their surroundings and the atmosphere in which they live: first, the disposition which produces no results is like the drop of water on hot iron, which leaps off the instant it touches the metal; next, the moderately good disposition is compared to the drop of water on the lotus-leaf, a beautiful object to look at; and lastly, the very good disposition to the pearl which is not only beautiful, but valuable.
  modern: |
    Water does not stay on hot iron, but resting on a lotus leaf it shines like a pearl. And if a drop falls under a favourable star into the middle of an oyster in the sea, it becomes a pearl at once. So a man's disposition is good, middling, or bad according to the company he keeps.
'68':
  wortham: 68
  text: |
    The son who delights his father by his good actions, the wife who seeks only her husband's good, the friend who is the same in prosperity and in adversity — these three things are the reward of virtue.
  modern: |
    A son who delights his father by his good conduct, a wife who wants only her husband's good, and a friend who is the same in prosperity and in adversity: these three are the reward of virtue.
'69':
  wortham: "Miscellaneous 5"
  text: |
    There is one divinity, Kesava or Siva; one friend, a king or an ascetic; one dwelling, in a town or in the forest; one wife, handsome or ugly. [It matters not which a man may choose.]
  modern: |
    There is one divinity, Kesava or Siva; one friend, a king or an ascetic; one dwelling, in a town or in the forest; one wife, handsome or ugly. [It matters not which a man may choose.]
'70':
  wortham: 69
  text: |
    Those who are ennobled by humility: those who display their own virtues by relating the virtues of other men: those who in their own business always consider the interests of others: those who hate the evil speaker, and the mouth that continually utters harsh and impatient words: — good men whose admirable behaviour is shown in virtues like these are always held in reverence. Who would not respect them?
  note: |
    Khyāpayantah, translated "display," means "to declare," "make known." The second half of the line appears to mean "those who make the fact of their own virtues evident by the manner in which they estimate the virtue of others."
  modern: |
    Some are raised up by humility. Some show their own virtues by telling of the virtues of others. Some always consider the interests of others in their own business. Some hate the evil speaker and the mouth that keeps uttering harsh, impatient words. Good men whose admirable conduct shows such virtues are always held in reverence. Who would not respect them?
'71':
  wortham: 70
  text: |
    Trees loaded with fruit are bent down; the clouds when charged with fresh rain hang down near the earth: even so good men are not uplifted through prosperity. Such is the natural character of the liberal.
  modern: |
    Trees loaded with fruit bend down. Clouds heavy with fresh rain hang low near the earth. In the same way, good men are not puffed up by prosperity. This is the natural character of the generous.
'72':
  wortham: 71
  text: |
    The ears of such men as these are adorned with hearing revelation, not with earrings; their hands with liberality, not with bracelets; their bodies shine through doing kind deeds to others, not with ointment of sandal-wood.
  modern: |
    The ears of such men are adorned by hearing revelation, not by earrings. Their hands are adorned by giving, not by bracelets. Their bodies shine through kind deeds done for others, not through sandal-wood ointment.
'73':
  wortham: 72
  text: |
    The good man shuns evil and follows good: he keeps secret that which ought to be hidden: he makes his virtues manifest to all: he does not forsake one in adversity: he gives in season. Such (according to the wise) are the marks of a worthy friend.
  modern: |
    A good man shuns evil and follows good. He keeps secret what ought to be hidden and makes his virtues plain to all. He does not forsake a friend in adversity, and he gives at the right time. The wise say these are the marks of a worthy friend.
'74':
  wortham: 73
  text: |
    The sun opens the lotuses; the moon illuminates the beds of water-lilies; the cloud pours forth its water unasked: even so the liberal of their own accord are occupied in benefiting others.
  note: |
    The "kumuda" of this passage in Śakuntalā corresponds with the kairava (a lotus blossoming by moonlight) of Bhartrihari; pankaja with padma, the word used by Bhartrihari. The lotus called pankaja or padma is red, while the kumuda or kairava is white.
  modern: |
    The sun opens the lotuses, the moon lights the beds of water-lilies, and the cloud pours out its water unasked. In the same way the generous busy themselves of their own accord in benefiting others.
'75':
  wortham: 74
  text: |
    Those men are good men who study the good of others without regarding themselves. Those men are ordinary men who, while they benefit others, do not neglect their own interests. Those men are demons who destroy another's good for their own profit. What shall we call those who aimlessly destroy that which is another's?
  modern: |
    Those who work for the good of others without regard for themselves are good men. Those who benefit others without neglecting their own interests are ordinary men. Those who destroy another's good for their own profit are demons. What shall we call those who destroy what belongs to another for no purpose at all?
'76':
  wortham: 75
  text: |
    The milk that has been joined to the water has long since given over to it its own innate qualities. The water has seen the milk growing hot, and has immediately made an offering of itself in the fire. The milk was eager to rush into the fire, but having seen its friend's distress, remains still, being joined to the water. Even so is the friendship of the good.
  note: |
    The bond of friendship is represented in this sloka under the figure of milk and water. The water, by itself tasteless, receives sweetness of flavour from the milk, and therefore, as if in return for this benefit which it has received, is the first to boil over and rush into the hostile flames. The milk then follows the water, and, combined together, they extinguish the fire, their enemy. So friends acting together may overcome an enemy, even at the loss of their own lives.
  modern: |
    The milk joined to the water long ago gave it all its own qualities. When the water saw the milk growing hot, it at once offered itself to the fire. The milk was eager to rush into the fire, but seeing its friend's distress, it stays still, joined to the water. Such is the friendship of the good.
'77':
  wortham: 76
  text: |
    The ocean endures the sleep of Keśava, and is a refuge for the mountains in their flight from the demons; moreover, it is filled with devouring flames within. Surely the ocean can endure anything!
  modern: |
    The ocean endures the sleep of Keśava and gives refuge to the mountains in their flight from the demons. Moreover, devouring flames fill it within. Surely the ocean can endure anything!
'78':
  wortham: 77
  text: |
    Restrain desire, cultivate patience, conquer illusion, do not lust after evil, speak the truth, follow that which is good, seek the company of the virtuous, honour the wise, be reconciled even with enemies, conceal your own virtues, guard your good name, show pity for the unfortunate — these are the acts of the good.
  modern: |
    Restrain desire, cultivate patience, conquer illusion, do not lust after evil, speak the truth, follow what is good, seek the company of the virtuous, and honour the wise. Be reconciled even with enemies, conceal your own virtues, guard your good name, and show pity for the unfortunate. These are the acts of the good.
  departs: "The Sanskrit has jahi madam (\"destroy pride\") and prakhyāpaya praśrayam (\"proclaim your humility\"), not \"conquer illusion\" or \"conceal your own virtues\"."
'79':
  wortham: 78
  text: |
    How many noble men are there whose thoughts, words, and deeds are, as it were, filled with nectar — by whom the three worlds are loaded with blessings — who exalt even the very smallest virtues of another to the size of a mountain — whose hearts are constantly expanding?
  note: |
    "How many noble men there are in the world, pure in thought, word, and deed!" Expecting the answer, "But few."
  modern: |
    How many noble men are there whose thoughts, words, and deeds are filled with nectar? By them the three worlds are loaded with blessings. They raise even another's smallest virtues to the size of a mountain, and their hearts are always expanding.
'80':
  wortham: 79
  text: |
    What profit is there in Meru, the mountain of gold, or of the hill of silver, where the trees that grow remain the same trees without any change? We honour the hills of Malaya, for by contact with them common trees like the Trophis Aspera, the bitter Nimba, and the Karaya become themselves even as sandal trees.
  modern: |
    What use is Meru, the mountain of gold, or the hill of silver, where the trees that grow stay the same trees, unchanged? We honour the Malaya hills, for by touching them common trees like the Trophis aspera, the bitter Nimba, and the Karaya become sandal trees.
'81':
  wortham: 80
  text: |
    The gods rested not until they had gained possession of the nectar: they were not turned aside from the search by pearls of great price, nor by fear of terrible poison. Even so men of constant mind do not rest until they have completely accomplished their object.
  modern: |
    The gods did not rest until they had won the nectar. Pearls of great price did not turn them from the search, nor did fear of terrible poison. In the same way men of constant mind do not rest until they have fully accomplished their aim.
'82':
  wortham: 81
  text: |
    At one time a man may lie on the ground, at another he may sleep on a couch; at one time he may live on herbs, at another on boiled rice; at one time he may wear rags, at another a magnificent robe. The man of constant mind, bent on his purpose, counts neither state as pleasure nor pain.
  modern: |
    At one time a man may lie on the ground, at another sleep on a couch. At one time he may live on herbs, at another on boiled rice. At one time he may wear rags, at another a magnificent robe. The man of constant mind, set on his purpose, counts neither state as pleasure or pain.
'83':
  wortham: 82
  text: |
    Courtesy is the ornament of a noble man, gentleness of speech that of a hero; calmness the ornament of knowledge, reverence that of sacred learning; liberality towards worthy objects is the ornament of wealth, freedom from wrath that of the ascetic; clemency is the ornament of princes, freedom from corruption that of justice. The natural disposition, which is the parent of the virtues in each, is their highest ornament.
  modern: "Courtesy is the ornament of a noble man, and gentleness of speech is that of a hero. Calm is the ornament of knowledge, and reverence is that of sacred learning. Giving to worthy recipients is the ornament of wealth, and freedom from anger is that of the ascetic. Clemency is the ornament of princes, and freedom from corruption is that of justice. The natural disposition, which is the parent of the virtues in each, is the highest ornament of all."
'84':
  wortham: 83
  text: |
    The constant man may be blamed or praised by those skilled in discerning character; fortune may come to him or may leave him; he may die to-day or in ten thousand years' time; but for all that he does not turn aside from the path of righteousness.
  modern: |
    The constant man may be blamed or praised by those skilled in judging character. Fortune may come to him or leave him. He may die today or in ten thousand years. Whatever happens, he does not turn aside from the path of righteousness.
'85':
  wortham: 84
  text: |
    A rat fell by night into the jaws of a serpent whose body had been squeezed into a basket, and who was half-dead with hunger. The serpent, revived by his meal, went forth, and immediately meeting with the same fate as the rat, perished. Be content, O my friends, with your lot! The success or failure of men is in the hands of fate.
  note: |
    The "basket" (karanda) is explained by Telang as the place in which the snake-charmer keeps his snakes. "Meeting with the same fate," "tena eva yātah pathā," went by the same route as the rat, i.e., died.
  modern: |
    One night a rat fell into the jaws of a serpent whose body had been squeezed into a basket and who was half-dead with hunger. The serpent, revived by his meal, went out, and at once met the same fate as the rat and perished. Be content with your lot, O my friends! The success or failure of men is in the hands of fate.
  departs: "The Sanskrit says the serpent went out by the same hole the rat had made (tenaiva yātaḥ), a piece of good luck; it does not say he died."
'86':
  wortham: 86
  text: |
    Idleness is a great enemy to mankind: there is no friend like energy; for if you cultivate that it will never fail.
  modern: |
    Idleness is a great enemy of mankind. There is no friend like energy, for if you cultivate it, it will never fail you.
'87':
  wortham: 87
  text: |
    The tree that is cut down grows again; the moon that wanes waxes again after a time. Thus do wise men reflect, and, though distressed, are not overwhelmed.
  modern: |
    A tree that is cut down grows again. The moon that wanes waxes again after a time. Wise men reflect on this, and though distressed, they are not overwhelmed.
'88':
  wortham: 88
  text: |
    Indra, though guided by Vrihaspati, and armed with the thunderbolt; though the deities were his soldiers, and Vishnu his ally; though Svarga was his citadel, and the elephant Airasvata his steed, was defeated. How resistless is the power of fate! How vain are human efforts!
  modern: |
    Indra had Vrihaspati for his guide and the thunderbolt for his weapon. The deities were his soldiers and Vishnu his ally, Svarga was his citadel, and the elephant Airasvata was his steed. Yet he was defeated. How irresistible is the power of fate! How vain are human efforts!
'89':
  wortham: 89
  text: |
    Discernment is the fruit of men's actions, and is the result produced by deeds performed in another state: this must be carefully considered by the wise man who gives heed to all things.
  modern: |
    Discernment is the fruit of men's actions, the result of deeds done in another state of existence. The wise man who gives heed to all things must consider this carefully.
  departs: "The Sanskrit says the fruit depends on action and the intellect follows action, yet a wise man should still act only after careful deliberation; the rendering does not say this."
'90':
  wortham: 90
  text: |
    A bald-headed man was scorched by the rays of the sun on his head, and seeking a shady place, went, under the guidance of fate, to the foot of a palm tree. While resting there, the fruit of the tree fell with a loud noise on his head and broke it. Even so, wherever the unfortunate man goes, he generally meets with disaster.
  modern: |
    A bald man, his head scorched by the rays of the sun, went under fate's guidance to the foot of a palm tree, looking for shade. While he rested there, the tree's fruit fell on his head with a loud noise and broke it. In the same way, wherever an unfortunate man goes, disaster generally meets him there.
'91':
  wortham: 91
  text: |
    When I see the sun and moon exposed in the eclipse to the assaults of the demon; when I behold the bonds which hold a serpent or an elephant; when I behold the wise man in poverty, then the thought strikes me, "How mighty is the power of fate!"
  modern: |
    When I see the sun and moon exposed in an eclipse to the assaults of the demon, when I see a serpent or an elephant held in bonds, and when I see a wise man in poverty, the thought strikes me: "How mighty is the power of fate!"
'92':
  wortham: 92
  text: |
    Fate brings forth an excellent man — a very mine of virtue — and in a moment works his ruin. Alas! how unreasoning is the action of fate!
  note: |
    Tāvat = prathamam, according to commentator, "Fate first creates, &c., and then destroys." "An excellent man" (purusharatna, lit. "a jewel of a man"), ratna, used commonly with nouns to express their extreme excellence.
  modern: |
    Fate brings forth an excellent man, a very mine of virtue, and in a moment brings about his ruin. Alas, how unreasoning is the action of fate!
'93':
  wortham: 93
  text: |
    It is not the fault of the spring that the leafless tree does not produce leaves; it is not the fault of the sun that the owl cannot see by day; it is not the fault of the rain-cloud that the drops do not fall into the cuckoo's mouth. Who shall reverse that which fate has written on the forehead of each?
  modern: |
    It is not the spring's fault that the leafless tree puts out no leaves. It is not the sun's fault that the owl cannot see by day. It is not the rain-cloud's fault that the drops do not fall into the cuckoo's mouth. Who can undo what fate has written on each man's forehead?
'94':
  wortham: 94
  text: |
    We worship the gods, but are they not in the power of fate? Destiny must be worshipped, for that is the sole giver of rewards to man proportioned to the acts of their former state. But the fruit of those acts depends upon the acts themselves; why, then, should we worship either the god or destiny? Let us pay adoration to those works over which fate has no power.
  note: |
    The section relating to religious works begins with this sloka. The meaning of the stanza is as follows: — Man should give himself up to the works of religion, to study of the Scripture, to the exercise of liberality, to the instruction and the benefiting others; he should offer sacrifice to the deities and the manes; for these works will produce happiness for him in a future state, and are not in the power of destiny or fate, as all other things are, including even the deities themselves.
  modern: |
    We worship the gods, but are they not in the power of fate? Then destiny must be worshipped, since it alone gives men rewards in proportion to their acts in a former state. But the fruit of those acts depends on the acts themselves. So why should we worship either the god or destiny? Let us pay adoration to those works over which fate has no power.
'95':
  wortham: 95
  text: |
    By means of destiny Brahma was constrained to work like an artificer in the interior of his egg; by means of destiny Vishnu was compelled to pass through ten incarnations of great difficulty; by means of destiny Siva was forced to live as a mendicant, bearing the skull in his hands for a pot; by means of destiny the sun is compelled to travel his daily course in the heaven. Adoration, therefore, be to works.
  note: |
    Śiva (according to the fable) was supposed to have killed the sons of a Brahman, and was compelled to wander for twelve years as a mendicant bearing the skull of one of his victims in his hand.
  modern: "Through destiny Brahma was made to work like a craftsman inside the hollow of his egg. Through destiny Vishnu was made to pass through ten incarnations, each of great difficulty. Through destiny Siva was forced to live as a beggar, carrying a skull in his hands as a bowl. Through destiny the sun must travel his daily course in the heavens. Therefore, adoration to works."
'96':
  wortham: 96
  text: |
    Neither beauty, nor greatness of family, nor force of character, nor learning, nor service, though performed with care, but merit alone, gained from penances in a former state, will bring forth fruit to a man as a tree in its season.
  modern: |
    Neither beauty, nor greatness of family, nor force of character, nor learning, nor even carefully performed service will bring a man fruit. Only the merit gained from penances in a former state will bear fruit for him, as a tree does in its season.
'97':
  wortham: 97
  text: |
    A man may be in a forest, or in war, or in the midst of fire, or among a host of enemies, or in the ocean, or upon a high mountain; he may be asleep or mad; or he may be surrounded by difficulties; yet the good actions performed in a former state will profit him.
  modern: |
    A man may be in a forest, in war, in the midst of fire, among a host of enemies, in the ocean, or on a high mountain. He may be asleep or mad, or surrounded by difficulties. Yet the good actions he performed in a former state will profit him.
'98':
  wortham: 98
  text: |
    O wise man! cultivate constantly divine virtue; for that makes evil men good, the foolish wise, enemies well disposed, invisible things visible; in a moment that turns poison into nectar; that will give you the desired fruit of your acts. O virtuous man! do not vainly spend labour on acquiring mighty gifts with great pain!
  modern: |
    O wise man, cultivate divine virtue constantly. It makes evil men good, fools wise, and enemies well disposed. It makes invisible things visible, and in a moment it turns poison into nectar. It will give you the fruit you want from your acts. O virtuous man, do not spend labour in vain on acquiring mighty gifts with great pain!
'99':
  wortham: 99
  text: |
    The wise man, at the beginning of his actions, looks carefully to the end of them, that by their means he may be freed from births in another state. Actions performed with excessive haste are even as an arrow piercing the heart.
  note: |
    … Śalya tulyah, "equal to or like an arrow."
  modern: |
    At the beginning of his actions the wise man looks carefully to their end, so that by them he may be freed from births in another state. Actions done in excessive haste are like an arrow piercing the heart.
'100':
  wortham: 100
  text: |
    The man who, placed in the world of action, does not walk piously, regarding his state hereafter, is as one who cooks the lees of sesame over a sandal-wood fire in a caldron of lapis-lazuli, or as one who ploughs with a golden share to cultivate swallow-wort, or as one who cuts down a grove of camphor to fence in a field of kodrava.
  note: |
    "A field of kodrava." Kodrava is a common kind of grain eaten by the poor, Paspalum scrobiculatum.
  modern: |
    A man who is placed in the world of action and does not walk piously, with his state hereafter in view, is like one who cooks the lees of sesame over a sandal-wood fire in a caldron of lapis-lazuli, or one who ploughs with a golden ploughshare to grow swallow-wort, or one who cuts down a grove of camphor trees to fence in a field of kodrava.
'101':
  wortham: 101
  text: |
    A man may dive into the sea, he may ascend to the top of Mount Meru, he may be victorious over his enemies, he may devote himself to merchandise, he may plough the earth, he may study all learning and all art, he may travel on the wings of a bird from one end of heaven to the other, but yet he shall suffer that which is fated him on earth, neither shall that fail which is destined for him.
  modern: |
    A man may dive into the sea, climb to the top of Mount Meru, defeat his enemies, devote himself to trade, plough the earth, study all learning and all art, or travel on a bird's wings from one end of heaven to the other. Yet he will suffer what is fated for him on earth, and what is destined for him will not fail.
'102':
  wortham: 102
  text: |
    A terrible wood becomes a splendid city, and the whole world is filled with jewels, to that man who has performed righteous acts in his former existence; all men reverence his virtues.
  modern: |
    To a man who performed righteous acts in a former existence, a terrible wood becomes a splendid city, and the whole world is filled with jewels. All men revere his virtues.
'103':
  wortham: 103
  text: |
    What is most profitable? Fellowship with the good. What is the worst thing in the world? The society of evil men. What is the greatest loss? Failure in one's duty. Where the greatest peace? In truth and righteousness. Who is the hero? The man who subdues his senses. Who is best beloved? The faithful wife. What is wealth? Knowledge. What is the most perfect happiness? Staying at home. What is royalty? Command.
  modern: |
    What is most profitable? Fellowship with the good. What is the worst thing in the world? The company of evil men. What is the greatest loss? Failure in one's duty. Where is the greatest peace? In truth and righteousness. Who is the hero? The man who subdues his senses. Who is best beloved? The faithful wife. What is wealth? Knowledge. What is the most perfect happiness? Staying at home. What is royalty? Command.
  departs: "The Sanskrit question is nipuṇatā, \"What is skill?\" (answer: delight in the essence of dharma), not \"Where the greatest peace?\"."
'104':
  wortham: 105
  text: |
    The earth is variously adorned in various places; by poor men whose words are of no account — by rich men whose words are admired — by those contented with their own wives — by men who refrain from passing censure upon others.
  modern: |
    The earth is adorned in various places in various ways: by poor men whose words count for nothing, by rich men whose words are admired, by those content with their own wives, and by men who refrain from passing censure on others.
'105':
  wortham: 106
  text: |
    The constant man loses not his virtue in misfortune. A torch may point towards the ground, but its flame will still point upwards.
  modern: |
    The constant man does not lose his virtue in misfortune. A torch may be held pointing at the ground, but its flame still points upwards.
'106':
  wortham: 107
  text: |
    The mind of the constant man is not pierced by the arrows shot from the glances of love; he is not consumed by the fire of anger: worldly objects do not ensnare him in the net of covetousness; he is the lord of the three worlds.
  modern: |
    The mind of the constant man is not pierced by the arrows shot from the glances of love. The fire of anger does not consume him, and worldly objects do not ensnare him in the net of covetousness. He is the lord of the three worlds.
'107':
  wortham: 108
  text: |
    The mighty earth, trodden by the feet of one hero, is lightened up with his exceeding great glory as though by the shining of the sun.
  modern: |
    The mighty earth, trodden by the feet of one hero, is lit up by his exceeding glory as if by the shining of the sun.
'108':
  wortham: 109
  text: |
    Through the power of constancy fire becomes even as water, the ocean becomes but a rivulet, Mount Meru becomes only a small stone, a lion becomes as harmless as an antelope, a savage beast becomes a garland of flowers, poison is turned into nectar. The constant man, by his constancy, turns the savage things in nature into the most gentle.
  modern: |
    Through the power of constancy fire becomes like water, the ocean becomes a mere rivulet, Mount Meru becomes a small stone, a lion becomes as harmless as an antelope, a savage beast becomes a garland of flowers, and poison turns to nectar. By his constancy the constant man turns the savage things in nature into the most gentle.
'109':
  wortham: 110
  text: |
    Honourable men may cast aside life and happiness, but inasmuch as they are intent upon truth, they do not cast off their truthfulness, the cause of modesty and of all the virtues, following them wherever they may go, pure in heart, even as dear to them as their own mother.
  modern: |
    Honourable men may cast aside life and happiness, but because they are intent on truth, they do not cast off their truthfulness. It is the cause of modesty and of all the virtues. It follows them wherever they go, pure in heart, as dear to them as their own mother.
