# Pañcatantra 1.192+9 – 1.219+8 (the weaver's wife and the barber's wife, end of
# tale 4; the verses on women; the barber tried; tale 5, the weaver and the
# chariot-maker, begins): the author's decisions on vidyut's reading.
# Format: see the header of content/texts/pancatantra-kilotpatin/overrides.yaml.
# The text is GRETIL's (Jha's edition); its typing slips stay in text.yaml and
# are corrected here, each with a note. As in p05: a speech run on to its verb
# of saying (आहयि, तामाहपुंश्चलि) is split into आह and the first word spoken;
# आह is ब्रू, लट् (3.4.84), with a past sense in narrative; a bare "!" or "?"
# the edition prints as a word carries no pada. After such a mark vidyut's
# padas slip one word to the left, so every later word of that section is split.

