# Pañcatantra 4.57+10 – 4.78+4: the crocodile's wife dies, the verses on
# women, the farmer's wife and the rogue (tale 12), the crocodile's lost
# home, and the opening of the jackal Mahācaturaka (tale 14).
# Format: see the header of content/texts/pancatantra-kilotpatin/overrides.yaml.
# GRETIL types the speech-dash away, so "आहभो" prints as one word; those are
# split into their padas without a note. A bare "!", "?" or tale number
# carries no pada. GRETIL's typing slips stay in text.yaml and are corrected
# here, each with a note.

