      - { form: भोः, lemma: भोस्, a: अव्यय, gloss: "ho! O!" }
  श्वापदाः:
    split:
      - { form: श्वापदाः, lemma: श्वापद, a: सम्बोधन बहुवचन पुंलिङ्ग, gloss: "O beasts of prey" }
  '!':
    split: []
    note: The snapshot gives the "!" the next word's pada; each word after it is re-stated here.
  किं:
    split:
      - { form: किम्, lemma: किम्, a: अव्यय, gloss: "why?" }
  यूयं:
    split:
      - { form: यूयम्, lemma: युष्मद्, a: प्रथमा बहुवचन, gloss: "you" }
  मां:
    split:
      - { form: माम्, lemma: अस्मद्, a: द्वितीया एकवचन, gloss: "me" }
  दृष्ट्वैव:
    split:
      - { form: दृष्ट्वा, lemma: दृश्, a: अव्यय क्त्वा, gloss: "on seeing" }
      - { form: एव, lemma: एव, a: अव्यय, gloss: "merely, just" }
  संत्रस्ता:
    split:
      - { form: संत्रस्ताः, lemma: संत्रस्, a: प्रथमा बहुवचन पुंलिङ्ग क्त, gloss: "terrified" }
    note: "संत्रस्ताः, its visarga dropped before व (8.3.17, 8.3.22)."
  व्रजथ:
    split:
      - { form: व्रजथ, lemma: व्रज्, a: लट् मध्यमपुरुष बहुवचन परस्मैपद, gloss: "you run away" }
