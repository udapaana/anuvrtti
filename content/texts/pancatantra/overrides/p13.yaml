# kathā 16, the lion Vajradaṃṣṭra and the camel Śaṅkukarṇa.
# Format: see the header of content/texts/pancatantra-kilotpatin/overrides.yaml.
# As in p05: the edition runs a speech on to its verb of saying (आहभो, प्राहभद्र):
# such chunks are split into आह and the first word spoken, आह lemmatized as ब्रू,
# लट्. A bare "!" or tale number the edition prints as a word carries no pada;
# words after a "!" are often re-stated whole (an older snapshot shifted their
# padas). GRETIL's typing slips stay in text.yaml and are corrected
# here, each with a note.

