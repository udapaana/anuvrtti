# Pañcatantra 2.113+17 – 2.141: the end of Prāptavyamartha's tale (the
# elephant, the four brides), the tortoise welcomes the deer's friend, and
# the weaver Somilaka (कथा ५) up to the verses on wealth unused.
# Format: see the header of content/texts/pancatantra-kilotpatin/overrides.yaml.
# The edition runs a speech on to its verb of saying (आहभोः, प्राहभोः): such
# chunks are split into the verb and the first word spoken. A bare "!" or "?"
# carries no pada. The hero's name प्राप्तव्यमर्थ is the verse's own words
# (प्राप्तव्यम् अर्थं लभते मनुष्यः) made a name: where it is the name it is one
# pada, where the verse is quoted it is two.

'2.113+17':
  सोऽब्रवीत्प्राप्तव्यमर्थं:
    split:
      - { form: सः, lemma: तद्, a: प्रथमा एकवचन पुंलिङ्ग, gloss: "he" }
      - { form: अब्रवीत्, lemma: ब्रू, a: लङ् प्रथमपुरुष एकवचन परस्मैपद, gloss: "said" }
