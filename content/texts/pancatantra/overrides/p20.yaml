      - { form: अर्थम्, lemma: अर्थ, a: द्वितीया एकवचन पुंलिङ्ग, gloss: "wealth, the thing (one is due)" }
    note: "प्राप्तव्यम् agrees with अर्थम्: 'a man gets the wealth that is his to get'. The verse is the hero's refrain, and so his name."
  लभते:
    fix:
      1: { gloss: "gets, obtains" }
  मनुष्यः:
    fix:
      1: { lemma: मनुष्य, a: प्रथमा एकवचन पुंलिङ्ग, gloss: "a man" }

