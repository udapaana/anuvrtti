'3.166':
  तत्तथा:
    fix:
      1: { a: अव्यय, gloss: "so, therefore" }
      2: { gloss: "in such a way (answered by यथा)" }
  साधयाम्येतच्छरीरं:
    split:
      - { form: साधयामि, lemma: सिध्, a: लट् उत्तमपुरुष एकवचन परस्मैपद णिच्, gloss: "I will make an end of, dispose of" }
      - { form: एतत्, lemma: एतद्, a: द्वितीया एकवचन नपुंसकलिङ्ग, gloss: "this" }
      - { form: शरीरम्, lemma: शरीर, a: द्वितीया एकवचन नपुंसकलिङ्ग, gloss: "body" }
    note: The present stands for the near future, "I will so dispose of this body …".
  दुःखजीवितम्:
    split:
      - { form: दुःख, lemma: दुःख, member: true, gloss: "misery" }
      - { form: जीवितम्, lemma: जीवित, a: द्वितीया एकवचन नपुंसकलिङ्ग, gloss: "life (दुःखजीवित \"whose life is misery\")" }
  भूयो:
    fix:
      1: { gloss: "again" }
  वक्ष्यामि:
    fix:
      1: { gloss: "I shall say" }
  नास्तीत्यर्थिसमागमे:
    split:
      - { form: न, lemma: न, a: अव्यय, gloss: "not" }
      - { form: अस्ति, lemma: अस्, a: लट् प्रथमपुरुष एकवचन परस्मैपद, gloss: "there is" }
      - { form: इति, lemma: इति, a: अव्यय, gloss: "(closes the quoted words)" }
      - { form: अर्थि, lemma: अर्थिन्, member: true, gloss: "a supplicant, one who asks" }
      - { form: समागमे, lemma: समागम, a: सप्तमी एकवचन पुंलिङ्ग, gloss: "on the coming (of)" }
    note: "\"There is nothing\" (नास्ति) is the poor host's refusal to a supplicant; इति marks it as quoted."

'3.167':
