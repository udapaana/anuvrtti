# Pañcatantra 3.164 – 3.195+5: the end of the hunter and the pigeons (the
# pigeon gives itself as food, the hunter turns ascetic, the dove follows her
# husband into the fire); the owl king's ministers on sparing the crow — the
# old merchant, his young wife and the thief; the brahmin Droṇa, the thief and
# the demon; the prince and the two snakes; and the start of the chariot-maker
# Vīravara and his wife.
# Format: see the header of content/texts/pancatantra-kilotpatin/overrides.yaml.
# A bare "!" or "?" carries no pada.

