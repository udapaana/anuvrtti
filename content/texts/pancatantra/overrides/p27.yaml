    fix:
      1: { gloss: "to give" }
  शक्तिमान्:
    fix:
      1: { gloss: "able" }
  तस्यानेकपरिक्लेशे:
    split:
      - { form: तस्य, lemma: तद्, a: षष्ठी एकवचन पुंलिङ्ग, gloss: "of him, for him" }
      - { form: अनेक, lemma: अनेक, member: true, gloss: "many" }
      - { form: परिक्लेशे, lemma: परिक्लेश, a: सप्तमी एकवचन नपुंसकलिङ्ग, gloss: "hardship (अनेकपरिक्लेश \"full of many hardships\")" }
    note: अनेकपरिक्लेशे is a बहुव्रीहि qualifying गृहे, so it takes the neuter of गृह.
  गृहे:
    fix:
      1: { a: सप्तमी एकवचन नपुंसकलिङ्ग, gloss: "in a house, at home" }
  किं:
    fix:
      1: { a: प्रथमा एकवचन नपुंसकलिङ्ग, gloss: "what? (किं फलम् \"what is the use?\")" }
  वसतः:
    fix:
      1: { gloss: "living, dwelling" }
  फलम्:
    fix:
