    split:
      - { form: निनिन्द, lemma: निन्द्, a: लिट् प्रथमपुरुष एकवचन परस्मैपद, gloss: "blamed, reproached" }
    note: >-
      The edition prints निनिन्दि; the perfect of निन्द् is निनिन्द ("he
      reproached himself, not the hunter"). Read as a misprint, though the
      printed -इ fills the line's eighth syllable.
  किलात्मानं:
    fix:
      1: { gloss: "indeed, they say" }
      2: { gloss: "himself" }
  तं:
    fix:
      1: { gloss: "that" }
  पुनः:
    fix:
      1: { gloss: "but" }
  उवाच:
    fix:
      1: { gloss: "said" }
  तर्पयिष्ये:
    fix:
      1: { a: लृट् उत्तमपुरुष एकवचन आत्मनेपद णिच्, gloss: "I will satisfy, feed (you)" }
    note: The causative of तृप् with an आत्मनेपद ending, not a passive.
  मुहूर्तं:
    fix:
      1: { gloss: "for a moment" }
  प्रतिपालय:
    split:
      - { form: प्रतिपालय, lemma: प्रतिपाल्, a: लोट् मध्यमपुरुष एकवचन परस्मैपद चुरादि, gloss: "wait" }

'3.168':
