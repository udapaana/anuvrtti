# Pañcatantra 3.164 – 3.195+5: the hunter, the pigeon pair and the fire (the
# pigeon gives itself as food, the hunter turns ascetic, the dove follows her
# husband into the fire); then the old man, his young wife and the thief, and
# the start of the tale of the brahmin and the thief and the demon, and of the
# chariot-maker and his wife.
# Format: see the header of content/texts/pancatantra-kilotpatin/overrides.yaml.
# A bare "!" or "?" carries no pada.

'3.164':
  सहस्रं:
    fix:
      1: { a: द्वितीया एकवचन नपुंसकलिङ्ग, gloss: "a thousand (dependants)" }
  भरते:
    fix:
      1: { gloss: "supports, maintains" }
  कश्चिच्छतमन्यो:
    split:
      - { form: कः, lemma: किम्, a: प्रथमा एकवचन पुंलिङ्ग, gloss: "who? — with चित्, \"someone\"" }
      - { form: चित्, lemma: चित्, a: अव्यय, gloss: "with an interrogative: \"some-\"" }
      - { form: शतम्, lemma: शत, a: द्वितीया एकवचन नपुंसकलिङ्ग, gloss: "a hundred" }
      - { form: अन्यः, lemma: अन्य, a: प्रथमा एकवचन पुंलिङ्ग, gloss: "another" }
  दशापरः:
    split:
      - { form: दश, lemma: दशन्, a: द्वितीया बहुवचन पुंलिङ्ग, gloss: "ten" }
      - { form: अपरः, lemma: अपर, a: प्रथमा एकवचन पुंलिङ्ग, gloss: "another, a third" }
  त्वकृतपुण्यस्य:
    split:
      - { form: तु, lemma: तु, a: अव्यय, gloss: "but" }
      - { form: अकृत, lemma: अकृत, member: true, gloss: "not done, not earned" }
      - { form: पुण्यस्य, lemma: पुण्य, a: षष्ठी एकवचन पुंलिङ्ग, gloss: "merit (अकृतपुण्य \"who has earned no merit\")" }
    note: A बहुव्रीहि agreeing with मम — "of me, who have earned no merit (in former lives)".
  क्षुद्रस्यात्मापि:
    fix:
      1: { gloss: "petty, wretched" }
      2: { gloss: "self, one's own self" }
      3: { gloss: "even" }
  दुर्भरः:
    fix:
      1: { gloss: "hard to support, hard to feed" }

