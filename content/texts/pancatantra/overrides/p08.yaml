# Pañcatantra 1.230 – 1.250+6: the crows and the snake (the jackal's counsel),
# kathā 7, the heron and the crab; kathā 8, the lion Bhāsuraka and the hare,
# to the hare's account of the "rival" lion.
# Format: see the header of content/texts/pancatantra-kilotpatin/overrides.yaml.
# The edition runs a speech on to its verb of saying (आहवत्स, प्राहमाम): such
# chunks are split into आह (ब्रू, लट्, with a past sense in narrative) and the
# first word spoken. Where the edition prints "!" or "?" as a word, vidyut's
# padas slip one word to the right for the rest of the section, so every word
# after it is split here; the mark itself, like a tale number, carries no pada.

