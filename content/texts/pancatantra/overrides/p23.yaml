      licence of the verse (the prose would have युध्यमानानाम्).
  उपायत्रितयादूर्ध्वं:
    split:
      - { form: उपाय, lemma: उपाय, member: true, gloss: "means (of policy)" }
      - { form: त्रितयात्, lemma: त्रितय, a: पञ्चमी एकवचन नपुंसकलिङ्ग, gloss: "the triad" }
      - { form: ऊर्ध्वम्, lemma: ऊर्ध्वम्, a: अव्यय, gloss: "after, beyond (with the ablative)" }
    note: "The three means tried before force: conciliation, gifts and division (साम, दान, भेद); war is the fourth."
  तस्माद्युद्धं:
