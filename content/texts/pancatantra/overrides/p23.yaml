# Pañcatantra 3.11 – 3.71: Meghavarṇa's ministers advise him on the six
# measures of policy — Anujīvin argues for withdrawal (यान/अपसरण), Prajīvin
# for staying put (आसन), Cirañjīvin for alliance (संश्रय) — and the old
# minister Sthirajīvin recommends double dealing (द्वैधीभाव) and spies on the
# eighteen tīrthas; then the story of why crows and owls are enemies begins.
# Format: see the header of content/texts/pancatantra-kilotpatin/overrides.yaml.
# The edition runs a speech on to its verb of saying (आहवत्स, प्राहभद्र): such
# chunks are split into the verb and the first word spoken. A bare "!" or "?"
# carries no pada. Evident misprints of the edition are corrected in the pada,
# each with a note; the text keeps the print.

