    split:
      - { form: युध्यताम्, lemma: युध्, a: षष्ठी बहुवचन पुंलिङ्ग शतृ, gloss: "fighting, who fight" }
    note: >-
      The edition spells युद्ध्यताम् (a common doubling); read युध्यताम्, the
