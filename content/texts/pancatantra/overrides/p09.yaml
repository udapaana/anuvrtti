# Pañcatantra 1.250+7 – 1.282+3: the end of kathā 8 (the lion Bhāsuraka and
# the hare: the well and the reflection); Damanaka sets Piṅgalaka against
# Sañjīvaka; kathā 9, the louse Mandavisarpiṇī and the bug Agnimukha; the
# opening of kathā 10, the jackal Caṇḍarava.
# Format: see the header of content/texts/pancatantra-kilotpatin/overrides.yaml.
# As in p05: a speech run on to its verb of saying (आहभद्र, प्राहदेव) is split
# into आह and the first word spoken; आह is ब्रू, लट्, with a past sense in
# narrative. A bare "!", "?" or tale number carries no pada, and where vidyut
# let one swallow the next word's padas, every following word of that section
# is split afresh.

