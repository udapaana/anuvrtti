# his three servants and the camel Krathanaka); Damanaka and Saṃjīvaka; kathā 12,
# the ṭiṭṭibha couple and the sea, with the opening of the tortoise and the geese.
# Format: see the header of content/texts/pancatantra-kilotpatin/overrides.yaml.
# The edition runs a speech on to its verb of saying (आहस्वामिन्, प्रोवाचभोः):
# such chunks are split here. आह is lemmatized as ब्रू, लट् (3.4.84), with a past
# sense in narrative. A bare "!" or "?" the edition prints as a word carries no
# pada; where the snapshot hands it the next word's padas, every word after it
# in that section is re-stated with a full split.
# Sentence-opening तत् "so, therefore" is taken as an अव्यय.

