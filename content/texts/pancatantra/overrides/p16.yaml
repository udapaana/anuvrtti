# opening of Book 2 (मित्रसम्प्राप्ति): the pigeons in the fowler's net.
# Format: see the header of content/texts/pancatantra-kilotpatin/overrides.yaml.
# The edition runs a speech on to its verb of saying (आहभो, अभिहितम्भोः): such
# chunks are split into the verb and the first word spoken. A bare "!" or "?"
# carries no pada; after such a mark vidyut's padas slip one word to the left,
# so the rest of that section is split word by word.

