# Pañcatantra 1.165+2 – 1.192+8: Karaṭaka and Damanaka confer; kathā 4, the
# ascetic Devaśarman and the rogue Āṣāḍhabhūti (with the rams and the jackal,
# the weaver's wife and the barber's wife).
# Format: see the header of content/texts/pancatantra-kilotpatin/overrides.yaml.
# The edition runs a speech on to its verb of saying with no break (आहकथमेतत्,
# सादरमाहवत्स): such chunks are split here into आह and the first word spoken.
# आह is lemmatized as ब्रू, लट् (3.4.84 ब्रुवः पञ्चानामादित आहो ब्रुवः), with a
# past sense in narrative. A bare "!" or tale number the edition prints as a word
# carries no pada.

