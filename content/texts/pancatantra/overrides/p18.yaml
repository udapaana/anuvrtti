# his own story, the brahmin and his wife (सकृत् … ब्राह्मणी), and the
# hunter, the boar and the jackal who ate a bowstring (अतितृष्णा न कर्तव्या).
# Format: see the header of content/texts/pancatantra-kilotpatin/overrides.yaml.
# The edition runs a speech on to its verb of saying (आहभोः, प्रोवाचभो): such
# chunks are split into the verb and the first word spoken. A bare "!" or "?"
# carries no pada.

