# Pañcatantra 3.99 – 3.125+1: the cat Tīkṣṇadaṃṣṭra's sermon and the end of
# the hare and the partridge (क्षुद्रमर्थपतिं प्राप्य), the crow who spoiled
# the owl's coronation and the enmity it began, Sthirajīvin's plan, the
# brahmin Mitraśarman and the three rogues (बहुबुद्धिसमायुक्ताः), the serpent
# Atidarpa and the ants (बहवो न विरोद्धव्याः), and the sham quarrel.
# Format: see the header of content/texts/pancatantra-kilotpatin/overrides.yaml.
# The edition runs a speech on to its verb of saying (आहभोः, तमुवाचभोः): such
# chunks are split into the verb and the first word spoken. A bare "!" or "?",
# a tale number and a verse cross-reference carry no pada.

