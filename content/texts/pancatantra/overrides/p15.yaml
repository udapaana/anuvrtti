# Pañcatantra 1.432+3 – 1.451+1: Dharmabuddhi and Pāpabuddhi (the buried
# money and the witness in the śamī tree), with the heron and the crab, the
# merchant Jīrṇadhana's iron balance, and the monkey who killed the king.
# Format: see the header of content/texts/pancatantra-kilotpatin/overrides.yaml.
# The edition runs a speech on to its verb of saying with no break (आहभद्र,
# प्रोवाचभो): such chunks are split into the verb and the first word spoken.
# आह is ब्रू, लट् (3.4.84), with a past sense in narrative; भो before a voiced
# sound is भोः (8.3.17, 8.3.22). A bare "!" or "?" or a tale number carries no
# pada; after such a mark vidyut's padas slip one word to the left, so the
# rest of that section is split word by word.

