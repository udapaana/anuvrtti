# Pañcatantra 3.72 – 3.98: the birds' council to crown the owl king, the
# crow's dissent, and his tale of the elephants and the hares (चतुर्दन्त and
# the hare-envoy विजयदत्त of the moon), with the frame of the partridge and
# the hare going to the cat for judgement.
# Format: see the header of content/texts/pancatantra-kilotpatin/overrides.yaml.
# The edition runs a speech on to its verb of saying (प्रोचुःभोः, आहहो): such
# chunks are split into the verb and the first word spoken. A bare "!" or "?"
# carries no pada.

