  text: … in that passage the word 'goats' signifies grain that has aged seven years. 'Go, oats' — such is the true exegesis.
  modern: But in that passage 'goats' means grain that has aged seven years. 'Go, oats' is the true reading.
  ryder: Book III p. 320
3.106+5:
  text: 'And then, consider the passage:'
  modern: 'And then consider this passage:'
  ryder: Book III p. 320
'3.107':
  text: 'If he who cuts down trees or cattle,

    Or makes a bloody slime in battle,

    Should thereby win to heaven — well,

    Who (let me ask you) goes to hell?'
  modern: If a man who cuts down trees and cattle, or makes a bloody mire in battle, wins heaven, then who goes to hell?
  ryder: Book III p. 320
3.107+1:
  text: '"No, no. I shall eat nobody.'
  modern: '"No, no. I will eat nobody.'
  ryder: Book III p. 321
3.107+2:
  text: However, I am somewhat old and do not readily distinguish your voices from a distance. So how am I to determine winner and loser?
  modern: '"But I am rather old, and I cannot easily tell your voices apart from a distance. So how am I to decide who wins and who loses?'
  ryder: Book III p. 321
3.107+3:
  text: (with 3.107+2)
  ryder: Book III p. 321
3.107+4:
  text: In view of this, pray draw near and make me acquainted with the case. Then I can pronounce a judgment that discriminates the essence of the matter, and thus causes no impediment in my march to the other world.
  modern: So come close and tell me the case. Then I can judge the essence of the matter, and that will not hold me back on my way to the other world.
  ryder: Book III p. 321
3.107+5:
  text: 'You know the stanza:'
  modern: 'You know the verse:'
  ryder: Book III p. 315
'3.108':
  text: 'If any man, from pride or greed,

    Timidity or wrath,

