  text: 'But she replied: "My dear husband, how can you fight the ocean?"'
  modern: 'His wife replied: "Dear husband, how can you fight the ocean?"'
'1.354':
  text: 'Furthermore,

    Gay simpletons who fight,

    Not estimating right

    The foe''s power and their own,

    Like moths in flame atone.'
  modern: Foolish creatures who fight an enemy without knowing their own strength or his die like moths that fly into a flame.
1.354+1:
  text: '"My dear," said the plover, "you should not say such things."'
  modern: 'Ṭiṭṭibha said: "Dear, do not say such things."'
'1.357':
  text: 'The sun''s new-risen beams

    Upon the mountains fall:

    Where glory is cognate,

    Age matters not at all.'
  modern: The young sun's rays fall on the mountains. Those born with power do not need age.
1.358+1:
  text: With this bill I shall dry up the water to the last drop, and turn the sea into dry land.
  modern: With this beak I will dry up every drop of water and turn the sea into dry land.
1.358+2:
  text: '"Darling," said his wife, "with a bill that holds one drop how will you dry up the ocean, into which pour without ceasing the Ganges and the Indus, bearing the water of nine times nine hundred tributary streams? Why talk nonsense?"'
  modern: 'His wife said: "Dear, how will you dry up the ocean with a beak that holds one drop? The Ganges and the Indus pour into it without end, bringing the water of nine times nine hundred streams. Why talk nonsense?"'
1.358+3:
  text: (with 1.358+2)
1.358+4:
  text: 'But the plover said:'
  modern: 'Ṭiṭṭibha said:'
'1.359':
  text: 'Success is rooted in the will;

    And I possess an iron-strong bill;

    Long days and nights before me lie:

    Why should not ocean''s flood go dry?'
  modern: Success grows from determination. My beak is iron, and the long days and nights are mine. Why should the ocean not dry up?
'1.360':
  text: 'The highest glory to attain

    Asks enterprise and manly strain:

    The sun must first to Libra climb

    Before he routs the cloudy time.'
  modern: The highest goal is hard to reach until a man makes a manly effort. The sun must climb to Libra before it scatters the clouds.
1.360+1:
  text: '"Well," said his wife, "if you feel that you must make war on the ocean, at least call other birds to your aid before you begin.'
  modern: 'His wife said: "If you must fight the ocean, first call other birds to help you."'
1.360+2:
  text: (with 1.360+1)
1.360+3:
  text: 'For the proverb says:'
  modern: 'As the saying goes:'
'1.361':
  text: 'A host where each is weak

    Brings victory to pass: The elephant is bound

    By woven ropes of grass.'
  modern: Many weak creatures together are hard to beat. A rope of grass binds even an elephant.
'1.362':
  text: 'And again:

    Woodpecker and sparrow

    With froggy and gnat,

    Attacking en masse, laid

    The elephant flat.'
  modern: A sparrow, a woodpecker, a gnat and a frog together brought down an elephant.
1.362+1:
  text: '"How was that?" asked Sprawl.'
  modern: 'Ṭiṭṭibha asked: "How was that?"'
1.362+2:
  text: And Constance told the story of
  modern: His wife told the story of
1.362+3:
  text: In a dense bit of jungle lived a sparrow and his wife, who had built their nest on the branch of a tamal tree, and in course of time a family appeared.
  modern: In a dense forest a sparrow and his wife had built their nest on a tamal tree, and in time they had a family.
1.362+4:
  text: (with 1.362+3)
1.362+5:
  text: Now one day a jungle elephant with the spring fever was distressed by the heat, and came beneath that tamal tree in search of shade.
  modern: One day a wild elephant in spring fever, troubled by the heat, came under that tamal tree for shade.
1.362+6:
  text: Blinded by his fever, he pulled with the tip of his trunk at the branch where the sparrows had their nest, and broke it.
  modern: Blind with fever, he pulled the branch with the tip of his trunk, where the sparrows had their nest, and broke it.
1.362+7:
  text: In the process the sparrows' eggs were crushed, though the parent-birds — further life being predestined — barely escaped death.
  modern: In the process the eggs were crushed. The parent birds, whose lives were not yet over, barely escaped death.
1.362+8:
  text: (with 1.362+7)
1.362+9:
  text: Then the hen-sparrow lamented, desolate with grief at the death of her chicks.
  modern: The hen-sparrow wept, heartbroken over the death of her chicks.
1.362+10:
  text: 'And presently, hearing her lamentation, a woodpecker bird, a great friend of hers, came grieved at her grief, and said: "My dear friend, why lament in vain?"'
  modern: 'Hearing her cries, a woodpecker, a close friend, came grieving at her grief and said: "Dear friend, why lament in vain?"'
1.362+11:
  text: 'For the Scripture says:'
  modern: 'The scripture says:'
'1.363':
  text: 'For lost and dead and past

    The wise have no laments:

    Between the wise and fools

    Is just this difference.'
  modern: The wise do not grieve for what is lost, dead or gone. That is the difference between the wise and fools.
'1.364':
  text: 'And again:

    No life deserves lament;

    Fools borrow trouble,

    Add sadness to the sad,

    So make it double.'
  modern: 'And again: no life deserves grief. Fools take on trouble and add sorrow to sorrow, so they double it.'
'1.365':
  text: 'And yet again:

    Since kinsmen''s sticky tears

    Clog the departed,

    Bury them decently,

    Tearless, whole-hearted.'
  modern: Tears of kin weigh on the dead. So do not weep; perform the rites as you are able.
1.365+1:
  text: '"That is good doctrine," said the hen-sparrow, "but what of it? This elephant — curse his spring fever! — killed my babies.'
  modern: '"That is good doctrine," said the hen-sparrow. "But this elephant, mad with spring fever, killed my chicks."'
1.365+2:
  text: (with 1.365+1)
1.365+3:
  text: So if you are my friend, think of some plan to kill this big elephant.
  modern: So if you are truly my friend, think of a way to kill this elephant.
1.365+4:
  text: If that were done, I should feel less grief at the death of my children.
  modern: If he were killed, my grief for my chicks would ease.
1.365+5:
  text: 'You know the saying:'
  modern: 'You know the saying:'
'1.366':
  text: 'While one brings comfort in distress,

    Another jeers at pain;

    By paying both as they deserve,

    A man is born again.'
  modern: When a man has repaid both the one who helped him in hard times and the one who mocked him, he is, I think, born again.
1.366+1:
  text: '"Madam," said the woodpecker, "your remark is very true."'
  modern: 'The woodpecker said: "Madam, you speak truly."'
1.366+2:
  text: 'For the proverb says:'
  modern: 'As the saying goes:'
'1.367':
  text: 'A friend in need is a friend indeed,

    Although of different caste;

    The whole world is your eager friend

    So long as riches last.'
  modern: A friend in trouble is a true friend, even of another caste. Everyone is your friend while you prosper.
'1.368':
  text: 'And again:

    A friend in need is a friend indeed;

    Fathers indeed are those who feed;

    True comrades they, and wives indeed,

    Whence trust and sweet content proceed.'
  modern: 'And again: a friend in trouble is a true friend. Fathers are those who feed us, and comrades and wives are true when they bring trust and contentment.'
1.368+1:
  text: Now see what my wit can devise.
  modern: Now see what my wit can devise.
1.368+2:
  text: But you must know that I, too, have a friend, a gnat called Lute-Buzz. I will return with her, so that this villainous beast of an elephant may be killed.
  modern: I too have a friend, a gnat named Vīṇārava (Lute-Buzz). I will bring her, so that this wicked elephant is killed.
1.368+3:
  text: (with 1.368+2)
1.368+4:
  text: 'So he went with the hen-sparrow, found the gnat, and said: "Dear madam, this is my friend the hen-sparrow. She is mourning because a villainous elephant smashed her eggs. So you must lend your assistance while I work out a plan for killing him."'
  modern: 'The woodpecker went with the hen-sparrow to the gnat and said: "Madam, my friend the hen-sparrow is mourning because a wicked elephant smashed her eggs. Help me while I work out a plan to kill him."'
1.368+5:
  text: (with 1.368+4)
1.368+6:
  text: '"My good friend," said the gnat, "there is only one possible answer."'
  modern: 'The gnat said: "My friend, there is only one answer to that."'
1.369+2:
  text: But I also have a very intimate friend, a frog named Cloud-Messenger.
  modern: But I too have a close friend, a frog named Meghanāda (Cloud-Messenger).
1.369+3:
  text: Let us do the right thing by calling him into consultation.
  modern: Let us call him and do what is right.
1.369+4:
  text: 'For the proverb says:'
  modern: 'As the saying goes:'
'1.370':
  text: 'A wise companion find,

    Shrewd, learned, righteous, kind;

    For plans by him designed

    Are never undermined.'
  modern: 'Find a wise companion: shrewd, learned, upright and kind. The plans he designs are never undone.'
1.370+1:
  text: So all three went together and told Cloud-Messenger the entire story.
  modern: The three of them went together and told Meghanāda the whole story.
1.370+2:
  text: 'And the frog said: "How feeble a thing is that wretched elephant when pitted against a great throng enraged!"'
  modern: 'The frog said: "What a feeble thing that wretched elephant is against a great, angry crowd!"'
1.370+4:
  text: Gnat, you must go and buzz in his fevered ear, so that he may shut his eyes in delight at hearing your music.
  modern: Gnat, go and buzz in his fevered ear, so that he shuts his eyes in delight at your music.
1.370+5:
  text: (with 1.370+4)
1.370+6:
  text: Then the woodpecker's bill will peck out his eyes. After that I will sit on the edge of a pit and croak. And he, being thirsty, will hear me, and will approach expecting to find a body of water.
  modern: Then the woodpecker will peck out his eyes. I will sit on the edge of a pit and croak. Thirsty, he will hear me and come, expecting water.
1.370+7:
  text: When he comes to the pit, he will fall in and perish.
  modern: When he reaches the pit, he will fall in and die.
1.370+9:
  text: When they carried out the plan, the fevered elephant shut his eyes in delight at the song of the gnat, was blinded by the woodpecker, wandered thirst-smitten at noonday, followed the croak of a frog, came to a great pit, fell in, and died.
  modern: They carried out the plan. The fevered elephant, delighted by the gnat's song, shut his eyes. The woodpecker blinded him. At noon, parched with thirst, he followed the frog's croak, came to a great pit, fell in and died.
1.370+10:
  text: 'And that is why I say: Woodpecker and sparrow, .... and the rest of it.'
  modern: 'That is why I say: the woodpecker and the sparrow ... and so on.'
1.370+11:
  text: '"Very well," said the plover.'
  modern: '"Very well," said Ṭiṭṭibha.'
1.370+12:
  text: I will assemble my friends and dry up the ocean.
  modern: I will gather my friends and dry up the ocean.
1.370+13:
  text: With this in mind, he summoned all the birds and related his grief at the rape of his chicks.
  modern: With this in mind, he called all the birds and told them of his grief at the seizure of his chicks.
1.371+1:
  text: The king of us all is Garuda.
  modern: Garuda is our lord.
1.371+2:
  text: You must all stir the feelings of Garuda by a chorus of wailing lamentation. In consequence, he will remove our sorrow.
  modern: You must all move Garuda with a chorus of lament. Then he will take away our sorrow.
1.372+1:
  text: With this purpose they sought Garuda.
  modern: With this aim they went to Garuda.
1.372+2:
  text: At just this moment the birds reported to their master, the king of the birds, what sorrow in the separation of loved ones had been wrought by the ocean when he seized the chicks. "O bird divine," they said, "while you gleam in royal radiance, … the ocean has, in overbearing manner, carried away our young.
  modern: The birds told their master, the king of the birds, what grief the ocean had caused by seizing the chicks. "Divine bird," they said, "while you shine in royal splendour, the ocean has arrogantly carried off our young."
1.380+3:
  text: 'While they were thus conferring, Vishnu''s messenger returned and said: "Garuda, Lord Vishnu sends orders that you repair at once to the celestial city."'
  modern: 'While they were talking, Viṣṇu''s messenger came back and said: "Garuḍa, the Lord orders you to go at once to the celestial city."'
1.380+4:
  text: (with 1.380+3)
1.380+5:
  text: (with 1.380+3)
1.380+6:
  text: 'On hearing this, Garuda proudly said to him: "Messenger, what will the master do with so poor a servant as I am?"'
  modern: 'Garuḍa answered proudly: "What can the Lord do with a servant as poor as I am?"'
1.381+3:
  text: 'And Garuda replied: "The ocean, the resting-place of the blessed one, has stolen the eggs of the plover, who is my servant.'
  modern: 'Garuḍa replied: "The ocean, the Lord''s resting-place, has stolen the eggs of Ṭiṭṭibha, my servant.'
1.381+4:
  text: If I do not chastise him, then I am not the servant of the blessed one.
  modern: If I do not punish him, I am not the Lord's servant.
1.381+5:
  text: Make this report to the master."
  modern: Tell the Lord this."
1.381+6:
  text: 'Now when Vishnu learned from the messenger''s lips that Garuda was feigning anger, he thought: "Ah, he is dreadfully angry. I will therefore go in person, will address him, and bring him back with all honor.'
  modern: 'When Viṣṇu heard from the messenger that Garuḍa was only pretending anger, he thought: "He is truly angry. I will go myself, speak to him, and bring him back with all honour."'
1.381+7:
  text: 'For the proverb says:'
  modern: 'As the saying goes:'
'1.382':
  text: 'Shame no servant showing worth,

    Loyalty, and noble birth;

    Pet him ever like a son,

    If you wish your business done.'
  modern: Do not shame a servant who is capable, loyal and of good birth. Treat him always like a son if you want your affairs to prosper.
'1.383':
  text: 'And again:

    Masters, fully satisfied,

    Pay by gratifying pride;

    Servants, for such honor''s pay,

    Gladly throw their lives away.'
  modern: 'And again: masters who are pleased pay with honour. Servants, for such honour, gladly give their lives.'
1.383+1:
  text: Having reached this conclusion, he hastened to Garuda,
  modern: Having decided this, Viṣṇu hurried to Garuḍa.
1.383+2:
  text: 'who, beholding his master a visitor in his own house, modestly gazed on the ground, bowed low, and said: "O blessed one, the ocean, made insolent by his service as your resting-place, has stolen — behold! has stolen the eggs of my servant, and thus brought shame upon me.'
  modern: 'Seeing his lord come into his house, Garuḍa looked modestly at the ground, bowed low and said: "O blessed one, the ocean, made insolent by serving as your resting-place, has stolen the eggs of my servant and so brought shame upon me.'
1.383+3:
  text: From reverence for the blessed one, I have delayed.
  modern: Out of reverence for the blessed one, I have waited.
1.383+4:
  text: But if nothing is done, I myself will this day reduce him to dry land.
  modern: But if nothing is done, I will today reduce him to dry land myself.
1.383+6:
  text: 'For the proverb says:'
  modern: 'As the saying goes:'
'1.384':
  text: 'A loyal servant dies, but shrinks

    From doing deeds of such a kind

    As bring contempt from common men

    And lower him in his master''s mind.'
  modern: A loyal servant would die rather than do a deed that brings contempt from ordinary men and lowers him in his master's eyes.
1.384+1:
  text: 'To this the blessed one replied: "O son of Vinata, your speech is justified."'
  modern: 'The blessed one replied: "Son of Vinatā, you speak rightly."'
1.385+1:
  text: Come, then, so that we may recover the eggs from ocean, may satisfy the plover, and then proceed to the celestial city on the gods' business.
  modern: Come, let us take the eggs back from the ocean, give them to the plover, and then go to the celestial city on the gods' business.
1.385+2:
  text: (with 1.385+1)
1.385+3:
  text: 'To this Garuda agreed, and the blessed one reproached the ocean, then fitted the fire-arrow to his bow and said: "Villain, give the plover his eggs. Else, I will reduce you to dry land."'
  modern: 'Garuḍa agreed. The blessed one rebuked the ocean, fitted a fire-arrow to his bow, and said: "Villain, give the plover his eggs. Or I will reduce you to dry land."'
1.385+4:
  text: (with 1.385+3)
1.385+5:
  text: On hearing this, the ocean, while all his train shook with fright, tremblingly took the eggs and restored them to the plover, as the blessed one directed.
  modern: Hearing this, the ocean trembled, and all his train shook with fright. He took the eggs and gave them back to the plover, as the blessed one ordered.
1.385+7:
  text: 'And that is why I say: He loses fights who fights before His foeman''s power is reckoned, and the rest of it.'
  modern: 'That is why I say: he loses who fights before he knows his enemy''s strength, and so on.'
1.390+1:
  text: Hereupon Victor visited Cheek,
  modern: Then Damanaka went to Karaṭaka.
1.390+2:
  text: 'who asked: "What have you accomplished?"'
  modern: 'Karaṭaka asked: "What have you done?"'
1.390+3:
  text: 'And he replied: "I have already set them at odds with each other."'
  modern: 'He replied: "I have already set them against each other."'
1.394+1:
  text: '"Ah," replied Victor, "you have no comprehension of the devious ways of statesmanship, the basic support of the profession of counselor.'
  modern: 'Damanaka replied: "You do not understand the twisting ways of statecraft, on which the counselor''s calling rests.'
1.397+5:
  text: 'On this point there is a verse:'
  modern: 'On this point there is a verse:'
'1.398':
  text: 'Let your speech like sugar be,

    Steel your heart remorselessly;

    Never draw a doubtful breath:

    Pay for suffered wrongs with death.'
  modern: 'Make your heart a blade and your speech as sweet as cane juice. Do not doubt: strike the one who has wronged you.'
1.398+1:
  text: And another thing. This Lively, even when killed, will provide us with nourishment.
  modern: 'Another point: even when Sañjīvaka is killed, he will feed us.'
1.398+5:
  text: For you know,
  modern: As you know,
'1.399':
  text: 'The wise who wrongs another,

    Pursuing selfish good,

    Should keep his plans a secret,

    As Smart did in the wood.'
  modern: A wise man who harms another for his own gain should keep his plans secret, as Caturaka did in the forest.
1.399+1:
  text: '"How was that?" asked Cheek.'
  modern: 'Karaṭaka asked: "How was that?"'
1.399+2:
  text: And Victor told the story of
  modern: Damanaka told the story of
1.399+3:
  text: In a part of a forest lived a lion named Thunder-Fang, in company with three counselors, a wolf, a jackal, and a camel, whose names were Meat-Face, Smart, and Spike-Ear.
  modern: 'In a forest lived a lion named Vajradaṃṣṭra (Thunder-Fang), with three counselors: a wolf named Kravyamukha (Meat-Face), a jackal named Caturaka (Smart), and a camel named Śaṅkukarṇa (Spike-Ear).'
1.399+4:
  text: (with 1.399+3)
1.399+14:
  text: One day he fought with a furious elephant whose sharp-pointed tusk so tore his body that he withdrew from the world.
  modern: One day he fought a wild, furious elephant, whose tusk tore his body so badly that he could not move.
1.399+15:
  text: (with 1.399+14)
1.399+16:
  text: 'Then, suffering from a seven-day fast, his body lean with hunger, he said to his famished advisers: "Round up some creature in the forest, so that, even in my present condition, I may provide needed nourishment for you."'
  modern: 'Then, after seven days without food and thin with hunger, he said to his starving advisers: "Find some creature in the forest, so that even in this state I can kill it and feed you."'
1.399+17:
  text: The moment he issued his orders, they roamed the wood, but found nothing.
  modern: As soon as he gave the order, they searched the forest, but found nothing.
1.399+18:
  text: 'Thereupon Smart reflected: "If Spike-Ear here were killed, then we should all be nourished for a few days."'
  modern: 'Caturaka thought: "If Śaṅkukarṇa were killed, we would all eat for a few days."'
1.399+19:
  text: However, the master is kept from killing him by friendly feeling.
  modern: But the lion will not kill him, because he is a friend and a dependant.
1.399+20:
  text: In spite of that, my wit will put the master in a frame of mind to kill him.
  modern: Still, I will use my wit to bring the lion to the point of killing him.
1.399+21:
  text: For, indeed,
  modern: Indeed,
'1.400':
  text: 'All understanding may be won,

    All things be slain, and all be done,

    If mortals have sufficient wit;

    For me, I make good use of it.'
  modern: For a wise man nothing is out of reach and nothing cannot be done. So I will use my wit.
1.400+1:
  text: 'After these reflections, he said to Spike-Ear: "Friend Spike-Ear, the master lacks wholesome food, and is starving.'
  modern: 'Having thought this over, he said to Śaṅkukarṇa: "Friend Śaṅkukarṇa, the master has no proper food and is starving.'
1.400+2:
  text: If the master goes, our death is also a certain thing.
  modern: If the lion dies, our own death is certain too.
1.400+3:
  text: So I have a suggestion for your benefit and the master's. Please pay attention.
  modern: So I have a plan for your good and the lion's. Listen.
1.400+4:
  text: (with 1.400+3)
1.400+5:
  text: '"My good fellow," said Spike-Ear, "make haste to inform me, so that I may unhesitatingly do as you say.'
  modern: '"My friend," said Śaṅkukarṇa, "tell me quickly, so that I may do as you say without hesitation."'
1.400+6:
  text: Besides, one earns credit for a hundred good deeds by serving his master."
  modern: Besides, serving his master earns a man credit for a hundred good deeds.
1.400+7:
  text: 'And Smart said: "My good fellow, give your own body at 100 per cent interest, so that you may receive a double body, and the master may prolong his life."'
  modern: 'Caturaka said: "My friend, give your body at 100 per cent interest, so that you receive a double body and the lion lives longer."'
1.400+8:
  text: (with 1.400+7)
1.400+9:
  text: 'On hearing this proposal, Spike-Ear said: "If that is possible, my friend, my body shall be so devoted. Tell the master that this thing should be done.'
  modern: 'Hearing the proposal, Śaṅkukarṇa said: "If that is possible, my friend, I will give myself. Tell the lion to do this."'
1.400+10:
  text: (with 1.400+9)
1.400+11:
  text: I stipulate only that the Death-God be requested to guarantee the bargain."
  modern: But I ask that the Death-God be made the guarantor of the bargain.
1.400+12:
  text: Having made their decision, they all went to visit the lion,
  modern: They made up their minds and all went to the lion.
1.400+13:
  text: 'and Smart said: "O King, we did not find a thing today, and the blessed sun is already near his setting."'
  modern: 'Caturaka said: "O King, we found nothing today, and the blessed sun is already near setting."'
1.400+14:
  text: (with 1.400+13)
1.400+15:
  text: 'Then Smart continued: "O King, our friend Spike-Ear makes this proposal: ''If you call upon the Death-God to guarantee the bargain, and if you render it back with 100 per cent of interest, then I will give my body.''"'
  modern: 'Then Caturaka went on: "O King, our friend Śaṅkukarṇa makes this offer: if you call on the Death-God to guarantee the bargain and repay it with 100 per cent interest, then he will give his body."'
1.400+16:
  text: (with 1.400+15)
1.400+17:
  text: '"My good fellow," answered the lion, "yours is a beautiful act. Let it be as you say."'
  modern: 'The lion answered: "That is a noble act. Let it be as you say."'
1.400+18:
  text: (with 1.400+17)
1.400+19:
  text: On the basis of this pact, Spike-Ear was struck down by the lion's paw, his body was torn by the wolf and the jackal, and he died.
  modern: On the strength of this pact, the lion struck Śaṅkukarṇa down with his paw, and the wolf and the jackal tore his body. He died.
1.400+20:
  text: '"Master, you must go to the river to bathe and worship the gods, while I stay here with Meat-Face to guard the food-supply." On hearing this, the lion went to the river.'
  modern: 'Caturaka said: "Master, go to the river to bathe and worship the gods, while I stay here with Kravyamukha to guard the food." Hearing this, the lion went to the river.'
1.400+21:
  text: 'Then Smart reflected: "How can I get him all to myself to eat?" … When the lion was gone, Smart said to Meat-Face: "Friend Meat-Face, you are starving.'
  modern: 'Caturaka thought: "How can I have this camel all to myself?" When the lion had gone, Caturaka said to Kravyamukha: "Friend Kravyamukha, you are starving.'
1.400+22:
  text: You might eat some of this camel before the old master returns.
  modern: Eat some of this camel before the master comes back.
1.400+23:
  text: I will make your apologies to the master."
  modern: I will make your excuses to him."
1.400+24:
  text: 'So Meat-Face took the hint, but had only taken a taste when Smart cried: "Drop it, Meat-Face. The master is coming."'
  modern: 'Kravyamukha took the hint, but he had hardly tasted it when Caturaka cried: "Drop it, Kravyamukha. The master is coming."'
1.400+25:
  text: (with 1.400+24)
1.400+26:
  text: 'Presently the lion returned, saw that the camel was minus a heart, and wrathfully roared:'
  modern: 'The lion came back, saw that the camel had no heart, and roared in anger:'
1.400+27:
  text: '"Look here! Who turned this camel into leavings? I wish to kill him, too."'
  modern: '"Look here! Who turned this camel into scraps? I will kill him too."'
1.400+28:
  text: 'Then Meat-Face peered into Smart''s visage, as much as to say: "Come, now! Say something, so that he may calm down."'
  modern: 'Kravyamukha looked at Caturaka''s face, as if to say: "Say something, so he calms down."'
1.400+29:
  text: 'But Smart laughed and said: "Come, come! You ate the camel''s heart all by yourself. Why do you look at me?"'
  modern: 'Caturaka laughed and said: "Come, come! You ate the camel''s heart all by yourself. Why do you look at me?"'
1.400+30:
  text: (with 1.400+29)
1.400+31:
  text: And Meat-Face, hearing this, fled for his life, making for another country.
  modern: Hearing this, Kravyamukha fled for his life to another country.
1.400+32:
  text: At this moment, as fate would have it, there came that way a great camel caravan, heavily laden, making a tremendous jingling with the bells tied to the camels' necks.
  modern: At that moment a large camel caravan came along the road, heavily loaded, with bells tied to the camels' necks.
1.400+33:
  text: (with 1.400+32)
1.400+34:
  text: 'When the lion heard the jingle of the bells, loud even in the distance, he said to the jackal: "My good fellow, find out what this horrible noise may be."'
  modern: 'The lion heard the loud bells from far off and said to the jackal: "Find out what this terrible noise is."'
1.400+35:
  text: 'On receiving this commission, Smart advanced a little in the forest, then darted back, and cried in great excitement: "Run, master! Run, if you can run!"'
  modern: 'Caturaka went a little way into the forest, then ran back, crying: "Run, master! Run, if you can!"'
1.400+36:
  text: '"My good fellow," said the lion, "why terrify me so? Tell me what it is."'
  modern: '"My friend," said the lion, "why frighten me so? Tell me what it is."'
1.400+37:
  text: 'And Smart cried: "Master, the Death-God is coming, and he is in a rage against you because you brought untimely death upon his camel, and had him guarantee the bargain.'
  modern: 'Caturaka cried: "Master, the Death-God is coming. He is angry with you because you brought an untimely death upon his camel, and had him guarantee the bargain.'
1.400+38:
  text: (with 1.400+37)
1.400+39:
  text: He intends to make you pay a thousand fold for his camel.
  modern: He means to make you pay a thousand times over for his camel.
1.400+40:
  text: He has immense pride in his camels. He also plans to make inquiries about the father and grandfathers of that one. He is coming. He is near at hand."
  modern: He takes great pride in his camels. He also means to inquire into the father and grandfathers of that camel. He is coming. He is close."
1.400+41:
  text: When the lion heard this, he, too, abandoned the dead camel and scampered for dear life.
  modern: When the lion heard this, he abandoned the dead camel and ran for his life.
1.400+42:
  text: Whereupon Smart ate the camel bit by bit, so that the meat lasted a long time.
  modern: Caturaka ate the camel bit by bit, so that the meat lasted a long time.
1.400+43:
  text: 'And that is why I say: The wise who wrongs another, Pursuing selfish good, .... and the rest of it.'
  modern: 'That is why I say: the wise man who harms another for his own gain ... and so on.'
1.400+44:
  text: 'Now when Victor was gone, Lively reflected:'
  modern: 'When Damanaka had gone, Sañjīvaka thought:'
1.401+1:
  text: '"What am I to do? … My best course is to approach the lion.'
  modern: '"What shall I do? The best course is to go to the lion himself.'
1.401+2:
  text: He might regard me as a suppliant, might even spare my life."
  modern: He may take me as a suppliant and spare my life."
1.401+3:
  text: (with 1.401+2)
1.403+1:
  text: Suppose I go elsewhere, then some other merciless creature will kill me, for this is a wild wood.
  modern: If I go elsewhere, some other cruel creature will kill me, for this is a wild forest.
1.405+1:
  text: 'Having thus set his mind in order, he started very slowly, with troubled spirit, … thinking: "Ah, the unfathomable character of kings! As the proverb says:'
  modern: 'Having made up his mind, he set out very slowly and anxiously, thinking: "Ah, the nature of kings cannot be fathomed! As the saying goes:'
'1.406':
  text: '''Tis a house with serpents crawling,

    Wood with beasts of prey appalling,

    Lotus-pond where blossoms smile

    O''er the lurking crocodile,

    Spot that sneaking rogues deface

    With repeated slanders base —

    Timid servant never learns

    Whither kingly purpose turns.'
  modern: A house with snakes hidden in it, a forest with a fierce lion, a lotus pond with crocodiles, a place where mean slanderers gather. A timid servant never knows which way the king's mind will turn.
1.406+1:
  text: and when he perceived the lion in the posture foretold by Victor, he sank down at some little distance,
  modern: When he saw Piṅgalaka in the posture Damanaka had described, he sat down at a little distance.
1.406+2:
  text: Rusty for his part, perceiving the bull in the attitude predicted by Victor, made a sudden spring at him.
  modern: Piṅgalaka, for his part, saw the bull in the posture Damanaka had described, and sprang at him.
1.406+3:
  text: And Lively, though his body was torn by sharp claws as formidable as thunderbolts, also scored the lion's belly with his horns, contrived to break away from him, and stood in fighting posture, ready to gore again.
  modern: Sañjīvaka, though his back was torn by claws as hard as thunderbolts, gored the lion's belly with his horns, broke free, and stood ready to charge again.
1.406+4:
  text: 'At this point Cheek perceived that both of them, red as dhak trees in blossom, were intent on killing each other, and he said reproachfully to Victor: "You dunderhead! In setting these two at enmity, you have done a wicked deed."'
  modern: 'Karaṭaka saw that both were red like blossoming palāśa trees and bent on killing each other. He reproached Damanaka: "You fool! By setting these two against each other you have done a wicked deed."'
1.406+5:
  text: You have brought trouble and confusion into this entire forest, thus proving your ignorance of the true nature of statecraft.
  modern: You have brought trouble and confusion into this whole forest, which shows that you do not know the true nature of statecraft.
1.406+6:
  text: 'For the saying runs:'
  modern: 'As the saying goes:'
'1.407':
  text: 'Those are counselors indeed,

    Wise in statecraft, who succeed

    In composing reckless strife

    That, unhindered, threatens life:

    Those on petty purpose bent,

    Keen to visit punishment,

    Quick in wrong and folly, bring

    Risk to kingdom and to king.'
  modern: Counselors who are wise in statecraft and settle a reckless quarrel by conciliation are the true ones. Those who chase small gains, who seek punishment, who act wrongly and foolishly, risk the kingdom and the king.
1.407+4:
  text: Ah, poor simpleton! You seek the post of counselor,
  modern: You fool, you seek the post of counselor,
1.407+5:
  text: and are ignorant of the very name of conciliation.
  modern: and you do not even know the name of conciliation.
1.407+6:
  text: Your ambition is vain, since you love harsh measures.
  modern: Your ambition is vain, because you love harsh measures.
1.407+7:
  text: 'As the proverb puts it:'
  modern: 'As the saying goes:'
'1.408':
  text: 'Lord Brahma bids the statesman try

    Conciliation first,

    Postpone or shun (it can be done)

    Harsh deeds, of all deeds worst.'
  modern: Brahmā tells the statesman to try conciliation first and to put off or avoid harsh deeds, the worst of all.
'1.409':
  text: 'And again:

    Try peaceful means, not harsh, to make

    Your quarrel flit:

    Take sugar, not cucumber, for

    A bilious fit.'
  modern: 'And again: settle a quarrel by peaceful means, not harsh ones. For a bilious fit, take sugar, not cucumber.'
'1.410':
  text: 'Men of true discernment, first

    Try conciliation;

    For the victories of peace

    Suffer no frustration.'
  modern: Wise men try conciliation first, for what peace wins is never undone.
'1.411':
  text: '''Tis neither sun nor flashing gem

    Nor fiery spark,

    ''Tis peace, from bitter foemen''s hearts

    That routs the dark.'
  modern: It is not the sun, nor a shining jewel, nor a fiery spark that drives away the dark. It is peace, from the hearts of bitter enemies, that routs it.
1.411+3:
  text: 'Now in the treatises on the subject statesmanship is subsumed under five heads, to wit: proper inception; resources, human and material; determination of place and time; countermeasures for mischance; and successful accomplishment.'
  modern: 'The treatises say statecraft has five parts: a proper beginning; resources, human and material; the right place and time; countermeasures for misfortune; and the successful completion of the task.'
1.411+4:
  text: (with 1.411+3)
1.411+5:
  text: At the present moment, the master finds himself in serious peril.
  modern: Now the master is in serious danger.
1.411+6:
  text: So, if you have any such capacity, devise countermeasures for his mischance.
  modern: So, if you have any such ability, devise a countermeasure for his misfortune.
1.411+7:
  text: For the wisdom of a counselor finds its test in the patching of friendship.
  modern: A counselor's wisdom is tested in mending friendship.
1.411+8:
  text: Ah, you fool! That you cannot do, because you have a perverted mind.
  modern: You fool! You cannot do that, because your mind is twisted.
'1.413':
  text: 'No scamp can further others'' work,

    But can deprave it:

    The mole uproots the mulberry,

    But cannot save it.'
  modern: A rogue cannot help another's work; he can only spoil it. The mole can uproot the mulberry but cannot save it.
1.413+1:
  text: After all, the fault is not yours, but rather the master's, who trusts your words, dull-witted as you are.
  modern: After all, the fault is not yours but the master's, who trusts your words, though you are dull-witted.
1.413+2:
  text: (with 1.413+1)
1.413+3:
  text: (with 1.413+1)
1.413+4:
  text: 'Indeed, there is wisdom in the verse:'
  modern: 'There is wisdom in this verse:'
'1.414':
  text: 'Monarchs who adopt a plan

    From the mean and vicious man,

    Who refuse to tread the way

    That the prudent counsel — they

    Enter misadventure''s cage

    Where the adversaries rage;

    Thence deliverance''s gate

    Crowns an issue rugged, strait.'
  modern: Kings who follow base men, and refuse the path that wise men advise, enter a cage of misfortune. It is hard to get out, and it is closed in on every side.
1.414+1:
  text: Fool! Fool! All the world seeks the service of a master whose retinue is righteous. How, then, can such an evil counselor as you, who, like a beast, understand nothing but destruction — how can such a one enrich the master with righteous companions?
  modern: Fool! Everyone wants to serve a master who has righteous followers. How can an evil counselor like you, who understands nothing but ruin, bring righteous companions to the king?
1.414+2:
  text: 'For the proverb says:'
  modern: 'As the saying goes:'
'1.415':
  text: 'Monarchs, ill-advised, repel,

    Even though they purpose well:

    Sweet and placid waters smile,

    But beware the crocodile.'
  modern: Kings who are ill-advised push away good counsel, even when they mean well. Clear, sweet water looks inviting, but beware the crocodile.
1.415+2:
  text: 'Yes, there is wisdom in this:'
  modern: 'Yes, there is wisdom in this:'
'1.416':
  text: 'If kings are satisfied

    With servants at their side

    Who ply a wheedling tongue,

    Whose bows are never strung,

    Then kingly glory goes

    Embracing manlier foes.'
  modern: If kings are content with servants who flatter with honeyed words and never bend a bow, their glory passes to braver enemies.
1.416+3:
  text: 'As the saying goes:'
  modern: 'As the saying goes:'
'1.417':
  text: 'No knife prevails against a stone;

    Nor bends the unbending tree;

    No good advice from Needle-Face

    Helped indocility.'
  modern: Wood that will not bend cannot be bent, and a razor does nothing to stone. Needle-Face's advice never helped the stubborn.
1.417+1:
  text: '"How was that?" asked Victor.'
  modern: 'Damanaka asked: "How was that?"'
1.417+2:
  text: And Cheek told the story of
  modern: Karaṭaka told the story of
1.417+3:
  text: In a part of a forest was a troop of monkeys who found a firefly one winter evening when they were dreadfully depressed.
  modern: In a forest there was a troop of monkeys. One winter evening they were miserable with cold.
1.417+4:
  text: (with 1.417+3)
1.417+5:
  text: On examining the insect, they believed it to be fire, so lifted it with care, covered it with dry grass and leaves, thrust forward their arms, sides, stomachs, and chests, scratched themselves, and enjoyed imagining that they were warm. One of the arboreal creatures in particular, being especially chilly, blew repeatedly and with concentrated attention on the firefly.
  modern: They took the insect for fire. They lifted it carefully, covered it with dry grass and leaves, held out their arms, sides and chests to it, and imagined that they were warm. One monkey, colder than the rest, kept blowing hard on the firefly.
1.417+6:
  text: 'Thereupon a bird named Needle-Face, driven by hostile fate to her own destruction, flew down from her tree and said to the monkey:'
  modern: 'Then a bird named Needle-Face, driven by fate to her own destruction, flew down from her tree and said to a monkey:'
1.417+7:
  text: '"My dear sir, do not put yourself to unnecessary trouble. This is not fire. This is a firefly."'
  modern: '"Friend, do not trouble yourself for nothing. This is not fire. It is a firefly."'
1.417+8:
  text: (with 1.417+7)
1.419+1:
  text: To cut a long story short, when she vexed him by coming close and shouting in his ear, he seized her and dashed her on a rock, crushing face, eyes, head, and neck so that she died.
  modern: In short, when she annoyed him by coming close and shouting in his ear, he seized her, dashed her on a rock, and crushed her face, eyes, head and neck. She died.
1.419+2:
  text: 'And that is why I say: No knife prevails against a stone; .... and the rest of it.'
  modern: 'That is why I say: No knife prevails against a stone ... and so on.'
1.424+7:
  text: For, after all,
  modern: After all,
'1.425':
  text: 'Educating minds unfit

    Cannot rescue sluggish wit,

    Just as house-lamps wasted are,

    Set within a covered jar.'
  modern: Teaching minds that are unfit cannot rescue dull wits, just as lamps set inside a covered jar give no light.
1.425+2:
  text: Plainly, you are what is known as 'worse-born.'
  modern: Plainly, you are what is called worse-born.
1.425+3:
  text: 'The technical explanation runs:'
  modern: 'The technical explanation runs:'
'1.426':
  text: 'Sons of four divergent kinds

    Are discerned by well-trained minds:

    ''Born,'' and ''like-born,'' ''better-born'';

    Lastly, ''worse-born'' has their scorn.

    ''Born'' the mother''s image gives;

    ''Like-born'' like the father lives;

    ''Better-born'' more nobly acts;

    ''Worse-born'' morally subtracts.'
  modern: 'A son is of one of four kinds, as the learned know: born, like-born, better-born, or worse-born. A born son takes his mother''s likeness, a like-born son his father''s, a better-born son acts more nobly, and a worse-born son falls below them all.'
'1.427':
  text: (with 1.426)
1.428+1:
  text: 'Yes, there is sense in the story:'
  modern: 'There is sense in the story:'
'1.429':
  text: 'Right-Mind was one, and Wrong-Mind two;

    I know the tale by heart:

    The son in smoke made father choke

    By being supersmart.'
  modern: 'Right-Mind and Wrong-Mind were two friends. I know the tale well: a clever son, by his foolish cleverness, choked his father with smoke.'
1.429+1:
  text: '"How was that?" asked Victor.'
  modern: 'Damanaka asked: "How was that?"'
1.429+2:
  text: And Cheek told the story of
  modern: Karaṭaka told the story of
1.429+3:
  text: In a certain city lived two friends, sons of merchants, and their names were Right-Mind and Wrong-Mind.
  modern: 'In a certain city lived two friends, sons of merchants: Dharmabuddhi (Right-Mind) and Pāpabuddhi (Wrong-Mind).'
1.431+1:
  text: These two traveled to another country far away in order to earn money.
  modern: The two went to a distant country to earn money.
1.431+3:
  text: They decided to go home, since their object was attained. So they returned together.
  modern: They decided to go home, since their aim was reached. So they went back together.
1.432+1:
  text: 'When they drew near their native city, … Wrong-Mind, with a sneaking thought of his own advantage, said to the other: "My good friend,'
  modern: 'When they came near their own city, Pāpabuddhi, secretly thinking of his own gain, said to Dharmabuddhi: "My friend,'
1.432+3:
  text: Let us each take a hundred dinars, and go to our homes after burying the remainder.
  modern: Let each of us take a hundred dinars, and bury the rest before we go home."
1.434+1:
  text: Now Right-Mind, in the nobility of his nature, did not comprehend the hidden duplicity of his friend, and agreed to the proposal.
  modern: Dharmabuddhi, being noble, did not see his friend's treachery, and agreed.
1.434+2:
  text: Each then took a certain sum of money. They carefully hid the residue in the ground, and made their entrance into the city.
  modern: Each took some money. They hid the rest carefully in the ground and entered the city.
1.434+3:
  text: … he went alone, removed the treasure, and leveled the ground.
  modern: Pāpabuddhi went alone, dug up the treasure, and levelled the ground.
1.434+4:
  text: 'A mere month later, he took the initiative, going to Right-Mind and saying: "My good friend, let us divide the rest of the money equally."'
  modern: 'A month later, he went to Dharmabuddhi and said: "Friend, let us divide the rest of the money equally."'
1.434+5:
  text: (with 1.434+4)
1.434+7:
  text: So he and Right-Mind visited the spot and began to dig. When the excavation failed to reveal any treasure,
  modern: He and Dharmabuddhi went to the spot and dug, but found no treasure.
1.434+8:
  text: 'that impudent Wrong-Mind first of all smote his own head with the empty pot, then shouted: "What became of that good lucre? Surely, Right-Mind, you must have stolen it.'
  modern: 'The shameless Pāpabuddhi first struck his own head with the empty pot, then shouted: "Where has that good money gone? Surely, Dharmabuddhi, you stole it.'
1.434+10:
  text: Give me my half.
  modern: Give me my half.
1.434+11:
  text: If you don't, I will bring you into court."
  modern: If you don't, I will bring you into court.
1.434+12:
  text: '"Be silent, villain!" said the other.'
  modern: '"Be quiet, villain!" said Dharmabuddhi.'
1.434+13:
  text: '"My name is Right-Mind.'
  modern: '"My name is Dharmabuddhi.'
1.434+14:
  text: Such thefts are not in my line.
  modern: Theft is not my way.
1.434+15:
  text: 'You know the verse:'
  modern: 'You know the verse:'
'1.435':
  text: 'A man right-minded sees but trash,

    Mere clods of earth, in others'' cash;

    A mother in his neighbor''s wife;

    In all that lives, his own dear life.'
  modern: A man of right mind sees another's wealth as mere clods of earth, another's wife as a mother, and all living things as himself.
1.435+1:
  text: So together they carried their dispute to court and related the theft of the money.
  modern: So they took their quarrel to court and told the judges about the theft.
1.435+2:
  text: 'And when the magistrates learned the facts, they decreed an ordeal for each. But Wrong-Mind said: "Come! This judgment is not proper.'
  modern: 'When the judges heard the facts, they ordered an ordeal for each. But Pāpabuddhi said: "This judgment is not proper.'
1.435+3:
  text: 'For the legal dictum runs:'
  modern: 'The law says:'
'1.436':
  text: 'Best evidence is written word;

    Next, witnesses who saw and heard;

    Then only let ordeals prevail

    When witnesses completely fail.'
  modern: First comes written evidence, then witnesses who saw and heard. Ordeals should be used only when witnesses fail.
1.436+1:
  text: In the present case, I have a witness, the goddess of the wood. She will reveal to you which one of us is guilty, which not guilty.
  modern: In this case I have a witness, the goddess of the wood. She will say which of us is guilty and which is not.
1.436+2:
  text: (with 1.436+1)
1.436+3:
  text: 'And they replied: "You are quite right, sir."'
  modern: 'The judges replied: "You are quite right."'
1.436+4:
  text: 'For there is a further saying:'
  modern: 'There is a further saying:'
'1.437':
  text: 'To meanest witnesses, ordeals

    Should never be preferred;

    Of course much less, if you possess

    A forest goddess'' word.'
  modern: Even a lowly witness outweighs an ordeal. How much more the word of a forest goddess.
1.437+1:
  text: Now we also feel a great interest in the case.
  modern: We too are very interested in this case.
1.437+2:
  text: You two must accompany us tomorrow morning to that part of the forest.
  modern: Both of you must come with us tomorrow morning to that part of the forest.
1.437+3:
  text: Then Wrong-Mind went home and asked his father's help. "Father dear," said he, "the dinars are in my hand."
  modern: Then Pāpabuddhi went home and asked his father for help. "Father," he said, "the money is in my hands."
1.437+4:
  text: They only require one little word from you.
  modern: They need only one word from you.
1.437+7:
  text: This very night I am going to hide you out of sight in a hole in the mimosa tree that grows near the spot where I dug out the treasure before.
  modern: Tonight I will hide you in a hole in the śamī tree near the spot where I dug up the treasure.
1.437+8:
  text: (with 1.437+7)
1.437+9:
  text: (with 1.437+7)
1.437+10:
  text: In the morning you must be my witness in the presence of the magistrates."
  modern: In the morning you must be my witness before the judges.
1.437+11:
  text: 'When morning came, the scamp took a bath, put on clean garments, and followed Right-Mind and the magistrates to the mimosa tree, where he cried in piercing tones:'
  modern: 'In the morning Pāpabuddhi bathed, put on clean clothes, and went with Dharmabuddhi and the judges to the śamī tree, where he cried out:'
1.437+12:
  text: 'Earth, heaven, and death, the feeling mind,

    Sun, moon, and water, fire and wind,

    Both twilights, justice, day and night

    Discern man''s conduct, wrong or right.'
  modern: 'Earth, heaven, death, the mind, sun, moon, water, fire, wind, both twilights, justice, day and night: they know a man''s conduct, right or wrong.'
1.437+13:
  text: (with 1.437+12)
'1.438':
  text: (with 1.437+12)
1.438+1:
  text: O blessed goddess of the wood, which of us two is the thief? Speak.
  modern: Blessed goddess of the wood, which of us is the thief? Speak.
1.438+2:
  text: 'Then Wrong-Mind''s father spoke from his hole in the mimosa: "Gentlemen, Right-Mind took that money."'
  modern: 'Then Pāpabuddhi''s father spoke from the hole in the śamī tree: "Gentlemen, Dharmabuddhi took that money."'
1.438+3:
  text: And when all the king's men heard this statement, their eyes blossomed with astonishment, and they searched their minds to discover the appropriate legal penalty for stealing money, in order to visit it on Right-Mind. Meanwhile Right-Mind heaped inflammable matter about the hole in the mimosa and set fire to it.
  modern: The king's men were astonished, and searched for the right legal penalty for theft, to visit on Dharmabuddhi. Meanwhile Dharmabuddhi heaped inflammable matter about the hole in the śamī tree and set it on fire.
1.438+4:
  text: As the mimosa burned, Wrong-Mind's father issued from the hole with a pitiful wail, his body scorched and his eyes popping out.
  modern: As the tree burned, Pāpabuddhi's father came out of the hole, wailing, his body scorched and his eyes bulging.
1.438+5:
  text: 'And they all asked: "Why, sir! What does this mean?"'
  modern: 'They all asked: "Sir, what does this mean?"'
1.438+6:
  text: '"It is all Wrong-Mind''s doing," he replied.'
  modern: '"It is all Pāpabuddhi''s doing," he replied.'
1.438+7:
  text: Whereupon the king's men hanged Wrong-Mind to a branch of the mimosa, while they commended Right-Mind and caused him satisfaction by conferring upon him the king's favor and other things.
  modern: The king's men hanged Pāpabuddhi from a branch of the śamī tree and praised Dharmabuddhi, giving him the king's favour and other rewards.
'1.439':
  text: 'There is wisdom in the old story:

    The good and bad of given schemes

    Wise thought must first reveal:

    The stupid heron saw his chicks

    Provide a mungoose meal.'
  modern: A wise man must weigh both the good and the danger of a plan. The foolish heron watched his chicks eaten by mongooses.
1.439+1:
  text: '"How was that?" asked Wrong-Mind.'
  modern: '"How was that?" asked Pāpabuddhi.'
1.439+2:
  text: And his father told the story of
  modern: His father told the story of
1.439+3:
  text: A flock of herons once had their nests on a fig tree in a part of a forest.
  modern: A flock of herons once had their nests in a fig tree in a forest.
1.439+4:
