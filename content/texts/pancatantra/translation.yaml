  modern: This is sure to be full of meat and fat."
  ryder: Book I, The Jackal and the War-Drum, p. 42
1.118+6:
  text: Having come to this conclusion, he picked a spot, gnawed a hole, and crept in.
  modern: Having decided this, he chose a spot, gnawed a hole, and crept in.
  ryder: Book I, The Jackal and the War-Drum, p. 42
1.118+8:
  text: 'But he was disappointed to find it pure wood and skin, and recited a stanza:'
  modern: 'But he was disappointed to find only wood and skin, and he recited a verse:'
  ryder: Book I, The Jackal and the War-Drum, p. 42
1.118+9:
  text: '"And that is why I say that one should not be troubled by a mere sound."'
  modern: '"That is why I say one should not be troubled by a mere sound."'
  ryder: Book I, frame, p. 42
1.118+10:
  text: '"But," said Rusty, "these retainers of mine are terrified and wish to run away."'
  modern: 'Piṅgalaka said: "My followers are terrified and want to run away."'
1.118+11:
  text: So how am I to reinforce my resolution?
  modern: How, then, can I keep my courage up?
1.118+12:
  text: 'And Victor answered: "Master, they are not to blame.'
  modern: 'Damanaka said: "My lord, this is not their fault."'
1.118+13:
  text: For servants take after the master.
  modern: Servants are just like their master.
1.118+14:
  text: 'You know the proverb:'
  modern: 'You know the saying:'
'1.119':
  text: 'In case of horse or book or sword,

    Of woman, man or lute or word,

    The use or uselessness depends

    On qualities the user lends.'
  modern: 'Horse, sword, book, woman, man, lute or word: each is useful or useless according to the one who has it.'
1.119+1:
  text: Then summon your manhood and remain on this spot until I return, having ascertained the nature of the creature.
  modern: So summon your courage and wait here until I come back, after I have learned what this sound is.
1.119+2:
  text: Then act as seems proper.
  modern: After that, do what is right.
1.119+3:
  text: '"What!" said Rusty, "are you plucky enough to go there?"'
  modern: 'Piṅgalaka said: "Do you dare to go there?"'
1.119+4:
  text: 'And Victor answered: "When the master commands, is there any difference between ''possible'' and ''impossible'' to the good servant?'
  modern: 'Damanaka said: "When the master gives an order, a good servant does not tell the possible from the impossible."'
1.119+5:
  text: 'As the proverb says:'
  modern: 'As the saying goes:'
'1.120':
  text: 'Good servants, when their lords command,

    Behold no fear on any hand,

    Cross pathless seas if he desire

    Or gladly enter flaming fire.'
  modern: At the master's command, a good servant fears nothing. He will cross a trackless sea or walk into fire.
'1.121':
  text: 'The servant who, his lord commanding,

    Should strive to reach an understanding

    On labors hard or easy, he

    King''s counselor should never be.'
  modern: A servant who weighs whether his master's order is hard or easy should never be a king's counselor.
1.121+1:
  text: '"If you feel so, my dear fellow," said Rusty, "then go.'
  modern: 'Piṅgalaka said: "Good. If that is how you feel, then go.'
1.121+2:
  text: Blest be your journeyings.
  modern: May your road be safe.
1.121+3:
  text: So Victor bowed low and set out in the direction of the sound made by Lively.
  modern: Damanaka bowed and set out toward the sound made by Saṃjīvaka.
1.121+4:
  text: 'And when he was gone, terror troubled Rusty''s heart, so that he thought: "Ah, I made a sad mistake in trusting him to the point of revealing what is in my mind.'
  modern: 'When Damanaka had gone, fear filled Piṅgalaka. He thought: "I have made a mistake. I trusted him and told him what I really intended."'
1.121+5:
  text: (with 1.121+4)
1.121+6:
  text: Perhaps this Victor will betray me by taking wages from both parties, or from spite at losing his job.
  modern: Perhaps Damanaka will betray me. He may take pay from both sides, or he may bear a grudge because he lost his post.
1.121+7:
  text: 'For the proverb says:'
  modern: 'For the saying goes:'
'1.122':
  text: 'A servant suffering from a king

    Dishonor after honoring,

    Though born and trained to service, will

    Be eager to destroy him still.'
  modern: A servant who is shamed by a king after being honored will try to destroy him, even if he was born and trained to serve.
1.122+1:
  text: So I will go elsewhere and wait, in order to learn his purpose.
  modern: So I will go somewhere else and wait, to learn what he intends.
1.122+2:
  text: Perhaps Victor might even bring the thing along and try to kill me.
  modern: Perhaps Damanaka will bring him and try to kill me.
1.122+3:
  text: 'As the saying goes:'
  modern: 'As the saying goes:'
'1.123':
  text: 'The trustful strong are caught

    By weaker foes with ease;

    The wary weak are safe

    From strongest enemies.'
  modern: The weak who do not trust are not caught by the strong. The strong who trust are caught even by the weak.
1.126+1:
  text: Thus he set his mind in order, went elsewhere, and waited all alone, spying on Victor's procedure.
  modern: So he made up his mind, went somewhere else, and waited alone, watching what Damanaka did.
1.126+2:
  text: 'Meanwhile Victor drew near to Lively, discovered that he was a bull, and reflected gleefully: "Well, well! This is lucky.'
  modern: 'Damanaka went to Saṃjīvaka, saw that he was a bull, and was delighted. He thought: "Well, well! This is lucky."'
1.126+3:
  text: I shall get Rusty into my power by 'dangling before him war or peace with this fellow.
  modern: Through this bull I will bring Piṅgalaka under my control, by dangling peace or war with him before the lion.
1.126+4:
  text: 'As the proverb puts it:'
  modern: 'As the proverb puts it:'
'1.128':
  text: 'All counselors draw profit from

    A king in worries pent,

    And that is why they always wish

    For him, embarrassment.'
  modern: A king who is always in trouble is useful to his ministers. That is why they want him to stay in trouble.
'1.129':
  text: 'As men in health require no drug

    Their vigor to restore,

    So kings, relieved of worry, seek

    Their counselors no more.'
  modern: Just as a healthy man does not want a doctor, a king free of trouble does not want ministers.
1.129+1:
  text: With these thoughts in mind, he returned to meet Rusty.
  modern: Thinking this, he went back to Piṅgalaka.
1.129+2:
  text: 'And Rusty, seeing him coming, assumed his former attitude in an effort to put a good face on the matter. So when Victor had come near, had bowed low, and had seated himself, Rusty said:'
  modern: Piṅgalaka saw him coming and kept his usual manner, as if nothing had happened. When Damanaka came near, bowed and sat down, Piṅgalaka spoke.
1.129+3:
  text: '"My good fellow, did you see the creature?"'
  modern: 'Piṅgalaka said: "Did you see the creature?"'
1.129+4:
  text: '"I saw him," said Victor, "through my master''s grace."'
  modern: 'Damanaka said: "I saw him, by the grace of my lord."'
1.129+5:
  text: '"Are you telling the truth?" asked Rusty.'
  modern: 'Piṅgalaka said: "Is it true?"'
1.129+6:
  text: 'And Victor answered: "How could I report anything else to my gracious master?'
  modern: 'Damanaka said: "How could I tell my gracious lord anything but the truth?"'
1.129+7:
  text: 'For the proverb says:'
  modern: 'For the saying goes:'
'1.130':
  text: 'Whoever makes before a king

    Small statements, but untrue,

    Brings certain ruin on his gods

    And on his teacher, too.'
  modern: Whoever tells a king even a small lie is quickly ruined, however great he is, and so are his gods and his teacher.
'1.131':
  text: 'The king incarnates all the gods,

    So sing the sages old;

    Then treat him like the gods: to him

    Let nothing false be told.'
  modern: The king is made of all the gods, as Manu says. So treat him as a god, and never tell him a lie.
'1.132':
  text: 'The king incarnates all the gods,

    Yet with a difference:

    He pays for good or ill at once;

    The gods, a lifetime hence.'
  modern: The king is like all the gods, but with one difference. He repays good or evil at once. The gods repay it in a later life.
1.132+1:
  text: '"Yes," said Rusty, "I suppose you really did see him.'
  modern: 'Piṅgalaka said: "I suppose you really did see him.'
1.132+2:
  text: The great do not become angry with the mean.
  modern: The great do not get angry with the lowly.
1.132+3:
  text: 'As the proverb says:'
  modern: 'As the saying goes:'
'1.133':
  text: 'The hurricane innocuous passes

    O''er feeble, lowly bending grasses,

    But tears at lofty trees: the great

    Their prowess greatly demonstrate.'
  modern: The wind does not uproot the soft grass that bends low. It is the nature of the high-minded to show their power only against the great.
1.134+3:
  text: 'And Victor replied: " … I will bring the creature into my gracious master''s presence."'
  modern: 'Damanaka said: "I will bring the creature before my lord."'
1.135+3:
  text: 'Meanwhile Victor returned and called reproachfully to Lively: "Come here, you villainous bull! Come here!'
  modern: 'Damanaka came back and called sharply to Saṃjīvaka: "Come here, you wicked bull! Come here!'
1.135+4:
  text: Our master Rusty asks why you are not afraid to keep up this meaningless bellowing.
  modern: Our lord Piṅgalaka asks why you are not afraid to keep up this pointless bellowing.
1.135+5:
  text: (with 1.135+4)
1.135+6:
  text: '"My good fellow, who is this person named Rusty?"'
  modern: 'Saṃjīvaka said: "Good sir, who is this Piṅgalaka?"'
1.135+7:
  text: '"What!" said Victor, "you do not even know our master Rusty?"'
  modern: 'Damanaka said: "You do not even know our lord Piṅgalaka?"'
1.135+8:
  text: 'And he continued with indignation: "The consequences will teach you.'
  modern: 'He said angrily: "You will learn from what happens.'
1.135+9:
  text: He has a retinue of all kinds of animals. He dwells beside the spreading banyan tree. His heart is high with pride. He is lord of life and wealth. His name is Rusty. He is a mighty lion.
  modern: He has a retinue of all kinds of animals. He lives under the spreading banyan tree. He is proud. He is lord of life and wealth. His name is Piṅgalaka, and he is a mighty lion.
1.135+10:
  text: 'When Lively heard this, he thought himself as good as dead, and he fell into deep dejection, saying:'
  modern: 'When Saṃjīvaka heard this, he thought he was as good as dead. He fell into deep despair and said:'
1.135+11:
  text: '"My dear fellow, you appear to be sympathetic and eloquent.'
  modern: '"Good sir, you seem kind and well spoken.'
1.135+12:
  text: So if you cannot avoid conducting me there, pray cause the master to grant me a gracious safe-conduct.
  modern: So if you must take me there, please get my lord to give me a safe-conduct.
1.135+13:
  text: '"You are quite right," said Victor.'
  modern: 'Damanaka said: "You are right."'
1.135+14:
  text: Your request shows savoirfaire. For
  modern: Your request shows good sense. For
'1.136':
  text: 'The earth has a limit,

    The mountains, the sea;

    The deep thoughts of kings are

    Without boundary.'
  modern: The earth has limits, and so do the mountains and the sea. But a king's thoughts have no limit, and no one can fully know them.
1.136+1:
  text: Do you then remain in this spot. Later, when I have held him to an agreement, I will conduct you to him.
  modern: So stay here. Later, when I have bound him to an agreement, I will bring you to him.
1.136+2:
  text: 'Then Victor returned to Rusty and said: "Master, he is no ordinary creature.'
  modern: 'Then Damanaka went back to Piṅgalaka and said: "My lord, he is no ordinary creature.'
1.136+3:
  text: He has served as the vehicle of blessed Shiva.
  modern: He has been the vehicle of the blessed Maheśvara, the bull.
1.136+4:
  text: 'And when I questioned him, he said:'
  modern: 'When I asked him, he said:'
1.136+5:
  text: '''Great Shiva was satisfied with me and bade me crop the grass beside the Jumna.'
  modern: '"Maheśvara was pleased with me and told me to graze the grass by the Yamunā.'
1.136+6:
  text: Why make a long story of it? The blessed one has given me this forest as a playground.'"
  modern: In short, the blessed one has given me this forest to play in."
1.136+7:
  text: 'At this Rusty was frightened, and he said: "I knew it, I knew it.'
  modern: 'Piṅgalaka was frightened and said: "I knew it. I knew it.'
1.136+8:
  text: Only by special favor of the gods do creatures wander in a wild wood, bellowing like that, and fearlessly cropping the grass.
  modern: Without the favor of the gods, grass-eating creatures would not wander fearlessly in a wild wood full of beasts like this.
1.136+9:
  text: But what did you say?
  modern: Then what did you say?
1.136+10:
  text: '"Master," said Victor, "I said: This forest is the domain of Rusty, vehicle of Shiva''s passionate wife.'
  modern: 'Damanaka said: "My lord, I said: This forest belongs to Piṅgalaka, the vehicle of Caṇḍikā.'
1.136+11:
  text: Hence you come as a guest.
  modern: So you have come here as a dear guest.
1.136+12:
  text: You must meet him, must spend your time in brotherly love, must eat, drink, work, play, and make your home with him.
  modern: Go to him, and spend your time with him as a brother. Eat, drink, play and live with him in one place.
1.136+13:
  text: 'All this he promised, adding:'
  modern: 'He agreed to all of this, and added:'
1.136+14:
  text: '"You must make your master grant me a safe-conduct.'
  modern: '"Make your master give me a safe-conduct.'
1.136+15:
  text: As to that, the master is the sole judge."
  modern: The master alone decides that."
1.136+16:
  text: 'At this Rusty was delighted and said: "Splendid, my intelligent servant, splendid!'
  modern: 'Piṅgalaka was delighted and said: "Excellent, my clever servant, excellent!'
1.136+17:
  text: (with 1.136+16)
1.136+18:
  text: You must have taken counsel with my own heart before speaking.
  modern: You must have consulted my own heart before you spoke.
1.136+19:
  text: I grant him a safe-conduct.
  modern: I give him a safe-conduct.
1.136+20:
  text: You must hasten to conduct him here, but not until he too has bound himself by oath toward me.
  modern: Bring him here quickly, but only after he has bound himself to me by an oath.
1.136+21:
  text: 'Yes, there is sound sense in the saying:'
  modern: 'Well said. There is a sound saying:'
'1.137':
  text: 'Polished, fully tested,

    Sturdy too, and straight

    Are the pillars proper

    To a house — or state.'
  modern: A kingdom is held up by ministers who are sound, straight, faultless and well tested, as a house is held up by strong pillars.
'1.138':
  text: 'Wit is shown in hours of crisis:

    Doctors'' wit, in sore disease;

    Counselors'', in patching friendship —

    All are wise in hours of ease.'
  modern: Wisdom shows in a crisis. A doctor shows it in a serious illness, a minister in mending a broken friendship. Anyone is wise when all is well.
1.138+1:
  text: 'Now Victor thought, as he set out to meet Lively: "Well, well! The master is gracious to me and ready to do my bidding.'
  modern: 'Damanaka set out to meet Saṃjīvaka, glad, and thought: "Well, well! My lord is kind to me and does what I say.'
1.138+2:
  text: So there is none more blest than I.
  modern: No one is more blessed than I am.
1.138+3:
  text: For
  modern: For
'1.139':
  text: 'Four things are nectar: milky food;

    A fire in chilly weather;

    An honor granted by the king;

    And loved ones, come together.'
  modern: 'Four things are like nectar: milk food, a fire in cold weather, honor from the king, and the company of loved ones.'
1.139+1:
  text: 'So he found Lively, and said respectfully: "My friend, I won the old master''s favor for you, and made him give you a safe-conduct.'
  modern: 'Damanaka went to Saṃjīvaka, spoke respectfully, and said: "My friend, I asked the old master to favor you, and he gave you a safe-conduct.'
1.139+2:
  text: You may go without anxiety.
  modern: Go without worry.
1.139+3:
  text: Still, though you have favor in the eyes of the king, you must act in agreement with me.
  modern: Still, though the king is kind to you, you must act in agreement with me.
1.139+4:
  text: You must not play the haughty master.
  modern: You must not act like a proud master.
1.139+5:
  text: I for my part, in alliance with you, will take the role of counselor, and bear the whole burden of administration.
  modern: For my part, I will act with you as the counselor and carry the whole burden of government.
1.139+6:
  text: Thus we shall both enjoy royal affluence.
  modern: So we will both enjoy royal wealth.
1.139+7:
  text: For
  modern: For
'1.140':
  text: 'A sinful chase — yet men can stalk

    The treasures of the crown:

    One starts the quarry from its lair;

    Another strikes it down.'
  modern: 'Men win wealth by the sinful work of hunting: one starts the deer from its lair, and another kills it.'
'1.141':
  text: 'Whoever is too haughty to

    Pay king''s retainers honor due,

    Will find his feet are tottering —

    So merchant Strong-Tooth with the king.'
  modern: Whoever is too proud to honor the king's attendants will lose his footing, as the merchant Dantila did with the king.
1.141+1:
  text: '"How was that?" asked Lively. And Victor told the story of'
  modern: 'Saṃjīvaka said: "How so?" Damanaka told the story of'
1.141+2:
  text: There is a city called Growing City on the earth's surface.
  modern: On this earth there is a city called Vardhamāna (Growing City).
1.141+3:
  text: In it lived a merchant named Strong-Tooth who directed the whole administration.
  modern: There lived a merchant named Dantila (Strong-Tooth), who ran the whole city administration.
1.141+4:
  text: So long as he handled city business and royal business, all the inhabitants were satisfied.
  modern: He handled city and royal business, and kept the townspeople and the king content.
1.141+5:
  text: Why spin it out? Nobody ever saw or heard of his like for cleverness.
  modern: In short, no one so clever was ever seen or heard of.
1.141+6:
  text: 'For there is much wisdom in the proverb:'
  modern: 'There is much wisdom in the saying:'
'1.142':
  text: 'Suppose he minds the king''s affairs,

    The common people hate him;

    And if he plays the democrat,

    The prince will execrate him:

    So, since the struggling interests

    Are wholly contradictory,

    A manager is hard to find

    Who gives them both the victory.'
  modern: A man who serves the king is hated by the people. A man who serves the people is dropped by the king. When these great interests clash, a man who serves both is hard to find.
1.142+1:
  text: While he occupied this position, he once had a daughter married.
  modern: Time passed, and once Dantila married off a daughter.
1.142+2:
  text: To the wedding he invited all the townspeople and the king's entourage, paid them much honor, feasted them, and regaled them with gifts of garments and the like.
  modern: He invited all the townspeople and the king's courtiers to the wedding, honored them, fed them, and gave them cloth and other gifts.
1.142+3:
  text: And when the wedding was over, he conducted the king home with his ladies and showed him reverence.
  modern: When the wedding was over, he brought the king and the royal women to his house and honored them.
1.142+4:
  text: Now the king had a house-cleaning drudge named Bull, who took a seat that did not belong to him … So Strong-Tooth administered a cuffing and drove him out.
  modern: The king had a sweeper named Gorambha (Bull), who sat in a place that was not his. Dantila struck him and drove him out.
1.142+5:
  text: From that moment the humiliation so rankled in Bull's inner soul that he had no rest even at night.
  modern: From then on, Gorambha sighed over the insult and could not sleep, even at night.
1.142+7:
  text: 'Yet he thought: "After all, why should I grow thin? It does me no good.'
  modern: 'But he thought: "Why should I waste away? It does no good.'
1.142+8:
  text: For I cannot possibly hurt him.
  modern: I cannot do anything to harm him.
1.142+9:
  text: 'And there is sense in the saying:'
  modern: 'And there is good sense in the saying:'
'1.143':
  text: 'Indulge no angry, shameless wish

    To hurt, unless you can:

    The chick-pea, hopping up and down,

    Will crack no frying-pan.'
  modern: Do not wish, in anger and without shame, to hurt one you cannot hurt. A chickpea hopping in the air cannot break a frying pan.
1.143+1:
  text: 'Now one morning, as he was sweeping near the bed where the king lay half awake, he said: "What impudence! Strong-Tooth kisses the queen.'
  modern: 'One morning, as he swept near the bed where the king lay half awake, Gorambha said: "What insolence! Dantila kisses the queen!'
1.143+2:
  text: 'When the king heard this, he jumped up in a hurry, crying: "Come, come, Bull!'
  modern: 'The king heard this, sprang up in alarm, and cried: "Come, Bull!'
1.143+3:
  text: Is that thing true that you were muttering?
  modern: Is it true, what you were muttering?
1.143+4:
  text: Has the queen been kissed by Strong-Tooth?"
  modern: Has Dantila kissed the queen?"
1.143+5:
  text: '"O King," answered Bull, "I was awake all night because I am passionately fond of gambling. So sleep overpowered me even when I was busy with my sweeping.'
  modern: '"O King," Gorambha answered, "I was awake all night because I love gambling. Sleep overpowered me while I was sweeping.'
1.143+6:
  text: I do not know what I said."
  modern: I do not know what I said."
1.143+7:
  text: 'But the jealous king thought: "Yes, he has free entrance to my palace. So has Strong-Tooth.'
  modern: 'But the jealous king thought: "Yes, he has free access to my palace. So does Dantila.'
1.143+8:
  text: Perhaps he actually saw the fellow hugging the queen.
  modern: Perhaps he really saw the queen being embraced by him.
1.143+10:
  text: 'For the proverb says:'
  modern: 'For the saying goes:'
'1.144':
  text: 'Whate''er a man desires, sees, does

    In broad daylight,

    Still mindful, he will say or do

    Asleep at night.'
  modern: Whatever a man wants, sees or does by day, he will say or do in his sleep, because he has dwelt on it.
'1.145':
  text: 'Whatever secrets, good or ill,

    Men in their bosoms keep,

    Are soon betrayed when they are drunk

    Or talking in their sleep.'
  modern: Whatever secret a man keeps in his heart, good or bad, is soon known when he is drunk or talks in his sleep.
'1.146':
  text: 'In any case, what doubt can there be where a woman is concerned?

    With one she tries the gossip''s art;

    Her glances with a second flirt;

    She holds another in her heart:

    Whom does she love enough to hurt?'
  modern: There is no doubt about women. They talk with one man, glance at another, and keep a third in their heart. Which of them does a woman love enough to hurt?
'1.148':
  text: 'The logs will glut the hungry fire,

    The rivers glut the sea''s desire,

    And Death with life be glutted, when

    The flirt has had enough of men.'
  modern: Wood never satisfies fire, rivers never fill the sea, death never has enough of living things, and a flirt never has enough of men.
'1.149':
  text: 'No chance, no corner dark,

    No man to woo;

    Then, holy sage, you find

    A woman true.'
  modern: When there is no privacy, no chance, and no man to woo her, a woman becomes faithful, O sage Nārada.
'1.150':
  text: 'The blunderhead who thinks:

    ''My love loves me,''

    Is ever in her power;

    A tame bird, he.'
  modern: The fool who thinks "She loves me" is always in her power, like a pet bird.
1.156+1:
  text: After all this lamentation, he withdrew his favor forthwith from Strong-Tooth.
  modern: After all this lament, the king at once withdrew his favor from Dantila.
1.156+2:
  text: Not to make a long story of it, he forbade his entrance at court.
  modern: In short, he forbade Dantila to enter the court.
1.156+3:
  text: 'When Strong-Tooth saw that the monarch''s favor was suddenly withdrawn, he thought: "Ah me! There is wisdom in the stanza:'
  modern: 'When Dantila saw that the king had suddenly turned from him, he thought: "Alas! Well said:'
'1.157':
  text: 'Whom does not fortune render proud?

    Whom does not death lay low?

    To what rout do passions not

    Bring never ceasing woe?

    What beggar can be dignified?

    Whose heart no woman stings?

    Who, trapped by scamps, comes safely off?

    Who is beloved of kings?'
  modern: Whom does fortune not make proud? Whom does death not lay low? What passion does not bring endless grief? What beggar keeps his dignity? Whose heart do women not wound? Who gets away safely when trapped by villains? Who is loved by kings?
'1.158':
  text: 'Who ever saw or heard

    A gambler''s truthful word,

    A neat and cleanly crow,

    A woman going slow

    In love, a kindly snake,

    A eunuch''s pluck awake,

    A drunkard''s love of science,

    A king in friends'' alliance?'
  modern: Who has ever seen or heard of a gambler telling the truth, a clean crow, a woman slow to love, a kind snake, a eunuch with courage, a drunkard who loves learning, or a king who keeps his friends?
1.158+1:
  text: And yet I never committed an unfriendly act against the king— or anyone else — not even in a dream, not even by mere words.
  modern: Yet I never did anything unfriendly to the king or anyone else, not even in a dream or in words.
1.158+2:
  text: So why does the king withdraw his favor from me?
  modern: So why does the king turn his favor from me?
1.158+3:
  text: 'Now one day Bull, the sweeper, saw Strong-Tooth stopped at the palace gate, and he laughed aloud, saying to the doorkeepers: "Be careful, doorkeepers! This fellow Strong-Tooth''s temper has been spoiled by the king''s favor and he dispenses arrests and releases.'
  modern: 'One day Gorambha the sweeper saw Dantila stopped at the palace gate. He laughed and said to the doorkeepers: "Be careful, doorkeepers! Dantila, spoiled by the king''s favor, now decides who is punished and who is pardoned.'
1.158+4:
  text: If you stop him, you will get a cuffing, just like me."
  modern: If you stop him, you will get the blow I got."
1.158+5:
  text: 'And Strong-Tooth reflected on hearing this: "I see. It was Bull''s doing.'
  modern: 'Dantila reflected: "I see. This is Gorambha''s doing.'
1.158+6:
  text: 'Well, there is sense in the proverb:'
  modern: 'Well, there is good sense in the saying:'
'1.159':
  text: 'Though foolish, base, and lacking pride,

    A servant at the monarch''s side

    Will have his honor satisfied.'
  modern: A servant at the king's side will have his honor respected, even if he is foolish, low-born and lacking pride.
'1.160':
  text: 'Though fashioned on a cowardly plan

    And mean, a royal servant can

    Resent affronts from any man.'
  modern: Even if a royal servant is timid and mean, he can resent insults from any man.
1.160+1:
  text: 'After this lamentation he went home, abashed and deeply stirred. Then he summoned Bull in the evening, gave him two garments as an honorable present, and said: "My good fellow, I did not drive you out by order of the king.'
  modern: 'Dantila went home, ashamed and deeply troubled. In the evening he called Gorambha, gave him two garments as an honor, and said: "My good fellow, I did not drive you out on the king''s order.'
1.160+2:
  text: It was because I saw you, in the chaplain's presence, sitting where you did not belong, that I humiliated you."
  modern: I saw you sit in the wrong place, in front of the Brahmins, so I insulted you."
1.160+4:
  text: 'Now Bull received the two garments as if they were the Kingdom of Heaven, and feeling intense satisfaction, he said: "Friend merchant, I forgive you.'
  modern: 'Gorambha took the two garments as if they were the kingdom of heaven. Very pleased, he said: "Merchant friend, I forgive you.'
1.160+5:
  text: You will soon see the reward of the honor shown me in the king's favor and such things.
  modern: Because of this honor, you will see the power of my wit and the king's favor.
1.160+6:
  text: With this he departed in high glee.
  modern: With that, he went away in high spirits.
1.160+7:
  text: 'For there is wisdom in the saying:'
  modern: 'There is good sense in the saying:'
'1.161':
  text: 'A little thing will lift him high,

    A little make him fall:

    ''Twixt balance-beam and scamp there is

    No difference at all.'
  modern: A small thing lifts a man up, and a small thing brings him down. A rogue is like the beam of a scale.
1.161+1:
  text: 'On the next day Bull entered the palace, and did his sweeping. And while the king lay half awake, he said: "What intelligence!'
  modern: 'Next day Gorambha entered the palace and swept. While the king lay half awake, he said: "What intelligence!'
1.161+2:
  text: When our king sits at stool, he eats a cucumber."
  modern: When our king defecates, he eats a cucumber."
1.161+3:
  text: 'Now the king, hearing this, rose in amazement and said: "Come, come, Bull! What twaddle is this?'
  modern: 'The king heard this, rose in amazement, and said: "Come, Bull! What nonsense is this?'
1.161+4:
  text: But I remember that you are a house-servant and do not kill you.
  modern: I remember you are a household servant, so I do not kill you.
1.161+5:
  text: Did you ever see me engaged in that occupation?"
  modern: Did you ever see me do that work?"
1.161+6:
  text: '"O King," said Bull, "I was awake all night because I am passionately fond of gambling. So drowsiness overcame me in the very act of doing my sweeping.'
  modern: '"O King," said Gorambha, "I was up all night because I love gambling. Drowsiness overcame me while I swept.'
1.161+7:
  text: I do not know what I was muttering.
  modern: I do not know what I was muttering.
1.161+8:
  text: (with 1.161+7)
1.161+9:
  text: Pardon me, master. I was really asleep.
  modern: Forgive me, master. I was truly asleep.
1.161+10:
  text: 'Then the king thought: "Why, from the day of my birth I never ate a cucumber while engaged in that occupation.'
  modern: 'The king thought: "Since the day I was born, I have never eaten a cucumber while doing that.'
1.161+11:
  text: And since this blockhead has talked unimaginable nonsense about me,
  modern: Since this fool has said such unthinkable things about me,
1.161+12:
  text: it must be the same with Strong-Tooth.
  modern: the same must be true of Dantila.
1.161+13:
  text: This being so, I made a mistake in taking the poor man's honors from him.
  modern: So I was wrong to take honor from the poor man.
1.161+14:
  text: Nothing of the sort is conceivable with such men.
  modern: Men like him could never do such things.
1.161+15:
  text: And in his absence all the king's business and city business is at loose ends.
  modern: Without him, the king's business and the city's business fall into disorder.
1.161+16:
  text: After thus considering the matter from every point of view, he summoned Strong-Tooth, presented him with gems from his own person and with garments, and reinstated him.
  modern: After considering the matter from every side, he called Dantila, gave him gems and garments from his own person, and restored him to office.
1.161+17:
  text: 'And that is why I say: Whoever is too haughty to Pay king''s retainers honor due, .... and the rest of it.'
  modern: 'That is why I say: whoever is too proud to honor the king''s attendants ... and so on.'
1.161+18:
  text: '"My dear fellow," said Lively, "your argument is quite convincing.'
  modern: 'Saṃjīvaka said: "Good, so it is.'
1.161+19:
  text: Let it be as you say."
  modern: I will do just what you said.
1.161+20:
  text: 'After this Victor took him to Rusty and said:'
  modern: 'Then Damanaka took him to Piṅgalaka and said:'
1.161+21:
  text: O King, here is Lively. I have brought him hither.
  modern: O King, I have brought Saṃjīvaka here.
1.161+22:
  text: The future rests with the king."
  modern: Now the decision rests with the king.
1.161+23:
  text: Then Lively bowed respectfully and stood before the king in a modest attitude.
  modern: Saṃjīvaka bowed respectfully and stood before the king, modestly.
1.161+24:
  text: 'Thereupon Rusty extended over him a right paw plump, firm, massive, adorned with claws as formidable as thunderbolts, and said with deference: "Do you enjoy health?'
  modern: 'Piṅgalaka raised his right paw, plump, firm and massive, its claws like thunderbolts, and said with respect: "Are you well?'
1.161+25:
  text: Why do you dwell in this wild wood?"
  modern: How did you come to this lonely forest?
1.161+26:
  text: Thus questioned, Lively related accurately his separation from merchant Increase and the others.
  modern: 'Saṃjīvaka told him everything: how he was separated from Vardhamāna and the others.'
1.161+27:
  text: (with 1.161+26)
1.161+28:
  text: 'And Rusty, after listening to the story, said: "Have no fear, comrade.'
  modern: 'Piṅgalaka heard the story and said: "Do not be afraid, friend.'
1.161+29:
  text: Protected by my paws, lead your own life in this forest.
  modern: Under the protection of my paws, live as you wish in this forest.
1.161+30:
  text: Furthermore, you must always take your amusements in my vicinity.
  modern: You must also always stay near me.
1.161+31:
  text: For this forest has many drawbacks, since it swarms with numerous savage creatures.
  modern: This forest has many dangers and is full of fierce beasts. It is not fit even for strong creatures.
1.161+32:
  text: (with 1.161+31)
1.161+33:
  text: Then the king of beasts went down to the bank of the Jumna, drank and bathed his fill, and plunged again into the forest, wherever inclination led him.
  modern: Then the lion went down to the Yamunā, drank and bathed, and went back into the forest wherever he liked.
1.162+1:
  text: Now Lively had assimilated solid intelligence by mastering numerous authoritative works, so that in a very few days he planted discernment in Rusty, dull as was his mind. He weaned him from forest habits and taught him village manners.
  modern: Saṃjīvaka had learned many sciences. In a few days he gave wisdom to Piṅgalaka, whose mind was dull. He drew him away from forest ways and taught him the manners of the village.
1.162+2:
  text: Why spin it out? Lively and Rusty did nothing but hold secret confabulations every day.
  modern: In short, every day Piṅgalaka and Saṃjīvaka did nothing but talk together in private.
1.162+3:
  text: This being so, all the other animals of the retinue were kept at a distance.
  modern: So all the other animals of the court were kept far away.
1.162+4:
  text: As for the two jackals, they did not even have the entrée.
  modern: As for the two jackals, they could not even enter.
1.162+5:
  text: More than that, as soon as they lacked the lion's prowess, the whole company of animals, not excluding the two jackals, suffered grievously from hunger and huddled together.
  modern: Moreover, since the lion had lost his strength, all the animals, including the two jackals, suffered badly from hunger and huddled together in one place.
'1.163':
  text: 'A king, though proud and pure of birth,

    Will see his servants flee

    A court where no rewards are won,

    As birds a withered tree.'
  modern: Even a proud king of noble birth will see his servants leave a court where no rewards are given, as birds leave a dead tree.
'1.164':
  text: 'They may be honored gentlemen,

    They may devoted be,

    Yet servants leave a monarch who

    Forgets the salary.'
  modern: Even honored, high-born and devoted servants will leave a king who forgets to pay them.
'1.165':
  text: 'A king may scold

    Yet servants hold,

    If he but pay

    Upon the day.'
  modern: A king may scold, and his servants will stay, if he pays them on the day.
1.165+1:
  text: 'Indeed, all the creatures in this world, adopting cajolery or one of the other three devices, live by eating one another. For example:'
  modern: 'Indeed, all creatures in this world, using conciliation or one of the other three methods, live by eating one another. For example:'
1.165+2:
  text: (with 1.165+1)
'1.166':
  text: 'Some eat the countries; these are kings;

    The doctors, those whom sickness stings;

    The merchants, those who buy their things;

    And learned men, the fools.'
  modern: Kings eat the lands. Doctors eat the sick. Merchants eat buyers. And learned men eat fools.
'1.167':
  text: 'The married are the clergy''s meat;

    The thieves devour the indiscreet;

    The flirts their eager lovers eat;

    And Labor eats us all.'
  modern: Beggars eat householders. Thieves eat the careless. Courtesans eat their lovers. And craftsmen eat everyone.
'1.168':
  text: 'They keep deceitful snares in play;

    They lie in wait by night and day;

    And when occasion offers, prey

    Like fish on lesser fish.'
  modern: They lie in wait by day and night with snares of conciliation and the rest. They live by their strength, as fish live on smaller fish.
1.170+1:
  text: Now Cheek and Victor, robbed of their master's favor, took counsel together — for their throats were pinched with hunger.
  modern: Now Karaṭaka and Damanaka, without the king's favor and with throats pinched by hunger, took counsel together.
1.170+2:
  text: 'And Victor said: "Cheek, my noble friend, we two seem to have lost our job.'
  modern: 'Damanaka said: "Noble Karaṭaka, the two of us seem to have lost our posts.'
1.170+3:
  text: (with 1.170+2)
1.170+4:
  text: For Rusty takes such delight in Lively's conversation that he neglects his business.
  modern: Piṅgalaka takes such delight in Saṃjīvaka's talk that he neglects his duties.
1.170+5:
  text: And the whole court is scattered every which way.
  modern: The whole court has scattered.
1.170+6:
  text: What is to be done?"
  modern: What is to be done?"
1.170+7:
  text: 'And Cheek replied: "Even if the master does not take your advice, still you should admonish him to correct his faults.'
  modern: 'Karaṭaka replied: "Even if the master does not take your advice, you should still warn him to correct his faults.'
1.170+8:
  text: 'For the proverb says:'
  modern: 'For the saying goes:'
'1.171':
  text: 'Good counselors should warn a king

    Although he pay no heed

    (As Vidur warned the monarch blind)

    To cease from evil deed.'
  modern: Even if the king does not listen, his ministers must warn him, as Vidura warned the son of Ambikā, so that his faults are destroyed.
'1.172':
  text: 'Good counselors or drivers may not duck

    From kings or elephants that run amuck.'
  modern: Ministers and drivers near a king or an elephant that runs wild must speak up and must not step aside.
1.172+1:
  text: Besides, in introducing this grass-nibbler to the master you were handling live coals."
  modern: Besides, by bringing this grass-eater to the master, you were handling live coals.
1.172+2:
  text: (with 1.172+1)
1.172+3:
  text: 'And Victor answered: "You are right.'
  modern: 'Damanaka said: "You are right.'
1.172+4:
  text: The fault is mine, not the master's.
  modern: The fault is mine, not the master's.
1.172+5:
  text: (with 1.172+4)
1.172+6:
  text: 'As the saying goes:'
  modern: 'As the saying goes:'
'1.173':
  text: 'The jackal at the ram-fight;

    And we, when tricked by June;

    The meddling friend — were playing

    A self-defeating tune.'
  modern: 'The jackal in the ram-fight, we when tricked by Āṣāḍhabhūti, and the meddling messenger: three faults, each brought on by oneself.'
1.173+1:
  text: '"How was that?" asked Cheek.'
  modern: 'Karaṭaka said: "How so?"'
1.173+2:
  text: And Victor told three stories in one, called GODLY AND JUNE
  modern: Damanaka told three stories in one, called Devaśarman and Āṣāḍhabhūti.
1.173+3:
  text: In a certain district there was a monastery in a secluded spot.
  modern: In a certain place there was a monastery in a lonely spot.
1.173+4:
  text: In it lived a holy man named Godly, who in course of time acquired a great sum of money by selling finely woven garments, the numerous offerings of the faithful for whom he performed sacrifices.
  modern: A holy man named Devaśarman lived there. Over time he got a large sum of money by selling fine cloth that many good people had given him.
1.173+5:
  text: (with 1.173+4)
1.173+6:
  text: As a result, he trusted no man, and kept his treasure under his arm by night and day.
  modern: So he trusted no one, and kept the money under his arm day and night.
1.173+7:
  text: (with 1.173+6)
1.173+8:
  text: 'For there is wisdom in the proverb:'
  modern: 'There is wisdom in the saying:'
'1.174':
  text: 'Money causes pain in getting;

    In the keeping, pain and fretting;

    Pain in loss and pain in spending:

    Damn the trouble never ending!'
  modern: Money brings pain in getting it, pain in keeping it, pain in losing it, and pain in spending it. Cursed be wealth, which brings such hardship.
1.174+1:
  text: 'Now a rogue named June, who took other people''s money from them, observed the treasure under his arm, and reflected: "How am I to take this treasure from him?'
  modern: 'A rogue named Āṣāḍhabhūti, who took other people''s money, saw the money under his arm and thought: "How can I take this money from him?'
1.174+2:
  text: In the first place, I cannot pierce the wall of the cell, which is compactly built of solid stone.
  modern: First, I cannot break through the wall of the cell, which is built of solid stone.
1.174+3:
  text: And I cannot enter the door, which is too high.
  modern: And I cannot get in through the door, which is too high.
1.174+4:
  text: I will talk to him, win his confidence, and become his disciple, for he will be in my power when I have his confidence.
  modern: I will talk to him, win his trust, and become his disciple. Once I have his trust, he will be in my power.
1.174+5:
  text: 'As the proverb says:'
  modern: 'As the saying goes:'
'1.175':
  text: 'None lacking shrewdness flatter well;

    None but a lover plays the swell;

    No saints are found in judgment seats;

    No clear, straightforward speaker cheats.'
  modern: No one without shrewdness flatters well, and only a lover shows off. No saint is found in a judge's seat. No plain-spoken man cheats.
1.175+1:
  text: 'Having thus made up his mind, he drew near to Godly, uttered the words: "Glory to Shiva. Amen," fell flat on his face, and spoke with deference: "O holy sir! All life is vanity.'
  modern: 'Having made up his mind, June went to Devaśarman, said "Glory to Śiva, Amen," bowed flat to the ground, and spoke respectfully: "Holy sir, all life is worthless.'
1.175+2:
  text: Youth slips by like a mountain torrent.
  modern: Youth rushes by like a mountain river.
1.175+3:
  text: The days of our life are like a fire in chaff.
  modern: Life is like a fire in straw.
1.175+4:
  text: Delights of the flesh are as the shadow of a cloud. Union with son, friend, servant, wife, is but a dream.
  modern: Pleasures are like the shadow of an autumn cloud. Our ties to sons, friends, wives and servants are like a dream.
1.175+5:
  text: All this I discern clearly.
  modern: I see all this clearly.
1.175+6:
  text: What shall I do that I may safely cross the sea of many lives?"
  modern: What shall I do to cross safely over the sea of many lives?"
1.175+7:
  text: 'On hearing this, Godly said respectfully: "My son, blest are you, being thus indifferent to the world in early youth.'
  modern: 'Hearing this, Devaśarman said with respect: "My son, you are blessed to feel this detachment so early in life.'
1.175+8:
  text: What says the proverb?
  modern: What does the saying say?
'1.176':
  text: 'Tis only saints in youth

    That can be saints in truth:

    Ah, who is not a saint

    When ebbing passions faint?'
  modern: Only one who is calm in youth is truly calm, I think. When the body wears out, who does not become calm?
'1.177':
  text: 'First mind, then body ages

    In case of holy sages:

    The body ages first,

    Mind never, in the worst.'
  modern: In holy men the mind ages first and then the body. In others the body ages first, and the mind never does, even at worst.
1.177+1:
  text: '"And as for your search to find a means of safely crossing the sea of many lives, just listen to this:'
  modern: '"As for your search for a way to cross the sea of many lives, listen to this:'
1.177+2:
  text: (with 1.177+1)
'1.178':
  text: 'A hangman with his matted hair,

    Or serf, or other man, through prayer

    To holy Shiva, changes caste,

    Becomes pure Brahman at the last.'
  modern: A hangman with matted hair, or a serf, or any other man, who prays to holy Śiva, changes his caste and at last becomes a pure Brahman.
'1.179':
  text: 'Six syllables, a little prayer;

    A single blossom resting there

    On Shiva''s symbol — and on earth

    No further pain, no later birth,'
  modern: With a six-syllable prayer, and a single flower laid on Śiva's emblem, there is no more pain on earth and no later birth.
1.179+1:
  text: 'When he had listened to this, June clasped the holy man''s feet and said deferentially: "This being so, holy sir, pray do me the favor of imposing a vow.'
  modern: 'When he had heard this, June clasped the holy man''s feet and said respectfully: "Then, holy sir, please do me the favor of giving me a vow.'
1.179+2:
  text: '"My son," answered Godly, "I am ready to oblige you.'
  modern: '"My son," answered Devaśarman, "I am ready to do you this favor.'
1.179+3:
  text: But you must not enter my cell by night.
  modern: But you must not enter my cell at night.
1.179+4:
  text: For renunciation is recommended to ascetics, to you and to me as well.
  modern: For renunciation is recommended to ascetics, to you and to me as well.
1.179+5:
  text: 'As the proverb puts it:'
  modern: 'As the saying goes:'
'1.180':
  text: 'Ascetics come to grief through greed;

    And kings, who evil counsels heed;

    Children through petting, wives through wine,

    Through wicked sons a noble line;

    A Brahman through unstudied books,

    A character through haunting crooks;

    A farm is ruined through neglect;

    And friendship, lacking kind respect;

    Love dies through absence; fortunes crash

    Through naughtiness; and hoarded cash

    Through carelessness or giving rash.'
  modern: Ascetics come to grief through greed, and kings through bad advice. Children are spoiled by indulgence, wives by wine, and a family by wicked sons. A Brahman is ruined by unstudied books and a good character by bad company. A farm is ruined by neglect, friendship by lack of respect, love by absence, and fortunes by bad conduct or by spending or giving carelessly.
1.180+1:
  text: So, after taking the vow, you must sleep in a hut of thatch at the monastery gate."
  modern: So, after taking the vow, you must sleep in a thatched hut at the gate of the monastery."
1.180+2:
  text: '"Holy sir," said the other, "your prescription is the law of my life.'
  modern: '"Holy sir," said June, "your instruction is the law of my life.'
1.180+3:
  text: I shall need it in the next world."
  modern: I shall need it in the next world."
1.180+4:
  text: So, the sleeping arrangements being made, Godly graciously gave him initiation and granted discipleship.
  modern: So, when the sleeping arrangements were made, Devaśarman graciously initiated him and made him a disciple.
1.180+5:
  text: June for his part made the holy man very happy by rubbing his hands and feet, bringing writing-paper, and other services.
  modern: June made the holy man very happy by rubbing his hands and feet, bringing writing paper, and doing other services.
1.180+6:
  text: Still, Godly kept his treasure under his arm.
  modern: Still, Devaśarman kept his money under his arm.
1.180+7:
  text: 'As the time passed in this manner, June reflected: "Dear me! Do what I will, he does not trust me.'
  modern: 'As time passed, June thought: "Oh dear! Whatever I do, he does not trust me.'
1.180+8:
  text: So shall I kill him with a knife in broad daylight? Or give him poison? Or butcher him like a beast?"
  modern: Shall I kill him with a knife in broad daylight? Or give him poison? Or butcher him like an animal?"
1.180+9:
  text: While he was reflecting thus, the son of a pupil of Godly's came from the village, bearing an invitation.
  modern: While he was thinking this, the son of one of Devaśarman's pupils came from the village with an invitation.
1.180+10:
  text: '"Holy sir, pray come to my house for the ceremony of the sacred thread."'
  modern: '"Holy sir, please come to my house for the ceremony of the sacred thread."'
1.180+11:
  text: And when Godly heard this, he started with June.
  modern: When Devaśarman heard this, he set out with June.
1.180+12:
  text: 'Now as he traveled, he came to a river, seeing which he took the treasure from under his arm, wrapped it carefully in his patched ascetic robe, worshiped the appropriate gods, and said to June: "June, I must step aside. Please keep careful watch of this robe and of the necessary until I return."'
  modern: 'On the way he came to a river. There he took the money from under his arm, wrapped it carefully in his patched ascetic robe, worshiped the gods, and said to June: "June, I must step aside. Please keep careful watch over this robe and my things until I return."'
1.180+13:
  text: (with 1.180+12)
1.180+14:
  text: With these words he moved away.
  modern: With these words he went away.
1.180+15:
  text: And as soon as he was out of sight, June seized the treasure and decamped.
  modern: As soon as he was out of sight, June seized the money and ran off.
1.180+16:
  text: Now Godly sat down perfectly carefree, for his disciple's countless virtues had lulled his suspicions. As he rested, he saw a herd of rams, and two of them fighting.
  modern: Devaśarman sat down, quite carefree, because his disciple's many good qualities had lulled his suspicion. As he rested, he saw a herd of rams, and two of them fighting.
1.180+17:
  text: These two would angrily draw apart and dash together, their slab-like foreheads crashing so that blood flowed freely.
  modern: The two drew apart in anger and then charged together, their broad foreheads crashing until the blood flowed freely.
1.180+18:
  text: This spectacle attracted a jackal whose soul was in the fetters of carnivorous desire, and he stood between the two, lapping up the blood.
  modern: A jackal, whose mind was bound by its craving for flesh, was drawn to the sight. He stood between the two and lapped up the blood.
1.180+19:
  text: 'When Godly observed this, he thought: "Well, well! This is a dull-witted jackal.'
  modern: 'When Devaśarman saw this, he thought: "Well, well! This jackal is dull-witted.'
1.180+20:
  text: If he happens to be between just when they crash, he will certainly meet death. This inference seems inescapable to me.
  modern: If he happens to be between them when they crash, he will certainly die. I am sure of this.
1.180+21:
  text: Now the next time, being greedy as ever to lap up the blood, the jackal did not move away, was caught between the crashing heads, and was killed.
  modern: Next time, still greedy to lap up the blood, the jackal did not move away. He was caught between the crashing heads and was killed.
1.180+22:
  text: 'Then Godly said: "The jackal at the ram-fight," and grieving for him, started to resume his treasure. He returned in no haste, but when he failed to find June, he hurried through a ceremony of purification, then examined his robe. Finding the treasure gone,'
  modern: Devaśarman, grieving for the jackal, went back to find his money. He did not hurry. When he could not find June, he quickly performed a purification, then examined his robe. Finding the money gone,
1.180+23:
  text: 'he fell to the ground in a swoon, murmuring: "Oh, oh! I am robbed."'
  modern: 'he fell to the ground in a faint, murmuring: "Alas! I have been robbed!"'
1.180+24:
  text: 'In a moment he came to himself, rose again, and started to scream: "June, June! Where did you go after cheating me? Give me answer!"'
  modern: 'In a moment he came to himself, got up again, and began to shout: "June, June! Where have you gone after cheating me? Answer me!"'
1.180+25:
  text: 'With this repeated lamentation he moved slowly on, picking up his disciple''s tracks and muttering: "And we, when tricked by June."'
  modern: 'Still lamenting, he moved slowly on, following his disciple''s tracks and muttering: "And we, when tricked by June."'
1.180+26:
  text: 'Now as he walked along, Godly spied a weaver who with his wife was on his way to a neighboring city for liquor to drink, and he called out:'
  modern: 'As he walked on, Devaśarman saw a weaver who was going with his wife to a nearby city to buy liquor, and he called out:'
1.180+27:
  text: (with 1.180+26)
1.180+28:
  text: Look here, my good fellow! I come to you a guest, brought by the evening sun.
  modern: Good man, we are guests who have come to your house at sunset.
1.180+29:
  text: I do not know a soul in the village.
  modern: We do not know anyone in this village.
1.180+30:
  text: Let me receive the treatment due a guest.
  modern: So let me receive the honor due a guest.
1.180+31:
  text: 'For the proverb says:'
  modern: 'For the saying goes:'
'1.181':
  text: 'No stranger may be turned aside

    Who seeks your door at eventide;

    Nay, honor him and you shall be

    Transmuted into deity.'
  modern: A guest who comes to the house at evening must not be turned away. Honor him, and householders become like gods.
'1.182':
  text: 'Some straw, a floor, and water,

    With kindly words beside:

    These four are never wanting

    Where pious folk abide.'
  modern: 'Straw, a floor, water, and kind words: these four are never lacking where good people live.'
'1.183':
  text: 'The sacred fires by kindly word

    And Indra by the chair is stirred,

    Krishna by water for the feet,

    The Lord of All by things to eat.'
  modern: The sacred fires are pleased by a kind word, Indra by a seat, the Lord by water for the feet, and Śambhu by food.
1.183+1:
  text: 'On hearing this, the weaver said to his wife: "Go, my dear. Take this guest to the house. Treat him hospitably, giving him water for the feet, food, a bed, and so on. And stay in the house yourself.'
  modern: 'The weaver heard this and said to his wife: "Go, dear. Take this guest home. Treat him well, with water for the feet, food, a bed and so on. And stay in the house yourself.'
1.183+2:
  text: I will bring plenty of wine and meat for you."
  modern: I will bring plenty of wine for you.
1.183+3:
  text: With this he went farther.
  modern: With that, he went on.
1.183+4:
  text: So the wife started home with Godly, and she showed a laughing countenance, for she was a whore and had a certain swain in mind.
  modern: So the wife set out for home with Devaśarman. She was smiling, for she was a loose woman and had a lover in mind.
1.183+5:
  text: 'Indeed, there is sense in the verse:'
  modern: 'Indeed, there is good sense in the verse:'
'1.184':
  text: 'When night is dark

    And dark the day,

    When streets are mired

    With sticky clay,

    When husband lingers

    Far away,

    The flirt becomes

    Supremely gay.'
  modern: On a dark day, in a dark night, on muddy streets, when her husband is away, a fickle woman is full of joy.
'1.185':
  text: 'The wench cares not

    A straw to miss

    The covered couch,

    The husband''s kiss,

    The pleasant bed;

    In place of this

    She ever seeks

    A stolen bliss.'
  modern: Lustful women think a bed, a loving husband and a soft couch are as light as grass, because they are greedy for secret pleasure.
'1.187':
  text: 'For stranger men

    The slut will see

    The ruin of

    Her family,

    The world''s reproach,

    The jailer''s key —

    Will risk a death

    She cannot flee.'
  modern: An unfaithful woman, always in love with other men, will risk the ruin of her family, public shame, prison and even death.
1.187+1:
  text: 'Then she went home, offered Godly a rickety cot and said: "My holy sir, a woman friend has come from the village and I must speak to her. I will be back directly. Meanwhile, you may stay in our house. But please be careful."'
  modern: 'Then she went home, offered Devaśarman a broken cot and said: "Holy sir, a woman friend has come from the village, and I must speak to her. I will be back at once. Meanwhile, stay in our house. But please be careful."'
1.187+2:
  text: With this she put on her best things and started to find her swain. At this moment she ran into her husband, clasping a jug of wine. He was reeling drunk, his hair was towsled, and he stumbled at every step.
  modern: With that, she put on her best clothes and set out to find her lover. Then she met her husband, holding a jug of wine. He was reeling drunk, his hair was mussed, and he stumbled at every step.
1.187+3:
  text: She ran when she saw him, entered the house, took off her finery, and appeared as usual.
  modern: When she saw him, she ran, went into the house, took off her fine clothes, and looked as usual.
1.187+4:
  text: Now the weaver had seen her flee, had observed the finery, and since he had previously heard the gossip that went the rounds about her, his heart was troubled and anger overcame him.
  modern: The weaver had seen her run off and had noticed her finery. He had already heard the gossip about her, so his heart was troubled and anger rose in him.
1.187+5:
  text: 'So he entered the house and said: "You wench! You whore! Where were you going?"'
  modern: 'He went into the house and said: "You wench! You whore! Where were you going?"'
1.187+6:
  text: 'And she replied: "I have not been out since I left you.'
  modern: 'She replied: "I have not been out since I left you.'
1.187+7:
  text: 'What is this drunken twaddle? There is sense in the proverb:'
  modern: 'What is this drunken nonsense? There is good sense in the saying:'
'1.188':
  text: 'After wine and fever, these

    Selfsame symptoms come:

    Shaking, falling to the ground,

    Mad delirium.'
  modern: 'Wine shows the same signs as a fever: shaking, falling to the ground, and wild talk.'
'1.189':
  text: 'The setting sun and drunken man

    Are both a fiery red;

    They sink in naked helplessness;

    Their dignity is dead.'
  modern: Both the setting sun and a drunken man are red. Both sink, both are helpless, and both lose their dignity.
1.189+1:
  text: 'When he had taken the scolding and had noticed her change of dress, he said: "Whore! I have heard gossip about you for a long time.'
  modern: 'When he had heard her scolding and seen that she had changed her dress, he said: "Whore! I have heard gossip about you for a long time.'
1.189+2:
  text: Today I have seen the proof. I am going to give you what you deserve."
  modern: Today I have seen the proof. I am going to punish you as you deserve."
1.189+3:
  text: 'So he beat her limp with a club, tied her firmly to a post, and fell into a drunken slumber. At this juncture her friend, the barber''s wife, learning that the weaver was asleep, came in and said: "My dear, he is waiting for you over there — you know who. Go at once."'
  modern: 'So he beat her until she was limp, tied her firmly to a post, and fell into a drunken sleep. Just then her friend, the barber''s wife, learned that the weaver was asleep and came in. She said: "My dear, he is waiting for you over there, you know who. Go at once."'
1.189+4:
  text: (with 1.189+3)
1.189+5:
  text: 'But the weaver''s wife replied: "Just see what a fix I am in.'
  modern: 'But the weaver''s wife replied: "See what a fix I am in.'
1.189+6:
  text: How can I go? You must return and tell my adorer that I cannot possibly meet him there at this moment."
  modern: How can I go? Go back and tell my lover that I cannot meet him there now.
1.189+7:
  text: '"My dear," said the barber''s wife, "do not say things like that.'
  modern: 'The barber''s wife said: "My dear, do not say such things.'
1.189+8:
  text: For a wench of spirit this is no way to behave.
  modern: A woman of spirit does not behave this way.
1.189+9:
  text: 'As the saying goes:'
  modern: 'As the saying goes:'
'1.190':
  text: 'Those who earn the name of blessed

    Show a camel-like persistence

    When they pluck the fruit of pleasure,

    Counting neither toil nor distance.'
  modern: Those who earn the name of blessed show a camel's persistence in plucking the fruit of pleasure, counting neither toil nor distance.
'1.191':
  text: 'As the other world is doubtful

    And as scandal misses truth,

    When you''ve hooked another''s lover,

    Best enjoy the fruit of youth.'
  modern: The next world is doubtful, and scandal does not always reach the truth. So when you have won another's lover, enjoy the fruit of youth.
'1.192':
  text: 'Fate may rob him of his manhood,

    He may handsome be or ugly,

    Yet a wench, whate''er it cost her,

    Entertains her lover snugly.'
  modern: Fate may take a man's manhood, and he may be handsome or ugly. Yet a loose woman, whatever it costs her, will still take her lover in comfort.
1.192+1:
  text: '"Very fine indeed," said the weaver''s wife. "But tell me how I am to go when I am tied fast.'
  modern: '"Very fine," said the weaver''s wife. "But tell me how I am to go when I am tied up.'
1.192+2:
  text: And here lies my husband — the brute!"
  modern: And here lies my husband, the brute!"
1.192+3:
  text: '"My dear," said the barber''s wife, "he is helpless with drink and will not wake until the sun''s rays reach him.'
  modern: '"My dear," said the barber''s wife, "he is helpless with drink and will not wake until the sun''s rays reach him.'
1.192+4:
  text: I will set you free and take your place myself.
  modern: I will set you free and take your place myself.
1.192+5:
  text: But you must hurry back when you have entertained your admirer.
  modern: But you must hurry back after you have entertained your admirer.
1.192+7:
  text: This she did,
  modern: She did this,
1.192+8:
  text: 'and a moment later the weaver rose a little mollified, and said drunkenly: "Come, you nagger! If you will stay at home after today and stop nagging, I will set you free."'
  modern: 'a moment later the weaver got up, a little calmer, and said drunkenly: "Come, you nagger! If you stay home from now on and stop nagging, I will set you free."'
1.192+9:
  text: The barber's wife said nothing, fearing that her voice would betray her. Even when he repeated his offer, she made no answer.
  modern: The barber's wife said nothing, for fear that her voice would betray her. Even when he repeated his offer, she gave no answer.
1.192+10:
  text: Then he became angry and cut off her nose with a sharp knife.
  modern: Then he grew angry and cut off her nose with a sharp knife.
1.192+11:
  text: 'And he said: "Whore! Now you can stay there.'
  modern: 'And he said: "Whore! Now you can stay there.'
1.192+12:
  text: I shall not be nice to you again."
  modern: I will not be kind to you again."
1.192+13:
  text: So he fell asleep, muttering.
  modern: So he fell asleep, muttering.
1.192+14:
  text: Now Godly, having lost his money, was so tormented by hunger that he could not sleep, and was a witness of all that the women did.
  modern: Devaśarman had lost his money. Hunger tormented him so that he could not sleep, and he saw everything the women did.
1.192+15:
  text: 'Presently the weaver''s wife, after enjoying the full delight of love with her swain, came home and said to the barber''s wife: "Well, are you all right?'
  modern: 'Soon the weaver''s wife, after enjoying love with her lover, came home and said to the barber''s wife: "Well, are you all right?'
1.192+16:
  text: I hope that brute did not get up while I was gone."
  modern: I hope that brute did not get up while I was gone."
1.192+17:
  text: 'And the barber''s wife answered: "The rest of me is all right. But I''ve lost my nose.'
  modern: 'The barber''s wife answered: "The rest of me is all right. But I have lost my nose.'
1.192+18:
  text: Set me free quick, before he wakes up. I want to go home. …
  modern: Set me free quickly, before he wakes up. I want to go home.
1.192+20:
  text: 'So the wench freed the barber''s wife, took her former position, and cried reproachfully: "Oh, you dreadful simpleton! I am a true wife, a model of faithfulness. What man is able to violate or disfigure me? Listen, ye guardian deities of the world!'
  modern: 'So the loose woman freed the barber''s wife, took her old place, and cried reproachfully: "Oh, you dreadful fool! I am a true wife, a model of faithfulness. What man can violate or disfigure me? Listen, you guardian gods of the world!'
1.193+1:
  text: So, if I am a faithful wife, may these gods make my nose grow again as it was before.
  modern: If I am a faithful wife, may these gods make my nose grow back as it was before.
1.193+2:
  text: More than that, if I have had so much as a secret desire for a strange man, may they reduce me to ashes."
  modern: And if I have had even a secret thought of a strange man, may they turn me to ashes."
1.193+3:
  text: 'After this explosion, she said to him directly: "Look, you villain! By virtue of my faithfulness my nose has grown as it was before.'
  modern: 'After this outburst, she said to him: "Look, you villain! Through my faithfulness my nose has grown back as it was before.'
1.193+4:
  text: And when he took a torch and examined her, he found her nose as it was originally, and a great pool of blood on the floor.
  modern: When he took a torch and looked at her, he found her nose as it was at first, and a great pool of blood on the floor.
1.193+5:
  text: At this he was amazed, released her from the cords, and flattered her with a hundred wheedling endearments.
  modern: He was amazed. He untied her and flattered her with a hundred coaxing endearments.
1.193+6:
  text: 'Now Godly had seen the whole business. And he was amazed and said:'
  modern: 'Devaśarman had seen the whole affair. He was amazed and said:'
'1.196':
  text: 'Learn science with the gods above

    Or imps in nether space,

    Yet women''s wit will rival it:

    How keep them in their place?'
  modern: 'Learn the arts of the gods above or the demons below: women''s wit rivals them all. How can men keep them in their place?'
'1.198':
  text: 'Be not enslaved by women''s charm,

    Nor wish them growth in power to harm:

    Their slaves, of manly feeling stripped,

    Are tame, pet crows whose wings are clipped.'
  modern: Do not be enslaved by women's charm, and do not let them grow strong enough to harm you. Men who are too attached to women are like crows with clipped wings, played with by women.
'1.199':
  text: 'Honey in a woman''s words,

    Poison in her breast:

    So, although you taste her lip,

    Drub her on the chest.'
  modern: Women's words are honey, but their hearts hold deadly poison. So, though you taste her lips, strike her on the chest.
'1.200':
  text: (with 1.199)
'1.201':
  text: 'This palace filled with vice, this field where sprouts

    Suspicion''s crop, this whirling pool of doubts,

    This town of recklessness, sin''s aggregate,

    This house where frauds by hundreds lie in wait,

    This basketful of riddling sham and quip

    O''er guessing which our best and bravest trip,

    This woman, this machine, this nectar-bane —

    Who set it here, to make religion vain?'
  modern: 'A woman is a palace of vice, a field where suspicion grows, a whirlpool of doubt, a town of recklessness, a house where hundreds of tricks wait, a basket of riddles. This woman, this machine, this nectar that is poison: who made her to ruin religion?'
'1.202':
  text: 'A bosom hard is praised, a forehead low,

    A fickle glance, a mumbling speech and slow,

    Thick hips, a heart that constant tremors move,

    A natural twist in hair, and twists in love.

    Their virtues are a pack of vices. Then

    Let beasts adore the fawn-eyed things, not men.'
  modern: Women are praised for hard breasts, a low forehead, a restless glance, slow and mumbled speech, thick hips, a heart that always trembles, curly hair and crooked love. Their virtues are only vices. So let beasts, not men, love these deer-eyed women.
'1.203':
  text: 'For reasons good they laugh or weep;

    They trust you not, your trust they keep:

    These graveyard urns, oh, haunt them not!

    Keep kin and conduct free from spot.'
  modern: They laugh or weep for their own ends. They make you trust them, but they trust no one. Do not go near these graveyard pots. Keep your family and your conduct clean.
'1.204':
  text: 'The lion o''er whose awful face

    Falls fierce the towsled mane,

    The elephant upon whose cheeks

    Streams ichor''s glistening rain, …'
  modern: The lion, its fierce face under a tousled mane, and the elephant, ichor streaming down its cheeks …
'1.207':
  text: 'Behold the faults with woman born:

    Impurity, and heartless scorn,

    Untruth, and folly, reckless heat,

    Excessive greediness, deceit.'
  modern: 'Look at the faults born with women: impurity, heartless scorn, untruth, folly, reckless passion, greed and deceit.'
'1.209':
  text: 'This gunja-fruit (oh, what was God about?)

    Is poisonous within, and sweet without.'
  modern: 'Women are like the gunjā berry: poisonous inside and sweet outside. Who made them?'
1.209+1:
  text: In these meditations the night dragged drearily for the holy man.
  modern: Devaśarman passed the night in these thoughts, and it dragged on painfully.
1.209+2:
  text: 'Meanwhile the go-between went home with her nose cut off, and reflected: "What is to be done now? How is this great deficiency to be concealed?"'
  modern: 'Meanwhile the go-between went home with her nose cut off and thought: "What am I to do now? How can I hide this great defect?"'
1.209+3:
  text: 'The night during which she pondered thus, her husband spent in the king''s palace, practicing his trade. At dawn he came home and, being eager to begin his thriving business with the townspeople, he stopped at the door and called to her: "My dear, bring me my razor-case at once. The townspeople need my services."'
  modern: 'While she was thinking this, her husband spent the night at the palace on business. At dawn he came home, eager to start his work with the townspeople. He stopped at the door and called: "Bring me my razor case at once. The townspeople need me."'
1.209+4:
  text: Hereupon an idea occurred to the noseless woman. She remained in the house, but sent him a single razor.
  modern: The woman with no nose had an idea. She stayed inside and sent him one razor from the case.
1.209+5:
  text: And the barber, angry because the entire case had not been delivered, flung the razor in her direction.
  modern: The barber, eager to be off, looked at the one razor and in anger threw it toward her.
1.209+6:
  text: 'This gave the wench her opportunity. Lifting her hands to heaven, she dashed from the house, screaming with all her might:'
  modern: 'This gave the loose woman her chance. Raising her hands to heaven, she rushed out of the house, screaming with all her might:'
1.209+7:
  text: '"Oh, oh, oh! The ruffian! I was always a faithful wife. Look! He cut off my nose.'
  modern: '"Oh, oh, oh! The villain! I was always a faithful wife. Look! He cut off my nose.'
1.209+8:
  text: (with 1.209+7)
1.209+9:
  text: Hereupon the police arrived, thrashed the barber limp, tied him fast, and took him to court with his wife whose nose was gone.
  modern: Then the king's men came, beat the barber until he was limp, tied him up, and took him to court with his wife, whose nose was gone.
1.209+12:
  text: 'And the judges asked him: "Why did you do this ghastly thing to your wife?"'
  modern: 'The judges asked him: "Why did you do this terrible thing to your wife?"'
1.209+16:
  text: Then, his wits being so addled by astonishment that he could give no answer,
  modern: The barber was so stunned that he could not answer,
1.209+20:
  text: 'the jurymen quoted law:'
  modern: 'the judges quoted the law:'
'1.210':
  text: 'The guilty man is terrified

    By reason of his crime. His pride

    Is gone, his powers of speaking fail,

    His glances rove, his face is pale.'
  modern: A guilty man is terrified by his crime. His pride is gone, he cannot speak well, his eyes wander, and his face is pale.
'1.211':
  text: 'The sweat appears upon his brow,

    He stumbles on, he knows not how,

    His face is pale, and all he utters

    Is much distorted; for he stutters.'
  modern: Sweat appears on his brow. He stumbles without knowing how. His face is pale, and what he says is distorted, for he stutters.
'1.212':
  text: 'The culprit always may be found

    To shake, and gaze upon the ground:

    Observe the signs as best you can

    And shrewdly pick the guilty man.'
  modern: A culprit can always be found by his shaking and by his gaze on the ground. Watch the signs as well as you can, and pick out the guilty man shrewdly.
'1.213':
  text: 'The innocent is self-reliant;

    His speech is clear, his glance defiant;

    His countenance is calm and free;

    His indignation makes his plea.'
  modern: An innocent man is self-reliant. His speech is clear, his glance is bold, his face is calm, and his anger makes his plea.
1.213+1:
  text: The prisoner is obviously guilty.
  modern: The prisoner is clearly guilty.
1.213+2:
  text: The legal penalty for assaulting a woman is death.
  modern: The legal penalty for assaulting a woman is death.
1.213+3:
  text: Let him be impaled."
  modern: Let him be impaled."
1.213+4:
  text: 'But Godly, seeing him led to the place of execution, went to the officers of justice and said: "Gentlemen, you make a mistake in putting this wretched barber to death.'
  modern: 'But Devaśarman, seeing him led to the place of execution, went to the officers of justice and said: "Gentlemen, you are making a mistake in putting this wretched barber to death.'
1.213+5:
  text: His conduct has been correct.
  modern: His conduct has been proper.
1.213+6:
  text: 'Pray listen to these words of mine:

    The jackal at the ram-fight;

    And we, when tricked by June;

    The meddling friend — were playing

    A self-defeating tune.'
  modern: 'Listen to my words. The jackal in the ram-fight, we when tricked by Āṣāḍhabhūti, and the meddling friend: each played a tune that defeated himself.'
1.213+7:
  text: 'So the officers said: "How was that, holy sir?"'
  modern: 'The officers said: "How so, holy sir?"'
1.213+8:
  text: Then Godly related to them the three stories, complete in every detail.
  modern: Then Devaśarman told them all three stories in full.
1.213+9:
  text: 'And they were all astonished as they listened. They set the barber free, and said:'
  modern: 'They were all amazed as they listened. They set the barber free and said:'
1.214+1:
  text: Now she has lost her nose through her own act.
  modern: She has lost her nose through her own act.
1.214+2:
  text: As additional punishment from the king, let her ears be cut off.
  modern: As further punishment from the king, let her ears be cut off.
1.214+3:
  text: When this had been done, Godly, strengthening his spirit by the two examples, returned to his own monastery.
  modern: When this was done, Devaśarman, strengthened by the two examples, returned to his own monastery.
1.214+4:
  text: 'And that is why I say: The jackal at the ram-fight, .... and the rest of it.'
  modern: 'That is why I say: the jackal at the ram-fight ... and so on.'
1.214+5:
  text: '"Well," said Cheek, "such being the case, what are you and I to do?"'
  modern: '"Well," said Karaṭaka, "in such a case, what are you and I to do?"'
1.214+6:
  text: 'And Victor answered: "Even in these circumstances, I shall have a flash of intelligence, showing me how to separate Lively from the king.'
  modern: 'Damanaka said: "Even in such a case, I will have a flash of intelligence, showing me how to separate Saṃjīvaka from the king.'
1.216+1:
  text: 'You know the proverb:'
  modern: 'You know the saying:'
'1.217':
  text: 'Unceasing effort brings success;

    ''Fate, fate is all,'' let dastards wail:

    Smite fate and prove yourself a man;

    What fault if bold endeavor fail?'
  modern: Steady effort brings success. Cowards cry "fate, fate." Strike down fate and prove yourself a man. If a bold effort fails, whose fault is it?
'1.218':
  text: 'Not even Brahma sees the end

    Of well-devised deceit:

    The weaver, taking Vishnu''s form,

    Embraced the princess sweet.'
  modern: Not even Brahmā can see the end of a well-planned deceit. The weaver, taking the form of Viṣṇu, embraced the sweet princess.
1.218+1:
  text: '"How was that?" asked Cheek.'
  modern: 'Karaṭaka said: "How so?"'
1.218+2:
  text: And Victor told the story of
  modern: Damanaka told the story of
1.218+3:
  text: In the Molasses Belt is a city called Sugarcane City. In it lived two friends, a weaver and a carpenter.
  modern: In a city called Sugarcane City lived two friends, a weaver and a carpenter.
1.218+5:
  text: One day there was a great festival, an occasion when the entire population, wearing the finest ornaments that each could afford, began sauntering through the temples of the gods and other public places.
  modern: One day there was a great festival, when everyone put on their finest ornaments and walked through the temples and public places.
1.218+6:
  text: The weaver and the carpenter, like the rest, put on their best things, and in squares and courtyards inspected the faces of people dressed to kill. And they caught a glimpse of a princess seated at the window of a stucco palace.
  modern: The weaver and the carpenter, like the others, put on their best and looked over the crowd. They caught sight of a princess sitting at the window of a stucco palace.
1.218+10:
  text: 'Finding him in this condition, he said: "My friend, my friend, why are you in such a state today?"'
  modern: 'The carpenter said: "Friend, why are you in such a state today?"'
1.219+7:
  text: Then he related his whole experience from the moment he laid eyes on the princess.
  modern: Then he told his whole story, from the moment he saw the princess.
'1.220':
  text: 'Her bosom, like an elephant''s brow,

    Swells, saffron-scented. How, ah, how

    May I thereon my bosom lay,

    When weary love is tired of play,

    So, fettered in her arms, to keep

    A vigil waking half, half sleep?'
  modern: How can I lay my chest on her breasts, swelling and saffron-scented like an elephant's brow, and keep watch in her arms, half awake and half asleep, when love is tired of play?
'1.221':
  text: 'That these — her bosom''s youthful pride,

    Her curling hair, her sinuous side,

    Her blood-red lip, her waist so small —

    Should hurt me, is not strange at all:

    But that her cheeks so clear, so bright,

    Should torture me, is far from right.'
  modern: It is no wonder that her proud breasts, curling hair, sinuous side, red lips and slender waist hurt me. But it is wrong that her bright cheeks should torture me.
1.221+2:
  text: 'At last the carpenter said: " … I will invent something such that you will enjoy with her the delights of love without loss of time."'
  modern: 'At last the carpenter said: "I will think of a way for you to enjoy her love at once."'
1.221+4:
  text: (with 1.221+2)
1.221+5:
  text: And the next day the carpenter came bringing a brand-new mechanical bird, like Garuda, the bird of Vishnu. It was made of wood, was gaily painted in many colors, and had an ingenious arrangement of plugs.
  modern: The next day the carpenter brought a new mechanical bird like Garuḍa, the bird of Viṣṇu. It was made of wood, painted in bright colors, and had a clever set of plugs.
1.221+6:
  text: '"Comrade," he said to the weaver, "when you mount the bird and insert a plug, it goes wherever you wish. And the contrivance alights at the spot where you pull out the plug. It is yours. This very night, when people are asleep, adorn your person, disguise yourself as Vishnu — my wit and skill are at your service — mount this Garuda bird, alight on the maidens'' balcony of the palace, and make whatever arrangements you like with the princess. I have ascertained that the princess sleeps alone on the palace balcony.'
  modern: '"Comrade," he said, "when you sit on the bird and put in a plug, it goes where you want. It lands where you pull the plug out. It is yours. Tonight, when people are asleep, dress yourself as Viṣṇu. My skill is at your service. Ride this Garuḍa to the balcony of the maidens'' palace and do what you like with the princess. I have found out that she sleeps alone on the balcony.'
1.221+9:
  text: 'All at once she spied the weaver, disguised as Vishnu and mounted on his heavenly bird. At sight of him she started from her bed, adored his feet, and humbly said: "O Lord, to what end am I honored by this visit? …'
  modern: 'Suddenly she saw the weaver, dressed as Viṣṇu and riding his heavenly bird. She rose from her bed, bowed at his feet and said humbly: "Lord, why have you honored me with this visit?"'
1.221+13:
  text: 'And he continued: "Nay, you have been my bride, now fallen to earth by reason of a curse.'
  modern: 'He went on: "No, you were my wife, and you have now fallen to earth because of a curse.'
1.221+14:
  text: (with 1.221+13)
1.221+20:
  text: I will now wed you by the ceremony used in heaven.
  modern: I will now marry you by the heavenly rite.
1.221+23:
  text: 'Before dawn the weaver would mount his mechanical Garuda, would bid her farewell with the words: "I depart for Vishnu''s heaven," and would always reach his house undetected.'
  modern: Before dawn the weaver would mount his mechanical Garuḍa, bid her farewell with the words "I am going to Viṣṇu's heaven," and always reach his house unseen.
1.221+24:
  text: So day followed day in the enjoyment of love's delights, each day witnessing a growth in passion.
  modern: So day followed day in the joy of love, and each day their passion grew.
1.221+25:
  text: One day the guards at the women's quarters observed indications that the princess was meeting a man, and in fear of their very lives made a report to their master.
  modern: One day the guards at the women's quarters saw signs that the princess was meeting a man. Fearing for their lives, they reported to their master.
1.221+28:
  text: 'And when the king assented, the guards reported: "O King, we have used anxious care to forbid the entrance of men.'
  modern: 'When the king agreed, the guards reported: "O King, we have taken great care to keep men out.'
1.221+29:
  text: Yet indications are observed that Princess Lovely has meetings with a man.
  modern: Yet there are signs that Princess Lovely meets a man.
1.221+30:
  text: Not unto us does it fall to take measures. The king, the king alone is prime mover.
  modern: It is not for us to act. The king alone must decide.
1.221+31:
  text: 'Upon this information the king pondered with troubled spirit:'
  modern: 'On hearing this, the king was greatly troubled and thought:'
'1.222':
  text: 'You are worried when you hear that she is born;

    Picking husbands makes you anxious and forlorn;

    When she marries, will her husband be a churl?

    It is tough to be the father of a girl.'
  modern: You worry when a daughter is born. Choosing a husband makes you anxious and forlorn. Will her husband be a churl? It is hard to be the father of a girl.
'1.224':
  text: 'At her birth she steals away her mother''s heart;

    Loving friends, when she is older, fall apart;

    Even married, she is apt to bring a stain:

    Having daughters is a business full of pain.'
  modern: At birth a daughter steals her mother's heart. As she grows, loving friends fall away. Even married, she brings a stain. Having daughters is a business full of pain.
1.224+1:
  text: 'Having thus considered the matter from every point of view, he sought the queen and said: "My dear queen, pray give careful attention to what these chamberlains have to say. Who is this offender whom the death-god seeks today?"'
  modern: 'After weighing the matter from every side, he went to the queen and said: "My dear queen, listen carefully to what these chamberlains say. Who is this offender whom Death seeks today?"'
1.224+2:
  text: Now when they had related the facts, the queen hastened in great perturbation to the maiden's apartments and found her daughter with lips sore from kissing and with telltale traces on her limbs.
  modern: When they had told her, the queen hurried in great distress to the maiden's rooms and found her daughter with sore lips and marks on her body.
1.224+3:
  text: 'And she cried: "You wicked girl! You are a disgrace to the family! How could you throw your character away?'
  modern: 'She cried: "You wicked girl! You disgrace the family! How could you throw away your character?'
1.224+4:
  text: Who is the man that comes to you? The death-god has looked upon him.
  modern: Who is the man who comes to you? Death has marked him.
1.224+5:
  text: Dreadful as things are, at least tell the truth.
  modern: However dreadful it is, at least tell the truth.
1.224+6:
  text: Then the princess, with shamefaced, drooping glances, recounted the whole story of the weaver disguised as Vishnu.
  modern: Then the princess, with shamed and downcast eyes, told the whole story of the weaver disguised as Viṣṇu.
1.224+8:
  text: 'Thereupon the queen, with laughing countenance and thrilling in every limb, hastened to the king and said: "O King, you are indeed fortunate.'
  modern: 'Then the queen, smiling and thrilled in every limb, hurried to the king and said: "O King, you are very fortunate.'
1.224+9:
  text: It is blessed Vishnu who comes each night in person to our daughter's side.
  modern: It is blessed Viṣṇu who comes every night in person to our daughter's side.
1.224+10:
  text: He has married her by the ceremony used in heaven.
  modern: He has married her by the heavenly rite.
1.224+11:
  text: This very night you and I are to hide in the window niche and have sight of him.
  modern: Tonight you and I will hide in the window niche and see him.
1.224+12:
  text: But with mortals he does not exchange words.
  modern: But he does not speak with mortals.
1.224+13:
  text: On hearing this, the king was glad at heart, and somehow lived through the day, which seemed a hundred years.
  modern: Hearing this, the king was glad, and somehow got through the day, which seemed a hundred years.
1.224+14:
  text: When night came, the king and queen stood hidden in the window niche and waited, their gaze fixed on the sky. Presently the king descried one descending from heaven, mounted on Garuda, grasping the conch-shell, discus, mace, marked with the familiar symbols.
  modern: At night the king and queen stood hidden in the window niche, their eyes fixed on the sky. Soon the king saw a figure coming down from heaven on Garuḍa, holding the conch, discus and mace, marked with the familiar signs.
1.224+15:
  text: 'And feeling as if drenched by a shower of nectar, he said to the queen: "There is none other on earth so blest as you and I,'
  modern: 'As if drenched by a shower of nectar, he said to the queen: "There is no one on earth as blessed as you and I,'
1.224+16:
  text: whose child blessed Vishnu seeks with love.
  modern: whose child blessed Viṣṇu seeks with love.
1.224+17:
  text: All the desires nearest our hearts are granted.
  modern: Every wish close to our hearts is granted.
1.224+18:
  text: Now, through the power of our son-in-law, I shall reduce the whole world to subjection.
  modern: Now, through the power of our son-in-law, I will bring the whole earth under my rule.
1.224+19:
  text: At this juncture envoys arrived to collect the yearly tribute for King Valor, monarch of the south, lord of nine million, nine hundred thousand villages. But the king, proud of his new relationship with Vishnu, did not show them the customary honor,
  modern: At that time envoys came to collect the yearly tribute for King Valor, lord of the south, who ruled nine million nine hundred thousand villages. But the king, proud of his new bond with Viṣṇu, did not show them the usual honor,
1.224+20:
  text: so that they grew indignant … And they returned to their own country, exaggerated the matter a hundred thousand fold, and stirred the wrath of their master.
  modern: so they grew angry. They went home, made the matter a hundred thousand times worse, and stirred their master's anger.
1.224+22:
  text: 'Then he summoned Lovely and with respectful coaxing said: "Dear child, relying on your husband''s power, we have begun hostilities with the enemy. This very night pray speak to blessed Vishnu when he comes, so that in the morning he may kill this enemy of ours.'
  modern: 'Then he called Lovely and, coaxing her respectfully, said: "Dear child, relying on your husband''s power, we have begun a war with the enemy. Tonight, please speak to blessed Viṣṇu when he comes, so that in the morning he may kill this enemy of ours.'
1.224+23:
  text: So Lovely delivered to him at night her father's message, complete in every particular.
  modern: At night Lovely brought him her father's message, word for word.
1.224+25:
  text: 'On hearing it, the weaver laughed and said: "Dear love, how little a business is this, a mere war with men!'
  modern: 'The weaver laughed and said: "Dear love, what a small matter this is, only a war with men!'
1.224+26:
  text: 'Go, then, and say to the king: "Dismiss anxiety.'
  modern: 'Go, then, and tell the king: "Put your worries aside.'
1.224+27:
  text: In the morning Vishnu will slay the host of your enemies with his discus."
  modern: In the morning Viṣṇu will kill the host of your enemies with his discus."
1.224+32:
  text: 'Meanwhile the weaver, forgetting love''s allurements, took counsel with his brooding mind: "What am I to do now? … King Valor will drag her from the palace after killing my poor father-in-law.'
  modern: 'Meanwhile the weaver, forgetting love''s pleasures, thought: "What am I to do now? King Valor will kill my poor father-in-law and drag her from the palace.'
1.224+33:
  text: Besides, it is just possible that the enemy, if they see me accepting battle and mounted on Garuda, will think me the genuine Vishnu and will flee.
  modern: It is also possible that the enemy, seeing me ready for battle on Garuḍa, will think I am the real Viṣṇu and will run.
1.225+1:
  text: Why spin it out? Death, sure death, in either case. It is better, then, to die game.
  modern: In short, death is certain either way. It is better to die bravely.
1.227+9:
  text: When the weaver had thus resolved on battle,
  modern: When the weaver had decided to fight,
1.227+10:
  text: the genuine Garuda made respectful representations to the genuine Vishnu in heaven. "O Lord," he said, "in a city on earth called Sugarcane is a weaver who, disguising himself as my Lord, has wedded a princess.
  modern: 'Garuḍa, the real one, spoke respectfully to Viṣṇu in heaven: "Lord, in the city of Sugarcane on earth there is a weaver who, dressed as you, has married a princess.'
1.227+12:
  text: This, then, is what I must refer to your decision.
  modern: So I must bring this to your decision.
1.227+13:
  text: If he meets death in battle, then scandal will arise in the mortal world to the effect that blessed Vishnu has been killed by the king of the south.
  modern: If he dies in battle, people on earth will say that blessed Viṣṇu was killed by the king of the south.
1.227+14:
  text: Thereafter sacrificial offerings will fail, and other religious ceremonies.
  modern: After that, sacrifices and other rites will cease.
1.227+15:
  text: My spirit shall enter his body, you are to inspire his bird, and my discus, his discus."
  modern: My spirit will enter his body, you will enter his bird, and my discus his discus."
1.227+16:
  text: (with 1.227+15)
1.227+19:
  text: '"So be it," said Garuda, assenting.'
  modern: 'Garuḍa agreed: "So be it."'
1.227+20:
  text: At the blare of the conch, elephants, horses, chariots, foot-soldiers, were dismayed and many garments were fouled. Some with shrill screams fled afar. Some rolled on the ground, all purposive movement paralyzed. Some stood stock still, with terrified gaze fixed unwavering on heaven.
  modern: At the sound of the conch, the elephants, horses, chariots and foot soldiers were dismayed. Some fled screaming, some rolled on the ground, and some stood still, staring at the sky in terror.
1.227+26:
  text: while he himself, having attained the special majesty of those victorious, enjoyed all known delights with the princess.
  modern: and he himself, now a victor, enjoyed all the pleasures of life with the princess.
1.227+27:
  text: 'That is why I told you:

    Not even Brahma sees the end

    Of well-devised deceit:

    The weaver, taking Vishnu''s form,

    Embraced the princess sweet.'
  modern: 'That is why I said: Not even Brahmā sees the end of well-planned deceit; the weaver, taking Viṣṇu''s form, enjoyed the princess.'
1.227+31:
  text: '"How will you detach him?" objected Cheek. "You have not the power."'
  modern: 'Karaṭaka said: "How will you separate him? You do not have the power."'
1.227+33:
  text: '"My dear fellow," said Victor, "there is a verse to fit the situation, namely:'
  modern: 'Damanaka said: "My friend, there is a verse for this case:'
'1.228':
  text: 'In cases where brute force would fail,

    A shrewd device may still prevail:

    The crow-hen used a golden chain,

    And so the dreadful snake was slain.'
  modern: Where force would fail, a clever device may still succeed. The crow-hen used a golden thread and the black snake was killed.
1.228+1:
  text: '"How was that?" asked Cheek.'
  modern: 'Karaṭaka said: "How so?"'
1.228+2:
  text: And Victor told
  modern: Damanaka told
1.228+3:
  text: In a certain region grew a great banyan tree.
  modern: In a certain place there grew a great banyan tree.
1.228+4:
  text: In it lived a crow and his wife, occupying the nest which they had built.
  modern: A crow and his wife lived in it, in the nest they had built.
1.228+5:
  text: But a black snake crawled through the hollow trunk and ate their chicks as fast as they were born, even before baptism.
  modern: But a black snake crawled through the hollow trunk and ate their chicks as fast as they were born.
1.228+6:
  text: '… he went at once to another tree, under which lived a dear friend, a jackal. He courteously called the jackal forth, related all his sorrow, then said: "My friend, what do you consider opportune under the circumstances? The killing of our children is sheer death to my wife and me."'
  modern: 'He went to another tree, where his dear friend, a jackal, lived. He politely called the jackal out, told him all his sorrow, and said: "My friend, what do you advise in this case? The killing of our children is sheer death to my wife and me."'
1.228+7:
  text: (with 1.228+6)
'1.229':
  text: 'With fields overhanging rivers,

    With wife on flirting bent,

    Or in a house with serpents,

    No man can be content.'
  modern: No man can be at ease whose fields hang over a river, whose wife is bent on flirting, or who lives in a house with snakes.
1.230+1:
  text: We are living in deadly peril.
  modern: We are in deadly danger here.
1.230+2:
  text: '"My friend," said the jackal, "I have thought the matter through. You need not put yourself out.'
  modern: '"My friend," said the jackal, "I have thought it through. You need not trouble yourself.'
'1.232':
  text: 'A heron ate what fish he could,

    The bad, indifferent, and good;

    His greed was never satisfied

    Till, strangled by a crab, he died.'
  modern: A heron ate whatever fish he could, bad, middling and good. His greed was never satisfied, and a crab strangled him to death.
1.232+1:
  text: '"How was that?" asked the crow.'
  modern: 'The crow asked: "How so?"'
1.232+2:
  text: And the jackal told the story of
  modern: The jackal told the story of
1.232+4:
  text: There was once a heron in a certain place on the edge of a pond. Being old, he sought an easy way of catching fish on which to live.
  modern: Once there was a heron living at the edge of a pond. Being old, he looked for an easy way to catch fish to live on.
1.232+6:
  text: 'Now among the fish lived a crab. He drew near and said: "Uncle, why do you neglect today your usual meals and amusements?"'
  modern: 'A crab lived among the fish. He came near and said: "Uncle, why are you skipping your usual meals today?"'
1.232+10:
  text: '"Uncle," said the crab, "of what nature is the disaster?"'
  modern: 'The crab said: "Uncle, what kind of disaster is it?"'
1.258+24:
  text: 'Having listened to this, Cheek said: "If you, too, are thus climbing determination''s height, then proceed to the accomplishment of your desire. Blest be your journeyings."'
  modern: 'Karaṭaka said: "If you too are climbing the height of determination, go and carry out your purpose. May your road be blessed."'
  ryder: Book I, frame after the weaver tale
1.258+25:
  text: (with 1.258+24)
  ryder: Book I, frame after the weaver tale
1.258+26:
  text: (with 1.258+24)
  ryder: Book I, frame after the weaver tale
1.258+27:
  text: 'Thereupon Victor sought the presence of the lion, who said, when Victor had bowed and seated himself:'
  modern: Damanaka went to the lion. The lion spoke when Damanaka had bowed and sat down.
  ryder: Book I, Victor and Rusty
1.258+28:
  text: '"Why has so long a time passed since you were last visible?"'
  modern: '"Why have you been gone so long?" Piṅgalaka asked.'
  ryder: Book I, Victor and Rusty
1.258+31:
  text: 'And Victor answered: "O King, urgent business awaits my master today. Hence I am come, the bearer of tidings unwelcome but wholesome. This is not, indeed, the desire of dependents, who yet bring such tidings when they fear the neglect of immediate and necessary action.'
  modern: 'Damanaka answered: "Your Majesty, there is urgent business for you today, so I have come with news that is unwelcome but good for you. Servants do not want to bring such news, but they bring it when they fear that something urgent and necessary is being neglected."'
  ryder: Book I, Victor and Rusty
1.262+1:
  text: 'Hereupon Rusty, believing his words worthy of trust, respectfully asked him: "What do you wish to imply?"'
  modern: Piṅgalaka, trusting him, asked respectfully what he meant.
  ryder: Book I, Victor and Rusty
1.262+2:
  text: 'And Victor answered: "O King, Lively has crept into your confidence with treasonable purpose. On several occasions he has confidentially whispered in my hearing: ''I have examined the strong points and the weak in your master''s power — in his prestige, his advisers, and his material resources. I plan to kill him and to seize the royal power myself without difficulty.'' …'
  modern: 'Damanaka said: "O King, Saṃjīvaka has won your trust with treason in mind. More than once he has told me in private: ''I have looked into the strengths and weaknesses of your master''s power, his standing, his counselors and his resources. I plan to kill him and take the kingdom for myself without trouble.''"'
  ryder: Book I, Victor and Rusty
1.262+3:
  text: (with 1.262+2)
  ryder: Book I, Victor and Rusty
1.262+4:
  text: (with 1.262+2)
  ryder: Book I, Victor and Rusty
1.262+5:
  text: To Rusty this report was more terrible than the fall of a thunderbolt. He sank into a panic-stricken stupor and said not a word.
  modern: The news hit Piṅgalaka like a thunderbolt. He fell into shock and said nothing.
  ryder: Book I, Victor and Rusty
1.262+8:
  text: 'And again:'
  modern: 'And again:'
  ryder: Book I, Victor and Rusty
'1.263':
  text: 'No king should ever delegate

    To one sole man the powers of state:

    For folly seizes him, then pride,

    Whereat he grows dissatisfied

    With service; thus impatient grown,

    He longs to rule the realm alone;

    And such impatient longings bring

    Him into plots to kill his king.'
  modern: A king should never give one man the whole power of the state. Folly and pride take hold of him. He grows discontent with his service, wants to rule alone, and plots to kill his king.
  ryder: Book I, Victor and Rusty
1.263+2:
  text: 'On hearing this, Rusty said: "After all, he is my servant. Why should he experience a change of heart toward me?"'
  modern: 'Piṅgalaka said: "After all, he is my servant. Why would he turn against me?"'
  ryder: Book I, Victor and Rusty
1.263+3:
  text: (with 1.263+2)
  ryder: Book I, Victor and Rusty
1.263+4:
  text: 'But Victor answered: "Servant or not, there is nothing conclusive in that.'
  modern: 'Damanaka answered: "Servant or not, that proves nothing."'
  ryder: Book I, Victor and Rusty
1.263+5:
  text: 'For the proverb says:'
  modern: 'For the saying goes:'
  ryder: Book I, Victor and Rusty
'1.264':
  text: 'The man who loves not royalty,

    Just serving while he can

    Find nothing better worth his pains,

    Is not a loyal man.'
  modern: A man who does not love the king's rank, and who serves only while he finds nothing better to do, is not a loyal man.
  ryder: Book I, Victor and Rusty
1.264+1:
  text: '"My dear fellow," said the lion, "even so, I cannot find it in my heart to turn against him.'
  modern: 'Piṅgalaka said: "Even so, my heart will not turn against him."'
  ryder: Book I, Victor and Rusty
'1.265':
  text: 'However false and fickle grown,

    Once dear is always dear:

    Who does not love his body, though

    Decrepit, blemished, queer?'
  modern: A man who is dear stays dear, even when he has many faults and does wrong. Who does not love his own body, though it is old, blemished or odd?
  ryder: Book I, Victor and Rusty
1.265+1:
  text: '"For that very reason," retorted Victor, "there is a serious flaw in the business of getting on in the world.'
  modern: '"That is exactly the trouble," Damanaka replied. "There is a serious flaw in how men get on in the world."'
  ryder: Book I, Victor and Rusty
1.265+2:
  text: 'As the verse puts it:'
  modern: 'The verse says:'
  ryder: Book I, Victor and Rusty
'1.266':
  text: 'The man of birth or man unknown,

    If kingly eyes on him alone

    Are fixed, aspires to seize the throne.'
  modern: A man, of high birth or low, on whom the king fixes his eye alone, grows bold enough to seize the throne.
  ryder: Book I, Victor and Rusty
1.266+2:
  text: And if you fancy that he will bring benefit because he is bulky of body, you make a perverse mistake.
  modern: If you think he will be useful because he is big, you are making a serious mistake.
  ryder: Book I, Victor and Rusty
1.266+3:
  text: (with 1.266+2)
  ryder: Book I, Victor and Rusty
'1.267':
  text: 'Never publicly defame

    Any once commended name:

    Broken promises are shame.'
  modern: Never speak ill in public of someone you once praised; breaking your word is shameful.
  ryder: Book I, Victor and Rusty
1.267+2:
  text: '"Now I formerly gave him a safe-conduct, since he appeared as a suppliant. …'
  modern: '"I once promised him safety, since he came to me asking for protection."'
  ryder: Book I, Victor and Rusty
1.271+1:
  text: '"Now my lord and king associates with Lively, making a vicious mistake that results in the neglect of the three things worth living for — virtue, money, and love. …'
  modern: '"Now Your Majesty keeps company with Saṃjīvaka, and this bad mistake leads you to neglect the three aims of life: virtue, wealth and love."'
  ryder: Book I, Victor and Rusty
1.271+2:
  text: '"Precisely," said Victor. "He is a grass-nibbler.'
  modern: '"Exactly," said Damanaka. "He eats grass."'
  ryder: Book I, Victor and Rusty
1.271+3:
  text: My lord and king is a carnivore. …
  modern: Your Majesty eats meat.
  ryder: Book I, Victor and Rusty
'1.275':
  text: 'With no stranger share your house;

    Leap, the flea, killed Creep, the louse.'
  modern: Do not share your house with a stranger. Agnimukha the flea killed Mandavisarpiṇī the louse.
  ryder: Book I, Victor and Rusty
1.275+1:
  text: '"How was that?" asked Rusty.'
  modern: '"How so?" asked Piṅgalaka.'
  ryder: Book I, Victor and Rusty
1.275+2:
  text: And Victor told the story of LEAP AND CREEP.
  modern: Damanaka told the story of Agnimukha (Leap) and Mandavisarpiṇī (Creep).
  ryder: Book I, Victor and Rusty
1.275+3:
  text: In the palace of a certain king stood an incomparable bed, blessed with every cubiculary virtue.
  modern: In the palace of a certain king there stood an incomparable bed.
  ryder: Book I, Leap and Creep
1.275+4:
  text: In a corner of its coverlet lived a female louse named Creep.
  modern: In a corner of its coverlet lived a female louse, Mandavisarpiṇī (Creep).
  ryder: Book I, Leap and Creep
1.275+5:
  text: Surrounded by a thriving family of sons and daughters, with the sons and daughters of sons and daughters, and with more remote descendants, she drank the king's blood as he slept. On this diet she grew plump and handsome.
  modern: Surrounded by her many children and grandchildren, she drank the king's blood while he slept. On this diet she grew fat and healthy.
