  text: 'Straightway water was brought from various holy streams; a bouquet of one hundred and eight roots was provided, including the one marked with a wheel and the yellow-stemmed lotus; and the lion-throne was set in place. Moreover, there was drawn on the ground a relief map of the seven continents, oceans, and mountains. A tiger-skin was spread. Golden jars were filled with five twigs, blossoms and grains; oblations were prepared; the most eminent bards chanted poetry. Furthermore, Brahmans, skilled in reciting the four Vedas, also chanted, while maidens sang songs, sweet holiday songs being their specialty. In the forefront was prepared a vessel of consecrated rice set off with white mustard, parched grain, rice-grains, yellow pigment, wreaths of flowers, conch-shells, and so forth. The materials for lustration ceremonies were provided, and holiday drums rumbled. In the midst of a consecrated spot strewn with potash stood the lion-throne, adorned by the person of the owl as he waited
    the anointing. At that moment a crow came into the assembly from nobody knew where, announcing his entrance with a raucous caw. And he thought: "Well, well! What means this gathering of all the birds, and this great festival ?" But when the birds saw him, they whispered together:'
  modern: 'Water was brought from holy rivers, and a bundle of one hundred and eight medicinal roots was made ready. A lion-throne was set up, and a map of the seven continents, oceans and mountains was drawn on the ground. A tiger-skin was spread. Golden jars were filled, the bards sang, Brahmans chanted the four Vedas, and girls sang holiday songs. The ritual things were gathered, the drums sounded, and the owl sat on the throne waiting to be anointed. Then a crow came into the gathering, cawing loudly. He thought: "What is this gathering of all the birds, and this great festival?" When the birds saw him, they whispered to one another:'
