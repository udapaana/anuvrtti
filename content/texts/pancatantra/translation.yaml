3.110+12:
  text: 'Then the owl was deeply disappointed, and he said: "You monster! Why have you wronged me by preventing the regal anointing? From this day there is enmity between us.'
  modern: 'The owl was deeply disappointed, and said: "You monster! Why have you wronged me by stopping my royal anointing? From this day there is enmity between us.'
  ryder: Book III p. 322
3.110+13:
  text: 'For the proverb says:'
  modern: 'For the proverb says:'
  ryder: Book III p. 322
'3.111':
  text: 'When arrows pierce or axes wound

    A tree, it grows together sound;

    From cruel, ugly speech you feel

