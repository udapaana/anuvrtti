1.276+2:
  text: On the contrary, he who reposes on this bed must have a delightful vital fluid, just like nectar. It must be free from morbidity, since wind, bile, and phlegm are kept in harmony by constant and heedful use of potions prepared by physicians. It must be enriched by viands unctuous, tender, melting in the mouth; viands prepared from the flesh of the choicest creatures of land, water, and air, seasoned furthermore with sugar, pomegranate, ginger, and pepper. To me it seems an elixir of life.
  modern: The man who sleeps on this bed must have blood as sweet as nectar. It is healthy, because the king's physicians keep his wind, bile and phlegm in balance. It is rich with rich food, meat from the best creatures of land, water and air, flavored with sugar, pomegranate, ginger and pepper. To me it is an elixir of life.
