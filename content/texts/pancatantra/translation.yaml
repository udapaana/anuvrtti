  text: 'So Water-Foot said: "My dear Slow-Poison, why don''t you carry us nicely, as you did before?"'
  modern: 'Jalapāda said: "My dear Mandaviṣa, why do you not carry us well today, as you did before?"'
  ryder: Book III, The Frogs That Rode Snakeback, p. 370
3.239+3:
  text: 'And Slow-Poison said: "O King, I have no carrying power today because of lack of food."'
  modern: 'Mandaviṣa said: "Sire, I have no strength to carry you today, for want of food."'
  ryder: Book III, The Frogs That Rode Snakeback, p. 370
3.239+4:
  text: '"My dear fellow," said the king, "eat the plebeian frogs."'
  modern: '"My friend," said the king, "eat the common frogs."'
  ryder: Book III, The Frogs That Rode Snakeback, p. 370
3.239+5:
  text: 'When Slow-Poison heard this, he quivered with joy in every member and made haste to say: "Why, that is a part of the curse laid on me by the Brahman.'
  modern: 'When Mandaviṣa heard this, he trembled with joy all over and quickly said: "That is part of the curse the Brahman laid on me.'
  ryder: Book III, The Frogs That Rode Snakeback, p. 370
3.239+6:
  text: For that reason I am greatly pleased at your command."
  modern: So I am very pleased by your command."
  ryder: Book III, The Frogs That Rode Snakeback, p. 370
3.239+7:
  text: So he ate frogs uninterruptedly, and in a very few days he grew strong.
  modern: So he ate frogs without stopping, and in a few days he grew strong.
  ryder: Book III, The Frogs That Rode Snakeback, p. 370
3.239+8:
  text: 'And with delight and inner laughter he said:'
  modern: 'Delighted, and laughing inwardly, he said:'
  ryder: Book III, The Frogs That Rode Snakeback, p. 370
'3.240':
  text: 'The trick was good. All sorts of frogs

    Within my power have passed.

    The only question that remains,

    Is: How long will they last?'
  modern: The trick worked well, and many kinds of frogs have come into my power. The only question is how long they will last.
  ryder: Book III, The Frogs That Rode Snakeback, p. 370
3.240+1:
  text: Water-Foot, for his part, was befooled by Slow-Poison's plausibilities, and did not notice a thing.
  modern: Jalapāda, taken in by Mandaviṣa's smooth talk, noticed nothing.
  ryder: Book III, The Frogs That Rode Snakeback, p. 370
3.240+2:
  text: At this moment another black snake, a tremendous fellow, arrived on the scene.
  modern: Just then another black snake, a huge one, came to the spot.
  ryder: Book III, The Frogs That Rode Snakeback, p. 370
3.240+3:
  text: And being amazed at the sight of Slow-Poison used as a vehicle by frogs,
  modern: Amazed to see Mandaviṣa carried by frogs,
  ryder: Book III, The Frogs That Rode Snakeback, p. 370
3.240+4:
  text: 'he said: "Partner, they are our natural food, yet they use you as a vehicle.'
  modern: 'he said: "Partner, they are our natural food, yet they use you as a vehicle.'
  ryder: Book III, The Frogs That Rode Snakeback, p. 370
3.240+5:
  text: This is repellent."
  modern: This is disgusting."
  ryder: Book III, The Frogs That Rode Snakeback, p. 370
3.240+6:
  text: 'And Slow-Poison said:'
  modern: 'Mandaviṣa said:'
  ryder: Book III, The Frogs That Rode Snakeback, p. 370
'3.241':
  text: 'I know I should not carry frogs;

    I have it well in mind;

    But I am marking time, as did

    The Brahman butter-blind.'
  modern: I know I should not carry frogs. I know it well. But I am waiting, as the Brahman did who was blind with ghee.
  ryder: Book III, The Frogs That Rode Snakeback, p. 370
3.241+1:
  text: '"How was that?" asked the snake.'
  modern: 'The other snake asked: "How is that?"'
  ryder: Book III, The Butter-Blinded Brahman, p. 370
3.241+2:
  text: And Slow-Poison told the story of THE BUTTER-BLINDED BRAHMAN.
  modern: Mandaviṣa told the story of the Brahman who was blinded by butter.
  ryder: Book III, The Butter-Blinded Brahman, p. 370
3.241+3:
  text: There was once a Brahman named Theodore in a certain town.
  modern: In a certain place there was a Brahman named Yajñadatta (Theodore).
  ryder: Book III, The Butter-Blinded Brahman, p. 370
3.241+4:
  text: His wife, being unchaste and a pursuer of other men, was forever making cakes with sugar and butter for a lover, and so cheating her husband.
  modern: His wife was unfaithful and ran after other men. She kept making cakes of sugar and butter for a lover, and so cheated her husband.
  ryder: Book III, The Butter-Blinded Brahman, pp. 370–71
3.241+5:
  text: 'Now one day her husband saw her and said: "My dear wife, what are you cooking? And where are you forever carrying cakes? Tell the truth."'
  modern: 'One day her husband saw her and said: "Dear wife, what are you cooking? Where are you always taking these cakes? Tell me the truth."'
  ryder: Book III, The Butter-Blinded Brahman, p. 371
3.241+6:
  text: 'But her impudence was equal to the occasion, and she lied to her husband: "There is a shrine of the blessed goddess not far from here.'
  modern: 'She was quick to lie, and told her husband: "There is a shrine of the blessed goddess not far from here.'
  ryder: Book III, The Butter-Blinded Brahman, p. 371
3.241+7:
  text: There I have undertaken a fasting ceremony, and I take an offering, including the most delicious dishes."
  modern: I am keeping a fast there, and I make an offering of the finest dishes."
  ryder: Book III, The Butter-Blinded Brahman, p. 371
3.241+8:
  text: Then she took the cakes before his very eyes and started for the shrine of the goddess,
  modern: She took the cakes in front of him and set off for the goddess's shrine,
  ryder: Book III, The Butter-Blinded Brahman, p. 371
3.241+9:
  text: 'imagining that after her statement, her husband would believe it was for the goddess that his wife was daily providing delicious dishes. Having reached the shrine, she went down to the river to perform the ceremonial bath.

    Meanwhile her husband arrived by another road and hid behind the statue of the goddess.'
  modern: thinking that after what she had said, her husband would believe she made fine dishes every day for the goddess. At the shrine she went down to the river to bathe. Meanwhile her husband came by another road and hid behind the goddess's statue.
  ryder: Book III, The Butter-Blinded Brahman, p. 371
3.241+10:
  text: 'And his wife entered the shrine after her bath, performed the various rites — laving, anointing, giving incense, making an offering, and so on — bowed before the goddess, and prayed: "O blessed one, how may my husband be made blind?"'
  modern: 'After her bath, she entered the shrine, performed the rites of washing, anointing, incense, and offering, bowed to the goddess, and prayed: "O blessed one, how can my husband be made blind?"'
  ryder: Book III, The Butter-Blinded Brahman, p. 371
3.241+11:
  text: 'Then the Brahman behind the goddess'' back spoke, disguising his natural tone: "If you never stop giving him such food as butter and butter-cakes, then he will presently go blind."'
  modern: 'Then the Brahman behind the goddess spoke in a disguised voice: "If you never stop giving him food such as butter and butter-cakes, he will soon go blind."'
  ryder: Book III, The Butter-Blinded Brahman, p. 371
3.241+12:
  text: Now that loose female, deceived by the plausible revelation, gave the Brahman just that kind of food every day.
  modern: Deceived by this plausible answer, the loose woman gave her husband just that food every day.
  ryder: Book III, The Butter-Blinded Brahman, p. 371
3.241+13:
  text: 'One day the Brahman said: "My dear, I don''t see very well."'
  modern: 'One day the Brahman said: "Dear, I do not see very well."'
  ryder: Book III, The Butter-Blinded Brahman, p. 371
3.241+14:
  text: 'And she thought: "Thank the goddess."'
  modern: 'She thought: "Thank the goddess."'
  ryder: Book III, The Butter-Blinded Brahman, p. 371
3.241+15:
  text: 'Then the favored lover thought: "The Brahman has gone blind. What can he do to me?" Whereupon he came daily to the house without hesitation.'
  modern: 'Then her favored lover thought: "The Brahman has gone blind. What can he do to me?" So he came to the house every day without hesitation.'
  ryder: Book III, The Butter-Blinded Brahman, p. 371
3.241+16:
  text: But at last the Brahman caught him as he entered, seized him by the hair, and clubbed and kicked him to such effect that he died.
  modern: At last the Brahman caught him as he came in, seized him by the hair, and beat and kicked him until he died.
  ryder: Book III, The Butter-Blinded Brahman, p. 371
3.241+17:
  text: He also cut off his wicked wife's nose, and dismissed her.
  modern: He also cut off his wicked wife's nose and sent her away.
  ryder: Book III, The Butter-Blinded Brahman, p. 371
3.241+18:
  text: 'And that is why I say:

    Bear even foes upon your back, ....

    and the rest of it.'
  modern: 'That is why I say: "Carry even enemies on your back," and so on.'
  ryder: Book III, The Frogs That Rode Snakeback, pp. 372–73
3.241+19:
  text: Thus, O King, just as Slow-Poison destroyed the frogs through the power of intelligence, so did I destroy all the enemy.
  modern: So, King, just as Mandaviṣa destroyed the frogs by the power of his intelligence, so I destroyed the whole enemy.
  ryder: Book III, frame, p. 373
3.241+20:
  text: 'There is much wisdom in this:'
  modern: 'There is much wisdom in this:'
  ryder: Book III, frame, p. 373
'3.242':
  text: 'The forest-fire leaves roots entire,

    Though trunks remain a shell;

    The flooding pool of water cool

    Uproots the roots as well.'
  modern: A forest fire leaves the roots whole, though the trunks are burnt hollow; a flood of cool water tears out the roots as well.
  ryder: Book III, frame, p. 373
3.242+1:
  text: '"Very true," said Cloudy.'
  modern: 'Meghavarṇa said: "Very true."'
  ryder: Book III, frame, p. 373
3.242+3:
  text: 'And besides:'
  modern: 'And besides:'
  ryder: Book III, frame, p. 373
'3.243':
  text: 'This is the greatness of the great

    Whom gems of wisdom decorate;

    Despite what hurts and hinders, too,

    They see an undertaking through.'
  modern: Great men, adorned with statecraft, do not abandon what they have begun, even in calamity.
  ryder: Book III, frame, p. 373
'3.245':
  text: 'The final penny of a debt,

    The final foeman dire,

    The final twinges of disease,

    The final spark of fire —

    Finality on these imposed

    Leaves nothing to desire.'
  modern: A wise man who finishes off the last of a debt, the last enemy, the last trace of disease, and the last spark of fire, is not ruined.
  ryder: Book III, frame, p. 374
3.245+1:
  text: '"O King, you are truly fortunate. For your undertaking has had final success.'
  modern: '"Sire, you are truly fortunate. Every undertaking of yours has succeeded.'
  ryder: Book III, frame, p. 374
3.245+2:
  text: Indeed, valor is not sufficient to end a matter. Victory is wisdom's business.
  modern: Valor alone does not finish a task. Victory belongs to wisdom.
  ryder: Book III, frame, p. 374
3.245+3:
  text: 'As the proverb says:'
  modern: 'The proverb says:'
  ryder: Book III, frame, p. 374
'3.246':
  text: '''Tis not the sword destroys a foe,

    ''Tis wit that utterly lays low:

    Swords kill the body; wit destroys

    Fame, family, and regal joys.'
  modern: Enemies killed by weapons are not really dead. Enemies killed by wisdom are truly dead. A sword kills only the body, but wisdom destroys family, wealth, and fame.
  ryder: Book III, frame, p. 374
3.246+1:
  text: Thus, success comes with minimum effort to a man of wisdom and manliness.
  modern: So success comes with little effort to a man who has both wisdom and courage.
  ryder: Book III, frame, p. 374
3.246+2:
  text: For
  modern: For
  ryder: Book III, frame, p. 374
'3.247':
  text: 'Wisdom broods o''er the inception;

    Memory does not fail;

    Means appear to predilection;

    Counsels wise prevail;

    Sparkles fruitful meditation;

    Mind attains its height;

    Joy achieves its consummation

    In a worthy fight.'
  modern: Wisdom works at the start of a task. Memory stays firm. Means come to hand, and wise counsel prevails. Thought bears fruit, the mind rises, and joy is complete when the work is worthy.
  ryder: Book III, frame, p. 374
3.247+1:
  text: Thus kingship belongs to the man possessing prudence, capacity for self-sacrifice, and courage.
  modern: So kingship belongs to the man who has prudence, the readiness to give up, and courage.
  ryder: Book III, frame, p. 374
3.247+2:
  text: 'As the verse puts it:'
  modern: 'As the verse says:'
  ryder: Book III, frame, p. 374
'3.248':
  text: 'Associate in full delight

    With someone who is wise,

    Self-sacrificing, brave; thereby

    Win virtue as a prize;

    On virtue follows money; and

    On money follows fame;

    Then, personal authority;

    And then, the kingly name.'
  modern: Keep company with someone wise, self-sacrificing, and brave, and you win virtue. From virtue comes wealth, from wealth comes fame, then authority, and then the name of king.
  ryder: Book III, frame, p. 374
3.248+1:
  text: 'And Cloudy replied: "It is wonderful how immediate is the reward of knowing social ethics. By virtue of which you penetrated and exterminated Foe-Crusher with his retinue."'
  modern: 'Meghavarṇa replied: "How quick is the reward of knowing statecraft! By it you got inside and wiped out Arimardana and all his followers."'
  ryder: Book III, frame, p. 374
3.248+2:
  text: 'Whereupon Live-Strong said:'
  modern: 'Sthirajīvin said:'
  ryder: Book III, frame, p. 375
'3.249':
  text: '"Where at last you need sharp measures,

    First try gentle measures there:

    Thus the lofty, lordly tree-trunk

    Is not felled without a prayer.'
  modern: Where you finally need harsh measures, first try gentle ones. So the tall, noble tree is not cut down without a prayer.
  ryder: Book III, frame, p. 375
3.249+1:
  text: '"And yet, O my king, why say of a future matter either that it involves no effort or that it is not readily attainable?'
  modern: '"But, my king, why say of a future task that it needs no effort or that it is not easy to reach?'
  ryder: Book III, frame, p. 375
3.249+2:
  text: 'There is wisdom in the saying:'
  modern: 'There is wisdom in the saying:'
  ryder: Book III, frame, p. 375
'3.250':
  text: 'Since words with actions fail to suit,

    The timidly irresolute

    Who see a thousand checks and blocks

    Turn into public laughingstocks.'
  modern: When words do not match deeds, the timid and undecided, who see a thousand obstacles, become a laughingstock.
  ryder: Book III, frame, p. 375
3.250+1:
  text: Nor are thoughtful men heedless even in minor matters.
  modern: Nor are thoughtful men careless even in small matters.
  ryder: Book III, frame, p. 375
3.250+2:
  text: For
  modern: For
  ryder: Book III, frame, p. 375
'3.251':
  text: 'The negligent who say:

    ''Some day, some other day —

    The thing is petty, small;

    Demands no thought at all,''

    Are, heedless, headed straight

    For that repentant state

    That ever comes too late.'
  modern: Careless men who say "some day, another day, the thing is small and needs no thought" walk straight into a state of regret that always comes too late.
  ryder: Book III, frame, p. 375
3.251+1:
  text: '"But as for my master, who has overcome his foes, he may sleep tonight as soundly as ever he did.'
  modern: '"But my master has overcome his enemies, and tonight he may sleep as soundly as ever.'
  ryder: Book III, frame, p. 375
3.251+2:
  text: 'You know the saying:'
  modern: 'You know the saying:'
  ryder: Book III, frame, p. 375
'3.252':
  text: 'In houses where no snakes are found,

    One sleeps; or where the snakes are bound:

    But perfect rest is hard to win

    With serpents bobbing out and in.'
  modern: In houses with no snakes, or where the snakes are shut in, one sleeps. But rest is hard to find when snakes move in and out all the time.
  ryder: Book III, frame, p. 375
3.252+1:
  text: 'And again:'
  modern: 'And again:'
  ryder: Book III, frame, p. 375
'3.253':
  text: 'A noble purpose to attain

    Desiderates extended pain,

    Asks man''s full greatness, pluck, and care,

    And loved ones aiding with a prayer.

    Yet if it climb to heart''s desire,

    What man of pride and fighting fire,

    Of passion, and of self-esteem

    Can bear the unaccomplished dream?

    His heart indignantly is bent

    (Through its achievement) on content.'
  modern: A noble aim needs long pain, full greatness and care, and loved ones' prayers. When it is reached, what proud and fiery man, full of passion and self-respect, could bear an unfinished dream? His heart is at rest only when the work is done.
  ryder: Book III, frame, pp. 375–76
3.253+1:
  text: '"Therefore my heart is at peace. For I saw the undertaking through.'
  modern: '"So my heart is at peace. I have seen the work through.'
  ryder: Book III, frame, p. 376
3.253+2:
  text: Therefore may you now long enjoy this kingdom without a thorn — intent on the safeguarding of your people — your royal umbrella, throne, and glory unshaken through the long succession of son, grandson, and beyond.
  modern: So may you enjoy this kingdom for a long time, with no thorn left in it. Keep your people safe, and let your white umbrella, throne, and glory stand firm through sons, grandsons, and those after them.
  ryder: Book III, frame, p. 376
3.253+3:
  text: 'Remember:'
  modern: 'Remember:'
  ryder: Book III, frame, p. 376
'3.254':
  text: 'A king should bring his people ease,

    But he should also aim to please;

    His reign is else of little note,

    A neck-teat on a female goat.'
  modern: A king must keep his people at ease and must also please them. Otherwise his reign is worth as little as the teat on a goat's neck.
  ryder: Book III, frame, p. 376
'3.255':
  text: 'Love of virtue, scorn of vice,

    Wisdom — make a kingdom''s price.

    Then is Glory proud as slave,

    Then her plumes and pennons brave

    Near the white umbrella wave.'
  modern: Love of virtue, scorn of vice, and wisdom are the price of a kingdom. Then Glory serves proudly as a slave, and her plumes and banners wave beside the white umbrella.
  ryder: Book III, frame, p. 376
3.255+1:
  text: '"Nor must you, in the thought, ''My kingdom is won,'' shatter your soul with the intoxication of glory.'
  modern: '"Do not think, ''My kingdom is won,'' and let pride in your glory ruin your mind.'
  ryder: Book III, frame, p. 376
3.255+2:
  text: And this because the power of kings is a thing uncertain. Kingly glory is hard to climb as a bamboo-stem; hard to hold, being ready to tumble in a moment, with whatever effort it be held upright; even though conciliated, yet sure to slip away at last; fidgety as the bandar-log; unequilibrated as water on a lotus-leaf; mutable as the wind's path; untrustworthy as rogues' friendship; hard to tame as a serpent; gleaming but a moment like a strip of evening cloud; fragile by nature, like the bubbles on water; ungrateful as the substance of man's body; lost in the moment of attainment, like the treasure of a dream.
  modern: The power of kings is uncertain. Royal glory is as hard to climb as a bamboo stem and as hard to hold; it falls in a moment, slips away even when won, is restless as monkeys, shifts like water on a lotus leaf, changes like the wind, is as faithless as a rogue's friendship, is as hard to tame as a snake, shines only a moment like an evening cloud, breaks like bubbles on water, is as ungrateful as the body, and vanishes like treasure found in a dream.
  ryder: Book III, frame, pp. 376–77
3.255+3:
  text: 'And furthermore:'
  modern: 'And furthermore:'
  ryder: Book III, frame, p. 377
'3.256':
  text: 'Whenever kings anointed are,

    Let wit spy trouble from afar;

    Anointing-jars too often spill,

    With holy water, pending ill.'
  modern: When kings are anointed, wisdom should watch for trouble from afar. Anointing jars often spill holy water, which is a sign of trouble to come.
  ryder: Book III, frame, p. 377
3.256+1:
  text: And no man in the wide world is beyond the clutch of pending ill.
  modern: No man in the world is beyond the reach of coming trouble.
  ryder: Book III, frame, p. 377
3.256+2:
  text: 'As the poet sings:'
  modern: 'As the poet sings:'
  ryder: Book III, frame, p. 377
'3.257':
  text: 'Remember Rama, wandering far;

    Remember Nala''s sinking star;

    With Bali''s bonds, the Vrishnis'' tomb,

    And Lanka''s monster-monarch''s doom;

    The Pandus'' forest-borne disaster,

    And knightly Arjun, dancing-master.

    Time brings us woe in countless shapes.

    What savior is there? Who escapes?'
  modern: Remember Rāma wandering far, Nala's fallen star, Bali's bonds, the Vṛṣṇis' destruction, and Rāvaṇa's doom in Laṅkā. Remember the Pāṇḍavas' forest exile and Arjuna, the dancing-master. Time brings woe in countless forms. Who can save us, and who escapes?
  ryder: Book III, frame, p. 377
'3.258':
  text: 'Ah, where is Dasharath, who rose to heaven

    And dwelt its king beside?

    Ah, where King Sagar, he to whom ''twas given

    To bind the ocean''s tide?

    Where arm-born Prithu? Where is Manu gone,

    Sun-child (yet suns still rise)?

    Imperious Time awakened them at dawn,

    At evening closed their eyes.'
  modern: Where is Daśaratha, who went to heaven and sat beside Indra? Where is King Sagara, who bound the ocean's tide? Where is Vainya, born from an arm, and where is Manu, the sun's child? Time woke them at dawn and closed their eyes at evening.
  ryder: Book III, frame, p. 377
'3.259':
  text: 'Where is Mandhatar, conqueror supreme?

    Where Satyavrat, the king?

    God-ruling Nahush? Keshav, e''er the gleam

    Of science following?

    They and their lordly elephants, I ween,

    Their cars, their heavenly throne,

    By lofty Time conferred, in Time were seen,

    And lost through Time alone.'
  modern: Where is Māndhātā, conqueror supreme? Where is Satyavrata the king? Where is Nahuṣa, who ruled the gods, and Keśava, who always followed learning? They, with their great elephants, their chariots, and their heavenly thrones, were given by mighty Time, seen in Time, and lost through Time alone.
  ryder: Book III, frame, pp. 377–78
'3.260':
  text: 'And yet again:

    The king, his counselors,

    His maidens gay,

    His golden groves, Fate stings.

    They sink away.'
  modern: 'The king, his ministers, his cheerful women, and his golden groves: Fate strikes them, and they sink away.'
  ryder: Book III, frame, p. 378
3.260+1:
  text: '"Thus, having won kingly glory, quivering like the ear of a rogue elephant, take delight in her, but trust in wisdom only.'
  modern: '"So, having won royal glory, which quivers like the ear of a rogue elephant, enjoy it, but trust only in wisdom.'
  ryder: Book III, frame, p. 378
3.260+2:
  text: Here ends Book III, called "Crows and Owls," which treats of peace, war, and the other four expedients.
  modern: Here ends Book III, "Crows and Owls," which treats of peace, war, and the other four expedients.
  ryder: Book III, colophon, p. 378
3.260+3:
  text: Here, then, begins Book IV, called "Loss of Gains."
  modern: Here Book IV begins, called "Loss of Gains."
  ryder: Book IV, opening, p. 381
3.260+4:
  text: 'The first verse runs:'
  modern: 'The first verse of this book is:'
  ryder: Book IV, opening, p. 381
4.1+1:
  text: And Vishnusharman told the story of THE MONKEY AND THE CROCODILE
  modern: And Viṣṇuśarman told the story of the monkey and the crocodile.
  ryder: Book IV, p. 381
4.1+2:
  text: On the shore of the sea was a great rose-apple tree that was never without fruit. In it lived a monkey named Red-Face.
  modern: By the sea stood a great rose-apple tree that always had fruit. A monkey named Raktamukha (Red-Face) lived in it.
  ryder: Book IV, p. 381
4.1+3:
  text: (with 4.1+2)
4.1+4:
  text: Now one day a crocodile named Ugly-Mug crawled out of the ocean under the tree and burrowed in the soft sand.
  modern: One day a crocodile named Karālamukha (Ugly-Mug) came out of the sea, under the tree, and dug into the soft sand.
  ryder: Book IV, p. 381
4.1+5:
  text: 'Then Red-Face said: "You are my guest, sir. Pray eat these rose-apples which I throw you. You will find them like nectar."'
  modern: 'Raktamukha said: "Sir, you are my guest. Eat these rose-apples that I throw you. They taste like nectar."'
  ryder: Book IV, p. 381
4.1+6:
  text: (with 4.1+5)
4.1+7:
  text: 'You know the proverb:'
  modern: 'There is a saying:'
  ryder: Book IV, p. 381
'4.2':
  text: 'A fool or scholar let him be,

    Pleasant or hideous to see,

    A guest, when offerings are given,

    Is useful as a bridge to heaven.'
  modern: Whether a guest is a fool or a scholar, pleasant or ugly, when he comes at the offering he is a bridge to heaven.
  ryder: Book IV, p. 381
'4.3':
  text: 'Ask not his home or education,

    His family or reputation,

    But offer thanks and sacrifice:

    For so prescribes the lawbook wise.'
  modern: Do not ask a guest about his home, his learning, his family or his name. Honor him with thanks and offering, as the law book prescribes.
  ryder: Book IV, p. 381-382
'4.4':
  text: 'By honoring the guests who come

    Wayworn from some far-distant home

    To share the sacrifice, you go

