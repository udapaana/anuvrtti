  modern: '"Later, when your enemies are dead and you are back home, I will tell you the whole story at leisure." So Meghavarṇa and his followers took Sthirajīvin''s advice. Each seized one lit stick in his beak, flew to the cave''s gate, and threw the sticks on Sthirajīvin''s nest.'
