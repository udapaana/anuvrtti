  text: 'Thereupon his consort said: "My dear sir, the crow has found means to hold up the ceremony. And the birds have gone flying away. Only that crow, for some reason or other, remains here all alone.'
  modern: 'His wife said: "Dear sir, the crow has found a way to stop the ceremony. The birds have flown away. Only that crow, for some reason, is still here alone.'
