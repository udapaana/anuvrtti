3.104+10:
  text: My soul abhors every act of cruelty, that street-sign pointing to hell.
  modern: My soul hates every act of cruelty. It is a sign pointing to hell.
  ryder: Book III p. 320
3.104+12:
  text: 'Surely, you know the Scripture:'
  modern: 'Surely you know the Scripture:'
  ryder: Book III p. 320
'3.105':
  text: 'The holy first commandment runs —

    Not harsh, but kindly be —

    And therefore lavish mercy on

    Mosquito, louse, and flea.'
  modern: 'The holy first commandment says: be kind, not harsh. Therefore show mercy even to the mosquito, the louse and the flea.'
