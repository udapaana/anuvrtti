3.106+1:
  text: '"Nay, even those who slay living creatures in the act of sacrifice are befuddled, and their hermeneutic theology is at fault.'
  modern: '"Even those who kill living creatures at sacrifice are mistaken, and their reading of the scripture is wrong.'
