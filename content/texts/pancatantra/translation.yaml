  text: So he took a rope and set out at night. But on the way he met a fellow with a row of sharp teeth set far apart, with a high-bridged nose and uneven eyes, with limbs covered with knotty muscles, with hollow cheeks, with beard and body as yellow as a fire with much butter in it.
