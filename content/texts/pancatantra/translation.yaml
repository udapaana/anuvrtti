  text: '"Just so, you, too, being blind at night, if you take as overlord this seedy fellow who is blind in the daytime, will go the way of the rabbit and the partridge.'
  modern: '"Just so, you too are blind at night. If you take as your overlord this wretch who is blind by day, you will go the way of the rabbit and the partridge.'
