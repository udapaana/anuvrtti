  text: 'There was once a poor Brahman in a certain place. He lived on presents, and always did without such luxuries as fine clothes and ointments and perfumes and garlands and gems and betel-gum. His beard and his nails were long, and so was the hair that covered his head and his body. Heat, cold, rain, and the like had dried him up.

