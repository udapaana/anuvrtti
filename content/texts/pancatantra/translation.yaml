  text: 'Thus, pretending to build a nest, Live-Strong constructed a woodpile at the fortress gate. Then at sunrise, when the owls became blind, he hastened away and reported to Cloudy: "My lord and king, I have prepared the enemy''s cave for burning.'
  modern: 'So, pretending to build a nest, Sthirajīvin piled up a woodpile at the fort gate. At sunrise, when the owls were blind, he hurried off and reported to Meghavarṇa (Cloudy): "My lord and king, I have made the enemy''s cave ready to burn.'
