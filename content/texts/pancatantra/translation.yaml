  text: 'and began to sing: "Cave ahoy! Cave aho-o-oy!" Then after a moment''s silence, he continued in the same tone: "Hello! Don''t you remember how you and I made an agreement that I was to speak to you when I came back from the world outside, and that you were to sing out to me? But you won''t speak to me today.'
  modern: 'He began to call: "Cave ahoy! Cave aho-o-oy!" After a moment''s silence he went on in the same tone: "Hello! Don''t you remember our agreement? I was to speak to you when I came back from the outside world, and you were to call out to me. But you won''t speak to me today.'
