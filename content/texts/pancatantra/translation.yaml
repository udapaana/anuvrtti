3.106+2:
  text: (with 3.106+1)
  ryder: Book III p. 320
3.106+3:
  text: And if you object to me the passage, 'One should sacrifice with goats,' …
  modern: You may quote me the passage, 'One should sacrifice with goats.'
  ryder: Book III p. 320
