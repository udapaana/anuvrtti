  modern: '"You fool!" said the rabbit. "Don''t you know that a home is yours only while you live in it?'
  ryder: Book III p. 316
'3.94':
  text: 'Suppose beside your neighbor you

    For ten long years abide,

    What weight have learned arguments?

    Eyewitnesses decide.'
  modern: If you have lived next to a neighbour for ten years, what weight do learned arguments carry? Eyewitnesses decide.
  ryder: Book III p. 317
  departs: The Sanskrit makes ten years' visible enjoyment the proof, "not a witness nor documents" (na sākṣī nākṣarāṇi); Ryder's "Eyewitnesses decide" makes the witness it rules out the decider.
'3.95':
  text: 'The title to possession is

    A ten years'' habitation

    With men. But with the birds and beasts

    Mere present occupation.'
  modern: Among men, ownership comes from ten years of living in a place. Among birds and beasts, it comes only from present occupation.
  ryder: Book III p. 317
3.95+1:
  text: '"Hence, even supposing this apartment to be yours, still it was unoccupied when I moved in, and now it is mine."'
  modern: '"So even if this home was yours, it was empty when I moved in, and now it is mine."'
  ryder: Book III p. 317
3.95+2:
  text: '"Well, well!" replied the partridge, "if you appeal to consecrated tradition, come with me, and we will consult the specialists. It shall be yours or mine according to their decision."'
  modern: '"Very well," said the partridge, "if you appeal to sacred tradition, come with me and we will ask the experts. It will be yours or mine as they decide."'
  ryder: Book III p. 317
3.95+3:
  text: '"I will just see what comes of all this," I said to myself.'
  modern: 'I said to myself: "I will see how this law is applied."'
  ryder: Book III p. 318
3.95+4:
  text: I, too, was at their heels, out of curiosity.
  modern: Out of curiosity, I followed them.
  ryder: Book III p. 318
3.95+5:
  text: Upon hearing this, Curd-Ear, whose manner of life had been assumed for the purpose of making an easy livelihood, desired to win their confidence. He therefore gazed straight at the sun, stood on his hind-legs, lifted his fore-paws, blinked his eyes, and in order to deceive them by pious sentiments, delivered the following moral discourse. "Alas! Alas! All is vanity.
  modern: 'Hearing this, the cat Tīkṣṇadaṃṣṭra (in Ryder, Curd-Ear), who had taken up this way of life to make an easy living, wanted to win their trust. So he gazed straight at the sun, stood on his hind legs, raised his forepaws, blinked his eyes, and, to deceive them with pious words, gave this moral sermon: "Alas! Alas! All is vanity.'
  ryder: Book III p. 318
3.95+6:
  text: This fragile life passes in a moment.
  modern: This fragile life passes in a moment.
  ryder: Book III p. 318
3.95+7:
  text: Union with the beloved is an empty dream.
  modern: Union with the one we love is like a dream.
  ryder: Book III p. 318
3.95+8:
  text: Family endearments are a conjurer's trick.
  modern: Family ties are a conjurer's trick.
  ryder: Book III p. 318
3.95+9:
  text: But for the moral law, there would be no escape.
  modern: Without the moral law there is no escape.
  ryder: Book III p. 319
3.95+10:
  text: Oh, listen to Scripture!
  modern: Listen to the Scripture!
  ryder: Book III p. 319
'3.97':
  text: 'Each transitory day, O man,

    To moral living give;

    Else, like the blacksmith''s bellows, you

    Suck air, but do not live.'
  modern: Each passing day, O man, must be given to moral living. Otherwise you breathe like a blacksmith's bellows, but you do not live.
  ryder: Book III p. 319
'3.98':
  text: 'Non-moral learning is a curse,

    A dog''s tail, nothing less,

    That does not save from flies and fleas,

    Nor cover nakedness.'
  modern: 'Learning without morality is a curse. It is like a dog''s tail: it does not keep off flies and fleas, nor cover nakedness.'
  ryder: Book III p. 319
'3.99':
  text: 'A rotten ear among the wheat,

    Among the birds a bat,

    Is he who spurns the moral law;

    The merest living gnat.'
  modern: A rotten ear among the wheat, a bat among birds, is one who rejects the moral law. He is no better than a gnat.
  ryder: Book III p. 319
'3.100':
  text: 'The flowers and fruit are better than the tree;

    Better than curds is butter said to be;

    Better than oil-cake, oil that trickles free;

    Better than mortal man, morality.'
  modern: Flowers and fruit are better than the tree. Butter is better than curds. Oil is better than oil-cake. Morality is better than a mortal man.
  ryder: Book III p. 319
'3.102':
  text: 'The praise of constant steadfastness

    Some wise professors sing;

    But moral earnestness is swift,

    Though many fetters cling.'
  modern: Some wise teachers praise steady firmness in all tasks. But moral earnestness works quickly, even though many chains bind us.
  ryder: Book III p. 319
'3.103':
  text: 'Forget your prosings manifold;

    The moral law is briefly told:

    To help your neighbor — this is good;

    To injure him is devilhood.'
  modern: 'Forget the many long speeches. The moral law is short: to help your neighbour is good, to harm him is evil.'
  ryder: Book III p. 319
3.104+1:
  text: 'Having listened to this moral discourse, the rabbit said: "Friend partridge, here on the river-bank is the saint who expounds the moral law. Let us ask him."'
  modern: 'After hearing this moral teaching, the rabbit said: "Partridge friend, here on the river bank is the holy man who teaches the moral law. Let us ask him."'
  ryder: Book III p. 319
3.104+2:
  text: (with 3.104+1)
  ryder: Book III p. 319
3.104+3:
  text: 'But the partridge said: "After all, he is our natural enemy.'
  modern: 'But the partridge said: "After all, he is our natural enemy.'
  ryder: Book III p. 320
3.104+4:
  text: Let us ask him from a distance."
  modern: Let us ask him from a distance.
  ryder: Book III p. 320
3.104+6:
  text: 'So together they began to question him: "O holy moralist, a dispute has arisen between us. Pray give judgment in accordance with the moral law.'
  modern: 'So together they questioned him: "Holy moralist, a dispute has arisen between us. Judge it by the moral law.'
  ryder: Book III p. 320
3.104+7:
  text: (with 3.104+6)
  ryder: Book III p. 320
3.104+8:
  text: And whichever of us is found to speak falsely, him you may eat."
  modern: And whichever of us is found to speak falsely, you may eat him."
  ryder: Book III p. 320
3.104+9:
  text: '"Dear friends," said the cat, "I implore you not to speak thus.'
  modern: '"Dear friends," said the cat, "I beg you not to speak like that.'
