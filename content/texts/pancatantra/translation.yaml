  text: 'And Live-Strong answered: "Listen. I will tell you HOW THE BIRDS PICKED A KING. Once upon a time the bird-clans gathered for consultation. There were swans and cranes and nightingales; there were peacocks, plovers, and owls; there were doves and pigeons and partridges; there were bluejays, vultures, skylarks; there were demoiselles and cuckoos and woodpeckers and many others.'
  modern: 'Sthirajīvin answered: "Listen, and I will tell you how the birds chose a king. Once the birds of every kind gathered for a meeting: swans, cranes, nightingales, peacocks, plovers, owls, doves, pigeons, partridges, jays, vultures, skylarks, and many others.'
