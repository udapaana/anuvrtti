  text: 'He, for his part, felt every limb thrill with astonishment and love, and he thought: "Gracious me! Why does she hug me tonight?" Then, peering narrowly about, he discovered the thief in a corner, and reflected: "No doubt she embraces me from fear of him." So he said to the thief: "She who always shrank from me, …'
