  modern: 'Then the captive thief thought: "In the morning, when their stomachs are cut open and the chief finds such splendid gems, the greedy villain will surely slash my belly too. So my death is certain, whatever happens. It is best, then, to offer my own stomach to the knife first, and save the very men I meant to kill.'
