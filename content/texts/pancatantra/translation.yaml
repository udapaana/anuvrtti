# Arthur W. Ryder, The Panchatantra, translated from the Sanskrit (University of Chicago Press, 1925).
# Public domain (published 1925; Ryder d. 1938). Read from archive.org panchatantra035159mbp, OCR pinned in data/sources/ocr/.
# Ryder translates Pūrṇabhadra's recension (1199); ours is a different one. So whole tales differ, many verses are his
# own or absent, and his prose is free. Every section was aligned by content, then checked against our Sanskrit and his
# text by a second pass with a stronger model: a PROSE section has his sentence where it carries the same content; a
# VERSE has his stanza only where it is plainly the same verse. Elsewhere there is no translation. A difference that is
# his recension's, not a misreading, is not noted. His words are never reworded (" … " marks a cut; OCR slips mended
# only where certain). The scan lacks pp. 140–141, 456–457 and 468–469; the sections those pages would carry have none.
# `ryder`: book, tale and page. `(with X)`: rendered in X's sentence. `modern`: his sense in plain prose, our names.
source:
  translator: Arthur W. Ryder
  title: The Panchatantra
  publisher: University of Chicago Press
  year: 1925
  archive: panchatantra035159mbp
'0.2':
  text: 'One Vishnusharman, shrewdly gleaning

    All worldly wisdom''s inner meaning,

    In these five books the charm compresses

    Of all such books the world possesses.'
  modern: Viṣṇuśarman, who had grasped the inner meaning of all worldly wisdom, put the charm of all such books in the world into these five books.
  ryder: Introduction, p. 13
0.2+1:
  text: And this is how it happened.
  modern: This is how it happened.
  ryder: Introduction, p. 13
0.2+2:
  text: In the southern country is a city called Maidens' Delight.
  modern: In the southern country there is a city called Mahilāropya (Maidens' Delight).
  ryder: Introduction, p. 13
0.2+3:
  text: There lived a king named Immortal-Power. He was familiar with all the works treating of the wise conduct of life. His feet were made dazzling by the tangle of rays of light from jewels in the diadems of mighty kings who knelt before him. He had reached the far shore of all the arts that embellish life.
  modern: A king named Amaraśakti (Immortal-Power) lived there. He knew all the works on the wise conduct of life. Mighty kings knelt before him, and the jewels in their crowns made his feet shine. He had mastered all the arts.
  ryder: Introduction, p. 13
0.2+4:
  text: This king had three sons. Their names were Rich-Power, Fierce-Power, Endless-Power, and they were supreme blockheads.
  modern: 'He had three sons: Vasuśakti (Rich-Power), Ugraśakti (Fierce-Power) and Anekaśakti (Endless-Power). They were great fools.'
  ryder: Introduction, p. 13
0.2+5:
  text: 'Now when the king perceived that they were hostile to education, he summoned his counselors and said: "Gentlemen, it is known to you that these sons of mine, being hostile to education, are lacking in discernment.'
  modern: 'The king saw that his sons hated learning. He called his ministers and said: "You know that my sons hate learning and have no judgment.'
  ryder: Introduction, p. 13
0.2+6:
  text: So when I behold them, my kingdom brings me no happiness, though all external thorns are drawn.
  modern: Seeing them, I find no joy in my kingdom, though all outside enemies are gone.
  ryder: Introduction, p. 13
0.2+7:
  text: 'For there is wisdom in the proverb:'
  modern: 'There is wisdom in the saying:'
  ryder: Introduction, p. 13
'0.3':
  text: 'Of sons unborn, or dead, or fools,

    Unborn or dead will do:

    They cause a little grief, no doubt;

    But fools, a long life through.'
  modern: A son who is never born, or who dies, is better than a fool. Those cause a little grief. A fool causes grief all his life.
  ryder: Introduction, pp. 13–14
'0.5':
  text: 'To what good purpose can a cow

    That brings no calf nor milk, be bent?

    Or why beget a son who proves

    A dunce and disobedient?'
  modern: What use is a cow that gives no calf and no milk? Why have a son who is a dunce and disobedient?
  ryder: Introduction, p. 14
0.5+1:
  text: Some means must therefore be devised to awaken their intelligence.
  modern: So a way must be found to wake their minds.
  ryder: Introduction, p. 14
0.5+4:
  text: 'And they, one after another, replied: "O King, first one learns grammar, in twelve years.'
  modern: 'And they answered, one after another: "Sire, first one learns grammar, which takes twelve years.'
  ryder: Introduction, p. 14
0.5+5:
  text: If this subject has somehow been mastered, then one masters the books on religion and practical life.
  modern: When that has been mastered, one masters the books on religion and on practical life.
  ryder: Introduction, p. 14
0.5+6:
  text: (with 0.5+5)
  ryder: Introduction, p. 14
0.5+7:
  text: Then the intelligence awakens."
  modern: Then the mind wakes."
  ryder: Introduction, p. 14
0.5+8:
  text: 'But one of their number, a counselor named Keen, said: "O King, the duration of life is limited, and the verbal sciences require much time for mastery.'
  modern: 'One of the ministers, Sumati (Keen), said: "Sire, life is short, and the sciences of words take a long time.'
  ryder: Introduction, p. 14
0.5+9:
  text: (with 0.5+8)
  ryder: Introduction, p. 14
0.5+10:
  text: Therefore let some kind of epitome be devised to wake their intelligence.
  modern: So let a short teaching be made to wake their minds.
  ryder: Introduction, p. 14
0.5+11:
  text: 'There is a proverb that says:'
  modern: 'There is a saying:'
  ryder: Introduction, p. 14
'0.6':
  text: 'Since verbal science has no final end,

    Since life is short, and obstacles impend,

    Let central facts be picked and firmly fixed,

    As swans extract the milk with water mixed.'
  modern: The science of words has no end, life is short, and obstacles threaten. So pick out the central facts and hold them fast, as swans take the milk out of milk mixed with water.
  ryder: Introduction, p. 14
0.6+1:
  text: Now there is a Brahman here named Vishnusharman, with a reputation for competence in numerous sciences.
  modern: There is a Brahman here named Viṣṇuśarman, known to be skilled in many sciences.
  ryder: Introduction, p. 14
0.6+2:
  text: Intrust the princes to him. He will certainly make them intelligent in a twinkling.
  modern: Give the princes to him. He will surely make them wise at once.
  ryder: Introduction, p. 14
0.6+3:
  text: (with 0.6+2)
  ryder: Introduction, p. 14
0.6+4:
  text: 'When the king had listened to this, he summoned Vishnusharman and said: "Holy sir, as a favor to me you must make these princes incomparable masters of the art of practical life.'
  modern: 'When the king heard this, he called Viṣṇuśarman and said: "Holy sir, do me a favor. Make these princes unmatched masters of the art of living.'
  ryder: Introduction, pp. 14–15
0.6+5:
  text: In return, I will bestow upon you a hundred land-grants.
  modern: In return I will give you a hundred grants of land.
  ryder: Introduction, p. 15
0.6+6:
  text: 'And Vishnusharman made answer to the king: "O King, listen. Here is the plain truth.'
  modern: 'Viṣṇuśarman answered the king: "Sire, listen. This is the plain truth.'
  ryder: Introduction, p. 15
0.6+7:
  text: I am not the man to sell good learning for a hundred land-grants.
  modern: I am not a man who sells good learning for a hundred grants of land.
  ryder: Introduction, p. 15
0.6+8:
  text: But if I do not, in six months' time, make the boys acquainted with the art of intelligent living, I will give up my own name.
  modern: But if in six months I do not make the boys learned in the art of living well, I will give up my own name.
  ryder: Introduction, p. 15
0.6+9:
  text: When the king, surrounded by his counselors, had listened to the Brahman's highly unconventional promise, he was penetrated with wonder, intrusted the princes to him, and experienced supreme content.
  modern: When the king and his counselors heard the Brahman's very unusual promise, they were filled with wonder. The king gave him the princes and was fully content.
  ryder: Introduction, p. 15
0.6+10:
  text: 'Meanwhile, Vishnusharman took the boys, went home, and made them learn by heart five books which he composed and called: (I) "The Loss of Friends," (II) "The Winning of Friends," (III) "Crows and Owls," (IV) "Loss of Gains," (V) "Ill-considered Action."'
  modern: 'Viṣṇuśarman took the boys home and taught them by heart five books he had composed: The Loss of Friends (Mitrabheda), The Winning of Friends (Mitrasamprāpti), Crows and Owls (Kākolūkīya), Loss of Gains (Labdhapraṇāśa), and Ill-considered Action (Aparīkṣitakāraka).'
  ryder: Introduction, p. 15
0.6+11:
  text: These the princes learned, and in six months' time they answered the prescription.
  modern: The princes learned them, and in six months they were what he had promised.
  ryder: Introduction, p. 16
0.6+12:
  text: Since that day this work on the art of intelligent living, called Panchatantra, or the "Five Books," has traveled the world, aiming at the awakening of intelligence in the young.
  modern: From that day this book on the art of living, called the Pañcatantra, or Five Books, has spread through the world to wake the minds of the young.
  ryder: Introduction, p. 16
0.6+13:
  text: 'To sum the matter up:'
  modern: 'In short:'
  ryder: Introduction, p. 16
'0.7':
  text: 'Whoever learns the work by heart,

    Or through the story-teller''s art

    Becomes acquainted,

    His life by sad defeat — although

    The king of heaven be his foe—

    Is never tainted.'
  modern: Whoever learns this work by heart, or hears it told, will never be defeated, even if the king of the gods is his enemy.
  ryder: Introduction, p. 16
0.7+3:
  text: 'Here then begins Book I, called "The Loss of Friends." The first verse runs:'
  modern: 'Here begins the first book, called The Loss of Friends. Its first verse is this:'
  ryder: Book I, frame, p. 19
0.7+4:
  text: (with 0.7+3)
  ryder: Book I, frame, p. 19
'1.1':
  text: 'The forest lion and the bull

    Were linked in friendship, growing, full:

    A jackal then estranged the friends

    For greedy and malicious ends.'
  modern: In the forest the lion and the bull were bound in a great and growing friendship. A greedy and spiteful jackal broke it up.
  ryder: Book I, frame, p. 19
1.1+1:
  text: And this is how it happened.
  modern: This is how it happened.
  ryder: Book I, frame, p. 19
1.1+2:
  text: In the southern country was a city called Maidens' Delight.
  modern: In the southern country there was a city called Mahilāropya.
  ryder: Book I, frame, p. 19
1.1+3:
  text: In this city lived a merchant named Increase. He possessed a heap of numerous virtues, and a heap of money, a result of the accumulation of merit in earlier lives.
  modern: A merchant named Vardhamāna (Increase) lived in that city. He had many virtues and much money, the result of merit gathered in earlier lives.
  ryder: Book I, frame, p. 19
1.1+4:
  text: 'As he once pondered in the dead of night, his conclusions took this form:'
  modern: 'Once, as he was thinking in the middle of the night, he came to this conclusion:'
  ryder: Book I, frame, p. 20
1.1+5:
  text: Hence, even though money be abundant, it should be increased. Riches unearned should be earned. …
  modern: So even when there is plenty of money, it should be increased. Wealth not yet earned should be earned.
  ryder: Book I, frame, p. 20
1.18+1:
  text: Having thus set his mind in order, he collected merchandise bound for the city of Mathura, assembled his servants, and after saying farewell to his parents when asterism and lunar station were auspicious, set forth from the city, with his people following and with blare of conch-shell and beat of drum preceding.
  modern: With his mind made up, he gathered goods bound for Mathurā and called his servants. At a lucky hour he said farewell to his parents and left the city, his people following and conch-shells and drums going before him.
  ryder: Book I, frame, pp. 20–21
1.18+2:
  text: To bear the yoke he had two bulls of good omen. Their names were Joyful and Lively; …
  modern: He had two bulls of good omen to pull the cart. Their names were Nandaka (Joyful) and Saṃjīvaka (Lively).
  ryder: Book I, frame, p. 21
1.18+3:
  text: Here the bull Lively was overcome, partly by the excessive weight of the wagon, partly because one foot sank helpless where far-flung water from cascades made a muddy spot. At this spot the bull somehow snapped the yoke and sank in a heap.
  modern: There the bull Saṃjīvaka gave way, partly from the heavy load of the cart, partly because one foot sank in a muddy spot made by water from the falls. There he broke the yoke and collapsed.
  ryder: Book I, frame, p. 21
1.18+4:
  text: On hearing this, merchant Increase was deeply dejected.
  modern: When he heard this, the merchant Vardhamāna was very sad.
  ryder: Book I, frame, p. 21
1.18+5:
  text: He halted for five nights, …
  modern: He stopped for five nights.
  ryder: Book I, frame, p. 21
1.19+1:
  text: 'he left caretakers with a supply of fodder, and said: "You must join me later, bringing Lively, if he lives; if he dies, after performing the last sad rites." Having given these directions, he started for his destination.'
  modern: 'He left men with a supply of fodder to look after the bull, and said: "Come after me with Saṃjīvaka if he lives. If he dies, do the last rites first." With these orders given, he set off for where he was going.'
  ryder: Book I, frame, pp. 21–22
1.19+2:
  text: On the next day, the men, fearing the many drawbacks of the forest, started also and made a false report to their master. "Poor Lively died," they said, "and we performed the last sad rites with fire and everything else."
  modern: The next day the men, afraid of the many dangers of the forest, left too and lied to their master. "Poor Saṃjīvaka died," they said, "and we performed the last rites with fire and everything else."
  ryder: Book I, frame, p. 22
1.19+3:
  text: (with 1.19+2)
  ryder: Book I, frame, p. 22
1.19+4:
  text: And the merchant, feeling grieved for a mere moment, out of gratitude performed a ceremony that included rites for the departed, …
  modern: The merchant grieved for only a moment. Out of gratitude he held a ceremony that included rites for the dead.
  ryder: Book I, frame, p. 22
1.19+5:
  text: In the meantime, Lively, since his fate willed it and further life was predestined, hobbled step by step to the bank of the Jumna, his body invigorated by a mist of spray from the cascades.
  modern: Meanwhile Saṃjīvaka, because fate willed it and he was meant to live longer, limped step by step to the bank of the Yamunā, refreshed by the spray from the falls.
  ryder: Book I, frame, p. 22
1.19+6:
  text: There he browsed on the emerald tips of grass-blades, and in a few days grew plump as Shiva's bull, high-humped, and full of energy.
  modern: There he ate the emerald tips of the grass, and in a few days he grew as plump as Śiva's bull, high-humped and full of strength.
  ryder: Book I, frame, p. 22
1.19+7:
  text: Every day he tore the tops of ant-hills with goring horns, and frisked like an elephant.
  modern: Every day he tore the tops of ant-hills with his horns, and frisked like an elephant.
  ryder: Book I, frame, p. 22
1.20+1:
  text: But one day a lion named Rusty, with a retinue of all kinds of animals, came down to the bank of the Jumna for water. There he heard Lively's prodigious bellow.
  modern: Then one day a lion named Piṅgalaka (Rusty), with all kinds of animals around him, came down to the Yamunā for water. There he heard Saṃjīvaka's huge bellow.
  ryder: Book I, frame, p. 22
1.20+2:
  text: The sound troubled his heart exceedingly, but he concealed his inner feelings while beneath a spreading banyan tree he drew up his company in what is called the Circle of Four.
  modern: The sound troubled him greatly, but he hid his feelings and drew up his company under a spreading banyan tree in the formation called the Circle of Four.
  ryder: Book I, frame, p. 22
1.20+3:
  text: 'Now the divisions of the Circle of Four are given as: (1) the lion, (2) the lion''s guard, (3) the understrappers, (4) the menials.'
  modern: 'The Circle of Four has these parts: the lion, the lion''s guard, the underlings, and the menials.'
  ryder: Book I, frame, p. 22
1.20+4:
  text: Now Rusty had in his train two jackals, sons of counselors, but out of a job. Their names were Cheek and Victor.
  modern: Piṅgalaka had two jackals in his train, sons of counselors but out of work. Their names were Karaṭaka (Cheek) and Damanaka (Victor).
  ryder: Book I, frame, p. 24
1.20+5:
  text: 'These two conferred secretly, and Victor said:'
  modern: 'The two talked in secret, and Damanaka said:'
  ryder: Book I, frame, p. 24
1.20+6:
  text: '"My dear Cheek, just look at our master Rusty. He came this way for water.'
  modern: '"My dear Karaṭaka, just look at our master Piṅgalaka. He came this way for water.'
  ryder: Book I, frame, p. 24
1.20+7:
  text: For what reason does he crouch here so disconsolate?"
  modern: Why is he crouching here so unhappy?"
  ryder: Book I, frame, pp. 24–25
1.20+8:
  text: '"Why meddle, my dear fellow?" said Cheek. "There is a saying:'
  modern: '"Why meddle, my friend?" said Karaṭaka. "There is a saying:'
  ryder: Book I, frame, p. 25
'1.21':
  text: 'Death pursues the meddling flunkey:

    Note the wedge-extracting monkey.'
  modern: 'Death follows the servant who meddles: think of the monkey who pulled out the wedge.'
  ryder: Book I, frame, p. 25
1.21+1:
  text: There was a city in a certain region. In a grove near by, a merchant was having a temple built.
  modern: Near a city, a merchant had a temple built in a grove.
  ryder: Book I, The Wedge-Pulling Monkey, p. 25
1.21+2:
  text: Each day at the noon hour the foreman and workers would go to the city for lunch.
  modern: The foreman and the workers went into the city at noon each day for their meal.
  ryder: Book I, The Wedge-Pulling Monkey, p. 25
1.21+3:
  text: (with 1.21+2)
  ryder: Book I, The Wedge-Pulling Monkey, p. 25
1.21+4:
  text: Now one day a troop of monkeys came upon the half-built temple.
  modern: One day a troop of monkeys came upon the half-built temple.
  ryder: Book I, The Wedge-Pulling Monkey, p. 25
1.21+5:
  text: There lay a tremendous anjana-log, which a mechanic had begun to split, a wedge of acacia-wood being thrust in at the top.
  modern: There lay a huge log of añjana wood that a workman had begun to split, with a wedge of acacia wood driven in at the top.
  ryder: Book I, The Wedge-Pulling Monkey, p. 25
1.21+6:
  text: There the monkeys began their playful frolics upon tree-top, lofty roof, and woodpile.
  modern: The monkeys played on the treetops, the high roof, and the timber piles.
  ryder: Book I, The Wedge-Pulling Monkey, p. 25
1.21+7:
  text: 'Then one of them, whose doom was near, thoughtlessly bestrode the log, thinking: "Who stuck a wedge in this queer place?" So he seized it with both hands and started to work it loose. Now what happened when the wedge gave at the spot where his private parts entered the cleft, that, sir, you know without being told.'
  modern: 'Then one of them, whose death was near, carelessly sat astride the log, thinking: "Who put a wedge in this odd place?" He seized it with both hands and began to work it loose. What happened when the wedge gave way where his private parts hung in the split, you know without being told.'
  ryder: Book I, The Wedge-Pulling Monkey, p. 25
1.21+8:
  text: '"And that is why I say that meddling should be avoided by the intelligent.'
  modern: That is why I say the wise avoid meddling.
  ryder: Book I, frame, p. 25
1.21+9:
  text: And you know," he continued, "that we two pick up a fair living just from his leavings."
  modern: And you know," he went on, "we two make a fair living just from his leftovers."
  ryder: Book I, frame, p. 25
1.21+10:
  text: (with 1.21+9)
  ryder: Book I, frame, p. 25
1.21+11:
  text: '"But," said Victor, "how can you give first-rate service merely from a desire for food with no desire for distinction? There is wisdom in the saying:'
  modern: '"But," said Damanaka, "how can you serve well only from wanting food, with no wish for honor? There is wisdom in the saying:'
  ryder: Book I, frame, p. 26
1.21+12:
  text: (with 1.21+11)
  ryder: Book I, frame, p. 26
1.21+13:
  text: (with 1.21+11)
  ryder: Book I, frame, p. 26
'1.22':
  text: 'In hurting foes and helping friends

    The wise perceive the proper ends

    Of serving kings. The belly''s call

    To answer, is no job at all.'
  modern: 'The wise see the right goal of serving a king: to help friends and harm enemies. To feed only the belly is no real job.'
  ryder: Book I, frame, p. 26
'1.23':
  text: 'When many lives on one depend,

    Then life is life indeed:

    A crow, with beak equipped, can fill

    His belly''s selfish need.'
  modern: Life means something when many lives depend on one. A crow with a beak can feed only its own belly.
  ryder: Book I, frame, p. 26
'1.25':
  text: 'If loving kindness be not shown

    To friends and souls in pain,

    To teachers, servants, and one''s self,

    What use in life, what gain?

    A crow will live for many years

    And eat the offered grain.'
  modern: If a man shows no kindness to friends, to those in pain, to teachers, to servants, or to himself, what use or gain is there in his life? A crow lives many years and eats the offered grain.
  ryder: Book I, frame, p. 26
'1.26':
  text: 'A tiny rill

    Is quick to fill,

    And quick a mouse''s paws;

    So seedy men

    Are grateful, when

    There is but little cause.'
  modern: A small stream fills quickly, and so do a mouse’s paws. So mean men are grateful for very little.
  ryder: Book I, frame, p. 27
1.32+1:
  text: '"But at present," said Cheek, "we two hold no job at court. So why meddle?"'
  modern: '"But at present," said Karaṭaka, "we two have no post at court. So why meddle?"'
  ryder: Book I, frame, p. 27
'1.35':
  text: '"My dear fellow," said Victor, "after a little the jobless man does hold a job. As the saying goes:

    The jobless man is hired

    For careful serving;

    The holder may be fired,

    If undeserving.'
  modern: '"My friend," said Damanaka, "in time the man without a post does get one. As the saying goes: the man without a post is hired for careful service, and the one who holds a post may be dismissed if he does not deserve it.'
  ryder: Book I, frame, pp. 27–28
'1.36':
  text: 'Though ignorant and common,

    Unworth the honoring,

    Men win to royal favor

    By standing near the king:

    For kings and vines and maidens

    To nearest neighbors cling.'
  modern: Men win the king’s favor by standing near him, even if they are ignorant, common, and not worth honoring. Kings, vines and young women cling to whoever is nearest.
  ryder: Book I, frame, p. 30
'1.37':
  text: 'The servant in his master''s face

    Discerns the signs of wrath and grace,

    And though the master jerk and tack,

    The servant slowly mounts his back.'
  modern: A servant reads the signs of anger and favor in his master's face. Even if the master bucks and twists, the servant slowly climbs onto his back.
  ryder: Book I, frame, p. 30
1.43+1:
  text: '"Well," said Cheek, "what do you wish to imply?"'
  modern: '"Well," said Karaṭaka, "what do you mean?"'
  ryder: Book I, frame, p. 28
1.43+2:
  text: 'And Victor answered: "You see, our master is frightened, his servants are frightened, …'
  modern: 'And Damanaka answered: "You see, our master is frightened, and so are his servants.'
  ryder: Book I, frame, p. 28
1.43+4:
  text: '"How can you be sure of that?" asked Cheek,'
  modern: '"How can you be sure of that?" Karaṭaka asked,'
  ryder: Book I, frame, p. 28
1.43+5:
  text: 'and Victor said: "Isn''t it plain?'
  modern: 'and Damanaka said: "Isn''t it plain?'
  ryder: Book I, frame, p. 28
'1.44':
  text: 'An ox can understand, of course,

    The spoken word; a driven horse

    Or elephant, exerts his force;

    But men of wisdom can infer

    Unuttered thought from features'' stir —

    For wit rewards its worshiper.'
  modern: An ox understands what is said to it. A horse or an elephant moves when urged. But a wise man can infer what is not said. Intelligence understands the signs of others.
  ryder: Book I, frame, p. 28
1.44+1:
  text: 'And again:'
  modern: 'And again:'
  ryder: Book I, frame, p. 28
'1.45':
  text: 'From feature, gesture, gait,

    From twitch, or word,

    From change in eye or face

    Is thought inferred.'
  modern: A person's mind shows through his looks, his gestures, his walk, his actions, his speech, and the changes in his eyes and face.
  ryder: Book I, frame, p. 28
1.45+1:
  text: So by virtue of native intelligence I intend to get him into my power this very day."
  modern: So, by my own wits, I mean to bring him under my power this very day."
  ryder: Book I, frame, p. 29
1.45+2:
  text: '"Why," said Cheek, "you do not know how to make yourself useful to a superior. So tell me. How can you establish power over him?"'
  modern: '"Why," said Karaṭaka, "you do not know how to make yourself useful to a superior. So tell me: how can you gain power over him?"'
  ryder: Book I, frame, p. 29
1.45+3:
  text: (with 1.45+2)
  ryder: Book I, frame, p. 29
1.45+4:
