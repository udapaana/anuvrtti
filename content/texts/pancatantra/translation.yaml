  text: '"Fool, fool!" answered the donkey. "Do you think me ignorant of vocal music? Listen to its systematization, as follows:

    Seven notes, three scales, and twenty-one

    Are modulations said to be;

    Of pitches there are forty-nine,

    Three measures, also pauses three;

    Caesuras three; and thirty-six

    Arrangements of the notes, in fine;

    Six apertures; the languages

    Are forty; sentiments are nine.

    One hundred songs and eighty-five

    Are found in songbooks, perfect, pure,

    With all accessories complete,

    Unblemished in their phrasing sure.

    On earth is nothing nobler found,

    Nor yet in heaven, than vocal song;

    The singing Devil soothes the Lord,

    When quivering strings the sound prolong.'
  modern: '"Fool! Do you think I do not know music? Hear its parts: seven notes, three scales, and twenty-one modes; forty-nine pitches; three measures and three pauses; three caesuras and thirty-six arrangements of the notes; six openings, forty languages, and nine sentiments. There are a hundred and eighty-five parts of song, taught long ago. Nothing is dearer than song, on earth or in heaven. Rāvaṇa won the three-eyed Lord with the delight of dry sinew strings."'
