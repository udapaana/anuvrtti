  ryder: Book III p. 292
3.3+4:
  text: What course, then, shall we adopt? There are six possibilities — peace, war, change of base, entrenchment, alliances, and duplicity.
  modern: 'So what should we do? There are six courses: peace, war, change of base, entrenchment, alliance and duplicity.'
  ryder: Book III p. 292
3.3+5:
  text: 'And they replied: "Your Majesty does well to put this question. For the saying goes:'
  modern: 'They answered: "Your Majesty is right to ask this. There is a saying:'
  ryder: Book III p. 292
3.3+6:
  text: (with 3.3+5)
  ryder: Book III p. 292
'3.4':
  text: 'Good counselors should tell their king,

    Unasked, a profitable thing;

    If asked, they should advise.

    While flatterers who shun the true

    (Which in the end is wholesome, too)

    Are foemen in disguise.'
  modern: A good counselor should tell the king a useful thing even unasked, and should advise fully when asked. A flatterer who hides the truth, though the truth would do good in the end, is an enemy in disguise.
  ryder: Book III p. 292
'3.5':
  text: (with 3.4)
  ryder: Book III p. 292
'3.6':
  text: Therefore it is now proper to confer in secret session.
  modern: So it is now right to confer in secret.
  ryder: Book III p. 292
'3.7':
  text: 'Bow your head before the great,

    Lifting it when times beseem,

    And prosperity will flow

    Ever onward, like a stream.'
  modern: Bow to the great, and lift your head again when the time is right; then prosperity will keep flowing onward like a stream.
  ryder: Book III p. 293
'3.8':
  text: 'Make your peace with powerful foes

    Who are rich and good and wise,

    Who are seasoned conquerors,

    In whose home no discords rise.'
  modern: Make peace with a powerful enemy who is rich, good and wise, who has won many victories, and whose own house is free of quarrels.
  ryder: Book III p. 293
'3.9':
  text: 'Make your peace with wicked men,

    If your life endangered be;

    Life, itself first made secure,

    Gives the realm security.'
  modern: Make peace even with a wicked man if your life is in danger. Once your life is safe, your kingdom is safe.
  ryder: Book III p. 293
'3.10':
  text: 'Make your peace with him whose wont

    ''Tis to conquer in a fight;

    Other foes will bend their necks

    To you, fearful of his might.'
  modern: Make peace with the one who is used to winning battles. Other enemies will bow to you, out of fear of his strength.
  ryder: Book III p. 293
'3.11':
  text: 'Even with equals make your peace;

    Victory is often given

    Whimsically; take no risks —

    Says the current saw in heaven.'
  modern: Make peace even with an equal, because victory is often given on a whim. Take no risks, as the saying in heaven goes.
  ryder: Book III p. 293
'3.12':
  text: 'Even with equals victory

    Whimsically may alight.

    Try three other methods first;

    Only in extremis fight.'
  modern: Victory in war is uncertain even against an equal. Try the other three means first, and fight only as a last resort.
  ryder: Book III p. 293
'3.13':
  text: 'See! The bully to whose soul

    Power is all, and peace is not,

    Clashing with an equal foe,

    Crumbles like an earthen pot.'
  modern: A bully who thinks only of power, and never of peace, will break like a clay pot when he clashes with an equal enemy.
  ryder: Book III p. 293
'3.15':
  text: 'Land and friends and gold at most

    Have been won when battles cease;

    If but one of these should fail,

    It is best to live in peace.'
  modern: A king gains land, friends and gold from war. If none of these can be won, it is better not to fight.
  ryder: Book III p. 294
'3.16':
  text: 'When a lion digs for moles

    Hiding in their pebbly house,

    He is apt to break his nails,

    And at best he gets a mouse.'
  modern: A lion who digs for moles in a house of pebbles will break his claws, and at best he will catch a mouse.
  ryder: Book III p. 294
'3.17':
  text: 'Therefore, where no prize is won

    And a healthy fight is sure,

    Never stir a quarrel, but

    Whatsoe''er the cost, endure.'
  modern: So where no gain can be won and a fight is certain, do not stir up a quarrel. Endure, whatever it costs.
  ryder: Book III p. 294
'3.18':
  text: 'By a stronger foe assailed,

    Bend as bends the river reed;

    Do not strike, as serpents do,

    If you wish your luck to speed.'
  modern: When a stronger enemy attacks you, bend like the river reed. Do not strike back like a snake, if you want your luck to last.
  ryder: Book III p. 294
'3.19':
  text: 'Imitators of the reed

    Slowly win to glory''s peak;

    But the luckless serpent-men

    Only earn the death they seek.'
  modern: Those who copy the reed slowly rise to glory. Those who act like the snake only find the death they seek.
  ryder: Book III p. 294
'3.20':
  text: 'Shrink like turtles in their shells,

    Taking blows if need there be;

    Raise your head from time to time

    Like the black snake, warily.'
  modern: Pull back like a turtle into its shell, and take blows when you must. Raise your head from time to time, carefully, like the black snake.
  ryder: Book III p. 294
'3.22':
  text: 'Never struggle with the strong

    (If you wish to know my mind)

    Who has ever seen a cloud

    Baffle the opposing wind?'
  modern: Never struggle with the strong, if you want my advice. Who has ever seen a cloud stop a wind blowing against it?
  ryder: Book III p. 294
'3.24':
  text: 'With foes unprincipled and false

    ''Tis vain to seek accommodation:

    Agreements bind them not; and soon

    They show a wicked transformation.'
  modern: Making peace with enemies who have no principles and no honesty is useless. They do not keep agreements, and soon they show their wickedness.
  ryder: Book III p. 295
3.24+1:
  text: Therefore you should, in my judgment, fight with him.
  modern: So, in my view, we should fight him.
  ryder: Book III p. 295
3.24+2:
  text: 'You know the saying:'
  modern: 'You know the saying:'
  ryder: Book III p. 295
'3.25':
  text: '''Tis easy to uproot a foe

    Contemning fighters, never steady,

    Cruel and greedy, slothful, false,

    Foolish and fearful and unready.'
  modern: An enemy who despises fighters, is never steady, is cruel, greedy, lazy, false, foolish, fearful and unready is easy to uproot.
  ryder: Book III p. 295
3.25+1:
  text: But more than this — we have been humiliated by him.
  modern: And more than that, he has humiliated us.
  ryder: Book III p. 295
3.25+2:
  text: Therefore, if you propose peace, he will be angry and will employ violence again.
  modern: So if we propose peace, he will become angrier and use violence again.
  ryder: Book III p. 295
3.25+3:
  text: 'There is a saying:'
  modern: 'There is a saying:'
  ryder: Book III p. 295
'3.26':
  text: 'The truculence of fevered foes

    By gentle measures is abetted:

    What wise physician tries a douche?

    He knows that fever should be sweated.'
  modern: Gentle measures make a fierce enemy angrier, as gentle treatment makes a fever worse. A wise doctor sweats out a fever; he does not pour water on it.
  ryder: Book III p. 295
'3.27':
  text: 'Conciliation simply makes

    A foeman''s indignation splutter,

    Like drops of water sprinkled on

    A briskly boiling pan of butter.'
  modern: Conciliation only makes an enemy's anger flare up, as drops of water sprinkled on boiling butter make it splutter.
  ryder: Book III p. 295
'3.29':
  text: 'The smaller often slays the great

    By showing energy and vigor:

    The lion kills the elephant,

    And rules with unrestricted rigor.'
  modern: A smaller one with energy and courage often kills a greater one. The lion kills the elephant and rules with unchecked power.
  ryder: Book III p. 296
'3.30':
  text: 'Foes indestructible by might

    Are slain through some deceptive gesture,

    As Bhima strangled Kichaka,

    Approaching him in woman''s vesture.'
  modern: Enemies who cannot be beaten by force can be killed by deceit, as Bhīma killed Kīcaka when he came to him disguised as a woman.
  ryder: Book III p. 296
'3.31':
  text: 'When kings are merciless as death,

    All foes are quick to knuckle under;

    Quick, too, to kill the kings who fall

    Into compassion''s fatal blunder.'
  modern: When a king is as merciless as death, his enemies quickly submit. But they also quickly kill any king who falls into the mistake of showing pity.
  ryder: Book III p. 296
'3.32':
  text: 'And he whose sun of glory sets

    Before the glory of another

    Is born in vain; he wastes for naught

    The youthful vigor of his mother.'
  modern: A man whose glory sets before another's glory was born in vain. He has wasted his mother's youth for nothing.
  ryder: Book III p. 296
'3.33':
  text: 'For Regal Splendor, unbesmeared

    With foemen''s blood as rich cosmetic,

    Though dear, is insufficient for

    Ambitions truly energetic.'
  modern: Royal glory that is not smeared with enemies' blood, like rich cosmetic, is not enough for a truly energetic king, however dear it is to him.
  ryder: Book III p. 296
'3.34':
  text: 'And in a kingdom unbedewed

    With foemen''s blood in slaughter gory,

    And hostile women''s falling tears,

    The king enjoys no living glory.'
  modern: A kingdom not wet with enemies' blood, and the falling tears of enemy women, brings the king no real glory in life.
  ryder: Book III p. 296
'3.35':
  text: 'With vicious foemen, proud of power,

    From hindering scruples free,

    Adopt a change of base, not peace

    Nor war, for victory.'
  modern: Against vicious, proud enemies who have no scruples, do not make peace or war. Choose a change of base to win.
  ryder: Book III p. 297
'3.36':
  text: 'Now change of base is known to be

    No single thing, but twin —

    Retreat, to save imperiled life;

    Invasion, planned to win.'
  modern: 'A change of base has two forms: retreat to save life, and an invasion planned to win.'
  ryder: Book III p. 297
'3.37':
  text: 'A warlike and ambitious king

    May choose ''twixt April and

    November — other months are barred —

    To invade the hostile land.'
  modern: A warlike and ambitious king may invade the enemy's land in November or April; the other months are barred.
  ryder: Book III p. 297
'3.38':
  text: 'For storming-parties — so the books

    Prescribe — all times are fair,

    If hostile forces show distress,

    And lay some weakness bare.'
  modern: The books say that all times are right for an attack, when the enemy is in trouble and has shown a weakness.
  ryder: Book III p. 297
'3.39':
  text: 'A king should put his realm in charge

    Of heroes strong and fit;

    Then pounce upon the hostile land,

    When spies have peopled it.'
  modern: A king should leave his realm in the hands of strong and fit heroes, then strike the enemy land once his spies have prepared it.
  ryder: Book III p. 297
'3.41':
  text: 'The case in hand requires, O King,

    The base-change called Retreat,

    Not peace nor war; the foe is vile,

    And very hard to beat.'
  modern: In this case, O King, the change of base called retreat is right, not peace or war. The enemy is vile and very hard to defeat.
  ryder: Book III p. 297
3.41+1:
  text: Furthermore, a recessive movement is made, says the science of ethics, with due regard to cause and effect.
  modern: The science of polity also says that a withdrawal is made for a reason, with due regard to cause and effect.
  ryder: Book III p. 297
3.41+2:
  text: 'The point is thus expressed in poetry:'
  modern: 'The point is put in verse:'
  ryder: Book III p. 297
'3.42':
  text: 'When rams draw back, their butting fiercer stings;

    The crouching king of beasts more deadly springs:

    So wise dissemblers, holding vengeance sure,

    In dumb communion with their hearts, endure.'
  modern: When a ram draws back, its next butt is harder. The lion crouches before it springs, and deadlier for it. So wise men who are sure of revenge keep quiet and endure in their hearts.
  ryder: Book III p. 298
'3.43':
  text: 'A king, abandoning his realm

    To foes of fighting worth,

    Preserves his life, as Fight-Firm did,

    And later rules the earth.'
  modern: A king who gives up his realm to a foe of great fighting strength keeps his life, as Yudhiṣṭhira (Fight-Firm) did, and later rules the earth again.
  ryder: Book III p. 298
'3.44':
  text: 'The weak who, struggling with the strong,

    Are not too proud to fight,

    Bring great rejoicing to their foes,

    And on their kinsmen, blight.'
  modern: The weak who fight the strong, and are not too proud to fight, bring their enemies great joy and ruin on their own kin.
  ryder: Book III p. 298
  departs: The Sanskrit says the weak man fights out of pride (ahaṅkṛti); Ryder's 'not too proud to fight' reverses it.
3.44+1:
  text: '"Therefore, since you are engaged with a powerful foe, there is occasion for a change of base. It is no time for peace or war.'
  modern: '"Since you are facing a powerful enemy, this is a time for a change of base. It is no time for peace or war.'
  ryder: Book III p. 298
3.44+3:
  text: 'When he had listened to this view, the king said to Live-On: "My worthy sir, pray express your opinion also.'
  modern: 'After hearing this, the king said to Prajīvana (Live-On): "Good sir, please give your opinion too.'
  ryder: Book III p. 298
3.44+4:
  text: 'And Live-On said: "O King, I disapprove of peace, war, and change of base, all three of them;'
  modern: 'Prajīvana said: "O King, I reject peace, war and change of base, all three.'
  ryder: Book III p. 298
'3.45':
  text: 'A crocodile at home

    Can beat an elephant;

    But if he goes abroad,

    A dog can make him pant.'
  modern: A crocodile in its own home can beat an elephant. But if it leaves home, a dog can make it pant.
  ryder: Book III p. 298
'3.46':
  text: 'When stronger foes attack,

    Close in your fortress stay;

    But sally to relieve

    Your friends, and save the day.'
  modern: When stronger enemies attack, stay shut in your fort. But go out to relieve your friends and save the day.
  ryder: Book III p. 298
  departs: The Sanskrit has the besieged king call on his friends to free him (suhṛd-āhvānaṃ … ātma-vimuktaye); Ryder has him sally out to relieve them.
'3.47':
  text: 'If, panic-struck, you flee

    When foes are at the door,

    And leave the land to them,

    You ne''er will see it more.'
  modern: If you flee in panic when the enemy is at your gate, and leave the land to them, you will never see it again.
  ryder: Book III p. 299
'3.49':
  text: 'One man, entrenched, can hold

    A hundred foes at bay

    (Strong foes at that), therefore

    In your entrenchment stay.'
  modern: One man inside his own fort can hold off a hundred enemies, even strong ones. So stay in your entrenchment.
  ryder: Book III p. 299
'3.50':
  text: 'Therefore provide your fort

    With shaft and gun; adorn

    It well with moat and wall,

    And store abundant corn.'
  modern: So equip your fort with arrows and guns, adorn it well with a moat and walls, and store plenty of grain.
  ryder: Book III p. 299
3.50+1:
  text: 'Stand ever firm within,

    Resolved to do or die:

    So, living, earn renown;

    Or dead, the starry sky.'
  modern: Stay firm inside, resolved to win or die. Living, you will earn renown. Dead, you will go to the stars.
  ryder: Book III p. 299
3.50+2:
  text: (with 3.50+1)
  ryder: Book III p. 299
'3.52':
  text: 'The union of the weak

    A powerful bully stumps:

    The hostile blizzard spares

    The shrubs that grow in clumps.'
  modern: A strong bully cannot harm the weak when they stand together. The fierce wind spares the shrubs that grow in clumps.
  ryder: Book III p. 299
'3.53':
  text: 'And single trees, though huge

    And posted for defense,

    May be uprooted by

    The stout wind''s violence.'
  modern: Even a huge single tree, standing as a guard, can be uprooted by a strong wind.
  ryder: Book III p. 299
'3.54':
  text: 'While groves of trees, where each

    Receives and gives defense,

    Unitedly defy

    The wind''s fierce violence.'
  modern: Groves of trees, where each one protects and is protected by the others, stand together against the fierce wind.
  ryder: Book III p. 299
'3.55':
  text: 'Just so, one man alone,

    However brave he be,

    Is scorned by foes, who soon

    Proceed to injury.'
  modern: In the same way, one man alone, however brave, is despised by his enemies, who soon go on to harm him.
  ryder: Book III p. 300
3.55+3:
  text: 'Having listened to this view likewise, the king said to Live-Long: "My worthy sir, pray express your opinion also.'
  modern: 'After hearing this, the king said to Cirañjīvin (Live-Long): "Good sir, you too tell me your view.'
  ryder: Book III p. 300
3.55+4:
  text: 'And Live-Long said: "O King, from among the six possibilities, I recommend alliance.'
  modern: 'Cirañjīvin said: "O King, of the six courses, I think alliance is the right one.'
  ryder: Book III p. 300
3.55+5:
  text: Pray adopt that.
  modern: Please adopt it.
  ryder: Book III p. 300
3.55+6:
  text: 'For the saying goes:'
  modern: 'For there is a saying:'
  ryder: Book III p. 293
'3.56':
  text: 'Though deft and brilliant, what good end

    Can you attain without a friend?

    The fire that seems immortal will

    Die when the fanning wind is still.'
  modern: However clever and brilliant you are, what good can you reach without a friend? A fire that seems unquenchable dies when the wind stops blowing on it.
  ryder: Book III p. 300
3.57+1:
  text: '"Therefore you should stay at home and seek some competent ally, to make a counterweight against the enemy.'
  modern: '"So you should stay at home and find some capable ally, to balance the enemy.'
  ryder: Book III p. 300
3.57+2:
  text: But if you leave home and travel, no one will give you so much as a friendly word.
  modern: But if you leave home and travel, no one will give you so much as a friendly word.
  ryder: Book III p. 300
3.57+3:
  text: (with 3.57+2)
  ryder: Book III p. 300
3.57+4:
  text: 'For the proverb says:'
  modern: 'For the saying goes:'
  ryder: Book III p. 295
'3.58':
  text: 'The wind is friend to forest-fire

    And causes it to flame the higher;

    The same wind blows a candle out.

    Who cares what poor folk are about?'
  modern: The wind helps a forest fire burn higher, but the same wind blows out a small lamp. Who cares what happens to the weak?
  ryder: Book III p. 300
3.58+1:
  text: '"Nor is it even essential that the ally be powerful; the alliance even of feeble folk makes for defense.'
  modern: '"An ally does not even need to be powerful. Even a weak alliance gives protection.'
  ryder: Book III p. 300
3.58+2:
  text: (with 3.58+1)
  ryder: Book III p. 300
3.58+3:
  text: 'You know the saying:'
  modern: 'You know the saying:'
  ryder: Book III p. 295
'3.59':
  text: 'However weak, a bamboo stem

    From others takes, and gives to them

    Strength to resist uprooting: so

    Weak kings unite against a foe.'
  modern: However weak a bamboo stem is, it takes strength from others and gives them strength in return, so it resists being uprooted. Weak kings should unite against an enemy.
  ryder: Book III p. 300
3.59+1:
  text: '"And how much more so, if you have alliance with the truly great! For the poet says:'
  modern: '"And how much more so if you have an alliance with the truly great. The poet says:'
  ryder: Book III p. 300
'3.60':
  text: 'Who is there whom a friendly state

    With great folk does not elevate?

    The raindrop, hiding in a curl

    Of lotus-petal, shines like pearl.'
  modern: Who is not raised up by an alliance with great people? A raindrop resting in a lotus leaf shines like a pearl.
  ryder: Book III p. 301
3.60+1:
  text: '"Thus, O King, there is no counterweight to your enemy save in alliance. Therefore let an alliance be concluded. Such is my opinion."'
  modern: '"So, O King, there is no counterweight to your enemy except an alliance. Therefore let an alliance be made. That is my view."'
  ryder: Book III p. 301
3.60+3:
  text: After these opinions had been given, Cloudy bowed low before an ancient, farsighted counselor of his race. This was a crow who had persevered to the last page of every textbook of social ethics, and his name was Live-Strong. "Father," said the king, "I had a secret purpose in questioning the others in your very presence; namely, that you might listen to everything, and instruct me as to what is fitting.
  modern: After these views were given, Meghavarṇa bowed low before an old, wise counselor of his family. This was a crow who had studied every book of polity, and his name was Sthirajīvin (Live-Strong). "Father," said the king, "I asked the others in your presence on purpose, so that you could hear everything and advise me on what is fitting.
  ryder: Book III p. 301
3.60+4:
  text: Pray instruct me in the appropriate course of action.
  modern: Please tell me the right course of action.
  ryder: Book III p. 301
3.60+5:
  text: 'And Live-Strong said: "My son, all that these have proposed is drawn from the textbooks of social ethics, and all is highly proper, each course in its own good time.'
  modern: 'And Sthirajīvin said: "My son, all that these ministers have proposed comes from the books of polity, and all of it is proper, each course at its own time.'
  ryder: Book III p. 301
3.60+6:
  text: (with 3.60+5)
  ryder: Book III p. 301
3.60+7:
  text: But the present hour demands duplicity.
  modern: But this hour calls for duplicity.
  ryder: Book III p. 301
3.60+8:
  text: 'You have heard the saying:'
  modern: 'You have heard the saying:'
  ryder: Book III p. 301
'3.61':
  text: 'You must regard with like distrust

    Both peace and warlike measures; must

    Seek through duplicity your goal,

    With powerful foes of evil soul.'
  modern: You must distrust both peace and war alike. Against powerful enemies of evil nature, pursue your goal through duplicity.
  ryder: Book III p. 301
3.61+1:
  text: '"In this way those who themselves trust nobody and have a single eye to self-interest can win the trust of an enemy and easily destroy him.'
  modern: '"In this way, those who trust nobody and look only to their own interest can win an enemy''s trust and destroy him easily.'
  ryder: Book III p. 301
3.61+2:
  text: 'For the saying goes:'
  modern: 'For the saying goes:'
  ryder: Book III p. 297
'3.62':
  text: 'Shrewd enemies will cause a foe

    Whom they would ruin, first to grow:

    The flow of mucus by molasses

    Is first increased, but later passes.'
  modern: Clever enemies let a foe they mean to ruin grow first. Phlegm is first increased by molasses, and only later does it pass.
  ryder: Book III p. 302
'3.63':
  text: 'To foe, to false friend, to female

    (Particularly her for sale)

    The man so simple as to give

    Straightforward conduct, does not live.'
  modern: A man who is so simple as to deal straightforwardly with an enemy, a false friend, or a woman, especially a woman for sale, does not survive.
  ryder: Book III p. 302
'3.64':
  text: 'Proceed in pure straightforwardness

    With Brahmans, with the gods no less,

    With teachers, with yourself; but treat

    All other creatures to deceit.'
  modern: Be straightforward with Brahmans, with the gods, with teachers and with yourself. Deal with all other creatures by deceit.
  ryder: Book III p. 302
'3.65':
  text: 'A hermit mastering his soul

    May see life simple, see it whole;

    Not those who thirst for carnal things,

    Nor, most particularly, kings.'
  modern: A hermit who has mastered his soul can see life simply and whole. Not so those who crave worldly things, and most of all, kings.
  ryder: Book III p. 302
3.65+1:
  text: 'Strong through duplicity, you will

    Preserve your habitation still;

    For death will prove a friend in need,

    To crush a foe possessed by greed.

    "Furthermore, if a vulnerable point appears in him, you will destroy him by being aware of it.'
  modern: By duplicity you will keep your own home. Death will be a friend in need, to crush a foe ruled by greed. "Further, if you see a weak point in him, you will destroy him once you know it.
  ryder: Book III p. 302
3.65+2:
  text: 'But Cloudy said: "Father, I do not know his residence.'
  modern: 'But Meghavarṇa said: "Father, I do not know where he lives.'
  ryder: Book III p. 302
3.65+3:
  text: So how shall I become aware of a vulnerable point?"
  modern: So how can I learn his weak point?
  ryder: Book III p. 302
3.65+4:
  text: 'And Live-Strong replied: "My son, through spies I will reveal not only his dwelling, but also his vulnerable point.'
  modern: 'Sthirajīvin replied: "My son, through spies I will find out not only where he lives, but also his weak point.'
  ryder: Book III p. 302
3.65+5:
  text: For
  modern: 'Here is the reason:'
  ryder: Book III p. 296
'3.66':
  text: 'Cows see a thing by sense of smell;

    While Scripture serves the Brahman well;

    The king perceives by means of spies:

    And other creatures use their eyes.'
  modern: Cows know by smell, Brahmans by the Vedas, kings by spies, and other creatures by their eyes.
  ryder: Book III p. 303
'3.67':
  text: 'The king, well served by spies, who knows

    The functionaries of his foes,

    Who knows his retinue no less,

    Is never plunged in deep distress.'
  modern: A king who is well served by spies, who knows his enemies' officials and his own retinue, is never plunged in deep distress.
  ryder: Book III p. 303
3.67+1:
  text: 'Then Cloudy said: "Father, what are these functionaries? What is their number? And of what character are secret-service men? Pray tell me all."'
