  modern: 'One morning he set out for the city to look for food. But he saw a hunter from the neighbourhood already close to the tree, coming to trap birds. He was hideous: flat-handed and flat-footed, bare to the calf, dreadfully dark and ugly, with bloodshot eyes and his hair in a knot; dogs went with him, and he carried a snare and a club. In short, he looked like a second god of death with his noose.'
