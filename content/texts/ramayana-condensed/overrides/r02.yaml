# top of vidyut's analysis. Format: see the header of
# content/texts/pancatantra-kilotpatin/overrides.yaml.

'1.21.2':
  कृतस्वस्त्ययनं:
    split:
      - { form: कृत, lemma: कृत, member: true, gloss: 'done, performed' }
      - { form: स्वस्त्ययनम्, lemma: स्वस्त्ययन, a: द्वितीया एकवचन पुंलिङ्ग, gloss: 'a rite for welfare, blessing (कृतस्वस्त्ययन "for whom blessings have been said")' }
    note: >-
      A बहुव्रीहि in the accusative: it qualifies the son (पुत्रम्) whom
      Daśaratha hands over in the next verse.
  मात्रा:
    fix:
      1: { a: तृतीया एकवचन स्त्रीलिङ्ग, gloss: 'by (his) mother' }
  पित्रा:
    fix:
      1: { gloss: 'by (his) father' }
  दशरथेन:
    fix:
      1: { gloss: 'Daśaratha' }
  पुरोधसा:
    fix:
      1: { gloss: 'by the family priest' }
  वसिष्ठेन:
    fix:
      1: { gloss: 'Vasiṣṭha' }
  मङ्गलैरभिमन्त्रितम्:
