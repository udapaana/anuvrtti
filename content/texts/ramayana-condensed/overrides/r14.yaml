      - { form: अस्मि, lemma: अस्, a: लट् उत्तमपुरुष एकवचन परस्मैपद, gloss: "I am" }
      - { form: इति, lemma: इति, a: अव्यय, gloss: "(closing his words)" }
  याचते:
    fix:
      1: { lemma: याच्, a: चतुर्थी एकवचन पुंलिङ्ग शतृ, gloss: "to one who begs" }
    note: >-
      याचते here is not a verb but the dative of a present participle, parallel
