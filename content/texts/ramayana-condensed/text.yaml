sections:
  - id: '1.1.1'
    kind: verse
    lines:
      - "तपःस्वाध्यायनिरतं तपस्वी वाग्विदां वरम्"
      - "नारदं परिपप्रच्छ वाल्मीकिर्मुनिपुंगवम्"
    iast: "tapaḥsvādhyāyanirataṃ tapasvī vāgvidāṃ varam | nāradaṃ paripapraccha vālmīkir munipuṃgavam"
  - id: '1.1.3'
    kind: verse
    lines:
      - "चारित्रेण च को युक्तः सर्वभूतेषु को हितः"
      - "विद्वान्कः कः समर्थश्च कश्चैकप्रियदर्शनः"
    iast: "cāritreṇa ca ko yuktaḥ sarvabhūteṣu ko hitaḥ | vidvān kaḥ kaḥ samarthaś ca kaś caikapriyadarśanaḥ"
  - id: '1.1.4'
    kind: verse
    lines:
      - "आत्मवान्को जितक्रोधो द्युतिमान्कोऽनसूयकः"
      - "कस्य बिभ्यति देवाश्च जातरोषस्य संयुगे"
    iast: "ātmavān ko jitakrodho dyutimān ko 'nasūyakaḥ | kasya bibhyati devāś ca jātaroṣasya saṃyuge"
  - id: '1.1.5'
    kind: verse
    lines:
      - "एतदिच्छाम्यहं श्रोतुं परं कौतूहलं हि मे"
      - "महर्षे त्वं समर्थोऽसि ज्ञातुमेवंविधं नरम्"
    iast: "etad icchāmy ahaṃ śrotuṃ paraṃ kautūhalaṃ hi me | maharṣe tvaṃ samartho 'si jñātum evaṃvidhaṃ naram"
  - id: '1.1.6'
    kind: verse
    lines:
      - "श्रुत्वा चैतत्त्रिलोकज्ञो वाल्मीकेर्नारदो वचः"
      - "श्रूयतामिति चामन्त्र्य प्रहृष्टो वाक्यमब्रवीत्"
    iast: "śrutvā caitat trilokajño vālmīker nārado vacaḥ | śrūyatām iti cāmantrya prahṛṣṭo vākyam abravīt"
  - id: '1.1.7'
    kind: verse
    lines:
      - "बहवो दुर्लभाश्चैव ये त्वया कीर्तिता गुणाः"
      - "मुने वक्ष्याम्यहं बुद्ध्वा तैर्युक्तः श्रूयतां नरः"
    iast: "bahavo durlabhāś caiva ye tvayā kīrtitā guṇāḥ | mune vakṣyāmy ahaṃ buddhvā tair yuktaḥ śrūyatāṃ naraḥ"
  - id: '1.1.8'
    kind: verse
    lines:
      - "इक्ष्वाकुवंशप्रभवो रामो नाम जनैः श्रुतः"
      - "नियतात्मा महावीर्यो द्युतिमान्धृतिमान्वशी"
    iast: "ikṣvākuvaṃśaprabhavo rāmo nāma janaiḥ śrutaḥ | niyatātmā mahāvīryo dyutimān dhṛtimān vaśī"
  - id: '1.1.9'
    kind: verse
    lines:
      - "बुद्धिमान्नीतिमान्वाग्मी श्रीमाञ्शत्रुनिबर्हणः"
      - "विपुलांसो महाबाहुः कम्बुग्रीवो महाहनुः"
    iast: "buddhimān nītimān vāgmī śrīmāñ śatrunibarhaṇaḥ | vipulāṃso mahābāhuḥ kambugrīvo mahāhanuḥ"
  - id: '1.1.12'
    kind: verse
    lines:
      - "धर्मज्ञः सत्यसंधश्च प्रजानां च हिते रतः"
      - "यशस्वी ज्ञानसंपन्नः शुचिर्वश्यः समाधिमान्"
    iast: "dharmajñaḥ satyasaṃdhaś ca prajānāṃ ca hite rataḥ | yaśasvī jñānasaṃpannaḥ śucir vaśyaḥ samādhimān"
  - id: '1.1.13'
    kind: verse
    lines:
      - "रक्षिता जीवलोकस्य धर्मस्य परिरक्षिता"
      - "वेदवेदाङ्गतत्त्वज्ञो धनुर्वेदे च निष्ठितः"
    iast: "rakṣitā jīvalokasya dharmasya parirakṣitā | vedavedāṅgatattvajño dhanurvede ca niṣṭhitaḥ"
  - id: '1.1.15'
    kind: verse
    lines:
      - "सर्वदाभिगतः सद्भिः समुद्र इव सिन्धुभिः"
      - "आर्यः सर्वसमश्चैव सदैकप्रियदर्शनः"
    iast: "sarvadābhigataḥ sadbhiḥ samudra iva sindhubhiḥ | āryaḥ sarvasamaś caiva sadaikapriyadarśanaḥ"
  - id: '1.1.16'
    kind: verse
    lines:
      - "स च सर्वगुणोपेतः कौसल्यानन्दवर्धनः"
      - "समुद्र इव गाम्भीर्ये धैर्येण हिमवानिव"
    iast: "sa ca sarvaguṇopetaḥ kausalyānandavardhanaḥ | samudra iva gāmbhīrye dhairyeṇa himavān iva"
  - id: '1.1.18'
    kind: verse
    lines:
      - "धनदेन समस्त्यागे सत्ये धर्म इवापरः"
      - "तमेवंगुणसंपन्नं रामं सत्यपराक्रमम्"
    iast: "dhanadena samas tyāge satye dharma ivāparaḥ | tam evaṃguṇasaṃpannaṃ rāmaṃ satyaparākramam"
  - id: '1.2.1'
    kind: verse
    lines:
      - "नारदस्य तु तद्वाक्यं श्रुत्वा वाक्यविशारदः"
      - "पूजयामास धर्मात्मा सहशिष्यो महामुनिः"
    iast: "nāradasya tu tad vākyaṃ śrutvā vākyaviśāradaḥ | pūjayām āsa dharmātmā sahaśiṣyo mahāmuniḥ"
  - id: '1.2.3'
    kind: verse
    lines:
      - "स मुहूर्तं गते तस्मिन्देवलोकं मुनिस्तदा"
      - "जगाम तमसातीरं जाह्नव्यास्त्वविदूरतः"
    iast: "sa muhūrtaṃ gate tasmin devalokaṃ munis tadā | jagāma tamasātīraṃ jāhnavyās tv avidūrataḥ"
  - id: '1.2.9'
    kind: verse
    lines:
      - "तस्याभ्याशे तु मिथुनं चरन्तमनपायिनम्"
      - "ददर्श भगवांस्तत्र क्रौञ्चयोश्चारुनिस्वनम्"
    iast: "tasyābhyāśe tu mithunaṃ carantam anapāyinam | dadarśa bhagavāṃs tatra krauñcayoś cārunisvanam"
  - id: '1.2.10'
    kind: verse
    lines:
      - "तस्मात्तु मिथुनादेकं पुमांसं पापनिश्चयः"
      - "जघान वैरनिलयो निषादस्तस्य पश्यतः"
    iast: "tasmāt tu mithunād ekaṃ pumāṃsaṃ pāpaniścayaḥ | jaghāna vairanilayo niṣādas tasya paśyataḥ"
  - id: '1.2.11'
    kind: verse
    lines:
      - "तं शोणितपरीताङ्गं वेष्टमानं महीतले"
      - "भार्या तु निहतं दृष्ट्वा रुराव करुणां गिरम्"
    iast: "taṃ śoṇitaparītāṅgaṃ veṣṭamānaṃ mahītale | bhāryā tu nihataṃ dṛṣṭvā rurāva karuṇāṃ giram"
  - id: '1.2.12'
    kind: verse
    lines:
      - "तथा तु तं द्विजं दृष्ट्वा निषादेन निपातितम्"
      - "ऋषेर्धर्मात्मनस्तस्य कारुण्यं समपद्यत"
    iast: "tathā tu taṃ dvijaṃ dṛṣṭvā niṣādena nipātitam | ṛṣer dharmātmanas tasya kāruṇyaṃ samapadyata"
  - id: '1.2.14'
    kind: verse
    lines:
      - "मा निषाद प्रतिष्ठां त्वमगमः शाश्वतीः समाः"
      - "यत्क्रौञ्चमिथुनादेकमवधीः काममोहितम्"
    iast: "mā niṣāda pratiṣṭhāṃ tvam agamaḥ śāśvatīḥ samāḥ | yat krauñcamithunād ekam avadhīḥ kāmamohitam"
  - id: '1.2.16'
    kind: verse
    lines:
      - "चिन्तयन्स महाप्राज्ञश्चकार मतिमान्मतिम्"
      - "शिष्यं चैवाब्रवीद्वाक्यमिदं स मुनिपुंगवः"
    iast: "cintayan sa mahāprājñaś cakāra matimān matim | śiṣyaṃ caivābravīd vākyam idaṃ sa munipuṃgavaḥ"
  - id: '1.2.17'
    kind: verse
    lines:
      - "पादबद्धोऽक्षरसमस्तन्त्रीलयसमन्वितः"
      - "शोकार्तस्य प्रवृत्तो मे श्लोको भवतु नान्यथा"
    iast: "pādabaddho 'kṣarasamas tantrīlayasamanvitaḥ | śokārtasya pravṛtto me śloko bhavatu nānyathā"
  - id: '1.2.19'
    kind: verse
    lines:
      - "सोऽभिषेकं ततः कृत्वा तीर्थे तस्मिन्यथाविधि"
      - "तमेव चिन्तयन्नर्थमुपावर्तत वै मुनिः"
    iast: "so 'bhiṣekaṃ tataḥ kṛtvā tīrthe tasmin yathāvidhi | tam eva cintayann artham upāvartata vai muniḥ"
  - id: '1.2.29'
    kind: verse
    lines:
      - "तमुवाच ततो ब्रह्मा प्रहसन्मुनिपुंगवम्"
      - "श्लोक एव त्वया बद्धो नात्र कार्या विचारणा"
    iast: "tam uvāca tato brahmā prahasan munipuṃgavam | śloka eva tvayā baddho nātra kāryā vicāraṇā"
  - id: '1.2.31'
    kind: verse
    lines:
      - "धर्मात्मनो गुणवतो लोके रामस्य धीमतः"
      - "वृत्तं कथय धीरस्य यथा ते नारदाच्छ्रुतम्"
    iast: "dharmātmano guṇavato loke rāmasya dhīmataḥ | vṛttaṃ kathaya dhīrasya yathā te nāradāc chrutam"
  - id: '1.2.35'
    kind: verse
    lines:
      - "यावत्स्थास्यन्ति गिरयः सरितश्च महीतले"
      - "तावद्रामायणकथा लोकेषु प्रचरिष्यति"
    iast: "yāvat sthāsyanti girayaḥ saritaś ca mahītale | tāvad rāmāyaṇakathā lokeṣu pracariṣyati"
  - id: '1.4.4'
    kind: verse
    lines:
      - "कुशीलवौ तु धर्मज्ञौ राजपुत्रौ यशस्विनौ"
      - "भ्रातरौ स्वरसंपन्नौ ददर्शाश्रमवासिनौ"
    iast: "kuśīlavau tu dharmajñau rājaputrau yaśasvinau | bhrātarau svarasaṃpannau dadarśāśramavāsinau"
  - id: '1.4.10'
    kind: verse
    lines:
      - "रूपलक्षणसंपन्नौ मधुरस्वरभाषिणौ"
      - "बिम्बादिवोद्धृतौ बिम्बौ रामदेहात्तथापरौ"
    iast: "rūpalakṣaṇasaṃpannau madhurasvarabhāṣiṇau | bimbād ivoddhṛtau bimbau rāmadehāt tathāparau"
  - id: '1.5.1'
    kind: verse
    lines:
      - "सर्वापूर्वमियं येषामासीत्कृत्स्ना वसुंधरा"
      - "प्रजापतिमुपादाय नृपाणां जयशालिनाम्"
    iast: "sarvāpūrvam iyaṃ yeṣām āsīt kṛtsnā vasuṃdharā | prajāpatim upādāya nṛpāṇāṃ jayaśālinām"
  - id: '1.5.3'
    kind: verse
    lines:
      - "इक्ष्वाकूणामिदं तेषां राज्ञां वंशे महात्मनाम्"
      - "महदुत्पन्नमाख्यानं रामायणमिति श्रुतम्"
    iast: "ikṣvākūṇām idaṃ teṣāṃ rājñāṃ vaṃśe mahātmanām | mahad utpannam ākhyānaṃ rāmāyaṇam iti śrutam"
  - id: '1.5.4'
    kind: verse
    lines:
      - "तदिदं वर्तयिष्यामि सर्वं निखिलमादितः"
      - "धर्मकामार्थसहितं श्रोतव्यमनसूयया"
    iast: "tad idaṃ vartayiṣyāmi sarvaṃ nikhilam āditaḥ | dharmakāmārthasahitaṃ śrotavyam anasūyayā"
  - id: '1.5.5'
    kind: verse
    lines:
      - "कोसलो नाम मुदितः स्फीतो जनपदो महान्"
      - "निविष्टः सरयूतीरे प्रभूतधनधान्यवान्"
    iast: "kosalo nāma muditaḥ sphīto janapado mahān | niviṣṭaḥ sarayūtīre prabhūtadhanadhānyavān"
  - id: '1.5.6'
    kind: verse
    lines:
      - "अयोध्या नाम नगरी तत्रासील्लोकविश्रुता"
      - "मनुना मानवेन्द्रेण या पुरी निर्मिता स्वयम्"
    iast: "ayodhyā nāma nagarī tatrāsīl lokaviśrutā | manunā mānavendreṇa yā purī nirmitā svayam"
  - id: '1.5.9'
    kind: verse
    lines:
      - "तां तु राजा दशरथो महाराष्ट्रविवर्धनः"
      - "पुरीमावासयामास दिवि देवपतिर्यथा"
    iast: "tāṃ tu rājā daśaratho mahārāṣṭravivardhanaḥ | purīm āvāsayām āsa divi devapatir yathā"
  - id: '1.8.1'
    kind: verse
    lines:
      - "तस्य त्वेवं प्रभावस्य धर्मज्ञस्य महात्मनः"
      - "सुतार्थं तप्यमानस्य नासीद्वंशकरः सुतः"
    iast: "tasya tv evaṃ prabhāvasya dharmajñasya mahātmanaḥ | sutārthaṃ tapyamānasya nāsīd vaṃśakaraḥ sutaḥ"
  - id: '1.8.3'
    kind: verse
    lines:
      - "स निश्चितां मतिं कृत्वा यष्टव्यमिति बुद्धिमान्"
      - "मन्त्रिभिः सह धर्मात्मा सर्वैरेव कृतात्मभिः"
    iast: "sa niścitāṃ matiṃ kṛtvā yaṣṭavyam iti buddhimān | mantribhiḥ saha dharmātmā sarvair eva kṛtātmabhiḥ"
  - id: '1.11.6'
    kind: verse
    lines:
      - "सुयज्ञं वामदेवं च जाबालिमथ काश्यपम्"
      - "पुरोहितं वसिष्ठं च ये चान्ये द्विजसत्तमाः"
    iast: "suyajñaṃ vāmadevaṃ ca jābālim atha kāśyapam | purohitaṃ vasiṣṭhaṃ ca ye cānye dvijasattamāḥ"
  - id: '1.11.9'
    kind: verse
    lines:
      - "तदहं यष्टुमिच्छामि शास्त्रदृष्टेन कर्मणा"
      - "ऋषिपुत्रप्रभावेन कामान्प्राप्स्यामि चाप्यहम्"
    iast: "tad ahaṃ yaṣṭum icchāmi śāstradṛṣṭena karmaṇā | ṛṣiputraprabhāvena kāmān prāpsyāmi cāpy aham"
  - id: '1.11.10'
    kind: verse
    lines:
      - "ततः साध्विति तद्वाक्यं ब्राह्मणाः प्रत्यपूजयन्"
      - "वसिष्ठप्रमुखाः सर्वे पार्थिवस्य मुखाच्च्युतम्"
    iast: "tataḥ sādhv iti tad vākyaṃ brāhmaṇāḥ pratyapūjayan | vasiṣṭhapramukhāḥ sarve pārthivasya mukhāc cyutam"
  - id: '1.11.12'
    kind: verse
    lines:
      - "सर्वथा प्राप्यसे पुत्रांश्चतुरोऽमितविक्रमान्"
      - "यस्य ते धार्मिकी बुद्धिरियं पुत्रार्थमागता"
    iast: "sarvathā prāpyase putrāṃś caturo 'mitavikramān | yasya te dhārmikī buddhir iyaṃ putrārtham āgatā"
  - id: '1.11.13'
    kind: verse
    lines:
      - "ततः प्रीतोऽभवद्राजा श्रुत्वा तद्द्विजभाषितम्"
      - "अमात्यांश्चाब्रवीद्राजा हर्षेणेदं शुभाक्षरम्"
    iast: "tataḥ prīto 'bhavad rājā śrutvā tad dvijabhāṣitam | amātyāṃś cābravīd rājā harṣeṇedaṃ śubhākṣaram"
  - id: '1.11.14'
    kind: verse
    lines:
      - "गुरूणां वचनाच्छीघ्रं संभाराः संभ्रियन्तु मे"
      - "समर्थाधिष्ठितश्चाश्वः सोपाध्यायो विमुच्यताम्"
    iast: "gurūṇāṃ vacanāc chīghraṃ saṃbhārāḥ saṃbhriyantu me | samarthādhiṣṭhitaś cāśvaḥ sopādhyāyo vimucyatām"
  - id: '1.11.19'
    kind: verse
    lines:
      - "तथेति च ततः सर्वे मन्त्रिणः प्रत्यपूजयन्"
      - "पार्थिवेन्द्रस्य तद्वाक्यं यथाज्ञप्तमकुर्वत"
    iast: "tatheti ca tataḥ sarve mantriṇaḥ pratyapūjayan | pārthivendrasya tad vākyaṃ yathājñaptam akurvata"
  - id: '1.12.34'
    kind: verse
    lines:
      - "ततो वसिष्ठप्रमुखाः सर्व एव द्विजोत्तमाः"
      - "ऋश्यशृङ्गं पुरस्कृत्य यज्ञकर्मारभंस्तदा"
    iast: "tato vasiṣṭhapramukhāḥ sarva eva dvijottamāḥ | ṛśyaśṛṅgaṃ puraskṛtya yajñakarmārabhaṃs tadā"
  - id: '1.13.30'
    kind: verse
    lines:
      - "धूमगन्धं वपायास्तु जिघ्रति स्म नराधिपः"
      - "यथाकालं यथान्यायं निर्णुदन्पापमात्मनः"
    iast: "dhūmagandhaṃ vapāyās tu jighrati sma narādhipaḥ | yathākālaṃ yathānyāyaṃ nirṇudan pāpam ātmanaḥ"
  - id: '1.14.4'
    kind: verse
    lines:
      - "ततो देवाः सगन्धर्वाः सिद्धाश्च परमर्षयः"
      - "भागप्रतिग्रहार्थं वै समवेता यथाविधि"
    iast: "tato devāḥ sagandharvāḥ siddhāś ca paramarṣayaḥ | bhāgapratigrahārthaṃ vai samavetā yathāvidhi"
  - id: '1.14.5'
    kind: verse
    lines:
      - "ताः समेत्य यथान्यायं तस्मिन्सदसि देवताः"
      - "अब्रुवंल्लोककर्तारं ब्रह्माणं वचनं महत्"
    iast: "tāḥ sametya yathānyāyaṃ tasmin sadasi devatāḥ | abruvaṃl lokakartāraṃ brahmāṇaṃ vacanaṃ mahat"
  - id: '1.14.6'
    kind: verse
    lines:
      - "भगवंस्त्वत्प्रसादेन रावणो नाम राक्षसः"
      - "सर्वान्नो बाधते वीर्याच्छासितुं तं न शक्नुमः"
    iast: "bhagavaṃs tvatprasādena rāvaṇo nāma rākṣasaḥ | sarvānno bādhate vīryāc chāsituṃ taṃ na śaknumaḥ"
  - id: '1.15.9'
    kind: verse
    lines:
      - "ततो वै यजमानस्य पावकादतुलप्रभम्"
      - "प्रादुर्भूतं महद्भूतं महावीर्यं महाबलम्"
    iast: "tato vai yajamānasya pāvakād atulaprabham | prādurbhūtaṃ mahad bhūtaṃ mahāvīryaṃ mahābalam"
  - id: '1.15.13'
    kind: verse
    lines:
      - "दिव्यपायससंपूर्णां पात्रीं पत्नीमिव प्रियाम्"
      - "प्रगृह्य विपुलां दोर्भ्यां स्वयं मायामयीमिव"
    iast: "divyapāyasasaṃpūrṇāṃ pātrīṃ patnīm iva priyām | pragṛhya vipulāṃ dorbhyāṃ svayaṃ māyāmayīm iva"
  - id: '1.15.17'
    kind: verse
    lines:
      - "इदं तु नरशार्दूल पायसं देवनिर्मितम्"
      - "प्रजाकरं गृहाण त्वं धन्यमारोग्यवर्धनम्"
    iast: "idaṃ tu naraśārdūla pāyasaṃ devanirmitam | prajākaraṃ gṛhāṇa tvaṃ dhanyam ārogyavardhanam"
  - id: '1.15.18'
    kind: verse
    lines:
      - "भार्याणामनुरूपाणामश्नीतेति प्रयच्छ वै"
      - "तासु त्वं लप्स्यसे पुत्रान्यदर्थं यजसे नृप"
    iast: "bhāryāṇām anurūpāṇām aśnīteti prayaccha vai | tāsu tvaṃ lapsyase putrān yadarthaṃ yajase nṛpa"
  - id: '1.15.24'
    kind: verse
    lines:
      - "सोऽन्तःपुरं प्रविश्यैव कौसल्यामिदमब्रवीत्"
      - "पायसं प्रतिगृह्णीष्व पुत्रीयं त्विदमात्मनः"
    iast: "so 'ntaḥpuraṃ praviśyaiva kausalyām idam abravīt | pāyasaṃ pratigṛhṇīṣva putrīyaṃ tv idam ātmanaḥ"
  - id: '1.15.25'
    kind: verse
    lines:
      - "कौसल्यायै नरपतिः पायसार्धं ददौ तदा"
      - "अर्धादर्धं ददौ चापि सुमित्रायै नराधिपः"
      - "कैकेय्यै चावशिष्टार्धं ददौ पुत्रार्थकारणात्"
    iast: "kausalyāyai narapatiḥ pāyasārdhaṃ dadau tadā | ardhād ardhaṃ dadau cāpi sumitrāyai narādhipaḥ | kaikeyyai cāvaśiṣṭārdhaṃ dadau putrārthakāraṇāt"
  - id: '1.15.26'
    kind: verse
    lines:
      - "प्रददौ चावशिष्टार्धं पायसस्यामृतोपमम्"
      - "अनुचिन्त्य सुमित्रायै पुनरेव महीपतिः"
    iast: "pradadau cāvaśiṣṭārdhaṃ pāyasasyāmṛtopamam | anucintya sumitrāyai punar eva mahīpatiḥ"
  - id: '1.16.1'
    kind: verse
    lines:
      - "पुत्रत्वं तु गते विष्णौ राज्ञस्तस्य महात्मनः"
      - "उवाच देवताः सर्वाः स्वयम्भूर्भगवानिदम्"
    iast: "putratvaṃ tu gate viṣṇau rājñas tasya mahātmanaḥ | uvāca devatāḥ sarvāḥ svayambhūr bhagavān idam"
  - id: '1.16.7'
    kind: verse
    lines:
      - "ते तथोक्ता भगवता तत्प्रतिश्रुत्य शासनम्"
      - "जनयामासुरेवं ते पुत्रान्वानररूपिणः"
    iast: "te tathoktā bhagavatā tat pratiśrutya śāsanam | janayām āsur evaṃ te putrān vānararūpiṇaḥ"
  - id: '1.17.1'
    kind: verse
    lines:
      - "निर्वृत्ते तु क्रतौ तस्मिन्हयमेधे महात्मनः"
      - "प्रतिगृह्य सुरा भागान्प्रतिजग्मुर्यथागतम्"
    iast: "nirvṛtte tu kratau tasmin hayamedhe mahātmanaḥ | pratigṛhya surā bhāgān pratijagmur yathāgatam"
  - id: '1.17.8'
    kind: verse
    lines:
      - "भरतो नाम कैकेय्यां जज्ञे सत्यपराक्रमः"
      - "साक्षाद्विष्णोश्चतुर्भागः सर्वैः समुदितो गुणैः"
    iast: "bharato nāma kaikeyyāṃ jajñe satyaparākramaḥ | sākṣād viṣṇoś caturbhāgaḥ sarvaiḥ samudito guṇaiḥ"
  - id: '1.17.9'
    kind: verse
    lines:
      - "अथ लक्ष्मणशत्रुघ्नौ सुमित्राजनयत्सुतौ"
      - "वीरौ सर्वास्त्रकुशलौ विष्णोरर्धसमन्वितौ"
    iast: "atha lakṣmaṇaśatrughnau sumitrājanayat sutau | vīrau sarvāstrakuśalau viṣṇor ardhasamanvitau"
  - id: '1.17.10'
    kind: verse
    lines:
      - "राज्ञः पुत्रा महात्मानश्चत्वारो जज्ञिरे पृथक्"
      - "गुणवन्तोऽनुरूपाश्च रुच्या प्रोष्ठपदोपमाः"
    iast: "rājñaḥ putrā mahātmānaś catvāro jajñire pṛthak | guṇavanto 'nurūpāś ca rucyā proṣṭhapadopamāḥ"
  - id: '1.17.11'
    kind: verse
    lines:
      - "अतीत्यैकादशाहं तु नाम कर्म तथाकरोत्"
      - "ज्येष्ठं रामं महात्मानं भरतं कैकयीसुतम्"
    iast: "atītyaikādaśāhaṃ tu nāma karma tathākarot | jyeṣṭhaṃ rāmaṃ mahātmānaṃ bharataṃ kaikayīsutam"
  - id: '1.17.12'
    kind: verse
    lines:
      - "सौमित्रिं लक्ष्मणमिति शत्रुघ्नमपरं तथा"
      - "वसिष्ठः परमप्रीतो नामानि कृतवांस्तदा"
      - "तेषां जन्मक्रियादीनि सर्वकर्माण्यकारयत्"
    iast: "saumitriṃ lakṣmaṇam iti śatrughnam aparaṃ tathā | vasiṣṭhaḥ paramaprīto nāmāni kṛtavāṃs tadā | teṣāṃ janmakriyādīni sarvakarmāṇy akārayat"
  - id: '1.17.16'
    kind: verse
    lines:
      - "रामस्य लोकरामस्य भ्रातुर्ज्येष्ठस्य नित्यशः"
      - "सर्वप्रियकरस्तस्य रामस्यापि शरीरतः"
    iast: "rāmasya lokarāmasya bhrātur jyeṣṭhasya nityaśaḥ | sarvapriyakaras tasya rāmasyāpi śarīrataḥ"
  - id: '1.17.20'
    kind: verse
    lines:
      - "स चतुर्भिर्महाभागैः पुत्रैर्दशरथः प्रियैः"
      - "बभूव परमप्रीतो देवैरिव पितामहः"
    iast: "sa caturbhir mahābhāgaiḥ putrair daśarathaḥ priyaiḥ | babhūva paramaprīto devair iva pitāmahaḥ"
  - id: '1.17.22'
    kind: verse
    lines:
      - "अथ राजा दशरथस्तेषां दारक्रियां प्रति"
      - "चिन्तयामास धर्मात्मा सोपाध्यायः सबान्धवः"
    iast: "atha rājā daśarathas teṣāṃ dārakriyāṃ prati | cintayām āsa dharmātmā sopādhyāyaḥ sabāndhavaḥ"
  - id: '1.17.23'
    kind: verse
    lines:
      - "तस्य चिन्तयमानस्य मन्त्रिमध्ये महात्मनः"
      - "अभ्यागच्छन्महातेजो विश्वामित्रो महामुनिः"
    iast: "tasya cintayamānasya mantrimadhye mahātmanaḥ | abhyāgacchan mahātejo viśvāmitro mahāmuniḥ"
  - id: '1.17.32'
    kind: verse
    lines:
      - "अथ हृष्टमना राजा विश्वामित्रं महामुनिम्"
      - "उवाच परमोदारो हृष्टस्तमभिपूजयन्"
    iast: "atha hṛṣṭamanā rājā viśvāmitraṃ mahāmunim | uvāca paramodāro hṛṣṭas tam abhipūjayan"
  - id: '1.17.33'
    kind: verse
    lines:
      - "यथामृतस्य संप्राप्तिर्यथा वर्षमनूदके"
      - "यथा सदृशदारेषु पुत्रजन्माप्रजस्य च"
      - "प्रनष्टस्य यथा लाभो यथा हर्षो महोदये"
      - "तथैवागमनं मन्ये स्वागतं ते महामुने"
    iast: "yathāmṛtasya saṃprāptir yathā varṣam anūdake | yathā sadṛśadāreṣu putrajanmāprajasya ca | pranaṣṭasya yathā lābho yathā harṣo mahodaye | tathaivāgamanaṃ manye svāgataṃ te mahāmune"
  - id: '1.17.34'
    kind: verse
    lines:
      - "कं च ते परमं कामं करोमि किमु हर्षितः"
      - "पात्रभूतोऽसि मे विप्र दिष्ट्या प्राप्तोऽसि धार्मिक"
      - "अद्य मे सफलं जन्म जीवितं च सुजीवितम्"
    iast: "kaṃ ca te paramaṃ kāmaṃ karomi kim u harṣitaḥ | pātrabhūto 'si me vipra diṣṭyā prāpto 'si dhārmika | adya me saphalaṃ janma jīvitaṃ ca sujīvitam"
  - id: '1.17.35'
    kind: verse
    lines:
      - "पूर्वं राजर्षिशब्देन तपसा द्योतितप्रभः"
      - "ब्रह्मर्षित्वमनुप्राप्तः पूज्योऽसि बहुधा मया"
    iast: "pūrvaṃ rājarṣiśabdena tapasā dyotitaprabhaḥ | brahmarṣitvam anuprāptaḥ pūjyo 'si bahudhā mayā"
  - id: '1.17.37'
    kind: verse
    lines:
      - "ब्रूहि यत्प्रार्थितं तुभ्यं कार्यमागमनं प्रति"
      - "इच्छाम्यनुगृहीतोऽहं त्वदर्थपरिवृद्धये"
    iast: "brūhi yat prārthitaṃ tubhyaṃ kāryam āgamanaṃ prati | icchāmy anugṛhīto 'haṃ tvadarthaparivṛddhaye"
  - id: '1.18.1'
    kind: verse
    lines:
      - "तच्छ्रुत्वा राजसिंहस्य वाक्यमद्भुतविस्तरम्"
      - "हृष्टरोमा महातेजा विश्वामित्रोऽभ्यभाषत"
    iast: "tac chrutvā rājasiṃhasya vākyam adbhutavistaram | hṛṣṭaromā mahātejā viśvāmitro 'bhyabhāṣata"
  - id: '1.18.4'
    kind: verse
    lines:
      - "अहं नियममातिष्ठ सिद्ध्यर्थं पुरुषर्षभ"
      - "तस्य विघ्नकरौ द्वौ तु राक्षसौ कामरूपिणौ"
    iast: "ahaṃ niyamam ātiṣṭha siddhyarthaṃ puruṣarṣabha | tasya vighnakarau dvau tu rākṣasau kāmarūpiṇau"
  - id: '1.18.5'
    kind: verse
    lines:
      - "व्रते मे बहुशश्चीर्णे समाप्त्यां राक्षसाविमौ"
      - "मारीचश्च सुबाहुश्च वीर्यवन्तौ सुशिक्षितौ"
      - "तौ मांसरुधिरौघेण वेदिं तामभ्यवर्षताम्"
    iast: "vrate me bahuśaś cīrṇe samāptyāṃ rākṣasāv imau | mārīcaś ca subāhuś ca vīryavantau suśikṣitau | tau māṃsarudhiraugheṇa vediṃ tām abhyavarṣatām"
  - id: '1.18.7'
    kind: verse
    lines:
      - "न च मे क्रोधमुत्स्रष्टुं बुद्धिर्भवति पार्थिव"
      - "तथाभूता हि सा चर्या न शापस्तत्र मुच्यते"
    iast: "na ca me krodham utsraṣṭuṃ buddhir bhavati pārthiva | tathābhūtā hi sā caryā na śāpas tatra mucyate"
  - id: '1.18.8'
    kind: verse
    lines:
      - "स्वपुत्रं राजशार्दूल रामं सत्यपराक्रमम्"
      - "काकपक्षधरं शूरं ज्येष्ठं मे दातुमर्हसि"
    iast: "svaputraṃ rājaśārdūla rāmaṃ satyaparākramam | kākapakṣadharaṃ śūraṃ jyeṣṭhaṃ me dātum arhasi"
  - id: '1.18.9'
    kind: verse
    lines:
      - "शक्तो ह्येष मया गुप्तो दिव्येन स्वेन तेजसा"
      - "राक्षसा ये विकर्तारस्तेषामपि विनाशने"
    iast: "śakto hy eṣa mayā gupto divyena svena tejasā | rākṣasā ye vikartāras teṣām api vināśane"
  - id: '1.18.11'
    kind: verse
    lines:
      - "न च तौ राममासाद्य शक्तौ स्थातुं कथं चन"
      - "न च तौ राघवादन्यो हन्तुमुत्सहते पुमान्"
    iast: "na ca tau rāmam āsādya śaktau sthātuṃ kathaṃ cana | na ca tau rāghavād anyo hantum utsahate pumān"
  - id: '1.18.13'
    kind: verse
    lines:
      - "न च पुत्रकृतं स्नेहं कर्तुमर्हसि पार्थिव"
      - "अहं ते प्रतिजानामि हतौ तौ विद्धि राक्षसौ"
    iast: "na ca putrakṛtaṃ snehaṃ kartum arhasi pārthiva | ahaṃ te pratijānāmi hatau tau viddhi rākṣasau"
  - id: '1.18.14'
    kind: verse
    lines:
      - "अहं वेद्मि महात्मानं रामं सत्यपराक्रमम्"
      - "वसिष्ठोऽपि महातेजा ये चेमे तपसि स्थिताः"
    iast: "ahaṃ vedmi mahātmānaṃ rāmaṃ satyaparākramam | vasiṣṭho 'pi mahātejā ye ceme tapasi sthitāḥ"
  - id: '1.19.1'
    kind: verse
    lines:
      - "तच्छ्रुत्वा राजशार्दूल विश्वामित्रस्य भाषितम्"
      - "मुहूर्तमिव निःसंज्ञः संज्ञावानिदमब्रवीत्"
    iast: "tac chrutvā rājaśārdūla viśvāmitrasya bhāṣitam | muhūrtam iva niḥsaṃjñaḥ saṃjñāvān idam abravīt"
  - id: '1.19.2'
    kind: verse
    lines:
      - "ऊनषोडशवर्षो मे रामो राजीवलोचनः"
      - "न युद्धयोग्यतामस्य पश्यामि सह राक्षसैः"
    iast: "ūnaṣoḍaśavarṣo me rāmo rājīvalocanaḥ | na yuddhayogyatām asya paśyāmi saha rākṣasaiḥ"
  - id: '1.19.3'
    kind: verse
    lines:
      - "इयमक्षौहिणी पूर्णा यस्याहं पतिरीश्वरः"
      - "अनया संवृतो गत्वा योधाहं तैर्निशाचरैः"
    iast: "iyam akṣauhiṇī pūrṇā yasyāhaṃ patir īśvaraḥ | anayā saṃvṛto gatvā yodhāhaṃ tair niśācaraiḥ"
  - id: '1.19.4'
    kind: verse
    lines:
      - "इमे शूराश्च विक्रान्ता भृत्या मेऽस्त्रविशारदाः"
      - "योग्या रक्षोगणैर्योद्धुं न रामं नेतुमर्हसि"
    iast: "ime śūrāś ca vikrāntā bhṛtyā me 'straviśāradāḥ | yogyā rakṣogaṇair yoddhuṃ na rāmaṃ netum arhasi"
  - id: '1.19.7'
    kind: verse
    lines:
      - "बालो ह्यकृतविद्यश्च न च वेत्ति बलाबलम्"
      - "न चास्त्रबलसंयुक्तो न च युद्धविशारदः"
      - "न चासौ रक्षसां योग्यः कूटयुद्धा हि ते ध्रुवम्"
    iast: "bālo hy akṛtavidyaś ca na ca vetti balābalam | na cāstrabalasaṃyukto na ca yuddhaviśāradaḥ | na cāsau rakṣasāṃ yogyaḥ kūṭayuddhā hi te dhruvam"
  - id: '1.20.9'
    kind: verse
    lines:
      - "कृतास्त्रमकृतास्त्रं वा नैनं शक्ष्यन्ति राक्षसाः"
      - "गुप्तं कुशिकपुत्रेण ज्वलनेनामृतं यथा"
    iast: "kṛtāstram akṛtāstraṃ vā nainaṃ śakṣyanti rākṣasāḥ | guptaṃ kuśikaputreṇa jvalanenāmṛtaṃ yathā"
  - id: '1.20.10'
    kind: verse
    lines:
      - "एष विग्रहवान्धर्म एष वीर्यवतां वरः"
      - "एष बुद्ध्याधिको लोके तपसश्च परायणम्"
    iast: "eṣa vigrahavān dharma eṣa vīryavatāṃ varaḥ | eṣa buddhyādhiko loke tapasaś ca parāyaṇam"
  - id: '1.20.11'
    kind: verse
    lines:
      - "एषोऽस्त्रान्विविधान्वेत्ति त्रैलोक्ये सचराचरे"
      - "नैनमन्यः पुमान्वेत्ति न च वेत्स्यन्ति के चन"
    iast: "eṣo 'strān vividhān vetti trailokye sacarācare | nainam anyaḥ pumān vetti na ca vetsyanti ke cana"
  - id: '1.21.1'
    kind: verse
    lines:
      - "तथा वसिष्ठे ब्रुवति राजा दशरथः सुतम्"
      - "प्रहृष्टवदनो राममाजुहाव सलक्ष्मणम्"
    iast: "tathā vasiṣṭhe bruvati rājā daśarathaḥ sutam | prahṛṣṭavadano rāmam ājuhāva salakṣmaṇam"
  - id: '1.21.2'
    kind: verse
    lines:
      - "कृतस्वस्त्ययनं मात्रा पित्रा दशरथेन च"
      - "पुरोधसा वसिष्ठेन मङ्गलैरभिमन्त्रितम्"
    iast: "kṛtasvastyayanaṃ mātrā pitrā daśarathena ca | purodhasā vasiṣṭhena maṅgalair abhimantritam"
  - id: '1.21.3'
    kind: verse
    lines:
      - "स पुत्रं मूर्ध्न्युपाघ्राय राजा दशरथः प्रियम्"
      - "ददौ कुशिकपुत्राय सुप्रीतेनान्तरात्मना"
    iast: "sa putraṃ mūrdhny upāghrāya rājā daśarathaḥ priyam | dadau kuśikaputrāya suprītenāntarātmanā"
  - id: '1.21.6'
    kind: verse
    lines:
      - "विश्वामित्रो ययावग्रे ततो रामो महायशाः"
      - "काकपक्षधरो धन्वी तं च सौमित्रिरन्वगात्"
    iast: "viśvāmitro yayāv agre tato rāmo mahāyaśāḥ | kākapakṣadharo dhanvī taṃ ca saumitrir anvagāt"
  - id: '1.21.9'
    kind: verse
    lines:
      - "अध्यर्धयोजनं गत्वा सरय्वा दक्षिणे तटे"
      - "रामेति मधुरा वाणीं विश्वामित्रोऽभ्यभाषत"
    iast: "adhyardhayojanaṃ gatvā sarayvā dakṣiṇe taṭe | rāmeti madhurā vāṇīṃ viśvāmitro 'bhyabhāṣata"
  - id: '1.21.10'
    kind: verse
    lines:
      - "गृहाण वत्स सलिलं मा भूत्कालस्य पर्ययः"
      - "मन्त्रग्रामं गृहाण त्वं बलामतिबलां तथा"
    iast: "gṛhāṇa vatsa salilaṃ mā bhūt kālasya paryayaḥ | mantragrāmaṃ gṛhāṇa tvaṃ balām atibalāṃ tathā"
  - id: '1.21.12'
    kind: verse
    lines:
      - "न बाह्वोः सदृशो वीर्ये पृथिव्यामस्ति कश्चन"
      - "त्रिषु लोकेषु वा राम न भवेत्सदृशस्तव"
    iast: "na bāhvoḥ sadṛśo vīrye pṛthivyām asti kaś cana | triṣu lokeṣu vā rāma na bhavet sadṛśas tava"
  - id: '1.21.18'
    kind: verse
    lines:
      - "ततो रामो जलं स्पृष्ट्वा प्रहृष्टवदनः शुचिः"
      - "प्रतिजग्राह ते विद्ये महर्षेर्भावितात्मनः"
      - "विद्यासमुदितो रामः शुशुभे भूरिविक्रमः"
    iast: "tato rāmo jalaṃ spṛṣṭvā prahṛṣṭavadanaḥ śuciḥ | pratijagrāha te vidye maharṣer bhāvitātmanaḥ | vidyāsamudito rāmaḥ śuśubhe bhūrivikramaḥ"
  - id: '1.21.19'
    kind: verse
    lines:
      - "गुरुकार्याणि सर्वाणि नियुज्य कुशिकात्मजे"
      - "ऊषुस्तां रजनीं तत्र सरय्वां सुसुखं त्रयः"
    iast: "gurukāryāṇi sarvāṇi niyujya kuśikātmaje | ūṣus tāṃ rajanīṃ tatra sarayvāṃ susukhaṃ trayaḥ"
  - id: '1.22.1'
    kind: verse
    lines:
      - "प्रभातायां तु शर्वर्यां विश्वामित्रो महामुनिः"
      - "अभ्यभाषत काकुत्स्थं शयानं पर्णसंस्तरे"
    iast: "prabhātāyāṃ tu śarvaryāṃ viśvāmitro mahāmuniḥ | abhyabhāṣata kākutsthaṃ śayānaṃ parṇasaṃstare"
  - id: '1.22.2'
    kind: verse
    lines:
      - "कौसल्या सुप्रजा राम पूर्वा संध्या प्रवर्तते"
      - "उत्तिष्ठ नरशार्दूल कर्तव्यं दैवमाह्निकम्"
    iast: "kausalyā suprajā rāma pūrvā saṃdhyā pravartate | uttiṣṭha naraśārdūla kartavyaṃ daivam āhnikam"
  - id: '1.22.3'
    kind: verse
    lines:
      - "तस्यर्षेः परमोदारं वचः श्रुत्वा नृपात्मजौ"
      - "स्नात्वा कृतोदकौ वीरौ जेपतुः परमं जपम्"
    iast: "tasyarṣeḥ paramodāraṃ vacaḥ śrutvā nṛpātmajau | snātvā kṛtodakau vīrau jepatuḥ paramaṃ japam"
  - id: '1.23.11'
    kind: verse
    lines:
      - "स वनं घोरसंकाशं दृष्ट्वा नृपवरात्मजः"
      - "अविप्रहतमैक्ष्वाकः पप्रच्छ मुनिपुंगवम्"
    iast: "sa vanaṃ ghorasaṃkāśaṃ dṛṣṭvā nṛpavarātmajaḥ | aviprahatam aikṣvākaḥ papraccha munipuṃgavam"
  - id: '1.23.12'
    kind: verse
    lines:
      - "अहो वनमिदं दुर्गं झिल्लिकागणनादितम्"
      - "भैरवैः श्वापदैः कीर्णं शकुन्तैर्दारुणारुतैः"
    iast: "aho vanam idaṃ durgaṃ jhillikāgaṇanāditam | bhairavaiḥ śvāpadaiḥ kīrṇaṃ śakuntair dāruṇārutaiḥ"
  - id: '1.23.25'
    kind: verse
    lines:
      - "ताटका नाम भद्रं ते भार्या सुन्दस्य धीमतः"
      - "मारीचो राक्षसः पुत्रो यस्याः शक्रपराक्रमः"
    iast: "tāṭakā nāma bhadraṃ te bhāryā sundasya dhīmataḥ | mārīco rākṣasaḥ putro yasyāḥ śakraparākramaḥ"
  - id: '1.23.27'
    kind: verse
    lines:
      - "सेयं पन्थानमावार्य वसत्यत्यर्धयोजने"
      - "अत एव च गन्तव्यं ताटकाया वनं यतः"
    iast: "seyaṃ panthānam āvārya vasaty atyardhayojane | ata eva ca gantavyaṃ tāṭakāyā vanaṃ yataḥ"
  - id: '1.24.13'
    kind: verse
    lines:
      - "एनां राघव दुर्वृत्तां यक्षीं परमदारुणाम्"
      - "गोब्राह्मणहितार्थाय जहि दुष्टपराक्रमाम्"
    iast: "enāṃ rāghava durvṛttāṃ yakṣīṃ paramadāruṇām | gobrāhmaṇahitārthāya jahi duṣṭaparākramām"
  - id: '1.24.16'
    kind: verse
    lines:
      - "राज्यभारनियुक्तानामेष धर्मः सनातनः"
      - "अधर्म्यां जहि काकुत्स्थ धर्मो ह्यस्या न विद्यते"
    iast: "rājyabhāraniyuktānām eṣa dharmaḥ sanātanaḥ | adharmyāṃ jahi kākutstha dharmo hy asyā na vidyate"
  - id: '1.25.2'
    kind: verse
    lines:
      - "पितुर्वचननिर्देशात्पितुर्वचनगौरवात्"
      - "वचनं कौशिकस्येति कर्तव्यमविशङ्कया"
    iast: "pitur vacananirdeśāt pitur vacanagauravāt | vacanaṃ kauśikasyeti kartavyam aviśaṅkayā"
  - id: '1.25.3'
    kind: verse
    lines:
      - "अनुशिष्टोऽस्म्ययोध्यायां गुरुमध्ये महात्मना"
      - "पित्रा दशरथेनाहं नावज्ञेयं च तद्वचः"
    iast: "anuśiṣṭo 'smy ayodhyāyāṃ gurumadhye mahātmanā | pitrā daśarathenāhaṃ nāvajñeyaṃ ca tad vacaḥ"
  - id: '1.25.5'
    kind: verse
    lines:
      - "गोब्राह्मणहितार्थाय देशस्यास्य सुखाय च"
      - "तव चैवाप्रमेयस्य वचनं कर्तुमुद्यतः"
    iast: "gobrāhmaṇahitārthāya deśasyāsya sukhāya ca | tava caivāprameyasya vacanaṃ kartum udyataḥ"
  - id: '1.25.6'
    kind: verse
    lines:
      - "एवमुक्त्वा धनुर्मध्ये बद्ध्वा मुष्टिमरिंदमः"
      - "ज्याशब्दमकरोत्तीव्रं दिशः शब्देन पूरयन्"
    iast: "evam uktvā dhanurmadhye baddhvā muṣṭim ariṃdamaḥ | jyāśabdam akarot tīvraṃ diśaḥ śabdena pūrayan"
  - id: '1.25.8'
    kind: verse
    lines:
      - "तं शब्दमभिनिध्याय राक्षसी क्रोधमूर्छिता"
      - "श्रुत्वा चाभ्यद्रवद्वेगाद्यतः शब्दो विनिःसृतः"
    iast: "taṃ śabdam abhinidhyāya rākṣasī krodhamūrchitā | śrutvā cābhyadravad vegād yataḥ śabdo viniḥsṛtaḥ"
  - id: '1.25.14'
    kind: verse
    lines:
      - "तामापतन्तीं वेगेन विक्रान्तामशनीमिव"
      - "शरेणोरसि विव्याध सा पपात ममार च"
    iast: "tām āpatantīṃ vegena vikrāntām aśanīm iva | śareṇorasi vivyādha sā papāta mamāra ca"
  - id: '1.25.21'
    kind: verse
    lines:
      - "ततो मुनिवरः प्रीतिस्ताटका वधतोषितः"
      - "मूर्ध्नि राममुपाघ्राय इदं वचनमब्रवीत्"
    iast: "tato munivaraḥ prītis tāṭakā vadhatoṣitaḥ | mūrdhni rāmam upāghrāya idaṃ vacanam abravīt"
  - id: '1.28.19'
    kind: verse
    lines:
      - "एवमुक्तो महातेजा विश्वामित्रो महामुनिः"
      - "प्रविवेश तदा दीक्षां नियतो नियतेन्द्रियः"
    iast: "evam ukto mahātejā viśvāmitro mahāmuniḥ | praviveśa tadā dīkṣāṃ niyato niyatendriyaḥ"
  - id: '1.29.7'
    kind: verse
    lines:
      - "अथ काले गते तस्मिन्षष्ठेऽहनि समागते"
      - "सौमित्रमब्रवीद्रामो यत्तो भव समाहितः"
    iast: "atha kāle gate tasmin ṣaṣṭhe 'hani samāgate | saumitram abravīd rāmo yatto bhava samāhitaḥ"
  - id: '1.29.10'
    kind: verse
    lines:
      - "आवार्य गगनं मेघो यथा प्रावृषि निर्गतः"
      - "तथा मायां विकुर्वाणौ राक्षसावभ्यधावताम्"
    iast: "āvārya gaganaṃ megho yathā prāvṛṣi nirgataḥ | tathā māyāṃ vikurvāṇau rākṣasāv abhyadhāvatām"
  - id: '1.29.12'
    kind: verse
    lines:
      - "तावापतन्तौ सहसा दृष्ट्वा राजीवलोचनः"
      - "लक्ष्मणं त्वभिसंप्रेक्ष्य रामो वचनमब्रवीत्"
    iast: "tāv āpatantau sahasā dṛṣṭvā rājīvalocanaḥ | lakṣmaṇaṃ tv abhisaṃprekṣya rāmo vacanam abravīt"
  - id: '1.29.14'
    kind: verse
    lines:
      - "मानवं परमोदारमस्त्रं परमभास्वरम्"
      - "चिक्षेप परमक्रुद्धो मारीचोरसि राघवः"
    iast: "mānavaṃ paramodāram astraṃ paramabhāsvaram | cikṣepa paramakruddho mārīcor asi rāghavaḥ"
  - id: '1.29.19'
    kind: verse
    lines:
      - "विगृह्य सुमहच्चास्त्रमाग्नेयं रघुनन्दनः"
      - "सुबाहुरसि चिक्षेप स विद्धः प्रापतद्भुवि"
    iast: "vigṛhya sumahac cāstram āgneyaṃ raghunandanaḥ | subāhur asi cikṣepa sa viddhaḥ prāpatad bhuvi"
  - id: '1.29.21'
    kind: verse
    lines:
      - "स हत्वा राक्षसान्सर्वान्यज्ञघ्नान्रघुनन्दनः"
      - "ऋषिभिः पूजितस्तत्र यथेन्द्रो विजये पुरा"
    iast: "sa hatvā rākṣasān sarvān yajñaghnān raghunandanaḥ | ṛṣibhiḥ pūjitas tatra yathendro vijaye purā"
  - id: '1.29.22'
    kind: verse
    lines:
      - "अथ यज्ञे समाप्ते तु विश्वामित्रो महामुनिः"
      - "निरीतिका दिशो दृष्ट्वा काकुत्स्थमिदमब्रवीत्"
    iast: "atha yajñe samāpte tu viśvāmitro mahāmuniḥ | nirītikā diśo dṛṣṭvā kākutstham idam abravīt"
  - id: '1.30.6'
    kind: verse
    lines:
      - "मैथिलस्य नरश्रेष्ठ जनकस्य भविष्यति"
      - "यज्ञः परमधर्मिष्ठस्तत्र यास्यामहे वयम्"
    iast: "maithilasya naraśreṣṭha janakasya bhaviṣyati | yajñaḥ paramadharmiṣṭhas tatra yāsyāmahe vayam"
  - id: '1.30.7'
    kind: verse
    lines:
      - "त्वं चैव नरशार्दूल सहास्माभिर्गमिष्यसि"
      - "अद्भुतं च धनूरत्नं तत्र त्वं द्रष्टुमर्हसि"
    iast: "tvaṃ caiva naraśārdūla sahāsmābhir gamiṣyasi | adbhutaṃ ca dhanūratnaṃ tatra tvaṃ draṣṭum arhasi"
  - id: '1.49.1'
    kind: verse
    lines:
      - "ततः प्रागुत्तरां गत्वा रामः सौमित्रिणा सह"
      - "विश्वामित्रं पुरस्कृत्य यज्ञवाटमुपागमत्"
    iast: "tataḥ prāguttarāṃ gatvā rāmaḥ saumitriṇā saha | viśvāmitraṃ puraskṛtya yajñavāṭam upāgamat"
  - id: '1.49.6'
    kind: verse
    lines:
      - "विश्वामित्रं मुनिश्रेष्ठं श्रुत्वा स नृपतिस्तदा"
      - "शतानन्दं पुरस्कृत्य पुरोहितमनिन्दितम्"
    iast: "viśvāmitraṃ muniśreṣṭhaṃ śrutvā sa nṛpatis tadā | śatānandaṃ puraskṛtya purohitam aninditam"
  - id: '1.49.14'
    kind: verse
    lines:
      - "धन्योऽस्म्यनुगृहीतोऽस्मि यस्य मे मुनिपुंगव"
      - "यज्ञोपसदनं ब्रह्मन्प्राप्तोऽसि मुनिभिः सह"
    iast: "dhanyo 'smy anugṛhīto 'smi yasya me munipuṃgava | yajñopasadanaṃ brahman prāpto 'si munibhiḥ saha"
  - id: '1.49.17'
    kind: verse
    lines:
      - "इमौ कुमारौ भद्रं ते देवतुल्यपराक्रमौ"
      - "गजसिंहगती वीरौ शार्दूलवृषभोपमौ"
    iast: "imau kumārau bhadraṃ te devatulyaparākramau | gajasiṃhagatī vīrau śārdūlavṛṣabhopamau"
  - id: '1.49.21'
    kind: verse
    lines:
      - "परस्परस्य सदृशौ प्रमाणेङ्गितचेष्टितैः"
      - "काकपक्षधरौ वीरौ श्रोतुमिच्छामि तत्त्वतः"
    iast: "parasparasya sadṛśau pramāṇeṅgitaceṣṭitaiḥ | kākapakṣadharau vīrau śrotum icchāmi tattvataḥ"
  - id: '1.49.22'
    kind: verse
    lines:
      - "तस्य तद्वचनं श्रुत्वा जनकस्य महात्मनः"
      - "न्यवेदयन्महात्मानौ पुत्रौ दशरथस्य तौ"
    iast: "tasya tad vacanaṃ śrutvā janakasya mahātmanaḥ | nyavedayan mahātmānau putrau daśarathasya tau"
  - id: '1.49.23'
    kind: verse
    lines:
      - "सिद्धाश्रमनिवासं च राक्षसानां वधं तथा"
      - "तच्चागमनमव्यग्रं विशालायाश्च दर्शनम्"
    iast: "siddhāśramanivāsaṃ ca rākṣasānāṃ vadhaṃ tathā | tac cāgamanam avyagraṃ viśālāyāś ca darśanam"
  - id: '1.49.24'
    kind: verse
    lines:
      - "अहल्यादर्शनं चैव गौतमेन समागमम्"
      - "महाधनुषि जिज्ञासां कर्तुमागमनं तथा"
    iast: "ahalyādarśanaṃ caiva gautamena samāgamam | mahādhanuṣi jijñāsāṃ kartum āgamanaṃ tathā"
  - id: '1.65.7'
    kind: verse
    lines:
      - "एवमुक्तस्तु जनकः प्रत्युवाच महामुनिम्"
      - "श्रूयतामस्य धनुषो यदर्थमिह तिष्ठति"
    iast: "evam uktas tu janakaḥ pratyuvāca mahāmunim | śrūyatām asya dhanuṣo yad artham iha tiṣṭhati"
  - id: '1.65.26'
    kind: verse
    lines:
      - "तदेतन्मुनिशार्दूल धनुः परमभास्वरम्"
      - "रामलक्ष्मणयोश्चापि दर्शयिष्यामि सुव्रत"
    iast: "tad etan muniśārdūla dhanuḥ paramabhāsvaram | rāmalakṣmaṇayoś cāpi darśayiṣyāmi suvrata"
  - id: '1.65.27'
    kind: verse
    lines:
      - "यद्यस्य धनुषो रामः कुर्यादारोपणं मुने"
      - "सुतामयोनिजां सीतां दद्यां दाशरथेरहम्"
    iast: "yady asya dhanuṣo rāmaḥ kuryād āropaṇaṃ mune | sutām ayonijāṃ sītāṃ dadyāṃ dāśarather aham"
  - id: '1.66.12'
    kind: verse
    lines:
      - "विश्वामित्रस्तु धर्मात्मा श्रुत्वा जनकभाषितम्"
      - "वत्स राम धनुः पश्य इति राघवमब्रवीत्"
    iast: "viśvāmitras tu dharmātmā śrutvā janakabhāṣitam | vatsa rāma dhanuḥ paśya iti rāghavam abravīt"
  - id: '1.66.16'
    kind: verse
    lines:
      - "पश्यतां नृषहस्राणां बहूनां रघुनन्दनः"
      - "आरोपयत्स धर्मात्मा सलीलमिव तद्धनुः"
    iast: "paśyatāṃ nṛṣahasrāṇāṃ bahūnāṃ raghunandanaḥ | āropayat sa dharmātmā salīlam iva tad dhanuḥ"
  - id: '1.66.20'
    kind: verse
    lines:
      - "प्रत्याश्वस्ते जने तस्मिन्राजा विगतसाध्वसः"
      - "उवाच प्राञ्जलिर्वाक्यं वाक्यज्ञो मुनिपुंगवम्"
    iast: "pratyāśvaste jane tasmin rājā vigatasādhvasaḥ | uvāca prāñjalir vākyaṃ vākyajño munipuṃgavam"
  - id: '1.66.21'
    kind: verse
    lines:
      - "भगवन्दृष्टवीर्यो मे रामो दशरथात्मजः"
      - "अत्यद्भुतमचिन्त्यं च अतर्कितमिदं मया"
    iast: "bhagavan dṛṣṭavīryo me rāmo daśarathātmajaḥ | atyadbhutam acintyaṃ ca atarkitam idaṃ mayā"
  - id: '1.66.22'
    kind: verse
    lines:
      - "जनकानां कुले कीर्तिमाहरिष्यति मे सुता"
      - "सीता भर्तारमासाद्य रामं दशरथात्मजम्"
    iast: "janakānāṃ kule kīrtim āhariṣyati me sutā | sītā bhartāram āsādya rāmaṃ daśarathātmajam"
  - id: '1.66.24'
    kind: verse
    lines:
      - "भवतोऽनुमते ब्रह्मञ्शीघ्रं गच्छन्तु मन्त्रिणः"
      - "मम कौशिक भद्रं ते अयोध्यां त्वरिता रथैः"
    iast: "bhavato 'numate brahmañ śīghraṃ gacchantu mantriṇaḥ | mama kauśika bhadraṃ te ayodhyāṃ tvaritā rathaiḥ"
  - id: '1.66.25'
    kind: verse
    lines:
      - "राजानं प्रश्रितैर्वाक्यैरानयन्तु पुरं मम"
      - "प्रदानं वीर्यशुल्कायाः कथयन्तु च सर्वशः"
    iast: "rājānaṃ praśritair vākyair ānayantu puraṃ mama | pradānaṃ vīryaśulkāyāḥ kathayantu ca sarvaśaḥ"
  - id: '1.67.1'
    kind: verse
    lines:
      - "जनकेन समादिष्टा दूतास्ते क्लान्तवाहनाः"
      - "त्रिरात्रमुषित्वा मार्गे तेऽयोध्यां प्राविशन्पुरीम्"
    iast: "janakena samādiṣṭā dūtās te klāntavāhanāḥ | trirātram uṣitvā mārge te 'yodhyāṃ prāviśan purīm"
  - id: '1.67.6'
    kind: verse
    lines:
      - "पृष्ट्वा कुशलमव्यग्रं वैदेहो मिथिलाधिपः"
      - "कौशिकानुमते वाक्यं भवन्तमिदमब्रवीत्"
    iast: "pṛṣṭvā kuśalam avyagraṃ vaideho mithilādhipaḥ | kauśikānumate vākyaṃ bhavantam idam abravīt"
  - id: '1.67.9'
    kind: verse
    lines:
      - "तच्च राजन्धनुर्दिव्यं मध्ये भग्नं महात्मना"
      - "रामेण हि महाराज महत्यां जनसंसदि"
    iast: "tac ca rājan dhanur divyaṃ madhye bhagnaṃ mahātmanā | rāmeṇa hi mahārāja mahatyāṃ janasaṃsadi"
  - id: '1.67.10'
    kind: verse
    lines:
      - "अस्मै देया मया सीता वीर्यशुल्का महात्मने"
      - "प्रतिज्ञां तर्तुमिच्छामि तदनुज्ञातुमर्हसि"
    iast: "asmai deyā mayā sītā vīryaśulkā mahātmane | pratijñāṃ tartum icchāmi tad anujñātum arhasi"
  - id: '1.68.7'
    kind: verse
    lines:
      - "गत्वा चतुरहं मार्गं विदेहानभ्युपेयिवान्"
      - "राजा तु जनकः श्रीमाञ्श्रुत्वा पूजामकल्पयत्"
    iast: "gatvā caturahaṃ mārgaṃ videhān abhyupeyivān | rājā tu janakaḥ śrīmāñ śrutvā pūjām akalpayat"
  - id: '1.68.8'
    kind: verse
    lines:
      - "ततो राजानमासाद्य वृद्धं दशरथं नृपम्"
      - "जनको मुदितो राजा हर्षं च परमं ययौ"
      - "उवाच च नरश्रेष्ठो नरश्रेष्ठं मुदान्वितम्"
    iast: "tato rājānam āsādya vṛddhaṃ daśarathaṃ nṛpam | janako mudito rājā harṣaṃ ca paramaṃ yayau | uvāca ca naraśreṣṭho naraśreṣṭhaṃ mudānvitam"
  - id: '1.68.9'
    kind: verse
    lines:
      - "स्वागतं ते महाराज दिष्ट्या प्राप्तोऽसि राघव"
      - "पुत्रयोरुभयोः प्रीतिं लप्स्यसे वीर्यनिर्जिताम्"
    iast: "svāgataṃ te mahārāja diṣṭyā prāpto 'si rāghava | putrayor ubhayoḥ prītiṃ lapsyase vīryanirjitām"
  - id: '1.70.20'
    kind: verse
    lines:
      - "कनीयानेष मे भ्राता अहं ज्येष्ठो महामुने"
      - "ददामि परमप्रीतो वध्वौ ते मुनिपुंगव"
    iast: "kanīyān eṣa me bhrātā ahaṃ jyeṣṭho mahāmune | dadāmi paramaprīto vadhvau te munipuṃgava"
  - id: '1.70.21'
    kind: verse
    lines:
      - "सीतां रामाय भद्रं ते ऊर्मिलां लक्ष्मणाय च"
      - "वीर्यशुल्कां मम सुतां सीतां सुरसुतोपमाम्"
    iast: "sītāṃ rāmāya bhadraṃ te ūrmilāṃ lakṣmaṇāya ca | vīryaśulkāṃ mama sutāṃ sītāṃ surasutopamām"
  - id: '1.71.10'
    kind: verse
    lines:
      - "सदृशं कुलसंबन्धं यदाज्ञापयथः स्वयम्"
      - "एवं भवतु भद्रं वः कुशध्वजसुते इमे"
      - "पत्न्यौ भजेतां सहितौ शत्रुघ्नभरतावुभौ"
    iast: "sadṛśaṃ kulasaṃbandhaṃ yad ājñāpayathaḥ svayam | evaṃ bhavatu bhadraṃ vaḥ kuśadhvajasute ime | patnyau bhajetāṃ sahitau śatrughnabharatāv ubhau"
  - id: '1.72.17'
    kind: verse
    lines:
      - "अब्रवीज्जनको राजा कौसल्यानन्दवर्धनम्"
      - "इयं सीता मम सुता सहधर्मचरी तव"
      - "प्रतीच्छ चैनां भद्रं ते पाणिं गृह्णीष्व पाणिना"
    iast: "abravīj janako rājā kausalyānandavardhanam | iyaṃ sītā mama sutā sahadharmacarī tava | pratīccha caināṃ bhadraṃ te pāṇiṃ gṛhṇīṣva pāṇinā"
  - id: '1.72.19'
    kind: verse
    lines:
      - "तमेवमुक्त्वा जनको भरतं चाभ्यभाषत"
      - "गृहाण पाणिं माण्डव्याः पाणिना रघुनन्दन"
    iast: "tam evam uktvā janako bharataṃ cābhyabhāṣata | gṛhāṇa pāṇiṃ māṇḍavyāḥ pāṇinā raghunandana"
  - id: '1.72.20'
    kind: verse
    lines:
      - "शत्रुघ्नं चापि धर्मात्मा अब्रवीज्जनकेश्वरः"
      - "श्रुतकीर्त्या महाबाहो पाणिं गृह्णीष्व पाणिना"
    iast: "śatrughnaṃ cāpi dharmātmā abravīj janakeśvaraḥ | śrutakīrtyā mahābāho pāṇiṃ gṛhṇīṣva pāṇinā"
  - id: '1.72.21'
    kind: verse
    lines:
      - "सर्वे भवन्तः संयाश्च सर्वे सुचरितव्रताः"
      - "पत्नीभिः सन्तु काकुत्स्था मा भूत्कालस्य पर्ययः"
    iast: "sarve bhavantaḥ saṃyāś ca sarve sucaritavratāḥ | patnībhiḥ santu kākutsthā mā bhūt kālasya paryayaḥ"
  - id: '1.72.22'
    kind: verse
    lines:
      - "जनकस्य वचः श्रुत्वा पाणीन्पाणिभिरस्पृशन्"
      - "चत्वारस्ते चतसृणां वसिष्ठस्य मते स्थिताः"
    iast: "janakasya vacaḥ śrutvā pāṇīn pāṇibhir aspṛśan | catvāras te catasṛṇāṃ vasiṣṭhasya mate sthitāḥ"
  - id: '1.72.23'
    kind: verse
    lines:
      - "अग्निं प्रदक्षिणं कृत्वा वेदिं राजानमेव च"
      - "ऋषींश्चैव महात्मानः सह भार्या रघूत्तमाः"
      - "यथोक्तेन तथा चक्रुर्विवाहं विधिपूर्वकम्"
    iast: "agniṃ pradakṣiṇaṃ kṛtvā vediṃ rājānam eva ca | ṛṣīṃś caiva mahātmānaḥ saha bhāryā raghūttamāḥ | yathoktena tathā cakrur vivāhaṃ vidhipūrvakam"
  - id: '1.73.7'
    kind: verse
    lines:
      - "प्रविवेश स्वनिलयं मिथिलां मिथिलेश्वरः"
      - "राजाप्ययोध्याधिपतिः सह पुत्रैर्महात्मभिः"
    iast: "praviveśa svanilayaṃ mithilāṃ mithileśvaraḥ | rājāpy ayodhyādhipatiḥ saha putrair mahātmabhiḥ"
  - id: '1.73.8'
    kind: verse
    lines:
      - "ऋषीन्सर्वान्पुरस्कृत्य जगाम सबलानुगः"
      - "गच्छन्तं तु नरव्याघ्रं सर्षिसंघं सराघवम्"
    iast: "ṛṣīn sarvān puraskṛtya jagāma sabalānugaḥ | gacchantaṃ tu naravyāghraṃ sarṣisaṃghaṃ sarāghavam"
  - id: '1.73.16'
    kind: verse
    lines:
      - "तस्मिंस्तमसि घोरे तु भस्मच्छन्नेव सा चमूः"
      - "ददर्श भीमसंकाशं जटामण्डलधारिणम्"
    iast: "tasmiṃs tamasi ghore tu bhasmacchanneva sā camūḥ | dadarśa bhīmasaṃkāśaṃ jaṭāmaṇḍaladhāriṇam"
  - id: '1.73.21'
    kind: verse
    lines:
      - "एवमुक्त्वार्घ्यमादाय भार्गवं भीमदर्शनम्"
      - "ऋषयो राम रामेति मधुरां वाचमब्रुवन्"
    iast: "evam uktvārghyam ādāya bhārgavaṃ bhīmadarśanam | ṛṣayo rāma rāmeti madhurāṃ vācam abruvan"
  - id: '1.73.22'
    kind: verse
    lines:
      - "प्रतिगृह्य तु तां पूजामृषिदत्तां प्रतापवान्"
      - "रामं दाशरथिं रामो जामदग्न्योऽभ्यभाषत"
    iast: "pratigṛhya tu tāṃ pūjām ṛṣidattāṃ pratāpavān | rāmaṃ dāśarathiṃ rāmo jāmadagnyo 'bhyabhāṣata"
  - id: '1.74.1'
    kind: verse
    lines:
      - "राम दाशरथे वीर वीर्यं ते श्रूयतेऽधुतम्"
      - "धनुषो भेदनं चैव निखिलेन मया श्रुतम्"
    iast: "rāma dāśarathe vīra vīryaṃ te śrūyate 'dhutam | dhanuṣo bhedanaṃ caiva nikhilena mayā śrutam"
  - id: '1.74.2'
    kind: verse
    lines:
      - "तदद्भुतमचिन्त्यं च भेदनं धनुषस्त्वया"
      - "तच्छ्रुत्वाहमनुप्राप्तो धनुर्गृह्यापरं शुभम्"
    iast: "tad adbhutam acintyaṃ ca bhedanaṃ dhanuṣas tvayā | tac chrutvāham anuprāpto dhanur gṛhyāparaṃ śubham"
  - id: '1.75.1'
    kind: verse
    lines:
      - "श्रुत्वा तज्जामदग्न्यस्य वाक्यं दाशरथिस्तदा"
      - "गौरवाद्यन्त्रितकथः पितू राममथाब्रवीत्"
    iast: "śrutvā taj jāmadagnyasya vākyaṃ dāśarathis tadā | gauravād yantritakathaḥ pitū rāmam athābravīt"
  - id: '1.75.5'
    kind: verse
    lines:
      - "आरोप्य स धनू रामः शरं सज्यं चकार ह"
      - "जामदग्न्यं ततो रामं रामः क्रुद्धोऽब्रवीद्वचः"
    iast: "āropya sa dhanū rāmaḥ śaraṃ sajyaṃ cakāra ha | jāmadagnyaṃ tato rāmaṃ rāmaḥ kruddho 'bravīd vacaḥ"
  - id: '1.75.12'
    kind: verse
    lines:
      - "तेजोभिर्हतवीर्यत्वाज्जामदग्न्यो जडीकृतः"
      - "रामं कमल पत्राक्षं मन्दं मन्दमुवाच ह"
    iast: "tejobhir hatavīryatvāj jāmadagnyo jaḍīkṛtaḥ | rāmaṃ kamala patrākṣaṃ mandaṃ mandam uvāca ha"
  - id: '1.75.17'
    kind: verse
    lines:
      - "अक्षय्यं मधुहन्तारं जानामि त्वां सुरेश्वरम्"
      - "धनुषोऽस्य परामर्शात्स्वस्ति तेऽस्तु परंतप"
    iast: "akṣayyaṃ madhuhantāraṃ jānāmi tvāṃ sureśvaram | dhanuṣo 'sya parāmarśāt svasti te 'stu paraṃtapa"
  - id: '1.75.19'
    kind: verse
    lines:
      - "न चेयं मम काकुत्स्थ व्रीडा भवितुमर्हति"
      - "त्वया त्रैलोक्यनाथेन यदहं विमुखीकृतः"
    iast: "na ceyaṃ mama kākutstha vrīḍā bhavitum arhati | tvayā trailokyanāthena yad ahaṃ vimukhīkṛtaḥ"
  - id: '1.75.20'
    kind: verse
    lines:
      - "शरमप्रतिमं राम मोक्तुमर्हसि सुव्रत"
      - "शरमोक्षे गमिष्यामि महेन्द्रं पर्वतोत्तमम्"
    iast: "śaram apratimaṃ rāma moktum arhasi suvrata | śaramokṣe gamiṣyāmi mahendraṃ parvatottamam"
  - id: '1.75.21'
    kind: verse
    lines:
      - "तथा ब्रुवति रामे तु जामदग्न्ये प्रतापवान्"
      - "रामो दाशरथिः श्रीमांश्चिक्षेप शरमुत्तमम्"
    iast: "tathā bruvati rāme tu jāmadagnye pratāpavān | rāmo dāśarathiḥ śrīmāṃś cikṣepa śaram uttamam"
  - id: '1.76.14'
    kind: verse
    lines:
      - "रामस्तु सीतया सार्धं विजहार बहूनृतून्"
      - "मनस्वी तद्गतस्तस्या नित्यं हृदि समर्पितः"
    iast: "rāmas tu sītayā sārdhaṃ vijahāra bahūn ṛtūn | manasvī tadgatas tasyā nityaṃ hṛdi samarpitaḥ"
  - id: '1.76.15'
    kind: verse
    lines:
      - "प्रिया तु सीता रामस्य दाराः पितृकृता इति"
      - "गुणाद्रूपगुणाच्चापि प्रीतिर्भूयो व्यवर्धत"
    iast: "priyā tu sītā rāmasya dārāḥ pitṛkṛtā iti | guṇād rūpaguṇāc cāpi prītir bhūyo vyavardhata"
  - id: '1.76.16'
    kind: verse
    lines:
      - "तस्याश्च भर्ता द्विगुणं हृदये परिवर्तते"
      - "अन्तर्जातमपि व्यक्तमाख्याति हृदयं हृदा"
    iast: "tasyāś ca bhartā dviguṇaṃ hṛdaye parivartate | antarjātam api vyaktam ākhyāti hṛdayaṃ hṛdā"
  - id: '1.76.17'
    kind: verse
    lines:
      - "तस्य भूयो विशेषेण मैथिली जनकात्मजा"
      - "देवताभिः समा रूपे सीता श्रीरिव रूपिणी"
    iast: "tasya bhūyo viśeṣeṇa maithilī janakātmajā | devatābhiḥ samā rūpe sītā śrīr iva rūpiṇī"
  - id: '2.1.8'
    kind: verse
    lines:
      - "राजापि तौ महातेजाः सस्मार प्रोषितौ सुतौ"
      - "उभौ भरतशत्रुघ्नौ महेन्द्रवरुणोपमौ"
    iast: "rājāpi tau mahātejāḥ sasmāra proṣitau sutau | ubhau bharataśatrughnau mahendravaruṇopamau"
  - id: '2.1.9'
    kind: verse
    lines:
      - "सर्व एव तु तस्येष्टाश्चत्वारः पुरुषर्षभाः"
      - "स्वशरीराद्विनिर्वृत्ताश्चत्वार इव बाहवः"
    iast: "sarva eva tu tasyeṣṭāś catvāraḥ puruṣarṣabhāḥ | svaśarīrād vinirvṛttāś catvāra iva bāhavaḥ"
  - id: '2.1.10'
    kind: verse
    lines:
      - "तेषामपि महातेजा रामो रतिकरः पितुः"
      - "स्वयम्भूरिव भूतानां बभूव गुणवत्तरः"
    iast: "teṣām api mahātejā rāmo ratikaraḥ pituḥ | svayambhūr iva bhūtānāṃ babhūva guṇavattaraḥ"
  - id: '2.1.34'
    kind: verse
    lines:
      - "तं समीक्ष्य महाराजो युक्तं समुदितैर्गुणैः"
      - "निश्चित्य सचिवैः सार्धं युवराजममन्यत"
    iast: "taṃ samīkṣya mahārājo yuktaṃ samuditair guṇaiḥ | niścitya sacivaiḥ sārdhaṃ yuvarājam amanyata"
  - id: '2.2.1'
    kind: verse
    lines:
      - "ततः परिषदं सर्वामामन्त्र्य वसुधाधिपः"
      - "हितमुद्धर्षणं चेदमुवाचाप्रतिमं वचः"
    iast: "tataḥ pariṣadaṃ sarvām āmantrya vasudhādhipaḥ | hitam uddharṣaṇaṃ cedam uvācāpratimaṃ vacaḥ"
  - id: '2.2.3'
    kind: verse
    lines:
      - "सोऽहमिक्ष्वाकुभिः पूर्वैर्नरेन्द्रैः परिपालितम्"
      - "श्रेयसा योक्तुकामोऽस्मि सुखार्हमखिलं जगत्"
    iast: "so 'ham ikṣvākubhiḥ pūrvair narendraiḥ paripālitam | śreyasā yoktukāmo 'smi sukhārham akhilaṃ jagat"
  - id: '2.2.5'
    kind: verse
    lines:
      - "इदं शरीरं कृत्स्नस्य लोकस्य चरता हितम्"
      - "पाण्डुरस्यातपत्रस्यच्छायायां जरितं मया"
    iast: "idaṃ śarīraṃ kṛtsnasya lokasya caratā hitam | pāṇḍur asyātapatrasyac chāyāyāṃ jaritaṃ mayā"
  - id: '2.2.9'
    kind: verse
    lines:
      - "अनुजातो हि मे सर्वैर्गुणैर्ज्येष्ठो ममात्मजः"
      - "पुरंदरसमो वीर्ये रामः परपुरंजयः"
    iast: "anujāto hi me sarvair guṇair jyeṣṭho mamātmajaḥ | puraṃdarasamo vīrye rāmaḥ parapuraṃjayaḥ"
  - id: '2.2.10'
    kind: verse
    lines:
      - "तं चन्द्रमिव पुष्येण युक्तं धर्मभृतां वरम्"
      - "यौवराज्येन योक्तास्मि प्रीतः पुरुषपुंगवम्"
    iast: "taṃ candram iva puṣyeṇa yuktaṃ dharmabhṛtāṃ varam | yauvarājyena yoktāsmi prītaḥ puruṣapuṃgavam"
  - id: '2.2.11'
    kind: verse
    lines:
      - "अनुरूपः स वो नाथो लक्ष्मीवांल्लक्ष्मणाग्रजः"
      - "त्रैलोक्यमपि नाथेन येन स्यान्नाथवत्तरम्"
    iast: "anurūpaḥ sa vo nātho lakṣmīvāṃl lakṣmaṇāgrajaḥ | trailokyam api nāthena yena syān nāthavattaram"
  - id: '2.2.15'
    kind: verse
    lines:
      - "अनेकवर्षसाहस्रो वृद्धस्त्वमसि पार्थिव"
      - "स रामं युवराजानमभिषिञ्चस्व पार्थिवम्"
    iast: "anekavarṣasāhasro vṛddhas tvam asi pārthiva | sa rāmaṃ yuvarājānam abhiṣiñcasva pārthivam"
  - id: '2.2.18'
    kind: verse
    lines:
      - "ते तमूचुर्महात्मानं पौरजानपदैः सह"
      - "बहवो नृप कल्याणा गुणाः पुत्रस्य सन्ति ते"
    iast: "te tam ūcur mahātmānaṃ paurajānapadaiḥ saha | bahavo nṛpa kalyāṇā guṇāḥ putrasya santi te"
  - id: '2.2.19'
    kind: verse
    lines:
      - "दिव्यैर्गुणैः शक्रसमो रामः सत्यपराक्रमः"
      - "इक्ष्वाकुभ्यो हि सर्वेभ्योऽप्यतिरक्तो विशाम्पते"
    iast: "divyair guṇaiḥ śakrasamo rāmaḥ satyaparākramaḥ | ikṣvākubhyo hi sarvebhyo 'py atirakto viśāmpate"
  - id: '2.2.25'
    kind: verse
    lines:
      - "संग्रामात्पुनरागम्य कुञ्जरेण रथेन वा"
      - "पौरान्स्वजनवन्नित्यं कुशलं परिपृच्छति"
    iast: "saṃgrāmāt punar āgamya kuñjareṇa rathena vā | paurān svajanavan nityaṃ kuśalaṃ paripṛcchati"
  - id: '2.2.28'
    kind: verse
    lines:
      - "व्यसनेषु मनुष्याणां भृशं भवति दुःखितः"
      - "उत्सवेषु च सर्वेषु पितेव परितुष्यति"
    iast: "vyasaneṣu manuṣyāṇāṃ bhṛśaṃ bhavati duḥkhitaḥ | utsaveṣu ca sarveṣu piteva parituṣyati"
  - id: '2.2.33'
    kind: verse
    lines:
      - "राममिन्दीवरश्यामं सर्वशत्रुनिबर्हणम्"
      - "पश्यामो यौवराज्यस्थं तव राजोत्तमात्मजम्"
    iast: "rāmam indīvaraśyāmaṃ sarvaśatrunibarhaṇam | paśyāmo yauvarājyasthaṃ tava rājottamātmajam"
  - id: '2.3.4'
    kind: verse
    lines:
      - "चैत्रः श्रीमानयं मासः पुण्यः पुष्पितकाननः"
      - "यौवराज्याय रामस्य सर्वमेवोपकल्प्यताम्"
    iast: "caitraḥ śrīmān ayaṃ māsaḥ puṇyaḥ puṣpitakānanaḥ | yauvarājyāya rāmasya sarvam evopakalpyatām"
  - id: '2.3.6'
    kind: verse
    lines:
      - "ततः सुमन्त्रं द्युतिमान्राजा वचनमब्रवीत्"
      - "रामः कृतात्मा भवता शीघ्रमानीयतामिति"
    iast: "tataḥ sumantraṃ dyutimān rājā vacanam abravīt | rāmaḥ kṛtātmā bhavatā śīghram ānīyatām iti"
  - id: '2.3.7'
    kind: verse
    lines:
      - "स तथेति प्रतिज्ञाय सुमन्त्रो राजशासनात्"
      - "रामं तत्रानयां चक्रे रथेन रथिनां वरम्"
    iast: "sa tatheti pratijñāya sumantro rājaśāsanāt | rāmaṃ tatrānayāṃ cakre rathena rathināṃ varam"
  - id: '2.3.21'
    kind: verse
    lines:
      - "तं पश्यमानो नृपतिस्तुतोष प्रियमात्मजम्"
      - "अलंकृतमिवात्मानमादर्शतलसंस्थितम्"
    iast: "taṃ paśyamāno nṛpatis tutoṣa priyam ātmajam | alaṃkṛtam ivātmānam ādarśatalasaṃsthitam"
  - id: '2.3.22'
    kind: verse
    lines:
      - "स तं सस्मितमाभाष्य पुत्रं पुत्रवतां वरः"
      - "उवाचेदं वचो राजा देवेन्द्रमिव कश्यपः"
    iast: "sa taṃ sasmitam ābhāṣya putraṃ putravatāṃ varaḥ | uvācedaṃ vaco rājā devendram iva kaśyapaḥ"
  - id: '2.3.23'
    kind: verse
    lines:
      - "ज्येष्ठायामसि मे पत्न्यां सदृश्यां सदृशः सुतः"
      - "उत्पन्नस्त्वं गुणश्रेष्ठो मम रामात्मजः प्रियः"
    iast: "jyeṣṭhāyām asi me patnyāṃ sadṛśyāṃ sadṛśaḥ sutaḥ | utpannas tvaṃ guṇaśreṣṭho mama rāmātmajaḥ priyaḥ"
  - id: '2.3.24'
    kind: verse
    lines:
      - "त्वया यतः प्रजाश्चेमाः स्वगुणैरनुरञ्जिताः"
      - "तस्मात्त्वं पुष्ययोगेन यौवराज्यमवाप्नुहि"
    iast: "tvayā yataḥ prajāś cemāḥ svaguṇair anurañjitāḥ | tasmāt tvaṃ puṣyayogena yauvarājyam avāpnuhi"
  - id: '2.3.25'
    kind: verse
    lines:
      - "कामतस्त्वं प्रकृत्यैव विनीतो गुणवानसि"
      - "गुणवत्यपि तु स्नेहात्पुत्र वक्ष्यामि ते हितम्"
    iast: "kāmatas tvaṃ prakṛtyaiva vinīto guṇavān asi | guṇavaty api tu snehāt putra vakṣyāmi te hitam"
  - id: '2.3.26'
    kind: verse
    lines:
      - "भूयो विनयमास्थाय भव नित्यं जितेन्द्रियः"
      - "कामक्रोधसमुत्थानि त्यजेथा व्यसनानि च"
    iast: "bhūyo vinayam āsthāya bhava nityaṃ jitendriyaḥ | kāmakrodhasamutthāni tyajethā vyasanāni ca"
  - id: '2.3.27'
    kind: verse
    lines:
      - "परोक्षया वर्तमानो वृत्त्या प्रत्यक्षया तथा"
      - "अमात्यप्रभृतीः सर्वाः प्रकृतीश्चानुरञ्जय"
    iast: "parokṣayā vartamāno vṛttyā pratyakṣayā tathā | amātyaprabhṛtīḥ sarvāḥ prakṛtīś cānurañjaya"
  - id: '2.3.28'
    kind: verse
    lines:
      - "तुष्टानुरक्तप्रकृतिर्यः पालयति मेदिनीम्"
      - "तस्य नन्दन्ति मित्राणि लब्ध्वामृतमिवामराः"
      - "तस्मात्पुत्र त्वमात्मानं नियम्यैव समाचर"
    iast: "tuṣṭānuraktaprakṛtir yaḥ pālayati medinīm | tasya nandanti mitrāṇi labdhvāmṛtam ivāmarāḥ | tasmāt putra tvam ātmānaṃ niyamyaiva samācara"
  - id: '2.4.16'
    kind: verse
    lines:
      - "अद्य प्रकृतयः सर्वास्त्वामिच्छन्ति नराधिपम्"
      - "अतस्त्वां युवराजानमभिषेक्ष्यामि पुत्रक"
    iast: "adya prakṛtayaḥ sarvās tvām icchanti narādhipam | atas tvāṃ yuvarājānam abhiṣekṣyāmi putraka"
  - id: '2.4.22'
    kind: verse
    lines:
      - "तत्र पुष्येऽभिषिञ्चस्व मनस्त्वरयतीव माम्"
      - "श्वस्त्वाहमभिषेक्ष्यामि यौवराज्ये परंतप"
    iast: "tatra puṣye 'bhiṣiñcasva manas tvarayatīva mām | śvas tvāham abhiṣekṣyāmi yauvarājye paraṃtapa"
  - id: '2.4.23'
    kind: verse
    lines:
      - "तस्मात्त्वयाद्य व्रतिना निशेयं नियतात्मना"
      - "सह वध्वोपवस्तव्या दर्भप्रस्तरशायिना"
    iast: "tasmāt tvayādya vratinā niśeyaṃ niyatātmanā | saha vadhvopavastavyā darbhaprastaraśāyinā"
  - id: '2.4.24'
    kind: verse
    lines:
      - "सुहृदश्चाप्रमत्तास्त्वां रक्षन्त्वद्य समन्ततः"
      - "भवन्ति बहुविघ्नानि कार्याण्येवंविधानि हि"
    iast: "suhṛdaś cāpramattās tvāṃ rakṣantv adya samantataḥ | bhavanti bahuvighnāni kāryāṇy evaṃvidhāni hi"
  - id: '2.4.25'
    kind: verse
    lines:
      - "विप्रोषितश्च भरतो यावदेव पुरादितः"
      - "तावदेवाभिषेकस्ते प्राप्तकालो मतो मम"
    iast: "viproṣitaś ca bharato yāvad eva purād itaḥ | tāvad evābhiṣekas te prāptakālo mato mama"
  - id: '2.4.26'
    kind: verse
    lines:
      - "कामं खलु सतां वृत्ते भ्राता ते भरतः स्थितः"
      - "ज्येष्ठानुवर्ती धर्मात्मा सानुक्रोशो जितेन्द्रियः"
    iast: "kāmaṃ khalu satāṃ vṛtte bhrātā te bharataḥ sthitaḥ | jyeṣṭhānuvartī dharmātmā sānukrośo jitendriyaḥ"
  - id: '2.4.27'
    kind: verse
    lines:
      - "किं तु चित्तं मनुष्याणामनित्यमिति मे मतिः"
      - "सतां च धर्मनित्यानां कृतशोभि च राघव"
    iast: "kiṃ tu cittaṃ manuṣyāṇām anityam iti me matiḥ | satāṃ ca dharmanityānāṃ kṛtaśobhi ca rāghava"
  - id: '2.4.28'
    kind: verse
    lines:
      - "इत्युक्तः सोऽभ्यनुज्ञातः श्वोभाविन्यभिषेचने"
      - "व्रजेति रामः पितरमभिवाद्याभ्ययाद्गृहम्"
    iast: "ity uktaḥ so 'bhyanujñātaḥ śvobhāviny abhiṣecane | vrajeti rāmaḥ pitaram abhivādyābhyayād gṛham"
  - id: '2.7.1'
    kind: verse
    lines:
      - "ज्ञातिदासी यतो जाता कैकेय्यास्तु सहोषिता"
      - "प्रासादं चन्द्रसंकाशमारुरोह यदृच्छया"
    iast: "jñātidāsī yato jātā kaikeyyās tu sahoṣitā | prāsādaṃ candrasaṃkāśam āruroha yadṛcchayā"
  - id: '2.7.4'
    kind: verse
    lines:
      - "अविदूरे स्थितां दृष्ट्वा धात्रीं पप्रच्छ मन्थरा"
      - "उत्तमेनाभिसंयुक्ता हर्षेणार्थपरा सती"
    iast: "avidūre sthitāṃ dṛṣṭvā dhātrīṃ papraccha mantharā | uttamenābhisaṃyuktā harṣeṇārthaparā satī"
  - id: '2.7.5'
    kind: verse
    lines:
      - "राममाता धनं किं नु जनेभ्यः संप्रयच्छति"
      - "अतिमात्रं प्रहर्षोऽयं किं जनस्य च शंस मे"
      - "कारयिष्यति किं वापि संप्रहृष्टो महीपतिः"
    iast: "rāmamātā dhanaṃ kiṃ nu janebhyaḥ saṃprayacchati | atimātraṃ praharṣo 'yaṃ kiṃ janasya ca śaṃsa me | kārayiṣyati kiṃ vāpi saṃprahṛṣṭo mahīpatiḥ"
  - id: '2.7.8'
    kind: verse
    lines:
      - "धात्र्यास्तु वचनं श्रुत्वा कुब्जा क्षिप्रममर्षिता"
      - "कैलास शिखराकारात्प्रासादादवरोहत"
    iast: "dhātryās tu vacanaṃ śrutvā kubjā kṣipram amarṣitā | kailāsa śikharākārāt prāsādād avarohata"
  - id: '2.7.9'
    kind: verse
    lines:
      - "सा दह्यमाना कोपेन मन्थरा पापदर्शिनी"
      - "शयानामेत्य कैकेयीमिदं वचनमब्रवीत्"
    iast: "sā dahyamānā kopena mantharā pāpadarśinī | śayānām etya kaikeyīm idaṃ vacanam abravīt"
  - id: '2.7.11'
    kind: verse
    lines:
      - "अनिष्टे सुभगाकारे सौभाग्येन विकत्थसे"
      - "चलं हि तव सौभाग्यं नद्यः स्रोत इवोष्णगे"
    iast: "aniṣṭe subhagākāre saubhāgyena vikatthase | calaṃ hi tava saubhāgyaṃ nadyaḥ srota ivoṣṇage"
  - id: '2.7.19'
    kind: verse
    lines:
      - "नराधिपकुले जाता महिषी त्वं महीपतेः"
      - "उग्रत्वं राजधर्माणां कथं देवि न बुध्यसे"
    iast: "narādhipakule jātā mahiṣī tvaṃ mahīpateḥ | ugratvaṃ rājadharmāṇāṃ kathaṃ devi na budhyase"
  - id: '2.7.22'
    kind: verse
    lines:
      - "अपवाह्य स दुष्टात्मा भरतं तव बन्धुषु"
      - "काल्यं स्थापयिता रामं राज्ये निहतकण्टके"
    iast: "apavāhya sa duṣṭātmā bharataṃ tava bandhuṣu | kālyaṃ sthāpayitā rāmaṃ rājye nihatakaṇṭake"
  - id: '2.7.27'
    kind: verse
    lines:
      - "मन्थराया वचः श्रुत्वा शयनात्सा शुभानना"
      - "एकमाभरणं तस्यै कुब्जायै प्रददौ शुभम्"
    iast: "mantharāyā vacaḥ śrutvā śayanāt sā śubhānanā | ekam ābharaṇaṃ tasyai kubjāyai pradadau śubham"
  - id: '2.7.28'
    kind: verse
    lines:
      - "दत्त्वा त्वाभरणं तस्यै कुब्जायै प्रमदोत्तमा"
      - "कैकेयी मन्थरां हृष्टा पुनरेवाब्रवीदिदम्"
    iast: "dattvā tv ābharaṇaṃ tasyai kubjāyai pramadottamā | kaikeyī mantharāṃ hṛṣṭā punar evābravīd idam"
  - id: '2.7.29'
    kind: verse
    lines:
      - "इदं तु मन्थरे मह्यमाख्यासि परमं प्रियम्"
      - "एतन्मे प्रियमाख्यातुः किं वा भूयः करोमि ते"
    iast: "idaṃ tu manthare mahyam ākhyāsi paramaṃ priyam | etan me priyam ākhyātuḥ kiṃ vā bhūyaḥ karomi te"
  - id: '2.8.10'
    kind: verse
    lines:
      - "सा त्वमभ्युदये प्राप्ते वर्तमाने च मन्थरे"
      - "भविष्यति च कल्याणे किमर्थं परितप्यसे"
      - "कौसल्यातोऽतिरिक्तं च स तु शुश्रूषते हि माम्"
    iast: "sā tvam abhyudaye prāpte vartamāne ca manthare | bhaviṣyati ca kalyāṇe kimarthaṃ paritapyase | kausalyāto 'tiriktaṃ ca sa tu śuśrūṣate hi mām"
  - id: '2.8.11'
    kind: verse
    lines:
      - "कैकेय्या वचनं श्रुत्वा मन्थरा भृशदुःखिता"
      - "दीर्घमुष्णं विनिःश्वस्य कैकेयीमिदमब्रवीत्"
    iast: "kaikeyyā vacanaṃ śrutvā mantharā bhṛśaduḥkhitā | dīrgham uṣṇaṃ viniḥśvasya kaikeyīm idam abravīt"
  - id: '2.8.13'
    kind: verse
    lines:
      - "भविता राघवो राजा राघवस्य च यः सुतः"
      - "राजवंशात्तु भरतः कैकेयि परिहास्यते"
    iast: "bhavitā rāghavo rājā rāghavasya ca yaḥ sutaḥ | rājavaṃśāt tu bharataḥ kaikeyi parihāsyate"
  - id: '2.8.22'
    kind: verse
    lines:
      - "तस्माद्राजगृहादेव वनं गच्छतु ते सुतः"
      - "एतद्धि रोचते मह्यं भृशं चापि हितं तव"
    iast: "tasmād rājagṛhād eva vanaṃ gacchatu te sutaḥ | etad dhi rocate mahyaṃ bhṛśaṃ cāpi hitaṃ tava"
  - id: '2.8.26'
    kind: verse
    lines:
      - "दर्पान्निराकृता पूर्वं त्वया सौभाग्यवत्तया"
      - "राममाता सपत्नी ते कथं वैरं न यातयेत्"
    iast: "darpān nirākṛtā pūrvaṃ tvayā saubhāgyavattayā | rāmamātā sapatnī te kathaṃ vairaṃ na yātayet"
  - id: '2.9.6'
    kind: verse
    lines:
      - "श्रुत्वैवं वचनं तस्या मन्थरायास्तु कैकयी"
      - "किं चिदुत्थाय शयनात्स्वास्तीर्णादिदमब्रवीत्"
    iast: "śrutvaivaṃ vacanaṃ tasyā mantharāyās tu kaikayī | kiṃ cid utthāya śayanāt svāstīrṇād idam abravīt"
  - id: '2.9.7'
    kind: verse
    lines:
      - "कथय त्वं ममोपायं केनोपायेन मन्थरे"
      - "भरतः प्राप्नुयाद्राज्यं न तु रामः कथं चन"
    iast: "kathaya tvaṃ mamopāyaṃ kenopāyena manthare | bharataḥ prāpnuyād rājyaṃ na tu rāmaḥ kathaṃ cana"
  - id: '2.9.16'
    kind: verse
    lines:
      - "क्रोधागारं प्रविश्याद्य क्रुद्धेवाश्वपतेः सुते"
      - "शेष्वानन्तर्हितायां त्वं भूमौ मलिनवासिनी"
      - "मा स्मैनं प्रत्युदीक्षेथा मा चैनमभिभाषथाः"
    iast: "krodhāgāraṃ praviśyādya kruddhevāśvapateḥ sute | śeṣvānantarhitāyāṃ tvaṃ bhūmau malinavāsinī | mā smainaṃ pratyudīkṣethā mā cainam abhibhāṣathāḥ"
  - id: '2.9.17'
    kind: verse
    lines:
      - "दयिता त्वं सदा भर्तुरत्र मे नास्ति संशयः"
      - "त्वत्कृते च महाराजो विशेदपि हुताशनम्"
    iast: "dayitā tvaṃ sadā bhartur atra me nāsti saṃśayaḥ | tvatkṛte ca mahārājo viśed api hutāśanam"
  - id: '2.9.21'
    kind: verse
    lines:
      - "यौ तौ देवासुरे युद्धे वरौ दशरथोऽददात्"
      - "तौ स्मारय महाभागे सोऽर्थो मा त्वामतिक्रमेत्"
    iast: "yau tau devāsure yuddhe varau daśaratho 'dadāt | tau smāraya mahābhāge so 'rtho mā tvām atikramet"
  - id: '2.9.22'
    kind: verse
    lines:
      - "यदा तु ते वरं दद्यात्स्वयमुत्थाप्य राघवः"
      - "व्यवस्थाप्य महाराजं त्वमिमं वृणुया वरम्"
    iast: "yadā tu te varaṃ dadyāt svayam utthāpya rāghavaḥ | vyavasthāpya mahārājaṃ tvam imaṃ vṛṇuyā varam"
  - id: '2.9.23'
    kind: verse
    lines:
      - "रामं प्रव्राजयारण्ये नव वर्षाणि पञ्च च"
      - "भरतः क्रियतां राजा पृथिव्यां पार्थिवर्षभः"
    iast: "rāmaṃ pravrājayāraṇye nava varṣāṇi pañca ca | bharataḥ kriyatāṃ rājā pṛthivyāṃ pārthivarṣabhaḥ"
  - id: '2.9.41'
    kind: verse
    lines:
      - "गतोदके सेतुबन्धो न कल्याणि विधीयते"
      - "उत्तिष्ठ कुरु कल्याणं राजानमनुदर्शय"
    iast: "gatodake setubandho na kalyāṇi vidhīyate | uttiṣṭha kuru kalyāṇaṃ rājānam anudarśaya"
  - id: '2.10.1'
    kind: verse
    lines:
      - "आज्ञाप्य तु महाराजो राघवस्याभिषेचनम्"
      - "प्रियार्हां प्रियमाख्यातुं विवेशान्तःपुरं वशी"
    iast: "ājñāpya tu mahārājo rāghavasyābhiṣecanam | priyārhāṃ priyam ākhyātuṃ viveśāntaḥpuraṃ vaśī"
  - id: '2.10.3'
    kind: verse
    lines:
      - "स वृद्धस्तरुणीं भार्यां प्राणेभ्योऽपि गरीयसीम्"
      - "अपापः पापसंकल्पां ददर्श धरणीतले"
    iast: "sa vṛddhas taruṇīṃ bhāryāṃ prāṇebhyo 'pi garīyasīm | apāpaḥ pāpasaṃkalpāṃ dadarśa dharaṇītale"
  - id: '2.10.5'
    kind: verse
    lines:
      - "परिमृश्य च पाणिभ्यामभिसंत्रस्तचेतनः"
      - "कामी कमलपत्राक्षीमुवाच वनितामिदम्"
    iast: "parimṛśya ca pāṇibhyām abhisaṃtrastacetanaḥ | kāmī kamalapatrākṣīm uvāca vanitām idam"
  - id: '2.10.12'
    kind: verse
    lines:
      - "आत्मनो जीवितेनापि ब्रूहि यन्मनसेच्छसि"
      - "यावदावर्तते चक्रं तावती मे वसुंधरा"
    iast: "ātmano jīvitenāpi brūhi yan manasecchasi | yāvad āvartate cakraṃ tāvatī me vasuṃdharā"
  - id: '2.10.19'
    kind: verse
    lines:
      - "बलमात्मनि पश्यन्ती न मां शङ्कितुमर्हसि"
      - "करिष्यामि तव प्रीतिं सुकृतेनापि ते शपे"
    iast: "balam ātmani paśyantī na māṃ śaṅkitum arhasi | kariṣyāmi tava prītiṃ sukṛtenāpi te śape"
  - id: '2.10.20'
    kind: verse
    lines:
      - "तेन वाक्येन संहृष्टा तमभिप्रायमात्मनः"
      - "व्याजहार महाघोरमभ्यागतमिवान्तकम्"
    iast: "tena vākyena saṃhṛṣṭā tam abhiprāyam ātmanaḥ | vyājahāra mahāghoram abhyāgatam ivāntakam"
  - id: '2.10.26'
    kind: verse
    lines:
      - "वरौ यौ मे त्वया देव तदा दत्तौ महीपते"
      - "तौ तावदहमद्यैव वक्ष्यामि शृणु मे वचः"
    iast: "varau yau me tvayā deva tadā dattau mahīpate | tau tāvad aham adyaiva vakṣyāmi śṛṇu me vacaḥ"
  - id: '2.10.27'
    kind: verse
    lines:
      - "अभिषेक समारम्भो राघवस्योपकल्पितः"
      - "अनेनैवाभिषेकेण भरतो मेऽभिषिच्यताम्"
    iast: "abhiṣeka samārambho rāghavasyopakalpitaḥ | anenaivābhiṣekeṇa bharato me 'bhiṣicyatām"
  - id: '2.10.28'
    kind: verse
    lines:
      - "नव पञ्च च वर्षाणि दण्डकारण्यमाश्रितः"
      - "चीराजिनजटाधारी रामो भवतु तापसः"
    iast: "nava pañca ca varṣāṇi daṇḍakāraṇyam āśritaḥ | cīrājinajaṭādhārī rāmo bhavatu tāpasaḥ"
  - id: '2.10.30'
    kind: verse
    lines:
      - "ततः श्रुत्वा महाराजः कैकेय्या दारुणं वचः"
      - "व्यथितो विक्लवश्चैव व्याघ्रीं दृष्ट्वा यथा मृगः"
    iast: "tataḥ śrutvā mahārājaḥ kaikeyyā dāruṇaṃ vacaḥ | vyathito viklavaś caiva vyāghrīṃ dṛṣṭvā yathā mṛgaḥ"
  - id: '2.10.32'
    kind: verse
    lines:
      - "चिरेण तु नृपः संज्ञां प्रतिलभ्य सुदुःखितः"
      - "कैकेयीमब्रवीत्क्रुद्धः प्रदहन्निव चक्षुषा"
    iast: "cireṇa tu nṛpaḥ saṃjñāṃ pratilabhya suduḥkhitaḥ | kaikeyīm abravīt kruddhaḥ pradahann iva cakṣuṣā"
  - id: '2.10.33'
    kind: verse
    lines:
      - "नृशंसे दुष्टचारित्रे कुलस्यास्य विनाशिनि"
      - "किं कृतं तव रामेण पापे पापं मयापि वा"
    iast: "nṛśaṃse duṣṭacāritre kulasyāsya vināśini | kiṃ kṛtaṃ tava rāmeṇa pāpe pāpaṃ mayāpi vā"
  - id: '2.10.34'
    kind: verse
    lines:
      - "सदा ते जननी तुल्यां वृत्तिं वहति राघवः"
      - "तस्यैव त्वमनर्थाय किंनिमित्तमिहोद्यता"
    iast: "sadā te jananī tulyāṃ vṛttiṃ vahati rāghavaḥ | tasyaiva tvam anarthāya kiṃnimittam ihodyatā"
  - id: '2.10.36'
    kind: verse
    lines:
      - "जीवलोको यदा सर्वो रामस्येह गुणस्तवम्"
      - "अपराधं कमुद्दिश्य त्यक्ष्यामीष्टमहं सुतम्"
    iast: "jīvaloko yadā sarvo rāmasyeha guṇastavam | aparādhaṃ kam uddiśya tyakṣyāmīṣṭam ahaṃ sutam"
  - id: '2.10.37'
    kind: verse
    lines:
      - "कौसल्यां वा सुमित्रां वा त्यजेयमपि वा श्रियम्"
      - "जीवितं वात्मनो रामं न त्वेव पितृवत्सलम्"
    iast: "kausalyāṃ vā sumitrāṃ vā tyajeyam api vā śriyam | jīvitaṃ vātmano rāmaṃ na tv eva pitṛvatsalam"
  - id: '2.10.39'
    kind: verse
    lines:
      - "तिष्ठेल्लोको विना सूर्यं सस्यं वा सलिलं विना"
      - "न तु रामं विना देहे तिष्ठेत्तु मम जीवितम्"
    iast: "tiṣṭhel loko vinā sūryaṃ sasyaṃ vā salilaṃ vinā | na tu rāmaṃ vinā dehe tiṣṭhet tu mama jīvitam"
  - id: '2.12.2'
    kind: verse
    lines:
      - "पापं कृत्वेव किमिदं मम संश्रुत्य संश्रवम्"
      - "शेषे क्षितितले सन्नः स्थित्यां स्थातुं त्वमर्हसि"
    iast: "pāpaṃ kṛtveva kim idaṃ mama saṃśrutya saṃśravam | śeṣe kṣititale sannaḥ sthityāṃ sthātuṃ tvam arhasi"
  - id: '2.12.3'
    kind: verse
    lines:
      - "आहुः सत्यं हि परमं धर्मं धर्मविदो जनाः"
      - "सत्यमाश्रित्य हि मया त्वं च धर्मं प्रचोदितः"
    iast: "āhuḥ satyaṃ hi paramaṃ dharmaṃ dharmavido janāḥ | satyam āśritya hi mayā tvaṃ ca dharmaṃ pracoditaḥ"
  - id: '2.12.8'
    kind: verse
    lines:
      - "एवं प्रचोदितो राजा कैकेय्या निर्विशङ्कया"
      - "नाशकत्पाशमुन्मोक्तुं बलिरिन्द्रकृतं यथा"
    iast: "evaṃ pracodito rājā kaikeyyā nirviśaṅkayā | nāśakat pāśam unmoktuṃ balir indrakṛtaṃ yathā"
  - id: '2.13.20'
    kind: verse
    lines:
      - "स्तुवन्तं तं तदा सूतं सुमन्त्रं मन्त्रकोविदम्"
      - "प्रतिबुध्य ततो राजा इदं वचनमब्रवीत्"
    iast: "stuvantaṃ taṃ tadā sūtaṃ sumantraṃ mantrakovidam | pratibudhya tato rājā idaṃ vacanam abravīt"
  - id: '2.14.10'
    kind: verse
    lines:
      - "प्राञ्जलिस्तु सुखं पृष्ट्वा विहारशयनासने"
      - "राजपुत्रमुवाचेदं सुमन्त्रो राजसत्कृतः"
    iast: "prāñjalis tu sukhaṃ pṛṣṭvā vihāraśayanāsane | rājaputram uvācedaṃ sumantro rājasatkṛtaḥ"
  - id: '2.14.11'
    kind: verse
    lines:
      - "कौसल्या सुप्रभा देव पिता त्वं द्रष्टुमिच्छति"
      - "महिष्या सह कैकेय्या गम्यतां तत्र माचिरम्"
    iast: "kausalyā suprabhā deva pitā tvaṃ draṣṭum icchati | mahiṣyā saha kaikeyyā gamyatāṃ tatra māciram"
  - id: '2.15.4'
    kind: verse
    lines:
      - "आशीर्वादान्बहूञ्शृण्वन्सुहृद्भिः समुदीरितान्"
      - "यथार्हं चापि संपूज्य सर्वानेव नरान्ययौ"
    iast: "āśīrvādān bahūñ śṛṇvan suhṛdbhiḥ samudīritān | yathārhaṃ cāpi saṃpūjya sarvān eva narān yayau"
  - id: '2.16.1'
    kind: verse
    lines:
      - "स ददर्शासने रामो निषण्णं पितरं शुभे"
      - "कैकेयीसहितं दीनं मुखेन परिशुष्यता"
    iast: "sa dadarśāsane rāmo niṣaṇṇaṃ pitaraṃ śubhe | kaikeyīsahitaṃ dīnaṃ mukhena pariśuṣyatā"
  - id: '2.16.2'
    kind: verse
    lines:
      - "स पितुश्चरणौ पूर्वमभिवाद्य विनीतवत्"
      - "ततो ववन्दे चरणौ कैकेय्याः सुसमाहितः"
    iast: "sa pituś caraṇau pūrvam abhivādya vinītavat | tato vavande caraṇau kaikeyyāḥ susamāhitaḥ"
  - id: '2.16.10'
    kind: verse
    lines:
      - "स दीन इव शोकार्तो विषण्णवदनद्युतिः"
      - "कैकेयीमभिवाद्यैव रामो वचनमब्रवीत्"
    iast: "sa dīna iva śokārto viṣaṇṇavadanadyutiḥ | kaikeyīm abhivādyaiva rāmo vacanam abravīt"
  - id: '2.16.11'
    kind: verse
    lines:
      - "कच्चिन्मया नापराद्धमज्ञानाद्येन मे पिता"
      - "कुपितस्तन्ममाचक्ष्व त्वं चैवैनं प्रसादय"
    iast: "kaccin mayā nāparāddham ajñānād yena me pitā | kupitas tan mamācakṣva tvaṃ caivainaṃ prasādaya"
  - id: '2.16.17'
    kind: verse
    lines:
      - "एतदाचक्ष्व मे देवि तत्त्वेन परिपृच्छतः"
      - "किंनिमित्तमपूर्वोऽयं विकारो मनुजाधिपे"
    iast: "etad ācakṣva me devi tattvena paripṛcchataḥ | kiṃnimittam apūrvo 'yaṃ vikāro manujādhipe"
  - id: '2.16.18'
    kind: verse
    lines:
      - "अहं हि वचनाद्राज्ञः पतेयमपि पावके"
      - "भक्षयेयं विषं तीक्ष्णं मज्जेयमपि चार्णवे"
      - "नियुक्तो गुरुणा पित्रा नृपेण च हितेन च"
    iast: "ahaṃ hi vacanād rājñaḥ pateyam api pāvake | bhakṣayeyaṃ viṣaṃ tīkṣṇaṃ majjeyam api cārṇave | niyukto guruṇā pitrā nṛpeṇa ca hitena ca"
  - id: '2.16.19'
    kind: verse
    lines:
      - "तद्ब्रूहि वचनं देवि राज्ञो यदभिकाङ्क्षितम्"
      - "करिष्ये प्रतिजाने च रामो द्विर्नाभिभाषते"
    iast: "tad brūhi vacanaṃ devi rājño yad abhikāṅkṣitam | kariṣye pratijāne ca rāmo dvir nābhibhāṣate"
  - id: '2.16.20'
    kind: verse
    lines:
      - "तमार्जवसमायुक्तमनार्या सत्यवादिनम्"
      - "उवाच रामं कैकेयी वचनं भृशदारुणम्"
    iast: "tam ārjavasamāyuktam anāryā satyavādinam | uvāca rāmaṃ kaikeyī vacanaṃ bhṛśadāruṇam"
  - id: '2.16.21'
    kind: verse
    lines:
      - "पुरा देवासुरे युद्धे पित्रा ते मम राघव"
      - "रक्षितेन वरौ दत्तौ सशल्येन महारणे"
    iast: "purā devāsure yuddhe pitrā te mama rāghava | rakṣitena varau dattau saśalyena mahāraṇe"
  - id: '2.16.22'
    kind: verse
    lines:
      - "तत्र मे याचितो राजा भरतस्याभिषेचनम्"
      - "गमनं दण्डकारण्ये तव चाद्यैव राघव"
    iast: "tatra me yācito rājā bharatasyābhiṣecanam | gamanaṃ daṇḍakāraṇye tava cādyaiva rāghava"
  - id: '2.16.23'
    kind: verse
    lines:
      - "यदि सत्यप्रतिज्ञं त्वं पितरं कर्तुमिच्छसि"
      - "आत्मानं च नररेष्ठ मम वाक्यमिदं शृणु"
    iast: "yadi satyapratijñaṃ tvaṃ pitaraṃ kartum icchasi | ātmānaṃ ca narareṣṭha mama vākyam idaṃ śṛṇu"
  - id: '2.16.25'
    kind: verse
    lines:
      - "सप्त सप्त च वर्षाणि दण्डकारण्यमाश्रितः"
      - "अभिषेकमिमं त्यक्त्वा जटाचीरधरो वस"
    iast: "sapta sapta ca varṣāṇi daṇḍakāraṇyam āśritaḥ | abhiṣekam imaṃ tyaktvā jaṭācīradharo vasa"
  - id: '2.16.27'
    kind: verse
    lines:
      - "तदप्रियममित्रघ्नो वचनं मरणोपमम्"
      - "श्रुत्वा न विव्यथे रामः कैकेयीं चेदमब्रवीत्"
    iast: "tad apriyam amitraghno vacanaṃ maraṇopamam | śrutvā na vivyathe rāmaḥ kaikeyīṃ cedam abravīt"
  - id: '2.16.28'
    kind: verse
    lines:
      - "एवमस्तु गमिष्यामि वनं वस्तुमहं त्वतः"
      - "जटाचीरधरो राज्ञः प्रतिज्ञामनुपालयन्"
    iast: "evam astu gamiṣyāmi vanaṃ vastum ahaṃ tv ataḥ | jaṭācīradharo rājñaḥ pratijñām anupālayan"
  - id: '2.16.32'
    kind: verse
    lines:
      - "अलीकं मानसं त्वेकं हृदयं दहतीव मे"
      - "स्वयं यन्नाह मां राजा भरतस्याभिषेचनम्"
    iast: "alīkaṃ mānasaṃ tv ekaṃ hṛdayaṃ dahatīva me | svayaṃ yan nāha māṃ rājā bharatasyābhiṣecanam"
  - id: '2.16.33'
    kind: verse
    lines:
      - "अहं हि सीतां राज्यं च प्राणानिष्टान्धनानि च"
      - "हृष्टो भ्रात्रे स्वयं दद्यां भरतायाप्रचोदितः"
    iast: "ahaṃ hi sītāṃ rājyaṃ ca prāṇān iṣṭān dhanāni ca | hṛṣṭo bhrātre svayaṃ dadyāṃ bharatāyāpracoditaḥ"
  - id: '2.16.34'
    kind: verse
    lines:
      - "किं पुनर्मनुजेन्द्रेण स्वयं पित्रा प्रचोदितः"
      - "तव च प्रियकामार्थं प्रतिज्ञामनुपालयन्"
    iast: "kiṃ punar manujendreṇa svayaṃ pitrā pracoditaḥ | tava ca priyakāmārthaṃ pratijñām anupālayan"
  - id: '2.16.46'
    kind: verse
    lines:
      - "नाहमर्थपरो देवि लोकमावस्तुमुत्सहे"
      - "विद्धि मामृषिभिस्तुल्यं केवलं धर्ममास्थितम्"
    iast: "nāham arthaparo devi lokam āvastum utsahe | viddhi mām ṛṣibhis tulyaṃ kevalaṃ dharmam āsthitam"
  - id: '2.16.48'
    kind: verse
    lines:
      - "न ह्यतो धर्मचरणं किं चिदस्ति महत्तरम्"
      - "यथा पितरि शुश्रूषा तस्य वा वचनक्रिया"
    iast: "na hy ato dharmacaraṇaṃ kiṃ cid asti mahattaram | yathā pitari śuśrūṣā tasya vā vacanakriyā"
  - id: '2.16.49'
    kind: verse
    lines:
      - "अनुक्तोऽप्यत्रभवता भवत्या वचनादहम्"
      - "वने वत्स्यामि विजने वर्षाणीह चतुर्दश"
    iast: "anukto 'py atrabhavatā bhavatyā vacanād aham | vane vatsyāmi vijane varṣāṇīha caturdaśa"
  - id: '2.16.50'
    kind: verse
    lines:
      - "न नूनं मयि कैकेयि किं चिदाशंससे गुणम्"
      - "यद्राजानमवोचस्त्वं ममेश्वरतरा सती"
    iast: "na nūnaṃ mayi kaikeyi kiṃ cid āśaṃsase guṇam | yad rājānam avocas tvaṃ mameśvaratarā satī"
  - id: '2.16.51'
    kind: verse
    lines:
      - "यावन्मातरमापृच्छे सीतां चानुनयाम्यहम्"
      - "ततोऽद्यैव गमिष्यामि दण्डकानां महद्वनम्"
    iast: "yāvan mātaram āpṛcche sītāṃ cānunayāmy aham | tato 'dyaiva gamiṣyāmi daṇḍakānāṃ mahad vanam"
  - id: '2.16.52'
    kind: verse
    lines:
      - "भरतः पालयेद्राज्यं शुश्रूषेच्च पितुर्यथा"
      - "तथा भवत्या कर्तव्यं स हि धर्मः सनातनः"
    iast: "bharataḥ pālayed rājyaṃ śuśrūṣec ca pitur yathā | tathā bhavatyā kartavyaṃ sa hi dharmaḥ sanātanaḥ"
  - id: '2.16.55'
    kind: verse
    lines:
      - "स रामः पितरं कृत्वा कैकेयीं च प्रदक्षिणम्"
      - "निष्क्रम्यान्तःपुरात्तस्मात्स्वं ददर्श सुहृज्जनम्"
    iast: "sa rāmaḥ pitaraṃ kṛtvā kaikeyīṃ ca pradakṣiṇam | niṣkramyāntaḥpurāt tasmāt svaṃ dadarśa suhṛjjanam"
  - id: '2.16.58'
    kind: verse
    lines:
      - "न चास्य महतीं लक्ष्मीं राज्यनाशोऽपकर्षति"
      - "लोककान्तस्य कान्तत्वं शीतरश्मेरिव क्षपा"
    iast: "na cāsya mahatīṃ lakṣmīṃ rājyanāśo 'pakarṣati | lokakāntasya kāntatvaṃ śītaraśmer iva kṣapā"
  - id: '2.17.14'
    kind: verse
    lines:
      - "देवि नूनं न जानीषे महद्भयमुपस्थितम्"
      - "इदं तव च दुःखाय वैदेह्या लक्ष्मणस्य च"
    iast: "devi nūnaṃ na jānīṣe mahad bhayam upasthitam | idaṃ tava ca duḥkhāya vaidehyā lakṣmaṇasya ca"
  - id: '2.17.16'
    kind: verse
    lines:
      - "भरताय महाराजो यौवराज्यं प्रयच्छति"
      - "मां पुनर्दण्डकारण्यं विवासयति तापसं"
    iast: "bharatāya mahārājo yauvarājyaṃ prayacchati | māṃ punar daṇḍakāraṇyaṃ vivāsayati tāpasaṃ"
  - id: '2.17.17'
    kind: verse
    lines:
      - "तामदुःखोचितां दृष्ट्वा पतितां कदलीमिव"
      - "रामस्तूत्थापयामास मातरं गतचेतसं"
    iast: "tām aduḥkhocitāṃ dṛṣṭvā patitāṃ kadalīm iva | rāmas tūtthāpayām āsa mātaraṃ gatacetasaṃ"
  - id: '2.17.18'
    kind: verse
    lines:
      - "उपावृत्योत्थितां दीनां वडवामिव वाहिताम्"
      - "पांशुगुण्ठितसर्वाग्नीं विममर्श च पाणिना"
    iast: "upāvṛtyotthitāṃ dīnāṃ vaḍavām iva vāhitām | pāṃśuguṇṭhitasarvāgnīṃ vimamarśa ca pāṇinā"
  - id: '2.17.19'
    kind: verse
    lines:
      - "सा राघवमुपासीनमसुखार्ता सुखोचिता"
      - "उवाच पुरुषव्याघ्रमुपशृण्वति लक्ष्मणे"
    iast: "sā rāghavam upāsīnam asukhārtā sukhocitā | uvāca puruṣavyāghram upaśṛṇvati lakṣmaṇe"
  - id: '2.17.20'
    kind: verse
    lines:
      - "यदि पुत्र न जायेथा मम शोकाय राघव"
      - "न स्म दुःखमतो भूयः पश्येयमहमप्रजा"
    iast: "yadi putra na jāyethā mama śokāya rāghava | na sma duḥkham ato bhūyaḥ paśyeyam aham aprajā"
  - id: '2.17.21'
    kind: verse
    lines:
      - "एक एव हि वन्ध्यायाः शोको भवति मानवः"
      - "अप्रजास्मीति संतापो न ह्यन्यः पुत्र विद्यते"
    iast: "eka eva hi vandhyāyāḥ śoko bhavati mānavaḥ | aprajāsmīti saṃtāpo na hy anyaḥ putra vidyate"
  - id: '2.17.22'
    kind: verse
    lines:
      - "न दृष्टपूर्वं कल्याणं सुखं वा पतिपौरुषे"
      - "अपि पुत्रे विपश्येयमिति रामास्थितं मया"
    iast: "na dṛṣṭapūrvaṃ kalyāṇaṃ sukhaṃ vā patipauruṣe | api putre vipaśyeyam iti rāmāsthitaṃ mayā"
  - id: '2.17.26'
    kind: verse
    lines:
      - "दश सप्त च वर्षाणि तव जातस्य राघव"
      - "अतीतानि प्रकाङ्क्षन्त्या मया दुःखपरिक्षयम्"
    iast: "daśa sapta ca varṣāṇi tava jātasya rāghava | atītāni prakāṅkṣantyā mayā duḥkhaparikṣayam"
  - id: '2.18.1'
    kind: verse
    lines:
      - "तथा तु विलपन्तीं तां कौसल्यां राममातरम्"
      - "उवाच लक्ष्मणो दीनस्तत्कालसदृशं वचः"
    iast: "tathā tu vilapantīṃ tāṃ kausalyāṃ rāmamātaram | uvāca lakṣmaṇo dīnas tat kālasadṛśaṃ vacaḥ"
  - id: '2.18.2'
    kind: verse
    lines:
      - "न रोचते ममाप्येतदार्ये यद्राघवो वनम्"
      - "त्यक्त्वा राज्यश्रियं गच्छेत्स्त्रिया वाक्यवशं गतः"
    iast: "na rocate mamāpy etad ārye yad rāghavo vanam | tyaktvā rājyaśriyaṃ gacchet striyā vākyavaśaṃ gataḥ"
  - id: '2.18.3'
    kind: verse
    lines:
      - "विपरीतश्च वृद्धश्च विषयैश्च प्रधर्षितः"
      - "नृपः किमिव न ब्रूयाच्चोद्यमानः समन्मथः"
    iast: "viparītaś ca vṛddhaś ca viṣayaiś ca pradharṣitaḥ | nṛpaḥ kim iva na brūyāc codyamānaḥ samanmathaḥ"
  - id: '2.18.5'
    kind: verse
    lines:
      - "न तं पश्याम्यहं लोके परोक्षमपि यो नरः"
      - "अमित्रोऽपि निरस्तोऽपि योऽस्य दोषमुदाहरेत्"
    iast: "na taṃ paśyāmy ahaṃ loke parokṣam api yo naraḥ | amitro 'pi nirasto 'pi yo 'sya doṣam udāharet"
  - id: '2.18.6'
    kind: verse
    lines:
      - "देवकल्पमृजुं दान्तं रिपूणामपि वत्सलम्"
      - "अवेक्षमाणः को धर्मं त्यजेत्पुत्रमकारणात्"
    iast: "devakalpam ṛjuṃ dāntaṃ ripūṇām api vatsalam | avekṣamāṇaḥ ko dharmaṃ tyajet putram akāraṇāt"
  - id: '2.18.13'
    kind: verse
    lines:
      - "अनुरक्तोऽस्मि भावेन भ्रातरं देवि तत्त्वतः"
      - "सत्येन धनुषा चैव दत्तेनेष्टेन ते शपे"
    iast: "anurakto 'smi bhāvena bhrātaraṃ devi tattvataḥ | satyena dhanuṣā caiva datteneṣṭena te śape"
  - id: '2.18.14'
    kind: verse
    lines:
      - "दीप्तमग्निमरण्यं वा यदि रामः प्रवेक्ष्यते"
      - "प्रविष्टं तत्र मां देवि त्वं पूर्वमवधारय"
    iast: "dīptam agnim araṇyaṃ vā yadi rāmaḥ pravekṣyate | praviṣṭaṃ tatra māṃ devi tvaṃ pūrvam avadhāraya"
  - id: '2.18.19'
    kind: verse
    lines:
      - "धर्मज्ञ यदि धर्मिष्ठो धर्मं चरितुमिच्छसि"
      - "शुश्रूष मामिहस्थस्त्वं चर धर्ममनुत्तमम्"
    iast: "dharmajña yadi dharmiṣṭho dharmaṃ caritum icchasi | śuśrūṣa mām ihasthas tvaṃ cara dharmam anuttamam"
  - id: '2.18.20'
    kind: verse
    lines:
      - "शुश्रूषुर्जननीं पुत्र स्वगृहे नियतो वसन्"
      - "परेण तपसा युक्तः काश्यपस्त्रिदिवं गतः"
    iast: "śuśrūṣur jananīṃ putra svagṛhe niyato vasan | pareṇa tapasā yuktaḥ kāśyapas tridivaṃ gataḥ"
  - id: '2.18.21'
    kind: verse
    lines:
      - "यथैव राजा पूज्यस्ते गौरवेण तथा ह्यहम्"
      - "त्वां नाहमनुजानामि न गन्तव्यमितो वनम्"
    iast: "yathaiva rājā pūjyas te gauraveṇa tathā hy aham | tvāṃ nāham anujānāmi na gantavyam ito vanam"
  - id: '2.18.22'
    kind: verse
    lines:
      - "त्वद्वियोगान्न मे कार्यं जीवितेन सुखेन वा"
      - "त्वया सह मम श्रेयस्तृणानामपि भक्षणम्"
    iast: "tvadviyogān na me kāryaṃ jīvitena sukhena vā | tvayā saha mama śreyas tṛṇānām api bhakṣaṇam"
  - id: '2.18.25'
    kind: verse
    lines:
      - "विलपन्तीं तथा दीनां कौसल्यां जननीं ततः"
      - "उवाच रामो धर्मात्मा वचनं धर्मसंहितम्"
    iast: "vilapantīṃ tathā dīnāṃ kausalyāṃ jananīṃ tataḥ | uvāca rāmo dharmātmā vacanaṃ dharmasaṃhitam"
  - id: '2.18.26'
    kind: verse
    lines:
      - "नास्ति शक्तिः पितुर्वाक्यं समतिक्रमितुं मम"
      - "प्रसादये त्वां शिरसा गन्तुमिच्छाम्यहं वनम्"
    iast: "nāsti śaktiḥ pitur vākyaṃ samatikramituṃ mama | prasādaye tvāṃ śirasā gantum icchāmy ahaṃ vanam"
  - id: '2.18.31'
    kind: verse
    lines:
      - "तदेतत्तु मया कार्यं क्रियते भुवि नान्यथा"
      - "पितुर्हि वचनं कुर्वन्न कश्चिन्नाम हीयते"
    iast: "tad etat tu mayā kāryaṃ kriyate bhuvi nānyathā | pitur hi vacanaṃ kurvan na kaś cin nāma hīyate"
  - id: '2.18.32'
    kind: verse
    lines:
      - "तामेवमुक्त्वा जननीं लक्ष्मणं पुनरब्रवीत्"
      - "तव लक्ष्मण जानामि मयि स्नेहमनुत्तमम्"
      - "अभिप्रायमविज्ञाय सत्यस्य च शमस्य च"
    iast: "tām evam uktvā jananīṃ lakṣmaṇaṃ punar abravīt | tava lakṣmaṇa jānāmi mayi sneham anuttamam | abhiprāyam avijñāya satyasya ca śamasya ca"
  - id: '2.18.33'
    kind: verse
    lines:
      - "धर्मो हि परमो लोके धर्मे सत्यं प्रतिष्ठितम्"
      - "धर्मसंश्रितमेतच्च पितुर्वचनमुत्तमम्"
    iast: "dharmo hi paramo loke dharme satyaṃ pratiṣṭhitam | dharmasaṃśritam etac ca pitur vacanam uttamam"
  - id: '2.18.35'
    kind: verse
    lines:
      - "सोऽहं न शक्ष्यामि पितुर्नियोगमतिवर्तितुम्"
      - "पितुर्हि वचनाद्वीर कैकेय्याहं प्रचोदितः"
    iast: "so 'haṃ na śakṣyāmi pitur niyogam ativartitum | pitur hi vacanād vīra kaikeyyāhaṃ pracoditaḥ"
  - id: '2.18.36'
    kind: verse
    lines:
      - "तदेनां विसृजानार्यां क्षत्रधर्माश्रितां मतिम्"
      - "धर्ममाश्रय मा तैक्ष्ण्यं मद्बुद्धिरनुगम्यताम्"
    iast: "tad enāṃ visṛjānāryāṃ kṣatradharmāśritāṃ matim | dharmam āśraya mā taikṣṇyaṃ madbuddhir anugamyatām"
  - id: '2.19.7'
    kind: verse
    lines:
      - "सत्यः सत्याभिसंधश्च नित्यं सत्यपराक्रमः"
      - "परलोकभयाद्भीतो निर्भयोऽस्तु पिता मम"
    iast: "satyaḥ satyābhisaṃdhaś ca nityaṃ satyaparākramaḥ | paralokabhayād bhīto nirbhayo 'stu pitā mama"
  - id: '2.19.14'
    kind: verse
    lines:
      - "कैकेय्याः प्रतिपत्तिर्हि कथं स्यान्मम पीडने"
      - "यदि भावो न दैवोऽयं कृतान्तविहितो भवेत्"
    iast: "kaikeyyāḥ pratipattir hi kathaṃ syān mama pīḍane | yadi bhāvo na daivo 'yaṃ kṛtāntavihito bhavet"
  - id: '2.19.15'
    kind: verse
    lines:
      - "जानासि हि यथा सौम्य न मातृषु ममान्तरम्"
      - "भूतपूर्वं विशेषो वा तस्या मयि सुतेऽपि वा"
    iast: "jānāsi hi yathā saumya na mātṛṣu mamāntaram | bhūtapūrvaṃ viśeṣo vā tasyā mayi sute 'pi vā"
  - id: '2.19.20'
    kind: verse
    lines:
      - "सुखदुःखे भयक्रोधौ लाभालाभौ भवाभवौ"
      - "यस्य किं चित्तथाभूतं ननु दैवस्य कर्म तत्"
    iast: "sukhaduḥkhe bhayakrodhau lābhālābhau bhavābhavau | yasya kiṃ cit tathābhūtaṃ nanu daivasya karma tat"
  - id: '2.20.1'
    kind: verse
    lines:
      - "इति ब्रुवति रामे तु लक्ष्मणोऽधःशिरा मुहुः"
      - "श्रुत्वा मध्यं जगामेव मनसा दुःखहर्षयोः"
    iast: "iti bruvati rāme tu lakṣmaṇo 'dhaḥśirā muhuḥ | śrutvā madhyaṃ jagāmeva manasā duḥkhaharṣayoḥ"
  - id: '2.20.5'
    kind: verse
    lines:
      - "अग्राक्ष्णा वीक्षमाणस्तु तिर्यग्भ्रातरमब्रवीत्"
      - "अस्थाने संभ्रमो यस्य जातो वै सुमहानयम्"
    iast: "agrākṣṇā vīkṣamāṇas tu tiryag bhrātaram abravīt | asthāne saṃbhramo yasya jāto vai sumahān ayam"
  - id: '2.20.6'
    kind: verse
    lines:
      - "धर्मदोषप्रसङ्गेन लोकस्यानतिशङ्कया"
      - "कथं ह्येतदसंभ्रान्तस्त्वद्विधो वक्तुमर्हति"
    iast: "dharmadoṣaprasaṅgena lokasyānatiśaṅkayā | kathaṃ hy etad asaṃbhrāntas tvadvidho vaktum arhati"
  - id: '2.20.7'
    kind: verse
    lines:
      - "यथा दैवमशौण्डीरं शौण्डीरः क्षत्रियर्षभः"
      - "किं नाम कृपणं दैवमशक्तमभिशंससि"
    iast: "yathā daivam aśauṇḍīraṃ śauṇḍīraḥ kṣatriyarṣabhaḥ | kiṃ nāma kṛpaṇaṃ daivam aśaktam abhiśaṃsasi"
  - id: '2.20.8'
    kind: verse
    lines:
      - "पापयोस्ते कथं नाम तयोः शङ्का न विद्यते"
      - "सन्ति धर्मोपधाः श्लक्ष्णा धर्मात्मन्किं न बुध्यसे"
    iast: "pāpayos te kathaṃ nāma tayoḥ śaṅkā na vidyate | santi dharmopadhāḥ ślakṣṇā dharmātman kiṃ na budhyase"
  - id: '2.21.15'
    kind: verse
    lines:
      - "एवमुक्ता प्रियं पुत्रं बाष्पपूर्णानना तदा"
      - "उवाच परमार्ता तु कौसल्या पुत्रवत्सला"
    iast: "evam uktā priyaṃ putraṃ bāṣpapūrṇānanā tadā | uvāca paramārtā tu kausalyā putravatsalā"
  - id: '2.21.16'
    kind: verse
    lines:
      - "आसां राम सपत्नीनां वस्तुं मध्ये न मे क्षमम्"
      - "नय मामपि काकुत्स्थ वनं वन्यं मृगीं यथा"
      - "यदि ते गमने बुद्धिः कृता पितुरपेक्षया"
    iast: "āsāṃ rāma sapatnīnāṃ vastuṃ madhye na me kṣamam | naya mām api kākutstha vanaṃ vanyaṃ mṛgīṃ yathā | yadi te gamane buddhiḥ kṛtā pitur apekṣayā"
  - id: '2.21.18'
    kind: verse
    lines:
      - "भरतश्चापि धर्मात्मा सर्वभूतप्रियंवदः"
      - "भवतीमनुवर्तेत स हि धर्मरतः सदा"
    iast: "bharataś cāpi dharmātmā sarvabhūtapriyaṃvadaḥ | bhavatīm anuvarteta sa hi dharmarataḥ sadā"
  - id: '2.21.20'
    kind: verse
    lines:
      - "व्रतोपवासनिरता या नारी परमोत्तमा"
      - "भर्तारं नानुवर्तेत सा च पापगतिर्भवेत्"
    iast: "vratopavāsaniratā yā nārī paramottamā | bhartāraṃ nānuvarteta sā ca pāpagatir bhavet"
  - id: '2.21.22'
    kind: verse
    lines:
      - "पूज्यास्ते मत्कृते देवि ब्राह्मणाश्चैव सुव्रताः"
      - "एवं कालं प्रतीक्षस्व ममागमनकाङ्क्षिणी"
    iast: "pūjyās te matkṛte devi brāhmaṇāś caiva suvratāḥ | evaṃ kālaṃ pratīkṣasva mamāgamanakāṅkṣiṇī"
  - id: '2.22.1'
    kind: verse
    lines:
      - "सापनीय तमायासमुपस्पृश्य जलं शुचि"
      - "चकार माता रामस्य मङ्गलानि मनस्विनी"
    iast: "sāpanīya tam āyāsam upaspṛśya jalaṃ śuci | cakāra mātā rāmasya maṅgalāni manasvinī"
  - id: '2.22.3'
    kind: verse
    lines:
      - "ऋतवश्चैव पक्षाश्च मासाः संवत्सराः क्षपाः"
      - "दिनानि च मुहूर्ताश्च स्वस्ति कुर्वन्तु ते सदा"
    iast: "ṛtavaś caiva pakṣāś ca māsāḥ saṃvatsarāḥ kṣapāḥ | dināni ca muhūrtāś ca svasti kurvantu te sadā"
  - id: '2.22.4'
    kind: verse
    lines:
      - "स्मृतिर्धृतिश्च धर्मश्च पान्तु त्वां पुत्र सर्वतः"
      - "स्कन्दश्च भगवान्देवः सोमश्च सबृहस्पतिः"
    iast: "smṛtir dhṛtiś ca dharmaś ca pāntu tvāṃ putra sarvataḥ | skandaś ca bhagavān devaḥ somaś ca sabṛhaspatiḥ"
  - id: '2.22.5'
    kind: verse
    lines:
      - "सप्तर्षयो नारदश्च ते त्वां रक्षन्तु सर्वतः"
      - "नक्षत्राणि च सर्वाणि ग्रहाश्च सहदेवताः"
      - "महावनानि चरतो मुनिवेषस्य धीमतः"
    iast: "saptarṣayo nāradaś ca te tvāṃ rakṣantu sarvataḥ | nakṣatrāṇi ca sarvāṇi grahāś ca sahadevatāḥ | mahāvanāni carato muniveṣasya dhīmataḥ"
  - id: '2.22.14'
    kind: verse
    lines:
      - "यन्मङ्गलं सुपर्णस्य विनताकल्पयत्पुरा"
      - "अमृतं प्रार्थयानस्य तत्ते भवतु मङ्गलम्"
    iast: "yan maṅgalaṃ suparṇasya vinatākalpayat purā | amṛtaṃ prārthayānasya tat te bhavatu maṅgalam"
  - id: '2.23.1'
    kind: verse
    lines:
      - "अभिवाद्य तु कौसल्यां रामः संप्रस्थितो वनम्"
      - "कृतस्वस्त्ययनो मात्रा धर्मिष्ठे वर्त्मनि स्थितः"
    iast: "abhivādya tu kausalyāṃ rāmaḥ saṃprasthito vanam | kṛtasvastyayano mātrā dharmiṣṭhe vartmani sthitaḥ"
  - id: '2.23.5'
    kind: verse
    lines:
      - "प्रविवेशाथ रामस्तु स्ववेश्म सुविभूषितम्"
      - "प्रहृष्टजनसंपूर्णं ह्रिया किं चिदवाङ्मुखः"
    iast: "praviveśātha rāmas tu svaveśma suvibhūṣitam | prahṛṣṭajanasaṃpūrṇaṃ hriyā kiṃ cid avāṅmukhaḥ"
  - id: '2.23.6'
    kind: verse
    lines:
      - "अथ सीता समुत्पत्य वेपमाना च तं पतिम्"
      - "अपश्यच्छोकसंतप्तं चिन्ताव्याकुलिलेन्द्रियम्"
    iast: "atha sītā samutpatya vepamānā ca taṃ patim | apaśyac chokasaṃtaptaṃ cintāvyākulilendriyam"
  - id: '2.23.18'
    kind: verse
    lines:
      - "इतीव विलपन्तीं तां प्रोवाच रघुनन्दनः"
      - "सीते तत्रभवांस्तात प्रव्राजयति मां वनम्"
    iast: "itīva vilapantīṃ tāṃ provāca raghunandanaḥ | sīte tatrabhavāṃs tāta pravrājayati māṃ vanam"
  - id: '2.23.19'
    kind: verse
    lines:
      - "कुले महति संभूते धर्मज्ञे धर्मचारिणि"
      - "शृणु जानकि येनेदं क्रमेणाभ्यागतं मम"
    iast: "kule mahati saṃbhūte dharmajñe dharmacāriṇi | śṛṇu jānaki yenedaṃ krameṇābhyāgataṃ mama"
  - id: '2.23.20'
    kind: verse
    lines:
      - "राज्ञा सत्यप्रतिज्ञेन पित्रा दशरथेन मे"
      - "कैकेय्यै प्रीतमनसा पुरा दत्तौ महावरौ"
    iast: "rājñā satyapratijñena pitrā daśarathena me | kaikeyyai prītamanasā purā dattau mahāvarau"
  - id: '2.23.21'
    kind: verse
    lines:
      - "तयाद्य मम सज्जेऽस्मिन्नभिषेके नृपोद्यते"
      - "प्रचोदितः स समयो धर्मेण प्रतिनिर्जितः"
    iast: "tayādya mama sajje 'sminn abhiṣeke nṛpodyate | pracoditaḥ sa samayo dharmeṇa pratinirjitaḥ"
  - id: '2.23.22'
    kind: verse
    lines:
      - "चतुर्दश हि वर्षाणि वस्तव्यं दण्डके मया"
      - "पित्रा मे भरतश्चापि यौवराज्ये नियोजितः"
      - "सोऽहं त्वामागतो द्रष्टुं प्रस्थितो विजनं वनम्"
    iast: "caturdaśa hi varṣāṇi vastavyaṃ daṇḍake mayā | pitrā me bharataś cāpi yauvarājye niyojitaḥ | so 'haṃ tvām āgato draṣṭuṃ prasthito vijanaṃ vanam"
  - id: '2.23.23'
    kind: verse
    lines:
      - "भरतस्य समीपे ते नाहं कथ्यः कदा चन"
      - "ऋद्धियुक्ता हि पुरुषा न सहन्ते परस्तवम्"
      - "तस्मान्न ते गुणाः कथ्या भरतस्याग्रतो मम"
    iast: "bharatasya samīpe te nāhaṃ kathyaḥ kadā cana | ṛddhiyuktā hi puruṣā na sahante parastavam | tasmān na te guṇāḥ kathyā bharatasyāgrato mama"
  - id: '2.23.26'
    kind: verse
    lines:
      - "याते च मयि कल्याणि वनं मुनिनिषेवितम्"
      - "व्रतोपवासरतया भवितव्यं त्वयानघे"
    iast: "yāte ca mayi kalyāṇi vanaṃ muniniṣevitam | vratopavāsaratayā bhavitavyaṃ tvayānaghe"
  - id: '2.23.27'
    kind: verse
    lines:
      - "काल्यमुत्थाय देवानां कृत्वा पूजां यथाविधि"
      - "वन्दितव्यो दशरथः पिता मम नरेश्वरः"
    iast: "kālyam utthāya devānāṃ kṛtvā pūjāṃ yathāvidhi | vanditavyo daśarathaḥ pitā mama nareśvaraḥ"
  - id: '2.23.28'
    kind: verse
    lines:
      - "माता च मम कौसल्या वृद्धा संतापकर्शिता"
      - "धर्ममेवाग्रतः कृत्वा त्वत्तः संमानमर्हति"
    iast: "mātā ca mama kausalyā vṛddhā saṃtāpakarśitā | dharmam evāgrataḥ kṛtvā tvattaḥ saṃmānam arhati"
  - id: '2.23.29'
    kind: verse
    lines:
      - "वन्दितव्याश्च ते नित्यं याः शेषा मम मातरः"
      - "स्नेहप्रणयसंभोगैः समा हि मम मातरः"
    iast: "vanditavyāś ca te nityaṃ yāḥ śeṣā mama mātaraḥ | snehapraṇayasaṃbhogaiḥ samā hi mama mātaraḥ"
  - id: '2.24.1'
    kind: verse
    lines:
      - "एवमुक्ता तु वैदेही प्रियार्हा प्रियवादिनी"
      - "प्रणयादेव संक्रुद्धा भर्तारमिदमब्रवीत्"
    iast: "evam uktā tu vaidehī priyārhā priyavādinī | praṇayād eva saṃkruddhā bhartāram idam abravīt"
  - id: '2.24.2'
    kind: verse
    lines:
      - "आर्यपुत्र पिता माता भ्राता पुत्रस्तथा स्नुषा"
      - "स्वानि पुण्यानि भुञ्जानाः स्वं स्वं भाग्यमुपासते"
    iast: "āryaputra pitā mātā bhrātā putras tathā snuṣā | svāni puṇyāni bhuñjānāḥ svaṃ svaṃ bhāgyam upāsate"
  - id: '2.24.3'
    kind: verse
    lines:
      - "भर्तुर्भाग्यं तु भार्यैका प्राप्नोति पुरुषर्षभ"
      - "अतश्चैवाहमादिष्टा वने वस्तव्यमित्यपि"
    iast: "bhartur bhāgyaṃ tu bhāryaikā prāpnoti puruṣarṣabha | ataś caivāham ādiṣṭā vane vastavyam ity api"
  - id: '2.24.4'
    kind: verse
    lines:
      - "न पिता नात्मजो नात्मा न माता न सखीजनः"
      - "इह प्रेत्य च नारीणां पतिरेको गतिः सदा"
    iast: "na pitā nātmajo nātmā na mātā na sakhījanaḥ | iha pretya ca nārīṇāṃ patir eko gatiḥ sadā"
  - id: '2.24.5'
    kind: verse
    lines:
      - "यदि त्वं प्रस्थितो दुर्गं वनमद्यैव राघव"
      - "अग्रतस्ते गमिष्यामि मृद्नन्ती कुशकण्टकान्"
    iast: "yadi tvaṃ prasthito durgaṃ vanam adyaiva rāghava | agratas te gamiṣyāmi mṛdnantī kuśakaṇṭakān"
  - id: '2.24.6'
    kind: verse
    lines:
      - "ईर्ष्या रोषौ बहिष्कृत्य भुक्तशेषमिवोदकम्"
      - "नय मां वीर विश्रब्धः पापं मयि न विद्यते"
    iast: "īrṣyā roṣau bahiṣkṛtya bhuktaśeṣam ivodakam | naya māṃ vīra viśrabdhaḥ pāpaṃ mayi na vidyate"
  - id: '2.24.12'
    kind: verse
    lines:
      - "फलमूलाशना नित्यं भविष्यामि न संशयः"
      - "न ते दुःखं करिष्यामि निवसन्ती सह त्वया"
    iast: "phalamūlāśanā nityaṃ bhaviṣyāmi na saṃśayaḥ | na te duḥkhaṃ kariṣyāmi nivasantī saha tvayā"
  - id: '2.24.16'
    kind: verse
    lines:
      - "स्वर्गेऽपि च विना वासो भविता यदि राघव"
      - "त्वया मम नरव्याघ्र नाहं तमपि रोचये"
    iast: "svarge 'pi ca vinā vāso bhavitā yadi rāghava | tvayā mama naravyāghra nāhaṃ tam api rocaye"
  - id: '2.25.4'
    kind: verse
    lines:
      - "सीते विमुच्यतामेषा वनवासकृता मतिः"
      - "बहुदोषं हि कान्तारं वनमित्यभिधीयते"
    iast: "sīte vimucyatām eṣā vanavāsakṛtā matiḥ | bahudoṣaṃ hi kāntāraṃ vanam ity abhidhīyate"
  - id: '2.26.1'
    kind: verse
    lines:
      - "एतत्तु वचनं श्रुत्वा सीता रामस्य दुःखिता"
      - "प्रसक्ताश्रुमुखी मन्दमिदं वचनमब्रवीत्"
    iast: "etat tu vacanaṃ śrutvā sītā rāmasya duḥkhitā | prasaktāśrumukhī mandam idaṃ vacanam abravīt"
  - id: '2.26.2'
    kind: verse
    lines:
      - "ये त्वया कीर्तिता दोषा वने वस्तव्यतां प्रति"
      - "गुणानित्येव तान्विद्धि तव स्नेहपुरस्कृतान्"
    iast: "ye tvayā kīrtitā doṣā vane vastavyatāṃ prati | guṇān ity eva tān viddhi tava snehapuraskṛtān"
  - id: '2.26.5'
    kind: verse
    lines:
      - "पतिहीना तु या नारी न सा शक्ष्यति जीवितुम्"
      - "काममेवंविधं राम त्वया मम विदर्शितम्"
    iast: "patihīnā tu yā nārī na sā śakṣyati jīvitum | kāmam evaṃvidhaṃ rāma tvayā mama vidarśitam"
  - id: '2.26.14'
    kind: verse
    lines:
      - "शुद्धात्मन्प्रेमभावाद्धि भविष्यामि विकल्मषा"
      - "भर्तारमनुगच्छन्ती भर्ता हि मम दैवतम्"
    iast: "śuddhātman premabhāvād dhi bhaviṣyāmi vikalmaṣā | bhartāram anugacchantī bhartā hi mama daivatam"
  - id: '2.26.15'
    kind: verse
    lines:
      - "प्रेत्यभावेऽपि कल्याणः संगमो मे सह त्वया"
      - "श्रुतिर्हि श्रूयते पुण्या ब्राह्मणानां यशस्विनाम्"
    iast: "pretyabhāve 'pi kalyāṇaḥ saṃgamo me saha tvayā | śrutir hi śrūyate puṇyā brāhmaṇānāṃ yaśasvinām"
  - id: '2.26.16'
    kind: verse
    lines:
      - "इह लोके च पितृभिर्या स्त्री यस्य महामते"
      - "अद्भिर्दत्ता स्वधर्मेण प्रेत्यभावेऽपि तस्य सा"
    iast: "iha loke ca pitṛbhir yā strī yasya mahāmate | adbhir dattā svadharmeṇa pretyabhāve 'pi tasya sā"
  - id: '2.27.3'
    kind: verse
    lines:
      - "किं त्वामन्यत वैदेहः पिता मे मिथिलाधिपः"
      - "राम जामातरं प्राप्य स्त्रियं पुरुषविग्रहम्"
    iast: "kiṃ tvāmanyata vaidehaḥ pitā me mithilādhipaḥ | rāma jāmātaraṃ prāpya striyaṃ puruṣavigraham"
  - id: '2.27.6'
    kind: verse
    lines:
      - "द्युमत्सेनसुतं वीर सत्यवन्तमनुव्रताम्"
      - "सावित्रीमिव मां विद्धि त्वमात्मवशवर्तिनीम्"
    iast: "dyumatsenasutaṃ vīra satyavantam anuvratām | sāvitrīm iva māṃ viddhi tvam ātmavaśavartinīm"
  - id: '2.27.7'
    kind: verse
    lines:
      - "न त्वहं मनसाप्यन्यं द्रष्टास्मि त्वदृतेऽनघ"
      - "त्वया राघव गच्छेयं यथान्या कुलपांसनी"
    iast: "na tv ahaṃ manasāpy anyaṃ draṣṭāsmi tvadṛte 'nagha | tvayā rāghava gaccheyaṃ yathānyā kulapāṃsanī"
  - id: '2.27.8'
    kind: verse
    lines:
      - "स्वयं तु भार्यां कौमारीं चिरमध्युषितां सतीम्"
      - "शैलूष इव मां राम परेभ्यो दातुमिच्छसि"
    iast: "svayaṃ tu bhāryāṃ kaumārīṃ ciram adhyuṣitāṃ satīm | śailūṣa iva māṃ rāma parebhyo dātum icchasi"
  - id: '2.27.17'
    kind: verse
    lines:
      - "यस्त्वया सह स स्वर्गो निरयो यस्त्वया विना"
      - "इति जानन्परां प्रीतिं गच्छ राम मया सह"
    iast: "yas tvayā saha sa svargo nirayo yas tvayā vinā | iti jānan parāṃ prītiṃ gaccha rāma mayā saha"
  - id: '2.27.24'
    kind: verse
    lines:
      - "तां परिष्वज्य बाहुभ्यां विसंज्ञामिव दुःखिताम्"
      - "उवाच वचनं रामः परिविश्वासयंस्तदा"
    iast: "tāṃ pariṣvajya bāhubhyāṃ visaṃjñām iva duḥkhitām | uvāca vacanaṃ rāmaḥ pariviśvāsayaṃs tadā"
  - id: '2.27.25'
    kind: verse
    lines:
      - "न देवि तव दुःखेन स्वर्गमप्यभिरोचये"
      - "न हि मेऽस्ति भयं किं चित्स्वयम्भोरिव सर्वतः"
    iast: "na devi tava duḥkhena svargam apy abhirocaye | na hi me 'sti bhayaṃ kiṃ cit svayambhor iva sarvataḥ"
  - id: '2.27.30'
    kind: verse
    lines:
      - "स मां पिता यथा शास्ति सत्यधर्मपथे स्थितः"
      - "तथा वर्तितुमिच्छामि स हि धर्मः सनातनः"
      - "अनुगच्छस्व मां भीरु सहधर्मचरी भव"
    iast: "sa māṃ pitā yathā śāsti satyadharmapathe sthitaḥ | tathā vartitum icchāmi sa hi dharmaḥ sanātanaḥ | anugacchasva māṃ bhīru sahadharmacarī bhava"
  - id: '2.27.32'
    kind: verse
    lines:
      - "अनुकूलं तु सा भर्तुर्ज्ञात्वा गमनमात्मनः"
      - "क्षिप्रं प्रमुदिता देवी दातुमेवोपचक्रमे"
    iast: "anukūlaṃ tu sā bhartur jñātvā gamanam ātmanaḥ | kṣipraṃ pramuditā devī dātum evopacakrame"
  - id: '2.28.1'
    kind: verse
    lines:
      - "ततोऽब्रवीन्महातेजा रामो लक्ष्मणमग्रतः"
      - "स्थितं प्राग्गामिनं वीरं याचमानं कृताञ्जलिम्"
    iast: "tato 'bravīn mahātejā rāmo lakṣmaṇam agrataḥ | sthitaṃ prāggāminaṃ vīraṃ yācamānaṃ kṛtāñjalim"
  - id: '2.28.2'
    kind: verse
    lines:
      - "मयाद्य सह सौमित्रे त्वयि गच्छति तद्वनम्"
      - "को भरिष्यति कौसल्यां सुमित्रां वा यशस्विनीम्"
    iast: "mayādya saha saumitre tvayi gacchati tad vanam | ko bhariṣyati kausalyāṃ sumitrāṃ vā yaśasvinīm"
  - id: '2.28.5'
    kind: verse
    lines:
      - "एवमुक्तस्तु रामेण लक्ष्मणः श्लक्ष्णया गिरा"
      - "प्रत्युवाच तदा रामं वाक्यज्ञो वाक्यकोविदम्"
    iast: "evam uktas tu rāmeṇa lakṣmaṇaḥ ślakṣṇayā girā | pratyuvāca tadā rāmaṃ vākyajño vākyakovidam"
  - id: '2.28.6'
    kind: verse
    lines:
      - "तवैव तेजसा वीर भरतः पूजयिष्यति"
      - "कौसल्यां च सुमित्रां च प्रयतो नात्र संशयः"
    iast: "tavaiva tejasā vīra bharataḥ pūjayiṣyati | kausalyāṃ ca sumitrāṃ ca prayato nātra saṃśayaḥ"
  - id: '2.28.8'
    kind: verse
    lines:
      - "धनुरादाय सशरं खनित्रपिटकाधरः"
      - "अग्रतस्ते गमिष्यामि पन्थानमनुदर्शयन्"
    iast: "dhanur ādāya saśaraṃ khanitrapiṭakādharaḥ | agratas te gamiṣyāmi panthānam anudarśayan"
  - id: '2.28.9'
    kind: verse
    lines:
      - "आहरिष्यामि ते नित्यं मूलानि च फलानि च"
      - "वन्यानि यानि चान्यानि स्वाहाराणि तपस्विनाम्"
    iast: "āhariṣyāmi te nityaṃ mūlāni ca phalāni ca | vanyāni yāni cānyāni svāhārāṇi tapasvinām"
  - id: '2.28.10'
    kind: verse
    lines:
      - "भवांस्तु सह वैदेह्या गिरिसानुषु रंस्यते"
      - "अहं सर्वं करिष्यामि जाग्रतः स्वपतश्च ते"
    iast: "bhavāṃs tu saha vaidehyā girisānuṣu raṃsyate | ahaṃ sarvaṃ kariṣyāmi jāgrataḥ svapataś ca te"
  - id: '2.28.11'
    kind: verse
    lines:
      - "रामस्त्वनेन वाक्येन सुप्रीतः प्रत्युवाच तम्"
      - "व्रजापृच्छस्व सौमित्रे सर्वमेव सुहृज्जनम्"
    iast: "rāmas tv anena vākyena suprītaḥ pratyuvāca tam | vrajāpṛcchasva saumitre sarvam eva suhṛjjanam"
  - id: '2.30.1'
    kind: verse
    lines:
      - "दत्त्वा तु सह वैदेह्या ब्राह्मणेभ्यो धनं बहु"
      - "जग्मतुः पितरं द्रष्टुं सीतया सह राघवौ"
    iast: "dattvā tu saha vaidehyā brāhmaṇebhyo dhanaṃ bahu | jagmatuḥ pitaraṃ draṣṭuṃ sītayā saha rāghavau"
  - id: '2.31.2'
    kind: verse
    lines:
      - "आलोक्य तु महाप्राज्ञः परमाकुल चेतसं"
      - "राममेवानुशोचन्तं सूतः प्राञ्जलिरासदत्"
    iast: "ālokya tu mahāprājñaḥ paramākula cetasaṃ | rāmam evānuśocantaṃ sūtaḥ prāñjalir āsadat"
  - id: '2.31.3'
    kind: verse
    lines:
      - "अयं स पुरुषव्याघ्र द्वारि तिष्ठति ते सुतः"
      - "ब्राह्मणेभ्यो धनं दत्त्वा सर्वं चैवोपजीविनाम्"
    iast: "ayaṃ sa puruṣavyāghra dvāri tiṣṭhati te sutaḥ | brāhmaṇebhyo dhanaṃ dattvā sarvaṃ caivopajīvinām"
  - id: '2.31.5'
    kind: verse
    lines:
      - "गमिष्यति महारण्यं तं पश्य जगतीपते"
      - "वृतं राजगुणैः सर्वैरादित्यमिव रश्मिभिः"
    iast: "gamiṣyati mahāraṇyaṃ taṃ paśya jagatīpate | vṛtaṃ rājaguṇaiḥ sarvair ādityam iva raśmibhiḥ"
  - id: '2.31.6'
    kind: verse
    lines:
      - "स सत्यवादी धर्मात्मा गाम्भीर्यात्सागरोपमः"
      - "आकाश इव निष्पङ्को नरेन्द्रः प्रत्युवाच तम्"
    iast: "sa satyavādī dharmātmā gāmbhīryāt sāgaropamaḥ | ākāśa iva niṣpaṅko narendraḥ pratyuvāca tam"
  - id: '2.31.7'
    kind: verse
    lines:
      - "सुमन्त्रानय मे दारान्ये के चिदिह मामकाः"
      - "दारैः परिवृतः सर्वैर्द्रष्टुमिच्छामि राघवम्"
    iast: "sumantrānaya me dārān ye ke cid iha māmakāḥ | dāraiḥ parivṛtaḥ sarvair draṣṭum icchāmi rāghavam"
  - id: '2.31.10'
    kind: verse
    lines:
      - "अर्धसप्तशतास्तास्तु प्रमदास्ताम्रलोचनाः"
      - "कौसल्यां परिवार्याथ शनैर्जग्मुर्धृतव्रताः"
    iast: "ardhasaptaśatās tās tu pramadās tāmralocanāḥ | kausalyāṃ parivāryātha śanair jagmur dhṛtavratāḥ"
  - id: '2.31.12'
    kind: verse
    lines:
      - "स सूतो राममादाय लक्ष्मणं मैथिलीं तदा"
      - "जगामाभिमुखस्तूर्णं सकाशं जगतीपतेः"
    iast: "sa sūto rāmam ādāya lakṣmaṇaṃ maithilīṃ tadā | jagāmābhimukhas tūrṇaṃ sakāśaṃ jagatīpateḥ"
  - id: '2.31.14'
    kind: verse
    lines:
      - "सोऽभिदुद्राव वेगेन रामं दृष्ट्वा विशां पतिः"
      - "तमसंप्राप्य दुःखार्तः पपात भुवि मूर्छितः"
    iast: "so 'bhidudrāva vegena rāmaṃ dṛṣṭvā viśāṃ patiḥ | tam asaṃprāpya duḥkhārtaḥ papāta bhuvi mūrchitaḥ"
  - id: '2.31.18'
    kind: verse
    lines:
      - "अथ रामो मुहूर्तेन लब्धसंज्ञं महीपतिम्"
      - "उवाच प्राञ्जलिर्भूत्वा शोकार्णवपरिप्लुतम्"
    iast: "atha rāmo muhūrtena labdhasaṃjñaṃ mahīpatim | uvāca prāñjalir bhūtvā śokārṇavapariplutam"
  - id: '2.31.19'
    kind: verse
    lines:
      - "आपृच्छे त्वां महाराज सर्वेषामीश्वरोऽसि नः"
      - "प्रस्थितं दण्डकारण्यं पश्य त्वं कुशलेन माम्"
    iast: "āpṛcche tvāṃ mahārāja sarveṣām īśvaro 'si naḥ | prasthitaṃ daṇḍakāraṇyaṃ paśya tvaṃ kuśalena mām"
  - id: '2.31.20'
    kind: verse
    lines:
      - "लक्ष्मणं चानुजानीहि सीता चान्वेति मां वनम्"
      - "कारणैर्बहुभिस्तथ्यैर्वार्यमाणौ न चेच्छतः"
    iast: "lakṣmaṇaṃ cānujānīhi sītā cānveti māṃ vanam | kāraṇair bahubhis tathyair vāryamāṇau na cecchataḥ"
  - id: '2.31.21'
    kind: verse
    lines:
      - "अनुजानीहि सर्वान्नः शोकमुत्सृज्य मानद"
      - "लक्ष्मणं मां च सीतां च प्रजापतिरिव प्रजाः"
    iast: "anujānīhi sarvān naḥ śokam utsṛjya mānada | lakṣmaṇaṃ māṃ ca sītāṃ ca prajāpatir iva prajāḥ"
  - id: '2.31.25'
    kind: verse
    lines:
      - "भवान्वर्षसहस्राय पृथिव्या नृपते पतिः"
      - "अहं त्वरण्ये वत्स्यामि न मे कार्यं त्वयानृतम्"
    iast: "bhavān varṣasahasrāya pṛthivyā nṛpate patiḥ | ahaṃ tv araṇye vatsyāmi na me kāryaṃ tvayānṛtam"
  - id: '2.31.26'
    kind: verse
    lines:
      - "श्रेयसे वृद्धये तात पुनरागमनाय च"
      - "गच्छस्वारिष्टमव्यग्रः पन्थानमकुतोभयम्"
    iast: "śreyase vṛddhaye tāta punarāgamanāya ca | gacchasvāriṣṭam avyagraḥ panthānam akutobhayam"
  - id: '2.34.29'
    kind: verse
    lines:
      - "तां प्राञ्जलिरभिक्रम्य मातृमध्येऽतिसत्कृताम्"
      - "रामः परमधर्मज्ञो मातरं वाक्यमब्रवीत्"
    iast: "tāṃ prāñjalir abhikramya mātṛmadhye 'tisatkṛtām | rāmaḥ paramadharmajño mātaraṃ vākyam abravīt"
  - id: '2.34.30'
    kind: verse
    lines:
      - "अम्ब मा दुःखिता भूस्त्वं पश्य त्वं पितरं मम"
      - "क्षयो हि वनवासस्य क्षिप्रमेव भविष्यति"
    iast: "amba mā duḥkhitā bhūs tvaṃ paśya tvaṃ pitaraṃ mama | kṣayo hi vanavāsasya kṣipram eva bhaviṣyati"
  - id: '2.34.31'
    kind: verse
    lines:
      - "सुप्तायास्ते गमिष्यन्ति नववर्षाणि पञ्च च"
      - "सा समग्रमिह प्राप्तं मां द्रक्ष्यसि सुहृद्वृतम्"
    iast: "suptāyās te gamiṣyanti navavarṣāṇi pañca ca | sā samagram iha prāptaṃ māṃ drakṣyasi suhṛdvṛtam"
  - id: '2.35.2'
    kind: verse
    lines:
      - "तं चापि समनुज्ञाप्य धर्मज्ञः सीतया सह"
      - "राघवः शोकसंमूढो जननीमभ्यवादयत्"
    iast: "taṃ cāpi samanujñāpya dharmajñaḥ sītayā saha | rāghavaḥ śokasaṃmūḍho jananīm abhyavādayat"
  - id: '2.35.3'
    kind: verse
    lines:
      - "अन्वक्षं लक्ष्मणो भ्रातुः कौसल्यामभ्यवादयत्"
      - "अथ मातुः सुमित्राया जग्राह चरणौ पुनः"
    iast: "anvakṣaṃ lakṣmaṇo bhrātuḥ kausalyām abhyavādayat | atha mātuḥ sumitrāyā jagrāha caraṇau punaḥ"
  - id: '2.35.4'
    kind: verse
    lines:
      - "तं वन्दमानं रुदती माता सौमित्रिमब्रवीत्"
      - "हितकामा महाबाहुं मूर्ध्न्युपाघ्राय लक्ष्मणम्"
    iast: "taṃ vandamānaṃ rudatī mātā saumitrim abravīt | hitakāmā mahābāhuṃ mūrdhny upāghrāya lakṣmaṇam"
  - id: '2.35.5'
    kind: verse
    lines:
      - "सृष्टस्त्वं वनवासाय स्वनुरक्तः सुहृज्जने"
      - "रामे प्रमादं मा कार्षीः पुत्र भ्रातरि गच्छति"
    iast: "sṛṣṭas tvaṃ vanavāsāya svanuraktaḥ suhṛjjane | rāme pramādaṃ mā kārṣīḥ putra bhrātari gacchati"
  - id: '2.35.6'
    kind: verse
    lines:
      - "व्यसनी वा समृद्धो वा गतिरेष तवानघ"
      - "एष लोके सतां धर्मो यज्ज्येष्ठवशगो भवेत्"
    iast: "vyasanī vā samṛddho vā gatir eṣa tavānagha | eṣa loke satāṃ dharmo yaj jyeṣṭhavaśago bhavet"
  - id: '2.35.8'
    kind: verse
    lines:
      - "रामं दशरथं विद्धि मां विद्धि जनकात्मजाम्"
      - "अयोध्यामटवीं विद्धि गच्छ तात यथासुखम्"
    iast: "rāmaṃ daśarathaṃ viddhi māṃ viddhi janakātmajām | ayodhyām aṭavīṃ viddhi gaccha tāta yathāsukham"
  - id: '2.35.14'
    kind: verse
    lines:
      - "सीतातृतीयानारूढान्दृष्ट्वा धृष्टमचोदयत्"
      - "सुमन्त्रः संमतानश्वान्वायुवेगसमाञ्जवे"
    iast: "sītātṛtīyān ārūḍhān dṛṣṭvā dhṛṣṭam acodayat | sumantraḥ saṃmatān aśvān vāyuvegasamāñ jave"
  - id: '2.40.4'
    kind: verse
    lines:
      - "स याच्यमानः काकुत्स्थः स्वाभिः प्रकृतिभिस्तदा"
      - "कुर्वाणः पितरं सत्यं वनमेवान्वपद्यत"
    iast: "sa yācyamānaḥ kākutsthaḥ svābhiḥ prakṛtibhis tadā | kurvāṇaḥ pitaraṃ satyaṃ vanam evānvapadyata"
  - id: '2.40.6'
    kind: verse
    lines:
      - "या प्रीतिर्बहुमानश्च मय्ययोध्यानिवासिनाम्"
      - "मत्प्रियार्थं विशेषेण भरते सा निवेश्यताम्"
    iast: "yā prītir bahumānaś ca mayy ayodhyānivāsinām | matpriyārthaṃ viśeṣeṇa bharate sā niveśyatām"
  - id: '2.40.7'
    kind: verse
    lines:
      - "स हि कल्याण चारित्रः कैकेय्यानन्दवर्धनः"
      - "करिष्यति यथावद्वः प्रियाणि च हितानि च"
    iast: "sa hi kalyāṇa cāritraḥ kaikeyyānandavardhanaḥ | kariṣyati yathāvad vaḥ priyāṇi ca hitāni ca"
  - id: '2.43.2'
    kind: verse
    lines:
      - "तथैव गच्छतस्तस्य व्यपायाद्रजनी शिवा"
      - "उपास्य स शिवां संध्यां विषयान्तं व्यगाहत"
    iast: "tathaiva gacchatas tasya vyapāyād rajanī śivā | upāsya sa śivāṃ saṃdhyāṃ viṣayāntaṃ vyagāhata"
  - id: '2.44.1'
    kind: verse
    lines:
      - "विशालान्कोसलान्रम्यान्यात्वा लक्ष्मणपूर्वजः"
      - "आससाद महाबाहुः शृङ्गवेरपुरं प्रति"
    iast: "viśālān kosalān ramyān yātvā lakṣmaṇapūrvajaḥ | āsasāda mahābāhuḥ śṛṅgaverapuraṃ prati"
  - id: '2.44.9'
    kind: verse
    lines:
      - "तत्र राजा गुहो नाम रामस्यात्मसमः सखा"
      - "निषादजात्यो बलवान्स्थपतिश्चेति विश्रुतः"
    iast: "tatra rājā guho nāma rāmasyātmasamaḥ sakhā | niṣādajātyo balavān sthapatiś ceti viśrutaḥ"
  - id: '2.44.11'
    kind: verse
    lines:
      - "ततो निषादाधिपतिं दृष्ट्वा दूरादवस्थितम्"
      - "सह सौमित्रिणा रामः समागच्छद्गुहेन सः"
    iast: "tato niṣādādhipatiṃ dṛṣṭvā dūrād avasthitam | saha saumitriṇā rāmaḥ samāgacchad guhena saḥ"
  - id: '2.46.51'
    kind: verse
    lines:
      - "नगरीं त्वां गतं दृष्ट्वा जननी मे यवीयसी"
      - "कैकेयी प्रत्ययं गच्छेदिति रामो वनं गतः"
    iast: "nagarīṃ tvāṃ gataṃ dṛṣṭvā jananī me yavīyasī | kaikeyī pratyayaṃ gacched iti rāmo vanaṃ gataḥ"
  - id: '2.46.52'
    kind: verse
    lines:
      - "परितुष्टा हि सा देवि वनवासं गते मयि"
      - "राजानं नातिशङ्केत मिथ्यावादीति धार्मिकम्"
    iast: "parituṣṭā hi sā devi vanavāsaṃ gate mayi | rājānaṃ nātiśaṅketa mithyāvādīti dhārmikam"
  - id: '2.46.54'
    kind: verse
    lines:
      - "मम प्रियार्थं राज्ञश्च सरथस्त्वं पुरीं व्रज"
      - "संदिष्टश्चासि यानर्थांस्तांस्तान्ब्रूयास्तथातथा"
    iast: "mama priyārthaṃ rājñaś ca sarathas tvaṃ purīṃ vraja | saṃdiṣṭaś cāsi yān arthāṃs tāṃs tān brūyās tathātathā"
  - id: '2.46.65'
    kind: verse
    lines:
      - "अनुज्ञाय सुमन्त्रं च सबलं चैव तं गुहम्"
      - "आस्थाय नावं रामस्तु चोदयामास नाविकान्"
    iast: "anujñāya sumantraṃ ca sabalaṃ caiva taṃ guham | āsthāya nāvaṃ rāmas tu codayām āsa nāvikān"
  - id: '2.48.8'
    kind: verse
    lines:
      - "धन्विनौ तौ सुखं गत्वा लम्बमाने दिवाकरे"
      - "गङ्गायमुनयोः संधौ प्रापतुर्निलयं मुनेः"
    iast: "dhanvinau tau sukhaṃ gatvā lambamāne divākare | gaṅgāyamunayoḥ saṃdhau prāpatur nilayaṃ muneḥ"
  - id: '2.48.19'
    kind: verse
    lines:
      - "चिरस्य खलु काकुत्स्थ पश्यामि त्वामिहागतम्"
      - "श्रुतं तव मया चेदं विवासनमकारणम्"
    iast: "cirasya khalu kākutstha paśyāmi tvām ihāgatam | śrutaṃ tava mayā cedaṃ vivāsanam akāraṇam"
  - id: '2.48.29'
    kind: verse
    lines:
      - "प्रविविक्तमहं मन्ये तं वासं भवतः सुखम्"
      - "इह वा वनवासाय वस राम मया सह"
    iast: "praviviktam ahaṃ manye taṃ vāsaṃ bhavataḥ sukham | iha vā vanavāsāya vasa rāma mayā saha"
  - id: '2.50.11'
    kind: verse
    lines:
      - "ततस्तौ पादचारेण गच्छन्तौ सह सीतया"
      - "रम्यमासेदतुः शैलं चित्रकूटं मनोरमम्"
    iast: "tatas tau pādacāreṇa gacchantau saha sītayā | ramyam āsedatuḥ śailaṃ citrakūṭaṃ manoramam"
  - id: '2.50.13'
    kind: verse
    lines:
      - "लक्ष्मणानय दारूणि दृढानि च वराणि च"
      - "कुरुष्वावसथं सौम्य वासे मेऽभिरतं मनः"
    iast: "lakṣmaṇānaya dārūṇi dṛḍhāni ca varāṇi ca | kuruṣvāvasathaṃ saumya vāse me 'bhirataṃ manaḥ"
  - id: '2.50.14'
    kind: verse
    lines:
      - "तस्य तद्वचनं श्रुत्वा सौमित्रिर्विविधान्द्रुमान्"
      - "आजहार ततश्चक्रे पर्ण शालामरिं दम"
    iast: "tasya tad vacanaṃ śrutvā saumitrir vividhān drumān | ājahāra tataś cakre parṇa śālām ariṃ dama"
  - id: '2.51.4'
    kind: verse
    lines:
      - "ततः सायाह्नसमये तृतीयेऽहनि सारथिः"
      - "अयोध्यां समनुप्राप्य निरानन्दां ददर्श ह"
    iast: "tataḥ sāyāhnasamaye tṛtīye 'hani sārathiḥ | ayodhyāṃ samanuprāpya nirānandāṃ dadarśa ha"
  - id: '2.52.12'
    kind: verse
    lines:
      - "सूत मद्वचनात्तस्य तातस्य विदितात्मनः"
      - "शिरसा वन्दनीयस्य वन्द्यौ पादौ महात्मनः"
    iast: "sūta madvacanāt tasya tātasya viditātmanaḥ | śirasā vandanīyasya vandyau pādau mahātmanaḥ"
  - id: '2.52.14'
    kind: verse
    lines:
      - "माता च मम कौसल्या कुशलं चाभिवादनम्"
      - "देवि देवस्य पादौ च देववत्परिपालय"
    iast: "mātā ca mama kausalyā kuśalaṃ cābhivādanam | devi devasya pādau ca devavat paripālaya"
  - id: '2.52.15'
    kind: verse
    lines:
      - "भरतः कुशलं वाच्यो वाच्यो मद्वचनेन च"
      - "सर्वास्वेव यथान्यायं वृत्तिं वर्तस्व मातृषु"
    iast: "bharataḥ kuśalaṃ vācyo vācyo madvacanena ca | sarvāsv eva yathānyāyaṃ vṛttiṃ vartasva mātṛṣu"
  - id: '2.52.17'
    kind: verse
    lines:
      - "इत्येवं मां महाराज ब्रुवन्नेव महायशाः"
      - "रामो राजीवताम्राक्षो भृशमश्रूण्यवर्तयत्"
    iast: "ity evaṃ māṃ mahārāja bruvann eva mahāyaśāḥ | rāmo rājīvatāmrākṣo bhṛśam aśrūṇy avartayat"
  - id: '2.53.14'
    kind: verse
    lines:
      - "सूतस्य वचनं श्रुत्वा वाचा परमदीनया"
      - "बाष्पोपहतया राजा तं सूतमिदमब्रवीत्"
    iast: "sūtasya vacanaṃ śrutvā vācā paramadīnayā | bāṣpopahatayā rājā taṃ sūtam idam abravīt"
  - id: '2.53.15'
    kind: verse
    lines:
      - "कैकेय्या विनियुक्तेन पापाभिजनभावया"
      - "मया न मन्त्रकुशलैर्वृद्धैः सह समर्थितम्"
    iast: "kaikeyyā viniyuktena pāpābhijanabhāvayā | mayā na mantrakuśalair vṛddhaiḥ saha samarthitam"
  - id: '2.53.16'
    kind: verse
    lines:
      - "न सुहृद्भिर्न चामात्यैर्मन्त्रयित्वा न नैगमैः"
      - "मयायमर्थः संमोहात्स्त्रीहेतोः सहसा कृतः"
    iast: "na suhṛdbhir na cāmātyair mantrayitvā na naigamaiḥ | mayāyam arthaḥ saṃmohāt strīhetoḥ sahasā kṛtaḥ"
  - id: '2.53.24'
    kind: verse
    lines:
      - "हा राम रामानुज हा हा वैदेहि तपस्विनी"
      - "न मां जानीत दुःखेन म्रियमाणमनाथवत्"
      - "दुस्तरो जीवता देवि मयायं शोकसागरः"
    iast: "hā rāma rāmānuja hā hā vaidehi tapasvinī | na māṃ jānīta duḥkhena mriyamāṇam anāthavat | dustaro jīvatā devi mayāyaṃ śokasāgaraḥ"
  - id: '2.58.56'
    kind: verse
    lines:
      - "हा राघव महाबाहो हा ममायास नाशन"
      - "राजा दशरथः शोचञ्जीवितान्तमुपागमत्"
    iast: "hā rāghava mahābāho hā mamāyāsa nāśana | rājā daśarathaḥ śocañ jīvitāntam upāgamat"
  - id: '2.60.12'
    kind: verse
    lines:
      - "तैलद्रोण्यामथामात्याः संवेश्य जगतीपतिम्"
      - "राज्ञः सर्वाण्यथादिष्टाश्चक्रुः कर्माण्यनन्तरम्"
    iast: "tailadroṇyām athāmātyāḥ saṃveśya jagatīpatim | rājñaḥ sarvāṇy athādiṣṭāś cakruḥ karmāṇy anantaram"
  - id: '2.60.13'
    kind: verse
    lines:
      - "न तु संकलनं राज्ञो विना पुत्रेण मन्त्रिणः"
      - "सर्वज्ञाः कर्तुमीषुस्ते ततो रक्षन्ति भूमिपम्"
    iast: "na tu saṃkalanaṃ rājño vinā putreṇa mantriṇaḥ | sarvajñāḥ kartum īṣus te tato rakṣanti bhūmipam"
  - id: '2.61.1'
    kind: verse
    lines:
      - "व्यतीतायां तु शर्वर्यामादित्यस्योदये ततः"
      - "समेत्य राजकर्तारः सभामीयुर्द्विजातयः"
    iast: "vyatītāyāṃ tu śarvaryām ādityasyodaye tataḥ | sametya rājakartāraḥ sabhām īyur dvijātayaḥ"
  - id: '2.61.3'
    kind: verse
    lines:
      - "एते द्विजाः सहामात्यैः पृथग्वाचमुदीरयन्"
      - "वसिष्ठमेवाभिमुखाः श्रेष्ठो राजपुरोहितम्"
    iast: "ete dvijāḥ sahāmātyaiḥ pṛthag vācam udīrayan | vasiṣṭham evābhimukhāḥ śreṣṭho rājapurohitam"
  - id: '2.62.1'
    kind: verse
    lines:
      - "तेषां तद्वचनं श्रुत्वा वसिष्ठः प्रत्युवाच ह"
      - "मित्रामात्यगणान्सर्वान्ब्राह्मणांस्तानिदं वचः"
    iast: "teṣāṃ tad vacanaṃ śrutvā vasiṣṭhaḥ pratyuvāca ha | mitrāmātyagaṇān sarvān brāhmaṇāṃs tān idaṃ vacaḥ"
  - id: '2.62.2'
    kind: verse
    lines:
      - "यदसौ मातुलकुले पुरे राजगृहे सुखी"
      - "भरतो वसति भ्रात्रा शत्रुघ्नेन समन्वितः"
    iast: "yad asau mātulakule pure rājagṛhe sukhī | bharato vasati bhrātrā śatrughnena samanvitaḥ"
  - id: '2.62.3'
    kind: verse
    lines:
      - "तच्छीघ्रं जवना दूता गच्छन्तु त्वरितैर्हयैः"
      - "आनेतुं भ्रातरौ वीरौ किं समीक्षामहे वयम्"
    iast: "tac chīghraṃ javanā dūtā gacchantu tvaritair hayaiḥ | ānetuṃ bhrātarau vīrau kiṃ samīkṣāmahe vayam"
  - id: '2.62.9'
    kind: verse
    lines:
      - "कौशेयानि च वस्त्राणि भूषणानि वराणि च"
      - "क्षिप्रमादाय राज्ञश्च भरतस्य च गच्छत"
      - "वसिष्ठेनाभ्यनुज्ञाता दूताः संत्वरिता ययुः"
    iast: "kauśeyāni ca vastrāṇi bhūṣaṇāni varāṇi ca | kṣipram ādāya rājñaś ca bharatasya ca gacchata | vasiṣṭhenābhyanujñātā dūtāḥ saṃtvaritā yayuḥ"
  - id: '2.62.14'
    kind: verse
    lines:
      - "ते श्रान्तवाहना दूता विकृष्टेन सता पथा"
      - "गिरि व्रजं पुर वरं शीघ्रमासेदुरञ्जसा"
    iast: "te śrāntavāhanā dūtā vikṛṣṭena satā pathā | giri vrajaṃ pura varaṃ śīghram āsedur añjasā"
  - id: '2.64.3'
    kind: verse
    lines:
      - "पुरोहितस्त्वा कुशलं प्राह सर्वे च मन्त्रिणः"
      - "त्वरमाणश्च निर्याहि कृत्यमात्ययिकं त्वया"
    iast: "purohitas tvā kuśalaṃ prāha sarve ca mantriṇaḥ | tvaramāṇaś ca niryāhi kṛtyam ātyayikaṃ tvayā"
  - id: '2.64.22'
    kind: verse
    lines:
      - "स मातामहमापृच्छ्य मातुलं च युधाजितम्"
      - "रथमारुह्य भरतः शत्रुघ्नसहितो ययौ"
    iast: "sa mātāmaham āpṛcchya mātulaṃ ca yudhājitam | ratham āruhya bharataḥ śatrughnasahito yayau"
  - id: '2.65.14'
    kind: verse
    lines:
      - "तां पुरीं पुरुषव्याघ्रः सप्तरात्रोषिटः पथि"
      - "अयोध्यामग्रतो दृष्ट्वा रथे सारथिमब्रवीत्"
    iast: "tāṃ purīṃ puruṣavyāghraḥ saptarātroṣiṭaḥ pathi | ayodhyām agrato dṛṣṭvā rathe sārathim abravīt"
  - id: '2.65.24'
    kind: verse
    lines:
      - "श्रुता नो यादृशाः पूर्वं नृपतीनां विनाशने"
      - "आकारास्तानहं सर्वानिह पश्यामि सारथे"
    iast: "śrutā no yādṛśāḥ pūrvaṃ nṛpatīnāṃ vināśane | ākārās tān ahaṃ sarvān iha paśyāmi sārathe"
  - id: '2.66.1'
    kind: verse
    lines:
      - "अपश्यंस्तु ततस्तत्र पितरं पितुरालये"
      - "जगाम भरतो द्रष्टुं मातरं मातुरालये"
    iast: "apaśyaṃs tu tatas tatra pitaraṃ pitur ālaye | jagāma bharato draṣṭuṃ mātaraṃ mātur ālaye"
  - id: '2.66.2'
    kind: verse
    lines:
      - "अनुप्राप्तं तु तं दृष्ट्वा कैकेयी प्रोषितं सुतम्"
      - "उत्पपात तदा हृष्टा त्यक्त्वा सौवर्णमानसं"
    iast: "anuprāptaṃ tu taṃ dṛṣṭvā kaikeyī proṣitaṃ sutam | utpapāta tadā hṛṣṭā tyaktvā sauvarṇamānasaṃ"
  - id: '2.66.41'
    kind: verse
    lines:
      - "मया तु पुत्र श्रुत्वैव रामस्यैवाभिषेचनम्"
      - "याचितस्ते पिता राज्यं रामस्य च विवासनम्"
    iast: "mayā tu putra śrutvaiva rāmasyaivābhiṣecanam | yācitas te pitā rājyaṃ rāmasya ca vivāsanam"
  - id: '2.66.43'
    kind: verse
    lines:
      - "तमपश्यन्प्रियं पुत्रं महीपालो महायशाः"
      - "पुत्रशोकपरिद्यूनः पञ्चत्वमुपपेदिवान्"
    iast: "tam apaśyan priyaṃ putraṃ mahīpālo mahāyaśāḥ | putraśokaparidyūnaḥ pañcatvam upapedivān"
  - id: '2.66.44'
    kind: verse
    lines:
      - "त्वया त्विदानीं धर्मज्ञ राजत्वमवलम्ब्यताम्"
      - "त्वत्कृते हि मया सर्वमिदमेवंविधं कृतम्"
    iast: "tvayā tv idānīṃ dharmajña rājatvam avalambyatām | tvatkṛte hi mayā sarvam idam evaṃvidhaṃ kṛtam"
  - id: '2.67.1'
    kind: verse
    lines:
      - "श्रुत्वा तु पितरं वृत्तं भ्रातरु च विवासितौ"
      - "भरतो दुःखसंतप्त इदं वचनमब्रवीत्"
    iast: "śrutvā tu pitaraṃ vṛttaṃ bhrātaru ca vivāsitau | bharato duḥkhasaṃtapta idaṃ vacanam abravīt"
  - id: '2.67.2'
    kind: verse
    lines:
      - "किं नुण्कार्यं हतस्येह मम राज्येन शोचतः"
      - "विहीनस्याथ पित्रा च भ्रात्रा पितृसमेन च"
    iast: "kiṃ nuṇkāryaṃ hatasyeha mama rājyena śocataḥ | vihīnasyātha pitrā ca bhrātrā pitṛsamena ca"
  - id: '2.67.4'
    kind: verse
    lines:
      - "कुलस्य त्वमभावाय कालरात्रिरिवागता"
      - "अङ्गारमुपगूह्य स्म पिता मे नावबुद्धवान्"
    iast: "kulasya tvam abhāvāya kālarātrir ivāgatā | aṅgāram upagūhya sma pitā me nāvabuddhavān"
  - id: '2.67.6'
    kind: verse
    lines:
      - "ननु त्वार्योऽपि धर्मात्मा त्वयि वृत्तिमनुत्तमाम्"
      - "वर्तते गुरुवृत्तिज्ञो यथा मातरि वर्तते"
    iast: "nanu tv āryo 'pi dharmātmā tvayi vṛttim anuttamām | vartate guruvṛttijño yathā mātari vartate"
  - id: '2.67.7'
    kind: verse
    lines:
      - "तथा ज्येष्ठा हि मे माता कौसल्या दीर्घदर्शिनी"
      - "त्वयि धर्मं समास्थाय भगिन्यामिव वर्तते"
    iast: "tathā jyeṣṭhā hi me mātā kausalyā dīrghadarśinī | tvayi dharmaṃ samāsthāya bhaginyām iva vartate"
  - id: '2.67.8'
    kind: verse
    lines:
      - "तस्याः पुत्रं कृतात्मानं चीरवल्कलवाससं"
      - "प्रस्थाप्य वनवासाय कथं पापे न शोचसि"
    iast: "tasyāḥ putraṃ kṛtātmānaṃ cīravalkalavāsasaṃ | prasthāpya vanavāsāya kathaṃ pāpe na śocasi"
  - id: '2.67.10'
    kind: verse
    lines:
      - "लुब्धाया विदितो मन्ये न तेऽहं राघवं प्रति"
      - "तथा ह्यनर्थो राज्यार्थं त्वया नीतो महानयम्"
    iast: "lubdhāyā vidito manye na te 'haṃ rāghavaṃ prati | tathā hy anartho rājyārthaṃ tvayā nīto mahān ayam"
  - id: '2.67.11'
    kind: verse
    lines:
      - "अहं हि पुरुषव्याघ्रावपश्यन्रामलक्ष्मणौ"
      - "केन शक्तिप्रभावेन राज्यं रक्षितुमुत्सहे"
    iast: "ahaṃ hi puruṣavyāghrāv apaśyan rāmalakṣmaṇau | kena śaktiprabhāvena rājyaṃ rakṣitum utsahe"
  - id: '2.67.14'
    kind: verse
    lines:
      - "अथ वा मे भवेच्छक्तिर्योगैर्बुद्धिबलेन वा"
      - "सकामां न करिष्यामि त्वामहं पुत्रगर्धिनीम्"
      - "निवर्तयिष्यामि वनाद्भ्रातरं स्वजनप्रियम्"
    iast: "atha vā me bhavec chaktir yogair buddhibalena vā | sakāmāṃ na kariṣyāmi tvām ahaṃ putragardhinīm | nivartayiṣyāmi vanād bhrātaraṃ svajanapriyam"
  - id: '2.68.2'
    kind: verse
    lines:
      - "राज्याद्भ्रंशस्व कैकेयि नृशंसे दुष्टचारिणि"
      - "परित्यक्ता च धर्मेण मा मृतं रुदती भव"
    iast: "rājyād bhraṃśasva kaikeyi nṛśaṃse duṣṭacāriṇi | parityaktā ca dharmeṇa mā mṛtaṃ rudatī bhava"
  - id: '2.68.3'
    kind: verse
    lines:
      - "किं नु तेऽदूषयद्राजा रामो वा भृशधार्मिकः"
      - "ययोर्मृत्युर्विवासश्च त्वत्कृते तुल्यमागतौ"
    iast: "kiṃ nu te 'dūṣayad rājā rāmo vā bhṛśadhārmikaḥ | yayor mṛtyur vivāsaś ca tvatkṛte tulyam āgatau"
  - id: '2.68.7'
    kind: verse
    lines:
      - "मातृरूपे ममामित्रे नृशंसे राज्यकामुके"
      - "न तेऽहमभिभाष्योऽस्मि दुर्वृत्ते पतिघातिनि"
    iast: "mātṛrūpe mamāmitre nṛśaṃse rājyakāmuke | na te 'ham abhibhāṣyo 'smi durvṛtte patighātini"
  - id: '2.68.13'
    kind: verse
    lines:
      - "किं नावबुध्यसे क्रूरे नियतं बन्धुसंश्रयम्"
      - "ज्येष्ठं पितृसमं रामं कौसल्यायात्मसंभवम्"
    iast: "kiṃ nāvabudhyase krūre niyataṃ bandhusaṃśrayam | jyeṣṭhaṃ pitṛsamaṃ rāmaṃ kausalyāyātmasaṃbhavam"
  - id: '2.70.1'
    kind: verse
    lines:
      - "तमेवं शोकसंतप्तं भरतं केकयीसुतम्"
      - "उवाच वदतां श्रेष्ठो वसिष्ठः श्रेष्ठवागृषिः"
    iast: "tam evaṃ śokasaṃtaptaṃ bharataṃ kekayīsutam | uvāca vadatāṃ śreṣṭho vasiṣṭhaḥ śreṣṭhavāg ṛṣiḥ"
  - id: '2.70.2'
    kind: verse
    lines:
      - "अलं शोकेन भद्रं ते राजपुत्र महायशः"
      - "प्राप्तकालं नरपतेः कुरु संयानमुत्तरम्"
    iast: "alaṃ śokena bhadraṃ te rājaputra mahāyaśaḥ | prāptakālaṃ narapateḥ kuru saṃyānam uttaram"
  - id: '2.70.3'
    kind: verse
    lines:
      - "वसिष्ठस्य वचः श्रुत्वा भरतो धारणां गतः"
      - "प्रेतकार्याणि सर्वाणि कारयामास धर्मवित्"
    iast: "vasiṣṭhasya vacaḥ śrutvā bharato dhāraṇāṃ gataḥ | pretakāryāṇi sarvāṇi kārayām āsa dharmavit"
  - id: '2.73.3'
    kind: verse
    lines:
      - "त्वमद्य भव नो राजा राजपुत्र महायशः"
      - "संगत्या नापराध्नोति राज्यमेतदनायकम्"
    iast: "tvam adya bhava no rājā rājaputra mahāyaśaḥ | saṃgatyā nāparādhnoti rājyam etad anāyakam"
  - id: '2.73.6'
    kind: verse
    lines:
      - "आभिषेचनिकं भाण्डं कृत्वा सर्वं प्रदक्षिणम्"
      - "भरतस्तं जनं सर्वं प्रत्युवाच धृतव्रतः"
    iast: "ābhiṣecanikaṃ bhāṇḍaṃ kṛtvā sarvaṃ pradakṣiṇam | bharatas taṃ janaṃ sarvaṃ pratyuvāca dhṛtavrataḥ"
  - id: '2.73.8'
    kind: verse
    lines:
      - "रामः पूर्वो हि नो भ्राता भविष्यति महीपतिः"
      - "अहं त्वरण्ये वत्स्यामि वर्षाणि नव पञ्च च"
    iast: "rāmaḥ pūrvo hi no bhrātā bhaviṣyati mahīpatiḥ | ahaṃ tv araṇye vatsyāmi varṣāṇi nava pañca ca"
  - id: '2.76.19'
    kind: verse
    lines:
      - "एवमुक्त्वा तु धर्मात्मा भरतो भ्रातृवत्सलः"
      - "समीपस्थमुवाचेदं सुमन्त्रं मन्त्रकोविदम्"
    iast: "evam uktvā tu dharmātmā bharato bhrātṛvatsalaḥ | samīpastham uvācedaṃ sumantraṃ mantrakovidam"
  - id: '2.76.20'
    kind: verse
    lines:
      - "तूर्णमुत्थाय गच्छ त्वं सुमन्त्र मम शासनात्"
      - "यात्रामाज्ञापय क्षिप्रं बलं चैव समानय"
    iast: "tūrṇam utthāya gaccha tvaṃ sumantra mama śāsanāt | yātrām ājñāpaya kṣipraṃ balaṃ caiva samānaya"
  - id: '2.76.25'
    kind: verse
    lines:
      - "सज्जं तु तद्बलं दृष्ट्वा भरतो गुरुसंनिधौ"
      - "रथं मे त्वरयस्वेति सुमन्त्रं पार्श्वतोऽब्रवीत्"
    iast: "sajjaṃ tu tad balaṃ dṛṣṭvā bharato gurusaṃnidhau | rathaṃ me tvarayasveti sumantraṃ pārśvato 'bravīt"
  - id: '2.77.1'
    kind: verse
    lines:
      - "ततः समुत्थितः काल्यमास्थाय स्यन्दनोत्तमम्"
      - "प्रययौ भरतः शीघ्रं रामदर्शनकाङ्क्षया"
    iast: "tataḥ samutthitaḥ kālyam āsthāya syandanottamam | prayayau bharataḥ śīghraṃ rāmadarśanakāṅkṣayā"
  - id: '2.77.2'
    kind: verse
    lines:
      - "अग्रतः प्रययुस्तस्य सर्वे मन्त्रिपुरोधसः"
      - "अधिरुह्य हयैर्युक्तान्रथान्सूर्यरथोपमान्"
    iast: "agrataḥ prayayus tasya sarve mantripurodhasaḥ | adhiruhya hayair yuktān rathān sūryarathopamān"
  - id: '2.77.6'
    kind: verse
    lines:
      - "कैकेयी च सुमित्रा च कौसल्या च यशस्विनी"
      - "रामानयनसंहृष्टा ययुर्यानेन भास्वता"
    iast: "kaikeyī ca sumitrā ca kausalyā ca yaśasvinī | rāmānayanasaṃhṛṣṭā yayur yānena bhāsvatā"
  - id: '2.87.6'
    kind: verse
    lines:
      - "स यात्वा दूरमध्वानं सुपरिश्रान्त वाहनः"
      - "उवाच भरतः श्रीमान्वसिष्ठं मन्त्रिणां वरम्"
    iast: "sa yātvā dūram adhvānaṃ supariśrānta vāhanaḥ | uvāca bharataḥ śrīmān vasiṣṭhaṃ mantriṇāṃ varam"
  - id: '2.90.2'
    kind: verse
    lines:
      - "एतस्मिन्नन्तरे त्रस्ताः शब्देन महता ततः"
      - "अर्दिता यूथपा मत्ताः सयूथा दुद्रुवुर्दिशः"
    iast: "etasminn antare trastāḥ śabdena mahatā tataḥ | arditā yūthapā mattāḥ sayūthā dudruvur diśaḥ"
  - id: '2.90.4'
    kind: verse
    lines:
      - "तांश्च विद्रवतो दृष्ट्वा तं च श्रुत्वा स निःस्वनम्"
      - "उवाच रामः सौमित्रिं लक्ष्मणं दीप्ततेजसं"
    iast: "tāṃś ca vidravato dṛṣṭvā taṃ ca śrutvā sa niḥsvanam | uvāca rāmaḥ saumitriṃ lakṣmaṇaṃ dīptatejasaṃ"
  - id: '2.90.5'
    kind: verse
    lines:
      - "हन्त लक्ष्मण पश्येह सुमित्रा सुप्रजास्त्वया"
      - "भीमस्तनितगम्भीरस्तुमुलः श्रूयते स्वनः"
    iast: "hanta lakṣmaṇa paśyeha sumitrā suprajās tvayā | bhīmastanitagambhīras tumulaḥ śrūyate svanaḥ"
  - id: '2.90.9'
    kind: verse
    lines:
      - "तामश्वगजसंपूर्णां रथध्वजविभूषिताम्"
      - "शशंस सेनां रामाय वचनं चेदमब्रवीत्"
    iast: "tām aśvagajasaṃpūrṇāṃ rathadhvajavibhūṣitām | śaśaṃsa senāṃ rāmāya vacanaṃ cedam abravīt"
  - id: '2.90.10'
    kind: verse
    lines:
      - "अग्निं संशमयत्वार्यः सीता च भजतां गुहाम्"
      - "सज्यं कुरुष्व चापं च शरांश्च कवचं तथा"
    iast: "agniṃ saṃśamayatv āryaḥ sītā ca bhajatāṃ guhām | sajyaṃ kuruṣva cāpaṃ ca śarāṃś ca kavacaṃ tathā"
  - id: '2.90.13'
    kind: verse
    lines:
      - "संपन्नं राज्यमिच्छंस्तु व्यक्तं प्राप्याभिषेचनम्"
      - "आवां हन्तुं समभ्येति कैकेय्या भरतः सुतः"
    iast: "saṃpannaṃ rājyam icchaṃs tu vyaktaṃ prāpyābhiṣecanam | āvāṃ hantuṃ samabhyeti kaikeyyā bharataḥ sutaḥ"
  - id: '2.90.18'
    kind: verse
    lines:
      - "यन्निमित्तं भवान्राज्याच्च्युतो राघव शाश्वतीम्"
      - "संप्राप्तोऽयमरिर्वीर भरतो वध्य एव मे"
    iast: "yannimittaṃ bhavān rājyāc cyuto rāghava śāśvatīm | saṃprāpto 'yam arir vīra bharato vadhya eva me"
  - id: '2.91.1'
    kind: verse
    lines:
      - "सुसंरब्धं तु सौमित्रिं लक्ष्मणं क्रोधमूर्छितम्"
      - "रामस्तु परिसान्त्व्याथ वचनं चेदमब्रवीत्"
    iast: "susaṃrabdhaṃ tu saumitriṃ lakṣmaṇaṃ krodhamūrchitam | rāmas tu parisāntvyātha vacanaṃ cedam abravīt"
  - id: '2.91.2'
    kind: verse
    lines:
      - "किमत्र धनुषा कार्यमसिना वा सचर्मणा"
      - "महेष्वासे महाप्राज्ञे भरते स्वयमागते"
    iast: "kim atra dhanuṣā kāryam asinā vā sacarmaṇā | maheṣvāse mahāprājñe bharate svayam āgate"
  - id: '2.91.3'
    kind: verse
    lines:
      - "प्राप्तकालं यदेषोऽस्मान्भरतो द्रष्टुमिच्छति"
      - "अस्मासु मनसाप्येष नाहितं किं चिदाचरेत्"
    iast: "prāptakālaṃ yad eṣo 'smān bharato draṣṭum icchati | asmāsu manasāpy eṣa nāhitaṃ kiṃ cid ācaret"
  - id: '2.91.5'
    kind: verse
    lines:
      - "न हि ते निष्ठुरं वाच्यो भरतो नाप्रियं वचः"
      - "अहं ह्यप्रियमुक्तः स्यां भरतस्याप्रिये कृते"
    iast: "na hi te niṣṭhuraṃ vācyo bharato nāpriyaṃ vacaḥ | ahaṃ hy apriyam uktaḥ syāṃ bharatasyāpriye kṛte"
  - id: '2.91.6'
    kind: verse
    lines:
      - "कथं नु पुत्राः पितरं हन्युः कस्यां चिदापदि"
      - "भ्राता वा भ्रातरं हन्यात्सौमित्रे प्राणमात्मनः"
    iast: "kathaṃ nu putrāḥ pitaraṃ hanyuḥ kasyāṃ cid āpadi | bhrātā vā bhrātaraṃ hanyāt saumitre prāṇam ātmanaḥ"
  - id: '2.91.7'
    kind: verse
    lines:
      - "यदि राज्यस्य हेतोस्त्वमिमां वाचं प्रभाषसे"
      - "वक्ष्यामि भरतं दृष्ट्वा राज्यमस्मै प्रदीयताम्"
    iast: "yadi rājyasya hetos tvam imāṃ vācaṃ prabhāṣase | vakṣyāmi bharataṃ dṛṣṭvā rājyam asmai pradīyatām"
  - id: '2.91.14'
    kind: verse
    lines:
      - "अवतीर्य तु सालाग्रात्तस्मात्स समितिंजयः"
      - "लक्ष्मणः प्राञ्जलिर्भूत्वा तस्थौ रामस्य पार्श्वतः"
    iast: "avatīrya tu sālāgrāt tasmāt sa samitiṃjayaḥ | lakṣmaṇaḥ prāñjalir bhūtvā tasthau rāmasya pārśvataḥ"
  - id: '2.93.4'
    kind: verse
    lines:
      - "गच्छन्नेवाथ भरतस्तापसालयसंस्थिताम्"
      - "भ्रातुः पर्णकुटीं श्रीमानुटजं च ददर्श ह"
    iast: "gacchann evātha bharatas tāpasālayasaṃsthitām | bhrātuḥ parṇakuṭīṃ śrīmān uṭajaṃ ca dadarśa ha"
  - id: '2.93.27'
    kind: verse
    lines:
      - "उपविष्टं महाबाहुं ब्रह्माणमिव शाश्वतम्"
      - "स्थण्डिले दर्भसस्म्तीर्णे सीतया लक्ष्मणेन च"
    iast: "upaviṣṭaṃ mahābāhuṃ brahmāṇam iva śāśvatam | sthaṇḍile darbhasasmtīrṇe sītayā lakṣmaṇena ca"
  - id: '2.93.28'
    kind: verse
    lines:
      - "तं दृष्ट्वा भरतः श्रीमान्दुःखमोहपरिप्लुतः"
      - "अभ्यधावत धर्मात्मा भरतः कैकयीसुतः"
    iast: "taṃ dṛṣṭvā bharataḥ śrīmān duḥkhamohapariplutaḥ | abhyadhāvata dharmātmā bharataḥ kaikayīsutaḥ"
  - id: '2.93.36'
    kind: verse
    lines:
      - "इत्येवं विलपन्दीनः प्रस्विन्नमुखपङ्कजः"
      - "पादावप्राप्य रामस्य पपात भरतो रुदन्"
    iast: "ity evaṃ vilapan dīnaḥ prasvinnamukhapaṅkajaḥ | pādāv aprāpya rāmasya papāta bharato rudan"
  - id: '2.93.38'
    kind: verse
    lines:
      - "बाष्पापिहित कण्ठश्च प्रेक्ष्य रामं यशस्विनम्"
      - "आर्येत्येवाभिसंक्रुश्य व्याहर्तुं नाशकत्ततः"
    iast: "bāṣpāpihita kaṇṭhaś ca prekṣya rāmaṃ yaśasvinam | āryety evābhisaṃkruśya vyāhartuṃ nāśakat tataḥ"
  - id: '2.93.39'
    kind: verse
    lines:
      - "शत्रुघ्नश्चापि रामस्य ववन्दे चरणौ रुदन्"
      - "तावुभौ स समालिङ्ग्य रामोऽप्यश्रूण्यवर्तयत्"
    iast: "śatrughnaś cāpi rāmasya vavande caraṇau rudan | tāv ubhau sa samāliṅgya rāmo 'py aśrūṇy avartayat"
  - id: '2.94.1'
    kind: verse
    lines:
      - "आघ्राय रामस्तं मूर्ध्नि परिष्वज्य च राघवः"
      - "अङ्के भरतमारोप्य पर्यपृच्छत्समाहितः"
    iast: "āghrāya rāmas taṃ mūrdhni pariṣvajya ca rāghavaḥ | aṅke bharatam āropya paryapṛcchat samāhitaḥ"
  - id: '2.95.1'
    kind: verse
    lines:
      - "रामस्य वचनं श्रुत्वा भरतः प्रत्युवाच ह"
      - "किं मे धर्माद्विहीनस्य राजधर्मः करिष्यति"
    iast: "rāmasya vacanaṃ śrutvā bharataḥ pratyuvāca ha | kiṃ me dharmād vihīnasya rājadharmaḥ kariṣyati"
  - id: '2.95.2'
    kind: verse
    lines:
      - "शाश्वतोऽयं सदा धर्मः स्थितोऽस्मासु नरर्षभ"
      - "ज्येष्ठ पुत्रे स्थिते राजन्न कनीयान्भवेन्नृपः"
    iast: "śāśvato 'yaṃ sadā dharmaḥ sthito 'smāsu nararṣabha | jyeṣṭha putre sthite rājan na kanīyān bhaven nṛpaḥ"
  - id: '2.95.3'
    kind: verse
    lines:
      - "स समृद्धां मया सार्धमयोध्यां गच्छ राघव"
      - "अभिषेचय चात्मानं कुलस्यास्य भवाय नः"
    iast: "sa samṛddhāṃ mayā sārdham ayodhyāṃ gaccha rāghava | abhiṣecaya cātmānaṃ kulasyāsya bhavāya naḥ"
  - id: '2.95.6'
    kind: verse
    lines:
      - "उत्तिष्ठ पुरुषव्याघ्र क्रियतामुदकं पितुः"
      - "अहं चायं च शत्रुघ्नः पूर्वमेव कृतोदकौ"
    iast: "uttiṣṭha puruṣavyāghra kriyatām udakaṃ pituḥ | ahaṃ cāyaṃ ca śatrughnaḥ pūrvam eva kṛtodakau"
  - id: '2.95.8'
    kind: verse
    lines:
      - "तां श्रुत्वा करुणां वाचं पितुर्मरणसंहिताम्"
      - "राघवो भरतेनोक्तां बभूव गतचेतनः"
    iast: "tāṃ śrutvā karuṇāṃ vācaṃ pitur maraṇasaṃhitām | rāghavo bharatenoktāṃ babhūva gatacetanaḥ"
  - id: '2.95.18'
    kind: verse
    lines:
      - "एवमुक्त्वा स भरतं भार्यामभ्येत्य राघवः"
      - "उवाच शोकसंतप्तः पूर्णचन्द्रनिभाननाम्"
    iast: "evam uktvā sa bharataṃ bhāryām abhyetya rāghavaḥ | uvāca śokasaṃtaptaḥ pūrṇacandranibhānanām"
  - id: '2.95.24'
    kind: verse
    lines:
      - "सुमन्त्रस्तैर्नृपसुतैः सार्धमाश्वास्य राघवम्"
      - "अवातारयदालम्ब्य नदीं मन्दाकिनीं शिवाम्"
    iast: "sumantras tair nṛpasutaiḥ sārdham āśvāsya rāghavam | avātārayad ālambya nadīṃ mandākinīṃ śivām"
  - id: '2.95.27'
    kind: verse
    lines:
      - "प्रगृह्य च महीपालो जलपूरितमञ्जलिम्"
      - "दिशं याम्यामभिमुखो रुदन्वचनमब्रवीत्"
    iast: "pragṛhya ca mahīpālo jalapūritam añjalim | diśaṃ yāmyām abhimukho rudan vacanam abravīt"
  - id: '2.95.29'
    kind: verse
    lines:
      - "ततो मन्दाकिनी तीरात्प्रत्युत्तीर्य स राघवः"
      - "पितुश्चकार तेजस्वी निवापं भ्रातृभिः सह"
    iast: "tato mandākinī tīrāt pratyuttīrya sa rāghavaḥ | pituś cakāra tejasvī nivāpaṃ bhrātṛbhiḥ saha"
  - id: '2.95.30'
    kind: verse
    lines:
      - "ऐङ्गुदं बदरीमिश्रं पिण्याकं दर्भसंस्तरे"
      - "न्यस्य रामः सुदुःखार्तो रुदन्वचनमब्रवीत्"
    iast: "aiṅgudaṃ badarīmiśraṃ piṇyākaṃ darbhasaṃstare | nyasya rāmaḥ suduḥkhārto rudan vacanam abravīt"
  - id: '2.95.31'
    kind: verse
    lines:
      - "इदं भुङ्क्ष्व महाराजप्रीतो यदशना वयम्"
      - "यदन्नः पुरुषो भवति तदन्नास्तस्य देवताः"
    iast: "idaṃ bhuṅkṣva mahārājaprīto yad aśanā vayam | yadannaḥ puruṣo bhavati tadannās tasya devatāḥ"
  - id: '2.95.33'
    kind: verse
    lines:
      - "ततः पर्णकुटीद्वारमासाद्य जगतीपतिः"
      - "परिजग्राह पाणिभ्यामुभौ भरतलक्ष्मणौ"
    iast: "tataḥ parṇakuṭīdvāram āsādya jagatīpatiḥ | parijagrāha pāṇibhyām ubhau bharatalakṣmaṇau"
  - id: '2.95.38'
    kind: verse
    lines:
      - "अचिरप्रोषितं रामं चिरविप्रोषितं यथा"
      - "द्रष्टुकामो जनः सर्वो जगाम सहसाश्रमम्"
    iast: "aciraproṣitaṃ rāmaṃ ciraviproṣitaṃ yathā | draṣṭukāmo janaḥ sarvo jagāma sahasāśramam"
  - id: '2.96.1'
    kind: verse
    lines:
      - "वसिष्ठः पुरतः कृत्वा दारान्दशरथस्य च"
      - "अभिचक्राम तं देशं रामदर्शनतर्षितः"
    iast: "vasiṣṭhaḥ purataḥ kṛtvā dārān daśarathasya ca | abhicakrāma taṃ deśaṃ rāmadarśanatarṣitaḥ"
  - id: '2.96.15'
    kind: verse
    lines:
      - "तासां रामः समुत्थाय जग्राह चरणाञ्शुभान्"
      - "मातॄणां मनुजव्याघ्रः सर्वासां सत्यसंगरः"
    iast: "tāsāṃ rāmaḥ samutthāya jagrāha caraṇāñ śubhān | mātṝṇāṃ manujavyāghraḥ sarvāsāṃ satyasaṃgaraḥ"
  - id: '2.96.17'
    kind: verse
    lines:
      - "सौमित्रिरपि ताः सर्वा मातॄः संप्रेक्ष्य दुःखितः"
      - "अभ्यवादयतासक्तं शनै रामादनन्तरम्"
    iast: "saumitrir api tāḥ sarvā mātṝḥ saṃprekṣya duḥkhitaḥ | abhyavādayatāsaktaṃ śanai rāmād anantaram"
  - id: '2.96.19'
    kind: verse
    lines:
      - "सीतापि चरणांस्तासामुपसंगृह्य दुःखिता"
      - "श्वश्रूणामश्रुपूर्णाक्षी सा बभूवाग्रतः स्थिता"
    iast: "sītāpi caraṇāṃs tāsām upasaṃgṛhya duḥkhitā | śvaśrūṇām aśrupūrṇākṣī sā babhūvāgrataḥ sthitā"
  - id: '2.97.1'
    kind: verse
    lines:
      - "तं तु रामः समाश्वास्य भ्रातरं गुरुवत्सलम्"
      - "लक्ष्मणेन सह भ्रात्रा प्रष्टुं समुपचक्रमे"
    iast: "taṃ tu rāmaḥ samāśvāsya bhrātaraṃ guruvatsalam | lakṣmaṇena saha bhrātrā praṣṭuṃ samupacakrame"
  - id: '2.97.3'
    kind: verse
    lines:
      - "यन्निमित्तमिमं देशं कृष्णाजिनजटाधरः"
      - "हित्वा राज्यं प्रविष्टस्त्वं तत्सर्वं वक्तुमर्हसि"
    iast: "yannimittam imaṃ deśaṃ kṛṣṇājinajaṭādharaḥ | hitvā rājyaṃ praviṣṭas tvaṃ tat sarvaṃ vaktum arhasi"
  - id: '2.97.4'
    kind: verse
    lines:
      - "इत्युक्तः केकयीपुत्रः काकुत्स्थेन महात्मना"
      - "प्रगृह्य बलवद्भूयः प्राञ्जलिर्वाक्यमब्रवीत्"
    iast: "ity uktaḥ kekayīputraḥ kākutsthena mahātmanā | pragṛhya balavad bhūyaḥ prāñjalir vākyam abravīt"
  - id: '2.97.8'
    kind: verse
    lines:
      - "तस्य मे दासभूतस्य प्रसादं कर्तुमर्हसि"
      - "अभिषिञ्चस्व चाद्यैव राज्येन मघवानिव"
    iast: "tasya me dāsabhūtasya prasādaṃ kartum arhasi | abhiṣiñcasva cādyaiva rājyena maghavān iva"
  - id: '2.97.9'
    kind: verse
    lines:
      - "इमाः प्रकृतयः सर्वा विधवा मातुरश्च याः"
      - "त्वत्सकाशमनुप्राप्ताः प्रसादं कर्तुमर्हसि"
    iast: "imāḥ prakṛtayaḥ sarvā vidhavā māturaś ca yāḥ | tvat sakāśam anuprāptāḥ prasādaṃ kartum arhasi"
  - id: '2.98.4'
    kind: verse
    lines:
      - "सान्त्विता मामिका माता दत्तं राज्यमिदं मम"
      - "तद्ददामि तवैवाहं भुङ्क्ष्व राज्यमकण्टकम्"
    iast: "sāntvitā māmikā mātā dattaṃ rājyam idaṃ mama | tad dadāmi tavaivāhaṃ bhuṅkṣva rājyam akaṇṭakam"
  - id: '2.98.55'
    kind: verse
    lines:
      - "कैकेयीं मां च तातं च सुहृदो बान्धवांश्च नः"
      - "पौरजानपदान्सर्वांस्त्रातु सर्वमिदं भवान्"
    iast: "kaikeyīṃ māṃ ca tātaṃ ca suhṛdo bāndhavāṃś ca naḥ | paurajānapadān sarvāṃs trātu sarvam idaṃ bhavān"
  - id: '2.98.64'
    kind: verse
    lines:
      - "ऋणानि त्रीण्यपाकुर्वन्दुर्हृदः साधु निर्दहन्"
      - "सुहृदस्तर्पयन्कामैस्त्वमेवात्रानुशाधि माम्"
    iast: "ṛṇāni trīṇy apākurvan durhṛdaḥ sādhu nirdahan | suhṛdas tarpayan kāmais tvam evātrānuśādhi mām"
  - id: '2.98.66'
    kind: verse
    lines:
      - "आक्रोशं मम मातुश्च प्रमृज्य पुरुषर्षभ"
      - "अद्य तत्र भवन्तं च पितरं रक्ष किल्बिषात्"
    iast: "ākrośaṃ mama mātuś ca pramṛjya puruṣarṣabha | adya tatra bhavantaṃ ca pitaraṃ rakṣa kilbiṣāt"
  - id: '2.98.67'
    kind: verse
    lines:
      - "शिरसा त्वाभियाचेऽहं कुरुष्व करुणां मयि"
      - "बान्धवेषु च सर्वेषु भूतेष्विव महेश्वरः"
    iast: "śirasā tvābhiyāce 'haṃ kuruṣva karuṇāṃ mayi | bāndhaveṣu ca sarveṣu bhūteṣv iva maheśvaraḥ"
  - id: '2.98.68'
    kind: verse
    lines:
      - "अथ वा पृष्ठतः कृत्वा वनमेव भवानितः"
      - "गमिष्यति गमिष्यामि भवता सार्धमप्यहम्"
    iast: "atha vā pṛṣṭhataḥ kṛtvā vanam eva bhavān itaḥ | gamiṣyati gamiṣyāmi bhavatā sārdham apy aham"
  - id: '2.99.1'
    kind: verse
    lines:
      - "पुनरेवं ब्रुवाणं तु भरतं लक्ष्मणाग्रजः"
      - "प्रत्युवच ततः श्रीमाञ्ज्ञातिमध्येऽतिसत्कृतः"
    iast: "punar evaṃ bruvāṇaṃ tu bharataṃ lakṣmaṇāgrajaḥ | pratyuvaca tataḥ śrīmāñ jñātimadhye 'tisatkṛtaḥ"
  - id: '2.99.5'
    kind: verse
    lines:
      - "ततः सा संप्रतिश्राव्य तव माता यशस्विनी"
      - "अयाचत नरश्रेष्ठं द्वौ वरौ वरवर्णिनी"
    iast: "tataḥ sā saṃpratiśrāvya tava mātā yaśasvinī | ayācata naraśreṣṭhaṃ dvau varau varavarṇinī"
  - id: '2.99.6'
    kind: verse
    lines:
      - "तव राज्यं नरव्याघ्र मम प्रव्राजनं तथा"
      - "तच्च राजा तथा तस्यै नियुक्तः प्रददौ वरम्"
    iast: "tava rājyaṃ naravyāghra mama pravrājanaṃ tathā | tac ca rājā tathā tasyai niyuktaḥ pradadau varam"
  - id: '2.99.7'
    kind: verse
    lines:
      - "तेन पित्राहमप्यत्र नियुक्तः पुरुषर्षभ"
      - "चतुर्दश वने वासं वर्षाणि वरदानिकम्"
    iast: "tena pitrāham apy atra niyuktaḥ puruṣarṣabha | caturdaśa vane vāsaṃ varṣāṇi varadānikam"
  - id: '2.99.9'
    kind: verse
    lines:
      - "भवानपि तथेत्येव पितरं सत्यवादिनम्"
      - "कर्तुमर्हति राजेन्द्रं क्षिप्रमेवाभिषेचनात्"
    iast: "bhavān api tathety eva pitaraṃ satyavādinam | kartum arhati rājendraṃ kṣipram evābhiṣecanāt"
  - id: '2.99.10'
    kind: verse
    lines:
      - "ऋणान्मोचय राजानं मत्कृते भरत प्रभुम्"
      - "पितरं त्राहि धर्मज्ञ मातरं चाभिनन्दय"
    iast: "ṛṇān mocaya rājānaṃ matkṛte bharata prabhum | pitaraṃ trāhi dharmajña mātaraṃ cābhinandaya"
  - id: '2.99.16'
    kind: verse
    lines:
      - "प्रवेक्ष्ये दण्डकारण्यमहमप्यविलम्बयन्"
      - "आभ्यां तु सहितो राजन्वैदेह्या लक्ष्मणेन च"
    iast: "pravekṣye daṇḍakāraṇyam aham apy avilambayan | ābhyāṃ tu sahito rājan vaidehyā lakṣmaṇena ca"
  - id: '2.100.1'
    kind: verse
    lines:
      - "आश्वासयन्तं भरतं जाबालिर्ब्राह्मणोत्तमः"
      - "उवाच रामं धर्मज्ञं धर्मापेतमिदं वचः"
    iast: "āśvāsayantaṃ bharataṃ jābālir brāhmaṇottamaḥ | uvāca rāmaṃ dharmajñaṃ dharmāpetam idaṃ vacaḥ"
  - id: '2.100.2'
    kind: verse
    lines:
      - "साधु राघव मा भूत्ते बुद्धिरेवं निरर्थका"
      - "प्राकृतस्य नरस्येव आर्य बुद्धेस्तपस्विनः"
    iast: "sādhu rāghava mā bhūt te buddhir evaṃ nirarthakā | prākṛtasya narasyeva ārya buddhes tapasvinaḥ"
  - id: '2.100.7'
    kind: verse
    lines:
      - "पित्र्यं राज्यं समुत्सृज्य स नार्हति नरोत्तम"
      - "आस्थातुं कापथं दुःखं विषमं बहुकण्टकम्"
    iast: "pitryaṃ rājyaṃ samutsṛjya sa nārhati narottama | āsthātuṃ kāpathaṃ duḥkhaṃ viṣamaṃ bahukaṇṭakam"
  - id: '2.101.1'
    kind: verse
    lines:
      - "जाबालेस्तु वचः श्रुत्वा रामः सत्यात्मनां वरः"
      - "उवाच परया युक्त्या स्वबुद्ध्या चाविपन्नया"
    iast: "jābāles tu vacaḥ śrutvā rāmaḥ satyātmanāṃ varaḥ | uvāca parayā yuktyā svabuddhyā cāvipannayā"
  - id: '2.101.2'
    kind: verse
    lines:
      - "भवान्मे प्रियकामार्थं वचनं यदिहोक्तवान्"
      - "अकार्यं कार्यसंकाशमपथ्यं पथ्यसंमितम्"
    iast: "bhavān me priyakāmārthaṃ vacanaṃ yad ihoktavān | akāryaṃ kāryasaṃkāśam apathyaṃ pathyasaṃmitam"
  - id: '2.101.10'
    kind: verse
    lines:
      - "सत्यमेवानृशंस्यं च राजवृत्तं सनातनम्"
      - "तस्मात्सत्यात्मकं राज्यं सत्ये लोकः प्रतिष्ठितः"
    iast: "satyam evānṛśaṃsyaṃ ca rājavṛttaṃ sanātanam | tasmāt satyātmakaṃ rājyaṃ satye lokaḥ pratiṣṭhitaḥ"
  - id: '2.101.16'
    kind: verse
    lines:
      - "सोऽहं पितुर्निदेशं तु किमर्थं नानुपालये"
      - "सत्यप्रतिश्रवः सत्यं सत्येन समयीकृतः"
    iast: "so 'haṃ pitur nideśaṃ tu kimarthaṃ nānupālaye | satyapratiśravaḥ satyaṃ satyena samayīkṛtaḥ"
  - id: '2.102.1'
    kind: verse
    lines:
      - "क्रुद्धमाज्ञाय रामं तु वसिष्ठः प्रत्युवाच ह"
      - "जाबालिरपि जानीते लोकस्यास्य गतागतिम्"
      - "निवर्तयितुकामस्तु त्वामेतद्वाक्यमब्रवीत्"
    iast: "kruddham ājñāya rāmaṃ tu vasiṣṭhaḥ pratyuvāca ha | jābālir api jānīte lokasyāsya gatāgatim | nivartayitukāmas tu tvām etad vākyam abravīt"
  - id: '2.102.30'
    kind: verse
    lines:
      - "इक्ष्वाकूणां हि सर्वेषां राजा भवति पूर्वजः"
      - "पूर्वजे नावरः पुत्रो ज्येष्ठो राज्येऽभिषिच्यते"
    iast: "ikṣvākūṇāṃ hi sarveṣāṃ rājā bhavati pūrvajaḥ | pūrvaje nāvaraḥ putro jyeṣṭho rājye 'bhiṣicyate"
  - id: '2.103.2'
    kind: verse
    lines:
      - "पुरुषस्येह जातस्य भवन्ति गुरवस्त्रयः"
      - "आचार्यश्चैव काकुत्स्थ पिता माता च राघव"
    iast: "puruṣasyeha jātasya bhavanti guravas trayaḥ | ācāryaś caiva kākutstha pitā mātā ca rāghava"
  - id: '2.103.3'
    kind: verse
    lines:
      - "पिता ह्येनं जनयति पुरुषं पुरुषर्षभ"
      - "प्रज्ञां ददाति चाचार्यस्तस्मात्स गुरुरुच्यते"
    iast: "pitā hy enaṃ janayati puruṣaṃ puruṣarṣabha | prajñāṃ dadāti cācāryas tasmāt sa gurur ucyate"
  - id: '2.103.8'
    kind: verse
    lines:
      - "एवं मधुरमुक्तस्तु गुरुणा राघवः स्वयम्"
      - "प्रत्युवाच समासीनं वसिष्ठं पुरुषर्षभः"
    iast: "evaṃ madhuram uktas tu guruṇā rāghavaḥ svayam | pratyuvāca samāsīnaṃ vasiṣṭhaṃ puruṣarṣabhaḥ"
  - id: '2.103.9'
    kind: verse
    lines:
      - "यन्मातापितरौ वृत्तं तनये कुरुतः सदा"
      - "न सुप्रतिकरं तत्तु मात्रा पित्रा च यत्कृतम्"
    iast: "yan mātāpitarau vṛttaṃ tanaye kurutaḥ sadā | na supratikaraṃ tat tu mātrā pitrā ca yat kṛtam"
  - id: '2.103.10'
    kind: verse
    lines:
      - "यथाशक्ति प्रदानेन स्नापनाच्छादनेन च"
      - "नित्यं च प्रियवादेन तथा संवर्धनेन च"
    iast: "yathāśakti pradānena snāpanāc chādanena ca | nityaṃ ca priyavādena tathā saṃvardhanena ca"
  - id: '2.103.11'
    kind: verse
    lines:
      - "स हि राजा जनयिता पिता दशरथो मम"
      - "आज्ञातं यन्मया तस्य न तन्मिथ्या भविष्यति"
    iast: "sa hi rājā janayitā pitā daśaratho mama | ājñātaṃ yan mayā tasya na tan mithyā bhaviṣyati"
  - id: '2.103.12'
    kind: verse
    lines:
      - "एवमुक्तस्तु रामेण भरतः प्रत्यनन्तरम्"
      - "उवाच परमोदारः सूतं परमदुर्मनाः"
    iast: "evam uktas tu rāmeṇa bharataḥ pratyanantaram | uvāca paramodāraḥ sūtaṃ paramadurmanāḥ"
  - id: '2.103.13'
    kind: verse
    lines:
      - "इह मे स्थण्डिले शीघ्रं कुशानास्तर सारथे"
      - "आर्यं प्रत्युपवेक्ष्यामि यावन्मे न प्रसीदति"
    iast: "iha me sthaṇḍile śīghraṃ kuśān āstara sārathe | āryaṃ pratyupavekṣyāmi yāvan me na prasīdati"
  - id: '2.103.16'
    kind: verse
    lines:
      - "तमुवाच महातेजा रामो राजर्षिसत्तमाः"
      - "किं मां भरत कुर्वाणं तात प्रत्युपवेक्ष्यसि"
    iast: "tam uvāca mahātejā rāmo rājarṣisattamāḥ | kiṃ māṃ bharata kurvāṇaṃ tāta pratyupavekṣyasi"
  - id: '2.103.17'
    kind: verse
    lines:
      - "ब्राह्मणो ह्येकपार्श्वेन नरान्रोद्धुमिहार्हति"
      - "न तु मूर्धावसिक्तानां विधिः प्रत्युपवेशने"
    iast: "brāhmaṇo hy ekapārśvena narān roddhum ihārhati | na tu mūrdhāvasiktānāṃ vidhiḥ pratyupaveśane"
  - id: '2.103.18'
    kind: verse
    lines:
      - "उत्तिष्ठ नरशार्दूल हित्वैतद्दारुणं व्रतम्"
      - "पुरवर्यामितः क्षिप्रमयोध्यां याहि राघव"
    iast: "uttiṣṭha naraśārdūla hitvaitad dāruṇaṃ vratam | puravaryām itaḥ kṣipram ayodhyāṃ yāhi rāghava"
  - id: '2.104.18'
    kind: verse
    lines:
      - "लक्ष्मीश्चन्द्रादपेयाद्वा हिमवान्वा हिमं त्यजेत्"
      - "अतीयात्सागरो वेलां न प्रतिज्ञामहं पितुः"
    iast: "lakṣmīś candrād apeyād vā himavān vā himaṃ tyajet | atīyāt sāgaro velāṃ na pratijñām ahaṃ pituḥ"
  - id: '2.104.19'
    kind: verse
    lines:
      - "कामाद्वा तात लोभाद्वा मात्रा तुभ्यमिदं कृतम्"
      - "न तन्मनसि कर्तव्यं वर्तितव्यं च मातृवत्"
    iast: "kāmād vā tāta lobhād vā mātrā tubhyam idaṃ kṛtam | na tan manasi kartavyaṃ vartitavyaṃ ca mātṛvat"
  - id: '2.104.20'
    kind: verse
    lines:
      - "एवं ब्रुवाणं भरतः कौसल्यासुतमब्रवीत्"
      - "तेजसादित्यसंकाशं प्रतिपच्चन्द्रदर्शनम्"
    iast: "evaṃ bruvāṇaṃ bharataḥ kausalyāsutam abravīt | tejasādityasaṃkāśaṃ pratipaccandradarśanam"
  - id: '2.104.21'
    kind: verse
    lines:
      - "अधिरोहार्य पादाभ्यां पादुके हेमभूषिते"
      - "एते हि सर्वलोकस्य योगक्षेमं विधास्यतः"
    iast: "adhirohārya pādābhyāṃ pāduke hemabhūṣite | ete hi sarvalokasya yogakṣemaṃ vidhāsyataḥ"
  - id: '2.104.22'
    kind: verse
    lines:
      - "सोऽधिरुह्य नरव्याघ्रः पादुके ह्यवरुह्य च"
      - "प्रायच्छत्सुमहातेजा भरताय महात्मने"
    iast: "so 'dhiruhya naravyāghraḥ pāduke hy avaruhya ca | prāyacchat sumahātejā bharatāya mahātmane"
  - id: '2.106.1'
    kind: verse
    lines:
      - "स्निग्धगम्भीरघोषेण स्यन्दनेनोपयान्प्रभुः"
      - "अयोध्यां भरतः क्षिप्रं प्रविवेश महायशाः"
    iast: "snigdhagambhīraghoṣeṇa syandanenopayān prabhuḥ | ayodhyāṃ bharataḥ kṣipraṃ praviveśa mahāyaśāḥ"
  - id: '2.107.1'
    kind: verse
    lines:
      - "ततो निक्षिप्य मातॄः स अयोध्यायां दृढव्रतः"
      - "भरतः शोकसंतप्तो गुरूनिदमथाब्रवीत्"
    iast: "tato nikṣipya mātṝḥ sa ayodhyāyāṃ dṛḍhavrataḥ | bharataḥ śokasaṃtapto gurūn idam athābravīt"
  - id: '2.107.22'
    kind: verse
    lines:
      - "पादुके त्वभिषिच्याथ नन्दिग्रामेऽवसत्तदा"
      - "भरतः शासनं सर्वं पादुकाभ्यां न्यवेदयत्"
    iast: "pāduke tv abhiṣicyātha nandigrāme 'vasat tadā | bharataḥ śāsanaṃ sarvaṃ pādukābhyāṃ nyavedayat"
  - id: '2.108.1'
    kind: verse
    lines:
      - "प्रतिप्रयाते भरते वसन्रामस्तपोवने"
      - "लक्षयामास सोद्वेगमथौत्सुक्यं तपस्विनाम्"
    iast: "pratiprayāte bharate vasan rāmas tapovane | lakṣayām āsa sodvegam athautsukyaṃ tapasvinām"
  - id: '2.109.1'
    kind: verse
    lines:
      - "राघवस्त्वपयातेषु तपस्विषु विचिन्तयन्"
      - "न तत्रारोचयद्वासं कारणैर्बहुभिस्तदा"
    iast: "rāghavas tv apayāteṣu tapasviṣu vicintayan | na tatrārocayad vāsaṃ kāraṇair bahubhis tadā"
  - id: '2.109.2'
    kind: verse
    lines:
      - "इह मे भरतो दृष्टो मातरश्च सनागराः"
      - "सा च मे स्मृतिरन्वेति तान्नित्यमनुशोचतः"
    iast: "iha me bharato dṛṣṭo mātaraś ca sanāgarāḥ | sā ca me smṛtir anveti tān nityam anuśocataḥ"
  - id: '2.109.4'
    kind: verse
    lines:
      - "तस्मादन्यत्र गच्छाम इति संचिन्त्य राघवः"
      - "प्रातिष्ठत स वैदेह्या लक्ष्मणेन च संगतः"
    iast: "tasmād anyatra gacchāma iti saṃcintya rāghavaḥ | prātiṣṭhata sa vaidehyā lakṣmaṇena ca saṃgataḥ"
  - id: '2.109.5'
    kind: verse
    lines:
      - "सोऽत्रेराश्रममासाद्य तं ववन्दे महायशाः"
      - "तं चापि भगवानत्रिः पुत्रवत्प्रत्यपद्यत"
    iast: "so 'trer āśramam āsādya taṃ vavande mahāyaśāḥ | taṃ cāpi bhagavān atriḥ putravat pratyapadyata"
  - id: '2.109.17'
    kind: verse
    lines:
      - "सीता त्वेतद्वचः श्रुत्वा राघवस्य हितैषिणी"
      - "तामत्रिपत्नीं धर्मज्ञामभिचक्राम मैथिली"
    iast: "sītā tv etad vacaḥ śrutvā rāghavasya hitaiṣiṇī | tām atripatnīṃ dharmajñām abhicakrāma maithilī"
  - id: '2.111.14'
    kind: verse
    lines:
      - "न्यवेदयत्ततः सर्वं सीता रामाय मैथिली"
      - "प्रीतिदानं तपस्विन्या वसनाभरणस्रजाम्"
    iast: "nyavedayat tataḥ sarvaṃ sītā rāmāya maithilī | prītidānaṃ tapasvinyā vasanābharaṇasrajām"
  - id: '2.111.17'
    kind: verse
    lines:
      - "तस्यां रात्र्यां व्यतीतायामभिषिच्य हुताग्निकान्"
      - "आपृच्छेतां नरव्याघ्रौ तापसान्वनगोचरान्"
    iast: "tasyāṃ rātryāṃ vyatītāyām abhiṣicya hutāgnikān | āpṛcchetāṃ naravyāghrau tāpasān vanagocarān"
  - id: '2.111.18'
    kind: verse
    lines:
      - "तावूचुस्ते वनचरास्तापसा धर्मचारिणः"
      - "वनस्य तस्य संचारं राक्षसैः समभिप्लुतम्"
    iast: "tāv ūcus te vanacarās tāpasā dharmacāriṇaḥ | vanasya tasya saṃcāraṃ rākṣasaiḥ samabhiplutam"
  - id: '2.111.19'
    kind: verse
    lines:
      - "एष पन्था महर्षीणां फलान्याहरतां वने"
      - "अनेन तु वनं दुर्गं गन्तुं राघव ते क्षमम्"
    iast: "eṣa panthā maharṣīṇāṃ phalāny āharatāṃ vane | anena tu vanaṃ durgaṃ gantuṃ rāghava te kṣamam"
  - id: '3.1.1'
    kind: verse
    lines:
      - "प्रविश्य तु महारण्यं दण्डकारण्यमात्मवान्"
      - "ददर्श रामो दुर्धर्षस्तापसाश्रममण्डलम्"
    iast: "praviśya tu mahāraṇyaṃ daṇḍakāraṇyam ātmavān | dadarśa rāmo durdharṣas tāpasāśramamaṇḍalam"
  - id: '3.1.10'
    kind: verse
    lines:
      - "दिव्यज्ञानोपपन्नास्ते रामं दृष्ट्वा महर्षयः"
      - "अभ्यगच्छंस्तदा प्रीता वैदेहीं च यशस्विनीम्"
    iast: "divyajñānopapannās te rāmaṃ dṛṣṭvā maharṣayaḥ | abhyagacchaṃs tadā prītā vaidehīṃ ca yaśasvinīm"
  - id: '3.1.16'
    kind: verse
    lines:
      - "मूलं पुष्पं फलं वन्यमाश्रमं च महात्मनः"
      - "निवेदयीत्वा धर्मज्ञास्ततः प्राञ्जलयोऽब्रुवन्"
    iast: "mūlaṃ puṣpaṃ phalaṃ vanyam āśramaṃ ca mahātmanaḥ | nivedayītvā dharmajñās tataḥ prāñjalayo 'bruvan"
  - id: '3.1.17'
    kind: verse
    lines:
      - "धर्मपालो जनस्यास्य शरण्यश्च महायशाः"
      - "पूजनीयश्च मान्यश्च राजा दण्डधरो गुरुः"
    iast: "dharmapālo janasyāsya śaraṇyaś ca mahāyaśāḥ | pūjanīyaś ca mānyaś ca rājā daṇḍadharo guruḥ"
  - id: '3.1.19'
    kind: verse
    lines:
      - "ते वयं भवता रक्ष्या भवद्विषयवासिनः"
      - "नगरस्थो वनस्थो वा त्वं नो राजा जनेश्वरः"
    iast: "te vayaṃ bhavatā rakṣyā bhavadviṣayavāsinaḥ | nagarastho vanastho vā tvaṃ no rājā janeśvaraḥ"
  - id: '3.1.20'
    kind: verse
    lines:
      - "न्यस्तदण्डा वयं राजञ्जितक्रोधा जितेन्द्रियाः"
      - "रक्षितव्यास्त्वया शश्वद्गर्भभूतास्तपोधनाः"
    iast: "nyastadaṇḍā vayaṃ rājañ jitakrodhā jitendriyāḥ | rakṣitavyās tvayā śaśvad garbhabhūtās tapodhanāḥ"
  - id: '3.5.14'
    kind: verse
    lines:
      - "सोऽयं ब्राह्मणभूयिष्ठो वानप्रस्थगणो महान्"
      - "त्वन्नाथोऽनाथवद्राम राक्षसैर्वध्यते भृशम्"
    iast: "so 'yaṃ brāhmaṇabhūyiṣṭho vānaprasthagaṇo mahān | tvan nātho 'nāthavad rāma rākṣasair vadhyate bhṛśam"
  - id: '3.5.19'
    kind: verse
    lines:
      - "एतच्छ्रुत्वा तु काकुत्स्थस्तापसानां तपस्विनाम्"
      - "इदं प्रोवाच धर्मात्मा सर्वानेव तपस्विनः"
      - "नैवमर्हथ मां वक्तुमाज्ञाप्योऽहं तपस्विनम्"
    iast: "etac chrutvā tu kākutsthas tāpasānāṃ tapasvinām | idaṃ provāca dharmātmā sarvān eva tapasvinaḥ | naivam arhatha māṃ vaktum ājñāpyo 'haṃ tapasvinam"
  - id: '3.5.20'
    kind: verse
    lines:
      - "भवतामर्थसिद्ध्यर्थमागतोऽहं यदृच्छया"
      - "तस्य मेऽयं वने वासो भविष्यति महाफलः"
      - "तपस्विनां रणे शत्रून्हन्तुमिच्छामि राक्षसान्"
    iast: "bhavatām arthasiddhyartham āgato 'haṃ yadṛcchayā | tasya me 'yaṃ vane vāso bhaviṣyati mahāphalaḥ | tapasvināṃ raṇe śatrūn hantum icchāmi rākṣasān"
  - id: '3.6.3'
    kind: verse
    lines:
      - "ततस्तदिक्ष्वाकुवरौ सततं विविधैर्द्रुमैः"
      - "काननं तौ विविशतुः सीतया सह राघवौ"
    iast: "tatas tad ikṣvākuvarau satataṃ vividhair drumaiḥ | kānanaṃ tau viviśatuḥ sītayā saha rāghavau"
  - id: '3.7.19'
    kind: verse
    lines:
      - "आबध्य च शुभे तूणी चापे चादाय सस्वने"
      - "निष्क्रान्तावाश्रमाद्गन्तुमुभौ तौ रामलक्ष्मणौ"
    iast: "ābadhya ca śubhe tūṇī cāpe cādāya sasvane | niṣkrāntāv āśramād gantum ubhau tau rāmalakṣmaṇau"
  - id: '3.8.1'
    kind: verse
    lines:
      - "सुतीक्ष्णेनाभ्यनुज्ञातं प्रस्थितं रघुनन्दनम्"
      - "वैदेही स्निग्धया वाचा भर्तारमिदमब्रवीत्"
    iast: "sutīkṣṇenābhyanujñātaṃ prasthitaṃ raghunandanam | vaidehī snigdhayā vācā bhartāram idam abravīt"
  - id: '3.8.3'
    kind: verse
    lines:
      - "त्रीण्येव व्यसनान्यत्र कामजानि भवन्त्युत"
      - "मिथ्या वाक्यं परमकं तस्माद्गुरुतरावुभौ"
      - "परदाराभिगमनं विना वैरं च रौद्रता"
    iast: "trīṇy eva vyasanāny atra kāmajāni bhavanty uta | mithyā vākyaṃ paramakaṃ tasmād gurutarāv ubhau | paradārābhigamanaṃ vinā vairaṃ ca raudratā"
  - id: '3.8.4'
    kind: verse
    lines:
      - "मिथ्यावाक्यं न ते भूतं न भविष्यति राघव"
      - "कुतोऽभिलषणं स्त्रीणां परेषां धर्मनाशनम्"
    iast: "mithyāvākyaṃ na te bhūtaṃ na bhaviṣyati rāghava | kuto 'bhilaṣaṇaṃ strīṇāṃ pareṣāṃ dharmanāśanam"
  - id: '3.8.6'
    kind: verse
    lines:
      - "तृतीयं यदिदं रौद्रं परप्राणाभिहिंसनम्"
      - "निर्वैरं क्रियते मोहात्तच्च ते समुपस्थितम्"
    iast: "tṛtīyaṃ yad idaṃ raudraṃ paraprāṇābhihiṃsanam | nirvairaṃ kriyate mohāt tac ca te samupasthitam"
  - id: '3.8.20'
    kind: verse
    lines:
      - "स्नेहाच्च बहुमानाच्च स्मारये त्वां न शिक्षये"
      - "न कथं चन सा कार्या हृहीतधनुषा त्वया"
    iast: "snehāc ca bahumānāc ca smāraye tvāṃ na śikṣaye | na kathaṃ cana sā kāryā hṛhītadhanuṣā tvayā"
  - id: '3.8.21'
    kind: verse
    lines:
      - "बुद्धिर्वैरं विना हन्तुं राक्षसान्दण्डकाश्रितान्"
      - "अपराधं विना हन्तुं लोकान्वीर न कामये"
    iast: "buddhir vairaṃ vinā hantuṃ rākṣasān daṇḍakāśritān | aparādhaṃ vinā hantuṃ lokān vīra na kāmaye"
  - id: '3.8.22'
    kind: verse
    lines:
      - "क्षत्रियाणां तु वीराणां वनेषु नियतात्मनाम्"
      - "धनुषा कार्यमेतावदार्तानामभिरक्षणम्"
    iast: "kṣatriyāṇāṃ tu vīrāṇāṃ vaneṣu niyatātmanām | dhanuṣā kāryam etāvad ārtānām abhirakṣaṇam"
  - id: '3.8.23'
    kind: verse
    lines:
      - "क्व च शस्त्रं क्व च वनं क्व च क्षात्रं तपः क्व च"
      - "व्याविद्धमिदमस्माभिर्देशधर्मस्तु पूज्यताम्"
    iast: "kva ca śastraṃ kva ca vanaṃ kva ca kṣātraṃ tapaḥ kva ca | vyāviddham idam asmābhir deśadharmas tu pūjyatām"
  - id: '3.8.26'
    kind: verse
    lines:
      - "धर्मादर्थः प्रभवति धर्मात्प्रभवते सुखम्"
      - "धर्मेण लभते सर्वं धर्मसारमिदं जगत्"
    iast: "dharmād arthaḥ prabhavati dharmāt prabhavate sukham | dharmeṇa labhate sarvaṃ dharmasāram idaṃ jagat"
  - id: '3.9.1'
    kind: verse
    lines:
      - "वाक्यमेतत्तु वैदेह्या व्याहृतं भर्तृभक्तया"
      - "श्रुत्वा धर्मे स्थितो रामः प्रत्युवाचाथ मैथिलीम्"
    iast: "vākyam etat tu vaidehyā vyāhṛtaṃ bhartṛbhaktayā | śrutvā dharme sthito rāmaḥ pratyuvācātha maithilīm"
  - id: '3.9.3'
    kind: verse
    lines:
      - "किं तु वक्ष्याम्यहं देवि त्वयैवोक्तमिदं वचः"
      - "क्षत्रियैर्धार्यते चापो नार्तशब्दो भवेदिति"
    iast: "kiṃ tu vakṣyāmy ahaṃ devi tvayaivoktam idaṃ vacaḥ | kṣatriyair dhāryate cāpo nārtaśabdo bhaved iti"
  - id: '3.9.4'
    kind: verse
    lines:
      - "ते चार्ता दण्डकारण्ये मुनयः संशितव्रताः"
      - "मां सीते स्वयमागम्य शरण्याः शरणं गताः"
    iast: "te cārtā daṇḍakāraṇye munayaḥ saṃśitavratāḥ | māṃ sīte svayam āgamya śaraṇyāḥ śaraṇaṃ gatāḥ"
  - id: '3.9.10'
    kind: verse
    lines:
      - "सर्वैरेव समागम्य वागियं समुदाहृता"
      - "राक्षसैर्दण्डकारण्ये बहुभिः कामरूपिभिः"
      - "अर्दिताः स्म भृशं राम भवान्नस्त्रातुमर्हति"
    iast: "sarvair eva samāgamya vāg iyaṃ samudāhṛtā | rākṣasair daṇḍakāraṇye bahubhiḥ kāmarūpibhiḥ | arditāḥ sma bhṛśaṃ rāma bhavān nas trātum arhati"
  - id: '3.9.16'
    kind: verse
    lines:
      - "मया चैतद्वचः श्रुत्वा कार्त्स्न्येन परिपालनम्"
      - "ऋषीणां दण्डकारण्ये संश्रुतं जनकात्मजे"
    iast: "mayā caitad vacaḥ śrutvā kārtsnyena paripālanam | ṛṣīṇāṃ daṇḍakāraṇye saṃśrutaṃ janakātmaje"
  - id: '3.9.18'
    kind: verse
    lines:
      - "अप्यहं जीवितं जह्यां त्वां वा सीते सलक्ष्मणाम्"
      - "न तु प्रतिज्ञां संश्रुत्य ब्राह्मणेभ्यो विशेषतः"
    iast: "apy ahaṃ jīvitaṃ jahyāṃ tvāṃ vā sīte salakṣmaṇām | na tu pratijñāṃ saṃśrutya brāhmaṇebhyo viśeṣataḥ"
  - id: '3.9.19'
    kind: verse
    lines:
      - "तदवश्यं मया कार्यमृषीणां परिपालनम्"
      - "अनुक्तेनापि वैदेहि प्रतिज्ञाय तु किं पुनः"
    iast: "tad avaśyaṃ mayā kāryam ṛṣīṇāṃ paripālanam | anuktenāpi vaidehi pratijñāya tu kiṃ punaḥ"
  - id: '3.9.20'
    kind: verse
    lines:
      - "मम स्नेहाच्च सौहार्दादिदमुक्तं त्वया वचः"
      - "परितुष्टोऽस्म्यहं सीते न ह्यनिष्टोऽनुशिष्यते"
      - "सदृशं चानुरूपं च कुलस्य तव शोभने"
    iast: "mama snehāc ca sauhārdād idam uktaṃ tvayā vacaḥ | parituṣṭo 'smy ahaṃ sīte na hy aniṣṭo 'nuśiṣyate | sadṛśaṃ cānurūpaṃ ca kulasya tava śobhane"
  - id: '3.10.2'
    kind: verse
    lines:
      - "तौ पश्यमानौ विविधाञ्शैलप्रस्थान्वनानि च"
      - "नदीश्च विविधा रम्या जग्मतुः सह सीतया"
    iast: "tau paśyamānau vividhāñ śailaprasthān vanāni ca | nadīś ca vividhā ramyā jagmatuḥ saha sītayā"
  - id: '3.10.25'
    kind: verse
    lines:
      - "त्रीन्मासानष्टमासांश्च राघवो न्यवसत्सुखम्"
      - "तथा संवसतस्तस्य मुनीनामाश्रमेषु वै"
      - "रमतश्चानुकुल्येन ययुः संवत्सरा दश"
    iast: "trīn māsān aṣṭamāsāṃś ca rāghavo nyavasat sukham | tathā saṃvasatas tasya munīnām āśrameṣu vai | ramataś cānukulyena yayuḥ saṃvatsarā daśa"
  - id: '3.11.21'
    kind: verse
    lines:
      - "एवमुक्त्वा महाबाहुरगस्त्यं सूर्यवर्चसं"
      - "जग्राह परमप्रीतस्तस्य पादौ परंतपः"
    iast: "evam uktvā mahābāhur agastyaṃ sūryavarcasaṃ | jagrāha paramaprītas tasya pādau paraṃtapaḥ"
  - id: '3.11.22'
    kind: verse
    lines:
      - "अभिवाद्य तु धर्मात्मा तस्थौ रामः कृताञ्जलिः"
      - "सीतया सह वैदेह्या तदा राम सलक्ष्मणः"
    iast: "abhivādya tu dharmātmā tasthau rāmaḥ kṛtāñjaliḥ | sītayā saha vaidehyā tadā rāma salakṣmaṇaḥ"
  - id: '3.11.25'
    kind: verse
    lines:
      - "प्रथमं चोपविश्याथ धर्मज्ञो मुनिपुंगवः"
      - "उवाच राममासीनं प्राञ्जलिं धर्मकोविदम्"
    iast: "prathamaṃ copaviśyātha dharmajño munipuṃgavaḥ | uvāca rāmam āsīnaṃ prāñjaliṃ dharmakovidam"
  - id: '3.11.29'
    kind: verse
    lines:
      - "इदं दिव्यं महच्चापं हेमवज्रविभूषितम्"
      - "वैष्णवं पुरुषव्याघ्र निर्मितं विश्वकर्मणा"
    iast: "idaṃ divyaṃ mahac cāpaṃ hemavajravibhūṣitam | vaiṣṇavaṃ puruṣavyāghra nirmitaṃ viśvakarmaṇā"
  - id: '3.12.13'
    kind: verse
    lines:
      - "इतो द्वियोजने तात बहुमूलफलोदकः"
      - "देशो बहुमृगः श्रीमान्पञ्चवट्यभिविश्रुतः"
    iast: "ito dviyojane tāta bahumūlaphalodakaḥ | deśo bahumṛgaḥ śrīmān pañcavaṭy abhiviśrutaḥ"
  - id: '3.12.14'
    kind: verse
    lines:
      - "तत्र गत्वाश्रमपदं कृत्वा सौमित्रिणा सह"
      - "रमस्व त्वं पितुर्वाक्यं यथोक्तमनुपालयन्"
    iast: "tatra gatvāśramapadaṃ kṛtvā saumitriṇā saha | ramasva tvaṃ pitur vākyaṃ yathoktam anupālayan"
  - id: '3.12.23'
    kind: verse
    lines:
      - "अगस्त्येनैवमुक्तस्तु रामः सौमित्रिणा सह"
      - "सात्कृत्यामन्त्रयामास तमृषिं सत्यवादिनम्"
    iast: "agastyenaivam uktas tu rāmaḥ saumitriṇā saha | sātkṛtyāmantrayām āsa tam ṛṣiṃ satyavādinam"
  - id: '3.13.1'
    kind: verse
    lines:
      - "अथ पञ्चवटीं गच्छन्नन्तरा रघुनन्दनः"
      - "आससाद महाकायं गृध्रं भीमपराक्रमम्"
    iast: "atha pañcavaṭīṃ gacchann antarā raghunandanaḥ | āsasāda mahākāyaṃ gṛdhraṃ bhīmaparākramam"
  - id: '3.13.4'
    kind: verse
    lines:
      - "स तं पितृसखं बुद्ध्वा पूजयामास राघवः"
      - "स तस्य कुलमव्यग्रमथ पप्रच्छ नाम च"
    iast: "sa taṃ pitṛsakhaṃ buddhvā pūjayām āsa rāghavaḥ | sa tasya kulam avyagram atha papraccha nāma ca"
  - id: '3.13.5'
    kind: verse
    lines:
      - "रामस्य वचनं श्रुत्वा कुलमात्मानमेव च"
      - "आचचक्षे द्विजस्तस्मै सर्वभूतसमुद्भवम्"
    iast: "rāmasya vacanaṃ śrutvā kulam ātmānam eva ca | ācacakṣe dvijas tasmai sarvabhūtasamudbhavam"
  - id: '3.13.33'
    kind: verse
    lines:
      - "तस्माज्जातोऽहमरुणात्संपातिश्च ममाग्रजः"
      - "जटायुरिति मां विद्धि श्येनीपुत्रमरिंदम"
    iast: "tasmāj jāto 'ham aruṇāt saṃpātiś ca mamāgrajaḥ | jaṭāyur iti māṃ viddhi śyenīputram ariṃdama"
  - id: '3.14.1'
    kind: verse
    lines:
      - "ततः पञ्चवटीं गत्वा नानाव्यालमृगायुताम्"
      - "उवाच भ्रातरं रामो लक्ष्मणं दीप्ततेजसं"
    iast: "tataḥ pañcavaṭīṃ gatvā nānāvyālamṛgāyutām | uvāca bhrātaraṃ rāmo lakṣmaṇaṃ dīptatejasaṃ"
  - id: '3.14.10'
    kind: verse
    lines:
      - "अयं देशः समः श्रीमान्पुष्पितैर्तरुभिर्वृतः"
      - "इहाश्रमपदं सौम्य यथावत्कर्तुमर्हसि"
    iast: "ayaṃ deśaḥ samaḥ śrīmān puṣpitair tarubhir vṛtaḥ | ihāśramapadaṃ saumya yathāvat kartum arhasi"
  - id: '3.14.19'
    kind: verse
    lines:
      - "इदं पुण्यमिदं मेध्यमिदं बहुमृगद्विजम्"
      - "इह वत्स्याम सौमित्रे सार्धमेतेन पक्षिणा"
    iast: "idaṃ puṇyam idaṃ medhyam idaṃ bahumṛgadvijam | iha vatsyāma saumitre sārdham etena pakṣiṇā"
  - id: '3.16.4'
    kind: verse
    lines:
      - "तदासीनस्य रामस्य कथासंसक्तचेतसः"
      - "तं देशं राक्षसी का चिदाजगाम यदृच्छया"
    iast: "tadāsīnasya rāmasya kathāsaṃsaktacetasaḥ | taṃ deśaṃ rākṣasī kā cid ājagāma yadṛcchayā"
  - id: '3.16.10'
    kind: verse
    lines:
      - "न्यायवृत्तं सुदुर्वृत्ता प्रियमप्रियदर्शना"
      - "शरीरजसमाविष्टा राक्षसी राममब्रवीत्"
    iast: "nyāyavṛttaṃ sudurvṛttā priyam apriyadarśanā | śarīrajasamāviṣṭā rākṣasī rāmam abravīt"
  - id: '3.16.11'
    kind: verse
    lines:
      - "जटी तापसरूपेण सभार्यः शरचापधृक्"
      - "आगतस्त्वमिमं देशं कथं राक्षससेवितम्"
    iast: "jaṭī tāpasarūpeṇa sabhāryaḥ śaracāpadhṛk | āgatas tvam imaṃ deśaṃ kathaṃ rākṣasasevitam"
  - id: '3.16.21'
    kind: verse
    lines:
      - "तानहं समतिक्रान्ता राम त्वापूर्वदर्शनात्"
      - "समुपेतास्मि भावेन भर्तारं पुरुषोत्तमम्"
      - "चिराय भव भर्ता मे सीतया किं करिष्यसि"
    iast: "tān ahaṃ samatikrāntā rāma tvāpūrvadarśanāt | samupetāsmi bhāvena bhartāraṃ puruṣottamam | cirāya bhava bhartā me sītayā kiṃ kariṣyasi"
  - id: '3.17.16'
    kind: verse
    lines:
      - "अद्येमां भक्षयिष्यामि पश्यतस्तव मानुषीम्"
      - "त्वया सह चरिष्यामि निःसपत्ना यथासुखम्"
    iast: "adyemāṃ bhakṣayiṣyāmi paśyatas tava mānuṣīm | tvayā saha cariṣyāmi niḥsapatnā yathāsukham"
  - id: '3.17.20'
    kind: verse
    lines:
      - "इमां विरूपामसतीमतिमत्तां महोदरीम्"
      - "राक्षसीं पुरुषव्याघ्र विरूपयितुमर्हसि"
    iast: "imāṃ virūpām asatīm atimattāṃ mahodarīm | rākṣasīṃ puruṣavyāghra virūpayitum arhasi"
  - id: '3.17.21'
    kind: verse
    lines:
      - "इत्युक्तो लक्ष्मणस्तस्याः क्रुद्धो रामस्य पश्यतः"
      - "उद्धृत्य खड्गं चिच्छेद कर्णनासं महाबलः"
    iast: "ity ukto lakṣmaṇas tasyāḥ kruddho rāmasya paśyataḥ | uddhṛtya khaḍgaṃ ciccheda karṇanāsaṃ mahābalaḥ"
  - id: '3.18.10'
    kind: verse
    lines:
      - "इति भ्रातुर्वचः श्रुत्वा क्रुद्धस्य च विशेषतः"
      - "ततः शूर्पणखा वाक्यं सबाष्पमिदमब्रवीत्"
    iast: "iti bhrātur vacaḥ śrutvā kruddhasya ca viśeṣataḥ | tataḥ śūrpaṇakhā vākyaṃ sabāṣpam idam abravīt"
  - id: '3.18.13'
    kind: verse
    lines:
      - "तरुणी रूपसंपन्ना सर्वाभरणभूषिता"
      - "दृष्टा तत्र मया नारी तयोर्मध्ये सुमध्यमा"
    iast: "taruṇī rūpasaṃpannā sarvābharaṇabhūṣitā | dṛṣṭā tatra mayā nārī tayor madhye sumadhyamā"
  - id: '3.18.14'
    kind: verse
    lines:
      - "ताभ्यामुभाभ्यां संभूय प्रमदामधिकृत्य ताम्"
      - "इमामवस्थां नीताहं यथानाथासती तथा"
    iast: "tābhyām ubhābhyāṃ saṃbhūya pramadām adhikṛtya tām | imām avasthāṃ nītāhaṃ yathānāthāsatī tathā"
  - id: '3.18.15'
    kind: verse
    lines:
      - "तस्याश्चानृजुवृत्तायास्तयोश्च हतयोरहम्"
      - "सफेनं पातुमिच्छामि रुधिरं रणमूर्धनि"
    iast: "tasyāś cānṛjuvṛttāyās tayoś ca hatayor aham | saphenaṃ pātum icchāmi rudhiraṃ raṇamūrdhani"
  - id: '3.24.6'
    kind: verse
    lines:
      - "ततस्तं भीमधन्वानं क्रुद्धाः सर्वे निशाचराः"
      - "रामं नानाविधैः शस्त्रैरभ्यवर्षन्त दुर्जयम्"
    iast: "tatas taṃ bhīmadhanvānaṃ kruddhāḥ sarve niśācarāḥ | rāmaṃ nānāvidhaiḥ śastrair abhyavarṣanta durjayam"
  - id: '3.24.28'
    kind: verse
    lines:
      - "तद्बभूवाद्भुतं युद्धं तुमुलं रोमहर्षणम्"
      - "रामस्यास्य महाघोरं पुनस्तेषां च रक्षसाम्"
    iast: "tad babhūvādbhutaṃ yuddhaṃ tumulaṃ romaharṣaṇam | rāmasyāsya mahāghoraṃ punas teṣāṃ ca rakṣasām"
  - id: '3.25.22'
    kind: verse
    lines:
      - "चतुर्दश सहस्राणि रक्षसां भीमकर्मणाम्"
      - "हतान्येकेन रामेण मानुषेण पदातिना"
    iast: "caturdaśa sahasrāṇi rakṣasāṃ bhīmakarmaṇām | hatāny ekena rāmeṇa mānuṣeṇa padātinā"
  - id: '3.29.34'
    kind: verse
    lines:
      - "ततो रामस्तु विजयी पूज्यमानो महर्षिभिः"
      - "प्रविवेशाश्रमं वीरो लक्ष्मणेनाभिवादितः"
    iast: "tato rāmas tu vijayī pūjyamāno maharṣibhiḥ | praviveśāśramaṃ vīro lakṣmaṇenābhivāditaḥ"
  - id: '3.30.3'
    kind: verse
    lines:
      - "सा दृष्ट्वा कर्म रामस्य कृतमन्यैः सुदुष्करम्"
      - "जगाम परमौद्विग्ना लङ्कां रावणपालिताम्"
    iast: "sā dṛṣṭvā karma rāmasya kṛtam anyaiḥ suduṣkaram | jagāma paramaudvignā laṅkāṃ rāvaṇapālitām"
  - id: '3.31.1'
    kind: verse
    lines:
      - "ततः शूर्पणखा दीना रावणं लोकरावणम्"
      - "अमात्यमध्ये संक्रुद्धा परुषं वाक्यमब्रवीत्"
    iast: "tataḥ śūrpaṇakhā dīnā rāvaṇaṃ lokarāvaṇam | amātyamadhye saṃkruddhā paruṣaṃ vākyam abravīt"
  - id: '3.31.3'
    kind: verse
    lines:
      - "सक्तं ग्राम्येषु भोगेषु कामवृत्तं महीपतिम्"
      - "लुब्धं न बहु मन्यन्ते श्मशानाग्निमिव प्रजाः"
    iast: "saktaṃ grāmyeṣu bhogeṣu kāmavṛttaṃ mahīpatim | lubdhaṃ na bahu manyante śmaśānāgnim iva prajāḥ"
  - id: '3.31.10'
    kind: verse
    lines:
      - "अयुक्तचारं मन्ये त्वां प्राकृतैः सचिवैर्वृतम्"
      - "स्वजनं च जनस्थानं हतं यो नावबुध्यसे"
    iast: "ayuktacāraṃ manye tvāṃ prākṛtaiḥ sacivair vṛtam | svajanaṃ ca janasthānaṃ hataṃ yo nāvabudhyase"
  - id: '3.31.11'
    kind: verse
    lines:
      - "चतुर्दश सहस्राणि रक्षसां भीमकर्मणाम्"
      - "हतान्येकेन रामेण खरश्च सहदूषणः"
    iast: "caturdaśa sahasrāṇi rakṣasāṃ bhīmakarmaṇām | hatāny ekena rāmeṇa kharaś ca sahadūṣaṇaḥ"
  - id: '3.31.12'
    kind: verse
    lines:
      - "ऋषीणामभयं दत्तं कृतक्षेमाश्च दण्डकाः"
      - "धर्षितं च जनस्थानं रामेणाक्लिष्टकर्मणा"
    iast: "ṛṣīṇām abhayaṃ dattaṃ kṛtakṣemāś ca daṇḍakāḥ | dharṣitaṃ ca janasthānaṃ rāmeṇākliṣṭakarmaṇā"
  - id: '3.32.2'
    kind: verse
    lines:
      - "कश्च रामः कथं वीर्यः किं रूपः किं पराक्रमः"
      - "किमर्थं दण्डकारण्यं प्रविष्टश्च सुदुश्चरम्"
    iast: "kaś ca rāmaḥ kathaṃ vīryaḥ kiṃ rūpaḥ kiṃ parākramaḥ | kimarthaṃ daṇḍakāraṇyaṃ praviṣṭaś ca suduścaram"
  - id: '3.32.4'
    kind: verse
    lines:
      - "इत्युक्ता राक्षसेन्द्रेण राक्षसी क्रोधमूर्छिता"
      - "ततो रामं यथान्यायमाख्यातुमुपचक्रमे"
    iast: "ity uktā rākṣasendreṇa rākṣasī krodhamūrchitā | tato rāmaṃ yathānyāyam ākhyātum upacakrame"
  - id: '3.32.12'
    kind: verse
    lines:
      - "भ्राता चास्य महातेजा गुणतस्तुल्यविक्रमः"
      - "अनुरक्तश्च भक्तश्च लक्ष्मणो नाम वीर्यवान्"
    iast: "bhrātā cāsya mahātejā guṇatas tulyavikramaḥ | anuraktaś ca bhaktaś ca lakṣmaṇo nāma vīryavān"
  - id: '3.32.14'
    kind: verse
    lines:
      - "रामस्य तु विशालाक्षी धर्मपत्नी यशस्विनी"
      - "सीता नाम वरारोहा वैदेही तनुमध्यमा"
    iast: "rāmasya tu viśālākṣī dharmapatnī yaśasvinī | sītā nāma varārohā vaidehī tanumadhyamā"
  - id: '3.32.17'
    kind: verse
    lines:
      - "सा सुशीला वपुःश्लाघ्या रूपेणाप्रतिमा भुवि"
      - "तवानुरूपा भार्या सा त्वं च तस्यास्तथा पतिः"
    iast: "sā suśīlā vapuḥślāghyā rūpeṇāpratimā bhuvi | tavānurūpā bhāryā sā tvaṃ ca tasyās tathā patiḥ"
  - id: '3.32.18'
    kind: verse
    lines:
      - "तां तु विस्तीर्णजघनां पीनोत्तुङ्गपयोधराम्"
      - "भार्यार्थे तु तवानेतुमुद्यताहं वराननाम्"
    iast: "tāṃ tu vistīrṇajaghanāṃ pīnottuṅgapayodharām | bhāryārthe tu tavānetum udyatāhaṃ varānanām"
  - id: '3.32.20'
    kind: verse
    lines:
      - "यदि तस्यामभिप्रायो भार्यार्थे तव जायते"
      - "शीघ्रमुद्ध्रियतां पादो जयार्थमिह दक्षिणः"
    iast: "yadi tasyām abhiprāyo bhāryārthe tava jāyate | śīghram uddhriyatāṃ pādo jayārtham iha dakṣiṇaḥ"
  - id: '3.33.1'
    kind: verse
    lines:
      - "ततः शूर्पणखा वाक्यं तच्छ्रुत्वा रोमहर्षणम्"
      - "सचिवानभ्यनुज्ञाय कार्यं बुद्ध्वा जगाम ह"
    iast: "tataḥ śūrpaṇakhā vākyaṃ tac chrutvā romaharṣaṇam | sacivān abhyanujñāya kāryaṃ buddhvā jagāma ha"
  - id: '3.33.37'
    kind: verse
    lines:
      - "तत्र कृष्णाजिनधरं जटावल्कलधारिणम्"
      - "ददर्श नियताहारं मारीचं नाम राक्षसं"
    iast: "tatra kṛṣṇājinadharaṃ jaṭāvalkaladhāriṇam | dadarśa niyatāhāraṃ mārīcaṃ nāma rākṣasaṃ"
  - id: '3.33.38'
    kind: verse
    lines:
      - "स रावणः समागम्य विधिवत्तेन रक्षसा"
      - "ततः पश्चादिदं वाक्यमब्रवीद्वाक्यकोविदः"
    iast: "sa rāvaṇaḥ samāgamya vidhivat tena rakṣasā | tataḥ paścād idaṃ vākyam abravīd vākyakovidaḥ"
  - id: '3.34.1'
    kind: verse
    lines:
      - "मारीच श्रूयतां तात वचनं मम भाषतः"
      - "आर्तोऽस्मि मम चार्तस्य भवान्हि परमा गतिः"
    iast: "mārīca śrūyatāṃ tāta vacanaṃ mama bhāṣataḥ | ārto 'smi mama cārtasya bhavān hi paramā gatiḥ"
  - id: '3.34.2'
    kind: verse
    lines:
      - "जानीषे त्वं जनस्थानं भ्राता यत्र खरो मम"
      - "दूषणश्च महाबाहुः स्वसा शूर्पणखा च मे"
    iast: "jānīṣe tvaṃ janasthānaṃ bhrātā yatra kharo mama | dūṣaṇaś ca mahābāhuḥ svasā śūrpaṇakhā ca me"
  - id: '3.34.6'
    kind: verse
    lines:
      - "ते त्विदानीं जनस्थाने वसमाना महाबलाः"
      - "संगताः परमायत्ता रामेण सह संयुगे"
    iast: "te tv idānīṃ janasthāne vasamānā mahābalāḥ | saṃgatāḥ param āyattā rāmeṇa saha saṃyuge"
  - id: '3.34.7'
    kind: verse
    lines:
      - "तेन संजातरोषेण रामेण रणमूर्धनि"
      - "अनुक्त्वा परुषं किं चिच्छरैर्व्यापारितं धनुः"
    iast: "tena saṃjātaroṣeṇa rāmeṇa raṇamūrdhani | anuktvā paruṣaṃ kiṃ cic charair vyāpāritaṃ dhanuḥ"
  - id: '3.34.8'
    kind: verse
    lines:
      - "चतुर्दश सहस्राणि रक्षसां भीमकर्मणाम्"
      - "निहतानि शरैस्तीक्ष्णैर्मानुषेण पदातिना"
    iast: "caturdaśa sahasrāṇi rakṣasāṃ bhīmakarmaṇām | nihatāni śarais tīkṣṇair mānuṣeṇa padātinā"
  - id: '3.34.10'
    kind: verse
    lines:
      - "पित्रा निरस्तः क्रुद्धेन सभार्यः क्षीणजीवितः"
      - "स हन्ता तस्य सैन्यस्य रामः क्षत्रियपांसनः"
    iast: "pitrā nirastaḥ kruddhena sabhāryaḥ kṣīṇajīvitaḥ | sa hantā tasya sainyasya rāmaḥ kṣatriyapāṃsanaḥ"
  - id: '3.34.12'
    kind: verse
    lines:
      - "येन वैरं विनारण्ये सत्त्वमाश्रित्य केवलम्"
      - "कर्णनासापहारेण भगिनी मे विरूपिता"
    iast: "yena vairaṃ vināraṇye sattvam āśritya kevalam | karṇanāsāpahāreṇa bhaginī me virūpitā"
  - id: '3.34.13'
    kind: verse
    lines:
      - "तस्य भार्यां जनस्थानात्सीतां सुरसुतोपमाम्"
      - "आनयिष्यामि विक्रम्य सहायस्तत्र मे भव"
    iast: "tasya bhāryāṃ janasthānāt sītāṃ surasutopamām | ānayiṣyāmi vikramya sahāyas tatra me bhava"
  - id: '3.34.16'
    kind: verse
    lines:
      - "एतदर्थमहं प्राप्तस्त्वत्समीपं निशाचर"
      - "शृणु तत्कर्म साहाय्ये यत्कार्यं वचनान्मम"
    iast: "etadartham ahaṃ prāptas tvatsamīpaṃ niśācara | śṛṇu tat karma sāhāyye yat kāryaṃ vacanān mama"
  - id: '3.35.1'
    kind: verse
    lines:
      - "तच्छ्रुत्वा राक्षसेन्द्रस्य वाक्यं वाक्यविशारदः"
      - "प्रत्युवाच महाप्राज्ञो मारीचो राक्षसेश्वरम्"
    iast: "tac chrutvā rākṣasendrasya vākyaṃ vākyaviśāradaḥ | pratyuvāca mahāprājño mārīco rākṣaseśvaram"
  - id: '3.35.2'
    kind: verse
    lines:
      - "सुलभाः पुरुषा राजन्सततं प्रियवादिनः"
      - "अप्रियस्य च पथ्यस्य वक्ता श्रोता च दुर्लभः"
    iast: "sulabhāḥ puruṣā rājan satataṃ priyavādinaḥ | apriyasya ca pathyasya vaktā śrotā ca durlabhaḥ"
  - id: '3.35.3'
    kind: verse
    lines:
      - "न नूनं बुध्यसे रामं महावीर्यं गुणोन्नतम्"
      - "अयुक्तचारश्चपलो महेन्द्रवरुणोपमम्"
    iast: "na nūnaṃ budhyase rāmaṃ mahāvīryaṃ guṇonnatam | ayuktacāraś capalo mahendravaruṇopamam"
  - id: '3.35.13'
    kind: verse
    lines:
      - "रामो विग्रहवान्धर्मः साधुः सत्यपराक्रमः"
      - "राजा सर्वस्य लोकस्य देवानामिव वासवः"
    iast: "rāmo vigrahavān dharmaḥ sādhuḥ satyaparākramaḥ | rājā sarvasya lokasya devānām iva vāsavaḥ"
  - id: '3.35.14'
    kind: verse
    lines:
      - "कथं त्वं तस्य वैदेहीं रक्षितां स्वेन तेजसा"
      - "इच्छसि प्रसभं हर्तुं प्रभामिव विवस्वतः"
    iast: "kathaṃ tvaṃ tasya vaidehīṃ rakṣitāṃ svena tejasā | icchasi prasabhaṃ hartuṃ prabhām iva vivasvataḥ"
  - id: '3.36.26'
    kind: verse
    lines:
      - "प्रमदानां सहस्राणि तव राजन्परिग्रहः"
      - "भव स्वदारनिरतः स्वकुलं रक्षराक्षस"
    iast: "pramadānāṃ sahasrāṇi tava rājan parigrahaḥ | bhava svadāranirataḥ svakulaṃ rakṣarākṣasa"
  - id: '3.37.18'
    kind: verse
    lines:
      - "रकारादीनि नामानि रामत्रस्तस्य रावण"
      - "रत्नानि च रथाश्चैव त्रासं संजनयन्ति मे"
    iast: "rakārādīni nāmāni rāmatrastasya rāvaṇa | ratnāni ca rathāś caiva trāsaṃ saṃjanayanti me"
  - id: '3.48.13'
    kind: verse
    lines:
      - "यदि शूर्पणखाहेतोर्जनस्थानगतः खरः"
      - "अतिवृत्तो हतः पूर्वं रामेणाक्लिष्टकर्मणा"
    iast: "yadi śūrpaṇakhāhetor janasthānagataḥ kharaḥ | ativṛtto hataḥ pūrvaṃ rāmeṇākliṣṭakarmaṇā"
  - id: '3.38.2'
    kind: verse
    lines:
      - "तं पथ्यहितवक्तारं मारीचं राक्षसाधिपः"
      - "अब्रवीत्परुषं वाक्यमयुक्तं कालचोदितः"
    iast: "taṃ pathyahitavaktāraṃ mārīcaṃ rākṣasādhipaḥ | abravīt paruṣaṃ vākyam ayuktaṃ kālacoditaḥ"
  - id: '3.38.7'
    kind: verse
    lines:
      - "एवं मे निश्चिता बुद्धिर्हृदि मारीच वर्तते"
      - "न व्यावर्तयितुं शक्या सेन्द्रैरपि सुरासुरैः"
    iast: "evaṃ me niścitā buddhir hṛdi mārīca vartate | na vyāvartayituṃ śakyā sendrair api surāsuraiḥ"
  - id: '3.38.10'
    kind: verse
    lines:
      - "वाक्यमप्रतिकूलं तु मृदुपूर्वं शुभं हितम्"
      - "उपचारेण युक्तं च वक्तव्यो वसुधाधिपः"
    iast: "vākyam apratikūlaṃ tu mṛdupūrvaṃ śubhaṃ hitam | upacāreṇa yuktaṃ ca vaktavyo vasudhādhipaḥ"
  - id: '3.38.13'
    kind: verse
    lines:
      - "तस्मात्सर्वास्ववस्थासु मान्याः पूज्याश्च पार्थिवाः"
      - "त्वं तु धर्ममविज्ञाय केवलं मोहमास्थितः"
    iast: "tasmāt sarvāsv avasthāsu mānyāḥ pūjyāś ca pārthivāḥ | tvaṃ tu dharmam avijñāya kevalaṃ moham āsthitaḥ"
  - id: '3.38.14'
    kind: verse
    lines:
      - "अभ्यागतं मां दौरात्म्यात्परुषं वदसीदृशम्"
      - "गुणदोषौ न पृच्छामि क्षमं चात्मनि राक्षस"
      - "अस्मिंस्तु स भवान्कृत्ये साहाय्यं कर्तुमर्हति"
    iast: "abhyāgataṃ māṃ daurātmyāt paruṣaṃ vadasīdṛśam | guṇadoṣau na pṛcchāmi kṣamaṃ cātmani rākṣasa | asmiṃs tu sa bhavān kṛtye sāhāyyaṃ kartum arhati"
  - id: '3.38.15'
    kind: verse
    lines:
      - "सौवर्णस्त्वं मृगो भूत्वा चित्रो रजतबिन्दुभिः"
      - "प्रलोभयित्वा वैदेहीं यथेष्टं गन्तुमर्हसि"
    iast: "sauvarṇas tvaṃ mṛgo bhūtvā citro rajatabindubhiḥ | pralobhayitvā vaidehīṃ yatheṣṭaṃ gantum arhasi"
  - id: '3.38.16'
    kind: verse
    lines:
      - "त्वां तु मायामृगं दृष्ट्वा काञ्चनं जातविस्मया"
      - "आनयैनमिति क्षिप्रं रामं वक्ष्यति मैथिली"
    iast: "tvāṃ tu māyāmṛgaṃ dṛṣṭvā kāñcanaṃ jātavismayā | ānayainam iti kṣipraṃ rāmaṃ vakṣyati maithilī"
  - id: '3.38.20'
    kind: verse
    lines:
      - "एतत्कार्यमवश्यं मे बलादपि करिष्यसि"
      - "राज्ञो हि प्रतिकूलस्थो न जातु सुखमेधते"
    iast: "etat kāryam avaśyaṃ me balād api kariṣyasi | rājño hi pratikūlastho na jātu sukham edhate"
  - id: '3.40.12'
    kind: verse
    lines:
      - "स रावणवचः श्रुत्वा मारीचो राक्षसस्तदा"
      - "मृगो भूत्वाश्रमद्वारि रामस्य विचचार ह"
    iast: "sa rāvaṇavacaḥ śrutvā mārīco rākṣasas tadā | mṛgo bhūtvāśramadvāri rāmasya vicacāra ha"
  - id: '3.41.1'
    kind: verse
    lines:
      - "सा तं संप्रेक्ष्य सुश्रोणी कुसुमानि विचिन्वती"
      - "हेमराजतवर्णाभ्यां पार्श्वाभ्यामुपशोभितम्"
    iast: "sā taṃ saṃprekṣya suśroṇī kusumāni vicinvatī | hemarājatavarṇābhyāṃ pārśvābhyām upaśobhitam"
  - id: '3.41.2'
    kind: verse
    lines:
      - "प्रहृष्टा चानवद्याङ्गी मृष्टहाटकवर्णिनी"
      - "भर्तारमपि चाक्रन्दल्लक्ष्मणं चैव सायुधम्"
    iast: "prahṛṣṭā cānavadyāṅgī mṛṣṭahāṭakavarṇinī | bhartāram api cākrandal lakṣmaṇaṃ caiva sāyudham"
  - id: '3.41.3'
    kind: verse
    lines:
      - "तयाहूतौ नरव्याघ्रौ वैदेह्या रामलक्ष्मणौ"
      - "वीक्षमाणौ तु तं देशं तदा ददृशतुर्मृगम्"
    iast: "tayāhūtau naravyāghrau vaidehyā rāmalakṣmaṇau | vīkṣamāṇau tu taṃ deśaṃ tadā dadṛśatur mṛgam"
  - id: '3.41.4'
    kind: verse
    lines:
      - "शङ्कमानस्तु तं दृष्ट्वा लक्ष्मणो राममब्रवीत्"
      - "तमेवैनमहं मन्ये मारीचं राक्षसं मृगम्"
    iast: "śaṅkamānas tu taṃ dṛṣṭvā lakṣmaṇo rāmam abravīt | tam evainam ahaṃ manye mārīcaṃ rākṣasaṃ mṛgam"
  - id: '3.41.7'
    kind: verse
    lines:
      - "मृगो ह्येवंविधो रत्नविचित्रो नास्ति राघव"
      - "जगत्यां जगतीनाथ मायैषा हि न संशयः"
    iast: "mṛgo hy evaṃvidho ratnavicitro nāsti rāghava | jagatyāṃ jagatīnātha māyaiṣā hi na saṃśayaḥ"
  - id: '3.41.8'
    kind: verse
    lines:
      - "एवं ब्रुवाणं काकुत्स्थं प्रतिवार्य शुचिस्मिता"
      - "उवाच सीता संहृष्टा छद्मना हृतचेतना"
    iast: "evaṃ bruvāṇaṃ kākutsthaṃ prativārya śucismitā | uvāca sītā saṃhṛṣṭā chadmanā hṛtacetanā"
  - id: '3.41.9'
    kind: verse
    lines:
      - "आर्यपुत्राभिरामोऽसौ मृगो हरति मे मनः"
      - "आनयैनं महाबाहो क्रीडार्थं नो भविष्यति"
    iast: "āryaputrābhirāmo 'sau mṛgo harati me manaḥ | ānayainaṃ mahābāho krīḍārthaṃ no bhaviṣyati"
  - id: '3.41.16'
    kind: verse
    lines:
      - "समाप्तवनवासानां राज्यस्थानां च नः पुनः"
      - "अन्तःपुरविभूषार्थो मृग एष भविष्यति"
    iast: "samāptavanavāsānāṃ rājyasthānāṃ ca naḥ punaḥ | antaḥpuravibhūṣārtho mṛga eṣa bhaviṣyati"
  - id: '3.41.17'
    kind: verse
    lines:
      - "भरतस्यार्यपुत्रस्य श्वश्रूणां मम च प्रभो"
      - "मृगरूपमिदं दिव्यं विस्मयं जनयिष्यति"
    iast: "bharatasyāryaputrasya śvaśrūṇāṃ mama ca prabho | mṛgarūpam idaṃ divyaṃ vismayaṃ janayiṣyati"
  - id: '3.41.23'
    kind: verse
    lines:
      - "पश्य लक्ष्मण वैदेह्याः स्पृहां मृगगतामिमाम्"
      - "रूपश्रेष्ठतया ह्येष मृगोऽद्य न भविष्यति"
    iast: "paśya lakṣmaṇa vaidehyāḥ spṛhāṃ mṛgagatām imām | rūpaśreṣṭhatayā hy eṣa mṛgo 'dya na bhaviṣyati"
  - id: '3.41.27'
    kind: verse
    lines:
      - "मसारगल्वर्कमुखः शङ्खमुक्तानिभोदरः"
      - "कस्य नामानिरूप्योऽसौ न मनो लोभयेन्मृगः"
    iast: "masāragalvarkamukhaḥ śaṅkhamuktānibhodaraḥ | kasya nāmānirūpyo 'sau na mano lobhayen mṛgaḥ"
  - id: '3.41.44'
    kind: verse
    lines:
      - "भवेद्धतोऽयं वातापिरगस्त्येनेव मा गतिः"
      - "इह त्वं भव संनद्धो यन्त्रितो रक्ष मैथिलीम्"
    iast: "bhaved dhato 'yaṃ vātāpir agastyeneva mā gatiḥ | iha tvaṃ bhava saṃnaddho yantrito rakṣa maithilīm"
  - id: '3.41.46'
    kind: verse
    lines:
      - "यावद्गच्छामि सौमित्रे मृगमानयितुं द्रुतम्"
      - "पश्य लक्ष्मण वैदेहीं मृगत्वचि गतस्पृहाम्"
    iast: "yāvad gacchāmi saumitre mṛgam ānayituṃ drutam | paśya lakṣmaṇa vaidehīṃ mṛgatvaci gataspṛhām"
  - id: '3.42.1'
    kind: verse
    lines:
      - "तथा तु तं समादिश्य भ्रातरं रघुनन्दनः"
      - "बबन्धासिं महातेजा जाम्बूनदमयत्सरुम्"
    iast: "tathā tu taṃ samādiśya bhrātaraṃ raghunandanaḥ | babandhāsiṃ mahātejā jāmbūnadamayatsarum"
  - id: '3.42.4'
    kind: verse
    lines:
      - "बद्धासिर्धनुरादाय प्रदुद्राव यतो मृगः"
      - "तं स पश्यति रूपेण द्योतमानमिवाग्रतः"
    iast: "baddhāsir dhanur ādāya pradudrāva yato mṛgaḥ | taṃ sa paśyati rūpeṇa dyotamānam ivāgrataḥ"
  - id: '3.42.8'
    kind: verse
    lines:
      - "दर्शनादर्शनेनैव सोऽपाकर्षत राघवम्"
      - "आसीत्क्रुद्धस्तु काकुत्स्थो विवशस्तेन मोहितः"
    iast: "darśanādarśanenaiva so 'pākarṣata rāghavam | āsīt kruddhas tu kākutstho vivaśas tena mohitaḥ"
  - id: '3.42.10'
    kind: verse
    lines:
      - "दृष्ट्वा रामो महातेजास्तं हन्तुं कृतनिश्चयः"
      - "संधाय सुदृढे चापे विकृष्य बलवद्बली"
    iast: "dṛṣṭvā rāmo mahātejās taṃ hantuṃ kṛtaniścayaḥ | saṃdhāya sudṛḍhe cāpe vikṛṣya balavad balī"
  - id: '3.42.13'
    kind: verse
    lines:
      - "तालमात्रमथोत्पत्य न्यपतत्स शरातुरः"
      - "व्यनदद्भैरवं नादं धरण्यामल्पजीवितः"
      - "म्रियमाणस्तु मारीचो जहौ तां कृत्रिमां तनुम्"
    iast: "tālamātram athotpatya nyapatat sa śarāturaḥ | vyanadad bhairavaṃ nādaṃ dharaṇyām alpajīvitaḥ | mriyamāṇas tu mārīco jahau tāṃ kṛtrimāṃ tanum"
  - id: '3.42.14'
    kind: verse
    lines:
      - "संप्राप्तकालमाज्ञाय चकार च ततः स्वरम्"
      - "सदृशं राघवस्यैव हा सीते लक्ष्मणेति च"
    iast: "saṃprāptakālam ājñāya cakāra ca tataḥ svaram | sadṛśaṃ rāghavasyaiva hā sīte lakṣmaṇeti ca"
  - id: '3.43.4'
    kind: verse
    lines:
      - "रक्षसां वशमापन्नं सिंहानामिव गोवृषम्"
      - "न जगाम तथोक्तस्तु भ्रातुराज्ञाय शासनम्"
    iast: "rakṣasāṃ vaśam āpannaṃ siṃhānām iva govṛṣam | na jagāma tathoktas tu bhrātur ājñāya śāsanam"
  - id: '3.43.5'
    kind: verse
    lines:
      - "तमुवाच ततस्तत्र कुपिता जनकात्मजा"
      - "सौमित्रे मित्ररूपेण भ्रातुस्त्वमसि शत्रुवत्"
    iast: "tam uvāca tatas tatra kupitā janakātmajā | saumitre mitrarūpeṇa bhrātus tvam asi śatruvat"
  - id: '3.43.23'
    kind: verse
    lines:
      - "कथमिन्दीवरश्यामं रामं पद्मनिभेक्षणम्"
      - "उपसंश्रित्य भर्तारं कामयेयं पृथग्जनम्"
    iast: "katham indīvaraśyāmaṃ rāmaṃ padmanibhekṣaṇam | upasaṃśritya bhartāraṃ kāmayeyaṃ pṛthag janam"
  - id: '3.43.25'
    kind: verse
    lines:
      - "इत्युक्तः परुषं वाक्यं सीतया सोमहर्षणम्"
      - "अब्रवील्लक्ष्मणः सीतां प्राञ्जलिर्विजितेन्द्रियः"
    iast: "ity uktaḥ paruṣaṃ vākyaṃ sītayā somaharṣaṇam | abravīl lakṣmaṇaḥ sītāṃ prāñjalir vijitendriyaḥ"
  - id: '3.43.27'
    kind: verse
    lines:
      - "स्वभावस्त्वेष नारीणामेषु लोकेषु दृश्यते"
      - "विमुक्तधर्माश्चपलास्तीक्ष्णा भेदकराः स्त्रियः"
    iast: "svabhāvas tv eṣa nārīṇām eṣu lokeṣu dṛśyate | vimuktadharmāś capalās tīkṣṇā bhedakarāḥ striyaḥ"
  - id: '3.44.1'
    kind: verse
    lines:
      - "तया परुषमुक्तस्तु कुपितो राघवानुजः"
      - "स विकाङ्क्षन्भृशं रामं प्रतस्थे नचिरादिव"
    iast: "tayā paruṣam uktas tu kupito rāghavānujaḥ | sa vikāṅkṣan bhṛśaṃ rāmaṃ pratasthe nacirād iva"
  - id: '3.44.3'
    kind: verse
    lines:
      - "श्लक्ष्णकाषायसंवीतः शिखी छत्री उपानही"
      - "वामे चांसेऽवसज्याथ शुभे यष्टिकमण्डलू"
      - "परिव्राजकरूपेण वैदेहीं समुपागमत्"
    iast: "ślakṣṇakāṣāyasaṃvītaḥ śikhī chatrī upānahī | vāme cāṃse 'vasajyātha śubhe yaṣṭikamaṇḍalū | parivrājakarūpeṇa vaidehīṃ samupāgamat"
  - id: '3.44.15'
    kind: verse
    lines:
      - "का त्वं काञ्चनवर्णाभे पीतकौशेयवासिनि"
      - "कमलानां शुभां मालां पद्मिनीव च बिभ्रती"
    iast: "kā tvaṃ kāñcanavarṇābhe pītakauśeyavāsini | kamalānāṃ śubhāṃ mālāṃ padminīva ca bibhratī"
  - id: '3.44.16'
    kind: verse
    lines:
      - "ह्रीः श्रीः कीर्तिः शुभा लक्ष्मीरप्सरा वा शुभानने"
      - "भूतिर्वा त्वं वरारोहे रतिर्वा स्वैरचारिणी"
    iast: "hrīḥ śrīḥ kīrtiḥ śubhā lakṣmīr apsarā vā śubhānane | bhūtir vā tvaṃ varārohe ratir vā svairacāriṇī"
  - id: '3.44.30'
    kind: verse
    lines:
      - "कासि कस्य कुतश्च त्वं किंनिमित्तं च दण्डकान्"
      - "एका चरसि कल्याणि घोरान्राक्षससेवितान्"
    iast: "kāsi kasya kutaś ca tvaṃ kiṃnimittaṃ ca daṇḍakān | ekā carasi kalyāṇi ghorān rākṣasasevitān"
  - id: '3.45.2'
    kind: verse
    lines:
      - "ब्राह्मणश्चातिथिश्चैष अनुक्तो हि शपेत माम्"
      - "इति ध्यात्वा मुहूर्तं तु सीता वचनमब्रवीत्"
    iast: "brāhmaṇaś cātithiś caiṣa anukto hi śapeta mām | iti dhyātvā muhūrtaṃ tu sītā vacanam abravīt"
  - id: '3.45.19'
    kind: verse
    lines:
      - "समाश्वस मुहूर्तं तु शक्यं वस्तुमिह त्वया"
      - "आगमिष्यति मे भर्ता वन्यमादाय पुष्कलम्"
    iast: "samāśvasa muhūrtaṃ tu śakyaṃ vastum iha tvayā | āgamiṣyati me bhartā vanyam ādāya puṣkalam"
  - id: '3.46.2'
    kind: verse
    lines:
      - "भ्राता वैश्रवणस्याहं सापत्न्यो वरवर्णिनि"
      - "रावणो नाम भद्रं ते दशग्रीवः प्रतापवान्"
    iast: "bhrātā vaiśravaṇasyāhaṃ sāpatnyo varavarṇini | rāvaṇo nāma bhadraṃ te daśagrīvaḥ pratāpavān"
  - id: '3.47.12'
    kind: verse
    lines:
      - "मां भजस्व चिराय त्वमहं श्लाघ्यस्तव प्रियः"
      - "नैव चाहं क्व चिद्भद्रे करिष्ये तव विप्रियम्"
      - "त्यज्यतां मानुषो भावो मयि भावः प्रणीयताम्"
    iast: "māṃ bhajasva cirāya tvam ahaṃ ślāghyas tava priyaḥ | naiva cāhaṃ kva cid bhadre kariṣye tava vipriyam | tyajyatāṃ mānuṣo bhāvo mayi bhāvaḥ praṇīyatām"
  - id: '3.47.16'
    kind: verse
    lines:
      - "वामेन सीतां पद्माक्षीं मूर्धजेषु करेण सः"
      - "ऊर्वोस्तु दक्षिणेनैव परिजग्राह पाणिना"
    iast: "vāmena sītāṃ padmākṣīṃ mūrdhajeṣu kareṇa saḥ | ūrvos tu dakṣiṇenaiva parijagrāha pāṇinā"
  - id: '3.47.20'
    kind: verse
    lines:
      - "सा गृहीतातिचुक्रोश रावणेन यशस्विनी"
      - "रामेति सीता दुःखार्ता रामं दूरगतं वने"
    iast: "sā gṛhītāticukrośa rāvaṇena yaśasvinī | rāmeti sītā duḥkhārtā rāmaṃ dūragataṃ vane"
  - id: '3.48.1'
    kind: verse
    lines:
      - "तं शब्दमवसुप्तस्य जटायुरथ शुश्रुवे"
      - "निरैक्षद्रावणं क्षिप्रं वैदेहीं च ददर्श सः"
    iast: "taṃ śabdam avasuptasya jaṭāyur atha śuśruve | niraikṣad rāvaṇaṃ kṣipraṃ vaidehīṃ ca dadarśa saḥ"
  - id: '3.48.2'
    kind: verse
    lines:
      - "ततः पर्वतकूटाभस्तीक्ष्णतुण्डः खगोत्तमः"
      - "वनस्पतिगतः श्रीमान्व्याजहार शुभां गिरम्"
    iast: "tataḥ parvatakūṭābhas tīkṣṇatuṇḍaḥ khagottamaḥ | vanaspatigataḥ śrīmān vyājahāra śubhāṃ giram"
  - id: '3.48.25'
    kind: verse
    lines:
      - "न हि मे जीवमानस्य नयिष्यसि शुभामिमाम्"
      - "सीतां कमलपत्राक्षीं रामस्य महषीं प्रियाम्"
    iast: "na hi me jīvamānasya nayiṣyasi śubhām imām | sītāṃ kamalapatrākṣīṃ rāmasya mahaṣīṃ priyām"
  - id: '3.48.27'
    kind: verse
    lines:
      - "तिष्ठ तिष्ठ दशग्रीव मुहूर्तं पश्य रावण"
      - "युद्धातिथ्यं प्रदास्यामि यथाप्राणं निशाचर"
      - "वृन्तादिव फलं त्वां तु पातयेयं रथोत्तमात्"
    iast: "tiṣṭha tiṣṭha daśagrīva muhūrtaṃ paśya rāvaṇa | yuddhātithyaṃ pradāsyāmi yathāprāṇaṃ niśācara | vṛntād iva phalaṃ tvāṃ tu pātayeyaṃ rathottamāt"
  - id: '3.49.4'
    kind: verse
    lines:
      - "तद्बभूवाद्भुतं युद्धं गृध्रराक्षसयोस्तदा"
      - "सपक्षयोर्माल्यवतोर्महापर्वतयोरिव"
    iast: "tad babhūvādbhutaṃ yuddhaṃ gṛdhrarākṣasayos tadā | sapakṣayor mālyavator mahāparvatayor iva"
  - id: '3.49.36'
    kind: verse
    lines:
      - "तस्य व्यायच्छमानस्य रामस्यार्थेऽथ रावणः"
      - "पक्षौ पादौ च पार्श्वौ च खड्गमुद्धृत्य सोऽच्छिनत्"
    iast: "tasya vyāyacchamānasya rāmasyārthe 'tha rāvaṇaḥ | pakṣau pādau ca pārśvau ca khaḍgam uddhṛtya so 'cchinat"
  - id: '3.50.12'
    kind: verse
    lines:
      - "स तु तां राम रामेति रुदन्तीं लक्ष्मणेति च"
      - "जगामाकाशमादाय रावणो राक्षसाधिपः"
    iast: "sa tu tāṃ rāma rāmeti rudantīṃ lakṣmaṇeti ca | jagāmākāśam ādāya rāvaṇo rākṣasādhipaḥ"
  - id: '3.52.1'
    kind: verse
    lines:
      - "ह्रियमाणा तु वैदेही कं चिन्नाथमपश्यती"
      - "ददर्श गिरिशृङ्गस्थान्पञ्चवानरपुंगवान्"
    iast: "hriyamāṇā tu vaidehī kaṃ cin nātham apaśyatī | dadarśa giriśṛṅgasthān pañcavānarapuṃgavān"
  - id: '3.52.2'
    kind: verse
    lines:
      - "तेषां मध्ये विशालाक्षी कौशेयं कनकप्रभम्"
      - "उत्तरीयं वरारोहा शुभान्याभरणानि च"
      - "मुमोच यदि रामाय शंसेयुरिति मैथिली"
    iast: "teṣāṃ madhye viśālākṣī kauśeyaṃ kanakaprabham | uttarīyaṃ varārohā śubhāny ābharaṇāni ca | mumoca yadi rāmāya śaṃseyur iti maithilī"
  - id: '3.52.11'
    kind: verse
    lines:
      - "स तु सीतां विवेष्टन्तीमङ्केनादाय रावणः"
      - "प्रविवेश पुरीं लङ्कां रूपिणीं मृत्युमात्मनः"
    iast: "sa tu sītāṃ viveṣṭantīm aṅkenādāya rāvaṇaḥ | praviveśa purīṃ laṅkāṃ rūpiṇīṃ mṛtyum ātmanaḥ"
  - id: '3.55.1'
    kind: verse
    lines:
      - "राक्षसं मृगरूपेण चरन्तं कामरूपिणम्"
      - "निहत्य रामो मारीचं तूर्णं पथि न्यवर्तत"
    iast: "rākṣasaṃ mṛgarūpeṇa carantaṃ kāmarūpiṇam | nihatya rāmo mārīcaṃ tūrṇaṃ pathi nyavartata"
  - id: '3.55.14'
    kind: verse
    lines:
      - "संजगर्हेऽथ तं भ्राता जेष्ठो लक्ष्मणमागतम्"
      - "विहाय सीतां विजने वने राक्षससेविते"
    iast: "saṃjagarhe 'tha taṃ bhrātā jeṣṭho lakṣmaṇam āgatam | vihāya sītāṃ vijane vane rākṣasasevite"
  - id: '3.57.21'
    kind: verse
    lines:
      - "न हि ते परितुष्यामि त्यक्त्वा यद्यासि मैथिलीम्"
      - "क्रुद्धायाः परुषं श्रुत्वा स्त्रिया यत्त्वमिहागतः"
    iast: "na hi te parituṣyāmi tyaktvā yad yāsi maithilīm | kruddhāyāḥ paruṣaṃ śrutvā striyā yat tvam ihāgataḥ"
  - id: '3.57.22'
    kind: verse
    lines:
      - "सर्वथा त्वपनीतं ते सीतया यत्प्रचोदितः"
      - "क्रोधस्य वशमागम्य नाकरोः शासनं मम"
    iast: "sarvathā tv apanītaṃ te sītayā yat pracoditaḥ | krodhasya vaśam āgamya nākaroḥ śāsanaṃ mama"
  - id: '3.58.3'
    kind: verse
    lines:
      - "त्वरमाणो जगामाथ सीतादर्शनलालसः"
      - "शून्यमावसथं दृष्ट्वा बभूवोद्विग्नमानसः"
    iast: "tvaramāṇo jagāmātha sītādarśanalālasaḥ | śūnyam āvasathaṃ dṛṣṭvā babhūvodvignamānasaḥ"
  - id: '3.63.4'
    kind: verse
    lines:
      - "तं तथा परितापार्तं लक्ष्मणो राममब्रवीत्"
      - "इदमेव जनस्थानं त्वमन्वेषितुमर्हसि"
    iast: "taṃ tathā paritāpārtaṃ lakṣmaṇo rāmam abravīt | idam eva janasthānaṃ tvam anveṣitum arhasi"
  - id: '3.63.5'
    kind: verse
    lines:
      - "राक्षसैर्बहुभिः कीर्णं नानाद्रुमलतायुतम्"
      - "सन्तीह गिरिदुर्गाणि निर्दराः कन्दराणि च"
    iast: "rākṣasair bahubhiḥ kīrṇaṃ nānādrumalatāyutam | santīha giridurgāṇi nirdarāḥ kandarāṇi ca"
  - id: '3.63.6'
    kind: verse
    lines:
      - "गुहाश्च विविधा घोरा नानामृगगणाकुलाः"
      - "आवासाः किंनराणां च गन्धर्वभवनानि च"
    iast: "guhāś ca vividhā ghorā nānāmṛgagaṇākulāḥ | āvāsāḥ kiṃnarāṇāṃ ca gandharvabhavanāni ca"
  - id: '3.63.7'
    kind: verse
    lines:
      - "तानि युक्तो मया सार्धं त्वमन्वेषितुमर्हसि"
      - "त्वद्विधो बुद्धिसंपन्ना माहात्मानो नरर्षभ"
    iast: "tāni yukto mayā sārdhaṃ tvam anveṣitum arhasi | tvadvidho buddhisaṃpannā māhātmāno nararṣabha"
  - id: '3.63.8'
    kind: verse
    lines:
      - "आपत्सु न प्रकम्पन्ते वायुवेगैरिवाचलाः"
      - "इत्युक्तस्तद्वनं सर्वं विचचार सलक्ष्मणः"
    iast: "āpatsu na prakampante vāyuvegair ivācalāḥ | ity uktas tad vanaṃ sarvaṃ vicacāra salakṣmaṇaḥ"
  - id: '3.63.9'
    kind: verse
    lines:
      - "क्रुद्धो रामः शरं घोरं संधाय धनुषि क्षुरम्"
      - "ततः पर्वतकूटाभं महाभागं द्विजोत्तमम्"
    iast: "kruddho rāmaḥ śaraṃ ghoraṃ saṃdhāya dhanuṣi kṣuram | tataḥ parvatakūṭābhaṃ mahābhāgaṃ dvijottamam"
  - id: '3.63.10'
    kind: verse
    lines:
      - "ददर्श पतितं भूमौ क्षतजार्द्रं जटायुषम्"
      - "तं दृष्ट्वा गिरिशृङ्गाभं रामो लक्ष्मणमब्रवीत्"
      - "अनेन सीता वैदेही भक्षिता नात्र संशयः"
    iast: "dadarśa patitaṃ bhūmau kṣatajārdraṃ jaṭāyuṣam | taṃ dṛṣṭvā giriśṛṅgābhaṃ rāmo lakṣmaṇam abravīt | anena sītā vaidehī bhakṣitā nātra saṃśayaḥ"
  - id: '3.63.14'
    kind: verse
    lines:
      - "यामोषधिमिवायुष्मन्नन्वेषसि महावने"
      - "सा देवी मम च प्राणा रावणेनोभयं हृतम्"
    iast: "yām oṣadhim ivāyuṣmann anveṣasi mahāvane | sā devī mama ca prāṇā rāvaṇenobhayaṃ hṛtam"
  - id: '3.64.10'
    kind: verse
    lines:
      - "परिश्रान्तस्य मे तात पक्षौ छित्त्वा निशाचरः"
      - "सीतामादाय वैदेहीं प्रयातो दक्षिणा मुखः"
    iast: "pariśrāntasya me tāta pakṣau chittvā niśācaraḥ | sītām ādāya vaidehīṃ prayāto dakṣiṇā mukhaḥ"
  - id: '3.64.11'
    kind: verse
    lines:
      - "उपरुध्यन्ति मे प्राणा दृष्टिर्भ्रमति राघव"
      - "पश्यामि वृक्षान्सौवर्णानुशीरकृतमूर्धजान्"
    iast: "uparudhyanti me prāṇā dṛṣṭir bhramati rāghava | paśyāmi vṛkṣān sauvarṇān uśīrakṛtamūrdhajān"
  - id: '3.64.16'
    kind: verse
    lines:
      - "पुत्रो विश्रवसः साक्षाद्भ्राता वैश्रवणस्य च"
      - "इत्युक्त्वा दुर्लभान्प्राणान्मुमोच पतगेश्वरः"
    iast: "putro viśravasaḥ sākṣād bhrātā vaiśravaṇasya ca | ity uktvā durlabhān prāṇān mumoca patageśvaraḥ"
  - id: '3.64.31'
    kind: verse
    lines:
      - "एवमुक्त्वा चितां दीप्तामारोप्य पतगेश्वरम्"
      - "ददाह रामो धर्मात्मा स्वबन्धुमिव दुःखितः"
    iast: "evam uktvā citāṃ dīptām āropya patageśvaram | dadāha rāmo dharmātmā svabandhum iva duḥkhitaḥ"
  - id: '3.64.35'
    kind: verse
    lines:
      - "ततो गोदावरीं गत्वा नदीं नरवरात्मजौ"
      - "उदकं चक्रतुस्तस्मै गृध्रराजाय तावुभौ"
    iast: "tato godāvarīṃ gatvā nadīṃ naravarātmajau | udakaṃ cakratus tasmai gṛdhrarājāya tāv ubhau"
  - id: '3.65.12'
    kind: verse
    lines:
      - "तयोरन्वेषतोरेवं सर्वं तद्वनमोजसा"
      - "संजज्ञे विपुलः शब्दः प्रभञ्जन्निव तद्वनम्"
    iast: "tayor anveṣator evaṃ sarvaṃ tad vanam ojasā | saṃjajñe vipulaḥ śabdaḥ prabhañjann iva tad vanam"
  - id: '3.65.21'
    kind: verse
    lines:
      - "अथ तौ समतिक्रम्य क्रोशमात्रे ददर्शतुः"
      - "महान्तं दारुणं भीमं कबन्धं भुजसंवृतम्"
    iast: "atha tau samatikramya krośamātre dadarśatuḥ | mahāntaṃ dāruṇaṃ bhīmaṃ kabandhaṃ bhujasaṃvṛtam"
  - id: '3.66.5'
    kind: verse
    lines:
      - "ततस्तौ देशकालज्ञौ खड्गाभ्यामेव राघवौ"
      - "अच्छिन्दतां सुसंहृष्टौ बाहू तस्यांसदेशयोः"
    iast: "tatas tau deśakālajñau khaḍgābhyām eva rāghavau | acchindatāṃ susaṃhṛṣṭau bāhū tasyāṃsadeśayoḥ"
  - id: '3.66.7'
    kind: verse
    lines:
      - "स पपात महाबाहुश्छिन्नबाहुर्महास्वनः"
      - "खं च गां च दिशश्चैव नादयञ्जलदो यथा"
    iast: "sa papāta mahābāhuś chinnabāhur mahāsvanaḥ | khaṃ ca gāṃ ca diśaś caiva nādayañ jalado yathā"
  - id: '3.66.13'
    kind: verse
    lines:
      - "एवमुक्तः कबन्धस्तु लक्ष्मणेनोत्तरं वचः"
      - "उवाच परमप्रीतस्तदिन्द्रवचनं स्मरन्"
    iast: "evam uktaḥ kabandhas tu lakṣmaṇenottaraṃ vacaḥ | uvāca paramaprītas tad indravacanaṃ smaran"
  - id: '3.66.14'
    kind: verse
    lines:
      - "स्वागतं वां नरव्याघ्रौ दिष्ट्या पश्यामि चाप्यहम्"
      - "दिष्ट्या चेमौ निकृत्तौ मे युवाभ्यां बाहुबन्धनौ"
    iast: "svāgataṃ vāṃ naravyāghrau diṣṭyā paśyāmi cāpy aham | diṣṭyā cemau nikṛttau me yuvābhyāṃ bāhubandhanau"
  - id: '3.68.13'
    kind: verse
    lines:
      - "वयस्यं तं कुरु क्षिप्रमितो गत्वाद्य राघव"
      - "अद्रोहाय समागम्य दीप्यमाने विभावसौ"
    iast: "vayasyaṃ taṃ kuru kṣipram ito gatvādya rāghava | adrohāya samāgamya dīpyamāne vibhāvasau"
  - id: '3.69.2'
    kind: verse
    lines:
      - "एष राम शिवः पन्था यत्रैते पुष्पिता द्रुमाः"
      - "प्रतीचीं दिशमाश्रित्य प्रकाशन्ते मनोरमाः"
    iast: "eṣa rāma śivaḥ panthā yatraite puṣpitā drumāḥ | pratīcīṃ diśam āśritya prakāśante manoramāḥ"
  - id: '3.70.1'
    kind: verse
    lines:
      - "तौ कबन्धेन तं मार्गं पम्पाया दर्शितं वने"
      - "आतस्थतुर्दिशं गृह्य प्रतीचीं नृवरात्मजौ"
    iast: "tau kabandhena taṃ mārgaṃ pampāyā darśitaṃ vane | ātasthatur diśaṃ gṛhya pratīcīṃ nṛvarātmajau"
  - id: '3.70.3'
    kind: verse
    lines:
      - "कृत्वा च शैलपृष्ठे तु तौ वासं रघुनन्दनौ"
      - "पम्पायाः पश्चिमं तीरं राघवावुपतस्थतुः"
    iast: "kṛtvā ca śailapṛṣṭhe tu tau vāsaṃ raghunandanau | pampāyāḥ paścimaṃ tīraṃ rāghavāv upatasthatuḥ"
  - id: '3.71.19'
    kind: verse
    lines:
      - "अरविन्दोत्पलवतीं पद्मसौगन्धिकायुताम्"
      - "पुष्पिताम्रवणोपेतां बर्हिणोद्घुष्टनादिताम्"
    iast: "aravindotpalavatīṃ padmasaugandhikāyutām | puṣpitāmravaṇopetāṃ barhiṇodghuṣṭanāditām"
  - id: '3.71.25'
    kind: verse
    lines:
      - "सुग्रीवमभिगच्छ त्वं वानरेन्द्रं नरर्षभ"
      - "इत्युवाच पुनर्वाक्यं लक्ष्मणं सत्यविक्रमम्"
    iast: "sugrīvam abhigaccha tvaṃ vānarendraṃ nararṣabha | ity uvāca punar vākyaṃ lakṣmaṇaṃ satyavikramam"
  - id: '4.1.1'
    kind: verse
    lines:
      - "स तां पुष्करिणीं गत्वा पद्मोत्पलझषाकुलाम्"
      - "रामः सौमित्रिसहितो विललापाकुलेन्द्रियः"
    iast: "sa tāṃ puṣkariṇīṃ gatvā padmotpalajhaṣākulām | rāmaḥ saumitrisahito vilalāpākulendriyaḥ"
  - id: '4.1.47'
    kind: verse
    lines:
      - "एवं स विलपंस्तत्र शोकोपहतचेतनः"
      - "अवेक्षत शिवां पम्पां रम्यवारिवहां शुभाम्"
    iast: "evaṃ sa vilapaṃs tatra śokopahatacetanaḥ | avekṣata śivāṃ pampāṃ ramyavārivahāṃ śubhām"
  - id: '4.2.1'
    kind: verse
    lines:
      - "तौ तु दृष्ट्वा महात्मानौ भ्रातरौ रामलक्ष्मणौ"
      - "वरायुधधरौ वीरौ सुग्रीवः शङ्कितोऽभवत्"
    iast: "tau tu dṛṣṭvā mahātmānau bhrātarau rāmalakṣmaṇau | varāyudhadharau vīrau sugrīvaḥ śaṅkito 'bhavat"
  - id: '4.3.3'
    kind: verse
    lines:
      - "स्वकं रूपं परित्यज्य भिक्षुरूपेण वानरः"
      - "आबभाषे च तौ वीरौ यथावत्प्रशशंस च"
    iast: "svakaṃ rūpaṃ parityajya bhikṣurūpeṇa vānaraḥ | ābabhāṣe ca tau vīrau yathāvat praśaśaṃsa ca"
  - id: '4.3.18'
    kind: verse
    lines:
      - "सुग्रीवो नाम धर्मात्मा कश्चिद्वानरयूथपः"
      - "वीरो विनिकृतो भ्रात्रा जगद्भ्रमति दुःखितः"
    iast: "sugrīvo nāma dharmātmā kaś cid vānarayūthapaḥ | vīro vinikṛto bhrātrā jagad bhramati duḥkhitaḥ"
  - id: '4.3.19'
    kind: verse
    lines:
      - "प्राप्तोऽहं प्रेषितस्तेन सुग्रीवेण महात्मना"
      - "राज्ञा वानरमुख्यानां हनुमान्नाम वानरः"
    iast: "prāpto 'haṃ preṣitas tena sugrīveṇa mahātmanā | rājñā vānaramukhyānāṃ hanumān nāma vānaraḥ"
  - id: '4.3.20'
    kind: verse
    lines:
      - "युवाभ्यां सह धर्मात्मा सुग्रीवः सख्यमिच्छति"
      - "तस्य मां सचिवं वित्तं वानरं पवनात्मजम्"
    iast: "yuvābhyāṃ saha dharmātmā sugrīvaḥ sakhyam icchati | tasya māṃ sacivaṃ vittaṃ vānaraṃ pavanātmajam"
  - id: '4.3.23'
    kind: verse
    lines:
      - "एतच्छ्रुत्वा वचस्तस्य रामो लक्ष्मणमब्रवीत्"
      - "प्रहृष्टवदनः श्रीमान्भ्रातरं पार्श्वतः स्थितम्"
    iast: "etac chrutvā vacas tasya rāmo lakṣmaṇam abravīt | prahṛṣṭavadanaḥ śrīmān bhrātaraṃ pārśvataḥ sthitam"
  - id: '4.3.24'
    kind: verse
    lines:
      - "सचिवोऽयं कपीन्द्रस्य सुग्रीवस्य महात्मनः"
      - "तमेव काङ्क्षमाणस्य ममान्तिकमुपागतः"
    iast: "sacivo 'yaṃ kapīndrasya sugrīvasya mahātmanaḥ | tam eva kāṅkṣamāṇasya mamāntikam upāgataḥ"
  - id: '4.3.25'
    kind: verse
    lines:
      - "तमभ्यभाष सौमित्रे सुग्रीवसचिवं कपिम्"
      - "वाक्यज्ञं मधुरैर्वाक्यैः स्नेहयुक्तमरिंदमम्"
    iast: "tam abhyabhāṣa saumitre sugrīvasacivaṃ kapim | vākyajñaṃ madhurair vākyaiḥ snehayuktam ariṃdamam"
  - id: '4.4.6'
    kind: verse
    lines:
      - "राजा दशरथो नाम द्युतिमान्धर्मवत्सलः"
      - "तस्यायं पूर्वजः पुत्रो रामो नाम जनैः श्रुतः"
    iast: "rājā daśaratho nāma dyutimān dharmavatsalaḥ | tasyāyaṃ pūrvajaḥ putro rāmo nāma janaiḥ śrutaḥ"
  - id: '4.4.7'
    kind: verse
    lines:
      - "शरण्यः सर्वभूतानां पितुर्निर्देशपारगः"
      - "वीरो दशरथस्यायं पुत्राणां गुणवत्तरः"
    iast: "śaraṇyaḥ sarvabhūtānāṃ pitur nirdeśapāragaḥ | vīro daśarathasyāyaṃ putrāṇāṃ guṇavattaraḥ"
  - id: '4.4.8'
    kind: verse
    lines:
      - "राज्याद्भ्रष्टो वने वस्तुं मया सार्धमिहागतः"
      - "भार्यया च महातेजाः सीतयानुगतो वशी"
      - "दिनक्षये महातेजाः प्रभयेव दिवाकरः"
    iast: "rājyād bhraṣṭo vane vastuṃ mayā sārdham ihāgataḥ | bhāryayā ca mahātejāḥ sītayānugato vaśī | dinakṣaye mahātejāḥ prabhayeva divākaraḥ"
  - id: '4.4.11'
    kind: verse
    lines:
      - "रक्षसापहृता भार्या रहिते कामरूपिणा"
      - "तच्च न ज्ञायते रक्षः पत्नी येनास्य सा हृता"
    iast: "rakṣasāpahṛtā bhāryā rahite kāmarūpiṇā | tac ca na jñāyate rakṣaḥ patnī yenāsya sā hṛtā"
  - id: '4.5.2'
    kind: verse
    lines:
      - "अयं रामो महाप्राज्ञः संप्राप्तो दृढविक्रमः"
      - "लक्ष्मणेन सह भ्रात्रा रामोऽयं सत्यविक्रमः"
    iast: "ayaṃ rāmo mahāprājñaḥ saṃprāpto dṛḍhavikramaḥ | lakṣmaṇena saha bhrātrā rāmo 'yaṃ satyavikramaḥ"
  - id: '4.5.8'
    kind: verse
    lines:
      - "श्रुत्वा हनुमतो वाक्यं सुग्रीवो हृष्टमानसः"
      - "भयं स राघवाद्घोरं प्रजहौ विगतज्वरः"
    iast: "śrutvā hanumato vākyaṃ sugrīvo hṛṣṭamānasaḥ | bhayaṃ sa rāghavād ghoraṃ prajahau vigatajvaraḥ"
  - id: '4.5.9'
    kind: verse
    lines:
      - "स कृत्वा मानुषं रूपं सुग्रीवः प्लवगाधिपः"
      - "दर्शनीयतमो भूत्वा प्रीत्या प्रोवाच राघवम्"
    iast: "sa kṛtvā mānuṣaṃ rūpaṃ sugrīvaḥ plavagādhipaḥ | darśanīyatamo bhūtvā prītyā provāca rāghavam"
  - id: '4.5.10'
    kind: verse
    lines:
      - "भवान्धर्मविनीतश्च विक्रान्तः सर्ववत्सलः"
      - "आख्याता वायुपुत्रेण तत्त्वतो मे भवद्गुणाः"
    iast: "bhavān dharmavinītaś ca vikrāntaḥ sarvavatsalaḥ | ākhyātā vāyuputreṇa tattvato me bhavadguṇāḥ"
  - id: '4.5.11'
    kind: verse
    lines:
      - "तन्ममैवैष सत्कारो लाभश्चैवोत्तमः प्रभो"
      - "यत्त्वमिच्छसि सौहार्दं वानरेण मया सह"
    iast: "tan mamaivaiṣa satkāro lābhaś caivottamaḥ prabho | yat tvam icchasi sauhārdaṃ vānareṇa mayā saha"
  - id: '4.5.12'
    kind: verse
    lines:
      - "रोचते यदि वा सख्यं बाहुरेष प्रसारितः"
      - "गृह्यतां पाणिना पाणिर्मर्यादा वध्यतां ध्रुवा"
    iast: "rocate yadi vā sakhyaṃ bāhur eṣa prasāritaḥ | gṛhyatāṃ pāṇinā pāṇir maryādā vadhyatāṃ dhruvā"
  - id: '4.5.13'
    kind: verse
    lines:
      - "एतत्तु वचनं श्रुत्वा सुग्रीवस्य सुभाषितम्"
      - "संप्रहृष्टमना हस्तं पीडयामास पाणिना"
      - "हृद्यं सौहृदमालम्ब्य पर्यष्वजत पीडितम्"
    iast: "etat tu vacanaṃ śrutvā sugrīvasya subhāṣitam | saṃprahṛṣṭamanā hastaṃ pīḍayām āsa pāṇinā | hṛdyaṃ sauhṛdam ālambya paryaṣvajata pīḍitam"
  - id: '4.5.16'
    kind: verse
    lines:
      - "ततोऽग्निं दीप्यमानं तौ चक्रतुश्च प्रदक्षिणम्"
      - "सुग्रीवो राघवश्चैव वयस्यत्वमुपागतौ"
    iast: "tato 'gniṃ dīpyamānaṃ tau cakratuś ca pradakṣiṇam | sugrīvo rāghavaś caiva vayasyatvam upāgatau"
  - id: '4.8.15'
    kind: verse
    lines:
      - "ततः प्रहृष्टः सुग्रीवः श्लक्ष्णं मधुरया गिरा"
      - "उवाच प्रणयाद्रामं हर्षव्याकुलिताक्षरम्"
    iast: "tataḥ prahṛṣṭaḥ sugrīvaḥ ślakṣṇaṃ madhurayā girā | uvāca praṇayād rāmaṃ harṣavyākulitākṣaram"
  - id: '4.8.18'
    kind: verse
    lines:
      - "वालिनो मे भयार्तस्य सर्वलोकाभयंकर"
      - "ममापि त्वमनाथस्य प्रसादं कर्तुमर्हसि"
    iast: "vālino me bhayārtasya sarvalokābhayaṃkara | mamāpi tvam anāthasya prasādaṃ kartum arhasi"
  - id: '4.8.20'
    kind: verse
    lines:
      - "उपकारफलं मित्रमपकारोऽरिलक्षणम्"
      - "अद्यैव तं हनिष्यामि तव भार्यापहारिणम्"
    iast: "upakāraphalaṃ mitram apakāro 'rilakṣaṇam | adyaiva taṃ haniṣyāmi tava bhāryāpahāriṇam"
  - id: '4.6.1'
    kind: verse
    lines:
      - "अयमाख्याति मे राम सचिवो मन्त्रिसत्तमः"
      - "हनुमान्यन्निमित्तं त्वं निर्जनं वनमागतः"
    iast: "ayam ākhyāti me rāma sacivo mantrisattamaḥ | hanumān yannimittaṃ tvaṃ nirjanaṃ vanam āgataḥ"
  - id: '4.6.2'
    kind: verse
    lines:
      - "लक्ष्मणेन सह भ्रात्रा वसतश्च वने तव"
      - "रक्षसापहृता भार्या मैथिली जनकात्मजा"
    iast: "lakṣmaṇena saha bhrātrā vasataś ca vane tava | rakṣasāpahṛtā bhāryā maithilī janakātmajā"
  - id: '4.6.3'
    kind: verse
    lines:
      - "त्वया वियुक्ता रुदती लक्ष्मणेन च धीमता"
      - "अन्तरं प्रेप्सुना तेन हत्वा गृध्रं जटायुषम्"
    iast: "tvayā viyuktā rudatī lakṣmaṇena ca dhīmatā | antaraṃ prepsunā tena hatvā gṛdhraṃ jaṭāyuṣam"
  - id: '4.6.7'
    kind: verse
    lines:
      - "अनुमानात्तु जानामि मैथिली सा न संशयः"
      - "ह्रियमाणा मया दृष्टा रक्षसा क्रूरकर्मणा"
    iast: "anumānāt tu jānāmi maithilī sā na saṃśayaḥ | hriyamāṇā mayā dṛṣṭā rakṣasā krūrakarmaṇā"
  - id: '4.6.8'
    kind: verse
    lines:
      - "क्रोशन्ती राम रामेति लक्ष्मणेति च विस्वरम्"
      - "स्फुरन्ती रावणस्याङ्के पन्नगेन्द्रवधूर्यथा"
    iast: "krośantī rāma rāmeti lakṣmaṇeti ca visvaram | sphurantī rāvaṇasyāṅke pannagendravadhūr yathā"
  - id: '4.6.9'
    kind: verse
    lines:
      - "आत्मना पञ्चमं मां हि दृष्ट्वा शैलतटे स्थितम्"
      - "उत्तरीयं तया त्यक्तं शुभान्याभरणानि च"
    iast: "ātmanā pañcamaṃ māṃ hi dṛṣṭvā śailataṭe sthitam | uttarīyaṃ tayā tyaktaṃ śubhāny ābharaṇāni ca"
  - id: '4.6.10'
    kind: verse
    lines:
      - "तान्यस्माभिर्गृहीतानि निहितानि च राघव"
      - "आनयिष्याम्यहं तानि प्रत्यभिज्ञातुमर्हसि"
    iast: "tāny asmābhir gṛhītāni nihitāni ca rāghava | ānayiṣyāmy ahaṃ tāni pratyabhijñātum arhasi"
  - id: '4.6.13'
    kind: verse
    lines:
      - "उत्तरीयं गृहीत्वा तु शुभान्याभरणानि च"
      - "इदं पश्येति रामाय दर्शयामास वानरः"
    iast: "uttarīyaṃ gṛhītvā tu śubhāny ābharaṇāni ca | idaṃ paśyeti rāmāya darśayām āsa vānaraḥ"
  - id: '4.6.17'
    kind: verse
    lines:
      - "अविच्छिन्नाश्रुवेगस्तु सौमित्रिं वीक्ष्य पार्श्वतः"
      - "परिदेवयितुं दीनं रामः समुपचक्रमे"
    iast: "avicchinnāśruvegas tu saumitriṃ vīkṣya pārśvataḥ | paridevayituṃ dīnaṃ rāmaḥ samupacakrame"
  - id: '4.6.20'
    kind: verse
    lines:
      - "ब्रूहि सुग्रीव कं देशं ह्रियन्ती लक्षिता त्वया"
      - "रक्षसा रौद्ररूपेण मम प्राणसमा प्रिया"
    iast: "brūhi sugrīva kaṃ deśaṃ hriyantī lakṣitā tvayā | rakṣasā raudrarūpeṇa mama prāṇasamā priyā"
  - id: '4.7.1'
    kind: verse
    lines:
      - "एवमुक्तस्तु सुग्रीवो रामेणार्तेन वानरः"
      - "अब्रवीत्प्राञ्जलिर्वाक्यं सबाष्पं बाष्पगद्गदः"
    iast: "evam uktas tu sugrīvo rāmeṇārtena vānaraḥ | abravīt prāñjalir vākyaṃ sabāṣpaṃ bāṣpagadgadaḥ"
  - id: '4.7.2'
    kind: verse
    lines:
      - "न जाने निलयं तस्य सर्वथा पापरक्षसः"
      - "सामर्थ्यं विक्रमं वापि दौष्कुलेयस्य वा कुलम्"
    iast: "na jāne nilayaṃ tasya sarvathā pāparakṣasaḥ | sāmarthyaṃ vikramaṃ vāpi dauṣkuleyasya vā kulam"
  - id: '4.7.3'
    kind: verse
    lines:
      - "सत्यं तु प्रतिजानामि त्यज शोकमरिंदम"
      - "करिष्यामि तथा यत्नं यथा प्राप्स्यसि मैथिलीम्"
    iast: "satyaṃ tu pratijānāmi tyaja śokam ariṃdama | kariṣyāmi tathā yatnaṃ yathā prāpsyasi maithilīm"
  - id: '4.8.18#2'
    kind: verse
    lines:
      - "वालिनो मे भयार्तस्य सर्वलोकाभयंकर"
      - "ममापि त्वमनाथस्य प्रसादं कर्तुमर्हसि"
    iast: "vālino me bhayārtasya sarvalokābhayaṃkara | mamāpi tvam anāthasya prasādaṃ kartum arhasi"
  - id: '4.8.19'
    kind: verse
    lines:
      - "एवमुक्तस्तु तेजस्वी धर्मज्ञो धर्मवत्सलः"
      - "प्रत्युवाच स काकुत्स्थः सुग्रीवं प्रहसन्निव"
    iast: "evam uktas tu tejasvī dharmajño dharmavatsalaḥ | pratyuvāca sa kākutsthaḥ sugrīvaṃ prahasann iva"
  - id: '4.8.20#2'
    kind: verse
    lines:
      - "उपकारफलं मित्रमपकारोऽरिलक्षणम्"
      - "अद्यैव तं हनिष्यामि तव भार्यापहारिणम्"
    iast: "upakāraphalaṃ mitram apakāro 'rilakṣaṇam | adyaiva taṃ haniṣyāmi tava bhāryāpahāriṇam"
  - id: '4.10.29'
    kind: verse
    lines:
      - "आत्मानुमानात्पश्यामि मग्नं त्वां शोकसागरे"
      - "त्वामहं तारयिष्यामि कामं प्राप्स्यसि पुष्कलम्"
    iast: "ātmānumānāt paśyāmi magnaṃ tvāṃ śokasāgare | tvām ahaṃ tārayiṣyāmi kāmaṃ prāpsyasi puṣkalam"
  - id: '4.11.1'
    kind: verse
    lines:
      - "रामस्य वचनं श्रुत्वा हर्षपौरुषवर्धनम्"
      - "सुग्रीवः पूजयां चक्रे राघवं प्रशशंस च"
    iast: "rāmasya vacanaṃ śrutvā harṣapauruṣavardhanam | sugrīvaḥ pūjayāṃ cakre rāghavaṃ praśaśaṃsa ca"
  - id: '4.14.1'
    kind: verse
    lines:
      - "सर्वे ते त्वरितं गत्वा किष्किन्धां वालिपालिताम्"
      - "वृक्षैरात्मानमावृत्य व्यतिष्ठन्गहने वने"
    iast: "sarve te tvaritaṃ gatvā kiṣkindhāṃ vālipālitām | vṛkṣair ātmānam āvṛtya vyatiṣṭhan gahane vane"
  - id: '4.14.10'
    kind: verse
    lines:
      - "मम दर्शय सुग्रीववैरिणं भ्रातृरूपिणम्"
      - "वाली विनिहतो यावद्वने पांसुषु वेष्टते"
    iast: "mama darśaya sugrīvavairiṇaṃ bhrātṛrūpiṇam | vālī vinihato yāvad vane pāṃsuṣu veṣṭate"
  - id: '4.15.2'
    kind: verse
    lines:
      - "श्रुत्वा तु तस्य निनदं सर्वभूतप्रकम्पनम्"
      - "मदश्चैकपदे नष्टः क्रोधश्चापतितो महान्"
    iast: "śrutvā tu tasya ninadaṃ sarvabhūtaprakampanam | madaś caikapade naṣṭaḥ krodhaś cāpatito mahān"
  - id: '4.16.11'
    kind: verse
    lines:
      - "प्रविष्टायां तु तारायां सह स्त्रीभिः स्वमालयम्"
      - "नगरान्निर्ययौ क्रुद्धो महासर्प इव श्वसन्"
    iast: "praviṣṭāyāṃ tu tārāyāṃ saha strībhiḥ svam ālayam | nagarān niryayau kruddho mahāsarpa iva śvasan"
  - id: '4.16.25'
    kind: verse
    lines:
      - "ततो धनुषि संधाय शरमाशीविषोपमम्"
      - "राघवेण महाबाणो वालिवक्षसि पातितः"
    iast: "tato dhanuṣi saṃdhāya śaram āśīviṣopamam | rāghaveṇa mahābāṇo vālivakṣasi pātitaḥ"
  - id: '4.17.9'
    kind: verse
    lines:
      - "तं तथा पतितं संख्ये गतार्चिषमिवानलम्"
      - "ययातिमिव पुण्यान्ते देवलोकात्परिच्युतम्"
    iast: "taṃ tathā patitaṃ saṃkhye gatārciṣam ivānalam | yayātim iva puṇyānte devalokāt paricyutam"
  - id: '4.17.12'
    kind: verse
    lines:
      - "स दृष्ट्वा राघवं वाली लक्ष्मणं च महाबलम्"
      - "अब्रवीत्प्रश्रितं वाक्यं परुषं धर्मसंहितम्"
    iast: "sa dṛṣṭvā rāghavaṃ vālī lakṣmaṇaṃ ca mahābalam | abravīt praśritaṃ vākyaṃ paruṣaṃ dharmasaṃhitam"
  - id: '4.17.14'
    kind: verse
    lines:
      - "कुलीनः सत्त्वसंपन्नस्तेजस्वी चरितव्रतः"
      - "रामः करुणवेदी च प्रजानां च हिते रतः"
    iast: "kulīnaḥ sattvasaṃpannas tejasvī caritavrataḥ | rāmaḥ karuṇavedī ca prajānāṃ ca hite rataḥ"
  - id: '4.17.13'
    kind: verse
    lines:
      - "पराङ्मुखवधं कृत्वा को नु प्राप्तस्त्वया गुणः"
      - "यदहं युद्धसंरब्धस्त्वत्कृते निधनं गतः"
    iast: "parāṅmukhavadhaṃ kṛtvā ko nu prāptas tvayā guṇaḥ | yad ahaṃ yuddhasaṃrabdhas tvatkṛte nidhanaṃ gataḥ"
  - id: '4.17.14#2'
    kind: verse
    lines:
      - "कुलीनः सत्त्वसंपन्नस्तेजस्वी चरितव्रतः"
      - "रामः करुणवेदी च प्रजानां च हिते रतः"
    iast: "kulīnaḥ sattvasaṃpannas tejasvī caritavrataḥ | rāmaḥ karuṇavedī ca prajānāṃ ca hite rataḥ"
  - id: '4.17.15'
    kind: verse
    lines:
      - "सानुक्रोशो महोत्साहः समयज्ञो दृढव्रतः"
      - "इति ते सर्वभूतानि कथयन्ति यशो भुवि"
    iast: "sānukrośo mahotsāhaḥ samayajño dṛḍhavrataḥ | iti te sarvabhūtāni kathayanti yaśo bhuvi"
  - id: '4.17.25'
    kind: verse
    lines:
      - "साम दानं क्षमा धर्मः सत्यं धृतिपराक्रमौ"
      - "पार्थिवानां गुणा राजन्दण्डश्चाप्यपकारिषु"
    iast: "sāma dānaṃ kṣamā dharmaḥ satyaṃ dhṛtiparākramau | pārthivānāṃ guṇā rājan daṇḍaś cāpy apakāriṣu"
  - id: '4.17.43'
    kind: verse
    lines:
      - "युक्तं यत्प्रप्नुयाद्राज्यं सुग्रीवः स्वर्गते मयि"
      - "अयुक्तं यदधर्मेण त्वयाहं निहतो रणे"
    iast: "yuktaṃ yat prapnuyād rājyaṃ sugrīvaḥ svargate mayi | ayuktaṃ yad adharmeṇa tvayāhaṃ nihato raṇe"
  - id: '4.17.44'
    kind: verse
    lines:
      - "काममेवंविधं लोकः कालेन विनियुज्यते"
      - "क्षमं चेद्भवता प्राप्तमुत्तरं साधु चिन्त्यताम्"
    iast: "kāmam evaṃvidhaṃ lokaḥ kālena viniyujyate | kṣamaṃ ced bhavatā prāptam uttaraṃ sādhu cintyatām"
  - id: '4.18.4'
    kind: verse
    lines:
      - "धर्ममर्थं च कामं च समयं चापि लौकिकम्"
      - "अविज्ञाय कथं बाल्यान्मामिहाद्य विगर्हसे"
    iast: "dharmam arthaṃ ca kāmaṃ ca samayaṃ cāpi laukikam | avijñāya kathaṃ bālyān mām ihādya vigarhase"
  - id: '4.18.5'
    kind: verse
    lines:
      - "अपृष्ट्वा बुद्धिसंपन्नान्वृद्धानाचार्यसंमतान्"
      - "सौम्य वानरचापल्यात्त्वं मां वक्तुमिहेच्छसि"
    iast: "apṛṣṭvā buddhisaṃpannān vṛddhān ācāryasaṃmatān | saumya vānaracāpalyāt tvaṃ māṃ vaktum ihecchasi"
  - id: '4.18.6'
    kind: verse
    lines:
      - "इक्ष्वाकूणामियं भूमिः सशैलवनकानना"
      - "मृगपक्षिमनुष्याणां निग्रहानुग्रहावपि"
    iast: "ikṣvākūṇām iyaṃ bhūmiḥ saśailavanakānanā | mṛgapakṣimanuṣyāṇāṃ nigrahānugrahāv api"
  - id: '4.18.7'
    kind: verse
    lines:
      - "तां पालयति धर्मात्मा भरतः सत्यवागृजुः"
      - "धर्मकामार्थतत्त्वज्ञो निग्रहानुग्रहे रतः"
    iast: "tāṃ pālayati dharmātmā bharataḥ satyavāg ṛjuḥ | dharmakāmārthatattvajño nigrahānugrahe rataḥ"
  - id: '4.18.9'
    kind: verse
    lines:
      - "तस्य धर्मकृतादेशा वयमन्ये च पार्थिवः"
      - "चरामो वसुधां कृत्स्नां धर्मसंतानमिच्छवः"
    iast: "tasya dharmakṛtādeśā vayam anye ca pārthivaḥ | carāmo vasudhāṃ kṛtsnāṃ dharmasaṃtānam icchavaḥ"
  - id: '4.18.10'
    kind: verse
    lines:
      - "तस्मिन्नृपतिशार्दूल भरते धर्मवत्सले"
      - "पालयत्यखिलां भूमिं कश्चरेद्धर्मनिग्रहम्"
    iast: "tasmin nṛpatiśārdūla bharate dharmavatsale | pālayaty akhilāṃ bhūmiṃ kaś cared dharmanigraham"
  - id: '4.18.11'
    kind: verse
    lines:
      - "ते वयं मार्गविभ्रष्टं स्वधर्मे परमे स्थिताः"
      - "भरताज्ञां पुरस्कृत्य निगृह्णीमो यथाविधि"
    iast: "te vayaṃ mārgavibhraṣṭaṃ svadharme parame sthitāḥ | bharatājñāṃ puraskṛtya nigṛhṇīmo yathāvidhi"
  - id: '4.18.13'
    kind: verse
    lines:
      - "ज्येष्ठो भ्राता पिता चैव यश्च विद्यां प्रयच्छति"
      - "त्रयस्ते पितरो ज्ञेया धर्मे च पथि वर्तिनः"
    iast: "jyeṣṭho bhrātā pitā caiva yaś ca vidyāṃ prayacchati | trayas te pitaro jñeyā dharme ca pathi vartinaḥ"
  - id: '4.18.14'
    kind: verse
    lines:
      - "यवीयानात्मनः पुत्रः शिष्यश्चापि गुणोदितः"
      - "पुत्रवत्ते त्रयश्चिन्त्या धर्मश्चेदत्र कारणम्"
    iast: "yavīyān ātmanaḥ putraḥ śiṣyaś cāpi guṇoditaḥ | putravat te trayaś cintyā dharmaś ced atra kāraṇam"
  - id: '4.18.17'
    kind: verse
    lines:
      - "अहं तु व्यक्ततामस्य वचनस्य ब्रवीमि ते"
      - "न हि मां केवलं रोषात्त्वं विगर्हितुमर्हसि"
    iast: "ahaṃ tu vyaktatām asya vacanasya bravīmi te | na hi māṃ kevalaṃ roṣāt tvaṃ vigarhitum arhasi"
  - id: '4.18.18'
    kind: verse
    lines:
      - "तदेतत्कारणं पश्य यदर्थं त्वं मया हतः"
      - "भ्रातुर्वर्तसि भार्यायां त्यक्त्वा धर्मं सनातनम्"
    iast: "tad etat kāraṇaṃ paśya yadarthaṃ tvaṃ mayā hataḥ | bhrātur vartasi bhāryāyāṃ tyaktvā dharmaṃ sanātanam"
  - id: '4.18.19'
    kind: verse
    lines:
      - "अस्य त्वं धरमाणस्य सुग्रीवस्य महात्मनः"
      - "रुमायां वर्तसे कामात्स्नुषायां पापकर्मकृत्"
    iast: "asya tvaṃ dharamāṇasya sugrīvasya mahātmanaḥ | rumāyāṃ vartase kāmāt snuṣāyāṃ pāpakarmakṛt"
  - id: '4.18.20'
    kind: verse
    lines:
      - "तद्व्यतीतस्य ते धर्मात्कामवृत्तस्य वानर"
      - "भ्रातृभार्याभिमर्शेऽस्मिन्दण्डोऽयं प्रतिपादितः"
    iast: "tad vyatītasya te dharmāt kāmavṛttasya vānara | bhrātṛbhāryābhimarśe 'smin daṇḍo 'yaṃ pratipāditaḥ"
  - id: '4.18.26'
    kind: verse
    lines:
      - "सुग्रीवेण च मे सख्यं लक्ष्मणेन यथा तथा"
      - "दारराज्यनिमित्तं च निःश्रेयसि रतः स मे"
    iast: "sugrīveṇa ca me sakhyaṃ lakṣmaṇena yathā tathā | dārarājyanimittaṃ ca niḥśreyasi rataḥ sa me"
  - id: '4.18.28'
    kind: verse
    lines:
      - "तदेभिः कारणैः सर्वैर्महद्भिर्धर्मसंहितैः"
      - "शासनं तव यद्युक्तं तद्भवाननुमन्यताम्"
    iast: "tad ebhiḥ kāraṇaiḥ sarvair mahadbhir dharmasaṃhitaiḥ | śāsanaṃ tava yad yuktaṃ tad bhavān anumanyatām"
  - id: '4.18.36'
    kind: verse
    lines:
      - "यान्ति राजर्षयश्चात्र मृगयां धर्मकोविदाः"
      - "तस्मात्त्वं निहतो युद्धे मया बाणेन वानर"
      - "अयुध्यन्प्रतियुध्यन्वा यस्माच्छाखामृगो ह्यसि"
    iast: "yānti rājarṣayaś cātra mṛgayāṃ dharmakovidāḥ | tasmāt tvaṃ nihato yuddhe mayā bāṇena vānara | ayudhyan pratiyudhyan vā yasmāc chākhāmṛgo hy asi"
  - id: '4.18.37'
    kind: verse
    lines:
      - "दुर्लभस्य च धर्मस्य जीवितस्य शुभस्य च"
      - "राजानो वानरश्रेष्ठ प्रदातारो न संशयः"
    iast: "durlabhasya ca dharmasya jīvitasya śubhasya ca | rājāno vānaraśreṣṭha pradātāro na saṃśayaḥ"
  - id: '4.18.38'
    kind: verse
    lines:
      - "तान्न हिंस्यान्न चाक्रोशेन्नाक्षिपेन्नाप्रियं वदेत्"
      - "देवा मानुषरूपेण चरन्त्येते महीतले"
    iast: "tān na hiṃsyān na cākrośen nākṣipen nāpriyaṃ vadet | devā mānuṣarūpeṇa caranty ete mahītale"
  - id: '4.18.39'
    kind: verse
    lines:
      - "त्वं तु धर्ममविज्ञाय केवलं रोषमास्थितः"
      - "प्रदूषयसि मां धर्मे पितृपैतामहे स्थितम्"
    iast: "tvaṃ tu dharmam avijñāya kevalaṃ roṣam āsthitaḥ | pradūṣayasi māṃ dharme pitṛpaitāmahe sthitam"
  - id: '4.18.40'
    kind: verse
    lines:
      - "एवमुक्तस्तु रामेण वाली प्रव्यथितो भृशम्"
      - "प्रत्युवाच ततो रामं प्राञ्जलिर्वानरेश्वरः"
    iast: "evam uktas tu rāmeṇa vālī pravyathito bhṛśam | pratyuvāca tato rāmaṃ prāñjalir vānareśvaraḥ"
  - id: '4.18.41'
    kind: verse
    lines:
      - "यत्त्वमात्थ नरश्रेष्ठ तदेवं नात्र संशयः"
      - "प्रतिवक्तुं प्रकृष्टे हि नापकृष्टस्तु शक्नुयात्"
    iast: "yat tvam āttha naraśreṣṭha tad evaṃ nātra saṃśayaḥ | prativaktuṃ prakṛṣṭe hi nāpakṛṣṭas tu śaknuyāt"
  - id: '4.18.42'
    kind: verse
    lines:
      - "यदयुक्तं मया पूर्वं प्रमादाद्वाक्यमप्रियम्"
      - "तत्रापि खलु मे दोषं कर्तुं नार्हसि राघव"
    iast: "yad ayuktaṃ mayā pūrvaṃ pramādād vākyam apriyam | tatrāpi khalu me doṣaṃ kartuṃ nārhasi rāghava"
  - id: '4.18.43'
    kind: verse
    lines:
      - "त्वं हि दृष्टार्थतत्त्वज्ञः प्रजानां च हिते रतः"
      - "कार्यकारणसिद्धौ ते प्रसन्ना बुद्धिरव्यया"
    iast: "tvaṃ hi dṛṣṭārthatattvajñaḥ prajānāṃ ca hite rataḥ | kāryakāraṇasiddhau te prasannā buddhir avyayā"
  - id: '4.18.48'
    kind: verse
    lines:
      - "सुग्रीवे चाङ्गदे चैव विधत्स्व मतिमुत्तमाम्"
      - "त्वं हि शास्ता च गोप्ता च कार्याकार्यविधौ स्थितः"
    iast: "sugrīve cāṅgade caiva vidhatsva matim uttamām | tvaṃ hi śāstā ca goptā ca kāryākāryavidhau sthitaḥ"
  - id: '4.18.49'
    kind: verse
    lines:
      - "या ते नरपते वृत्तिर्भरते लक्ष्मणे च या"
      - "सुग्रीवे चाङ्गदे राजंस्तां चिन्तयितुमर्हसि"
    iast: "yā te narapate vṛttir bharate lakṣmaṇe ca yā | sugrīve cāṅgade rājaṃs tāṃ cintayitum arhasi"
  - id: '4.18.50'
    kind: verse
    lines:
      - "मद्दोषकृतदोषां तां यथा तारां तपस्विनीम्"
      - "सुग्रीवो नावमन्येत तथावस्थातुमर्हसि"
    iast: "maddoṣakṛtadoṣāṃ tāṃ yathā tārāṃ tapasvinīm | sugrīvo nāvamanyeta tathāvasthātum arhasi"
  - id: '4.22.2'
    kind: verse
    lines:
      - "तं प्राप्तविजयं वाली सुग्रीवं प्लवगेश्वरम्"
      - "आभाष्य व्यक्तया वाचा सस्नेहमिदमब्रवीत्"
    iast: "taṃ prāptavijayaṃ vālī sugrīvaṃ plavageśvaram | ābhāṣya vyaktayā vācā sasneham idam abravīt"
  - id: '4.22.3'
    kind: verse
    lines:
      - "सुग्रीवदोषेण न मां गन्तुमर्हसि किल्बिषात्"
      - "कृष्यमाणं भविष्येण बुद्धिमोहेन मां बलात्"
    iast: "sugrīvadoṣeṇa na māṃ gantum arhasi kilbiṣāt | kṛṣyamāṇaṃ bhaviṣyeṇa buddhimohena māṃ balāt"
  - id: '4.22.4'
    kind: verse
    lines:
      - "युगपद्विहितं तात न मन्ये सुखमावयोः"
      - "सौहार्दं भ्रातृयुक्तं हि तदिदं जातमन्यथा"
    iast: "yugapadvihitaṃ tāta na manye sukham āvayoḥ | sauhārdaṃ bhrātṛyuktaṃ hi tad idaṃ jātam anyathā"
  - id: '4.22.5'
    kind: verse
    lines:
      - "प्रतिपद्य त्वमद्यैव राज्यमेषां वनौकसाम्"
      - "मामप्यद्यैव गच्छन्तं विद्धि वैवस्वतक्षयम्"
    iast: "pratipadya tvam adyaiva rājyam eṣāṃ vanaukasām | mām apy adyaiva gacchantaṃ viddhi vaivasvatakṣayam"
  - id: '4.22.7'
    kind: verse
    lines:
      - "अस्यां त्वहमवस्थायां वीर वक्ष्यामि यद्वचः"
      - "यद्यप्यसुकरं राजन्कर्तुमेव तदर्हसि"
    iast: "asyāṃ tv aham avasthāyāṃ vīra vakṣyāmi yad vacaḥ | yady apy asukaraṃ rājan kartum eva tad arhasi"
  - id: '4.22.24'
    kind: verse
    lines:
      - "इत्युक्त्वाथ विवृत्ताक्षः शरसंपीडितो भृशम्"
      - "विवृतैर्दशनैर्भीमैर्बभूवोत्क्रान्तजीवितः"
    iast: "ity uktvātha vivṛttākṣaḥ śarasaṃpīḍito bhṛśam | vivṛtair daśanair bhīmair babhūvotkrāntajīvitaḥ"
  - id: '4.24.22'
    kind: verse
    lines:
      - "ततो वालिनमुद्यम्य सुग्रीवः शिबिकां तदा"
      - "आरोपयत विक्रोशन्नङ्गदेन सहैव तु"
    iast: "tato vālinam udyamya sugrīvaḥ śibikāṃ tadā | āropayata vikrośann aṅgadena sahaiva tu"
  - id: '4.24.42'
    kind: verse
    lines:
      - "संस्कृत्य वालिनं ते तु विधिपूर्वं प्लवंगमाः"
      - "आजग्मुरुदकं कर्तुं नदीं शीतजलां शुभाम्"
    iast: "saṃskṛtya vālinaṃ te tu vidhipūrvaṃ plavaṃgamāḥ | ājagmur udakaṃ kartuṃ nadīṃ śītajalāṃ śubhām"
  - id: '4.24.43'
    kind: verse
    lines:
      - "ततस्ते सहितास्तत्र अङ्गदं स्थाप्य चाग्रतः"
      - "सुग्रीवतारासहिताः सिषिचुर्वालिने जलम्"
    iast: "tatas te sahitās tatra aṅgadaṃ sthāpya cāgrataḥ | sugrīvatārāsahitāḥ siṣicur vāline jalam"
  - id: '4.25.3'
    kind: verse
    lines:
      - "ततः काञ्चनशैलाभस्तरुणार्कनिभाननः"
      - "अब्रवीत्प्राञ्जलिर्वाक्यं हनुमान्मारुतात्मजः"
    iast: "tataḥ kāñcanaśailābhas taruṇārkanibhānanaḥ | abravīt prāñjalir vākyaṃ hanumān mārutātmajaḥ"
  - id: '4.25.4'
    kind: verse
    lines:
      - "भवत्प्रसादात्सुग्रीवः पितृपैतामहं महत्"
      - "वानराणां सुदुष्प्रापं प्राप्तो राज्यमिदं प्रभो"
    iast: "bhavatprasādāt sugrīvaḥ pitṛpaitāmahaṃ mahat | vānarāṇāṃ suduṣprāpaṃ prāpto rājyam idaṃ prabho"
  - id: '4.25.8'
    kind: verse
    lines:
      - "एवमुक्तो हनुमता राघवः परवीरहा"
      - "प्रत्युवाच हनूमन्तं बुद्धिमान्वाक्यकोविदः"
    iast: "evam ukto hanumatā rāghavaḥ paravīrahā | pratyuvāca hanūmantaṃ buddhimān vākyakovidaḥ"
  - id: '4.25.10'
    kind: verse
    lines:
      - "सुसमृद्धां गुहां दिव्यां सुग्रीवो वानरर्षभः"
      - "प्रविष्टो विधिवद्वीरः क्षिप्रं राज्येऽभिषिच्यताम्"
    iast: "susamṛddhāṃ guhāṃ divyāṃ sugrīvo vānararṣabhaḥ | praviṣṭo vidhivad vīraḥ kṣipraṃ rājye 'bhiṣicyatām"
  - id: '4.25.11'
    kind: verse
    lines:
      - "एवमुक्त्वा हनूमन्तं रामः सुग्रीवमब्रवीत्"
      - "इममप्यङ्गदं वीर यौवराज्येऽभिषेचय"
    iast: "evam uktvā hanūmantaṃ rāmaḥ sugrīvam abravīt | imam apy aṅgadaṃ vīra yauvarājye 'bhiṣecaya"
  - id: '4.25.12'
    kind: verse
    lines:
      - "पूर्वोऽयं वार्षिको मासः श्रावणः सलिलागमः"
      - "प्रवृत्ताः सौम्य चत्वारो मासा वार्षिकसंज्ञिताः"
    iast: "pūrvo 'yaṃ vārṣiko māsaḥ śrāvaṇaḥ salilāgamaḥ | pravṛttāḥ saumya catvāro māsā vārṣikasaṃjñitāḥ"
  - id: '4.25.13'
    kind: verse
    lines:
      - "नायमुद्योगसमयः प्रविश त्वं पुरीं शुभाम्"
      - "अस्मिन्वत्स्याम्यहं सौम्य पर्वते सहलक्ष्मणः"
    iast: "nāyam udyogasamayaḥ praviśa tvaṃ purīṃ śubhām | asmin vatsyāmy ahaṃ saumya parvate sahalakṣmaṇaḥ"
  - id: '4.25.14'
    kind: verse
    lines:
      - "इयं गिरिगुहा रम्या विशाला युक्तमारुता"
      - "प्रभूतसलिला सौम्य प्रभूतकमलोत्पला"
    iast: "iyaṃ giriguhā ramyā viśālā yuktamārutā | prabhūtasalilā saumya prabhūtakamalotpalā"
  - id: '4.25.15'
    kind: verse
    lines:
      - "कार्तिके समनुप्राप्ते त्वं रावणवधे यत"
      - "एष नः समयः सौम्य प्रविश त्वं स्वमालयम्"
      - "अभिषिञ्चस्व राज्ये च सुहृदः संप्रहर्षय"
    iast: "kārtike samanuprāpte tvaṃ rāvaṇavadhe yata | eṣa naḥ samayaḥ saumya praviśa tvaṃ svam ālayam | abhiṣiñcasva rājye ca suhṛdaḥ saṃpraharṣaya"
  - id: '4.26.1'
    kind: verse
    lines:
      - "अभिषिक्ते तु सुग्रीवे प्रविष्टे वानरे गुहाम्"
      - "आजगाम सह भ्रात्रा रामः प्रस्रवणं गिरिम्"
    iast: "abhiṣikte tu sugrīve praviṣṭe vānare guhām | ājagāma saha bhrātrā rāmaḥ prasravaṇaṃ girim"
  - id: '4.29.2'
    kind: verse
    lines:
      - "पाण्डुरं गगनं दृष्ट्वा विमलं चन्द्रमण्डलम्"
      - "शारदीं रजनीं चैव दृष्ट्वा ज्योत्स्नानुलेपनाम्"
    iast: "pāṇḍuraṃ gaganaṃ dṛṣṭvā vimalaṃ candramaṇḍalam | śāradīṃ rajanīṃ caiva dṛṣṭvā jyotsnānulepanām"
  - id: '4.39.3'
    kind: verse
    lines:
      - "त इमे बहुसाहस्रैर्हरिभिर्भीमविक्रमैः"
      - "आगता वानरा घोरा दैत्यदानवसंनिभाः"
    iast: "ta ime bahusāhasrair haribhir bhīmavikramaiḥ | āgatā vānarā ghorā daityadānavasaṃnibhāḥ"
  - id: '4.39.6'
    kind: verse
    lines:
      - "निदेशवर्तिनः सर्वे सर्वे गुरुहिते रताः"
      - "अभिप्रेतमनुष्ठातुं तव शक्ष्यन्त्यरिंदम"
    iast: "nideśavartinaḥ sarve sarve guruhite ratāḥ | abhipretam anuṣṭhātuṃ tava śakṣyanty ariṃdama"
  - id: '4.39.9'
    kind: verse
    lines:
      - "तथा ब्रुवाणं सुग्रीवं रामो दशरथात्मजः"
      - "बाहुभ्यां संपरिष्वज्य इदं वचनमब्रवीत्"
    iast: "tathā bruvāṇaṃ sugrīvaṃ rāmo daśarathātmajaḥ | bāhubhyāṃ saṃpariṣvajya idaṃ vacanam abravīt"
  - id: '4.39.10'
    kind: verse
    lines:
      - "ज्ञायतां सौम्य वैदेही यदि जीवति वा न वा"
      - "स च देशो महाप्राज्ञ यस्मिन्वसति रावणः"
    iast: "jñāyatāṃ saumya vaidehī yadi jīvati vā na vā | sa ca deśo mahāprājña yasmin vasati rāvaṇaḥ"
  - id: '4.39.11'
    kind: verse
    lines:
      - "अधिगम्य च वैदेहीं निलयं रावणस्य च"
      - "प्राप्तकालं विधास्यामि तस्मिन्काले सह त्वया"
    iast: "adhigamya ca vaidehīṃ nilayaṃ rāvaṇasya ca | prāptakālaṃ vidhāsyāmi tasmin kāle saha tvayā"
  - id: '4.39.12'
    kind: verse
    lines:
      - "नाहमस्मिन्प्रभुः कार्ये वानरेश न लक्ष्मणः"
      - "त्वमस्य हेतुः कार्यस्य प्रभुश्च प्लवगेश्वर"
    iast: "nāham asmin prabhuḥ kārye vānareśa na lakṣmaṇaḥ | tvam asya hetuḥ kāryasya prabhuś ca plavageśvara"
  - id: '4.39.13'
    kind: verse
    lines:
      - "त्वमेवाज्ञापय विभो मम कार्यविनिश्चयम्"
      - "त्वं हि जानासि यत्कार्यं मम वीर न संशयः"
    iast: "tvam evājñāpaya vibho mama kāryaviniścayam | tvaṃ hi jānāsi yat kāryaṃ mama vīra na saṃśayaḥ"
  - id: '4.39.15'
    kind: verse
    lines:
      - "एवमुक्तस्तु सुग्रीवो विनतं नाम यूथपम्"
      - "अब्रवीद्राम साम्निध्ये लक्ष्मणस्य च धीमतः"
      - "शैलाभं मेघनिर्घोषमूर्जितं प्लवगेश्वरम्"
    iast: "evam uktas tu sugrīvo vinataṃ nāma yūthapam | abravīd rāma sāmnidhye lakṣmaṇasya ca dhīmataḥ | śailābhaṃ meghanirghoṣam ūrjitaṃ plavageśvaram"
  - id: '4.39.61'
    kind: verse
    lines:
      - "अधिगम्य तु वैदेहीं निलयं रावणस्य च"
      - "मासे पूर्णे निवर्तध्वमुदयं प्राप्य पर्वतम्"
    iast: "adhigamya tu vaidehīṃ nilayaṃ rāvaṇasya ca | māse pūrṇe nivartadhvam udayaṃ prāpya parvatam"
  - id: '4.42.5'
    kind: verse
    lines:
      - "अस्मिन्कार्ये विनिवृत्ते कृते दाशरथेः प्रिये"
      - "ऋणान्मुक्ता भविष्यामः कृतार्थार्थविदां वराः"
    iast: "asmin kārye vinivṛtte kṛte dāśaratheḥ priye | ṛṇān muktā bhaviṣyāmaḥ kṛtārthārthavidāṃ varāḥ"
  - id: '4.43.6'
    kind: verse
    lines:
      - "त्वय्येव हनुमन्नस्ति बलं बुद्धिः पराक्रमः"
      - "देशकालानुवृत्तश्च नयश्च नयपण्डित"
    iast: "tvayy eva hanumann asti balaṃ buddhiḥ parākramaḥ | deśakālānuvṛttaś ca nayaś ca nayapaṇḍita"
  - id: '4.43.7'
    kind: verse
    lines:
      - "ततः कार्यसमासंगमवगम्य हनूमति"
      - "विदित्वा हनुमन्तं च चिन्तयामास राघवः"
    iast: "tataḥ kāryasamāsaṃgam avagamya hanūmati | viditvā hanumantaṃ ca cintayām āsa rāghavaḥ"
  - id: '4.43.11'
    kind: verse
    lines:
      - "ददौ तस्य ततः प्रीतः स्वनामाङ्कोपशोभितम्"
      - "अङ्गुलीयमभिज्ञानं राजपुत्र्याः परंतपः"
    iast: "dadau tasya tataḥ prītaḥ svanāmāṅkopaśobhitam | aṅgulīyam abhijñānaṃ rājaputryāḥ paraṃtapaḥ"
  - id: '4.43.14'
    kind: verse
    lines:
      - "स तद्गृह्य हरिश्रेष्ठः स्थाप्य मूर्ध्नि कृताञ्जलिः"
      - "वन्दित्वा चरणौ चैव प्रस्थितः प्लवगोत्तमः"
    iast: "sa tad gṛhya hariśreṣṭhaḥ sthāpya mūrdhni kṛtāñjaliḥ | vanditvā caraṇau caiva prasthitaḥ plavagottamaḥ"
  - id: '4.46.1'
    kind: verse
    lines:
      - "दर्शनार्थं तु वैदेह्याः सर्वतः कपियूथपाः"
      - "व्यादिष्टाः कपिराजेन यथोक्तं जग्मुरञ्जसा"
    iast: "darśanārthaṃ tu vaidehyāḥ sarvataḥ kapiyūthapāḥ | vyādiṣṭāḥ kapirājena yathoktaṃ jagmur añjasā"
  - id: '4.48.22'
    kind: verse
    lines:
      - "हनुमत्प्रमुखास्ते तु प्रस्थिताः प्लवगर्षभाः"
      - "विन्ध्यमेवादितस्तावद्विचेरुस्ते समन्ततः"
    iast: "hanumatpramukhās te tu prasthitāḥ plavagarṣabhāḥ | vindhyam evāditas tāvad vicerus te samantataḥ"
  - id: '4.49.3'
    kind: verse
    lines:
      - "तेषां तत्रैव वसतां स कालो व्यत्यवर्तत"
    iast: "teṣāṃ tatraiva vasatāṃ sa kālo vyatyavartata"
  - id: '4.52.16'
    kind: verse
    lines:
      - "विन्ध्यस्य तु गिरेः पादे संप्रपुष्पितपादपे"
      - "उपविश्य महाभागाश्चिन्तामापेदिरे तदा"
    iast: "vindhyasya tu gireḥ pāde saṃprapuṣpitapādape | upaviśya mahābhāgāś cintām āpedire tadā"
  - id: '4.57.1'
    kind: verse
    lines:
      - "इत्युक्तः करुणं वाक्यं वानरैस्त्यक्तजीवितैः"
      - "सबाष्पो वानरान्गृध्रः प्रत्युवाच महास्वनः"
    iast: "ity uktaḥ karuṇaṃ vākyaṃ vānarais tyaktajīvitaiḥ | sabāṣpo vānarān gṛdhraḥ pratyuvāca mahāsvanaḥ"
  - id: '4.57.15'
    kind: verse
    lines:
      - "तरुणी रूपसंपन्ना सर्वाभरणभूषिता"
      - "ह्रियमाणा मया दृष्टा रावणेन दुरात्मना"
    iast: "taruṇī rūpasaṃpannā sarvābharaṇabhūṣitā | hriyamāṇā mayā dṛṣṭā rāvaṇena durātmanā"
  - id: '4.57.16'
    kind: verse
    lines:
      - "क्रोशन्ती राम रामेति लक्ष्मणेति च भामिनी"
      - "भूषणान्यपविध्यन्ती गात्राणि च विधुन्वती"
    iast: "krośantī rāma rāmeti lakṣmaṇeti ca bhāminī | bhūṣaṇāny apavidhyantī gātrāṇi ca vidhunvatī"
  - id: '4.57.18'
    kind: verse
    lines:
      - "तां तु सीतामहं मन्ये रामस्य परिकीर्तनात्"
      - "श्रूयतां मे कथयतो निलयं तस्य रक्षसः"
    iast: "tāṃ tu sītām ahaṃ manye rāmasya parikīrtanāt | śrūyatāṃ me kathayato nilayaṃ tasya rakṣasaḥ"
  - id: '4.57.19'
    kind: verse
    lines:
      - "पुत्रो विश्रवसः साक्षाद्भ्राता वैश्रवणस्य च"
      - "अध्यास्ते नगरीं लङ्कां रावणो नाम राकसः"
    iast: "putro viśravasaḥ sākṣād bhrātā vaiśravaṇasya ca | adhyāste nagarīṃ laṅkāṃ rāvaṇo nāma rākasaḥ"
  - id: '4.57.20'
    kind: verse
    lines:
      - "इतो द्वीपे समुद्रस्य संपूर्णे शतयोजने"
      - "तस्मिंल्लङ्का पुरी रम्या निर्मिता विश्वकर्मणा"
    iast: "ito dvīpe samudrasya saṃpūrṇe śatayojane | tasmiṃl laṅkā purī ramyā nirmitā viśvakarmaṇā"
  - id: '4.57.21'
    kind: verse
    lines:
      - "तस्यां वसति वैदेही दीना कौशेयवासिनी"
      - "रावणान्तःपुरे रुद्धा राक्षसीभिः सुरक्षिता"
    iast: "tasyāṃ vasati vaidehī dīnā kauśeyavāsinī | rāvaṇāntaḥpure ruddhā rākṣasībhiḥ surakṣitā"
  - id: '4.57.24'
    kind: verse
    lines:
      - "तत्रैव त्वरिताः क्षिप्रं विक्रमध्वं प्लवंगमाः"
      - "ज्ञानेन खलु पश्यामि दृष्ट्वा प्रत्यागमिष्यथ"
    iast: "tatraiva tvaritāḥ kṣipraṃ vikramadhvaṃ plavaṃgamāḥ | jñānena khalu paśyāmi dṛṣṭvā pratyāgamiṣyatha"
  - id: '4.65.1'
    kind: verse
    lines:
      - "अनेकशतसाहस्रीं विषण्णां हरिवाहिनीम्"
      - "जाम्बवान्समुदीक्ष्यैवं हनुमन्तमथाब्रवीत्"
    iast: "anekaśatasāhasrīṃ viṣaṇṇāṃ harivāhinīm | jāmbavān samudīkṣyaivaṃ hanumantam athābravīt"
  - id: '4.65.2'
    kind: verse
    lines:
      - "वीर वानरलोकस्य सर्वशास्त्रविदां वर"
      - "तूष्णीमेकान्तमाश्रित्य हनुमन्किं न जल्पसि"
    iast: "vīra vānaralokasya sarvaśāstravidāṃ vara | tūṣṇīm ekāntam āśritya hanuman kiṃ na jalpasi"
  - id: '4.65.27'
    kind: verse
    lines:
      - "स्वच्छन्दतश्च मरणं ते भूयादिति वै प्रभो"
      - "स त्वं केसरिणः पुत्रः क्षेत्रजो भीमविक्रमः"
    iast: "svacchandataś ca maraṇaṃ te bhūyād iti vai prabho | sa tvaṃ kesariṇaḥ putraḥ kṣetrajo bhīmavikramaḥ"
  - id: '4.65.28'
    kind: verse
    lines:
      - "मारुतस्यौरसः पुत्रस्तेजसा चापि तत्समः"
      - "त्वं हि वायुसुतो वत्स प्लवने चापि तत्समः"
    iast: "mārutasyaurasaḥ putras tejasā cāpi tatsamaḥ | tvaṃ hi vāyusuto vatsa plavane cāpi tatsamaḥ"
  - id: '4.65.34'
    kind: verse
    lines:
      - "उत्तिष्ठ हरिशार्दूल लङ्घयस्व महार्णवम्"
      - "परा हि सर्वभूतानां हनुमन्या गतिस्तव"
    iast: "uttiṣṭha hariśārdūla laṅghayasva mahārṇavam | parā hi sarvabhūtānāṃ hanuman yā gatis tava"
  - id: '4.65.35'
    kind: verse
    lines:
      - "विषाण्णा हरयः सर्वे हनुमन्किमुपेक्षसे"
      - "विक्रमस्व महावेगो विष्णुस्त्रीन्विक्रमानिव"
    iast: "viṣāṇṇā harayaḥ sarve hanuman kim upekṣase | vikramasva mahāvego viṣṇus trīn vikramān iva"
  - id: '4.66.1'
    kind: verse
    lines:
      - "संस्तूयमानो हनुमान्व्यवर्धत महाबलः"
      - "समाविध्य च लाङ्गूलं हर्षाच्च बलमेयिवान्"
    iast: "saṃstūyamāno hanumān vyavardhata mahābalaḥ | samāvidhya ca lāṅgūlaṃ harṣāc ca balam eyivān"
  - id: '4.66.38'
    kind: verse
    lines:
      - "पादाभ्यां पीडितस्तेन महाशैलो महात्मना"
      - "ररास सिंहाभिहतो महान्मत्त इव द्विपः"
    iast: "pādābhyāṃ pīḍitas tena mahāśailo mahātmanā | rarāsa siṃhābhihato mahān matta iva dvipaḥ"
  - id: '4.66.43'
    kind: verse
    lines:
      - "ऋषिभिस्त्रास संभ्रान्तैस्त्यज्यमानः शिलोच्चयः"
      - "सीदन्महति कान्तारे सार्थहीन इवाध्वगः"
    iast: "ṛṣibhis trāsa saṃbhrāntais tyajyamānaḥ śiloccayaḥ | sīdan mahati kāntāre sārthahīna ivādhvagaḥ"
  - id: '5.1.7'
    kind: verse
    lines:
      - "स सूर्याय महेन्द्राय पवनाय स्वयम्भुवे"
      - "भूतेभ्यश्चाञ्जलिं कृत्वा चकार गमने मतिम्"
    iast: "sa sūryāya mahendrāya pavanāya svayambhuve | bhūtebhyaś cāñjaliṃ kṛtvā cakāra gamane matim"
  - id: '5.1.40'
    kind: verse
    lines:
      - "एवमुक्त्वा तु हनुमान्वानरान्वानरोत्तमः"
      - "उत्पपाताथ वेगेन वेगवानविचारयन्"
    iast: "evam uktvā tu hanumān vānarān vānarottamaḥ | utpapātātha vegena vegavān avicārayan"
  - id: '5.2.1'
    kind: verse
    lines:
      - "स सागरमनाधृष्यमतिक्रम्य महाबलः"
      - "त्रिकूटशिखरे लङ्कां स्थितां स्वस्थो ददर्श ह"
    iast: "sa sāgaram anādhṛṣyam atikramya mahābalaḥ | trikūṭaśikhare laṅkāṃ sthitāṃ svastho dadarśa ha"
  - id: '5.2.18'
    kind: verse
    lines:
      - "गिरिमूर्ध्नि स्थितां लङ्कां पाण्डुरैर्भवनैः शुभैः"
      - "ददर्श स कपिः श्रीमान्पुरमाकाशगं यथा"
    iast: "girimūrdhni sthitāṃ laṅkāṃ pāṇḍurair bhavanaiḥ śubhaiḥ | dadarśa sa kapiḥ śrīmān puram ākāśagaṃ yathā"
  - id: '5.2.19'
    kind: verse
    lines:
      - "पालितां राक्षसेन्द्रेण निर्मितां विश्वकर्मणा"
      - "प्लवमानामिवाकाशे ददर्श हनुमान्पुरीम्"
    iast: "pālitāṃ rākṣasendreṇa nirmitāṃ viśvakarmaṇā | plavamānām ivākāśe dadarśa hanumān purīm"
  - id: '5.3.1'
    kind: verse
    lines:
      - "स लम्बशिखरे लम्बे लम्बतोयदसंनिभे"
      - "सत्त्वमास्थाय मेधावी हनुमान्मारुतात्मजः"
    iast: "sa lambaśikhare lambe lambatoyadasaṃnibhe | sattvam āsthāya medhāvī hanumān mārutātmajaḥ"
  - id: '5.3.2'
    kind: verse
    lines:
      - "निशि लङ्कां महासत्त्वो विवेश कपिकुञ्जरः"
      - "रम्यकाननतोयाढ्यां पुरीं रावणपालिताम्"
    iast: "niśi laṅkāṃ mahāsattvo viveśa kapikuñjaraḥ | ramyakānanatoyāḍhyāṃ purīṃ rāvaṇapālitām"
  - id: '5.3.26'
    kind: verse
    lines:
      - "स्वाध्याय निरतांश्चैव यातुधानान्ददर्श सः"
      - "रावणस्तवसंयुक्तान्गर्जतो राक्षसानपि"
    iast: "svādhyāya niratāṃś caiva yātudhānān dadarśa saḥ | rāvaṇastavasaṃyuktān garjato rākṣasān api"
  - id: '5.3.37'
    kind: verse
    lines:
      - "भूषितं रुचिरद्वारं मत्तैश्च मृगपक्षिभिः"
      - "राक्षसाधिपतेर्गुप्तमाविवेश गृहं कपिः"
    iast: "bhūṣitaṃ ruciradvāraṃ mattaiś ca mṛgapakṣibhiḥ | rākṣasādhipater guptam āviveśa gṛhaṃ kapiḥ"
  - id: '5.9.44'
    kind: verse
    lines:
      - "तामपश्यन्कपिस्तत्र पश्यंश्चान्या वरस्त्रियः"
      - "अपक्रम्य तदा वीरः प्रध्यातुमुपचक्रमे"
    iast: "tām apaśyan kapis tatra paśyaṃś cānyā varastriyaḥ | apakramya tadā vīraḥ pradhyātum upacakrame"
  - id: '5.10.6'
    kind: verse
    lines:
      - "दृष्टमन्तःपुरं सर्वं दृष्ट्वा रावणयोषितः"
      - "न सीता दृश्यते साध्वी वृथा जातो मम श्रमः"
    iast: "dṛṣṭam antaḥpuraṃ sarvaṃ dṛṣṭvā rāvaṇayoṣitaḥ | na sītā dṛśyate sādhvī vṛthā jāto mama śramaḥ"
  - id: '5.10.8'
    kind: verse
    lines:
      - "अदृष्ट्वा किं प्रवक्ष्यामि तामहं जनकात्मजाम्"
      - "ध्रुवं प्रायमुपेष्यन्ति कालस्य व्यतिवर्तने"
    iast: "adṛṣṭvā kiṃ pravakṣyāmi tām ahaṃ janakātmajām | dhruvaṃ prāyam upeṣyanti kālasya vyativartane"
  - id: '5.10.10'
    kind: verse
    lines:
      - "अनिर्वेदः श्रियो मूलमनिर्वेदः परं सुखम्"
      - "भूयस्तावद्विचेष्यामि न यत्र विचयः कृतः"
    iast: "anirvedaḥ śriyo mūlam anirvedaḥ paraṃ sukham | bhūyas tāvad viceṣyāmi na yatra vicayaḥ kṛtaḥ"
  - id: '5.10.14'
    kind: verse
    lines:
      - "निष्कुटान्तररथ्याश्च विमानानि च सर्वशः"
      - "इति संचिन्त्य भूयोऽपि विचेतुमुपचक्रमे"
    iast: "niṣkuṭāntararathyāś ca vimānāni ca sarvaśaḥ | iti saṃcintya bhūyo 'pi vicetum upacakrame"
  - id: '5.10.15'
    kind: verse
    lines:
      - "भूमीगृहांश्चैत्यगृहान्गृहातिगृहकानपि"
      - "उत्पतन्निपतंश्चापि तिष्ठन्गच्छन्पुनः क्व चित्"
    iast: "bhūmīgṛhāṃś caityagṛhān gṛhātigṛhakān api | utpatan nipataṃś cāpi tiṣṭhan gacchan punaḥ kva cit"
  - id: '5.10.16'
    kind: verse
    lines:
      - "अपावृण्वंश्च द्वाराणि कपाटान्यवघट्टयन्"
      - "प्रविशन्निष्पतंश्चापि प्रपतन्नुत्पतन्नपि"
      - "सर्वमप्यवकाशं स विचचार महाकपिः"
    iast: "apāvṛṇvaṃś ca dvārāṇi kapāṭāny avaghaṭṭayan | praviśan niṣpataṃś cāpi prapatann utpatann api | sarvam apy avakāśaṃ sa vicacāra mahākapiḥ"
  - id: '5.10.17'
    kind: verse
    lines:
      - "चतुरङ्गुलमात्रोऽपि नावकाशः स विद्यते"
      - "रावणान्तःपुरे तस्मिन्यं कपिर्न जगाम सः"
    iast: "caturaṅgulamātro 'pi nāvakāśaḥ sa vidyate | rāvaṇāntaḥpure tasmin yaṃ kapir na jagāma saḥ"
  - id: '5.11.5'
    kind: verse
    lines:
      - "इह संपातिना सीता रावणस्य निवेशने"
      - "आख्याता गृध्रराजेन न च पश्यामि तामहम्"
    iast: "iha saṃpātinā sītā rāvaṇasya niveśane | ākhyātā gṛdhrarājena na ca paśyāmi tām aham"
  - id: '5.13.15'
    kind: verse
    lines:
      - "अशोकवनिकायां तु तस्यां वानरपुंगवः"
      - "स ददर्शाविदूरस्थं चैत्यप्रासादमूर्जितम्"
    iast: "aśokavanikāyāṃ tu tasyāṃ vānarapuṃgavaḥ | sa dadarśāvidūrasthaṃ caityaprāsādam ūrjitam"
  - id: '5.13.18'
    kind: verse
    lines:
      - "ततो मलिनसंवीतां राक्षसीभिः समावृताम्"
      - "उपवासकृशां दीनां निःश्वसान्तीं पुनः पुनः"
      - "ददर्श शुक्लपक्षादौ चन्द्ररेखामिवामलाम्"
    iast: "tato malinasaṃvītāṃ rākṣasībhiḥ samāvṛtām | upavāsakṛśāṃ dīnāṃ niḥśvasāntīṃ punaḥ punaḥ | dadarśa śuklapakṣādau candrarekhām ivāmalām"
  - id: '5.13.19'
    kind: verse
    lines:
      - "मन्दप्रख्यायमानेन रूपेण रुचिरप्रभाम्"
      - "पिनद्धां धूमजालेन शिखामिव विभावसोः"
    iast: "mandaprakhyāyamānena rūpeṇa ruciraprabhām | pinaddhāṃ dhūmajālena śikhām iva vibhāvasoḥ"
  - id: '5.13.20'
    kind: verse
    lines:
      - "पीतेनैकेन संवीतां क्लिष्टेनोत्तमवाससा"
      - "सपङ्कामनलंकारां विपद्मामिव पद्मिनीम्"
    iast: "pītenaikena saṃvītāṃ kliṣṭenottamavāsasā | sapaṅkām analaṃkārāṃ vipadmām iva padminīm"
  - id: '5.13.21'
    kind: verse
    lines:
      - "व्रीडितां दुःखसंतप्तां परिम्लानां तपस्विनीम्"
      - "ग्रहेणाङ्गारकेणैव पीडितामिव रोहिणीम्"
    iast: "vrīḍitāṃ duḥkhasaṃtaptāṃ parimlānāṃ tapasvinīm | graheṇāṅgārakeṇaiva pīḍitām iva rohiṇīm"
  - id: '5.13.22'
    kind: verse
    lines:
      - "अश्रुपूर्णमुखीं दीनां कृशामननशेन च"
      - "शोकध्यानपरां दीनां नित्यं दुःखपरायणाम्"
    iast: "aśrupūrṇamukhīṃ dīnāṃ kṛśām ananaśena ca | śokadhyānaparāṃ dīnāṃ nityaṃ duḥkhaparāyaṇām"
  - id: '5.13.36'
    kind: verse
    lines:
      - "तस्य संदिदिहे बुद्धिर्मुहुः सीतां निरीक्ष्य तु"
      - "आम्नायानामयोगेन विद्यां प्रशिथिलामिव"
    iast: "tasya saṃdidihe buddhir muhuḥ sītāṃ nirīkṣya tu | āmnāyānām ayogena vidyāṃ praśithilām iva"
  - id: '5.13.37'
    kind: verse
    lines:
      - "दुःखेन बुबुधे सीतां हनुमाननलंकृताम्"
      - "संस्कारेण यथाहीनां वाचमर्थान्तरं गताम्"
    iast: "duḥkhena bubudhe sītāṃ hanumān analaṃkṛtām | saṃskāreṇa yathāhīnāṃ vācam arthāntaraṃ gatām"
  - id: '5.13.38'
    kind: verse
    lines:
      - "तां समीक्ष्य विशालाक्षीं राजपुत्रीमनिन्दिताम्"
      - "तर्कयामास सीतेति कारणैरुपपादयन्"
    iast: "tāṃ samīkṣya viśālākṣīṃ rājaputrīm aninditām | tarkayām āsa sīteti kāraṇair upapādayan"
  - id: '5.13.39'
    kind: verse
    lines:
      - "वैदेह्या यानि चाङ्गेषु तदा रामोऽन्वकीर्तयत्"
      - "तान्याभरणजालानि गात्रशोभीन्यलक्षयत्"
    iast: "vaidehyā yāni cāṅgeṣu tadā rāmo 'nvakīrtayat | tāny ābharaṇajālāni gātraśobhīny alakṣayat"
  - id: '5.13.42'
    kind: verse
    lines:
      - "तत्र यान्यवहीनानि तान्यहं नोपलक्षये"
      - "यान्यस्या नावहीनानि तानीमानि न संशयः"
    iast: "tatra yāny avahīnāni tāny ahaṃ nopalakṣaye | yāny asyā nāvahīnāni tānīmāni na saṃśayaḥ"
  - id: '5.13.44'
    kind: verse
    lines:
      - "भूषणानि च मुख्यानि दृष्टानि धरणीतले"
      - "अनयैवापविद्धानि स्वनवन्ति महान्ति च"
    iast: "bhūṣaṇāni ca mukhyāni dṛṣṭāni dharaṇītale | anayaivāpaviddhāni svanavanti mahānti ca"
  - id: '5.13.45'
    kind: verse
    lines:
      - "इदं चिरगृहीतत्वाद्वसनं क्लिष्टवत्तरम्"
      - "तथा हि नूनं तद्वर्णं तथा श्रीमद्यथेतरत्"
    iast: "idaṃ ciragṛhītatvād vasanaṃ kliṣṭavattaram | tathā hi nūnaṃ tad varṇaṃ tathā śrīmad yathetarat"
  - id: '5.13.46'
    kind: verse
    lines:
      - "इयं कनकवर्णाङ्गी रामस्य महिषी प्रिया"
      - "प्रनष्टापि सती यस्य मनसो न प्रणश्यति"
    iast: "iyaṃ kanakavarṇāṅgī rāmasya mahiṣī priyā | pranaṣṭāpi satī yasya manaso na praṇaśyati"
  - id: '5.13.50'
    kind: verse
    lines:
      - "अस्या देव्या मनस्तस्मिंस्तस्य चास्यां प्रतिष्ठितम्"
      - "तेनेयं स च धर्मात्मा मुहूर्तमपि जीवति"
    iast: "asyā devyā manas tasmiṃs tasya cāsyāṃ pratiṣṭhitam | teneyaṃ sa ca dharmātmā muhūrtam api jīvati"
  - id: '5.14.27'
    kind: verse
    lines:
      - "दुष्करं कुरुते रामो हीनो यदनया प्रभुः"
      - "धारयत्यात्मनो देहं न दुःखेनावसीदति"
    iast: "duṣkaraṃ kurute rāmo hīno yad anayā prabhuḥ | dhārayaty ātmano dehaṃ na duḥkhenāvasīdati"
  - id: '5.13.52'
    kind: verse
    lines:
      - "एवं सीतां तदा दृष्ट्वा हृष्टः पवनसंभवः"
      - "जगाम मनसा रामं प्रशशंस च तं प्रभुम्"
    iast: "evaṃ sītāṃ tadā dṛṣṭvā hṛṣṭaḥ pavanasaṃbhavaḥ | jagāma manasā rāmaṃ praśaśaṃsa ca taṃ prabhum"
  - id: '5.14.2'
    kind: verse
    lines:
      - "स मुहूर्तमिव ध्यात्वा बाष्पपर्याकुलेक्षणः"
      - "सीतामाश्रित्य तेजस्वी हनुमान्विललाप ह"
    iast: "sa muhūrtam iva dhyātvā bāṣpaparyākulekṣaṇaḥ | sītām āśritya tejasvī hanumān vilalāpa ha"
  - id: '5.14.3'
    kind: verse
    lines:
      - "मान्या गुरुविनीतस्य लक्ष्मणस्य गुरुप्रिया"
      - "यदि सीतापि दुःखार्ता कालो हि दुरतिक्रमः"
    iast: "mānyā guruvinītasya lakṣmaṇasya gurupriyā | yadi sītāpi duḥkhārtā kālo hi duratikramaḥ"
  - id: '5.14.5'
    kind: verse
    lines:
      - "तुल्यशीलवयोवृत्तां तुल्याभिजनलक्षणाम्"
      - "राघवोऽर्हति वैदेहीं तं चेयमसितेक्षणा"
    iast: "tulyaśīlavayovṛttāṃ tulyābhijanalakṣaṇām | rāghavo 'rhati vaidehīṃ taṃ ceyam asitekṣaṇā"
  - id: '5.14.9'
    kind: verse
    lines:
      - "चतुर्दशसहस्राणि रक्षसां भीमकर्मणाम्"
      - "निहतानि जनस्थाने शरैरग्निशिखोपमैः"
    iast: "caturdaśasahasrāṇi rakṣasāṃ bhīmakarmaṇām | nihatāni janasthāne śarair agniśikhopamaiḥ"
  - id: '5.14.12'
    kind: verse
    lines:
      - "सागरश्च मया क्रान्तः श्रीमान्नदनदीपतिः"
      - "अस्या हेतोर्विशालाक्ष्याः पुरी चेयं निरीक्षिता"
    iast: "sāgaraś ca mayā krāntaḥ śrīmān nadanadīpatiḥ | asyā hetor viśālākṣyāḥ purī ceyaṃ nirīkṣitā"
  - id: '5.14.13'
    kind: verse
    lines:
      - "यदि रामः समुद्रान्तां मेदिनीं परिवर्तयेत्"
      - "अस्याः कृते जगच्चापि युक्तमित्येव मे मतिः"
    iast: "yadi rāmaḥ samudrāntāṃ medinīṃ parivartayet | asyāḥ kṛte jagac cāpi yuktam ity eva me matiḥ"
  - id: '5.14.14'
    kind: verse
    lines:
      - "राज्यं वा त्रिषु लोकेषु सीता वा जनकात्मजा"
      - "त्रैलोक्यराज्यं सकलं सीताया नाप्नुयात्कलाम्"
    iast: "rājyaṃ vā triṣu lokeṣu sītā vā janakātmajā | trailokyarājyaṃ sakalaṃ sītāyā nāpnuyāt kalām"
  - id: '5.14.19'
    kind: verse
    lines:
      - "सर्वान्भोगान्परित्यज्य भर्तृस्नेहबलात्कृता"
      - "अचिन्तयित्वा दुःखानि प्रविष्टा निर्जनं वनम्"
    iast: "sarvān bhogān parityajya bhartṛsnehabalāt kṛtā | acintayitvā duḥkhāni praviṣṭā nirjanaṃ vanam"
  - id: '5.14.22'
    kind: verse
    lines:
      - "इमां तु शीलसंपन्नां द्रष्टुमिच्छति राघवः"
      - "रावणेन प्रमथितां प्रपामिव पिपासितः"
    iast: "imāṃ tu śīlasaṃpannāṃ draṣṭum icchati rāghavaḥ | rāvaṇena pramathitāṃ prapām iva pipāsitaḥ"
  - id: '5.14.23'
    kind: verse
    lines:
      - "अस्या नूनं पुनर्लाभाद्राघवः प्रीतिमेष्यति"
      - "राजा राज्यपरिभ्रष्टः पुनः प्राप्येव मेदिनीम्"
    iast: "asyā nūnaṃ punar lābhād rāghavaḥ prītim eṣyati | rājā rājyaparibhraṣṭaḥ punaḥ prāpyeva medinīm"
  - id: '5.14.24'
    kind: verse
    lines:
      - "कामभोगैः परित्यक्ता हीना बन्धुजनेन च"
      - "धारयत्यात्मनो देहं तत्समागमकाङ्क्षिणी"
    iast: "kāmabhogaiḥ parityaktā hīnā bandhujanena ca | dhārayaty ātmano dehaṃ tatsamāgamakāṅkṣiṇī"
  - id: '5.14.25'
    kind: verse
    lines:
      - "नैषा पश्यति राक्षस्यो नेमान्पुष्पफलद्रुमान्"
      - "एकस्थहृदया नूनं राममेवानुपश्यति"
    iast: "naiṣā paśyati rākṣasyo nemān puṣpaphaladrumān | ekasthahṛdayā nūnaṃ rāmam evānupaśyati"
  - id: '5.14.26'
    kind: verse
    lines:
      - "भर्ता नाम परं नार्या भूषणं भूषणादपि"
      - "एषा हि रहिता तेन शोभनार्हा न शोभते"
    iast: "bhartā nāma paraṃ nāryā bhūṣaṇaṃ bhūṣaṇād api | eṣā hi rahitā tena śobhanārhā na śobhate"
  - id: '5.16.1'
    kind: verse
    lines:
      - "तथा विप्रेक्षमाणस्य वनं पुष्पितपादपम्"
      - "विचिन्वतश्च वैदेहीं किं चिच्छेषा निशाभवत्"
    iast: "tathā viprekṣamāṇasya vanaṃ puṣpitapādapam | vicinvataś ca vaidehīṃ kiṃ cic cheṣā niśābhavat"
  - id: '5.16.2'
    kind: verse
    lines:
      - "षडङ्गवेदविदुषां क्रतुप्रवरयाजिनाम्"
      - "शुश्राव ब्रह्मघोषांश्च विरात्रे ब्रह्मरक्षसाम्"
    iast: "ṣaḍaṅgavedaviduṣāṃ kratupravarayājinām | śuśrāva brahmaghoṣāṃś ca virātre brahmarakṣasām"
  - id: '5.16.3'
    kind: verse
    lines:
      - "अथ मङ्गलवादित्रैः शब्दैः श्रोत्रमनोहरैः"
      - "प्राबोध्यत महाबाहुर्दशग्रीवो महाबलः"
    iast: "atha maṅgalavāditraiḥ śabdaiḥ śrotramanoharaiḥ | prābodhyata mahābāhur daśagrīvo mahābalaḥ"
  - id: '5.16.9'
    kind: verse
    lines:
      - "नानामृगगणाकीर्णां फलैः प्रपतितैर्वृताम्"
      - "अशोकवनिकामेव प्राविशत्संततद्रुमाम्"
    iast: "nānāmṛgagaṇākīrṇāṃ phalaiḥ prapatitair vṛtām | aśokavanikām eva prāviśat saṃtatadrumām"
  - id: '5.16.25'
    kind: verse
    lines:
      - "वृतः परमनारीभिस्ताराभिरिव चन्द्रमाः"
      - "तं ददर्श महातेजास्तेजोवन्तं महाकपिः"
    iast: "vṛtaḥ paramanārībhis tārābhir iva candramāḥ | taṃ dadarśa mahātejās tejovantaṃ mahākapiḥ"
  - id: '5.16.26'
    kind: verse
    lines:
      - "रावणोऽयं महाबाहुरिति संचिन्त्य वानरः"
      - "अवप्लुतो महातेजा हनूमान्मारुतात्मजः"
    iast: "rāvaṇo 'yaṃ mahābāhur iti saṃcintya vānaraḥ | avapluto mahātejā hanūmān mārutātmajaḥ"
  - id: '5.16.27'
    kind: verse
    lines:
      - "स तथाप्युग्रतेजाः सन्निर्धूतस्तस्य तेजसा"
      - "पत्रगुह्यान्तरे सक्तो हनूमान्संवृतोऽभवत्"
    iast: "sa tathāpy ugratejāḥ san nirdhūtas tasya tejasā | patraguhyāntare sakto hanūmān saṃvṛto 'bhavat"
  - id: '5.16.28'
    kind: verse
    lines:
      - "स तामसितकेशान्तां सुश्रोणीं संहतस्तनीम्"
      - "दिदृक्षुरसितापाङ्गीमुपावर्तत रावणः"
    iast: "sa tām asitakeśāntāṃ suśroṇīṃ saṃhatastanīm | didṛkṣur asitāpāṅgīm upāvartata rāvaṇaḥ"
  - id: '5.18.1'
    kind: verse
    lines:
      - "स तां परिवृतां दीनां निरानन्दां तपस्विनीम्"
      - "साकारैर्मधुरैर्वाक्यैर्न्यदर्शयत रावणः"
    iast: "sa tāṃ parivṛtāṃ dīnāṃ nirānandāṃ tapasvinīm | sākārair madhurair vākyair nyadarśayata rāvaṇaḥ"
  - id: '5.18.16'
    kind: verse
    lines:
      - "भव मैथिलि भार्या मे मोहमेनं विसर्जय"
      - "बह्वीनामुत्तमस्त्रीणां ममाग्रमहिषी भव"
    iast: "bhava maithili bhāryā me moham enaṃ visarjaya | bahvīnām uttamastrīṇāṃ mamāgramahiṣī bhava"
  - id: '5.18.25'
    kind: verse
    lines:
      - "निक्षिप्तविजयो रामो गतश्रीर्वनगोचरः"
      - "व्रती स्थण्डिलशायी च शङ्के जीवति वा न वा"
    iast: "nikṣiptavijayo rāmo gataśrīr vanagocaraḥ | vratī sthaṇḍilaśāyī ca śaṅke jīvati vā na vā"
  - id: '5.19.3'
    kind: verse
    lines:
      - "तृणमन्तरतः कृत्वा प्रत्युवाच शुचिस्मिता"
      - "निवर्तय मनो मत्तः स्वजने क्रियतां मनः"
    iast: "tṛṇam antarataḥ kṛtvā pratyuvāca śucismitā | nivartaya mano mattaḥ svajane kriyatāṃ manaḥ"
  - id: '5.19.4'
    kind: verse
    lines:
      - "न मां प्रार्थयितुं युक्तस्त्वं सिद्धिमिव पापकृत्"
      - "अकार्यं न मया कार्यमेकपत्न्या विगर्हितम्"
      - "कुलं संप्राप्तया पुण्यं कुले महति जातया"
    iast: "na māṃ prārthayituṃ yuktas tvaṃ siddhim iva pāpakṛt | akāryaṃ na mayā kāryam ekapatnyā vigarhitam | kulaṃ saṃprāptayā puṇyaṃ kule mahati jātayā"
  - id: '5.19.6'
    kind: verse
    lines:
      - "नाहमौपयिकी भार्या परभार्या सती तव"
      - "साधु धर्ममवेक्षस्व साधु साधुव्रतं चर"
    iast: "nāham aupayikī bhāryā parabhāryā satī tava | sādhu dharmam avekṣasva sādhu sādhuvrataṃ cara"
  - id: '5.19.7'
    kind: verse
    lines:
      - "यथा तव तथान्येषां रक्ष्या दारा निशाचर"
      - "आत्मानमुपमां कृत्वा स्वेषु दारेषु रम्यताम्"
    iast: "yathā tava tathānyeṣāṃ rakṣyā dārā niśācara | ātmānam upamāṃ kṛtvā sveṣu dāreṣu ramyatām"
  - id: '5.19.9'
    kind: verse
    lines:
      - "इह सन्तो न वा सन्ति सतो वा नानुवर्तसे"
      - "वचो मिथ्या प्रणीतात्मा पथ्यमुक्तं विचक्षणैः"
    iast: "iha santo na vā santi sato vā nānuvartase | vaco mithyā praṇītātmā pathyam uktaṃ vicakṣaṇaiḥ"
  - id: '5.20.1'
    kind: verse
    lines:
      - "सीताया वचनं श्रुत्वा परुषं राक्षसाधिपः"
      - "प्रत्युवाच ततः सीतां विप्रियं प्रियदर्शनाम्"
    iast: "sītāyā vacanaṃ śrutvā paruṣaṃ rākṣasādhipaḥ | pratyuvāca tataḥ sītāṃ vipriyaṃ priyadarśanām"
  - id: '5.20.4'
    kind: verse
    lines:
      - "वामः कामो मनुष्याणां यस्मिन्किल निबध्यते"
      - "जने तस्मिंस्त्वनुक्रोशः स्नेहश्च किल जायते"
    iast: "vāmaḥ kāmo manuṣyāṇāṃ yasmin kila nibadhyate | jane tasmiṃs tv anukrośaḥ snehaś ca kila jāyate"
  - id: '5.20.5'
    kind: verse
    lines:
      - "एतस्मात्कारणान्न तां घतयामि वरानने"
      - "वधार्हामवमानार्हां मिथ्याप्रव्रजिते रताम्"
    iast: "etasmāt kāraṇān na tāṃ ghatayāmi varānane | vadhārhām avamānārhāṃ mithyāpravrajite ratām"
  - id: '5.20.8'
    kind: verse
    lines:
      - "द्वौ मासौ रक्षितव्यौ मे योऽवधिस्ते मया कृतः"
      - "ततः शयनमारोह मम त्वं वरवर्णिनि"
    iast: "dvau māsau rakṣitavyau me yo 'vadhis te mayā kṛtaḥ | tataḥ śayanam āroha mama tvaṃ varavarṇini"
  - id: '5.20.9'
    kind: verse
    lines:
      - "द्वाभ्यामूर्ध्वं तु मासाभ्यां भर्तारं मामनिच्छतीम्"
      - "मम त्वां प्रातराशार्थमारभन्ते महानसे"
    iast: "dvābhyām ūrdhvaṃ tu māsābhyāṃ bhartāraṃ mām anicchatīm | mama tvāṃ prātarāśārtham ārabhante mahānase"
  - id: '5.28.2'
    kind: verse
    lines:
      - "अवेक्षमाणस्तां देवीं देवतामिव नन्दने"
      - "ततो बहुविधां चिन्तां चिन्तयामास वानरः"
    iast: "avekṣamāṇas tāṃ devīṃ devatām iva nandane | tato bahuvidhāṃ cintāṃ cintayām āsa vānaraḥ"
  - id: '5.28.3'
    kind: verse
    lines:
      - "यां कपीनां सहस्राणि सुबहून्ययुतानि च"
      - "दिक्षु सर्वासु मार्गन्ते सेयमासादिता मया"
    iast: "yāṃ kapīnāṃ sahasrāṇi subahūny ayutāni ca | dikṣu sarvāsu mārgante seyam āsāditā mayā"
  - id: '5.28.7'
    kind: verse
    lines:
      - "अहमाश्वासयाम्येनां पूर्णचन्द्रनिभाननाम्"
      - "अदृष्टदुःखां दुःखस्य न ह्यन्तमधिगच्छतीम्"
    iast: "aham āśvāsayāmy enāṃ pūrṇacandranibhānanām | adṛṣṭaduḥkhāṃ duḥkhasya na hy antam adhigacchatīm"
  - id: '5.28.41'
    kind: verse
    lines:
      - "राममक्लिष्टकर्माणं स्वबन्धुमनुकीर्तयन्"
      - "नैनामुद्वेजयिष्यामि तद्बन्धुगतमानसाम्"
    iast: "rāmam akliṣṭakarmāṇaṃ svabandhum anukīrtayan | nainām udvejayiṣyāmi tad bandhugatamānasām"
  - id: '5.31.1'
    kind: verse
    lines:
      - "तामब्रवीन्महातेजा हनूमान्मारुतात्मजः"
      - "शिरस्यञ्जलिमाधाय सीतां मधुरया गिरा"
    iast: "tām abravīn mahātejā hanūmān mārutātmajaḥ | śirasy añjalim ādhāya sītāṃ madhurayā girā"
  - id: '5.31.10'
    kind: verse
    lines:
      - "रावणेन जनस्थानाद्बलादपहृता यदि"
      - "सीता त्वमसि भद्रं ते तन्ममाचक्ष्व पृच्छतः"
    iast: "rāvaṇena janasthānād balād apahṛtā yadi | sītā tvam asi bhadraṃ te tan mamācakṣva pṛcchataḥ"
  - id: '5.31.12'
    kind: verse
    lines:
      - "दुहिता जनकस्याहं वैदेहस्य महात्मनः"
      - "सीता च नाम नाम्नाहं भार्या रामस्य धीमतः"
    iast: "duhitā janakasyāhaṃ vaidehasya mahātmanaḥ | sītā ca nāma nāmnāhaṃ bhāryā rāmasya dhīmataḥ"
  - id: '5.31.26'
    kind: verse
    lines:
      - "वसतो दण्डकारण्ये तस्याहममितौजसः"
      - "रक्षसापहृता भार्या रावणेन दुरात्मना"
    iast: "vasato daṇḍakāraṇye tasyāham amitaujasaḥ | rakṣasāpahṛtā bhāryā rāvaṇena durātmanā"
  - id: '5.31.27'
    kind: verse
    lines:
      - "द्वौ मासौ तेन मे कालो जीवितानुग्रहः कृतः"
      - "ऊर्ध्वं द्वाभ्यां तु मासाभ्यां ततस्त्यक्ष्यामि जीवितम्"
    iast: "dvau māsau tena me kālo jīvitānugrahaḥ kṛtaḥ | ūrdhvaṃ dvābhyāṃ tu māsābhyāṃ tatas tyakṣyāmi jīvitam"
  - id: '5.32.1'
    kind: verse
    lines:
      - "तस्यास्तद्वचनं श्रुत्वा हनूमान्हरियूथपः"
      - "दुःखाद्दुःखाभिभूतायाः सान्तमुत्तरमब्रवीत्"
    iast: "tasyās tad vacanaṃ śrutvā hanūmān hariyūthapaḥ | duḥkhād duḥkhābhibhūtāyāḥ sāntam uttaram abravīt"
  - id: '5.32.2'
    kind: verse
    lines:
      - "अहं रामस्य संदेशाद्देवि दूतस्तवागतः"
      - "वैदेहि कुशली रामस्त्वां च कौशलमब्रवीत्"
    iast: "ahaṃ rāmasya saṃdeśād devi dūtas tavāgataḥ | vaidehi kuśalī rāmas tvāṃ ca kauśalam abravīt"
  - id: '5.32.5'
    kind: verse
    lines:
      - "सा तयोः कुशलं देवी निशम्य नरसिंहयोः"
      - "प्रीतिसंहृष्टसर्वाङ्गी हनूमान्तमथाब्रवीत्"
    iast: "sā tayoḥ kuśalaṃ devī niśamya narasiṃhayoḥ | prītisaṃhṛṣṭasarvāṅgī hanūmāntam athābravīt"
  - id: '5.32.6'
    kind: verse
    lines:
      - "कल्याणी बत गथेयं लौकिकी प्रतिभाति मे"
      - "एहि जीवन्तमानदो नरं वर्षशतादपि"
    iast: "kalyāṇī bata gatheyaṃ laukikī pratibhāti me | ehi jīvantam ānado naraṃ varṣaśatād api"
  - id: '5.33.2'
    kind: verse
    lines:
      - "क्व ते रामेण संसर्गः कथं जानासि लक्ष्मणम्"
      - "वानराणां नराणां च कथमासीत्समागमः"
    iast: "kva te rāmeṇa saṃsargaḥ kathaṃ jānāsi lakṣmaṇam | vānarāṇāṃ narāṇāṃ ca katham āsīt samāgamaḥ"
  - id: '5.33.3'
    kind: verse
    lines:
      - "यानि रामस्य लिङ्गानि लक्ष्मणस्य च वानर"
      - "तानि भूयः समाचक्ष्व न मां शोकः समाविशेत्"
    iast: "yāni rāmasya liṅgāni lakṣmaṇasya ca vānara | tāni bhūyaḥ samācakṣva na māṃ śokaḥ samāviśet"
  - id: '5.33.5'
    kind: verse
    lines:
      - "एवमुक्तस्तु वैदेह्या हनूमान्मारुतात्मजः"
      - "ततो रामं यथातत्त्वमाख्यातुमुपचक्रमे"
    iast: "evam uktas tu vaidehyā hanūmān mārutātmajaḥ | tato rāmaṃ yathātattvam ākhyātum upacakrame"
  - id: '5.33.8'
    kind: verse
    lines:
      - "रामः कमलपत्राक्षः सर्वभूतमनोहरः"
      - "रूपदाक्षिण्यसंपन्नः प्रसूतो जनकात्मजे"
    iast: "rāmaḥ kamalapatrākṣaḥ sarvabhūtamanoharaḥ | rūpadākṣiṇyasaṃpannaḥ prasūto janakātmaje"
  - id: '5.33.9'
    kind: verse
    lines:
      - "तेजसादित्यसंकाशः क्षमया पृथिवीसमः"
      - "बृहस्पतिसमो बुद्ध्या यशसा वासवोपमः"
    iast: "tejasādityasaṃkāśaḥ kṣamayā pṛthivīsamaḥ | bṛhaspatisamo buddhyā yaśasā vāsavopamaḥ"
  - id: '5.33.10'
    kind: verse
    lines:
      - "रक्षिता जीवलोकस्य स्वजनस्य च रक्षिता"
      - "रक्षिता स्वस्य वृत्तस्य धर्मस्य च परंतपः"
    iast: "rakṣitā jīvalokasya svajanasya ca rakṣitā | rakṣitā svasya vṛttasya dharmasya ca paraṃtapaḥ"
  - id: '5.33.11'
    kind: verse
    lines:
      - "रामो भामिनि लोकस्य चातुर्वर्ण्यस्य रक्षिता"
      - "मर्यादानां च लोकस्य कर्ता कारयिता च सः"
    iast: "rāmo bhāmini lokasya cāturvarṇyasya rakṣitā | maryādānāṃ ca lokasya kartā kārayitā ca saḥ"
  - id: '5.33.20'
    kind: verse
    lines:
      - "सत्यधर्मपरः श्रीमान्संग्रहानुग्रहे रतः"
      - "देशकालविभागज्ञः सर्वलोकप्रियंवदः"
    iast: "satyadharmaparaḥ śrīmān saṃgrahānugrahe rataḥ | deśakālavibhāgajñaḥ sarvalokapriyaṃvadaḥ"
  - id: '5.33.21'
    kind: verse
    lines:
      - "भ्राता च तस्य द्वैमात्रः सौमित्रिरपराजितः"
      - "अनुरागेण रूपेण गुणैश्चैव तथाविधः"
    iast: "bhrātā ca tasya dvaimātraḥ saumitrir aparājitaḥ | anurāgeṇa rūpeṇa guṇaiś caiva tathāvidhaḥ"
  - id: '5.33.35'
    kind: verse
    lines:
      - "ततस्त्वद्गात्रशोभीनि रक्षसा ह्रियमाणया"
      - "यान्याभरणजालानि पातितानि महीतले"
    iast: "tatas tvadgātraśobhīni rakṣasā hriyamāṇayā | yāny ābharaṇajālāni pātitāni mahītale"
  - id: '5.33.37'
    kind: verse
    lines:
      - "तानि रामाय दत्तानि मयैवोपहृतानि च"
      - "स्वनवन्त्यवकीर्णन्ति तस्मिन्विहतचेतसि"
    iast: "tāni rāmāya dattāni mayaivopahṛtāni ca | svanavanty avakīrṇanti tasmin vihatacetasi"
  - id: '5.33.38'
    kind: verse
    lines:
      - "तान्यङ्के दर्शनीयानि कृत्वा बहुविधं ततः"
      - "तेन देवप्रकाशेन देवेन परिदेवितम्"
    iast: "tāny aṅke darśanīyāni kṛtvā bahuvidhaṃ tataḥ | tena devaprakāśena devena paridevitam"
  - id: '5.33.46'
    kind: verse
    lines:
      - "स त्वां मनुजशार्दूलः क्षिप्रं प्राप्स्यति राघवः"
      - "समित्रबान्धवं हत्वा रावणं जनकात्मजे"
    iast: "sa tvāṃ manujaśārdūlaḥ kṣipraṃ prāpsyati rāghavaḥ | samitrabāndhavaṃ hatvā rāvaṇaṃ janakātmaje"
  - id: '5.33.47'
    kind: verse
    lines:
      - "सहितौ रामसुग्रीवावुभावकुरुतां तदा"
      - "समयं वालिनं हन्तुं तव चान्वेषणं तथा"
    iast: "sahitau rāmasugrīvāv ubhāv akurutāṃ tadā | samayaṃ vālinaṃ hantuṃ tava cānveṣaṇaṃ tathā"
  - id: '5.33.48'
    kind: verse
    lines:
      - "ततो निहत्य तरसा रामो वालिनमाहवे"
      - "सर्वर्क्षहरिसंघानां सुग्रीवमकरोत्पतिम्"
    iast: "tato nihatya tarasā rāmo vālinam āhave | sarvarkṣaharisaṃghānāṃ sugrīvam akarot patim"
  - id: '5.33.49'
    kind: verse
    lines:
      - "रामसुग्रीवयोरैक्यं देव्येवं समजायत"
      - "हनूमन्तं च मां विद्धि तयोर्दूतमिहागतम्"
    iast: "rāmasugrīvayor aikyaṃ devy evaṃ samajāyata | hanūmantaṃ ca māṃ viddhi tayor dūtam ihāgatam"
  - id: '5.33.50'
    kind: verse
    lines:
      - "स्वराज्यं प्राप्य सुग्रीवः समनीय महाहरीन्"
      - "त्वदर्थं प्रेषयामास दिशो दश महाबलान्"
    iast: "svarājyaṃ prāpya sugrīvaḥ samanīya mahāharīn | tvadarthaṃ preṣayām āsa diśo daśa mahābalān"
  - id: '5.33.51'
    kind: verse
    lines:
      - "आदिष्टा वानरेन्द्रेण सुग्रीवेण महौजसः"
      - "अद्रिराजप्रतीकाशाः सर्वतः प्रस्थिता महीम्"
    iast: "ādiṣṭā vānarendreṇa sugrīveṇa mahaujasaḥ | adrirājapratīkāśāḥ sarvataḥ prasthitā mahīm"
  - id: '5.33.75'
    kind: verse
    lines:
      - "तस्याहं हरिणः क्षेत्रे जातो वातेन मैथिलि"
      - "हनूमानिति विख्यातो लोके स्वेनैव कर्मणा"
      - "विश्वासार्थं तु वैदेहि भर्तुरुक्ता मया गुणाः"
    iast: "tasyāhaṃ hariṇaḥ kṣetre jāto vātena maithili | hanūmān iti vikhyāto loke svenaiva karmaṇā | viśvāsārthaṃ tu vaidehi bhartur uktā mayā guṇāḥ"
  - id: '5.34.2'
    kind: verse
    lines:
      - "वानरोऽहं महाभागे दूतो रामस्य धीमतः"
      - "रामनामाङ्कितं चेदं पश्य देव्यङ्गुलीयकम्"
      - "समाश्वसिहि भद्रं ते क्षीणदुःखफला ह्यसि"
    iast: "vānaro 'haṃ mahābhāge dūto rāmasya dhīmataḥ | rāmanāmāṅkitaṃ cedaṃ paśya devy aṅgulīyakam | samāśvasihi bhadraṃ te kṣīṇaduḥkhaphalā hy asi"
  - id: '5.34.3'
    kind: verse
    lines:
      - "गृहीत्वा प्रेक्षमाणा सा भर्तुः करविभूषणम्"
      - "भर्तारमिव संप्राप्ता जानकी मुदिताभवत्"
    iast: "gṛhītvā prekṣamāṇā sā bhartuḥ karavibhūṣaṇam | bhartāram iva saṃprāptā jānakī muditābhavat"
  - id: '5.34.5'
    kind: verse
    lines:
      - "ततः सा ह्रीमती बाला भर्तुः संदेशहर्षिता"
      - "परितुट्षा प्रियं श्रुत्वा प्राशंसत महाकपिम्"
    iast: "tataḥ sā hrīmatī bālā bhartuḥ saṃdeśaharṣitā | parituṭṣā priyaṃ śrutvā prāśaṃsata mahākapim"
  - id: '5.34.6'
    kind: verse
    lines:
      - "विक्रान्तस्त्वं समर्थस्त्वं प्राज्ञस्त्वं वानरोत्तम"
      - "येनेदं राक्षसपदं त्वयैकेन प्रधर्षितम्"
    iast: "vikrāntas tvaṃ samarthas tvaṃ prājñas tvaṃ vānarottama | yenedaṃ rākṣasapadaṃ tvayaikena pradharṣitam"
  - id: '5.34.11'
    kind: verse
    lines:
      - "दिष्ट्या च कुशली रामो धर्मात्मा धर्मवत्सलः"
      - "लक्ष्मणश्च महातेजाः सुमित्रानन्दवर्धनः"
    iast: "diṣṭyā ca kuśalī rāmo dharmātmā dharmavatsalaḥ | lakṣmaṇaś ca mahātejāḥ sumitrānandavardhanaḥ"
  - id: '5.34.12'
    kind: verse
    lines:
      - "कुशली यदि काकुत्स्थः किं नु सागरमेखलाम्"
      - "महीं दहति कोपेन युगान्ताग्निरिवोत्थितः"
    iast: "kuśalī yadi kākutsthaḥ kiṃ nu sāgaramekhalām | mahīṃ dahati kopena yugāntāgnir ivotthitaḥ"
  - id: '5.34.13'
    kind: verse
    lines:
      - "अथ वा शक्तिमन्तौ तौ सुराणामपि निग्रहे"
      - "ममैव तु न दुःखानामस्ति मन्ये विपर्ययः"
    iast: "atha vā śaktimantau tau surāṇām api nigrahe | mamaiva tu na duḥkhānām asti manye viparyayaḥ"
  - id: '5.34.14'
    kind: verse
    lines:
      - "कच्चिच्च व्यथते रामः कच्चिन्न परिपत्यते"
      - "उत्तराणि च कार्याणि कुरुते पुरुषोत्तमः"
    iast: "kaccic ca vyathate rāmaḥ kaccin na paripatyate | uttarāṇi ca kāryāṇi kurute puruṣottamaḥ"
  - id: '5.34.19'
    kind: verse
    lines:
      - "कच्चिन्न विगतस्नेहो विवासान्मयि राघवः"
      - "कच्चिन्मां व्यसनादस्मान्मोक्षयिष्यति वानरः"
    iast: "kaccin na vigatasneho vivāsān mayi rāghavaḥ | kaccin māṃ vyasanād asmān mokṣayiṣyati vānaraḥ"
  - id: '5.34.31'
    kind: verse
    lines:
      - "सीताया वचनं श्रुत्वा मारुतिर्भीमविक्रमः"
      - "शिरस्यञ्जलिमाधाय वाक्यमुत्तरमब्रवीत्"
    iast: "sītāyā vacanaṃ śrutvā mārutir bhīmavikramaḥ | śirasy añjalim ādhāya vākyam uttaram abravīt"
  - id: '5.34.32'
    kind: verse
    lines:
      - "न त्वामिहस्थां जानीते रामः कमललोचनः"
      - "श्रुत्वैव तु वचो मह्यं क्षिप्रमेष्यति राघवः"
    iast: "na tvām ihasthāṃ jānīte rāmaḥ kamalalocanaḥ | śrutvaiva tu vaco mahyaṃ kṣipram eṣyati rāghavaḥ"
  - id: '5.34.33'
    kind: verse
    lines:
      - "चमूं प्रकर्षन्महतीं हर्यृष्कगणसंकुलाम्"
      - "विष्टम्भयित्वा बाणौघैरक्षोभ्यं वरुणालयम्"
      - "करिष्यति पुरीं लङ्कां काकुत्स्थः शान्तराक्षसाम्"
    iast: "camūṃ prakarṣan mahatīṃ haryṛṣkagaṇasaṃkulām | viṣṭambhayitvā bāṇaughair akṣobhyaṃ varuṇālayam | kariṣyati purīṃ laṅkāṃ kākutsthaḥ śāntarākṣasām"
  - id: '5.34.35'
    kind: verse
    lines:
      - "तवादर्शनजेनार्ये शोकेन स परिप्लुतः"
      - "न शर्म लभते रामः सिंहार्दित इव द्विपः"
    iast: "tavādarśanajenārye śokena sa pariplutaḥ | na śarma labhate rāmaḥ siṃhārdita iva dvipaḥ"
  - id: '5.34.39'
    kind: verse
    lines:
      - "न मांसं राघवो भुङ्क्ते न चापि मधुसेवते"
      - "वन्यं सुविहितं नित्यं भक्तमश्नाति पञ्चमम्"
    iast: "na māṃsaṃ rāghavo bhuṅkte na cāpi madhusevate | vanyaṃ suvihitaṃ nityaṃ bhaktam aśnāti pañcamam"
  - id: '5.34.42'
    kind: verse
    lines:
      - "अनिद्रः सततं रामः सुप्तोऽपि च नरोत्तमः"
      - "सीतेति मधुरां वाणीं व्याहरन्प्रतिबुध्यते"
    iast: "anidraḥ satataṃ rāmaḥ supto 'pi ca narottamaḥ | sīteti madhurāṃ vāṇīṃ vyāharan pratibudhyate"
  - id: '5.36.10'
    kind: verse
    lines:
      - "यदि नोत्सहसे यातुं मया सार्धमनिन्दिते"
      - "अभिज्ञानं प्रयच्छ त्वं जानीयाद्राघवो हि यत्"
    iast: "yadi notsahase yātuṃ mayā sārdham anindite | abhijñānaṃ prayaccha tvaṃ jānīyād rāghavo hi yat"
  - id: '5.36.11'
    kind: verse
    lines:
      - "एवमुक्ता हनुमता सीता सुरसुतोपमा"
      - "उवाच वचनं मन्दं बाष्पप्रग्रथिताक्षरम्"
    iast: "evam uktā hanumatā sītā surasutopamā | uvāca vacanaṃ mandaṃ bāṣpapragrathitākṣaram"
  - id: '5.36.47'
    kind: verse
    lines:
      - "वृद्धोपसेवी लक्ष्मीवाञ्शक्तो न बहुभाषिता"
      - "राजपुत्रः प्रियश्रेष्ठः सदृशः श्वशुरस्य मे"
    iast: "vṛddhopasevī lakṣmīvāñ śakto na bahubhāṣitā | rājaputraḥ priyaśreṣṭhaḥ sadṛśaḥ śvaśurasya me"
  - id: '5.36.48'
    kind: verse
    lines:
      - "मत्तः प्रियतरो नित्यं भ्राता रामस्य लक्ष्मणः"
      - "नियुक्तो धुरि यस्यां तु तामुद्वहति वीर्यवान्"
    iast: "mattaḥ priyataro nityaṃ bhrātā rāmasya lakṣmaṇaḥ | niyukto dhuri yasyāṃ tu tām udvahati vīryavān"
  - id: '5.36.49'
    kind: verse
    lines:
      - "यं दृष्ट्वा राघवो नैव वृद्धमार्यमनुस्मरत्"
      - "स ममार्थाय कुशलं वक्तव्यो वचनान्मम"
      - "मृदुर्नित्यं शुचिर्दक्षः प्रियो रामस्य लक्ष्मणः"
    iast: "yaṃ dṛṣṭvā rāghavo naiva vṛddham āryam anusmarat | sa mamārthāya kuśalaṃ vaktavyo vacanān mama | mṛdur nityaṃ śucir dakṣaḥ priyo rāmasya lakṣmaṇaḥ"
  - id: '5.37.4'
    kind: verse
    lines:
      - "त्वमस्मिन्कार्यनिर्योगे प्रमाणं हरिसत्तम"
      - "तस्य चिन्तय यो यत्नो दुःखक्षयकरो भवेत्"
    iast: "tvam asmin kāryaniryoge pramāṇaṃ harisattama | tasya cintaya yo yatno duḥkhakṣayakaro bhavet"
  - id: '5.36.50'
    kind: verse
    lines:
      - "इदं ब्रूयाश्च मे नाथं शूरं रामं पुनः पुनः"
      - "जीवितं धारयिष्यामि मासं दशरथात्मज"
      - "ऊर्ध्वं मासान्न जीवेयं सत्येनाहं ब्रवीमि ते"
    iast: "idaṃ brūyāś ca me nāthaṃ śūraṃ rāmaṃ punaḥ punaḥ | jīvitaṃ dhārayiṣyāmi māsaṃ daśarathātmaja | ūrdhvaṃ māsān na jīveyaṃ satyenāhaṃ bravīmi te"
  - id: '5.36.52'
    kind: verse
    lines:
      - "ततो वस्त्रगतं मुक्त्वा दिव्यं चूडामणिं शुभम्"
      - "प्रदेयो राघवायेति सीता हनुमते ददौ"
    iast: "tato vastragataṃ muktvā divyaṃ cūḍāmaṇiṃ śubham | pradeyo rāghavāyeti sītā hanumate dadau"
  - id: '5.36.53'
    kind: verse
    lines:
      - "प्रतिगृह्य ततो वीरो मणिरत्नमनुत्तमम्"
      - "अङ्गुल्या योजयामास न ह्यस्या प्राभवद्भुजः"
    iast: "pratigṛhya tato vīro maṇiratnam anuttamam | aṅgulyā yojayām āsa na hy asyā prābhavad bhujaḥ"
  - id: '5.36.54'
    kind: verse
    lines:
      - "मणिरत्नं कपिवरः प्रतिगृह्याभिवाद्य च"
      - "सीतां प्रदक्षिणं कृत्वा प्रणतः पार्श्वतः स्थितः"
    iast: "maṇiratnaṃ kapivaraḥ pratigṛhyābhivādya ca | sītāṃ pradakṣiṇaṃ kṛtvā praṇataḥ pārśvataḥ sthitaḥ"
  - id: '5.36.55'
    kind: verse
    lines:
      - "हर्षेण महता युक्तः सीतादर्शनजेन सः"
      - "हृदयेन गतो रामं शरीरेण तु विष्ठितः"
    iast: "harṣeṇa mahatā yuktaḥ sītādarśanajena saḥ | hṛdayena gato rāmaṃ śarīreṇa tu viṣṭhitaḥ"
  - id: '5.39.1'
    kind: verse
    lines:
      - "स च वाग्भिः प्रशस्ताभिर्गमिष्यन्पूजितस्तया"
      - "तस्माद्देशादपक्रम्य चिन्तयामास वानरः"
    iast: "sa ca vāgbhiḥ praśastābhir gamiṣyan pūjitas tayā | tasmād deśād apakramya cintayām āsa vānaraḥ"
  - id: '5.39.2'
    kind: verse
    lines:
      - "अल्पशेषमिदं कार्यं दृष्टेयमसितेक्षणा"
      - "त्रीनुपायानतिक्रम्य चतुर्थ इह दृश्यते"
    iast: "alpaśeṣam idaṃ kāryaṃ dṛṣṭeyam asitekṣaṇā | trīn upāyān atikramya caturtha iha dṛśyate"
  - id: '5.39.5'
    kind: verse
    lines:
      - "कार्ये कर्मणि निर्दिष्टो यो बहून्यपि साधयेत्"
      - "पूर्वकार्यविरोधेन स कार्यं कर्तुमर्हति"
    iast: "kārye karmaṇi nirdiṣṭo yo bahūny api sādhayet | pūrvakāryavirodhena sa kāryaṃ kartum arhati"
  - id: '5.39.6'
    kind: verse
    lines:
      - "न ह्येकः साधको हेतुः स्वल्पस्यापीह कर्मणः"
      - "यो ह्यर्थं बहुधा वेद स समर्थोऽर्थसाधने"
    iast: "na hy ekaḥ sādhako hetuḥ svalpasyāpīha karmaṇaḥ | yo hy arthaṃ bahudhā veda sa samartho 'rthasādhane"
  - id: '5.39.10'
    kind: verse
    lines:
      - "इदं विध्वंसयिष्यामि शुष्कं वनमिवानलः"
      - "अस्मिन्भग्ने ततः कोपं करिष्यति स रावणः"
    iast: "idaṃ vidhvaṃsayiṣyāmi śuṣkaṃ vanam ivānalaḥ | asmin bhagne tataḥ kopaṃ kariṣyati sa rāvaṇaḥ"
  - id: '5.40.4'
    kind: verse
    lines:
      - "स ता दृष्ट्व महाबाहुर्महासत्त्वो महाबलः"
      - "चकार सुमहद्रूपं राक्षसीनां भयावहम्"
    iast: "sa tā dṛṣṭva mahābāhur mahāsattvo mahābalaḥ | cakāra sumahad rūpaṃ rākṣasīnāṃ bhayāvaham"
  - id: '5.40.12'
    kind: verse
    lines:
      - "रावणस्य समीपे तु राक्षस्यो विकृताननाः"
      - "विरूपं वानरं भीममाख्यातुमुपचक्रमुः"
    iast: "rāvaṇasya samīpe tu rākṣasyo vikṛtānanāḥ | virūpaṃ vānaraṃ bhīmam ākhyātum upacakramuḥ"
  - id: '5.40.13'
    kind: verse
    lines:
      - "अशोकवनिका मध्ये राजन्भीमवपुः कपिः"
      - "सीतया कृतसंवादस्तिष्ठत्यमितविक्रमः"
    iast: "aśokavanikā madhye rājan bhīmavapuḥ kapiḥ | sītayā kṛtasaṃvādas tiṣṭhaty amitavikramaḥ"
  - id: '5.40.16'
    kind: verse
    lines:
      - "तेन त्वद्भूतरूपेण यत्तत्तव मनोहरम्"
      - "नानामृगगणाकीर्णं प्रमृष्टं प्रमदावनम्"
    iast: "tena tvadbhūtarūpeṇa yat tat tava manoharam | nānāmṛgagaṇākīrṇaṃ pramṛṣṭaṃ pramadāvanam"
  - id: '5.40.17'
    kind: verse
    lines:
      - "न तत्र कश्चिदुद्देशो यस्तेन न विनाशितः"
      - "यत्र सा जानकी सीता स तेन न विनाशितः"
    iast: "na tatra kaś cid uddeśo yas tena na vināśitaḥ | yatra sā jānakī sītā sa tena na vināśitaḥ"
  - id: '5.40.23'
    kind: verse
    lines:
      - "आत्मनः सदृशाञ्शूरान्किंकरान्नाम राक्षसान्"
      - "व्यादिदेश महातेजा निग्रहार्थं हनूमतः"
    iast: "ātmanaḥ sadṛśāñ śūrān kiṃkarān nāma rākṣasān | vyādideśa mahātejā nigrahārthaṃ hanūmataḥ"
  - id: '5.40.27'
    kind: verse
    lines:
      - "ते गदाभिर्विचित्राभिः परिघैः काञ्चनाङ्गदैः"
      - "आजघ्नुर्वानरश्रेष्ठं शरैरादित्यसंनिभैः"
    iast: "te gadābhir vicitrābhiḥ parighaiḥ kāñcanāṅgadaiḥ | ājaghnur vānaraśreṣṭhaṃ śarair ādityasaṃnibhaiḥ"
  - id: '5.41.2'
    kind: verse
    lines:
      - "इति संचिन्त्य हनुमान्मनसा दर्शयन्बलम्"
      - "चैत्यप्रासादमाप्लुत्य मेरुशृङ्गमिवोन्नतम्"
      - "आरुरोह हरिश्रेष्ठो हनूमान्मारुतात्मजः"
    iast: "iti saṃcintya hanumān manasā darśayan balam | caityaprāsādam āplutya meruśṛṅgam ivonnatam | āruroha hariśreṣṭho hanūmān mārutātmajaḥ"
  - id: '5.41.4'
    kind: verse
    lines:
      - "स भूत्वा तु महाकायो हनूमान्मारुतात्मजः"
      - "धृष्टमास्फोटयामास लङ्कां शब्देन पूरयन्"
    iast: "sa bhūtvā tu mahākāyo hanūmān mārutātmajaḥ | dhṛṣṭam āsphoṭayām āsa laṅkāṃ śabdena pūrayan"
  - id: '5.41.6'
    kind: verse
    lines:
      - "जयत्यतिबलो रामो लक्ष्मणश्च महाबलः"
      - "राजा जयति सुग्रीवो राघवेणाभिपालितः"
    iast: "jayaty atibalo rāmo lakṣmaṇaś ca mahābalaḥ | rājā jayati sugrīvo rāghaveṇābhipālitaḥ"
  - id: '5.41.7'
    kind: verse
    lines:
      - "दासोऽहं कोसलेन्द्रस्य रामस्याक्लिष्टकर्मणः"
      - "हनुमाञ्शत्रुसैन्यानां निहन्ता मारुतात्मजः"
    iast: "dāso 'haṃ kosalendrasya rāmasyākliṣṭakarmaṇaḥ | hanumāñ śatrusainyānāṃ nihantā mārutātmajaḥ"
  - id: '5.41.9'
    kind: verse
    lines:
      - "अर्दयित्वा पुरीं लङ्कामभिवाद्य च मैथिलीम्"
      - "समृद्धार्थो गमिष्यामि मिषतां सर्वरक्षसाम्"
    iast: "ardayitvā purīṃ laṅkām abhivādya ca maithilīm | samṛddhārtho gamiṣyāmi miṣatāṃ sarvarakṣasām"
  - id: '5.46.14'
    kind: verse
    lines:
      - "ततस्तैः स्वगणैरिष्टैरिन्द्रजित्प्रतिपूजितः"
      - "युद्धोद्धतकृतोत्साहः संग्रामं प्रतिपद्यत"
    iast: "tatas taiḥ svagaṇair iṣṭair indrajit pratipūjitaḥ | yuddhoddhatakṛtotsāhaḥ saṃgrāmaṃ pratipadyata"
  - id: '5.46.17'
    kind: verse
    lines:
      - "स रथी धन्विनां श्रेष्ठः शस्त्रज्ञोऽस्त्रविदां वरः"
      - "रथेनाभिययौ क्षिप्रं हनूमान्यत्र सोऽभवत्"
    iast: "sa rathī dhanvināṃ śreṣṭhaḥ śastrajño 'stravidāṃ varaḥ | rathenābhiyayau kṣipraṃ hanūmān yatra so 'bhavat"
  - id: '5.46.19'
    kind: verse
    lines:
      - "सुमहच्चापमादाय शितशल्यांश्च सायकान्"
      - "हनूमन्तमभिप्रेत्य जगाम रणपण्डितः"
    iast: "sumahac cāpam ādāya śitaśalyāṃś ca sāyakān | hanūmantam abhipretya jagāma raṇapaṇḍitaḥ"
  - id: '5.46.30'
    kind: verse
    lines:
      - "तावुभौ वेगसंपन्नौ रणकर्मविशारदौ"
      - "सर्वभूतमनोग्राहि चक्रतुर्युद्धमुत्तमम्"
    iast: "tāv ubhau vegasaṃpannau raṇakarmaviśāradau | sarvabhūtamanogrāhi cakratur yuddham uttamam"
  - id: '5.46.34'
    kind: verse
    lines:
      - "ततः पैतामहां वीरः सोऽस्त्रमस्त्रविदां वरः"
      - "संदधे सुमहातेजास्तं हरिप्रवरं प्रति"
    iast: "tataḥ paitāmahāṃ vīraḥ so 'stram astravidāṃ varaḥ | saṃdadhe sumahātejās taṃ haripravaraṃ prati"
  - id: '5.46.36'
    kind: verse
    lines:
      - "तेन बद्धस्ततोऽस्त्रेण राक्षसेन स वानरः"
      - "अभवन्निर्विचेष्टश्च पपात च महीतले"
    iast: "tena baddhas tato 'streṇa rākṣasena sa vānaraḥ | abhavan nirviceṣṭaś ca papāta ca mahītale"
  - id: '5.46.52'
    kind: verse
    lines:
      - "तं मत्तमिव मातङ्गं बद्धं कपिवरोत्तमम्"
      - "राक्षसा राक्षसेन्द्राय रावणाय न्यवेदयन्"
    iast: "taṃ mattam iva mātaṅgaṃ baddhaṃ kapivarottamam | rākṣasā rākṣasendrāya rāvaṇāya nyavedayan"
  - id: '5.47.15'
    kind: verse
    lines:
      - "स तैः संपीड्यमानोऽपि रक्षोभिर्भीमविक्रमैः"
      - "विस्मयं परमं गत्वा रक्षोऽधिपमवैक्षत"
    iast: "sa taiḥ saṃpīḍyamāno 'pi rakṣobhir bhīmavikramaiḥ | vismayaṃ paramaṃ gatvā rakṣo'dhipam avaikṣata"
  - id: '5.47.16'
    kind: verse
    lines:
      - "भ्राजमानं ततो दृष्ट्वा हनुमान्राक्षसेश्वरम्"
      - "मनसा चिन्तयामास तेजसा तस्य मोहितः"
    iast: "bhrājamānaṃ tato dṛṣṭvā hanumān rākṣaseśvaram | manasā cintayām āsa tejasā tasya mohitaḥ"
  - id: '5.47.17'
    kind: verse
    lines:
      - "अहो रूपमहो धैर्यमहो सत्त्वमहो द्युतिः"
      - "अहो राक्षसराजस्य सर्वलक्षणयुक्तता"
    iast: "aho rūpam aho dhairyam aho sattvam aho dyutiḥ | aho rākṣasarājasya sarvalakṣaṇayuktatā"
  - id: '5.47.18'
    kind: verse
    lines:
      - "यद्यधर्मो न बलवान्स्यादयं राक्षसेश्वरः"
      - "स्यादयं सुरलोकस्य सशक्रस्यापि रक्षिता"
    iast: "yady adharmo na balavān syād ayaṃ rākṣaseśvaraḥ | syād ayaṃ suralokasya saśakrasyāpi rakṣitā"
  - id: '5.49.1'
    kind: verse
    lines:
      - "तं समीक्ष्य महासत्त्वं सत्त्ववान्हरिसत्तमः"
      - "वाक्यमर्थवदव्यग्रस्तमुवाच दशाननम्"
    iast: "taṃ samīkṣya mahāsattvaṃ sattvavān harisattamaḥ | vākyam arthavad avyagras tam uvāca daśānanam"
  - id: '5.49.14'
    kind: verse
    lines:
      - "अहं तु हनुमान्नाम मारुतस्यौरसः सुतः"
      - "सीतायास्तु कृते तूर्णं शतयोजनमायतम्"
      - "समुद्रं लङ्घयित्वैव तां दिदृक्षुरिहागतः"
    iast: "ahaṃ tu hanumān nāma mārutasyaurasaḥ sutaḥ | sītāyās tu kṛte tūrṇaṃ śatayojanam āyatam | samudraṃ laṅghayitvaiva tāṃ didṛkṣur ihāgataḥ"
  - id: '5.49.15'
    kind: verse
    lines:
      - "तद्भवान्दृष्टधर्मार्थस्तपः कृतपरिग्रहः"
      - "परदारान्महाप्राज्ञ नोपरोद्धुं त्वमर्हसि"
    iast: "tad bhavān dṛṣṭadharmārthas tapaḥ kṛtaparigrahaḥ | paradārān mahāprājña noparoddhuṃ tvam arhasi"
  - id: '5.49.16'
    kind: verse
    lines:
      - "न हि धर्मविरुद्धेषु बह्वपायेषु कर्मसु"
      - "मूलघातिषु सज्जन्ते बुद्धिमन्तो भवद्विधाः"
    iast: "na hi dharmaviruddheṣu bahv apāyeṣu karmasu | mūlaghātiṣu sajjante buddhimanto bhavadvidhāḥ"
  - id: '5.49.19'
    kind: verse
    lines:
      - "तत्त्रिकालहितं वाक्यं धर्म्यमर्थानुबन्धि च"
      - "मन्यस्व नरदेवाय जानकी प्रतिदीयताम्"
    iast: "tat trikālahitaṃ vākyaṃ dharmyam arthānubandhi ca | manyasva naradevāya jānakī pratidīyatām"
  - id: '5.50.1'
    kind: verse
    lines:
      - "तस्य तद्वचनं श्रुत्वा वानरस्य महात्मनः"
      - "आज्ञापयद्वधं तस्य रावणः क्रोधमूर्छितः"
    iast: "tasya tad vacanaṃ śrutvā vānarasya mahātmanaḥ | ājñāpayad vadhaṃ tasya rāvaṇaḥ krodhamūrchitaḥ"
  - id: '5.50.2'
    kind: verse
    lines:
      - "वधे तस्य समाज्ञप्ते रावणेन दुरात्मना"
      - "निवेदितवतो दौत्यं नानुमेने विभीषणः"
    iast: "vadhe tasya samājñapte rāvaṇena durātmanā | niveditavato dautyaṃ nānumene vibhīṣaṇaḥ"
  - id: '5.51.1'
    kind: verse
    lines:
      - "तस्य तद्वचनं श्रुत्वा दशग्रीवो महाबलः"
      - "देशकालहितं वाक्यं भ्रातुरुत्तममब्रवीत्"
    iast: "tasya tad vacanaṃ śrutvā daśagrīvo mahābalaḥ | deśakālahitaṃ vākyaṃ bhrātur uttamam abravīt"
  - id: '5.51.3'
    kind: verse
    lines:
      - "कपीनां किल लाङ्गूलमिष्टं भवति भूषणम्"
      - "तदस्य दीप्यतां शीघ्रं तेन दग्धेन गच्छतु"
    iast: "kapīnāṃ kila lāṅgūlam iṣṭaṃ bhavati bhūṣaṇam | tad asya dīpyatāṃ śīghraṃ tena dagdhena gacchatu"
  - id: '5.51.6'
    kind: verse
    lines:
      - "तस्य तद्वचनं श्रुत्वा राक्षसाः कोपकर्कशाः"
      - "वेष्टन्ते तस्य लाङ्गूलं जीर्णैः कार्पासिकैः पटैः"
    iast: "tasya tad vacanaṃ śrutvā rākṣasāḥ kopakarkaśāḥ | veṣṭante tasya lāṅgūlaṃ jīrṇaiḥ kārpāsikaiḥ paṭaiḥ"
  - id: '5.52.1'
    kind: verse
    lines:
      - "वीक्षमाणस्ततो लङ्कां कपिः कृतमनोरथः"
      - "वर्धमानसमुत्साहः कार्यशेषमचिन्तयत्"
    iast: "vīkṣamāṇas tato laṅkāṃ kapiḥ kṛtamanorathaḥ | vardhamānasamutsāhaḥ kāryaśeṣam acintayat"
  - id: '5.52.5'
    kind: verse
    lines:
      - "यो ह्ययं मम लाङ्गूले दीप्यते हव्यवाहनः"
      - "अस्य संतर्पणं न्याय्यं कर्तुमेभिर्गृहोत्तमैः"
    iast: "yo hy ayaṃ mama lāṅgūle dīpyate havyavāhanaḥ | asya saṃtarpaṇaṃ nyāyyaṃ kartum ebhir gṛhottamaiḥ"
  - id: '5.52.6'
    kind: verse
    lines:
      - "ततः प्रदीप्तलाङ्गूलः सविद्युदिव तोयदः"
      - "भवनाग्रेषु लङ्काया विचचार महाकपिः"
    iast: "tataḥ pradīptalāṅgūlaḥ savidyud iva toyadaḥ | bhavanāgreṣu laṅkāyā vicacāra mahākapiḥ"
  - id: '5.5.15'
    kind: verse
    lines:
      - "गृहाद्गृहं राक्षसानामुद्यानानि च वानरः"
      - "वीक्षमाणो ह्यसंत्रस्तः प्रासादांश्च चचार सः"
    iast: "gṛhād gṛhaṃ rākṣasānām udyānāni ca vānaraḥ | vīkṣamāṇo hy asaṃtrastaḥ prāsādāṃś ca cacāra saḥ"
  - id: '5.52.17'
    kind: verse
    lines:
      - "लङ्कां समस्तां संदीप्य लाङ्गूलाग्निं महाकपिः"
      - "निर्वापयामास तदा समुद्रे हरिसत्तमः"
    iast: "laṅkāṃ samastāṃ saṃdīpya lāṅgūlāgniṃ mahākapiḥ | nirvāpayām āsa tadā samudre harisattamaḥ"
  - id: '5.54.1'
    kind: verse
    lines:
      - "ततस्तु शिंशपामूले जानकीं पर्यवस्थिताम्"
      - "अभिवाद्याब्रवीद्दिष्ट्या पश्यामि त्वामिहाक्षताम्"
    iast: "tatas tu śiṃśapāmūle jānakīṃ paryavasthitām | abhivādyābravīd diṣṭyā paśyāmi tvām ihākṣatām"
  - id: '5.55.18'
    kind: verse
    lines:
      - "ततस्तु वेगवांस्तस्य गिरेर्गिरिनिभः कपिः"
      - "निपपात महेन्द्रस्य शिखरे पादपाकुले"
    iast: "tatas tu vegavāṃs tasya girer girinibhaḥ kapiḥ | nipapāta mahendrasya śikhare pādapākule"
  - id: '5.55.19'
    kind: verse
    lines:
      - "ततस्ते प्रीतमनसः सर्वे वानरपुंगवाः"
      - "हनूमन्तं महात्मानं परिवार्योपतस्थिरे"
    iast: "tatas te prītamanasaḥ sarve vānarapuṃgavāḥ | hanūmantaṃ mahātmānaṃ parivāryopatasthire"
  - id: '5.55.21'
    kind: verse
    lines:
      - "उपायनानि चादाय मूलानि च फलानि च"
      - "प्रत्यर्चयन्हरिश्रेष्ठं हरयो मारुतात्मजम्"
    iast: "upāyanāni cādāya mūlāni ca phalāni ca | pratyarcayan hariśreṣṭhaṃ harayo mārutātmajam"
  - id: '5.55.23'
    kind: verse
    lines:
      - "हनूमांस्तु गुरून्वृद्धाञ्जाम्बवत्प्रमुखांस्तदा"
      - "कुमारमङ्गदं चैव सोऽवन्दत महाकपिः"
    iast: "hanūmāṃs tu gurūn vṛddhāñ jāmbavat pramukhāṃs tadā | kumāram aṅgadaṃ caiva so 'vandata mahākapiḥ"
  - id: '5.55.26'
    kind: verse
    lines:
      - "हनूमानब्रवीद्धृष्टस्तदा तान्वानरर्षभान्"
      - "अशोकवनिकासंस्था दृष्टा सा जनकात्मजा"
    iast: "hanūmān abravīd dhṛṣṭas tadā tān vānararṣabhān | aśokavanikāsaṃsthā dṛṣṭā sā janakātmajā"
  - id: '5.55.27'
    kind: verse
    lines:
      - "रक्ष्यमाणा सुघोराभी राक्षसीभिरनिन्दिता"
      - "एकवेणीधरा बाला रामदर्शनलालसा"
      - "उपवासपरिश्रान्ता मलिना जटिला कृशा"
    iast: "rakṣyamāṇā sughorābhī rākṣasībhir aninditā | ekaveṇīdharā bālā rāmadarśanalālasā | upavāsapariśrāntā malinā jaṭilā kṛśā"
  - id: '5.59.2'
    kind: verse
    lines:
      - "प्रीतिमन्तस्ततः सर्वे वायुपुत्रपुरःसराः"
      - "महेन्द्राग्रं परित्यज्य पुप्लुवुः प्लवगर्षभाः"
    iast: "prītimantas tataḥ sarve vāyuputrapuraḥsarāḥ | mahendrāgraṃ parityajya pupluvuḥ plavagarṣabhāḥ"
  - id: '5.59.7'
    kind: verse
    lines:
      - "प्लवमानाः खमाप्लुत्य ततस्ते काननौक्षकः"
      - "नन्दनोपममासेदुर्वनं द्रुमलतायुतम्"
    iast: "plavamānāḥ kham āplutya tatas te kānanaukṣakaḥ | nandanopamam āsedur vanaṃ drumalatāyutam"
  - id: '5.62.37'
    kind: verse
    lines:
      - "तेऽङ्गदप्रमुखा वीराः प्रहृष्टाश्च मुदान्विताः"
      - "निपेतुर्हरिराजस्य समीपे राघवस्य च"
    iast: "te 'ṅgadapramukhā vīrāḥ prahṛṣṭāś ca mudānvitāḥ | nipetur harirājasya samīpe rāghavasya ca"
  - id: '5.62.38'
    kind: verse
    lines:
      - "हनूमांश्च महाबहुः प्रणम्य शिरसा ततः"
      - "नियतामक्षतां देवीं राघवाय न्यवेदयत्"
    iast: "hanūmāṃś ca mahābahuḥ praṇamya śirasā tataḥ | niyatām akṣatāṃ devīṃ rāghavāya nyavedayat"
  - id: '5.63.9'
    kind: verse
    lines:
      - "तत्र लङ्केति नगरी रावणस्य दुरात्मनः"
      - "दक्षिणस्य समुद्रस्य तीरे वसति दक्षिणे"
    iast: "tatra laṅketi nagarī rāvaṇasya durātmanaḥ | dakṣiṇasya samudrasya tīre vasati dakṣiṇe"
  - id: '5.63.10'
    kind: verse
    lines:
      - "तत्र दृष्टा मया सीता रावणान्तःपुरे सती"
      - "संन्यस्य त्वयि जीवन्ती रामा राम मनोरथम्"
    iast: "tatra dṛṣṭā mayā sītā rāvaṇāntaḥpure satī | saṃnyasya tvayi jīvantī rāmā rāma manoratham"
  - id: '5.63.15'
    kind: verse
    lines:
      - "इक्ष्वाकुवंशविख्यातिं शनैः कीर्तयतानघ"
      - "स मया नरशार्दूल विश्वासमुपपादिता"
    iast: "ikṣvākuvaṃśavikhyātiṃ śanaiḥ kīrtayatānagha | sa mayā naraśārdūla viśvāsam upapāditā"
  - id: '5.63.16'
    kind: verse
    lines:
      - "ततः संभाषिता देवी सर्वमर्थं च दर्शिता"
      - "रामसुग्रीवसख्यं च श्रुत्वा प्रीतिमुपागता"
    iast: "tataḥ saṃbhāṣitā devī sarvam arthaṃ ca darśitā | rāmasugrīvasakhyaṃ ca śrutvā prītim upāgatā"
  - id: '5.63.18'
    kind: verse
    lines:
      - "अभिज्ञानं च मे दत्तं यथावृत्तं तवान्तिके"
      - "चित्रकूटे महाप्राज्ञ वायसं प्रति राघव"
    iast: "abhijñānaṃ ca me dattaṃ yathāvṛttaṃ tavāntike | citrakūṭe mahāprājña vāyasaṃ prati rāghava"
  - id: '5.63.20'
    kind: verse
    lines:
      - "इदं चास्मै प्रदातव्यं यत्नात्सुपरिरक्षितम्"
      - "ब्रुवता वचनान्येवं सुग्रीवस्योपशृण्वतः"
    iast: "idaṃ cāsmai pradātavyaṃ yatnāt suparirakṣitam | bruvatā vacanāny evaṃ sugrīvasyopaśṛṇvataḥ"
  - id: '5.63.22'
    kind: verse
    lines:
      - "एष निर्यातितः श्रीमान्मया ते वारिसंभवः"
      - "एतं दृष्ट्वा प्रमोदिष्ये व्यसने त्वामिवानघ"
    iast: "eṣa niryātitaḥ śrīmān mayā te vārisaṃbhavaḥ | etaṃ dṛṣṭvā pramodiṣye vyasane tvām ivānagha"
  - id: '5.63.23'
    kind: verse
    lines:
      - "जीवितं धारयिष्यामि मासं दशरथात्मज"
      - "ऊर्ध्वं मासान्न जीवेयं रक्षसां वशमागता"
    iast: "jīvitaṃ dhārayiṣyāmi māsaṃ daśarathātmaja | ūrdhvaṃ māsān na jīveyaṃ rakṣasāṃ vaśam āgatā"
  - id: '5.64.2'
    kind: verse
    lines:
      - "तं तु दृष्ट्वा मणिश्रेष्ठं राघवः शोककर्शितः"
      - "नेत्राभ्यामश्रुपूर्णाभ्यां सुग्रीवमिदमब्रवीत्"
    iast: "taṃ tu dṛṣṭvā maṇiśreṣṭhaṃ rāghavaḥ śokakarśitaḥ | netrābhyām aśrupūrṇābhyāṃ sugrīvam idam abravīt"
  - id: '5.64.7'
    kind: verse
    lines:
      - "अयं हि शोभते तस्याः प्रियाया मूर्ध्नि मे मणिः"
      - "अद्यास्य दर्शनेनाहं प्राप्तां तामिव चिन्तये"
    iast: "ayaṃ hi śobhate tasyāḥ priyāyā mūrdhni me maṇiḥ | adyāsya darśanenāhaṃ prāptāṃ tām iva cintaye"
  - id: '5.64.11'
    kind: verse
    lines:
      - "नय मामपि तं देशं यत्र दृष्टा मम प्रिया"
      - "न तिष्ठेयं क्षणमपि प्रवृत्तिमुपलभ्य च"
    iast: "naya mām api taṃ deśaṃ yatra dṛṣṭā mama priyā | na tiṣṭheyaṃ kṣaṇam api pravṛttim upalabhya ca"
  - id: '5.64.15'
    kind: verse
    lines:
      - "मधुरा मधुरालापा किमाह मम भामिनी"
      - "मद्विहीना वरारोहा हनुमन्कथयस्व मे"
      - "दुःखाद्दुःखतरं प्राप्य कथं जीवति जानकी"
    iast: "madhurā madhurālāpā kim āha mama bhāminī | madvihīnā varārohā hanuman kathayasva me | duḥkhād duḥkhataraṃ prāpya kathaṃ jīvati jānakī"
  - id: '5.65.1'
    kind: verse
    lines:
      - "एवमुक्तस्तु हनुमान्राघवेण महात्मना"
      - "सीताया भाषितं सर्वं न्यवेदयत राघवे"
    iast: "evam uktas tu hanumān rāghaveṇa mahātmanā | sītāyā bhāṣitaṃ sarvaṃ nyavedayata rāghave"
  - id: '5.65.33'
    kind: verse
    lines:
      - "हनुमन्सिंहसंकाशौ तावुभौ रामलक्ष्मणौ"
      - "सुग्रीवं च सहामात्यं सर्वान्ब्रूया अनामयम्"
    iast: "hanuman siṃhasaṃkāśau tāv ubhau rāmalakṣmaṇau | sugrīvaṃ ca sahāmātyaṃ sarvān brūyā anāmayam"
  - id: '5.65.34'
    kind: verse
    lines:
      - "यथा च स महाबाहुर्मां तारयति राघवः"
      - "अस्माद्दुःखाम्बुसंरोधात्तत्समाधातुमर्हसि"
    iast: "yathā ca sa mahābāhur māṃ tārayati rāghavaḥ | asmād duḥkhāmbusaṃrodhāt tat samādhātum arhasi"
  - id: '5.66.16'
    kind: verse
    lines:
      - "तदर्थोपहितं वाक्यं प्रश्रितं हेतुसंहितम्"
      - "निशम्याहं ततः शेषं वाक्यमुत्तरमब्रुवम्"
    iast: "tad arthopahitaṃ vākyaṃ praśritaṃ hetusaṃhitam | niśamyāhaṃ tataḥ śeṣaṃ vākyam uttaram abruvam"
  - id: '5.66.24'
    kind: verse
    lines:
      - "मम पृष्ठगतौ तौ च चन्द्रसूर्याविवोदितौ"
      - "त्वत्सकाशं महाभागे नृसिंहावागमिष्यतः"
    iast: "mama pṛṣṭhagatau tau ca candrasūryāv ivoditau | tvatsakāśaṃ mahābhāge nṛsiṃhāv āgamiṣyataḥ"
  - id: '5.66.25'
    kind: verse
    lines:
      - "अरिघ्नं सिंहसंकाशं क्षिप्रं द्रक्ष्यसि राघवम्"
      - "लक्ष्मणं च धनुष्पाणिं लङ्का द्वारमुपस्थितम्"
    iast: "arighnaṃ siṃhasaṃkāśaṃ kṣipraṃ drakṣyasi rāghavam | lakṣmaṇaṃ ca dhanuṣpāṇiṃ laṅkā dvāram upasthitam"
  - id: '5.66.28'
    kind: verse
    lines:
      - "निवृत्तवनवासं च त्वया सार्धमरिंदमम्"
      - "अभिषिक्तमयोध्यायां क्षिप्रं द्रक्ष्यसि राघवम्"
    iast: "nivṛttavanavāsaṃ ca tvayā sārdham ariṃdamam | abhiṣiktam ayodhyāyāṃ kṣipraṃ drakṣyasi rāghavam"
  - id: '6.1.1'
    kind: verse
    lines:
      - "श्रुत्वा हनुमतो वाक्यं यथावदभिभाषितम्"
      - "रामः प्रीतिसमायुक्तो वाक्यमुत्तरमब्रवीत्"
    iast: "śrutvā hanumato vākyaṃ yathāvad abhibhāṣitam | rāmaḥ prītisamāyukto vākyam uttaram abravīt"
  - id: '6.4.3'
    kind: verse
    lines:
      - "अस्मिन्मुहूर्ते सुग्रीव प्रयाणमभिरोचये"
      - "युक्तो मुहूर्तो विजयः प्राप्तो मध्यं दिवाकरः"
    iast: "asmin muhūrte sugrīva prayāṇam abhirocaye | yukto muhūrto vijayaḥ prāpto madhyaṃ divākaraḥ"
  - id: '6.4.18'
    kind: verse
    lines:
      - "राघवस्य वचः श्रुत्वा सुग्रीवो वाहिनीपतिः"
      - "व्यादिदेश महावीर्यान्वानरान्वानरर्षभः"
    iast: "rāghavasya vacaḥ śrutvā sugrīvo vāhinīpatiḥ | vyādideśa mahāvīryān vānarān vānararṣabhaḥ"
  - id: '6.5.3'
    kind: verse
    lines:
      - "निविष्टायां तु सेनायां तीरे नदनदीपतेः"
      - "पार्श्वस्थं लक्ष्मणं दृष्ट्वा रामो वचनमब्रवीत्"
    iast: "niviṣṭāyāṃ tu senāyāṃ tīre nadanadīpateḥ | pārśvasthaṃ lakṣmaṇaṃ dṛṣṭvā rāmo vacanam abravīt"
  - id: '6.5.4'
    kind: verse
    lines:
      - "शोकश्च किल कालेन गच्छता ह्यपगच्छति"
      - "मम चापश्यतः कान्तामहन्यहनि वर्धते"
    iast: "śokaś ca kila kālena gacchatā hy apagacchati | mama cāpaśyataḥ kāntām ahany ahani vardhate"
  - id: '6.5.6'
    kind: verse
    lines:
      - "वाहि वात यतः कन्या तां स्पृष्ट्वा मामपि स्पृश"
      - "त्वयि मे गात्रसंस्पर्शश्चन्द्रे दृष्टिसमागमः"
    iast: "vāhi vāta yataḥ kanyā tāṃ spṛṣṭvā mām api spṛśa | tvayi me gātrasaṃsparśaś candre dṛṣṭisamāgamaḥ"
  - id: '6.5.18'
    kind: verse
    lines:
      - "कदा नु राक्षसेन्द्रस्य निधायोरसि सायकान्"
      - "सीतां प्रत्याहरिष्यामि शोकमुत्सृज्य मानसं"
    iast: "kadā nu rākṣasendrasya nidhāyorasi sāyakān | sītāṃ pratyāhariṣyāmi śokam utsṛjya mānasaṃ"
  - id: '6.5.21'
    kind: verse
    lines:
      - "एवं विलपतस्तस्य तत्र रामस्य धीमतः"
      - "दिनक्षयान्मन्दवपुर्भास्करोऽस्तमुपागमत्"
    iast: "evaṃ vilapatas tasya tatra rāmasya dhīmataḥ | dinakṣayān mandavapur bhāskaro 'stam upāgamat"
  - id: '6.6.1'
    kind: verse
    lines:
      - "लङ्कायां तु कृतं कर्म घोरं दृष्ट्वा भवावहम्"
      - "राक्षसेन्द्रो हनुमता शक्रेणेव महात्मना"
      - "अब्रवीद्राक्षसान्सर्वान्ह्रिया किं चिदवाङ्मुखः"
    iast: "laṅkāyāṃ tu kṛtaṃ karma ghoraṃ dṛṣṭvā bhavāvaham | rākṣasendro hanumatā śakreṇeva mahātmanā | abravīd rākṣasān sarvān hriyā kiṃ cid avāṅmukhaḥ"
  - id: '6.6.2'
    kind: verse
    lines:
      - "धर्षिता च प्रविष्टा च लङ्का दुष्प्रसहा पुरी"
      - "तेन वानरमात्रेण दृष्टा सीता च जानकी"
    iast: "dharṣitā ca praviṣṭā ca laṅkā duṣprasahā purī | tena vānaramātreṇa dṛṣṭā sītā ca jānakī"
  - id: '6.6.16'
    kind: verse
    lines:
      - "वानराणां हि वीराणां सहस्रैः परिवारितः"
      - "रामोऽभ्येति पुरीं लङ्कामस्माकमुपरोधकः"
    iast: "vānarāṇāṃ hi vīrāṇāṃ sahasraiḥ parivāritaḥ | rāmo 'bhyeti purīṃ laṅkām asmākam uparodhakaḥ"
  - id: '6.6.17'
    kind: verse
    lines:
      - "तरिष्यति च सुव्यक्तं राघवः सागरं सुखम्"
      - "तरसा युक्तरूपेण सानुजः सबलानुगः"
    iast: "tariṣyati ca suvyaktaṃ rāghavaḥ sāgaraṃ sukham | tarasā yuktarūpeṇa sānujaḥ sabalānugaḥ"
  - id: '6.7.1'
    kind: verse
    lines:
      - "इत्युक्ता राक्षसेन्द्रेण राक्षसास्ते महाबलाः"
      - "ऊचुः प्राञ्जलयः सर्वे रावणं राक्षसेश्वरम्"
    iast: "ity uktā rākṣasendreṇa rākṣasās te mahābalāḥ | ūcuḥ prāñjalayaḥ sarve rāvaṇaṃ rākṣaseśvaram"
  - id: '6.9.6'
    kind: verse
    lines:
      - "अद्य रामं वधिष्यामः सुग्रीवं च सलक्ष्मणम्"
      - "कृपणं च हनूमन्तं लङ्का येन प्रधर्षिता"
    iast: "adya rāmaṃ vadhiṣyāmaḥ sugrīvaṃ ca salakṣmaṇam | kṛpaṇaṃ ca hanūmantaṃ laṅkā yena pradharṣitā"
  - id: '6.9.7'
    kind: verse
    lines:
      - "तान्गृहीतायुधान्सर्वान्वारयित्वा विभीषणः"
      - "अब्रवीत्प्राञ्जलिर्वाक्यं पुनः प्रत्युपवेश्य तान्"
    iast: "tān gṛhītāyudhān sarvān vārayitvā vibhīṣaṇaḥ | abravīt prāñjalir vākyaṃ punaḥ pratyupaveśya tān"
  - id: '6.9.8'
    kind: verse
    lines:
      - "अप्युपायैस्त्रिभिस्तात योऽर्थः प्राप्तुं न शक्यते"
      - "तस्य विक्रमकालांस्तान्युक्तानाहुर्मनीषिणः"
    iast: "apy upāyais tribhis tāta yo 'rthaḥ prāptuṃ na śakyate | tasya vikramakālāṃs tān yuktān āhur manīṣiṇaḥ"
  - id: '6.9.13'
    kind: verse
    lines:
      - "किं च राक्षसराजस्य रामेणापकृतं पुरा"
      - "आजहार जनस्थानाद्यस्य भार्यां यशस्विनः"
    iast: "kiṃ ca rākṣasarājasya rāmeṇāpakṛtaṃ purā | ājahāra janasthānād yasya bhāryāṃ yaśasvinaḥ"
  - id: '6.9.15'
    kind: verse
    lines:
      - "एतन्निमित्तं वैदेही भयं नः सुमहद्भवेत्"
      - "आहृता सा परित्याज्या कलहार्थे कृते न किम्"
    iast: "etannimittaṃ vaidehī bhayaṃ naḥ sumahad bhavet | āhṛtā sā parityājyā kalahārthe kṛte na kim"
  - id: '6.9.16'
    kind: verse
    lines:
      - "न नः क्षमं वीर्यवता तेन धर्मानुवर्तिना"
      - "वैरं निरर्थकं कर्तुं दीयतामस्य मैथिली"
    iast: "na naḥ kṣamaṃ vīryavatā tena dharmānuvartinā | vairaṃ nirarthakaṃ kartuṃ dīyatām asya maithilī"
  - id: '6.10.1'
    kind: verse
    lines:
      - "सुनिविष्टं हितं वाक्यमुक्तवन्तं विभीषणम्"
      - "अब्रवीत्परुषं वाक्यं रावणः कालचोदितः"
    iast: "suniviṣṭaṃ hitaṃ vākyam uktavantaṃ vibhīṣaṇam | abravīt paruṣaṃ vākyaṃ rāvaṇaḥ kālacoditaḥ"
  - id: '6.10.2'
    kind: verse
    lines:
      - "वसेत्सह सपत्नेन क्रुद्धेनाशीविषेण वा"
      - "न तु मित्रप्रवादेन संवसेच्छत्रुसेविना"
    iast: "vaset saha sapatnena kruddhenāśīviṣeṇa vā | na tu mitrapravādena saṃvasec chatrusevinā"
  - id: '6.10.3'
    kind: verse
    lines:
      - "जानामि शीलं ज्ञातीनां सर्वलोकेषु राक्षस"
      - "हृष्यन्ति व्यसनेष्वेते ज्ञातीनां ज्ञातयः सदा"
    iast: "jānāmi śīlaṃ jñātīnāṃ sarvalokeṣu rākṣasa | hṛṣyanti vyasaneṣv ete jñātīnāṃ jñātayaḥ sadā"
  - id: '6.10.9'
    kind: verse
    lines:
      - "विद्यते गोषु संपन्नं विद्यते ब्राह्मणे दमः"
      - "विद्यते स्त्रीषु चापल्यं विद्यते ज्ञातितो भयम्"
    iast: "vidyate goṣu saṃpannaṃ vidyate brāhmaṇe damaḥ | vidyate strīṣu cāpalyaṃ vidyate jñātito bhayam"
  - id: '6.10.11'
    kind: verse
    lines:
      - "अन्यस्त्वेवंविधं ब्रूयाद्वाक्यमेतन्निशाचर"
      - "अस्मिन्मुहूर्ते न भवेत्त्वां तु धिक्कुलपांसनम्"
    iast: "anyas tv evaṃvidhaṃ brūyād vākyam etan niśācara | asmin muhūrte na bhavet tvāṃ tu dhik kulapāṃsanam"
  - id: '6.10.12'
    kind: verse
    lines:
      - "इत्युक्तः परुषं वाक्यं न्यायवादी विभीषणः"
      - "उत्पपात गदापाणिश्चतुर्भिः सह राक्षसैः"
    iast: "ity uktaḥ paruṣaṃ vākyaṃ nyāyavādī vibhīṣaṇaḥ | utpapāta gadāpāṇiś caturbhiḥ saha rākṣasaiḥ"
  - id: '6.10.13'
    kind: verse
    lines:
      - "अब्रवीच्च तदा वाक्यं जातक्रोधो विभीषणः"
      - "अन्तरिक्षगतः श्रीमान्भ्रातरं राक्षसाधिपम्"
    iast: "abravīc ca tadā vākyaṃ jātakrodho vibhīṣaṇaḥ | antarikṣagataḥ śrīmān bhrātaraṃ rākṣasādhipam"
  - id: '6.11.1'
    kind: verse
    lines:
      - "इत्युक्त्वा परुषं वाक्यं रावणं रावणानुजः"
      - "आजगाम मुहूर्तेन यत्र रामः सलक्ष्मणः"
    iast: "ity uktvā paruṣaṃ vākyaṃ rāvaṇaṃ rāvaṇānujaḥ | ājagāma muhūrtena yatra rāmaḥ salakṣmaṇaḥ"
  - id: '6.11.9'
    kind: verse
    lines:
      - "उवाच च महाप्राज्ञः स्वरेण महता महान्"
      - "सुग्रीवं तांश्च संप्रेक्ष्य खस्थ एव विभीषणः"
    iast: "uvāca ca mahāprājñaḥ svareṇa mahatā mahān | sugrīvaṃ tāṃś ca saṃprekṣya khastha eva vibhīṣaṇaḥ"
  - id: '6.11.11'
    kind: verse
    lines:
      - "तेन सीता जनस्थानाद्धृता हत्वा जटायुषम्"
      - "रुद्ध्वा च विवशा दीना राक्षसीभिः सुरक्षिता"
    iast: "tena sītā janasthānād dhṛtā hatvā jaṭāyuṣam | ruddhvā ca vivaśā dīnā rākṣasībhiḥ surakṣitā"
  - id: '6.11.13'
    kind: verse
    lines:
      - "स च न प्रतिजग्राह रावणः कालचोदितः"
      - "उच्यमानो हितं वाक्यं विपरीत इवौषधम्"
    iast: "sa ca na pratijagrāha rāvaṇaḥ kālacoditaḥ | ucyamāno hitaṃ vākyaṃ viparīta ivauṣadham"
  - id: '6.11.14'
    kind: verse
    lines:
      - "सोऽहं परुषितस्तेन दासवच्चावमानितः"
      - "त्यक्त्वा पुत्रांश्च दारांश्च राघवं शरणं गतः"
    iast: "so 'haṃ paruṣitas tena dāsavac cāvamānitaḥ | tyaktvā putrāṃś ca dārāṃś ca rāghavaṃ śaraṇaṃ gataḥ"
  - id: '6.11.18'
    kind: verse
    lines:
      - "रावणेन प्रणिहितं तमवेहि विभीषणम्"
      - "तस्याहं निग्रहं मन्ये क्षमं क्षमवतां वर"
    iast: "rāvaṇena praṇihitaṃ tam avehi vibhīṣaṇam | tasyāhaṃ nigrahaṃ manye kṣamaṃ kṣamavatāṃ vara"
  - id: '6.11.41'
    kind: verse
    lines:
      - "अथ संस्कारसंपन्नो हनूमान्सचिवोत्तमः"
      - "उवाच वचनं श्लक्ष्णमर्थवन्मधुरं लघु"
    iast: "atha saṃskārasaṃpanno hanūmān sacivottamaḥ | uvāca vacanaṃ ślakṣṇam arthavan madhuraṃ laghu"
  - id: '6.11.49'
    kind: verse
    lines:
      - "दौरात्म्यं रावणे दृष्ट्वा विक्रमं च तथा त्वयि"
      - "युक्तमागमनं तस्य सदृशं तस्य बुद्धितः"
    iast: "daurātmyaṃ rāvaṇe dṛṣṭvā vikramaṃ ca tathā tvayi | yuktam āgamanaṃ tasya sadṛśaṃ tasya buddhitaḥ"
  - id: '6.11.58'
    kind: verse
    lines:
      - "राज्यं प्रार्थयमानश्च बुद्धिपूर्वमिहागतः"
      - "एतावत्तु पुरस्कृत्य युज्यते त्वस्य संग्रहः"
    iast: "rājyaṃ prārthayamānaś ca buddhipūrvam ihāgataḥ | etāvat tu puraskṛtya yujyate tv asya saṃgrahaḥ"
  - id: '6.12.3'
    kind: verse
    lines:
      - "मित्रभावेन संप्राप्तं न त्यजेयं कथं चन"
      - "दोषो यद्यपि तस्य स्यात्सतामेतदगर्हितम्"
    iast: "mitrabhāvena saṃprāptaṃ na tyajeyaṃ kathaṃ cana | doṣo yady api tasya syāt satām etad agarhitam"
  - id: '6.12.9'
    kind: verse
    lines:
      - "सुदुष्टो वाप्यदुष्टो वा किमेष रजनीचरः"
      - "सूक्ष्ममप्यहितं कर्तुं ममाशक्तः कथं चन"
    iast: "suduṣṭo vāpy aduṣṭo vā kim eṣa rajanīcaraḥ | sūkṣmam apy ahitaṃ kartuṃ mamāśaktaḥ kathaṃ cana"
  - id: '6.12.15'
    kind: verse
    lines:
      - "आर्तो वा यदि वा दृप्तः परेषां शरणं गतः"
      - "अरिः प्राणान्परित्यज्य रक्षितव्यः कृतात्मना"
    iast: "ārto vā yadi vā dṛptaḥ pareṣāṃ śaraṇaṃ gataḥ | ariḥ prāṇān parityajya rakṣitavyaḥ kṛtātmanā"
  - id: '6.12.20'
    kind: verse
    lines:
      - "सकृदेव प्रपन्नाय तवास्मीति च याचते"
      - "अभयं सर्वभूतेभ्यो ददाम्येतद्व्रतं मम"
    iast: "sakṛd eva prapannāya tavāsmīti ca yācate | abhayaṃ sarvabhūtebhyo dadāmy etad vrataṃ mama"
  - id: '6.13.1'
    kind: verse
    lines:
      - "राघवेणाभये दत्ते संनतो रावणानुजः"
      - "खात्पपातावनिं हृष्टो भक्तैरनुचरैः सह"
    iast: "rāghaveṇābhaye datte saṃnato rāvaṇānujaḥ | khāt papātāvaniṃ hṛṣṭo bhaktair anucaraiḥ saha"
  - id: '6.13.3'
    kind: verse
    lines:
      - "अब्रवीच्च तदा रामं वाक्यं तत्र विभीषणः"
      - "धर्मयुक्तं च युक्तं च साम्प्रतं संप्रहर्षणम्"
    iast: "abravīc ca tadā rāmaṃ vākyaṃ tatra vibhīṣaṇaḥ | dharmayuktaṃ ca yuktaṃ ca sāmprataṃ saṃpraharṣaṇam"
  - id: '6.13.8'
    kind: verse
    lines:
      - "तेन चेमं महाप्राज्ञमभिषिञ्च विभीषणम्"
      - "राजानं रक्षसां क्षिप्रं प्रसन्ने मयि मानद"
    iast: "tena cemaṃ mahāprājñam abhiṣiñca vibhīṣaṇam | rājānaṃ rakṣasāṃ kṣipraṃ prasanne mayi mānada"
  - id: '6.13.9'
    kind: verse
    lines:
      - "एवमुक्तस्तु सौमित्रिरभ्यषिञ्चद्विभीषणम्"
      - "मध्ये वानरमुख्यानां राजानं रामशासनात्"
    iast: "evam uktas tu saumitrir abhyaṣiñcad vibhīṣaṇam | madhye vānaramukhyānāṃ rājānaṃ rāmaśāsanāt"
  - id: '6.14.2'
    kind: verse
    lines:
      - "न च दर्शयते मन्दस्तदा रामस्य सागरः"
      - "प्रयतेनापि रामेण यथार्हमभिपूजितः"
    iast: "na ca darśayate mandas tadā rāmasya sāgaraḥ | prayatenāpi rāmeṇa yathārham abhipūjitaḥ"
  - id: '6.14.3'
    kind: verse
    lines:
      - "समुद्रस्य ततः क्रुद्धो रामो रक्तान्तलोचनः"
      - "समीपस्थमुवाचेदं लक्ष्मणं शुभलक्ष्मणम्"
    iast: "samudrasya tataḥ kruddho rāmo raktāntalocanaḥ | samīpastham uvācedaṃ lakṣmaṇaṃ śubhalakṣmaṇam"
  - id: '6.14.12'
    kind: verse
    lines:
      - "चापमानय सौमित्रे शरांश्चाशीविषोपमान्"
      - "अद्याक्षोभ्यमपि क्रुद्धः क्षोभयिष्यामि सागरम्"
    iast: "cāpam ānaya saumitre śarāṃś cāśīviṣopamān | adyākṣobhyam api kruddhaḥ kṣobhayiṣyāmi sāgaram"
  - id: '6.15.1'
    kind: verse
    lines:
      - "ततो मध्यात्समुद्रस्य सागरः स्वयमुत्थितः"
      - "उदयन्हि महाशैलान्मेरोरिव दिवाकरः"
      - "पन्नगैः सह दीप्तास्यैः समुद्रः प्रत्यदृश्यत"
    iast: "tato madhyāt samudrasya sāgaraḥ svayam utthitaḥ | udayan hi mahāśailān meror iva divākaraḥ | pannagaiḥ saha dīptāsyaiḥ samudraḥ pratyadṛśyata"
  - id: '6.15.3'
    kind: verse
    lines:
      - "सागरः समतिक्रम्य पूर्वमामन्त्र्य वीर्यवान्"
      - "अब्रवीत्प्राञ्जलिर्वाक्यं राघवं शरपाणिनम्"
    iast: "sāgaraḥ samatikramya pūrvam āmantrya vīryavān | abravīt prāñjalir vākyaṃ rāghavaṃ śarapāṇinam"
  - id: '6.15.6'
    kind: verse
    lines:
      - "न कामान्न च लोभाद्वा न भयात्पार्थिवात्मज"
      - "ग्राहनक्राकुलजलं स्तम्भयेयं कथं चन"
    iast: "na kāmān na ca lobhād vā na bhayāt pārthivātmaja | grāhanakrākulajalaṃ stambhayeyaṃ kathaṃ cana"
  - id: '6.15.9'
    kind: verse
    lines:
      - "एष सेतुं महोत्साहः करोतु मयि वानरः"
      - "तमहं धारयिष्यामि तथा ह्येष यथा पिता"
    iast: "eṣa setuṃ mahotsāhaḥ karotu mayi vānaraḥ | tam ahaṃ dhārayiṣyāmi tathā hy eṣa yathā pitā"
  - id: '6.15.20'
    kind: verse
    lines:
      - "दशयोजनविस्तीर्णं शतयोजनमायतम्"
      - "नलश्चक्रे महासेतुं मध्ये नदनदीपतेः"
    iast: "daśayojanavistīrṇaṃ śatayojanam āyatam | nalaś cakre mahāsetuṃ madhye nadanadīpateḥ"
  - id: '6.31.48'
    kind: verse
    lines:
      - "राघवः संनिवेश्यैवं सैन्यं स्वं रक्षसां वधे"
      - "संमन्त्र्य मन्त्रिभिः सार्धं निश्चित्य च पुनः पुनः"
    iast: "rāghavaḥ saṃniveśyaivaṃ sainyaṃ svaṃ rakṣasāṃ vadhe | saṃmantrya mantribhiḥ sārdhaṃ niścitya ca punaḥ punaḥ"
  - id: '6.31.49'
    kind: verse
    lines:
      - "आनन्तर्यमभिप्रेप्सुः क्रमयोगार्थतत्त्ववित्"
      - "विभीषणस्यानुमते राजधर्ममनुस्मरन्"
      - "अङ्गदं वालितनयं समाहूयेदमब्रवीत्"
    iast: "ānantaryam abhiprepsuḥ kramayogārthatattvavit | vibhīṣaṇasyānumate rājadharmam anusmaran | aṅgadaṃ vālitanayaṃ samāhūyedam abravīt"
  - id: '6.31.55'
    kind: verse
    lines:
      - "बलेन येन वै सीतां मायया राक्षसाधम"
      - "मामतिक्रामयित्वा त्वं हृतवांस्तद्विदर्शय"
    iast: "balena yena vai sītāṃ māyayā rākṣasādhama | mām atikrāmayitvā tvaṃ hṛtavāṃs tad vidarśaya"
  - id: '6.31.56'
    kind: verse
    lines:
      - "अराक्षसमिमं लोकं कर्तास्मि निशितैः शरैः"
      - "न चेच्छरणमभ्येषि मामुपादाय मैथिलीम्"
    iast: "arākṣasam imaṃ lokaṃ kartāsmi niśitaiḥ śaraiḥ | na cec charaṇam abhyeṣi mām upādāya maithilīm"
  - id: '6.31.57'
    kind: verse
    lines:
      - "धर्मात्मा रक्षसां श्रेष्ठः संप्राप्तोऽयं विभीषणः"
      - "लङ्कैश्वर्यं ध्रुवं श्रीमानयं प्राप्नोत्यकण्टकम्"
    iast: "dharmātmā rakṣasāṃ śreṣṭhaḥ saṃprāpto 'yaṃ vibhīṣaṇaḥ | laṅkaiśvaryaṃ dhruvaṃ śrīmān ayaṃ prāpnoty akaṇṭakam"
  - id: '6.31.58'
    kind: verse
    lines:
      - "न हि राज्यमधर्मेण भोक्तुं क्षणमपि त्वया"
      - "शक्यं मूर्खसहायेन पापेनाविजितात्मना"
    iast: "na hi rājyam adharmeṇa bhoktuṃ kṣaṇam api tvayā | śakyaṃ mūrkhasahāyena pāpenāvijitātmanā"
  - id: '6.31.60'
    kind: verse
    lines:
      - "यद्याविशसि लोकांस्त्रीन्पक्षिभूतो मनोजवः"
      - "मम चक्षुष्पथं प्राप्य न जीवन्प्रतियास्यसि"
    iast: "yady āviśasi lokāṃs trīn pakṣibhūto manojavaḥ | mama cakṣuṣpathaṃ prāpya na jīvan pratiyāsyasi"
  - id: '6.31.65'
    kind: verse
    lines:
      - "तद्रामवचनं सर्वमन्यूनाधिकमुत्तमम्"
      - "सामात्यं श्रावयामास निवेद्यात्मानमात्मना"
    iast: "tad rāmavacanaṃ sarvam anyūnādhikam uttamam | sāmātyaṃ śrāvayām āsa nivedyātmānam ātmanā"
  - id: '6.31.71'
    kind: verse
    lines:
      - "इत्येवं परुषं वाक्यं ब्रुवाणे हरिपुंगवे"
      - "अमर्षवशमापन्नो निशाचरगणेश्वरः"
    iast: "ity evaṃ paruṣaṃ vākyaṃ bruvāṇe haripuṃgave | amarṣavaśam āpanno niśācaragaṇeśvaraḥ"
  - id: '6.32.25'
    kind: verse
    lines:
      - "ततः कोपपरीतात्मा रावणो राक्षसेश्वरः"
      - "निर्याणं सर्वसैन्यानां द्रुतमाज्ञापयत्तदा"
    iast: "tataḥ kopaparītātmā rāvaṇo rākṣaseśvaraḥ | niryāṇaṃ sarvasainyānāṃ drutam ājñāpayat tadā"
  - id: '6.34.27'
    kind: verse
    lines:
      - "अङ्गदस्तु रणे शत्रुं निहन्तुं समुपस्थितः"
      - "रावणेर्निजघानाशु सारथिं च हयानपि"
    iast: "aṅgadas tu raṇe śatruṃ nihantuṃ samupasthitaḥ | rāvaṇer nijaghānāśu sārathiṃ ca hayān api"
  - id: '6.34.28'
    kind: verse
    lines:
      - "इन्द्रजित्तु रथं त्यक्त्वा हताश्वो हतसारथिः"
      - "अङ्गदेन महामायस्तत्रैवान्तरधीयत"
    iast: "indrajit tu rathaṃ tyaktvā hatāśvo hatasārathiḥ | aṅgadena mahāmāyas tatraivāntaradhīyata"
  - id: '6.34.30'
    kind: verse
    lines:
      - "स रामं लक्ष्मणं चैव घोरैर्नागमयैः शरैः"
      - "बिभेद समरे क्रुद्धः सर्वगात्रेषु राक्षसः"
    iast: "sa rāmaṃ lakṣmaṇaṃ caiva ghorair nāgamayaiḥ śaraiḥ | bibheda samare kruddhaḥ sarvagātreṣu rākṣasaḥ"
  - id: '6.37.1'
    kind: verse
    lines:
      - "प्रतिप्रविष्टे लङ्कां तु कृतार्थे रावणात्मजे"
      - "राघवं परिवार्यार्ता ररक्षुर्वानरर्षभाः"
    iast: "pratipraviṣṭe laṅkāṃ tu kṛtārthe rāvaṇātmaje | rāghavaṃ parivāryārtā rarakṣur vānararṣabhāḥ"
  - id: '6.40.36'
    kind: verse
    lines:
      - "ततो मुहूर्तद्गरुडं वैनतेयं महाबलम्"
      - "वानरा ददृशुः सर्वे ज्वलन्तमिव पावकम्"
    iast: "tato muhūrtad garuḍaṃ vainateyaṃ mahābalam | vānarā dadṛśuḥ sarve jvalantam iva pāvakam"
  - id: '6.40.37'
    kind: verse
    lines:
      - "तमागतमभिप्रेक्ष्य नागास्ते विप्रदुद्रुवुः"
      - "यैस्तौ सत्पुरुषौ बद्धौ शरभूतैर्महाबलौ"
    iast: "tam āgatam abhiprekṣya nāgās te vipradudruvuḥ | yais tau satpuruṣau baddhau śarabhūtair mahābalau"
  - id: '6.40.45'
    kind: verse
    lines:
      - "तमुवाच महातेजा वैनतेयो महाबलः"
      - "पतत्रिराजः प्रीतात्मा हर्षपर्याकुलेक्षणः"
    iast: "tam uvāca mahātejā vainateyo mahābalaḥ | patatrirājaḥ prītātmā harṣaparyākulekṣaṇaḥ"
  - id: '6.40.46'
    kind: verse
    lines:
      - "अहं सखा ते काकुत्स्थ प्रियः प्राणो बहिश्चरः"
      - "गरुत्मानिह संप्राप्तो युवयोः साह्यकारणात्"
    iast: "ahaṃ sakhā te kākutstha priyaḥ prāṇo bahiścaraḥ | garutmān iha saṃprāpto yuvayoḥ sāhyakāraṇāt"
  - id: '6.40.54'
    kind: verse
    lines:
      - "तन्न विश्वसितव्यं वो राक्षसानां रणाजिरे"
      - "एतेनैवोपमानेन नित्यजिह्मा हि राक्षसाः"
    iast: "tan na viśvasitavyaṃ vo rākṣasānāṃ raṇājire | etenaivopamānena nityajihmā hi rākṣasāḥ"
  - id: '6.40.59'
    kind: verse
    lines:
      - "प्रदक्षिणं ततः कृत्वा परिष्वज्य च वीर्यवान्"
      - "जगामाकाशमाविश्य सुपर्णः पवनो यथा"
    iast: "pradakṣiṇaṃ tataḥ kṛtvā pariṣvajya ca vīryavān | jagāmākāśam āviśya suparṇaḥ pavano yathā"
  - id: '6.40.60'
    kind: verse
    lines:
      - "विरुजौ राघवौ दृष्ट्वा ततो वानरयूथपाः"
      - "सिंहनादांस्तदा नेदुर्लाङ्गूलं दुधुवुश्च ते"
    iast: "virujau rāghavau dṛṣṭvā tato vānarayūthapāḥ | siṃhanādāṃs tadā nedur lāṅgūlaṃ dudhuvuś ca te"
  - id: '6.40.61'
    kind: verse
    lines:
      - "ततो भेरीः समाजघ्नुर्मृदङ्गांश्च व्यनादयन्"
      - "दध्मुः शङ्खान्संप्रहृष्टाः क्ष्वेलन्त्यपि यथापुरम्"
    iast: "tato bherīḥ samājaghnur mṛdaṅgāṃś ca vyanādayan | dadhmuḥ śaṅkhān saṃprahṛṣṭāḥ kṣvelanty api yathāpuram"
  - id: '6.41.2'
    kind: verse
    lines:
      - "स्निग्धगम्भीरनिर्घोषं श्रुत्वा स निनदं भृशम्"
      - "सचिवानां ततस्तेषां मध्ये वचनमब्रवीत्"
    iast: "snigdhagambhīranirghoṣaṃ śrutvā sa ninadaṃ bhṛśam | sacivānāṃ tatas teṣāṃ madhye vacanam abravīt"
  - id: '6.41.5'
    kind: verse
    lines:
      - "तौ तु बद्धौ शरैस्तीष्क्णैर्भ्रातरौ रामलक्ष्मणौ"
      - "अयं च सुमहान्नादः शङ्कां जनयतीव मे"
    iast: "tau tu baddhau śarais tīṣkṇair bhrātarau rāmalakṣmaṇau | ayaṃ ca sumahān nādaḥ śaṅkāṃ janayatīva me"
  - id: '6.41.16'
    kind: verse
    lines:
      - "तमस्त्रबन्धमासाद्य यदि मुक्तौ रिपू मम"
      - "संशयस्थमिदं सर्वमनुपश्याम्यहं बलम्"
    iast: "tam astrabandham āsādya yadi muktau ripū mama | saṃśayastham idaṃ sarvam anupaśyāmy ahaṃ balam"
  - id: '6.48.13'
    kind: verse
    lines:
      - "स हि संख्ये महाबाहुः ककुदं सर्वरक्षसाम्"
      - "वानरान्राजपुत्रौ च क्षिप्रमेव वधिष्यति"
    iast: "sa hi saṃkhye mahābāhuḥ kakudaṃ sarvarakṣasām | vānarān rājaputrau ca kṣipram eva vadhiṣyati"
  - id: '6.48.17'
    kind: verse
    lines:
      - "जग्मुः परमसंभ्रान्ताः कुम्भकर्णनिवेशनम्"
      - "ते रावणसमादिष्टा मांसशोणितभोजनाः"
    iast: "jagmuḥ paramasaṃbhrāntāḥ kumbhakarṇaniveśanam | te rāvaṇasamādiṣṭā māṃsaśoṇitabhojanāḥ"
  - id: '6.48.21'
    kind: verse
    lines:
      - "ते तु तं विकृतं सुप्तं विकीर्णमिव पर्वतम्"
      - "कुम्भकर्णं महानिद्रं सहिताः प्रत्यबोधयन्"
    iast: "te tu taṃ vikṛtaṃ suptaṃ vikīrṇam iva parvatam | kumbhakarṇaṃ mahānidraṃ sahitāḥ pratyabodhayan"
  - id: '6.48.51'
    kind: verse
    lines:
      - "विजृम्भमाणोऽतिबलः प्रतिबुद्धो निशाचरः"
      - "निश्वासश्चास्य संजज्ञे पर्वतादिव मारुतः"
    iast: "vijṛmbhamāṇo 'tibalaḥ pratibuddho niśācaraḥ | niśvāsaś cāsya saṃjajñe parvatād iva mārutaḥ"
  - id: '6.50.7'
    kind: verse
    lines:
      - "अथासीनस्य पर्यङ्के कुम्भकर्णो महाबलः"
      - "भ्रातुर्ववन्दे चरणां किं कृत्यमिति चाब्रवीत्"
      - "उत्पत्य चैनं मुदितो रावणः परिषस्वजे"
    iast: "athāsīnasya paryaṅke kumbhakarṇo mahābalaḥ | bhrātur vavande caraṇāṃ kiṃ kṛtyam iti cābravīt | utpatya cainaṃ mudito rāvaṇaḥ pariṣasvaje"
  - id: '6.50.11'
    kind: verse
    lines:
      - "भ्रातरं रावणः क्रुद्धं कुम्भकर्णमवस्थितम्"
      - "ईषत्तु परिवृत्ताभ्यां नेत्राभ्यां वाक्यमब्रवीत्"
    iast: "bhrātaraṃ rāvaṇaḥ kruddhaṃ kumbhakarṇam avasthitam | īṣat tu parivṛttābhyāṃ netrābhyāṃ vākyam abravīt"
  - id: '6.50.13'
    kind: verse
    lines:
      - "एष दाशरथी रामः सुग्रीवसहितो बली"
      - "समुद्रं सबलस्तीर्त्वा मूलं नः परिकृन्तति"
    iast: "eṣa dāśarathī rāmaḥ sugrīvasahito balī | samudraṃ sabalas tīrtvā mūlaṃ naḥ parikṛntati"
  - id: '6.50.16'
    kind: verse
    lines:
      - "सर्वक्षपितकोशं च स त्वमभ्यवपद्य माम्"
      - "त्रायस्वेमां पुरीं लङ्कां बालवृद्धावशेषिताम्"
    iast: "sarvakṣapitakośaṃ ca sa tvam abhyavapadya mām | trāyasvemāṃ purīṃ laṅkāṃ bālavṛddhāvaśeṣitām"
  - id: '6.51.1'
    kind: verse
    lines:
      - "तस्य राक्षसराजस्य निशम्य परिदेवितम्"
      - "कुम्भकर्णो बभाषेऽथ वचनं प्रजहास च"
    iast: "tasya rākṣasarājasya niśamya paridevitam | kumbhakarṇo babhāṣe 'tha vacanaṃ prajahāsa ca"
  - id: '6.51.2'
    kind: verse
    lines:
      - "दृष्टो दोषो हि योऽस्माभिः पुरा मन्त्रविनिर्णये"
      - "हितेष्वनभियुक्तेन सोऽयमासादितस्त्वया"
    iast: "dṛṣṭo doṣo hi yo 'smābhiḥ purā mantravinirṇaye | hiteṣv anabhiyuktena so 'yam āsāditas tvayā"
  - id: '6.51.21'
    kind: verse
    lines:
      - "तत्तु श्रुत्वा दशग्रीवः कुम्भकर्णस्य भाषितम्"
      - "भ्रुकुटिं चैव संचक्रे क्रुद्धश्चैनमुवाच ह"
    iast: "tat tu śrutvā daśagrīvaḥ kumbhakarṇasya bhāṣitam | bhrukuṭiṃ caiva saṃcakre kruddhaś cainam uvāca ha"
  - id: '6.51.22'
    kind: verse
    lines:
      - "मान्यो गुरुरिवाचार्यः किं मां त्वमनुशासति"
      - "किमेवं वाक्श्रमं कृत्वा काले युक्तं विधीयताम्"
    iast: "mānyo gurur ivācāryaḥ kiṃ māṃ tvam anuśāsati | kim evaṃ vākśramaṃ kṛtvā kāle yuktaṃ vidhīyatām"
  - id: '6.51.24'
    kind: verse
    lines:
      - "अस्मिन्काले तु यद्युक्तं तदिदानीं विधीयताम्"
      - "ममापनयजं दोषं विक्रमेण समीकुरु"
    iast: "asmin kāle tu yad yuktaṃ tad idānīṃ vidhīyatām | mamāpanayajaṃ doṣaṃ vikrameṇa samīkuru"
  - id: '6.51.25'
    kind: verse
    lines:
      - "यदि खल्वस्ति मे स्नेहो भ्रातृत्वं वावगच्छसि"
      - "यदि वा कार्यमेतत्ते हृदि कार्यतमं मतम्"
    iast: "yadi khalv asti me sneho bhrātṛtvaṃ vāvagacchasi | yadi vā kāryam etat te hṛdi kāryatamaṃ matam"
  - id: '6.51.28'
    kind: verse
    lines:
      - "अतीव हि समालक्ष्य भ्रातरं क्षुभितेन्द्रियम्"
      - "कुम्भकर्णः शनैर्वाक्यं बभाषे परिसान्त्वयन्"
    iast: "atīva hi samālakṣya bhrātaraṃ kṣubhitendriyam | kumbhakarṇaḥ śanair vākyaṃ babhāṣe parisāntvayan"
  - id: '6.51.29'
    kind: verse
    lines:
      - "अलं राक्षसराजेन्द्र संतापमुपपद्य ते"
      - "रोषं च संपरित्यज्य स्वस्थो भवितुमर्हसि"
    iast: "alaṃ rākṣasarājendra saṃtāpam upapadya te | roṣaṃ ca saṃparityajya svastho bhavitum arhasi"
  - id: '6.51.30'
    kind: verse
    lines:
      - "नैतन्मनसि कर्तव्व्यं मयि जीवति पार्थिव"
      - "तमहं नाशयिष्यामि यत्कृते परितप्यसे"
    iast: "naitan manasi kartavvyaṃ mayi jīvati pārthiva | tam ahaṃ nāśayiṣyāmi yatkṛte paritapyase"
  - id: '6.51.34'
    kind: verse
    lines:
      - "अद्य रामस्य तद्दृष्ट्वा मयानीतं रणाच्छिरः"
      - "सुखीभव महाबाहो सीता भवतु दुःखिता"
    iast: "adya rāmasya tad dṛṣṭvā mayānītaṃ raṇāc chiraḥ | sukhībhava mahābāho sītā bhavatu duḥkhitā"
  - id: '6.53.39'
    kind: verse
    lines:
      - "एवं तस्य ब्रुवाणस्य कुम्भकर्णस्य राक्षसाः"
      - "नादं चक्रुर्महाघोरं कम्पयन्त इवार्णवम्"
    iast: "evaṃ tasya bruvāṇasya kumbhakarṇasya rākṣasāḥ | nādaṃ cakrur mahāghoraṃ kampayanta ivārṇavam"
  - id: '6.55.4'
    kind: verse
    lines:
      - "अथ वृक्षान्महाकायाः सानूनि सुमहान्ति च"
      - "वानरास्तूर्णमुद्यम्य कुम्भकर्णमभिद्रवन्"
    iast: "atha vṛkṣān mahākāyāḥ sānūni sumahānti ca | vānarās tūrṇam udyamya kumbhakarṇam abhidravan"
  - id: '6.55.5'
    kind: verse
    lines:
      - "स कुम्भकर्णः संक्रुद्धो गदामुद्यम्य वीर्यवान्"
      - "अर्दयन्सुमहाकायः समन्ताद्व्याक्षिपद्रिपून्"
    iast: "sa kumbhakarṇaḥ saṃkruddho gadām udyamya vīryavān | ardayan sumahākāyaḥ samantād vyākṣipad ripūn"
  - id: '6.55.78'
    kind: verse
    lines:
      - "अथ दाशरथी रामो रौद्रमस्त्रं प्रयोजयन्"
      - "कुम्भकर्णस्य हृदये ससर्ज निशिताञ्शरान्"
    iast: "atha dāśarathī rāmo raudram astraṃ prayojayan | kumbhakarṇasya hṛdaye sasarja niśitāñ śarān"
  - id: '6.55.79'
    kind: verse
    lines:
      - "तस्य रामेण विद्धस्य सहसाभिप्रधावतः"
      - "अङ्गारमिश्राः क्रुद्धस्य मुखान्निश्चेरुरर्चिषः"
    iast: "tasya rāmeṇa viddhasya sahasābhipradhāvataḥ | aṅgāramiśrāḥ kruddhasya mukhān niścerur arciṣaḥ"
  - id: '6.56.1'
    kind: verse
    lines:
      - "कुम्भकर्णं हतं दृष्ट्वा राघवेण महात्मना"
      - "राक्षसा राक्षसेन्द्राय रावणाय न्यवेदयन्"
    iast: "kumbhakarṇaṃ hataṃ dṛṣṭvā rāghaveṇa mahātmanā | rākṣasā rākṣasendrāya rāvaṇāya nyavedayan"
  - id: '6.56.15'
    kind: verse
    lines:
      - "देवा हि मां हसिष्यन्ति दृष्ट्वा पूर्वापकारिणम्"
      - "कथमिन्द्रं जयिष्यामि कुम्भकर्णहते त्वयि"
    iast: "devā hi māṃ hasiṣyanti dṛṣṭvā pūrvāpakāriṇam | katham indraṃ jayiṣyāmi kumbhakarṇahate tvayi"
  - id: '6.56.16'
    kind: verse
    lines:
      - "तदिदं मामनुप्राप्तं विभीषणवचः शुभम्"
      - "यदज्ञानान्मया तस्य न गृहीतं महात्मनः"
    iast: "tad idaṃ mām anuprāptaṃ vibhīṣaṇavacaḥ śubham | yad ajñānān mayā tasya na gṛhītaṃ mahātmanaḥ"
  - id: '6.56.18'
    kind: verse
    lines:
      - "तस्यायं कर्मणः प्रातो विपाको मम शोकदः"
      - "यन्मया धार्मिकः श्रीमान्स निरस्तो विभीषणः"
    iast: "tasyāyaṃ karmaṇaḥ prāto vipāko mama śokadaḥ | yan mayā dhārmikaḥ śrīmān sa nirasto vibhīṣaṇaḥ"
  - id: '6.67.1'
    kind: verse
    lines:
      - "मकराक्षं हतं श्रुत्वा रावणः समितिंजयः"
      - "आदिदेशाथ संक्रुद्धो रणायेन्द्रजितं सुतम्"
    iast: "makarākṣaṃ hataṃ śrutvā rāvaṇaḥ samitiṃjayaḥ | ādideśātha saṃkruddho raṇāyendrajitaṃ sutam"
  - id: '6.67.2'
    kind: verse
    lines:
      - "जहि वीर महावीर्यौ भ्रातरौ रामलक्ष्मणौ"
      - "अदृश्यो दृश्यमानो वा सर्वथा त्वं बलाधिकः"
    iast: "jahi vīra mahāvīryau bhrātarau rāmalakṣmaṇau | adṛśyo dṛśyamāno vā sarvathā tvaṃ balādhikaḥ"
  - id: '6.67.4'
    kind: verse
    lines:
      - "तथोक्तो राक्षसेन्द्रेण प्रतिगृह्य पितुर्वचः"
      - "यज्ञभूमौ स विधिवत्पावकं जुहुवे न्द्रजित्"
    iast: "tathokto rākṣasendreṇa pratigṛhya pitur vacaḥ | yajñabhūmau sa vidhivat pāvakaṃ juhuve ndrajit"
  - id: '6.72.18'
    kind: verse
    lines:
      - "राघवस्तु रिपोर्ज्ञात्वा मायावीर्यं दुरात्मनः"
      - "लक्ष्मणं कीर्तिसंपन्नमिदं वचनमब्रवीत्"
    iast: "rāghavas tu ripor jñātvā māyāvīryaṃ durātmanaḥ | lakṣmaṇaṃ kīrtisaṃpannam idaṃ vacanam abravīt"
  - id: '6.72.20'
    kind: verse
    lines:
      - "जाम्बवेनर्क्षपतिना सह सैन्येन संवृतः"
      - "जहि तं राक्षससुतं मायाबलविशारदम्"
    iast: "jāmbavenarkṣapatinā saha sainyena saṃvṛtaḥ | jahi taṃ rākṣasasutaṃ māyābalaviśāradam"
  - id: '6.72.21'
    kind: verse
    lines:
      - "अयं त्वां सचिवैः सार्धं महात्मा रजनीचरः"
      - "अभिज्ञस्तस्य देशस्य पृष्ठतोऽनुगमिष्यति"
    iast: "ayaṃ tvāṃ sacivaiḥ sārdhaṃ mahātmā rajanīcaraḥ | abhijñas tasya deśasya pṛṣṭhato 'nugamiṣyati"
  - id: '6.72.27'
    kind: verse
    lines:
      - "सोऽभिवाद्य गुरोः पादौ कृत्वा चापि प्रदक्षिणम्"
      - "निकुम्भिलामभिययौ चैत्यं रावणिपालितम्"
    iast: "so 'bhivādya guroḥ pādau kṛtvā cāpi pradakṣiṇam | nikumbhilām abhiyayau caityaṃ rāvaṇipālitam"
  - id: '6.73.5'
    kind: verse
    lines:
      - "विभीषणवचः श्रुत्वा लक्ष्मणः शुभलक्षणः"
      - "ववर्ष शरवर्षाणि राक्षसेन्द्रसुतं प्रति"
    iast: "vibhīṣaṇavacaḥ śrutvā lakṣmaṇaḥ śubhalakṣaṇaḥ | vavarṣa śaravarṣāṇi rākṣasendrasutaṃ prati"
  - id: '6.78.21'
    kind: verse
    lines:
      - "तयोः सुतुमुलं युद्धं संबभूवाद्भुतोपमम्"
      - "गगनस्थानि भूतानि लक्ष्मणं पर्यवारयन्"
    iast: "tayoḥ sutumulaṃ yuddhaṃ saṃbabhūvādbhutopamam | gaganasthāni bhūtāni lakṣmaṇaṃ paryavārayan"
  - id: '6.78.30'
    kind: verse
    lines:
      - "संधाय धनुषि श्रेष्ठे विकर्षन्निदमब्रवीत्"
      - "लक्ष्मीवांल्लक्ष्मणो वाक्यमर्थसाधकमात्मनः"
    iast: "saṃdhāya dhanuṣi śreṣṭhe vikarṣann idam abravīt | lakṣmīvāṃl lakṣmaṇo vākyam arthasādhakam ātmanaḥ"
  - id: '6.78.31'
    kind: verse
    lines:
      - "धर्मात्मा सत्यसंधश्च रामो दाशरथिर्यदि"
      - "पौरुषे चाप्रतिद्वन्द्वस्तदेनं जहि रावणिम्"
    iast: "dharmātmā satyasaṃdhaś ca rāmo dāśarathir yadi | pauruṣe cāpratidvandvas tad enaṃ jahi rāvaṇim"
  - id: '6.78.32'
    kind: verse
    lines:
      - "इत्युक्त्वा बाणमाकर्णं विकृष्य तमजिह्मगम्"
      - "लक्ष्मणः समरे वीरः ससर्जेन्द्रजितं प्रति"
      - "ऐन्द्रास्त्रेण समायुज्य लक्ष्मणः परवीरहा"
    iast: "ity uktvā bāṇam ākarṇaṃ vikṛṣya tam ajihmagam | lakṣmaṇaḥ samare vīraḥ sasarjendrajitaṃ prati | aindrāstreṇa samāyujya lakṣmaṇaḥ paravīrahā"
  - id: '6.78.33'
    kind: verse
    lines:
      - "तच्छिरः सशिरस्त्राणं श्रीमज्ज्वलितकुण्डलम्"
      - "प्रमथ्येन्द्रजितः कायात्पपात धरणीतले"
    iast: "tac chiraḥ saśiras trāṇaṃ śrīmaj jvalitakuṇḍalam | pramathyendrajitaḥ kāyāt papāta dharaṇītale"
  - id: '6.79.5'
    kind: verse
    lines:
      - "रावणस्तु शिरश्छिन्नं लक्ष्मणेन महात्मना"
      - "न्यवेदयत रामाय तदा हृष्टो विभीषणः"
    iast: "rāvaṇas tu śiraś chinnaṃ lakṣmaṇena mahātmanā | nyavedayata rāmāya tadā hṛṣṭo vibhīṣaṇaḥ"
  - id: '6.80.1'
    kind: verse
    lines:
      - "ततः पौलस्त्य सचिवाः श्रुत्वा चेन्द्रजितं हतम्"
      - "आचचक्षुरभिज्ञाय दशग्रीवाय सव्यथाः"
    iast: "tataḥ paulastya sacivāḥ śrutvā cendrajitaṃ hatam | ācacakṣur abhijñāya daśagrīvāya savyathāḥ"
  - id: '6.80.4'
    kind: verse
    lines:
      - "स तं प्रतिभयं श्रुत्वा वधं पुत्रस्य दारुणम्"
      - "घोरमिन्द्रजितः संख्ये कश्मलं प्राविशन्महत्"
    iast: "sa taṃ pratibhayaṃ śrutvā vadhaṃ putrasya dāruṇam | ghoram indrajitaḥ saṃkhye kaśmalaṃ prāviśan mahat"
  - id: '6.80.5'
    kind: verse
    lines:
      - "उपलभ्य चिरात्संज्ञां राजा राक्षसपुंगवः"
      - "पुत्रशोकार्दितो दीनो विललापाकुलेन्द्रियः"
    iast: "upalabhya cirāt saṃjñāṃ rājā rākṣasapuṃgavaḥ | putraśokārdito dīno vilalāpākulendriyaḥ"
  - id: '6.80.6'
    kind: verse
    lines:
      - "हा राक्षसचमूमुख्य मम वत्स महारथ"
      - "जित्वेन्द्रं कथमद्य त्वं लक्ष्मणस्य वशं गतः"
    iast: "hā rākṣasacamūmukhya mama vatsa mahāratha | jitvendraṃ katham adya tvaṃ lakṣmaṇasya vaśaṃ gataḥ"
  - id: '6.80.8'
    kind: verse
    lines:
      - "अद्य वैवस्वतो राजा भूयो बहुमतो मम"
      - "येनाद्य त्वं महाबाहो संयुक्तः कालधर्मणा"
    iast: "adya vaivasvato rājā bhūyo bahumato mama | yenādya tvaṃ mahābāho saṃyuktaḥ kāladharmaṇā"
  - id: '6.80.11'
    kind: verse
    lines:
      - "अद्य लोकास्त्रयः कृत्स्नाः पृथिवी च सकानना"
      - "एकेनेन्द्रजिता हीना शूण्येव प्रतिभाति मे"
    iast: "adya lokās trayaḥ kṛtsnāḥ pṛthivī ca sakānanā | ekenendrajitā hīnā śūṇyeva pratibhāti me"
  - id: '6.80.13'
    kind: verse
    lines:
      - "यौवराज्यं च लङ्कां च रक्षांसि च परंतप"
      - "मातरं मां च भार्यां च क्व गतोऽसि विहाय नः"
    iast: "yauvarājyaṃ ca laṅkāṃ ca rakṣāṃsi ca paraṃtapa | mātaraṃ māṃ ca bhāryāṃ ca kva gato 'si vihāya naḥ"
  - id: '6.80.14'
    kind: verse
    lines:
      - "मम नाम त्वया वीर गतस्य यमसादनम्"
      - "प्रेतकार्याणि कार्याणि विपरीते हि वर्तसे"
    iast: "mama nāma tvayā vīra gatasya yamasādanam | pretakāryāṇi kāryāṇi viparīte hi vartase"
  - id: '6.80.16'
    kind: verse
    lines:
      - "एवमादिविलापार्तं रावणं राक्षसाधिपम्"
      - "आविवेश महान्कोपः पुत्रव्यसनसंभवः"
    iast: "evamādivilāpārtaṃ rāvaṇaṃ rākṣasādhipam | āviveśa mahān kopaḥ putravyasanasaṃbhavaḥ"
  - id: '6.83.30'
    kind: verse
    lines:
      - "ततो युद्धाय तेजस्वी रक्षोगणबलैर्वृतः"
      - "निर्ययावुद्यतधनुः कालान्तकयमोमपः"
    iast: "tato yuddhāya tejasvī rakṣogaṇabalair vṛtaḥ | niryayāv udyatadhanuḥ kālāntakayamomapaḥ"
  - id: '6.83.31'
    kind: verse
    lines:
      - "ततः प्रजवनाश्वेन रथेन स महारथः"
      - "द्वारेण निर्ययौ तेन यत्र तौ रामलक्ष्मणौ"
    iast: "tataḥ prajavanāśvena rathena sa mahārathaḥ | dvāreṇa niryayau tena yatra tau rāmalakṣmaṇau"
  - id: '6.87.13'
    kind: verse
    lines:
      - "तयोः शरपथं प्राप्य रावणो राजपुत्रयोः"
      - "स बभूव यथा राहुः समीपे शशिसूर्ययोः"
    iast: "tayoḥ śarapathaṃ prāpya rāvaṇo rājaputrayoḥ | sa babhūva yathā rāhuḥ samīpe śaśisūryayoḥ"
  - id: '6.88.27'
    kind: verse
    lines:
      - "मोक्षितं भ्रातरं दृष्ट्वा लक्ष्मणेन स रावणः"
      - "लक्ष्मणाभिमुखस्तिष्ठन्निदं वचनमब्रवीत्"
    iast: "mokṣitaṃ bhrātaraṃ dṛṣṭvā lakṣmaṇena sa rāvaṇaḥ | lakṣmaṇābhimukhas tiṣṭhann idaṃ vacanam abravīt"
  - id: '6.88.30'
    kind: verse
    lines:
      - "इत्येवमुक्त्वा तां शक्तिमष्टघण्टां महास्वनाम्"
      - "मयेन मायाविहिताममोघां शत्रुघातिनीम्"
    iast: "ity evam uktvā tāṃ śaktim aṣṭaghaṇṭāṃ mahāsvanām | mayena māyāvihitām amoghāṃ śatrughātinīm"
  - id: '6.88.35'
    kind: verse
    lines:
      - "ततो रावणवेगेन सुदूरमवगाढया"
      - "शक्त्या निर्भिन्नहृदयः पपात भुवि लक्ष्मणः"
    iast: "tato rāvaṇavegena sudūram avagāḍhayā | śaktyā nirbhinnahṛdayaḥ papāta bhuvi lakṣmaṇaḥ"
  - id: '6.89.4'
    kind: verse
    lines:
      - "अयं स समरश्लाघी भ्राता मे शुभलक्षणः"
      - "यदि पञ्चत्वमापन्नः प्राणैर्मे किं सुखेन वा"
    iast: "ayaṃ sa samaraślāghī bhrātā me śubhalakṣaṇaḥ | yadi pañcatvam āpannaḥ prāṇair me kiṃ sukhena vā"
  - id: '6.89.7'
    kind: verse
    lines:
      - "न हि युद्धेन मे कार्यं नैव प्राणैर्न सीतया"
      - "भ्रातरं निहतं दृष्ट्वा लक्ष्मणं रणपांसुषु"
    iast: "na hi yuddhena me kāryaṃ naiva prāṇair na sītayā | bhrātaraṃ nihataṃ dṛṣṭvā lakṣmaṇaṃ raṇapāṃsuṣu"
  - id: '6.89.13'
    kind: verse
    lines:
      - "एवमुक्त्वा तु वाक्यज्ञः सुषेणो राघवं वचः"
      - "समीपस्थमुवाचेदं हनूमन्तमभित्वरन्"
    iast: "evam uktvā tu vākyajñaḥ suṣeṇo rāghavaṃ vacaḥ | samīpastham uvācedaṃ hanūmantam abhitvaran"
  - id: '6.89.14'
    kind: verse
    lines:
      - "सौम्य शीघ्रमितो गत्वा शैलमोषधिपर्वतम्"
      - "पूर्वं हि कथितो योऽसौ वीर जाम्बवता शुभः"
    iast: "saumya śīghram ito gatvā śailam oṣadhiparvatam | pūrvaṃ hi kathito yo 'sau vīra jāmbavatā śubhaḥ"
  - id: '6.89.15'
    kind: verse
    lines:
      - "दक्षिणे शिखरे तस्य जातामोषधिमानय"
      - "विशल्यकरणी नाम विशल्यकरणीं शुभाम्"
    iast: "dakṣiṇe śikhare tasya jātām oṣadhim ānaya | viśalyakaraṇī nāma viśalyakaraṇīṃ śubhām"
  - id: '6.89.16'
    kind: verse
    lines:
      - "सौवर्णकरणीं चापि तथा संजीवनीमपि"
      - "संधानकरणीं चापि गत्वा शीघ्रमिहानय"
      - "संजीवनार्थं वीरस्य लक्ष्मणस्य महात्मनः"
    iast: "sauvarṇakaraṇīṃ cāpi tathā saṃjīvanīm api | saṃdhānakaraṇīṃ cāpi gatvā śīghram ihānaya | saṃjīvanārthaṃ vīrasya lakṣmaṇasya mahātmanaḥ"
  - id: '6.89.17'
    kind: verse
    lines:
      - "इत्येवमुक्तो हनुमान्गत्वा चौषधिपर्वतम्"
      - "चिन्तामभ्यगमच्छ्रीमानजानंस्ता महौषधीः"
    iast: "ity evam ukto hanumān gatvā cauṣadhiparvatam | cintām abhyagamac chrīmān ajānaṃs tā mahauṣadhīḥ"
  - id: '6.89.22'
    kind: verse
    lines:
      - "एवं कथयमानं तं प्रशस्य पवनात्मजम्"
      - "सुषेणो वानरश्रेष्ठो जग्राहोत्पाट्य चौषधीः"
    iast: "evaṃ kathayamānaṃ taṃ praśasya pavanātmajam | suṣeṇo vānaraśreṣṭho jagrāhotpāṭya cauṣadhīḥ"
  - id: '6.89.23'
    kind: verse
    lines:
      - "ततः संक्षोदयित्वा तामोषधिं वानरोत्तमः"
      - "लक्ष्मणस्य ददौ नस्तः सुषेणः सुमहाद्युतिः"
    iast: "tataḥ saṃkṣodayitvā tām oṣadhiṃ vānarottamaḥ | lakṣmaṇasya dadau nastaḥ suṣeṇaḥ sumahādyutiḥ"
  - id: '6.89.24'
    kind: verse
    lines:
      - "सशल्यः स समाघ्राय लक्ष्मणः परवीरहा"
      - "विशल्यो विरुजः शीघ्रमुदतिष्ठन्महीतलात्"
    iast: "saśalyaḥ sa samāghrāya lakṣmaṇaḥ paravīrahā | viśalyo virujaḥ śīghram udatiṣṭhan mahītalāt"
  - id: '6.89.28'
    kind: verse
    lines:
      - "न हि मे जीवितेनार्थः सीतया च जयेन वा"
      - "को हि मे जीवितेनार्थस्त्वयि पञ्चत्वमागते"
    iast: "na hi me jīvitenārthaḥ sītayā ca jayena vā | ko hi me jīvitenārthas tvayi pañcatvam āgate"
  - id: '6.89.29'
    kind: verse
    lines:
      - "इत्येवं वदतस्तस्य राघवस्य महात्मनः"
      - "खिन्नः शिथिलया वाचा लक्ष्मणो वाक्यमब्रवीत्"
    iast: "ity evaṃ vadatas tasya rāghavasya mahātmanaḥ | khinnaḥ śithilayā vācā lakṣmaṇo vākyam abravīt"
  - id: '6.89.32'
    kind: verse
    lines:
      - "नैराश्यमुपगन्तुं ते तदलं मत्कृतेऽनघ"
      - "वधेन रावणस्याद्य प्रतिज्ञामनुपालय"
    iast: "nairāśyam upagantuṃ te tad alaṃ matkṛte 'nagha | vadhena rāvaṇasyādya pratijñām anupālaya"
  - id: '6.90.1'
    kind: verse
    lines:
      - "लक्ष्मणेन तु तद्वाक्यमुक्तं श्रुत्वा स राघवः"
      - "रावणाय शरान्घोरान्विससर्ज चमूमुखे"
    iast: "lakṣmaṇena tu tad vākyam uktaṃ śrutvā sa rāghavaḥ | rāvaṇāya śarān ghorān visasarja camūmukhe"
  - id: '6.90.2'
    kind: verse
    lines:
      - "दशग्रीवो रथस्थस्तु रामं वज्रोपमैः शरैः"
      - "आजघान महाघोरैर्धाराभिरिव तोयदः"
    iast: "daśagrīvo rathasthas tu rāmaṃ vajropamaiḥ śaraiḥ | ājaghāna mahāghorair dhārābhir iva toyadaḥ"
  - id: '6.90.4'
    kind: verse
    lines:
      - "भूमिस्थितस्य रामस्य रथस्थस्य च रक्षसः"
      - "न समं युद्धमित्याहुर्देवगन्धर्वदानवाः"
    iast: "bhūmisthitasya rāmasya rathasthasya ca rakṣasaḥ | na samaṃ yuddham ity āhur devagandharvadānavāḥ"
  - id: '6.90.8'
    kind: verse
    lines:
      - "अब्रवीच्च तदा रामं सप्रतोदो रथे स्थितः"
      - "प्राञ्जलिर्मातलिर्वाक्यं सहस्राक्षस्य सारथिः"
    iast: "abravīc ca tadā rāmaṃ sapratodo rathe sthitaḥ | prāñjalir mātalir vākyaṃ sahasrākṣasya sārathiḥ"
  - id: '6.90.9'
    kind: verse
    lines:
      - "सहस्राक्षेण काकुत्स्थ रथोऽयं विजयाय ते"
      - "दत्तस्तव महासत्त्व श्रीमाञ्शत्रुनिबर्हणः"
    iast: "sahasrākṣeṇa kākutstha ratho 'yaṃ vijayāya te | dattas tava mahāsattva śrīmāñ śatrunibarhaṇaḥ"
  - id: '6.90.13'
    kind: verse
    lines:
      - "तद्बभूवाद्भुतं युद्धं द्वैरथं लोमहर्षणम्"
      - "रामस्य च महाबाहो रावणस्य च रक्षसः"
    iast: "tad babhūvādbhutaṃ yuddhaṃ dvairathaṃ lomaharṣaṇam | rāmasya ca mahābāho rāvaṇasya ca rakṣasaḥ"
  - id: '6.90.14'
    kind: verse
    lines:
      - "स गान्धर्वेण गान्धर्वं दैवं दैवेन राघवः"
      - "अस्त्रं राक्षसराजस्य जघान परमास्त्रवित्"
    iast: "sa gāndharveṇa gāndharvaṃ daivaṃ daivena rāghavaḥ | astraṃ rākṣasarājasya jaghāna paramāstravit"
  - id: '6.90.22'
    kind: verse
    lines:
      - "अस्त्रे प्रतिहते क्रुद्धो रावणो राक्षसाधिपः"
      - "अभ्यवर्षत्तदा रामं घोराभिः शरवृष्टिभिः"
    iast: "astre pratihate kruddho rāvaṇo rākṣasādhipaḥ | abhyavarṣat tadā rāmaṃ ghorābhiḥ śaravṛṣṭibhiḥ"
  - id: '6.90.25'
    kind: verse
    lines:
      - "विषेदुर्देवगन्धर्वा दानवाश्चारणैः सह"
      - "राममार्तं तदा दृष्ट्वा सिद्धाश्च परमर्षयः"
    iast: "viṣedur devagandharvā dānavāś cāraṇaiḥ saha | rāmam ārtaṃ tadā dṛṣṭvā siddhāś ca paramarṣayaḥ"
  - id: '6.90.26'
    kind: verse
    lines:
      - "व्यथिता वानरेन्द्राश्च बभूवुः सविभीषणाः"
      - "रामचन्द्रमसं दृष्ट्वा ग्रस्तं रावणराहुणा"
    iast: "vyathitā vānarendrāś ca babhūvuḥ savibhīṣaṇāḥ | rāmacandramasaṃ dṛṣṭvā grastaṃ rāvaṇarāhuṇā"
  - id: '6.95.1'
    kind: verse
    lines:
      - "ततः प्रवृत्तं सुक्रूरं रामरावणयोस्तदा"
      - "सुमहद्द्वैरथं युद्धं सर्वलोकभयावहम्"
    iast: "tataḥ pravṛttaṃ sukrūraṃ rāmarāvaṇayos tadā | sumahad dvairathaṃ yuddhaṃ sarvalokabhayāvaham"
  - id: '6.96.20'
    kind: verse
    lines:
      - "ततः क्रुद्धो महाबाहू रघूणां कीर्तिवर्धनः"
      - "संधाय धनुषा रामः क्षुरमाशीविषोपमम्"
      - "रावणस्य शिरोऽच्छिन्दच्छ्रीमज्ज्वलितकुण्डलम्"
    iast: "tataḥ kruddho mahābāhū raghūṇāṃ kīrtivardhanaḥ | saṃdhāya dhanuṣā rāmaḥ kṣuram āśīviṣopamam | rāvaṇasya śiro 'cchindac chrīmaj jvalitakuṇḍalam"
  - id: '6.97.15'
    kind: verse
    lines:
      - "स रावणाय संक्रुद्धो भृशमायम्य कार्मुकम्"
      - "चिक्षेप परमायत्तस्तं शरं मर्मघातिनम्"
    iast: "sa rāvaṇāya saṃkruddho bhṛśam āyamya kārmukam | cikṣepa param āyattas taṃ śaraṃ marmaghātinam"
  - id: '6.97.21'
    kind: verse
    lines:
      - "गतासुर्भीमवेगस्तु नैरृतेन्द्रो महाद्युतिः"
      - "पपात स्यन्दनाद्भूमौ वृत्रो वज्रहतो यथा"
    iast: "gatāsur bhīmavegas tu nairṛtendro mahādyutiḥ | papāta syandanād bhūmau vṛtro vajrahato yathā"
  - id: '6.97.26'
    kind: verse
    lines:
      - "अथान्तरिक्षे व्यनदत्सौम्यस्त्रिदशदुन्दुभिः"
      - "दिव्यगन्धवहस्तत्र मारुतः सुसुखो ववौ"
    iast: "athāntarikṣe vyanadat saumyas tridaśadundubhiḥ | divyagandhavahas tatra mārutaḥ susukho vavau"
  - id: '6.97.27'
    kind: verse
    lines:
      - "निपपातान्तरिक्षाच्च पुष्पवृष्टिस्तदा भुवि"
      - "किरन्ती राघवरथं दुरवापा मनोहराः"
    iast: "nipapātāntarikṣāc ca puṣpavṛṣṭis tadā bhuvi | kirantī rāghavarathaṃ duravāpā manoharāḥ"
  - id: '6.97.28'
    kind: verse
    lines:
      - "राघवस्तवसंयुक्ता गगने च विशुश्रुवे"
      - "साधु साध्विति वागग्र्या देवतानां महात्मनाम्"
    iast: "rāghavastavasaṃyuktā gagane ca viśuśruve | sādhu sādhv iti vāg agryā devatānāṃ mahātmanām"
  - id: '6.97.29'
    kind: verse
    lines:
      - "आविवेश महान्हर्षो देवानां चारणैः सह"
      - "रावणे निहते रौद्रे सर्वलोकभयंकरे"
    iast: "āviveśa mahān harṣo devānāṃ cāraṇaiḥ saha | rāvaṇe nihate raudre sarvalokabhayaṃkare"
  - id: '6.99.1'
    kind: verse
    lines:
      - "तासां विलपमानानां तथा राक्षसयोषिताम्"
      - "ज्येष्ठा पत्नी प्रिया दीना भर्तारं समुदैक्षत"
    iast: "tāsāṃ vilapamānānāṃ tathā rākṣasayoṣitām | jyeṣṭhā patnī priyā dīnā bhartāraṃ samudaikṣata"
  - id: '6.99.2'
    kind: verse
    lines:
      - "दशग्रीवं हतं दृष्ट्वा रामेणाचिन्त्यकर्मणा"
      - "पतिं मन्दोदरी तत्र कृपणा पर्यदेवयत्"
    iast: "daśagrīvaṃ hataṃ dṛṣṭvā rāmeṇācintyakarmaṇā | patiṃ mandodarī tatra kṛpaṇā paryadevayat"
  - id: '6.99.3'
    kind: verse
    lines:
      - "ननु नाम महाबाहो तव वैश्रवणानुज"
      - "क्रुद्धस्य प्रमुखे स्थातुं त्रस्यत्यपि पुरंदरः"
    iast: "nanu nāma mahābāho tava vaiśravaṇānuja | kruddhasya pramukhe sthātuṃ trasyaty api puraṃdaraḥ"
  - id: '6.99.5'
    kind: verse
    lines:
      - "स त्वं मानुषमात्रेण रामेण युधि निर्जितः"
      - "न व्यपत्रपसे राजन्किमिदं राक्षसर्षभ"
    iast: "sa tvaṃ mānuṣamātreṇa rāmeṇa yudhi nirjitaḥ | na vyapatrapase rājan kim idaṃ rākṣasarṣabha"
  - id: '6.99.11'
    kind: verse
    lines:
      - "यदैव हि जनस्थाने राक्षसैर्बहुभिर्वृतः"
      - "खरस्तव हतो भ्राता तदैवासौ न मानुषः"
    iast: "yadaiva hi janasthāne rākṣasair bahubhir vṛtaḥ | kharas tava hato bhrātā tadaivāsau na mānuṣaḥ"
  - id: '6.99.9'
    kind: verse
    lines:
      - "इन्द्रियाणि पुरा जित्वा जितं त्रिभुवणं त्वया"
      - "स्मरद्भिरिव तद्वैरमिन्द्रियैरेव निर्जितः"
    iast: "indriyāṇi purā jitvā jitaṃ tribhuvaṇaṃ tvayā | smaradbhir iva tad vairam indriyair eva nirjitaḥ"
  - id: '6.99.16'
    kind: verse
    lines:
      - "न कुलेन न रूपेण न दाक्षिण्येन मैथिली"
      - "मयाधिका वा तुल्या वा त्वं तु मोहान्न बुध्यसे"
    iast: "na kulena na rūpeṇa na dākṣiṇyena maithilī | mayādhikā vā tulyā vā tvaṃ tu mohān na budhyase"
  - id: '6.99.18'
    kind: verse
    lines:
      - "मैथिली सह रामेण विशोका विहरिष्यति"
      - "अल्पपुण्या त्वहं घोरे पतिता शोकसागरे"
    iast: "maithilī saha rāmeṇa viśokā vihariṣyati | alpapuṇyā tv ahaṃ ghore patitā śokasāgare"
  - id: '6.99.20'
    kind: verse
    lines:
      - "विमानेनानुरूपेण या याम्यतुलया श्रिया"
      - "पश्यन्ती विविधान्देशांस्तांस्तांश्चित्रस्रगम्बरा"
      - "भ्रंशिता कामभोगेभ्यः सास्मि वीरवधात्तव"
    iast: "vimānenānurūpeṇa yā yāmy atulayā śriyā | paśyantī vividhān deśāṃs tāṃs tāṃś citrasragambarā | bhraṃśitā kāmabhogebhyaḥ sāsmi vīravadhāt tava"
  - id: '6.99.21'
    kind: verse
    lines:
      - "सत्यवाक्स महाभागो देवरो मे यदब्रवीत्"
      - "अयं राक्षसमुख्यानां विनाशः पर्युपस्थितः"
    iast: "satyavāk sa mahābhāgo devaro me yad abravīt | ayaṃ rākṣasamukhyānāṃ vināśaḥ paryupasthitaḥ"
  - id: '6.99.23'
    kind: verse
    lines:
      - "न हि त्वं शोचितव्यो मे प्रख्यातबलपौरुषः"
      - "स्त्रीस्वभावात्तु मे बुद्धिः कारुण्ये परिवर्तते"
    iast: "na hi tvaṃ śocitavyo me prakhyātabalapauruṣaḥ | strīsvabhāvāt tu me buddhiḥ kāruṇye parivartate"
  - id: '6.99.24'
    kind: verse
    lines:
      - "सुकृतं दुष्कृतं च त्वं गृहीत्वा स्वां गतिं गतः"
      - "आत्मानमनुशोचामि त्वद्वियोगेन दुःखिताम्"
    iast: "sukṛtaṃ duṣkṛtaṃ ca tvaṃ gṛhītvā svāṃ gatiṃ gataḥ | ātmānam anuśocāmi tvadviyogena duḥkhitām"
  - id: '6.99.29'
    kind: verse
    lines:
      - "धिगस्तु हृदयं यस्या ममेदं न सहस्रधा"
      - "त्वयि पञ्चत्वमापन्ने फलते शोकपीडितम्"
    iast: "dhig astu hṛdayaṃ yasyā mamedaṃ na sahasradhā | tvayi pañcatvam āpanne phalate śokapīḍitam"
  - id: '6.99.30'
    kind: verse
    lines:
      - "एतस्मिन्नन्तरे रामो विभीषणमुवाच ह"
      - "संस्कारः क्रियतां भ्रातुः स्त्रियश्चैता निवर्तय"
    iast: "etasminn antare rāmo vibhīṣaṇam uvāca ha | saṃskāraḥ kriyatāṃ bhrātuḥ striyaś caitā nivartaya"
  - id: '6.99.40'
    kind: verse
    lines:
      - "त्वत्सकाशान्महाबाहो संस्कारं विधिपूर्वकम्"
      - "क्षिप्रमर्हति धर्मज्ञ त्वं यशोभाग्भविष्यसि"
    iast: "tvatsakāśān mahābāho saṃskāraṃ vidhipūrvakam | kṣipram arhati dharmajña tvaṃ yaśobhāg bhaviṣyasi"
  - id: '6.100.5'
    kind: verse
    lines:
      - "राघवेणाभ्यनुज्ञातो मातलिः शक्रसारथिः"
      - "दिव्यं तं रथमास्थाय दिवमेवारुरोह सः"
    iast: "rāghaveṇābhyanujñāto mātaliḥ śakrasārathiḥ | divyaṃ taṃ ratham āsthāya divam evāruroha saḥ"
  - id: '6.100.9'
    kind: verse
    lines:
      - "विभीषणमिमं सौम्य लङ्कायामभिषेचय"
      - "अनुरक्तं च भक्तं च मम चैवोपकारिणम्"
    iast: "vibhīṣaṇam imaṃ saumya laṅkāyām abhiṣecaya | anuraktaṃ ca bhaktaṃ ca mama caivopakāriṇam"
  - id: '6.100.10'
    kind: verse
    lines:
      - "एष मे परमः कामो यदिमं रावणानुजम्"
      - "लङ्कायां सौम्य पश्येयमभिषिक्तं विभीषणम्"
    iast: "eṣa me paramaḥ kāmo yad imaṃ rāvaṇānujam | laṅkāyāṃ saumya paśyeyam abhiṣiktaṃ vibhīṣaṇam"
  - id: '6.100.11'
    kind: verse
    lines:
      - "एवमुक्तस्तु सौमित्री राघवेण महात्मना"
      - "तथेत्युक्त्वा तु संहृष्टः सौवर्णं घटमाददे"
    iast: "evam uktas tu saumitrī rāghaveṇa mahātmanā | tathety uktvā tu saṃhṛṣṭaḥ sauvarṇaṃ ghaṭam ādade"
  - id: '6.100.13'
    kind: verse
    lines:
      - "अभ्यषिञ्चत्स धर्मात्मा शुद्धात्मानं विभीषणम्"
      - "तस्यामात्या जहृषिरे भक्ता ये चास्य राक्षसाः"
    iast: "abhyaṣiñcat sa dharmātmā śuddhātmānaṃ vibhīṣaṇam | tasyāmātyā jahṛṣire bhaktā ye cāsya rākṣasāḥ"
  - id: '6.100.15'
    kind: verse
    lines:
      - "स तद्राज्यं महत्प्राप्य रामदत्तं विभीषणः"
      - "प्रकृतीः सान्त्वयित्वा च ततो राममुपागमत्"
    iast: "sa tad rājyaṃ mahat prāpya rāmadattaṃ vibhīṣaṇaḥ | prakṛtīḥ sāntvayitvā ca tato rāmam upāgamat"
  - id: '6.100.21'
    kind: verse
    lines:
      - "वैदेह्या मां कुशलिनं ससुग्रीवं सलक्ष्मणम्"
      - "आचक्ष्व जयतां श्रेष्ठ रावणं च मया हतम्"
    iast: "vaidehyā māṃ kuśalinaṃ sasugrīvaṃ salakṣmaṇam | ācakṣva jayatāṃ śreṣṭha rāvaṇaṃ ca mayā hatam"
  - id: '6.101.1'
    kind: verse
    lines:
      - "इति प्रतिसमादिष्टो हनूमान्मारुतात्मजः"
      - "प्रविवेश पुरीं लङ्कां पूज्यमानो निशाचरैः"
    iast: "iti pratisamādiṣṭo hanūmān mārutātmajaḥ | praviveśa purīṃ laṅkāṃ pūjyamāno niśācaraiḥ"
  - id: '6.101.3'
    kind: verse
    lines:
      - "निभृतः प्रणतः प्रह्वः सोऽभिगम्याभिवाद्य च"
      - "रामस्य वचनं सर्वमाख्यातुमुपचक्रमे"
    iast: "nibhṛtaḥ praṇataḥ prahvaḥ so 'bhigamyābhivādya ca | rāmasya vacanaṃ sarvam ākhyātum upacakrame"
  - id: '6.101.4'
    kind: verse
    lines:
      - "वैदेहि कुशली रामः ससुग्रीवः सलक्ष्मणः"
      - "कुशलं चाह सिद्धार्थो हतशत्रुररिंदमः"
    iast: "vaidehi kuśalī rāmaḥ sasugrīvaḥ salakṣmaṇaḥ | kuśalaṃ cāha siddhārtho hataśatrur ariṃdamaḥ"
  - id: '6.101.5'
    kind: verse
    lines:
      - "विभीषणसहायेन रामेण हरिभिः सह"
      - "निहतो रावणो देवि लक्ष्मणस्य नयेन च"
    iast: "vibhīṣaṇasahāyena rāmeṇa haribhiḥ saha | nihato rāvaṇo devi lakṣmaṇasya nayena ca"
  - id: '6.101.6'
    kind: verse
    lines:
      - "पृष्ट्वा च कुशलं रामो वीरस्त्वां रघुनन्दनः"
      - "अब्रवीत्परमप्रीतः कृतार्थेनान्तरात्मना"
    iast: "pṛṣṭvā ca kuśalaṃ rāmo vīras tvāṃ raghunandanaḥ | abravīt paramaprītaḥ kṛtārthenāntarātmanā"
  - id: '6.101.7'
    kind: verse
    lines:
      - "प्रियमाख्यामि ते देवि त्वां तु भूयः सभाजये"
      - "दिष्ट्या जीवसि धर्मज्ञे जयेन मम संयुगे"
    iast: "priyam ākhyāmi te devi tvāṃ tu bhūyaḥ sabhājaye | diṣṭyā jīvasi dharmajñe jayena mama saṃyuge"
  - id: '6.101.8'
    kind: verse
    lines:
      - "लब्धो नो विजयः सीते स्वस्था भव गतव्यथा"
      - "रावणः स हतः शत्रुर्लङ्का चेयं वशे स्थिता"
    iast: "labdho no vijayaḥ sīte svasthā bhava gatavyathā | rāvaṇaḥ sa hataḥ śatrur laṅkā ceyaṃ vaśe sthitā"
  - id: '6.101.9'
    kind: verse
    lines:
      - "मया ह्यलब्धनिद्रेण धृतेन तव निर्जये"
      - "प्रतिज्ञैषा विनिस्तीर्णा बद्ध्वा सेतुं महोदधौ"
    iast: "mayā hy alabdhanidreṇa dhṛtena tava nirjaye | pratijñaiṣā vinistīrṇā baddhvā setuṃ mahodadhau"
  - id: '6.101.10'
    kind: verse
    lines:
      - "संभ्रमश्च न कर्तव्यो वर्तन्त्या रावणालये"
      - "विभीषणविधेयं हि लङ्कैश्वर्यमिदं कृतम्"
    iast: "saṃbhramaś ca na kartavyo vartantyā rāvaṇālaye | vibhīṣaṇavidheyaṃ hi laṅkaiśvaryam idaṃ kṛtam"
  - id: '6.101.12'
    kind: verse
    lines:
      - "एवमुक्ता समुत्पत्य सीता शशिनिभानना"
      - "प्रहर्षेणावरुद्धा सा व्याजहार न किं चन"
    iast: "evam uktā samutpatya sītā śaśinibhānanā | praharṣeṇāvaruddhā sā vyājahāra na kiṃ cana"
  - id: '6.101.14'
    kind: verse
    lines:
      - "एवमुक्ता हनुमता सीता धर्मे व्यवस्थिता"
      - "अब्रवीत्परमप्रीता हर्षगद्गदया गिरा"
    iast: "evam uktā hanumatā sītā dharme vyavasthitā | abravīt paramaprītā harṣagadgadayā girā"
  - id: '6.101.16'
    kind: verse
    lines:
      - "न हि पश्यामि सदृशं चिन्तयन्ती प्लवंगम"
      - "मत्प्रियाख्यानकस्येह तव प्रत्यभिनन्दनम्"
    iast: "na hi paśyāmi sadṛśaṃ cintayantī plavaṃgama | matpriyākhyānakasyeha tava pratyabhinandanam"
  - id: '6.101.18'
    kind: verse
    lines:
      - "हिरण्यं वा सुवर्णं वा रत्नानि विविधानि च"
      - "राज्यं वा त्रिषु लोकेषु नैतदर्हति भाषितुम्"
    iast: "hiraṇyaṃ vā suvarṇaṃ vā ratnāni vividhāni ca | rājyaṃ vā triṣu lokeṣu naitad arhati bhāṣitum"
  - id: '6.101.19'
    kind: verse
    lines:
      - "एवमुक्तस्तु वैदेह्या प्रत्युवाच प्लवंगमः"
      - "प्रगृहीताञ्जलिर्वाक्यं सीतायाः प्रमुखे स्थितः"
    iast: "evam uktas tu vaidehyā pratyuvāca plavaṃgamaḥ | pragṛhītāñjalir vākyaṃ sītāyāḥ pramukhe sthitaḥ"
  - id: '6.101.20'
    kind: verse
    lines:
      - "भर्तुः प्रियहिते युक्ते भर्तुर्विजयकाङ्क्षिणि"
      - "स्निग्धमेवंविधं वाक्यं त्वमेवार्हसि भाषितुम्"
    iast: "bhartuḥ priyahite yukte bhartur vijayakāṅkṣiṇi | snigdham evaṃvidhaṃ vākyaṃ tvam evārhasi bhāṣitum"
  - id: '6.101.21'
    kind: verse
    lines:
      - "तवैतद्वचनं सौम्ये सारवत्स्निग्धमेव च"
      - "रत्नौघाद्विविधाच्चापि देवराज्याद्विशिष्यते"
    iast: "tavaitad vacanaṃ saumye sāravat snigdham eva ca | ratnaughād vividhāc cāpi devarājyād viśiṣyate"
  - id: '6.101.23'
    kind: verse
    lines:
      - "इमास्तु खलु राक्षस्यो यदि त्वमनुमन्यसे"
      - "हन्तुमिच्छाम्यहं सर्वा याभिस्त्वं तर्जिता पुरा"
    iast: "imās tu khalu rākṣasyo yadi tvam anumanyase | hantum icchāmy ahaṃ sarvā yābhis tvaṃ tarjitā purā"
  - id: '6.101.29'
    kind: verse
    lines:
      - "एवमुक्ता महुमता वैदेही जनकात्मजा"
      - "उवाच धर्मसहितं हनूमन्तं यशस्विनी"
    iast: "evam uktā mahumatā vaidehī janakātmajā | uvāca dharmasahitaṃ hanūmantaṃ yaśasvinī"
  - id: '6.101.30'
    kind: verse
    lines:
      - "राजसंश्रयवश्यानां कुर्वतीनां पराज्ञया"
      - "विधेयानां च दासीनां कः कुप्येद्वानरोत्तम"
    iast: "rājasaṃśrayavaśyānāṃ kurvatīnāṃ parājñayā | vidheyānāṃ ca dāsīnāṃ kaḥ kupyed vānarottama"
  - id: '6.101.31'
    kind: verse
    lines:
      - "भाग्यवैषम्ययोगेन पुरा दुश्चरितेन च"
      - "मयैतत्प्राप्यते सर्वं स्वकृतं ह्युपभुज्यते"
    iast: "bhāgyavaiṣamyayogena purā duścaritena ca | mayaitat prāpyate sarvaṃ svakṛtaṃ hy upabhujyate"
  - id: '6.101.32'
    kind: verse
    lines:
      - "प्राप्तव्यं तु दशायोगान्मयैतदिति निश्चितम्"
      - "दासीनां रावणस्याहं मर्षयामीह दुर्बला"
    iast: "prāptavyaṃ tu daśāyogān mayaitad iti niścitam | dāsīnāṃ rāvaṇasyāhaṃ marṣayāmīha durbalā"
  - id: '6.101.33'
    kind: verse
    lines:
      - "आज्ञप्ता रावणेनैता राक्षस्यो मामतर्जयन्"
      - "हते तस्मिन्न कुर्युर्हि तर्जनं वानरोत्तम"
    iast: "ājñaptā rāvaṇenaitā rākṣasyo mām atarjayan | hate tasmin na kuryur hi tarjanaṃ vānarottama"
  - id: '6.102.13'
    kind: verse
    lines:
      - "ततः सीतां शिरःस्नातां युवतीभिरलंकृताम्"
      - "महार्हाभरणोपेतां महार्हाम्बरधारिणीम्"
    iast: "tataḥ sītāṃ śiraḥsnātāṃ yuvatībhir alaṃkṛtām | mahārhābharaṇopetāṃ mahārhāmbaradhāriṇīm"
  - id: '6.102.14'
    kind: verse
    lines:
      - "आरोप्य शिबिकां दीप्तां परार्ध्याम्बरसंवृताम्"
      - "रक्षोभिर्बहुभिर्गुप्तामाजहार विभीषणः"
    iast: "āropya śibikāṃ dīptāṃ parārdhyāmbarasaṃvṛtām | rakṣobhir bahubhir guptām ājahāra vibhīṣaṇaḥ"
  - id: '6.102.16'
    kind: verse
    lines:
      - "तामागतामुपश्रुत्य रक्षोगृहचिरोषिताम्"
      - "हर्षो दैन्यं च रोषश्च त्रयं राघवमाविशत्"
    iast: "tām āgatām upaśrutya rakṣogṛhaciroṣitām | harṣo dainyaṃ ca roṣaś ca trayaṃ rāghavam āviśat"
  - id: '6.102.33'
    kind: verse
    lines:
      - "लज्जया त्ववलीयन्ती स्वेषु गात्रेषु मैथिली"
      - "विभीषणेनानुगता भर्तारं साभ्यवर्तत"
    iast: "lajjayā tv avalīyantī sveṣu gātreṣu maithilī | vibhīṣaṇenānugatā bhartāraṃ sābhyavartata"
  - id: '6.102.35'
    kind: verse
    lines:
      - "विस्मयाच्च प्रहर्षाच्च स्नेहाच्च परिदेवता"
      - "उदैक्षत मुखं भर्तुः सौम्यं सौम्यतरानना"
    iast: "vismayāc ca praharṣāc ca snehāc ca paridevatā | udaikṣata mukhaṃ bhartuḥ saumyaṃ saumyatarānanā"
  - id: '6.103.1'
    kind: verse
    lines:
      - "तां तु पार्श्वे स्थितां प्रह्वां रामः संप्रेक्ष्य मैथिलीम्"
      - "हृदयान्तर्गतक्रोधो व्याहर्तुमुपचक्रमे"
    iast: "tāṃ tu pārśve sthitāṃ prahvāṃ rāmaḥ saṃprekṣya maithilīm | hṛdayāntargatakrodho vyāhartum upacakrame"
  - id: '6.103.2'
    kind: verse
    lines:
      - "एषासि निर्जिता भद्रे शत्रुं जित्वा मया रणे"
      - "पौरुषाद्यदनुष्ठेयं तदेतदुपपादितम्"
    iast: "eṣāsi nirjitā bhadre śatruṃ jitvā mayā raṇe | pauruṣād yad anuṣṭheyaṃ tad etad upapāditam"
  - id: '6.103.3'
    kind: verse
    lines:
      - "गतोऽस्म्यन्तममर्षस्य धर्षणा संप्रमार्जिता"
      - "अवमानश्च शत्रुश्च मया युगपदुद्धृतौ"
    iast: "gato 'smy antam amarṣasya dharṣaṇā saṃpramārjitā | avamānaś ca śatruś ca mayā yugapad uddhṛtau"
  - id: '6.103.4'
    kind: verse
    lines:
      - "अद्य मे पौरुषं दृष्टमद्य मे सफलः श्रमः"
      - "अद्य तीर्णप्रतिज्ञत्वात्प्रभवामीह चात्मनः"
    iast: "adya me pauruṣaṃ dṛṣṭam adya me saphalaḥ śramaḥ | adya tīrṇapratijñatvāt prabhavāmīha cātmanaḥ"
  - id: '6.103.17'
    kind: verse
    lines:
      - "प्राप्तचारित्रसंदेहा मम प्रतिमुखे स्थिता"
      - "दीपो नेत्रातुरस्येव प्रतिकूलासि मे दृढम्"
    iast: "prāptacāritrasaṃdehā mama pratimukhe sthitā | dīpo netrāturasyeva pratikūlāsi me dṛḍham"
  - id: '6.103.19'
    kind: verse
    lines:
      - "कः पुमान्हि कुले जातः स्त्रियं परगृहोषिताम्"
      - "तेजस्वि पुनरादद्यात्सुहृल्लेखेन चेतसा"
    iast: "kaḥ pumān hi kule jātaḥ striyaṃ paragṛhoṣitām | tejasvi punar ādadyāt suhṛllekhena cetasā"
  - id: '6.103.20'
    kind: verse
    lines:
      - "रावणाङ्कपरिभ्रष्टां दृष्टां दुष्टेन चक्षुषा"
      - "कथं त्वां पुनरादद्यां कुलं व्यपदिशन्महत्"
    iast: "rāvaṇāṅkaparibhraṣṭāṃ dṛṣṭāṃ duṣṭena cakṣuṣā | kathaṃ tvāṃ punarādadyāṃ kulaṃ vyapadiśan mahat"
  - id: '6.103.21'
    kind: verse
    lines:
      - "तदर्थं निर्जिता मे त्वं यशः प्रत्याहृतं मया"
      - "नास्ति मे त्वय्यभिष्वङ्गो यथेष्टं गम्यतामितः"
    iast: "tadarthaṃ nirjitā me tvaṃ yaśaḥ pratyāhṛtaṃ mayā | nāsti me tvayy abhiṣvaṅgo yatheṣṭaṃ gamyatām itaḥ"
  - id: '6.104.1'
    kind: verse
    lines:
      - "एवमुक्ता तु वैदेही परुषं लोमहर्षणम्"
      - "राघवेण सरोषेण भृशं प्रव्यथिताभवत्"
    iast: "evam uktā tu vaidehī paruṣaṃ lomaharṣaṇam | rāghaveṇa saroṣeṇa bhṛśaṃ pravyathitābhavat"
  - id: '6.104.4'
    kind: verse
    lines:
      - "ततो बाष्पपरिक्लिष्टं प्रमार्जन्ती स्वमाननम्"
      - "शनैर्गद्गदया वाचा भर्तारमिदमब्रवीत्"
    iast: "tato bāṣpaparikliṣṭaṃ pramārjantī svam ānanam | śanair gadgadayā vācā bhartāram idam abravīt"
  - id: '6.104.5'
    kind: verse
    lines:
      - "किं मामसदृशं वाक्यमीदृशं श्रोत्रदारुणम्"
      - "रूक्षं श्रावयसे वीर प्राकृतः प्राकृतामिव"
    iast: "kiṃ mām asadṛśaṃ vākyam īdṛśaṃ śrotradāruṇam | rūkṣaṃ śrāvayase vīra prākṛtaḥ prākṛtām iva"
  - id: '6.104.6'
    kind: verse
    lines:
      - "न तथास्मि महाबाहो यथा त्वमवगच्छसि"
      - "प्रत्ययं गच्छ मे स्वेन चारित्रेणैव ते शपे"
    iast: "na tathāsmi mahābāho yathā tvam avagacchasi | pratyayaṃ gaccha me svena cāritreṇaiva te śape"
  - id: '6.104.7'
    kind: verse
    lines:
      - "पृथक्स्त्रीणां प्रचारेण जातिं त्वं परिशङ्कसे"
      - "परित्यजेमां शङ्कां तु यदि तेऽहं परीक्षिता"
    iast: "pṛthak strīṇāṃ pracāreṇa jātiṃ tvaṃ pariśaṅkase | parityajemāṃ śaṅkāṃ tu yadi te 'haṃ parīkṣitā"
  - id: '6.104.8'
    kind: verse
    lines:
      - "यद्यहं गात्रसंस्पर्शं गतास्मि विवशा प्रभो"
      - "कामकारो न मे तत्र दैवं तत्रापराध्यति"
    iast: "yady ahaṃ gātrasaṃsparśaṃ gatāsmi vivaśā prabho | kāmakāro na me tatra daivaṃ tatrāparādhyati"
  - id: '6.104.9'
    kind: verse
    lines:
      - "मदधीनं तु यत्तन्मे हृदयं त्वयि वर्तते"
      - "पराधीनेषु गात्रेषु किं करिष्याम्यनीश्वरा"
    iast: "madadhīnaṃ tu yat tan me hṛdayaṃ tvayi vartate | parādhīneṣu gātreṣu kiṃ kariṣyāmy anīśvarā"
  - id: '6.104.10'
    kind: verse
    lines:
      - "सहसंवृद्धभावाच्च संसर्गेण च मानद"
      - "यद्यहं ते न विज्ञाता हता तेनास्मि शाश्वतम्"
    iast: "sahasaṃvṛddhabhāvāc ca saṃsargeṇa ca mānada | yady ahaṃ te na vijñātā hatā tenāsmi śāśvatam"
  - id: '6.104.11'
    kind: verse
    lines:
      - "प्रेषितस्ते यदा वीरो हनूमानवलोककः"
      - "लङ्कास्थाहं त्वया वीर किं तदा न विसर्जिता"
    iast: "preṣitas te yadā vīro hanūmān avalokakaḥ | laṅkāsthāhaṃ tvayā vīra kiṃ tadā na visarjitā"
  - id: '6.104.12'
    kind: verse
    lines:
      - "प्रत्यक्षं वानरेन्द्रस्य त्वद्वाक्यसमनन्तरम्"
      - "त्वया संत्यक्तया वीर त्यक्तं स्याज्जीवितं मया"
    iast: "pratyakṣaṃ vānarendrasya tvadvākyasamanantaram | tvayā saṃtyaktayā vīra tyaktaṃ syāj jīvitaṃ mayā"
  - id: '6.104.13'
    kind: verse
    lines:
      - "न वृथा ते श्रमोऽयं स्यात्संशये न्यस्य जीवितम्"
      - "सुहृज्जनपरिक्लेशो न चायं निष्फलस्तव"
    iast: "na vṛthā te śramo 'yaṃ syāt saṃśaye nyasya jīvitam | suhṛjjanaparikleśo na cāyaṃ niṣphalas tava"
  - id: '6.104.14'
    kind: verse
    lines:
      - "त्वया तु नरशार्दूल क्रोधमेवानुवर्तता"
      - "लघुनेव मनुष्येण स्त्रीत्वमेव पुरस्कृतम्"
    iast: "tvayā tu naraśārdūla krodham evānuvartatā | laghuneva manuṣyeṇa strītvam eva puraskṛtam"
  - id: '6.104.16'
    kind: verse
    lines:
      - "न प्रमाणीकृतः पाणिर्बाल्ये बालेन पीडितः"
      - "मम भक्तिश्च शीलं च सर्वं ते पृष्ठतः कृतम्"
    iast: "na pramāṇīkṛtaḥ pāṇir bālye bālena pīḍitaḥ | mama bhaktiś ca śīlaṃ ca sarvaṃ te pṛṣṭhataḥ kṛtam"
  - id: '6.104.21'
    kind: verse
    lines:
      - "स विज्ञाय मनश्छन्दं रामस्याकारसूचितम्"
      - "चितां चकार सौमित्रिर्मते रामस्य वीर्यवान्"
    iast: "sa vijñāya manaśchandaṃ rāmasyākārasūcitam | citāṃ cakāra saumitrir mate rāmasya vīryavān"
  - id: '6.104.22'
    kind: verse
    lines:
      - "अधोमुखं ततो रामं शनैः कृत्वा प्रदक्षिणम्"
      - "उपासर्पत वैदेही दीप्यमानं हुताशनम्"
    iast: "adhomukhaṃ tato rāmaṃ śanaiḥ kṛtvā pradakṣiṇam | upāsarpata vaidehī dīpyamānaṃ hutāśanam"
  - id: '6.104.23'
    kind: verse
    lines:
      - "प्रणम्य देवताभ्यश्च ब्राह्मणेभ्यश्च मैथिली"
      - "बद्धाञ्जलिपुटा चेदमुवाचाग्निसमीपतः"
    iast: "praṇamya devatābhyaś ca brāhmaṇebhyaś ca maithilī | baddhāñjalipuṭā cedam uvācāgnisamīpataḥ"
  - id: '6.104.24'
    kind: verse
    lines:
      - "यथा मे हृदयं नित्यं नापसर्पति राघवात्"
      - "तथा लोकस्य साक्षी मां सर्वतः पातु पावकः"
    iast: "yathā me hṛdayaṃ nityaṃ nāpasarpati rāghavāt | tathā lokasya sākṣī māṃ sarvataḥ pātu pāvakaḥ"
  - id: '6.104.25'
    kind: verse
    lines:
      - "एवमुक्त्वा तु वैदेही परिक्रम्य हुताशनम्"
      - "विवेश ज्वलनं दीप्तं निःसङ्गेनान्तरात्मना"
    iast: "evam uktvā tu vaidehī parikramya hutāśanam | viveśa jvalanaṃ dīptaṃ niḥsaṅgenāntarātmanā"
  - id: '6.105.5'
    kind: verse
    lines:
      - "कर्ता सर्वस्य लोकस्य श्रेष्ठो ज्ञानवतां वरः"
      - "उपेक्षसे कथं सीतां पतन्तीं हव्यवाहने"
      - "कथं देवगणश्रेष्ठमात्मानं नावबुध्यसे"
    iast: "kartā sarvasya lokasya śreṣṭho jñānavatāṃ varaḥ | upekṣase kathaṃ sītāṃ patantīṃ havyavāhane | kathaṃ devagaṇaśreṣṭham ātmānaṃ nāvabudhyase"
  - id: '6.106.3'
    kind: verse
    lines:
      - "अक्लिष्टमाल्याभरणां तथा रूपां मनस्विनीम्"
      - "ददौ रामाय वैदेहीमङ्के कृत्वा विभावसुः"
    iast: "akliṣṭamālyābharaṇāṃ tathā rūpāṃ manasvinīm | dadau rāmāya vaidehīm aṅke kṛtvā vibhāvasuḥ"
  - id: '6.106.4'
    kind: verse
    lines:
      - "अब्रवीच्च तदा रामं साक्षी लोकस्य पावकः"
      - "एषा ते राम वैदेही पापमस्या न विद्यते"
    iast: "abravīc ca tadā rāmaṃ sākṣī lokasya pāvakaḥ | eṣā te rāma vaidehī pāpam asyā na vidyate"
  - id: '6.106.10'
    kind: verse
    lines:
      - "एवमुक्तो महातेजा धृतिमान्दृढविक्रमः"
      - "अब्रवीत्त्रिदशश्रेष्ठं रामो धर्मभृतां वरः"
    iast: "evam ukto mahātejā dhṛtimān dṛḍhavikramaḥ | abravīt tridaśaśreṣṭhaṃ rāmo dharmabhṛtāṃ varaḥ"
  - id: '6.106.19'
    kind: verse
    lines:
      - "अवश्यं च मया कार्यं सर्वेषां वो वचो हितम्"
      - "स्निग्धानां लोकमान्यानामेवं च ब्रुवतां हितम्"
    iast: "avaśyaṃ ca mayā kāryaṃ sarveṣāṃ vo vaco hitam | snigdhānāṃ lokamānyānām evaṃ ca bruvatāṃ hitam"
  - id: '6.107.8'
    kind: verse
    lines:
      - "इन्द्रलोकं गतः श्रीमांस्त्वया पुत्रेण तारितः"
      - "लक्ष्मणेन सह भ्रात्रा त्वमेनमभिवादय"
    iast: "indralokaṃ gataḥ śrīmāṃs tvayā putreṇa tāritaḥ | lakṣmaṇena saha bhrātrā tvam enam abhivādaya"
  - id: '6.107.9'
    kind: verse
    lines:
      - "महादेववचः श्रुत्वा काकुत्स्थः सहलक्ष्मणः"
      - "विमानशिखरस्थस्य प्रणाममकरोत्पितुः"
    iast: "mahādevavacaḥ śrutvā kākutsthaḥ sahalakṣmaṇaḥ | vimānaśikharasthasya praṇāmam akarot pituḥ"
  - id: '6.107.12'
    kind: verse
    lines:
      - "आरोप्याङ्कं महाबाहुर्वरासनगतः प्रभुः"
      - "बाहुभ्यां संपरिष्वज्य ततो वाक्यं समाददे"
    iast: "āropyāṅkaṃ mahābāhur varāsanagataḥ prabhuḥ | bāhubhyāṃ saṃpariṣvajya tato vākyaṃ samādade"
  - id: '6.107.17'
    kind: verse
    lines:
      - "इदानीं च विजानामि यथा सौम्य सुरेश्वरैः"
      - "वधार्थं रावणस्येह विहितं पुरुषोत्तमम्"
    iast: "idānīṃ ca vijānāmi yathā saumya sureśvaraiḥ | vadhārthaṃ rāvaṇasyeha vihitaṃ puruṣottamam"
  - id: '6.107.22'
    kind: verse
    lines:
      - "निवृत्तवनवासोऽसि प्रतिज्ञा सफला कृता"
      - "रावणं च रणे हत्वा देवास्ते परितोषिताः"
    iast: "nivṛttavanavāso 'si pratijñā saphalā kṛtā | rāvaṇaṃ ca raṇe hatvā devās te paritoṣitāḥ"
  - id: '6.107.23'
    kind: verse
    lines:
      - "कृतं कर्म यशः श्लाघ्यं प्राप्तं ते शत्रुसूदन"
      - "भ्रातृभिः सह राज्यस्थो दीर्घमायुरवाप्नुहि"
    iast: "kṛtaṃ karma yaśaḥ ślāghyaṃ prāptaṃ te śatrusūdana | bhrātṛbhiḥ saha rājyastho dīrgham āyur avāpnuhi"
  - id: '6.107.24'
    kind: verse
    lines:
      - "इति ब्रुवाणं राजानं रामः प्राञ्जलिरब्रवीत्"
      - "कुरु प्रसादं धर्मज्ञ कैकेय्या भरतस्य च"
    iast: "iti bruvāṇaṃ rājānaṃ rāmaḥ prāñjalir abravīt | kuru prasādaṃ dharmajña kaikeyyā bharatasya ca"
  - id: '6.107.25'
    kind: verse
    lines:
      - "सपुत्रां त्वां त्यजामीति यदुक्ता कैकयी त्वया"
      - "स शापः कैकयीं घोरः सपुत्रां न स्पृशेत्प्रभो"
    iast: "saputrāṃ tvāṃ tyajāmīti yad uktā kaikayī tvayā | sa śāpaḥ kaikayīṃ ghoraḥ saputrāṃ na spṛśet prabho"
  - id: '6.107.26'
    kind: verse
    lines:
      - "स तथेति महाराजो राममुक्त्वा कृताञ्जलिम्"
      - "लक्ष्मणं च परिष्वज्य पुनर्वाक्यमुवाच ह"
    iast: "sa tatheti mahārājo rāmam uktvā kṛtāñjalim | lakṣmaṇaṃ ca pariṣvajya punar vākyam uvāca ha"
  - id: '6.107.32'
    kind: verse
    lines:
      - "अवाप्तं धर्मचरणं यशश्च विपुलं त्वया"
      - "रामं शुश्रूषता भक्त्या वैदेह्या सह सीतया"
    iast: "avāptaṃ dharmacaraṇaṃ yaśaś ca vipulaṃ tvayā | rāmaṃ śuśrūṣatā bhaktyā vaidehyā saha sītayā"
  - id: '6.107.33'
    kind: verse
    lines:
      - "स तथोक्त्वा महाबाहुर्लक्ष्मणं प्राञ्जलिं स्थितम्"
      - "उवाच राजा धर्मात्मा वैदेहीं वचनं शुभम्"
    iast: "sa tathoktvā mahābāhur lakṣmaṇaṃ prāñjaliṃ sthitam | uvāca rājā dharmātmā vaidehīṃ vacanaṃ śubham"
  - id: '6.107.34'
    kind: verse
    lines:
      - "कर्तव्यो न तु वैदेहि मन्युस्त्यागमिमं प्रति"
      - "रामेण त्वद्विशुद्ध्यर्थं कृतमेतद्धितैषिणा"
    iast: "kartavyo na tu vaidehi manyus tyāgam imaṃ prati | rāmeṇa tvadviśuddhyarthaṃ kṛtam etad dhitaiṣiṇā"
  - id: '6.107.36'
    kind: verse
    lines:
      - "इति प्रतिसमादिश्य पुत्रौ सीतां तथा स्नुषाम्"
      - "इन्द्रलोकं विमानेन ययौ दशरथो ज्वलन्"
    iast: "iti pratisamādiśya putrau sītāṃ tathā snuṣām | indralokaṃ vimānena yayau daśaratho jvalan"
  - id: '6.108.1'
    kind: verse
    lines:
      - "प्रतिप्रयाते काकुत्स्थे महेन्द्रः पाकशासनः"
      - "अब्रवीत्परमप्रीतो राघवं प्राञ्जलिं स्थितम्"
    iast: "pratiprayāte kākutsthe mahendraḥ pākaśāsanaḥ | abravīt paramaprīto rāghavaṃ prāñjaliṃ sthitam"
  - id: '6.108.2'
    kind: verse
    lines:
      - "अमोघं दर्शनं राम तवास्माकं परंतप"
      - "प्रीतियुक्तोऽस्मि तेन त्वं ब्रूहि यन्मनसेच्छसि"
    iast: "amoghaṃ darśanaṃ rāma tavāsmākaṃ paraṃtapa | prītiyukto 'smi tena tvaṃ brūhi yan manasecchasi"
  - id: '6.108.5'
    kind: verse
    lines:
      - "मम हेतोः पराक्रान्ता ये गता यमसादनम्"
      - "ते सर्वे जीवितं प्राप्य समुत्तिष्ठन्तु वानराः"
    iast: "mama hetoḥ parākrāntā ye gatā yamasādanam | te sarve jīvitaṃ prāpya samuttiṣṭhantu vānarāḥ"
  - id: '6.108.14'
    kind: verse
    lines:
      - "काकुत्स्थं परिपूर्णार्थं दृष्ट्वा सर्वे सुरोत्तमाः"
      - "ऊचुस्ते प्रथमं स्तुत्वा स्तवार्हं सहलक्ष्मणम्"
    iast: "kākutsthaṃ paripūrṇārthaṃ dṛṣṭvā sarve surottamāḥ | ūcus te prathamaṃ stutvā stavārhaṃ sahalakṣmaṇam"
  - id: '6.108.15'
    kind: verse
    lines:
      - "गच्छायोध्यामितो वीर विसर्जय च वानरान्"
      - "मैथिलीं सान्त्वयस्वैनामनुरक्तां तपस्विनीम्"
    iast: "gacchāyodhyām ito vīra visarjaya ca vānarān | maithilīṃ sāntvayasvainām anuraktāṃ tapasvinīm"
  - id: '6.109.1'
    kind: verse
    lines:
      - "तां रात्रिमुषितं रामं सुखोत्थितमरिंदमम्"
      - "अब्रवीत्प्राञ्जलिर्वाक्यं जयं पृष्ट्वा विभीषणः"
    iast: "tāṃ rātrim uṣitaṃ rāmaṃ sukhotthitam ariṃdamam | abravīt prāñjalir vākyaṃ jayaṃ pṛṣṭvā vibhīṣaṇaḥ"
  - id: '6.109.4'
    kind: verse
    lines:
      - "एवमुक्तस्तु काकुत्स्थः प्रत्युवाच विभीषणम्"
      - "हरीन्सुग्रीवमुख्यांस्त्वं स्नानेनोपनिमन्त्रय"
    iast: "evam uktas tu kākutsthaḥ pratyuvāca vibhīṣaṇam | harīn sugrīvamukhyāṃs tvaṃ snānenopanimantraya"
  - id: '6.109.6'
    kind: verse
    lines:
      - "तं विना कैकेयीपुत्रं भरतं धर्मचारिणम्"
      - "न मे स्नानं बहुमतं वस्त्राण्याभरणानि च"
    iast: "taṃ vinā kaikeyīputraṃ bharataṃ dharmacāriṇam | na me snānaṃ bahumataṃ vastrāṇy ābharaṇāni ca"
  - id: '6.109.20'
    kind: verse
    lines:
      - "उपस्थापय मे क्षिप्रं विमानं राक्षसेश्वर"
      - "कृतकार्यस्य मे वासः कथं चिदिह संमतः"
    iast: "upasthāpaya me kṣipraṃ vimānaṃ rākṣaseśvara | kṛtakāryasya me vāsaḥ kathaṃ cid iha saṃmataḥ"
  - id: '6.109.21'
    kind: verse
    lines:
      - "अनुजानीहि मां सौम्य पूजितोऽस्मि विभीषण"
      - "मन्युर्न खलु कर्तव्यस्त्वरितस्त्वानुमानये"
    iast: "anujānīhi māṃ saumya pūjito 'smi vibhīṣaṇa | manyur na khalu kartavyas tvaritas tvānumānaye"
  - id: '6.109.27'
    kind: verse
    lines:
      - "उपस्थितमनाधृष्यं तद्विमानं मनोजवम्"
      - "निवेदयित्वा रामाय तस्थौ तत्र विभीषणः"
    iast: "upasthitam anādhṛṣyaṃ tad vimānaṃ manojavam | nivedayitvā rāmāya tasthau tatra vibhīṣaṇaḥ"
  - id: '6.110.10'
    kind: verse
    lines:
      - "अङ्केनादाय वैदेहीं लज्जमानां यशस्विनीम्"
      - "लक्ष्मणेन सह भ्रात्रा विक्रान्तेन धनुष्मता"
    iast: "aṅkenādāya vaidehīṃ lajjamānāṃ yaśasvinīm | lakṣmaṇena saha bhrātrā vikrāntena dhanuṣmatā"
  - id: '6.111.1'
    kind: verse
    lines:
      - "अनुज्ञातं तु रामेण तद्विमानमनुत्तमम्"
      - "उत्पपात महामेघः श्वसनेनोद्धतो यथा"
    iast: "anujñātaṃ tu rāmeṇa tad vimānam anuttamam | utpapāta mahāmeghaḥ śvasanenoddhato yathā"
  - id: '6.113.7'
    kind: verse
    lines:
      - "भरतस्तु त्वया वाच्यः कुशलं वचनान्मम"
      - "सिद्धार्थं शंस मां तस्मै सभार्यं सहलक्ष्मणम्"
    iast: "bharatas tu tvayā vācyaḥ kuśalaṃ vacanān mama | siddhārthaṃ śaṃsa māṃ tasmai sabhāryaṃ sahalakṣmaṇam"
  - id: '6.113.18'
    kind: verse
    lines:
      - "इति प्रतिसमादिष्टो हनूमान्मारुतात्मजः"
      - "मानुषं धारयन्रूपमयोध्यां त्वरितो ययौ"
    iast: "iti pratisamādiṣṭo hanūmān mārutātmajaḥ | mānuṣaṃ dhārayan rūpam ayodhyāṃ tvarito yayau"
  - id: '6.113.26'
    kind: verse
    lines:
      - "क्रोशमात्रे त्वयोध्यायाश्चीरकृष्णाजिनाम्बरम्"
      - "ददर्श भरतं दीनं कृशमाश्रमवासिनम्"
    iast: "krośamātre tv ayodhyāyāś cīrakṛṣṇājināmbaram | dadarśa bharataṃ dīnaṃ kṛśam āśramavāsinam"
  - id: '6.113.29'
    kind: verse
    lines:
      - "पादुके ते पुरस्कृत्य शासन्तं वै वसुंधराम्"
      - "चतुर्वर्ण्यस्य लोकस्य त्रातारं सर्वतो भयात्"
    iast: "pāduke te puraskṛtya śāsantaṃ vai vasuṃdharām | caturvarṇyasya lokasya trātāraṃ sarvato bhayāt"
  - id: '6.113.32'
    kind: verse
    lines:
      - "तं धर्ममिव धर्मज्ञं देववन्तमिवापरम्"
      - "उवाच प्राञ्जलिर्वाक्यं हनूमान्मारुतात्मजः"
    iast: "taṃ dharmam iva dharmajñaṃ devavantam ivāparam | uvāca prāñjalir vākyaṃ hanūmān mārutātmajaḥ"
  - id: '6.113.33'
    kind: verse
    lines:
      - "वसन्तं दण्डकारण्ये यं त्वं चीरजटाधरम्"
      - "अनुशोचसि काकुत्स्थं स त्वा कुशलमब्रवीत्"
    iast: "vasantaṃ daṇḍakāraṇye yaṃ tvaṃ cīrajaṭādharam | anuśocasi kākutsthaṃ sa tvā kuśalam abravīt"
  - id: '6.113.34'
    kind: verse
    lines:
      - "प्रियमाख्यामि ते देव शोकं त्यक्ष्यसि दारुणम्"
      - "अस्मिन्मुहूर्ते भ्रात्रा त्वं रामेण सह संगतः"
    iast: "priyam ākhyāmi te deva śokaṃ tyakṣyasi dāruṇam | asmin muhūrte bhrātrā tvaṃ rāmeṇa saha saṃgataḥ"
  - id: '6.113.38'
    kind: verse
    lines:
      - "ततो मुहूर्तादुत्थाय प्रत्याश्वस्य च राघवः"
      - "हनूमन्तमुवाचेदं भरतः प्रियवादिनम्"
    iast: "tato muhūrtād utthāya pratyāśvasya ca rāghavaḥ | hanūmantam uvācedaṃ bharataḥ priyavādinam"
  - id: '6.114.1'
    kind: verse
    lines:
      - "बहूनि नाम वर्षाणि गतस्य सुमहद्वनम्"
      - "शृणोम्यहं प्रीतिकरं मम नाथस्य कीर्तनम्"
    iast: "bahūni nāma varṣāṇi gatasya sumahad vanam | śṛṇomy ahaṃ prītikaraṃ mama nāthasya kīrtanam"
  - id: '6.114.2'
    kind: verse
    lines:
      - "कल्याणी बत गाथेयं लौकिकी प्रतिभाति मे"
      - "एति जीवन्तमानन्दो नरं वर्षशतादपि"
    iast: "kalyāṇī bata gātheyaṃ laukikī pratibhāti me | eti jīvantam ānando naraṃ varṣaśatād api"
  - id: '6.115.10'
    kind: verse
    lines:
      - "ततो यानान्युपारूढाः सर्वा दशरथस्त्रियः"
      - "कौसल्यां प्रमुखे कृत्वा सुमित्रां चापि निर्ययुः"
    iast: "tato yānāny upārūḍhāḥ sarvā daśarathastriyaḥ | kausalyāṃ pramukhe kṛtvā sumitrāṃ cāpi niryayuḥ"
  - id: '6.115.12'
    kind: verse
    lines:
      - "कृत्स्नं च नगरं तत्तु नन्दिग्राममुपागमत्"
      - "द्विजातिमुख्यैर्धर्मात्मा श्रेणीमुख्यैः सनैगमैः"
    iast: "kṛtsnaṃ ca nagaraṃ tat tu nandigrāmam upāgamat | dvijātimukhyair dharmātmā śreṇīmukhyaiḥ sanaigamaiḥ"
  - id: '6.115.26'
    kind: verse
    lines:
      - "ततो हर्षसमुद्भूतो निस्वनो दिवमस्पृशत्"
      - "स्त्रीबालयुववृद्धानां रामोऽयमिति कीर्तितः"
    iast: "tato harṣasamudbhūto nisvano divam aspṛśat | strībālayuvavṛddhānāṃ rāmo 'yam iti kīrtitaḥ"
  - id: '6.115.28'
    kind: verse
    lines:
      - "प्राञ्जलिर्भरतो भूत्वा प्रहृष्टो राघवोन्मुखः"
      - "स्वागतेन यथार्थेन ततो राममपूजयत्"
    iast: "prāñjalir bharato bhūtvā prahṛṣṭo rāghavonmukhaḥ | svāgatena yathārthena tato rāmam apūjayat"
  - id: '6.115.42'
    kind: verse
    lines:
      - "पादुके ते तु रामस्य गृहीत्वा भरतः स्वयम्"
      - "चरणाभ्यां नरेन्द्रस्य योजयामास धर्मवित्"
    iast: "pāduke te tu rāmasya gṛhītvā bharataḥ svayam | caraṇābhyāṃ narendrasya yojayām āsa dharmavit"
  - id: '6.116.24'
    kind: verse
    lines:
      - "हरियुक्तं सहस्राक्षो रथमिन्द्र इवानघः"
      - "प्रययौ रथमास्थाय रामो नगरमुत्तमम्"
    iast: "hariyuktaṃ sahasrākṣo ratham indra ivānaghaḥ | prayayau ratham āsthāya rāmo nagaram uttamam"
  - id: '6.116.38'
    kind: verse
    lines:
      - "ततो ह्यभ्युच्छ्रयन्पौराः पताकास्ते गृहे गृहे"
      - "ऐक्ष्वाकाध्युषितं रम्यमाससाद पितुर्गृहम्"
    iast: "tato hy abhyucchrayan paurāḥ patākās te gṛhe gṛhe | aikṣvākādhyuṣitaṃ ramyam āsasāda pitur gṛham"
  - id: '6.116.56'
    kind: verse
    lines:
      - "अभ्यषिञ्चन्नरव्याघ्रं प्रसन्नेन सुगन्धिना"
      - "सलिलेन सहस्राक्षं वसवो वासवं यथा"
    iast: "abhyaṣiñcan naravyāghraṃ prasannena sugandhinā | salilena sahasrākṣaṃ vasavo vāsavaṃ yathā"
  - id: '6.116.63'
    kind: verse
    lines:
      - "भूमिः सस्यवती चैव फलवन्तश्च पादपाः"
      - "गन्धवन्ति च पुष्पाणि बभूवू राघवोत्सवे"
    iast: "bhūmiḥ sasyavatī caiva phalavantaś ca pādapāḥ | gandhavanti ca puṣpāṇi babhūvū rāghavotsave"
  - id: '6.116.76'
    kind: verse
    lines:
      - "यथार्हं पूजिताः सर्वे कामै रत्नैश्च पुष्कलैर्"
      - "प्रहृष्टमनसः सर्वे जग्मुरेव यथागतम्"
    iast: "yathārhaṃ pūjitāḥ sarve kāmai ratnaiś ca puṣkalair | prahṛṣṭamanasaḥ sarve jagmur eva yathāgatam"
  - id: '6.116.80'
    kind: verse
    lines:
      - "राघवश्चापि धर्मात्मा प्राप्य राज्यमनुत्तमम्"
      - "ईजे बहुविधैर्यज्ञैः ससुहृद्भ्रातृबान्धवः"
    iast: "rāghavaś cāpi dharmātmā prāpya rājyam anuttamam | īje bahuvidhair yajñaiḥ sasuhṛdbhrātṛbāndhavaḥ"
  - id: '6.116.86'
    kind: verse
    lines:
      - "सर्वं मुदितमेवासीत्सर्वो धर्मपरोऽभवत्"
      - "राममेवानुपश्यन्तो नाभ्यहिंसन्परस्परम्"
    iast: "sarvaṃ muditam evāsīt sarvo dharmaparo 'bhavat | rāmam evānupaśyanto nābhyahiṃsan parasparam"
