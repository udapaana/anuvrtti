  modern: 'Roaming at large with you in a chariot of unequalled beauty on the hills Kailāsa, Mandara and Meru, in the garden of Caitraratha and all the other heavenly gardens, seeing many countries and wearing variegated clothes and garlands, I have been deprived of all pleasures and enjoyments, O hero, by your death. …

    '
6.99.20+1:
  dutt: Yuddha CXIII
  text: 'O fie on fickle fortune!

