6.99.11+1:
  dutt: Yuddha CXIII
  text: 'It is evident that the great ascetic Vishnu, having truth for his prowess—the soul of all beings, ever existing, without beginning, middle or end, greater than the great, the Preserver of the Nature, holding conch, discus and club, having Sribatsa on his breast, always beautiful, incapable of being conquered, without destruction, devoid of end, and the lord of all men, assuming this shape of a man and encircled by the celestials, assuming monkey shapes, hath for the behoof of mankind, slain (thee) the dreadful enemy of the gods with all (thy) family and Rakshasas.

    '
  modern: 'It is evident that the great ascetic Viṣṇu, whose prowess is truth, the soul of all beings, ever existing, without beginning, middle or end, greater than the great, the Preserver of Nature, holding conch, discus and club, with Śrīvatsa on his breast, always beautiful, unconquerable, indestructible, without end and lord of all men, taking this shape of a man and surrounded by the gods who have taken monkey shapes, has slain you, the dreadful enemy of the gods, with all your family and Rākṣasas, for the good of mankind.

    '
