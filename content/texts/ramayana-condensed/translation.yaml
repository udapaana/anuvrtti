  dutt: Yuddha XCIII
  text: 'Then regaining his consciousness after a long while, that foremost of Rakshasas—the king—overwhelmed with grief for his son, and distressed, burst into lamentations, with his senses wildered,—thus,—"O foremost in the Rakshasa army!

