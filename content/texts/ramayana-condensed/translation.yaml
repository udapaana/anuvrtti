6.97.29+4:
  dutt: Yuddha CXI
  text: '… The heroes abiding by the virtues of the Kshatriyas, who fall at the battle field for enhancing their glory, when dead, should not be mourned for. … Besides success in battle is not perpetual; either one slays his enemy or meets with his destruction at his hands in the conflict …

