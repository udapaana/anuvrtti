  dutt: Yuddha CI
  text: 'Having said this, Ravana, waxing furiously enraged, discharged at Lakshmana that dart forged by Maya with his power of illusion, furnished with eight bells, having mighty sounds,—incapable of being resisted,—competent to finish foes; and flaming in energy,— and shouted simultaneously.

