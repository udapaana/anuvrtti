  modern: 'These gods standing in the sky, with the saints, seeing you slain in battle, are shouting in glee.

    '
6.56.16:
  dutt: Yuddha LXVIII
  text: 'Now the beneficial words of Bibhishana have been verified. And as through blindness I did not accept the advice of that high-souled one, Kumbhakarna and of Prahasta, this disaster arisen, shameth me sore.

    '
  modern: 'Now the beneficial words of Vibhīṣaṇa have proved true. And since through blindness I did not accept the advice of that noble one, or of Kumbhakarṇa and Prahasta, this disaster that has come shames me sorely.

    '
6.56.18:
  dutt: Yuddha LXVIII
  text: 'And as [had disgraced the virtuous and graceful Bibhishana, this peril producing grief, hath been the consequence of my conduct".

    '
  modern: 'And since I disgraced the virtuous and graceful Vibhīṣaṇa, this peril, which brings grief, has been the consequence of my conduct."

    '
6.67.1:
  dutt: Yuddha LXXX
  text: 'Hearing of the destruction of Makaraksha, the heroic Ravana, being excited with ire, began to grind his teeth. Being thus angered, and thinking within himself what steps to take, he ordered his son Indrajit to proceed to the battle-field.

    '
  modern: 'Hearing of the destruction of Makarākṣa, the heroic Rāvaṇa, filled with anger, ground his teeth. Thus angered, and thinking within himself what steps to take, he ordered his son Indrajit to go to the battlefield.

    '
6.67.2:
  dutt: Yuddha LXXX
  text: '"O hero, gifted with great prowess as thou art, do thou, hidden (in clouds) or appearing before them, slay the two heroic brothers Rama and Lakshmana. Thou didst defeat in conflict Indra of unequalled prowess. Shalt thou then neglect to slay men as they are?"

    '
  modern: '"O hero of great prowess, hidden in the clouds or appearing before them, slay the two heroic brothers Rāma and Lakṣmaṇa. You defeated Indra, whose prowess is unequalled. Will you then neglect to slay men as they are?"

    '
6.67.4:
  dutt: Yuddha LXXX
  text: 'Being thus addressed by the lord of the Rakshasas and obeying his father’s command, Indrajit proceeded towards the sacrificial ground to satisfy Fire (with oblations).

