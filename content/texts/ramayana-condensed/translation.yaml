  modern: 'When you brought the daughter of the king of Mithilā to Laṅkā, what your younger brother Vibhīṣaṇa said, thinking and sighing, has now proved true, O you of long arms.

    '
6.99.23:
  dutt: Yuddha CXIII
  text: 'Thou, well-known for thy strength and manliness, art not worthy of being grieved by me. On account of my effeminate nature my understanding is possessed by sorrow.

    '
  modern: 'You, well known for your strength and manliness, are not to be grieved for by me. But because of my womanly nature, my understanding is possessed by sorrow.

    '
6.99.24:
  dutt: Yuddha CXIII
  text: 'Carrying thy pious and iniquitous deeds thou hast attained to thy own state—I am only lamenting for me who have been sorry for thy destruction.

    '
  modern: 'Carrying your pious and evil deeds, you have reached your own state; I am only lamenting for myself, who am sorry at your destruction.

    '
6.99.29:
  dutt: Yuddha CXIII
  text: 'Oh fie on this heart of mine which is not sundered into thousand (pieces) albeit distressed with the grief of thy death!"

