  modern: 'Then Rāma of long arms, who increases the glory of Raghu''s race, enraged, set on his bow an arrow like a serpent and cut off Rāvaṇa''s head, which wore shining earrings. And that head fell to the earth in the presence of the inhabitants of the three worlds.

