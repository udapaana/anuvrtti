# M. N. Dutt, The Ramayana, translated into English prose from the original Sanskrit of Valmiki (Calcutta: Deva Press, 1891–94).
# Public domain (Dutt d. 1912). Bāla and Ayodhyā from the proofread Gutenberg text (archive.org thermyanavolumeo57265gut);
# Araṇya, Kiṣkindhā and Sundara from the-ramayana-volume-two; Yuddha from the-ramayana-volume-three; all pinned in data/sources/ocr/.
# Dutt translates the vulgate; our ids are the critical edition's, "+N" a vulgate verse after that one. So every verse is
# aligned by content (`dutt:` is his book and section), then checked against our Sanskrit in a second pass: wrong sentences
# replaced, sentences running into verses our condensed text omits cut (" … " marks each cut; his words never rewritten),
# and an entry with no sentence of his to match deleted. `(with X)`: rendered in X's sentence. `modern`: his sense in plain
# present-day English. `departs`: where his English and our Sanskrit part.
source:
  translator: Manmatha Nath Dutt
  title: The Ramayana, translated into English prose from the original Sanskrit of Valmiki
  publisher: Deva Press
  year: 1891–1894
  archive:
  - thermyanavolumeo57265gut
  - the-ramayana-volume-two
  - the-ramayana-volume-three
1.1.1:
  dutt: Bāla I
  text: The ascetic Vālmiki asked that best of sages and foremost of those conversant with words, ever engaged in austerities and Vaidika studies, Nārada saying,— …
  modern: 'The ascetic Vālmīki, who was always engaged in austerities and Vedic study, asked Nārada, the best of sages and the foremost of speakers: …'
1.1.3:
  dutt: Bāla I
  text: Who is learned, hath studied society, and knoweth the art of pleasing his subjects? And who alone is ever lovely to behold?
  modern: Who is learned, understands society, and knows how to please his subjects? And who alone is always lovely to look at?
1.1.4:
  dutt: Bāla I
  text: Who hath subdued his heart, and controlled his anger, is endowed with personal grace, and devoid of malice; and whom, enraged in battle, do even the gods, fear?
  modern: Who has subdued his heart and controlled his anger, has personal grace and no malice? And when he is enraged in battle, whom do even the gods fear?
1.1.5:
  dutt: Bāla I
  text: Great is my curiosity to hear of such a person. Thou canst, O Maharshi tell me of a man of this description."
  modern: I am very curious to hear of such a person. You, O great sage (Maharshi), can tell me of a man like this."
1.1.6:
  dutt: Bāla I
  text: Hearing Valmiki’s words, Nārada, cognizant of the three worlds, said with alacrity,—"Do thou listen!
  modern: Hearing Vālmīki's words, Nārada, who knew the three worlds, said eagerly, "Listen!
1.1.7:
  dutt: Bāla I
  text: Rare as are the qualities mentioned by thee, I will, O sage, having duly considered, describe unto thee a person endued with them.
  modern: The qualities you mention are rare, O sage. But I have considered them, and I will describe to you a man who has them.
1.1.8:
  dutt: Bāla I
  text: There is one sprung from the line of Ikshwāku, known by the name of Rāma.
  modern: There is one born in the line of Ikṣvāku, known by the name of Rāma.
1.1.9:
  dutt: Bāla I
  text: … intelligent; learned in morality; eloquent; crowned with grace; the slayer of foes; broad-shouldered; possessed of mighty arms, a conch-shaped neck, fleshy jaws, … knowing duty; firm in promise; aye engaged in the good of his subjects; of accomplished renown; furnished with knowledge; pure in body and spirit; modest towards superiors; versed in self-knowledge; … protecting all; the destroyer of enemies, and supporter of all living beings; and the stay of order, practising all the duties of his class; and preserving those cleaving unto him; versed in the profundities of the Vedas and the Vedāngas; accomplished in archery; … ever resorted to by the good even as the ocean is, by the rivers; worthy of being honored; having an equal regard for all; and capable of filling the heart with ever-new sensations.
  modern: … intelligent, learned in right conduct, eloquent, graceful, a slayer of foes; broad-shouldered, with mighty arms, a conch-shaped neck, full jaws, … who knows duty and keeps his promises; always devoted to the good of his subjects; of established fame; learned; pure in body and spirit; modest toward his elders; versed in knowledge of the self; … protector of all; destroyer of enemies and supporter of all living beings; guardian of order, who practises all the duties of his class and protects those who rely on him; versed in the depths of the Vedas and Vedāṅgas; skilled in archery; … sought out by the good as the ocean is by the rivers; worthy of honor; equal toward all; and able to fill the heart with ever-new delight.
1.1.12:
  dutt: Bāla I
  text: (with 1.1.9)
1.1.13:
  dutt: Bāla I
  text: (with 1.1.9)
1.1.15:
  dutt: Bāla I
  text: (with 1.1.9)
1.1.16:
  dutt: Bāla I
  text: Crowned with every grace; he enhanceth the joys of Kaucalya; being like unto the sea in gravity, and unto the Himavat in patience.
  modern: With every virtue, he increases Kausalyā's joy. He is like the sea in depth and like the Himālaya in patience.
1.1.18:
  dutt: Bāla I
  text: … In giving away, he is like unto (Kuvera) the Bestower of riches, and in truth, he is like another Dharma. … Rāma, of infallible prowess, and endued with sterling virtues, …
  modern: … In giving he is like Kuvera, the bestower of riches, and in truth he is like a second Dharma. … Rāma, of unfailing prowess, endowed with fine virtues …
1.2.1:
  dutt: Bāla II
  text: Hearing those words of Nārada, that one of virtuous soul, skilled in speech, together with his disciples, worships that mighty sage. …
  modern: Hearing Nārada's words, the righteous great sage, skilled in speech, honored him together with his disciples.
1.2.3:
  dutt: Bāla II
  text: And when Nārada had left for the celestial regions, that holy person went to the banks of the Tamasā hard by the Jahnavi.
  modern: When Nārada had gone to the celestial regions, the holy man went to the bank of the Tamasā, near the Jāhnavī.
1.2.9:
  dutt: Bāla II
  text: In the vicinity of the wood, that worshipful one espied a pair of Kraunchas, emitting melodious notes, and ranging around in perfect peace of mind.
  modern: In the neighborhood of the wood, the worshipful sage saw a pair of Krauñca birds, calling sweetly and wandering about in perfect peace.
1.2.10:
  dutt: Bāla II
  text: At this juncture, a wicked-minded fowler, singling out the male without any cause of hostility, slew him in the very presence of the holy man.
  modern: Then a wicked-minded fowler, without any cause for hostility, singled out the male and killed him right in front of the holy man.
1.2.11:
  dutt: Bāla II
  text: And observing him struggling on the earth, bathed in blood his help-mate began to bewail in piteous accents, at the prospect of her separation from her copper-crested oviparous husband, engaged in sport with extended plumage.
  modern: Seeing him struggling on the ground, bathed in blood, his mate began to cry out in piteous tones. She grieved at being parted from her husband, who had a copper-colored crest and had been playing with his wings spread.
1.2.12:
  dutt: Bāla II
  text: Finding the oviparous one thus brought down by the fowler, the piety of that pious and righteous-souled Rishi was excited exceedingly.
  modern: Seeing the bird brought down by the fowler, the righteous sage was moved to great compassion.
1.2.14:
  dutt: Bāla II
  text: Then considering it to be an unrighteous deed, with a heart moved with pity, that twice-born one, beholding the weeping Kraunchi, spoke these words,—"O fowler, since thou hast slain one of a pair of Kraunchas, thou shalt never attain prosperity!"
  modern: Then, thinking it an unrighteous deed, with a heart moved by pity, the twice-born sage saw the weeping Krauñcī and said, "O fowler, since you have killed one of a pair of Krauñcas, you shall never attain prosperity!"
1.2.16:
  dutt: Bāla II
  text: … Revolving thus in his mind, that highly-wise one and best of sages addressed his disciple, saying,— …
  modern: 'Thinking it over in his mind, that very wise one, the best of sages, said to his disciple: …'
1.2.17:
  dutt: Bāla II
  text: … "This speech that I have uttered is of equal feet and accents; and is capable of being chaunted according to measure to stringed accompaniment. Let it therefore go forth as a sloka as it has come out of my sorrow!"
  modern: '"This speech I have uttered has equal feet and syllables, and it can be sung in measure to the strings. Since it came out of my sorrow, let it go forth as a śloka!"'
1.2.19:
  dutt: Bāla II
  text: Then having duly performed his ablutions at that holy spot, the reverend sage retraced his steps, pondering over the incidents touching the sloka.
  modern: Then, having duly bathed at that holy spot, the reverend sage turned back, pondering the matter of the śloka.
1.2.29:
  dutt: Bāla II
  text: 'Then smiling, Brahmft spoke unto that excellent sage,—"Those verses of thine which thou hast composed shall attain celebrity: no doubt need be entertained on this head.'
  modern: 'Then Brahmā smiled and spoke to the excellent sage: "The verses you have composed will become famous. You need have no doubt of this.'
1.2.31:
  dutt: Bāla II
  text: … Do thou relate unto the world the history of the righteous-souled and intelligent Rāma crowned with qualities. … And do thou, and thou hast heard it from Nārada, …
  modern: … Tell the world the history of the righteous and intelligent Rāma, who has every virtue. … And, as you have heard it from Nārada, …
1.2.35:
  dutt: Bāla II
  text: And as long as the mountains and the seas exist on earth, thy history of Rāmāyana will spread among men.
  modern: As long as the mountains and the seas exist on earth, your history of the Rāmāyaṇa will spread among men.
1.2.35+1:
  dutt: Bāla II
  text: The great ascetic Vālmiki of gracious appearance and unparalleled renown has composed hundreds of verses in melodious measure, couching the significance of the history of Rāma’s line.
  modern: The great ascetic Vālmīki, of gracious appearance and unequaled fame, has composed hundreds of verses in a melodious measure, setting down the meaning of the history of Rāma's line.
1.4.4:
  dutt: Bāla IV
  text: And he found those illustrious princes, the brothers Kusi and Lava, knowing morality, and living in a hermitage, and endowed with sweet voices,—apt at taking in the meaning of poetry.
  modern: He found the two illustrious princes, the brothers Kuśa and Lava, who knew morality and lived in a hermitage. They had sweet voices and were quick to take in the meaning of poetry.
1.4.10:
  dutt: Bāla IV
  text: And knowing the characteristics that go to make up the Drama, and gifted with mellifluous voices, those blameless princes, coming from Rāma’s body, and resembling him, even as the reflection of the solar or the lunar disc resembles that disc, …
  modern: Those blameless princes knew the marks of the drama and had sweet voices. They came from Rāma's body and resembled him, as the reflection of the sun or moon resembles the disc itself. …
1.5.1:
  dutt: Bāla V
  text: This great story of Rāmāyana treats of those victorious kings commencing with Prajāpati, and having Ikshwāku for their founder, who ruled the entire earth as no other kings had done so before them, …
  modern: This great story of the Rāmāyaṇa tells of those victorious kings who began with Prajāpati and had Ikṣvāku as their founder. They ruled the whole earth as no kings before them had done, …
1.5.3:
  dutt: Bāla V
  text: (with 1.5.1)
1.5.4:
  dutt: Bāla V
  text: We shall now chaunt the entire history of that dynasty from the beginning. Do ye, with minds free from ill will, listen to that story conferring merit, profit and pleasure.
  modern: 'We will now sing the whole history of that dynasty from the beginning. Listen to it without ill will: a story that brings merit, profit and pleasure.'
1.5.5:
  dutt: Bāla V
  text: There is on the banks of the Sarayu a great and flourishing country called Kosala abounding in corn and wealth, in which the inhabitants passed their days pleasantly.
  modern: On the banks of the Sarayū there is a great and flourishing country called Kosala, rich in grain and wealth, where the people lived in comfort.
1.5.6:
  dutt: Bāla V
  text: And the capital of that country was Ayodhyā famed among men which was founded by Manu himself—that foremost of men.
  modern: Its capital was Ayodhyā, famed among men, which Manu himself, the foremost of men, had founded.
1.5.9:
  dutt: Bāla V
  text: And that one bringing prosperity unto mighty kingdoms, King Daçarātha, lived in that city, like unto the lord of the deities inhabiting the celestial regions.
  modern: King Daśaratha, who brought prosperity to great kingdoms, lived in that city as the lord of the gods lives in heaven.
1.8.1:
  dutt: Bāla VIII
  text: And although engaged in austerities with the view of having sons born to him, the powerful and high-souled king, had no son capable of perpetuating his line.
  modern: The powerful and high-souled king practised austerities to have sons, but he had no son to carry on his line.
1.8.3:
  dutt: Bāla VIII
  text: … And that highly-energetic, pious and intelligent monarch, in consultation with all his counsellors of sedate minds, having made up his mind to celebrate the sacrifice, said unto that best of counsellors, Sumantra,— …
  modern: 'That very energetic, pious and intelligent king, after consulting all his steady-minded counsellors, made up his mind to perform the sacrifice, and said to Sumantra, the best of counsellors: …'
1.11.6:
  dutt: Bāla VIII
  text: Thereupon, going out speedily, Sumantra of swift movements called together all the spiritual guides, as well as others versed in the Vedic ritual; viz., Suyajna, and Vāmadeva, and Jāvāli, and Kācyapa, and Vasistha, and other principal twice-born ones.
  modern: 'Sumantra went out quickly and called together all the spiritual guides and others versed in Vedic ritual: Suyajña, Vāmadeva, Jābāli, Kāśyapa, Vasiṣṭha, and other chief twice-born men.'
1.11.10:
  dutt: Bāla VIII
  text: Thereat, the Brāhmanas with Vasistha at their head, exclaiming "Well! Well!" approved the words that had fallen from the lips of the monarch.
  modern: At this the Brāhmaṇas, with Vasiṣṭha at their head, said, "Well! Well!" and approved the words that had fallen from the king's lips.
1.11.12:
  dutt: Bāla VIII
  text: … And, O king, since with the intention of obtaining offspring thou purposest so piously, thou wilt surely obtain sons after thy heart."
  modern: … And, O king, since you are so piously set on having offspring, you will surely have sons after your own heart."
1.11.13:
  dutt: Bāla VIII
  text: And hearing these words of the regenerate ones, the king was highly gratified. And with eyes expanded in delight, he spoke unto his ministers,— …
  modern: 'Hearing these words of the twice-born, the king was very pleased. His eyes wide with delight, he spoke to his ministers: …'
1.11.14:
  dutt: Bāla VIII
  text: … "Do ye procure the necessary sacrificial articles, according to the injunction of my spiritual preceptors; and loose a horse protected by a competent person, and followed by one of the chief family priests; …
  modern: … Procure the necessary articles for the sacrifice, as my spiritual preceptors direct. Release a horse guarded by a competent man and followed by one of the chief family priests. …
1.11.19:
  dutt: Bāla VIII
  text: Thus addressed with due respect, the counsellors listened to the words of the monarch, and said, "So be it."
  modern: Treated with due respect, the counsellors listened to the king's words and said, "So be it."
1.12.34:
  dutt: Bāla XIV
  text: And with Rhishyasringa at their head, the principal twice born ones began the proceedings in that mighty horse-sacrifice of that high-souled monarch.
  modern: With Ṛṣyaśṛṅga at their head, the chief twice-born men began the proceedings of that mighty horse-sacrifice of the high-souled king.
1.13.30:
  dutt: Bāla XIV
  text: And that lord of men, desirous of removing his sins, at the proper time smelt the odour of the smoke arising from the fat, agreeably to the scriptures.
  modern: And the king, wishing to remove his sins, at the proper time smelled the smoke rising from the fat, as the scriptures direct.
1.14.4:
  dutt: Bāla XV
  text: And the deities, with the Gandharbas, and the Siddhas, and the principal saints, assembled there duly, with the object of each obtaining his share of the offerings.
  modern: The gods, with the Gandharvas, Siddhas, and chief sages, assembled there in due form, each to receive his share of the offerings.
1.14.5:
  dutt: Bāla XV
  text: And having duly assembled there, the deities addressed these words unto Brahmā, the lord of creatures,—"O thou possessed of the six attributes, through thy grace, a Rākshasa named Rāvana oppresses us all by his prowess,—nor can we baffle him.
  modern: 'Having assembled there in due form, the gods spoke to Brahmā, the lord of creatures: "O lord of the six attributes, by your grace a Rākṣasa named Rāvaṇa oppresses us all with his prowess, and we cannot withstand him.'
1.14.6:
  dutt: Bāla XV
  text: (with 1.14.5)
1.14.6+1:
  dutt: Bāla XV
  text: Thus besought that foremost of gods and chief of celestials, Vishnu, worshipped of all creatures, addressed the assembled deities, following Duty, with the Grand-sire at their head, saying,— "Do ye renounce fear! For your behoof, slaying in battle the wily and irrepressible Rāvana, dreadful unto the saints and the celestials, together with his sons, and grandsons, and friends, and counsellors, and relatives, and acquaintances, I will abide among mortals, ruling this earth for ten thousand and as many hundred years."
  modern: 'Thus begged, Viṣṇu, the foremost of gods and chief of the celestials, worshipped by all creatures, spoke to the assembled gods, who followed duty and had the Grandsire at their head: "Give up your fear! For your sake I will kill in battle the cunning and irrepressible Rāvaṇa, who is dreadful to the sages and gods, together with his sons, grandsons, friends, counsellors, relatives, and acquaintances. And I will live among mortals and rule this earth for eleven thousand years."'
1.14.6+2:
  dutt: Bāla XV
  text: (with 1.14.6+1)
1.14.6+3:
  dutt: Bāla XV
  text: (with 1.14.6+1)
1.14.6+4:
  dutt: Bāla XV
  text: Having thus conferred a boon upon the gods, the god Vishnu of subdued soul fell to thinking as to the place where he would be born among men.
  modern: Having thus granted a boon to the gods, the god Viṣṇu, of subdued soul, began to think about where he would be born among men.
1.15.9:
  dutt: Bāla XVI
  text: And then himself bearing in his hands a capacious vessel made of burnished gold, with a silver cover,—dear like unto a spouse, and resembling the divine Creative energy, filled with celestial Pāyasa,, from out the sacrificial fire of Daçarātha initiated into the ceremony, there arose a mighty being, of unparalleled prowess, high energy, and huge strength, …
  modern: Then, from the sacrificial fire of Daśaratha, who had been initiated into the ceremony, there arose a mighty being of unequaled prowess, high energy, and great strength. … He carried in his hands a large vessel of burnished gold with a silver cover, dear to him like a wife and like the divine creative energy, filled with celestial pāyasa. …
1.15.13:
  dutt: Bāla XVI
  text: (with 1.15.9)
1.15.17:
  dutt: Bāla XVI
  text: Do thou foremost of kings, accept this excellent and divinly-prepared Pāyasa, conferring sons, health, and affluence, …
  modern: Best of kings, take this fine Pāyasa, prepared by the gods, which brings sons, health and wealth. …
1.15.18:
  dutt: Bāla XVI
  text: … which thou art to give unto thy worthy consorts, saying,—Partake it. Through them thou wilt, O monarch, obtain sons,—for obtaining whom thou hast performed this sacrifice."
  modern: … Give it to your worthy wives and tell them to eat it. Through them you will have sons, O king, for whose sake you performed this sacrifice."
1.15.24:
  dutt: Bāla XVI
  text: Then entering the inner apaitment, he spake unto Kausalya, saying,—"Take thou this Pāyasa; for this will make thee bear a son."
  modern: Then he went into the inner apartment and said to Kausalyā, "Take this pāyasa; it will make you bear a son."
1.15.25:
  dutt: Bāla XVI
  text: Having said this,the king offered unto her a portion of this Pāyasa. Then he conferred upon Sumitrā a fourth of it. Then in order that she might have a son, king Daçarātha made over unto Kaikeyi an equal portion of what remained.
  modern: Having said this, the king gave her a portion of the pāyasa. Then he gave Sumitrā a fourth of it. Then, so that she might have a son, King Daśaratha gave Kaikeyī an equal portion of what remained.
1.15.26:
  dutt: Bāla XVI
  text: And then having reflected, the mighty-minded one gave unto Sumitrā the remaining portion of the Pāyasa resembling ambrosia.
  modern: Then, after reflection, the high-minded king gave Sumitrā the remaining portion of the pāyasa, which was like ambrosia.
1.16.1:
  dutt: Bāla XVII
  text: When Vishnu had accepted the sonship of that high-souled king, the self-create Lord addressed the celestials, saying,— …
  modern: 'When Viṣṇu had accepted to become the son of that high-souled king, the self-created lord addressed the gods: …'
1.16.7:
  dutt: Bāla XVII
  text: Hearing this mandate of Him possessed of the six attributes, they began to produce sons endowed with monkey-forms.
  modern: Hearing this command of the lord of the six attributes, they began to beget sons in the form of monkeys.
1.17.1:
  dutt: Bāla XVIII
  text: When the horse-sacrifice of the high-souled Daçarātha had been completed, the immortals, accepting each his share, returned whence they had come.
  modern: When the horse-sacrifice of the high-souled Daśaratha was complete, the immortals accepted their shares and returned to where they had come from.
1.17.1+1:
  dutt: Bāla XVIII
  text: … in the twelfth month, on the ninth lunar day, under the influence of the Punarvasu asterism, when the Sun, the Moon, Saturn, Jupiter, and Venus were at Arius, Capricorn, Libra, Cancer, and Pisces, …
  modern: … in the twelfth month, on the ninth lunar day, under the Punarvasu asterism, with the Sun, the Moon, Saturn, Jupiter, and Venus in Aries, Capricorn, Libra, Cancer, and Pisces, …
1.17.8:
  dutt: Bāla XVIII
  text: And then was born of Kaikeyi, Bharata, having truth for prowess, endowed with all the virtues, and the very fourth part of Vishnu.
  modern: Then Bharata was born of Kaikeyī. He had truth for his prowess, was endowed with every virtue, and was a fourth part of Viṣṇu.
1.17.9:
  dutt: Bāla XVIII
  text: And then Sumitrā gave birth unto Lakshmana and Satrughna, heroic, and skilled in all weapons, and endowed with the half of Vishnu.
  modern: Then Sumitrā gave birth to Lakṣmaṇa and Śatrughna, heroic and skilled in all weapons, endowed with half of Viṣṇu.
1.17.9+1:
  dutt: Bāla XVIII
  text: And Bharata of purged intelligence was born under the asterism Pushyā, when the Sun had entered Pisces; while the two sons of Sumitrā were born when the Sun arose in Cancer, under the asterism of Asleshā.
  modern: Bharata, of clear mind, was born under the asterism Puṣya, when the Sun had entered Pisces. The two sons of Sumitrā were born when the Sun rose in Cancer, under the asterism Āśleṣā.
1.17.10:
  dutt: Bāla XVIII
  text: And thus were separately born four high-souled sons unto the king, crowned with qualities, and graceful, and in loveliness resembling the constellations Prosthapada …
  modern: So four high-souled sons were born to the king, one by one. They were virtuous and handsome, and as lovely as the Proṣṭhapada stars.
1.17.11:
  dutt: Bāla XVIII
  text: And when the eleventh day had gone by, the king performed the Naming ceremony of his sons. And experiencing great delight, Vasishtha conferred the names. And the high-souled eldest one was called Rāma; and Kaikeyi’s son was called Bharata; and Sumitrā’s son was called Lakshmana,— and the last was named Satrughna.
  modern: When the eleventh day had passed, the king performed the naming ceremony of his sons. Vasiṣṭha, greatly pleased, gave the names. The high-souled eldest was called Rāma; Kaikeyī's son was called Bharata; Sumitrā's son was called Lakṣmaṇa, and the last was named Śatrughna.
1.17.12:
  dutt: Bāla XVIII
  text: (with 1.17.11)
1.17.16:
  dutt: Bāla XVIII
  text: And even from early youth, that enhancer of auspiciousness, Lakshmana, was ever attached unto his eldest brother Rāma, that delight of all. And like unto another life of Rāma, Lakshmana furnished with auspiciousness was in everything attentive to Rāma’s wishes, even at the neglect of his own person.
  modern: From early youth, Lakṣmaṇa, who increased auspiciousness, was always attached to his eldest brother Rāma, the delight of all. Like a second life of Rāma, Lakṣmaṇa, who had every good mark, attended to Rāma's wishes in everything, even at the neglect of his own person.
1.17.20:
  dutt: Bāla XVIII
  text: And on account of those exalted and well-beloved sons of his, Daçarātha experienced the excess of joy, like unto the Grand-sire on account of the celestials.
  modern: Because of those exalted and beloved sons, Daśaratha felt great joy, like the Grandsire on account of the gods.
1.17.22:
  dutt: Bāla XVIII
  text: And once upon a time, when the virtuous king Daçarātha, surrounded by his priests and friends, was reflecting about the nuptials of his sons, unto that high-souled one engaged in thought in the midst of his counsellors came the mighty ascetic Viswamitra.
  modern: Once, when the virtuous King Daśaratha was thinking about his sons' marriages, surrounded by his priests and friends, the mighty ascetic Viśvāmitra came to him as he sat thinking among his counsellors.
1.17.23:
  dutt: Bāla XVIII
  text: (with 1.17.22)
1.17.32:
  dutt: Bāla XVIII
  text: Then gladly worshipping the mighty ascetic, Viswāmitra, the exceedingly generous king, well-pleased, addressed him, saying,—"Like unto the obtaining of ambrosia, like unto a shower in a land suffering from drouth, like unto the birth of sons of worthy wives to him without issue, like unto the recovery of a lost thing, yea,—like unto the dawning of a mighty joy, I consider this thy arrival. illustrious ascetic, thou art well come.
  modern: Then the very generous king, glad and pleased, worshipped the mighty ascetic Viśvāmitra and said to him, "Your arrival is to me like obtaining ambrosia, like rain on a land suffering from drought, like the birth of sons to a man without issue by worthy wives, like the recovery of a lost thing, like the dawning of a great joy. Illustrious ascetic, you are welcome.
1.17.33:
  dutt: Bāla XVIII
  text: (with 1.17.32)
1.17.34:
  dutt: Bāla XVIII
  text: What is even that which is nearest to thy heart. What shall I do for thee, experiencing sincere pleasure? Thou, O Brāhmana, art worthy of my best services. By luck it is that, O bestower of honor, I have gained thee. To-day my birth hath been crowned with fruit—to day hath my life attained its object.
  modern: What is it that lies nearest your heart? What shall I do for you, with such sincere pleasure? You, O Brāhmaṇa, deserve my best service. By good luck I have gained you, O giver of honor. Today my birth has borne fruit; today my life has achieved its purpose.
1.17.35:
  dutt: Bāla XVIII
  text: Having first attained exceeding effulgence by virtue of austerities performed for obtaining the title of Rājarshi, thou hast afterwards obtained the status of a Brahmārshi. Thou art worthy of manifold homage from me.
  modern: "Having first attained great radiance by austerities performed to win the title of Rājarṣi, you afterward reached the state of a Brahmarṣi. You deserve manifold homage from me."
1.17.37:
  dutt: Bāla XVIII
  text: Tell me, what is it that thou wouldst have,—and what is the purpose of thy coming? I wish that I may be obliged by doing thy will.
  modern: Tell me what you want and what is the purpose of your coming. I wish to be obliged by doing your will.
1.18.1:
  dutt: Bāla XIX
  text: Hearing those astonishing words of that lion-like king, the highly-energetic Viswāmitra with his down standing on end, said,— …
  modern: 'Hearing those wonderful words of the lion-like king, the very energetic Viśvāmitra, his hair standing on end with joy, said: …'
1.18.4:
  dutt: Bāla XIX
  text: For celebrating a sacrifice, I, O foremost of men, abide by some prescribed course. And it comes to pass that two Rākshasas assuming shapes at will, have become bent upon disturbing the ceremony.
  modern: For the sake of a sacrifice, O foremost of men, I keep a prescribed course of observance. And two Rākṣasas who can take any shape at will have set themselves to disturb the ceremony.
1.18.5:
  dutt: Bāla XIX
  text: And in that sacrifice which I have determined to bring to a completion, and which is on the eve of being completed, both these Rākshasas, Maricha and Suvihu, accomplished in arms and possessed of prowess, shower flesh and gore upon the altar.
  modern: In the sacrifice that I have resolved to complete, and which is now close to completion, these two Rākṣasas, Mārīca and Subāhu, skilled in arms and mighty, shower flesh and blood upon the altar.
1.18.7:
  dutt: Bāla XIX
  text: And, O monarch, I cannot bring myself to vent my wrath; for such is the nature of that business, that it is not proper for one engaged in it to utter a curse.
  modern: And, O king, I cannot bring myself to let loose my wrath, for the nature of this work is such that one engaged in it must not utter a curse.
1.18.8:
  dutt: Bāla XIX
  text: Therefore, O foremost of monarchs, it behoves thee to grant me thy eldest son, the heroic Rāma of genuine prowess, with the side-locks.
  modern: Therefore, O foremost of kings, you should give me your eldest son, the heroic Rāma, of true prowess, with his side-locks.
1.18.9:
  dutt: Bāla XIX
  text: By virtue of his own divine energy, he, being protected by me, is capable of even destroying those Rākshasas disturbing the ceremony.
  modern: By his own divine energy, and protected by me, he is able to destroy even those Rākṣasas who disturb the ceremony.
1.18.11:
  dutt: Bāla XIX
  text: And encountering Rāma,they will by no means be able to stand him, nor is there any other who dares to slay them.
  modern: And once they meet Rāma, they cannot stand against him at all, and no one else dares to kill them.
1.18.13:
  dutt: Bāla XIX
  text: Nor, king, ought thou to indulge in paternal affection. … I tell thee, do thou consider the Rākshasas as already slain.
  modern: 'You should not give way to a father''s love, O king. I tell you: think of those Rākṣasas as already dead.'
1.18.14:
  dutt: Bāla XIX
  text: I know full well Rāma of sterling prowess,—as also the highly-energetic Vasishtha and the other ascetics present here.
  modern: I know Rāma well, of true prowess, and so do the very energetic Vasiṣṭha and the other ascetics present here.
1.19.1:
  dutt: Bāla XX
  text: Hearing the words of Viswāmitra, that best of monarchs remained insensible for a time,—and then regaining his sense, spake thus,—"My lotus-eyed Rāma is not yet turned of sixteen; and I do not perceive his fitness to cope with Rākshasas in battle.
  modern: Hearing the words of Viśvāmitra, that best of kings remained senseless for a time, and then, regaining his senses, said, "My lotus-eyed Rāma is not yet sixteen, and I do not see that he is fit to fight the Rākṣasas in battle.
1.19.2:
  dutt: Bāla XX
  text: (with 1.19.1)
1.19.3:
  dutt: Bāla XX
  text: I am the lord of this Akshaukini of forces. Marching with this, will I engage with the night-rangers.
  modern: I am the lord of this akṣauhiṇī of forces. I will march with it and fight the night-rangers.
1.19.4:
  dutt: Bāla XX
  text: And these servants of mine are valiant, and warlike, and accomplished in weapons, and capable of fighting the Rākshasas,—therefore, it behoveth thee not to take Rāma.
  modern: My servants are valiant, warlike, and skilled in weapons, and able to fight the Rākṣasas, so you should not take Rāma.
1.19.7:
  dutt: Bāla XX
  text: And youthful, and unaccomplished, and not knowing what constitutes strength and what not, and not equipped with the energy of science,—and unskilful in fight, he is not a match for Rākshasas,—they being deceitful warriors.
  modern: He is young and untrained; he does not know what is strength and what is not, and he has no power of science. He is unskilled in fighting, and no match for the Rākṣasas, who are deceitful warriors.
1.20.9:
  dutt: Bāla XXI
  text: Accomplished or not accomplished in weapons, the Rākshasas cannot bear him protected by Kuçika’s son, like ambrosia, by flaming fire.
  modern: Skilled in weapons or not, the Rākṣasas cannot stand against him when he is protected by Kuśika's son, as ambrosia is protected by flaming fire.
1.20.10:
  dutt: Bāla XXI
  text: 'This one is Virtue incarnate: this one is the foremost of those possessing prowess. This one surpasseth all others in learning, and is the refuge of asceticism.'
  modern: He is virtue itself; he is the foremost of those who have prowess. He surpasses all others in learning and is the refuge of asceticism.
1.20.11:
  dutt: Bāla XXI
  text: This one is cognizant of all the weapons that exist in the three worlds furnished with mobile and imobile things; but others do not know him,—nor yet shall know him hereafter.
  modern: "He knows all the weapons that exist in the three worlds, with their moving and unmoving things, but others do not know him, nor will they know him hereafter."
1.20.11+1:
  dutt: Bāla XXI
  text: The descendant of Kuçika is himself capable of repressing the Rākshasas; and it is in order to thy son’s welfare that coming unto thee, he asketh for him of thee."
  modern: Kuśika's son is himself able to restrain the Rākṣasas, and it is for your son's welfare that he comes to you and asks for him."
1.21.1:
  dutt: Bāla XXII
  text: Upon Vasishtha’s representing this, king Daçarātha himself with a complacent countenance, summoned unto him Rāma and Lakshmana.
  modern: At Vasiṣṭha's urging, King Daśaratha, with a pleased face, called Rāma and Lakṣmaṇa to him.
1.21.2:
  dutt: Bāla XXII
  text: And when the auspicious rites had been performed by both Rāma’s father and mother, and when the priest Vasishtha had uttered mantras, king Daçarātha, smelling his son’s crown, with a glad heart, made him over unto the descendant of Kuçika.
  modern: When Rāma's father and mother had performed the auspicious rites, and the priest Vasiṣṭha had recited mantras, King Daśaratha smelled his son's head, and with a glad heart handed him over to the descendant of Kuśika.
1.21.3:
  dutt: Bāla XXII
  text: (with 1.21.2)
1.21.6:
  dutt: Bāla XXII
  text: Viçwāmitra went first, and next the highly famous Rāma with the side-locks, holding the bow. And him followed Sumitrā’s son.
  modern: Viśvāmitra went first, and next went the famous Rāma, with his side-locks, holding his bow. Sumitrā's son followed him.
1.21.9:
  dutt: Bāla XXII
  text: And having proceeded over half a Yojana, and arriving at the right bank of the Sarayu, Viçwāmitra addressed these sweet words unto Rāma,— …
  modern: "After going more than half a yojana, on the right bank of the Sarayū, Viśvāmitra spoke to Rāma in a sweet voice: …"
1.21.10:
  dutt: Bāla XXII
  text: '… "O Rāma! do thou, O child, take of this water: let no delay occur. Do thou receive the mantras Valā and Ativalā,— …'
  modern: '"Rāma, my child, take this water; let there be no delay. Receive the mantras Balā and Atibalā. …'
1.21.12:
  dutt: Bāla XXII
  text: And, O Rāma, the might of thy arms will be unequalled in this world,—nay, in all the three worlds. There shall be none—thy equal.
  modern: And, O Rāma, the strength of your arms will be unequaled in this world, indeed in all three worlds. There will be no one your equal.
1.21.18:
  dutt: Bāla XXII
  text: Thereat Rāma with a cheerful countenance sipping water, with a purified body received those sciences from the Maharshi of subdued soul. And furnished with the sciences, Rāma of dreadful prowess appeared resplendent, even like the adorable autumnal Sun invested with a thousand rays.
  modern: Then Rāma, with a cheerful face, sipped water, and with a purified body received those sciences from the self-controlled great sage. Furnished with the sciences, Rāma of dreadful prowess shone like the adorable autumn sun with a thousand rays.
1.21.18+1:
  dutt: Bāla XXII
  text: (with 1.21.18)
1.21.19:
  dutt: Bāla XXII
  text: Then Rāma having rendered unto Kuçika’s son all the duties appertaining to a spiritual guide, the three happily spent that night on the banks of the Sarayu.
  modern: Then Rāma performed for Kuśika's son all the duties owed to a spiritual guide, and the three spent that night happily on the bank of the Sarayū.
1.22.1:
  dutt: Bāla XXIII
  text: And when the night had passed away, the mighty ascetic spoke unto Kākutstha, lying down on a bed of leaves, — …
  modern: 'When the night had passed, the great sage spoke to Kākutstha, who lay on a bed of leaves: …'
1.22.2:
  dutt: Bāla XXIII
  text: … "O Rāma, the best son of Kaucalyā, the first Sandhyā should now be performed. Do thou, O foremost of men, arise! Thou shouldst perform the purificatory rites and contemplate the gods."
  modern: "\"Rāma, best son of Kausalyā, the first twilight rite should now be performed. Get up, best of men! You should perform the purifying rites and meditate on the gods.\""
1.22.3:
  dutt: Bāla XXIII
  text: Hearing those proper words of the ascetic, those foremost of men, endowed with heroism, bathed, and, offering Arghya, began to recite the Gāyatri.
  modern: Hearing the sage's fitting words, those heroic princes bathed, offered arghya, and began to recite the Gāyatrī.
1.23.11:
  dutt: Bāla XXIV
  text: And beholding a dreadful trackless forest, that son of the foremost of men, Ikshhwaku’s descendant, asked that best of ascetics, saying,— "Ah! deep is this forest abounding in crickets; and filled with terrible ferocious beasts,and various birds possessed of shocking voices and screaming frightfully; …
  modern: 'Seeing a dreadful, trackless forest, the son of the best of kings, the descendant of Ikṣvāku, asked the best of sages: "Ah, this forest is dense! It rings with crickets and is full of terrible wild beasts, and birds with harsh voices screaming frightfully. …'
1.23.12:
  dutt: Bāla XXIV
  text: (with 1.23.11)
1.23.25:
  dutt: Bāla XXIV
  text: Her name, good betide thee! was Tārakā, and she was the spouse of the intelligent Sunda—she whose son is the Rākshasa, Māricha possessed of the prowess of Sacra; …
  modern: Her name, bless you, was Tāṭakā, and she was the wife of the wise Sunda. Her son is the Rākṣasa Mārīca, who has the prowess of Śakra. …
1.23.27:
  dutt: Bāla XXIV
  text: And now at the distance of over half a Yojana, she stayeth, obstructing the way. And since this forest belongeth unto Tārakā, thou shouldst repair thither …
  modern: "Now she stays more than half a yojana from here, blocking the way. And since this forest belongs to Tāṭakā, you must go there. …"
1.24.13:
  dutt: Bāla XXV
  text: Do thou, O descendant of Raghu, for the welfare of Brāhmanas and kine, slay this exceedingly terrible Yakshi of wicked ways and vile prowess!
  modern: O descendant of Raghu, for the welfare of Brāhmaṇas and cows, kill this very terrible Yakṣī of wicked ways and vile prowess!
1.24.13+1:
  dutt: Bāla XXV
  text: And whether an act be cruel or otherwise, slightly or highly sinful, it should for protecting the subjects, be performed by a ruler.
  modern: Whether an act is cruel or not, slightly or highly sinful, a ruler must perform it to protect his subjects.
1.24.16:
  dutt: Bāla XXV
  text: Of those engaged in the onerous task of government, even this is the eternal rule of conduct. Do thou, O Kukutstha, slay this impious one; for she knoweth no righteousness!
  modern: For those engaged in the heavy task of government, this is the eternal rule of conduct. O Kākutstha, kill this wicked woman, for she knows no righteousness!
1.25.2:
  dutt: Bāla XXVI
  text: … "In accordance with the desire of my sire, and in order to glorify it, I ought fearlessly to do even as Kuçika’s son sayeth.
  modern: "\"Because my father told me to, and out of respect for his word, I should do what Kuśika's son says without fear."
1.25.3:
  dutt: Bāla XXVI
  text: And havingbeen desired to that end while at Ayodhyā by that high-souled one, my father Daçarātha, in the midst of the spiritual guides, I ought not to pass by thy words. …
  modern: My father Daśaratha, the high-souled, told me so himself in Ayodhyā in the midst of the spiritual guides, and I must not pass over your words. …
1.25.5:
  dutt: Bāla XXVI
  text: And in the interests of Brāhmanas, kine, and celestials, I am ready to act as desired by thee of immeasurable energy."
  modern: And for the sake of Brāhmaṇas, cows, and the gods, I am ready to do as you, whose energy is immeasurable, desire."
1.25.6:
  dutt: Bāla XXVI
  text: Having said this, that repressor of foes, with clenched fist, twanged his bow-string, filling the ten cardinal points with the sounds.
  modern: Having said this, that subduer of foes clenched his fist on the bow and twanged the string, filling the ten directions with the sound.
1.25.8:
  dutt: Bāla XXVI
  text: … And, rendered almost insensible by anger, that Rākshasi furiously rushed in amain towards the spot whence had come the report.
  modern: Almost senseless with anger, that Rākṣasī rushed furiously toward the place the sound had come from.
1.25.8+1:
  dutt: Bāla XXVI
  text: And raising thick clouds of dust, Tārakā instantly bewildered both the descendants of Raghu.
  modern: Raising thick clouds of dust, Tāṭakā at once bewildered both descendants of Raghu.
1.25.8+2:
  dutt: Bāla XXVI
  text: … she possessed of the powers of illusion, rushed against Kākutstha and Lakshmana, uttering terrible roars.
  modern: … she, mistress of illusion, rushed at Kākutstha and Lakṣmaṇa, roaring terribly.
1.25.14:
  dutt: Bāla XXVI
  text: And as that Yakshi, in prowess like unto a thunder-bolt, was rushing on, Rāma pierced her chest with arrows,—and thereat she dropped down and died.
  modern: As that Yakṣī, with the force of a thunderbolt, came rushing on, Rāma pierced her chest with arrows, and she fell down and died.
1.25.21:
  dutt: Bāla XXVI
  text: And now came evening on, when that best of ascetics, gratified at the destruction of Taraki, smelt Rami’s crown and said these words,— …
  modern: 'Evening came on. The best of sages, pleased at Tāṭakā''s death, smelled Rāma''s head and said these words: …'
1.25.21+1:
  dutt: Bāla XXIX
  text: Saying this, taking Rāma and Lakshmana, the mighty ascetic, experiencing exceeding delight, entered that asylum, and appeared graceful, like the Moon emerged from mist in conjunction with the Punarvasu stars.
  modern: Saying this, the mighty ascetic, filled with great delight, took Rāma and Lakṣmaṇa and entered that hermitage. He shone like the Moon coming out of mist in conjunction with the Punarvasu stars.
1.28.19:
  dutt: Bāla XXX
  text: Thus addressed, that mighty saint of exceeding energy, with his mind subdued, and senses under restraint, caused himself to be initiated into the ceremony.
  modern: So addressed, that mighty, very energetic sage, his mind and senses restrained, had himself initiated into the rite.
1.29.7:
  dutt: Bāla XXX
  text: And when time had thus gone by and the sixth day had arrived, Rāma said unto Sumitrā’s son,—"Being well equipped, be thou vigilant!"
  modern: When time had passed in this way and the sixth day had come, Rāma said to Sumitrā's son, "Be well armed and watchful!"
1.29.10:
  dutt: Bāla XXX
  text: And as in the rains, masses of clouds appear enveloping the firmament, the Rākshasas, displaying illusions in that wise, began to rush onward.
  modern: As in the rainy season masses of clouds cover the sky, the Rākṣasas, displaying their illusions, began to rush forward.
1.29.12:
  dutt: Bāla XXX
  text: And suddenly seeing them rushing in amain, the lotus-eyed Rāma fixing his gaze at Lakshmana, said,— …
  modern: 'Suddenly seeing them rushing on, lotus-eyed Rāma looked at Lakṣmaṇa and said: …'
1.29.14:
  dutt: Bāla XXX
  text: … that descendant of Raghu, Rāma, in vehemence fixing on his bow an exceedingly mighty and gloriously-dazzling Mānava weapon, discharged it in great wrath at Māricha’s chest. …
  modern: … Rāma, the descendant of Raghu, in great anger fixed on his bow an exceedingly mighty and dazzling Mānava weapon and shot it at Mārīca's chest. …
1.29.14+1:
  dutt: Bāla XXX
  text: Having said this, anon showing unto Lakshmana his lightness of hand, Raghu’s descendant took out a mighty Agneya weapon, and discharged it at the breast of Suvāhu. Thereat being pierced with that shaft, he fell down upon the ground.
  modern: Having said this, and showing Lakṣmaṇa his quickness of hand, the descendant of Raghu took out a mighty Āgneya weapon and shot it at Subāhu's breast. Pierced by that shaft, he fell to the ground.
1.29.19:
  dutt: Bāla XXX
  text: (with 1.29.14+1)
1.29.21:
  dutt: Bāla XXX
  text: … And having destroyed all those Rākshasas disturbing sacrifices, Raghu’s descendant was honored by the saints, even as Indra in days of yore, after having vanquished the Asuras.
  modern: Having destroyed all the Rākṣasas who disturbed the sacrifice, the descendant of Raghu was honored there by the sages, as Indra was long ago after defeating the Asuras.
1.29.22:
  dutt: Bāla XXX
  text: And when the sacrifice had been completed, the mighty ascetic Viçwāmitra, beholding all sides cleared of Rākshasas, spake unto Kākutstha, saying,— …
  modern: 'When the sacrifice was finished, the great sage Viśvāmitra, seeing every quarter cleared of Rākṣasas, said to Kākutstha: …'
1.30.6:
  dutt: Bāla XXXI
  text: … "A highly meritorious sacrifice, O foremost of men, is to be celebrated by Mithila’s lord, Janaka. Thither shall we repair.
  modern: '"Best of men, Janaka, lord of Mithilā, is going to hold a most righteous sacrifice. We will go there.'
1.30.7:
  dutt: Bāla XXXI
  text: And thou, O great among men, must accompany us, and there behold a wonderful jewel of a bow.
  modern: And you, O great man, must come with us, and see there a wonderful jewel of a bow.
1.49.1:
  dutt: Bāla L
  text: Then proceeding north-east Rāma in company with Sumitrā’s son, placing Viçwāmitra at their head, appeared before the sacrificial ground.
  modern: Then Rāma, with Sumitrā's son, went north-east, with Viśvāmitra at their head, and came to the sacrificial ground.
1.49.6:
  dutt: Bāla L
  text: And hearing of Viçwāmitra’s arrival, the best of monarchs without blame, placing the priests Satānanda before him, as well as the high-souled family priests, …
  modern: Hearing of Viśvāmitra's arrival, the blameless best of kings set the priest Śatānanda before him, with the high-souled family priests, …
1.49.14:
  dutt: Bāla L
  text: … Blessed and obliged am I whose sacrificial ground, O Brāhmana, hath been graced by thee along with these ascetics.
  modern: … I am blessed and obliged that you and these ascetics have graced my sacrificial ground, O Brāhmaṇa.
1.49.17:
  dutt: Bāla L
  text: … "These youths, good betide thee, like unto celestials in prowess, of the gait of lions or elephants, heroic, and resembling tigers or bulls, …
  modern: '"These youths, bless you, are like gods in prowess. They walk like lions or elephants; they are heroes, like tigers or bulls. …'
1.49.21:
  dutt: Bāla L
  text: … resemble each other in bodily proportions, expression, and gestures; wearing side-locks and of warlike mien? This I would hear truly related."
  modern: … They resemble each other in build, expression and gestures; they wear side-locks and look warlike. I would like to hear the truth of it."
1.49.22:
  dutt: Bāla L
  text: Hearing this speech of the high-souled Janaka, that ascetic of immeasurable soul related all about Daçarātha’s sons,—their sojourn in Siddhāçrama, and the slaughter there of the Rākshasas,their undaunted journey, the sight of Viçāla, the encounter with Ahalyā and Gautama, Rāma’s curiosity about the mighty bow, and visit there for beholding the same.
  modern: 'Hearing this speech of the high-souled Janaka, the ascetic of immeasurable soul told all about Daśaratha''s sons: their stay in Siddhāśrama and the slaying of the Rākṣasas there, their undaunted journey, the sight of Viśālā, the meeting with Ahalyā and Gautama, Rāma''s curiosity about the mighty bow, and their visit to see it.'
1.49.23:
  dutt: Bāla L
  text: (with 1.49.22)
1.49.24:
  dutt: Bāla L
  text: (with 1.49.22)
1.65.7:
  dutt: Bāla LXVI
  text: Thus accosted, Janaka replied unto the mighty Muni, saying,—"Listen to why the bow lieth here.
  modern: Thus addressed, Janaka replied to the great sage, "Listen to why the bow lies here.
1.65.26:
  dutt: Bāla LXVI
  text: And, O puissant ascetic, this highly effulgent bow will I show unto Rāma and Lakshmana, O thou of excellent vows.
  modern: O mighty ascetic, of excellent vows, I will show this brilliant bow to Rāma and Lakṣmaṇa.
1.65.27:
  dutt: Bāla LXVI
  text: And, if, O ascetic, Rāma succeeds in fixing string to it, I will confer upon Daçarātha’s son my daughter Sitā, unsprung from the usual source."
  modern: And if, O ascetic, Rāma succeeds in stringing it, I will give my daughter Sītā, who was not born in the ordinary way, to Daśaratha's son."
1.66.12:
  dutt: Bāla LXVII
  text: Hearing Janaka,s words, the righteous Viçwāmitra said unto Rāghava,—"O Rāma, do thou, my child, behold the bow."
  modern: Hearing Janaka's words, the righteous Viśvāmitra said to Rāghava, "O Rāma, my child, look at the bow."
1.66.16:
  dutt: Bāla LXVII
  text: … in the sight of countless thousands of spectators, the righteous son of Raghu with exceeding ease took hold of the bow by the middle, and fixed the string upon it,—and having fixed the string, drew it. …
  modern: … in the sight of many thousands of onlookers, the righteous descendant of Raghu took hold of the bow in the middle with great ease, fixed the string on it, and drew it. …
1.66.20:
  dutt: Bāla LXVII
  text: And on the people being reassured, the king conversant with speech, his apprehension removed, with folded hands addressed that puissant ascetic, saying,— …
  modern: 'When the people were calm again, the king, skilled in speech and free of his anxiety, folded his hands and spoke to the great sage: …'
1.66.21:
  dutt: Bāla LXVII
  text: … "O worshipful one, I have beheld the prowess of Daçarātha’s son. This is verily wonderful and inconceivable; and I did not think this was possible.
  modern: '"Holy one, I have seen the prowess of Daśaratha''s son Rāma. This is wonderful and beyond thought; I did not think it possible.'
1.66.22:
  dutt: Bāla LXVII
  text: And my daughter, Sitā, being united with her lord, Daçarātha’s son, Rāma, will shed lustre on Janaka’s line.
  modern: My daughter Sītā, united with her husband, Rāma, Daśaratha's son, will bring glory to Janaka's line.
1.66.24:
  dutt: Bāla LXVII
  text: And, O Brāhmana, by thy permission let my counsellors speedily post hence, O Kauçika, good betide thee unto Ayodhyā, in cars; and with humble speech bring the king unto my capital.
  modern: With your permission, O Brāhmaṇa, let my counsellors go quickly to Ayodhyā in chariots, O Kauśika, good fortune to you, and with humble words bring the king to my capital.
1.66.25:
  dutt: Bāla LXVII
  text: And let them communicate unto him all about the bestowal of Sitā upon Rāma, in consequence of his having bent the bow. …
  modern: And let them tell him everything about Sītā being given to Rāma because he bent the bow.
1.67.1:
  dutt: Bāla LXVIII
  text: Thus commissioned by Janaka, the envoys, having spent three nights on the way, entered the city of Ayodhyā, with their conveyance afflicted with fatigue.
  modern: Sent by Janaka, the envoys spent three nights on the way and entered the city of Ayodhyā, their conveyance worn out with fatigue.
1.67.6:
  dutt: Bāla LXVIII
  text: And having enquired after thy complete welfare, Mithilā’s lord, Vaideha, by permission of Kauçika addresses thee thus,— …
  modern: '"Having asked after your complete welfare, Vaideha, the lord of Mithilā, with the permission of Kauśika, says this to you: …'
1.67.9:
  dutt: Bāla LXVIII
  text: And, O mighty-armed one, that divine, jewelled bow hath been snapped in the middle by the high-souled Rāma in the midst of a large assembly.
  modern: And, O mighty-armed one, that divine, jeweled bow has been snapped in the middle by the high-souled Rāma, in the midst of a large assembly.
1.67.10:
  dutt: Bāla LXVIII
  text: And upon that high-souled one should I confer Sitā, having prowess assigned for her dower, And in this wise will I free myself from my vow; and this thou shouldst permit. …
  modern: I should give Sītā, whose bride-price is prowess, to that high-souled one. In this way I will be free of my vow; please allow it.
1.68.7:
  dutt: Bāla LXIX
  text: And after having passed four days on the way, they arrived at Videha. And hearing of Daçarātha’s arrival, the auspicious king Janaka experienced great delight, and having obtained the aged king Daçarātha, he honored him duly.
  modern: After four days on the road they arrived in Videha. Hearing of Daśaratha's arrival, the auspicious King Janaka was greatly delighted, and having met the aged King Daśaratha, he honored him duly.
1.68.8:
  dutt: Bāla LXIX
  text: And that best one (Janaka) spoke words unto that delighted chief of men.
  modern: Then Janaka, the best one, spoke to the delighted chief of men.
1.68.9:
  dutt: Bāla LXIX
  text: '"Hath thy journey been a pleasant one, O best of men? By luck have I obtained thee, O descendant of Raghu. Do thou experience the joy earned by the prowess of thy sons.'
  modern: '"Was your journey pleasant, O best of men? By good luck I have obtained you, O descendant of Raghu. Enjoy the joy won by your sons'' prowess.'
1.70.20:
  dutt: Bāla LXXI
  text: This one, O mighty anchoret, is my younger brother, and I am his elder.
  modern: This is my younger brother, O mighty ascetic, and I am his elder.
1.70.21:
  dutt: Bāla LXXI
  text: O powerful ascetic, well pleased will I confer on thee these as thy daughters-in-law,—Sitā on Rāma, good betide thee, and Urmilā on Lakshmana. … Sitā resembling the daughter of a celestial, having prowess assigned for her dower.
  modern: 'O powerful ascetic, well pleased I will give these two as your daughters-in-law: Sītā to Rāma, good fortune to you, and Ūrmilā to Lakṣmaṇa. … Sītā, who is like a daughter of a god, with prowess as her dower.'
1.71.10:
  dutt: Bāla LXXII
  text: Whatever ye wish, even that shall be done, good betide ye. Let these daughters of Kuçadhwaja together become the wives of Satrughna and Bharata.
  modern: Whatever you wish, that shall be done, good fortune to you. Let these daughters of Kuśadhvaja become together the wives of Śatrughna and Bharata.
1.71.10+1:
  dutt: Bāla LXXIII
  text: (with 1.72.17)
1.72.17:
  dutt: Bāla LXXIII
  text: 'Then bringing Sitā adorned with various ornaments near the fire, and placing her before Rāghava, king Janaka addressed the enhancer of Kauçalya’s joy, saying,—"This Sitā, my daughter, do thou accept, good betide thee, as thy partner in the observance of every duty: do thou take her hand by thine.'
  modern: Then, bringing Sītā, adorned with various ornaments, near the fire and placing her before Rāghava, King Janaka said to the one who increased Kausalyā's joy, "Accept this Sītā, my daughter, good fortune to you, as your partner in the observance of every duty. Take her hand in yours.
1.72.17+1:
  dutt: Bāla LXXIII
  text: May she be of exalted piety, and devoted to her husband; ever following thee like thy shadow!" saying this, the king sprinkled Rāma’s palm with water sanctified with mantras; with the celestials and saints exclaiming,—"Excellent! Excellent!" And the celestial kettle-drums sounded, and blossoms began to shower down copiously.
  modern: May she be of exalted piety and devoted to her husband, always following you like your shadow!" Saying this, the king sprinkled Rāma's palm with water sanctified by mantras, while the gods and sages cried, "Excellent! Excellent!" And the divine kettledrums sounded, and blossoms showered down in abundance.
1.72.17+2:
  dutt: Bāla LXXIII
  text: (with 1.72.17+1)
1.72.17+3:
  dutt: Bāla LXXIII
  text: (with 1.72.17+1)
1.72.17+4:
  dutt: Bāla LXXIII
  text: Having thus given away his daughter Sitā, with water and mantras, king Janaka overflowing with delight, said,—"Come forward, O Lakshmana, good unto thee.
  modern: Having thus given away his daughter Sītā with water and mantras, King Janaka, overflowing with delight, said, "Come forward, Lakṣmaṇa, good fortune to you.
1.72.19:
  dutt: Bāla LXXIII
  text: Having addressed Lakshmana thus, Janaka spake unto Bharata, saying,—"Do thou, O descendant of Raghu, take Mandavyā’s hand by thine own."
  modern: 'Having said this to Lakṣmaṇa, Janaka spoke to Bharata: "O descendant of Raghu, take Māṇḍavī''s hand in yours."'
1.72.20:
  dutt: Bāla LXXIII
  text: And the righteous lord of Mithilā spake also unto Satrughna, saying,—"Do thou, O thou of mighty arms, take Srutakirti’s hand by thine own.
  modern: 'And the righteous lord of Mithilā also spoke to Śatrughna: "O mighty-armed one, take Śrutakīrti''s hand in yours.'
1.72.21:
  dutt: Bāla LXXIII
  text: May ye all be good, and vowed unto excellent life! and be, ye Kākutsthas, ye united with your wives. Let there be no delay about it."
  modern: May you all be good and firm in your good vows, and may you, Kākutsthas, be united with your wives. Let there be no delay."
1.72.22:
  dutt: Bāla LXXIII
  text: Hearing Janaka’s speech, those four perpetuators of Raghu’s line, staying by Vasishtha’s opinions, taking the hands of the four brides with their owil, went round the sacrificial fire, and the dais, and the king, and the high-souled saints; and in company with their wives, agreeably to direction entered into matrimony in accordance with the ordinance.
  modern: Hearing Janaka's speech, those four perpetuators of Raghu's line, abiding by Vasiṣṭha's counsel, took the hands of the four brides in their own and went round the sacrificial fire, the dais, the king, and the high-souled sages. In the company of their wives they entered into marriage in accordance with the ordinance.
1.72.23:
  dutt: Bāla LXXIII
  text: (with 1.72.22)
1.73.7:
  dutt: Bāla LXXIV
  text: … that king, the lord of Mithilā, bidding adieu to the monarch (Daçarātha), re-entered his own capital. And the master of Ayodhyā accompanied with his high-souled sons, and headed by the saints in a body, started on the journey, followed by his army and attendants.
  modern: … that king, the lord of Mithilā, said goodbye to Daśaratha and went back into his own capital. And the master of Ayodhyā set out on the journey with his high-souled sons, with the sages in a body at their head, followed by his army and attendants.
1.73.8:
  dutt: Bāla LXXIV
  text: And as that tiger-like one was on his way, in company with Rāghava and the saints, the fowls began to utter frightful cries all around, and the beasts on earth to stream in a Southern direction.
  modern: As that tiger-like king went on his way with Rāghava and the sages, birds began to utter frightful cries all around, and the beasts on the earth began to stream toward the south.
1.73.16:
  dutt: Bāla LXXIV
  text: And enveloped in ashes, that host became stupified. … And the king saw that repressor of kings, the decendant of Bhrigu, Jamadagni’s son, dreadful to behold, wearing a head of matted locks, …
  modern: The host, wrapped in ashes, became stupefied. … And the king saw that crusher of kings, the descendant of Bhṛgu, Jamadagni's son, dreadful to behold, wearing a head of matted locks, …
1.73.16+1:
  dutt: Bāla LXXIV
  text: (with 1.73.16)
1.73.21:
  dutt: Bāla LXXIV
  text: Having said this, the saints offered Arghya unto Bhrigu’s son of dreadful appearance; and addressed him in soothing words, saying,—"O Rāma! O Rāma."
  modern: 'Having said this, the sages offered arghya to the dreadful-looking son of Bhṛgu and spoke to him in soothing words: "O Rāma!'
1.73.22:
  dutt: Bāla LXXIV
  text: Accepting that homage rendered unto him by the saints, that puissant one, Jamadagni’s son, Rāma, addressed Rāma, the son of Daçarātha.
  modern: Accepting the homage offered by the sages, that mighty one, Jamadagni's son Rāma, spoke to Rāma, the son of Daśaratha.
1.74.1:
  dutt: Bāla LXXV
  text: '"O Rāma, son of Daçarātha, I have, O hero, heard of thy wonderful prowess; and I have also heard all about thy breaking of the bow.'
  modern: '"O Rāma, son of Daśaratha, I have heard, O hero, of your wonderful prowess, and I have also heard all about your breaking of the bow.'
1.74.2:
  dutt: Bāla LXXV
  text: And having heard of that wonderful and inconceivable breaking of the bow, I have bent my steps hither, taking another auspicious bow. …
  modern: Having heard of that wonderful, unimaginable breaking of the bow, I have come here, bringing another fine bow.
1.75.1:
  dutt: Bāla LXXVI
  text: Hearing Jamadagni’s words, the son of Daçarātha, in consideration of the presence of his father, said these words in subdued tone,— …
  modern: 'Hearing the words of Jamadagni''s son, the son of Daśaratha, restrained in his speech out of respect for his father, said: …'
1.75.5:
  dutt: Bāla LXXVI
  text: … And fixing the string upon it he set the arrow. And then Rāma enraged addressed Jamadagni’s son, Rāma, saying,— …
  modern: … He fixed the string on it and set the arrow. Then the angry Rāma said to Jamadagni's son, Rāma, …
1.75.12:
  dutt: Bāla LXXVI
  text: … And rendered inert in consequence of his energy having been dispelled by Rāma’s own, Jamadagna mildly addressed Rāma of eyes like lotus petals, saying,— …
  modern: "Made inert because his strength was overcome by Rāma's energy, Jamadagni's son spoke mildly to lotus-eyed Rāma: …"
1.75.17:
  dutt: Bāla LXXVI
  text: Even from thy handling of this bow I know thee to be the chief of the celestials even that eternal one, the slayer of Madhu. Hail to thee, O vanquisher of foes!
  modern: Even from your handling of this bow I know you to be the chief of the gods, the eternal one, the slayer of Madhu. Hail to you, O vanquisher of foes!
1.75.19:
  dutt: Bāla LXXVI
  text: … And, O Kākutstha, neither ought I to be ashamed (because of this discomfiture); I have been baffled by the lord himself of the three worlds.
  modern: … Nor should I be ashamed, Kākutstha, since it is you, the lord of the three worlds, who have turned me back.
1.75.20:
  dutt: Bāla LXXVI
  text: And it behoveth, O Rāma to disengage this peerless shaft (from the bow), O thou—of noble vows; and on thy shooting the shaft, I shall repair to that foremost of mountains, the Mahendra.
  modern: And you should loose this peerless arrow from the bow, O man of noble vows. When you have shot it, I shall go to the foremost of mountains, the Mahendra."
1.75.21:
  dutt: Bāla LXXVI
  text: When Jamadagni’s son, Rāma, had said this, the puissant and graceful son of Daçarātha shot that excellent arrow.
  modern: When Jamadagni's son Rāma had said this, the mighty and graceful son of Daśaratha shot that excellent arrow.
1.75.21+1:
  dutt: Bāla LXXVII
  text: Hearing Rāma’s words, king Daçarātha embraced his son with his arms, and smelt Rāghava’s crown; and hearing that Rāma had gone, the monarch became exceedingly delighted,—and considered himself and his son as having attained a second birth.
  modern: Hearing Rāma's words, King Daśaratha embraced his son and smelled Rāghava's head. Hearing that Rāma had gone, the king was greatly delighted and considered himself and his son born a second time.
1.75.21+2:
  dutt: Bāla LXXVII
  text: And having attained brides, and arms, with wealth and friends, those foremost of men, engaged in ministering unto their father.
  modern: Having gained brides, weapons, wealth, and friends, those foremost of men devoted themselves to serving their father.
1.76.14:
  dutt: Bāla LXXVII
  text: And in the company of Sitā, the wise Rāma, bending his mind to Sitā with his heart dedicated unto her, passed many a season in delight.
  modern: In the company of Sītā, the wise Rāma, his mind turned to Sītā and his heart given to her, passed many seasons in delight.
1.76.15:
  dutt: Bāla LXXVII
  text: And Rāma’s beloved Sitā, as having been bestowed upon him by his sire, by her loveliness, and her perfections as much as by her loveliness, went on enhancing his joy.
  modern: Rāma's beloved Sītā, given to him by his father, increased his joy by her qualities and by her beauty alike.
1.76.16:
  dutt: Bāla LXXVII
  text: And her lord came to excercise a double influence on her heart.
  modern: And her husband came to have a double hold on her heart.
1.76.17:
  dutt: Bāla LXXVII
  text: And by her own heart, the daughter of Janaka, Mithilā’s lord, resembling a goddess in grace, and like unto Sree (goddess of wealth) herself in loveliness, completely read his inmost sentiments.
  modern: And by her own heart Sītā, the daughter of Janaka, lord of Mithilā, who was like a goddess in grace and like Śrī, the goddess of wealth, in beauty, fully read his inmost feelings.
1.76.17+1:
  dutt: Bāla LXXVII
  text: And having Bharata as well as Satrughna, the heroic Yudhajit, with a delighted heart, entered his own city; and his father rejoiced exceedingly.
  modern: And Yudhājit, with a delighted heart, took Bharata and Śatrughna to his own city, and his father rejoiced greatly.
2.1.8:
  dutt: Ayodhyā I
  text: And the puissant king also on his part remembered his sons away from home, Bharata and Satrughna, resembling the mighty Indra and Varuna.
  modern: The mighty king also remembered his two sons who were away from home, Bharata and Śatrughna, who were like the great Indra and Varuṇa.
2.1.9:
  dutt: Ayodhyā I
  text: All those four chiefs of men were dear unto him even as four hands issuing from his own body.
  modern: All four of these chiefs of men were as dear to him as four arms growing from his own body.
2.1.10:
  dutt: Ayodhyā I
  text: Yet among them all, the highly energetic Rāma was the favorite of his sire. He was the foremost of all in every virtue, like unto Sayambhu’s self in the esteem of creation.
  modern: Yet among them the highly energetic Rāma was his father's favorite. He was the foremost of all in every virtue, as Svayambhū is in the esteem of creation.
2.1.34:
  dutt: Ayodhyā I
  text: And finding his son crowned with so many incomparable qualities,that subduer of his enemies, king Daçarātha, thought within himself. …
  modern: Seeing his son endowed with so many matchless qualities, King Daśaratha, subduer of enemies, thought it over.
2.1.34+1:
  dutt: Ayodhyā I
  text: Therefore, influenced by his affection (for his subject,) and with the view of compassing his own as well as their welfare, the righteous monarch urged expedition (upon his counsellors;) …
  modern: So, moved by affection for his subjects and wishing his own welfare and theirs, the righteous king urged haste on his counsellors …
2.2.1:
  dutt: Ayodhyā II
  text: Then facing his whole court, that lord of earth, the king, … spake words fraught with welfare, and capable of creating high rapture,and worthy of the attention of all. …
  modern: Then, facing his whole court, the lord of the earth spoke words that promised welfare and could stir high joy, worthy of everyone's attention. …
2.2.3:
  dutt: Ayodhyā II
  text: Now it is my intention to bring welfare unto this entire earth worthy of being rendered happy, which had been governed by all those sovereigns, Ikshwāku and the rest. …
  modern: Now I intend to bring welfare to this whole earth, which deserves to be made happy and which was governed by all those kings, Ikṣvāku and the rest. …
2.2.5:
  dutt: Ayodhyā II
  text: And under the shade of the white umbrella, I effecting the good of the entire community, have brought decrepitude upon my body. …
  modern: Under the shade of the white umbrella, working for the good of the whole community, I have worn out my body. …
2.2.9:
  dutt: Ayodhyā II
  text: My worthy son, like unto Purandara himself in prowess—Rāma, the conquerer of hostile cities, hath been born, endowed with all my virtues.
  modern: My worthy son Rāma, a conqueror of hostile cities, as mighty as Purandara himself, has been born to me, endowed with all my virtues.
2.2.10:
  dutt: Ayodhyā II
  text: Him, like unto the moon while in conjunction with the Pushyā constellation—the foremost of those maintaining righteousness, the chief of men, will I, in the morning with a delighted heart, install as the heir-apparent to the throne.
  modern: Tomorrow morning, with a glad heart, I will install him as heir-apparent to the throne. He is like the moon in conjunction with the Puṣya constellation, the foremost of those who uphold righteousness, the chief of men.
2.2.11:
  dutt: Ayodhyā II
  text: And that auspicious elder brother of Lakshmana will make a fit ruler for ye,—yea, the very three worlds might consider themselves as having a lord, by possessing him.
  modern: "That auspicious elder brother of Lakṣmaṇa will be a fit ruler for you. With him as lord, even the three worlds could consider themselves to have a lord."
2.2.15:
  dutt: Ayodhyā II
  text: … "O king, being many thousand years old, thou hast become aged. Do thou then install Rāma as the heir-apparent to the throne.
  modern: … "O king, you are many thousands of years old; you have grown old. So install Rāma as heir-apparent to the throne.
2.2.15+1:
  dutt: Ayodhyā II
  text: We wish to behold the exceedingly Strong and mighty-armed hero among the Raghus, riding a huge elephant, his countenance underneath an umbrella."
  modern: We wish to see the very strong, mighty-armed hero of the Raghus riding a huge elephant, with an umbrella over his face."
2.2.18:
  dutt: Ayodhyā II
  text: And those high-souled ones together with the citizens and the inhabitants of the provinces said unto him, —"O king, many are the virtues of thy son, having for their object the welfare of the people.
  modern: Those high-souled ones, with the citizens and the people of the provinces, said to him, "O king, your son has many virtues, all aimed at the welfare of the people.
2.2.19:
  dutt: Ayodhyā II
  text: … O monarch, furnished with the choicest qualities, Rāma having truth for prowess is like unto Sakrā’s self; and he towereth above Ikshwāku and all.
  modern: O king, Rāma, whose prowess is truth, has the finest qualities and is like Śakra himself. He towers above Ikṣvāku and all the rest.
2.2.25:
  dutt: Ayodhyā II
  text: And even as a father enquireth after the welfare of his sons, he, returning from the field on horse or elephant, exhaustively and consecutively enquireth after the weal of the citizens, concerning their sons, or their (sacrificial) fire, or their wives, or their servants, or their disciples.
  modern: 'When he returns from the field on horse or elephant, he asks fully and in turn after the welfare of the citizens, as a father asks after his sons: about their sons, their sacrificial fires, their wives, their servants, and their pupils.'
2.2.28:
  dutt: Ayodhyā II
  text: When calamity befalleth the people, he experienced excess of sorrow; and on their festal occasions, he rejoiceth ever like their own father.
  modern: When calamity strikes the people he feels great sorrow, and on their festivals he rejoices like their own father.
2.2.28+1:
  dutt: Ayodhyā II
  text: He is capable of bearing the burden even of the three worlds,—what then is this Earth?
  modern: He can bear the burden of even the three worlds. What, then, is this Earth?
2.2.33:
  dutt: Ayodhyā II
  text: And we would behold the son of the foremost of monarchs, the foe-destroying Rāma dark-blue like a lotus,—installed as the heir-apparent to the kingdom.
  modern: And we would see the son of the foremost of kings, the destroyer of foes, Rāma, dark blue like a lotus, installed as heir-apparent to the kingdom.
2.3.4:
  dutt: Ayodhyā III
  text: … "This is the holy month of Chaitra; and the groves look beautiful with blossoms. Do ye now prepare for the installation of Rāma."
  modern: "\"This is the holy month of Caitra, and the groves are in bloom. Prepare everything now for Rāma's installation.\""
2.3.6:
  dutt: Ayodhyā III
  text: Then unto Sumantra, the effulgent monarch spake, saying,—"Do thou speedily bring the virtuous Rāma hither."
  modern: Then the radiant king said to Sumantra, "Bring the virtuous Rāma here quickly."
2.3.7:
  dutt: Ayodhyā III
  text: Thereupon saying, "so be it," Sumantra at the mandate of the king brought thither in a car Rāma the foremost of car-warriors.
  modern: Saying "So be it," Sumantra, at the king's command, brought Rāma, the foremost of chariot-warriors, there in a chariot.
2.3.21:
  dutt: Ayodhyā III
  text: The king experienced delight, beholding his dearly beloved son, like unto his own image, richly adorned, reflected on mirror.
  modern: The king was delighted to see his beloved son, richly adorned, like his own image reflected in a mirror.
2.3.22:
  dutt: Ayodhyā III
  text: And even as Kaçyapa addresseth Indra of the celestials, the king—the best of those possessing sons— addressed his son, well seated, in these words, saying.
  modern: As Kaśyapa speaks to Indra, the king, best of those who have sons, spoke to his son as he sat there, with these words.
2.3.23:
  dutt: Ayodhyā III
  text: '"Born of my eldest wife worthy of myself, thou crowned with the best qualities, art my worthy son, O Rāma dear unto me.'
  modern: '"Born of my eldest wife, who is worthy of me, you are my worthy son, O Rāma, dear to me, with the best qualities.'
2.3.24:
  dutt: Ayodhyā III
  text: Thou hast by thy virtues drawn unto thyself the hearts of the people, therefore do thou during the conjunction of the moon with the Pushyā constellation, receive the office of heir-apparent.
  modern: By your virtues you have won the hearts of the people. Therefore, during the conjunction of the moon with the Puṣya constellation, take up the office of heir-apparent.
2.3.25:
  dutt: Ayodhyā III
  text: Thou art by nature crowned with virtues. Notwithstanding thy great virtues, I will, O son, from affection tell thee what is for thy profit.
  modern: You are by nature full of virtues. Yet, though your virtues are great, I will tell you, my son, out of affection, what will profit you.
2.3.26:
  dutt: Ayodhyā III
  text: Practicing greater humility, do thou constantly restrain thy senses. Do thou renounce the ills that come through anger and lust.
  modern: Practice still greater humility and always restrain your senses. Give up the ills that come from anger and lust.
2.3.27:
  dutt: Ayodhyā III
  text: … acquainting thyself with the state of things personally and otherwise, administer justice and thereby enlist the affection of the courtiers and other subjects; …
  modern: … Learn how things stand, in person and through others, and administer justice, and thereby win the affection of the courtiers and other subjects. …
2.3.28:
  dutt: Ayodhyā III
  text: … for the friends of him that swayeth the earth, pleasing the people to his satisfaction, rejoice even as did the immortals on obtaining ambrosia. Therefore, do thou, O son, disciplining thyself thus address thee to thy task."
  modern: … for the friends of a ruler who keeps his people content rejoice like the immortals who obtained ambrosia. So, my son, discipline yourself and go about your task."
2.4.16:
  dutt: Ayodhyā IV
  text: To-day the subjects in a body have expressed their desire of having thee for their sovereign. Therefore, O son, I shall install thee as the heir-apparent.
  modern: Today the subjects in a body have expressed their wish to have you as their sovereign. Therefore, my son, I shall install you as heir-apparent.
2.4.22:
  dutt: Ayodhyā IV
  text: … My heart urgeth me to instal thee during the Pushyā conjunction, so Oh! afflicter of foes, I shall instal thee to-morrow as heir-apparent.
  modern: My heart urges me to install you during the conjunction with Puṣya. So, scourge of foes, I will install you as heir-apparent tomorrow.
2.4.23:
  dutt: Ayodhyā IV
  text: Therefore do thou along with my daughter-in-law commencing from sun-set, serving the prescribed restrictions, and lying down on a bed of Kuça grass, spend the night in fast.
  modern: So, starting from sunset, you and my daughter-in-law should keep the prescribed restrictions, lie on a bed of kuśa grass, and spend the night fasting.
2.4.24:
  dutt: Ayodhyā IV
  text: And let thy friends vigilantly protect thee all around, for many are the impediments that happen in affairs like this.
  modern: And let your friends watch over you carefully on all sides, for many are the obstacles in affairs like this.
2.4.25:
  dutt: Ayodhyā IV
  text: In my opinion, during the interval that Bharata is away from the city, should thy installation be effected most opportunely; even though thy brother Bharata ever stayeth entirely by the course of the honest; he followeth his elder brother; and is righteous-souled; tender-hearted; and of subdued senses.
  modern: "In my opinion, your installation is best done while Bharata is away from the city, even though your brother Bharata always stays on the path of the honest, follows his elder brother, and is righteous, tender-hearted, and self-controlled."
2.4.26:
  dutt: Ayodhyā IV
  text: (with 2.4.25)
2.4.27:
  dutt: Ayodhyā IV
  text: But in my opinion, the hearts of men are inconstant,—and, O Rāghava, the hearts even of the virtuous change by the action of the natural impulses."
  modern: But in my opinion the hearts of men are inconstant, and, O Rāghava, even the hearts of the virtuous change under natural impulses."
2.4.28:
  dutt: Ayodhyā IV
  text: Having been thus addressed in the matter of his coming installation in the next day, Rāma, with the king’s permission embodied in "Go thou," greeting his father, repaired unto his quarters.
  modern: Having been told of his installation the next day, Rāma, with the king's permission in the words "Go," greeted his father and went to his quarters.
2.7.1:
  dutt: Ayodhyā VII
  text: A woman, brought up with Kaikeyi, who formerly served as a maid-servant, the family of her maternal uncle, at her own will, ascended the palace resembling the moon.
  modern: A woman who had been brought up with Kaikeyī, who had once been a maidservant in her maternal uncle's family, climbed of her own accord to the palace roof, which looked like the moon.
2.7.1+1:
  dutt: Ayodhyā VII
  text: Mantharā beheld from the palace the high-ways of Ayodhyā … and with standards displaying flags erected by the exhilarated citizens.
  modern: From the palace Mantharā saw the highways of Ayodhyā … and with flags raised by the cheerful citizens.
2.7.4:
  dutt: Ayodhyā VII
  text: … Mantharā, seeing a nurse hard by clad in white silk, with her eyes expanded with delight, asked her, saying,— …
  modern: … She saw a nurse nearby, dressed in white silk, her eyes wide with delight, and asked her, …
2.7.5:
  dutt: Ayodhyā VII
  text: And what for is the general overflow of joy? And what doth the delighted monarch purpose to do?"
  modern: And why is everyone so full of joy? And what does the delighted king intend to do?"
2.7.8:
  dutt: Ayodhyā VII
  text: Hearing the words of the nurse, the hump-backed one, speedily growing angry, descended from the edifice resembling a summit of the Kailāça hill.
  modern: Hearing the nurse's words, the hunchback quickly grew angry and came down from the building, which looked like a peak of the Kailāsa hill.
2.7.9:
  dutt: Ayodhyā VII
  text: Burning in ire, the sin-seeking Mantharā addressed Kaikeyi, lying down, saying,— …
  modern: 'Burning with anger, Mantharā, who looked for evil, went to Kaikeyī, who was lying down, and said: …'
2.7.11:
  dutt: Ayodhyā VII
  text: Thou boastest of good fortune while misfortune is thine in the shape of luck. Thy good fortune is surely unstable like the tide of a river during summer.
  modern: You boast of good fortune while misfortune is yours in the form of luck. Your good fortune is surely unstable, like a river's tide in summer.
2.7.19:
  dutt: Ayodhyā VII
  text: Born in a race of king thou art the queen of this lord of earth. Why dost not thou then realise the sternness of royal morality.
  modern: You were born in a royal line and you are the queen of this lord of the earth. Why do you not see how stern royal duty is?
2.7.22:
  dutt: Ayodhyā VII
  text: Having sent Bharata unto the home of thy relatives, that wicked-minded one will establish Rāma in his ancestral kingdom rid of its thorn.
  modern: Having sent Bharata to your relatives' home, that wicked-minded man will establish Rāma in his ancestral kingdom, rid of its thorn.
2.7.27:
  dutt: Ayodhyā VII
  text: Hearing Mantharā’s words, that one of graceful countenance filled with delight, and looking like the autumnal moon-light, rose up from her bed. Inspired with exceeding joy, Kaikeyi, struck with surprise, made unto the hump-backed woman a present of an excellent and elegant ornament.
  modern: Hearing Mantharā's words, the graceful-faced Kaikeyī, filled with delight and looking like autumn moonlight, rose from her bed. Overjoyed and surprised, she gave the hunchback a present of an excellent and elegant ornament.
2.7.28:
  dutt: Ayodhyā VII
  text: … And having given her the ornament, that paragon among the fair Kaikeyi joyfully, addressed Mantharā, saying,— …
  modern: "Having given her the ornament, Kaikeyī, the fairest of women, joyfully said to Mantharā: …"
2.7.29:
  dutt: Ayodhyā VII
  text: And surely thou hast told me what is dear unto my heart, what shall I do for thee?
  modern: You have surely told me what is dear to my heart. What shall I do for you?
2.7.29+1:
  dutt: Ayodhyā VII
  text: Difference find I none between Rāma and Bharata.
  modern: I find no difference between Rāma and Bharata.
2.8.10:
  dutt: Ayodhyā VIII
  text: O Mantharā, thou burnest (with grief) in this auspicious time. Our good fortune will come (after this in the shape of Bharata’s installation); why then dost thou grieve. … he also loveth me more than he doth Kauçalyā.
  modern: Mantharā, you are burning with grief at this auspicious time. Our good fortune will come; why then do you grieve? … He loves me more than he loves Kausalyā.
2.8.10+1:
  dutt: Ayodhyā VIII
  text: Rāma regardeth his brothers even as his own self."
  modern: Rāma regards his brothers as his own self."
2.8.11:
  dutt: Ayodhyā VIII
  text: Hearing Kaikeyi’s words, Mantharā exceedingly aggrieved, sighing hot and hard, thus addressed Kaikeyi, saying,— …
  modern: 'Hearing Kaikeyī''s words, Mantharā, deeply grieved, sighed long and hot and said to Kaikeyī: …'
2.8.13:
  dutt: Ayodhyā VIII
  text: Rāghava will become king, and after Rāghava his son,—so that, O Kaikeyi, Bharata will come to be at once cut off from the royal line.
  modern: Rāghava will become king, and after Rāghava his son, so that Bharata, O Kaikeyī, will be cut off from the royal line at once.
2.8.22:
  dutt: Ayodhyā VIII
  text: Therefore let that son of Raghu be sent unto the woods from the palace. This pleaseth me; and this also is for thy supreme welfare; …
  modern: So let that son of Raghu be sent from the palace to the woods. This pleases me, and it is also for your highest good. …
2.8.26:
  dutt: Ayodhyā VIII
  text: Thy co-wife, Rāma’s mother, had formerly through pride and good fortune been slighted by thee. Why will not she upon thee wreak her revenge now?
  modern: Your co-wife, Rāma's mother, was slighted by you earlier, out of pride and good fortune. Why will she not take her revenge on you now?
2.9.6:
  dutt: Ayodhyā IX
  text: Hearing Mantharā’s words, Kaikeyi raised herself a little from her tastefully spread bed, and said,— …
  modern: 'Hearing Mantharā''s words, Kaikeyī raised herself a little from her well-spread bed and said: …'
2.9.7:
  dutt: Ayodhyā IX
  text: '"Do thou tell me the means. By what means, O Mantharā, Bharata will gain the kingdom, and in no wise Rāma."'
  modern: '"Tell me the way, Mantharā: how Bharata may gain the kingdom, and by no means Rāma."'
2.9.16:
  dutt: Ayodhyā IX
  text: Entering the anger-chamber to day, do thou, O daughter of Açwapati, clad in soiled garment, lie down on the uncovered floor. Do not look at him, nor speak to him aught.
  modern: Enter the anger-chamber today, daughter of Aśvapati, and lie on the bare floor in soiled clothes. Do not look at him or speak to him.
2.9.17:
  dutt: Ayodhyā IX
  text: Thou hast always been the favorite wife of thy husband. Of this I have not the least doubt. For thy sake the monarch can enter into a flame.
  modern: You have always been your husband's favorite wife; I have not the least doubt of it. For your sake the king can enter a fire.
2.9.21:
  dutt: Ayodhyā IX
  text: Do thou, exalted dame, bring into Daçarātha’s recollection the two boons which he had granted thee at the time of the war between the gods and Asuras, and thou shalt not fail to achieve thy objects.
  modern: Remind Daśaratha, exalted lady, of the two boons he granted you at the time of the war between the gods and Asuras, and you will not fail to achieve your aims.
2.9.22:
  dutt: Ayodhyā IX
  text: And when that descendant of Raghu, raising thee will go to bestow the boons, do thou then binding him fast by oath, unfold unto the monarch the boons,saying,— …
  modern: 'When the descendant of Raghu raises you up to give you the boons, bind him fast with an oath and then tell the king the boons: …'
2.9.23:
  dutt: Ayodhyā IX
  text: … ’Send Rāma unto the forest for nine and five years, and let Bharata, becoming on earth the foremost of monarchs, carry on the Government.’
  modern: … 'Send Rāma to the forest for nine years and five, and let Bharata become the foremost of kings on earth and govern.'
2.9.23+1:
  dutt: Ayodhyā IX
  text: And Rāma having been banished for fourteen years, thy son growing (in the interval) firm and fast, will remain (on the throne) during the rest of his life. …
  modern: With Rāma banished for fourteen years, your son will in that time grow firm and rooted, and will stay on the throne for the rest of his life. …
2.9.41:
  dutt: Ayodhyā IX
  text: … "O blessed one, when water has flown out, it is not proper to set up a dyke. Arise. Do thy welfare. Show thyself unto the king."
  modern: … "Blessed lady, it is no use building a dyke once the water has run out. Get up. Do what is good for you. Show yourself to the king."
2.10.1:
  dutt: Ayodhyā X
  text: The monarch having issued orders for the installation of Rāma,entered his inner apartment after giving permission to the courtiers to repair to their respective abodes.
  modern: Having issued orders for Rāma's installation, the king gave the courtiers leave to go to their homes and went into his inner apartment.
2.10.1+1:
  dutt: Ayodhyā X
  text: Like unto the moon entering the sky covered with white clouds and with Rāhu present in it, that one of high fame entered the excellent apartment of Kaikeyi, …
  modern: The renowned king, like the moon entering a sky covered with white clouds and with Rāhu in it, entered Kaikeyī's excellent apartment. …
2.10.3:
  dutt: Ayodhyā X
  text: … And the sinless aged (monarch) saw on the ground his youthful wife dearer unto him than life itself, cherishing an unrighteous intention, …
  modern: … The sinless old king saw his young wife, dearer to him than life, with her wicked intention, …
2.10.5:
  dutt: Ayodhyā X
  text: And himself resembling a mighty elephant in the midst of a forest, the king, exceedingly aggrieved, out of affection, gently passing his hand upon Kaikeyi’s person, thus addressed her furnished with eyes resembling lotus’ petals,— …
  modern: 'Like a great elephant in a forest, the king, deeply grieved, stroked Kaikeyī gently out of love and spoke to her, whose eyes were like lotus petals: …'
2.10.12:
  dutt: Ayodhyā X
  text: Tell me thy mind, and I will satisfy thee by laying down life itself. … The space that is lighted up by the solar disc is mine— …
  modern: Tell me what you have in mind, and I will satisfy you even at the cost of my life. … All the land the sun lights up is mine …
2.10.19:
  dutt: Ayodhyā X
  text: Thou knowest the influence thou hast upon me,—therefore, it behoveth thee not to entertain any apprehension. By all my good deeds I swear that I will compass thy pleasure.
  modern: You know the hold you have over me, so you need have no fear. I swear by all my good deeds that I will do what pleases you.
2.10.19+1:
  dutt: Ayodhyā XI
  text: By that Rāma, Kaikeyi, whom if I do not see for a moment, I die for certain, do I swear that whatever thou wilt say I will accomplish. …
  modern: I swear by that Rāma, Kaikeyī, whom I could not go a moment without seeing and live, that I will do whatever you ask. …
2.10.20:
  dutt: Ayodhyā XI
  text: … And delighted at the king’s speech, she unfolded that dreadful intention of hers like unto the approaching death.— …
  modern: '… Delighted by his speech, she revealed that dreadful intention of hers, which was like approaching death: …'
2.10.20+1:
  dutt: Ayodhyā XI
  text: … "Remember, O king, the incidents that took place formerly in the war between gods and Asuras.
  modern: … "Remember, O king, what happened long ago in the war between the gods and the Asuras.
2.10.26:
  dutt: Ayodhyā XI
  text: Entrusting the boons then with thee, do I now, O descendant of the Raghus, ask for them (at thy hands), O lord of the earth.
  modern: Now I ask for them, O descendant of the Raghus, O lord of the earth, since I left the boons in your keeping then.
2.10.27:
  dutt: Ayodhyā XI
  text: Preparations are being made for installing Rāghava. Do thou with the provisions made ready install Bharata in the kingdom.
  modern: Preparations are being made to install Rāghava. Use those same preparations to install Bharata in the kingdom.
2.10.28:
  dutt: Ayodhyā XI
  text: Let the gentle Rāma, clad in deer-skin, lead the life of a mendicant in the Dandaka forest for the space of nine and five years.
  modern: Let the gentle Rāma, clad in deerskin, live as a mendicant in the Daṇḍaka forest for nine and five years.
2.10.30:
  dutt: Ayodhyā XII
  text: Hearing Kaikeyi’s fell speech, the monarch bewailed for a time, … pained and woe-begone, like unto a deer at the sight of a tigress, …
  modern: Hearing Kaikeyī's cruel words, the king lamented for a time, … pained and miserable, like a deer that sees a tigress. …
2.10.32:
  dutt: Ayodhyā XII
  text: After a long while, regaining his senses, he extremely aggrieved, wrathfully, and as if burning in energy, addressed Kaikeyi, saying,— …
  modern: "After a long while he came to his senses. Deeply grieved and angry, as if burning with energy, he said to Kaikeyī: …"
2.10.33:
  dutt: Ayodhyā XII
  text: '"Thou cruel one! Thou of vile ways! Thou destroyer of this race! O wicked woman, what has been done by Rāma unto thee; or what wrong have I done thee?'
  modern: '"You cruel woman! You of evil ways! You destroyer of this family! Wicked woman, what has Rāma done to you, or what wrong have I done you?'
2.10.34:
  dutt: Ayodhyā XII
  text: Rāghava ever serveth thee as a mother. Why thou art then bent upon wronging him?
  modern: Rāghava always serves you as he would a mother. Why are you bent on wronging him?
2.10.36:
  dutt: Ayodhyā XII
  text: When all men show their regard for Rāma’s virtues, for what transgression shall I forsake my dear son?
  modern: When all men honor Rāma's virtues, for what fault shall I abandon my dear son?
2.10.37:
  dutt: Ayodhyā XII
  text: I may renounce Kauçalyā or Sumitrā or the kingdom, or life itself; but Rāma, filled with affection for his father, will I not renounce.
  modern: I may give up Kausalyā or Sumitrā or the kingdom, or life itself, but I will not give up Rāma, who is so full of affection for his father.
2.10.39:
  dutt: Ayodhyā XII
  text: The world may exist without the Sun; and corn without water; but this life doth not exist in this body without Rāma.
  modern: The world may exist without the sun, and crops without water, but my life cannot stay in this body without Rāma.
2.10.39+1:
  dutt: Ayodhyā XII
  text: I do not recollect to have heard Rāma, who ever speaks sweet words, to have used any unpleasant speech to any one; how can I then for thy sake unfold this disagreeable matter unto the beloved Rāma?
  modern: I cannot remember Rāma, who always speaks kindly, ever saying an unkind word to anyone. How then can I, for your sake, tell my beloved Rāma this unwelcome thing?
2.10.39+2:
  dutt: Ayodhyā XII
  text: When the terrible Kaikeyi in still more terrible language addressed the mighty king, who was burning in grief, and bewailing, and deprived of his senses, and feeling a sensation of whirling, and overwhelmed with woe, and again and again beseeching for crossing this ocean of sorrow, saying.
  modern: Then the terrible Kaikeyī answered, in still more terrible language, the mighty king, who was burning with grief and lamenting, who had lost his senses and felt as if he were whirling, who was overwhelmed with woe and kept begging her to help him cross this ocean of sorrow.
2.10.39+3:
  dutt: Ayodhyā XII
  text: (with 2.10.39+2)
2.10.39+4:
  dutt: Ayodhyā XII
  text: … Whether what I have proposed be righteous or otherwise, whether thou hast promised truly or falsely, swerve not from thy word.
  modern: Whether what I have asked is right or wrong, whether your promise was true or false, do not go back on your word.
2.10.39+5:
  dutt: Ayodhyā XII
  text: … by Bharata’s self dear unto me as my own life, I swear that save the exile of Rāma, nothing shall satisfy me."
  modern: … I swear by Bharata, dear to me as my own life, that nothing but Rāma's exile will satisfy me."
2.10.39+6:
  dutt: Ayodhyā XII
  text: Having said this, Kaikeyi paused; and maintained silence disregarding the bewailing monarch. … In sad and distressful words, he addressed Kaikeyi, saying,— …
  modern: 'Having said this, Kaikeyī stopped, and kept silent, ignoring the lamenting king. … In sad and distressed words, he said to Kaikeyī: …'
2.10.39+8:
  dutt: Ayodhyā XII
  text: Kauçalyā serves me at the same time like a slave, and a friend, and wife, and sister, and mother.
  modern: Kausalyā serves me at once as a slave, a friend, a wife, a sister, and a mother.
2.10.39+9:
  dutt: Ayodhyā XII
  text: Ever studious of my welfare, dearly loving her son, and speaking every one fair, that exalted lady, although deserving of homage at my hands, has up to this time not been regarded by me, because of thee.
  modern: Always studying my welfare, loving her son dearly, and speaking kindly to everyone, that exalted lady deserved homage from me, yet up to now I have not honored her, because of you.
2.10.39+10:
  dutt: Ayodhyā XII
  text: Surely gentle folks will on the high-way censure me as one lost to gentility,—as one who has sold his son (for buying his wife’s good graces), even like a Brāhmana given to drinking.
  modern: Surely good people will blame me on the highway as one who has lost his gentility, as one who has sold his son, like a Brāhmaṇa who drinks liquor.
2.10.39+13:
  dutt: Ayodhyā XII
  text: If the banishment of Rāma, be agreeable to Bharata let him not, when I am dead, perform my funeral obsequies.
  modern: If Rāma's banishment is agreeable to Bharata, let him not perform my funeral rites when I am dead.
2.12.2:
  dutt: Ayodhyā XIV
  text: … Having promised to grant me the boon, how distressed dost thou lie on the ground, as if thou didst commit some sin? It behoveth thee to keep untainted thy dignity by performing what thou hast promised.
  modern: … Having promised to grant me the boon, why do you lie on the ground in distress, as if you had committed some sin? You should keep your honor untainted by doing what you promised.
2.12.3:
  dutt: Ayodhyā XIV
  text: Truth, say persons cognizant of it, is the prime virtue. And it is in the interests of virtue, that I have been exhorting thee.
  modern: Those who know the truth say that truth is the highest virtue. And it is in the interest of virtue that I have been urging you.
2.12.3+1:
  dutt: Ayodhyā XIV
  text: (with 2.12.3)
2.12.8:
  dutt: Ayodhyā XIV
  text: Thus fearlessly urged by Kaikeyi, the king could not take off from himself the noose (of promise), even as Bāli could not take off the noose that had been fixed upon him (by Upendra) at the instance of Indra.
  modern: Thus urged fearlessly by Kaikeyī, the king could not free himself from the noose, as Bali could not free himself from the noose that Upendra, at Indra's urging, had fixed on him.
2.12.8+1:
  dutt: Ayodhyā XIV
  text: And even as the Vedas with the Angas and other lore indoctrinate the self-create lord Brahmā, so do I enlighten thee.
  modern: As the Vedas with their Aṅgas and other lore instruct Brahmā, the self-created lord, so I enlighten you.
2.13.20:
  dutt: Ayodhyā XIV
  text: Then the graceful and virtuous king, waxing disconsolate, on account of his son, and with his eyes reddened with the effect of grief, seeing the charioteer, said,—"This eulogy of thine pains me the more."
  modern: "Then the graceful and virtuous king, grown disconsolate on account of his son, his eyes reddened by grief, saw the charioteer and said, \"This eulogy of yours pains me the more.\""
2.14.10:
  dutt: Ayodhyā XVI
  text: Whereupon Sumantra, acquainted with decorum, humbly saluted him (Rāma), the conferrer of great boons, and resplendent like the mid-day sun; and he well honored by the king, seeing the king’s son seated on the sleeping sofa with a delighted countenance, spoke these words unto him with clasped hands:—"Oh, Rāma, great son of Kauçalyā, thy father and the queen Kaikeyi want to see thee; so it behoveth thee to go there without delay."
  modern: Sumantra, who knew proper manners and was honored by the king, humbly saluted Rāma, the giver of great boons, who shone like the midday sun. Seeing the king's son seated on his couch with a cheerful face, he said with folded hands, "O Rāma, great son of Kausalyā, your father and Queen Kaikeyī want to see you, so you should go there without delay."
2.14.11:
  dutt: Ayodhyā XVI
  text: (with 2.14.10)
2.14.11+1:
  dutt: Ayodhyā XVI
  text: Being greeted with benedictory ceremonies, Rāma, bidding farewell to Sitā, issued out of his house like unto a lion, living in the den of a mountain.
  modern: Greeted with blessings, Rāma took leave of Sītā and came out of his house like a lion from a mountain den.
2.15.4:
  dutt: Ayodhyā XVII
  text: Rāma, hearing these and other auspicious words from his friends eulogising his own self, went on his way without being moved.
  modern: Rāma heard these and other auspicious words from his friends praising him, and went on his way unmoved.
2.16.1:
  dutt: Ayodhyā XVIII
  text: Rāma saw his father, seated on a beautiful sofa with Kaikeyi, looking sorry and poorly and with his countenance dried up.
  modern: Rāma saw his father seated on a beautiful couch with Kaikeyī, looking sorrowful and poor, his face dried up.
2.16.2:
  dutt: Ayodhyā XVIII
  text: And humbly bowing down at the feet of his father first, he saluted Kaikeyi with due solemnity.
  modern: Humbly bowing at his father's feet first, he saluted Kaikeyī with due respect.
2.16.10:
  dutt: Ayodhyā XVIII
  text: Being pressed with sorrow, Rāma of pale countenance, like one miserable, saluting Kaikeyi, spoke unto her the following words.
  modern: Pressed by sorrow, Rāma, pale, like a miserable man, saluted Kaikeyī and spoke to her these words.
2.16.11:
  dutt: Ayodhyā XVIII
  text: '"Is it not that I committed some offence through ignorance that I see my father angry? Do thou propitiate him therefore. …'
  modern: '"Did I commit some offence through ignorance, since I see my father angry? Appease him for me. …'
2.16.17:
  dutt: Ayodhyā XVIII
  text: Oh worshipful one, tell me all this, who am exceedingly anxious to get at the real truth. Why has this unforeseen sorrow overtaken the heart of the lord of men?"
  modern: Tell me all this, I who am so anxious to know the real truth. Why has this unforeseen sorrow come upon the heart of the lord of men?"
2.16.17+1:
  dutt: Ayodhyā XVIII
  text: Being thus addressed by the high-souled Rāghava, that exceedingly shameless Kaikeyi spoke unto him the following impudent words, fraught with her self-interest.
  modern: Thus addressed by the high-souled Rāghava, the utterly shameless Kaikeyī spoke these impudent words to him, full of her own self-interest.
2.16.17+2:
  dutt: Ayodhyā XVIII
  text: '"Oh Rāma, the monarch is not angry nor has any danger befallen him. He has got something in his mind which he cannot speak out through thy fear. Thou art his most beloved son and word does not proceed from his mouth to speak thee things unpleasant.'
  modern: '"O Rāma, the king is not angry, and no danger has come to him. He has something in his mind that he cannot say out of fear of you. You are his most beloved son, and he cannot bring himself to say unpleasant things to you.'
2.16.17+3:
  dutt: Ayodhyā XVIII
  text: But it behoveth thee to carry out what the monarch has promised unto me.
  modern: But you should carry out what the king has promised me.
2.16.17+4:
  dutt: Ayodhyā XVIII
  text: If what I, with the king’s permission, speak to thee, does not go useless, I shall speak unto thee all; the king will not speak any thing."
  modern: If what I speak to you, with the king's permission, is not to go for nothing, I will tell you all; the king will not say anything."
2.16.17+5:
  dutt: Ayodhyā XVIII
  text: Hearing these words uttered by Kaikeyi, Rāma, pained at heart, spoke unto her in the presence of the king in the following way:— …
  modern: 'Hearing these words of Kaikeyī, Rāma, pained at heart, said to her in the king''s presence: …'
2.16.18:
  dutt: Ayodhyā XVIII
  text: I can at the king’s words jump into the fire. Being ordered by him, who is my father and who is my king especially, I can drink virulent poison and drown into the ocean.
  modern: I can jump into a fire at the king's word. Ordered by him, who is my father and especially my king, I can drink deadly poison and drown in the ocean.
2.16.19:
  dutt: Ayodhyā XVIII
  text: Speak thou, Oh worshipful lady, what is the desire of thy king, and know that I shall carry it out—Rāma does not contradict what he has once spoken."
  modern: "Say, worshipful lady, what the king desires, and know that I will do it. Rāma does not go back on what he has once said.\""
2.16.20:
  dutt: Ayodhyā XVIII
  text: Then that wicked Kaikeyi spoke these highly cruel words unto Rāma, simple and truthful.
  modern: Then the wicked Kaikeyī spoke these cruel words to Rāma, who was simple and truthful.
2.16.21:
  dutt: Ayodhyā XVIII
  text: '"Formerly in a great war between the gods and Asuras, thy father, being wounded with shafts was tended by me for which he conferred upon me two boons.'
  modern: '"Formerly, in a great war between the gods and Asuras, your father was wounded by arrows and was tended by me, and for this he granted me two boons.'
2.16.22:
  dutt: Ayodhyā XVIII
  text: Of these two boons I have asked of the king the installation of Bharata, and the departure of Rāghava into the Dandaka forest even this very day.
  modern: Of these two boons I have asked the king for Bharata's installation and for Rāghava's departure into the Daṇḍaka forest this very day.
2.16.23:
  dutt: Ayodhyā XVIII
  text: Oh thou, best among men, if do thou wish to keep thy father’s vows as well as thine, hear what I say. …
  modern: Best of men, if you want to make your father true to his promise, and yourself too, hear what I say.
2.16.25:
  dutt: Ayodhyā XVIII
  text: Forsaking this installation, do thou repair unto Dandaka forest for seven and seven years and wear bark and matted hair.
  modern: Give up this installation and go to the Daṇḍaka forest for seven and seven years, and wear bark and matted hair.
2.16.27:
  dutt: Ayodhyā XIX
  text: Hearing these unpleasant words like unto death, Rāma, the destroyer of foes, was not pained, and spoke thus unto Kaikeyi.
  modern: Hearing these unpleasant words, like death, Rāma, the destroyer of foes, was not pained, and spoke to Kaikeyī.
2.16.28:
  dutt: Ayodhyā XIX
  text: '"Be it what thou sayst; carrying out the promise of the king, I shall repair unto the forest from this place wearing bark and matted hair.'
  modern: '"So be it as you say. To carry out the king''s promise I shall go from here to the forest, wearing bark and matted hair.'
2.16.32:
  dutt: Ayodhyā XIX
  text: But this one sorrow burns my heart, why king did not tell me personally of the installation of Bharata.
  modern: 'But this one sorrow burns my heart: why did the king not tell me himself of Bharata''s installation?'
2.16.33:
  dutt: Ayodhyā XIX
  text: What of the command of the king, my father, I shall even at thy mandate joyfully make over unto Bharata, my kingdom, Sitā, wealth and even my life, thereby satisfying thee, aad fulfilling my promise.
  modern: 'Never mind the command of the king, my father: even at your word I would joyfully hand over to Bharata my kingdom, Sītā, my wealth, and even my life, thereby satisfying you and keeping my promise.'
2.16.34:
  dutt: Ayodhyā XIX
  text: (with 2.16.33)
2.16.46:
  dutt: Ayodhyā XIX
  text: '"Oh worshipful one, being addicted to wealth do I not long for living in this world; like unto Rishis, know me, to be well established in pure religion.'
  modern: "Worshipful lady, I do not long to live in this world attached to wealth. Know that I am as firmly established in pure religion as the sages."
2.16.48:
  dutt: Ayodhyā XIX
  text: There is no virtue greater than the serving of the father and carrying out his words.
  modern: There is no virtue greater than serving one's father and carrying out his words.
2.16.49:
  dutt: Ayodhyā XIX
  text: Even though not commanded by him, I shall; for thy words, live in a solitary forest for fourteen years.
  modern: Even though he has not commanded it, I shall, at your word, live in a solitary forest for fourteen years.
2.16.50:
  dutt: Ayodhyā XIX
  text: Oh Kaikeyi, certain it is that thou art not acquainted with my foremost virtues, inasmuch as possessing full authority to rule me, thou hast requested the monarch for this.
  modern: O Kaikeyī, it is certain that you do not know my foremost virtues, since, having full authority to command me, you asked the king for this.
2.16.51:
  dutt: Ayodhyā XIX
  text: Excuse me until I ask my mother, and comfort Sitā; even this very day shall I wend my way unto the great forest of Dandaka.
  modern: Allow me until I ask my mother and comfort Sītā. This very day I shall go to the great forest of Daṇḍaka.
2.16.52:
  dutt: Ayodhyā XIX
  text: It behoves thee to do that by which Bharata may govern the kingdom and tend our father, for this is the virtue eternal."
  modern: You should see to it that Bharata governs the kingdom and takes care of our father, for this is the eternal duty."
2.16.55:
  dutt: Ayodhyā XIX
  text: … And reverentially going round his father and Kaikeyi, and issuing out of the female apartment, Rāma saw his own friends and relatives.
  modern: Walking reverently around his father and Kaikeyī, and leaving the women's apartments, Rāma saw his own friends and relatives.
2.16.58:
  dutt: Ayodhyā XIX
  text: Loss of kingdom could not diminish the great beauty of that beloved of the people on account of its everlasting pleasantness, like unto the wane of the moon.
  modern: The loss of the kingdom could not lessen the great beauty of that beloved of the people, any more than the waning of the moon lessens its charm.
2.16.58+1:
  dutt: Ayodhyā XIX
  text: The pious Rāma, having high fame, entered into the presence of his mother, manifesting great regards for the people with sweet speech.
  modern: The pious and renowned Rāma went into his mother's presence, showing great regard to the people with sweet speech.
2.16.58+2:
  dutt: Ayodhyā XX
  text: Seeing his mother approach, Rāghava bowed low, and (Kauçalyā) embracing him in her arms smelt his head.
  modern: Seeing his mother approach, Rāghava bowed low, and Kausalyā embraced him in her arms and smelled his head.
2.17.14:
  dutt: Ayodhyā XX
  text: '"O worshipful one, certain it is that thou knowest not the great impending calamity. It is for the distress of thine, Lakshmana and Vaidehi, that shall I wend my way unto the Dandaka forest.'
  modern: '"O worshipful one, surely you do not know the great calamity that is coming. It is for the sorrow of you, Lakṣmaṇa, and Vaidehī that I shall go to the Daṇḍaka forest.'
2.17.16:
  dutt: Ayodhyā XX
  text: The king shall confer upon Bharata the heir-apparentship and shall banish me as an ascetic into the forest. …
  modern: The king is giving Bharata the office of heir-apparent and banishing me to the forest as an ascetic.
2.17.17:
  dutt: Ayodhyā XX
  text: … Rāma seeing his mother, who deserved no distress, fall down like a plantain tree and insensible, raised her up, and finding her covered with dust all over her body like unto a mare risen up after rolling on the ground on account of toil of bearing heavy burden wiped oflf (her body) gently with his hand.
  modern: "Seeing his mother, who did not deserve distress, fall senseless like a plantain tree, Rāma raised her up. She was covered with dust all over, like a mare that rises after rolling on the ground, worn out by a heavy load, and he gently wiped her with his hand."
2.17.18:
  dutt: Ayodhyā XX
  text: (with 2.17.17)
2.17.19:
  dutt: Ayodhyā XX
  text: She, deserving happiness, being racked with the destruction of her delight spoke thus unto Rāghava, that best of men, in the presence of Lakshmana.
  modern: 'She, who deserved happiness and was racked by the destruction of her joy, said to Rāghava, the best of men, in the presence of Lakṣmaṇa:'
2.17.20:
  dutt: Ayodhyā XX
  text: '"Oh! my son, Oh! Rāghava, hadst thou not been born for my grief I would have been sonless only, but would not have been subject to this greater grief.'
  modern: '"Oh, my son! Rāghava, if you had not been born to give me grief, I would only have been without a son and would not have had this greater grief.'
2.17.21:
  dutt: Ayodhyā XX
  text: A sonless woman has only one cause of mental affliction. Her only sorrow is "I have no child" and nothing else my son.
  modern: A childless woman has only one cause of mental pain. Her only sorrow is "I have no child," and nothing else, my son.
2.17.22:
  dutt: Ayodhyā XX
  text: I have not experienced in my life that blessing and pleasure which women generally feel when their husbands are devoted to them.
  modern: I have never in my life known the happiness and pleasure that women usually feel when their husbands are devoted to them.
2.17.26:
  dutt: Ayodhyā XX
  text: I have spent, Oh Rāghava, ten years and seven from thy (second) birth expecting a termination of my sorrow.
  modern: "I have spent ten years and seven from your second birth, Rāghava, waiting for an end to my sorrow."
2.17.26+1:
  dutt: Ayodhyā XX
  text: … How shall I, of miserable life pass my days in grief not seeing thy face, effulgent like unto the full-moon.
  modern: How shall I, wretched as I am, live out my days in grief, not seeing your face, bright as the full moon?
2.18.1:
  dutt: Ayodhyā XXI
  text: At this time Lakshmana, sorely distressed, addressed the weeping Kauçalyā, the mother of Rāma with the following words suitable to that occasion.
  modern: Then Lakṣmaṇa, sorely distressed, spoke to the weeping Kausalyā, Rāma's mother, with words suited to the moment.
2.18.2:
  dutt: Ayodhyā XXI
  text: '"I like it not, Oh worshipful one, that Rāghava, should repair unto the forest, renouncing this grandeur of sovereignty.'
  modern: '"I do not like it, worshipful one, that Rāghava should go to the forest and give up this grandeur of sovereignty.'
2.18.3:
  dutt: Ayodhyā XXI
  text: The king is uxorious, old and therefore of perverted judgment and is addicted to worldly affairs; being under the influence of his wife and passion what could he not speak?
  modern: The king is ruled by his wife, old, and so of perverted judgment, and given to worldly matters. Under the influence of his wife and of passion, what would he not say?
2.18.5:
  dutt: Ayodhyā XXI
  text: I do not find any such man in this world, even amongst great enemies, who, forsaken for heinous sins, can cite, even in his absence, any fault of him.
  modern: I do not find any man in this world, even among great enemies, who could point out a fault in him, even behind his back, however heinous the sin for which he was cast off.
2.18.6:
  dutt: Ayodhyā XXI
  text: Observing what law of righteousness does the monarch, without any cause, renounce such a son who is like unto celestials, simple, well disciplined and beloved even of the enemies? …
  modern: By what law of righteousness does the king, without cause, give up such a son, who is like the gods, simple, well disciplined, and beloved even by his enemies? …
2.18.6+1:
  dutt: Ayodhyā XXI
  text: Even a spiritual leader deserves chastisement if he is puffed up with pride, and is devoid of the power of judging good actions and bad, and when he is gone astray.
  modern: Even a spiritual teacher deserves chastisement if he is puffed up with pride, cannot tell good actions from bad, and has gone astray.
2.18.13:
  dutt: Ayodhyā XXI
  text: Oh worshipful one, verily am I attached at heart to my brother. By truth, bow, gifts and things dear unto me, do I swear unto thee; if Rāma shall enter into the wood, know me, Oh worshipful one, to have entered into the fire before that …
  modern: 'I am truly devoted to my brother at heart, O lady. By truth, by my bow, by my gifts and all I hold dear, I swear to you: if Rāma enters the forest, know that I have entered the fire before him. …'
2.18.14:
  dutt: Ayodhyā XXI
  text: (with 2.18.13)
2.18.19:
  dutt: Ayodhyā XXI
  text: … Oh thou pious one, having knowledge of religion, if do thou wish to acquire righteousness, serve me here and continue practising the best of all virtues.
  modern: … O pious one, who knows religion, if you wish to gain righteousness, stay here and serve me, and so practice the best of all virtues.
2.18.20:
  dutt: Ayodhyā XXI
  text: Hear, Oh my son, the great ascetic Kasyapa, lived in his house, serving his mother continually and being crowned with best moral merit reached heaven.
  modern: 'Hear this, my son: the great ascetic Kaśyapa lived in his house, constantly serving his mother, and, crowned with the best moral merit, reached heaven.'
2.18.21:
  dutt: Ayodhyā XXI
  text: As the monarch is worshipful unto thee in veneration so am I. I do not permit thee, to repair hence unto the forest.
  modern: As the king is worshipful to you in veneration, so am I. I do not permit you to go from here to the forest.
2.18.22:
  dutt: Ayodhyā XXI
  text: Separated from thee I do not need life or happiness; with thee I would prefer faring on grass. …
  modern: Parted from you, I have no use for life or happiness. With you, I would rather eat grass.
2.18.25:
  dutt: Ayodhyā XXI
  text: Whereupon unto his mother Kauçalyā, sorrowful and weeping, spoke Rāma, virtuous-souled, these words of righteousness.
  modern: Then Rāma, virtuous-souled, spoke these words of righteousness to his mother Kausalyā, who was sorrowful and weeping.
2.18.26:
  dutt: Ayodhyā XXI
  text: '"There is no power in me to transgress my father’s behests; bend low I my head unto thee—I want to proceed to the forest.'
  modern: '"I have no power to transgress my father''s commands. I bow my head to you; I want to go to the forest.'
2.18.32:
  dutt: Ayodhyā XXI
  text: Saying these words unto his mother, that best of men versed in speech and best of archers, again spoke unto Lakshmana all these words. "I know full well, Oh Lakshmana, thy affection towards me and thy power, strength and unconquerable force. Not knowing my settted conviction in regard to truth and peace, …
  modern: 'Having said these words to his mother, the best of speakers and best of archers spoke again to Lakṣmaṇa: "I know well, Lakṣmaṇa, your love for me, and your power, strength and unconquerable force. Not knowing my settled conviction about truth and peace, …'
2.18.32+1:
  dutt: Ayodhyā XXI
  text: (with 2.18.32)
2.18.33:
  dutt: Ayodhyā XXI
  text: Righteousness is the prime object in this world and in righteousness is established truth, and this excellent utterance of my father is in keeping with righteousness.
  modern: Righteousness is the highest aim in this world, and truth is established in righteousness, and this excellent command of my father accords with righteousness.
2.18.35:
  dutt: Ayodhyā XXI
  text: While I have been, Oh warrior, ordered by Kaikeyi at my father’s words, I shall not be able to transgress those behests again.
  modern: Since Kaikeyī has ordered me at my father's word, I cannot transgress those commands again.
2.18.36:
  dutt: Ayodhyā XXI
  text: Do thou relinquish therefore this unrighteous purpose of thine consequent to the virtues of the Kshatriyas; do thou abide by righteousness but not cruelty, and follow my decision."
  modern: So give up this unrighteous purpose that comes from Kṣatriya ways. Keep to righteousness and not cruelty, and follow my decision."
2.19.7:
  dutt: Ayodhyā XXII
  text: My father is of truthful words and vows and he has been greatly terrified by the fear of the next world; may his fear disappear now.
  modern: My father is truthful in word and vow, and he is terrified by the fear of the next world. May his fear go away now.
2.19.14:
  dutt: Ayodhyā XXII
  text: … Had not Destiny been instrumental in bringing about this determination in Kaikeyi, she would not have been so much persevering in the infliction of misery upon me.
  modern: … If Destiny had not brought about this determination in Kaikeyī, she would not have pressed so hard to inflict misery on me.
2.19.15:
  dutt: Ayodhyā XXII
  text: Knowest thou, Oh gentle Lakshmana, that I have never made any distinction in my mind between my mothers, nor did Kaikeyi make any such thing before between me and her son; …
  modern: You know, gentle Lakṣmaṇa, that I have never made any distinction in my mind between my mothers, and Kaikeyī never made any distinction before between me and her own son. …
2.19.20:
  dutt: Ayodhyā XXII
  text: Destiny is the prime source of those inconceivable causes which occur with reference to happiness misery, fear, and anger, profit and loss, birth and deliverance. … The hinderance in this world to the completion of works taken in hand, and the origination of an unthought of event in its stead, is nothing but the action of this Destiny.
  modern: Destiny is the main source of those unimaginable causes behind happiness and misery, fear and anger, gain and loss, birth and release. … When work begun in this world is stopped and something unforeseen happens instead, that is nothing but the work of Destiny.
2.19.20+1:
  dutt: Ayodhyā XXII
  text: (with 2.19.20)
2.19.20+2:
  dutt: Ayodhyā XXII
  text: Do not grieve, Oh Lakshmana, for the loss of this kingdom. Of kingdom and exile into the forest, exile is fraught with glorious results.
  modern: Do not grieve, Lakṣmaṇa, for the loss of this kingdom. Of kingdom and exile in the forest, exile is the one with glorious results.
2.20.1:
  dutt: Ayodhyā XXIII
  text: Being addressed by Rāma thus, Lakshmana, the mighty hero, hanging down his head with half reluctance, pondered for sometime, and, placed midway between joy and grief, …
  modern: Addressed thus by Rāma, the mighty Lakṣmaṇa hung his head half unwillingly and thought for a while. Placed between joy and grief, …
2.20.5:
  dutt: Ayodhyā XXIII
  text: … glancing a look awry, thus spoke he unto his brother.
  modern: … glancing awry, he spoke thus to his brother.
2.20.6:
  dutt: Ayodhyā XXIII
  text: '"To avoid the transgression of righteousness, and the degradation of the people (consequent upon a bad example), thou art eager to repair unto the forest. This thy eagerness is certainly misplaced.'
  modern: '"To avoid transgressing righteousness and giving the people a bad example, you are eager to go to the forest. But this eagerness is surely misplaced.'
2.20.7:
  dutt: Ayodhyā XXIII
  text: Wast not thou under error, how could one like thyself, being heroic among the Kshatriyas, and capable of overcoming Destiny, speak in such a strain as behoves one that is impotent. Why dost thou extol Destiny which is powerless and weak.
  modern: If you were not in error, how could one like you, a hero among Kṣatriyas, able to overcome Destiny, speak in a way that suits an impotent man? Why do you extol Destiny, which is powerless and weak?
2.20.8:
  dutt: Ayodhyā XXIII
  text: For what reason dost thou not apprehend (unrighteousness) in those two (Daçarātha and Kaikeyi), addicted to vice. Dost thou not understand that there are many people who feign piety outwardly (to deceive the simple).
  modern: Why do you not suspect unrighteousness in those two, Daśaratha and Kaikeyī, who are addicted to vice? Do you not understand that many people feign piety outwardly, to deceive the simple?
2.21.15:
  dutt: Ayodhyā XXIV
  text: Thus addressed, Kauçalya, bearing great affection for her son, sorely pained and having her eyes full of tears, spoke unto her beloved son the following words.
  modern: Thus addressed, Kausalyā, who bore great affection for her son, was sorely pained, her eyes full of tears, and she spoke to her beloved son these words.
2.21.16:
  dutt: Ayodhyā XXIV
  text: '"Oh Rāma, I shall not be able to live amongst these co-wives, if art thou resolved to go to the forest for the discharge of thy father’s behest; do thou take me with thee, Oh Kākuthstha, like unto a wild hind.'
  modern: '"O Rāma, I shall not be able to live among these co-wives if you are resolved to go to the forest to carry out your father''s command. Take me with you, O Kākutstha, like a wild hind.'
2.21.18:
  dutt: Ayodhyā XXIV
  text: Bharata is also pious and beloved of all people in speech—he, intent on the performance of religious services, shall attend upon thee always.
  modern: Bharata is also pious and beloved of all people in speech; devoted to religious services, he shall always attend on you.
2.21.20:
  dutt: Ayodhyā XXIV
  text: The woman, who serves not her husband being engaged in excellent religious rites and fasts, shall fare wretchedly in the life to come; and a woman gets at the excellent abode of the celestials by serving her husband. Even those who do not worship and bow unto the celestial’s should serve their husbands alone being intent upon their welfare …
  modern: A woman who does not serve her husband, though devoted to excellent rites and fasts, will fare badly in the next life; a woman reaches the high heaven of the gods by serving her husband. Even women who do not worship or bow to the gods should serve their husbands alone, intent on their welfare. …
2.21.20+1:
  dutt: Ayodhyā XXIV
  text: (with 2.21.20)
2.21.22:
  dutt: Ayodhyā XXIV
  text: Do thou beguile thy time, Oh worshipful one, expecting my return, by worshipping the celestials with flowers and oblations unto the fire and serving well the Brahmins. …
  modern: Pass your time, worshipful one, awaiting my return, by worshipping the gods with flowers and with oblations to the fire, and by serving the Brāhmaṇas well. …
2.21.22+1:
  dutt: Ayodhyā XXIV
  text: … "Oh my darling! it is beyond my power to dissuade thee from thy firm resolution for going to the forest; it is impossible to avoid this hour of separation.
  modern: '"My darling, I cannot turn you from your firm resolve to go to the forest. This hour of parting cannot be avoided.'
2.21.22+2:
  dutt: Ayodhyā XXIV
  text: … Do thou now repair, Oh mighty hero, and come back in peace, and console me with soul-soothing, tender words.
  modern: … Go now, mighty hero, and come back in peace, and console me with soothing, tender words.
2.21.22+3:
  dutt: Ayodhyā XXIV
  text: Oh my darling, shall that day ever come, when I shall see thee return from the forest, wearing bark and matted hair."
  modern: Oh my darling, will that day ever come when I shall see you return from the forest, wearing bark and matted hair?"
2.22.1:
  dutt: Ayodhyā XXV
  text: Kauçalyā subduing her sorrow,and touching holy water, began to perform auspicious ceremonies for Rāma, …
  modern: Kausalyā put aside her sorrow, touched holy water, and began to perform auspicious rites for Rāma, …
2.22.3:
  dutt: Ayodhyā XXV
  text: May the six seasons, months, years and all the divisions of time confer upon the pleasure always, when thou of great intelligence shalt wander away into the forest in the attire of an ascetic.
  modern: May the six seasons, months, years, and all the divisions of time bring you pleasure always, when you, of great intelligence, wander in the forest in the dress of an ascetic.
2.22.4:
  dutt: Ayodhyā XXV
  text: … Smritis, and virtue protect thee, Oh my son, on all sides. May the great deity Skanda, Soma, Vrihaspati, Saptarshi, Narad, Moon and other ascetics protect thee.
  modern: "… may the Smṛtis and virtue protect you on all sides, my son. May the great god Skanda, Soma, Bṛhaspati, the Seven Sages, Nārada, the Moon and other ascetics protect you."
2.22.5:
  dutt: Ayodhyā XXV
  text: … When shalt thou repair unto the wood, may the mountains, oceans, Varuna, the heaven, sky, earth, air, things movable and immovable, planets and stars with their presiding deities, day, night, and evening protect thee.
  modern: … When you go to the woods, may the mountains, oceans, Varuṇa, the heaven, the sky, the earth, the air, things moving and unmoving, the planets and stars with their presiding deities, day, night, and evening protect you.
2.22.14:
  dutt: Ayodhyā XXV
  text: May that blessing attend thee, which was invoked in olden times by Vinatā, for that king of birds Garuda, praying for nectar.
  modern: May that blessing attend you which Vinatā invoked in olden times for Garuḍa, the king of birds, when he sought nectar.
2.22.14+1:
  dutt: Ayodhyā XXV
  text: May that prosperity wait upon thee, Oh Rāma, which crowned the mighty Vishnu, while perambulating with his three steps the heaven earth and the regions as a dwarf.
  modern: May that prosperity wait on you, O Rāma, which crowned the mighty Viṣṇu when he strode over heaven, earth, and the regions in his three steps as a dwarf.
2.22.14+2:
  dutt: Ayodhyā XXV
  text: May thou returning from the forest and being dressed with royal robes and ornaments, satisfy the desires of my daughter-in-law.
  modern: May you return from the forest, dressed in royal robes and ornaments, and satisfy the wishes of my daughter-in-law.
2.23.1:
  dutt: Ayodhyā XXVI
  text: Rāma, intent on repairing unto the forest, and treading in pious tracks, after duly saluting Kauçalyā and beautifying the royal road, crowded with people, captivated their hearts by means of his high accomplishments.
  modern: "Intent on going to the forest and treading pious ways, Rāma saluted Kausalyā, graced the royal road, crowded with people, and won their hearts by his high qualities."
2.23.5:
  dutt: Ayodhyā XXVI
  text: Entered Rāma this beautiful abode, excellently furnished and filled with people highly delighted, having his head hanging down a little with shame.
  modern: Rāma entered his beautiful dwelling, well furnished and full of delighted people, with his head bowed a little in shame.
2.23.6:
  dutt: Ayodhyā XXVI
  text: Sitā, seeing her husband, racked with sorrow and troubled in mind with anxiety, rose up trembling from her seat.
  modern: Sītā, seeing her husband racked with sorrow and troubled in mind with anxiety, rose from her seat trembling.
2.23.6+1:
  dutt: Ayodhyā XXVI
  text: Seeing her, that virtuous soulcd Rāghava, could not bear his internal sorrow, which manifested itself by external signs.
  modern: Seeing her, the virtuous Rāghava could not bear his inner sorrow, which showed in outward signs.
2.23.18:
  dutt: Ayodhyā XXVI
  text: Wereupon spoke unto that weeping Sitā, the descendant of Raghu thus:—"Oh Sitā, Oh thou born of a great family, versed in the knowledge of religion and intent on the performance of religious rites, my father has banished me unto the forest!
  modern: Then the descendant of Raghu said to the weeping Sītā, "O Sītā, born of a great family, versed in knowledge of religion and intent on religious rites, my father has banished me to the forest!
2.23.19:
  dutt: Ayodhyā XXVI
  text: Do thou hear, Oh daughter of Janaka, how has this calamity befallen me.
  modern: Hear, daughter of Janaka, how this calamity has come upon me.
2.23.20:
  dutt: Ayodhyā XXVI
  text: In the days of yore was granted unto my mother, Kaikeyi two boons by my father, king Daçarātha of truthful vows.
  modern: In days of old my father, King Daśaratha of truthful vows, granted my mother Kaikeyī two boons.
2.23.21:
  dutt: Ayodhyā XXVI
  text: When every thing was made ready by my father for my installation, Kaikeyi reminded him of his promise and gained over him for his righteousness.
  modern: When everything was ready for my installation, Kaikeyī reminded him of his promise and gained her point because of his righteousness.
2.23.22:
  dutt: Ayodhyā XXVI
  text: I shall live in the forest of Dandaka for fourteen years and Bharata shall be installed by my father as the heir apparent of the throne. And myself bound to fly as an exile unto the wood, come here to see thee; …
  modern: I shall live in the forest of Daṇḍaka for fourteen years, and my father will install Bharata as heir apparent. Bound to leave as an exile for the woods, I have come to see you. …
2.23.23:
  dutt: Ayodhyā XXVI
  text: Those who are crowned with prosperity cannot bear another’s praise; it therefore behoves thee not to extol my virtues in the presence of Bharata. …
  modern: Those crowned with prosperity cannot bear another's praise, so you should not extol my virtues in Bharata's presence. …
2.23.26:
  dutt: Ayodhyā XXVI
  text: Do thou, Oh sinless and auspicious one, live here engaged in religious rites and fasts, when I shall wend my way unto the forest inhabited by the great ascetics.
  modern: Live here, sinless and auspicious one, engaged in religious rites and fasts, while I go to the forest inhabited by the great ascetics.
2.23.27:
  dutt: Ayodhyā XXVI
  text: Rising from the bed early in the morning, adore the deities every day, and then bow down unto the feet of my father Daçarātha, the lord of men.
  modern: Rising early in the morning, worship the gods every day, and then bow at the feet of my father Daśaratha, the lord of men.
2.23.28:
  dutt: Ayodhyā XXVI
  text: My mother Kauçalyā is old and much pressed down with sorrow; do thou show proper respects unto her, considering it to be a pious deed.
  modern: My mother Kausalyā is old and weighed down with sorrow; show her proper respect, as a pious deed.
2.23.29:
  dutt: Ayodhyā XXVI
  text: Thou shouldst then bow down unto my other mothers who all minister unto me, with equal love and affection.
  modern: Then bow to my other mothers, who all treat me with equal love and affection.
2.23.29+1:
  dutt: Ayodhyā XXVI
  text: It therefore behoves thee, Oh auspicious one, to live here, abiding by Bharata’s commands and being engaged in religious rites and truthful vows.
  modern: So, auspicious one, you should live here, following Bharata's commands, and keep to religious rites and true vows.
2.24.1:
  dutt: Ayodhyā XXVII
  text: Being addressed thus, Vaidehi, beloved and sweet speeched, spoke unto her husband the following words, offended as it were on account of her great affection.
  modern: Spoken to thus, Vaidehī, beloved and sweet-spoken, answered her husband, as if offended by her great affection.
2.24.2:
  dutt: Ayodhyā XXVII
  text: Oh dear husband, father, mother, son, brother, daugther-in-law, all of them abide by the consequences of their own actions, it is the wife alone, Oh best of men, that shares the fate of her husband; it therefore that ever along with thee I have been ordered to live in the forest.
  modern: Dear husband, father, mother, son, brother, daughter-in-law each abide by the consequences of their own actions. The wife alone, best of men, shares her husband's fate. So I too have been ordered to live in the forest with you always.
2.24.3:
  dutt: Ayodhyā XXVII
  text: (with 2.24.2)
2.24.4:
  dutt: Ayodhyā XXVII
  text: Neither father, mother, son, friends, nor her ownself is the stay of a woman in this or in after life, it is the husband alone that is her only support.
  modern: Neither father, mother, son, friends, nor her own self is a woman's support in this life or the next. Her husband alone is her only support.
2.24.5:
  dutt: Ayodhyā XXVII
  text: If dost thou repair to-day unto the forest impregnable, I shall go before thee, Oh Rāghava, treading upon the thorns and prickly grass.
  modern: If you go today to the impassable forest, I shall go before you, Rāghava, treading down thorns and prickly grass.
2.24.6:
  dutt: Ayodhyā XXVII
  text: Confident do thou take me with thee, Oh great hero, renouncing jealousy and indignation, like unto water left after drinking; there exists no sin in me that could justify forsaking.
  modern: Take me with you with confidence, great hero, giving up jealousy and anger like water left over after drinking. There is no sin in me that could justify abandoning me.
2.24.12:
  dutt: Ayodhyā XXVII
  text: Undoubtedly I shall always live upon roots and fruits; living with thee always I shall not bring about thy affliction.
  modern: Surely I shall always live on roots and fruits. Living with you, I shall not add to your trouble.
2.24.16:
  dutt: Ayodhyā XXVII
  text: I shall never experience the reverse of fortune, inasmuch as I do not like to live in the abode of celestials, Oh Rāghava, if I am to dwell there without thee; no, it is not pleasing unto me, Oh best of men.
  modern: "I shall never suffer a reversal of fortune, for I would not like to live even in the abode of the gods, Rāghava, if I had to live there without you. No, O best of men, it would not please me."
2.25.4:
  dutt: Ayodhyā XXVIII
  text: … Renounce therefore. Oh Sitā, thy intention of flying as an exile unto the forest, which for its impenitrableness is said to abound in evils.
  modern: So give up, Sītā, your plan of going into exile in the forest, which is said to be full of dangers because it is so hard to pass through.
2.25.4+1:
  dutt: Ayodhyā XXVIII
  text: Those that dwell in the forest will have to remain content, having practised moderation in food, O Maithili, with whatever edibles are attainable in the forest; so the wood is full of misery.
  modern: Those who live in the forest must be content, in moderation of food, with whatever edibles are to be had there, O Maithilī, so the wood is full of misery.
2.26.1:
  dutt: Ayodhyā XXIX
  text: Hearing these words of Rāma, Sitā greatly sorry, with tears in her eyes, spoke gently unto him the following words.
  modern: Hearing these words of Rāma, Sītā was very sorry, and with tears in her eyes she spoke gently to him.
2.26.2:
  dutt: Ayodhyā XXIX
  text: '"The evils, thus enumerated by thee of living in the forest, do thou know, appear as so many good qualities unto me, who have been made forward by thy affection.'
  modern: '"The evils you have listed in living in the forest appear to me as so many good qualities, since your affection has made me bold.'
2.26.5:
  dutt: Ayodhyā XXIX
  text: … ’A woman, without her husband, cannot live’; this truth has been pointed out by thee, O Rāma, unto me.
  modern: '… ''A woman cannot live without her husband'': you, Rāma, have taught me this truth.'
2.26.14:
  dutt: Ayodhyā XXIX
  text: O thou, pure-hearted one, surely shall I become sinless if I follow my husband,out of affection; for my husband is my Divinity.
  modern: Surely, pure-hearted one, I shall become sinless if I follow my husband out of affection, for my husband is my divinity.
2.26.15:
  dutt: Ayodhyā XXIX
  text: I have heard this pious report from the Brāhmanas of great fame that even in after life thy company is greatly beneficial unto me.
  modern: I have heard this pious report from famous Brāhmaṇas, that even in the next life your company is greatly beneficial to me.
2.26.16:
  dutt: Ayodhyā XXIX
  text: She, who has been given away as wife by her father to one, with due rites of gift peculiar to each class, touching holy water, shall be his, even in her after life.
  modern: The woman whose father gives her as wife to a man, with the rites of gift proper to each class, touching holy water, is his even in her next life.
2.27.3:
  dutt: Ayodhyā XXX
  text: '"What thought of thee, O Rāma, my father, the king of Mithilā, accepting thee as his son-in-law, who was a man in form but (in deeds) a woman?'
  modern: '"What did my father, the king of Mithilā, think of you, Rāma, in accepting you as his son-in-law, a man in form but in deeds a woman?'
2.27.6:
  dutt: Ayodhyā XXX
  text: Know me to be perfectly under thy influence like unto Sāvitri, following her husband Satvavān, the son of Dumat Sen.
  modern: Know me to be wholly under your influence, like Sāvitrī following her husband Satyavān, the son of Dyumatsena.
2.27.7:
  dutt: Ayodhyā XXX
  text: I have not, like one bringing stigma on her line, ever in my life thought of a second person, but of thee whom I must follow into the forest.
  modern: I have never in my life, like one who brings disgrace on her family, thought of a second man, but only of you, whom I must follow into the forest.
2.27.8:
  dutt: Ayodhyā XXX
  text: Dost thou, like unto an ordinary actor, wish to hand me over to others, who am chaste, pure as a virgin, and long held in conjugal affection?
  modern: Do you, like an ordinary actor, want to hand me over to others, though I am chaste, pure as a virgin, and long held in conjugal affection?
2.27.17:
  dutt: Ayodhyā XXX
  text: … do thou take me with thee, O Rāma, conceiving with pleasure that thy company is a heaven unto me and thy absence a hell.
  modern: … take me with you, Rāma, gladly understanding that your company is heaven to me and your absence hell.
2.27.24:
  dutt: Ayodhyā XXX
  text: 'Finding her almost insensible with sorrow, Rāma flung his arms round her and reviving her (with consolation) spoke the following words unto her; "I do not long for, O worshipful one, even the abode of celestials gained through thy affliction: fear there is none for me like unto the self-create Brahmā.'
  modern: Finding her almost insensible with sorrow, Rāma threw his arms round her, revived her with consolation, and said, "I do not want even the abode of the gods, worshipful one, if it is gained through your suffering. I have no fear from any quarter, like the self-created Brahmā.
2.27.25:
  dutt: Ayodhyā XXX
  text: (with 2.27.24)
2.27.30:
  dutt: Ayodhyā XXX
  text: Therefore do I desire to follow what my father commands me, treading in the path of truth,— and this is the virtue eternal. … do thou follow me, O thou timid one, and the partner of my righteousness.
  modern: So I want to do as my father commands me, keeping to the path of truth; this is the eternal law. … Follow me, timid one, and be my partner in righteousness.
2.27.30+1:
  dutt: Ayodhyā XXX
  text: Do thou address thyself to repairing unto the forest, for without this now even heaven itself does not please me.
  modern: Get ready to go to the forest, for without this even heaven itself does not please me now.
2.27.32:
  dutt: Ayodhyā XXX
  text: Convinced that her going to the forest was desired by her husband, Sitā began to distribute them speedily with a delighted heart.
  modern: Convinced that her going to the forest was her husband's wish, Sītā began to distribute her things quickly, with a delighted heart.
2.27.32+1:
  dutt: Ayodhyā XXXI
  text: Hearing this conversation, Lakshmana, who had gone there before, with tears in his eyes and being unable to bear this terrible sorrow, took hold of his brother’s feet and spoke thus unto that greatly renowned Sitā and Rāghava.
  modern: Hearing this conversation, Lakṣmaṇa, who had gone there before, with tears in his eyes and unable to bear this terrible sorrow, took hold of his brother's feet and spoke to the greatly renowned Sītā and Rāghava.
2.27.32+2:
  dutt: Ayodhyā XXXI
  text: '"If thou art resolved to repair unto the forest filled with deer and elephants, I shall accompany thee, always going before with bows in my hands. …'
  modern: '"If you are resolved to go to the forest filled with deer and elephants, I shall go with you, always going before you with my bow in my hands. …'
2.27.32+3:
  dutt: Ayodhyā XXXI
  text: Alienated from thee I do not long for the abode of the celestials, nor for eternal life, nor for the wealth of the three regions."
  modern: Apart from you I do not long for the abode of the gods, nor for eternal life, nor for the wealth of the three regions."
2.28.1:
  dutt: Ayodhyā XXXI
  text: Then the highly effulgent Rāma spoke thus unto that sedate Lakshmana, who stood praying before him with clasped hands.
  modern: Then the radiant Rāma spoke to the steady Lakṣmaṇa, who stood praying before him with folded hands.
2.28.1+1:
  dutt: Ayodhyā XXXI
  text: '"Thou art sedate, fond of virtue, of peaceful temper, and thou walkest always in the paths of righteousness. I hold thee dear as my life and thou art obedient unto me and art my friend.'
  modern: '"You are steady, fond of virtue, peaceful of temper, and you always walk in the paths of righteousness. I hold you as dear as my life, and you are obedient to me and my friend.'
2.28.2:
  dutt: Ayodhyā XXXI
  text: If thou dost accompany me unto the forest, O son of Sumitrā, who shall serve Kauçalyā and the highly renowned Sumitrā?
  modern: If you go with me to the forest, O son of Sumitrā, who will serve Kausalyā and the highly renowned Sumitrā?
2.28.2+1:
  dutt: Ayodhyā XXXI
  text: … Bharata attaining the throne and siding his mother, Kaikeyi will never think of Kauçalyā or Sumitrā sore distressed with grief.
  modern: Once Bharata has the throne and sides with his mother Kaikeyī, he will never think of Kausalyā or Sumitrā, deep in grief.
2.28.2+2:
  dutt: Ayodhyā XXXI
  text: O thou, versed in the knowledge of religion, real virtue consists in the adoration of superiors.
  modern: "You who know religion, real virtue lies in the worship of one's superiors."
2.28.2+3:
  dutt: Ayodhyā XXXI
  text: Do this, O son of Sumitrā, for my sake; if we all go away leaving her aside, she will not be happy in any way."
  modern: Do this for my sake, son of Sumitrā; if we all go away and leave her, she will not be happy in any way."
2.28.5:
  dutt: Ayodhyā XXXI
  text: Accosted thus by Rāma, Lakshmana, well versed in speech, spoke unto him the following humble words.
  modern: Thus addressed by Rāma, Lakṣmaṇa, skilled in speech, answered him with these humble words.
2.28.6:
  dutt: Ayodhyā XXXI
  text: '"Be afraid of thy power, O hero, Bharata shall adore Kauçalyā and Sumitrā—there is no doubt about this.'
  modern: '"Be assured of your power, O hero: Bharata will honor Kausalyā and Sumitrā; there is no doubt about this.'
2.28.8:
  dutt: Ayodhyā XXXI
  text: I shall go before thee pointing out thy course, with stringed bows, a hoe, and a basket in my hands.
  modern: "I shall go before you showing the way, with strung bows, a hoe, and a basket in my hands."
2.28.9:
  dutt: Ayodhyā XXXI
  text: I shall bring for thee every day various roots and fruits and other things that grow in the forest and which the ascetics use in their sacrifice.
  modern: I shall bring you every day various roots and fruits and other things that grow in the forest and that the ascetics use in their sacrifices.
2.28.10:
  dutt: Ayodhyā XXXI
  text: Thou shalt amuse thyself with Vaidehi on the sides of the hill, and I shall perform everything for thee whether thou art asleep or awake."
  modern: You will amuse yourself with Vaidehī on the hillsides, and I shall do everything for you, whether you are asleep or awake."
2.28.11:
  dutt: Ayodhyā XXXI
  text: Being extremely gratified with these words, Rāma spoke unto him, saying,—"Do thou follow me, O son of Sumitrā, obtaining permission from all thy relatives.
  modern: Rāma, very pleased with these words, said to him, "Follow me, son of Sumitrā, after getting permission from all your relatives."
2.30.1:
  dutt: Ayodhyā XXXIII
  text: Having distributed much wealth to the Brāhmanas, the Rāghavas set out with Sitā for the purpose of seeing their father.
  modern: Having given much wealth to the Brāhmaṇas, the two Rāghavas set out with Sītā to see their father.
2.30.1+1:
  dutt: Ayodhyā XXXIV
  text: Then the mighty and incomparable Rāma of eyes resembling lotus-petals said unto the charioteer,—"Do you announce me to my father."
  modern: Then the mighty and incomparable Rāma, with eyes like lotus petals, said to the charioteer, "Announce me to my father."
2.31.2:
  dutt: Ayodhyā XXXIV
  text: … Thereupon concluding that the king agitated by sorrow was bewailing Rāma, the charioteer said with joined hands.
  modern: Then, seeing that the king, troubled by sorrow, was grieving for Rāma, the charioteer spoke with joined hands.
2.31.3:
  dutt: Ayodhyā XXXIV
  text: … "O foremost of men, your son waits at the entrance, after having distributed wealth to Brāhmanas and his retinue …
  modern: … "O foremost of men, your son is waiting at the entrance, having given wealth to the Brāhmaṇas and his retinue. …
2.31.5:
  dutt: Ayodhyā XXXIV
  text: Know that he is about to set out for the mighty forest. Do you, O Lord of earth, see him furnished with every perfection, like the Sun himself surrounded by his rays."
  modern: Know that he is about to set out for the mighty forest. See him, lord of the earth, endowed with every perfection, like the sun himself surrounded by his rays."
2.31.6:
  dutt: Ayodhyā XXXIV
  text: Thereupon, that virtuous and truthful (king) resembling the ocean by virtue of his gravity, and motionless like the welkin, answered Sumantra, saying,—"O Sumantra, do thou bring hither my wives."
  modern: Then the virtuous and truthful king, as deep as the ocean and as still as the sky, answered Sumantra, "Sumantra, bring my wives here."
2.31.7:
  dutt: Ayodhyā XXXIV
  text: (with 2.31.6)
2.31.10:
  dutt: Ayodhyā XXXIV
  text: And three hundred and fifty females furnished with coppery eyes and observing vows, surrounding Kauçalyā, proceeded slowly.
  modern: Three hundred and fifty women with coppery eyes who kept their vows went slowly, surrounding Kausalyā.
2.31.12:
  dutt: Ayodhyā XXXIV
  text: Thereat the charioteer taking Rāma, Lākshmana and Mithila’s daughter, speedily came before the lord of earth.
  modern: The charioteer took Rāma, Lakṣmaṇa, and Mithilā's daughter and quickly came before the lord of the earth.
2.31.14:
  dutt: Ayodhyā XXXIV
  text: … And casting his eyes on Rāma, the king rushed towards him, but before reaching his son, the aggrieved monarch fell down to the earth in a swoon.
  modern: Seeing Rāma, the king rushed toward him, but before he reached his son, the grief-stricken king fell to the ground in a faint.
2.31.18:
  dutt: Ayodhyā XXXIV
  text: When the lord of the earth oppressed with the vapour begot of grief and overwhelmed with emotion, had regained his senses, Rāma with joined palms said— …
  modern: 'When the king, overwhelmed by grief and emotion, had come to himself, Rāma joined his palms and said: …'
2.31.19:
  dutt: Ayodhyā XXXIV
  text: … "I ask you, O mighty monarch, as you are the lord of all. Do you see me safely despatched to the forest of Dandaka.
  modern: "\"I ask you, great king, for you are the lord of all. See me safely off to the Daṇḍaka forest."
2.31.20:
  dutt: Ayodhyā XXXIV
  text: Do you permit Lakshmana, and let Sitā also follow mc to the woods; for although prohibited by me with various reasons, they do not wish to be left behind.
  modern: Permit Lakṣmaṇa, and let Sītā also follow me to the woods. Though I have forbidden them with various reasons, they do not wish to be left behind.
2.31.21:
  dutt: Ayodhyā XXXIV
  text: Do you, O bestower of honor, permit us all, renouncing sorrow—Lakshmana and Sitā and me,—like Prajāpati permitting his sons."
  modern: O giver of honor, give up your sorrow and permit us all, Lakṣmaṇa, Sītā, and me, as Prajāpati permits his sons."
2.31.25:
  dutt: Ayodhyā XXXIV
  text: … "O king do you rule this earth for a thousand years,—I will reside in the forest. I do not wish for the kingdom.
  modern: '"O king, rule this earth for a thousand years. I will live in the forest. I do not want the kingdom.'
2.31.25+1:
  dutt: Ayodhyā XXXIV
  text: Having spent five and nine years in the woods, I shall again embrace your feet, lord of men, after fulfilling your vow."
  modern: After spending five and nine years in the woods, I shall again embrace your feet, lord of men, having fulfilled your vow."
2.31.26:
  dutt: Ayodhyā XXXIV
  text: … "Do you, my darling, with the view of attaining welfare here and hereafter and auspicious fortune, go calmly your fearless way,—so that you may return hither (in time.) …
  modern: … My darling, with a view to your welfare here and hereafter and to auspicious fortune, go calmly on your fearless way, so that you may return here in time. …
2.34.29:
  dutt: Ayodhyā XXXIX
  text: Then with joined hands that foremost of virtuous ones addressed his mother, who, duly honored by all, was seated in the midst of his other mothers, saying,—"O mother, without indulging in grief, you should minister unto my father; and the term of my abode in the woods will shortly expire.
  modern: Then, with folded hands, that foremost of virtuous men said to his mother, who sat honored by all among his other mothers, "Mother, do not give way to grief, and you should wait on my father; the term of my stay in the woods will soon be over.
2.34.30:
  dutt: Ayodhyā XXXIX
  text: (with 2.34.29)
2.34.31:
  dutt: Ayodhyā XXXIX
  text: You will find these five and nine years pass away as if in a sleep. Then again, getting me,you will see me surrounded by my friends and relatives."
  modern: You will find these five and nine years pass as if in sleep. Then you will have me again and see me surrounded by my friends and relatives."
2.35.2:
  dutt: Ayodhyā XL
  text: Then with the king’s permission, the righteous Rāghava stupified with sorrow, in company with Sitā, paid respect unto his mother.
  modern: Then, with the king's permission, the righteous Rāghava, stunned with sorrow, paid his respects with Sītā to his mother.
2.35.3:
  dutt: Ayodhyā XL
  text: Following his brother, Lakshmana saluted Kauçalyā; then he again took hold of his mother Sumitrā’s feet.
  modern: Following his brother, Lakṣmaṇa saluted Kausalyā, and then again took hold of his mother Sumitrā's feet.
2.35.4:
  dutt: Ayodhyā XL
  text: As the son of Sumitrā, was thus engaged in honoring his mother, his mother smelling the crown of his head, thus spoke unto the mighty-armed Lakshmana,— …
  modern: 'As Sumitrā''s son was honoring his mother, she smelled the crown of his head and spoke to the mighty-armed Lakṣmaṇa: …'
2.35.5:
  dutt: Ayodhyā XL
  text: … "Although attached unto thy friends here, thou hast my permission to go to the forest. When Rāma shall have gone (to the woods), do not, O son, show any negligence unto him.
  modern: '"Though you love your friends here, you have my permission to go to the forest. When Rāma has gone, my son, do not neglect him in any way.'
2.35.6:
  dutt: Ayodhyā XL
  text: O sinless one, whether in prosperity or in adversity, even this one is thy way. That a younger brother should follow his elder is in this world the duty of the righteous.
  modern: "Whether in prosperity or in adversity, he is your way, sinless one. It is the duty of the righteous in this world that a younger brother follow his elder."
2.35.8:
  dutt: Ayodhyā XL
  text: Do thou consider Rāma as Daçarātha, and Janaka’s own-begotten as myself; do thou regard Ayodhyā as a wilderness,—go my son, at thy sweet pleasure."
  modern: Consider Rāma to be Daśaratha, and Janaka's daughter to be myself, and regard Ayodhyā as a wilderness. Go, my son, at your own sweet pleasure."
2.35.8+1:
  dutt: Ayodhyā XL
  text: Counting the term of their stay in the woods, her father-in-law furnished Sitā following her lord with attires and ornaments.
  modern: Counting the term of their stay in the woods, her father-in-law furnished Sītā, who was following her lord, with clothes and ornaments.
2.35.14:
  dutt: Ayodhyā XL
  text: And seeing them with Sitā for the third, mounted, Sumantra drove the car yoked with goodly horses resembling the wind in celerity.
  modern: Seeing the three of them mounted, with Sītā as the third, Sumantra drove the car, yoked with fine horses as swift as the wind.
2.40.4:
  dutt: Ayodhyā XLV
  text: Although besought by the subjects, the truthful Kākutstha having pledged his word unto his father, kept on going to the forest.
  modern: Though besought by the people, the truthful Kākutstha, who had pledged his word to his father, kept going toward the forest.
2.40.6:
  dutt: Ayodhyā XLV
  text: And affectionately eying them as if drinking them with his sight, Rāma touchingly addressed those subjects as if they were his own,—"The love and regard which the inhabitants of Ayodhyā have for me, let them, for pleasing me, extend in full measure towards Bharata.
  modern: 'Looking at them lovingly, as if drinking them in with his eyes, Rāma spoke touchingly to those subjects as if they were his own: "The love and regard that the people of Ayodhyā have for me, let them extend in full measure to Bharata, to please me.'
2.40.7:
  dutt: Ayodhyā XLV
  text: That enhancer of Kaikeyi’s delight bearing an auspicious character, will duly compass your happiness and welfare. …
  modern: Bharata, who brings joy to Kaikeyī and is of good character, will duly see to your happiness and welfare.
2.43.2:
  dutt: Ayodhyā XLIX
  text: And as he went on, the auspicious night was spent. And then having offered up his devotions unto the beneficent Sandhyā, Rāma entered into another country.
  modern: And as he went on, the auspicious night passed. Then, having offered his devotions to the auspicious Sandhyā, Rāma entered another country.
2.43.2+1:
  dutt: Ayodhyā L
  text: … the queen of the Ocean—resonant with the cries of cranes and kraunchas.
  modern: … the queen of the Ocean, resounding with the cries of cranes and krauñcas.
2.44.1:
  dutt: Ayodhyā L
  text: Having passed the extensive and romantic Koçala, the intelligent elder brother of Lakshmana … The mighty-armed Rāma came to the Gangā near Sringaverapura.
  modern: Having passed through the wide and lovely Kosala country, the wise elder brother of Lakṣmaṇa … The mighty-armed Rāma came to the Gaṅgā near Śṛṅgaverapura.
2.44.9:
  dutt: Ayodhyā L
  text: There lived at the place a king named Guha, a friend unto Rāma, dear as his own self, a Nishāda by birth, powerful and famed as the lord of the Nishādas.
  modern: At that place lived a king named Guha, a friend of Rāma, dear as his own self, a Niṣāda by birth, powerful and famed as lord of the Niṣādas.
2.44.11:
  dutt: Ayodhyā L
  text: … Seeing the lord of the Nishadhas at a distance, Rāma came up unto him in company with Sumitrā’s son.
  modern: Seeing the lord of the Niṣādas some way off, Rāma went to meet him with Sumitrā's son.
2.46.51:
  dutt: Ayodhyā LII
  text: Seeing thee returned to the city, my youngest mother Kaikeyi will believe that Rāma has gone to the woods.
  modern: Seeing you return to the city, my youngest mother Kaikeyī will believe that Rāma has gone to the woods.
2.46.52:
  dutt: Ayodhyā LII
  text: Then well pleased on my having repaired to the woods, she will not entertain any apprehension anent the righteous monarch, thinking that he is untruthful.
  modern: Then, well pleased that I have gone to the woods, she will have no suspicion of the righteous king, thinking him untruthful.
2.46.54:
  dutt: Ayodhyā LII
  text: Do thou, O Sumantra, bear thyself unto the palace to compass the end of both the king and myself, and do thou communicate in the desired way what I have said unto the respective parties."
  modern: O Sumantra, go to the palace to serve the purpose of both the king and myself, and communicate in the desired way what I have said to the respective parties."
2.46.65:
  dutt: Ayodhyā LII
  text: Then taking the permission of Guha, the descendant of Ikshwāku, holding his soul in calmness, set out with his wife and Lakshmana.
  modern: Then, taking leave of Guha, the descendant of Ikṣvāku, calm in spirit, set out with his wife and Lakṣmaṇa.
2.48.8:
  dutt: Ayodhyā LIV
  text: Thus having proceeded at ease, those bowmen when the sun stood aslant, arrived in the vicinity of the ascetic’s residence on the delta of the Yamunā and the Gangā. …
  modern: Traveling at ease in this way, the bowmen arrived, when the sun stood low, near the ascetic's dwelling at the meeting of the Yamunā and the Gaṅgā. …
2.48.19:
  dutt: Ayodhyā LIV
  text: … "O Kākutstha, I behold thee come after a long time. I have heard of thy causeless exile.
  modern: '"Kākutstha, I see you come here after a long time. I have heard of your exile without cause.'
2.48.29:
  dutt: Ayodhyā LIV
  text: This spot at the meeting of the mighty rivers is lonely, sacred and charming. Do thou dwell here happily."
  modern: This spot at the meeting of the great rivers is lonely, sacred, and charming. Live here happily."
2.50.11:
  dutt: Ayodhyā LVI
  text: Then they proceeding on foot along with Sitā, arrived at the charming and beautiful mountain Chitrakuta.
  modern: Then they went on foot with Sītā and arrived at the charming and beautiful mountain Citrakūṭa.
2.50.13:
  dutt: Ayodhyā LVI
  text: … "O Lakshmana, bring thou wood good and strong. O amiable one, construct a dwelling. My mind is set upon staying here."
  modern: '"Lakṣmaṇa, bring good, strong wood. Build a dwelling, my friend. My mind is set on staying here."'
2.50.14:
  dutt: Ayodhyā LVI
  text: Hearing his words, Sumitrā’s son procured wood of various descriptions, and then that subduer of foes reared a cottage thatched with leaves.
  modern: Hearing his words, Sumitrā's son brought wood of various kinds, and then that subduer of foes built a cottage thatched with leaves.
2.51.4:
  dutt: Ayodhyā LVII
  text: And on the third day at dusk the charioteer arriving at Ayodhyā saw it bereft of happiness.
  modern: On the third day at dusk the charioteer reached Ayodhyā and saw it bereft of happiness.
2.52.12:
  dutt: Ayodhyā LVIII
  text: … O charioteer, do thou in my name salute with thy head the feet of my high-soulded sire worthy of being saluted, and famed (in the world). …
  modern: … Charioteer, in my name salute with your head the feet of my high-souled father, who is worthy of being saluted and is famed in the world. …
2.52.12+1:
  dutt: Ayodhyā LVIII
  text: And having saluted my mother Kauçalyā and conveyed unto her news of my welfare, as well as of my unswerving adherence to morality, do thou tell her the words,— Do you remaining steady in virtue, at the proper hour bestir yourself in behalf of the chamber of sacrificial fire.
  modern: 'And when you have saluted my mother Kausalyā and given her news of my welfare and my unswerving adherence to morality, tell her these words: ''Remain steady in virtue, and at the proper hours be diligent in the chamber of the sacrificial fire.'
2.52.12+2:
  dutt: Ayodhyā LVIII
  text: (with 2.52.12+1)
2.52.14:
  dutt: Ayodhyā LVIII
  text: And, O revered one, do you minister unto the feet of that worshipful one, (the king), as if they were very deities.
  modern: And, revered one, serve the feet of the worshipful king as if they were the feet of a god.
2.52.15:
  dutt: Ayodhyā LVIII
  text: … Do thou communicate unto Bharata news of my welfare and say in my name,—Do you behave properly with all your mothers. …
  modern: '… Give Bharata news of my health and tell him in my name: behave properly toward all your mothers. …'
2.52.17:
  dutt: Ayodhyā LVIII
  text: … And thus said Rāma ministered unto by Lakshmana, with a tearful countenance; …
  modern: … So spoke Rāma, attended by Lakṣmaṇa, with a tearful face, …
2.53.14:
  dutt: Ayodhyā LIX
  text: Hearing the words of the charioteer, the king like one exceedingly forlorn, addressed the former in words lost in the vapour of sorrow, "Exhorted by Kaikeyi of a sinful country, born in a sinful race and cherishing sinful designs, I did not take counsel with aged people capable of offering advice.
  modern: 'Hearing the charioteer''s words, the king, like one utterly forlorn, answered him in words choked by the vapor of sorrow: "Urged on by Kaikeyī, who is from a sinful country, born in a sinful race and set on sinful designs, I did not take counsel with aged men able to advise.'
2.53.15:
  dutt: Ayodhyā LIX
  text: (with 2.53.14)
2.53.16:
  dutt: Ayodhyā LIX
  text: Without consulting with friends or courtiers or persons versed in the Vedas, I have in the interests of a woman rashly done this thing through ignorance.
  modern: Without consulting friends or courtiers or men versed in the Vedas, I rashly did this thing, through ignorance, for the sake of a woman.
2.53.24:
  dutt: Ayodhyā LIX
  text: Ah Rāma! Ah thou younger brother of Rāma! Ah thou unfortunate Vaidehi! You do not know that I am through grief lamenting like one deserted."
  modern: Ah Rāma! Ah, younger brother of Rāma! Ah, unfortunate Vaidehī! You do not know that I am lamenting through grief like one deserted."
2.53.24+1:
  dutt: Ayodhyā LIX
  text: (with 2.58.56)
2.58.56:
  dutt: Ayodhyā LXIV
  text: Having thus lamented in presence of Rāma’s mother and Sumitrā, king Daçaratha breathed his last. …
  modern: Having lamented in this way in the presence of Rāma's mother and Sumitrā, King Daśaratha breathed his last. …
2.60.12:
  dutt: Ayodhyā LXVI
  text: Then placing the corpse of the king in a (capacious) pan with oil, the courtiers performed the mourning rites of the monarch.
  modern: Then the courtiers placed the king's corpse in a large pan of oil and performed the mourning rites for the king.
2.60.13:
  dutt: Ayodhyā LXVI
  text: But well versed in every thing, the counsellors, in the absence of his son, did not perform the funeral obsequies of the king; and therefore they placed his body stretched in the pan of oil.
  modern: But the counsellors, who knew everything, did not perform the king's funeral rites in the absence of his son, and so they kept his body laid in the pan of oil.
2.61.1:
  dutt: Ayodhyā LXVII
  text: And when the night departed and the sun had arisen, those officers of the royal house-hold belonging to the twice-born order, Mārkandeya, Maudgalya, Vāmadeva, Kāçyapa, Kātyāyana, Gautama, and the highly famous Jāvāli, assembled together along with the counsellors, …
  modern: When the night had passed and the sun had risen, the twice-born officers of the royal household, Mārkaṇḍeya, Maudgalya, Vāmadeva, Kāśyapa, Kātyāyana, Gautama and the famous Jābāli, gathered with the counsellors, …
2.61.3:
  dutt: Ayodhyā LXVII
  text: … spoke each on different topics. Then facing the royal priest, the eminent Vasistha, they said, …
  modern: '… Each spoke on different matters. Then, facing the royal priest, the eminent Vasiṣṭha, they said: …'
2.61.3+1:
  dutt: Ayodhyā LXVII
  text: The king is truth, the king is morality, the king is the racial dignity of those possessed of the same, the king is the father, the king is the mother—the king compasseth the welfare of men.
  modern: The king is truth, the king is morality, the king is the dignity of the family for those who have families, the king is father, the king is mother; the king secures the welfare of men.
2.62.1:
  dutt: Ayodhyā LXVIII
  text: Hearing their words, Vasishtha said unto the Brāhmanas and the adherents and counsellors (of the king), "Bharata, on whom the king has conferred the kingdom, along with his brother Satrughna, is living happily in the house of his maternal uncle.
  modern: Hearing their words, Vasiṣṭha said to the Brāhmaṇas, the adherents, and the counsellors of the king, "Bharata, on whom the king conferred the kingdom, is living happily with his brother Śatrughna in the house of his maternal uncle.
2.62.2:
  dutt: Ayodhyā LXVIII
  text: (with 2.62.1)
2.62.3:
  dutt: Ayodhyā LXVIII
  text: Let envoys by means of fleet couriers speedily repair thither and bring those heroic brothers. What shall we decide?"
  modern: Let envoys go there quickly by fleet couriers and bring those heroic brothers. What shall we decide?"
2.62.9:
  dutt: Ayodhyā LXVIII
  text: Do ye, speedily taking silk apparel and excellent ornaments for king Bharata, set off."
  modern: Take silk garments and excellent ornaments for King Bharata, and set off quickly."
2.62.14:
  dutt: Ayodhyā LXVIII
  text: And with their vehicles fatigued, the ambassadors, on account of the great distance of the way, speedily reached that best of cities, Girivraja.
  modern: "With their vehicles worn out, the envoys, because of the great distance of the road, quickly reached that best of cities, Girivraja."
2.64.3:
  dutt: Ayodhyā LXX
  text: Then they addressed Bharata, saying,—’The priest and the counsellors have enquired after your welfare. Do you set out speedily. A business is on hand that brooketh no delay on your part.
  modern: Then they said to Bharata, "The priest and the counsellors have asked after your welfare. Set out quickly. A matter is at hand that brooks no delay on your part."
2.64.22:
  dutt: Ayodhyā LXX
  text: Then after speaking with his maternal grandfather and uncle, Yudhājit, Bharata ascending a car, set out with Satrughna. …
  modern: "Then, after speaking with his maternal grandfather and his uncle Yudhājit, Bharata mounted a chariot and set out with Śatrughna."
2.65.14:
  dutt: Ayodhyā LXXI
  text: … Having spent seven nights on the journey, that chief of men beheld Ayodhyā before him and thus addressed the charioteer, …
  modern: … After seven nights on the road, that chief of men saw Ayodhyā ahead and said to the charioteer, …
2.65.24:
  dutt: Ayodhyā LXXI
  text: O charioteer, I see around me all those signs which I had heard told as occurring on the occasion of the deaths of monarchs.
  modern: Charioteer, I see around me all those signs that I have heard are seen when kings die."
2.66.1:
  dutt: Ayodhyā LXXII
  text: Not having seen his father in his father’s quarters, Bharata went to his mother’s apartment for seeing her.
  modern: Not seeing his father in his father's quarters, Bharata went to his mother's apartment to see her.
2.66.2:
  dutt: Ayodhyā LXXII
  text: On seeing her son before her after his sojourn from home, Kaikeyi delighted, rose up from her golden seat. …
  modern: Seeing her son before her after his time away, Kaikeyī rose in delight from her golden seat.
2.66.2+1:
  dutt: Ayodhyā LXXII
  text: Then smelling the crown of his head and embracing him and taking that illustrious one on her lap, Kaikeyi addressed him, saying, …
  modern: Then she smelled the crown of his head, embraced him, took that illustrious one on her lap, and said to him, …
2.66.41:
  dutt: Ayodhyā LXXII
  text: O son, as soon as I heard of Rāma’s (coming) installation, I asked for the kingdom to be conferred on thee, and Rāma to be banished. …
  modern: My son, as soon as I heard of Rāma's coming installation, I asked your father for the kingdom to be given to you, and for Rāma to be banished.
2.66.43:
  dutt: Ayodhyā LXXII
  text: Not seeing his beloved son, the illustrious lord of earth, stricken by grief on his account, has breathed his last.
  modern: Not seeing his beloved son, the illustrious lord of the earth, stricken by grief for him, has breathed his last.
2.66.44:
  dutt: Ayodhyā LXXII
  text: Do thou now, O thou cognizant of duty, take charge of the kingdom.
  modern: Now, you who know duty, take charge of the kingdom.
2.66.44+1:
  dutt: Ayodhyā LXXII
  text: This city is subject to thee, as well as this peaceful kingdom.
  modern: This city is subject to you, and this peaceful kingdom as well.
2.67.1:
  dutt: Ayodhyā LXXIII
  text: Hearing of his father’s death and the exile of his brothers, Bharata burning in grief, said these words, "Deprived of my father as well as my brother like unto a father, what shall I bewailing them and undone by thee do with the kingdom?
  modern: Hearing of his father's death and his brothers' exile, Bharata, burning with grief, said, "Deprived of my father and of my brother who was like a father, what shall I do with the kingdom, mourning them and ruined by you?
2.67.2:
  dutt: Ayodhyā LXXIII
  text: (with 2.67.1)
2.67.4:
  dutt: Ayodhyā LXXIII
  text: Thou hast come like the fatal night for the destruction of this race. Not understanding it, my father embraced live coal.
  modern: You have come like the fatal night for the destruction of this race. My father embraced a live coal without understanding it.
2.67.4+1:
  dutt: Ayodhyā LXXIII
  text: O thou that hast thy gaze fixed on sin, it is through thee that my sovereign has come by death; … Having got thee, my illustrious sire intent upon truth, king Daçarātha, afflicted by extreme sorrow, has departed this life.
  modern: O you with your gaze fixed on sin, it is through you that my sovereign has died, … Having got you, my illustrious father, devoted to truth, King Daśaratha, afflicted by extreme sorrow, has departed this life.
2.67.6:
  dutt: Ayodhyā LXXIII
  text: Surely the noble and virtuous Rāma, well knowing his duties towards his superiors, regards thee as highly as he doth his own mother.
  modern: Surely the noble and virtuous Rāma, who knows his duties to his elders, regards you as highly as he does his own mother.
2.67.7:
  dutt: Ayodhyā LXXIII
  text: In the same way, my eldest mother, the far-sighted Kauçalyā, doing her duties by thee, bears herself like a sister.
  modern: In the same way my eldest mother, the far-sighted Kausalyā, doing her duties by you, treats you like a sister.
2.67.8:
  dutt: Ayodhyā LXXIII
  text: Why, O sinful one, having sent to the woods her magnanimous son, clad in bark, dost thou not grieve?
  modern: Why, sinful woman, do you not grieve for having sent her magnanimous son to the woods in bark clothes?
2.67.10:
  dutt: Ayodhyā LXXIII
  text: I deem that thou didst not know how very highly I regarded Rāghava; and therefore it is that thou hast brought this mighty calamity.
  modern: I think you did not know how highly I regarded Rāghava, and so you brought about this great calamity.
2.67.11:
  dutt: Ayodhyā LXXIII
  text: Not seeing those chiefs of men, Rāma and Lakshmana, by virtue of whose energy can I venture to rule the kingdom?
  modern: Not seeing those chiefs of men, Rāma and Lakṣmaṇa, by whose energy could I dare to rule the kingdom?
2.67.14:
  dutt: Ayodhyā LXXIII
  text: And even if this strength be mine through yoga or vigor of intellect, I will not crown with success the hopes of thee, proud of thy son.
  modern: And even if I had this strength through yoga or the force of intellect, I would not fulfill the hopes of you, who are so proud of your son.
2.67.14+1:
  dutt: Ayodhyā LXXIII
  text: Nor, had Rāma not always regarded thee as his mother, would I hesitate to renounce thee, whose heart hath been set on sin.
  modern: And if Rāma had not always regarded you as his mother, I would not hesitate to renounce you, whose heart is set on sin.
2.68.2:
  dutt: Ayodhyā LXXIV
  text: … "Do thou bear thyself from this kingdom, O heartless and wicked Kaikeyi. Having been lost to righteousness, do not thou lament me dead.
  modern: '"Leave this kingdom, heartless and wicked Kaikeyī. Since righteousness has abandoned you, do not weep for me as dead.'
2.68.3:
  dutt: Ayodhyā LXXIV
  text: What qualities of thine were taxed by the king or the exceedingly virtuous Rāma, that both of them simultaneously have come by death and exile respectively through thy agency?
  modern: What fault of yours did the king or the very virtuous Rāma find, that both have come to death and exile through you?
2.68.7:
  dutt: Ayodhyā LXXIV
  text: O thou enemy of mine in the guise of a mother! O fell one! O thou that covetest the kingdom! do thou not speak to me, O wicked wretch!
  modern: You enemy of mine in the guise of a mother! You fell woman! You who covet the kingdom! Do not speak to me, wicked wretch!
2.68.13:
  dutt: Ayodhyā LXXIV
  text: Dost thou not, O tortuous one, know that that one sprung from Kauçalyā’s, self, my eldest brother Rāma, who is like a father unto me, has ever been the refuge of his friends?
  modern: Do you not know, O crooked one, that my eldest brother Rāma, who sprang from Kausalyā's own self and is like a father to me, has always been the refuge of his friends?
2.68.13+1:
  dutt: Ayodhyā LXXIV
  text: 'Do thou enter fire, or dive into Dandaka, or wound a cord round thy neck: other desirable way there is none for thee.'
  modern: 'Enter fire, or go into Daṇḍaka, or tie a cord round your neck: there is no other way for you."'
2.70.1:
  dutt: Ayodhyā LXXVI
  text: As Bharata, the son of Kaikeyi was thus burning in grief, that foremost of those skilled in speech, the saint Vasishtha, endowed with excellence of language, said, …
  modern: As Bharata, Kaikeyī's son, was burning with grief, the sage Vasiṣṭha, best of speakers and a master of language, said, …
2.70.2:
  dutt: Ayodhyā LXXVI
  text: … "Do not weep, good betide thee, O illustrious prince. Do thou perform the funereal rites of the departed king."
  modern: '"Do not weep, bless you, illustrious prince. Perform the funeral rites of the departed king."'
2.70.3:
  dutt: Ayodhyā LXXVI
  text: Hearing Vasishtha’s words, Bharata cognisant of duty, bowed down to the ground and despatched the ministers for performing the last rites. …
  modern: Hearing Vasiṣṭha's words, Bharata, who knew his duty, bowed to the ground and sent the ministers to perform the last rites. …
2.73.3:
  dutt: Ayodhyā LXXIX
  text: Do thou, therefore, O illustrious prince, become our king. Having been permitted by the king, thou wilt commit no fault (by doing so), as this kingdom is without a master.
  modern: '"Therefore, illustrious prince, become our king. With the king''s permission you will commit no fault, since this kingdom has no master.'
2.73.6:
  dutt: Ayodhyā LXXIX
  text: Thereupon, having gone round all the things procured for the sprinkling Bharata firm in his vows addressed those persons, saying, …
  modern: Then, after walking around all the things gathered for the anointing, Bharata, firm in his vows, said to all those people, …
2.73.8:
  dutt: Ayodhyā LXXIX
  text: Certainly Rāma our eldest brother shall become the king; and I will abide in the forest for five and nine years.
  modern: Surely Rāma, our eldest brother, shall be king, and I will live in the forest for five and nine years.
2.76.19:
  dutt: Ayodhyā LXXXII
  text: Having said this, the virtuous Bharata attached unto his brother spoke to Sumantra skilled in counsel, who was by, saying, …
  modern: 'Having said this, the virtuous Bharata, devoted to his brother, said to Sumantra, skilled in counsel, who stood near him: …'
2.76.20:
  dutt: Ayodhyā LXXXII
  text: '"Up, and go, O Sumantra, at my command. Do thou make known this journey and bring the forces."'
  modern: '"Get up and go, Sumantra, at my command. Announce the journey and bring the army."'
2.76.25:
  dutt: Ayodhyā LXXXII
  text: Seeing those forces marshalled, Bharata staying near his preceptor, said unto Sumantra who was at his side, "Do thou speedily bring my car."
  modern: Seeing the army drawn up, Bharata, standing near his preceptor, said to Sumantra at his side, "Bring my chariot quickly."
2.77.1:
  dutt: Ayodhyā LXXXIII
  text: Rising with the morrow, Bharata anxious to behold Rāma, speedily set out ascending an excellent car.
  modern: Rising on the next morning, Bharata, eager to see Rāma, quickly set out in an excellent car.
2.77.2:
  dutt: Ayodhyā LXXXIII
  text: Before him went the councellors and priests, ascending cars resembling that of the Sun yoked with steeds.
  modern: The counsellors and priests went before him in cars like the sun's, yoked with horses.
2.77.6:
  dutt: Ayodhyā LXXXIII
  text: And Kaikeyi and Sumitrā and the highly famous Kauçalyā rejoicing at the prospect of the bringing of Rāma, went in an effulgent car.
  modern: And Kaikeyī, Sumitrā, and the famous Kausalyā, rejoicing at the prospect of bringing Rāma back, went in a shining car.
2.90.2:
  dutt: Ayodhyā LXXXXVI
  text: And at this time mad leaders of elephant-herds accompanied by the latter, scared by the terrible tumult, scudded on all sides.
  modern: At this time rutting leaders of elephant herds, with their herds, scared by the terrible tumult, ran in all directions.
2.90.4:
  dutt: Ayodhyā LXXXXVI
  text: … And having seen them running away and heard that hubbub, Rāma spoke unto Sumitrā’s son, Lakshmana of flaming energy, …
  modern: Seeing them run away and hearing that uproar, Rāma said to Sumitrā's son Lakṣmaṇa, of blazing energy, …
2.90.5:
  dutt: Ayodhyā LXXXXVI
  text: '"Ha! Lakshmana, in whom Sumitrā has been blest with a worthy son, hark! A tremendous and dreadful uproar resembling the rumbling of clouds is being heard; …'
  modern: '"Look, Lakṣmaṇa, you in whom Sumitrā has a worthy son! Listen! A tremendous, dreadful uproar like the rumbling of clouds can be heard. …'
2.90.9:
  dutt: Ayodhyā LXXXXVI
  text: Thereupon, Lakshmana communicated unto Rāma tidings concerning that army filled with elephants and steeds, and decked with cars and streamers; and spoke unto Rāma, saying, …
  modern: Then Lakṣmaṇa told Rāma about that army, full of elephants and horses and decked with chariots and banners, and said to him, …
2.90.10:
  dutt: Ayodhyā LXXXXVI
  text: … "O noble one, do you put out the fire; and let Sitā go into the cave. And do you string your bow and make ready the arrows and don on your mail."
  modern: '"Noble one, put out the fire, and let Sītā go into the cave. String your bow, make the arrows ready and put on your armor."'
2.90.13:
  dutt: Ayodhyā LXXXXVI
  text: … "Having got himself installed, Kaikeyi’s son, Bharata, anxious to render his royalty perfectly safe, is coming hither for the purpose of slaying us both.
  modern: '"Kaikeyī''s son Bharata has had himself installed, and now, to make his kingship safe, he is coming here to kill us both.'
2.90.18:
  dutt: Ayodhyā LXXXXVI
  text: O hero, we have met with that foe of ours for whom, O Rāghava, you, Sitā and myself have (experienced such misery), for whom, O Rāghava, you have been cast off from the entire kingdom. Surely, Bharata should be slain by me.
  modern: O hero, we have met that enemy of ours because of whom, O Rāghava, you, Sītā, and I have suffered such misery, and because of whom you were cast out of the whole kingdom. Surely Bharata should be killed by me.
2.91.1:
  dutt: Ayodhyā LXXXXVII
  text: Pacifying Sumitrā’s son, Lakshmana, transported with rage and eager for encounter, Rāma addressed him, saying, …
  modern: Calming Sumitrā's son Lakṣmaṇa, who was beside himself with rage and eager to fight, Rāma said to him, …
2.91.2:
  dutt: Ayodhyā LXXXXVII
  text: … "When the mighty Bharata possessed of high spirits has himself come here, what is the use of the bow or the sword or the shield? Having promised to maintain my father’s truth, what, O Lakshmana, shall I, having slain Bharata in battle, do with the kingdom with a stain attached unto it?
  modern: '"When the mighty, high-spirited Bharata has come here himself, what use is a bow, or a sword and shield? I have promised to keep my father''s word. If I kill Bharata in battle, Lakṣmaṇa, what would I do with a kingdom stained like that?'
2.91.2+1:
  dutt: Ayodhyā LXXXXVII
  text: (with 2.91.2)
2.91.2+2:
  dutt: Ayodhyā LXXXXVII
  text: That thing which falls to my lot on the destruction of friends and adherents I never accept, even like food mixed with poison.
  modern: What falls to my lot through the destruction of friends and adherents I will never accept, like food mixed with poison.
2.91.2+3:
  dutt: Ayodhyā LXXXXVII
  text: I swear unto thee, I wish for the (possession of) righteousness, interest, desire and the earth, in your interests alone, O Lakshmana.
  modern: I swear to you that I wish for righteousness, wealth, desire, and the earth for your sake alone, Lakṣmaṇa.
2.91.2+4:
  dutt: Ayodhyā LXXXXVII
  text: O Lakshmana, I swear by my weapon that it is for the maintenance and happiness of my brothers that I wish for the kingdom.
  modern: Lakṣmaṇa, I swear by my weapon that I wish for the kingdom for the maintenance and happiness of my brothers.
2.91.2+5:
  dutt: Ayodhyā LXXXXVII
  text: I think Bharata attached unto his brothers had come to Ayodhyā; and then, allowing the morality regulating the race, that one dearer unto me than life, hearing of me banished, bearing matted locks-and bark, together with Jānaki, O hero, and thyself, thou foremost of men, has, with his heart surcharged with reflection, and his senses overwhelmed by grief, come hither for seeing us.
  modern: I think Bharata, attached to his brothers, came to Ayodhyā, and, keeping the code of the family, he, who is dearer to me than life, heard that I was banished and was living in matted locks and bark with Jānakī and you, foremost of men. His heart weighed down with thought and his senses overwhelmed with grief, he has come here to see us.
2.91.2+6:
  dutt: Ayodhyā LXXXXVII
  text: (with 2.91.2+5)
2.91.2+7:
  dutt: Ayodhyā LXXXXVII
  text: He cannot have come on any other account, And having got wroth with Kaikeyi, and given her rough speech, that auspicious one, having gratified my sire, has come hither to make the kingdom over unto me.
  modern: He cannot have come for any other reason. He got angry with Kaikeyī and spoke roughly to her, and having pleased my father, that good man has come here to give the kingdom to me.
2.91.3:
  dutt: Ayodhyā LXXXXVII
  text: And the season being fit, meet it is that Bharata should see us. He does not even in thought act against us.
  modern: And since it is the right season, it is fitting that Bharata should see us. He would not act against us even in thought.
2.91.5:
  dutt: Ayodhyā LXXXXVII
  text: Certainly thou ought not to say cruel or unpleasant words in relation to Bharata,—if wrong be done unto Bharata, I shall consider myself as wronged.
  modern: You should certainly not say cruel or unpleasant words about Bharata. If wrong is done to Bharata, I shall consider myself wronged.
2.91.6:
  dutt: Ayodhyā LXXXXVII
  text: Do sons, in times of peril, ever slay their father, or brothers their brother like unto their life, O son of Sumitrā?
  modern: Do sons in times of peril ever kill their father, or brothers a brother who is dear as life, son of Sumitrā?
2.91.7:
  dutt: Ayodhyā LXXXXVII
  text: If thou speakest thus for the sake of the monarchy, on seeing Bharata, I will say unto him, ’Make over the kingdom unto this one.’
  modern: If you speak thus for the sake of the kingdom, then on seeing Bharata I will say to him, 'Give the kingdom to this one.'
2.91.14:
  dutt: Ayodhyā LXXXXVII
  text: Descending from the top of the sāla tree, that conqueror in battles, Lakshmana, stood by Rāma with joined hands.
  modern: Coming down from the top of the sāla tree, Lakṣmaṇa, conqueror in battles, stood beside Rāma with folded hands.
2.93.4:
  dutt: Ayodhyā LXXXXIX
  text: And as Bharata passed on, he observed a neat cottage of leaves stationed among the asylums of anchorets, furnished with a portion having a wall with a door. …
  modern: As Bharata went on, he saw a neat cottage of leaves among the hermits' dwellings, with a walled part that had a door.
2.93.27:
  dutt: Ayodhyā LXXXXIX
  text: … And he saw Rāma seated like unto a flame—with leonine shoulders, mighty arms, and eyes resembling lotuses—the righteous lord of this world bounded by the seas—saw the mighty-armed one like unto the eternal Brahmā, seated on a skin-seat on the ground along with Sitā and Lakshmana.
  modern: … He saw Rāma seated like a flame, with lion's shoulders, mighty arms, and lotus eyes, the righteous lord of this sea-bound world, like the eternal Brahmā, seated on a skin seat on the ground with Sītā and Lakṣmaṇa.
2.93.28:
  dutt: Ayodhyā LXXXXIX
  text: And seeing him, overwhelmed with grief and affliction, the righteous and graceful son of Kaikeyi, Bharata, rushed (towards him). …
  modern: Seeing him, the righteous and graceful Bharata, Kaikeyī's son, overwhelmed with grief and distress, ran toward him.
2.93.36:
  dutt: Ayodhyā LXXXXIX
  text: Thus lamenting in woful guise, with the lotus of his countenance covered with sweat, Bharata coming at Rāma’s feet, fell at them bewailing. …
  modern: "Lamenting so miserably, the lotus of his face covered with sweat, Bharata came to Rāma's feet and fell at them, weeping."
2.93.38:
  dutt: Ayodhyā LXXXXIX
  text: And beholding the illustrious Rāma, Bharata with his utterance choked with emotion, exclaimed, "O noble one," and was unable to say anything further.
  modern: Seeing the illustrious Rāma, Bharata, his voice choked with emotion, cried "O noble one," and could say no more.
2.93.39:
  dutt: Ayodhyā LXXXXIX
  text: Then Satrughna also weeping paid homage unto the feet of Rāma. And shedding tears, Rāma embraced them both.
  modern: Then Śatrughna too, weeping, paid homage at Rāma's feet. And Rāma, shedding tears, embraced them both.
2.94.1:
  dutt: Ayodhyā C
  text: … And smelling the crown of his head, and embracing that descendant of Raghu, Rāma took Bharata on his lap and asked him affectionately, …
  modern: … Smelling the crown of his head and embracing the descendant of Raghu, Rāma took Bharata on his lap and asked him affectionately, …
2.94.1+1:
  dutt: Ayodhyā C
  text: Is the king alive, my child, seeing that thou hast come hither; or, afficted with grief, hath he suddenly gone to the other world?
  modern: Is the king alive, child, since you have come here, or, afflicted with grief, has he suddenly gone to the other world?
2.95.1:
  dutt: Ayodhyā CII
  text: Hearing Rāma’s words, Bharata answered, "Deprived of the kingdom in consequence of my posteriority in point of birth, what doth regard for morality avail me?
  modern: Hearing Rāma's words, Bharata answered, "What does regard for morality avail me, deprived of the kingdom because I was born later?
2.95.2:
  dutt: Ayodhyā CII
  text: O best of men, even this morality has ever been established with reference to us, viz., that the eldest son of the king existing, a younger one cannot be the king.
  modern: 'O best of men, this is the rule that has always held among us: while the eldest son of the king lives, a younger one cannot be king.'
2.95.3:
  dutt: Ayodhyā CII
  text: Do thou, therefore, O Rāghava go along with me to the prosperous Ayodhyā; and get thyself installed there for the behoof of our race.
  modern: So, Rāghava, go with me to prosperous Ayodhyā and be installed there for the good of our race.
2.95.3+1:
  dutt: Ayodhyā CII
  text: As soon as thou hadst set out (for the forest) along with Sitā and Lakshmana, the king borne down by grief and chagrin, went to heaven.
  modern: As soon as you had set out for the forest with Sītā and Lakṣmaṇa, the king, borne down by grief and distress, went to heaven.
2.95.6:
  dutt: Ayodhyā CII
  text: O foremost of men, do thou arise, and offer water unto the spirit of our sire. Satrughna and I have ere this offered water unto (the departed).
  modern: O foremost of men, rise and offer water to the spirit of our father. Śatrughna and I have already offered water to the departed.
2.95.8:
  dutt: Ayodhyā CIII
  text: Hearing those piteous words uttered by Bharata in connection with the demise of their father, Rāghava was deprived of his senses. …
  modern: Hearing these piteous words from Bharata about their father's death, Rāghava lost his senses. …
2.95.18:
  dutt: Ayodhyā CIII
  text: Having thus addressed Bharata, Rāghava burning in grief, spoke unto his wife, with her countenance resembling the full moon, saying, …
  modern: Having said this to Bharata, Rāghava, burning with grief, went to his wife, whose face was like the full moon, and said, …
2.95.24:
  dutt: Ayodhyā CIII
  text: Then that magnanimous one, having a knowledge of the soul, mild, graceful, capable of controlling his senses, steady in his regard for Rāma, and ever following him—Sumantra—in company with those sons of the king, having cheered up Rāghava, brought him to the auspicious river, Mandākini.
  modern: Then that high-minded Sumantra, who knew the soul, mild, graceful, in control of his senses, steady in his regard for Rāma and always following him, together with the king's sons, cheered Rāghava up and brought him to the auspicious river Mandākinī.
2.95.27:
  dutt: Ayodhyā CIII
  text: And the protector of the earth (Rāma), holding water with his joined hands, facing the south, said weeping, …
  modern: Holding water in his joined hands, the protector of the earth faced the south and said, weeping, …
2.95.29:
  dutt: Ayodhyā CIII
  text: Then drawing nigh unto the marge of the Mandākini, the energetic Rāghava along with his brothers, offered the Pinda unto his father.
  modern: Then, drawing near the bank of the Mandākinī, the energetic Rāghava and his brothers offered the piṇḍa to their father.
2.95.30:
  dutt: Ayodhyā CIII
  text: And placing the Ingudi Pinda mixed with juyube on a bed of darbha Rāma crying in distress, said, "O mighty monarch, do thou well pleased feed on this, which we also live upon.
  modern: Placing the piṇḍa of iṅgudī mixed with jujube on a bed of darbha grass, Rāma said, weeping in distress, "O mighty king, eat this gladly; it is what we also live on.
2.95.31:
  dutt: Ayodhyā CIII
  text: That which is the fare of an individual, is also the fare of his divinities."
  modern: What an individual eats is also what his gods eat."
2.95.33:
  dutt: Ayodhyā CIII
  text: And having arrived at the gate of the cottage of leaves, that lord of the earth held both Bharata and Lakshmana with his hands.
  modern: Arriving at the door of the leaf cottage, the lord of the earth took both Bharata and Lakṣmaṇa by the hands.
2.95.38:
  dutt: Ayodhyā CIII
  text: And eager to behold Rāma staying away for a short time, though seeming to do so for a long period, all the men at once went to the hermitage. …
  modern: Eager to see Rāma, who had been away only a short time though it seemed long, all the men went to the hermitage at once. …
2.96.1:
  dutt: Ayodhyā CIV
  text: Desirous of seeing Rāma, Vasishtha, taking before him the wives of Daçarātha, proceeded towards the hermitage.
  modern: Vasiṣṭha, eager to see Rāma, put the wives of Daśaratha before him and went toward the hermitage.
2.96.15:
  dutt: Ayodhyā CIV
  text: Raising his mothers, that foremost of men, Rāma, true to his promise, took hold of those lotus feet of theirs.
  modern: Raising his mothers, Rāma, the foremost of men, true to his promise, took hold of their lotus feet.
2.96.17:
  dutt: Ayodhyā CIV
  text: After Rāma had done, Sumitrā’s son also, seeing all his mothers, with sorrow gently paid his reverence unto them with affection.
  modern: After Rāma, Sumitrā's son too, seeing all his mothers, gently paid reverence to them with affection, sorrowful.
2.96.19:
  dutt: Ayodhyā CIV
  text: Sitā also with her eyes filled with tears, having taken hold of the feet of her mothers-in-law, stood before them in distressful guise.
  modern: Sītā too, her eyes full of tears, took hold of the feet of her mothers-in-law and stood before them in a distressed state.
2.97.1:
  dutt: Ayodhyā CI
  text: Knowing Bharata as devoted to his superior Rāma along with his brother Lakshmana, asked him, …
  modern: Rāma, with his brother Lakṣmaṇa, began to question Bharata, who was devoted to his elders, …
2.97.3:
  dutt: Ayodhyā CI
  text: I wish to hear as clearly related by thee the reason why clad in black deerskin and wearing matted locks, thou, leaving thy kingdom, hast come to these regions. It behoveth thee to tell me all this."
  modern: I want to hear clearly from you why you have left your kingdom and come to these regions, dressed in black deerskin and wearing matted locks. Tell me all this."
2.97.4:
  dutt: Ayodhyā CI
  text: Thus accosted by the high-souled Kākutstha, Kaikeyi’s son, suppressing his grief by a strong effort, with joined hands said, …
  modern: Thus addressed by the high-souled Kākutstha, Kaikeyī's son, holding back his grief with a great effort, said with folded hands, …
2.97.8:
  dutt: Ayodhyā CI
  text: Now it behoves thee to extend thy favor unto me who have become thy slave. Do thou this very day get thyself installed in the kingdom, like unto Indra himself.
  modern: Now you should show your favor to me, who have become your slave. Have yourself installed in the kingdom this very day, like Indra himself.
2.98.4:
  dutt: Ayodhyā CV
  text: … "My mother was (first) pacified (by grant of the kingdom.) The kingdom is (now) mine. I grant the same unto thee. Do thou enjoy the kingdom rid of its thorns.
  modern: '"My mother has been satisfied by the grant of the kingdom. The kingdom is now mine, and I give it to you. Enjoy the kingdom free of its thorns.'
2.98.55:
  dutt: Ayodhyā CVI
  text: Do thou rescue all these— Kaikeyi, myself, my father, our friends and adherents, and the whole body of the citizens as well as the inhabitants of the provinces.
  modern: "Rescue all these: Kaikeyī, myself, my father, our friends and adherents, and all the citizens and the people of the provinces."
2.98.64:
  dutt: Ayodhyā CVI
  text: Having freed thyself from thy threefold debts, do thou govern me, repressing thy foes, and propitiating thy friends with every gratification.
  modern: Having freed yourself from your three debts, govern me, keep your foes in check, and please your friends with every gratification.
2.98.66:
  dutt: Ayodhyā CVI
  text: O foremost of men, wiping out the disgrace of my mother, do thou emancipate our sire from sin.
  modern: O foremost of men, wipe out the disgrace of my mother and free our father from sin.
2.98.67:
  dutt: Ayodhyā CVI
  text: I beseech thee with bent head. Be thou merciful unto me, unto all our friends, and, O great lord, unto all creatures in general.
  modern: I beg you with bowed head. Be merciful to me, to all our friends, and, great lord, to all creatures.
2.98.68:
  dutt: Ayodhyā CVI
  text: But, if disregarding my solicitations, thou wend from here to the forest, I shall go along with thee."
  modern: But if you disregard my entreaties and leave here for the forest, I shall go with you."
2.99.1:
  dutt: Ayodhyā CVII
  text: As Bharata was again speaking in this strain, his graceful elder brother, having been highly honored, answered Bharata in the midst of his relatives, saying, …
  modern: As Bharata spoke in this way again, his graceful elder brother, highly honored in the midst of his relatives, answered him, …
2.99.5:
  dutt: Ayodhyā CVII
  text: … Having been thus promised, that virtuous lady, thy illustrious mother, O foremost of men, asked for two boons (of the king),—viz., thy enthronement, O best of men, and my banishment Thus besought by her, the king conferred on her the boon.
  modern: 'After securing that promise, your illustrious mother, O best of men, asked the king for two boons: your enthronement, best of men, and my banishment. Asked by her, the king granted her the boon.'
2.99.6:
  dutt: Ayodhyā CVII
  text: (with 2.99.5)
2.99.7:
  dutt: Ayodhyā CVII
  text: And, thou foremost of men, I have been enjoined by my sire to stay in the woods for fourteen years, in consequence of his having granted her the boon.
  modern: And, O foremost of men, my father ordered me to stay in the woods for fourteen years, because he had granted her the boon.
2.99.9:
  dutt: Ayodhyā CVII
  text: Thou too, thou foremost of kings, shouldst in the same way speedily render our father truthful, by getting thyself installed.
  modern: You too, foremost of kings, should likewise make our father truthful at once, by letting yourself be installed.
2.99.10:
  dutt: Ayodhyā CVII
  text: O Bharata, for my sake, do thou free that lord, the king, from his debts. Do thou, O thou cognizant of morality, deliver our father and gladden thy mother.
  modern: For my sake, Bharata, free that lord, the king, from his debts. You who know morality, deliver our father and gladden your mother.
2.99.16:
  dutt: Ayodhyā CVII
  text: I also, O hero, without delay shall have to enter the forest of Dandaka in company with Lakshmana and Sitā.
  modern: I too, hero, shall have to enter the forest of Daṇḍaka without delay, with Lakṣmaṇa and Sītā.
2.100.1:
  dutt: Ayodhyā CVIII
  text: As Rāma cognizant of righteousness was thus encouraging Bharata, Javali—best of Brāhmanas—addressed him in words divorced from morality, saying, "O Rāghava, endowed with a noble understanding and leading a life of asceticism, do not suffer thy intellect to entertain inanities, like any low person.
  modern: 'As Rāma, who knew righteousness, was thus encouraging Bharata, Jābāli, the best of Brāhmaṇas, spoke to him words that were divorced from morality: "O Rāghava, of noble understanding and living the life of an ascetic, do not let your mind entertain empty ideas, like a low person.'
2.100.2:
  dutt: Ayodhyā CVIII
  text: (with 2.100.1)
2.100.7:
  dutt: Ayodhyā CVIII
  text: Therefore, O best of men, leaving thy ancestral kingdom, thou ought not to abide in the disagreeable forest filled with dangers and difficulties.
  modern: So, best of men, leaving your ancestral kingdom, you should not live in the unpleasant forest, full of dangers and difficulties.
2.101.1:
  dutt: Ayodhyā CIX
  text: Hearing Javali’s words, Rāma having truth for prowess, by help of an exceedingly subtle intellect uninfluenced (under the exhortations of that sage), said, …
  modern: Hearing Jābāli's words, Rāma, whose prowess was truth, with an exceedingly subtle intellect unmoved by the sage's urging, said, …
2.101.2:
  dutt: Ayodhyā CIX
  text: … "What thou, wishing for my welfare, hast dwelt upon, though wearing the guise of a good action, is really not such; and though appearing to be beneficent, is really calculaled to entail misery.
  modern: … "What you have urged, wishing for my good, looks like a right action but is not; and though it seems beneficial, it would in truth bring misery.
2.101.10:
  dutt: Ayodhyā CIX
  text: This eternal regal morality founded in kindness towards the subjects, is verily true. Hence a kingdom is essentially based upon truth; and this world itself is established in truth.
  modern: This eternal royal duty, founded on kindness toward the subjects, is truth itself. So a kingdom rests on truth, and this world itself is established in truth.
2.101.16:
  dutt: Ayodhyā CIX
  text: Why should I not then obey the mandate of my father? My father was of truthful promise and of righteous ways; and with the object of observing his promise, he laid on me this (for faithful performance).
  modern: Why then should I not obey my father's command? My father kept his promises and walked in righteousness, and to keep his promise he laid this duty on me.
2.102.1:
  dutt: Ayodhyā CX
  text: Knowing that Rāma was wroth, Vasishtha said, "Jāvāli knoweth the departure of creatures to the next world and their return thence. Anxious of making thee turn back, he had spoken thus.
  modern: Knowing that Rāma was angry, Vasiṣṭha said, "Jābāli knows how creatures go to the next world and come back from it. He spoke as he did because he wanted to make you turn back.
2.102.30:
  dutt: Ayodhyā CX
  text: Among the Ikshwākus, the first born becomes the sovereign. The first born existing, an inferior son cannot be installed in the kingdom.
  modern: Among the Ikṣvākus, the first-born becomes king. While the first-born lives, a younger son cannot be installed in the kingdom.
2.103.2:
  dutt: Ayodhyā CXI
  text: … "Unto a man born there are three superiors, viz, the preceptor, O Kākutstha, and father and mother, O Rāghava.
  modern: '… "A man has three superiors from his birth, Kākutstha: his preceptor, and his father and mother, Rāghava.'
2.103.3:
  dutt: Ayodhyā CXI
  text: O foremost of men, the father begets a person, the preceptor imparts wisdom and therefore is he called a superior.
  modern: Best of men, the father begets a man and the preceptor gives him wisdom; that is why the preceptor is called a superior.
2.103.8:
  dutt: Ayodhyā CXI
  text: Thus sweetly addressed by his preceptor personally, that foremost of men, Rāghava, replied unto Vasishtha, seated with him, saying, "What his father and mother always do in behalf of their son, and what they effect by way of provision and sleep and clothing and constant swest speech, and sport, is difficult of being repaid.
  modern: Thus sweetly addressed by his preceptor in person, Rāghava replied to Vasiṣṭha, who was seated with him, "What a father and mother always do for their son, what they provide by way of food, sleep, clothing, constant sweet speech, and play, is hard to repay.
2.103.9:
  dutt: Ayodhyā CXI
  text: (with 2.103.8)
2.103.10:
  dutt: Ayodhyā CXI
  text: (with 2.103.8)
2.103.11:
  dutt: Ayodhyā CXI
  text: Therefore, what my father, king Daçarātha hath commanded me to do, must not be falsified."
  modern: So what my father, King Daśaratha, has commanded me to do must not be made false."
2.103.12:
  dutt: Ayodhyā CXI
  text: Rāma having said this, the broad-breasted Bharata, extremely depressed spoke unto the charioteer who was by, saying, "O charioteer, do thou speedily spread Kuça on the ground here.
  modern: When Rāma had said this, the broad-chested Bharata, very depressed, said to the charioteer who stood by, "Charioteer, quickly spread kuśa grass on the ground here.
2.103.13:
  dutt: Ayodhyā CXI
  text: I will remain near the noble one until he be kindly disposed (towards me). …
  modern: I will stay near the noble one until he is kindly disposed toward me.
2.103.16:
  dutt: Ayodhyā CXI
  text: To him spoke that foremost of Rājarshis, the highly energetic Rāma, "O Bharata, my dear brother, what have I done that thou hast down by me?
  modern: To him spoke Rāma, the highly energetic foremost of royal sages, "O Bharata, my dear brother, what have I done that you lie down in front of me?
2.103.17:
  dutt: Ayodhyā CXI
  text: It is a Brāhmana who alone can obstruct a person by lying down beside him; but there is no rule by which a member of the military class can lie down (in this wise).
  modern: Only a Brāhmaṇa can obstruct a person by lying down beside him; there is no rule by which a member of the warrior class can lie down in this way.
2.103.18:
  dutt: Ayodhyā CXI
  text: O best of men, arise, renouncing this difficult vow; and, O descendant of Raghu, do thou from hence take thyself unto that best of cities, Ayodhyā."
  modern: O best of men, rise and give up this hard vow; and, descendant of Raghu, go from here to that best of cities, Ayodhyā."
2.104.18:
  dutt: Ayodhyā CXII
  text: Even if beauty forsaketh the moon, or Himavat his snow, or the ocean overleaps its shores, I shall not forsake the promise of my sire.
  modern: Even if beauty should forsake the moon, or the Himālaya his snow, or the ocean overleap its shores, I shall not forsake my father's promise.
2.104.19:
  dutt: Ayodhyā CXII
  text: And, my brother, thou ought not to cherish in thy mind what thy mother incited by covetuousness or affection for thee hath done; and thou should act by her as one should by one’s mother," When Rāma resembling the sun in energy and like the moon of Pratipat in appearance, had said this, Bharata said unto the son of Kauçalyā, …
  modern: "\"And my brother, you should not dwell on what your mother has done, moved by greed or by love for you. Treat her as one should treat one's mother.\" When Rāma, like the sun in energy and like the moon of the first lunar day in appearance, had said this, Bharata said to Kausalyā's son, …"
2.104.20:
  dutt: Ayodhyā CXII
  text: (with 2.104.19)
2.104.21:
  dutt: Ayodhyā CXII
  text: … "O noble one, do thou take off thy feet thy sandals adorned with gold. These shall protect what the people have got and secure unto thee what they lack."
  modern: '"Noble one, take off your sandals adorned with gold. They will protect what the people have and secure for you what they lack."'
2.104.22:
  dutt: Ayodhyā CXII
  text: Thereupon taking off his sandals, that highly energetic one gave them to the magnanimous Bharata.
  modern: Then that highly energetic man took off his sandals and gave them to the high-souled Bharata.
2.104.22+1:
  dutt: Ayodhyā CXII
  text: Bharata, bowing down unto the sandals, said, "O hero, for four and ten years shall I, wearing matted locks and bark, and subsisting upon fruits and roots, O scion of the Raghu race, expecting thy arrival, remain outside the city, having, O subduer of foes, made over the task of government unto thy sandals.
  modern: Bharata, bowing to the sandals, said, "O hero, for four and ten years I shall wear matted locks and bark, live on fruits and roots, and remain outside the city, O scion of the Raghus, expecting your return, having made over the work of government to your sandals, O subduer of foes.
2.104.22+2:
  dutt: Ayodhyā CXII
  text: (with 2.104.22+1)
2.104.22+3:
  dutt: Ayodhyā CXII
  text: (with 2.104.22+1)
2.104.22+4:
  dutt: Ayodhyā CXII
  text: Both Janaki and I conjure thee to do this, O descendant of Raghu."
  modern: Both Jānakī and I implore you to do this, O descendant of Raghu."
2.106.1:
  dutt: Ayodhyā CXIV
  text: Arriving by means of a car emitting a low and solemn sound, that lord, the highly famous Bharata speedily entered Ayodhyā, …
  modern: In a chariot that made a low, solemn sound, the lord Bharata, of great fame, quickly entered Ayodhyā, …
2.107.1:
  dutt: Ayodhyā CXV
  text: Having placed his mothers in Ayodhyā, Bharata steady in his vow, kindling in grief, said unto his preceptors, …
  modern: Having settled his mothers in Ayodhyā, Bharata, firm in his vow and burning with grief, said to his preceptors, …
2.107.22:
  dutt: Ayodhyā CXV
  text: And the graceful Bharata, having installed the sandals of the noble one, always carried on the government in subordination to them.
  modern: And the graceful Bharata, having installed the noble one's sandals, always carried on the government in subordination to them.
2.107.22+1:
  dutt: Ayodhyā CXV
  text: (with 2.107.22)
2.108.1:
  dutt: Ayodhyā CXVI
  text: On Bharata having returned, while Rāma was dwelling in the woods, he noticed affright among the ascetics, added to a desire to remove to another place. …
  modern: While Rāma was living in the woods after Bharata had returned, he noticed alarm among the ascetics and a wish to move to another place. …
2.109.1:
  dutt: Ayodhyā CXVII
  text: '"When the ascetics had gone away, Rāghava reflected (as to his stay at that place); and from diverse reasons, he did not relish remaining there any further.'
  modern: When the ascetics had gone away, Rāghava thought about staying at that place, and for various reasons he did not like remaining there any longer.
2.109.2:
  dutt: Ayodhyā CXVII
  text: '"Here have I seen Bharata and my mother in company with the citizens. Overwhelmed with grief on my account, they ever recur to my memory.'
  modern: '"Here I have seen Bharata and my mother with the citizens. Overwhelmed with grief on my account, they come back to my memory again and again.'
2.109.4:
  dutt: Ayodhyā CXVII
  text: Therefore will I go to another quarter." Having settled this in his mind, Rāghava departed along with Videha’s daughter and Lakshmana.
  modern: So I shall go to another quarter." Having settled this in his mind, Rāghava departed with Videha's daughter and Lakṣmaṇa.
2.109.5:
  dutt: Ayodhyā CXVII
  text: And having arrived at Atri’s asylum, that renowned one paid obeisance (unto the sage); and the reverend Atri also on his part received Rāma as a son. …
  modern: Reaching Atri's hermitage, that famous one bowed to the sage, and the revered Atri received Rāma as a son.
2.109.17:
  dutt: Ayodhyā CXVII
  text: Thereupon Sitā, announcing her name, saluted the pious and chaste Anasuyā, old, with slackened joints, with folds all over her skin, and her hair hoary from age, whose frame shook perpetually, like a plantain-leaf in the wind.
  modern: Then Sītā, announcing her name, saluted the pious and chaste Anasūyā, who was old, with slackened joints, her skin wrinkled all over and her hair white with age, her frame shaking all the time, like a plantain leaf in the wind.
2.111.14:
  dutt: Ayodhyā CXVIII
  text: Then Mithilā’s daughter, Sitā, related unto Rāma all about her having been affectionately presented by the ascetic with attire, ornaments and the garland.
  modern: Then Sītā, the daughter of Mithilā, told Rāma all about how the ascetic had lovingly given her clothes, ornaments, and a garland.
2.111.17:
  dutt: Ayodhyā CXVIII
  text: On the night having passed away, those foremost of men, after performing their ablutions, enquired of the ascetics performing fire-sacrifices, who lived in the forest.
  modern: When the night had passed, those foremost of men, after performing their ablutions, asked the ascetics who lived in the forest and performed fire-sacrifices.
2.111.18:
  dutt: Ayodhyā CXVIII
  text: Thereat the righteous ascetics ranging the forest said that all the sides of the forest were infested by Rākshasas.
  modern: Then the righteous ascetics who ranged the forest said that all sides of the forest were infested by Rākṣasas.
2.111.19:
  dutt: Ayodhyā CXVIII
  text: … This is the path of the Maharshis, who procure fruits in the forest. By this way thou wilt be able to enter the impracticable wild, O Rāghava."
  modern: … This is the path of the great sages, who gather fruits in the forest. By this way you will be able to enter the impassable wild, O Rāghava."
3.1.1:
  dutt: Araṇya I
  text: Entering the extensive forest of Dandaka, the irrepressible and self-composed Rama saw the collection of asylums belonging unto the ascetics, …
  modern: Entering the great forest of Daṇḍaka, the unconquerable and self-composed Rāma saw a circle of ascetics' hermitages …
3.1.10:
  dutt: Araṇya I
  text: Thereupon, seeing the righteous Rama resembling the moon risen, as well as Lakshmana and the illustrious Vaidehi, those Maharshis endeued with spiritual intuition, came forward (to meet the incomers); and, having uttered benedictions, those persons of rigid vows, received them.
  modern: Seeing the righteous Rāma, who looked like the risen moon, with Lakṣmaṇa and the illustrious Vaidehī, those great sages, endowed with spiritual insight, came forward to meet them. Uttering blessings, those persons of rigid vows received them.
3.1.16:
  dutt: Araṇya I
  text: … And, experiencing great delight, those high-souled ones, uttering benedictions, procured wild fruits, flowers and roots; and, having assigned an asylum (unto Rama), those persons cognizant of righteousness, said with joined hands, …
  modern: … Greatly delighted, those high-souled men uttered blessings and brought wild fruits, flowers, and roots. Then they assigned him a hermitage, and those who knew righteousness said with folded hands, …
3.1.17:
  dutt: Araṇya I
  text: Thou shoudst be honored and worshipped, being their king, holding the rod, and their superior. …
  modern: You should be honored and worshipped, for you are their king, the bearer of the rod, and their superior.
3.1.19:
  dutt: Araṇya I
  text: And we, being in thy dominions, ought to be protected by thee. Whether living in the city or in the woods, thou, lord of men, art our sovereign.
  modern: And we, living in your dominions, ought to be protected by you. Whether in the city or in the woods, you, lord of men, are our sovereign.
3.1.20:
  dutt: Araṇya I
  text: We have renounced chastising others; and, O monarch, we have conquered our anger, and subdued our passions. Therefore, even as a child in its mother’s womb (should be protected by her), should we be protected by thee."
  modern: We have given up punishing others, O king, and we have conquered our anger and subdued our passions. So you should protect us as a child in its mother's womb is protected by her."
3.5.14:
  dutt: Araṇya VI
  text: O Rama, this many Brahmanas—this great body of men that have assumed the Vanaprastha mode of life, although having thee for their lord, are being sorely troubled by Rakshasas, as if they had none.
  modern: O Rāma, this great body of Brāhmaṇas who have taken up the life of forest dwellers are being sorely troubled by Rākṣasas, though they have you for their lord, as if they had none.
3.5.14+1:
  dutt: Araṇya VI
  text: O hero, we have no greater refuge on earth than thyself.
  modern: O hero, we have no greater refuge on earth than you.
3.5.19:
  dutt: Araṇya VI
  text: Hearing these words of the sages and ascetics, that righteous-souled one addressed them, saying, "It doth not behove you to speak thus. I should be commanded by the anchorets.
  modern: Hearing these words of the sages and ascetics, the righteous-souled Rāma said to them, "It is not right for you to speak so. I should be commanded by the ascetics.
3.5.20:
  dutt: Araṇya VI
  text: I have at my own will come hither for securing your interest. Then shall my stay in the woods be crowned with mighty fruit. I wish to slay in battle the enemies of the ascetics. …
  modern: I have come here of my own will to secure your interest. Then my stay in the woods will bear great fruit. I wish to kill in battle the enemies of the ascetics. …
3.6.3:
  dutt: Araṇya VII
  text: Then those worthy scions of the Ikshwaku race—descendants of Raghu—with Sita entered the forest ever furnished with various kinds of trees.
  modern: Then those worthy scions of the Ikṣvāku race, the descendants of Raghu, entered with Sītā a forest full of every kind of tree.
3.7.19:
  dutt: Araṇya VIII
  text: Then fastening the graceful quivers, and taking the sweet-sounding bows, both Rama and Lakshmana issued from the hermitage. …
  modern: Then, fastening on their fine quivers and taking up their twanging bows, Rāma and Lakṣmaṇa both left the hermitage to go.
3.8.1:
  dutt: Araṇya IX
  text: When the son of Raghu had set out with Sutikshna’s permission, Sita addressed him in affectionate words and convincing speech, saying,— …
  modern: 'When the son of Raghu had set out with Sutīkṣṇa''s leave, Sītā spoke to her husband in affectionate, persuasive words: …'
3.8.3:
  dutt: Araṇya IX
  text: This evil begot of desire is threefold. One prominent evil is falsehood, and both the others are of weightier significance, —association with others’ wives, and vindictiveness without any (basis of) hostility.
  modern: 'This evil born of desire is threefold. One is falsehood, and the other two are weightier: association with others'' wives, and vindictiveness without any basis of hostility.'
3.8.4:
  dutt: Araṇya IX
  text: Falsehood, O Raghava, hath never been thine, nor can it ever be thine (in the future). Nor yet, O foremost of men, canst thou ever even in fancy be (guilty of) going after others’ wives, which marreth all religious merit. …
  modern: Falsehood, O Rāghava, has never been yours, nor can it ever be yours in the future. Nor, foremost of men, could you ever, even in imagination, go after others' wives, which ruins all religious merit. …
3.8.6:
  dutt: Araṇya IX
  text: The third evil that leads men through ignorance to bear hostility towards others without any (cause of) hostility, is now present (unto thee).
  modern: "The third evil, which leads men through ignorance to bear hostility toward others without cause, is now before you."
3.8.20:
  dutt: Araṇya IX
  text: From affection and the high honor in which I hold thee, I merely remind thee of this matter. I do not teach thee.
  modern: I only remind you of this matter, out of love and the high regard I have for you. I am not teaching you.
3.8.21:
  dutt: Araṇya IX
  text: Equipped with bows as thou art, thou shouldst renounce all thoughts of slaying without hostility the Rakshasas residing in Dandaka. Without offence none should be slain. …
  modern: Since you carry a bow, you should give up every thought of killing the Rākṣasas who live in Daṇḍaka when they have done you no harm. No one should be killed without offence. …
3.8.22:
  dutt: Araṇya IX
  text: … It is the duty of Kshatriya heroes by means of their bows to protect persons of subdued souls, come by any calamity.
  modern: … It is the duty of Kṣatriya heroes to use their bows to protect self-controlled people who have come to harm.
3.8.23:
  dutt: Araṇya IX
  text: Where are arms? And where is the forest? Where is Kshatriya virtue? And where is asceticism? These arc opposed to each other,—let us, therefore, honor the morality that pertains to this place.
  modern: Where are arms? And where is the forest? Where is Kṣatriya virtue? And where is asceticism? These are opposed to each other, so let us honor the morality that belongs to this place.
3.8.26:
  dutt: Araṇya IX
  text: Interest springs from righteousness; and happiness also results therefrom. One attains everything through righteousness—in this world the only substantial thing.
  modern: Wealth springs from righteousness, and happiness also comes from it. One attains everything through righteousness, the only substantial thing in this world.
3.9.1:
  dutt: Araṇya X
  text: Hearing Vaidehi’s words spoken through high regard (for her husbands Rama with his energy enhanced, answered Janaka’s daughter, saying, …
  modern: "Hearing Vaidehī's words, spoken out of devotion to her husband, Rāma, his energy heightened, answered Janaka's daughter, …"
3.9.3:
  dutt: Araṇya X
  text: What, O exalted one, shall I say? Thou hast thyself by thy words (furnished an answer to what thou hadst said). Kshatriyas wear bows in order that the word ‘distressed’ may not exist (on earth).
  modern: 'What shall I say, noble lady? You have answered yourself with your own words: Kṣatriyas carry bows so that the word ''distressed'' may not exist on earth.'
3.9.4:
  dutt: Araṇya X
  text: … O Sita, those ascetics of severe vows that are beset with perils in Dandaka, having personally come unto me, who am their refuge, have sought protection at my hands.
  modern: Sītā, those ascetics of strict vows who are beset with dangers in Daṇḍaka came to me themselves, since I am their refuge, and sought my protection.
3.9.10:
  dutt: Araṇya X
  text: Thereat all those that had come, said, "We have been, O Rama, immensely harassed in the forest of Dandaka by Rakshasas wearing shapes at will. Do thou deliver us. …
  modern: Then all who had come said, "We have been, O Rāma, immensely harassed in the forest of Daṇḍaka by Rākṣasas who take shapes at will. Deliver us. …
3.9.16:
  dutt: Araṇya X
  text: … Having heard these words, I promised my perfect protection unto the saints in the forest of Dandaka, O daughter of Janaka.
  modern: … Having heard these words, I promised the sages in the Daṇḍaka forest my full protection, daughter of Janaka.
3.9.18:
  dutt: Araṇya X
  text: I had rather renounce my life, or thee, O Sita, along with Lakshmana,— but by no means my promise made, especially unto Brahmanas.
  modern: I would rather give up my life, or you, O Sītā, along with Lakṣmaṇa, but by no means my promise, especially one made to Brāhmaṇas.
3.9.19:
  dutt: Araṇya X
  text: O Videha’s daughter, the protection of the saints is incumbent on me even without any representation,—and what (shall I say) when I have promised the same?
  modern: O daughter of Videha, protecting the sages is my duty even without any appeal, and how much more when I have promised it?
3.9.20:
  dutt: Araṇya X
  text: Thou hast spoken this unto me through affection and friendship. I have been well pleased with thee, O Sita. One doth not instruct another that one doth not bear affection to. O beauteous damsel, (what thou hast said) is worthy of both thy love and thy race.
  modern: You have spoken this to me out of affection and friendship. I am well pleased with you, Sītā. One does not instruct someone one has no affection for. O beautiful one, what you have said is worthy of both your love and your family.
3.10.2:
  dutt: Araṇya XI
  text: … And they went with Sita, seeing many mountain-peaks, and forests, and delightful streams, …
  modern: … They went with Sītā, seeing many mountain peaks and forests and delightful streams …
3.10.25:
  dutt: Araṇya XI
  text: And Raghava happily passed his days somewhere for ten months, somewhere for one year, somewhere for four months somewhere for five or six months, somewhere for many months, somewhere for a month and a half, —somewhere for more, somewhere for three months, and somewhere for eight. And as Rama lived in the asylums of the ascetics and amused himself through their good graces, ten years were passed away (in this way).
  modern: Raghava happily passed his days in one place for ten months, in another for a year, in another for four months, for five or six months, for many months, for a month and a half, for more, for three months, and in another for eight. As Rāma lived in the hermitages of the ascetics and amused himself through their kindness, ten years passed in this way.
3.11.21:
  dutt: Araṇya XII
  text: Having said this touching Agastya of the splendour of the sun, that son of Raghu took hold of his feet.
  modern: Having said this, the son of Raghu touched the feet of Agastya, who had the splendor of the sun.
3.11.22:
  dutt: Araṇya XII
  text: Then, having paid him homage, Rama with joined hands stood there in company with Videha’s daughter, Sita, and Lakshmana.
  modern: Then, having paid him homage, Rāma stood there with folded hands, with Sītā, daughter of Videha, and Lakṣmaṇa.
3.11.25:
  dutt: Araṇya XII
  text: … and then first sitting down, that foremost of ascetics, the pious Agastya, addressed Rama cognizant of righteousness, staying with joined hands, …
  modern: … Then, sitting down first, the foremost of ascetics, the pious Agastya, who knew righteousness, said to Rāma, who stood with folded hands, …
3.11.29:
  dutt: Araṇya XII
  text: … "O foremost of men, this mighty, celestial bow belonging unto Vishnu, and constructed by Vicwakarma, …
  modern: … "O foremost of men, this mighty celestial bow of Viṣṇu, made by Viśvakarman, …
3.12.13:
  dutt: Araṇya XIII
  text: … "Two Yojanas hence, my child, is a region abounding in fruits and roots, containing countless deer, and beautiful—known by the name of Panchavati.
  modern: … "Two yojanas from here, my child, is a region rich in fruits and roots, with countless deer, and beautiful, known by the name of Pañcavaṭī.
3.12.14:
  dutt: Araṇya XIII
  text: Repairing thither, do thou, rearing an asylum, pass thy time pleasantly in company with Sumitra’s son, duly doing the mandate of thy sire.
  modern: Go there, build a hermitage, and pass your time pleasantly with Sumitrā's son, duly carrying out your father's command.
3.12.23:
  dutt: Araṇya XIII
  text: Thus accosted by Agastya, Rama along with Sumitra’s son, honouring the truth-speaking saint, greeted him. …
  modern: "So addressed by Agastya, Rāma, with Sumitrā's son, honored the truthful sage and greeted him."
3.13.1:
  dutt: Araṇya XIV
  text: As he was proceeding to Panchavati, Raghu’s son saw a huge-bodied vulture of terrible prowess.
  modern: As he was going to Pañcavaṭī, Raghu's son saw a huge-bodied vulture of terrible prowess.
3.13.4:
  dutt: Araṇya XIV
  text: Knowing him to be a friend of his sire, Raghava paid him homage, and enquired for his name and lineage.
  modern: Knowing him to be a friend of his father, Rāghava paid him homage and asked his name and lineage.
3.13.5:
  dutt: Araṇya XIV
  text: Hearing Rama’s words, he mentioned his own lineage, and related the origin of all beings.
  modern: Hearing Rāma's words, he told his own lineage and the origin of all beings.
3.13.33:
  dutt: Araṇya XIV
  text: And from Aruna sprang myself and my elder brother Sampati. O subduer of enemies, know me for Jatayu, the son of Syeni.
  modern: And from Aruṇa sprang myself and my elder brother Sampāti. O subduer of enemies, know me as Jaṭāyu, the son of Śyenī.
3.14.1:
  dutt: Araṇya XV
  text: Then repairing to Panchavati filled with various animals and beasts of prey, Rama remarked unto his brother of flaming energy, …
  modern: Then, reaching Pañcavaṭī, full of animals and beasts of prey, Rāma said to his brother of blazing energy, …
3.14.10:
  dutt: Araṇya XV
  text: … "This place is level, graceful, and surrounded with blossoming trees. Do thou duly construct an asylum at this spot.
  modern: … "This place is level and lovely, and surrounded by flowering trees. Build a hermitage here in the proper way.
3.14.19:
  dutt: Araṇya XV
  text: This spot is sacred —this spot is charming—this spot abounds in beasts and birds. Here will I dwell, O Sumitra’s son, in company with this bird."
  modern: This spot is sacred, this spot is charming, this spot abounds in beasts and birds. Here I will live, O son of Sumitrā, with this bird."
3.16.4:
  dutt: Araṇya XVII
  text: As Rama was thus seated with his mind engrossed in that talk, A Rakshasi came to that region at her will.
  modern: As Rāma sat so, with his mind absorbed in that talk, a Rākṣasī came to that place of her own will.
3.16.10:
  dutt: Araṇya XVII
  text: That Rakshasi being wrought up with passion addressed Rama saying "Wearing matted locks, and equipped with bows and arrows, why hast thou along with thy wife come to this region haunted by Rakshasas? …
  modern: That Rākṣasī, roused by passion, said to Rāma, "Why have you, with matted locks and armed with bow and arrows, come with your wife to this region haunted by Rākṣasas?
3.16.11:
  dutt: Araṇya XVII
  text: (with 3.16.10)
3.16.21:
  dutt: Araṇya XVII
  text: Rama, I have surpassed them all (in prowess). At first sight of thee, I approach thee, thou best of men, as my husband with (feelings of) love. … Become my husband for ever and a day. What wilt thou do with Sita?
  modern: Rāma, I have surpassed them all. From the first sight of you I come to you with love, best of men, as my husband. … Be my husband for ever. What will you do with Sītā?
3.17.16:
  dutt: Araṇya XVIII
  text: To-day, thou looking on, I shall eat up this human female. And I shall, rid of a co-wife, happily range with thee."
  modern: Today, as you look on, I shall eat up this human female. And, rid of a co-wife, I shall range happily with you."
3.17.20:
  dutt: Araṇya XVIII
  text: It behoves thee, O foremost of men, to deform this frightful, unchaste Rakshasi of a huge abdomen, transported with lust."
  modern: It is right, O foremost of men, for you to disfigure this frightful, unchaste Rākṣasī with the huge belly, driven wild by lust."
3.17.21:
  dutt: Araṇya XVIII
  text: Thus desired the exceedingly strong Lakshmana, fired with wrath, taking out his sword, in the sight of Rama, cut off her nose and ears.
  modern: Thus urged, the very strong Lakṣmaṇa, burning with wrath, drew his sword and, in Rāma's sight, cut off her nose and ears.
3.17.21+1:
  dutt: Araṇya XIX
  text: Tell me plainly by whom thou hast been thus deformed.
  modern: Tell me plainly by whom you have been disfigured.
3.17.21+2:
  dutt: Araṇya XIX
  text: Who is it that with his finger-end hath by way of sport hurt a black venomous snake that was innocent?
  modern: Who, with the tip of his finger, has hurt in sport an innocent black venomous snake?
3.17.21+3:
  dutt: Araṇya XIX
  text: He that coming in contact with thee hath to-day drunk virulent poison, winding a fatal noose round about his neck, knoweth it not through ignorance.
  modern: He who has come in contact with you has drunk virulent poison today and does not know it through ignorance, as he winds a fatal noose around his neck.
3.18.10:
  dutt: Araṇya XIX
  text: Hearing these words of his brother, who was under the influence of extreme rage, Surpanakha, with tears in her eyes, said, … there are two sons of Dacaratha the brothers Rama and Lakshmana …
  modern: Hearing these words of her brother, who was in a towering rage, Śūrpaṇakhā said with tears in her eyes, … "There are two sons of Daśaratha, the brothers Rāma and Lakṣmaṇa …
3.18.10+1:
  dutt: Araṇya XIX
  text: (with 3.18.10)
3.18.13:
  dutt: Araṇya XIX
  text: And between them I saw there a youthful female furnished with grace, and having a dainty waist; adorned with every kind of ornament.
  modern: And between them I saw a young woman, graceful and slender-waisted, adorned with every kind of ornament.
3.18.14:
  dutt: Araṇya XIX
  text: And it is on account of this female that I have like one unchaste and uncared for, have come by this condition at their hands.
  modern: It is on account of this woman that I, like one unchaste and uncared for, have been brought to this condition at their hands.
3.18.15:
  dutt: Araṇya XIX
  text: Nor I wish in the midst of encounter to drink the frothy blood of that crooked one as well as those two slain (in battle). …
  modern: And I want, in the thick of battle, to drink the frothy blood of that crooked woman and of those two, once they are slain.
3.24.6:
  dutt: Araṇya XXV
  text: Then all the rangers of the night, waxing exceeding wroth, showered various weapons on that terrible bowman, the invincible Rama. …
  modern: Then all the night-rangers, furious, rained down every kind of weapon on that terrible bowman, the invincible Rāma.
3.24.28:
  dutt: Araṇya XXV
  text: And capable of making one’s hair stand on end, that battle was dreadful and furious and now on the side of Rama and now again on that of the Rakshasas.
  modern: That battle, which made one's hair stand on end, was dreadful and furious, now on Rāma's side and now on the side of the Rākṣasas.
3.24.28+1:
  dutt: Araṇya XXX
  text: '"In over half a moment Rama by means of sharpened shafts hath slain in mighty encounter fourteen thousand Rakshasas, wearing shapes at will, headed by Khara and Dushana.'
  modern: '"In a little over half a moment Rāma, with sharpened shafts, has killed in mighty battle fourteen thousand Rākṣasas who take shapes at will, headed by Khara and Dūṣaṇa.'
3.25.22:
  dutt: Araṇya XXVI
  text: Fourteen thousand Rakshasas of dreadful deeds were slain by Rama single, a human being, fighting, (moreover) on foot.
  modern: Fourteen thousand Rākṣasas of dreadful deeds were killed by Rāma alone, a human being, fighting on foot.
3.25.22+1:
  dutt: Araṇya XXVI
  text: (with 3.25.22)
3.29.34:
  dutt: Araṇya XXX
  text: Then the victorious and heroic, Rama, honored by the Maharshis, entered the asylum, worshipped by Lakshmana.
  modern: Then the victorious and heroic Rāma, honored by the great sages, entered the hermitage, worshiped by Lakṣmaṇa.
3.30.3:
  dutt: Araṇya XXXII
  text: And witnessing Rama’s deeds, incapable of being performed by others, she, extremely agitated, went to Lanka, ruled by Ravana.
  modern: Witnessing Rāma's deeds, which no one else could perform, she was greatly agitated and went to Laṅkā, ruled by Rāvaṇa.
3.30.3+1:
  dutt: Araṇya XXXII
  text: And she saw the effulgent Ravana in front of his palace, surrounded by his counsellors, like Vasava surrounded by the Maruts …
  modern: And she saw the radiant Rāvaṇa in front of his palace, surrounded by his counsellors like Vāsava among the Maruts …
3.31.1:
  dutt: Araṇya XXXIII
  text: Then the woe begone Surpanakha, in high wrath spoke harshly in the midst of the courtiers, unto Ravana, given to railing loudly against all creatures, …
  modern: "Then the miserable Śūrpaṇakhā, in great anger, spoke harshly in the midst of the courtiers to Rāvaṇa, who loudly railed against all creatures, …"
3.31.3:
  dutt: Araṇya XXXIII
  text: The subjects do not esteem a monarch that is given to sensual enjoyments, is intent upon satisfying his lust and is covetous like the fire in a cemetery.
  modern: The subjects do not esteem a king who is given to sensual enjoyment, intent on satisfying his lust, and greedy like a cemetery fire.
3.31.10:
  dutt: Araṇya XXXIII
  text: I believe thou hast no spies, and that thy counsellors are common folks, since although Janasthana with thy kinsman is destroyed, yet thou takest it not to heart.
  modern: I believe you have no spies and that your counsellors are common people, since you take it so little to heart that Janasthāna, with your kinsmen, is destroyed.
3.31.11:
  dutt: Araṇya XXXIII
  text: Fourteen thousands of Rakshasas of dreadful deeds, with Khara and Dushana, have all been slain by Rama single-handed; Rama of untiring energy hath inspired the saints with courage; the Dandakas have been benefitted; and Janasthana hath been harassed.
  modern: Fourteen thousand Rākṣasas of dreadful deeds, with Khara and Dūṣaṇa, have all been killed by Rāma alone. Rāma, of untiring energy, has given courage to the sages; the Daṇḍakas have been made safe; and Janasthāna has been harassed.
3.31.12:
  dutt: Araṇya XXXIII
  text: (with 3.31.11)
3.32.2:
  dutt: Araṇya XXXIV
  text: … "Who is Rama? And what is his prowess? And what his form? And what his power? And why hath he entered the forest of Dandaka, difficult to range? …
  modern: … "Who is Rāma? And what is his prowess? And what is his form? And what is his power? And why has he entered the forest of Daṇḍaka, which is hard to range? …
3.32.4:
  dutt: Araṇya XXXIV
  text: Thus addressed by the lord of the Rakshasas, the Rakshasi, transported with rage, commenced to duly narrate all about Rama. …
  modern: So addressed by the lord of the Rākṣasas, the Rākṣasī, beside herself with rage, began to tell him all about Rāma, as was proper.
3.32.12:
  dutt: Araṇya XXXIV
  text: His brother is endeued with mighty energy, and in merit, is of equal prowess; and he is devoted to his brother, and beareth him regard; the puissant one is named Lakshmana.
  modern: His brother is endowed with mighty energy and is equal to him in merit and prowess. He is devoted to his brother and respects him. The mighty one is named Lakṣmaṇa.
3.32.14:
  dutt: Araṇya XXXIV
  text: And Rama’s virtuously wedded beloved wife, having expansive eyes, … that surpassingly lovely wench is named Sita—the slender waisted daughter of Videha.
  modern: And Rāma's beloved, lawfully wedded wife, with wide eyes … That surpassingly lovely woman is named Sītā, the slender-waisted daughter of Videha.
3.32.17:
  dutt: Araṇya XXXIV
  text: … That good-natured girl, unparalleled on earth in loveliness, who can well pride herself on her person, is a worthy wife for thee; and thou too art a fit husband for her.
  modern: … That good-natured girl, unequaled on earth in loveliness, who may well take pride in her person, is a worthy wife for you, and you are a fit husband for her.
3.32.18:
  dutt: Araṇya XXXIV
  text: It is to bring over for thee that one of spacious hips, and a high and well-developed bust, that I had put forth my endeavours.
  modern: It was to bring that woman of broad hips and high, full breasts to you that I made my effort.
3.32.18+1:
  dutt: Araṇya XXXIV
  text: But, O mighty-armed one I have been disfigured by the wicked Lakshmana.
  modern: But, O mighty-armed one, I was disfigured by the wicked Lakṣmaṇa.
3.32.20:
  dutt: Araṇya XXXIV
  text: If it is thy purpose to have her for thy wife, at once stretch forth thy right leg, for attaining success.
  modern: If you intend to have her for your wife, at once stretch out your right leg to gain success.
3.32.20+1:
  dutt: Araṇya XXXIV
  text: … Understanding their incapacity, do thou, O lord of Rakshasas, for making her thy wife, by force carry away the frail Sita of a blameless person.
  modern: Knowing how weak they are, lord of the Rākṣasas, carry off by force the frail and blameless Sītā to make her your wife.
3.33.1:
  dutt: Araṇya XXXV
  text: Hearing those words of Surpanakha, able to make one’s hair stand on end, (Ravana) ascertaining his course after issuing his orders to his councellors, departed. …
  modern: Hearing those hair-raising words of Śūrpaṇakhā, Rāvaṇa decided on his course, gave orders to his counsellors, and left. …
3.33.37:
  dutt: Araṇya XXXV
  text: And there he saw a Rakshasa, named Maricha, clad in a dark deer-skin, bearing a head of matted locks, subsisting on restricted fare.
  modern: And there he saw a Rākṣasa named Mārīca, clad in a dark deerskin, with a head of matted locks, living on restricted fare.
3.33.38:
  dutt: Araṇya XXXV
  text: And approaching Ravana duly, the Rakshasa, Maricha, received the king with every hospitality passing human. And having entertained him personally with meats and drinks, Maricha addressed him in weighty words, saying, …
  modern: "Approaching Rāvaṇa in due form, the Rākṣasa Mārīca received the king with every hospitality beyond the human; and after feeding him himself with meats and drinks, Mārīca spoke to him in weighty words, …"
3.34.1:
  dutt: Araṇya XXXVI
  text: O Maricha, hearken unto me, my child, as I relate everything unto thee). I am distressed; and in this distress of mine, thou art certainly my great refuge.
  modern: Mārīca, listen to me, my child, as I tell you everything. I am distressed, and in this distress of mine you are surely my great refuge.
3.34.2:
  dutt: Araṇya XXXVI
  text: Thou knowest Janasthana, where lives my brother Khara, and the mighty-armed Dushana, and my sister, Surpanakha; …
  modern: You know Janasthāna, where my brother Khara lives, and the mighty-armed Dūṣaṇa, and my sister Śūrpaṇakhā …
3.34.6:
  dutt: Araṇya XXXVI
  text: And fourteen thousands of Rakshasas of dreadful deeds, heroic, high-spirited, Rakshasas possessed of exceeding prowess; while residing n Janasthana of late,—clad in mail and equipped with various weapons, headed by Khara, met with Rama in the field.
  modern: And fourteen thousand Rākṣasas of dreadful deeds, heroic and high-spirited, of exceeding prowess, who were living in Janasthāna of late, clad in mail and armed with various weapons, met Rāma in the field, headed by Khara.
3.34.7:
  dutt: Araṇya XXXVI
  text: Getting enraged, Rama in conflict without returning any harsh speech, by means of his shafts shot from his bow, —hath, a human being, and fighting on foot, with his flaming arrows slaughtered fourteen thousand Rakshasas of fierce energy.
  modern: Enraged, Rāma, in the conflict, without returning any harsh word, with shafts shot from his bow, killed fourteen thousand Rākṣasas of fierce energy, though he was a human being fighting on foot, with his flaming arrows.
3.34.8:
  dutt: Araṇya XXXVI
  text: (with 3.34.7)
3.34.10:
  dutt: Araṇya XXXVI
  text: Having been expelled by his enraged sire, that disgrace of Kshatriyas, the weak Rama, living in company with his wife hath effected the destruction of this army.
  modern: Expelled by his angry father, that disgrace of the Kṣatriyas, the weak Rāma, living with his wife, has destroyed this army.
3.34.12:
  dutt: Araṇya XXXVI
  text: … by whom, violently without hostility my sister hath been deformed in the forest by having her nose and ears cut off.
  modern: … Without any hostility, he violently had my sister disfigured in the forest by having her nose and ears cut off.
3.34.13:
  dutt: Araṇya XXXVI
  text: Of him will I carry off by force from Janasthana, his wife, Sita, resembling the daughter of a celestial. Be thou my help in it.
  modern: From Janasthāna I will carry off by force his wife, Sītā, who is like the daughter of a god. Help me in this.
3.34.13+1:
  dutt: Araṇya XXXVI
  text: Thou art a mighty hero commanding resources, and conversant with potent illusory displays.
  modern: You are a mighty hero commanding resources, and skilled in potent illusions.
3.34.16:
  dutt: Araṇya XXXVI
  text: Taking this to my heart, Ihave come to thee, O ranger of the night. Do thou listen as to the business in which by my command thou art to help me.
  modern: Taking this to heart, I have come to you, O night-ranger. Listen to the business in which, at my command, you are to help me.
3.35.1:
  dutt: Araṇya XXXVII
  text: Hearing the words of that sovereign of the Rakshasas, the highly energetic Maricha, skilled in speech, answered the Rakshasa chief, saying, "O king, the speaker of soft words is common, but the speaker and the listner of unwelcome though beneficial words are rarities.
  modern: Hearing the words of the lord of the Rākṣasas, the highly energetic Mārīca, skilled in speech, answered the Rākṣasa chief, "O king, speakers of soft words are common, but a speaker and a listener of unwelcome though beneficial words are rare.
3.35.2:
  dutt: Araṇya XXXVII
  text: (with 3.35.1)
3.35.3:
  dutt: Araṇya XXXVII
  text: Volatile, and employing no spies, thou surely dost not understand the exceedingly powerful Rama towering high in virtues, and resembling the illustrious Indra or Varuna himself.
  modern: You are fickle and employ no spies, and you surely do not understand the exceedingly powerful Rāma, who towers in virtues and is like illustrious Indra or Varuṇa himself.
3.35.13:
  dutt: Araṇya XXXVII
  text: He is an incarnation of virtue, pious and truthful, and lord of all men as Basava of all celestials.
  modern: He is an incarnation of virtue, pious and truthful, and lord of all men as Vāsava is of all the gods.
3.35.14:
  dutt: Araṇya XXXVII
  text: How dost thou then wish to carry away by force his Vaidehi, protected by virtue of her own chastity, like unto the rays of Sun?
  modern: "How can you then wish to carry off by force his Vaidehī, who is protected by her own chastity and is like the rays of the sun?"
3.36.26:
  dutt: Araṇya XXXVIII
  text: Being attached unto thy wives do thou preserve the race of the Rakshasas, thy own line, thy wished for life, kingdom, wealth and dignity. …
  modern: Be devoted to your own wives, and preserve the race of the Rākṣasas, your own line, your precious life, your kingdom, wealth and dignity.
3.37.18:
  dutt: Araṇya XXXIX
  text: O Ravana what more shall I speak unto thee, Iam so much afraid of Rama that such words as Ratna (jewel) Ratha (chariot) which begin with the letter Ra administer consternation unto me.
  modern: O Rāvaṇa, what more shall I say to you? I am so afraid of Rāma that words like ratna (jewel) and ratha (chariot), which begin with the letter ra, fill me with terror.
3.48.13:
  dutt: Araṇya XXXIX
  text: Though the wicked Khara of Janasthana hath been slain by him on Surpanakha’s account, yet how is he to blame for it?
  modern: Though the wicked Khara of Janasthāna was killed by him on Śūrpaṇakhā's account, how is he to blame for it?
3.38.2:
  dutt: Araṇya XL
  text: As a person desirous of meeting with his end doth not take medicine, Ravana, the king of night-rangers paid no heed to the appropriate and sound words of Maricha skilled in speech, foreboding good unto him. Moreover he addressed him with the following harsh words.
  modern: As a man who wants to meet his end does not take medicine, Rāvaṇa, the king of the night-rangers, paid no heed to the appropriate and sound words of the skillful speaker Mārīca, which promised him good. Moreover, he addressed him with these harsh words.
3.38.7:
  dutt: Araṇya XL
  text: I have made this firm resolution in my mind O, Maricha; even Indra, with the celestials and Ashuras shall not be able to shake it.
  modern: I have made this firm resolution in my mind, Mārīca; even Indra, with the gods and Asuras, will not be able to shake it.
3.38.10:
  dutt: Araṇya XL
  text: It is always proper to speak before monarchs such pleasant and favourable words as are intended for the welfare of the master and are sanctioned by the royal etiquette.
  modern: It is always right to say to kings such pleasant and favorable words as are meant for the master's welfare and sanctioned by royal etiquette.
3.38.13:
  dutt: Araṇya XL
  text: They are to be adored and honored therefore on all occasions. Thou art ignorant of kingly morality and fully absorbed in illusion.
  modern: So they are to be adored and honored on all occasions. You are ignorant of kingly morality and wholly absorbed in illusion.
3.38.14:
  dutt: Araṇya XL
  text: It is for this that thou dost out of thy wickedness of heart address me thy guest with these harsh words. I do not ask thee O, Rakshasa about the propriety (of my conduct or about my welfare. I did only ask thee for thy help.
  modern: It is for this that, out of the wickedness of your heart, you address me, your guest, with these harsh words. I do not ask you, Rākṣasa, about the propriety of my conduct or about my welfare. I asked you only for your help.
3.38.15:
  dutt: Araṇya XL
  text: … assuming the shape of a deer having golden skin painted with silvery drops … and ranging at large before Vaidehi do thou after captivating her take thy wished-for way.
  modern: "… Take the shape of a deer with golden skin painted with silvery drops … range at large before Vaidehī, captivate her, and then go your wished-for way."
3.38.16:
  dutt: Araṇya XL
  text: Vaidehi, being struck with wonder seeing thee a golden deer capable of illusions, shall request Rama to get thee soon for her.
  modern: Vaidehī, struck with wonder at seeing you, a golden deer capable of illusions, will ask Rāma to get you for her soon.
3.38.16+1:
  dutt: Araṇya XL
  text: Kakuthstha issuing out of the asylum, thou shalt, at great distance utter such cries as "O Sita, O Lakahmana" imitating his (Rama’s) voice. …
  modern: When Kākutstha has left the hermitage, you are to go far off and cry out, "O Sītā! O Lakṣmaṇa!" in imitation of Rāma's voice.
3.38.20:
  dutt: Araṇya XL
  text: … I shall compell thee to do this. No body can attain to prosperity and happiness, acting against his sovereign’s will.
  modern: I will make you do this. No one who acts against his king's will ever finds prosperity and happiness.
3.40.12:
  dutt: Araṇya XLII
  text: Hearing the words of Ravana, the Rakshasa Maricha assuming the wonderful shape of a (golden) deer began to range at large before Rama’s hermitage.
  modern: Hearing Rāvaṇa's words, the Rākṣasa Mārīca took the wonderful shape of a golden deer and began to range at large before Rāma's hermitage.
3.41.1:
  dutt: Araṇya XLIII
  text: Beholding that deer with its sides painted with gold and silver, while collecting flowers, Sita, having blameless limbs and beautiful hips and having the color of her body like that of pure gold became immensely pleased and called aloud her husband and Lakshmana with scimitars in their hands.
  modern: Seeing that deer with its sides painted with gold and silver as she gathered flowers, Sītā, of blameless limbs and beautiful hips and with a body the color of pure gold, was immensely pleased and called aloud to her husband and to Lakṣmaṇa, who had swords in their hands.
3.41.2:
  dutt: Araṇya XLIII
  text: (with 3.41.1)
3.41.3:
  dutt: Araṇya XLIII
  text: Being thus called by the daughter of the king of Videha those two best of men Rama and Lakshmana, casting their looks around beheld that deer.
  modern: Called thus by the daughter of the king of Videha, those two best of men, Rāma and Lakṣmaṇa, looked around and saw that deer.
3.41.4:
  dutt: Araṇya XLIII
  text: Seeing him Lakshmana, struck with fear, said "Methinks, this deer is the Rakshasa Maricha.
  modern: Seeing it, Lakṣmaṇa, struck with fear, said, "I think this deer is the Rākṣasa Mārīca.
3.41.7:
  dutt: Araṇya XLIII
  text: … there is no such jewelled deer on earth. O Raghava, O Lord of earth, there is no doubt that this is nothing but illusion."
  modern: … there is no such jeweled deer on earth. O Rāghava, lord of the earth, there is no doubt that this is nothing but illusion."
3.41.8:
  dutt: Araṇya XLIII
  text: When Lakshmana spake thus Sita with a pure smile being under the influence of enchantment contradicted him, and being pleased said …
  modern: When Lakṣmaṇa spoke thus, Sītā, with a pure smile, enchanted as she was, contradicted him and said happily, …
3.41.9:
  dutt: Araṇya XLIII
  text: … "O son of the worshipful Sire, this deer hath attracted my mind, get it for me, pray, O thou of mighty arms; it shall be an object of sport for us.
  modern: "… \"Son of a noble father, this deer has captured my heart. Please catch it for me, mighty-armed one; it will be something for us to play with."
3.41.16:
  dutt: Araṇya XLIII
  text: When shall we regain our kingdom after the expiry of the term of our banishment, this deer shall beautify the interior of our palace.
  modern: When we regain our kingdom after the term of our banishment, this deer will beautify the inside of our palace.
3.41.17:
  dutt: Araṇya XLIII
  text: O Lord, truly shall this celestial deer create surprise in Bharata, yourself, me and my mothers-in-law.
  modern: My lord, this celestial deer will truly create surprise in Bharata, yourself, me, and my mothers-in-law.
3.41.17+1:
  dutt: Araṇya XLIII
  text: Being enchanted by its beauty and spurred on by Sita’s words, Raghava pleased, spake unto his younger brother saying …
  modern: Enchanted by its beauty and urged on by Sītā's words, Rāghava, pleased, said to his younger brother, …
3.41.23:
  dutt: Araṇya XLIII
  text: … "Behold, O Lakshmana, it has immensely excited Vaidehi’s desire. On account of its exquisite beauty it shall loose its life to-day.
  modern: '"Look, Lakṣmaṇa, how strongly it has stirred Vaidehī''s desire. Because its beauty is so great, it will lose its life today.'
3.41.27:
  dutt: Araṇya XLIII
  text: Its face is like a glass made of best blue saphire, its belly resembling a conch and pearl, and it is very difficult to ascertain its shapes. Beholding it who is there (on earth) whose heart is not enamoured?
  modern: Its face is like a glass of the finest sapphire, its belly like conch and pearl, and its shape is hard to make out. Who on earth could see it and not have his heart captured?
3.41.44:
  dutt: Araṇya XLIII
  text: Therefore this Maricha approaching me shall be killed by me like unto Batapi being devoured by Agastya. Do thou therefore vigilently protect Vaidehi with mail and armours on.
  modern: Therefore Mārīca, coming near me, will be killed by me, as Vātāpi was devoured by Agastya. So guard Vaidehī carefully, with your mail and armor on.
3.41.46:
  dutt: Araṇya XLIII
  text: As long as I do not kill this deer, O Lakshmana, do thou with Sita remain with vigilance in this asylum. I shall in no time come back with its skin after killing it with one arrow.
  modern: As long as I do not kill this deer, Lakṣmaṇa, stay in this hermitage with Sītā, on your guard. I shall be back in no time with its skin, having killed it with one arrow.
3.42.1:
  dutt: Araṇya XLIV
  text: Having thus directed his brother, the highly energetic son of Raghu equipped himself with his gold-hilted scimitar …
  modern: Having given his brother these directions, the very energetic son of Raghu girded on his gold-hilted sword …
3.42.4:
  dutt: Araṇya XLIV
  text: Thereat girt with the bow and sword, (Rama) rushed where the deer was; and beheld him illumining all before him with his beauty,— …
  modern: Girt with bow and sword, Rāma rushed to where the deer was. He saw it lighting up all before it with its beauty, …
3.42.8:
  dutt: Araṇya XLIV
  text: Thereat Rama, eagerly anxious to secure the deer, being foiled by the deer, and in consequence growing enraged, wearied out, rested under a shadow, on a sward. …
  modern: Then Rāma, eager to catch the deer and foiled by it, grew angry, and worn out he rested in the shade on a patch of grass.
3.42.8+1:
  dutt: Araṇya XLIV
  text: And Maricha wearing the shape of a deer, showing himself and disappearing from sight, drew Raghava a long way from the hermitage.
  modern: Mārīca, in the shape of a deer, showing himself and disappearing from sight, drew Rāghava a long way from the hermitage.
3.42.10:
  dutt: Araṇya XLIV
  text: And seeing him, the exceedingly energetic and strong Raghava, determined to slay him, growing wroth, taking out a flaming shaft, resembling the rays of the sun, powerfully drew his bow, and firmly setting the shaft, and aiming it at the deer, …
  modern: Seeing him, the very energetic and strong Rāghava, determined to kill him and growing angry, took out a flaming shaft like the rays of the sun, drew his bow powerfully, set the shaft firmly, aimed it at the deer, …
3.42.13:
  dutt: Araṇya XLIV
  text: Thereat bounding up high as a palmyra palm, that one whose days had almost run out, uttered terrible sounds, lying on the earth. And while on the point of death, Maricha renounced his counterfeit shape.
  modern: Then, leaping up as high as a palmyra palm, he whose life had almost run out fell to the ground with terrible cries. And as he was dying, Mārīca gave up his false shape.
3.42.14:
  dutt: Araṇya XLIV
  text: … considering the time had come (for availing himself of the advice tendered by Ravana), began to cry with the voice of Raghava, "Ah Sita! Ah Lakshmana!"
  modern: … judging that the time had come to follow Rāvaṇa's advice, he began to cry out in the voice of Rāghava, "Ah Sītā! Ah Lakṣmaṇa!"
3.43.4:
  dutt: Araṇya XLV
  text: … He hath been over-powered by the Rakshasas like unto a bullock brought under the power of a lion," … Remembering the behest of Rama, Lakshmana did not go, though accosted thus by Sita.
  modern: … He has been overpowered by the Rākṣasas like a bull in the power of a lion." … Remembering Rāma's order, Lakṣmaṇa did not go, though Sītā spoke so.
3.43.5:
  dutt: Araṇya XLV
  text: Extremely mortified, the daughter of Janaka spake unto him saying "O Son of Sumitra, thou art an enemy unto Rama, in the garb of a brother. …
  modern: Extremely mortified, the daughter of Janaka said to him, "O son of Sumitrā, you are an enemy of Rāma in the guise of a brother. …
3.43.23:
  dutt: Araṇya XLV
  text: How shall I desire another man after serving the lotus-eyed Rama of dark blue hue as my husband?
  modern: How shall I desire another man, after serving the lotus-eyed Rāma of dark blue hue as my husband?
3.43.25:
  dutt: Araṇya XLV
  text: Hearing these brazen words of Sita, capable of making one’s down stand on end, the self-controlled Lakshmana with joined hands spake unto her saying …
  modern: Hearing these harsh words of Sītā, which made his hair stand on end, the self-controlled Lakṣmaṇa joined his hands and said to her …
3.43.27:
  dutt: Araṇya XLV
  text: Such is the nature of womankind on this earth. Women by nature are crooked, fickle, devoid of religious knowledge, and bring about difference between father and son.
  modern: Such is the nature of womankind on this earth. Women by nature are crooked, fickle, devoid of religious knowledge, and cause a breach between father and son.
3.43.27+1:
  dutt: Araṇya XLV
  text: O Vaidehi, O daugther of Janaka, truly am I incapable of putting up with these words of thine. They have pierced through both of my ears like a heated Naracha.
  modern: O Vaidehī, daughter of Janaka, I cannot put up with these words of yours. They have pierced both my ears like a heated nārāca arrow.
3.44.1:
  dutt: Araṇya XLVI
  text: Having been addressed with those harsh words the younger brother of Raghava, enraged, proceeded at once, being anxious to see Rama.
  modern: Hearing these harsh words, Lakṣmaṇa, the younger brother of Rāghava, was enraged and set out at once, anxious to see Rāma.
3.44.3:
  dutt: Araṇya XLVI
  text: … Wearing a soft silken cloth, with a lock of hair on his head with an umbrella and shoes and having on his left shoulder a rod and Kamandalu, the highly powerful one assuming the appearance of a wandering devotee carrying three long bamboo staves appeared before Vaidehi in the forest when there was none of the brothers by her.
  modern: Wearing soft cloth, with a lock of hair on his head, an umbrella and shoes, and a staff and water-pot on his left shoulder, the mighty one took the form of a wandering ascetic carrying three long bamboo staves and came up to Vaidehī in the forest when neither brother was with her.
3.44.15:
  dutt: Araṇya XLVI
  text: … "O thou having the color of gold and silver, O thou wearing silken cloth, O thou appearing like a lotus wearing a garland of lotus-petals, …
  modern: … "O you who have the color of gold and silver, O you who wear silk, who look like a lotus wearing a garland of lotus petals, …
3.44.16:
  dutt: Araṇya XLVI
  text: Art thou Bashfulness, Beauty, Fame, Wealth, Apsara, Dignity or Rati herself who is ranging at will in this forest?
  modern: Are you Modesty, Beauty, Fame, Wealth, an Apsaras, Dignity, or Rati herself, ranging at will in this forest?
3.44.30:
  dutt: Araṇya XLVI
  text: Who art thou? Whose wife? What for dost thou range alone in this forest of Dandaka frequented by terrible Rakshasas?"
  modern: Who are you? Whose wife are you? Why do you wander alone in this forest of Daṇḍaka, haunted by terrible Rākṣasas?"
3.45.2:
  dutt: Araṇya XLVII
  text: … "This person is my guest and a Bhahmin; he may curse me if I do not speak to him." Thinking this for a moment Sita said …
  modern: … "This man is my guest and a Brāhmaṇa; he may curse me if I do not speak to him." Thinking this for a moment, Sītā said, …
3.45.2+1:
  dutt: Araṇya XLVII
  text: … Thus that one (Rama) of firm resolution and ever engaged in pious offices wearing matted hair and assuming the semblance of an ascetic hath entered this forest of Dandaka along with myself and his younger brother.
  modern: … So that man of firm resolve, always engaged in pious acts, wearing matted hair and looking like an ascetic, has entered this forest of Daṇḍaka with me and his younger brother.
3.45.19:
  dutt: Araṇya XLVII
  text: Do thou take heart for a moment and live here. Instantly shall my husband return with good many wild fruits and roots …
  modern: "Take heart for a moment and stay here. My husband will soon be back with plenty of wild fruits and roots …"
3.46.2:
  dutt: Araṇya XLVIII
  text: … "O thou of a beautiful countenance, I am the step-brother of the Lord of wealth and my name is the mighty Ten-necked Ravana. May good betide thee!
  modern: … "Lady of the lovely face, I am the half-brother of the Lord of wealth, and my name is the mighty Ten-necked Rāvaṇa. Bless you!
3.47.12:
  dutt: Araṇya XLIX
  text: I am a worthy husband for thee. Do thou serve me for ever, thy praiseworthy husband. O fine lady, I shall never do what thou dost not like. Renouncing thy attachment for a man, do thou place thy love in me.
  modern: I am a worthy husband for you. Serve me for ever, your praiseworthy husband. Fine lady, I will never do anything you dislike. Give up your love for a man, and set your love on me.
3.47.16:
  dutt: Araṇya XLIX
  text: With his left hand he held her, having eyes like unto lotus-petals, by the hair, and with his right hand got hold of her thighs.
  modern: With his left hand he seized her, whose eyes were like lotus petals, by the hair, and with his right hand he took hold of her thighs.
3.47.20:
  dutt: Araṇya XLIX
  text: The virtuous Sita, being thus caught by Ravana,began to cry aloud, addressing Rama, who had gone away to a distant forest.
  modern: The virtuous Sītā, caught by Rāvaṇa in this way, began to cry aloud, calling to Rāma, who had gone away to a distant forest.
3.47.20+1:
  dutt: Araṇya XLIX
  text: Racked with sorrow that one of expansive eyes, while thus bewailing in piteous accents, she espied Yatayu, the king of vultures, seated on a tree.
  modern: Racked with sorrow as she wailed in piteous tones, that wide-eyed woman saw Jaṭāyu, the king of vultures, seated on a tree.
3.47.20+2:
  dutt: Araṇya XLIX
  text: Thereat the daughter of Janaka, brought under the control of Ravana and terrified, began to cry and utter those piteous words— …
  modern: 'Then Janaka''s daughter, in Rāvaṇa''s power and terrified, began to cry out and utter these piteous words: …'
3.47.20+3:
  dutt: Araṇya XLIX
  text: … "O worshipful Yatayu, do thou see that this vicious lord of Rakshasas hath ruthlessly carried me away like one having no husband.
  modern: … "Revered Jaṭāyu, see how this wicked lord of the Rākṣasas is ruthlessly carrying me off as if I had no husband.
3.47.20+4:
  dutt: Araṇya XLIX
  text: Thou wilt not be able to withstand this mighty, wicked and cruel night-ranger wearing emblems of conquest and having a scimitar in his hand.
  modern: You will not be able to stop this mighty, wicked and cruel night-ranger, who wears the emblems of victory and holds a sword.
3.48.1:
  dutt: Araṇya L
  text: Hearing these words Yatayu, who lay buried in a deep slumber, awoke and beheld both Ravana and Janaki.
  modern: Hearing these words, Jaṭāyu, who lay deep in sleep, awoke and saw Rāvaṇa and Jānakī.
3.48.2:
  dutt: Araṇya L
  text: Thereat the lord of birds resting on the tree, having a big sharp beak like unto the summit of a hill, addressed these soft words unto Ravana, …
  modern: 'Then the lord of birds, resting on the tree, with a big sharp beak like the summit of a hill, spoke these soft words to Rāvaṇa: …'
3.48.25:
  dutt: Araṇya L
  text: Myself drawing my breath thou shalt not be able to carry away this beloved queen of Rama, the pure-natured Sita having eyes resembling lotuses.
  modern: While I still draw breath you will not carry off Rāma's beloved queen, the pure-natured, lotus-eyed Sītā.
3.48.27:
  dutt: Araṇya L
  text: Do thou stand, O Ten-necked one. Behold for a moment. O Ravana, I shall throw thee headlong from this car, like unto a fruit from its stalk. O ranger of the night, even to my utmost might I will render thee hospitality in encounter.
  modern: Stand, Ten-necked one! Watch for a moment. Rāvaṇa, I will throw you headlong from this chariot like a fruit from its stalk. Night-ranger, I will give you the hospitality of battle to the utmost of my strength.
3.49.4:
  dutt: Araṇya LI
  text: There occured a mighty conflict between Yatayu, the lord of vultures, and Ravana, the lord of Rakshasas, like unto two Malyavan hills supplied with wings.
  modern: A mighty battle took place between Jaṭāyu, the lord of vultures, and Rāvaṇa, the lord of Rākṣasas, like that of two Mālyavān hills with wings.
3.49.36:
  dutt: Araṇya LI
  text: Yatayu addressing himself to displaying his prowess for the benefit of Rama, Ravana taking out his dagger, cut off his two wings, two legs and two sides. …
  modern: As Jaṭāyu was exerting his prowess for Rāma's sake, Rāvaṇa took out his dagger and cut off his two wings, two legs, and two sides. …
3.50.12:
  dutt: Araṇya LII
  text: As she went on weeping with "O Rama," "O Lakshmana," Ravana—lord of Rakshasas—taking her, coursed through the sky.
  modern: As she went on weeping, "O Rāma," "O Lakṣmaṇa," Rāvaṇa, lord of the Rākṣasas, took her and coursed through the sky.
3.52.1:
  dutt: Araṇya LIV
  text: Carried away (by Ravana), Vaidehi, not finding any defender, saw five principal monkeys stationed on the top of a hill.
  modern: Carried away by Rāvaṇa, Vaidehī, not finding any defender, saw five principal monkeys stationed on the top of a hill.
3.52.2:
  dutt: Araṇya LIV
  text: Thereat, that lady of expansive eyes and surpassing charms, in the hope that they might convey the intelligence unto Rama, flung off in their midst her goldgleaming silken sheet, and elegant ornaments.
  modern: Then that lady of wide eyes and surpassing charm, hoping that they might carry word to Rāma, threw down in their midst her gold-gleaming silken sheet and her elegant ornaments.
3.52.11:
  dutt: Araṇya LIV
  text: And taking Sita on his lap, representing his own Death,—who endeavoured (to liberate herself), Ravana entered the city of Lanka.
  modern: Taking Sītā on his lap, she who was his own death in person, though she struggled to free herself, Rāvaṇa entered the city of Laṅkā.
3.55.1:
  dutt: Araṇya LVII
  text: Killing the Rakshasa, Maricha assuming shapes at will and ranging in the shape of a deer, Rama vended speedily his way.
  modern: Having killed the Rākṣasa Mārīca, who could take shapes at will and had been ranging in the form of a deer, Rāma went speedily on his way.
3.55.14:
  dutt: Araṇya LVII
  text: And, seeing that (Lakshmana) had come, leaving Sita in that solitary wood frequented by Rakshasas, his brother fell to reprimanding him. …
  modern: Seeing that Lakṣmaṇa had come, leaving Sītā in that solitary wood haunted by Rākṣasas, his brother began to reprimand him. …
3.57.21:
  dutt: Araṇya LIX
  text: I am not pleased with thee that hearing her harsh speech spoken in wrath, thou hast come hither, leaving Vaidehi behind.
  modern: I am not pleased with you that, hearing her harsh speech spoken in wrath, you came here, leaving Vaidehī behind.
3.57.22:
  dutt: Araṇya LIX
  text: Thou hast every way done wrong in not acting out my mandate in consequence of being urged by Sita, and under the influence of indignation.
  modern: You have done wrong in every way, in not carrying out my command because you were urged by Sītā and acted under the influence of indignation.
3.58.3:
  dutt: Araṇya LXI
  text: Beholding the hermitage and cottage desolate and the seats strewn here and there, Rama the son of Dacaratha looked around.
  modern: Seeing the hermitage and cottage desolate and the seats strewn here and there, Rāma, son of Daśaratha, looked around.
3.58.3+1:
  dutt: Araṇya LXII
  text: Not beholding Sita the virtuous-souled Rama, of mighty arms, having eyes resembling lotuses, beside himself with grief, lamented (in many a way).
  modern: Not seeing Sītā, the virtuous-souled Rāma, of mighty arms and with eyes like lotuses, beside himself with grief, lamented in many ways.
3.63.4:
  dutt: Araṇya LXVII
  text: Whereto Lakshmana replied saying unto the highly aggrieved Rama, "It is proper for thee to search this Janasthana filled with a multitude of Rakshasas and covered with diverse trees and creepers.
  modern: Lakṣmaṇa answered the deeply grieving Rāma, "It is right for you to search this Janasthāna, filled with a multitude of Rākṣasas and covered with various trees and creepers.
3.63.5:
  dutt: Araṇya LXVII
  text: Here are many strongholds in the midst of mountains, clefts of rocks, many caves and numerous cavities filled with various animals.
  modern: Here are many strongholds in the midst of mountains, clefts of rocks, and many caves and numerous cavities filled with various animals.
3.63.6:
  dutt: Araṇya LXVII
  text: Many are the abodes here belonging to the Kinnaras and Gandharbas.
  modern: Many are the abodes here belonging to the Kinnaras and Gandharvas.
3.63.7:
  dutt: Araṇya LXVII
  text: Do thou, along with me, search all these places.
  modern: Search all these places with me.
3.63.8:
  dutt: Araṇya LXVII
  text: Great men, of thy calibre, do remain unagitated even in the midst of difficulties like unto mountains never shaken by the velocity of the wind."
  modern: Great men like you remain unshaken even in the midst of difficulties, like mountains never shaken by the force of the wind."
3.63.9:
  dutt: Araṇya LXVII
  text: Hearing these words, Rama, enraged, fixing sharp and terrible arrows to his bow, began to range the forest with Lakshmana.
  modern: Hearing these words, Rāma, enraged, fixed sharp and terrible arrows to his bow and began to range the forest with Lakṣmaṇa.
3.63.10:
  dutt: Araṇya LXVII
  text: Thereupon he beheld, fallen on ground, having his person bathed in blood, the king of birds—Yatayu, resembling a mountain peak, and spake unto Lakshmana, saying "It is clear and beyond all doubt that Vaidehi hath been devoured by this Rakshasa, assuming the shape of a vulture and ranging the forest. …
  modern: Then he saw lying on the ground, his body bathed in blood, the king of birds, Jaṭāyu, who looked like a mountain peak, and he said to Lakṣmaṇa, "It is clear, beyond any doubt, that Vaidehī has been devoured by this Rākṣasa, who has taken the shape of a vulture and ranges the forest. …
3.64.10:
  dutt: Araṇya LXVIII
  text: O darling, myself being worn out that night-ranger, having sundered my wings, fled away with Sita to the southerly direction.
  modern: My dear, when I was worn out, that night-ranger cut off my wings and fled with Sītā to the south.
3.64.11:
  dutt: Araṇya LXVIII
  text: O Raghava, my life is about to expire, my eye-sight hath grown of mistaken perception, I see trees before me made of gold having hair resembling Ushira. …
  modern: Rāghava, my life is ebbing away and my sight is playing me false. I see golden trees in front of me, with hair like uśīra grass.
3.64.16:
  dutt: Araṇya LXVIII
  text: … Thereupon the king of birds gave up his dear life uttering only.—"Ravana is the son of Vishrava and brother to Vaishravana (the lord of wealth)."
  modern: … Then the king of birds gave up his dear life, saying only, "Rāvaṇa is the son of Viśravas and the brother of Vaiśravaṇa, the lord of wealth."
3.64.31:
  dutt: Araṇya LXVIII
  text: Saying this the virtuous-souled Rama, afflicted with sorrow, burned the body of the king of birds, placing it on the funeral pile, like unto his own kinsman.
  modern: Saying this, the virtuous-souled Rāma, afflicted with sorrow, burned the body of the king of birds, placing it on the funeral pile as if he were his own kinsman.
3.64.35:
  dutt: Araṇya LXVIII
  text: Afterwards repairing to the river Gadaveri the two princes offered water unto that kingly vulture.
  modern: Afterward the two princes went to the river Godāvarī and offered water to that king of vultures.
3.65.12:
  dutt: Araṇya LXIX
  text: Thereupon while they began to explore the entire forest with their prowess there arose a terrible sound as if breaking down the wood.
  modern: Then, as they began to search the whole forest with all their might, a terrible sound arose, as if the wood were being broken down.
3.65.21:
  dutt: Araṇya LXIX
  text: And proceeding a Krosa, they espied that fearful, grim-visaged, headless demon, hindering all creatures with its arms, terrible-looking and appearing like a kavanda from its very situation.
  modern: After going a krośa, they saw that fearful, grim-faced, headless demon, blocking all creatures with its arms, terrible to look at and looking like a kabandha from its very condition.
3.65.21+1:
  dutt: Araṇya LXX
  text: Hearing their conversation, the Rakshasa, inflamed with rage, widening its terrible mouth, prepared to devour them up.
  modern: Hearing them talk, the Rākṣasa, inflamed with rage, opened wide its terrible mouth and made ready to devour them.
3.66.5:
  dutt: Araṇya LXX
  text: Thereat Rama and Lakshmana, cognizant of time and place, pleased, sundered its arms off its shoulders with their daggers.
  modern: Then Rāma and Lakṣmaṇa, who knew the right time and place, gladly cut its arms off at the shoulders with their swords.
3.66.7:
  dutt: Araṇya LXX
  text: Having got its arms dissevered, the terrible-voiced, Kavandha, of huge arms,roaring like unto the muttering of clouds and resounding the heaven, earth and all the quarters, fell flat on the ground.
  modern: With its arms cut off, the terrible-voiced Kabandha, of huge arms, roaring like the rumble of clouds and filling heaven, earth, and all quarters with sound, fell flat on the ground.
3.66.13:
  dutt: Araṇya LXX
  text: Being thus addressed by Lakshmana with these goodly words, Kavandha, pleased, recollecting the words of Indra, bespake him,— …
  modern: 'So addressed by Lakṣmaṇa in these fine words, Kabandha, pleased, remembering what Indra had said, answered him: …'
3.66.14:
  dutt: Araṇya LXX
  text: … "O two best of men, ye are welcome! By my good luck it is that I do behold you. By my good fortune ye have dissevered my shoulders to-day.
  modern: "\"Best of men, you are welcome! It is my good luck that I see you. It is my good fortune that you have severed my shoulders today."
3.68.13:
  dutt: Araṇya LXXIII
  text: Regaining his pristine beauty and shining in grace and effulgence that Kavandha, who was on the sky, fixing his looks upon Rama, and pointing out unto him his way, said "Do thou make friends with (Sugriva)".
  modern: Regaining his former beauty and shining in grace and brilliance, Kabandha, who was in the sky, fixed his eyes on Rāma and, pointing out the way to him, said, "Make friends with Sugrīva."
3.69.2:
  dutt: Araṇya LXXIII
  text: … This is the way, O Rama, leading to the mount Rishyamuka, where stand, beautifying the West, … and many other trees. …
  modern: '… This is the way, O Rāma, to Mount Ṛśyamūka, where these trees stand, adorning the west: … and many other trees. …'
3.70.1:
  dutt: Araṇya LXXIV
  text: Thereupon Rama and Lakshmana, sons of a kingly father, passing along the way, pointed out by Kavandha, leading to the lake Pampa, proceeded towards the West.
  modern: Then Rāma and Lakṣmaṇa, sons of a king, went along the way pointed out by Kabandha, which led to the lake Pampā, and proceeded west.
3.70.3:
  dutt: Araṇya LXXIV
  text: Passing the night on the summit of a hill those two descendants of Raghu arrived at the western bank of Pampa and espied the pleasant asylum …
  modern: Passing the night on the summit of a hill, those two descendants of Raghu arrived at the western bank of Pampā and saw the pleasant hermitage …
3.71.19:
  dutt: Araṇya LXXV
  text: … It was filled with white and red lotuses and encircled with blossoming mangoe groves and resounding with the music of the peacocks.
  modern: … It was filled with white and red lotuses, encircled by blossoming mango groves, and resounding with the music of peacocks.
3.71.25:
  dutt: Araṇya LXXV
  text: … O best of men, do thou approach the chief of monkeys." Rama, having truth for his prowess, again spake unto Lakshmana, saying, …
  modern: '… Best of men, go to the chief of the monkeys." Rāma, whose prowess was truth, spoke again to Lakṣmaṇa: …'
3.71.25+1:
  dutt: Araṇya LXXV
  text: … "O Lakshmana, how shall I live without Sita, who have been deprived of my kingdom, who am poorly and have Sita for my life?"
  modern: … "Lakṣmaṇa, how can I live without Sītā, I who have lost my kingdom, who am wretched, and whose life is Sītā?"
4.1.1:
  dutt: Kiṣkindhā I
  text: 'Repairing with Lakshmana to the lake Pampa filled with red and white lotuses and fish Rama having his senses agitated began to lament.

    '
  modern: 'Rāma went with Lakṣmaṇa to the lake Pampā, which was full of red and white lotuses and fish. His senses were agitated, and he began to lament.

    '
4.1.1+1:
  dutt: Kiṣkindhā I
  text: 'O son of a king, what shall I speak unto Kaucalya in Ayodhya when she will ask me of her high-souled daughter-in-law’s welfare and whereabouts?

    '
  modern: 'O son of a king, what shall I say to Kausalyā in Ayodhyā, when she asks me about the welfare and whereabouts of her noble-souled daughter-in-law?

    '
4.1.1+2:
  dutt: Kiṣkindhā I
  text: 'Thereupon Lakshmana addressed unto the high-souled Rama who was thus bewailing like one helpless with the following pregnant and immutable words.

    '
  modern: 'Then Lakṣmaṇa spoke to the noble Rāma, who was lamenting like a helpless man, with these wise and unfailing words.

    '
4.1.1+3:
  dutt: Kiṣkindhā I
  text: 'Even the sinless persons lose their sense when they are afflicted with grief.

    '
  modern: 'Even sinless people lose their senses when grief afflicts them.

    '
4.1.1+4:
  dutt: Kiṣkindhā I
  text: 'And resorting to this energy only that we shall regain Janaki.

    '
  modern: 'By relying on energy alone we shall regain Jānakī.

    '
4.1.1+5:
  dutt: Kiṣkindhā I
  text: 'And leaving behind grief do thou forsake thy amorous madness."

    '
  modern: 'Leave your grief behind, and give up your amorous madness.

    '
4.1.47:
  dutt: Kiṣkindhā I
  text: 'Thereupon the high-souled Rama, stricken with grief passed along beholding the forest-land, fountains, caves and revolving aside (the pregnant words of Lakshmana).

    '
  modern: 'Then the noble Rāma, stricken with grief, passed along, looking at the forest land, the fountains and the caves, and turning over in his mind Lakṣmaṇa''s weighty words.

    '
4.1.47+1:
  dutt: Kiṣkindhā I
  text: 'Thereupon Rama, of unimaginable prowess, passed slowly by the pleasant and charming Pampa with banks girt with trees shaken by the wind.

    '
  modern: 'Then Rāma, of unimaginable prowess, passed slowly along the pleasant and charming Pampā, whose banks were girt with trees shaken by the wind.

    '
4.2.1:
  dutt: Kiṣkindhā II
  text: 'Beholding those two high-souled brothers Rama and Lakshmana, heroic and with great scimitars in their hands, Sugriva became terrified.

    '
  modern: 'When Sugrīva saw those two noble brothers, Rāma and Lakṣmaṇa, heroic, with great scimitars in their hands, he was terrified.

    '
4.3.3:
  dutt: Kiṣkindhā III
  text: 'Thereupon renouncing his monkey shape, the son of Maruta, not confidihg in them, assumed the semblance of a mendicant. Approaching them humbly, Hanuman paid obeisance unto them. And he eulogized them truly in words, sweet and pleasant.

    '
  modern: 'Then Hanumān, the son of Maruta, gave up his monkey shape, for he did not trust them, and took the form of a mendicant. He approached them humbly and paid homage to them. And he praised them truthfully, in sweet and pleasant words.

    '
4.3.18:
  dutt: Kiṣkindhā III
  text: 'A certain heroic and virtuous monkey-chief, by name Sugriva, hath been journeying on this earth, distressed at heart, being driven away by his brother.

    '
  modern: 'A certain heroic and virtuous monkey chief named Sugrīva, driven away by his brother, wanders the earth, distressed at heart.

    '
4.3.19:
  dutt: Kiṣkindhā III
  text: 'I have come here being despatched by that high-souled Sugriva—my name is Hanuman, the foremost of monkeys.

    '
  modern: 'I have come here, sent by that noble Sugrīva. My name is Hanumān, the foremost of monkeys.

    '
4.3.20:
  dutt: Kiṣkindhā III
  text: 'That virtuous-souled Sugriva desires to make friends with you. And know me to be his counsellor—a monkey, the son of Pavana, …

    '
  modern: 'That righteous Sugrīva wants to make friends with you. Know me as his counsellor, a monkey, the son of Pavana.

    '
4.3.23:
  dutt: Kiṣkindhā III
  text: 'Hearing those words, the effulgent Rama, with a delighted countenance, spake unto his younger brother, Lakshmana— sitting by him.

    '
  modern: 'Hearing those words, the radiant Rāma turned to his younger brother Lakṣmaṇa, who was sitting beside him, and spoke with a glad face.

    '
4.3.24:
  dutt: Kiṣkindhā III
  text: '"He is the counsellor of the high-souled Sugriva, the lord of monkeys and hath approached me, soliciting my friendship in his (Sugriva’s) favour.

    '
  modern: '"He is the counsellor of the noble Sugrīva, lord of the monkeys, and he has come to me asking for my friendship on Sugrīva''s behalf.

    '
4.3.25:
  dutt: Kiṣkindhā III
  text: 'Do thou welcome, with pleasant words, O Saumitri, this monkey—Sugriva’s minister, the subduer of foes, affectionate and skilled in speech.

    '
  modern: 'Welcome him, O Saumitri, with pleasant words, this monkey, Sugrīva''s minister, who subdues his foes, who is affectionate and skilled in speech.

    '
4.3.25+1:
  dutt: Kiṣkindhā III
  text: 'None can speak thus who hath not mastered the Rig-veda, borne well the Yajur-veda and acquainted himself thoroughly with the Shyam-veda.

    '
  modern: 'No one can speak like this who has not mastered the Ṛgveda, learned the Yajurveda well and become thoroughly acquainted with the Sāmaveda.

    '
4.3.25+2:
  dutt: Kiṣkindhā III
  text: 'Forsooth he hath studied well all the Grammars, for he hath not used a single inelegant word though he hath addressed me with a number of them.

    '
  modern: 'Surely he has studied all the grammars well, for he has not used a single faulty word, though he has said a great deal to me.

    '
4.4.6:
  dutt: Kiṣkindhā IV
  text: 'There was a king named Dagaratha. Possessed of effulgence, and attached unto righteousness, he, in consonance with his proper duties, for aye, governed the four orders. This one is his eldest son, named Rama, famous among men.

    '
  modern: 'There was a king named Daśaratha. Radiant and devoted to righteousness, he governed the four orders always, in keeping with his duties. This is his eldest son, named Rāma, famous among men.

    '
4.4.7:
  dutt: Kiṣkindhā IV
  text: '… He is the refuge of all creatures, and competent to carry out the injunctions of his father. The eldest son of Dacaratha, he is foremost of all his sons in merit.

    '
  modern: '… He is the refuge of all creatures and is able to carry out his father''s commands. As Daśaratha''s eldest son, he is the first of all his sons in merit.

    '
4.4.8:
  dutt: Kiṣkindhā IV
  text: 'Deprived of his kingdom, in company with myself, he hath come hither with the view of dwelling in this wood. And, O highly exalted one, this one of subdued senses is followed by his wife Sita even as at the decline of day the exceedingly effulgent Sun is followed by (his spouse) Splendour.

    '
  modern: 'Deprived of his kingdom, he has come here with me to live in this forest. And this self-controlled man, O exalted one, is followed by his wife Sītā, as the radiant Sun is followed at day''s end by Splendour.

    '
4.4.11:
  dutt: Kiṣkindhā IV
  text: '… he hath his wife carried off by a Rakshasa, wearing shapes at will. Nor have we yet (been able) to ascertain who is that Rakshasa that hath carried off his wife.

    '
  modern: '… his wife has been carried off by a Rākṣasa who takes any shape he likes. We have not yet found out who that Rākṣasa is who carried her off.

    '
4.5.2:
  dutt: Kiṣkindhā V
  text: '"O exceedingly wise one, this one that hath come here is Rama having truth for his prowess. This is Rama having truth for his prowess, in company with his brother, Lakshmana.

    '
  modern: '"O wise one, the man who has come here is Rāma, whose prowess is truth. This is Rāma, whose prowess is truth, with his brother Lakṣmaṇa.

    '
4.5.8:
  dutt: Kiṣkindhā V
  text: 'Hearing Hanuman’s words, Sugriva—lord of monkeys, becoming visible (at his will), gladly spake unto Raghava, "Sir, you are versed in morality, and bear love towards all.

    '
  modern: 'When Sugrīva, lord of the monkeys, heard Hanumān''s words, he made himself visible and spoke gladly to Rāghava: "Sir, you are versed in morality and you love all beings.

    '
4.5.9:
  dutt: Kiṣkindhā V
  text: (with 4.5.8)
4.5.10:
  dutt: Kiṣkindhā V
  text: (with 4.5.8)
4.5.11:
  dutt: Kiṣkindhā V
  text: 'The son of the wind-god hath faithfully described your virtues unto me. That you, O lord, are anxious to contract friendship with me who am a monkey does me honor and is my gain.

    '
  modern: 'The son of the wind-god has described your virtues to me faithfully. That you, O lord, want to make friends with me, a monkey, honours me and is my gain.

    '
4.5.12:
  dutt: Kiṣkindhā V
  text: 'If you relish friendship with me, do you take this stretched arm and my hand with yours,—and bind yourself fast with a vow."

    '
  modern: 'If you like the idea of friendship with me, take this outstretched hand of mine in yours, and bind yourself fast with a vow."

    '
4.5.13:
  dutt: Kiṣkindhā V
  text: 'Hearing these sweet words of Sugriva, (Rama) exceedingly delighted, pressed Sugriva’s hand with his. And contracting friendship with Sugriva, Rama experiencing great joy embraced him warmly.

    '
  modern: 'Hearing these sweet words of Sugrīva, Rāma was delighted and pressed Sugrīva''s hand in his. Having made friends with Sugrīva, Rāma was filled with joy and embraced him warmly.

    '
4.5.16:
  dutt: Kiṣkindhā V
  text: 'Then worshipping that flaming fire with flowers, he, well pleased, carefully placed it between them (Rama and Sugriva.) Then Sugriva and Raghava went round the fire; and (thus) they were fastened in friendship.

    '
  modern: 'Then Hanumān worshipped the flaming fire with flowers and, well pleased, carefully placed it between Rāma and Sugrīva. Then Sugrīva and Rāghava walked around the fire, and so they were bound in friendship.

    '
4.8.15:
  dutt: Kiṣkindhā V
  text: 'Next Sugriva, feeling high rapture, with his eyes expanded with joy, answered Rama blandly in sweet words, saying, …

    '
  modern: 'Next Sugrīva, filled with high rapture, his eyes wide with joy, answered Rāma gently in sweet words, saying …

    '
4.8.18:
  dutt: Kiṣkindhā V
  text: 'And, O exalted one, do thou dispell the fear of me, who am tormented with fear on account of Vali. And, O Kakutstha, it behoves thee so to act that I may not become subject to fear."

    '
  modern: 'And, O exalted one, dispel my fear of Vāli, for I am tormented by it. And, O Kākutstha, you must act so that I do not become subject to fear."

    '
4.8.20:
  dutt: Kiṣkindhā V
  text: 'Thus addressed, the powerful Kakutstha, knowing righteousness, and devoted to virtue, answered Sugriva, smiling, "O mighty monkey, that the outcome of amity is good offices I am well aware of. I will slay that captor of thy wife Vali.

    '
  modern: 'Thus addressed, the powerful Kākutstha, who knew righteousness and loved virtue, answered Sugrīva with a smile: "O mighty monkey, I know well that the fruit of friendship is good service. I will slay Vāli, the man who took your wife."

    '
4.6.1:
  dutt: Kiṣkindhā VI
  text: 'Sugriva well pleased again addressed Raghava, the son of Raghu, saying, "O Rama, this servant of thine, foremost of my counsellors, Hanuman, hath related (unto me), the reason of thy arrival in this lone forest.

    '
  modern: 'Sugrīva, well pleased, spoke again to Rāghava, the son of Raghu: "O Rāma, this servant of yours, Hanumān, the foremost of my counsellors, has told me why you have come to this lonely forest.

    '
4.6.2:
  dutt: Kiṣkindhā VI
  text: 'Thy wife, Maithili, daughter unto Janaka, separated from thee as well as the intelligent Lakshmana, and weeping (in consequence) was carried off by a Raksha.

    '
  modern: 'Your wife Maithilī, the daughter of Janaka, was carried off by a Rākṣasa while she wept, separated from you and from the wise Lakṣmaṇa.

    '
4.6.3:
  dutt: Kiṣkindhā VI
  text: 'Seeing for opportunities of doing mischief that Raksha, having slain Jatayu, hath caused unto thee the grief that comes of separation from one’s wife.

    '
  modern: 'Watching for his chance to do harm, that Rākṣasa, after killing Jaṭāyu, has brought you the grief of being parted from your wife.

    '
4.6.7:
  dutt: Kiṣkindhā VI
  text: 'From guess I find that it was doubtless Mithila’s daughter whom I saw when she was being carried away by that Raksha of terrific deeds.

    '
  modern: 'From a guess I find that it was surely Mithilā''s daughter whom I saw being carried away by that Rākṣasa of terrible deeds.

    '
4.6.8:
  dutt: Kiṣkindhā VI
  text: 'She was crying, Rama, Rama, Lakshmana, Lakshmana, and in the lap of Ravana she looked like the wife of the Snake-chief.

    '
  modern: 'She was crying, ''Rāma, Rāma, Lakṣmaṇa, Lakṣmaṇa,'' and in Rāvaṇa''s lap she looked like the wife of the Snake-chief.

    '
4.6.9:
  dutt: Kiṣkindhā VI
  text: 'Seeing me along with my four counsellors stationed at the hill, she dropped down her scarf and her ornaments.

    '
  modern: 'Seeing me with my four counsellors on the hill, she dropped her scarf and her ornaments.

    '
4.6.10:
  dutt: Kiṣkindhā VI
  text: 'All these, O Raghava, I have taken and kept (with me). I will bring them. It behoveth thee to recognise them."

    '
  modern: 'All these, O Rāghava, I took and kept. I will bring them. You should recognise them."

    '
4.6.13:
  dutt: Kiṣkindhā VI
  text: 'Then taking the scarf as well as the ornaments. "Look at this," (Saying this) the monkey held them before Rama.

    '
  modern: 'Then, taking the scarf and the ornaments, the monkey held them before Rāma, saying, "Look at this."

    '
4.6.17:
  dutt: Kiṣkindhā VI
  text: 'And seeing Sumitra’s son at his side, Rama shedding ceaseless tears, began to lament piteously, "O Lakshmana, behold this scarf and these ornaments which Vaidehi, while being carried away, let fall from her person to the earth.

    '
  modern: 'And seeing Sumitrā''s son at his side, Rāma, shedding ceaseless tears, began to lament piteously: "O Lakṣmaṇa, look at this scarf and these ornaments, which Vaidehī let fall from her body to the earth as she was being carried away.

    '
4.6.17+1:
  dutt: Kiṣkindhā VI
  text: 'Thus accosted, Lakshmana spoke, saying, "I do not know her bracelets; I do not know her ear-rings. But I know full well her bangles on account of my always bowing down unto her feet."

    '
  modern: "Thus addressed, Lakṣmaṇa said, \"I do not know her bracelets; I do not know her earrings. But I know her bangles well, because I always bowed down at her feet.\""
4.6.17+2:
  dutt: Kiṣkindhā VI
  text: 'Thereupon Raghava said these words unto Sugriva, "Tell me, O Sugriva, at what place didst thou see Sita, while she, dear unto me as life, was taken away by the fierce-looking Rakshasa?

    '
  modern: 'Then Rāghava said to Sugrīva, "Tell me, O Sugrīva, where did you see Sītā, who is as dear to me as life, being carried away by the fierce-looking Rākṣasa?

    '
4.6.20:
  dutt: Kiṣkindhā VI
  text: (with 4.6.17+2)
4.7.1:
  dutt: Kiṣkindhā VII
  text: 'Thus addressed by the aggrieved Rama, the monkey, Sugriva, his accents obstructed by vapour and his eyes filled with tears, said with joined hands, "I do not know the hidden abode of that exceedingly wicked Rakshasa,—nor do I know his heroism and prowess, or the lineage of that one sprung from a vicious race.

    '
  modern: 'Thus addressed by the grieving Rāma, the monkey Sugrīva, his voice choked and his eyes full of tears, said with joined hands, "I do not know the hidden dwelling of that thoroughly wicked Rākṣasa, nor his heroism and prowess, nor the family of that man born of an evil race.

    '
4.7.2:
  dutt: Kiṣkindhā VII
  text: (with 4.7.1)
4.7.3:
  dutt: Kiṣkindhā VII
  text: 'O vanquisher of foes, leave off sorrowing. I promise unto thee truly, I will exert so that thou mayst obtain Maithili.

    '
  modern: 'O vanquisher of foes, stop grieving. I promise you truly that I will strive so that you may win back Maithilī.

    '
4.8.18#2:
  dutt: Kiṣkindhā VIII
  text: '… And, O Raghava, my senses wildered, having been oppressed by Vali, and having incurred his enmity, I am afflicted with fear, and tormented with fright. O thou, that removest the fear of all creatures, it behoveth thee who am tormented by fear and am helpless, to extend thy favor unto me."

    '
  modern: '… And, O Rāghava, my senses are bewildered; Vāli has oppressed me and made me his enemy, and I am afflicted and tormented with fright. You who remove the fear of all creatures, you should show your favour to me, who am tormented by fear and helpless.

    '
4.8.19:
  dutt: Kiṣkindhā VIII
  text: 'Thus accosted, that ever energetic one knowing righteousness and devoted to it, Kakutstha, smiling, said unto Sugriva, "Benefits make friends, while injuries denote enemies.

    '
  modern: 'Thus addressed, Kākutstha, ever energetic, who knew righteousness and loved it, smiled and said to Sugrīva, "Benefits make friends, while injuries mark enemies.

    '
4.8.20#2:
  dutt: Kiṣkindhā VIII
  text: 'Even this very day will I slay him that hath deprived thee of thy wife.

    '
  modern: 'Even this very day I will slay the man who deprived you of your wife.

    '
4.10.29:
  dutt: Kiṣkindhā X
  text: 'By what I myself feel, I see that thou hast sunk in a sea of sorrow. But I will deliver thee; and thou shalt attain both thy wife as well as this kingdom.

    '
  modern: 'From what I feel myself, I see that you have sunk in a sea of sorrow. But I will bring you out of it, and you will win both your wife and this kingdom.

    '
4.11.1:
  dutt: Kiṣkindhā XI
  text: 'Hearing Rama’s words capable of enhancing joy and manliness, Sugriva highly honored the former and extolled him, …

    '
  modern: 'Hearing Rāma''s words, which raised his joy and courage, Sugrīva honoured him highly and praised him, …

    '
4.14.1:
  dutt: Kiṣkindhā XIV
  text: 'They all, repairing quickly unto Kishkindha, Vali’s capital, stood waiting in the dense forest, hiding themselves behind the trees.

    '
  modern: 'They all hurried to Kiṣkindhā, Vāli''s capital, and waited in the dense forest, hiding behind the trees.

    '
4.14.10:
  dutt: Kiṣkindhā XIV
  text: 'Do thou show me, O Sugriva, thy enemy, in the guise of a brother. Wounded (by my shaft) Vali shall roll in the dust in the forest.

    '
  modern: 'Show me, O Sugrīva, your enemy who wears the guise of a brother. Wounded by my shaft, Vāli will roll in the dust of the forest.

    '
4.15.2:
  dutt: Kiṣkindhā XV
  text: 'And hearing that mighty roar, shaking the whole world of creation, his pride was in no time, crushed and he attained an excess of ire.

    '
  modern: 'And hearing that mighty roar, which shook the whole world of creatures, his pride was crushed in an instant and he was overcome with rage.

    '
4.16.11:
  dutt: Kiṣkindhā XVI
  text: 'After Tara had departed to her own quarters with her female companions, he issued out of the city sighing like an enraged serpent.

    '
  modern: 'After Tārā had gone to her own quarters with her women, he came out of the city, sighing like an enraged serpent.

    '
4.16.11+1:
  dutt: Kiṣkindhā XVI
  text: 'Thereupon there took place a mighty conflict between them like unto Vitra and Vasava by means of trees with branches, hills, nails, hard as thunderbolts, fists, knees, legs and arms.

    '
  modern: 'Then a mighty fight took place between them, like that between Vṛtra and Vāsava, with branching trees, hills, nails as hard as thunderbolts, fists, knees, legs and arms.

    '
4.16.11+2:
  dutt: Kiṣkindhā XVI
  text: 'And Raghava again and again beheld the weak points of that monkey chief Sugriva, losing his strength by and by. And beholding that chief of monkeys greatly distressed, …

    '
  modern: 'And Rāghava saw again and again the weak points of the monkey chief Sugrīva, who was gradually losing strength. Seeing that chief of the monkeys greatly distressed, …

    '
4.16.25:
  dutt: Kiṣkindhā XVI
  text: 'And fixing on his bow an arrow resembling a serpent, … And a mighty shaft, like onto thunderbolt and resembling flaming fire, being hurled by Rama, alighted on the breast of Vali.

    '
  modern: 'Fixing on his bow an arrow like a serpent, … And a mighty shaft, like a thunderbolt and like flaming fire, was hurled by Rāma and struck Vāli on the breast.

    '
4.16.25+1:
  dutt: Kiṣkindhā XVI
  text: 'Being wounded by that shaft that highly powerful chief of monkeys, gifted with prowess fell down on the earth.

    '
  modern: 'Wounded by that shaft, the powerful chief of the monkeys, so strong in prowess, fell to the earth.

    '
4.17.9:
  dutt: Kiṣkindhā XVII
  text: '… thus struck down to the earth, resembling a flameless fire in the field of battle, like unto Yayati, slipped from the abode of the celestials on the wane of his peity, …

    '
  modern: '… was struck down on the ground like a fire that has gone out on the battlefield, like Yayāti fallen from the world of the gods when his merit has run out, …

    '
4.17.12:
  dutt: Kiṣkindhā XVII
  text: 'And beholding that highly powerful Raghava and Lakshmana, Vali addressed them with the following bold and pious words.

    '
  modern: 'And seeing the powerful Rāghava and Lakṣmaṇa, Vāli spoke to them these bold and righteous words.

    '
4.17.14:
  dutt: Kiṣkindhā XVII
  text: 'People speak highly of thee, O Rama, on this earth, describing thee as coming of a high family, gifted with manliness and prowess, ever engaged in the welfare of thy subjects, compassionate, energetic, of firm resolution and knowing time.

    '
  modern: 'People speak highly of you, O Rāma, on this earth, describing you as of high family, with manliness and prowess, always engaged in the welfare of your subjects, compassionate, energetic, firm in resolve and knowing the right time.

    '
4.17.13:
  dutt: Kiṣkindhā XVII
  text: '… What merit hast thou reaped by destroying me, who was not engaged in fight with thee? I was exercised with ire, being engaged in conflict (with another person) and for thee I have met with destruction.

    '
  modern: "… What merit have you gained by destroying me, when I was not fighting with you? I was angry, engaged in battle with another man, and it is because of you that I have met my death."
4.17.14#2:
  dutt: Kiṣkindhā XVII
  text: (with 4.17.14)
4.17.15:
  dutt: Kiṣkindhā XVII
  text: (with 4.17.14)
4.17.25:
  dutt: Kiṣkindhā XVII
  text: 'Chastisement, charity, forgiveness, piety, truthfulness firm- ness, prowess and the punishment of the iniquitous are the virtues of a king, O prince.

    '
  modern: 'Chastisement, charity, forgiveness, piety, truthfulness, firmness, prowess and the punishment of the wicked are the virtues of a king, O prince.

    '
4.17.43:
  dutt: Kiṣkindhā XVII
  text: '… It is perfectly proper that Sugriva shall inherit my kingdom on my ascension to heaven. And it is equally improper that I have been viciously killed by thee in the battle.

    '
  modern: '… It is perfectly proper that Sugrīva should inherit my kingdom when I go to heaven. And it is equally improper that you have killed me by foul means in battle.

    '
4.17.44:
  dutt: Kiṣkindhā XVII
  text: 'Every one in time meets with death and hence there is nothing to be sorry for me. But do thou think of a proper reply thou shalt give to the people (when asked about the cause of my destruction)."

    '
  modern: 'Everyone meets death in time, so there is nothing to grieve for in my case. But think of a proper answer to give the people when they ask about the cause of my death."

    '
4.18.4:
  dutt: Kiṣkindhā XVIII
  text: 'Why dost thou purpose to address me thus out of fickleness, consequent upon thy monkeyhood not asking thy wise elders recognized by the preceptors?

    '
  modern: 'Why do you speak to me like this, out of the fickleness of your monkey nature, without asking your wise elders, whom the teachers recognise?

    '
4.18.5:
  dutt: Kiṣkindhā XVIII
  text: (with 4.18.4)
4.18.6:
  dutt: Kiṣkindhā XVIII
  text: 'This land, abounding in hills and woods, belongs to the Ikswakus. Along with it was conferred on them the power of administering favour and chastisement unto beasts, birds and human beings.

    '
  modern: 'This land, with its hills and woods, belongs to the Ikṣvākus. With it they were given the power to show favour and to chastise beasts, birds and human beings.

    '
4.18.7:
  dutt: Kiṣkindhā XVIII
  text: 'The upright, virtuous and truthful king Bharata, cognizant of virtue, knowledge and passion and ever engaged in adminstering favour and punishment, governs this kingdom.

    '
  modern: 'The upright, virtuous and truthful king Bharata, who knows virtue, wealth and desire, and is always engaged in showing favour and punishing, governs this kingdom.

    '
4.18.9:
  dutt: Kiṣkindhā XVIII
  text: 'Ourselves and other kings, being commanded by him to practise piety, have been journeying in this wide world desirous of multiplying virtue.

    '
  modern: 'We and other kings, commanded by him to practise righteousness, travel this wide world, wishing to increase virtue.

    '
4.18.10:
  dutt: Kiṣkindhā XVIII
  text: 'That foremost of monarchs, Bharata— lover of virtue, governing this entire earth, who dares perpetrate an iniquity?

    '
  modern: 'When Bharata, that foremost of kings, a lover of virtue, governs the whole earth, who would dare to commit an injustice?

    '
4.18.11:
  dutt: Kiṣkindhā XVIII
  text: 'Stationed in the excellent virtue of our own and placing Bharata’ s commandments on our heads, we shall consider how we shall punish them who go astray (from the path of virtue).

    '
  modern: 'Standing firm in our own excellent duty and placing Bharata''s commands on our heads, we consider how to punish those who go astray from the path of virtue.

    '
4.18.13:
  dutt: Kiṣkindhā XVIII
  text: 'The elder brother, father, and the instructor—these three should always be regarded in the light of a father if they tread the paths of virtue and morality.

    '
  modern: 'The elder brother, the father and the teacher: these three should always be regarded as fathers, if they follow the paths of virtue and morality.

    '
4.18.14:
  dutt: Kiṣkindhā XVIII
  text: 'A younger brother, a son and an accomplished follower should always be regarded as sons. And virtue is always at the bottom of all such considerations.

    '
  modern: 'A younger brother, a son and a gifted pupil should always be regarded as sons. And virtue is always the basis of all such considerations.

    '
4.18.17:
  dutt: Kiṣkindhā XVIII
  text: 'I do fairly speak unto thee that it is not anger only that has led me to bring about thy destruction.

    '
  modern: 'I tell you plainly that it is not anger alone that led me to bring about your death.

    '
4.18.18:
  dutt: Kiṣkindhā XVIII
  text: 'Do thou consider why I have killed thee— thou hast ravished thy brother’s wife renouncing that ever-existing virtue.

    '
  modern: 'Consider why I killed you: you gave up that ancient virtue and ravished your brother''s wife.

    '
4.18.19:
  dutt: Kiṣkindhā XVIII
  text: 'Thou, the perpetrator of many evil deeds, hast got by Ruma, the wife of thy brother —the high-souled Sugriva.

    '
  modern: 'You, who have done many evil deeds, took Rumā, the wife of your brother, the noble Sugrīva.

    '
  departs: The Sanskrit says Vālin lives lustfully with Rumā, the wife of Sugrīva, who is alive and who stands to him as a daughter-in-law.
4.18.20:
  dutt: Kiṣkindhā XVIII
  text: 'O monkey, thou hast thus violated the path of virtue. And thus I have punished thee who hast ravished thy elder brother’s spouse.

    '
  modern: 'O monkey, you have thus broken the path of virtue. And so I have punished you, who ravished the wife of your elder brother.

    '
4.18.26:
  dutt: Kiṣkindhā XVIII
  text: 'Like unto Lakshmana, I have contracted friendship with Sugriva. And with a view to regain his wife and kingdom, he resolved to engage in my well-being. …

    '
  modern: 'Like Lakṣmaṇa, I have made friendship with Sugrīva. To regain his wife and kingdom, he resolved to work for my good. …

    '
4.18.28:
  dutt: Kiṣkindhā XVIII
  text: 'For these causes of very great moment, favoured by virtue, I have administered unto thee this condign punishment. Do thou now approve it.

    '
  modern: 'For these very weighty reasons, which accord with virtue, I have given you this deserved punishment. Now approve it.

    '
4.18.28+1:
  dutt: Kiṣkindhā XVIII
  text: 'Hearken, O best of monkeys, there is another argument (for thy destruction); and hearing which, O great hero, it behoveth thee to renounce thy ire.

    '
  modern: 'Hear, O best of monkeys, there is another argument for your death, and when you hear it, O great hero, you should give up your anger.

    '
4.18.36:
  dutt: Kiṣkindhā XVIII
  text: 'And even many royal ascetics, versed in religious lore, go a-hunting; and hence thou hast been killed by me with a shaft, O monkey, in the conflict. And I am justified in killing thee, whether thou dost fight or not since thou art a monkey.

    '
  modern: 'Even many royal ascetics, learned in the sacred law, go hunting, and so you have been killed by me with an arrow, O monkey, in battle. And I am justified in killing you, whether you fight or not, since you are a monkey.

    '
4.18.37:
  dutt: Kiṣkindhā XVIII
  text: 'There is no doubt, O best of monkeys, that the monarchs confer life and piety auspicious and hard to attain.

    '
  modern: 'There is no doubt, O best of monkeys, that kings give life and virtue, which are auspicious and hard to obtain.

    '
4.18.38:
  dutt: Kiṣkindhā XVIII
  text: 'It doth not therefore behove any one to injure them, to blame them and to use improper words by them—since they are the celestials ranging on this earth under the semblance of man.

    '
  modern: 'So no one should injure them, blame them or speak improperly to them, since they are gods moving on this earth in human form.

    '
4.18.39:
  dutt: Kiṣkindhā XVIII
  text: 'Not knowing virtue and growing angry why dost thou blame me who am following the religion of my forefathers?"

    '
  modern: 'You do not know virtue, and in your anger you blame me, who follow the religion of my forefathers?"

    '
4.18.40:
  dutt: Kiṣkindhā XVIII
  text: 'Being thus accosted by Rama, Vali, greatly mortified and informed of the principle of religion, observed no delinquency in Raghava.

    '
  modern: 'Thus addressed by Rāma, Vāli was greatly mortified, but, having learned the principle of religion, he found no fault in Rāghava.

    '
4.18.40+1:
  dutt: Kiṣkindhā XVIII
  text: (with 4.18.40)
4.18.40#2:
  dutt: Kiṣkindhā XVIII
  text: 'Thereupon that lord of monkeys spake unto Rama, with folded hands, …

    '
  modern: 'Then that lord of the monkeys said to Rāma, with folded hands, …

    '
4.18.41:
  dutt: Kiṣkindhā XVIII
  text: 'There is not the least doubt, O best of men, in all that thou hast said. An inferior person can by no means address his superior improperly.

    '
  modern: 'There is not the least doubt, O best of men, about all that you have said. An inferior can never rightly speak against his superior.

    '
4.18.42:
  dutt: Kiṣkindhā XVIII
  text: 'It doth not behove thee, O Raghava, therefore to blame me for those unpleasant words which I used towards thee, out of foolishness.

    '
  modern: 'So, O Rāghava, you should not blame me for the unpleasant words I spoke to you out of foolishness.

    '
4.18.43:
  dutt: Kiṣkindhā XVIII
  text: 'Thou hast acquired a practical mastery over the principles of religion and art ever engaged in the welfare of thy subjects. Thy eternal power of ascertaining the crime and meeting its condign punishment is perfectly clear.

    '
  modern: 'You have a practical mastery of the principles of religion and are always engaged in the welfare of your subjects. Your lasting power to determine a crime and to give it its due punishment is perfectly clear.

    '
4.18.48:
  dutt: Kiṣkindhā XVIII
  text: 'Do thou regard favourably Sugriva and Angada. Thou art their protector, and chastiser punishing them for their sins.

    '
  modern: 'Show favour to Sugrīva and Aṅgada. You are their protector, and you punish them for their sins.

    '
4.18.49:
  dutt: Kiṣkindhā XVIII
  text: 'O king, O lord of men, it behoveth thee to regard Sugriva and Angada in the same light in which thou regardest Bharata and Lakshmana.

    '
  modern: 'O king, O lord of men, you should regard Sugrīva and Aṅgada in the same light in which you regard Bharata and Lakṣmaṇa.

    '
4.18.50:
  dutt: Kiṣkindhā XVIII
  text: 'It behoveth thee to so arrange as Sugriva may not disregard that chaste Tara who is blameable for my folly only.

    '
  modern: 'You should arrange matters so that Sugrīva does not disregard the chaste Tārā, who is to blame only for my folly.

    '
4.22.2:
  dutt: Kiṣkindhā XXII
  text: 'Welcoming that lord of monkeys with clear accents, Vali addressed him affectionately saying:—"O Sugriva, do thou not take to thy heart the improper conduct I have shown towards thee, being attracted by inevitable foolishness, subject as I was to sin.

    '
  modern: 'Welcoming that lord of the monkeys in clear tones, Vāli spoke to him affectionately: "O Sugrīva, do not take to heart the improper conduct I showed you, drawn on by inevitable folly, as I was subject to sin.

    '
4.22.3:
  dutt: Kiṣkindhā XXII
  text: (with 4.22.2)
4.22.4:
  dutt: Kiṣkindhā XXII
  text: 'Methinks, O brother, it is not our fortune to enjoy at the same time the double bliss of fraternal affection and the enjoyment of kingdom, or else why has it happened otherwise?

    '
  modern: 'I think, brother, that it was not our fortune to enjoy together the double bliss of brotherly love and of the kingdom, or why else has it turned out otherwise?

    '
4.22.5:
  dutt: Kiṣkindhā XXII
  text: 'Do thou acquire to-day this kingdom of the forest-ranges and know me as one who hath departed to the abode of Death. …

    '
  modern: 'Take this kingdom of the forest ranges today, and know me as one who has departed to the abode of Death. …

    '
4.22.7:
  dutt: Kiṣkindhā XXII
  text: 'It behoveth thee, O hero, O king, to perform what I shall speak unto thee in this plight, however difficult it might be.

    '
  modern: 'You should do, O hero, O king, what I now tell you in this plight, however hard it may be.

    '
4.22.24:
  dutt: Kiṣkindhā XXII
  text: 'After he had said this, his eyes became expanded, his teeth were opened and his appearance became ghastly. And greatly pained by shafts he breathed his last.

    '
  modern: 'After he had said this, his eyes opened wide, his teeth were bared and his look became ghastly. And, sorely pained by the arrows, he breathed his last.

    '
4.24.22:
  dutt: Kiṣkindhā XXV
  text: 'Thereupon Sugriva, along with Angada, placing Vali on the conveyance, began to bewail.

    '
  modern: 'Then Sugrīva, with Aṅgada, placed Vāli on the bier and began to lament.

    '
4.24.42:
  dutt: Kiṣkindhā XXV
  text: 'Having duly cremated Vali’s body,the foremost of monkeys arrived at a river of auspicious water with a view to perform the watery ceremony.

    '
  modern: 'Having duly cremated Vāli''s body, the foremost of the monkeys came to a river of auspicious water to perform the water rite.

    '
4.24.43:
  dutt: Kiṣkindhā XXV
  text: 'And all these monkeys along with Sugriva and Tara, placing Angada before them, sprinkled water.

    '
  modern: 'And all those monkeys, with Sugrīva and Tārā, placed Aṅgada before them and sprinkled water.

    '
4.25.3:
  dutt: Kiṣkindhā XXVI
  text: 'Thereupon Hanuman, the son of Marut, resembling a golden hill and having a countenance resembling the rising Sun, spake with folded hands, saying:—"By thy assistance, O Kakuthstha, O lord, this great ancestral kingdom of the highly powerful monkeys, having sharpened teeth, incapable of being acquired by the high-souled ones, hath been attained to (by Sugriva).

    '
  modern: 'Then Hanumān, the son of Marut, who resembled a golden hill and had a face like the rising sun, spoke with folded hands: "By your help, O Kākutstha, O lord, Sugrīva has regained this great ancestral kingdom of the powerful, sharp-toothed monkeys, which the noble ones could not obtain.

    '
4.25.4:
  dutt: Kiṣkindhā XXVI
  text: (with 4.25.3)
4.25.8:
  dutt: Kiṣkindhā XXVI
  text: 'Being thus accosted by Hanuman, the highly intelligent Raghava, skilled in speech and the slayer of foes, replied:— …

    '
  modern: 'Thus addressed by Hanumān, the wise Rāghava, skilled in speech and slayer of foes, replied: …

    '
4.25.10:
  dutt: Kiṣkindhā XXVI
  text: 'Let Sugriva, the foremost of monkeys, enter this magnificent celestial cave and do ye all instal him speedily on the throne."

    '
  modern: 'Let Sugrīva, the foremost of the monkeys, enter this magnificent divine cave, and all of you install him quickly on the throne."

    '
4.25.11:
  dutt: Kiṣkindhā XXVI
  text: 'Having thus addressed Hanuman, Rama spake unto Sugriva, saying:—"Conversant with customs as thou art, do thou instal this generous and heroic Angada, gifted with prowess and honoring customs, as the heir-apparent of the throne.

    '
  modern: 'Having spoken thus to Hanumān, Rāma said to Sugrīva: "You know the customs. Install this generous and heroic Aṅgada, strong and respectful of custom, as heir apparent to the throne.

    '
4.25.11+1:
  dutt: Kiṣkindhā XXVI
  text: 'This brave and eldest son of thy elder brother— Angada, is truly worthy of the heir-apparentship.

    '
  modern: 'This brave Aṅgada, the eldest son of your elder brother, is truly worthy of the heir apparent''s place.

    '
4.25.12:
  dutt: Kiṣkindhā XXVI
  text: 'O gentle one, this month of Srabana, which is the first of those four months which make up the rainy season, hath set in and this is not the time therefore to institute any enquiry about Sita.

    '
  modern: 'O gentle one, the month of Śrāvaṇa, the first of the four months that make up the rainy season, has set in, and so this is not the time to look for Sītā.

    '
4.25.13:
  dutt: Kiṣkindhā XXVI
  text: 'Do thou therefore enter thy auspicious city and I shall live in this mountain along with Lakshmana.

    '
  modern: 'So enter your auspicious city, and I shall live on this mountain with Lakṣmaṇa.

    '
4.25.14:
  dutt: Kiṣkindhā XXVI
  text: 'Pleasant indeed is this mountain cave, spacious, filled with air, water and many lotuses.

    '
  modern: 'This mountain cave is pleasant, spacious, full of air and water and many lotuses.

    '
4.25.15:
  dutt: Kiṣkindhā XXVI
  text: 'Thou shalt engage in endeavours to bring about the destruction of Ravana, after Kartika sets in. This is not the proper time, O gentle one, and do thou enter thy own city. And being installed on the throne do thou enhance the joy of thy friends."

    '
  modern: 'When Kārtika begins, you shall strive to destroy Rāvaṇa. This is not the proper time, O gentle one, so enter your own city. And when you are installed on the throne, gladden your friends."

    '
4.26.1:
  dutt: Kiṣkindhā XXVII
  text: 'On Sugriva being installed and the monkeys entering the cave, Rama, along with his younger brother, got at the Prasrabana hill, …

    '
  modern: 'When Sugrīva had been installed and the monkeys had entered the cave, Rāma and his younger brother came to the hill Prasravaṇa, …

    '
4.29.2:
  dutt: Kiṣkindhā XXIX
  text: 'Beholding the clear welkin, void of clouds and lightnings, filled with Sarasas and sprinkled with the charming rays of the Moon, …

    '
  modern: 'Seeing the clear sky, free of clouds and lightning, full of Sārasa birds and sprinkled with the charming rays of the Moon, …

    '
4.39.3:
  dutt: Kiṣkindhā XL
  text: 'And in company with many thousands and innumerable ones that have shewn their ability in many a field, have come monkeys dreadful, and resembling Daityas and Danavas.

    '
  modern: 'Together with many thousands of innumerable ones who have shown their ability in many a field, there have come monkeys, dreadful and like Daityas and Dānavas.

    '
4.39.6:
  dutt: Kiṣkindhā XL
  text: 'All abide by thy command—all are intent upon the welfare of their master, and, O subduer of foes, they are competent to bring about thy end.

    '
  modern: 'All abide by your command; all are intent on the welfare of their master, and, O subduer of foes, they are able to bring about your end."

    '
4.39.9:
  dutt: Kiṣkindhā XL
  text: 'When Sugriva had spoken thus, Dacaratha’s son, Rama, embracing him with his arms, said, "O placid one, do thou learn whether Videha’s daughter is alive or not; as well as ascertain the country, where, O thou endowed with eminent wisdom, liveth Ravana.

    '
  modern: 'When Sugrīva had spoken thus, Rāma, the son of Daśaratha, embraced him with his arms and said: "O placid one, find out whether Videha''s daughter is alive or not, and learn the country where Rāvaṇa lives, O you of eminent wisdom.

    '
4.39.10:
  dutt: Kiṣkindhā XL
  text: (with 4.39.9)
4.39.11:
  dutt: Kiṣkindhā XL
  text: 'Having come at Vaidehi and Ravana’s abode, shall I then appoint the time along with thee.

    '
  modern: 'When I have found Vaidehī and Rāvaṇa''s abode, I shall then fix the time with you.

    '
4.39.12:
  dutt: Kiṣkindhā XL
  text: 'O lord of monkeys, I am not the master in this matter, nor Lakshmana: thou art the cause of this undertaking, as well as, O monarch of monkeys, the lord.

    '
  modern: 'O lord of monkeys, I am not the master in this matter, nor is Lakṣmaṇa. You are the cause of this undertaking, and, O monarch of monkeys, its lord.

    '
4.39.13:
  dutt: Kiṣkindhā XL
  text: 'Do thou therefore, O lord, command these as to what is to be done by them in my behalf. O hero, thou certainly knowest my business.

    '
  modern: 'So, O lord, command these monkeys as to what they are to do on my behalf. O hero, you surely know my business.

    '
4.39.15:
  dutt: Kiṣkindhā XL
  text: 'Thus addressed, Sugriva in presence of Rama and the intelligent Lakshmana, said unto a leader of herds and lord of apes, named Vinata, having the splendour of a hill, blazing and emitting sounds as those of clouds, …

    '
  modern: 'Thus addressed, Sugrīva, in the presence of Rāma and the wise Lakṣmaṇa, said to a leader of herds and lord of apes named Vinata, who had the splendour of a hill and a voice like thunder: …

    '
4.39.61:
  dutt: Kiṣkindhā XL
  text: 'Meeting with Vaidehi and (arriving at) Ravana’s mansion, do ye, having reached the Rising hill, turn back, when it shall be a full month. Do not stay longer than a month.

    '
  modern: "When you have found Vaidehī and Rāvaṇa's mansion, reach the Rising hill and turn back when a full month has passed. Do not stay longer than a month."
4.42.5:
  dutt: Kiṣkindhā XLII
  text: 'Having requited the good that hath been done to us, we shall attain our end.

    '
  modern: 'Having repaid the good that has been done to us, we shall attain our end.

    '
4.43.6:
  dutt: Kiṣkindhā XLIV
  text: 'Even in thee, O thou versed in policy, are strength, and wit, and courage, and policy, and conduct in consonance with season and place."

    '
  modern: 'In you, O man of policy, are strength, wit, courage and policy, and conduct suited to season and place."

    '
4.43.7:
  dutt: Kiṣkindhā XLIV
  text: 'Thereat, understanding that success in the task depended upon Hanuman, and also knowing what Hanuman was, Raghava reflected,— …

    '
  modern: 'Then Rāghava, understanding that success in the task depended on Hanumān, and knowing what Hanumān was, reflected: …

    '
4.43.11:
  dutt: Kiṣkindhā XLIV
  text: 'And well pleased, that subduer of enemies handed to Hanuman a ring inscribed with his name, as a sign unto Ihe king’s daughter.

    '
  modern: 'Well pleased, that subduer of enemies handed Hanumān a ring inscribed with his name, as a sign for the king''s daughter.

    '
4.43.14:
  dutt: Kiṣkindhā XLIV
  text: 'Thereupon, taking that (ring), and raising his joined palms to his head, that foremost and best of monkeys, saluting (Rama’s) feet, went away.

    '
  modern: 'Then Hanumān, the best of the monkeys, took the ring, raised his joined palms to his head, saluted Rāma''s feet and went away.

    '
4.46.1:
  dutt: Kiṣkindhā XLVII
  text: 'The principal monkeys, having been ordered by the monkey-king, speedily went in all directions to their destinations for the purpose of seeing Vaidehi.

    '
  modern: 'The principal monkeys, ordered by the monkey king, went quickly in all directions to their destinations to look for Vaidehī.

    '
4.48.22:
  dutt: Kiṣkindhā XLVIII
  text: 'The monkey Hanuman in company with Tara and Angada swiftly set out for the quarter assigned by Sugriva. … he explored the caves and woods of Vindhya; …

    '
  modern: 'The monkey Hanumān, with Tārā and Aṅgada, set out swiftly for the quarter Sugrīva had assigned. … he explored the caves and woods of the Vindhya, …

    '
4.49.3:
  dutt: Kiṣkindhā LIII
  text: 'Exploring the mountain fastness of Maya, they spent the month that had been set by the king.

    '
  modern: 'Exploring Maya''s mountain fastness, they spent the month that the king had set.

    '
4.52.16:
  dutt: Kiṣkindhā LIII
  text: 'Then sitting down at the foot of the Vindhya mountain, containing blossoming trees, at that time those high-souled ones indulged in reflections. …

    '
  modern: 'Then, sitting at the foot of the Vindhya mountain, with its blossoming trees, those noble ones fell to brooding. …

    '
4.52.16+1:
  dutt: Kiṣkindhā LIII
  text: 'While we sojourned in the cave, a full month had passed away, ye monkeys. Why do you not understand this? We set out, engaging that our term of search should reach no further than the end of Kartika; but that hath expired.

    '
  modern: 'While we stayed in the cave, a full month passed, O monkeys. Do you not see this? We set out, promising that our term of search would reach no further than the end of Kārtika, but that has expired.

    '
4.52.16+2:
  dutt: Kiṣkindhā LIII
  text: 'Who, having been unsuccessful in doing the mandate of the king of monkeys, enjoyeth ease?

    '
  modern: 'Who, having failed to carry out the king of the monkeys'' order, can enjoy ease?

    '
4.57.1:
  dutt: Kiṣkindhā LVIII
  text: 'When the monkeys, whose lives had well nigh departed out of them, had spoken these piteous words, the vulture, in solemn accents, with tears in his eyes, said unto the monkeys, …

    '
  modern: 'When the monkeys, whose lives had almost left them, had spoken these piteous words, the vulture, in solemn tones, with tears in his eyes, said to them: …

    '
4.57.15:
  dutt: Kiṣkindhā LVIII
  text: 'I have seen a youthful and beautiful female, adorned with all ornaments, carried away by the wicked Ravana,—the lady (all the while) crying, ‘O Rama!’ ‘O Rama!’ ‘O Lakshmana!’

    '
  modern: 'I saw a young and beautiful woman, adorned with all ornaments, carried away by the wicked Rāvaṇa. She was crying, ''O Rāma! O Rāma! O Lakṣmaṇa!''

    '
4.57.16:
  dutt: Kiṣkindhā LVIII
  text: 'And taking her ornaments from her person, she was throwing them on the ground.

    '
  modern: 'And taking her ornaments from her body, she was throwing them on the ground.

    '
4.57.18:
  dutt: Kiṣkindhā LVIII
  text: 'From your relation of Rama, I conclude that she must be Sita. Now listen to me as I tell you about the abode of that Rakshasa.

    '
  modern: 'From your account of Rāma, I conclude that she must be Sītā. Now listen to me as I tell you about that Rākṣasa''s abode.

    '
4.57.19:
  dutt: Kiṣkindhā LVIII
  text: 'Son unto Vicravana and brother unto Vaicravana, the Rakshasa named Ravana resides in the city of Lanka.

    '
  modern: 'The Rākṣasa named Rāvaṇa, son of Viśravas and brother of Vaiśravaṇa, lives in the city of Laṅkā.

    '
4.57.20:
  dutt: Kiṣkindhā LVIII
  text: 'And the lovely city of Lanka, reared by Vicwakarma, lieth a full hundred yojanas hence on an island in the sea; …

    '
  modern: 'And the lovely city of Laṅkā, built by Viśvakarman, lies a full hundred yojanas from here, on an island in the sea. …

    '
4.57.21:
  dutt: Kiṣkindhā LVIII
  text: 'There stayeth Vaidehi, forlorn and clad in a silken cloth,—confined in the inner apartment of Ravana, and carefully guarded by Rakshasis. …

    '
  modern: 'There lives Vaidehī, forlorn and dressed in a silk cloth, confined in Rāvaṇa''s inner apartment and carefully guarded by Rākṣasīs. …

    '
4.57.24:
  dutt: Kiṣkindhā LVIII
  text: '… Ye monkeys, do ye hie thither speedily with vigor. I perceive by my knowledge that having seen (that place), ye shall come back.

    '
  modern: '… O monkeys, hurry there with vigour. By my knowledge I perceive that you will see that place and come back.

    '
4.65.1:
  dutt: Kiṣkindhā LXVI
  text: 'Surveying the monkey-host consisting of many hundreds and thousands,—crest-fallen, Jambavan thus spake unto Hanuman,—"O hero among the monkey-multitude, best of those versed in all branches of learning, staying apart in silent, why dost thou not speak?

    '
  modern: 'Looking over the monkey host of many hundreds and thousands, crestfallen, Jāmbavān spoke to Hanumān: "O hero among the monkey multitude, best of those versed in all branches of learning, why do you stay apart in silence and not speak?

    '
4.65.2:
  dutt: Kiṣkindhā LXVI
  text: (with 4.65.1)
4.65.27:
  dutt: Kiṣkindhā LXVI
  text: '… And seeing him?” sustain no (serious) injury consequent on the impact of the thunder-bolt, He of a thousand eyes, pleased in his soul, also conferred on (thee) an excellent boon, O lard, saying,—’Thy death shall take place according to thy will’

    '
  modern: '… And seeing that you took no serious injury from the blow of the thunderbolt, He of a thousand eyes, pleased in his soul, also gave you an excellent boon, O lord, saying, ''Your death shall come at your own will.''

    '
4.65.28:
  dutt: Kiṣkindhā LXVI
  text: 'Thou, endowed with dreadful vigor, art the son of Kesari by his wife; and, resembling the Wind in energy, thou hast sprung from his loins. Thou art the son of the Wind, my child—equal to him in the power of leaping.

    '
  modern: 'You, with your dreadful vigour, are the son of Kesarin by his wife, and, like the Wind in energy, you were born from his loins. You are the son of the Wind, my child, equal to him in the power of leaping.

    '
4.65.34:
  dutt: Kiṣkindhā LXVI
  text: 'O redoubtable monkey, do thou arise! Do thou leap over the mighty ocean. Thy motion, Hanuman, surpasseth that of all beings.

    '
  modern: 'O redoubtable monkey, arise! Leap over the mighty ocean. Your motion, Hanumān, surpasses that of all beings.

    '
4.65.35:
  dutt: Kiṣkindhā LXVI
  text: 'All the monkeys are depressed. Why, O Hanuman, dost thou overlook this? Put forth thy vigor, O thou endowed with mighty vehemence, like Vishnu crossing over the three worlds in three steps."

    '
  modern: 'All the monkeys are depressed. Why, O Hanumān, do you overlook this? Put forth your vigour, O you of mighty vehemence, like Viṣṇu crossing the three worlds in three steps."

    '
4.66.1:
  dutt: Kiṣkindhā LXVII
  text: 'Seeing that foremost of monkeys enlarge his person for crossing over an hundred yojanas, and suddenly filled with energy,(the monkeys) at once renounced sorrow, and, filled with delight, set up ululations and fell to eulogizing the mighty Hanuman.

    '
  modern: 'Seeing that foremost of the monkeys enlarge his body to cross a hundred yojanas, and suddenly filled with energy, the monkeys at once gave up sorrow and, filled with delight, raised cries of joy and began to praise the mighty Hanumān.

    '
4.66.38:
  dutt: Kiṣkindhā LXVII
  text: 'Thereat, hurt by the arms of that high-souled one, that mighty mountain began to cry, like a mighty mad elephant tormented by a lion. …

    '
  modern: 'Then the mighty mountain, hurt by the arms of that noble one, began to cry out, like a great mad elephant tormented by a lion. …

    '
  departs: The Sanskrit has the mountain pressed by his feet (pādābhyām), not hurt by his arms.
4.66.43:
  dutt: Kiṣkindhā LXVII
  text: 'And the heap of crags forsaken by saints exercised with fear and agitation, looked doleful, like a wayfarer left in a vast forest by his companions.

    '
  modern: 'And the heap of crags, forsaken by saints in fear and agitation, looked doleful, like a wayfarer left in a vast forest by his companions.

    '
5.1.7:
  dutt: Sundara I
  text: 'Then joining his hands to the Sun, Mahendra, Wind, the Self-create, and all Beings, he set his heart upon his journey.

    '
  modern: 'Then, joining his hands in reverence to the Sun, Mahendra, the Wind, the Self-create and all beings, he set his heart on his journey.

    '
5.1.40:
  dutt: Sundara I
  text: 'Having observed this, the monkey Hanuman, foremost of monkeys, endowed with speed, without pausing for thought, suddenly sprang up.

    '
  modern: "Having observed this, the monkey Hanumān, foremost of monkeys and full of speed, sprang up suddenly without pausing to think."
5.1.40+1:
  dutt: Sundara I
  text: 'And that powerful monkey deemed himself like unto Suparna.

    '
  modern: 'And that powerful monkey thought of himself as being like Suparṇa.

    '
5.2.1:
  dutt: Sundara I
  text: 'And having by main force bounded over the ocean heaving with surges, and rife with Danavas and Panagas, he alighting on the shore of the mighty main, beheld Lanka like unto Amaravati.

    '
  modern: 'Having bounded by main force over the ocean, which heaved with surges and teemed with Dānavas and serpents, he alighted on the shore of the mighty sea and saw Laṅkā, like Amarāvatī.

    '
5.2.18:
  dutt: Sundara II
  text: 'And that graceful monkey saw Lanka situated on the top of the mountain, filled with splendid yellow-white palaces, like unto a city stationed in the sky: ruled by the lord of Rakshasas and reared by Vicwakarma himself.

    '
  modern: 'That graceful monkey saw Laṅkā on the top of the mountain, filled with splendid yellow-white palaces, like a city standing in the sky, ruled by the lord of the Rākṣasas and built by Viśvakarman himself.

    '
5.2.19:
  dutt: Sundara II
  text: 'And the monkey, Hanuman, beheld Lanka, as if moving in the sky: … built as if by the agency of the Mind; and constructed by Vicwakarma himself.

    '
  modern: 'And the monkey Hanumān saw Laṅkā as though moving in the sky. … She seemed built by the power of the Mind, and was constructed by Viśvakarman himself.

    '
5.3.1:
  dutt: Sundara III
  text: 'Assuming the quality of goodness and energy on mount Lamva furnished with elevated summits, and resembling long masses of clouds, Hanuman, son unto the Wind-god … an elephant among monkeys—entered Lanka by night, affluent with charming woods and waters—the city governed by Ravana; …

    '
  modern: 'Taking on the quality of goodness and energy on Mount Lamba, with its lofty summits like long masses of clouds, Hanumān, son of the Wind-god, … an elephant among monkeys, entered Laṅkā by night, rich in charming woods and waters, the city governed by Rāvaṇa; …

    '
5.3.2:
  dutt: Sundara III
  text: (with 5.3.1)
5.3.2+1:
  dutt: Sundara IV
  text: 'And (Hanuman) heard there in the mansions of the Rakshas, Mantras recited by persons engaged therein, and those occupied in Vaidika studies.

    '
  modern: "And Hanumān heard there, in the houses of the Rākṣasas, mantras recited by those engaged in them and by those occupied in Vedic studies."
5.3.26:
  dutt: Sundara IV
  text: 'And (Hanuman) saw goblins and Rakshasas storming and eulogizing Ravana; and mighty swarms of Rakshas stationed, covering the highway.

    '
  modern: 'And Hanumān saw goblins and Rākṣasas storming and praising Rāvaṇa, and mighty swarms of Rākṣasas stationed there, covering the highway.

    '
5.3.26+1:
  dutt: Sundara IV
  text: 'And the monkey entered the palace protected by the Rakshasa chief,—guarded by maddened beasts and birds, and thousands of goblins endowed with exceeding great prowess.

    '
  modern: 'And the monkey entered the palace protected by the Rākṣasa chief, guarded by maddened beasts and birds and by thousands of goblins of exceeding prowess.

    '
5.3.37:
  dutt: Sundara IV
  text: (with 5.3.26+1)
5.9.44:
  dutt: Sundara XI
  text: 'And not seeing her, that hero, having beheld other magnificent dames, coming out of that place, set about searching for Sita (afresh).

    '
  modern: 'Not seeing her, the hero looked at other splendid women, came out of that place, and set about searching for Sītā afresh.

    '
5.10.6:
  dutt: Sundara XII
  text: 'Having searched the inner apartment through, and seen the wives of the Rakshasa, I do not see the chaste Sita. Therefore vain is the trouble that I take.

    '
  modern: 'Having searched the inner apartment through and seen the wives of the Rākṣasa, I do not see the chaste Sītā. So the trouble I take is vain.

    '
5.10.8:
  dutt: Sundara XII
  text: '… And not having seen Janaka’s daughter, what shall I answer? The term fixed (by Sugriva) having been past, certainly meet it is that I should fast to death.

    '
  modern: '… And not having seen Janaka''s daughter, what shall I answer? The term fixed by Sugrīva has passed, so surely it is right that I should fast to death.

    '
5.10.10:
  dutt: Sundara XII
  text: 'But perseverence is the source of good fortune; and perseverence bringeth about supreme happiness. Search again I will, where I have not yet searched. Perseverence, for certain, ever bringeth people to all profitable objects.

    '
  modern: 'But perseverance is the source of good fortune, and perseverance brings supreme happiness. I will search again where I have not yet searched. Perseverance, certainly, always brings people to all worthwhile objects.

    '
5.10.14:
  dutt: Sundara XII
  text: 'I will search such places held by Ravana as I have not yet seen. I have again searched the picturegalleries and the sporting-structures, and edifices, and roads passing through gardens, as well as the cars."

    '
  modern: 'I will search the places held by Rāvaṇa that I have not yet seen. I have searched again the picture galleries, the pleasure halls, the buildings, and the roads through the gardens, as well as the cars."

    '
5.10.15:
  dutt: Sundara XII
  text: 'Having thought thus, Hanuman again set about searching the subterranean abodes, religious buildings, and many-storied mansions.

    '
  modern: 'Having thought thus, Hanumān again set about searching the underground dwellings, the religious buildings and the many-storied mansions.

    '
5.10.16:
  dutt: Sundara XII
  text: 'And flying up, and coming down, and staying, and going at places, and opening doors, and shutting others, and entering and issuing out, and falling down as if darting up, that mighty monkey began to range on all sides.

    '
  modern: 'And flying up and coming down, staying and going, opening doors and shutting others, entering and coming out, and falling down as if darting up, the mighty monkey ranged on all sides.

    '
5.10.17:
  dutt: Sundara XII
  text: 'There was not even space measuring four fingers in that inner apartment of Ravana, to which the monkey did not repair.

    '
  modern: 'There was not even a space four fingers wide in that inner apartment of Rāvaṇa to which the monkey did not go.

    '
5.11.5:
  dutt: Sundara XIII
  text: 'The vulture-king Sampati had told that Sita was in the mansion of Ravana.

    '
  modern: 'The vulture king Sampāti had told us that Sītā was in Rāvaṇa''s mansion.

    '
5.13.15:
  dutt: Sundara XV
  text: 'And that foremost of monkeys beheld in that garden of Asoka, a round palace, situated at a distance, fragrant as the Gandhamadana mountain and high as the lord of mountains.

    '
  modern: 'And that foremost of monkeys saw in that Aśoka garden a round palace, standing at a distance, fragrant as the Gandhamādana mountain and high as the lord of mountains.

    '
5.13.18:
  dutt: Sundara XV
  text: 'And thereupon he beheld there (Sita) wearing a soiled cloth, poorly, greatly reduced by fast, sighing again and again and encircled by a band of Rakshasees. She was (however) spotless like unto the rays of the moon on the first lunar day.

    '
  modern: 'And there he saw Sītā in a soiled cloth, wretched and greatly reduced by fasting, sighing again and again, surrounded by a band of Rākṣasīs. She was spotless, like the rays of the moon on the first day of the lunar fortnight.

    '
5.13.19:
  dutt: Sundara XV
  text: 'And her graceful beauty could with great difficulty be perceived like unto the flame of fire enveloped with smoke.

    '
  modern: 'Her graceful beauty could be made out only with great difficulty, like the flame of a fire wrapped in smoke.

    '
5.13.20:
  dutt: Sundara XV
  text: 'And wearing a shattered and soiled yellow cloth and divested of all ornaments she appeared like a lotus stalk without lotuses. Oppressed, racked with grief, weakened and chaste as she was, she appeared like Rohini possessed by Ketu.

    '
  modern: 'Wearing a worn and soiled yellow cloth and stripped of all ornaments, she looked like a lotus stalk without lotuses. Oppressed, racked with grief, weakened and chaste as she was, she looked like Rohiṇī seized by Ketu.

    '
5.13.21:
  dutt: Sundara XV
  text: (with 5.13.20)
5.13.22:
  dutt: Sundara XV
  text: 'She was greatly reduced by fast, stricken with grief and anxious thoughts, disturbed with sorrow and was poorly and her eyes were always full of tears.

    '
  modern: 'She was greatly reduced by fasting, stricken with grief and anxious thoughts, overcome with sorrow and wretched, and her eyes were always full of tears.

    '
5.13.36:
  dutt: Sundara XV
  text: 'And beholding Sita in that pitiable plight like unto learning for want of practice, (Hanuman) was puzzled with doubts.

    '
  modern: 'And seeing Sītā in that pitiable state, like learning from want of practice, Hanumān was puzzled with doubts.

    '
5.13.37:
  dutt: Sundara XV
  text: 'And seeing her without ornaments he could with great difficulty make her out like unto words having different meanings without the knowledge of grammar.

    '
  modern: 'And seeing her without ornaments, he could make her out only with great difficulty, like words with different meanings for one who lacks the knowledge of grammar.

    '
5.13.38:
  dutt: Sundara XV
  text: 'And beholding that blameless daughter of the king, having expansive eyes, Hanuman, by various reasonings, reflected— "Forsooth she must be Sita.

    '
  modern: 'Seeing that blameless daughter of the king, with her wide eyes, Hanumān reasoned in various ways: "Surely she must be Sītā.

    '
5.13.39:
  dutt: Sundara XV
  text: 'I see at her person all these ornaments, of which Rama mentioned unto me at the time of my departure. I behold on her ears excellent ear-rings and nicely placed Svadangstras and on her arms jewelled ornaments rendered dark-blue by dirt for constant use.

    '
  modern: 'I see on her person all these ornaments that Rāma described to me when I left. I see on her ears excellent earrings and well-set Svadaṃṣṭras, and on her arms jewelled ornaments made dark blue by the dirt of constant wear.

    '
5.13.42:
  dutt: Sundara XV
  text: 'I do not perceive them which had been cast off by her. But these are the rest there is not the least doubt about it.

    '
  modern: 'I do not see those that she cast off. But these that remain, there is not the least doubt about them.

    '
5.13.44:
  dutt: Sundara XV
  text: 'The monkeys had seen, her excellent yellow cloth made of golden fibres, on the hill. They had seen also her excellent ornaments, which cast off by her, fell on the earth with a sound.

    '
  modern: 'The monkeys had seen her excellent yellow cloth, made of golden fibres, on the hill. They had seen also her excellent ornaments, which she cast off and which fell on the earth with a sound.

    '
5.13.45:
  dutt: Sundara XV
  text: 'Her cloth hath been shattered by constant use but her grace hath not been rendered worse than its color.

    '
  modern: 'Her cloth has been worn thin by constant use, but her grace has not been made worse than its colour.

    '
5.13.46:
  dutt: Sundara XV
  text: 'This one having a golden countenance must be the beloved queen of Rama, who, albeit separated from him, hath not disappeared from his mind.

    '
  modern: 'This golden-faced woman must be the beloved queen of Rāma, who, although parted from him, has not vanished from his mind.

    '
5.13.50:
  dutt: Sundara XV
  text: 'She has her mind fixed in him, and he in her and it is for this that she and the virtuous-souled (Rama) have been still maintaining their being.

    '
  modern: 'She has her mind fixed on him, and he on her, and it is for this that she and the virtuous Rāma are still alive.

    '
5.14.27:
  dutt: Sundara XV
  text: 'Indeed my master Rama hath performed a mighty task for breathes he still in her separation, without consuming himself in grief."

    '
  modern: 'Indeed my master Rāma has done a mighty task, for he still breathes in her absence, without being consumed by grief."

    '
5.13.52:
  dutt: Sundara XV
  text: 'And having beheld Sita in this plight, that son of the Wind-god approached Rama in mind and showered praises on his master.

    '
  modern: 'And having seen Sītā in this plight, that son of the Wind-god approached Rāma in his mind and showered praises on his master.

    '
5.14.2:
  dutt: Sundara XVI
  text: 'And having reflected for some time, the powerful Hanuman, having his eyes full of tears bewailed on Sita’s account (in the following strain) —"No one can withstand the course of destiny since Sita, being the spouse of the worshipful brother of Lakshmana, ever obedient unto his elders, hath been overwhelmed with grief.

    '
  modern: "And having reflected for some time, the powerful Hanumān, his eyes full of tears, bewailed on Sītā's account: \"No one can withstand the course of destiny, since Sītā, the wife of the revered brother of Lakṣmaṇa, ever obedient to his elders, has been overwhelmed with grief."
5.14.3:
  dutt: Sundara XVI
  text: (with 5.14.2)
5.14.5:
  dutt: Sundara XVI
  text: 'As regards their character, age, conduct, family and other auspicious marks they are equal and hence Raghava deserveth Vaidehi and this one of dark-blue eyes is his."

    '
  modern: 'As regards their character, age, conduct, family and other auspicious marks, they are equal, and so Rāghava deserves Vaidehī, and this dark-eyed woman is his."

    '
5.14.9:
  dutt: Sundara XVI
  text: '(It was for her) that fourteen thousand Rakshasas of terrible deeds were destroyed at Janasthana with arrows resembling the flame of fire.

    '
  modern: 'It was for her that fourteen thousand Rākṣasas of terrible deeds were destroyed at Janasthāna with arrows like flames of fire.

    '
5.14.12:
  dutt: Sundara XVI
  text: 'And it is for this (damsel) of expansive eyes that I have crossed the effulgent lord of rivers and have seen this city.

    '
  modern: 'And it is for this wide-eyed woman that I have crossed the shining lord of rivers and seen this city.

    '
5.14.13:
  dutt: Sundara XVI
  text: 'And methinks it would have been all proper had Rama turned on her account the whole earth bounded by oceans.

    '
  modern: 'And I think it would have been quite proper if Rāma had turned over the whole earth, bounded by oceans, on her account.

    '
5.14.14:
  dutt: Sundara XVI
  text: 'If the kingdom over the three worlds and the daughter of Janaka be compared together, the former is not equal to one hundredth part of Sita.

    '
  modern: 'If the kingdom over the three worlds and the daughter of Janaka were compared, the former is not equal to one hundredth part of Sītā.

    '
5.14.19:
  dutt: Sundara XVI
  text: 'Renouncing all luxuries, and considering not the least about miseries, she actuated by her husband’s love entered the solitary forest.

    '
  modern: 'Giving up all luxuries and caring nothing for miseries, she, moved by her husband''s love, entered the solitary forest.

    '
5.14.22:
  dutt: Sundara XVI
  text: 'Like unto a thirsty wight longing for an abode where he might get a drink, Raghava panteth after seeing her, gifted with an exalted character and oppressed by Ravana.

    '
  modern: 'As a thirsty man longs for a place where he can get a drink, Rāghava pants to see her, who has an exalted character and is oppressed by Rāvaṇa.

    '
5.14.23:
  dutt: Sundara XVI
  text: 'As a monarch who had lost his kingdom, is greatly delighted when he regaineth it, forsooth shall Raghava, in like manner, be pleased when he shall come by her.

    '
  modern: 'As a monarch who has lost his kingdom is greatly delighted when he regains it, so Rāghava will be pleased when he finds her.

    '
5.14.24:
  dutt: Sundara XVI
  text: 'She too hath been maintaining her being in the hope of seeing Rama again, separated as she is from her friends and deprived of all comforts and luxuries.

    '
  modern: 'She too has been keeping herself alive in the hope of seeing Rāma again, parted as she is from her friends and deprived of all comforts and luxuries.

    '
5.14.25:
  dutt: Sundara XVI
  text: 'These Rakshasees, and these trees enveloped with fruits and flowers—forsooth she doth not behold, but is engaged with all her heart in medidations only touching Rama.

    '
  modern: 'She does not see these Rākṣasīs, or these trees laden with fruits and flowers. She is engaged with all her heart in meditating only on Rāma.

    '
5.14.26:
  dutt: Sundara XVI
  text: 'Husband enhanceth the beauty of a female more than the dress (and therefore Sita) beautiful as she is, doth not appear graceful, in her husband’s absence.

    '
  modern: 'A husband enhances the beauty of a woman more than her dress, and so Sītā, beautiful as she is, does not look graceful in her husband''s absence.

    '
5.16.1:
  dutt: Sundara XVIII
  text: 'And beholding the forest filled with flowery trees and desiring to have a full view of her, he, well-nigh, spent the night.

    '
  modern: 'And seeing the forest full of flowering trees, and wishing to get a full view of her, he spent nearly the whole night.

    '
5.16.2:
  dutt: Sundara XVIII
  text: 'And at that late hour of the night, he heard the chantings of the Vedas by the Rakshasas, conversant with the six supplementary parts of the Vedas, engaged in the performance of sacrificial rites and knowing Brahma.

    '
  modern: 'And at that late hour of the night, he heard the Rākṣasas chanting the Vedas. They knew the six auxiliary branches of the Vedas, performed sacrificial rites and knew Brahman.

    '
5.16.3:
  dutt: Sundara XVIII
  text: 'And thereupon the mighty Ten-headed Rakshasa, having huge arms, awoke with the sounds of those auspicious instruments pleasant unto ears.

    '
  modern: 'And then the mighty ten-headed Rākṣasa, of huge arms, was awakened by the sounds of auspicious instruments, pleasant to the ear.

    '
5.16.9:
  dutt: Sundara XVIII
  text: '… entered the forest of Asoka, filled with various trees containing fruits and flowers of all seasons and with ponds; … filled with various beautiful wolves; thronged with various deer and covered with fruits fallen on the earth.

    '
  modern: '… entered the Aśoka forest. It was full of trees with fruits and flowers of every season, with ponds, … filled with various beautiful wolves, thronged with various deer and covered with fallen fruits.

    '
5.16.25:
  dutt: Sundara XVIII
  text: 'And that highly energetic monkey beheld that effulgent (Ravana) surrounded by excellent damsels like unto moon encircled by stars.

    '
  modern: 'And that highly energetic monkey saw that radiant Rāvaṇa surrounded by excellent women, like the moon surrounded by stars.

    '
5.16.26:
  dutt: Sundara XVIII
  text: 'And beholding him the monkey reflected—"This must be Ravana—for he is the person whom I saw sleeping in an excellent apartment in that city." Thinking this, that highly effulgent son of Maruta—Hanuman leaped (high upon another branch).

    '
  modern: 'And seeing him, the monkey reflected: "This must be Rāvaṇa, for he is the person I saw sleeping in an excellent apartment in that city." Thinking this, the highly radiant Hanumān, son of Maruta, leaped up onto another branch.

    '
5.16.27:
  dutt: Sundara XVIII
  text: 'And effulgent as he was, that highly intelligent monkey hid himself on a branch covered with leaves, being unable to stand before the effulgence of that Rakshasa.

    '
  modern: 'And, radiant as he was, that highly intelligent monkey hid himself on a branch covered with leaves, since he could not stand before that Rākṣasa''s radiance.

    '
5.16.28:
  dutt: Sundara XVIII
  text: 'And Ravana proceeded in that way, being anxious to behold the blue-eyed Sita, having spacious breast, excellent hips and a lock of black hair.

    '
  modern: 'And Rāvaṇa went on in that way, eager to see the blue-eyed Sītā, with her broad breast, fine hips and lock of black hair.

    '
5.18.1:
  dutt: Sundara XX
  text: 'Whereupon Ravana, with sweet words amd gestures, expressed his own desire unto Sita, poorly, deprived of joy, encircled by Rakshasees and leading the life of an ascetic.

    '
  modern: 'Then Rāvaṇa, with sweet words and gestures, told Sītā his desire. She was wretched, deprived of joy, surrounded by Rākṣasīs and living the life of an ascetic.

    '
5.18.16:
  dutt: Sundara XX
  text: 'O Maithilee, do thou become my spouse, and renounce this delusion. Do thou become the foremost queen of all my excellent wives.

    '
  modern: 'O Maithilī, become my wife and give up this delusion. Become the foremost queen of all my excellent wives.

    '
5.18.25:
  dutt: Sundara XX
  text: '… Rama hath ceased from his endeavours for gaining victory. He hath lost all his beauty, lives in the forest, is engaged in observances and always lies down on earth. I fear whether he is living still.

    '
  modern: '… Rāma has ceased his efforts to win victory. He has lost all his beauty, lives in the forest, keeps vows and always lies down on the ground. I fear whether he is still alive.

    '
5.19.3:
  dutt: Sundara XXI
  text: 'Placing a twig before, that one, of beautiful smile, said—"Do thou take back thy mind from me and place it in thy own wives.

    '
  modern: 'Placing a blade of grass before her, that woman of beautiful smile said: "Take your mind back from me and place it on your own wives.

    '
5.19.4:
  dutt: Sundara XXI
  text: 'Like unto a sinner unworthy of praying for final emancipation, it doth not behove thee to expect to come by me. Devoted unto one husband I shall never perpetrate such an iniquitious act. I am born in a high and have been married in a pious family."

    '
  modern: 'It does not befit you to hope to get me, like a sinner unworthy of praying for final liberation. Devoted to one husband, I shall never commit such an unrighteous act. I was born in a high family and married into a pious one."

    '
5.19.6:
  dutt: Sundara XXI
  text: 'Having accosted Ravana thus, the well-known Vaidehi, turning her back, again spake unto him, saying— "I should not live with thee since I am another’s wife and chaste.

    '
  modern: 'Having spoken thus to Rāvaṇa, the famous Vaidehī turned her back and spoke to him again: "I should not live with you, since I am another''s wife and chaste.

    '
5.19.7:
  dutt: Sundara XXI
  text: 'Have thy eyes always on religion and do thou follow in the track of piety. Like unto thine own wives, others’ are worthy of being protected by thee, O ranger of the night. Making an example of thee, do thou enjoy with thy own wives.

    '
  modern: 'Always keep your eyes on religion and follow the track of piety. Like your own wives, the wives of others are to be protected by you, O ranger of the night. Take yourself as an example, and enjoy your own wives.

    '
5.19.9:
  dutt: Sundara XXI
  text: '(Methinks) there are no pious men here and even if there be any thou dost not follow him since thou hast such an adverse understanding, against human practice and usage. Or the considerate people have spoken the truth, but thou, for the destruction of the race of the Rakshasas, considering that false, hast not followed it.

    '
  modern: 'I think there are no pious men here, and if there are any, you do not follow them, since your understanding is so adverse, against human practice and usage. Or considerate people have spoken the truth, but you, for the destruction of the race of the Rākṣasas, considered it false and did not follow it.

    '
5.19.9+1:
  dutt: Sundara XXI
  text: (with 5.19.9)
5.19.9+2:
  dutt: Sundara XXI
  text: '… It is known to the world, that Rama knoweth well the sanctions of religion and is kind unto them who seek his shelter. Do thou seek his friendship, if dost thou wish to maintain thy life.

    '
  modern: '… It is known to the world that Rāma knows well the sanctions of religion and is kind to those who seek his shelter. Seek his friendship, if you wish to keep your life.

    '
5.19.9+3:
  dutt: Sundara XXI
  text: 'Do thou propitiate him therefore who is kind to his dependents and it becometh thee to take me respectfully unto him. Thou shalt meet with thy well-being if dost thou in this wise confer me on that best of Raghus.

    '
  modern: 'So propitiate him, who is kind to his dependents, and it becomes you to take me respectfully to him. You will meet with your own well-being if you thus give me back to that best of the Raghus.

    '
5.20.1:
  dutt: Sundara XXII
  text: 'Hearing those harsh accents, that lord of Rakshasas, replied unto Sita, of comely presence, with the following unpleasant words— …

    '
  modern: 'Hearing those harsh words, that lord of the Rākṣasas replied to Sītā, of comely presence, with these unpleasant words: …

    '
5.20.4:
  dutt: Sundara XXII
  text: 'O mighty is amour unto men, for on whom this amour falleth, albeit she is an object of wrath, becomes an object of kindness and affection.

    '
  modern: 'O mighty is love among men, for the woman it falls on, even if she is an object of wrath, becomes an object of kindness and affection.

    '
5.20.5:
  dutt: Sundara XXII
  text: 'O thou of fair countenance, it is for this reason, that I do not destroy thee, although thou, who art engaged in false asceticism, art worthy of being killed and dishonored.

    '
  modern: 'O you of fair countenance, it is for this reason that I do not destroy you, although you, who practise false asceticism, deserve to be killed and dishonoured.

    '
5.20.8:
  dutt: Sundara XXII
  text: 'Having spoken thus unto Vaidehi, Ravana, the lord of Rakhasas, having his wrath subdued, again bespake Sita: "I shall wait for those two months, of which I have made a contract, after which thou shalt have to share my bed, O thou of a comely presence.

    '
  modern: 'Having spoken thus to Vaidehī, Rāvaṇa, the lord of the Rākṣasas, with his wrath subdued, spoke again to Sītā: "I shall wait for those two months, of which I have made a contract, after which you will have to share my bed, O woman of comely presence.

    '
5.20.9:
  dutt: Sundara XXII
  text: 'And even then if thou dost refuse to regard me as thy husband, my cooks shall mince thy limbs with steel and serve thee for my morning meal."

    '
  modern: 'And even then if you refuse to regard me as your husband, my cooks will mince your limbs with steel and serve you for my morning meal."

    '
5.20.9+1:
  dutt: Sundara XXII
  text: 'And that Ten-necked one, strode away as if shaking the whole earth and passed within (his queen’s) abode resembling the effulgent Sun.

    '
  modern: 'And that ten-necked one strode away, as if shaking the whole earth, and passed into the abode of his queen, which shone like the radiant Sun.

    '
5.28.2:
  dutt: Sundara XXX
  text: 'And beholding the worshipful damsel, living in the forest of Asoka, like unto a celestial damsel in the garden of Nandana, the monkey entered in a maze of anxious thoughts.

    '
  modern: 'And seeing the revered lady in the Aśoka forest, like a heavenly woman in the garden of Nandana, the monkey fell into a maze of anxious thoughts.

    '
5.28.3:
  dutt: Sundara XXX
  text: '"At length my watchful eyes have seen her, whom have been seeking in vain, the thousands and millions of the monkeys in all directions and quarters.

    '
  modern: '"At last my watchful eyes have seen her, whom thousands and millions of monkeys have been seeking in vain in all directions and quarters.

    '
5.28.7:
  dutt: Sundara XXX
  text: 'I shall console this damsel, having the countenance of the full moon, who had never seen grief before, and who shall not soon reach its end.

    '
  modern: 'I shall console this woman with a face like the full moon, who had never seen grief before and who will not soon reach its end.

    '
5.28.41:
  dutt: Sundara XXX
  text: '"I shall not disturb her, speaking (all on a sudden) about Rama of unwearied actions, dear unto her and to whom, she is firmly attached. Uttering the name of Rama, the foremost of the Ikshawkus, and of subdued soul and lauding his piety and fame in sweet accents, I shall so manage that Sita might hear and believe them."

    '
  modern: 'I shall not disturb her by speaking all of a sudden about Rāma of unwearied actions, who is dear to her and to whom she is firmly attached. By saying the name of Rāma, the foremost of the Ikṣvākus, of subdued soul, and praising his piety and fame in sweet words, I shall manage it so that Sītā hears and believes them."

    '
5.28.41+1:
  dutt: Sundara XXXIII
  text: 'Thereupon coming down from the tree, Hanuman, the highly effulgent son of Wind, having a coral-red countenance and attired in a humble guise, approached Sita and joining reverentially his palms, addressed her with the following sweet words,— …

    '
  modern: 'Then Hanumān, the highly radiant son of the Wind, came down from the tree. His face was coral-red and he wore a humble guise. He approached Sītā, joined his palms in reverence and spoke to her these sweet words: …

    '
5.31.1:
  dutt: Sundara XXXIII
  text: (with 5.28.41+1)
5.31.1+1:
  dutt: Sundara XXXIII
  text: '"Who art thou, O thou having eyes like lotus petals and wearing a soiled silken cloth, who art waiting there holding a branch of the tree? Who art thou, O most fair of face, amongst the celestials, Asuras, Nagas, Gandharbas, Rakshasas, and Yakshas and Kinnaras?

    '
  modern: '"Who are you, with eyes like lotus petals and a soiled silk cloth, standing there holding a branch of the tree? Who are you, O most fair of face? Are you among the gods, Asuras, Nāgas, Gandharvas, Rākṣasas, Yakṣas or Kinnaras?

    '
5.31.10:
  dutt: Sundara XXXIII
  text: 'Art thou that Sita, I do ask thee, who had been stolen and borne away by Ravana from Janasthana?

    '
  modern: 'I ask you: are you that Sītā who was stolen and carried away by Rāvaṇa from Janasthāna?

    '
5.31.10+1:
  dutt: Sundara XXXIII
  text: 'From thy wretched plight, thy unrivalled beauty and thy ascetic garb, thou art, I ween, for certain, the queen of Rama."

    '
  modern: 'From your wretched plight, your unrivalled beauty and your ascetic garb, you are, I judge, surely the queen of Rāma."

    '
5.31.10+2:
  dutt: Sundara XXXIII
  text: 'Hearing those words of Hanuman and greatly delighted at Rama’s name, Vaidehi spoke unto him—"I am the daughter-in-law of Dacaratha, knowing his own self, the foremost of the kings of the world and the slayer of the enemy’s host, …

    '
  modern: 'Hearing those words of Hanumān, and greatly delighted at Rāma''s name, Vaidehī said to him: "I am the daughter-in-law of Daśaratha, who knows himself, the foremost of the kings of the world and slayer of the enemy''s host, …

    '
5.31.12:
  dutt: Sundara XXXIII
  text: 'My name is Sita and I am the consort of the highly intelligent Rama.

    '
  modern: 'My name is Sītā, and I am the wife of the wise Rāma.

    '
5.31.26:
  dutt: Sundara XXXIII
  text: '… While that one, of unmitigated effulgence was thus living in the forest of Dandaka, I, his consort, was stolen by the vicious-souled Rakshasa—Ravana.

    '
  modern: '… While that man of unmitigated radiance was living in the forest of Daṇḍaka, I, his wife, was stolen by the vicious-souled Rākṣasa Rāvaṇa.

    '
5.31.27:
  dutt: Sundara XXXIII
  text: 'He hath kindly allowed me two months’ respite after which I shall be slain.

    '
  modern: 'He has kindly allowed me a respite of two months, after which I shall be slain.

    '
5.32.1:
  dutt: Sundara XXXIV
  text: 'HEARING those words of Sita stricken with grief, Hanuman, the foremost of the monkeys, replied in soothing words, …

    '
  modern: 'Hearing those words of Sītā, stricken with grief, Hanumān, the foremost of the monkeys, replied in soothing words, …

    '
5.32.2:
  dutt: Sundara XXXIV
  text: '"O worshipful lady, by Rama’s decree I come as a messenger unto thee. He is safe and sound, O Vaidehi, and has asked of thy welfare.

    '
  modern: '"O revered lady, I come to you as a messenger by Rāma''s command. He is safe and sound, O Vaidehī, and has asked after your welfare.

    '
5.32.5:
  dutt: Sundara XXXIV
  text: 'Hearing of the welfare of those two lions among men, the worshipful dame, with all her frame worked up with rapture, again spake unto Hanuman, saying—"Verily the wise saw of the people appears to me to be true that once in a hundred years true joy appears to a living man".

    '
  modern: 'Hearing of the welfare of those two lions among men, the revered lady, her whole body thrilled with rapture, said again to Hanumān: "Truly the wise saying of the people seems to me to be true, that true joy comes to a living man once in a hundred years."

    '
5.32.6:
  dutt: Sundara XXXIV
  text: (with 5.32.5)
5.33.2:
  dutt: Sundara XXXV
  text: 'Hearing the tale of Rama from that best of monkeys, Vaidehi, spoke in sweet accents, soft and low,—"Where didst thou meet Rama, how didst thou come to know Lakshmana? How did the monkeys and men meet on terms of brotherhood?

    '
  modern: 'Hearing the tale of Rāma from that best of monkeys, Vaidehī spoke in sweet accents, soft and low: "Where did you meet Rāma, and how did you come to know Lakṣmaṇa? How did monkeys and men meet on terms of brotherhood?

    '
5.33.3:
  dutt: Sundara XXXV
  text: 'Do thou again relate unto me, O monkey, the regal signs that deck the persons of Rama and Lakshmana— and I shall then relinquish all grief. Do thou relate unto me the form and grace of Rama, his thighs and arms and as well as those of Lakshmana."

    '
  modern: 'Tell me again, O monkey, the royal marks that adorn the persons of Rāma and Lakṣmaṇa, and then I shall put aside all grief. Tell me the form and grace of Rāma, his thighs and arms, and those of Lakṣmaṇa as well."

    '
5.33.5:
  dutt: Sundara XXXV
  text: 'Being thus addressed by Vaidehi, Hanuman, the Wind-god’s son, began to give an exact description of Rama.

    '
  modern: 'Thus addressed by Vaidehī, Hanumān, the Wind-god''s son, began to give an exact description of Rāma.

    '
5.33.8:
  dutt: Sundara XXXV
  text: 'O daughter of Janaka, Rama has eyes like lotus-petals and a countenance resembling the full-moon and is gifted with great beauty and goodness.

    '
  modern: 'O daughter of Janaka, Rāma has eyes like lotus petals and a face like the full moon, and is gifted with great beauty and goodness.

    '
5.33.9:
  dutt: Sundara XXXV
  text: 'In effulgence he is like the Sun, in patience like the earth, in intellect like Vrihaspati and in fame like Vasava.

    '
  modern: 'In radiance he is like the Sun, in patience like the earth, in intellect like Bṛhaspati and in fame like Vāsava.

    '
5.33.10:
  dutt: Sundara XXXV
  text: 'He is the protector of the world of creation and his own kinsmen. He follows right in all his ways and never swerves from his royal duties and is the slayer of foes.

    '
  modern: 'He is the protector of the world of creatures and of his own kinsmen. He follows right in all his ways, never swerves from his royal duties and is the slayer of foes.

    '
5.33.11:
  dutt: Sundara XXXV
  text: 'O dame, he upholds the dignity of the people of four-castes— he confers honors on the people and preserves them.

    '
  modern: 'O lady, he upholds the dignity of the people of the four castes; he honours the people and preserves them.

    '
5.33.20:
  dutt: Sundara XXXV
  text: 'He is truthful and graceful, amasses wealth and thereby protects his subjects. He is cognizant of the divisions of time and country and dear unto all.

    '
  modern: 'He is truthful and graceful, amasses wealth and so protects his subjects. He knows the divisions of time and country and is dear to all.

    '
5.33.21:
  dutt: Sundara XXXV
  text: 'His stepbrother Saumitri is gifted with incomparable prowess and is his equal in attachment, beauty and accomplishments. …

    '
  modern: 'His stepbrother Saumitri has incomparable prowess and is his equal in attachment, beauty and accomplishments. …

    '
5.33.35:
  dutt: Sundara XXXV
  text: 'And collecting all those ornaments which were thrown off by thee on the earth, when thou wert borne away, the leaders of the monkey hosts, delighted brought them before Rama. But they could not make out thy whereabouts.

    '
  modern: 'And collecting all those ornaments which you threw off on the earth when you were carried away, the leaders of the monkey hosts joyfully brought them before Rāma. But they could not make out where you were.

    '
5.33.37:
  dutt: Sundara XXXV
  text: 'And all those ornaments, which were handed over to Rama, were collected by me when they fell tinkling on the ground, Rama being beside himself with grief.

    '
  modern: 'All those ornaments that were handed over to Rāma were collected by me when they fell tinkling on the ground, Rāma being beside himself with grief.

    '
5.33.38:
  dutt: Sundara XXXV
  text: 'And placing them on his lap, the god-like Rama bewailed in various accents.

    '
  modern: 'And placing them on his lap, the godlike Rāma lamented in various tones.

    '
5.33.46:
  dutt: Sundara XXXV
  text: 'O daughter of the king Janaka, bringing about the destruction of Ravana, with all his kith and kin, Raghava, the foremost of men, shall soon regain thee.

    '
  modern: 'O daughter of King Janaka, Rāghava, the foremost of men, will soon regain you, destroying Rāvaṇa with all his kith and kin.

    '
5.33.47:
  dutt: Sundara XXXV
  text: 'And thus Rama and Sugriva entered into a friendly covenant, to encompass Vali’s destruction and to institute enquiries about thee.

    '
  modern: 'And thus Rāma and Sugrīva entered into a friendly covenant, to bring about Vāli''s destruction and to make inquiries about you.

    '
5.33.48:
  dutt: Sundara XXXV
  text: 'And thereupon returning to Kishkindha with those two heroic princes, the lord of monkeys killed Vali in battle. And destroying Vali by his prowess in battle, Rama made Sugriva king over all monkeys and bears.

    '
  modern: 'And then, returning to Kiṣkindhā with those two heroic princes, the lord of the monkeys killed Vāli in battle. And having destroyed Vāli by his prowess in battle, Rāma made Sugrīva king over all the monkeys and bears.

    '
5.33.49:
  dutt: Sundara XXXV
  text: 'And in this way, O dame, the alliance between Rama and Sugriva was made. And know me as Hanuman, their messenger who hath come to thee.

    '
  modern: 'And in this way, O lady, the alliance between Rāma and Sugrīva was made. And know me as Hanumān, their messenger, who has come to you.

    '
5.33.50:
  dutt: Sundara XXXV
  text: 'Regaining his own kingdom, Sugriva summoned all the mighty monkeys and despatched them in various quarters in quest of thee.

    '
  modern: 'Having regained his own kingdom, Sugrīva summoned all the mighty monkeys and sent them in various quarters in search of you.

    '
5.33.51:
  dutt: Sundara XXXV
  text: 'And the highly powerful monkeys, resembling mountains, commanded by that lord of monkeys, proceeded to all the regions of the earth.

    '
  modern: 'And the highly powerful monkeys, like mountains, commanded by that lord of the monkeys, set out to all the regions of the earth.

    '
5.33.75:
  dutt: Sundara XXXV
  text: 'O Vaidehi, I was born, on the field, of that monkey. And Iam known all over the world as Hanuman by my own actions. To create thy confidence, O Vaidehi, I have related thy lord’s accomplishments.

    '
  modern: 'O Vaidehī, I was born on the field of that monkey. And I am known all over the world as Hanumān by my own actions. To create your confidence, O Vaidehī, I have told you of your lord''s accomplishments.

    '
5.33.75+1:
  dutt: Sundara XXXV
  text: 'Thereupon Hanuman again spoke unto her, having a comely presence,—"I have related unto thee all this. Do thou be consoled, O Maithilee!

    '
  modern: 'Then Hanumān spoke again to her, who had a comely presence: "I have told you all this. Be consoled, O Maithilī!

    '
5.34.2:
  dutt: Sundara XXXVI
  text: 'Behold this precious ring with Rama’s name engraven on it, given by thy high-souled lord and brought as a token to create thy confidence.

    '
  modern: 'Behold this precious ring with Rāma''s name engraved on it, given by your high-souled lord and brought as a token to create your confidence.

    '
5.34.3:
  dutt: Sundara XXXVI
  text: 'And taking the ring that used to deck her lord’s finger and looking at it, Janaki seemed to have actually got her lord.

    '
  modern: 'And taking the ring that used to adorn her lord''s finger and looking at it, Jānakī seemed to have actually got her lord.

    '
5.34.5:
  dutt: Sundara XXXVI
  text: 'And greatly delighted at her husband’s news that modest damsel, affectionately welcoming Hanuman, applauded that great monkey—"O foremost of monkeys, thou art brave, powerful and wise, since thou hast alone smitten this abode of the Rakshasas.

    '
  modern: 'And greatly delighted at her husband''s news, that modest woman welcomed Hanumān affectionately and applauded that great monkey: "O foremost of monkeys, you are brave, powerful and wise, since you alone have smitten this abode of the Rākṣasas.

    '
5.34.6:
  dutt: Sundara XXXVI
  text: 'Thou hast, with thy laudable prowess, leaped, a hundred leagues, across the ocean, the abode of marine monsters, taking it for Goshpada. O foremost of monkeys, I do not consider thee as an ordinary monkey, since thou dost not care or fear Ravana.

    '
  modern: 'With your laudable prowess you have leaped a hundred leagues across the ocean, the abode of marine monsters, taking it for a cow''s hoofprint. O foremost of monkeys, I do not consider you an ordinary monkey, since you do not care for or fear Rāvaṇa.

    '
5.34.11:
  dutt: Sundara XXXVI
  text: 'By my good luck, is it all well with the virtuous-souled and truthful Rama and the highly powerful Lakshmana the enhancer of Sumitra’s joy?

    '
  modern: "By my good luck, is it all well with the virtuous and truthful Rāma and with the mighty Lakṣmaṇa, who increases Sumitrā's joy?"
5.34.12:
  dutt: Sundara XXXVI
  text: 'And if Kakuthstha lives untouched by ill, then why does he not burn the earth, encircled by the ocean, with his ire like unto the fire of dissolution?

    '
  modern: 'And if Kākutstha lives untouched by ill, why does he not burn the earth, girdled by the sea, with his wrath, like the fire at the end of an age?

    '
5.34.13:
  dutt: Sundara XXXVI
  text: 'Or they are capable of His comfitting the celestials in a battle but me-thinks by my ill-luck, the end of my miseries hath not arrived as yet.

    '
  modern: "Or they are capable of confounding even the gods in battle, but I think that, by my ill luck, the end of my sorrows has not yet come."
5.34.14:
  dutt: Sundara XXXVI
  text: 'Is Rama greatly pained? Does he grieve? Is that foremost of men making preparations for my rescue? Has he forgotten his work being overwhelmed with fear and poorliness of heart?

    '
  modern: 'Is Rāma greatly pained? Does he grieve? Is that foremost of men making preparations for my rescue? Has he forgotten his work, overwhelmed with fear and poorness of heart?

    '
5.34.19:
  dutt: Sundara XXXVI
  text: 'Hath Raghava lost all his affection for me for my living at a distance from him? Will he save me from this disaster?

    '
  modern: 'Has Rāghava lost all his affection for me, since I live at a distance from him? Will he save me from this disaster?

    '
5.34.31:
  dutt: Sundara XXXVI
  text: 'And hearing the words of Sita the terribly powerful Maruti, placing his joined palms on his head said,— "The lotus-eyed Rama doth not know that thou art here, and hence he hath not been able to rescue thee like unto Purandara regaining Sachee.

    '
  modern: 'And hearing the words of Sītā, the terribly powerful Māruti, placing his joined palms on his head, said: "The lotus-eyed Rāma does not know that you are here, and so he has not been able to rescue you, like Purandara regaining Śacī.

    '
5.34.32:
  dutt: Sundara XXXVI
  text: 'And hearing about thee from me soon shall Raghava come assisted by a large army of monkeys and bears.

    '
  modern: 'And hearing about you from me, Rāghava will soon come with a large army of monkeys and bears.

    '
5.34.32+1:
  dutt: Sundara XXXVI
  text: (with 5.34.31)
5.34.32#2:
  dutt: Sundara XXXVI
  text: (with 5.34.32)
5.34.33:
  dutt: Sundara XXXVI
  text: 'And impeding the course of the unagitated deep and building, by means of his terrible shafts, a bridge across it, Kakuthstha, shall divest the city Lanka of all the Rakshasas. …

    '
  modern: 'And checking the course of the unruffled deep and building a bridge across it with his terrible shafts, Kākutstha will strip the city of Laṅkā of all its Rākṣasas. …

    '
5.34.35:
  dutt: Sundara XXXVI
  text: 'O worshipful dame, stricken with grief in thy absence, Rama is restless like unto an elephant smitten by a lion.

    '
  modern: 'O revered lady, stricken with grief in your absence, Rāma is restless, like an elephant smitten by a lion.

    '
5.34.39:
  dutt: Sundara XXXVI
  text: 'Raghava doth not take meat nor drink honey—he takes every day in the evening boiled rice and such wild fruits as are sanctioned by the Sastras.

    '
  modern: 'Rāghava does not eat meat or drink honey. Every evening he takes boiled rice and such wild fruits as the scriptures allow.

    '
5.34.42:
  dutt: Sundara XXXVI
  text: 'Rama hath no sleep and even when asleep that best of men awakes exclaiming in sweet accents, ’O Sita!’.

    '
  modern: 'Rāma has no sleep, and even when he sleeps that best of men wakes up exclaiming in sweet tones, ''O Sītā!''

    '
5.36.10:
  dutt: Sundara XXXVIII
  text: 'If thou dost not wish to go with me, O thou of a blameless person, do thou give me such a token as might create Raghava’s confidence."

    '
  modern: 'If you do not wish to go with me, O blameless one, give me such a token as will create Rāghava''s confidence."

    '
5.36.10+1:
  dutt: Sundara XXXVIII
  text: '"Now tell me what I shall communicate unto Raghava, and the highly powerful Lakshmana, and the energetic Sugriva, and all the assembled monkeys."

    '
  modern: '"Now tell me what I should say to Rāghava, to the mighty Lakṣmaṇa, to the energetic Sugrīva and to all the assembled monkeys."

    '
5.36.11:
  dutt: Sundara XXXVIII
  text: 'Being thus accosted by Hanuman, Sita resembling the daughter of a celestial, spoke, gently, words with their letters strung on the vapour of grief,— …

    '
  modern: 'Thus addressed by Hanumān, Sītā, like the daughter of a god, spoke gently, her words strung on the vapour of grief: …

    '
5.36.47:
  dutt: Sundara XXXVIII
  text: '… the servant of the elders, crowned with auspiciousness,—who is competent and reineth in his tongue; who is the foremost of those dear unto the king’s son, and worthy of my father-in-law; who is dearer [unto Rama) than even my own self; of Lakshmana, brother into Rama; that energetic one who undertaketh even such tasks as he is not equal to, …

    '
  modern: '… the servant of his elders, crowned with auspiciousness, who is able and keeps a rein on his tongue; who is the foremost of those dear to the king''s son and worthy of my father-in-law; who is dearer to Rāma than my own self; Lakṣmaṇa, Rāma''s brother, that energetic man who undertakes even tasks he is not equal to, …

    '
5.36.48:
  dutt: Sundara XXXVIII
  text: (with 5.36.47)
5.36.49:
  dutt: Sundara XXXVIII
  text: 'Lakshmana is always mild and pure, and dear unto Rama.

    '
  modern: 'Lakṣmaṇa is always mild and pure, and dear to Rāma.

    '
5.37.4:
  dutt: Sundara XXXVIII
  text: 'O leader of monkey-bands, do thou bring about success on this undertaking.

    '
  modern: 'O leader of monkey bands, bring about success in this undertaking.

    '
5.37.4+1:
  dutt: Sundara XXXVIII
  text: 'From this preliminary endeavour of thine, Raghava shall take pains on my behalf.—This also shalt thou say again and again unto that hero—my lord,—’O son of Dagaratha, I shall keep on this life for another month; and this I swear unto thee by truth that I will not live beyond this month.

    '
  modern: 'From this first effort of yours, Rāghava will take pains on my behalf. This also you shall say again and again to that hero, my lord: ''O son of Daśaratha, I shall keep this life for another month, and I swear to you by truth that I will not live beyond this month.

    '
5.36.50:
  dutt: Sundara XXXVIII
  text: (with 5.37.4+1)
5.36.52:
  dutt: Sundara XXXVIII
  text: '… Thereupon, saying,—"Hand this unto Raghava," Sita gave to Hanuman a noble and excellent jewel for the head!, which was tied up in her attire.

    '
  modern: '… Then, saying, ''Hand this to Rāghava,'' Sītā gave Hanumān a noble and excellent jewel for the head, which was tied up in her garment.

    '
5.36.53:
  dutt: Sundara XXXVIII
  text: 'Then taking that best of gems, the hero tried to fix it on his finger; but it did not enter into it. And taking the gem, and bowing unto Sita and going round her, that foremost of monkeys remained by her side in humble guise.

    '
  modern: 'Then the hero took that best of gems and tried to fix it on his finger, but it would not go on. And taking the gem, bowing to Sītā and going round her, that foremost of monkeys stood by her side in humble guise.

    '
5.36.54:
  dutt: Sundara XXXVIII
  text: (with 5.36.53)
5.36.55:
  dutt: Sundara XXXVIII
  text: 'And experiencing rapture in consequence of his seeing Sita, he mentally presented himself before Rama, and Lakshmana graced with auspicious marks.

    '
  modern: 'And, filled with rapture at seeing Sītā, he presented himself in his mind before Rāma and Lakṣmaṇa, graced with auspicious marks.

    '
5.39.1:
  dutt: Sundara XLI
  text: 'Having been honored by her (Sita) in excellent words, the monkey proceeding, left that place, thinking,—"A small work it is that remains.

    '
  modern: 'Honoured by her in excellent words, the monkey set out, leaving that place and thinking: "A small work remains.

    '
5.39.2:
  dutt: Sundara XLI
  text: 'Beheld have I this dark-eyed lady. Passing by three means, I see that I shall have to resort to the fourth.

    '
  modern: 'I have seen this dark-eyed lady. Having passed by three means, I see that I shall have to resort to the fourth.

    '
5.39.5:
  dutt: Sundara XLI
  text: 'He that, having compassed his (principal) purpose, accomplishes many more without marring the prime one, is entitled to act He that doeth a small work is certainly not a worker,—he it is that knoweth to bring about success in diverse ways, is alone capable of securing the same. …

    '
  modern: 'He who, having achieved his main purpose, accomplishes many more without spoiling the first one, is entitled to act. He who does a small work is certainly not a worker; he who knows how to bring about success in various ways is alone capable of securing it. …

    '
5.39.6:
  dutt: Sundara XLI
  text: (with 5.39.5)
5.39.10:
  dutt: Sundara XLI
  text: 'This grove of the fell (fiend) resembling Nandana itself, containing various trees and plants, and captivating to eye and heart,— will I destroy; even as fire destroyeth a dry wood. This grove being ravaged, Ravana shall get into a fury.

    '
  modern: 'I shall destroy this grove of the wicked fiend, which resembles Nandana itself, with its various trees and plants, captivating to the eye and heart, as fire destroys a dry wood. When this grove is ravaged, Rāvaṇa will fly into a fury.

    '
5.40.4:
  dutt: Sundara XLII
  text: 'And observing them, that mighty-armed and powerful monkey endowed with immense strength, magnified his dimensions, capable of striking terror into the Rakshasas.

    '
  modern: "And observing them, that mighty-armed and powerful monkey of immense strength increased his size, so as to strike terror into the Rākṣasas."
5.40.4+1:
  dutt: Sundara XLII
  text: 'And beholding that exceedingly strong monkey resembling a mountain, the Rakshasis asked Janaka’s daughter, saying,—"Who is this?

    '
  modern: 'And seeing that exceedingly strong monkey like a mountain, the Rākṣasīs asked Janaka''s daughter: "Who is this?

    '
5.40.12:
  dutt: Sundara XLII
  text: 'And before Ravana, the Raksbasis of deformed visages informed him of the hideous and dreadful monkey.

    '
  modern: 'And before Rāvaṇa the deformed Rākṣasīs told him of the hideous and dreadful monkey.

    '
5.40.13:
  dutt: Sundara XLII
  text: '"O king, in the heart of the acoka wood there is a monkey of a terrific body, who, possessed of immeasurable might, stayeth, after having carried on a conversation with Janaki.

    '
  modern: '"O king, in the heart of the Aśoka wood there is a monkey of terrible body, of immeasurable might, who stays there after having talked with Jānakī.

    '
5.40.16:
  dutt: Sundara XLII
  text: 'And he it is that, wearing a wonderful form, hath destroyed thy charming arbour of the interior, filled with beasts of various kinds.—And quarter there is none which hath not been destroyed by him; and only that place where the exalted Janaki is, remained uninjured by him,—whether for preserving Janaki, or from fatigue—it doth not appear.

    '
  modern: 'And it is he who, taking a wonderful form, has destroyed your charming inner arbour, filled with beasts of various kinds. There is no quarter that he has not destroyed, and only the place where the exalted Jānakī is has remained uninjured by him; whether it was to preserve Jānakī, or from fatigue, it does not appear.

    '
5.40.17:
  dutt: Sundara XLII
  text: (with 5.40.16)
5.40.23:
  dutt: Sundara XLII
  text: 'And that highly energetic one ordered his heroic servants, resembling himself, to punish Hanuman.

    '
  modern: 'And that highly energetic one ordered his heroic servants, who were like himself, to punish Hanumān.

    '
5.40.27:
  dutt: Sundara XLII
  text: 'And equipped with variegated maces, and bludgeons, and golden angadas,! and arrows resembling the Sun, they approached that foremost of monkeys. And accoutred in maces, axes, and javelins, and bearing bearded darts and lances in their hands, they suddeuly surrounded Hanuman and remained before him.

    '
  modern: 'Equipped with variegated maces, bludgeons, golden armlets and arrows like the Sun, they approached that foremost of monkeys. Armed with maces, axes and javelins, and carrying bearded darts and lances in their hands, they suddenly surrounded Hanumān and stood before him.

    '
5.41.2:
  dutt: Sundara XLIII
  text: 'Having thought thus in his heart, that foremost of monkeys, Hanuman, son unto the Wind-god, displaying his strength, bounded unto the Chaitya building, elevated like a summit of Meru. …

    '
  modern: 'Having thought thus in his heart, that foremost of monkeys, Hanumān, son of the Wind-god, displaying his strength, bounded onto the Caitya building, which rose like a summit of Meru. …

    '
5.41.4:
  dutt: Sundara XLIII
  text: 'And magnifying his dimensions through his energy, the offspring of the Wind-god fearlessly fell to striking his arms with his hands, and thus filling Lanka, with the sounds. …

    '
  modern: 'And increasing his size through his energy, the son of the Wind-god fearlessly began striking his arms with his hands and so filled Laṅkā with the sound. …

    '
5.41.6:
  dutt: Sundara XLIII
  text: '"Victory unto Rama versed in arms! And unto Lakshmana endowed with immense strength! And victory unto king Sugriva, who is protected by Raghava!

    '
  modern: '"Victory to Rāma, skilled in arms! And to Lakṣmaṇa, of immense strength! And victory to King Sugrīva, protected by Rāghava!

    '
5.41.7:
  dutt: Sundara XLIII
  text: 'Hanuman, son onto the Wind-god, destroyer of hostile hosts, is the slave of Rama of untiring deeds.

    '
  modern: 'Hanumān, son of the Wind-god, destroyer of hostile hosts, is the slave of Rāma of untiring deeds.

    '
5.41.9:
  dutt: Sundara XLIII
  text: 'Having destroyed the city of Lanka and paid my respects to Mithila’s daughter, I, my object gained, shall depart in the presence of all the Rakshasas."

    '
  modern: 'Having destroyed the city of Laṅkā and paid my respects to Mithilā''s daughter, I shall depart, my object gained, in the presence of all the Rākṣasas."

    '
5.46.14:
  dutt: Sundara XLVIII
  text: 'Excited with a desire for fight and worked up with energy, Indrajit, eulogized by the friendly Rakshasas, set out for battle.

    '
  modern: 'Excited with a desire to fight and filled with energy, Indrajit, praised by his friendly Rākṣasas, set out for battle.

    '
5.46.17:
  dutt: Sundara XLVIII
  text: 'And that master of a car and foremost of bowmen, conversant with the use of all weapons —the best of those using swords— proceeded soon in his car where Hanuman was.

    '
  modern: 'That master of the chariot, foremost of bowmen, who knew the use of all weapons and was the best of swordsmen, soon drove in his chariot to where Hanumān was.

    '
5.46.19:
  dutt: Sundara XLVIII
  text: 'And taking up a bow and sharpened darts, Indrajit, versed in the rules of war, proceeded towards Hanuman.

    '
  modern: 'And taking up a bow and sharpened darts, Indrajit, versed in the rules of war, went towards Hanumān.

    '
5.46.30:
  dutt: Sundara XLVIII
  text: 'And those two heroes, gifted with swift movements and versed in the art of war, engaged in a combat, admired of all beings.

    '
  modern: 'And those two heroes, of swift movements and skilled in the art of war, engaged in a combat that all beings admired.

    '
5.46.34:
  dutt: Sundara XLVIII
  text: '… And that hero, foremost of those versed in the use of weapons, discharged at that best of monkeys the highly powerful weapon conferred on him by Brahma, the Great-father of the celestials.

    '
  modern: '… And that hero, foremost of those who know the use of weapons, discharged at that best of monkeys the powerful weapon given to him by Brahmā, the Great-father of the gods.

    '
5.46.36:
  dutt: Sundara XLVIII
  text: 'And knowing him incapable of being slain, Indrajit conversant with the use of weapons, bound that large-armed son of the Wind-god with that weapon. And being bound up by that Rakshasa with the weapon, the monkey became motionless and fell down on the earth.

    '
  modern: 'And knowing that he could not be slain, Indrajit, who knew the use of weapons, bound that long-armed son of the Wind-god with that weapon. Bound by that Rākṣasa with the weapon, the monkey became motionless and fell to the earth.

    '
5.46.52:
  dutt: Sundara XLVIII
  text: 'And the Rakshasas related unto the ruler of Rakshas everything touching that foremost of choice monkeys, resembling a mad elephant who was in bonds.

    '
  modern: 'And the Rākṣasas told the ruler of the Rākṣasas everything about that foremost of choice monkeys, who was like a mad elephant in bonds.

    '
5.47.15:
  dutt: Sundara XLIX
  text: 'And undergoing exceeding trouble at the hands of the Rakshas of dreadful prowess, (Hanuman) struck with mighty amaze, gazed at the lord of Rakshas.

    '
  modern: 'Though he suffered greatly at the hands of the Rākṣasas of dreadful prowess, Hanumān, struck with great amazement, gazed at the lord of the Rākṣasas.

    '
5.47.16:
  dutt: Sundara XLIX
  text: 'And seeing the sovereign of Rakshas, appearing splendid, Hanuman, bewildered by his effulgence, mentally reflected: …

    '
  modern: 'And seeing the sovereign of the Rākṣasas looking splendid, Hanumān, bewildered by his radiance, reflected in his mind: …

    '
5.47.17:
  dutt: Sundara XLIX
  text: '"Ah! the form! Ah! the patience! Ah! the strength! Ah! the splendour! Ah! the entire auspiciousness of the king of Rakshasas!

    '
  modern: '"Ah! the form! Ah! the patience! Ah! the strength! Ah! the splendour! Ah! the entire auspiciousness of the king of the Rākṣasas!

    '
5.47.18:
  dutt: Sundara XLIX
  text: 'If the lord of Rakshasas were not impious unto the height, this one could well be the protector themselves of the celestial regions with Sakra. …

    '
  modern: 'If the lord of the Rākṣasas were not so wicked, he could well be the protector of the heavenly regions, together with Śakra. …

    '
5.49.1:
  dutt: Sundara LI
  text: 'Seeing the Ten-necked one of mighty energy, that foremost of monkeys, endued with strength, calmly spoke unto him words containing sense, …

    '
  modern: 'Seeing the ten-necked one of mighty energy, that foremost of monkeys, full of strength, spoke to him calmly in words with meaning, …

    '
5.49.14:
  dutt: Sundara LI
  text: 'I, Hanuman by name, am the son of the Wind-god. For Sita, I, desirous of seeing her, have come hither, bounding over the main measuring a full hundred Yojanas.

    '
  modern: 'I, Hanumān by name, am the son of the Wind-god. I have come here, wishing to see Sītā, bounding over the sea, a full hundred yojanas wide.

    '
5.49.14+1:
  dutt: Sundara LI
  text: 'And as I was roving, I came to see Janaka’s daughter in thy house.

    '
  modern: 'And as I roamed about, I came to see Janaka''s daughter in your house.

    '
5.49.15:
  dutt: Sundara LI
  text: 'Thou art cognizant of righteousness and interest, and hast attained prosperity through thy asceticism. Therefore, O eminently wise one, thou ought not to confine another’s wife.

    '
  modern: 'You know righteousness and your own interest, and you have attained prosperity through your asceticism. Therefore, O very wise one, you should not confine another man''s wife.

    '
5.49.16:
  dutt: Sundara LI
  text: 'Actions opposed to righteousness, and bringing on countless evils, and causing extermination,—ill become persons of thy sort.

    '
  modern: 'Actions that are against righteousness, that bring endless evils and cause extermination, ill become persons of your sort.

    '
5.49.19:
  dutt: Sundara LI
  text: 'Treading the path of virtue and profit, do thou pay heed unto my speech fraught with good for three times; and do thou return Janaki unto that foremost of men.

    '
  modern: "Treading the path of virtue and profit, pay heed to my speech, which is full of good for all three times, and return Jānakī to that foremost of men."
5.50.1:
  dutt: Sundara LII
  text: 'Hearing the words of the high-souled monkey, Ravana, bereft of his senses by wrath, ordered that he should be put to death.

    '
  modern: 'Hearing the words of the noble monkey, Rāvaṇa, bereft of his senses by wrath, ordered that he be put to death.

    '
5.50.2:
  dutt: Sundara LII
  text: 'On the death of that one who had proclaimed his own position of being an envoy, having been ordered by the wicked-minded Ravana, Vibhishana did not agree (with the decision). …

    '
  modern: 'When Rāvaṇa, wicked-minded as he was, had ordered the death of the one who had declared himself an envoy, Vibhīṣaṇa did not agree with the decision. …

    '
5.51.1:
  dutt: Sundara LII
  text: 'Thereat, the lord of the night-rangers, that potent enemy of the celestials and the foremost of Rakshasa monarchs, lending free play to his intellect, accepted the excellent words of his younger brother.

    '
  modern: 'Then the lord of the night rangers, the mighty enemy of the gods and foremost of Rākṣasa kings, gave free play to his intellect and accepted the excellent words of his younger brother.

    '
5.51.3:
  dutt: Sundara LIII
  text: 'Certainly the tail is a darling ornament to a monkey. Therefore let his tail be set on fire anon; and this having been consumed, let him go away.

    '
  modern: 'Certainly the tail is a darling ornament to a monkey. So let his tail be set on fire at once, and when it has been burnt, let him go away.

    '
5.51.6:
  dutt: Sundara LIII
  text: 'Hearing his words, the Rakshasas, cruel through wrath, cover up his (Hanuman’s) tail with worn pieces of cotton cloth.

    '
  modern: 'Hearing his words, the Rākṣasas, cruel with wrath, wrapped his tail in worn pieces of cotton cloth.

    '
5.52.1:
  dutt: Sundara LIV
  text: 'Casting his eyes on Lanka, the monkey, his wish attained, increasing his person and bursting with spirits, considered as to how to give the coup de grace to his exertions.

    '
  modern: 'Casting his eyes on Laṅkā, the monkey, his wish attained, increased his size and, bursting with spirits, considered how to give the finishing stroke to his exertions.

    '
5.52.5:
  dutt: Sundara LIV
  text: 'That bearer of sacrificial offerings who flameth on my tail,—it is my duty to propitiate him with these excellent edifices."

    '
  modern: 'That bearer of sacrificial offerings who flames on my tail: it is my duty to appease him with these excellent edifices."

    '
5.52.6:
  dutt: Sundara LIV
  text: 'Thereat that mighty monkey, with his tail aglow, and resembling a cloud (luminous) with lightning, began to range before the dwellings in Lanka.

    '
  modern: 'Then that mighty monkey, with his tail aglow, like a cloud lit by lightning, began to range before the dwellings in Laṅkā.

    '
5.5.15:
  dutt: Sundara IV
  text: 'And moving from house to house, that foremost of monkeys observed on all sides various dwellings of diverse forms and color, …

    '
  modern: 'And moving from house to house, that foremost of monkeys observed on all sides dwellings of various forms and colours, …

    '
5.52.17:
  dutt: Sundara LIV
  text: 'And having consumed the city of Lanka, the great monkey quenched the fire of his tail in the ocean.

    '
  modern: 'And having burnt the city of Laṅkā, the great monkey quenched the fire of his tail in the ocean.

    '
5.54.1:
  dutt: Sundara LVI
  text: 'Then seeing Janaki seated at the foot of the Sinsapa tree, (Hanuman) saluting her said,—"By luck it is that I see thee unhurt."

    '
  modern: 'Then, seeing Jānakī seated at the foot of the Siṃśapā tree, Hanumān saluted her and said: "By good luck I see you unhurt."

    '
5.55.18:
  dutt: Sundara LVII
  text: 'And then the vehement monkey resembling a hill, having leapt up from that mountain, alighted on the top of that (other) mountain filled with trees. And bursting with delight, (Hanuman) dropped near a fountain, like unto a hill whose wings have been clipped.

    '
  modern: 'And then the vehement monkey, like a hill, leapt up from that mountain and alighted on the top of another mountain full of trees. And, bursting with delight, Hanumān dropped near a fountain, like a hill whose wings have been clipped.

    '
5.55.19:
  dutt: Sundara LVII
  text: 'Then with joyful hearts, all the principal monkeys stood encircling the high-souled Hanuman.

    '
  modern: 'Then, with joyful hearts, all the principal monkeys stood around the noble Hanumān.

    '
5.55.21:
  dutt: Sundara LVII
  text: 'And bringing fruits and roots, the monkeys honored that chief of monkeys, the offspring of the Wind-god.

    '
  modern: 'And bringing fruits and roots, the monkeys honoured that chief of the monkeys, the son of the Wind-god.

    '
5.55.23:
  dutt: Sundara LVII
  text: '… And that mighty monkey, Hanuman, saluted his superiors and the aged, headed by Jambavan; as well as Prince Angada.

    '
  modern: '… And the mighty monkey Hanumān saluted his superiors and the aged, headed by Jāmbavān, and Prince Aṅgada.

    '
5.55.26:
  dutt: Sundara LVII
  text: '… Then asked (by them), Hanuman addressed those foremost monkeys,—"I have seen Janaka’s daughter in the Acoka woods.

    '
  modern: '… Then, asked by them, Hanumān spoke to those foremost of monkeys: "I have seen Janaka''s daughter in the Aśoka woods.

    '
5.55.27:
  dutt: Sundara LVII
  text: 'That blameless one is guarded by dreadful Rakshasis. The girt weareth a single braid of hair, and burneth to attain a sight of Rama. She is faint in consequence of fasting, and dirty, weareth matted locks and is emaciated."

    '
  modern: 'That blameless woman is guarded by dreadful Rākṣasīs. She wears a single braid of hair and burns to get a sight of Rāma. She is faint with fasting, dirty, wears matted locks and is emaciated."

    '
5.59.2:
  dutt: Sundara LXI
  text: 'And these leading monkeys headed by the Wind-god’s son proceeded leaping from the summit of the Mount Mahendra.

    '
  modern: 'And these leading monkeys, headed by the Wind-god''s son, went leaping from the summit of Mount Mahendra.

    '
5.59.7:
  dutt: Sundara LXI
  text: 'And leaping and ascending the sky they got at the Madhuvana, preserved by Sugriva, resembling the celestial garden, covered with many trees, picturesque and incapable of being devastated by any.

    '
  modern: 'And leaping and mounting the sky, they came to the Madhuvana, preserved by Sugrīva, like the heavenly garden, covered with many trees, picturesque and impossible for anyone to lay waste.

    '
5.62.37:
  dutt: Sundara LXIV
  text: 'And those heroes headed by Angada, delighted and intoxicated, descended before Raghava and the lord of the monkeys.

    '
  modern: 'And those heroes, headed by Aṅgada, delighted and intoxicated, descended before Rāghava and the lord of the monkeys.

    '
5.62.38:
  dutt: Sundara LXIV
  text: 'And the mighty-armed Hanuman, lowering his head, related unto Raghava, Sita’s spiritual and physical well-being.

    '
  modern: 'And the mighty-armed Hanumān, lowering his head, told Rāghava of Sītā''s well-being in spirit and body.

    '
5.63.9:
  dutt: Sundara LXV
  text: 'Lanka is situated on the southern bank of the southern occean.

    '
  modern: 'Laṅkā is situated on the southern bank of the southern ocean.

    '
5.63.10:
  dutt: Sundara LXV
  text: 'And I saw there Sita, in the inner appartment of Ravana. Centering all her thoughts in thee, breathes that damsel, O Rama.

    '
  modern: 'And I saw Sītā there, in Rāvaṇa''s inner apartment. She breathes with all her thoughts centred on you, O Rāma.

    '
5.63.15:
  dutt: Sundara LXV
  text: 'O Kakutstha, O innocent prince, after enquiring for sometime, I found that worshipful dame devoted unto thee, and narrating the glories of the Ikshwaku race, O foremost of men, I created her confidence by and by, and addressing her I related everything.

    '
  modern: 'O Kākutstha, O sinless prince, after inquiring for some time, I found that revered lady devoted to you. And, recounting the glories of the Ikṣvāku race, O foremost of men, I gradually created her confidence and, addressing her, told her everything.

    '
5.63.16:
  dutt: Sundara LXV
  text: 'And hearing of the friendship between thee and Sugriva she was greatly delighted.

    '
  modern: 'And hearing of the friendship between you and Sugrīva, she was greatly delighted.

    '
5.63.18:
  dutt: Sundara LXV
  text: 'O thou of great intelligence, O Raghava, offering me (this jewel) as a token, she wanted me to relate unto thee, the occurrence at the mount chitrakuta regarding the crow.

    '
  modern: 'O wise one, O Rāghava, offering me this jewel as a token, she wanted me to tell you of the occurrence on Mount Citrakūṭa regarding the crow.

    '
5.63.20:
  dutt: Sundara LXV
  text: 'And relating everything before Sugriva, do thou present him with this jewel which has been preserved by me with great care.

    '
  modern: 'And when you tell everything before Sugrīva, present him with this jewel, which I have preserved with great care.

    '
5.63.22:
  dutt: Sundara LXV
  text: 'I have kept with great care this excellent jewel of great effulgence. … O innocent monkey, greatly delighted am I on beholding the brilliant jewel which he has sent through thee.

    '
  modern: 'I have kept with great care this excellent jewel of great radiance. … O sinless monkey, I am greatly delighted to see the brilliant jewel that he has sent through you.

    '
5.63.23:
  dutt: Sundara LXV
  text: 'Breathe shall I only for a month, beyond that I shall never live, subject as I am to the demons.

    '
  modern: 'I shall breathe for only a month; beyond that I shall never live, subject as I am to the demons.

    '
5.64.2:
  dutt: Sundara LXVI
  text: 'And beholding that excellent jewel, Raghava, stricken with grief, with eyes full of tears, spake unto Sugriva, saying,— …

    '
  modern: 'And seeing that excellent jewel, Rāghava, stricken with grief and with eyes full of tears, said to Sugrīva: …

    '
5.64.7:
  dutt: Sundara LXVI
  text: 'This excellent jewel appeared beautiful on the crown of my dear one, and methinks, on beholding it, I have as if got back my beloved spouse.

    '
  modern: 'This excellent jewel looked beautiful on the crown of my dear one, and I think that on seeing it I have as if got my beloved wife back.

    '
5.64.11:
  dutt: Sundara LXVI
  text: 'Do thou take me there where thou hast beheld my dear spouse.

    '
  modern: 'Take me to the place where you saw my dear wife.

    '
5.64.15:
  dutt: Sundara LXVI
  text: '… O Hanuman, what halh my dear wife, sweetspeeched, and highly beautiful, spoken unto thee, being separated from me? How breathes she going through a series of calamities?"

    '
  modern: '… O Hanumān, what has my dear wife, sweet of speech and so beautiful, said to you, being parted from me? How does she live, going through a series of calamities?"

    '
5.65.1:
  dutt: Sundara LXVII
  text: 'Being thus addressed by the high-souled Raghava, Hanuman, related unto him all of what Sita had said,— …

    '
  modern: 'Thus addressed by the noble Rāghava, Hanumān told him all that Sītā had said: …

    '
5.65.33:
  dutt: Sundara LXVII
  text: 'Addressing me with these words she again said—’O Hanuman, do thou relate my well-being unto Rama and Lakshmana of leonine prowess, and Sugriva accompanied by his followers.

    '
  modern: 'Addressing me with these words she said again: ''O Hanumān, tell Rāma and Lakṣmaṇa, of leonine prowess, and Sugrīva with his followers of my well-being.

    '
5.65.34:
  dutt: Sundara LXVII
  text: 'Do thou so describe as the large-armed Raghava may save me from this ocean of grief. Do thou narrate unto Rama this my terrible sorrow and the affliction by the she-demons.

    '
  modern: 'Describe it so that the long-armed Rāghava may save me from this ocean of grief. Tell Rāma this terrible sorrow of mine, and my affliction by the she-demons.

    '
5.66.16:
  dutt: Sundara LXVIII
  text: 'Hearing these sound reasonable and affectionate words I gave her the last reply, saying— …

    '
  modern: 'Hearing these sound, reasonable and affectionate words, I gave her my last reply: …

    '
5.66.24:
  dutt: Sundara LXVIII
  text: '… O great damsel, these two princes, placing themselves on my back shall come to thee like unto the rising Sun and Moon.

    '
  modern: '… O great lady, those two princes, placing themselves on my back, will come to you like the rising Sun and Moon.

    '
5.66.25:
  dutt: Sundara LXVIII
  text: 'Thou shalt soon behold before Lanka’s gate Raghava the slayer of foes resembling a lion and Lakshmana with a bow in his hand.

    '
  modern: 'You will soon see Rāghava, the slayer of foes, like a lion, and Lakṣmaṇa with a bow in his hand, before Laṅkā''s gate.

    '
5.66.28:
  dutt: Sundara LXVIII
  text: 'And thou shalt soon behold Raghava, the slayer of foes, installed along with thee on the throne of Ayodhya after returning from the forest."

    '
  modern: 'And you will soon see Rāghava, the slayer of foes, installed with you on the throne of Ayodhyā after returning from the forest."

    '
6.1.1:
  dutt: Yuddha I
  text: 'Hearing the words of Hanuman rehearsed properly, Rama, exceedingly delighted, said,— …

    '
  modern: 'Hearing Hanumān''s words rehearsed properly, Rāma, exceedingly delighted, said: …

    '
6.4.3:
  dutt: Yuddha IV
  text: 'Therefore, at this very moment arrange for Sugriva’s march.

    '
  modern: 'Therefore, at this very moment, arrange for Sugrīva''s march.

    '
6.4.18:
  dutt: Yuddha IV
  text: 'Hearing Raghava’s words, that foremost of monkeys and lord of the army, the exceedingly energetic Sugriva, issued his orders.

    '
  modern: 'Hearing Rāghava''s words, that foremost of monkeys and lord of the army, the exceedingly energetic Sugrīva, gave his orders.

    '
6.5.3:
  dutt: Yuddha V
  text: 'And the army being encamped on the shore of the lord of streams and rivers, Rama, beholding Lakshmana by his side, spoke, saying— "I know that grief abates as time passes by, but my sorrow arising from the separation of my spouse, is increasing day by day.

    '
  modern: 'And when the army was encamped on the shore of the lord of streams and rivers, Rāma, seeing Lakṣmaṇa at his side, said: "I know that grief grows less as time passes, but my sorrow from the separation from my wife is increasing day by day.

    '
6.5.4:
  dutt: Yuddha V
  text: (with 6.5.3)
6.5.6:
  dutt: Yuddha V
  text: 'O Wind, do thou go there where my dear spouse is, and touching her person, do thou touch me, for I shall then be happy stationing my looks in the Moon and being touched by thee.

    '
  modern: 'O Wind, go to where my dear wife is, and touching her body, touch me, for then I shall be happy, fixing my eyes on the Moon and touched by you.

    '
6.5.18:
  dutt: Yuddha V
  text: 'When shall I, piercing with my shafts the breast of the lord of Rakshasas, renounce my mind’s grief?

    '
  modern: 'When shall I pierce the breast of the lord of the Rākṣasas with my shafts and give up the grief of my mind?

    '
6.5.21:
  dutt: Yuddha V
  text: 'The highly intelligent Rama bewailing thus, the day passed away and the Sun, decreasing gradually, disappeared at last.

    '
  modern: 'While the wise Rāma lamented thus, the day passed away, and the Sun, sinking gradually, set at last.

    '
6.6.1:
  dutt: Yuddha VI
  text: 'Beholding in Lanka that dreadful and awe-inspiring work performed by Hanuman like unto the high-souled Sakra, the lord of Rakshasas, looking down with shame, addressed them all, saying—"That monkey alone hath invaded and entered the city of Lanka hard to reach and hath espied Sita, the daughter of king Janaka.

    '
  modern: 'Seeing in Laṅkā that dreadful and awe-inspiring work done by Hanumān, who was like the noble Śakra, the lord of the Rākṣasas, looking down in shame, spoke to them all: "That monkey alone has invaded and entered the city of Laṅkā, hard to reach, and has seen Sītā, the daughter of King Janaka.

    '
6.6.2:
  dutt: Yuddha VI
  text: (with 6.6.1)
6.6.16:
  dutt: Yuddha VI
  text: 'Environed by a thousand of patient monkeys, Rama, with a view to capture our city, is approaching towards Lanka.

    '
  modern: 'Surrounded by a thousand patient monkeys, Rāma is approaching Laṅkā, to capture our city.

    '
6.6.17:
  dutt: Yuddha VI
  text: 'Forsooth, shall he cross over the main along with his younger brother and a mighty host. …

    '
  modern: 'Surely he will cross the sea with his younger brother and a mighty host. …

    '
6.7.1:
  dutt: Yuddha VII
  text: 'Being thus accosted by their lord, the highly powerful Rakshasas, devoid of good sense and ignorant of sound counsel, replied with folded palms, saying,— …

    '
  modern: 'Thus addressed by their lord, the powerful Rākṣasas, lacking good sense and ignorant of sound counsel, replied with folded palms: …

    '
6.9.6:
  dutt: Yuddha IX
  text: '… And, flaming in energy, they all addressed Ravana, saying,—"To-day shall we slay Rama, and Sugriva along with Lakshmana, and the helpless Hanuman, who hath damaged Lanka.

    '
  modern: '… Blazing with energy, they all said to Rāvaṇa: "Today we shall slay Rāma, and Sugrīva with Lakṣmaṇa, and the helpless Hanumān, who has damaged Laṅkā.

    '
6.9.7:
  dutt: Yuddha IX
  text: 'Then, preventing them, who had (thus) equipped themselves with all kinds of weapons, and making them sit down, Vibhishana, with joined hands, again spoke unto them, saying,—"The wise have asserted that an appeal to prowess should be resorted to anent a business then only when the end sought cannot be attained through the three (other) means.

    '
  modern: 'Then Vibhīṣaṇa stopped them, who had armed themselves with all kinds of weapons, made them sit down, and, with joined hands, spoke to them again: "The wise have said that an appeal to prowess should be made in a matter only when the end sought cannot be attained by the three other means.

    '
6.9.8:
  dutt: Yuddha IX
  text: (with 6.9.7)
6.9.13:
  dutt: Yuddha IX
  text: 'And what was the wrong that formerly had been done by Rama unto the king of the Rakshasas, that he hath carried off from Janasthana the spouse of that illustrious one?

    '
  modern: 'And what wrong did Rāma do before to the king of the Rākṣasas, that he carried off from Janasthāna the wife of that illustrious man?

    '
6.9.15:
  dutt: Yuddha IX
  text: 'It is for this great fear that exerciseth us on the score of Vaidehi owing its existence to this,’ that she, having been ravished, should (now) be given up.

    '
  modern: 'It is for this great fear that we have on account of Vaidehī, because she was ravished, that she should now be given up.

    '
6.9.16:
  dutt: Yuddha IX
  text: 'And (Rama), possessed of prowess, yet ever abiding by morality, is incapable of initiating hostilities for no purpose. Therefore, do ye give him his Maithili.

    '
  modern: 'And Rāma, a man of prowess, who always keeps to morality, would not start hostilities for no purpose. Therefore give him his Maithilī.

    '
6.9.16+1:
  dutt: Yuddha IX
  text: 'I say what is truth and what also is for thy good.

    '
  modern: 'I say what is true and what is for your good.

    '
6.10.1:
  dutt: Yuddha XVI
  text: 'Bibhishana addressing him with these excellent and auspicious words, fraught with high sense, Ravana, impelled by Death, again spake in harsh accents.—"It is better to live with open enemies or enraged serpents than with those who pass for friends but are in reality foes.

    '
  modern: 'When Vibhīṣaṇa had addressed him with these excellent and auspicious words, full of high sense, Rāvaṇa, driven by Death, spoke again in harsh tones: "It is better to live with open enemies or enraged serpents than with those who pass for friends but are in reality foes.

    '
6.10.2:
  dutt: Yuddha XVI
  text: (with 6.10.1)
6.10.3:
  dutt: Yuddha XVI
  text: 'I know well the nature of kinsmen, in all the worlds, O Rakhasa,—one takes delight in another’s misfortune.

    '
  modern: 'I know well the nature of kinsmen in all the worlds, O Rākṣasa: one takes delight in another''s misfortune.

    '
6.10.9:
  dutt: Yuddha XVI
  text: 'In kine there is milk, in kinsmen, there is fear, in women there is fickleness, and in Brahmanas, there is asceticism.

    '
  modern: 'In cows there is milk, in kinsmen there is fear, in women there is fickleness, and in Brahmins there is asceticism.

    '
6.10.11:
  dutt: Yuddha XVI
  text: 'Fie thee, O monkey, O thou that bringest disgrace on the family. Had any one else spoken thus he would have ceased to live by this time".

    '
  modern: "Fie on you, O monkey, you who bring disgrace on the family. Had anyone else spoken thus, he would have ceased to live by this time."
  departs: The Sanskrit addresses Vibhīṣaṇa as niśācara (night-ranger, i.e. Rākṣasa), not 'monkey'.
6.10.12:
  dutt: Yuddha XVI
  text: 'Being thus accosted harshly, Bibhisana, speaking truth, rose up along with four Rakshasas having maces in their hands.

    '
