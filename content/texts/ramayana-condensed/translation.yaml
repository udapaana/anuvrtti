6.96.20:
  dutt: Yuddha CIX
  text: 'Thereupon Rama of long-arms, the enhancer of the glory of Raghu’s race, enraged, set his arrow, resembling a serpent, on his bow, and cut assunder Ravana’s head wearing shinning Kundalas. And that head in the presence of the inhabitants of the three regions fell down on the earth.

