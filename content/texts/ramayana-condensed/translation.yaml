  modern: 'Having said this, Rāvaṇa, furiously enraged, discharged at Lakṣmaṇa that dart forged by Maya with his power of illusion, furnished with eight bells, of mighty sounds, irresistible, able to finish foes and flaming in energy, and shouted at the same time.

