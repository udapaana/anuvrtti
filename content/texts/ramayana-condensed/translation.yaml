  modern: 'Thus addressed by the lord of the Rākṣasas, and obeying his father''s command, Indrajit went to the sacrificial ground to satisfy Fire with oblations.

    '
6.72.18:
  dutt: Yuddha LXXXV
  text: 'And Raghava, being well acquainted with the illusive energy of his wicked-minded foe, addressed the renowned Lakshmana, saying,—"Environed by the entire host of the lord of monkeys,—accompanied by the leaders, O Lakshmana, headed by Hanuman,—with Jambavan~king of bears—and girt round by the forces,—do thou slay this son of the Rakshasa, possessed of the strength of illusion.

    '
  modern: 'And Rāghava, well acquainted with the illusive power of his wicked-minded foe, said to the renowned Lakṣmaṇa: "Surrounded by the entire host of the lord of the monkeys, and accompanied by the leaders, O Lakṣmaṇa, headed by Hanumān, with Jāmbavān, king of the bears, and girt round by the forces, slay this son of the Rākṣasa, who has the strength of illusion.

    '
6.72.20:
  dutt: Yuddha LXXXV
  text: (with 6.72.18)
