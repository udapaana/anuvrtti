    '
6.99.29+2:
  dutt: Yuddha CXIII
  text: 'Thereupon the other wives, of Ravana, greatly distressed and weeping, and raising her up who was greatly weeping, began to console her saying:—"Dost thou not know, O worshipful dame, that the life of beings is very uncertain, and with adverse circumstances even the royal fortune becometh fickle?"

    '
  modern: 'Then the other wives of Rāvaṇa, greatly distressed and weeping, raised her up as she wept bitterly and began to console her: "Do you not know, O revered lady, that the life of beings is very uncertain, and that with adverse circumstances even royal fortune becomes fickle?"

    '
6.99.30:
  dutt: Yuddha CXIII
  text: 'In the meantime Rama said to Bibhisana,— "Do thou perform the funeral ceremonies of thy brother and console his wives".

    '
  modern: 'Meanwhile Rāma said to Vibhīṣaṇa: "Perform the funeral ceremonies of your brother and console his wives."

    '
6.99.40:
  dutt: Yuddha CXIII
  text: '… Do thou (therefore) perform his cremation ceremony—he is unto thee as he is unto me. O thou of long-arms it behoveth thee to perform, speedily with due rites and religious ceremonies, his funeral ceremony—thou shalt be the object of praise (unto people)".

    '
  modern: '… Perform his cremation; he is to you as he is to me. O you of long arms, you should perform his funeral ceremony quickly, with due rites and religious ceremonies; you will be praised by people."

    '
6.100.5:
  dutt: Yuddha CXIV
