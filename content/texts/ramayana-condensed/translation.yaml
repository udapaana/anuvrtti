  modern: '… Heroes who keep to the virtues of the Kṣatriyas, who fall on the battlefield to increase their glory, should not be mourned when dead. … Besides, success in battle is not perpetual: either one slays one''s enemy or meets one''s own destruction at his hands in the conflict. …

