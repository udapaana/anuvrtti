6.95.1+1:
  dutt: Yuddha CIX
  text: 'And the crowd of Gandharbas and Apsaras beholding that wonderful battle between Rama and Ravana, said,—"The ocean resembleth the sky and the sky resembleth the ocean—forsooth this encounter between Rama and Ravana befits them only".

