    '
6.100.9:
  dutt: Yuddha CXIV
  text: 'Thereupon Kakutstha spoke unto Lakshmana— the son of Sumitra gifted with auspicious marks who was near him— "O gentle one, take this Bibhishana to the city of Lanka ever devoted and attached unto us, and who had done us good.

    '
  modern: 'Then Kākutstha said to Lakṣmaṇa, the son of Sumitrā, who was marked with auspicious signs and stood near him: "O gentle one, take this Vibhīṣaṇa, ever devoted and attached to us and who has done us good, to the city of Laṅkā.

    '
6.100.10:
  dutt: Yuddha CXIV
  text: 'This is my great desire that I may behold Bibhishana the younger brother of Ravana installed on the throne of Lanka".

    '
  modern: 'This is my great desire, that I may see Vibhīṣaṇa, the younger brother of Rāvaṇa, installed on the throne of Laṅkā."

    '
6.100.11:
  dutt: Yuddha CXIV
  text: 'Being thus addressed by the highsouled Raghava, the son of Sumitra, saying—"So be it" and greatly delighted, brought a golden jar.

    '
  modern: 'Thus addressed by the noble Rāghava, the son of Sumitrā said, "So be it," and, greatly delighted, brought a golden jar.

    '
6.100.13:
  dutt: Yuddha CXIV
  text: '… Saumitri with that water sprinkled Bibhishana as king of Lanka in the presence of all the Rakshasas, at Rama’s command. … all the Rakshasas, devoted unto him, his counsellors and the monkeys attaining incomparable delight, sang the glory of Rama.

    '
  modern: '… Saumitri, at Rāma''s command, sprinkled him with that water as king of Laṅkā in the presence of all the Rākṣasas. … all the Rākṣasas devoted to him, his counsellors and the monkeys, filled with incomparable delight, sang the glory of Rāma.

    '
6.100.15:
  dutt: Yuddha CXIV
  text: '… And consoling his subjects he went to Rama.

    '
  modern: '… And, consoling his subjects, Vibhīṣaṇa went to Rāma.

    '
6.100.21:
  dutt: Yuddha CXIV
  text: 'Do thou, O foremost of monkeys, inform Vaidehi of the destruction of Ravana in conflict after communicating unto her mine health as well as that of Lakshmana and Sugriva.

    '
  modern: 'O foremost of monkeys, inform Vaidehī of the destruction of Rāvaṇa in the conflict, after telling her of my health and that of Lakṣmaṇa and Sugrīva.

    '
6.101.1:
  dutt: Yuddha CXV
  text: 'Being thus commanded, Hanuman, the son of Maruta, worshipped of the night-rangers, entered the city of Lanka.

    '
  modern: 'Thus commanded, Hanumān, the son of Maruta, honoured by the night rangers, entered the city of Laṅkā.

    '
6.101.1+1:
  dutt: Yuddha CXV
  text: '… And entering there duly, the monkey, who was already known to Sita, espied her, having her person not cleansed, like Rohini, oppressed by Rahu, sitting at the foot of a tree, devoid of joy and encircled by she-demons.

    '
  modern: '… And, entering there duly, the monkey, who was already known to Sītā, saw her, with her person unwashed, like Rohiṇī oppressed by Rāhu, sitting at the foot of a tree, devoid of joy and surrounded by she-demons.

    '
6.101.3:
  dutt: Yuddha CXV
  text: 'And approaching her and bowing unto her, he stood there humbly and unmoved.

    '
  modern: 'And approaching her and bowing to her, he stood there humbly and unmoving.

    '
6.101.3+1:
  dutt: Yuddha CXV
  text: 'O worshipful dame, the powerful Ravana hath been slain by Rama, helped by Bibhishana and accompanied by the monkeys and Lakshmana.

    '
  modern: 'O revered lady, the powerful Rāvaṇa has been slain by Rāma, helped by Vibhīṣaṇa and accompanied by the monkeys and Lakṣmaṇa.

    '
6.101.4:
  dutt: Yuddha CXV
  text: 'And beholding her gentle countenance, Hanuman, the best of monkeys, began to relate unto her what Rama had said—"O Vaidehi, it is all well with Rama, Sugriva and Lakshmana.

    '
  modern: 'And seeing her gentle face, Hanumān, the best of monkeys, began to tell her what Rāma had said: "O Vaidehī, it is all well with Rāma, Sugrīva and Lakṣmaṇa.

    '
6.101.5:
  dutt: Yuddha CXV
  text: 'He hath enquired after thy welfare. He hath accomplished his end subduing his enemies— and his enemy is slain.

    '
  modern: 'He has asked after your welfare. He has accomplished his end by subduing his enemies, and his enemy is slain.

    '
6.101.6:
  dutt: Yuddha CXV
  text: (with 6.101.5)
6.101.7:
  dutt: Yuddha CXV
  text: 'I do relate unto thee this pleasant news, O worshipful dame; I do again delight thee; it is by thy grace, O thou conversant with piety, O Sita, victory hath been gained.

    '
  modern: 'I tell you this pleasant news, O revered lady, and I delight you again; it is by your grace, O you who know piety, O Sītā, that victory has been gained.

    '
6.101.8:
  dutt: Yuddha CXV
  text: 'Do thou be consoled and relieved of thy anxiety. The enemy Ravana hath been slain and the city of Lanka, hath been brought under submission.

    '
  modern: 'Be consoled and free of your anxiety. The enemy Rāvaṇa has been slain, and the city of Laṅkā has been brought into submission.

    '
6.101.9:
  dutt: Yuddha CXV
  text: '(Rama said),—’For discomfitting thy enemy a bridge was constructed over the sea by me who was determined and who did not sleep (for days) and thus my promise hath been fulfilled.

    '
  modern: "Rāma said: 'For defeating your enemy I built a bridge over the sea, determined and without sleep for days, and so my promise has been fulfilled."
6.101.10:
  dutt: Yuddha CXV
  text: 'Do thou not be afraid for living in Ravana’s abode for I have placed at Bibhishana’s hands the sovereignty of Lanka. Do thou be consoled thinking as if that thou art living in thy own house.

    '
  modern: 'Do not be afraid of living in Rāvaṇa''s abode, for I have placed the sovereignty of Laṅkā in Vibhīṣaṇa''s hands. Be consoled, thinking that you are living in your own house.

    '
6.101.12:
  dutt: Yuddha CXV
  text: 'Being thus accosted the worshipful Sita, having a moon-like countenance, and her voice choked in delight, could not utter any thing.

    '
  modern: 'Thus addressed, the revered Sītā, with a face like the moon and her voice choked with delight, could not utter a word.

    '
6.101.14:
  dutt: Yuddha CXV
  text: 'Being thus addressed by Hanuman, Sita, ever treading the paths of morality, greatly delighted, replied with words suppressed by tears. …

    '
  modern: 'Thus addressed by Hanumān, Sītā, ever treading the paths of morality, greatly delighted, replied in words choked with tears. …

    '
6.101.16:
  dutt: Yuddha CXV
  text: 'O monkey, I do not perceive any such thing which I can confer upon thee, in return, for this pleasant news. I do dot see any such thing on this earth which can match thy pleasant tidings and bestowing which upon thee I may be happy.

    '
  modern: 'O monkey, I do not see anything that I can give you in return for this pleasant news. I do not see anything on this earth that can match your pleasant tidings and that I could give you and be happy.

    '
6.101.18:
  dutt: Yuddha CXV
  text: 'Silver, gold, or diverse jewels or the kingdom of the three worlds—nothing is a becoming return for thy speech".

    '
  modern: 'Silver, gold, or various jewels, or the kingdom of the three worlds: nothing is a fitting return for your words."

    '
6.101.19:
  dutt: Yuddha CXV
  text: 'Being thus addressed by Vaidehi the monkey replied—folding his hands with delight and stationed before Sita,—’ O blameless damsel, forsooth this excellent speech becometh thee, who is ever engaged in the welfare of thy husband and ever desirous of his victory.

    '
  modern: 'Thus addressed by Vaidehī, the monkey replied, folding his hands with delight and standing before Sītā: "O blameless lady, surely this excellent speech becomes you, who are ever engaged in the welfare of your husband and ever desirous of his victory.

    '
6.101.20:
  dutt: Yuddha CXV
  text: (with 6.101.19)
6.101.21:
  dutt: Yuddha CXV
  text: 'I do consider, O worshipful dame, these words of thine, far greater than the wealth, jewels or even the sovereignty over the celestials.

    '
  modern: 'I consider these words of yours, O revered lady, far greater than wealth, jewels or even the sovereignty over the gods.

    '
6.101.23:
  dutt: Yuddha CXV
  text: '… If dost thou permit me I may slay all these she-demons who had tortured thee before, …

    '
  modern: '… If you permit me, I may slay all these she-demons who tortured you before, …

    '
6.101.29:
  dutt: Yuddha CXV
  text: 'Being thus addressed by Hanuman, she, ever kind unto the poor, thinking and meditating, said to him—"O foremost of monkeys, why art thou angry with these she-slaves, who subject as they are to the command of their lord, have done this in accordance with another’s order.

    '
  modern: 'Thus addressed by Hanumān, she, ever kind to the poor, thinking and meditating, said to him: "O foremost of monkeys, why are you angry with these slave women, who, subject as they are to their lord''s command, have done this on another''s order?

    '
6.101.30:
  dutt: Yuddha CXV
  text: (with 6.101.29)
6.101.31:
  dutt: Yuddha CXV
  text: 'For my adverse fortune and vicious deeds perpetrated in another birth I have been subject to such a plight and been suffering the consequence thereof.

    '
  modern: 'For my adverse fortune and the evil deeds I did in another birth I have come to such a plight and am suffering the consequences.

    '
6.101.32:
  dutt: Yuddha CXV
  text: 'Such is the course of Fortune. Forsooth by my ill-luck I have met with (this misfortune).

    '
  modern: 'Such is the course of Fortune. Surely it is by my ill luck that I have met with this misfortune.

    '
6.101.33:
  dutt: Yuddha CXV
  text: 'I forgive, out of pity, all these she-servants of Ravana; they used to torture me at the command of that Rakshasa. And he being slain they shall not repress me any longer, O son of the Wind-god.

    '
  modern: 'I forgive, out of pity, all these servants of Rāvaṇa; they used to torture me at the command of that Rākṣasa. And with him slain, they will not oppress me any longer, O son of the Wind-god.

    '
6.102.13:
  dutt: Yuddha CXVI
  text: 'Thereupon placing Sita, bathed, performing the due rites wearing valuable clothes and adorned with valuable ornaments, on a palanquin, carried by many a capable Rakshasa, brought her (unto Rama).

    '
  modern: 'Then Vibhīṣaṇa had Sītā bathed, her due rites performed, dressed in valuable clothes and adorned with valuable ornaments, placed on a palanquin carried by many capable Rākṣasas, and brought her to Rāma.

    '
6.102.14:
  dutt: Yuddha CXVI
  text: (with 6.102.13)
6.102.16:
  dutt: Yuddha CXVI
  text: 'And hearing of her arrival who had lived long in the abode of the Rakshasa Raghava, the slayer of enemies attained (simultaneously) to anger, delight and depression.

    '
  modern: 'And hearing of the arrival of her who had lived long in the abode of the Rākṣasa, Rāghava, the slayer of enemies, was seized at once by anger, delight and depression.

    '
6.102.33:
  dutt: Yuddha CXVI
  text: 'As if hiding herself in her own person in shame Maithili, following Bibhishana, approached her husband.

    '
  modern: 'As if hiding herself in her own person in shame, Maithilī, following Vibhīṣaṇa, approached her husband.

    '
6.102.35:
  dutt: Yuddha CXVI
  text: 'And she, having a gentle countetiance and always regarding her husband as her god, fixed her looks upon her lord’s face out of surprise, joy and love. And beholding the gentle countenance of her dearest lord, resembling the full moon she removed her mental distress.

    '
  modern: 'And she, with a gentle face, always regarding her husband as her god, fixed her eyes on her lord''s face in surprise, joy and love. And seeing the gentle face of her dearest lord, like the full moon, she put away her mental distress.

    '
6.103.1:
  dutt: Yuddha CXVII
  text: 'Beholding Maithili standing humbly by him, Rama began to give vent to his pent-up feelings—"O gentle one, destroying all the enemies in the arena of battle I have subdued thy enemy—I have done all that can be accomplished by manliness.

    '
  modern: 'Seeing Maithilī standing humbly by him, Rāma began to give vent to his pent-up feelings: "O gentle one, destroying all the enemies in the arena of battle, I have subdued your enemy; I have done all that manliness can accomplish.

    '
6.103.2:
  dutt: Yuddha CXVII
  text: (with 6.103.1)
6.103.3:
  dutt: Yuddha CXVII
  text: 'I have reached the other end of my anger, rubbed off (the insult) for my spouse being taken away by the enemy and have killed simultaneously my disgrace and enemy.

    '
  modern: 'I have reached the other end of my anger and wiped out the insult to my wife when she was carried off by the enemy, and I have killed my disgrace and my enemy together.

    '
6.103.4:
  dutt: Yuddha CXVII
  text: 'My manliness hath been displayed to-day, my labour hath been crowned with success and to-day I have fulfilled my promise by my own prowess. …

    '
  modern: 'My manliness has been shown today, my labour has been crowned with success, and today I have fulfilled my promise by my own prowess. …

    '
6.103.17:
  dutt: Yuddha CXVII
  text: 'I have suspected thy character; thou, (therefore) standing before me, art distressing me like unto a lamp before one who is subject to an eye-disease.

    '
  modern: 'I have suspected your character; and so, standing before me, you distress me like a lamp before one with an eye disease.

    '
6.103.19:
  dutt: Yuddha CXVII
  text: 'What powerful man, born in a high family, take back his wife considering her as friend out of lust, who hath lived long in another’s house?

    '
  modern: 'What powerful man, born in a high family, would take back his wife, regarding her as a friend, out of lust, after she has lived long in another man''s house?

    '
6.103.20:
  dutt: Yuddha CXVII
  text: 'Thou wert taken by Ravana on his lap, beheld by him with sinful eyes; how can I, taking thee back, bring disgrace upon my great family?

    '
  modern: 'You were taken by Rāvaṇa on his lap and looked at by him with sinful eyes; how can I take you back and bring disgrace upon my great family?

    '
6.103.21:
  dutt: Yuddha CXVII
  text: 'The object, with which I have gained thee back, hath been accomplished. I have got no attachment for thee—do thou go wherever thou wishest, gentle one.

    '
  modern: 'The object for which I regained you has been accomplished. I have no attachment for you; go wherever you wish, gentle one.

    '
6.104.1:
  dutt: Yuddha CXVIII
  text: 'Being this addressed by Raghava, enraged, with those harsh words Sita was greatly pained.

    '
  modern: 'Thus addressed by the enraged Rāghava with those harsh words, Sītā was greatly pained.

    '
6.104.4:
  dutt: Yuddha CXVIII
  text: 'Thereupon wiping the tears off her countenance, she with sorrowful words, addressed her husband— "Why dost thou, O hero, like a common man addressing an ordinary woman, make me hear these harsh and unbecoming words painful unto ears?

    '
  modern: 'Then, wiping the tears from her face, she said to her husband in sorrowful words: "Why do you, O hero, like a common man speaking to an ordinary woman, make me hear these harsh and unbecoming words that pain the ears?

    '
6.104.5:
  dutt: Yuddha CXVIII
  text: (with 6.104.4)
6.104.6:
  dutt: Yuddha CXVIII
  text: 'O thou of long arms, I am not what thou hast taken me to be. Do thou believe me I do swear by my own character.

    '
  modern: 'O you of long arms, I am not what you take me to be. Believe me, I swear by my own character.

    '
6.104.7:
  dutt: Yuddha CXVIII
  text: 'Seeing the ordinary women thou art distrusting the whole sex. Do thou renounce this suspicion since thou hast tried me.

    '
  modern: 'Seeing ordinary women, you distrust the whole sex. Give up this suspicion, since you have tested me.

    '
6.104.8:
  dutt: Yuddha CXVIII
  text: 'O lord, though my person was touched by another—but it was not in my power; nor was it an wilful act (of mine); accident is to blame in this.

    '
  modern: 'O lord, though my person was touched by another, it was not in my power, and it was not my willing act; accident is to blame in this.

    '
6.104.9:
  dutt: Yuddha CXVIII
  text: 'My heart is under my control and that is in thee;—and what could I do of my body which was subject to another and of which I was not the mistress.

    '
  modern: 'My heart is under my control, and that is with you; and what could I do about my body, which was subject to another and of which I was not the mistress?

    '
6.104.10:
  dutt: Yuddha CXVIII
  text: 'O thou the conferrer of honour—our affection towards one another was increased by our living continually for a long time; even then if thou hast not been able to understand me I am ruined for ever.

    '
  modern: 'O giver of honour, our affection for one another grew from our living together continually for a long time; even then, if you have not been able to understand me, I am ruined for ever.

    '
6.104.11:
  dutt: Yuddha CXVIII
  text: 'O king, when the great hero Hanuman was despatched by thee to Lanka to see me why didst thou not renounce me then?

    '
  modern: 'O king, when the great hero Hanumān was sent by you to Laṅkā to see me, why did you not renounce me then?

    '
6.104.12:
  dutt: Yuddha CXVIII
  text: 'Hadst thou deputed the monkey with that message I would have renounced my life there and then, O hero.

    '
  modern: 'Had you sent the monkey with that message, I would have given up my life there and then, O hero.

    '
6.104.13:
  dutt: Yuddha CXVIII
  text: 'Thou wouldst not have been required to undergo this toil at the risk of thy own life and giving unnecessary trouble to thy friends.

    '
  modern: 'You would not have had to undergo this toil at the risk of your own life, and give your friends unnecessary trouble.

    '
6.104.14:
  dutt: Yuddha CXVIII
  text: 'O foremost of kings, being subject to ire—thou dost not perceive anything but womanhood in me, like an ordinary man.

    '
  modern: 'O foremost of kings, subject to anger as you are, you see nothing in me but womanhood, like an ordinary man.

    '
6.104.16:
  dutt: Yuddha CXVIII
  text: 'Thou dost not sufficiently honour my character, O thou conversant with characters. Thy marriage with me in boyhood shall be disproved and thou art not sufficiently considering all my devotion and good conduct unto thee".

    '
  modern: 'You do not sufficiently honour my character, O you who know characters. Your marriage with me in boyhood is disproved, and you do not sufficiently consider all my devotion and good conduct toward you."

    '
6.104.21:
  dutt: Yuddha CXVIII
  text: 'And understanding Rama’s intention by gestures and at his command the powerful Saumitri prepared a funeral pyre.

    '
  modern: 'And, understanding Rāma''s intention by his gestures and at his command, the powerful Saumitri prepared a funeral pyre.

    '
6.104.22:
  dutt: Yuddha CXVIII
  text: 'Thereupon circumambulating Rama, standing with his head down, Vaidehi approached the burning fire.

    '
  modern: 'Then, circumambulating Rāma, who stood with his head down, Vaidehī approached the burning fire.

    '
6.104.23:
  dutt: Yuddha CXVIII
  text: 'And bowing unto the celestials and Brahmanas, Maithili, with folded hands, spoke before the fire:— …

    '
  modern: 'And bowing to the gods and Brahmins, Maithilī, with folded hands, spoke before the fire: …

    '
6.104.24:
  dutt: Yuddha CXVIII
  text: '"As my heart hath never gone away from Raghava, may thou protect me, O fire, the witness of the people.

    '
  modern: '"As my heart has never gone away from Rāghava, may you protect me, O Fire, witness of the people.

    '
6.104.25:
  dutt: Yuddha CXVIII
  text: 'Saying this and going round the fire, Vaidehi, with undaunted heart, entered the flaming fire.

    '
  modern: 'Saying this and going round the fire, Vaidehī, with undaunted heart, entered the flaming fire.

    '
6.105.5:
  dutt: Yuddha CXIX
  text: 'Why dost thou not understand thyself the foremost of the celestials? … And thou art thyself, O lord, the creator of the three worlds. … Why dost thou neglect Vaidehi like an ordinary man?"

    '
  modern: 'Why do you not understand that you are yourself the foremost of the gods? … And you are yourself, O lord, the creator of the three worlds. … Why do you neglect Vaidehī like an ordinary man?"

    '
6.106.3:
  dutt: Yuddha CXX
  text: 'And carrying on his lap Vaidehi, wearing a red cloth, resembling the newly risen sun, adorned with ornaments of burning gold—having black curling hairs and decked with fresh garments, Bibhabasu gave her unto Rama.

    '
  modern: 'And carrying Vaidehī on his lap, wearing a red cloth, like the newly risen sun, adorned with ornaments of burning gold, with black curling hair and dressed in fresh garments, Vibhāvasu gave her to Rāma.

    '
6.106.4:
  dutt: Yuddha CXX
  text: 'Thereupon the Deity of Fire, the witness of the people, spoke unto Rama, saying—"O Rama, here is thy Vaidehi—no sin hath visited her.

    '
  modern: 'Then the god of Fire, witness of the people, said to Rāma: "O Rāma, here is your Vaidehī; no sin has touched her.

    '
6.106.10:
  dutt: Yuddha CXX
  text: 'Being thus addressed, the highly effulgent and intelligent Rama, of unmitigated prowess—the foremost of the pious, spoke unto that best of celestials saying— …

    '
  modern: 'Thus addressed, the highly radiant and wise Rāma, of unmitigated prowess, foremost of the pious, said to that best of gods: …

    '
6.106.19:
  dutt: Yuddha CXX
  text: 'It behoveth me to carry out the well-meaning words of you all—the lords of people who have spoken them out of affection".

    '
  modern: 'It is right that I carry out the well-meant words of you all, the lords of people, who have spoken them out of affection."

    '
6.107.8:
  dutt: Yuddha CXXI
  text: 'Obtaining thee as his son, that graceful (king) hath repaired to the region of Indra. Do thou bow unto him with thy brother Lakshmana".

    '
  modern: 'Having got you as his son, that graceful king has gone to the region of Indra. Bow to him with your brother Lakṣmaṇa."

    '
6.107.9:
  dutt: Yuddha CXXI
  text: 'Hearing the words of Mahadeva, Raghava, along with Lakshmana, bowed unto their father who was seated on the top of the car.

    '
  modern: 'Hearing the words of Mahādeva, Rāghava, with Lakṣmaṇa, bowed to their father, who was seated on the top of the chariot.

    '
6.107.12:
  dutt: Yuddha CXXI
  text: 'Thereupon beholding his son dearer than his life, attaining great delight (in consequence thereof) placing him on his lap and embracing him with his arms, the great king Dagaratha, having long arms and seated on an excellent seat in the car, said— …

    '
  modern: 'Then, seeing his son, dearer than his life, and filled with great delight, the great King Daśaratha, long-armed and seated on an excellent seat in the chariot, placed him on his lap and embraced him with his arms, and said: …

    '
6.107.17:
  dutt: Yuddha CXXI
  text: 'O gentle one, I have heard from the celestials, (that thou art) the excellent Purusha in the guise (of a man) for the destruction of Ravana.

    '
  modern: 'O gentle one, I have heard from the gods that you are the excellent Puruṣa, in the guise of a man, for the destruction of Rāvaṇa.

    '
6.107.22:
  dutt: Yuddha CXXI
  text: 'The term of thy exile is over—thy promise hath been fulfilled; and slaying Ravana, in the conflict thou hast pleased the celestials.

    '
  modern: 'The term of your exile is over, your promise has been fulfilled, and by slaying Rāvaṇa in the conflict you have pleased the gods.

    '
6.107.23:
  dutt: Yuddha CXXI
  text: 'Thou hast performed a mighty deed and attained to excellent fame, O slayer of enemies; and placed in charge of thy kingdom do thou with thy brothers attain a long life".

    '
  modern: 'You have done a mighty deed and won excellent fame, O slayer of enemies; and, placed in charge of your kingdom, live long with your brothers."

    '
6.107.24:
  dutt: Yuddha CXXI
  text: 'The king speaking thus Rama spoke unto him with folded hands saying,—"O thou conversant with piety, do thou be propitiated with Bharata and Kaikeyi.

    '
  modern: 'When the king had spoken thus, Rāma said to him with folded hands: "O you who know piety, be reconciled with Bharata and Kaikeyī.

    '
6.107.25:
  dutt: Yuddha CXXI
  text: 'Thou didst imprecate Kaikeyi, saying,—"I renounce thee with thy son"— may not that dreadful curse visit her and her son".

    '
  modern: 'You cursed Kaikeyī, saying, ''I renounce you with your son''; may that dreadful curse not fall on her and her son."

    '
6.107.26:
  dutt: Yuddha CXXI
  text: 'Saying "so be it" unto Rama with folded hands and embracing Lakshmana the great king said to him:— …

    '
  modern: 'Saying "So be it" to Rāma, who stood with folded hands, and embracing Lakṣmaṇa, the great king said to him: …

    '
6.107.32:
  dutt: Yuddha CXXI
  text: 'For serving him along with Sita, the daughter of king of Videha, thou hast attained piety and excellent fame".

    '
  modern: 'For serving him, along with Sītā, the daughter of the king of Videha, you have gained piety and excellent fame."

    '
6.107.33:
  dutt: Yuddha CXXI
  text: 'Addressing Lakshmana thus, the king spoke unto his daughter-in-law, who was standing before him with folded hands, saying:—"It doth not behove thee, O Vaidehi, to be enraged (with Rama) for renouncing thee; for purifying thee this was done by him ever wishing thy welfare.

    '
  modern: 'Addressing Lakṣmaṇa thus, the king spoke to his daughter-in-law, who was standing before him with folded hands: "It does not befit you, O Vaidehī, to be angry with Rāma for renouncing you; he did this to purify you, wishing for your welfare.

    '
6.107.34:
  dutt: Yuddha CXXI
  text: (with 6.107.33)
6.107.36:
  dutt: Yuddha CXXI
  text: 'Having thus instructed his two sons and Sita, he repaired, in his car, to the region of Indra.

    '
  modern: 'Having thus instructed his two sons and Sītā, he went in his chariot to the region of Indra.

    '
6.108.1:
  dutt: Yuddha CXXII
  text: 'Dagaratha having repaired, Mahendra greatly delighted spoke unto Raghava, stationed there with folded hands, saying:—"O Rama, O foremost of men, this our presence here, must not be fruitless, we are pleased—do thou ask for what thou wishest".

    '
  modern: 'When Daśaratha had gone, Mahendra, greatly delighted, said to Rāghava, who stood there with folded hands: "O Rāma, O foremost of men, our presence here must not be fruitless; we are pleased; ask for what you wish."

    '
6.108.2:
  dutt: Yuddha CXXII
  text: (with 6.108.1)
6.108.5:
  dutt: Yuddha CXXII
  text: 'O Purandara, do thou revive all these heroic and powerful (monkeys) who did not care for death, and who worked hard and were distressed (for me). May all those, by thy favour, who were ever devoted unto me and did not care for death (even) regain their life—this is the boon I pray for.

    '
  modern: 'O Purandara, revive all these heroic and powerful monkeys who did not care for death, and who worked hard and were distressed for me. May all those who were ever devoted to me, and did not care even for death, regain their life by your favour; this is the boon I ask."

    '
6.108.5+1:
  dutt: Yuddha CXXII
  text: 'Thereupon all these leading monkeys who had their persons wounded but now healed up, rose up like those asleep.

    '
  modern: 'Then all these leading monkeys, whose bodies had been wounded but were now healed, rose up as if from sleep.

    '
6.108.14:
  dutt: Yuddha CXXII
  text: 'And beholding Kakutstha of accomplished, end and eulogizing Rama and Lakshmana, all the celestials, greatly delighted, said,—"Do thou, O king, repair to Ayodhya—despatch all the monkeys—console the famed Maithilee, ever devoted unto thee— …

    '
  modern: 'And seeing Kākutstha, his end accomplished, all the gods, greatly delighted, praised Rāma and Lakṣmaṇa and said: "O king, go to Ayodhyā; send the monkeys away; console the famed Maithilī, ever devoted to you; …

    '
6.108.15:
  dutt: Yuddha CXXII
  text: (with 6.108.14)
6.109.1:
  dutt: Yuddha CXXIII
  text: 'Rama having spent that night happily and risen up the next morning, Bibhishana, chanting his victory, spoke unto that slayer of foes, with folded hands, saying:—"Here are various articles for bathing, pastes, clothes, ornaments, sandal and various excellent garlands.

    '
  modern: 'When Rāma had spent that night happily and risen the next morning, Vibhīṣaṇa, chanting his victory, said to that slayer of foes, with folded hands: "Here are various articles for bathing, pastes, clothes, ornaments, sandal and various excellent garlands.

    '
6.109.1+1:
  dutt: Yuddha CXXIII
  text: 'And here are present women having eyes like lotuses and conversant with the art of decking. Let them perform their duty, O Raghava".

    '
  modern: 'And here are women with eyes like lotuses and skilled in the art of adornment. Let them do their duty, O Rāghava."

    '
6.109.4:
  dutt: Yuddha CXXIII
  text: 'Being thus accosted Kakutstha replied unto Bibhishana, saying:—"Do thou invite all these monkeys beaded by Sugriva to bathe.

    '
  modern: 'Thus addressed, Kākutstha replied to Vibhīṣaṇa: "Invite all these monkeys, headed by Sugrīva, to bathe.

    '
6.109.6:
  dutt: Yuddha CXXIII
  text: 'Without Bharata the son of Kaikeyi, ever performing pious rites, I do not value bathing or these clothes and ornaments.

    '
  modern: 'Without Bharata, son of Kaikeyī, who always performs pious rites, I do not value bathing or these clothes and ornaments.

    '
6.109.20:
  dutt: Yuddha CXXIII
  text: 'Do thou speedily being the car for me, O lord of Rakshasas—my work is done—how can I wish to live here long".

    '
  modern: 'Bring the chariot for me at once, O lord of the Rākṣasas; my work is done; how can I wish to live here long?"

    '
6.109.21:
  dutt: Yuddha CXXIII
  text: 'Do thou regard me, O Bibhishana, O gentle one, as worshipped. O friend do thou be not angry—I request thee.

    '
  modern: 'Regard me, O Vibhīṣaṇa, O gentle one, as honoured. O friend, do not be angry; I ask you.

    '
6.109.27:
  dutt: Yuddha CXXIII
  text: 'And communicating unto Rama (the arrival of that car) Bibhishana waited there.

    '
  modern: 'And Vibhīṣaṇa announced the arrival of that chariot to Rāma and waited there.

    '
6.110.10:
  dutt: Yuddha CXXIV
  text: 'Rama ascended that excellent car, taking the bashful, and high-minded Vaidehi on his lap and accompanied, by his powerful brother Lakshmana, a skilled bowman.

    '
  modern: 'Rāma ascended that excellent chariot, taking the bashful and high-minded Vaidehī on his lap, accompanied by his powerful brother Lakṣmaṇa, a skilled bowman.

    '
6.110.10+1:
  dutt: Yuddha CXXIV
  text: 'And all the monkeys, bears and the highly powerful Rakshasas sat in that celestial car unobstructed and at their pleasure.

    '
  modern: 'And all the monkeys, bears and the powerful Rākṣasas sat in that celestial chariot unobstructed and at their ease.

    '
6.111.1:
  dutt: Yuddha CXXV
  text: 'Being commanded by Rama, that excellent car, drawn by ganders, with a huge noise, rose high up in the welkin.

    '
  modern: 'At Rāma''s command, that excellent chariot, drawn by ganders, rose high up in the sky with a huge noise.

    '
6.113.7:
  dutt: Yuddha CXXVII
  text: 'Do thou ask of Bharata his well-being at my words, and communicate unto him my (arrival) with Lakshmana and my spouse after having made good the vow (of my sire) …

    '
  modern: 'Ask Bharata of his well-being in my words, and tell him of my arrival with Lakṣmaṇa and my wife after making good the vow of my father …

    '
6.113.18:
  dutt: Yuddha CXXVII
  text: 'Being thus commanded, Hanuman, the son of Wind-god, assuming a human shape speedily proceeded towards Ayodhya.

    '
  modern: 'Thus commanded, Hanumān, the son of the Wind-god, took a human shape and went quickly toward Ayodhyā.

    '
6.113.26:
  dutt: Yuddha CXXVII
  text: 'He saw at a distance of one crosa from Ayodhya, Bharata wearing the skin of an antelope, poorly, greatly reduced, living in a hermitage, … ruling the earth always placing the sandals before him, protecting people of four Varnas against all fear, …

    '
  modern: 'At a distance of one krośa from Ayodhyā he saw Bharata, wearing the skin of an antelope, wretched, greatly reduced, living in a hermitage, … ruling the earth always with the sandals placed before him, protecting the people of the four castes from all fear, …

    '
6.113.29:
  dutt: Yuddha CXXVII
  text: (with 6.113.26)
6.113.32:
  dutt: Yuddha CXXVII
  text: 'Thereupon Hanuman, the son of Maruta spake with folded hands unto him, conversant with piety like virtue incarnate, saying—"Kakutstha, living in the forest of Dandaka with bark and matted hairs, for whom thou art lamenting, hath enquired after thy welfare.

    '
  modern: 'Then Hanumān, the son of Maruta, spoke with folded hands to him, who knew piety and was like virtue incarnate: "Kākutstha, who lives in the forest of Daṇḍaka with bark and matted hair, for whom you are lamenting, has asked after your welfare.

    '
6.113.33:
  dutt: Yuddha CXXVII
  text: (with 6.113.32)
6.113.34:
  dutt: Yuddha CXXVII
  text: 'Do thou, O worshipful sire, speak out thy welfare and renounce the dreadful grief. Thou shalt in this moment be reconciled to thy brother Rama.

    '
  modern: 'O revered sir, tell of your welfare and give up your dreadful grief. In this very moment you will be reunited with your brother Rāma.

    '
  departs: The Sanskrit has Hanumān say 'I tell you pleasant news' (priyam ākhyāmi te), not 'speak out thy welfare'.
6.113.38:
  dutt: Yuddha CXXVII
  text: 'Being thus addressed by Hanuman, Bharata, the son of Kaikeyi, delighted, fell down all on a sudden in a swoon of joy. Thereupon rising up in no time, and welcoming him, Bharata, the descendant of Raghu, spake unto Hanuman communicating the pleasant tidings, the following words.

    '
  modern: 'Thus addressed by Hanumān, Bharata, son of Kaikeyī, delighted, fell down all at once in a swoon of joy. Then, rising up in no time and welcoming him, Bharata, descendant of Raghu, spoke to Hanumān, who had told him the pleasant tidings, these words.

    '
6.114.1:
  dutt: Yuddha CXXVIII
  text: '"I hear the tidings of my brother affording me great delight who hath been living in the huge forest for many a year.

    '
  modern: '"I hear the tidings of my brother, which give me great delight, who has been living in the huge forest for many years.

    '
6.114.2:
  dutt: Yuddha CXXVIII
  text: 'The saying of the people appeareth to me as instinct with well meaning that a man, if alive, may attain to joy even after a century.

    '
  modern: 'The saying of the people seems to me full of good sense, that a man, if he lives, may attain joy even after a century.

    '
6.115.10:
  dutt: Yuddha CXXIX
  text: 'Thereupon proceeded Sumitra and all other wives of Dacaratha placing Kaucalya before them and seated in excellent conveyances.

    '
  modern: 'Then Sumitrā and all the other wives of Daśaratha, placing Kausalyā before them and seated in excellent conveyances, set out.

    '
6.115.12:
  dutt: Yuddha CXXIX
  text: '… And the whole city went to Nandigram.

    '
  modern: '… And the whole city went to Nandigrāma.

    '
6.115.26:
  dutt: Yuddha CXXIX
  text: 'Thereupon with the sound of "there is Rama" there arose a joyous noise reaching the abode of the celestials from among women, children, the young and the old.

    '
  modern: 'Then, with the cry "There is Rāma," a joyous noise rose from the women, children, young and old, reaching the abode of the gods.

    '
6.115.28:
  dutt: Yuddha CXXIX
  text: 'And facing Raghava and with folded hands Bharata delightedly worshipped him with agreeable words, Arghya and water to wash his feet.

    '
  modern: 'And, facing Rāghava with folded hands, Bharata delightedly worshipped him with agreeable words, arghya and water to wash his feet.

    '
6.115.42:
  dutt: Yuddha CXXIX
  text: 'And himself taking the sandals of Rama, Bharata, conversant with piety, placed them at the feet of that lord of men.

    '
  modern: "And Bharata, who knew piety, himself took the sandals of Rāma and placed them at the feet of that lord of men."
6.116.24:
  dutt: Yuddha CXXX
  text: 'And beholding that celestial car, bright as the fire of the sun, stationed before him, Rama, having long arms, the conqueror of enemies’ cities, ascended it.

    '
  modern: 'And seeing that celestial chariot, bright as the fire of the sun, standing before him, Rāma, long-armed, conqueror of enemy cities, ascended it.

    '
6.116.38:
  dutt: Yuddha CXXX
  text: 'Thereupon the citizens hoisted up flags upon every house and he reached the picturesque abode of his ancestors inhabited by the descendants of Ikshwaku.

    '
  modern: 'Then the citizens hoisted flags on every house, and he reached the picturesque abode of his ancestors, inhabited by the descendants of Ikṣvāku.

    '
6.116.56:
  dutt: Yuddha CXXX
  text: 'Vasishtha, Vijaya, Javali, Katyayana, Goutama and Bamadeva, sprinkled that foremost of men, with clear and fragrant water as Vasus did the thousand eyed Vasava.

    '
  modern: 'Vasiṣṭha, Vijaya, Jābāli, Kātyāyana, Gautama and Vāmadeva sprinkled that foremost of men with clear and fragrant water, as the Vasus sprinkled the thousand-eyed Vāsava.

    '
6.116.63:
  dutt: Yuddha CXXX
  text: 'The earth was filled with crops, the trees with fruits and the flowers were fragrant on the occassion of Raghava’s installation.

    '
  modern: 'The earth was filled with crops, the trees with fruits, and the flowers were fragrant on the occasion of Rāghava''s installation.

    '
6.116.63+1:
  dutt: Yuddha CXXX
  text: 'And all other elderly and leading monkeys were respectively honoured with clothes and ornaments.

    '
  modern: 'And all the other elderly and leading monkeys were honoured with clothes and ornaments.

    '
6.116.76:
  dutt: Yuddha CXXX
  text: 'And being honoured by Rama of unwearied actions with enough of jewels and other wished-for objects, Bibhishana, Sugriva, Hanuman, Jambavan and other leading monkeys, delighted, returned to their respective habitations.

    '
  modern: 'And, honoured by Rāma of unwearied actions with plenty of jewels and other wished-for things, Vibhīṣaṇa, Sugrīva, Hanumān, Jāmbavān and the other leading monkeys, delighted, returned to their own dwellings.

    '
6.116.80:
  dutt: Yuddha CXXX
  text: 'And obtaining that excellent kingdom, the virtuous-souled Raghava performed many sacrifices with his sons, brothers and friends.

    '
  modern: 'And obtaining that excellent kingdom, the virtuous Rāghava performed many sacrifices with his sons, brothers and friends.

    '
6.116.86:
  dutt: Yuddha CXXX
  text: 'All were delighted and devoted to pious observances. And beholding Rama they did not envy one another.

    '
  modern: 'All were delighted and devoted to pious observances. And seeing Rāma, they did not envy one another.

    '
6.116.86+1:
  dutt: Yuddha CXXX
  text: 'Hearing or reading the whole of Ramayana, forsooth shall people get sons and riches.

    '
  modern: 'Hearing or reading the whole Rāmāyaṇa, people will surely get sons and riches.

    '
6.116.86+2:
  dutt: Yuddha CXXX
  text: 'This ancient work produceth such fruits. May good betide ye.

    '
  modern: 'This ancient work produces such fruits. May good betide you.

    '
