# The glosses of the personal pronouns, for every whole text.
#
# AUTHORED. Monier-Williams glosses अस्मद् and युष्मद् with a note on the
# stems ("base of the first person, as used in comp."), not with a meaning; a
# whole text otherwise shows that note under अहम्, मम, त्वम्. A pada with one of
# these lemmas takes the gloss here, by number and case, unless its text's
# overrides give one; a compound member takes `member`. Cases in order:
# प्रथमा द्वितीया तृतीया चतुर्थी पञ्चमी षष्ठी सप्तमी. scripts/build-texts.ts reads it.
अस्मद्:
  एकवचन: [I, me, by me, to/for me, from me, my, in me]
  द्विवचन: [we two, us two, by us two, to/for us two, from us two, of us two, in us two]
  बहुवचन: [we, us, by us, to/for us, from us, our, in us]
  member: I, we (in compound — my, our)
युष्मद्:
  एकवचन: [you, you, by you, to/for you, from you, your, in you]
  द्विवचन: [you two, you two, by you two, to/for you two, from you two, of you two, in you two]
  बहुवचन: [you, you, by you, to/for you, from you, your, in you]
  member: you (in compound — your)

# The pronouns with gender, glossed by gender and number (any case): MW gives
# तद् as "he she it, that, this" and यद् as "who, which, what, whichever…",
# notes on the stem, not senses.
तद्:
  पुंलिङ्ग: { एकवचन: "he, that", द्विवचन: "those two", बहुवचन: "they, those", षष्ठी: { एकवचन: "his, of that", द्विवचन: "of those two", बहुवचन: "their, of those" } }
  स्त्रीलिङ्ग: { एकवचन: "she, that", द्विवचन: "those two", बहुवचन: "they, those", षष्ठी: { एकवचन: "her, of that", द्विवचन: "of those two", बहुवचन: "their, of those" } }
  नपुंसकलिङ्ग: { एकवचन: "it, that", द्विवचन: "those two", बहुवचन: "those", षष्ठी: { एकवचन: "its, of that", द्विवचन: "of those two", बहुवचन: "their, of those" } }
  member: that
एतद्:
  पुंलिङ्ग: { एकवचन: "this one, he", द्विवचन: "these two", बहुवचन: "these", षष्ठी: { एकवचन: "of this one, his", द्विवचन: "of these two", बहुवचन: "of these" } }
  स्त्रीलिङ्ग: { एकवचन: "this one, she", द्विवचन: "these two", बहुवचन: "these", षष्ठी: { एकवचन: "of this one, her", द्विवचन: "of these two", बहुवचन: "of these" } }
  नपुंसकलिङ्ग: { एकवचन: "this", द्विवचन: "these two", बहुवचन: "these", षष्ठी: { एकवचन: "of this", द्विवचन: "of these two", बहुवचन: "of these" } }
  member: this
इदम्:
  पुंलिङ्ग: { एकवचन: "this one, he", द्विवचन: "these two", बहुवचन: "these", षष्ठी: { एकवचन: "of this one, his", द्विवचन: "of these two", बहुवचन: "of these" } }
  स्त्रीलिङ्ग: { एकवचन: "this one, she", द्विवचन: "these two", बहुवचन: "these", षष्ठी: { एकवचन: "of this one, her", द्विवचन: "of these two", बहुवचन: "of these" } }
  नपुंसकलिङ्ग: { एकवचन: "this", द्विवचन: "these two", बहुवचन: "these", षष्ठी: { एकवचन: "of this", द्विवचन: "of these two", बहुवचन: "of these" } }
अदस्:
  पुंलिङ्ग: { एकवचन: "that one (yonder)", द्विवचन: "those two", बहुवचन: "those" }
  स्त्रीलिङ्ग: { एकवचन: "that one (yonder)", द्विवचन: "those two", बहुवचन: "those" }
  नपुंसकलिङ्ग: { एकवचन: "that (yonder)", द्विवचन: "those two", बहुवचन: "those" }
यद्:
  पुंलिङ्ग: { एकवचन: "who, which", द्विवचन: "which two", बहुवचन: "who, which", षष्ठी: { एकवचन: "whose, of which", द्विवचन: "of which two", बहुवचन: "whose, of which" } }
  स्त्रीलिङ्ग: { एकवचन: "who, which", द्विवचन: "which two", बहुवचन: "who, which", षष्ठी: { एकवचन: "whose, of which", द्विवचन: "of which two", बहुवचन: "whose, of which" } }
  नपुंसकलिङ्ग: { एकवचन: "which, what", द्विवचन: "which two", बहुवचन: "which", षष्ठी: { एकवचन: "of which", द्विवचन: "of which two", बहुवचन: "of which" } }
  member: which
किम्:
  पुंलिङ्ग: { एकवचन: "who? which?", द्विवचन: "which two?", बहुवचन: "who? which?", षष्ठी: { एकवचन: "whose?", द्विवचन: "of which two?", बहुवचन: "whose?" } }
  स्त्रीलिङ्ग: { एकवचन: "who? which?", द्विवचन: "which two?", बहुवचन: "who? which?", षष्ठी: { एकवचन: "whose?", द्विवचन: "of which two?", बहुवचन: "whose?" } }
  नपुंसकलिङ्ग: { एकवचन: "what? which?", द्विवचन: "which two?", बहुवचन: "what? which?", षष्ठी: { एकवचन: "of what?", द्विवचन: "of which two?", बहुवचन: "of what?" } }
  member: what
# a numeral MW glosses with a grammatical note ("nom. acc. 3")
त्रि:
  any: three
