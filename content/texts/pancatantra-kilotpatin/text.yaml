sections:
  - id: '1.21'
    kind: verse
    lines:
      - अव्यापरेषु व्यापारं यो नरः कर्तुमिच्छति
      - स एव निधनं याति कीलोत्पाटीव वानरः
    iast: "avyāpareṣu vyāpāraṃ yo naraḥ kartum icchati | sa eva nidhanaṃ yāti kīlotpāṭīva vānaraḥ"
  - id: '1'
    text: कस्मिंश्चिन्नगराभ्याशे केनापि वणिक्पुत्रेण तरुखण्डमध्ये देवतायतनं कर्तुमारब्धम्
    iast: "kasmiṃścin nagarābhyāśe kenāpi vaṇik-putreṇa taru-khaṇḍa-madhye devatāyatanaṃ kartum ārabdham"
  - id: '2'
    text: तत्र च ये कर्मकराः स्थापनादयः
    iast: "tatra ca ye karmakarāḥ sthāpanādayaḥ"
  - id: '3'
    text: ते मध्याह्नबेलायामाहारार्थं नगरमध्ये गच्छन्ति
    iast: "te madhyāhna-belāyām āhārārthaṃ nagara-madhye gacchanti"
  - id: '4'
    text: अथ कदाचित्तत्रानुषङ्गिकं वानरयूथमितश्चेतश्च परिभ्रमदागतम्
    iast: "atha kadācit tatrānuṣaṅgikaṃ vānara-yūtham itaś cetaś ca paribhramad āgatam"
  - id: '5'
    text: तत्रैकस्य कस्यचिच्छिल्पिनोऽर्धस्फाटितोऽञ्जनवृक्षदारुमयः स्तम्भः खदिरकीलकेन मध्यनिहितेन तिष्ठति
    iast: "tatraikasya kasyacic chilpino 'rdha-sphāṭito 'ñjana-vṛkṣa-dārumayaḥ stambhaḥ khadira-kīlakena madhya-nihitena tiṣṭhati"
  - id: '6'
    text: एतस्मिन्नन्तरे ते वानरास्तरुशिखरप्रसादशृङ्गदारुपर्यन्तेषु यथेच्छया क्रीडितुमारब्धाः
    iast: "etasminn antare te vānarās taru-śikhara-prasāda-śṛṅga-dāru-paryanteṣu yathecchayā krīḍitum ārabdhāḥ"
  - id: '7'
    text: एकश्च तेषां प्रत्यासन्नमृत्युश्चापल्यात्तस्मिन्नर्धस्फोटितस्तम्भे उपविश्य पाणिभ्यां कीलकं संगृह्य यावदुत्पादयितुमारेभे तावत्तस्य स्तम्भमध्यगतवृषणस्य स्वस्थानाच्चलितकीलकेन यद्वृत्तं तत्प्रागेव निवेदितम्
    iast: "ekaś ca teṣāṃ pratyāsanna-mṛtyuś cāpalyāt tasminn ardha-sphoṭita-stambhe upaviśya pāṇibhyāṃ kīlakaṃ saṃgṛhya yāvad utpādayitum ārebhe tāvat tasya stambha-madhya-gata-vṛṣaṇasya sva-sthānāc calita-kīlakena yad vṛttaṃ tat prāg eva niveditam"
  - id: '8'
    text: अतोऽहं ब्रवीमि अव्यापारेषु इति
    iast: "ato 'haṃ bravīmi- avyāpāreṣu iti"
