# The author's decisions on top of vidyut's analysis — and nothing else.
#
# Everything not named here is what vidyut said (data/text-analyses/<id>.json,
# its best-ranked analysis of each pada). Keyed by section id, then the surface
# word exactly as text.yaml prints it ("#2" for its second occurrence in one
# section), so regenerating the snapshot keeps every decision.
#
# Per word:
#   split: [pada, …]   vidyut's segmentation was wrong — these padas replace it
#   fix: {n: pada}     pada n (1-based) of vidyut's segmentation, corrected
#   note: …            a note on the whole word
# Per pada (all optional):
#   form    the pada (sandhi undone, pausal)        lemma   its stem or root
#   a       its analysis in the reader's terms: "सप्तमी एकवचन पुंलिङ्ग",
#           "लिट् प्रथमपुरुष एकवचन आत्मनेपद", "अव्यय", "प्रथमा एकवचन नपुंसकलिङ्ग क्त"
#           — matched against vidyut's alternatives; one that matches is a pick,
#           one that does not is the author's own analysis
#   member  true: a compound member (a bare stem, no ending)
#   gloss   the sense in context, where MW's first sense is not it
#   note    what the form teaches
#
# bun scripts/build-texts.ts reports how many words each kind of fix touched.

'1.21':
  अव्यापरेषु:
    split:
      - form: अव्यापारेषु
        lemma: अव्यापार
        a: सप्तमी बहुवचन पुंलिङ्ग
        gloss: in what is not one's business
    note: >-
      The edition prints अव्यापरेषु here; the tale's last line quotes the verse
      as अव्यापारेषु, which the sense needs (अ + व्यापार, "not one's affair").
      Read as a misprint.
  कर्तुमिच्छति:
    fix:
      2: { gloss: 'wishes, wants (with an infinitive: "wants to do")' }
  स:
    fix:
      1:
        a: प्रथमा एकवचन पुंलिङ्ग
        note: सः loses its visarga before any consonant (6.1.132), so स here is the nominative, not a vocative.
  निधनं:
    fix:
      1: { a: द्वितीया एकवचन नपुंसकलिङ्ग, gloss: 'death, destruction' }
  याति:
    fix:
      1: { gloss: 'goes; with निधनम्, "meets (his) death"' }
  कीलोत्पाटीव:
    fix:
      1: { form: कील, lemma: कील, member: true, gloss: "a wedge, pin" }
    note: कील-उत्पाटी इव — "like the wedge-puller", an उपपद compound in -इन्.

'1':
  कस्मिंश्चिन्नगराभ्याशे:
    split:
      - { form: कस्मिन्, lemma: किम्, a: सप्तमी एकवचन पुंलिङ्ग, gloss: 'in which? — with चित्, "in some"' }
      - { form: चित्, lemma: चित्, a: अव्यय, gloss: 'with an interrogative: "some-" (कस्मिंश्चित् "in some")' }
      - { form: नगर, lemma: नगर, member: true }
      - { form: अभ्याशे, lemma: अभ्याश, a: सप्तमी एकवचन पुंलिङ्ग, gloss: 'the vicinity, neighbourhood' }
    note: 'The tale''s first word is the storyteller''s "once, somewhere": किम् + चित् makes the indefinite "some".'
  केनापि:
    fix:
      2: { gloss: 'even; with an interrogative, "some-" (केनापि "by someone")' }
  वणिक्पुत्रेण:
    fix:
      1: { form: वणिक्, lemma: वणिज्, member: true }
  तरुखण्डमध्ये:
    split:
      - { form: तरु, lemma: तरु, member: true }
      - { form: खण्ड, lemma: खण्ड, member: true, gloss: 'a clump, group (तरुखण्ड "a clump of trees")' }
      - { form: मध्ये, lemma: मध्य, a: सप्तमी एकवचन नपुंसकलिङ्ग, gloss: 'in the middle of' }
  देवतायतनं:
    split:
      - { form: देवता, lemma: देवता, member: true }
      - { form: आयतनम्, lemma: आयतन, a: प्रथमा एकवचन नपुंसकलिङ्ग, gloss: 'a sanctuary (देवतायतन "a temple")' }
  कर्तुमारब्धम्:
    fix:
      2: { a: प्रथमा एकवचन नपुंसकलिङ्ग }
    note: >-
      कर्तुम् आरब्धम् — "was begun to be built": the passive participle agrees
      with देवतायतनम्, and the one who began it stands in the instrumental
      (केनापि वणिक्पुत्रेण).

'2':
  तत्र:
    fix:
      1: { gloss: 'there' }
  स्थापनादयः:
    split:
      - { form: स्थापन, lemma: स्थापन, member: true, gloss: 'the setter-up, i.e. the master-builder' }
      - { form: आदयः, lemma: आदि, a: प्रथमा बहुवचन पुंलिङ्ग, gloss: 'and the rest, and others' }
    note: 'A बहुव्रीहि in आदि — "those of whom the builder is first": the builder and his men.'

'3':
  ते:
    fix:
