      - { form: मृत्युः, lemma: मृत्यु, a: प्रथमा एकवचन पुंलिङ्ग, gloss: 'death' }
      - { form: चापल्यात्, lemma: चापल्य, a: पञ्चमी एकवचन नपुंसकलिङ्ग, gloss: 'out of restlessness, mischief' }
      - { form: तस्मिन्, lemma: तद्, a: सप्तमी एकवचन पुंलिङ्ग }
      - { form: अर्ध, lemma: अर्ध, member: true, gloss: 'half' }
      - { form: स्फोटित, lemma: स्फोटित, member: true, gloss: 'split' }
