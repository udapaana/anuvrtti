  मध्याह्नबेलायामाहारार्थं:
    split:
      - { form: मध्याह्न, lemma: मध्याह्न, member: true, gloss: 'midday, noon' }
      - { form: बेलायाम्, lemma: वेला, a: सप्तमी एकवचन स्त्रीलिङ्ग, gloss: 'the time, hour' }
      - { form: आहार, lemma: आहार, member: true, gloss: 'food, a meal' }
      - { form: अर्थम्, lemma: अर्थ, a: द्वितीया एकवचन पुंलिङ्ग, gloss: 'for the sake of (an accusative used as an adverb)' }
    note: बेला is the edition's spelling of वेला. -अर्थम् at the end of a compound means "for (the sake of)" — आहारार्थम् "for food".
  नगरमध्ये:
    split:
      - { form: नगर, lemma: नगर, member: true }
      - { form: मध्ये, lemma: मध्य, a: सप्तमी एकवचन नपुंसकलिङ्ग, gloss: 'in the middle of, into' }

'4':
  कदाचित्तत्रानुषङ्गिकं:
    split:
      - { form: कदाचित्, lemma: कदाचित्, a: अव्यय, gloss: 'once, one day' }
      - { form: तत्र, lemma: तत्र, a: अव्यय, gloss: 'there' }
      - { form: आनुषङ्गिकम्, lemma: आनुषङ्गिक, a: प्रथमा एकवचन नपुंसकलिङ्ग, gloss: 'incidental — here "by chance", in passing' }
  वानरयूथमितश्चेतश्च:
    split:
      - { form: वानर, lemma: वानर, member: true }
      - { form: यूथम्, lemma: यूथ, a: प्रथमा एकवचन नपुंसकलिङ्ग, gloss: 'a herd, troop' }
      - { form: इतः, lemma: इतस्, a: अव्यय, gloss: 'from here; इतश्च इतश्च "hither and thither"' }
      - { form: च, lemma: च, a: अव्यय }
      - { form: इतः, lemma: इतस्, a: अव्यय }
      - { form: च, lemma: च, a: अव्यय }
    note: इतः च इतः च — the second इतः has fused with the च before it (च + इतः → चेतः).
  परिभ्रमदागतम्:
    split:
      - { form: परिभ्रमत्, lemma: परिभ्रम्, a: प्रथमा एकवचन नपुंसकलिङ्ग शतृ, gloss: 'roaming about' }
      - { form: आगतम्, lemma: आगम्, a: प्रथमा एकवचन नपुंसकलिङ्ग क्त, gloss: 'came, arrived' }
    note: Both participles agree with वानरयूथम् (neuter); the क्त participle stands for the finite verb, "a troop … came".

'5':
  कस्यचिच्छिल्पिनोऽर्धस्फाटितोऽञ्जनवृक्षदारुमयः:
    split:
      - { form: कस्य, lemma: किम्, a: षष्ठी एकवचन पुंलिङ्ग }
      - { form: चित्, lemma: चित्, a: अव्यय }
      - { form: शिल्पिनः, lemma: शिल्पिन्, a: षष्ठी एकवचन पुंलिङ्ग, gloss: 'an artisan, craftsman' }
      - { form: अर्ध, lemma: अर्ध, member: true, gloss: 'half' }
      - { form: स्फाटितः, lemma: स्फाटित, a: प्रथमा एकवचन पुंलिङ्ग, gloss: 'split (the causative participle of स्फट्)' }
      - { form: अञ्जन, lemma: अञ्जन, member: true, gloss: 'the añjana tree' }
      - { form: वृक्ष, lemma: वृक्ष, member: true }
      - { form: दारुमयः, lemma: दारुमय, a: प्रथमा एकवचन पुंलिङ्ग, gloss: 'made of wood' }
    note: >-
      Three words run together by sandhi (कस्यचित् शिल्पिनः अर्धस्फाटितः …), the
      longest chunk in the tale. -मय "made of" closes a compound naming the
      material: अञ्जनवृक्षदारुमयः "made of the wood of an añjana tree".
  खदिरकीलकेन:
    split:
      - { form: खदिर, lemma: खदिर, member: true, gloss: 'the khadira tree (Acacia catechu)' }
      - { form: कीलकेन, lemma: कीलक, a: तृतीया एकवचन पुंलिङ्ग, gloss: 'a wedge' }
  तिष्ठति:
    note: तिष्ठति with an instrumental — "stands with a khadira wedge set in its middle".

