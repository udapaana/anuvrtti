    note: "वियत् is the present participle of वि + इ \"go away\", agreeing with आयुः: \"his own life ebbing away (for the family's sake)\"."
  बुध्यतेऽर्थं:
    fix:
      1: { gloss: "perceives, realizes" }
      2: { gloss: "his true end, the aim of life" }
  विहतं:
    split:
      - { form: विहतम्, lemma: विहन्, a: द्वितीया एकवचन पुंलिङ्ग क्त, gloss: "destroyed, ruined" }
  प्रमत्तः:
    fix:
      1: { gloss: "heedless" }
  सर्वत्र:
    fix:
      1: { gloss: "everywhere, at every turn" }
  तापत्रयदुःखितात्मा:
    split:
      - { form: ताप, lemma: ताप, member: true, gloss: "affliction" }
      - { form: त्रय, lemma: त्रय, member: true, gloss: "triad" }
      - { form: दुःखित, lemma: दुःखित, member: true, gloss: "pained" }
      - { form: आत्मा, lemma: आत्मन्, a: प्रथमा एकवचन पुंलिङ्ग, gloss: "self, mind (बहुव्रीहि 'whose mind is pained by the three afflictions')" }
    note: "The three तापs: from oneself (आध्यात्मिक), from other beings (आधिभौतिक), from the gods and nature (आधिदैविक)."
  निर्विद्यते:
    fix:
      1: { gloss: "grows weary (of the world), turns away" }
  स्वकुटुम्बरामः:
    split:
      - { form: स्व, lemma: स्व, member: true, gloss: "one's own" }
      - { form: कुटुम्ब, lemma: कुटुम्ब, member: true, gloss: "family" }
      - { form: रामः, lemma: राम, a: प्रथमा एकवचन पुंलिङ्ग, gloss: "delighting in (स्वकुटुम्बराम 'who takes his joy in his own family')" }

