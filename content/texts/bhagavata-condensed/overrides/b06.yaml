# Bhāgavata condensed, 7.6.13–8.7.1 (batch b06): Prahlāda's teaching to his
# schoolfellows, Hiraṇyakaśipu's end and Prahlāda's hymn, the elephant king's
# rescue, the churning of the ocean. Format: see the header of
# content/texts/pancatantra-kilotpatin/overrides.yaml.

'7.6.13':
  त्यजेत:
    fix:
      1: { a: विधिलिङ् प्रथमपुरुष एकवचन आत्मनेपद, gloss: "would give up" }
    note: "The Purāṇa's ātmanepada of त्यज् (classically त्यजेत्), third person: its subject is the householder of the verse, \"how would he give up his works?\""
  कोशस्कृदिवेहमानः:
    split:
      - { form: कोशस्कृत्, lemma: कोशस्कृत्, a: प्रथमा एकवचन पुंलिङ्ग, gloss: "the silkworm (the cocoon-maker)" }
      - { form: इव, lemma: इव, a: अव्यय, gloss: "like" }
      - { form: ईहमानः, lemma: ईह्, a: प्रथमा एकवचन पुंलिङ्ग शानच्, gloss: "striving, toiling" }
    note: "कोश-स्-कृत्, with the augment स् before कृत् (6.1.137 ff.): the silkworm, which spins the cocoon that imprisons it."
  कर्माणि:
    fix:
      1: { gloss: "works, undertakings" }
  लोभादवितृप्तकामः:
    split:
      - { form: लोभात्, lemma: लोभ, a: पञ्चमी एकवचन पुंलिङ्ग, gloss: "out of greed" }
      - { form: अवितृप्त, lemma: अवितृप्त, member: true, gloss: "unsated" }
      - { form: कामः, lemma: काम, a: प्रथमा एकवचन पुंलिङ्ग, gloss: "desire (अवितृप्तकाम 'whose desire is never sated')" }
  औपस्थ्यजैह्वं:
    split:
      - { form: औपस्थ्य, lemma: औपस्थ्य, member: true, gloss: "sexual pleasure" }
      - { form: जैह्वम्, lemma: जैह्व, a: द्वितीया एकवचन नपुंसकलिङ्ग, gloss: "the pleasure of the tongue" }
    note: "A समाहार-द्वन्द्व, singular neuter: \"the pleasures of sex and of the palate\", object of बहुमन्यमानः."
  बहुमन्यमानः:
    split:
      - { form: बहुमन्यमानः, lemma: बहुमन्, a: प्रथमा एकवचन पुंलिङ्ग शानच्, gloss: "prizing highly" }
    note: "बहु मन् (4th class, ātmanepada) \"think much of, value\"."
  कथं:
    fix:
      1: { gloss: "how?" }
  विरज्येत:
    fix:
      1: { a: विधिलिङ् प्रथमपुरुष एकवचन आत्मनेपद, gloss: "would become detached, lose his passion" }
    note: "रञ्ज् of the 4th class (रज्यते), not a passive: \"how would he become dispassionate?\""
  दुरन्तमोहः:
    split:
      - { form: दुरन्त, lemma: दुरन्त, member: true, gloss: "hard to end, endless" }
      - { form: मोहः, lemma: मोह, a: प्रथमा एकवचन पुंलिङ्ग, gloss: "delusion (दुरन्तमोह 'whose delusion is endless')" }

'7.6.14':
