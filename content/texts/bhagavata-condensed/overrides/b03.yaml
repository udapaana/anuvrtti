# Bhāgavata condensed, 4.14.16 – 5.10.7 (Vena and Pṛthu, Prācīnabarhis and
# Nārada's parable; Priyavrata, Ṛṣabha, Bharata and the fawn, Jaḍa Bharata and
# Rahūgaṇa — skandha 5 largely prose).
# Format: see the header of content/texts/pancatantra-kilotpatin/overrides.yaml.
# A causative's lemma is its stem in -इ, as vidyut gives it (बोधि, दर्शि).
#
# The prose sections open with the edition's markup "_*", and four of them also
# carry its verse label ("Bह्P_…" and "०"); these are no words, and are split
# into nothing here until text.yaml drops them.
#
# वा before a vowel in this stretch (यूयं वा अधर्मे, ह वा आत्मजान्, न वा एतत्)
# is वै with its ai shortened before the vowel (6.1.78, then 8.3.19), the old
# narrative "ha vai", not the disjunctive वा.

