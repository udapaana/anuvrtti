# M. N. Dutt, A Prose English Translation of Srimadbhagavatam (Calcutta: H. C. Dass, 1895–96), Books I–IX and X, chapters I–VII.
# Public domain (Dutt d. 1912). Books I–II from archive.org proseenglishtran12dutt; III–VII from in.ernet.dli.2015.272582;
# VIII–IX from india.history.resource.40625 (a damaged copy, pages out of order); all pinned in data/sources/ocr/.
# Book X chapters I–VII come from the damaged copy (40625); no free English was found for the rest of Book X or for XI–XII. Dutt writes unnumbered prose: every verse was
# aligned by content, then checked against our Sanskrit and his scan by a second pass with a stronger model. Words the
# scans garble were mended only where certain; an entry with any word left unreadable, or not plainly his, was dropped.
# " … " marks a cut (his words never rewritten). `(with X)`: rendered in X's sentence. `modern`: his sense, plain.
# `departs`: where his English and our Sanskrit part.
source:
  translator: Manmatha Nath Dutt
  title: A Prose English Translation of Srimadbhagavatam
  publisher: H. C. Dass
  year: 1895–1896
  archive:
  - proseenglishtran12dutt
  - in.ernet.dli.2015.272582
  - india.history.resource.40625
1.1.1:
  dutt: 1.1.1
  text: 'Let us meditate upon the Most High, who is Truth, the light of whose countenance dispels the mists of illusion, in whom, the threefold creation, illusory in itself, wears the semblance of truth, even as there occurs confusion among the elements of Fire, Light, and Earth, in the phenomena of mirage, crystal, etc., — from whom have sprung all existence, primary and derivative, who is intelligent and self-effulgent, whose nature even the wisest fail to apprehend, and who kindled the divine afflatus in the heart of the Prime Poet.

    '
  modern: 'Let us meditate on the Most High, who is Truth. The light of his face drives away the mists of illusion. In him the threefold creation, which is unreal in itself, takes on the look of truth, as fire, light, and earth can be confused in a mirage or a crystal. From him came all existence, both the first and the derived. He is intelligent and shines by his own light. Even the wisest cannot grasp his nature. He kindled the divine breath in the heart of the first poet.

    '
1.1.4:
  dutt: 1.1.4
  text: 'In the Naimisha forest, the land of the Winkless Divinity, Saunaka and other sages performed, through a hundred years, a sacrifice for attaining to the world of Him whose glories resound in heaven.

    '
  modern: 'In the Naimisha forest, the land of the Unblinking One, Saunaka and the other sages held a sacrifice for a hundred years. They did it to reach the world of the Lord whose glories fill heaven.

    '
  departs: 'The Sanskrit says the sages sat for a thousand years (sahasrasamam); Dutt has a hundred.

    '
1.1.6:
  dutt: 1.1.6
  text: 'O stainless one, thou hast not only read, but have also recited the Puranas, the chronicles, and the codes of religion.

    '
  modern: 'O sinless one, you have not only read the Puranas, the chronicles, and the codes of dharma. You have also recited them.

    '
1.1.9:
  dutt: 1.1.9
  text: 'Now it behoveth thee, O long-lived one, to communicate to us, in brief, what in them thou considerest to be conducive to the supreme good of man.

    '
  modern: 'Now, O long-lived one, tell us briefly what you judge to be the highest good for man, as found in those texts.

    '
1.1.13:
  dutt: 1.1.13
  text: '… It behoveth thee to narrate it to us, who are eager to learn it. The Lord who assumes form for the preservation and the good of his creatures …

    '
  modern: '… Please tell us, who are eager to learn it. The Lord, who takes form to protect and benefit his creatures …

    '
1.1.18:
  dutt: 1.1.18
  text: 'Do thou also narrate the blessed history of the incarnations of the Lord, revelling in His playful vein.

    '
  modern: 'Tell us also the blessed history of the Lord''s incarnations, as he plays in his own way.

    '
1.2.1:
  dutt: 1.2.1
  text: 'Pleased with these queries of the Brahmanas, the son of Romahashana, applauding their words, began to answer.

    '
  modern: 'Pleased by the questions of the Brahmins, the son of Romaharshana praised their words and began to answer.

    '
1.2.5:
  dutt: 1.2.5
  text: 'O sages, well have you inquired ; since your query, relating to Krishna, is highly benign to humanity, and lightens the soul.

    '
  modern: 'O sages, you have asked well. Your question about Kṛṣṇa does good for all people, and it lightens the soul.

    '
1.2.6:
  dutt: 1.2.6
  text: 'The supreme religion is that which breeds devotion to the Divinity that transcends the senses, unswerving devotion without any admixture of interest, filling the soul with light.

    '
  modern: 'The highest duty of man is devotion to the Divinity that lies beyond the senses. It is devotion without any selfish motive, and it fills the soul with light.

    '
1.2.14:
  dutt: 1.2.14
  text: 'Therefore is it meet that we should hear about the Lord, the Protector of devotees, and glorify, contemplate, and worship Him with a singleness of eye.

    '
  modern: 'So we should hear about the Lord, the protector of devotees, and praise, contemplate, and worship him with single-minded attention.

    '
1.2.28:
  dutt: 1.2.28
  text: 'Vasudeva is the ultimate object of the Vedas, of rites, of treatises on communion, of actions and processes, of knowledge, of meditation, of gifts and vows, and of the wanderings of the soul.

    '
  modern: 'Vāsudeva is the final aim of the Vedas, of sacrifices, of the books on communion, of rites, of knowledge, of meditation, of gifts and vows, and of the soul''s journey.

    '
1.2.29:
  dutt: 1.2.29
  text: '(with 1.2.28)

    '
1.2.32:
  dutt: 1.2.32
  text: 'As the same fire glows as many fires in many brands that bring out its lustre, so doth the World-soul shine in apparent variety in all created things.

    '
  modern: 'As one fire blazes as many fires in many logs, each showing its glow, so the World-Soul shines in many forms in all created things.

    '
1.3.40:
  dutt: 1.3.40
  text: 'The mighty sage composed … this blessed Purana, … containing a record of His achievements whose praise dispels darkness of mind, and claiming equality of rank with the Vedas in respect of spiritual knowledge.

    '
  modern: 'The great sage wrote this blessed Purana. … It tells of the deeds of the Lord, whose praise drives out the darkness of the mind. In spiritual knowledge it stands on the same level as the Vedas.

    '
1.3.42:
  dutt: 1.3.42
  text: '… which is, as it were, the extract of all the Vedas and all the histories, … And he recited it to the Emperor Parikshit …

    '
  modern: '… It is the essence of all the Vedas and all the histories, … He recited it to the emperor Parikshit …

    '
1.4.18:
  dutt: 1.4.18
  text: '… viewing, with his divine sweep of observation, … the ill fortunes of men, — reflected, in his unerring vision, upon what was likely to conduce to the welfare of all the castes and stages of life.

    '
  modern: '… He looked with his divine sight on the bad fortune of men. Then, with his unerring vision, he thought about what would serve the welfare of every caste and stage of life.

    '
1.4.28:
  dutt: 1.4.28
  text: 'Rigidly adhering to the vow of Brahmacharyya, I have practised immaculate devotion to the Vedas, the Fires, and my tutors, and followed their injunctions.

    '
  modern: 'I have kept my vow of celibate study strictly. I have served the Vedas, the sacred fires, and my teachers with pure devotion, and I have followed their instructions.

    '
1.4.29:
  dutt: 1.4.29
  text: 'I have also presented the drift and substance of the Vedas under the designation of Bharata, wherein may be found mirrored duties and other holy matters even by women and Sudras.

    '
  modern: 'I have also set out the substance of the Vedas in the Bhārata. In it, women and Śūdras can find their duties and other holy teachings.

    '
1.4.30:
  dutt: 1.4.30
  text: 'And yet my soul, as encased in the body, full as it is of spiritual light, looks very poor and imperfect.

    '
  modern: 'And yet my soul, held in the body, looks poor and incomplete, though it is full of spiritual light.

    '
1.4.32:
  dutt: 1.4.32
  text: 'While Krishna (Vyasa) was reflecting in this cheerless and self-despising mood, Narada came to his hermitage, mentioned above.

    '
  modern: 'While Kṛṣṇa (Vyāsa) sat in this gloomy, self-doubting mood, Nārada came to his hermitage.

    '
1.5.1:
  dutt: 1.5.1
  text: 'Then did the renowned lyre-handed god-sage, seated comfortably, thus address the Brahmana sage, while a smile seemed to play upon his lips.

    '
  modern: 'Then the famous god-sage, who carries a lyre, sat at ease and spoke to the Brahmin sage. A smile seemed to play on his lips.

    '
1.5.3:
  dutt: 1.5.3
  text: 'Consummate indeed is thy knowledge of what is sought to be known, as thou hast composed that wonder — the Bharata, rich with all truth.

    '
  modern: 'Your knowledge of what is worth knowing is complete. You have made that wonder, the Bhārata, rich with all truth.

    '
1.5.4:
  dutt: 1.5.4
  text: 'Thou hast discussed and studied the nature of the Eternal God; and yet, O mighty one, thou bewailest thyself as one who hath missed his end.

    '
  modern: 'You have studied and taught the nature of the Eternal God. And yet, O mighty one, you grieve as if you had failed to reach your goal.

    '
1.5.5:
  dutt: 1.5.5
  speaker: 'Vyasa said:'
  text: 'I possess indeed what thou hast described, and yet my soul findeth no ease. The root of it I enquire for of thee who art sprung from the Self-existent divinity and possessed of profound knowledge.

    '
  modern: 'I have all that you describe, yet my soul finds no peace. I ask you for the root of it, since you were born of the Self-existent one and have deep knowledge.

    '
1.5.8:
  dutt: 1.5.8
  speaker: 'Narada said:'
  text: 'Thou hast left untouched the spotless glory of the Lord, — failing which, nothing can please Him. I believe thou art deficient therein.

    '
  modern: 'You have left untouched the spotless glory of the Lord. Without it, nothing pleases him. I think you have fallen short there.

    '
1.5.9:
  dutt: 1.5.9
  text: 'O Prince among sages, thou hast not recounted the glories of Vasudeva, as thou hast described duties and other matters.

    '
  modern: 'O prince among sages, you have described duties and other matters, but you have not told the glories of Vāsudeva.

    '
1.5.11:
  dutt: 1.5.11
  text: 'That exercise of speech annihilates the sins of men, each sloka of which, ill-formed though it be, is inscribed with the name of the Eternal One, and which holy men hear, recite, and sing.

    '
  modern: 'Speech of that kind destroys the sins of men. Every verse of it, however poorly made, carries the name of the Eternal One. Holy men hear it, recite it, and sing it.

    '
1.5.13:
  dutt: 1.5.13
  text: 'Do thou then, O sage of mighty good fortune, of unerring vision, of stainless renown, and of firm attachment to truth and vows of austerity, call to thy mind by the help of thy power of concentration the deeds of the Almighty to release thyself from all kinds of fetters.

    '
  modern: 'So, O sage of great fortune, of unerring vision, of stainless fame, and of firm devotion to truth and to your vows, call to mind by your power of concentration the deeds of the Almighty. Do this to free yourself from every kind of bond.

    '
1.5.32:
  dutt: 1.5.32
  text: 'It was also intimated to me that the antidote to the three miseries is work dedicated to God.

    '
  modern: 'I was also told that the cure for the three kinds of suffering is work offered to God.

    '
1.5.33:
  dutt: 1.5.33
  text: 'O sage of flawless vows, a disease which is caused by a particular thing, cannot be cured by the very same thing, without being mixed up with some other thing.

    '
  modern: 'O sage of flawless vows, a disease caused by one thing cannot be cured by that same thing alone. It needs something else mixed in.

    '
1.5.34:
  dutt: 1.5.34
  text: 'Similarly, actions are all causes of birth; and yet these very actions, when rendered to God, serve to emancipate the soul from the bonds of action.

    '
  modern: 'In the same way, all actions are causes of rebirth. Yet these same actions, when offered to God, free the soul from the bonds of action.

    '
1.7.3:
  dutt: 1.7.3
  text: '… Seated there after ablutions in his own grove of contemplation adorned with a cluster of plum trees, he concentrated his mind.

    '
  modern: '… He sat in his own grove, full of plum trees, after washing. Then he fixed his mind.

    '
1.7.8:
  dutt: 1.7.8
  text: 'Having composed this spiritual treatise and corrected it, he taught it to his son, the sage Suka given to the practice of abstinence.

    '
  modern: 'He wrote this spiritual book and checked it. Then he taught it to his son, the sage Suka, who was devoted to renunciation.

    '
1.15.38:
  dutt: 1.15.38
  text: 'And the selfcontrolled emperor installed in the city of Hastinapur, his grand-son, his equal in accomplishments, as the lord of the kingdom girt by the ocean.

    '
  modern: 'The self-controlled emperor installed his grandson, his equal in virtues, in the city of Hastinapur as lord of the earth girt by the ocean.

    '
1.16.2:
  dutt: 1.16.2
  text: 'He married Iravati, the daughter of Uttara and begat upon her four sons — Janamejaya and others.

    '
  modern: 'He married Iravati, the daughter of Uttara, and had four sons by her, Yanmeya and the others.

    '
1.17.41:
  dutt: 1.17.41
  text: 'These should not be resorted to by a person desiring salvation and specially by a pious king, the lord of men.

    '
  modern: 'A man who wants salvation should never stay in these places. A pious king, the lord of men, should stay away from them most of all.

    '
  departs: 'The Sanskrit says ''desiring prosperity'' (bubhūṣuḥ), not ''desiring salvation''.

    '
1.17.42:
  dutt: 1.17.42
  text: 'Thereupon he got back for the bull the three legs he had lost (namely) devotion, purity and kindness and nourished the Earth consoling her.

    '
  modern: 'Then he gave the bull back its three lost legs: austerity, purity, and kindness. He comforted the Earth and made her flourish.

    '
1.18.24:
  dutt: 1.18.24
  text: 'Once on a time while roaming at large in a forest with uplifted bow for hunting (Parikshit) pursuing deer, was greatly tired, hungry and thirsty.

    '
  modern: 'Once, while roaming the forest with his bow for hunting, King Parikshit chased deer. He grew very tired, hungry, and thirsty.

    '
1.18.27:
  dutt: 1.18.27
  text: 'His knotted hairs were dishevelled and he wore a piece of deer skin. Having his mouth dried up he (Parikshit) asked such (a Rishi) for water.

    '
  modern: 'The sage''s matted hair was loose, and he wore a piece of deer skin. Parikshit''s mouth was dry, and he asked the sage for water.

    '
1.18.28:
  dutt: 1.18.28
  text: 'And not receiving grass, earth, water, to wash his feet, or sweet words he thought himself greatly insulted and was (accordingly) excited with anger.

    '
  modern: 'The sage gave him no grass, no earth, no water to wash his feet, and no kind words. Parikshit thought he had been greatly insulted, and he grew angry.

    '
1.18.29:
  dutt: 1.18.29
  text: 'Stricken with hunger and thirst, O Brahmana, he at once was possessed by anger, as he had never been before, and felt a desire to injure the Brahmana.

    '
  modern: 'Hunger and thirst had worn him down. Anger came over him at once, as it never had before, and he wanted to hurt the Brahmin.

    '
1.18.30:
  dutt: 1.18.30
  text: 'And taking up a dead serpent with the end of his bow he placed it, in anger, around the shoulders of the ascetic and went away.

    '
  modern: 'With the tip of his bow he lifted a dead snake and, in anger, hung it around the sage''s shoulders. Then he went away.

    '
1.18.32:
  dutt: 1.18.32
  text: 'Hearing of the insult showered upon his father while playing with his comrades, the highly effulgent son of the Rishi, spoke there to them:

    '
  modern: 'While playing with his friends, the bright son of the sage heard how his father had been insulted. He spoke to them:

    '
1.18.35:
  dutt: 1.18.35
  text: 'The great Krishna, the repressor of the wicked, having departed, I behold to-day the strength of one who has gone beyond his way.

    '
  modern: 'Kṛṣṇa, the one who restrains the wicked, has gone. Now I will punish those who break the bridges of dharma. See my strength.

    '
  departs: 'The boy says that today he will punish those who have broken the bounds of dharma, and bids them see his strength; Dutt''s ''I behold to-day the strength of one who has gone beyond his way'' misses this.

    '
1.18.37:
  dutt: 1.18.37
  text: 'Within seven days from to-day, Takshaka, set on by him, shall bite him — the ruin of his family, who has insulted my sire.

    '
  modern: 'Within seven days from today, Takshaka, sent by me, will bite him. He is the ruin of his family, and he has insulted my father.

    '
1.18.41:
  dutt: 1.18.41
  text: 'And hearing of the imprecation upon that lord of men, who should not have been cursed, that Brahmana did not welcome his son and said,— ''Alas! what a mighty iniquity you have done to-day — you have administered a heavy punishment for a trifling offence.''

    '
  modern: 'When the sage heard the curse laid on that king, who did not deserve it, he did not welcome his son. He said, ''Alas, what a great wrong you have done today. You have given a heavy punishment for a small offence.''

    '
1.18.46:
  dutt: 1.18.46
  text: 'That Emperor — having huge arrows — the lord of men and protector of virtue, saint-like — performer of horse sacrifices and ever devoted to great God, and who was stricken with hunger, thirst and toil, does not deserve this imprecation.

    '
  modern: 'That emperor, with his great arrows, is the lord of men and the protector of virtue. He is a saint, a performer of horse sacrifices, and wholly devoted to the great God. He was weary, hungry, and thirsty. He does not deserve this curse.

    '
1.19.1:
  dutt: 1.19.1
  text: 'Thereupon the lord, of the Earth reflecting upon the iniquity perpetrated by himself, was greatly sorry and said — ''Oh! like one wicked I have committed a vicious act towards this innocent Brahmana having hidden effulgence.

    '
  modern: 'Then the lord of the earth thought over the wrong he had done. He was deeply sorry. ''Oh, like a wicked man I have done a vicious act against this innocent Brahmin, who has hidden splendor.

    '
1.19.4:
  dutt: 1.19.4
  text: 'While meditating thus, he heard (from the Rishi''s desciple sent to him) of, as imprecated by Muni''s son, (his) death (on the seventh day) from the (biting of) Takshaka. And he considered this as good for this fire of Takshaka shall be the cause of his disassociation from the worldly objects.

    '
  modern: 'As he thought this over, a messenger from the sage came. He told the king of the curse: the king would die on the seventh day from the bite of Takshaka. The king judged this a good thing, since the fire of Takshaka would make him give up worldly things.

    '
1.19.5:
  dutt: 1.19.5
  text: 'And deciding upon the worthlessness of both the worlds (this and the next) he, desirous of serving Krishna''s feet, repaired to the banks of the Ganges and waited there, resolved upon meeting with death.

    '
  modern: 'He judged that both this world and the next were worthless. Wanting to serve Kṛṣṇa''s feet, he went to the banks of the Ganges and waited there, ready to meet death.

    '
1.19.7:
  dutt: 1.19.7
  text: 'That descendant of Pandu, bent thus upon meeting with death, being wholly devoted, resolute like an ascetic, and renouncing all earthly attachments, began to medidate upon Mukunda''s feet.

    '
  modern: 'The descendant of Pandu was set on death. He was wholly devoted, firm like an ascetic, and free of all worldly ties. He began to meditate on the feet of Mukunda.

    '
1.19.8:
  dutt: 1.19.8
  text: 'There arrived to see him the high-souled ascetics along with their desciples sanctifying the whole world — and purifying even the holy places on the pretext of their going on pilgrimage — …

    '
  modern: 'Great sages came to see him, with their disciples. They purify the whole world. Even holy places are made holy by their visits. …

    '
1.19.12:
  dutt: 1.19.12
  text: 'And when seated all at their ease, (the king), having his soul purified, and with folded hands, appeared before them and saluting them again, communicated to them his resolution.

    '
  modern: 'When they were seated and at ease, the king, his soul purified, came before them with folded hands. He bowed again and told them his purpose.

    '
1.19.15:
  dutt: 1.19.15
  text: 'O Brahmanas ye know me as one who have devoted himself to the great God. Do ye sing the glory of Vishnu; let Takshaka, as imprecated by the twice born one, bite me.

    '
  modern: 'O Brahmins, know me as one who has given himself to the great God. Sing the glory of Viṣṇu. Let Takshaka bite me, as the twice-born sage has cursed.

    '
1.19.16:
  dutt: 1.19.16
  text: 'Salutation to all Brahmanas ; may my devotion increase again and again to the great and Endless Vishnu and to all the brothers that I shall get. May I have the company of all those great men who are dependant on Him and may I have friendly attachment towards all creatures.

    '
  modern: 'Salutation to all Brahmins. May my devotion grow again and again, to the great and endless Viṣṇu and to all the brothers I shall have. May I keep company with the great men who depend on him, and may I be friendly to all creatures.

    '
1.19.25:
  dutt: 1.19.25
  text: 'There arrived the great son of Vyasa, roaming of his own accord all over the world, impartial, having no signs of any Asrama on his person wearing the garb of an Abadhuta and encircled by children, and who was always pleased with his own gain.

    '
  modern: 'Then the great son of Vyāsa arrived. He wandered the world as he liked, without bias. He wore no sign of any stage of life and dressed like an avadhuta, a wanderer beyond rule. Children surrounded him, and he was content with what he had.

    '
1.19.38:
  dutt: 1.19.38
  text: 'O lord, tell us, what should be heard, recited mentally, done, remembered and worshipped by the people and what not.

    '
  modern: 'O lord, tell us what people should hear, recite in the mind, do, remember, and worship, and what they should not do.

    '
1.19.40:
  dutt: 1.19.40
  text: 'Being thus accosted by the king with worthy words, the great son of Vyasa, conversant with piety, said.

    '
  modern: 'The king spoke these gentle words to him. The great son of Vyāsa, who knew dharma, answered.

    '
2.1.1:
  dutt: 2.1.1
  speaker: 'Suka said:'
  text: 'O king, this thy question, the foremost of all those worthy of being heard by the people, is great, conducing to the welfare of mankind and is esteemed by those who know themselves.

    '
  modern: 'O king, your question is the best one. It does good for all mankind. Those who know the self approve it above everything else that people should hear.

    '
2.1.2:
  dutt: 2.1.2
  text: 'O king of kings, there are thousands of things to be heard by people, not beholding their essence and attached to worldliness.

    '
  modern: 'O king of kings, people have thousands of things they could hear. Yet they do not see the truth of the self. They are caught up in household life.

    '
2.1.5:
  dutt: 2.1.5
  text: 'Therefore, O descendant of Bharata, the great God Hari, the soul of all, is worthy of being heard of, glorified and meditated upon by those who desire to be freed from the fear (of future births).

    '
  modern: 'So, descendant of Bharata, Hari is the great Lord and the soul of all beings. Anyone who wants to be free of the fear of rebirth should hear of him, praise him, and remember him.

    '
2.1.14:
  dutt: 2.1.14
  text: 'O descendant of Kuru, there are seven days remaining for the end of your life; perform within this time all those things that may lead you to a better state.

    '
  modern: 'O descendant of Kuru, you have seven days left to live. Use this time to do all that will lead you to a better state.

    '
2.1.15:
  dutt: 2.1.15
  text: 'The end approaching, the person, devoid of the fear of death, by the weapon of disassociation, severs all attachment towards his body and those that follow it (i.e. wife and children).

    '
  modern: 'When the end comes, a man without fear of death cuts off all attachment to his body and to those who follow it, wife and children, with the weapon of detachment.

    '
2.6.37:
  dutt: 2.6.37
  text: 'Salutation to that Great God whose incarnations we have been chanting and whose true image we have not been able to ascertain.

    '
  modern: 'We bow to that Great God. We sing of his incarnations, but we have not been able to know his true form.

    '
2.6.39:
  dutt: 2.6.39
  text: 'He is pure, true and wise, is at one with all, above all doubts, unmoved, perfect, is without beginning or end, devoid of all qualities, eternal and one.

    '
  modern: 'He is pure, true, and wise. He is one with all things and beyond all doubt. He does not move. He is perfect, with no beginning and no end. He has no qualities, and he is eternal and one.

    '
2.6.44:
  dutt: 2.6.44
  text: '… whatever on earth is gifted with six kinds of wealth, energy, the power of mind and senses, firmness, forgiveness, beauty, bashfulness, prosperity, understanding, picturesque colour, whatever has shape and is without shape, are but the manifestations of that God.

    '
  modern: 'Whatever on earth is great, strong, patient, glorious, modest, prosperous, wonderful, and true, whether it has form or has none, is only a manifestation of that God.

    '
2.6.45:
  dutt: 2.6.45
  text: 'Do thou hear the principal incarnations of that Great God removing the dirt of ears; I shall relate that excellent theme.

    '
  modern: 'Listen. I will tell you the main incarnations of that Great God. They wash the dirt from your ears. I will tell you that excellent subject.

    '
3.5.23:
  dutt: '3.5'
  text: 'Before the creation, the illustrious lord existed as ONE and the SOUL of all created beings, and though self-desire disappeared in him— he appeared as invested with many qualities of intellect. … This his energy of observation is the soul of action and cause this is called Maya by which the Lord has created the universe.

    '
  modern: 'Before creation, the Lord existed alone, as one, the Soul of all beings. Though no desire of his own was left in him, he showed himself in many forms of thought. … This power of his to see is the source of action and of cause. It is called Māyā, and by it the Lord made the universe.

    '
3.5.25:
  dutt: '3.5'
  text: (with 3.5.23)
3.8.10:
  dutt: '3.8'
  text: 'When this universe was under waters at the time of dissolution, the deity alone reposed on his mighty serpent-couch; his eyes were closed though he did not do away with the power of understanding; renouncing all playful illusions he was enjoying the pleasure of conceiving his own form and hence he was disengaged from all actions.

    '
  modern: 'When the universe lay under water at the time of dissolution, the Lord alone rested on the great serpent couch. His eyes were closed in sleep, but he kept his power of understanding. He had put aside all the play of illusion. He took joy in his own form, so he did no work.

    '
3.8.11:
  dutt: '3.8'
  text: 'And although he had placed within his person all incorporeal bodies, he sent the energy of time to arouse him again at the Time of creation; he lived within waters as fire exists inside wood having its action arrested.

    '
  modern: 'He had taken all the subtle bodies into his own person. Still, he sent out the power of time to wake him for creation. He lived in the waters as fire lives inside wood, with its action held back.

    '
3.8.13:
  dutt: '3.8'
  text: 'The subtle desire, which he had in view, being worked up with the quality of passion, in time issued out from his navel for the purpose of creating the universe.

    '
  modern: 'A fine desire rose in him, stirred by the quality of passion. In time it came out of his navel, to create the universe.

    '
3.8.14:
  dutt: '3.8'
  text: 'As soon as it was originated it was metamorphosed into a lotus by the influence of Kala the originator of actions; and that lotus, which sprang from Vishnu, excited the huge deep by its own lustre like unto the sun.

    '
  modern: 'As soon as it arose, Kāla, the cause of action, turned it into a lotus. This lotus sprang from Viṣṇu, and its light lit up the vast deep like the sun.

    '
3.8.15:
  dutt: '3.8'
  text: 'And Vishnu entered that lotus which was the out-come of the quality of passion and which manifested qualities; from it came Brahma the originator of the Vedas, who, having none to trace his origin from, was called the ''self-sprung.''

    '
  modern: 'Viṣṇu entered that lotus, which came from passion and showed the qualities. From it came Brahmā, the source of the Vedas. He had no one to trace his birth to, so he was called ''self-sprung.''

    '
3.8.21:
  dutt: '3.8'
  text: 'Thereupon desisting from enquiry and not attaining to his desire he came back to his lotus seat; and renouncing the notion of self and controlling his breath he engaged in the meditation (of the deity).

    '
  modern: 'Then he gave up the search without finding what he wanted, and went back to his lotus seat. Renouncing the idea of self and holding his breath, he sat in meditation on the deity.

    '
3.8.23:
  dutt: '3.8'
  text: 'He saw a Purasha reposing on a huge serpent, yellow as a lily and the darkness of the deep was removed by the lustre of jewels set on the heads perfectly attached to its hood resembling an umbrella.

    '
  modern: 'He saw a Puruṣa lying on a huge serpent, yellow as a lily. The jewels on the serpent''s hoods, spread like an umbrella, drove out the darkness of the deep.

    '
3.8.33:
  dutt: '3.8'
  text: 'Being touched by the quality of passion, and casting his looks five times for the purpose of creation upon the lotus-navel and devoting his mind to the deity and creation he engaged in chanting the glories of the great God worthy of being hymned.

    '
  modern: 'Moved by passion, he looked five times at the lotus of his navel, with his mind on creation and on the deity. Then he began to sing the praises of the great God, who is worthy of praise.

    '
3.9.2:
  dutt: '3.9'
  text: 'O lord, the quality of darkness hath disappeared from thee, by the presence of thine power of understanding; the form, thou hast manifested to-day for extending thine favour unto the devotees, is the first of many incarnations and I have originated from the lotus-navel of this form of thine.

    '
  modern: 'O Lord, the darkness has gone from you, through the rise of your knowledge. This form, which you have shown today to favour your devotees, is the first of many incarnations. I came forth from the lotus that grew from its navel.

    '
3.9.3:
  dutt: '3.9'
  text: 'O great Lord, I do not behold distinct from this, that form of thine whose manifestation is never covered, which is devoid of differences and which is all joy; I shall therefore take refuge with this thine form, which is the foremost of those worthy of being worshiped, the creator of the universe and therefore distinct from it and the origin of elements and senses.

    '
  modern: 'O great Lord, beyond this form I see no other form of yours. It is never veiled. It has no differences, and it is pure joy. So I take refuge in this form, the best of forms that deserve worship. It is the maker of the universe, yet apart from the universe. It is the source of the elements and the senses.

    '
3.9.22:
  dutt: '3.9'
  text: 'That mighty one is the only friend and soul of the whole universe; he pleaseth the universe by his energy and qualities, and is fond of those who are devoted unto him. May he confer upon me the knowledge and qualities, so that, as before, I may engage in the work of creation

    '
  modern: 'That Lord is the one friend and the Soul of the whole universe. He pleases the world by his power and his qualities, and he loves those who give themselves to him. May he give me knowledge and the right qualities, so that I can create again, as before.

    '
3.9.23:
  dutt: '3.9'
  text: 'And albeit engaged in creating (the universe)— (the outcome of his energy)— may I withdraw myself from sins and may my mind be devoted to the actions manifested by his sporting with his own energy of illusion. He when propitiated, grants boons and his qualities are incarnated,

    '
  modern: 'Even while I create, may my mind be set on the deeds that come from his play with his power of illusion, so that I may shed the stain of action. When he is honoured, he grants boons, and his qualities take form.

    '
3.9.29:
  dutt: '3.9'
  text: 'O Vedagarbha, do not thou come under the stupor that springeth from sorrow. Banish all vain anxiety as to creation. I have already performed what thou askest.

    '
  modern: 'O Vedagarbha, do not let the stupor born of sorrow take you. Put aside all vain worry about creation. I have already done what you ask.

    '
3.9.34:
  dutt: '3.9'
  text: 'As thou hast desired to create various creatures with thy many acts, thy soul shall not know loss of vigour: my favour showereth down upon thee.

    '
  modern: 'You wish to create many beings by many kinds of work. Your self will not sink under it. My favour is great, and it falls on you.

    '
3.9.42:
  dutt: '3.9'
  text: 'O Dhata! I am the soul of those having souls,— I am dearer than those that are dear. People should fix their happiness in me; for it is owing to me that they find pleasure in their persons.

    '
  modern: 'O Dhātā, I am the Soul of those who have souls. I am dearer than those who are dear. People should set their happiness on me, for it is because of me that they take joy in their own bodies.

    '
3.9.43:
  dutt: '3.9'
  text: 'Do thou as before create beings as well as those that repose on me, by means of the spirit impregnated with all Veda, which hath been created by myself.

    '
  modern: 'Create beings again, as before, with this self of yours, which is made of all the Vedas and was made by me. Create those too who rest in me.

    '
3.10.7:
  dutt: '3.10'
  text: 'And seeing the lotus from which he sprang encompassing the welkin, he thought.— "By means of this I shall create (anew) the worlds that had faded away."

    '
  modern: 'He saw the lotus he had come from, spread across the sky. He thought, "By this I can make again the worlds that have faded away."

    '
3.13.16:
  dutt: '3.13'
  text: 'Seeing the earth depressed under water, Parameshti thought long within himself, ''How can I rescue her?''

    '
  modern: 'Parameṣṭhī saw the earth sunk under the water. He thought for a long time: "How can I lift her up?"

    '
3.13.17:
  dutt: '3.13'
  text: 'As I was engaged in creation, Earth, flooded with water, hath gone down to the subterraneous deeps. What should we, commissioned to create, do now? But let that Lord from whose chest I have issued, do what is best.

    '
  modern: 'As I was creating, the earth, flooded with water, has gone down into the deep. What should we do now, we who were set to create? Let the Lord from whose chest I came do what is best.

    '
3.13.18:
  dutt: '3.13'
  text: '0 sinless one, he was thus reflecting, when lo! out of his nostrils came out a tiny boar of the dimensions of a thumb.

    '
  modern: 'O sinless one, while he was thinking this, a small boar, no bigger than a thumb, came out of his nostrils.

    '
3.13.28:
  dutt: '3.13'
  text: 'And smelling the earth, Adhvaranga himself in the disguise of a boar, — albeit possessed of terrific teeth — gazed upwards at the hymning Vipras mildly, and then entered the waters.

    '
  modern: 'Smelling the earth, Adhvaraṅga himself, in the form of a boar, gazed up at the sages who were singing his praise. Though his teeth were fierce, his eyes were mild. Then he went down into the waters.

    '
3.13.32:
  dutt: '3.13'
  text: 'And having lifted up the submerged earth with his tusks from the Rasatala, he appeared wondrous beautiful. And as a lion slayeth an elephant, that one with his fierce ire flaming up and resembling his discus, with his cheeks and mouth painted with the Asura''s mire of blood, like those of an elephant engaged in digging the earth coloured by red chalk, as if in sport slew the Daitya of unbearable prowess, who dashed around with his upraised mace.

    '
  modern: 'He lifted the sunken earth on his tusks from the Rasātala, and he looked wonderfully fine. As a lion kills an elephant, his anger flamed up, like his discus. His cheeks and mouth were smeared with the Asura''s blood-mire, as an elephant digs up red earth in play. So, in sport, he killed the Daitya of unbearable strength, who came at him with a raised mace.

    '
3.13.33:
  dutt: '3.13'
  text: (with 3.13.32)
3.13.34:
  dutt: '3.13'
  text: 'And as sporting like an elephant, that one dark of hue like unto the Tamala, raised the earth up with his tusks, (those ascetics) led by Virinchi, recognizing him as the Lord, began to extol him in words resembling the Sukti of the Veda.

    '
  modern: 'Dark as the tamāla tree, he lifted the earth on his tusks, moving as an elephant moves at play. The sages led by Viriñci knew him as the Lord, and they began to praise him in words like the hymns of the Veda.

    '
3.13.48:
  dutt: '3.13'
  text: 'Having thus sportively rescued the earth and established her on the waters, the reverend Lord of creatures, Vishwakarma, vanished.

    '
  modern: 'Having rescued the earth in play and set her on the waters, the Lord of creatures, Viśvakarmā, vanished.

    '
3.21.6:
  dutt: '3.21'
  text: 'Commanded by Brahma to create people the reverend Karddama carried on austerities for ten thousand years on the banks of the Saraswati.

    '
  modern: 'Brahmā told Kardama to create people. So he did austerities for ten thousand years on the banks of the Sarasvatī.

    '
3.21.7:
  dutt: '3.21'
  text: 'And with rites attended with spiritual absorption Karddama worshipped Hari ever conferring boons on his devotees.

    '
  modern: 'Kardama joined his deep absorption to his rites, and he worshipped Hari, who always grants boons to his devotees.

    '
3.21.8:
  dutt: '3.21'
  text: 'And O Kshatha, in that Krita age, Reverend lotus eyed one, well pleased (with the ascetic), showed himself unto (Karddama) wearing his form consisting of sound.

    '
  modern: 'In the Kṛta age, O Kṣattā, the lotus-eyed Lord was pleased with the ascetic. He showed himself to Kardama, in a form made of the sacred sound.

    '
3.21.26:
  dutt: '3.21'
  text: 'That righteous regenerate Rajarshi, accompanied with his queen Satarupa, eager for a sight of you, will call upon you, the day after to-morrow for the purpose of beholding you.

    '
  modern: 'That righteous king, the Rājarṣi, will come here with his queen Śatarūpā. He is eager to see you. He will come the day after tomorrow.

    '
3.21.27:
  dutt: '3.21'
  text: 'My master, he will confer on you who are worthy his daughter with dark side glances, furnished with the wealth of character and perfections, who has been searching for a partner of her fortune.

    '
  modern: 'Master, he will give you his daughter, who has dark, sidelong glances and great virtue and grace. She has been looking for a husband who suits her.

    '
3.21.37:
  dutt: '3.21'
  text: '… Manu, arrived exactly by the time as predicted by the illustrious deity, at the holy hermitage of the ascetic of meek devotion, …

    '
  modern: 'Manu arrived on the very day the Lord had foretold, at the holy hermitage of the ascetic of quiet vows.

    '
3.22.9:
  dutt: '3.22'
  text: 'This is my daughter — the sister of Priyavrata and Uttanapada; she was on the look out for a husband, accomplished and young;

    '
  modern: 'This is my daughter. She is the sister of Priyavrata and Uttānapāda. She has been looking for a husband, one who is grown and accomplished.

    '
3.22.15:
  dutt: '3.22'
  text: '(Very well) I am willing to marry and thy daughter has not been given away to any; therefore by this, our first befitting marriage shall be celebrated.

    '
  modern: 'I am willing to marry. Your daughter has not been promised to anyone. So the first marriage rite, the one fit for us both, shall be done.

    '
3.24.26:
  dutt: '3.24'
  text: 'And then knowing that foremost of the deities, Triyuga, had come (into his house), that ascetic seeing him in solitude, bowed himself down and spoke as follows.

    '
  modern: 'Knowing that Triyuga, the best of the gods, had come into his house, Kardama bowed to him when they were alone, and spoke.

    '
3.25.5:
  dutt: '3.25'
  text: 'On his father having gone to the woods, the Reverend Kapila, anxious to do what was for the pleasure of his mother, stayed on, at the neighbourhood of the lake Vindu.

    '
  modern: 'When his father had gone to the forest, the Lord Kapila stayed by the lake Bindu. He wanted to do what would please his mother.

    '
3.25.9:
  dutt: '3.25'
  text: 'And the Reverend One, lord of males — like a sun risen, hath appeared as the eye of people lying in outer darkness.

    '
  modern: 'You are the first Lord of men. You rise like the sun for the people who lie in the dark.

    '
3.25.10:
  dutt: '3.25'
  text: 'O God, it behoveth thee to remove my infatuation,— I, mine, etc., which impediment thou didst first impose upon me.

    '
  modern: 'O God, you must clear away my delusion, the "I" and "mine" that you yourself placed on me.

    '
3.25.13:
  dutt: '3.25'
  text: 'Yoga centred in the soul in which there is an absolute absence of feeling either of pain or pleasure is in my opinion for the weal of people.

    '
  modern: 'In my view, the Yoga of the self, in which a person feels neither pain nor pleasure, is the way to a people''s highest good.

    '
3.25.14:
  dutt: '3.25'
  text: 'I will expound to thee this Yoga with all its parts developed— which formerly, O sinless one, I had unfolded unto the sages who were anxious to hear the exposition.

    '
  modern: 'I will teach you this Yoga in full, O sinless one. I taught it once before to the sages who wanted to hear it.

    '
3.25.15:
  dutt: '3.25'
  text: 'Verily thought is for the confinement or release of a being: when fixed on terrestrial objects it is confined; and when concentrated on the Divinity, the same is free.

    '
  modern: 'The mind binds a being, and the mind frees it. When it is fixed on worldly things, it is bound. When it is turned to the Divine, it is free.

    '
3.25.20:
  dutt: '3.25'
  text: 'Attachment, the learned understand, is the ever enduring bond of the spirit; but this same attachment directed towards the good becomes the open door to emancipation.

    '
  modern: 'The learned know that attachment is an endless noose on the self. But the same attachment, when it is given to the good, opens the door to freedom.

    '
3.25.21:
  dutt: '3.25'
  text: 'Those persons, that being forbearing, kind hearted, friendly to all corporal beings, mild, pious,— ornaments of pious people, …

    '
  modern: 'Those who are patient and kind, friends to all living beings, calm, and free from enmity, are the ornaments of the good.

    '
3.28.3:
  dutt: '3.28'
  text: '… through abstention from acts pointing to righteousness, interest or desire; through devotion to virtue having emancipation for its aim; through moderate and pure meals; abode at a spot solitary and free from disturbances; the banishing of ill will towards all creatures; truth-telling; the eschewing from the unjust appropriation of another''s property; the taking of such a quantity of a thing as exactly answers one''s want; practising the Brahmacharya mode of life; and carrying on penances; purity external as well as internal; study of the Veda; worship of the Supreme Male being— the Reverend one, …

    '
  modern: 'Turn away from worldly duties, and take joy in the path to freedom. Eat moderate, clean food. Live in a quiet, safe place. Do no harm to any creature. Speak the truth. Do not take what belongs to another, and take only what you need. Keep the vow of chastity. Practise austerity and purity, outside and inside. Study the Veda. Worship the Supreme Person.

    '
3.28.4:
  dutt: '3.28'
  text: (with 3.28.3)
3.29.8:
  dutt: '3.29'
  text: 'All the three kinds of reverence which is entertained for me by an irascible person under the influence of spite, or pride, or ill will, perceiving difference, are impregnated with the principle of dullness.

    '
  modern: 'All three kinds of devotion that an angry person, who sees difference, offers me from spite, pride or ill will are steeped in the quality of dullness.

    '
3.29.9:
  dutt: '3.29'
  text: 'That kind of worship which a person perceiving difference, addreseth towards me in the form of an idol, having some other end than myself, — hankering after fame or riches, springeth from the principle of action.

    '
  modern: 'Worship from a person who sees difference, who offers to me in an idol for some other end than me, who wants fame or riches, comes from the quality of action.

    '
3.29.10:
  dutt: '3.29'
  text: 'That kind of reverence under which a person perceiving difference, celebrates the prescribed sacrifices, resigning the fruit of all acts in the Supreme Lord, and having the delight of the Most High in his view, is permeated with the principle of goodness,

    '
  modern: 'Reverence in which a person who sees difference performs the prescribed sacrifices, gives up the fruit of all acts to the Supreme Lord, and keeps the joy of the Highest in view, is full of goodness.

    '
3.29.21:
  dutt: '3.29'
  text: 'I am always present in every creature as his soul. Disregarding me, what person should waste worship on idols, etc.?

    '
  modern: 'I am always present in every creature as its soul. What person would waste worship on idols, ignoring me?

    '
3.29.22:
  dutt: '3.29'
  text: 'Renouncing me, who am the soul of every one and the Lord present in every creature, he who addresseth himself to the devotion of any one else, offereth oblations into ashes.

    '
  modern: 'He who gives up me, the Soul of all and the Lord in every creature, and turns his devotion to another, pours his offerings into ashes.

    '
3.29.27:
  dutt: '3.29'
  text: 'Knowing me resident in all beings and located in them, it therefore behoveth every person to serve others with gifts, honor and an even regard.

    '
  modern: 'Since I dwell in all beings, everyone should serve others with gifts, honour, and an even eye.

    '
3.29.34:
  dutt: '3.29'
  text: '''The Deity is present in all these beings'';— thinking in this wise, one should bow down before all creatures.

    '
  modern: 'Thinking, "The Lord is present in all these beings," one should bow to all creatures with the mind.

    '
3.33.11:
  dutt: '3.33'
  text: 'Ascetics having a knowledge of Brahma follow this path. Do thou entertain a reverence for it. By adopting such a course, thou, wilt obtain me, who inspirest with courage the hearts of votaries; but those that are ignorant of this view of mine fall into the jaws of death.

    '
  modern: 'Ascetics who know Brahman follow this path. Have faith in it. By this course you will reach me, the fearless one. Those who do not know this view of mine meet death.

    '
3.33.12:
  dutt: '3.33'
  text: 'Having shown his soft way to his mother the reverend Kapila departed with the permission of his mother

    '
  modern: 'Having shown her this path to himself, the revered Kapila left, with his mother''s leave.

    '
3.33.30:
  dutt: '3.33'
  text: 'By thus following the course pointed out by Kapila, Devahuti in a very short time obtained the Reverend one, who is ever free, who is the Supreme Spirit,— and whose form is the Soul.

    '
  modern: 'Following the path that Kapila taught, she soon reached the Highest. She reached the Lord, who is ever free, the Supreme Spirit, whose form is the Soul.

    '
4.8.7:
  dutt: '4.8'
  text: 'The husband of Satarupa had two sons, Priyavrata and Uttanapada. On account of their being a portion of Vasudeva, they were engaged in protecting the earth.

    '
  modern: 'Satarūpā''s husband had two sons, Priyavrata and Uttānapāda. They were portions of Vāsudeva, and they guarded the earth.

    '
4.8.8:
  dutt: '4.8'
  text: 'Uttanapada had two wives Suniti and Suruchi. Of them Suruchi was the favourite of her husband: and not the other one whose son was Dhruva.

    '
  modern: 'Uttānapāda had two wives, Sunīti and Suruci. Suruci was his favourite, not the other one, whose son was Dhruva.

    '
4.8.9:
  dutt: '4.8'
  text: 'And it came to pass that once on a time as the king, placing Suruchi''s son, Uttama, on his lap, was employed in dandling him, Dhruva became eager to ascend his father''s lap, but he did not even greet his son.

    '
  modern: 'Once, when the king had Suruci''s son Uttama on his lap and was dandling him, Dhruva wanted to climb up into his father''s lap. But the king did not welcome him.

    '
4.8.10:
  dutt: '4.8'
  text: 'On the son of one who was co-wife with her, Dhruva, behaving thus, Suruchi, elated with arrogance and wrought up by jealousy in the hearing of the king addressed him, saying,—

    '
  modern: 'Suruci, puffed up with pride and eaten by jealousy, spoke to Dhruva, the son of her co-wife. She spoke where the king could hear her.

    '
4.8.13:
  dutt: '4.8'
  text: 'If thou wouldst have the lap of the king, do thou enter upon austerities and adore the Primal Male, and thereby have thy birth in my womb.

    '
  modern: 'If you want your father''s lap, do austerities and worship the Primal Male. Then, by his grace, you will be born in my womb.

    '
4.8.14:
  dutt: '4.8'
  text: 'Smitten with the cruel speech of his step-mother, (Dhruva),, sighing like a serpent struck with a rod, hissing in rage, left his father, who was looking on and who was speaking slowly (through fear of Suruchi), and, crying, went to his own mother.

    '
  modern: 'Hurt by his stepmother''s cruel words, Dhruva sighed like a snake struck with a stick, hissing in anger. He left his father, who stood by and spoke slowly, for fear of Suruci. Crying, he went to his mother.

    '
4.8.15:
  dutt: '4.8'
  text: 'And Suniti at once took upon her lap the boy who was heaving sighs, and whose upper and nether lips were trembling in emotion. And when from the lips of the inmates of the inner apartment she heard all that had been uttered by one who was co-wife with her, her heart was racked with grief.

    '
  modern: 'Sunīti at once took the boy onto her lap. He was sighing, and his lips trembled with feeling. When she heard from the women of the inner rooms what the co-wife had said, her heart was racked with grief.

    '
4.8.17:
  dutt: '4.8'
  text: 'And sighing heavily, and not seeing the other shore of this misery, the damsel addressed his son, saying, My son, do not take to heart the wrong that others may do unto thee : those, that inflict wrongs on others, reap but their own wrongs.

    '
  modern: 'Sighing deeply, and unable to see any end to this misery, the young woman spoke to her son. "My son, do not take to heart the wrong that others do to you. Those who wrong others reap only their own wrongs."

    '
4.8.18:
  dutt: '4.8'
  text: 'What Suruchi hath said is even true. It is owing to thy ill-luck that thou wast borne in the womb of me, to confess whom as his wife the monarch is ashamed, my child.

    '
  modern: 'What Suruci said is true. It is your bad luck that you were born in my womb. The king is ashamed to own me as his wife, my child.

    '
4.8.19:
  dutt: '4.8'
  text: 'Do thou, casting off all guile, act as hath been truly pointed out by thy step-mother. If thou wouldst ascend the lap of thy father even as Uttama doth, do thou adore the lotus-feet of Adhokshaja.

    '
  modern: 'Put aside all malice and do what your stepmother has rightly told you. If you want your father''s lap as Uttama has it, worship the lotus feet of Adhokṣaja.

    '
4.8.25:
  dutt: '4.8'
  text: 'Hearing of this, and learning the exertions of Dhruva, Narada touched his head with his sin-destroying hand, and spoke in wonder the following words.

    '
  modern: 'Nārada heard of this and learned what Dhruva meant to do. He touched Dhruva''s head with his hand, which destroys sin, and spoke, amazed.

    '
4.8.27:
  dutt: '4.8'
  text: 'My child at thy age, I fancy, when thou art a stripling engaged in play, the sense of honor and disgrace hath not been developed in thee.

    '
  modern: 'My child, at your age, when you are a boy at play, I think the sense of honour and disgrace has not yet grown in you.

    '
4.8.28:
  dutt: '4.8'
  text: 'But if thou hast got that sense, there can be no possible occasion of thy dissatisfaction, save fatuity in the face of the fact that people do but reap their own act.

    '
  modern: 'But if you do have that sense, you have no cause to be unhappy, unless you are deluded. People only reap what they have done.

    '
4.8.29:
  dutt: '4.8'
  text: 'Therefore one should rest satisfied with what is dispensed by the Deity.

    '
  modern: 'So one should be content with what the Deity gives.

    '
4.8.30:
  dutt: '4.8'
  text: 'My child, this endeavour of thine is so very arduous; that person is very hard to come at whose good graces thou seekest under the direction of thy mother.

    '
  modern: 'My child, this effort of yours is very hard. The one whose favour you seek, at your mother''s urging, is very hard to reach.

    '
4.8.40:
  dutt: '4.8'
  text: 'What thy mother hath said is even the fit path for thee. Regulating thy respiration, do thou adore the Reverend Vasudeva.

    '
  modern: 'What your mother told you is the right path for you. Control your breath and worship the Lord Vāsudeva.

    '
  departs: pravaṇātmanā is 'with a mind bent on him'; the verse says nothing of regulating the breath, which Narada teaches only later (4.8.44).
4.8.42:
  dutt: '4.8'
  text: 'Do thou find thy way to Madhuvana, … is the home of the reverend Hari. May good betide thee!

    '
  modern: 'Go to Madhuvana, … the home of the Lord Hari. May good be yours.

    '
4.8.51:
  dutt: '4.8'
  text: '… he should direct his adorations to the Reverend One with a singleness of purpose.

    '
  modern: 'With a single, steady mind, he should direct his worship to the Lord.

    '
4.8.62:
  dutt: '4.8'
  text: 'After that divine sage, Narada had concluded his instructions, the king''s son Dhruva bowed down unto him and performed rounds about him, and then set out for the holy Madhuvana stamped with the foot marks of the Reverend Hari.

    '
  modern: 'When Nārada had finished his teaching, the king''s son bowed to him and walked around him. Then he set out for the holy Madhuvana, marked by the footprints of the Lord Hari.

    '
4.8.71:
  dutt: '4.8'
  text: '… Dhruva, repairing to Madhuvana, performed his ablutions in the holy bathing-place existing there, and restraining his senses, fasted for the night. Then agreeably to the instructions of the divine sage, he set about serving that Prime Male— the Reverend One.

    '
  modern: 'Dhruva reached Madhuvana and bathed at the holy bathing place there. Holding his senses in check, he fasted through the night. Then, as the divine sage had told him, he began to serve the Prime Male, the Lord.

    '
4.8.76:
  dutt: '4.8'
  text: 'On the arrival of the fifth month, the king''s son controlled his breath, and, centering his thoughts, on the supreme spirit, remained standing on a single leg moveless as a hill.

    '
  modern: 'In the fifth month, the king''s son held his breath. He fixed his thought on the Supreme Spirit, and he stood on one leg, still as a hill.

    '
4.8.78:
  dutt: '4.8'
  text: 'When Dhruva had thus employed himself on contemplation of the supreme spirit, the home of Mahat and the other categories, and the Lord of Prakriti, and Purusha, the universe, unable to bear his energy, began to tremble.

    '
  modern: 'As Dhruva meditated on the Supreme Spirit, the support of Mahat and the other principles and the Lord of Prakṛti and Puruṣa, the universe, unable to bear his power, began to tremble.

    '
4.9.2:
  dutt: '4.9'
  text: 'At that time, in consequence of Dhruva''s mind being fast anchored through the dint of contemplation, he was beholding in his heart the form of the Reverend One, resembling living splendour of the levin; and it was for this internal vision that although Hari presented himself on his Garuda, Dhruva did not see him. Finding this the Lord withdrew his internal form. Seeing the disappearance of the form, Dhruva at once started to his feet and on opening his eyes, he beheld the self same form which he had been viewing within himself.

    '
  modern: 'At that time Dhruva''s mind was held fast by meditation, and he saw in his heart the form of the Lord, bright as lightning. Because he was looking within, he did not see Hari, though Hari had come before him on Garuḍa. Seeing this, the Lord withdrew the form within him. When it vanished, Dhruva jumped to his feet and opened his eyes, and he saw the very form he had been seeing within.

    '
4.9.3:
  dutt: '4.9'
  text: 'Seeing the Reverend One externally, the floodgate of Dhruva''s rapture was opened; and bending his body, he prostrated him before the Lord by way of rendering him homage. And he seemed to drink the Lord with his eyes, to kiss him with his mouth and to embrace him with his arms.

    '
  modern: 'When he saw the Lord outside him, Dhruva''s joy broke loose. He bent his body and bowed flat before the Lord. He seemed to drink him in with his eyes, to kiss him with his mouth, and to hold him with his arms.

    '
4.9.4:
  dutt: '4.9'
  text: 'His wish was that he might sing the glory of the lord; but by virtue of his residing in every heart, he read Dhruva''s purpose. Being but a stripling Dhruva knew not how to hymn the Lord; and therefore having compassion on the king''s son who stood before him with joined hands, he touched Dhruva''s two cheeks with the conch impregnated with the Veda.

    '
  modern: 'Dhruva wished to sing the Lord''s glory. The Lord, who dwells in every heart, knew what he wanted. But Dhruva was only a boy and did not know how to praise him. So the Lord, in pity for the king''s son who stood before him with folded hands, touched his two cheeks with the conch that is made of the Veda.

    '
4.9.5:
  dutt: '4.9'
  text: 'On his cheeks being touched with the conch, Dhruva comprehended the difference existing between the creature and the Lord; and he understood the word the Lord had spoken to him. Then in a spirit of reverence and love, he fell to eulogising him. The wondrous glory of the Reverend One was known everywhere; and Dhruva was all composure so that he could very well hymn him.

    '
  modern: 'When the conch touched his cheeks, Dhruva understood the difference between the creature and the Lord, and he understood the words the Lord had spoken to him. With reverence and love, he began to praise him. The Lord''s wondrous glory is known everywhere, and Dhruva was calm enough now to hymn him well.

    '
4.9.6:
  dutt: '4.9'
  text: 'And the auspicious Dhruva spoke: ''I bow down unto Thee, who, being the stay of eyes and the other organs, as well as of all the faculties of cognition hast entered into my mind, and inspiring me with consciousness, hast vivified the slumbering word, in me, and my arms, legs, ears, touch, and the rest of my organs.''

    '
  modern: 'Dhruva spoke: "I bow to you. You are the support of the eyes and the other organs and of all the powers of knowing. You have entered my mind and given me awareness. You have woken the sleeping word in me, and my arms, legs, ears, skin, and all my other organs."

    '
4.9.16:
  dutt: '4.9'
  text: 'Even he is Brahma from whom have sprung such varieties of learning having opposing tendencies, and fraught with diverse kinds of power. He is the creator of the universe. He is whole, without beginning, without end, without change, and absolute joy. I take refuge under Him.

    '
  modern: 'He is Brahman, from whom come all the kinds of learning, with their opposing paths, and all the many powers. He is the maker of the universe. He is whole, without beginning or end, without change, and pure joy. I take refuge in him.

    '
4.9.18:
  dutt: '4.9'
  text: 'When the intelligent Dhruva of high intent had hymned the Lord, the Reverend One, ever overflowing with mercy for his servants, well pleased, spoke:

    '
  modern: 'When Dhruva, wise and firm in his purpose, had praised the Lord, the Lord, always full of mercy for his servants, was pleased and spoke.

    '
4.9.19:
  dutt: '4.9'
  text: '''O son of a Kshatriya, I understand the purpose that is present in thy heart. O thou of excellent vows, good betide thee!''

    '
  modern: '"Son of a Kṣatriya, I know the purpose in your heart. You of firm vows, may good be yours."

    '
4.9.20:
  dutt: '4.9'
  text: 'I confer on thee a place difficult of being obtained, — O gentle One, that region is ever ablaze and nirvana is ever present there. A framework of astral bodies radiates over that region. No other person had ever attained this place.

    '
  modern: 'I give you a place that is hard to win. O gentle one, that region always shines, and nirvāṇa is always there. A ring of stars and planets lights it. No one before you has ever reached that place.

    '
4.9.22:
  dutt: '4.9'
  text: 'Presently resigning unto thee the burden of protecting the earth, thy sire will repair to the woods, assuming the role of a seeker of righteousness and then thou shall reign for sixty three thousand years. During the whole of this period, none of thy organs shall experience any deterioration.

    '
  modern: 'Soon your father will hand you the burden of guarding the earth and go to the forest, taking up the life of one who seeks righteousness. Then you will rule for sixty-three thousand years, and in all that time none of your senses will weaken.

    '
  departs: The Sanskrit gives thirty-six thousand years (ṣaṭ-triṃśad-varṣa-sāhasram), not sixty-three thousand; Dutt has misread the number.
4.9.25:
  dutt: '4.9'
  text: 'Then thou shall go to my region, bowed down unto by all creatures, and located above the sphere of the sages, — (my region), wherefrom one hath not to turn back.

    '
  modern: 'Then you will go to my place, which all beings bow to. It lies above the sphere of the sages, and no one who reaches it turns back.

    '
4.9.26:
  dutt: '4.9'
  text: 'Having thus bestowed on Dhruva his own state, the Reverend One, having Garuda for his carrier, not feeling the full measure of joy, went back to his abode.

    '
  modern: 'Having given Dhruva his own state, the Lord, whose vehicle is Garuḍa, went back to his home, though he did not feel full joy.

    '
4.9.35:
  dutt: '4.9'
  text: 'Alas ! of him who was ready to confer on me, his own delight, I have asked for worldly prosperity, like a man of slender religious merit, who going to an emperor, asketh for broken grains of rice mixed with husks.

    '
  modern: 'Alas! He was ready to give me his own joy, and I asked him for worldly wealth. I was like a man of small merit who goes to an emperor and asks for broken rice mixed with husks.

    '
4.9.45:
  dutt: '4.9'
  text: 'Thereat having obtained the blessings of his sire, Dhruva bowing down unto his feet, with his head bowed unto his mothers; and being the foremost of the righteous, was offered their homage, in his turn.

    '
  modern: 'With his father''s blessing, Dhruva bowed at his feet, and bowed his head to his mothers. He was the first of the righteous, and they gave him honour in return.

    '
4.9.46:
  dutt: '4.9'
  text: 'Raising up her son prostrate at her feet, Suruchi, in accents thrilling in emotion, addressed him,— ''Mayst thou live long!''

    '
  modern: 'Suruci lifted up her son, who lay at her feet, and in a voice full of feeling she said, "May you live long!"

    '
4.9.47:
  dutt: '4.9'
  text: 'All persons of themselves bear a humble behaviour to him with whom the Reverend Hari is pleased on account of his friendly and other qualities, even as water floweth into a lower plane.

    '
  modern: 'Everyone bows down before the one with whom the Lord Hari is pleased, for his friendly and other good qualities, as water runs down to a lower place.

    '
4.9.49:
  dutt: '4.9'
  text: 'And Dhruva''s mother Suniti took up into her lap her son, dearer unto her than life itself, and thus assuaged the grief that was established in her heart; and she felt a rapture on touching the person of her boy.

    '
  modern: 'Dhruva''s mother Sunīti took her son onto her lap. He was dearer to her than her life. The grief in her heart was eased, and she felt joy when she touched her boy.

    '
4.9.67:
  dutt: '4.9'
  text: 'And then seeing that age had overtaken him, he then desisted from the pursuit of worldly enjoyments, — and after having deliberated as to the way in which he could come by an excellent state, went into the forest.

    '
  modern: 'When he saw that old age had come to him, he gave up the pursuit of worldly pleasures. He thought about how to reach a high state, and then he went into the forest.

    '
4.12.11:
  dutt: '4.12'
  text: 'And firmly devoted to Achyuta the soul of all beings, by dint of reverence, he viewed the Lord as indwelling in himself as well as every other creature.

    '
  modern: 'Firmly devoted to Acyuta, the Soul of all beings, with reverence, he saw the Lord dwelling in himself and in every creature.

    '
4.12.12:
  dutt: '4.12'
  text: 'And crowned with a noble character, engaged in the contemplation of Brahma, and cherishing kindly feelings for those in misery, he busied himself in ruling his subjects for the sake of righteousness alone; and the people loved him as their father.

    '
  modern: 'He had a noble character. He meditated on Brahman and felt kindness for those in pain. He ruled his subjects for the sake of righteousness alone, and the people loved him as a father.

    '
4.12.14:
  dutt: '4.12'
  text: 'Having secured his three objects for many years, with his senses subdued, he made over the kingdom to his son.

    '
  modern: 'After many years of gaining the three aims of life, with his senses under control, he handed the kingdom to his son.

    '
4.12.38:
  dutt: '4.12'
  text: 'Having arrived at the region of Vishnu, the son of king Uttanapada, Dhruva, devoted to Krishna, shone like the flawless crest jewel of three worlds.

    '
  modern: 'Dhruva, the son of King Uttānapāda, devoted to Kṛṣṇa, reached the realm of Viṣṇu and shone like the flawless crest-jewel of the three worlds.

    '
4.13.18:
  dutt: '4.13'
  text: 'The wife of Anga was Sunitha. She brought forth the fiery Vena, begat by Anga, whose misdemeanour caused the royal sage, Anga, to go out of his palace, in degradation.

    '
  modern: 'Anga''s wife was Sunītha. She bore the fierce Vena to Anga. Because of the boy''s bad conduct, the royal sage Anga left his palace in disgrace.

    '
4.13.42:
  dutt: '4.13'
  text: 'Seeing the cruelty of his son, the king took every means of chastisement to bring him round,— but finding his efforts unavailing, the monarch became subject to despondency.

    '
  modern: 'The king saw his son''s cruelty and tried every means of punishment to bring him round. But when his efforts failed, the king fell into despair.

    '
4.13.47:
  dutt: '4.13'
  text: 'And it came to pass, that as thus coming under dejection, the king was sleeping with Sunitha at night, he suddenly awoke and rose up; and forsaking his sleeping wife, he sallied out of his splendid palace, so that nobody knew when or whither he took his departure.

    '
  modern: 'Thus sunk in despair, the king was asleep one night beside Sunītha. He woke suddenly and got up. He left his sleeping wife and walked out of his splendid palace. No one knew when or where he went.

    '
4.14.1:
  dutt: '4.14'
  text: 'Bhrigu and the other sages ever watching the welfare of the world, refleeted that men without a king to govern them fare as the beasts do.

    '
  modern: 'Bhṛgu and the other sages, who watch over the welfare of the world, thought that men without a king fare like beasts.

    '
4.14.2:
  dutt: '4.14'
  text: 'And the Brahmanas versed in the Veda summoning Sunitha, mother of a hero, invested Vena with regal power, although this was contrary to the will of the people.

    '
  modern: 'The Brahmins who knew the Veda called Sunītha, the mother of a hero, and they made Vena king, though it went against the will of the people.

    '
4.14.4:
  dutt: '4.14'
  text: 'Having ascended the throne, Vena, fraught with the eight kinds of power by the Lokapalas, became exceedingly elated, and disregarded persons distinguished for pious worth.

    '
  modern: 'Once he was on the throne, Vena, given the eight powers by the guardians of the world, grew very proud. He looked down on those who were honoured for their piety.

    '
4.14.6:
  dutt: '4.14'
  text: 'He everywhere interrupted the course of righteousness by proclaiming with the beat of kettle-drums,— ''Ye twice born ones, ye must not sacrifice, or make gifts, or offer oblations into the fire!''

    '
  modern: 'Everywhere he stopped the course of righteousness. With the beat of drums he proclaimed, "You twice-born, you must not sacrifice, give gifts, or offer oblations into the fire!"

    '
4.14.8:
  dutt: '4.14'
  text: 'Like the danger threatening ants stationed on a piece of wood both ends of which are aflame, a mighty great peril threatens the people arising from thieves as well as their protector.

    '
  modern: 'The people are in danger on both sides, like ants on a stick burning at both ends. Thieves threaten them, and so does their protector.

    '
4.14.9:
  dutt: '4.14'
  text: 'It was from fear of the kingdom suffering from all the ills arising from the want of a king that we had invested with regal power this one so unworthy of the same. But from this very person proceeds a great danger. How can men attain peace?

    '
  modern: 'We made him king because we feared the kingdom would suffer from having no king. He is unworthy of it. But now the danger comes from this very man. How can people find peace?

    '
4.14.11:
  dutt: '4.14'
  text: '… having been installed as the ruler of men, is preying on his subjects. Yet that his iniquity may not touch us, let us try to pacify him.

    '
  modern: 'Set up as ruler of men, he now preys on his subjects. Still, so that his sin does not touch us, let us try to calm him.

    '
4.14.13:
  dutt: '4.14'
  text: '… we with our own energy will burn him, he having been already burnt by the execration of the people.” Having said this, the ascetics, expressing the rage that was working them powerfully, went to Vena, and addressing him with fair speech, spoke;

    '
  modern: 'We will burn him with our own power, though the people''s curse has already burnt him." With that, the sages, showing the rage that worked strongly in them, went to Vena and spoke to him with fair words.

    '
4.14.16:
  dutt: '4.14'
  text: 'Righteousness is of supreme worth, and compasseth the welfare of the subjects. Do not suffer it to run and to waste. If righteousness is lost, the kingdom and wealth of a king come to naught.

    '
  modern: 'Righteousness is of the highest worth, and it brings about the welfare of the subjects. Do not let it go to waste. If righteousness is lost, a king''s kingdom and wealth come to nothing.

    '
4.14.18:
  dutt: '4.14'
  text: 'The Reverend One having the universe for his form, Is well pleased with that king, who, maintaining his independence, enables the people dwelling in his dominions and capital, to address their devotions to the Reverend lord of sacrifice while observing all the rules regulating their various orders and modes of life.

    '
  modern: 'The Lord, whose form is the universe, is pleased with the king who keeps his realm independent. He lets the people in his land and capital worship the Lord of sacrifice, each keeping the duties of his own order and stage of life.

    '
4.14.19:
  dutt: '4.14'
  text: (with 4.14.18)
4.14.20:
  dutt: '4.14'
  text: 'All the Lokapalas with the highest regard in their hearts procure articles required for his worship. What is too hard to attain, if he be propitious?

    '
  modern: 'With great respect, all the guardians of the world bring what is needed for his worship. What is too hard to win, if he is pleased?

    '
4.14.23:
  dutt: '4.14'
  text: 'Ah! ye are dolts,— and take unrighteousness for righteousness. I am the lord of all, and supply people with the means of sustenance. Those are fools, who, renouncing me, seek others, even as women go after their sweet-hearts, …

    '
  modern: 'Ah, you are fools, and you take what is wrong for what is right. I am the lord of all, and I give people their living. Those who give me up and seek others are fools, like women who go after their lovers.

    '
4.14.26:
  dutt: '4.14'
  text: 'Vishnu, Virinchi, Siva, Indra, the Moon, the wind-god, Varuna, Kuvera, Yama, the sun, the spirit of clouds, the earth, the god of water and other deities,— all those that are endowed with the power of invoking blessings or curses, are all present in the person of the king, who is permeated with the virtues of all the deities.

    '
  modern: 'Viṣṇu, Viriñci, Śiva, Indra, the Moon, the wind-god, Varuṇa, Kubera, Yama, the sun, the lord of clouds, the earth, the god of water, and all the other gods, who can give blessings or curses, are all present in the body of the king. The king holds the powers of all the gods.

    '
4.14.27:
  dutt: '4.14'
  text: (with 4.14.26)
4.14.28:
  dutt: '4.14'
  text: 'Therefore, ye Vipras, do ye with your hearts purged of all ill feeling, worship even me with your acts; and do ye also gather tribute on my account. Who is there save me, …

    '
  modern: 'So, you Brahmins, with hearts free of ill will, worship me with your deeds, and bring me the tribute too. Who is there but me, …

    '
4.15.1:
  dutt: '4.15'
  text: 'And on the Vipras working at the hands of the soul-less monarch, there arose a male and a female child.

    '
  modern: 'When the Brahmins churned the arms of the soulless king, a boy and a girl were born.

    '
4.15.4:
  dutt: '4.15'
  text: 'This male child will prove the foremost of monarchs and will attain great celebrity; and in consequence of his renown, he shall be called Prithu; and will be the king of kings.

    '
  modern: 'This boy will be the first of kings and will win great fame. Because of his renown he will be called Pṛthu, and he will be the king of kings.

    '
4.15.11:
  dutt: '4.15'
  text: 'And the Brahma-knowing Brahmanas addressed themselves to installing him, … And the men began to provide articles necessary for the installation.

    '
  modern: 'The Brahmins who knew Brahman began to crown him, and people gathered all that the crowning needed.

    '
4.16.4:
  dutt: '4.16'
  text: 'He is the foremost of the pious: he leads men to the paths of piety; he is the protector of the various bridges of religion and chastiser of those who deviate therefrom.

    '
  modern: 'He is the best of those who hold to dharma. He leads people on the path of dharma. He guards the bridges of dharma and punishes those who turn from them.

    '
4.16.13:
  dutt: '4.16'
  text: 'Stationed in the path of morality he shall not punish even the son of his enemy if he does not deserve it and shall punish his own son if he deserves it.

    '
  modern: 'Standing on the path of right conduct, he will not punish even an enemy''s son who does not deserve it. But he will punish his own son if the son deserves it.

    '
4.16.17:
  dutt: '4.16'
  text: 'He shall regard other''s wives as his mother, consider his own wife as his better half, shall be kind like a father unto his subjects and follow the Brahmanas like a servant.

    '
  modern: 'He will treat other men''s wives as his mothers. He will see his own wife as the better half of himself. He will be kind to his subjects as a father is, and he will serve the Brahmins as a servant does.

    '
4.18.29:
  dutt: '4.18'
  text: 'Sundering the summits of the mountains with the end of his bow, the lord paramount king, the son of Vena, levelled the whole earth at first;

    '
  modern: 'With the tip of his bow he broke the peaks of the mountains. The paramount king, son of Vena, first levelled the whole earth.

    '
4.18.30:
  dutt: '4.18'
  text: 'he then arranged for the sustenance of his subjects and afterwards laid out habitations everywhere as they severally required.

    '
  modern: 'Then he made a living for his subjects. After that he set up homes for them everywhere, as each one needed.

    '
4.22.55:
  dutt: '4.22'
  text: '… and having his mind solely devoted to Achyuta, he, for the protection of creatures, assumed at different times the diverse qualities of all the patriarchs. Having pleased his subjects with his mind, appearance, words and the gentle qualities,

    '
  modern: 'With his mind fixed on Acyuta, he took on, at different times, the qualities of all the patriarchs, to protect the creatures. He pleased his subjects by his thought, his looks, his words, and his gentle virtues.

    '
4.22.56:
  dutt: '4.22'
  text: 'he obtained the title ''Raja'' like the second moon. Governing the earth, he used to gather riches and distribute them like unto the sun;

    '
  modern: 'He won the name ''Rājā'', like a second moon-king. He ruled the earth, and like the sun he gathered wealth and gave it out.

    '
4.24.9:
  dutt: '4.24'
  text: '… Amongst them Vahirsada was greatly fortunate and became lord paramount, and was always engaged in ascetic observances and Yoga practices.

    '
  modern: 'Among them, Barhiṣat was very fortunate and became the lord paramount. He was always busy with the rites of asceticism and yoga.

    '
4.24.10:
  dutt: '4.24'
  text: 'Having celebrated sacrifices all over the earth it was covered with the tips of Kusa grass directed towards east.

    '
  modern: 'He held sacrifices all over the earth, and the ground was spread with kuśa grass, its tips pointing east.

    '
4.25.3:
  dutt: '4.25'
  text: '( In. the interim ), the kind Narada, conversant with spiritual knowledge, awoke (their sire) Prachinvarhis from stupor, who remaind addicted to actions.

    '
  modern: 'Meanwhile the kind Nārada, who knew the truth of the self, woke Prācīnabarhi from his stupor. The king was still held fast by his works.

    '
4.25.7:
  dutt: '4.25'
  text: 'Narada said :~0 Patriarch, do thou now behold the thousands of beasts which thou hadst ruthlessly killed in thy sacrifice.

    '
  modern: 'Nārada said, "O lord of creatures, look at the thousands of animals you cruelly killed in your sacrifice."

    '
4.25.8:
  dutt: '4.25'
  text: 'Remembering the torture ( inflicted by thee } they are awaiting thy death, and shall wound thee with the horns made of iron.

    '
  modern: 'Remembering the torment you gave them, they wait for your death. Angry, they will cut you with horns of iron.

    '
4.29.33:
  dutt: '4.29'
  text: 'Carrying a huge burden on his head as a person places it on his shoulders, so are all the remedies.

    '
  modern: 'As a man carries a heavy load on his head and then puts it on his shoulders, so it is with all such remedies.

    '
4.29.34:
  dutt: '4.29'
  text: 'An action is not a complete remedy of actions, (for) both of them originate from ignorance like unto a dream in a dreamy state.

    '
  modern: 'An action is not a full remedy for actions. Both come from ignorance, like a dream within a dream.

    '
4.29.36:
  dutt: '4.29'
  text: 'This world is full of troubles on account of their being attached to self, but by great devotion to the preceptor, worldliness is removed.

    '
  modern: 'The world is full of troubles, because people are attached to the self. But through great devotion to the teacher, worldliness is removed.

    '
4.29.46:
  dutt: '4.29'
  text: 'Whenever the Divine (Vasudeva) thinking within Himself, extends His favour unto a person, he renounces his attachment to worldly actions and ceremonies laid down in the Vedas.

    '
  modern: 'When the Lord, thinking within himself, shows his favour to a man, the man gives up his attachment to worldly deeds and to the rites laid down in the Vedas.

    '
4.29.49:
  dutt: '4.29'
  text: 'Covering entirely the earth with Kusa grass and slaying numberless beasts, thou art proud of thyself (as a great sacrificer), and therefore being ignorant thou dost know (the region) attainable by actions and not the real object. That is the true action in which Hari delights and that is the true learning which produces devotion unto him.

    '
  modern: 'You covered the whole earth with kuśa grass and killed countless beasts. You are proud of yourself as a great sacrificer. Being ignorant, you know only the world that action can reach, not the true goal. The true action is the one in which Hari delights, and the true learning is the one that brings devotion to him.

    '
4.29.50:
  dutt: '4.29'
  text: 'Hari is the soul and lord of all created beings and is the independent instrumental of them all; they should therefore resort to His feet from which proceeds the well-being of mankind.

    '
  modern: 'Hari is the Soul and Lord of all created beings, and he is the cause of all. People should go to his feet, for from them comes the welfare of mankind.

    '
4.29.51:
  dutt: '4.29'
  text: 'He is learned who thinks “He is my most beloved, He is my soul and from Him there is not the least fear,” and whoever is learned is the preceptor Hari, O foremost of men.

    '
  modern: 'He is wise who thinks, "He is my dearest one, he is my self, and from him there is not the least fear." And whoever is wise is the teacher, Hari, O best of men.

    '
4.29.80:
  dutt: '4.29'
  text: 'Thus did the pious Narada, the foremost of the votaries of the Divine One instruct him in the Nature of God and the course of creatures; (thereupon) inviting the king Prachinvarhis he repaired to the region of the Siddhas.

    '
  modern: 'Nārada, best of the Lord''s devotees, taught him the nature of God and the course of creatures. Then he took leave of the king and went to the world of the Siddhas.

    '
4.29.81:
  dutt: '4.29'
  text: 'Having commanded his sons to protect the subjects the royal saint Prachinvarhis repaired to the hermitage of the ascetic Kapila

    '
  modern: 'Having given his sons the task of guarding the people, the royal sage Prācīnabarhi went to the hermitage of Kapila.

    '
4.29.82:
  dutt: '4.29'
  text: 'there having worshipped the lotus feet of Govinda with devotion, being whole-minded, quiescent, and disassociated from the world, he attained to the condition of being identical with the (Divine One).

    '
  modern: 'There, with a single mind, calm, and free from attachment, he worshipped the lotus feet of Govinda with devotion, and became one with him.

    '
5.1.17:
  dutt: '5.1'
  text: 'He, that without having previously subjugated his senses, wanders from forest to forest, is ever dogged by these six foes, mind and the five organs thereof; but he, that hath conquered his senses and is centered in himself, comes by no harm by leading the life of a householder.

    '
  modern: 'A man who has not first ruled his senses may wander from forest to forest, and the six enemies will follow him. But a man who has ruled his senses and rests in himself does no harm by living as a householder.

    '
5.1.19:
  dutt: '5.1'
  text: 'Resorting to the feet of the lotus-feet of the lotus-navelled Deity thou hast vanquished the six enemies; do thou enjoy ( as long as the body ) the pleasures conferred by the Divine one

    '
  modern: 'You have taken refuge at the feet of the lotus-navelled Lord, and you have beaten the six enemies. As long as your body lasts, enjoy the pleasures the Divine One gives you.

    '
5.1.38:
  dutt: '5.1'
  text: 'who else but God can accomplish the actions performed by Pryavrata, who, journeying to destroy darkness, had created the seven oceans.

    '
  modern: 'Who but God could do the deeds of Priyavrata? As he went to drive out the darkness, he made the seven oceans.

    '
5.1.39:
  dutt: '5.1'
  text: 'By him the earth was settled, and to put a stop to the dissensions of mankind, divisions of the various insular continents were laid out by the rivers, mountains and forests.

    '
  modern: 'He settled the earth. To end the quarrels of men, he marked out the continents with rivers, mountains and forests.

    '
5.3.1:
  dutt: '5.3'
  text: 'Desirous of having offspring, Navi, along with his barren (queen) Meru, adored the divine Purusha of sacrifices.

    '
  modern: 'Nābhi wanted a son. With his barren queen Merudevī, he worshipped the Lord of sacrifice, the Person who is sacrifice.

    '
5.4.5:
  dutt: '5.4'
  text: 'Being informed of the attachment of the citizens, councilors and the subjects towards him, king Navi, for the protection of virtue, installed him on the throne; and consigning him to the care of the Brahmanas he with Merudevi repaired to the hermitage of Vadrika; and having worshipped the divine Vasudeva named, Nara and Narayana, with calm and hard austerities and meditation, he, in due time, attained to his glory;

    '
  modern: 'The king heard how much his people loved his son. To keep the rule of virtue, he set the boy on the throne and left him in the care of the Brahmins. He went with Merudevī to the hermitage of Badarī. There he worshipped Vāsudeva, Nara and Nārāyaṇa, with calm and hard austerity and meditation, and in time he reached his glory.

    '
5.4.8:
  dutt: '5.4'
  text: 'Considering his own country as the field of work, the divine Rishabha for instructing his people lived for some time in the family of his spiritual guides and then obtaining their permission returned and began to deliver religious instructions unto his people and celebrate actions sanctioned both by Shruti and Smriti; he begat upon Yayantee conferred on him by Indra a hundred sons after him; of those Bharata was the eldest, a great ascetic and gifted with many accomplishments and after him this insular continent is named Bharatavarsa.

    '
  modern: 'The Lord Ṛṣabha held his own land to be the field of work. To teach his people, he lived for a time in the house of his teachers. Then, with their leave, he came back, began to teach his people their duties, and performed the rites laid down by Śruti and Smṛti. With Jayantī, whom Indra had given him, he had a hundred sons. Bharata was the eldest, a great ascetic with many gifts, and after him this land is named Bhāratavarṣa.

    '
5.4.9:
  dutt: '5.4'
  text: (with 5.4.8)
5.4.14:
  dutt: '5.4'
  text: 'Although the divine Rishabha was master of himself and always desisted from bad actions, and was the Great God identical with pure joy and knowledge, still he, like an ordinary mortal, performed many actions; for he, by his own conduct, wished to instruct the ignorant people in his own religion; he was himself calm and quiescent, still he brought the householders to order by piety, wealth, fame, progeny and by collecting enjoyments and salvation. ( For ) the ordinary people follow what the great perform.

    '
  modern: 'Ṛṣabha was master of himself and always kept from bad acts. He was the Great God, made of pure joy and knowledge. Yet, like an ordinary man, he did many deeds, because by his own conduct he wished to teach the ignorant his way. He was calm and still, yet he brought householders into order through duty, wealth, fame, children, pleasures and salvation. For ordinary people follow what the great do.

    '
5.4.15:
  dutt: '5.4'
  text: (with 5.4.14)
5.4.18:
  dutt: '5.4'
  text: 'in this continent no one there desired to beg of another, any thing for himself like an aerial flower nor did any one covet other''s things; (in short) none there did desire for any thing save increasing devotion to their king.

    '
  modern: 'In that land, no one begged anything of another, as if asking for a flower from the sky. No one coveted what was another''s. Nobody wanted anything but to grow in devotion to their king.

    '
5.4.19:
  dutt: '5.4'
  text: 'Once on a time while roaming, the divine Rishabha arrived at Brahmavarta and entering there the assembly of the leading Brahmana saints espied his own sons; and though his mind was naturally quiescent and well-balanced with humility and love, still for governing his subjects he began to instruct them (sons) in their presence.

    '
  modern: 'Once, while wandering, the divine Ṛṣabha came to Brahmāvarta. He went into the assembly of the leading Brahmin sages and saw his own sons there. His mind was calm and balanced, full of humility and love. Still, to govern his people, he began to teach his sons in their presence.

    '
5.5.1:
  dutt: '5.5'
  text: 'This human body, which is obtained in this land of mortals, should not be subject to the enjoyment of painful worldly pleasures that are partaken of by animals living upon excreta; O my children, austerity only is the most excellent thing by which soul is purified and which ( again ) leads to the eternal felicity of Brahman.

    '
  modern: 'This human body, won in this land of mortals, should not be used for the painful pleasures of the world, which animals that eat dung also enjoy. O my children, austerity alone is the best thing. It purifies the self and leads to the endless joy of Brahman.

    '
5.5.2:
  dutt: '5.5'
  text: 'The wise designate the service of the great as the gateway to final liberation and the association, with those who are addicted to women, as worldliness; those who are friendly towards all, calm, devoid of anger and of good conduct and who regard all equally, are the great.

    '
  modern: 'The wise say that serving the great is the door to final freedom, and that keeping company with those who chase women is the door to darkness. The great are those who are friendly to all, calm, free of anger, of good conduct, and who regard all alike.

    '
5.5.16:
  dutt: '5.5'
  text: 'He, who being greatly stricken with desire and being blinded towards his well-being, only hankers after wealth, and creates enmity with others for trifling pleasure, does not know of the misery that will befall him in the end, ignorant as he is.

    '
  modern: 'A man who is ruled by desire and blind to his own good only craves wealth. For a little pleasure he makes enemies of others. Being foolish, he does not know the endless pain that will come to him in the end.

    '
5.5.18:
  dutt: '5.5'
  text: 'He, who does not release him by giving him instructions on Bhakti, is not his preceptor, father, mother, deity or husband.

    '
  modern: 'A man who does not free another by teaching him devotion is not that man''s teacher, father, mother, god, or husband.

    '
5.5.27:
  dutt: '5.5'
  text: 'My worship is the practical fruit of the action of mind, speech, eyes and other senses; save by adoring me who can be freed from the dreadful noose of Death.

    '
  modern: 'Worship of me is the true fruit of what the mind, speech, eyes and other senses do. Except by worshipping me, who can be freed from the dreadful noose of Death?

    '
5.5.28:
  dutt: '5.5'
  text: 'Having thus instructed his sons, although well-instructed, for teaching people, the great friend and the divine Rishabha, with a view to learn for himself, the devotion, the spirit of disassociation, and the practice of Paramhansa, as practised by the great ascetics, of controlled spirits and action, installed Bharata, the eldest of his hundred sons, a great devotee and a follower of the votaries of the divine one on the throne for governing the earth; and having his only body left with him, and being naked and with dishevelled hairs, like maniac, placing the perpetual fire within himself, he, for entering the condition of hermits, left Brahmavarta.

    '
  modern: 'Having taught his sons, though they were already well taught, so that he could teach the people, the great friend, the divine Ṛṣabha, set Bharata on the throne to rule the earth. Bharata was the eldest of his hundred sons, a great devotee of the Lord. Ṛṣabha kept only his body. He went naked, with hair loose, like a madman, with the sacred fire placed within himself, and he left Brahmāvarta to live as a hermit.

    '
5.7.2:
  dutt: '5.7'
  text: 'Like unto subtle principles originating from Ahankara, he begot upon her five sons all like himself, namely, Sumati, Rashtravrit, Sudarshana, Avarana and Dumraketu.

    '
  modern: 'Like the subtle elements that come from ego, he had five sons by her. They were all like himself: Sumati, Rāṣṭravṛt, Sudarśana, Āvaraṇa, and Dhūmraketu.

    '
5.7.4:
  dutt: '5.7'
  text: 'Being the lord of earth, following his own duties and showing love towards subjects like his father and grandfather, he perfectly ruled his subjects engaged in their respective works.

    '
  modern: 'As lord of the earth, he kept to his own duty. He loved his subjects as his father and grandfather had, and he ruled them well while they did their own work.

    '
5.7.8:
  dutt: '5.7'
  text: 'One thousand of Ayuta years were fixed by Bharata as the period for enjoying the kingdom at the expiration of which he duly, in accordance with Sastras, divided his ancestral wealth amongst his children and then issuing out of his own house, the abode of wealthy and repairing to the hermitage of Pulaha, he assumed asceticism.

    '
  modern: 'Bharata set a term of a thousand ayuta years (an ayuta is ten thousand) for enjoying the kingdom. When it ended, he divided his ancestral wealth among his sons, as the scriptures teach. Then he left his house, full of riches, and went to the hermitage of Pulaha, where he took up asceticism.

    '
5.7.11:
  dutt: '5.7'
  text: 'There in the forest adjoining the hermitage of Pulaha, having worshipped the Divine One with various presents of flowers,, leaves, Tulasis, water, fruits and roots, the high-souled Bharata used to attain to great satisfaction;

    '
  modern: 'In the forest beside the hermitage of Pulaha, Bharata worshipped the Lord with flowers, leaves, tulasī, water, fruit, and roots. The high-souled man found great peace.

    '
5.8.2:
  dutt: '5.8'
  text: '… there approached alone a she-deer being desirous of drinking water.

    '
  modern: 'A lone doe came to the water, for she was thirsty.

    '
5.8.4:
  dutt: '5.8'
  text: 'Hearing it that she-deer, naturally timid, and being greatly afraid of the lion, cast all around her wandering looks and though her thirst was not satiated she jumped to the other side of the river.

    '
  modern: 'Hearing the roar, the doe, timid by nature and very afraid of the lion, looked around in fear. Though she had not yet had her fill, she leapt across to the other bank.

    '
5.8.5:
  dutt: '5.8'
  text: 'She was big with a young one and as she was leaping the embryo, being displaced out of huge fear, fell into the stream.

    '
  modern: 'She was pregnant. As she leapt, the young one, pushed out by great fear, fell from her womb into the stream.

    '
5.8.6:
  dutt: '5.8'
  text: 'Being greatly exhausted with abortion, with leaping and great fear and forsaken by her mates as soon as she fell into a mountain cave she expired.

    '
  modern: 'Worn out by the birth, the leap, and her great fear, and left by her herd, she fell into a mountain cave and died.

    '
5.8.7:
  dutt: '5.8'
  text: 'Beholding the young one deserted by its friend and carried off by the stream, the royal saint Bharata, out of compassion, took up from the water that motherless young one and carried it to his hermitage.

    '
  modern: 'Seeing the young fawn, left by its mother and carried off by the stream, the royal sage Bharata took pity on it, as a kinsman would. He lifted the motherless fawn from the water and carried it to his hermitage.

    '
5.8.8:
  dutt: '5.8'
  text: 'Considering that young one as his own he began to feed it daily with twigs, preserve it against wolves and please it ( with itching), kiss it and rear it up; in this way his ablution, self-control and the adoration of the Divine One were entirely destroyed within a few days.

    '
  modern: 'He took the fawn as his own. Every day he fed it twigs, guarded it from wolves, petted it, kissed it, and raised it. In a few days his bathing, his self-control, and his worship of the Lord were all gone.

    '
5.8.26:
  dutt: '5.8'
  text: 'in the meantime like a serpent approaching the hole of a mouse the irrepressible Kala, with its fierce motion, approached him who was not thoughtful of his own self.

    '
  modern: 'Meanwhile, like a snake coming to a mouse''s hole, the irresistible Time, moving fiercely, came upon him, though he gave no thought to himself.

    '
5.8.27:
  dutt: '5.8'
  text: 'Even then he fancied that the young deer was lamenting by him; and therefore having his mind attached to the young deer, he, like an ordinary mortal, renounced his body with him and attained to that of a deer; but the recollection, of his former birth, was not destroyed with it.

    '
  modern: 'Even then he thought the young deer was grieving at his side. His mind was set on the fawn. So, like an ordinary mortal, he gave up his body with the fawn and took the body of a deer. But he kept the memory of his former birth.

    '
5.8.31:
  dutt: '5.8'
  text: 'There being afraid of company, he lived alone feasting on dry leaves, grass and creepers and awaiting the time when would terminate his deer form, (and then in proper time) renounced his body in the holy stream there.

    '
  modern: 'Afraid of company, he lived alone on dry leaves, grass, and creepers, waiting for the end of his deer''s form. In due time he gave up that body in the holy stream there.

    '
5.9.2:
  dutt: '5.9'
  text: '(people used to say) that the royal saint Bharata casting off his deer form, took his birth in that human form of the Brahmana.

    '
  modern: 'People said that the royal sage Bharata, who had given up his deer''s body, was born again in this human body of a Brahmin.

    '
5.9.3:
  dutt: '5.9'
  text: 'Even (born as a Brahmana) and afraid of association with his own kinsmen lest he might again fall back, he particularly held in his mind the feet of the Divine One, the hearing of which, the remembrance of which, and the chanting of the glories whereof snap the bonds of actions and appeared before the public either as a decrepit or a dumb or a maniac for by the virtue of the Divine Hari he could recollect the condition of his former birth.

    '
  modern: 'Even as a Brahmin, he feared that living among his kin would make him fall back. So he kept his mind fixed on the feet of the Lord, whose hearing, memory, and praise cut the bonds of action. He showed himself to the world as one who was feeble, or dumb, or mad. By the grace of Hari he could remember his former birth.

    '
5.9.12:
  dutt: '5.9'
  text: 'Once on a time, a thief, desirous of having a son, undertook to sacrifice a male beast for the satisfaction of Vadra Kali.

    '
  modern: 'Once a thief who wanted a son planned to offer a man as a sacrifice to Bhadrakālī.

    '
5.9.16:
  dutt: '5.9'
  text: 'Thereupon the priest of the king of thieves, to worship the goddess Vadrakali with the blood-like Asava of that male beast, being purified with incantations, took up a dreadful dagger.

    '
  modern: 'Then the priest of the thieves'' king, to worship the goddess Bhadrakālī with the blood of that man, purified the knife with spells and took up a terrible dagger.

    '
5.9.17:
  dutt: '5.9'
  text: 'The minds of those thieves were possessed by the qualities of darkness and ignorance and were filled with the pride of riches; and they engaged in that dreadful action for they trod vicious paths by disregarding the Brahmanas, an incarnation of the Divine One; and not being able to behold the sacrifice of him, who is the son of the Brahmana Saint and who is identical with Brahman, who has no enmity with any one, who is the friend of all animals, and the destruction of whose life cannot be sanctioned by envy in times of danger, the body of the Goddess was being burnt by irrepressible Brahma effulgence and she left off the idol.

    '
  modern: 'The minds of those thieves were ruled by darkness and ignorance and swollen with the pride of wealth. They did that dreadful deed because they walked evil paths and scorned the Brahmins, who are a part of the Lord. The goddess could not bear to see the killing of the son of a Brahmin sage, who was one with Brahman, who bore no one ill will, who was the friend of all creatures, and whose killing could not be allowed even in times of danger. Her body burned in the unbearable radiance of Brahman, and she burst out of the image.

    '
5.9.19:
  dutt: '5.9'
  text: 'The fruits of their actions become profusely fruitful in them who oppress the great.

    '
  modern: 'The fruit of their deeds comes back in full on those who wrong the great.

    '
5.9.20:
  dutt: '5.9'
  text: 'O Parikshit, none becomes an enemy unto them, who are Paramahansas, the votaries of the Divine One, who have forsaken all attachment for the body, who are friendly with all animals and who are always protected by the great Deity cautiously holding the best weapon, the discus of time, and those who fearlessly resort to the lotus feet of the Divine One, remain unmoved even when the hour for their decapitation comes in.

    '
  modern: 'O Parīkṣit, no one can be an enemy to the Paramahaṃsas, the devotees of the Lord. They have given up all attachment to the body and are friendly to all creatures. The great Lord, holding his best weapon, the discus of time, always guards them with care. Those who take refuge without fear at the lotus feet of the Lord stay calm even when the hour comes for their heads to be cut off.

    '
5.10.1:
  dutt: '5.10'
  text: 'Hereupon Ruhugana, the king of Sindhu and Sauvira, (while) journeying, that foremost of twice-born ones was espied on the banks of the Ikshumati by his leading bearer of the conveyance by chance, while he was in quest of others. He is strong and plump; forsooth, shall he able to carry a load either like a bull or an ass; and by force through the assistance of other bearers he compelled him to carry the conveyance and which the high-minded (Bharata) did.

    '
  modern: 'Then Rahūgaṇa, king of Sindhu and Sauvīra, was travelling by the Ikṣumatī. His bearer, looking for other men, came upon a Brahmin by chance. The bearer thought, "He is strong and fat. He can carry a load like a bull or an ass." With help from the other bearers, he forced the Brahmin to carry the palanquin, and the high-minded Bharata did so.

    '
5.10.2:
  dutt: '5.10'
  text: 'That foremost of twice-born ones, being practised to and placing his left foot to a distance of the range of an arrow ( to avoid destruction of an animal ) the other carriers could not proceed equally with him; perceiving the uneven movement of the conveyance, Rabugana, being stricken with anger, said Why are you not going equally ? Why do you carry this conveyance unevenly

    '
  modern: 'The Brahmin walked looking at the ground a bayonet''s length ahead, so as not to step on any living thing. The other bearers could not keep pace with him. Rahūgaṇa saw the palanquin move unevenly and grew angry. "Why are you not walking evenly? Why do you carry this palanquin unevenly?"

    '
5.10.4:
  dutt: '5.10'
  text: 'O lord of men, we are not careless rather obeying thy mandate carrying it well; but the person just engaged cannot move quickly, — we shall not be able to carry it with him.

    '
  modern: '"O lord of men, we are not careless. We obey your orders and carry the palanquin well. But the man just hired cannot move fast, and we cannot carry it with him."

    '
5.10.6:
  dutt: '5.10'
  text: '… “Oh! what an affliction, O brother, you have been greatly exhausted by carrying this conveyance alone for a long time and to a great distance; your body appears to be lean and your limbs are not strong, has decrepitude of age betaken you? Are not these men your comrades?” The king thus remonstrating with him in diverse ways he remained silent and carried the conveyance; for he, being identical with Brahman, cast off all attachment for this corporeal frame in which elements, senses and action have been created by ignorance; …

    '
  modern: '"Oh, what a hardship, brother! You are worn out from carrying this palanquin alone for so long and so far. Your body looks thin and your limbs are not strong. Has old age come upon you? Are these men not your comrades?" The king scolded him in many ways, but he kept silent and carried the palanquin. For he was one with Brahman, and had given up all attachment to this body, in which the elements, the senses and action are made by ignorance.

    '
5.10.7:
  dutt: '5.10'
  text: 'What, are thou dead although alive? Dost thou disregard me and disobey my commands who am thy master? Like unto Yama meting out punishment unto creatures I shall treat thee who art negligent so that thou shalt attain to thy own nature.

    '
  modern: '"What, you are dead though you live! Do you ignore me and disobey my orders, when I am your master? Like Yama, who gives punishment to creatures, I will treat you, who are careless, so that you come to your own nature."

    '
5.10.8:
  dutt: '5.10'
  text: 'Being remonstrated with in various ways (by him) on account of his haughtiness which was increased by the qualities of darkness and ignorance the divine Brahmana, identical with Brahman, the soul and friend of all animals, casting off pride and smiling said to (the king) who had addressed him many insulting words, who was proud of himself as king and of learning and whose understanding was not acquainted with the conduct of the lords of asceticism.

    '
  modern: 'The king kept scolding him in many ways, for his pride grew from darkness and ignorance. The divine Brahmin, one with Brahman and a friend to all creatures, set aside his own pride and smiled. He spoke to the king, who had hurled many insults at him. The king was proud of his rank and his learning, and did not know the ways of the masters of asceticism.

    '
5.10.10:
  dutt: '5.10'
  text: 'He who born with a body and the attachment thereto, is subject to plumpness, leanness, mental affliction, disease, hunger, thirst, fear, quarrel, desire, sleep, attachment, anger, pride, egoism and sorrow—(but these cannot affect) me.

    '
  modern: 'Whoever is born with a body and clings to it is subject to fatness, thinness, mental pain, sickness, hunger, thirst, fear, quarrel, desire, sleep, attachment, anger, pride, self-regard, and sorrow. None of these can touch me.

    '
5.10.11:
  dutt: '5.10'
  text: 'Oh king, (as regards thy expression) "dead while living," all objects that have changes are subject to beginning and end as a rule; and where there is the condition of one''s own and that of a master there the command and action may be applied.

    '
  modern: 'King, as for your words "dead while living": all things that change have a beginning and an end. Where there is the idea of one''s own and of a master, there command and action can apply.

    '
5.10.13:
  dutt: '5.10'
  text: '(And as regards thine) treating me, O hero, who am mad, dull and stupid and my attaining to my normal state, of what avail shall be thy instruction to me who am a fool; but grinding that which is already grounded?

    '
  modern: 'As for your treating me as mad, dull, and stupid, and for your wish to bring me back to my normal state: what use is your teaching to a fool like me? It is like grinding what is already ground.

    '
5.10.14:
  dutt: '5.10'
  text: 'Suka said : — Having by these disquisitions replied (to the king) and destroyed, the rest of his pristine action by suffering, the controlled great Rishi, in whom on account of his knowledge of self-ignorance ceased, began to carry the conveyance of the king.

    '
  modern: 'Suka said: Answering the king with these arguments, the great sage, who had worn away his past deeds by suffering, and in whom ignorance had ended through knowledge of the self, went on carrying the king''s palanquin.

    '
5.10.15:
  dutt: '5.10'
  text: 'Hearing those words destroying all attachments of heart and instinct with the teachings of Yoga the king, O Pandavaya, of Sindhu and Sauvira, descended from the vehicle; with the increase of perfect reverence he acquired the claim of questioning about the true knowledge; and renouncing pride therefore he sat at his feet and praying again and again for forgiveness said : — …

    '
  modern: 'Hearing those words, which cut the attachments of the heart and carried the teaching of yoga, the king of Sindhu and Sauvīra, O Pāṇḍava, got down from the palanquin. His reverence had grown full, and with it the right to ask about the true knowledge. So he put aside his pride, sat at the sage''s feet, and begging his pardon again and again, said:

    '
5.10.19:
  dutt: '5.10'
  text: 'I am bent upon questioning thee as to what can we resort in this world, considering thee as my spiritual guide, who art the lord of asceticism, the foremost of those sages, who are conversant with the knowledge of self and who art the very incarnation of the knowledge of Hari.

    '
  modern: 'I want to ask you what we should hold to in this world. I take you as my spiritual guide, the lord of asceticism, the first of the sages who know the self, and the very incarnation of the knowledge of Hari.

    '
5.10.20:
  dutt: '5.10'
  text: 'Forsooth, thou art what I have described thee to be — thou art travelling with thy marks hidden to study the people; how can one, of vicious understanding attached to the world, perceive the course of the lords of asceticism?

    '
  modern: 'Surely you are what I have said you are. You travel with your marks hidden, to study the people. How can one of poor understanding, tied to the world, see the way of the lords of yoga?

    '
5.10.24:
  dutt: '5.10'
  text: 'Being inflated with the pride of being a king I have insulted a pious sage like thee— do thou so favour me so that I may be released off the sin consequent upon insulting the pious.

    '
  modern: 'Puffed up with the pride of being king, I insulted a holy sage like you. Be gracious to me, so that I may be freed from the sin of insulting the holy.

    '
5.11.15:
  dutt: '5.11'
  text: 'O king, a person gropes in the world so long he is not acquainted with the true knowledge of self, having renounced illusion by virtue of knowlegde, disassociated himself from the world, and conquered six passions.

    '
  modern: 'King, a man gropes through the world as long as he does not know the true knowledge of the self. He must give up illusion through knowledge, free himself from the world, and conquer the six passions.

    '
5.11.16:
  dutt: '5.11'
  text: 'As long as he does not consider mind as the root of selfishness and worldly miseries, for it being endued with diseases sorrow, foolishness, avarice, anger and enmity, creates attachment (so long he is not freed from the world).

    '
  modern: 'As long as a man does not see the mind as the root of selfishness and of the miseries of the world, he is not freed from the world. The mind is full of disease, sorrow, folly, greed, anger, and enmity, and it creates attachment.

    '
5.11.17:
  dutt: '5.11'
  text: 'Therefore being vigilant, do thou, with the sword of the service of the feet of thy own preceptor Hari, slay this mind, an enemy which if neglected will grow powerful and though not itself real, is capable of overclouding the soul.

    '
  modern: 'So be watchful. With the sword of serving the feet of your teacher and of Hari, slay this mind. If you neglect it, it grows strong. It is not real in itself, but it can cloud the self.

    '
5.12.5:
  dutt: '5.12'
  text: 'O king, the worldly change acting in this earth for some reasons is known as this man (who carries) who has footjoints, knee-joints, thighs, middlepart, breast, neck and shoulders.

    '
  modern: 'King, the man who carries your palanquin is one of the changing things of this world. He has ankles, knees, thighs, waist, chest, neck, and shoulders.

    '
5.12.6:
  dutt: '5.12'
  text: 'There is no bodied being in the vehicle — the king of Sauvira is merely a name of the worldly metamorphosis — and having thy egoism being fixed thereto thou art blinded with the pride that thou art the king.

    '
  modern: 'There is no living being in the palanquin. "King of Sauvīra" is only a name for a change in the world. Your ego is fixed on it, and you are blinded by the pride that you are a king.

    '
5.12.7:
  dutt: '5.12'
  text: 'Those poor people, who have been subject to miseries, should be pitied — having brought them by force thou art torturing them — thy pride "I am the protector of people" is vain; thou art wicked and canst not grace the assembly of the great.

    '
  modern: 'Those poor people, who suffer, deserve pity. You force them to work, and you torture them. Your pride in saying "I protect the people" is empty. You are cruel, and you do not grace the assembly of the great.

    '
5.12.12:
  dutt: '5.12'
  text: 'O Rahugana, without bathing in the dust of the feet of the great, (this cannot be acquired) by devout austerities, Vaidika ceremonies, distribution of food, doing good unto others, or by adoring water, fire, and the sun.

    '
  modern: 'O Rahūgaṇa, without bathing in the dust of the feet of the great, no one gains this by austerity, by Vedic rites, by giving food, by doing good to others, or by worshipping water, fire and the sun.

    '
5.12.16:
  dutt: '5.12'
  text: 'Therefore, having their delusions slain by the dagger of knowledge obtained by association with the disassociated great men, having acquired recollection, by chanting and listening to (his glories) and having got over the way of the world, (people) attain to Hari.

    '
  modern: 'So people cut down their delusion with the dagger of knowledge gained in the company of great men free from attachment. By singing and hearing of his glories they come to remember him, and having crossed the road of the world, they reach Hari.

    '
5.13.20:
  dutt: '5.13'
  text: 'Rahugana, thou hast also been placed on this road and therefore renouncing thy own kingdom do thou make friends with all creatures and having thy mind withdrawn from worldly objects and by means of the dagger of knowledge sharpened by the service of Hari do thou go to the other end of the way of the world.

    '
  modern: 'Rahūgaṇa, you too are on this road. So give up your kingdom and make friends with all creatures. Turn your mind away from worldly things. With the knife of knowledge, sharpened by serving Hari, cross to the far end of the way of the world.

    '
5.13.24:
  dutt: '5.13'
  text: 'Suka said : — Though he was insulted by Rahugana, the king of Sindhu, the Brahmana saint, the high-souled Bharata, out of compassion, instructed him in the knowledge of true self; and (Rahugana) saluting his feet was filled with delight like an overflowing ocean but his heart was always satisfied; and he like before began to journey the world.

    '
  modern: 'Though Rahūgaṇa, king of Sindhu, had insulted him, the Brahmin, the high-souled Bharata, out of pity, taught him the knowledge of the true self. Rahūgaṇa bowed at his feet, full of joy like an overflowing sea. His heart was at rest, and he went on travelling the world as before.

    '
5.13.25:
  dutt: '5.13'
  text: 'Acquiring the true and great knowledge from Bharata, the king of Sauvira, renounced immediately all selfish considerations for the body.

    '
  modern: 'Taking the true and great knowledge from Bharata, the king of Sauvīra at once gave up all selfish thoughts about his body.

    '
6.1.9:
  dutt: '6.1'
  text: 'It is seen that the sinful are punished by the king and heard (that one goes to hell) that sin brings on evil to one''s own self, a person, being careless as soon as the penance is over, again perpetrates an iniquity.

    '
  modern: 'We see the sinful punished by the king, and we hear that sin brings evil on the sinner. Yet a man, careless once his penance is done, sins again.

    '
6.1.11:
  dutt: '6.1'
  text: 'Sin is not expiated by penances; an ignorant person goes through this penance; but the best is the discriminative knowledge.

    '
  modern: 'Sin is not wiped out by penance. An ignorant man goes through the penance, but the best cure is discriminating knowledge.

    '
6.1.12:
  dutt: '6.1'
  text: 'As diseases become gradually incapable of subduing a person who takes regular meals so a person observant of rules gradually acquires true knowledge.

    '
  modern: 'As sickness cannot overcome a man who eats wholesome food, so a man who keeps the rules gradually gains true knowledge.

    '
6.1.15:
  dutt: '6.1'
  text: 'Like unto the rays of the sun destroying the dew drops, the pious sages devoted unto Vasudeva by virtue of their heart-felt devotion completely root out their sins.

    '
  modern: 'As the sun''s rays burn away the dew, the pious sages who are devoted to Vāsudeva, with their whole heart, root out their sins completely.

    '
6.1.18:
  dutt: '6.1'
  text: 'As the rivers cannot purify a vessel of wine, so the mighty penances cannot purify them who are opposed to Narayana.

    '
  modern: 'As rivers cannot purify a wine jar, so great penances cannot purify those who turn away from Nārāyaṇa.

    '
6.1.20:
  dutt: '6.1'
  text: 'In connection with this the wise relate a history based on the conversation between the emissary of Vishnu and that of Yama; I shall relate this unto thee.

    '
  modern: 'On this point the wise tell an old story, a talk between the servant of Viṣṇu and the servant of Yama. I will tell it to you.

    '
6.1.21:
  dutt: '6.1'
  text: 'In the province of Kanyakuvja a Brahmana, by the name of Ajamila, took a female servant as wife — so being contaminated by continually living with her all his pious rites were destroyed.

    '
  modern: 'In the land of Kanyākubja there was a Brahmin named Ajāmila. He took a female servant as his wife, and by living with her he lost all his pious rites.

    '
6.1.22:
  dutt: '6.1'
  text: 'Being always impure and resorting to foul means as by game of dice, cheating and stealing, he used to maintain his relations; so people always suffered from him.

    '
  modern: 'He was always impure. He lived by foul means, such as gambling, cheating, and stealing, to support his family, and people suffered because of him.

    '
6.1.25:
  dutt: '6.1'
  text: 'Having his mind bound to that sweet-speeched boy he used to derive great pleasure in witnessing his sports.

    '
  modern: 'His mind was tied to that sweet-speaking boy. He took great delight in watching the boy at play.

    '
6.1.27:
  dutt: '6.1'
  text: '… thus pleased in his life-time, he even at the time of his death, fixed his mind on his youngest son named Narayana.

    '
  modern: 'He lived pleased with his life, and even at his death he fixed his mind on his youngest son, named Nārāyaṇa.

    '
6.1.28:
  dutt: '6.1'
  text: 'He beheld three persons, dreadful, with noose in their hands and having grim-visaged countenances and erect down, approaching to take him away.

    '
  modern: 'He saw three dreadful men coming to take him away. They had nooses in their hands, grim faces, and bristling hair.

    '
6.1.29:
  dutt: '6.1'
  text: 'Having his senses agitated and with loud and choked voice he called his son by the name of Narayana who was playing at a distance.

    '
  modern: 'His senses in turmoil, he called out in a loud, choked voice to his son Nārāyaṇa, who was playing far away.

    '
6.1.31:
  dutt: '6.1'
  text: '… beholding the emissaries of Yama taking out the soul from the heart of Ajamila, the husband of the female servant, Vishnu''s emissaries prevented by force.

    '
  modern: 'When Viṣṇu''s servants saw Yama''s servants pulling the soul out of Ajāmila''s heart, they stopped them by force.

    '
6.1.32:
  dutt: '6.1'
  text: 'Being thus prevented the followers of Yama said : — "Who are ye that stand in the way of Yama''s behests? Whose followers are you? Whence have you come? Why do you prevent us (from taking him away)?"

    '
  modern: 'Stopped in this way, Yama''s servants said, "Who are you, to stand in the way of Yama''s orders? Whose servants are you? Where have you come from? Why do you stop us from taking him?"

    '
6.1.40:
  dutt: '6.1'
  text: 'Whatever is laid down in the Vedas constitutes virtue, and whatever is opposed to it is vice; it is heard, the Veda is identical with Narayana and self-sprung.

    '
  modern: 'What the Vedas lay down is dharma, and what runs against them is adharma. We have heard that the Veda is Nārāyaṇa himself, self-born.

    '
6.1.43:
  dutt: '6.1'
  text: 'Thus vice is also found out where punishment should be administered; all persons engaged in actions deserve punishment according to their iniquity.

    '
  modern: 'So adharma is known, and the place of punishment is fixed by it. Everyone who acts deserves punishment in proportion to his wrong.

    '
6.1.56:
  dutt: '6.1'
  text: 'This one (at the first part of his life) was versed in the Vedas, meek, of excellent character, of approved ways, vow-observing, mild, of controlled sense truthful, learned in the Mantras, pure of spirit.

    '
  modern: 'In the first part of his life he knew the Vedas. He was meek, of good character and good conduct, true to his vows, gentle, self-controlled, truthful, learned in the mantras, and pure in spirit.

    '
6.1.58:
  dutt: '6.1'
  text: 'Once on a time for carrying the wishes of his father, Ajamila went to the woods; and came back after having procured fruits, flowers, Kusa and sacrificial fuel.

    '
  modern: 'Once, to do what his father asked, Ajāmila went to the forest. He came back with fruit, flowers, kuśa grass, and fuel for the sacrifice.

    '
6.1.59:
  dutt: '6.1'
  text: 'And it came to pass that while on the way he saw a lascivious Sudra carrying on sexual intercourse with his female slave worthy of being enjoyed. The eyes of the girl were red from drink and she was under the influence of liquor.

    '
  modern: 'On the way he saw a lustful Śūdra with a female slave who was ready for his pleasure. Her eyes were red from drink, and she was drunk.

    '
6.1.60:
  dutt: '6.1'
  text: 'The Nivi (cloth) on her person was dropping down. Renouncing the prescribed path, the lusty Sudra, banishing shame, even in the presence of the Brahmana, met her with embraces, sang and flirted with her, and indulged in various acts of dalliance.

    '
  modern: 'Her garment was slipping down. The lustful Śūdra gave up the right path and, with no shame before the Brahmin, embraced her, sang, flirted, and played with her.

    '
6.1.63:
  dutt: '6.1'
  text: 'Making the female slave its cue some malign planet had possessed him in the shape of Kandarpa, consequently his memory was erased; and continually contemplating her, he abandoned his own religion.

    '
  modern: 'Using the slave girl as an excuse, Love (Kandarpa) took hold of him, as if by some bad planet. His memory was wiped out. He kept thinking of her, and he gave up his own dharma.

    '
6.1.64:
  dutt: '6.1'
  text: 'And he began to ingratiate himself into her grace by lavishing on her all his paternal wealth and various products of his village.

    '
  modern: 'He set about winning her favour by spending on her all his inherited wealth and the goods of his village.

    '
6.1.65:
  dutt: '6.1'
  text: 'And pierced with the glances of the harlot, the wretch speedily forsook his wedded wife, a Vipra, youthful and born in a noble line.

    '
  modern: 'Pierced by the harlot''s glances, the wretch soon left his wife, a young Brahmin woman from a noble family.

    '
6.1.66:
  dutt: '6.1'
  text: 'And this one of perverse sense maintained the kinsmen of the slave with wealth obtained anywhere by means fair or foul.

    '
  modern: 'And this man of twisted mind kept the slave woman''s family with wealth he got wherever he could, by fair means or foul.

    '
6.1.67:
  dutt: '6.1'
  text: 'And whereas, passing by scripture, that impure one followed his own way, his life, in consequence of his having for a long time taken the rice (of the harlot) grew sinful.

    '
  modern: 'He passed over the scriptures and went his own way. Because for a long time he ate the harlot''s food, that impure man''s life became sinful.

    '
6.1.68:
  dutt: '6.1'
  text: 'Therefore I shall take before the wielder of the rod this sinful wretch, who hath not expiated his sins by any rites; and there he will be purged of his iniquity by means of punishment.

    '
  modern: 'So I will take this sinful wretch, who has not atoned for his sins with any rite, before the holder of the staff. There he will be cleansed of his wrong by punishment.

    '
6.2.7:
  dutt: '6.2'
  text: 'This Ajamila has, verily, made attonement for all his sins even of crores of births as he has, though bereft of all control, sent forth the name of Hari which brings in the highest spiritual bliss …

    '
  modern: 'This Ajāmila has truly atoned for all his sins, even those of millions of births, because, though he had no control over himself, he spoke the name of Hari, which brings the highest spiritual bliss.

    '
6.2.10:
  dutt: '6.2'
  text: 'To pronounce the name of Vishnu which makes the utterer an object of his care (or which makes Vishnu the object of the utterer''s thought) is the best of expiation for sinners … and all other criminals.

    '
  modern: 'For every sinner, the best atonement is to speak the name of Viṣṇu. It makes the speaker the object of Viṣṇu''s care, or it makes Viṣṇu the object of his thought.

    '
6.2.14:
  dutt: '6.2'
  text: 'They say that surely the uttering of the name of Vaikuntha either meaning another person, or in joke and derision, or in a song or in neglect, destroys all sins without a remainder.

    '
  modern: 'They say that uttering the name of Vaikuṇṭha destroys all sins completely, whether one means another person by it, or says it in jest or mockery, in a song, or carelessly.

    '
6.2.18:
  dutt: '6.2'
  text: 'The name of the One untouched by vice or sorrow (God), when fully uttered consciously or unconsciously burns down men''s sin just as fire burns fuel, …

    '
  modern: 'The name of the One untouched by sin or sorrow, when it is fully spoken, knowingly or unknowingly, burns up a man''s sin as fire burns fuel.

    '
6.2.19:
  dutt: '6.2'
  text: '… even as a very strong medicine when taken though without knowledge, or even as a holy recitation when uttered, manifests its own effects of its own accord.

    '
  modern: 'Even as a strong medicine works when taken without knowing it, or a holy chant works when it is spoken, the name works of its own accord.

    '
6.2.21:
  dutt: '6.2'
  text: 'The messengers of Yama, O conqueror of enemies, being thus driven away, went to Yama, and related to the king of the Lower World, everything in detail.

    '
  modern: 'So Yama''s servants were turned back. They went to Yama, the king of the underworld, and told him everything in detail.

    '
6.2.25:
  dutt: '6.2'
  text: 'After this, Ajamila … soon became faithful in Bhagavat, because of his hearing the sublimeness of Hari. His remorse was greatly excited by the recollection of his own guilt.

    '
  modern: 'After this, Ajāmila soon became a devotee of the Lord, because he had heard of the greatness of Hari. As he remembered his own guilt, his remorse grew great.

    '
6.2.26:
  dutt: '6.2'
  text: 'O! how great a misfortune has befallen me, that I being unable to control my passions, and being created anew in a Vrishali (I having begotten sons of her) have spoiled Brahmanism.

    '
  modern: 'Oh, what a great misfortune has come on me! I could not control my passions. I have begotten sons on a low-caste woman, and so I have spoiled my Brahminhood.

    '
6.2.27:
  dutt: '6.2'
  text: 'Oh Fie! Fie! I am hated by the good, I have done wicked deeds, as I have abandoned my virtuous young wife, and have embraced an unchaste tippling woman.

    '
  modern: 'Shame on me! The good hate me. I have done wicked deeds. I left my good young wife and took up with an unchaste woman who drinks.

    '
6.2.28:
  dutt: '6.2'
  text: 'Oh! I, like an ungrateful low degraded creature, have now forsaken my old, unprotected, friendless, and sorely distressed, parents.

    '
  modern: 'Oh, I have acted like an ungrateful, low, fallen creature. I have left my old, unprotected, friendless, and suffering parents.

    '
6.3.3:
  dutt: '6.3'
  text: 'The messengers of Yama, being defeated, in their attempt to take away Ajamila, by the servants of Bhagavat, related all to Yama, the lord of Sanyamant.

    '
  modern: 'Yama''s servants, beaten in their effort to take Ajāmila, were defeated by the servants of the Lord. They told Yama, the lord of Saṃyamanī, all of it.

    '
6.3.4:
  dutt: '6.3'
  text: 'O Lord, how many rulers of the human world, are there? How many are the causes that bring forth the fruits of deeds done in three different ways ie. physically, orally and mentally?

    '
  modern: '"O Lord, how many rulers are there in the human world? How many causes bring forth the fruit of deeds done in the three ways, by body, speech, and mind?"

    '
6.3.12:
  dutt: '6.3'
  text: 'There is one ulterior to me, in whom the universe is woven like warpwoof in a piece of cloth; from whose parts the creation, continuation, and annihilation, of this universe are effected; under whose control this world is like a draft-ox, with a string passing though its perforated nose;

    '
  modern: 'There is one beyond me. The universe is woven in him like warp and weft in a cloth. The creation, the keeping and the ending of this universe come from his parts. Under his control the world is like an ox with a rope through its nose.

    '
6.3.13:
  dutt: '6.3'
  text: '… who fastens people, by means of names, froms &c., to his own word, as one fastens cows by means of small strings, to a thick rope. To whom these people awfully offer sacrifice, bound as they, are in the knot of names and deeds.

    '
  modern: 'By names and forms he ties people to his word, as one ties cows with small cords to a thick rope. To him these people, bound in the knot of names and deeds, bring offerings in fear.

    '
6.3.18:
  dutt: '6.3'
  text: '… These servants of Vishnu are worshipped by gods; they are miraculous beings -it is ddficult for one to look at their insignia. They protect, the mortals who are faithful to Vishnu, from me, from enemies and rom everything else.

    '
  modern: 'The gods worship these servants of Viṣṇu. They are wondrous beings, and their marks are hard to see. They guard mortals who are faithful to Viṣṇu, from me, from enemies, and from everything else.

    '
6.3.29:
  dutt: '6.3'
  text: 'Bring those dishonest persons, who do not perform the ceremonials connected with Bhagavata — whose tongue does not even once utter the name or attributes of Bhagavat — whose mind does not even once remember His lotus-feet — whose head is never once inclined to Krishna.

    '
  modern: 'Bring me those dishonest people, who do not perform the rites of the Bhāgavata, whose tongue never once speaks the name or the qualities of the Lord, whose mind never once remembers his lotus feet, and whose head never once bows to Kṛṣṇa.

    '
6.7.2:
  dutt: '6.7'
  text: '… O king, straying from the path of virtue by the maddening influence of the wealth of three worlds, and being surrounded by Maruts, Vasus, Rudras, Adityas, Rivus, … Indra was seated on a resplendent throne in the midst of the assembly.

    '
  modern: 'O king, Indra had strayed from the path of virtue, maddened by the wealth of the three worlds. Surrounded by the Maruts, Vasus, Rudras, Ādityas and Ṛbhus, he sat on a shining throne in the middle of the assembly.

    '
6.7.7:
  dutt: '6.7'
  text: 'When came in his supreme spiritual preceptor, of the gods as well, he (Indra) did not salute him by rising from the throne.

    '
  modern: 'When his supreme spiritual teacher, the teacher of the gods, came in, Indra did not rise from his seat to greet him.

    '
6.7.8:
  dutt: '6.7'
  text: 'Though he saw Vachaspathi, a Muni of superior order, whom the gods as well as the Asuras respectfully salute, come to the assembly, Indra did not stir from the throne.

    '
  modern: 'Indra saw Vācaspati, the sage of high rank whom gods and Asuras both honour, come into the assembly. Still Indra did not stir from his throne.

    '
6.7.9:
  dutt: '6.7'
  text: 'The powerful, wise Angirasa abruptly left the court, and conscious of the intoxication from wealth (in Indra) silently repaired to his own home.

    '
  modern: 'The wise and powerful son of Aṅgiras left the court at once. He knew Indra was drunk on his wealth, and he went home in silence.

    '
6.7.21:
  dutt: '6.7'
  text: 'Alas, O gods! what great wrong have you perpetrated, that you have not saluted the impassionate Brahmin, who is imbued in the Brahma, on account of your wealth.

    '
  modern: 'Alas, gods! What great wrong you have done, in that you did not honour the calm Brahmin who is steeped in Brahman, because of your wealth.

    '
6.7.39:
  dutt: '6.7'
  text: 'Although the prosperity of the enemies of gods, was being protected by the Mantra given by Ushanasha, the powerful Vishwarupa taking possession (of the said Mantra) by means of that imparted by Vishnu, gave it over to Mahendra.

    '
  modern: 'The Asuras'' wealth was guarded by the spell that Uśanas had given them. But the mighty Viśvarūpa took that spell, by means of the spell taught by Viṣṇu, and gave it to Mahendra.

    '
6.9.1:
  dutt: '6.9'
  text: 'I have heard that the said Vishwarupa had three heads, (one) to drink the Soma, (the other) to drink wines, and (the third) to take rice.

    '
  modern: 'I have heard that Viśvarūpa had three heads: one drank soma, one drank wine, and one ate food.

    '
6.9.19:
  dutt: '6.9'
  text: 'The most excellent Gods with all their followers, pursued him and darted at him their own divine weapons; (but) the said (Vritra) devoured the weapons, every one of them.

    '
  modern: 'The best of the gods, with all their troops, attacked him and shot their divine weapons at him. But he swallowed every one of those weapons.

    '
6.9.20:
  dutt: '6.9'
  text: 'Then all the Gods whose power was clouded, became sad and astonished; (and) began to pray to the Omniscient First Cause with purity and concentration.

    '
  modern: 'Then all the gods, their power swallowed, grew sad and amazed. With pure and steady minds they began to pray to the all-knowing First Cause.

    '
6.9.47:
  dutt: '6.9'
  text: 'Oh the best of Gods! I am pleased with you. That knowledge of men which is mingled with my praise, will (constantly) put them in mind of the nothingness of this world (and its enjoyment); and which (will foster their) devotion to me.

    '
  modern: 'Best of gods, I am pleased with you. The knowledge that is joined with praise of me will keep reminding people of the emptiness of this world and its pleasures, and it will foster their devotion to me.

    '
6.10.2:
  dutt: '6.10'
  text: 'Oh Bharata! the great Rishi (Dadhyan) who was well versed in Atharvan Veda being thus asked for by the Gods, was highly gratified and said with smile, as it were, as follows.

    '
  modern: 'O Bhārata, when the gods asked this of him, the great sage Dadhyañc, who knew the Atharvan Veda, was very pleased, and he spoke as if smiling:

    '
6.10.8:
  dutt: '6.10'
  text: 'Oh Lords! the man (who) does not (attempt) to earn praise and Dharma by kindness unto creatures by (the sacrifice of) this perishable body, is pitied even by the immovable (inorganic) bodies.

    '
  modern: 'A man who does not win praise or dharma by kindness to creatures, by giving up this short-lived body, is pitied even by the things that do not move.

    '
6.10.11:
  dutt: '6.10'
  text: 'Dadhyan who was well-versed in the Atharvan Veda, having thus made up his mind, focussed his soul into the ultimate, excellent Brahma and gave up his body (to the gods.)

    '
  modern: 'Having made up his mind in this way, Dadhyañc, the sage of the Atharvans, fixed his self on the highest, supreme Brahman and gave up his body.

    '
6.10.16:
  dutt: '6.10'
  text: 'Then, in the first part of the Yuga (known as Treta) there took place, on the banks of the Narmada, a fierce battle between the gods and the Asuras.

    '
  modern: 'Then, at the start of the age called Tretā, a fierce battle took place between the gods and the Asuras on the banks of the Narmadā.

    '
6.10.28:
  dutt: '6.10'
  text: 'The repeated and various attempts (to injure) the gods who were being favoured by Krishna, became as ineffectual as the harsh and unpleasant words of the low (are) towards the noble.

    '
  modern: 'Their many attempts to harm the gods, whom Kṛṣṇa favoured, failed, as the harsh, rude words of low people fail against the noble.

    '
6.10.29:
  dutt: '6.10'
  text: '(The Asuras) who were not devoted to Hari, whose patience was taken possession of (by the Gods), whose pride was humbled in the battle, began to think of deserting their leader in the thick of battle (when they) found (their) attempts ineffectual.

    '
  modern: 'The Asuras were not devoted to Hari. Their endurance was broken and their pride in battle humbled. When they saw that their attempts had failed, they began to think of leaving their leader in the thick of the fight.

    '
6.10.30:
  dutt: '6.10'
  text: 'The (great) warrior, wise Vritra, finding his followers, the said (Asuras) flying away and (finding) his army which became dispersed in great panic, said smiling in the following (strain).

    '
  modern: 'The great and wise warrior Vṛtra saw his followers running away and his army scattered in great panic. Smiling, he spoke as follows.

    '
6.10.32:
  dutt: '6.10'
  text: 'It is immutable that the created have destruction. There is, in this world, no violation of that. Therefore who is there not to admit that, death is (desirable) which secures both heaven and praise?

    '
  modern: 'It is certain that what is born must die. In this world there is no escape from that. So who would not grant that a death which wins both heaven and fame is to be desired?

    '
6.11.1:
  dutt: '6.11'
  text: 'O king! terrified they took to their heels, without accepting the equitable words of their lord.

    '
  modern: 'O king, in terror they ran away and did not heed the just words of their lord.

    '
6.11.13:
  dutt: '6.11'
  text: 'O illustrious monarch! Vritra seeing his adversary the thunder-armed (Indra) staying with the intent of battle and remembering the arch act of cruelty perpetrated by him (Indra), was overcome by grief and affliction, and spoke with a laugh.

    '
  modern: 'O great king, Vṛtra saw his enemy, Indra of the thunderbolt, standing ready for battle. He remembered the cruel deed Indra had done, and, overcome by grief and confusion, he spoke with a laugh.

    '
6.11.14:
  dutt: '6.11'
  text: 'By good fortune it is, that thou my enemy, who hast killed Brahmanas, murdered thine own preceptor and (treacherously) put an end to my brother''s life, art now before me. O vilest of wretches! by good luck it is that I shall set myself free from the debt (I owe to my brother) through thee, whose stony heart, ere now shall be cleft asunder with the stroke of my trident.

    '
  modern: 'By good fortune you are before me now, my enemy, who killed Brahmins, murdered your own teacher and treacherously ended my brother''s life. Vilest of wretches, by good luck I will pay my debt to my brother through you, for soon my trident will split your stony heart.

    '
6.11.19:
  dutt: '6.11'
  text: 'Lord of the celestials! how is it that thou dost not hurl thy unfailing thunder-bolt at me, thine enemy standing proudly before thee? Do not doubt that thy thunder-bolt would be equally unavailing like thy club even as one is that asks for alms of a niggard.

    '
  modern: 'Lord of the gods, why do you not hurl your unfailing thunderbolt at me, your enemy standing proudly before you? Do not doubt that your thunderbolt will be as useless as your club, like a beggar asking alms of a miser.

    '
6.12.2:
  dutt: '6.12'
  text: 'Then the heroic Vritra, whirling with great energy the trident, the points of which were terrible like the tongues of flames of the world-devouring fire, threw it vehemently at Mahendra, crying out in wrath, "thou art killed, O wretch."

    '
  modern: 'Then Vṛtra, the hero, whirled his trident with great force. Its points were as terrible as the tongues of the fire that ends the world. He hurled it at Mahendra, shouting in anger, "You are dead, wretch!"

    '
6.12.4:
  dutt: '6.12'
  text: 'On one of his hands being chopped off, Vritra enraged caught a bludgeon, and with it, struck the thunder-armed Indra and his carrier on their temples. Thereat the thunderbolt flew off and fell down from the hands of Maghavan (Indra).

    '
  modern: 'With one of his hands cut off, Vṛtra, in rage, took up a club and struck Indra and his elephant on the temples. Then the thunderbolt flew from Maghavan''s hand and fell.

    '
6.12.6:
  dutt: '6.12'
  text: 'He (Indra) did not from shame again take up the thunderbolt, which had escaped from his hands before his enemy. Vritra addressed him saying:— O Hari take up thy thunderbolt and kill thine enemy with it - it is no time for grief.

    '
  modern: 'Ashamed, Indra did not take up again the thunderbolt that had fallen from his hand before his enemy. Vṛtra spoke to him: "Hari, take up your thunderbolt and kill your enemy. This is no time for grief."

    '
6.12.8:
  dutt: '6.12'
  text: '… a net, these worlds with their (respective) rulers are performing their functions paralysed as it were.

    '
  modern: 'Like birds caught in a net, these worlds with their rulers breathe under Time''s control. Time is the cause here.

    '
6.12.9:
  dutt: '6.12'
  text: 'It is a matter of marvel that a person should think his inert self as the cause, ignoring him (to be so) who alone is prowess, courage, energy, life, ambrosia, and death.

    '
  modern: 'It is strange that a man thinks his dull self is the cause, and ignores the One who is strength, courage, energy, life, the nectar, and death.

    '
6.12.13:
  dutt: '6.12'
  text: 'It is during the season of victory that persons attain to long life, fortune, fame, prosperity and benediction. But even then, if they are unwilling (to have them), they change themselves into their reverses.

    '
  modern: 'Long life, fortune, fame, wealth, and blessings come to a person in his time of victory. Yet even then, if they are not wanted, they turn into their opposites.

    '
6.12.14:
  dutt: '6.12'
  text: 'Therefore one ought to equally sustain fame shame, victory, defeat, prosperity, adversity, life and death.

    '
  modern: 'So one should be even-minded toward fame and shame, victory and defeat, joy and sorrow, death and life.

    '
6.12.19:
  dutt: '6.12'
  text: 'Oh Danava, thou art indeed emancipated; thy understanding has grown so very refined. Thou art devoted heart and soul to the omnipresent friendly lord of the worlds.

    '
  modern: 'Danava, you are truly free. Your understanding has become very fine. You are devoted with all your heart and self to the all-pervading, friendly lord of the worlds.

    '
6.12.20:
  dutt: '6.12'
  text: 'Thou hast tided over that most infatuating illusion, known as Vaishnavi Maya; for relinquishing the (gross) nature of Asuras, thou hast attained to the nature …

    '
  modern: 'You have crossed over the deluding illusion called Vaiṣṇavī Māyā, for you gave up the coarse nature of the Asuras and reached the nature …

    '
6.12.32:
  dutt: '6.12'
  text: 'Then the mighty Indra having ript open the sides of Vritra came out, and with his might cut off the head of his enemy resembling the summit of a mountain.

    '
  modern: 'Then mighty Indra tore open Vṛtra''s sides and came out. With his might he cut off his enemy''s head, which was like a mountain peak.

    '
6.12.35:
  dutt: '6.12'
  text: 'O Subduer of enemies! even then before the very eyes of the wondering deities did the Supreme spirit of Vritra issue forth from his corpse and was merged in the Being that transcends the universe.

    '
  modern: 'Even then, before the eyes of the amazed gods, Vṛtra''s spirit left his body and merged into the Being who is beyond the universe.

    '
6.13.20:
  dutt: '6.13'
  text: 'The heavy weight of his sins which arose from his murder of Vritra, melted away even like mist before the sun.

    '
  modern: 'The heavy weight of the sin that came from killing Vṛtra melted away like mist before the sun.

    '
7.1.26:
  dutt: 7.1.26
  text: 'It is my firm belief, that mortals do not so easily attain an absorption in Him, by means of devoted attachment, as they do, by the bitterest enmity.

    '
  modern: 'I firmly believe that people do not reach absorption in him so easily by loving devotion as by the bitterest enmity.

    '
7.1.28:
  dutt: 7.1.28
  text: 'Thus those people, who meditate on the great God Krishna, Who assumed human form through His illusive power, taking Him as their bitter adversary, very soon attain to Him, having, In the first instance, been purged of all their impiety.

    '
  modern: 'In the same way, those who meditate on the great God Kṛṣṇa, who took human form through his illusion, and who take him as a bitter enemy, soon reach him. First their sins are washed away.

    '
7.1.29:
  dutt: 7.1.29
  text: 'By reverentially concentrating their minds on Him, through fear,-affection, love or hate, many have attained unto his mode of existence, after having been purified of all impiety springing out of these.

    '
  modern: 'Many people have fixed their minds on him with reverence, through fear, affection, love, or hatred. Purified of the sin that these feelings bring, they have reached his state.

    '
7.1.39:
  dutt: 7.1.39
  text: 'Then these two were born as the two sons of Diti, and were honoured by both the Daityas and Danavas.

    '
  modern: 'Then these two were born as the two sons of Diti. The Daityas and Danavas honored them.

    '
7.1.40:
  dutt: 7.1.40
  text: 'Hiranyakasipu was killed by Hari, in the form of a lion; so also was Hiranyaksha, when in the form of a boar, Hari was engaged in lifting up the Earth.

    '
  modern: 'Hari killed Hiraṇyakaśipu in the form of a lion. He killed Hiranyaksha in the form of a boar, when he lifted up the Earth.

    '
7.2.1:
  dutt: 7.2.1
  text: 'When his brother had been thus slain by Hari in the form of a boar, Hiranyakasipu was greatly agitated with wrath and grief.

    '
  modern: 'When Hari killed his brother in the form of a boar, Hiraṇyakaśipu was filled with rage and grief.

    '
7.2.2:
  dutt: 7.2.2
  text: 'Full of wrath and biting his lips, he said, with his eyes sparkling with rage looking at the sky, which seemed to be dim and hazy.

    '
  modern: 'Full of wrath, he bit his lips. His eyes blazed as he looked at the hazy sky, and he spoke.

    '
7.2.12:
  dutt: 7.2.12
  text: '… Repair to those regions and with fire and sword, devastate the places, where you shall find the twice-born ones, the sacred kine, the Vedas and the performance of religious ceremonies by the different sects in their respective mode of existence.

    '
  modern: '… Go to those regions. With fire and sword, lay waste the places where you find the twice-born, the sacred cows, the Vedas, and the rites of each caste and stage of life.

    '
7.3.1:
  dutt: 7.3.1
  text: 'Hiranyakasipu wanted to make himself, invincible, immortal, ever youthful, unrivalled and the sole ruler of the worlds.

    '
  modern: 'Hiraṇyakaśipu wanted to make himself invincible, immortal, ever young, without a rival, and the sole ruler of the worlds.

    '
7.3.2:
  dutt: 7.3.2
  text: '… he with his arms up-lifted and eyes turned towards the sky, began to perform severe religious austerities, in the caves of the Mandara mountains, standing on the tips of his toes.

    '
  modern: '… He raised his arms, fixed his eyes on the sky, and began harsh penances in the caves of Mount Mandara. He stood on the tips of his toes.

    '
7.3.3:
  dutt: 7.3.3
  text: 'He, with the halo of his matted-locks, shone like the sun with his rays, at the time of the universal annihilation. On his entering upon his religious austerities, the celestials occupied their former abode.

    '
  modern: 'His matted hair shone like the sun at the end of the world. When he began his penances, the gods went back to their own abodes.

    '
7.3.16:
  dutt: 7.3.16
  text: 'After a while Hansavahana (Brahma) astonished on seeing him distress the worlds, with his religious austerities, like the sun hid under clouds, addressed him laughing.

    '
  modern: 'After a while Brahmā, who rides a swan, saw him scorch the worlds with his penances, like the sun hidden by clouds. Brahmā was astonished, and he spoke to him, smiling.

    '
7.3.17:
  dutt: 7.3.17
  speaker: 'The auspicious Brahma said:'
  text: 'Arise, arise, O Kasyapa! good betide you! you have succeeded in your austerities. I have come to confer on you, any boon that you may ask, any boon that you may like.

    '
  modern: 'Rise, rise, O son of Kashyapa! May good come to you. You have succeeded in your penances. I have come to give you any boon you ask, any boon you like.

    '
7.3.35:
  dutt: 7.3.35
  text: 'O excellent bestower of boons ! if thou be willing to bestow on me my cherished desire, then, O lord, let not my death come from any being of thy creation.

    '
  modern: 'O best of givers of boons, if you will grant the wish I hold dear, then, O lord, let my death not come from any being you have created.

    '
7.3.36:
  dutt: 7.3.36
  text: 'Let me not die indoors or out of doors ; during night or at day time by the hand of other beings (out of thy creation) ; by means of weapons ; on earth or in the skies. Let me not be killed by men, or animals, …

    '
  modern: 'Let me not die indoors or outdoors, by night or by day, by the hand of any being you made, by any weapon, on earth or in the sky. Let me not be killed by men or by animals, …

    '
7.3.37:
  dutt: 7.3.37
  text: '… by animate or inanimate beings, by the celestials, Asuras or great reptiles. Grant me also matchless might in battle, undisputed lordship over corporeal beings, …

    '
  modern: '… by living or lifeless beings, by gods, demons, or great serpents. Grant me matchless might in battle and sole lordship over all embodied beings, …

    '
7.3.38:
  dutt: 7.3.38
  text: '… the glory of all the guardians of the world also everything thou possessest, and all those undecaying luxuries, enjoyed by those, having asceticism as their source of power.

    '
  modern: '… the glory of all the guardians of the world, everything you possess, and the undying pleasures enjoyed by those whose power comes from asceticism.

    '
7.4.1:
  dutt: 7.4.1
  speaker: 'The auspicious Narada said:'
  text: 'On being thus prayed to, Satadhriti (Brahma), pleased with his religious austerities, conferred upon Hiranyakasipu those boons that are rarely obtained (by others).

    '
  modern: 'When Hiraṇyakaśipu prayed to him in this way, Brahmā, pleased with his penance, granted him boons that are rarely obtained.

    '
7.4.4:
  dutt: 7.4.4
  text: 'Thus the Daitya (Hiranyakasipu), having obtained the boons from Brahma, assumed a golden body, and remembering the death of his brother, commenced hostilities against the Great One.

    '
  modern: 'So the Daitya Hiraṇyakaśipu got his boons from Brahmā. He took a golden body. Remembering his brother''s death, he made war on the Great One.

    '
7.4.5:
  dutt: 7.4.5
  text: 'That great hero, the conquerer of the worlds, having subjugated and brought under his sway the quarters of the heavens, the three worlds, celestials and Asuras, kings among men, Gandharvas, birds (eagles), reptiles, …

    '
  modern: 'That great hero conquered the worlds. He brought under his rule the quarters of heaven, the three worlds, the gods, the demons, the kings of men, the Gandharvas, the eagles, and the serpents, …

    '
7.4.7:
  dutt: 7.4.7
  text: '… lords of spectres, of goblins, of ghosts and of all other creatures, robbed the Lokapalas of their places by force.

    '
  modern: '… He took the lords of spectres, goblins, ghosts, and all other creatures. He seized the places of the world guardians by force.

    '
7.4.8:
  dutt: 7.4.8
  text: 'Then he established himself in Heaven, furnished with the beauty of the pleasure-gardens of the gods. There he took up his residence in the palace of Mahendra, which, built by Visvakarma himself and fraught with all luxuries, had been the abode of the queen of the three worlds.

    '
  modern: 'Then he settled in heaven, where the gods'' pleasure gardens are. He lived in the palace of Mahendra. Vishvakarma built it, and it was full of every luxury. It had been the home of the queen of the three worlds.

    '
7.4.21:
  dutt: 7.4.21
  text: 'All the worlds together with their protectors, were preyed upon by anxiety in consequence of his inflicting terrible punishments on them. Not obtaining refuge anywhere else, they sought it of Him who never lapseth.

    '
  modern: 'The worlds and their guardians lived in fear, because he punished them terribly. With no other refuge, they went to Him who never falls.

    '
7.4.24:
  dutt: 7.4.24
  text: 'After a few days, like the rumbling of clouds, completely filling all the quarters of heaven with its echo, there came from some unseen source to their ears, the following prediction, bringing with it assurances of safety for the pious.

    '
  modern: 'A few days later a voice came from no visible source. It sounded like rolling clouds and filled all the quarters of heaven. It brought a promise of safety for the good.

    '
7.4.25:
  dutt: 7.4.25
  text: 'Be not afraid, O ye foremost of the celestials! good betide ye all! For created beings, a sight of myself is the means of attaining to all prosperity.

    '
  modern: 'Do not be afraid, best of the gods. May all go well with you. For all beings, to see me brings every good.

    '
7.4.26:
  dutt: 7.4.26
  text: 'I have come to know the oppression of this vilest of Daityas. I will put an end to it. Do ye wait till the (meet) season.

    '
  modern: 'I know how this vilest of the Daityas oppresses you. I will end it. Wait for the right time.

    '
7.4.27:
  dutt: 7.4.27
  text: 'He meets a hasty destruction who reviles the celestials, the scriptures, the kine, the Vipras, the pious, and righteousness and myself.

    '
  modern: 'Whoever reviles the gods, the scriptures, the cows, the Brahmins, the good, righteousness, and me, meets a swift destruction.

    '
7.4.28:
  dutt: 7.4.28
  text: 'Though he (Hiranyakasipu) has been made powerful by boons, yet I will slay him when he shall persecute his own son, the high-souled, peace-loving and foeless Prahlada.

    '
  modern: 'He has become strong through his boons. But I will kill him when he persecutes his own son, the great-souled Prahlāda, who loves peace and has no enemies.

    '
7.4.29:
  dutt: 7.4.29
  text: 'Thus spoken to by the preceptor of the worlds, the celestials, bowing down unto him, went away, having all their anxieties removed, and considering the Asuras already slain.

    '
  modern: 'The teacher of the worlds spoke to them. The gods bowed to him and went away, free of worry, sure that the demons were already dead.

    '
7.4.30:
  dutt: 7.4.30
  text: 'That lord of Daityas had four sons, whose equals were never born; of these Prahlada grew to be great, in consequence of his possessing very many excellent qualities. He became the worshipper of the Great One.

    '
  modern: 'The lord of the Daityas had four sons, and no one matched them. Of these, Prahlāda grew great because of his many fine qualities. He became a worshipper of the Great One.

    '
7.4.31:
  dutt: 7.4.31
  text: 'Having (his) senses completely under control, gifted with Brahmanya and a pure character, and always true to his promises, he, like their souls, was the beloved and the best friend of all created beings.

    '
  modern: 'He had his senses under full control. He was gifted with devotion to the Brahmins and a pure character, and he kept his word. Like their own souls, he was the dearest friend of all beings.

    '
7.4.32:
  dutt: 7.4.32
  text: 'Even as a servant to his master, he used to bow down to the feet of the venerable ones. He was kind towards the poor, even as a father is towards his children. He bore brotherly affection towards his equals, and considered his superiors nothing, less than divinities. Although possessing learning, wealth, personal beauty, and a noble lineage, he was free from arrogance.

    '
  modern: 'He bowed to the feet of the elders as a servant bows to his master. He was kind to the poor, as a father is to his children. He loved his equals as brothers, and he saw his superiors as gods. He had learning, wealth, beauty, and a noble birth, yet he had no pride.

    '
7.4.33:
  dutt: 7.4.33
  text: 'In times of danger, his mind remained unruffled. As he saw everything in the light of unreality, he had no desire for the pleasurable objects, which are seen or heard of. Always having his senses, life, body, and understanding, under his (thorough) control, and all his wishes self-satisfied allayed he, though an Asura by birth, was free of the characteristics of the species.

    '
  modern: 'In danger his mind stayed calm. He saw the world as unreal, so he did not crave the pleasures that are seen or heard of. He kept his senses, breath, body, and mind under control, and his desires were at peace. Though born a demon, he was free of the demon''s ways.

    '
7.4.36:
  dutt: 7.4.36
  text: 'He possessed innumerable qualities which defy description. I can only hint at his glory who by nature was attached to the Almighty Vasudeva.

    '
  modern: 'He had countless qualities that no words can describe. I can only hint at the glory of the man who loved Vāsudeva by nature.

    '
7.4.43:
  dutt: 7.4.43
  text: 'O king! Hiranyakasipu offered ill-treatment to such a son of his who was magnanimous, highly exalted, and a great devotee of the Great One.

    '
  modern: 'O king, Hiraṇyakaśipu mistreated his own son. The son was noble, lofty, and a great devotee of the Great One.

    '
7.5.4:
  dutt: 7.5.4
  text: 'O Pandava! one day the sovereign of the Asuras, placing his son on his lap, asked him: ''O son! tell me, what do you think to be the best.''

    '
  modern: 'One day, Pāṇḍava, the king of the Asuras set his son on his lap and asked him, ''Son, tell me what you think is best.''

    '
7.5.5:
  dutt: 7.5.5
  speaker: 'The auspicious Prahlada said:'
  text: 'O foremost of Asuras! for corporeal beings whose intellects are confused by false conceptions of ego and egoism, I think it best to enter into the woods and there to seek refuge in Hari after having abandoned the black-hole of this abode which is the cause of their souls'' degradation.

    '
  modern: 'O best of Asuras, I think this is best for people whose minds are confused by false ideas of self and ego. They should leave the house, which is a black well that drags their souls down. They should go to the forest and take refuge in Hari.

    '
7.5.6:
  dutt: 7.5.6
  text: 'The Daitya, hearing these words of his son which were wrapped up in the thoughts of the hostile party, laughed (and said): ''Thus is the understanding of boys spoiled by the teachings of others.''

    '
  modern: 'The Daitya heard his son''s words. They were wrapped in the thinking of the enemy. He laughed and said, ''This is how other people''s teaching spoils the minds of boys.''

    '
7.5.7:
  dutt: 7.5.7
  text: 'Let the twice-born ones so carefully protect the boy in the abode of his preceptors, that the disguised partisans of Vishnu may not vitiate his understanding.

    '
  modern: 'Let the Brahmins guard the boy closely in his teacher''s house, so that the hidden friends of Viṣṇu cannot spoil his mind.

    '
7.5.8:
  dutt: 7.5.8
  text: 'The priests calling near them Prahlada, who had been conveyed to their place, praised him in mild language and then sweetly asked.

    '
  modern: 'The priests called Prahlāda to them. They praised him in gentle words and asked him questions.

    '
7.5.9:
  dutt: 7.5.9
  text: 'O son, Prahlada! good betide you; speak what is true, and do not lie. Whence is this perversity of your intellect which is not perceptible in other boys?

    '
  modern: 'O son Prahlāda, may all go well with you. Speak the truth and do not lie. Where does this twist in your mind come from? Other boys do not have it.

    '
7.5.11:
  dutt: 7.5.11
  speaker: 'The auspicious Prahlada said:'
  text: 'Salutation unto the almighty Being, through the agency of whose illusive energy were formed false notions about friends and enemies, and who is seen by beings whose understandings are befooled (by his illusive energy).

    '
  modern: 'I bow to the almighty Being. By his illusion, people form false ideas of friend and enemy. He is seen by those whose minds his illusion has confused.

    '
7.5.14:
  dutt: 7.5.14
  text: '… O Brahmana; like a piece of iron approaching, of itself a magnet, my mind is travelling toward Chakrapani and is differentiated from those of yours by Him.

    '
  modern: '… O Brahmin, as iron moves toward a magnet, my mind moves toward Chakrapani by his own will. He has made my mind different from yours.

    '
7.5.15:
  dutt: 7.5.15
  text: 'The high-minded Prahlada, having thus spoken to the Brahmanas, paused. Thereat, greatly enraged, the miserable servant of the king, reprimanding him, thus spoke:

    '
  modern: 'The great-minded Prahlāda stopped speaking to the Brahmins. Then the wretched servant of the king flew into a rage. He scolded the boy and said:

    '
7.5.18:
  dutt: 7.5.18
  text: 'Thus frightening him by reproaches and various other means, he (Prahlada''s perceptor), instructed him in those scriptural texts which establish by argument Trivarga.

    '
  modern: 'He scared the boy with scolding and many other means. Then the teacher taught him the texts that set out the three aims of life by argument.

    '
7.5.19:
  dutt: 7.5.19
  text: 'Then his preceptor, knowing him to be well-learned in the four expedients worthy of being mastered, led him, after he had been anointed with perfumes and decorated with ornaments by his mother, to an interview with the lord of Daityas.

    '
  modern: 'The teacher knew the boy had mastered the four expedients worth learning. His mother bathed him with perfume and dressed him in ornaments. The teacher then brought him before the lord of the Daityas.

    '
7.5.20:
  dutt: 7.5.20
  text: 'The Asura greeted the boy fallen at his feet with benedictions, and enjoyed great felicity by embracing him for a while with his two arms.

    '
  modern: 'The Asura blessed the boy, who had fallen at his feet. He held him in both arms for a long time and was very happy.

    '
7.5.22:
  dutt: 7.5.22
  text: 'O my son, Prahlada, may you live long! Tell me some of the best lessons that you have read, and learnt from your preceptor during this long period.

    '
  modern: 'My son Prahlāda, may you live long! Tell me some of the best lessons you have studied and learned from your teacher in all this time.

    '
7.5.24:
  dutt: 7.5.24
  speaker: 'The auspicious Prahlada said:'
  text: 'To my mind that is the best of all teachings, which prompts beings to actions when they have offered to the Almighty Vishnu all their reverence bearing these nine features …

    '
  modern: 'In my view, the best teaching is the one that moves people to act when they have offered to the Almighty Viṣṇu all their reverence, in its nine forms …

    '
7.5.25:
  dutt: 7.5.25
  text: 'Hearing these words of his son, with his lips quivering in anger Hiranyakasipu then thus spoke to the son of his Preceptor:

    '
  modern: 'When he heard his son''s words, Hiraṇyakaśipu''s lips trembled with anger. He spoke to the son of the teacher:

    '
7.5.26:
  dutt: 7.5.26
  text: 'O meanest of Brahmanas! what does this mean; O evil-minded one! the boy has been taught rubbish by you who neglecting myself have sided with mine enemy.

    '
  modern: 'You lowest of Brahmins, what is this? You evil-minded man, you have taught the boy rubbish. You ignored me and sided with my enemy.

    '
7.5.28:
  dutt: 7.5.28
  speaker: 'The auspicious son of the preceptor said:'
  text: 'O enemy of Indra! what your son says, is neither taught by me nor by others; this notion is natural with him. O king; renounce your anger; do not lay the blame on ourselves.

    '
  modern: 'O enemy of Indra, your son says what I did not teach him, and others did not teach him either. The idea comes naturally to him. O king, put down your anger. Do not blame us.

    '
7.5.29:
  dutt: 7.5.29
  speaker: 'The Asura spoke:'
  text: 'Thus replied to by the preceptor, the Asura again spoke to his son: ''O ill-behaved one! if your perverse inclination is not due to the teachings of your preceptor, whence is it then?''

    '
  modern: 'The teacher answered him. The Asura spoke to his son again: ''Wicked boy, if your twisted thinking does not come from your teacher, where does it come from?''

    '
7.5.30:
  dutt: 7.5.30
  text: 'The understanding of those who are attached to their homes, and who on account of their unsatiated senses are repeatedly entering this gloomy earth where they ruminate over their old experiences, is never accomplished in the adoration of Krishna either through their own exertions or through those of their preceptors or of other people.

    '
  modern: 'People who are tied to their homes, whose senses are never satisfied, keep going back into this dark world, chewing over old experiences. Their minds never reach the worship of Kṛṣṇa, whether by their own efforts or by their teachers or by others.

    '
7.5.33:
  dutt: 7.5.33
  text: 'Thus speaking his son paused, whom Hiranyakasipu blinded with wrath, threw off on the ground from his lap.

    '
  modern: 'When the boy stopped speaking, Hiraṇyakaśipu, blind with anger, threw him from his lap onto the ground.

    '
7.5.34:
  dutt: 7.5.34
  text: 'Then possessed by violent wrath, and with his eyes rendered slightly red, he (Hiranyakasipu) thus spoke. ''O Nairitas! this (boy) ought to be killed; so slay him without delay; drive him away immediately.''

    '
  modern: 'Full of fierce anger, his eyes reddened, Hiraṇyakaśipu spoke: ''O Nairitas, this boy must be killed. Kill him at once. Drive him away now.''

    '
7.5.35:
  dutt: 7.5.35
  text: '(Certainly) this boy ought to be reckoned as the slayer of my brother; for this wretch, renouncing his own friends, is worshipping like a servant the feet of Vishnu, the murderer of his uncle.

    '
  modern: 'This boy is the killer of my brother. This wretch has left his own friends and serves the feet of Viṣṇu like a servant. Viṣṇu murdered his uncle.

    '
7.5.40:
  dutt: 7.5.40
  text: '… emitted terrific shouts crying out at the same time ''slay slay.'' They then began to wound with their tridents the seated Prahlada in his vital parts.

    '
  modern: '… They gave terrible shouts and cried ''Kill, kill!'' Then they began to strike the seated Prahlāda in his vital parts with their tridents.

    '
7.5.41:
  dutt: 7.5.41
  text: 'Like the efforts of a man, devoid of (previous) religious merit, for performing good acts, their strokes were unavailing against him who was then in communion with the highest Divinity, the Brahman, whose semblance is incomprehensible and who is almighty, and the essence of all.

    '
  modern: 'Their blows did no more good than a good deed does for a man with no merit. They could not touch him, for he was joined to the highest Divinity, the Brahman, whose form cannot be grasped, who is almighty, and who is the essence of all.

    '
7.5.42:
  dutt: 7.5.42
  text: 'O Yudhisthira! the lord of the Daityas seeing their endeavours (to kill him) thwarted, became very much afraid and in earnest began to think of various other expedients.

    '
  modern: 'O Yudhishthira, the lord of the Daityas saw that their attempts had failed. He grew afraid and set his mind to other ways of killing the boy.

    '
7.5.43:
  dutt: 7.5.43
  text: 'When the Asura could not slay his sinless son by means of huge snakes, and elephants the guardians of the heavenly quarters, by employing magical spell, by throwing him down from mountain-peaks, by his illusive energy, by confinement, by poisoning, by starvation, by exposing him to (the inclemency of) fire, water, air or frost, by leaving him alone on the mountains, and by various other means, as also through his personal agency, then did a continued anxiety take hold of him.

    '
  modern: 'The Asura could not kill his sinless son with huge snakes or with the elephants that guard the quarters of heaven. He tried curses, illusion, confinement, poison, and starvation. He tried fire, water, wind, and frost, and he left the boy alone on the mountains. He tried many other means and his own hand as well. Then a long worry took hold of him.

    '
7.5.44:
  dutt: 7.5.44
  text: '(with 7.5.43)

    '
7.5.47:
  dutt: 7.5.47
  text: 'This one is immortal, is of immeasurable prowess, and is not afraid of any thing. I know not if my death will result from a quarrel with him.

    '
  modern: 'This boy cannot be measured in power. He is immortal and fears nothing. I do not know whether a quarrel with him will bring about my death.

    '
7.5.55:
  dutt: 7.5.55
  text: 'The very wise Prahlada welcomed them with sweet words; and knowing their attachment to the objects of this earth, he out of kindness smilingly spoke to them,

    '
  modern: 'The very wise Prahlāda welcomed them with gentle words. Knowing that they were attached to the things of this earth, he smiled kindly and spoke to them.

    '
7.6.1:
  dutt: 7.6.1
  speaker: 'The auspicious Prahlada said:'
  text: 'In this world the wise should practise from their early years the true religion inculcated by the Almighty Lord, as human existence which affords what we want, is very seldom attained to, and is also encompassed with uncertainty.

    '
  modern: 'In this world the wise should practise from their early years the true religion taught by the Almighty Lord. A human life, which gives us what we seek, is rarely won, and it is uncertain.

    '
7.6.3:
  dutt: 7.6.3
  text: 'O Daityas! on account of their being possessed of bodies, like misery, the pleasures pertaining to the senses of corporeal beings, are everywhere (in various existences) obtained by them without the least effort, and through the agency of Destiny.

    '
  modern: 'O Daityas, sense pleasures come to embodied beings everywhere, just as misery does. They come by fate, with no effort at all.

    '
7.6.7:
  dutt: 7.6.7
  text: 'Twenty of these years of existence are spent in play, during which time he is fascinated by (the charms of) childhood and youth. Another twenty years again are uselessly passed away when his body is beseiged by senility and rendered, infirm by it.

    '
  modern: 'Twenty of a man''s years go to play, while he is charmed by childhood and youth. Another twenty go to waste when old age lays siege to his body and makes it weak.

    '
7.6.8:
  dutt: 7.6.8
  text: 'The remaining portion of his term of life is also mis-spent, during which period he, maddened as it were, is engrossed in his home through the influence of powerful infatuation and sorrow-abounding desires.

    '
  modern: 'The rest of his life is also wasted. He is caught up in his home, as if crazed, driven by strong infatuation and desires that bring sorrow.

    '
7.6.10:
  dutt: 7.6.10
  text: 'Who ever relinquishes his thirst for wealth which is cherished more than life itself, and which, a thief, a servitor and a merchant purchase (secure) in exchange for their dearest lives.

    '
  modern: 'Who gives up the thirst for wealth? People value it more than life. A thief, a servant, and a merchant buy it with their dearest lives.

    '
7.6.13:
  dutt: 7.6.13
  text: 'Like a chrysalis (enveloped in a sheath without any out-let) what person, whose desires are unsatiated, who performs acts on account of intense cupidity and whose infatuation is inveterate, is ever tired of these (above-mentioned objects)? For he holds in high estimation sexual pleasure and enjoyments pertaining to the palate.

    '
  modern: 'Like a silkworm shut in its cocoon, a man whose desires are never full, who acts out of greed, and whose delusion runs deep, never grows tired of these things. He values sex and the pleasures of the palate above all.

    '
7.6.14:
  dutt: 7.6.14
  text: 'Completely intoxicated, he does not perceive that by cherishing his kinsmen, his own term of existence is being shortened, and his aim of life, thwarted. Attached to his relatives he does not feel any misery, though his heart is always afflicted by the three different kinds of misery.

    '
  modern: 'Drunk on the world, he does not see that by caring for his kin his life is growing shorter and his purpose is thwarted. Tied to his relatives, he feels no pain, though the three kinds of suffering always trouble his heart.

    '
7.6.18:
  dutt: 7.6.18
  text: 'Therefore, O sons of Daityas! renouncing at a distance the company of these Asuras absorbed in mundane objects, do you approach the Primary divinity Narayana, who is the bestower of Apavarga (or final emancipation) which is very much coveted by the companionless sages.

    '
  modern: 'So, sons of the Daityas, keep far away from the company of these demons who are absorbed in worldly things. Go to the Primal God Nārāyaṇa, who gives final liberation, which even the sages who have left all company long for.

    '
7.6.19:
  dutt: 7.6.19
  text: 'O sons of Asuras! neither there is any very great difficulty in propitiating the Being that never lapseth, for he is the soul of all created beings and is present everywhere.

    '
  modern: 'O sons of the Asuras, it is not very hard to win the favor of the Being who never falls. He is the soul of all creatures and is present everywhere.

    '
7.6.20:
  dutt: 7.6.20
  text: 'That almighty immutable Lord is the only prime soul, that pervadeth the higher and the lower orders of beings, the whole range of creation commencing with the immobile objects and ending in Brahma, the inanimate world, the transformations of earth etc., the elements, the Mahat, the cardinal principles, and the similarity and reciprocity that is found between them.

    '
  modern: 'The almighty, unchanging Lord is the one supreme soul. He pervades the higher and the lower beings, all creation from the immobile things up to Brahmā, the lifeless world, the changes of earth and the rest, the elements, the Mahat, the cardinal principles, and the likeness and interplay found among them.

    '
7.6.21:
  dutt: 7.6.21
  text: '(with 7.6.20)

    '
7.6.24:
  dutt: 7.6.24
  text: 'So leaving behind your Asuran nature, do you begin to show generosity and friendliness towards all created beings. By this act Adhokshaja (Vishnu) will become propitious unto you.

    '
  modern: 'So give up your demon nature. Show mercy and friendship to all creatures. By this, Adhokshaja (Viṣṇu) will be pleased with you.

    '
7.6.25:
  dutt: 7.6.25
  text: 'What is there unattainable (by beings) when the Lord, who hath neither end nor beginning, is pleased (with them)? What need have we, — who are constantly singing his glory, and drinking nectar from his two feet — of righteousness &c., the natural outcome of meritorious acts, as well as of the final beatitude that is coveted by all.

    '
  modern: 'When the Lord, who has neither end nor beginning, is pleased, what is out of reach? We sing his glory all the time and drink the nectar of his two feet. What need have we of righteousness and the other goods that come from merit, or of the final liberation that all desire?

    '
7.7.51:
  dutt: 7.7.51
  text: 'O sons of Asuras! neither the fact of being a twice born one, a celestial or an anchorite, nor character nor experience, nor charity, nor religious austerity, nor sacrifice, nor purity, nor observance of vows, is capable of bringing above the satisfaction of Mukunda. Hari is pleased only by means of unalloyed devotion. Shorn of devotion the other things recited are mere mockeries.

    '
  modern: 'O sons of the Asuras, being a Brahmin, a god, or a sage does not please Mukunda. Neither do good conduct, much learning, gifts, penance, sacrifice, purity, or vows. Hari is pleased only by pure devotion. Without devotion, all these other things are a mockery.

    '
7.7.52:
  dutt: 7.7.52
  text: '(with 7.7.51)

    '
7.7.53:
  dutt: 7.7.53
  text: 'Therefore, O Danavas! direct your devotion towards the almighty Lord Hari, the soul of all created beings by considering every thing else as your own selves.

    '
  modern: 'So, O Danavas, turn your devotion to the almighty Lord Hari. He is the soul of all beings. Treat every other being as your own self.

    '
7.7.54:
  dutt: 7.7.54
  text: 'O sons of Daityas! by this devotional mode of worship, Yakshas, Rakshashas, women, Sudras, the dwellers of Vraja (referring to the dealers in milk of that city), birds, deer and other sinful beings, all live, attaining the self-same nature with Achyuta (refers to immortality).

    '
  modern: 'O sons of the Daityas, by this devotion, yakshas, rakshasas, women, Śūdras, the people of Vraja (the milk-sellers of that town), birds, deer, and other sinners all reach the same state as Achyuta, the Imperishable.

    '
7.7.55:
  dutt: 7.7.55
  text: 'An undeviating devotion towards Govinda, as also the fact of viewing Him in every direction, is said to be the Summum bonum, to which in this life a person can attain.

    '
  modern: 'In this world, the highest good a man can reach is this: devotion to Govinda that never wavers, and seeing him in everything.

    '
7.8.7:
  dutt: 7.8.7
  text: 'O foolish one! like one undaunted, thou dost always violate the commands, proceeding from me who becoming wrathful, the three worlds with their respective rulers begin to shake. Speak what is thy source of power.

    '
  modern: 'You fool, you act as if you had no fear. You break my commands, though at my anger the three worlds and their rulers shake. Tell me, where does your strength come from?

    '
7.8.8:
  dutt: 7.8.8
  text: 'O king! He is not the source of power to myself only but also to thyself and to other powerful beings. The superior and inferior Brahma and others, the mobile and the immobile creation, have all been brought under His subjection (by His power).

    '
  modern: 'O king, he is the power of me, of you, and of all other powerful beings. Brahmā and the rest, the high and the low, the moving and the still, are all under his rule.

    '
7.8.9:
  dutt: 7.8.9
  text: 'He is the Lord, He is Time, His prowess is great, He is energy, He is patience, His self is composed of strength, the senses, and goodness. That supreme Being, the lord of the three essential Principles (of Goodness, Dullness and Energy) by means of His own, energy creates, preserves and destroys this universe.

    '
  modern: 'He is the Lord and he is Time. His might is great. He is energy and patience. His self is made of strength, the senses, and goodness. That supreme Being is lord of the three qualities. By his own power he creates, preserves, and destroys this universe.

    '
7.8.10:
  dutt: 7.8.10
  text: 'Annihilate this thine Asura nature, and hold thy mind equable. There exists no (greater) enemy than the unsubdued mind that always goes astray from the right path. This (holding the mind equable) constitutes the great and perfect adoration of the endless Being.

    '
  modern: 'Give up this demon nature and keep your mind even. No enemy is worse than a mind that is not held in check and strays from the right path. Keeping the mind even is the great and perfect worship of the endless Being.

    '
7.8.12:
  dutt: 7.8.12
  text: 'It is evident that thou art desirous of dying, for thou art greatly vaunting. O evil-minded one! surely the words of the dying only become incoherent.

    '
  modern: 'It is clear you want to die, since you boast so much. Evil-minded one, the words of dying men are always incoherent.

    '
7.8.13:
  dutt: 7.8.13
  text: 'O ill-fated one! thou hast asserted that, there is another lord of the worlds besides my own self; where is he? If he is present everywhere why then is he not seen in this pillar?

    '
  modern: 'Unlucky one, you say there is another lord of the worlds besides me. Where is he? If he is everywhere, why is he not seen in this pillar?

    '
7.8.15:
  dutt: 7.8.15
  text: 'Thus out of rage repeatedly censuring in vile language, his son — the great devotee (of Krishna) — the potent Asura, grasping his sword, jumped down from his beautiful throne. Then that wondrous-powerful being struck the pillar with his fist.

    '
  modern: 'Angry, he kept reviling his son in vile words, the great devotee. The mighty Asura grabbed his sword, jumped down from his fine throne, and struck the pillar with his fist.

    '
7.8.16:
  dutt: 7.8.16
  text: 'Thereupon a greatly terrific sound was heard inside it, in consequence of which this mundane shell (the earth) was rent asunder. O best of men! having heard this sound which had reached their respective residences, Brahma and other celestials, thought that the destruction of their abodes had taken place.

    '
  modern: 'At once a terrible sound came from inside the pillar. It was so loud that the shell of the world seemed to split. O best of men, Brahmā and the other gods heard it in their own homes. They thought their abodes were being destroyed.

    '
7.8.18:
  dutt: 7.8.18
  text: 'Then to prove the truth of His servant''s words and also His omnipresence the Lord came into the view of the assembly on the self-same pillar, bearing a form neither human nor celestial.

    '
  modern: 'Then, to prove the truth of his servant''s words and that he is everywhere, the Lord appeared from the same pillar in the assembly. His form was neither human nor divine.

    '
7.8.19:
  dutt: 7.8.19
  text: 'Looking everywhere for the being that gave forth the sound, Hiranyakasipu saw this figure issuing forth from the pillar. ''O wonderful! this is neither a beast nor a man! what is this; surely this figure consists of a combination partly of the form of a man and the king of beasts!''

    '
  modern: 'Looking everywhere for the source of the sound, Hiraṇyakaśipu saw a figure coming out of the pillar. ''How strange! This is neither a beast nor a man. What is this? It seems to be part man and part lion!''

    '
7.8.23:
  dutt: 7.8.23
  text: '… with a body hard to approach. He was slaying with his own personal weapon (the discus) as well as with other good ones, the hosts of the Daityas and Danavas. ''It is certain that Hari, the god of the potent energy of Illusion, has fixed on this (novel) means of bringing about my death; but, of what avail will his endeavours be?''

    '
  modern: '… His body was hard to approach. With his own weapon, the discus, and with other fine weapons, he was killing the hosts of the Daityas and Danavas. ''Hari, the god of the strong power of illusion, has surely chosen this new way to kill me. But what good will his efforts do?''

    '
7.8.24:
  dutt: 7.8.24
  text: 'Thus speaking the foremost of the Asuras, armed with a bludgeon and giving forth a (terrific) roar, assaulted Nrisingha. Thereat even like an insect falling in fire, that Asura disappeared from sight owing to his having been encompassed by the effulgence of Nrisingha.

    '
  modern: 'Speaking thus, the chief of the Asuras, armed with a club, roared and attacked Narasimha. But he vanished from sight, like an insect that falls into a fire, because Narasimha''s brilliance surrounded him.

    '
7.8.26:
  dutt: 7.8.26
  text: '… But like the son of Tarkhya (i. e. Garuda), catching a great serpent, the club-armed Diety (Gadadhara) caught hold of him with his bludgeon, who had been (incessantly) striking against his person. Like a serpent that had escaped the clutches of the Garuda, he, slipping out of Nrisingha''s grasp, began to make a display his prowess.

    '
  modern: '… As Garuḍa, son of Tarkhya, seizes a great serpent, the club-bearer Gadadhara caught the demon with his club. The demon had been beating against him without stop. Then, like a serpent that escapes Garuḍa''s grip, he slipped out of Narasimha''s grasp and began to show off his strength.

    '
7.8.30:
  dutt: 7.8.30
  text: 'Then on account of His wrath, His terrible eyes were hard to gaze at. He licked with His tongue the ends of His expanded mouth; His countenance and manes were rendered crimson being drenched with drops of blood; He wore as a garland the entrails of the Daitya.

    '
  modern: 'In his rage his terrible eyes were hard to look at. He licked the corners of his wide mouth with his tongue. His face and mane were red with drops of blood, and he wore the entrails of the Daitya as a garland.

    '
7.8.35:
  dutt: 7.8.35
  text: 'The foremost of the Daityas — who was unbearable like the brain fever of the three worlds — being slain in battle by Hari, the countenances of the wives of the celestial, bloomed forth with excessive delight. They also poured showers of flowers upon Him.

    '
  modern: 'The chief of the Daityas, who had been a fever to the three worlds, was slain in battle by Hari. The wives of the gods lit up with joy, and they showered flowers on him.

    '
7.9.5:
  dutt: 7.9.5
  text: 'Finding the boy fallen at the root of his feet, the Lord was filled with a kindly feeling; then raising this child who is capable of dismissing the terror of those whose hearts are afraid of the most poisonous serpent, the Destroyer (Kala), He placed His lotus-like hands on his head.

    '
  modern: 'The boy fell at the Lord''s feet. The Lord was moved with pity. He lifted the child and set his lotus hands on his head. The boy could drive away fear, even of the deadly serpent Time, in those whose hearts are afraid.

    '
7.9.7:
  dutt: 7.9.7
  text: 'Then fixing his eyes and heart on Him (the Lord) and with due concentration and singleness of purpose he praised Hari in words that were indistinct on account of his great devotion.

    '
  modern: 'Then he fixed his eyes and heart on the Lord. With full attention and one purpose, he praised Hari, in words that broke with his great devotion.

    '
7.9.10:
  dutt: 7.9.10
  text: 'I consider even a Sapacha (one who cooks and eats dog''s meat, a Chandala) who hath dedicated his mind, his deeds, his riches, his life to the Lord to be worthier than that Vipra who though possessing the above mentioned twelve qualifications, is disinclined to worship the lotus-like feet of the lotus-navelled Deity. The former sanctifies his race, whilst, the latter of immense pride, cannot do so.

    '
  modern: 'I hold that a Chandala, who cooks and eats dog''s meat, is worthier if he has given his mind, deeds, wealth, and life to the Lord, than a Brahmin with all twelve qualities who will not worship the lotus feet of the lotus-navelled Lord. The one purifies his family. The other, proud beyond measure, cannot.

    '
7.9.11:
  dutt: 7.9.11
  text: 'Enriched with his own profits the great Lord does not accept honour from this ignorant one with a view to promote his own interests. But he does so, out of kindness towards them. The honour which a person offers unto the illustrious Deity, redounds on them, even as the decorations of one''s countenance goes to enhance the beauty of its image reflected on a mirror.

    '
  modern: 'The Lord is full in himself. He does not take honor from the ignorant to serve his own ends. He takes it out of kindness to them. The honor a person gives the illustrious Deity comes back to that person, as the adornment of a face makes its reflection in a mirror more beautiful.

    '
7.9.13:
  dutt: 7.9.13
  text: 'O Lord! all these terrified Deities, Brahma and others, all the executors of thine edicts, whose semblance is the principle of goodness, are not like unto ourselves, (for they attach themselves unto thee out of reverence, whilst we do so out of enmity). For the good and prosperity of this Universe, as also for thine own enjoyment, thou engagest in these sports manifesting thyself in beautiful incarnation.

    '
  modern: 'O Lord, all these frightened gods, Brahmā and the rest, carry out your orders, and their nature is goodness. They are not like us: they cling to you out of reverence, while we cling out of enmity. For the good and prosperity of this universe, and for your own joy, you play in these lovely incarnations.

    '
  departs: 'The Sanskrit says Brahma and the others are not frightened as we are (vayam iva na codvijantaḥ); Dutt calls them ''terrified'' and reads the negative as ''not like unto ourselves''.

    '
7.9.14:
  dutt: 7.9.14
  text: 'Therefore renounce thy wrath now that Asura is slain by thee. Even a pious man is delighted at the destruction of a serpent or a scorpion. The worlds have attained tranquility. They are now waiting to see the subsidence of thy wrath. O Nrisingha! all men will recollect this form of thine, in order to drive away their fears.

    '
  modern: 'So give up your anger now that the Asura is slain by you. Even a good man is glad when a serpent or a scorpion is killed. The worlds are at peace and wait for your anger to subside. O Narasimha, people will remember this form of yours to drive away their fear.

    '
7.9.15:
  dutt: 7.9.15
  text: 'I am afraid of thee who art even now bearing a dreadful countenance and a tongue, eyes (lustrous) like the sun, fierce frown and a terrible set of teeth; of thee whose garland consists of entrails, whose manes are reddened with blood, whose ears are erect like a spear, and whose roar hath struck terror into the hearts of the elephants guarding the cardinal quarters; of thee who hast slain thine enemy with the ends of thy nails.

    '
  modern: 'I am not afraid of you. You still wear a dreadful face, a tongue, and eyes that shine like the sun. Your brows are fierce and your teeth are terrible. You wear a garland of entrails, and your mane is red with blood. Your ears stand up like spears. Your roar has frightened the elephants that guard the quarters. You killed your enemy with the tips of your nails.

    '
  departs: Dutt's printed text reads 'I am afraid of thee', in both scans, for nāhaṃ bibhemi, 'I am not afraid'; his next sentence ('But … I am afraid of' the wheel of existence) shows a printer's dropped 'not', and the modern sentence restores it.
7.9.16:
  dutt: 7.9.16
  text: 'But, O thou, that art affectionate towards the helpless! I am afraid of the terrible and insufferable woe that is met with (when beings are whirled) on the wheel of this existence? Bound fast by my actions I have been thrown by them, in the midst of ferocious creatures. O holiest of holies! when shalt thou, propitiated, recall me unto the roots of thy feet, which are the shelter and the (cause of) emancipation of beings.

    '
  modern: 'But you are kind to the helpless. I am afraid of the terrible woe that comes when beings are whirled on the wheel of this life. Bound by my own deeds, I have been thrown among savage creatures. O holiest of holies, when will you call me to the roots of your feet? They are the refuge and the way to liberation for all beings.

    '
7.9.19:
  dutt: 7.9.19
  text: 'In this world the remedy, prescribed against the misery of one afflicted with it, does not prove efficacious in the case of corporeal beings who are forsaken by thee, even as parents cannot sometimes afford shelter to their son, even as physic cannot sometimes check a malady and even as a boat cannot help one that is sinking down into the sea.

    '
  modern: 'In this world, a cure for suffering does not work for embodied beings whom you have forsaken. It is like parents who cannot shelter their son, like medicine that cannot stop a disease, and like a boat that cannot save a man sinking in the sea.

    '
7.9.45:
  dutt: 7.9.45
  text: 'Verily, O lord! habitation and other enjoyments of the household life, are trifling. Like the scratching of the hands, they are fraught with a cycle of misery. The lascivious, though afflicted with various miseries, are never satiated with these enjoyments; only a sober person can repress his desires, even as one can bear with the scratching of his hands.

    '
  modern: 'Truly, O Lord, the pleasures of household life are trifling. Like scratching the hands, they bring misery on misery. The lustful, who suffer so much, are never satisfied with them. Only a sober person can hold back his desires, as one can bear an itch in the hands.

    '
7.9.46:
  dutt: 7.9.46
  text: 'O excellent Purusha! the restraining of one''s speech, vows, Srutas, rigid austerities, study, the analysis of one''s own action, life in solitude, silent prayer and self communion, are the means of attaining emancipation and generally become the sources of sustenance of people of unsubdued passion. Sometimes they also are the means of livelihood of the imperious, and sometimes not.

    '
  modern: 'O excellent Purusha, silence, vows, scripture, hard penance, study, reflecting on one''s own duty, life alone, silent prayer, and meditation are the means to liberation. But for people whose passions are not subdued, they mostly become a way to make a living. For the imperious, they are sometimes a living and sometimes not.

    '
7.9.50:
  dutt: 7.9.50
  text: 'O most worshipful one! the act of bowing down, regulation of acts unto thee, prayer, adoration, recollection of thy feet, and an audition of thy glorious deeds; except by the help of these six modes of serving thee, how can a man conceive reverence towards thee who art attainable only by the excellent devotees?

    '
  modern: 'O most worthy one, bowing down, doing acts for you, praying, worshipping, remembering your feet, and hearing your glorious deeds: without these six ways of serving you, how can a man feel reverence for you? You can be reached only by the best devotees.

    '
7.9.52:
  dutt: 7.9.52
  speaker: 'The auspicious Almighty Lord said:'
  text: 'O gentle Prahlada, good betide thee. Thou excellent among the Asuras, I am pleased with thyself. Ask any boon of thy choice. I am He, who bestows their desires on men.

    '
  modern: 'O gentle Prahlāda, may all go well with you. Best of the Asuras, I am pleased with you. Ask any boon you like. I am the one who grants the desires of men.

    '
7.10.7:
  dutt: 7.10.7
  text: 'O foremost of those that bestow boons! if thou art greatly bent on conferring my cherished boon, then O Lord! I ask of thee, the boon of complete irradication of my desire.

    '
  modern: 'O best of givers of boons, if you truly mean to grant my dearest wish, then, O Lord, I ask this boon: that my desires be wholly uprooted.

    '
7.10.15:
  dutt: 7.10.15
  speaker: 'The auspicious Prahlada said:'
  text: 'From thee, O Great Lord, inclined to confer boons on me, I ask this one, that my father, who ignorant of thy divine energy and not knowing thy true nature reviled thee, …

    '
  modern: 'O Great Lord, you are inclined to give me a boon. I ask this one: that my father, who reviled you because he did not know your divine power or your true nature, …

    '
7.10.17:
  dutt: 7.10.17
  text: '… be purified of all his fearful sins that are difficult to cross over. But, O thou kind to the indigent! he is already purified, in consequence of one single glance from thee.

    '
  modern: '… may be purified of his terrible sins, which are so hard to cross. But, O you who are kind to the poor, he is already purified, by one glance from you.

    '
7.10.18:
  dutt: 7.10.18
  speaker: 'The Auspicious Almighty One said:'
  text: 'O sinless one! thy father, with one and twenty generations upwards, has been purified; since indeed, O pious one! thou, the purifier of thy race, hast been born in his family.

    '
  modern: 'O sinless one, your father is purified along with twenty-one generations of his ancestors. You, the purifier of your family, were born in his house.

    '
7.10.21:
  dutt: 7.10.21
  text: 'O foremost of the Daityas! in this world those people become devoted unto me, … who are thy followers. Verily thou art exemplary among all my devotees.

    '
  modern: 'O foremost of the Daityas, in this world those people become my devotees … who follow you. You are a model among all my devotees.

    '
7.10.31:
  dutt: 7.10.31
  text: 'O king! thus having spoken, the Almighty Lord disappeared thence, worshipped by Brahma and unperceived by other beings.

    '
  modern: 'O king, after he had said this, the Almighty Lord vanished. Brahmā worshipped him, and no other being could see him.

    '
7.10.33:
  dutt: 7.10.33
  text: 'Then the lotus-throned deity together with Kavya and other sages installed Prahlada as lord of the Daityas and Danavas.

    '
  modern: 'Then the lotus-seated Brahmā, with Kavya and the other sages, made Prahlāda the lord of the Daityas and Danavas.

    '
8.2.20:
  dutt: 8.2.20
  text: 'Once on a time the leader of an elephant, dwelling in that forest, accompanied by female elephants, ranging about, fell to breaking large trees, and a large thorny bush consisting of canes and Kichaka bamboos.

    '
  modern: 'Once, the leader of a herd of elephants was living in that forest. He roamed with his cows and broke large trees and thick clumps of thorny cane and kichaka bamboo.

    '
8.2.24:
  dutt: 8.2.24
  text: '… with eyes wild from youthful vigor, from afar smelt the fragrent breeze of the tank covered with lotus-dust, and swiftly ran to the tank, in company with his herd parching with thirst.

    '
  modern: '… His eyes were wild with young vigor. From far off he smelled the breeze over the lake, which was covered with lotus pollen. He ran to the lake with his herd, all of them parched with thirst.

    '
8.2.25:
  dutt: 8.2.25
  text: 'And then bathing in the pond containing transcendent and nectarine water, and covered with the dust of various species of lotuses, drank his fill, raising the water with his trunk.

    '
  modern: 'He went into the pond, whose water was clear as nectar and dusted with the pollen of many kinds of lotus. He drank his fill, lifting the water with his trunk.

    '
8.2.27:
  dutt: 8.2.27
  text: 'And it came to pass that commissioned by Sovereign Destiny, a powerful alligator, fired with wrath, seized him by the leg. Falling into this mishap, that exceedingly mighty one put forth all his strength.

    '
  modern: 'Then, sent by fate, a powerful crocodile, filled with rage, seized him by the leg. In that trouble the mighty elephant pulled with all his strength.

    '
8.2.28:
  dutt: 8.2.28
  text: 'And on lord of the herd being violently pulled by that powerful (alligator), the female elephants, set up shrieks in a forlorn condition of mind; while the rest, although seizing fast by his leg, did not succeed in rescuing him.

    '
  modern: 'As the crocodile dragged the herd''s leader, the female elephants cried out in despair. The others caught hold of his leg, but they could not free him.

    '
8.2.32:
  dutt: 8.2.32
  text: 'These elephant kinsmen of mine are incapable of delivering me, who have come by his sad plight. How, then, can the female elephants succeed in doing so? And ensnared by the Deity in the form of an alligator, neither can I myself, succeed in liberating myself. Therefore I shall seek the protection of the Supreme Lord, who is the refuge even of Brahma and the other deities.

    '
  modern: 'My elephant kin cannot free me from this sorry state. How could the females? Caught by the god in the form of a crocodile, I cannot free myself. So I will seek the protection of the Supreme Lord, the refuge even of Brahmā and the other gods.

    '
8.3.1:
  dutt: 8.3.1
  text: 'Having thus made up his mind, the elephant, concentrating his thoughts within his heart recited the great hymn which he had learnt in his former birth.

    '
  modern: 'The elephant made up his mind. He fixed his thoughts in his heart and recited the great hymn he had learned in an earlier birth.

    '
8.3.2:
  dutt: 8.3.2
  text: 'Salutations unto that Reverend One who endues all beings with consciousness; who is the Soul of the universe, who constitutes the germens of this frame of things and who is the Supreme Diety. I can but contemplate Himself.

    '
  modern: 'Salutations to that Reverend One, who gives consciousness to all beings. He is the Soul of the universe and the seed of this whole frame of things, and he is the Supreme Deity. I can only meditate on him.

    '
8.3.17:
  dutt: 8.3.17
  text: 'Salutation unto Thee who severst the fetter of ignorance of persons like me, who art emancipated, who art running over with mercy, and who art never idle; who as the ranger of hearts makest up the knowledge of all corporate beings, who art capable of resembling every creature, and who, withal, knowest no division.

    '
  modern: 'Salutation to you, who cut the bonds of ignorance for beings like me. You are free and full of mercy, and you are never idle. You move in the hearts of all embodied beings and know all of them. You can take the form of every creature, and yet you know no division.

    '
8.3.25:
  dutt: 8.3.25
  text: 'I do not seek for life. What have I to do with this elephant-birth, hemming me round internally and externally; but I crave that emancipation which time cannot touch, and which lifts the veil from the light (of self-knowledge).

    '
  modern: 'I do not want to live. What use is this elephant body, which closes me in from inside and out? I want the freedom that time cannot touch, the freedom that lifts the veil from the light of self-knowledge.

    '
8.3.31:
  dutt: 8.3.31
  text: 'Seeing the elephant thus distressed, and hearing his hymn, that stay of the universe, in company with the celestials singing his praises, riding on Garuda, ranging everywhere at his will, and equipped with his weapon, the discus, swiftly appeared on the spot where that foremost of elephants was (thus plunged in peril).

    '
  modern: 'The stay of the universe saw the elephant in distress and heard his hymn. With the gods singing his praise, riding on Garuḍa, roaming where he willed and holding his discus, he came swiftly to the place where the foremost of elephants was in peril.

    '
8.3.32:
  dutt: 8.3.32
  text: 'Seeing Hari stay in the heaven, mounted on Garutman, with his discus upraised, the elephant lifted up his trunk holding a lotus, and spoke with difficulty—O Narayana! O preceptor of every creature! I bow unto thee.

    '
  modern: 'The elephant saw Hari in the sky, mounted on Garuḍa, his discus raised. The elephant lifted his trunk with a lotus in it and spoke with great difficulty: ''O Nārāyaṇa, O teacher of every creature, I bow to you.''

    '
8.3.33:
  dutt: 8.3.33
  text: 'Seeing him in travail, the Self-create melted in mercy, speedily descended (from Garuda), and dragged out both the elephant and the alligator and cutting off the head of the latter with his discus, delivered the former in the sight of the celestials assembled.

    '
  modern: 'Seeing him in trouble, the Self-created one was moved with pity. He came down quickly from Garuḍa and pulled out both the elephant and the crocodile. He cut off the crocodile''s head with his discus and freed the elephant before the gods who had gathered.

    '
8.4.3:
  dutt: 8.4.3
  text: 'And he, that was the alligator, viz Huhu, foremost of the Gandharvas, freed from the curse of Devala, now wore a wonderful form.

    '
  modern: 'The crocodile was Huhu, the best of the Gandharvas. He was freed from the curse of Devala, and he now had a wonderful form.

    '
8.4.5:
  dutt: 8.4.5
  text: 'And having enlisted the compassion of the Lord, that one, cleansed from his sin, saluted and performed rounds about him, and ascended the region of the Gandharvas in the presence of every beholder.

    '
  modern: 'Because the Lord had taken pity on him, he was cleansed of his sin. He bowed and walked around the Lord, and then went up to the world of the Gandharvas while everyone watched.

    '
8.4.6:
  dutt: 8.4.6
  text: 'And by virtue of his having been touched by the Reverend One (the celestial elephant) freed from the fetters of ignorance, attained the form of the latter, furnished with four arms and clad in a yellow raiment.

    '
  modern: 'The elephant was freed from the bonds of ignorance by the touch of the Lord. He took on the Lord''s own form, with four arms and yellow robes.

    '
8.4.7:
  dutt: 8.4.7
  text: 'Formerly he was a monarch—the crown of those dwelling in a Dravira—renowned under the name of Indradyumna, devoted to the worship of Vishnu.

    '
  modern: 'Long before, he had been a king, the crown of the people of Dravida. His name was Indradyumna, and he was devoted to the worship of Viṣṇu.

    '
8.4.8:
  dutt: 8.4.8
  text: 'Once on a time dwelling in a hermitage in the Kulachala, that self-controlled One, observing the vow of silence, wearing a head of matted-locks, leading a life of self-mortification and performing his ablutions (regularly) was engaged in the worship of the Lord Hari.

    '
  modern: 'Once, he lived in a hermitage on the Kula mountain. He controlled himself and kept a vow of silence. He wore matted hair, practiced self-discipline, bathed each day, and worshipped the Lord Hari.

    '
8.4.9:
  dutt: 8.4.9
  text: 'And it came to pass that, accompanied by his disciples, there came that highly renowned sage (Agastya). And seeing (the king) silently seated in solitude, without paying him homage due, the ascetic was wrought up with wrath.

    '
  modern: 'Then the famous sage Agastya came with his disciples. He saw the king sitting alone in silence, without giving him the honor due. The sage grew angry.

    '
8.4.10:
  dutt: 8.4.10
  text: 'Thereupon that pious person inflicted this curse upon him. ''Let this wicked wight, this one devoid of sense, this insulter of Brahmana, presently find Tamicra, He is as silent as an elephant.''

    '
  modern: 'Then that holy man laid this curse on him: ''Let this wicked, senseless man, who insults a Brahmin, go now to the hell called Tamisra. He is as silent as an elephant.''

    '
8.4.13:
  dutt: 8.4.13
  text: 'Having delivered that elephant-chief, the lotus-naveled (Deity) accompanied by the former converted into one of his followers, went to his wonderful abode, while Gandharvas, Siddhas and celestials lifted up strains extolling his deed.

    '
  modern: 'After he freed the elephant chief, the lotus-navelled Lord took the king, now his follower, to his wonderful home. The Gandharvas, Siddhas, and gods sang of his deed.

    '
8.5.17:
  dutt: 8.5.17
  text: '… seeing this, the celestials headed by Mahendra, and Varuna, held a conclave for consultation, but failed to ascertain their cause.

    '
  modern: '… Seeing this, the gods, led by Mahendra and Varuṇa, held a meeting to talk it over. They could not find out the cause.

    '
8.5.18:
  dutt: 8.5.18
  text: 'Thereat they in a body set out for the court of Brahma, Situated on the crest of the Meru; and, humbling themselves, acquainted Parameshthi with the state of things.

    '
  modern: 'So they all went to the court of Brahmā, on the top of Meru. They bowed low and told the Supreme Lord what was happening.

    '
8.5.24:
  dutt: 8.5.24
  speaker: 'The auspicious Suka went on:'
  text: 'Having thus spoken to the celestials, Vedha, O repressor of foes, in company with the deities, went to the transcendental regions of the Invincible One, lying beyond the region of Dullness.

    '
  modern: 'After he had spoken to the gods, Brahmā, O tamer of foes, went with them to the transcendent realm of the Invincible One, beyond the realm of darkness.

    '
8.5.25:
  dutt: 8.5.25
  text: 'Arriving at that place, the Lord, concentrating his thoughts, in the language of Veda, began to hymn him whose form is incapable of being beheld, but of whom (Brahma) had heard before.

    '
  modern: 'When he arrived there, the Lord focused his mind and began to praise, in the words of the Veda, him whose form cannot be seen, though Brahmā had heard of him.

    '
8.5.49:
  dutt: 8.5.49
  text: 'As the sprinkling of water at the root of a tree leads to the watering of its trunk and branches so the worship of Vishnu leads to worship of all others and Atman.

    '
  modern: 'As water poured at a tree''s root reaches its trunk and branches, so worship of Viṣṇu reaches all others and the Self.

    '
8.5.50:
  dutt: 8.5.50
  text: 'Salutation unto thee whose nature and actions are above description, who art without end, devoid of qualities, lord of qualities and who always dost exist in thine true self.

    '
  modern: 'I bow to you, whose nature and deeds cannot be described. You are endless, without qualities, and yet lord of qualities. You always exist in your true self.

    '
8.6.1:
  dutt: 8.6.1
  text: 'Being thus eulogised by the celestials, the Divine Lord Hari appeared in their view, effulgent like the rising of the thousand-rayed (Sun).

    '
  modern: 'The gods praised him, and the Lord Hari appeared before them. He shone like the sun rising a thousandfold.

    '
8.6.19:
  dutt: 8.6.19
  text: 'The Daityas and Danavas have obtained the favour of Shukracharya; do ye make peace with them so long your multiplication does not become possible.

    '
  modern: 'The Daityas and Danavas have won the favor of Shukracharya. Make peace with them until you are able to grow strong again.

    '
  departs: 'The Sanskrit says time (kālena) now favors the demons; Dutt has Shukracharya.

    '
8.6.20:
  dutt: 8.6.20
  text: 'When the object is very important, it is better for its accomplishment to make Peace with enemies as a serpent does with a mouse.

    '
  modern: 'When a goal is very important, it is wise to make peace with enemies, as a snake and a mouse keep a truce.

    '
8.6.21:
  dutt: 8.6.21
  text: 'Do ye soon endeavour for bringing out nectar drinking whereof even the mortals become immortal.

    '
  modern: 'Work quickly to bring out the nectar. Whoever drinks it, even a mortal, becomes immortal.

    '
8.6.22:
  dutt: 8.6.22
  text: 'Throwing all creepers, grass and Oshadhi in the ocean of milk, making the mountain of Mandara, the churning rod and Vasuki the rope,

    '
  modern: 'Throw creepers, grass, and herbs into the ocean of milk. Make Mount Mandara the churning rod and Vasuki the rope.

    '
8.6.23:
  dutt: 8.6.23
  text: 'do ye, by my help, assiduously churn it,—the demons shall only participate in the affliction and ye shall reap the fruits.

    '
  modern: 'Churn it hard, with my help. The demons will share only the labor, and you will reap the fruit.

    '
8.6.24:
  dutt: 8.6.24
  text: 'O celestials! do ye yield to whatever the Asuras will dictate—all the objects are easily accomplished by humility and not by anger.

    '
  modern: 'Gods, agree to whatever the Asuras ask. Goals are reached by gentleness, not by anger.

    '
8.6.25:
  dutt: 8.6.25
  text: 'Be not afraid of the poison which shall come out of the ocean—nor do ye cherish any desire or anger (for that being not satisfied) for all objects of desire.

    '
  modern: 'Do not fear the poison that will come out of the ocean. Do not let greed or anger rise in you for any object of desire.

    '
8.6.26:
  dutt: 8.6.26
  text: 'Having thus instructed the celestials the Divine One, the most exalted Purusha, disappeared before them.

    '
  modern: 'After he had instructed the gods, the Divine One, the highest Purusha, vanished before them.

    '
8.6.32:
  dutt: 8.6.32
  text: 'Thereupon making peace and friendship, O slayer of enemies, the celestials and Asuras began to make huge preparations for finding out nectar.

    '
  modern: 'Then the gods and the demons made peace and became friends. O slayer of enemies, they began to make great efforts to find the nectar.

    '
8.6.33:
  dutt: 8.6.33
  text: 'Thereupon those irrepressible (celestials and Asuras) rooted out with great force the mount Mandira, and roaring proceeded towards the ocean.

    '
  modern: 'Then the gods and the demons, impossible to hold back, tore up Mount Mandara with great force. Roaring, they carried it to the ocean.

    '
8.7.1:
  dutt: 8.7.1
  speaker: 'The auspicious Suka said:'
  text: 'O foremost of Kurus, saying unto Vasuki "thou shalt also participate in the nectar that shall arise from the churning of the ocean" the celestials and Asuras making him the rope bound him round the mount Mandara and then with controlled minds began to churn (the ocean) for nectar.

    '
  modern: 'O best of the Kurus, the gods and the demons told Vasuki, ''You will share in the nectar that comes from the churning.'' They used him as the rope and wound him around Mount Mandara. Then, with self-controlled minds, they began to churn the ocean for nectar.

    '
8.7.2:
  dutt: 8.7.2
  text: 'Hari at first held the fore-part of the rope (Vasuki) and the celestials also proceeded towards it;

    '
  modern: 'Hari first took hold of the front end of the rope, Vasuki, and the gods went up to it with him.

    '
8.7.7:
  dutt: 8.7.7
  text: '… although held with great force, O descendant of Pandu, that mountain, having no support, slipped off into the midst of ocean.

    '
  modern: '… Though they held it hard, O descendant of Pandu, the mountain had no base. It sank into the middle of the ocean.

    '
8.7.9:
  dutt: 8.7.9
  text: 'Beholding that ordinance of the lord of obstacles, that lord of irrepressible energy and true determination, assuming the wondrous form of a tortoise, dived into the ocean and held up the mountain.

    '
  modern: 'Seeing this, the Lord, whose power is endless and whose purpose never fails, took the wondrous form of a tortoise. He dived into the ocean and lifted up the mountain.

    '
8.7.10:
  dutt: 8.7.10
  text: 'Beholding that mountain taken up, the celestials and Asuras again assiduously addressed themselves for churning; he, like another huge island, held it up on his back extending over a billion of Yojanas.

    '
  modern: 'When the gods and demons saw the mountain lifted, they went back to churning. The tortoise held it on his back, like another great island that stretched a billion yojanas.

    '
8.7.19:
  dutt: 8.7.19
  text: 'The ocean being thus churned, the fishes, Makaras, tortoises and snakes, Timis, water-elephants, Nakras and Timingalas were all greatly agitated at first; and then arose therefrom a dreadful poison named Halahala.

    '
  modern: 'As the ocean was churned, the fish, makaras, tortoises, snakes, timis, water-elephants, nakras, and timingalas were stirred up. Then a terrible poison rose from it, called Halahala.

    '
8.7.20:
  dutt: 8.7.20
  text: 'Beholding that irrepressible poison, whose action was difficult of being resisted and which was throwing itself up and down; and finding none to protect them, the patriarchs with subjects terrified took refuge unto Siva.

    '
  modern: 'The poison could not be resisted. It spread up, down, and in every direction. The patriarchs and their people had no protector, so they were terrified and fled to Śiva for refuge.

    '
8.7.37:
  dutt: 8.7.37
  speaker: 'The auspicious Suka said:'
  text: 'Beholding their calamity and greatly stricken with mercy that friend of all creatures thus said to his beloved Sati:—

    '
  modern: 'The friend of all creatures saw their trouble. Deeply moved by pity, he said this to his beloved Sati:

    '
8.7.38:
  dutt: 8.7.38
  text: 'Alas behold, O Bhavani! the distress of creatures, from the venom that has come out of the churning of the ocean of milk.

    '
  modern: 'Look, Bhavani, at the suffering of creatures. The poison came out of the churning of the ocean of milk.

    '
8.7.39:
  dutt: 8.7.39
  text: 'It behoves me to promise them protection who have been greatly distressed for this; the work of an able man is the protection of the poor;

    '
  modern: 'I must promise them protection, for they are in great distress. A capable man''s work is to protect the poor.

    '
8.7.41:
  dutt: 8.7.41
  text: 'O auspicious lady! Hari, the soul of all creatures, is delighted with that person who extends his mercy towards those creatures, … The Divine Hari being pleased, I too attain to delight along with the mobile and immobile, so I shall drink up their venom and may blessing proceed from me to the creatures.

    '
  modern: 'O auspicious lady, Hari, the soul of all creatures, is pleased with the one who shows mercy to creatures. … When Hari is pleased, I too am pleased, along with all that moves and does not move. So I will drink this poison, and let blessing flow from me to the creatures.

    '
8.7.43:
  dutt: 8.7.43
  text: 'Placing on the cavity of his palm that venom capable of proceeding on all sides that great deity, the protector of creatures, out of mercy, drank it up.

    '
  modern: 'He held the poison, which spread everywhere, in the cup of his palm. Out of mercy, the great god, protector of creatures, drank it.

    '
8.8.1:
  dutt: 8.8.1
  text: 'The deity, having a bull for his emblem, drinking up that venom, the immortals and the Danavas were all pleased and with great force began to churn the ocean from which (then) arose Surabhi.

    '
  modern: 'The god whose emblem is the bull drank the poison. The gods and the Danavas were pleased, and they churned the ocean hard. Then Surabhi rose from it.

    '
8.8.4:
  dutt: 8.8.4
  text: 'Thereupon arose Airavata, the king of elephants, who by his four teeth was pilfering the greatness of the Divine white mountain (Kailasha);

    '
  modern: 'Then rose Airavata, the king of elephants. With his four tusks he was taking away the greatness of the white mountain, Kailasa.

    '
8.8.6:
  dutt: 8.8.6
  text: 'then arose the wondrous gem Kaustabha, brilliant as the lotus for which Hari, to adorn his breast, cherished a desire;

    '
  modern: 'Then rose the wondrous gem Kaustubha, bright as a lotus. Hari wanted it to adorn his breast.

    '
8.8.7:
  dutt: 8.8.7
  text: 'then arose the Parijata the ornament of the region of the celestials which grants the desires of all as thou dost always on this earth.

    '
  modern: 'Then rose the Parijata tree, the ornament of heaven. It grants the wishes of all who ask, as you always do on this earth.

    '
8.8.8:
  dutt: 8.8.8
  text: 'Then were born the Apsaras whose throats were adorned with Neshkas and who wore beautiful raiments; with graceful looks and movements they created desire in the celestials.

    '
  modern: 'Then the Apsaras were born. Their throats were decked with necklaces and they wore fine robes. With their graceful steps and glances they stirred desire in the gods.

    '
8.8.9:
  dutt: 8.8.9
  text: 'Thereupon arose the very Sree, the most exalted divine Rama, adorning all the quarters with personal grace as does the lightning.

    '
  modern: 'Then Shri, the divine Rāma, rose up. Her beauty lit all the quarters like lightning.

    '
8.8.10:
  dutt: 8.8.10
  text: 'Having their minds agitated by her beauty, grace, youthfulness, colour and effulgence, all the celestials, Asuras and mankind cherished desire for her.

    '
  modern: 'Gods, demons, and men all had their minds stirred by her beauty, grace, youth, colour, and radiance. All of them desired her.

    '
8.8.18:
  dutt: 8.8.18
  text: '… and taking by her hand the lotus garland accompanied by the noise of bees she was about to go; her face was greatly beautified with Kundalas hanging on her cheek and with shameful smiles;

    '
  modern: '… She took a lotus garland in her hand, humming with bees, and was about to go. Her face was lovely, with earrings on her cheeks and a shy smile.

    '
8.8.20:
  dutt: 8.8.20
  text: 'Beholding Hari as the eternal refuge in whom all the good qualities eternally exist she did not behold (the like) either amongst the Gandharvas, Siddhas, Asuras, Yakshas, Charanas or the celestials.

    '
  modern: 'She looked on Hari as the lasting refuge, in whom all good qualities always dwell, and she found none like him among the Gandharvas, Siddhas, Asuras, Yakshas, Charanas, or gods.

    '
8.8.21:
  dutt: 8.8.21
  text: 'Forsooth one, having asceticism, has not been able to conquer anger, one having knowledge has not the disassociation; some are great but have not been able to conquer desire; is he god who depends upon others?

    '
  modern: 'One man has done penance but has not beaten anger. Another has knowledge but has not let go. Some are great but cannot beat desire. Is a god who depends on others a god at all?

    '
8.8.22:
  dutt: 8.8.22
  text: 'Some body has got piety, but not compassion for creatures, some has got renunciation but not for salvation; some has prowess but not tried by time; devoid of all qualities (though) they are not my equal.

    '
  modern: 'One has piety but no pity for creatures. One has renunciation but not for liberation. One has courage that time has never tested. Though they are free of all qualities, none of them is my equal.

    '
8.8.23:
  dutt: 8.8.23
  text: 'Some body lives for ever but has not got an auspicious character; some has got the latter but the permanancy of his life is hard of being known; there is one (Siva) in whom both of these are found and he has no blemishes but he is inauspiciousness (himself), but there is one who is perfectly auspicious but does not want me.

    '
  modern: 'One lives forever but has no good character. Another has good character, but no one can say how long he will live. Śiva has both, and no fault, yet he is himself inauspicious. There is one who is wholly auspicious, but he does not want me.

    '
8.8.24:
  dutt: 8.8.24
  text: 'Judging thus Rama elected Mukunda (as her lord) who was greatly adorned with fidelity and many other virtues, endued with impartiality, untouched by three qualities, gifted with all accomplishments, who is satisfied with himself, and still wishes for (Anima &c.);

    '
  modern: 'After this judgment, Rāma chose Mukunda as her lord. He is adorned with faithfulness and many other virtues. He is impartial, untouched by the three qualities, gifted with all skills, and content in himself, though he still wishes for the powers of Animan and the rest.

    '
8.8.25:
  dutt: 8.8.25
  text: 'she placed round his neck, the beautiful lotus garland that was in her hands and was sounded with the hum of the maddened bees; and then silently stood near, indicating by her bashful smiles that she has obtained her own place.

    '
  modern: 'She put the lovely lotus garland, humming with bees, around his neck. Then she stood close by in silence. Her shy smile showed that she had found her place.

    '
8.8.26:
  dutt: 8.8.26
  text: '(Then) the father of the three worlds made his own breast the habitation of the mother Sree gifted with great effulgence; Sree, too, with compassionate smiles, began to nourish her own subjects and the three worlds along with the protectors thereof;

    '
  modern: 'Then the father of the three worlds made his own breast the home of Shri, the mother, full of splendor. And Shri, with kind smiles, began to nourish her own people and the three worlds with their guardians.

    '
8.8.31:
  dutt: 8.8.31
  text: 'Thereupon arose the celestial damsel, the lotus-eyed Varuni and by the command of Hari the Asuras took her;

    '
  modern: 'Then rose the goddess Varuni, a maiden with lotus eyes. By Hari''s command the Asuras took her.

    '
8.8.35:
  dutt: 8.8.35
  text: '… adorned with bracelet he was holding up jars filled with nectar; he descended from a portion of the very Divine Vishnu.

    '
  modern: '… He wore bracelets and held up a jar full of nectar. He came from a portion of the very Lord Viṣṇu.

    '
8.8.36:
  dutt: 8.8.36
  text: 'He was the well-known Dhanwantari, the father of Ayurveda and an eater of sacrifice. Beholding the jar filled with nectar, the Asuras, …

    '
  modern: 'He was known as Dhanvantari, the father of Ayurveda, and he received a share of sacrifices. When the Asuras saw the jar full of nectar, …

    '
8.8.37:
  dutt: 8.8.37
  text: '… desirous of appropriating the whole, took it by force; the jar of nectar being thus pilfered by the Asuras

    '
  modern: '… they wanted all of it, and they seized it by force. With the nectar jar stolen by the Asuras,

    '
8.8.38:
  dutt: 8.8.38
  text: 'the celestials were greatly dejected and took the refuge of Hari. Observing their depressed spirit the Divine Hari, granting the desires of His votaries (said):— ''Be not dejected, I shall by my own illusive energy accomplish your object.''

    '
  modern: 'The gods were dejected and went to Hari for refuge. The Divine Hari saw their sadness. Granting the wishes of his devotees, he said: ''Do not despair. By my own power of illusion I will accomplish your aim.''

    '
8.8.39:
  dutt: 8.8.39
  text: 'O king! then there arose a conflict amongst them who were all burning with desire for the nectar (and clamoured) ''I shall take first, I shall take first, not you and not you.''

    '
  modern: 'O king, then a quarrel broke out among them, all burning for the nectar. Each shouted, ''I will take it first, I will take it first, not you, not you!''

    '
8.8.42:
  dutt: 8.8.42
  text: 'In the meantime the lord Vishnu, cognisant of all the means, assumed the form of a female, highly wonderful and above description.

    '
  modern: 'Meanwhile the Lord Viṣṇu, who knows every means, took the form of a woman, wonderful beyond description.

    '
8.8.47:
  dutt: 8.8.47
  text: 'The minds of the leaders of Daityas were repeatedly being stricken with lust by her looks accompanied by the movements of eye-brows and beautiful smiles.

    '
  modern: 'The minds of the Daitya leaders were stirred again and again with lust, by her glances, her eyebrows, and her shy smiles.

    '
8.9.12:
  dutt: 8.9.12
  text: 'Thereupon taking the jar of nectar, Hari, adorned with sidelong smiles said:— ''If you promise to accept what I decide, either good or bad, I shall then distribute this nectar.''

    '
  modern: 'Then Hari took the jar of nectar and, with a sidelong smile, said: ''If you promise to accept whatever I decide, good or bad, then I will share out this nectar.''

    '
8.9.13:
  dutt: 8.9.13
  text: 'Hearing her words the leading Asuras, not informed of her true measure, agreed, saying ''So be it''

    '
  modern: 'The leading Asuras heard her words. They did not know her true nature, and they agreed: ''So be it.''

    '
8.9.16:
  dutt: 8.9.16
  text: 'Then the Asuras and the Devas having been seated with their faces directed towards the east, in (that room) fragrant with incense and adorned with garlands and lamps, she entered there.

    '
  modern: 'The Asuras and the gods sat facing east, in a room sweet with incense and decked with garlands and lamps. Then she came in.

    '
8.9.20:
  dutt: 8.9.20
  text: 'Then having arranged different rows the lord of the earth made them sit in their respective rows.

    '
  modern: 'Then the lord of the earth arranged them in separate rows and seated each side in its own row.

    '
8.9.21:
  dutt: 8.9.21
  text: 'Then taking the jar and beguiling the Daityas with sweet and highly honorable words he made the celestials, who were seated at distance, to drink the nectar, removing decrepitude and death.

    '
  modern: 'Then he took the jar, and with sweet and respectful words he kept the Daityas at ease while he gave the nectar, which removes old age and death, to the gods seated at a distance.

    '
8.9.23:
  dutt: 8.9.23
  text: '… Having made love towards her and been afraid lest there might be obstacle in it, they, greatly moved by honours (shown to them), did not speak any thing unpleasant.

    '
  modern: '… They had grown fond of her and feared that anything might spoil it. Honored as they were, they said nothing unpleasant.

    '
8.9.28:
  dutt: 8.9.28
  text: 'Although the place, time, instrument and the object, intellect and work were same both for the celestials and Asuras still the result became diversified; He is worthy of being attended upon resorting to the refuge of whose lotus-feet the celestials reaped the fruit of nectar and the Daityas were deprived.

    '
  modern: 'The place, time, tools, aim, understanding, and deed were the same for gods and Asuras, yet the results differed. The gods got the nectar by taking refuge at the lotus feet of the Lord, and the Daityas were deprived of it.

    '
8.10.2:
  dutt: 8.10.2
  text: 'Having obtained nectar and made his own votaries, the celestials, drink it, He, O king! seated on Garuda, went away before the very eyes of all creatures.

    '
  modern: 'After he had won the nectar and had his devotees, the gods, drink it, he rode away on Garuḍa, O king, in full view of all beings.

    '
8.15.4:
  dutt: 8.15.4
  text: 'Being pleased with him the high-minded Brahmanas, the descendants of Vrigu, having sprinkled him who was desirous of conquering the heaven, made him perform the sacrifice of Viswajit.

    '
  modern: 'The great Brahmins, the descendants of Bhrigu, were pleased with him. They anointed him, since he wanted to conquer heaven, and had him perform the Vishvajit sacrifice.

    '
8.15.5:
  dutt: 8.15.5
  text: 'When a proper oblation of Havi was offered there arose immediately a golden chariot with several yellow steeds like those of Indra and one pennon having the emblem of a lion;

    '
  modern: 'When the oblation was duly offered, at once there rose a golden chariot with yellow horses like Indra''s, and a banner with the emblem of a lion.

    '
8.15.8:
  dutt: 8.15.8
  text: 'Then having ascended the celestial car conferred upon him by Vrigu the mighty car-warrior wore a beautiful garland and put his armour on; and then taking up his bow and dagger placed the quiver (on his back).

    '
  modern: 'He climbed into the divine chariot that Bhrigu had given him, the great warrior. He put on a fine garland and his armour. Then he took up his bow and sword, and slung the quiver on his back.

    '
8.15.11:
  dutt: 8.15.11
  text: 'Thereupon surrounded by the leading Daityas together with their respective armies … Vali, commanding his huge demonaic army, proceeded to the prosperous city of Indra as if shaking the heaven and earth.

    '
  modern: 'Then Vali, surrounded by the leading Daityas and their armies, … led his huge demon army to Indra''s prosperous city, as if he were shaking heaven and earth.

    '
8.15.22:
  dutt: 8.15.22
  text: 'The impious, wicked, cruel, cunning, proud, and lustful and avaricious cannot enter there; only those, who are divorced from all these, can enter there.

    '
  modern: 'The wicked, the cruel, the cunning, the proud, the lustful, and the greedy cannot enter there. Only those free of all these can enter.

    '
8.15.23:
  dutt: 8.15.23
  text: 'The commander (Vali) made encampments all over outside, the city and blew the conch conferred upon him by his preceptor striking terror into the hearts of the celestial damsels.

    '
  modern: 'The army chief camped all around the city. He blew the conch his teacher had given him, and it struck fear into the hearts of the heavenly maidens.

    '
8.15.24:
  dutt: 8.15.24
  text: 'Being informed of the great energy of Vali Indra, accompanied by all the celestials, said to the preceptor:

    '
  modern: 'When Indra learned of Vali''s great effort, he went with all the gods and said this to his teacher:

    '
8.15.25:
  dutt: 8.15.25
  text: 'O thou endued with spiritual wealth, we behold again the energy of our former enemy Vali; methinks, we shall not be able to bear it; why has he been filled with such energy?

    '
  modern: 'O you who have spiritual wealth, we see again the power of our old enemy Vali. I think we cannot bear it. Why has he been filled with such power?

    '
8.15.28:
  dutt: 8.15.28
  text: 'O Maghavan, I know the cause of the advancement of your enemy; he is (their disciple) and has been endued with energy by the descendants of Vrigu conversant with the knowledge of Brahma.

    '
  modern: 'O Maghavan, I know why your enemy has risen. He is their disciple, and the Bhrigu sages, who know Brahman, gave him this power.

    '
8.15.29:
  dutt: 8.15.29
  text: 'Save the Lord Hari, neither thyself nor any one equal to thee shall be able to vanquish the powerful Vali.

    '
  modern: 'Except for the Lord Hari, neither you nor anyone like you can defeat the powerful Vali.

    '
8.15.30:
  dutt: 8.15.30
  text: 'Who shall be able to discomfit him who has been endued with the energy of Brahman? None shall be able to stand before him as people cannot stand before Kritanta.

    '
  modern: 'Who can defeat a man filled with the power of Brahman? No one can stand before him, just as no one can stand before death.

    '
8.15.31:
  dutt: 8.15.31
  text: 'Do ye therefore renouncing heaven live in disguise till the hour of the destruction of (your enemy).

    '
  modern: 'So give up heaven and live in hiding until the time comes when your enemy falls.

    '
8.15.34:
  dutt: 8.15.34
  text: '… and the celestials disappearing, Virochana''s son, reigning in the city of Indra, brought three worlds under subjection.

    '
  modern: '… When the gods had hidden, Virochana''s son ruled Indra''s city and brought the three worlds under his power.

    '
8.16.1:
  dutt: 8.16.1
  speaker: 'The auspicious Suka said:'
  text: 'Her children thus disappearing and the Daityas pilfering the heaven, the mother of the deities, Aditi, bewailed like one having no lord.

    '
  modern: 'Her sons were gone, and the Daityas had taken heaven. The mother of the gods, Aditi, wept like a woman with no protector.

    '
  scan: The scan (india.history.resource.40625, both text layers) reads 'Diti' here, a slip of the printed page or its OCR; Dutt's own contents ('Aditi laments for the disappearance of sons') and the rest of the chapter have Aditi, so it is mended.
8.16.3:
  dutt: 8.16.3
  text: 'O foremost of Kurus! being welcomed and taking his seat, he duly asked his wife of pale countenance, saying:

    '
  modern: 'O best of the Kurus, when he had been welcomed and had taken his seat, he asked his wife, whose face was pale, as was proper.

    '
8.16.10:
  dutt: 8.16.10
  text: 'O high-minded lady! is it all well with thy sons? I perceive from signs that thy mind is not at ease.

    '
  modern: 'O high-minded lady, are all your sons well? I can see from your looks that your mind is troubled.

    '
8.16.15:
  dutt: 8.16.15
  text: 'Do thou think of my well-being, O thou of firm vows; do thou, O lord, protect us who have been deprived of our prosperity and position by the children of my rival.

    '
  modern: 'O you of firm vows, think of my welfare, since I worship you. O Lord, protect us, who have lost our wealth and our place to my rival''s sons.

    '
8.16.17:
  dutt: 8.16.17
  text: '… O sage, O accomplisher of well-being, do thou by thy understanding, do them the good, by which my offspring may regain their wealth, fame, prosperity and position …

    '
  modern: '… O sage, best of those who do good, use your wisdom to do them good, so that my children may win back their wealth, fame, prosperity, and place …

    '
8.16.21:
  dutt: 8.16.21
  text: 'Hari, kind unto the poor, shall grant all thine desires; the adoration of the Divine lord only always leads to success and nothing else—this even is my conviction.

    '
  modern: 'Hari, who is kind to the poor, will grant all your wishes. Worship of the Divine Lord always brings success and nothing else. This is my firm belief.

    '
8.17.1:
  dutt: 8.17.1
  text: 'Being thus instructed by her husband Kacyapa, Aditi, O king, diligently entered upon the observance of this vow extending over twelve days.

    '
  modern: 'O king, Kashyapa told her what to do. Aditi took up the vow of twelve days with care and without slackness.

    '
8.17.3:
  dutt: 8.17.3
  text: 'And centering her entire thought on the reverend Vasudeva, soul of all that is, she observed the Payavrata.

    '
  modern: 'She fixed her whole mind on the revered Vāsudeva, the soul of all. She kept the Payavrata, the milk vow.

    '
8.17.4:
  dutt: 8.17.4
  text: 'Thereat, my child; there appeared before her the mighty primeval male, wearing a yellow attire, having four arms, and bearing the Conch, the Discus, and the Mace.

    '
  modern: 'Then, my child, the mighty primeval Male appeared to her. He wore yellow robes, had four arms, and held the conch, the discus, and the mace.

    '
8.17.5:
  dutt: 8.17.5
  text: 'On beholding him with her very eyes, she, wildered with ecstacy, suddenly, started to her feet, and like a rod bowed her person down to the earth.

    '
  modern: 'When she saw him with her own eyes, she was overcome with joy. She jumped up at once and bowed down flat on the ground.

    '
8.17.12:
  dutt: 8.17.12
  text: 'O mother of the gods, by me hath been known the desire thou hast long indulged concerning thy sons deprived of their good fortune by their enemies, and (ultimately) driven out from their native region.

    '
  modern: 'O mother of the gods, I know the wish you have held for so long: your sons were robbed of their good fortune by their enemies and driven from their home.

    '
8.17.15:
  dutt: 8.17.15
  text: 'And thou wouldst behold thine offspring prosperous and sporting in the celestial regions with their renown and good fortune reclaimed.

    '
  modern: 'You will see your children prosper and play in heaven, with their fame and fortune won back.

    '
8.17.16:
  dutt: 8.17.16
  text: 'But in my opinion, O noble lady, the leaders of the Asura forces cannot at present be brought down; for they are protected by the foremost Vipras, auspicious to them. In such case, prowess can hardly compass (our) desire.

    '
  modern: 'But in my view, noble lady, the leaders of the Asuras cannot be brought down now. The best Brahmins protect them. So force alone will hardly get us what we want.

    '
8.17.17:
  dutt: 8.17.17
  text: 'Still, O noble lady, I ponder over the means of the foe, for it is not fit that the fact of thy having gratified me by observing the vow shall go for nothing. The measure of recompense must sort with the measure of reverence (cherished for me).

    '
  modern: 'Still, noble lady, I am thinking how to beat the enemy. It would not be right for your vow to pleasing me to go for nothing. The reward must match the reverence you showed me.

    '
8.17.18:
  dutt: 8.17.18
  text: 'Having been worshipped by thee with the view of protecting thine offspring, and having been hymned by thee with the observance of the Payavrata I, becoming thy son charged with a portion of my own energy, will protect thy sons, established in the asceticism of Maricha.

    '
  modern: 'You worshipped me to protect your children, and you praised me with the milk vow. So I will become your son, with a part of my own power, and I will protect your sons, settled in the asceticism of Maricha.

    '
8.17.21:
  dutt: 8.17.21
  speaker: 'The auspicious Suka said:'
  text: 'Having delivered himself thus, the mighty one vanished then and there. Then deeming herself as having attained the crown of her existence on account of her bearing in her the Lord Hari—a piece of good luck rare to attain—Aditi …

    '
  modern: 'With these words, the mighty one vanished at once. Aditi felt she had reached the crown of her life, since she carried the Lord Hari within her, a rare good fortune. …

    '
8.18.1:
  dutt: 8.18.1
  text: 'On being thus hymned by Virinchi extolling his prowess and acts, (Hari) having no birth and no death, was born in Aditi, furnished with four arms, bearing the conch, the mace, the lotus, and the discus,—with eyes expansive like lotuses,—clad in an attire having a yellow hue.

    '
  modern: 'When Virinchi had praised his power and deeds, Hari, who has no birth and no death, was born from Aditi. He had four arms and held the conch, the mace, the lotus, and the discus. His eyes were wide like lotuses, and he wore yellow robes.

    '
8.18.12:
  dutt: 8.18.12
  text: 'Before his beholding parents, Hari, of marvellous deeds like an actor, appeared as the dwarf son of a Brahmana in that very body which was instinct with unmanifested consciousness and which manifested itself with brightness, ornaments and weapons.

    '
  modern: 'Before his parents'' eyes, Hari, whose deeds are wonderful, appeared like an actor as a dwarf, the son of a Brahmin. He took this form in the same body that showed brightness, ornaments, and weapons.

    '
8.18.13:
  dutt: 8.18.13
  text: 'Seeing that Dwarf-son of a Brahmana, eminent saints, experiencing the highest joy, heaped rewards on Prajapati, and made him perform the (necessary) rites.

    '
  modern: 'When the great sages saw the dwarf son of a Brahmin, they were filled with joy. They honored Prajapati and had him perform the rites.

    '
8.18.18:
  dutt: 8.18.18
  text: 'Thus honored by all the Brahmana''s son, of great work, looked splendid, surpassing with his Brahma brightness that assembly abounding in Brahmana sages.

    '
  modern: 'Honored by all, the Brahmin''s son, whose work is great, shone. His brightness of Brahman outshone the assembly of Brahmin sages.

    '
8.18.20:
  dutt: 8.18.20
  text: 'Then learning that Vali, attaining great power in consequence of having performed (a great many) horse-sacrifices, prescribed by the Bhrigus was engaged in celebrating a fresh one, he set out for that place, charged with absolute power, and bending the earth at every step.

    '
  modern: 'He learned that Vali, who had grown very powerful through many horse sacrifices laid down by the Bhrigus, was preparing a new one. So he set out for that place, full of power, and at every step he bent the earth.

    '
8.18.25:
  dutt: 8.18.25
  text: '… the Bhrigus, and their disciples, together with the deities of fire, having had their brightness beaten back, suddenly stood up and accorded him a respectful reception.

    '
  modern: '… The Bhrigus and their disciples, and the gods of fire, were outshone. They stood up at once and gave him a respectful welcome.

    '
8.18.27:
  dutt: 8.18.27
  text: '… then giving his welcome dues, Vali worshipped the feet of the mighty ones and then addressed his adorations to that charming one who had snapped the fetters of desire.

    '
  modern: '… Then, after welcoming him, Vali worshipped the feet of the mighty one, and offered his praise to that charming one, who is loved by those who have cut the bonds of desire.

    '
8.18.32:
  dutt: 8.18.32
  text: 'O son of a twice-born one, O Brahmana''s son, do thou receive whatever thou mayst desire. O Vipra''s son, me-thinks thou wishest to have something. O thou eminently entitled to the regard of people, O Vipra, accept kine, or gold, or goodly edifices, or sweet viands or girls, or flourishing villages, or horses or elephants, or cars.

    '
  modern: 'Son of a twice-born, take whatever you want. I think you want something, O Brahmin. Take cows, gold, fine houses, sweet food, girls, prosperous villages, horses, elephants, or chariots.

    '
8.19.3:
  dutt: 8.19.3
  text: 'No such miserly person, devoid of the quality of goodness, has been born in thy family who has either disregarded the twice-borns, or having promised has not given (a thing).

    '
  modern: 'No miser lacking goodness has been born in your family. No one there has ever turned away a Brahmin, or failed to give what he promised.

    '
8.19.14:
  dutt: 8.19.14
  text: 'Thy father the son of the Prahlada, fond of the twice-borns, knowingly conferred, when begged his own lease of life upon the deities assuming the forms of the twice-born ones.

    '
  modern: 'Your father, the son of Prahlāda, who loved the twice-born, knew what he was doing. When he was begged, he gave his own span of life to the gods who had taken the form of Brahmins.

    '
8.19.16:
  dutt: 8.19.16
  text: 'I do beg of thee only a piece of ground, so much as to cover my three foot-steps.

    '
  modern: 'I ask only for a piece of ground the size of three of my steps.

    '
8.19.17:
  dutt: 8.19.17
  text: 'O king of Daityas! O king! I do not beg any thing else of thee, who art liberal and the king of the world; for the learned, if they take what is required, are not visited with sin.

    '
  modern: 'O king of the Daityas, I want nothing else from you, the generous lord of the world. A wise man who takes only what he needs does not sin.

    '
8.19.18:
  dutt: 8.19.18
  speaker: 'Vali said:'
  text: 'Alas! O son of Brahmana, thy words are worthy of the old, thou art a boy and thy ignorant mind is not alive to self-interest.

    '
  modern: 'Alas, son of a Brahmin, your words sound like those of an old man. But you are a boy, and your foolish mind does not see your own interest.

    '
8.19.19:
  dutt: 8.19.19
  text: 'Adoring me with words, who am the king of all the worlds, and who can give away islands thou art begging of me insignificant ground to cover three footsteps.

    '
  modern: 'You praise me, the king of all the worlds, who can give away islands. And yet you beg from me a small patch of ground, three steps wide.

    '
8.19.20:
  dutt: 8.19.20
  text: 'Seeking my refuge no one should beg again, so do thou beg of me sufficient land capable of giving thee livelihood.

    '
  modern: 'No one who has come to my refuge should ask twice. So ask me for enough land to make a living.

    '
8.19.21:
  dutt: 8.19.21
  text: 'O king! all the lovely objects of the world are not capable of satisfying him who has not controlled his senses;

    '
  modern: 'O king, all the pleasant things in the world cannot satisfy a man who has not controlled his senses.

    '
8.19.23:
  dutt: 8.19.23
  text: 'It is heard that Vena''s son, Gaya and other kings who were the lords of the seven islands did not attain to the end of their thirst even by wealth and desired-for objects.

    '
  modern: 'We have heard that Vena''s son, Gaya, and other kings who ruled the seven islands, never reached the end of their thirst, even with wealth and every desired thing.

    '
8.19.26:
  dutt: 8.19.26
  text: 'The effulgence of a Brahmana who is satisfied with what he seeks, increases and it is destroyed by discontentment like by fire water.

    '
  modern: 'A Brahmin who is content with what comes to him grows in brightness. Discontent destroys that brightness, as water-fire would be put out.

    '
8.19.27:
  dutt: 8.19.27
  text: 'Therefore do I beg of thee, who art foremost of these conferring boons, land measuring three footsteps; I shall be contented with this grant satisfying my necessity.

    '
  modern: 'So I ask you, best of givers, for land three steps wide. That will satisfy my need, and I will be content.

    '
8.19.28:
  dutt: 8.19.28
  text: 'Being thus accosted, he (Vali) smiling said: ''Then take what thou desirest!'' and took up the vessel of water for granting land to the dwarf.

    '
  modern: 'Vali smiled and said, ''Then take what you want.'' He took up the water vessel to give the dwarf the land.

    '
8.19.29:
  dutt: 8.19.29
  text: '… apprised of Vishnu''s intention, Usanas, the foremost of those conversant with speech, said to his disciple, the king of Asuras, who was about to confer the earth upon Vishnu.

    '
  modern: '… Uśanas knew what Viṣṇu meant to do. The wisest in speech, he spoke to his pupil, the king of the Asuras, who was about to give the earth to Viṣṇu.

    '
8.19.31:
  dutt: 8.19.31
  text: 'Not knowing the calamity, thou hast promised to confer the land on him; me-thinks there is no well-being for the Daityas—a great disaster is approaching them.

    '
  modern: 'You promised him the land without knowing the danger. I think the Daityas will not prosper. A great disaster is coming to them.

    '
8.19.32:
  dutt: 8.19.32
  text: 'Taking from thee thy kingdom, wealth, effulgence, energy, fame, learning and all, he shall confer them upon Sakra; He is the very Hari under the guise of a dwarf (by virtue of) his illusory powers.

    '
  modern: 'He will take from you your kingdom, wealth, brightness, power, fame, learning, and all you have, and give them to Shakra. He is Hari himself, in the guise of a dwarf, by his power of illusion.

    '
8.20.3:
  dutt: 8.20.3
  speaker: 'Vali said:'
  text: 'Promising unto him that I shall give, how can I, the descendant of Prahlada, for covetousness, disregard the twice-born one like an ordinary cheat;

    '
  modern: 'I promised to give it to him. How can I, a descendant of Prahlāda, out of greed, turn away a twice-born man like a common cheat?

    '
8.20.5:
  dutt: 8.20.5
  text: 'I do not (so much) fear from hell, poverty, the ocean of uneasiness, displacement of position and from death, as I do from enticing the Brahmanas.

    '
  modern: 'I fear hell, poverty, the sea of misery, the loss of my place, and death less than I fear cheating a Brahmin.

    '
8.20.21:
  dutt: 8.20.21
  text: 'The dwarf form of the infinite Hari wonderfully increased, and it, being identical with threefold qualities, in it existed the earth, sky, quarters, heaven, holes, oceans, beasts, birds, celestials and all the Rishis.

    '
  modern: 'The dwarf form of the endless Hari grew to a wonderful size. It was made of the three qualities. In it were the earth, the sky, the quarters, heaven, the holes, the oceans, the beasts, the birds, the gods, and all the Rishis.

    '
8.20.22:
  dutt: 8.20.22
  text: 'In the body identical with threefold qualities of Hari, endued with great spiritual wealth, Vali, along with the preceptor performing Vedic ceremonies and councillors saw the five elements, senses, objects of sense and the universe of three qualities along with creatures.

    '
  modern: 'In the body of Hari, which is made of the three qualities and full of great power, Vali, with the priests and the councillors, saw the five elements, the senses, the objects of sense, and the whole universe of the three qualities, with all its creatures.

    '
8.20.33:
  dutt: 8.20.33
  text: '… engarlanded with a garland of wild flowers accompanied with the humming of the black bees the Divine Lord shone in great brilliance. There-upon with his one foot was occupied the entire land of Vali, with his body the sky and with his two arms the quarters.

    '
  modern: '… Wearing a garland of wild flowers that hummed with black bees, the Divine Lord shone with great brilliance. Then with one foot he covered all of Vali''s land, with his body the sky, and with his two arms the quarters.

    '
8.20.34:
  dutt: 8.20.34
  text: 'His second foot was accomodated by heaven but no room was left for the third. There-upon going above heaven through Maharloka, Tapaloka and Janaloka it reached Satyaloka.

    '
  modern: 'His second foot covered heaven, and there was no room left for the third. Then he went beyond heaven, through Maharloka, Janaloka, and Tapoloka, and it reached Satyaloka.

    '
8.21.29:
  dutt: 8.21.29
  text: 'O Asura! thou hast conferred upon me ground to accomodate my three footsteps—with two the whole earth has been occupied; determine (room) for the third.

    '
  modern: 'O Asura, you gave me ground for three of my steps. With two steps I have covered the whole earth. Find room for the third.

    '
8.21.34:
  dutt: 8.21.34
  text: 'Being proud, thou hast not given me what thou didst promise and rather hast cheated me; in consequence of this untruth thou shouldst for some years live in hell,

    '
  modern: 'You were proud. You did not give me what you promised, and you cheated me. Because of this lie, you must live in hell for some years.

    '
8.22.2:
  dutt: 8.22.2
  speaker: 'Vali said:'
  text: 'O illustrious Lord! O foremost of deities, if thou dost consider my promise as false, I shall satisfy it, and my words shall not prove deceitful; do thou place thy third foot on my head.

    '
  modern: 'O illustrious Lord, O best of gods, if you think my promise was false, I will keep it, and my words will not be a lie. Put your third foot on my head.

    '
8.22.3:
  dutt: 8.22.3
  text: 'I do not fear so much hell, displacement or being bound by a noose, dreadful calamity, pecuniary difficulties or thine unfavourable attitude, as I do a crime.

    '
  modern: 'I do not fear hell, losing my place, being bound by a noose, a dreadful calamity, money troubles, or your displeasure, as much as I fear committing a crime.

    '
8.22.6:
  dutt: 8.22.6
  text: '… by being inimical unto whom many Asuras obtained that Sidhi which the earnest Yogis can only acquire.

    '
  modern: '… By being your enemy, many Asuras gained the perfection that only earnest yogis can win.

    '
8.22.14:
  dutt: 8.22.14
  text: 'Being bound by the noose of Varuna, Vali could not worship him with presents as before; he bowed down his head with tears in his eyes and looked down in shame.

    '
  modern: 'Bound by Varuṇa''s noose, Vali could not honor him with gifts as before. He bowed his head, tears in his eyes, and looked down in shame.

    '
8.22.16:
  dutt: 8.22.16
  text: 'Thou hast not pilfered the most exalted position of Indra thou didst confer on him but hast taken it back only to make it more graceful; methinks, thou hast shown him a great favour, since he has been shorn of wealth which brings about the bewilderment of soul …

    '
  modern: 'You did not steal the high place of Indra that you once gave him. You took it back only to make it finer. I think you have done him a great favor, since he has lost the wealth that confuses the soul. …

    '
8.22.24:
  dutt: 8.22.24
  speaker: 'The lord said:'
  text: 'O Brahman, unto whom I extend favour I take away his wealth, which creates infatuation in a person and by which, he, divorced from humility, shows disregard towards me and all others.

    '
  modern: 'O Brahman, the man I favor, I strip of his wealth. Wealth makes a man lose his humility, so that he looks down on me and on everyone else.

    '
8.22.28:
  dutt: 8.22.28
  text: 'This Danava is the foremost of the Daityas and the enhancer of their fame; he has conquered irrepressible Maya; so, though he is exhausted, he is not infatuated;

    '
  modern: 'This Danava is the best of the Daityas, and he adds to their fame. He has overcome the power of illusion that no one can overcome. So, though he is worn down, he is not deluded.

    '
8.22.31:
  dutt: 8.22.31
  text: 'He has been conferred upon by me a position which it is hard to attain; he has taken my shelter and he shall be Indra in Savarni Manwantara.

    '
  modern: 'I have given him a place that is hard to reach, even for the gods. He has taken refuge in me, and he will be Indra in the Savarni age.

    '
8.22.33:
  dutt: 8.22.33
  speaker: '(He then said to Vali):'
  text: 'O thou having the army like that of Indra, O great king, may good betide thee; do thou, encircled by thy kinsmen, proceed to Sutala which is aspired after even by the celestials.

    '
  modern: 'O you whose army is like Indra''s, O great king, may all go well with you. Go with your kin to Sutala, which even the gods long for.

    '
8.23.9:
  dutt: 8.23.9
  speaker: 'The Lord said:'
  text: 'May good betide thee, O Prahlada—do thou go to Sutala and enhance the delight of thy kinsmen, being in the company of thy grandson.

    '
  modern: 'May good go with you, O Prahlāda. Go to Sutala, and bring joy to your kin, with your grandson at your side.

    '
8.23.10:
  dutt: 8.23.10
  text: 'Thou shalt always behold me stationed there with the mace in my hand; the fetters of action shall be snapped by the delight of thine beholding me.

    '
  modern: 'You will always see me there with the mace in my hand. The bonds of your deeds will be broken by the joy of seeing me.

    '
8.23.19:
  dutt: 8.23.19
  text: 'O king, having thus begged the earth of Vali, in the shape of a dwarf Hari conferred the three worlds upon his brother Indra which had been pilfered by his enemies.

    '
  modern: 'O king, after begging the earth from Vali in the form of a dwarf, Hari gave the three worlds back to his brother Indra, which the enemies had taken.

    '
8.24.5:
  dutt: 8.24.5
  text: 'He, at times, assumes forms being desirous of protecting the kine, Brahmanas, the celestials, Vedas, piety, virtue and wealth.

    '
  modern: 'At times he takes on forms, wanting to protect the cows, the Brahmins, the gods, the Vedas, piety, virtue, and wealth.

    '
8.24.7:
  dutt: 8.24.7
  text: 'O king, when at the end of the past Kalpa, Brahma disappeared in consequence of his sleep, the earth and all other regions were sunk in the ocean.

    '
  modern: 'O king, at the end of the last cycle, Brahmā fell asleep and vanished. The earth and the other worlds were sunk in the ocean.

    '
8.24.8:
  dutt: 8.24.8
  text: 'Hayagriva, the King of Danavas, pilfered the Vedas issuing from the mouth of Brahma while he was lying asleep under the influence of Kala.

    '
  modern: 'While Brahmā lay asleep under the power of time, Hayagriva, king of the Danavas, stole the Vedas that had come from his mouth.

    '
8.24.9:
  dutt: 8.24.9
  text: 'Being apprised of the action of Hayagriva, the king of Danavas, the Lord Hari assumed the form of a fish.

    '
  modern: 'When Hari learned what Hayagriva had done, the king of the Danavas, he took the form of a fish.

    '
8.24.12:
  dutt: 8.24.12
  text: 'Once on a time, while he was offering water (to the river) Kritamala, he obtained one fish from the water in his palms.

    '
  modern: 'Once, as he poured water for his offering in the river Kritamala, a small fish came into his cupped hands.

    '
8.24.17:
  dutt: 8.24.17
  text: 'She so much grew up, in that Kamandalu, in one night that being desirous of releasing herself, she said to the king: …

    '
  modern: 'In one night she grew so big in the pot that she wanted to get out. She said to the king: …

    '
8.24.19:
  dutt: 8.24.19
  text: 'Taking it therefrom he threw it into a big jar full of water; being thrown in it she grew in a moment into the dimension of three cubits.

    '
  modern: 'He took her out and put her in a large jar of water. In a moment she grew to three cubits.

    '
8.24.21:
  dutt: 8.24.21
  text: 'Then, O king, taking her up he again threw her into a tank; she then occupying it with her body assumed the form of a huge fish.

    '
  modern: 'O king, he lifted her again and put her in a tank. She filled the tank and became a huge fish.

    '
8.24.23:
  dutt: 8.24.23
  text: 'Being thus accosted, the king placed her in a deep and inexhaustible lake. And while he was about to throw her growing to the dimension of the lake, into the ocean …

    '
  modern: 'When she said this, the king put her in a deep lake that never ran dry. She grew to the size of the lake, and he was about to throw her into the ocean …

    '
8.24.32:
  dutt: 8.24.32
  speaker: 'The Lord said:'
  text: 'O slayer of enemies, on the seventh day, after this, Bhur, Bhuva and others—all the three regions shall be drowned in the ocean of dissolution.

    '
  modern: 'O slayer of enemies, seven days from now, the three worlds, Bhur, Bhuva, and the rest, will sink in the ocean of dissolution.

    '
8.24.33:
  dutt: 8.24.33
  text: 'O king, when the three worlds will be on the verge of being drowned in the ocean, a huge boat despatched by me shall approach thee.

    '
  modern: 'O king, when the three worlds are about to sink, a huge boat that I send will come to you.

    '
8.24.34:
  dutt: 8.24.34
  text: 'Then taking all sorts of Oshadhis, great and small, encircled by the seven Rishis and with all creatures …

    '
  modern: 'Then take all kinds of herbs, great and small, and go with the seven Rishis and all creatures …

    '
8.24.36:
  dutt: 8.24.36
  text: 'on the boat being shaken by the powerful wind, do thou with a huge serpent tie it to my horns when I shall come there.

    '
  modern: 'When the boat is tossed by the strong wind, tie it to my horn with a great serpent, when I come there.

    '
8.24.37:
  dutt: 8.24.37
  text: 'O lord, as long as the night relating to Brahman shall last, I shall roam about attracting thee with the Rishis in the boat in that ocean of dissolution.

    '
  modern: 'As long as the night of Brahmā lasts, I will move through that ocean of dissolution, pulling you and the Rishis in the boat.

    '
8.24.38:
  dutt: 8.24.38
  text: 'Thou shalt (then) be able to comprehend, in thy mind, my glory spoken of by the Great Brahmana as related by me with reference to thy query.

    '
  modern: 'Then you will understand, in your mind, my glory, as the great Brahmin has told it and as I have told it to answer your question.

    '
8.24.39:
  dutt: 8.24.39
  text: 'Having thus instructed the king, Hari disappeared. He waited for the time of which Hrishikesha spoke.

    '
  modern: 'After he had told the king this, Hari vanished. The king waited for the time that Hrishikesha had named.

    '
8.24.40:
  dutt: 8.24.40
  text: 'Spreading Kusa grass, with his face towards the east, the Royal saint, sat there meditating upon the feet of Hari assuming the form of a fish.

    '
  modern: 'The royal sage spread kusha grass with its tips to the east, faced east, sat down, and meditated on the feet of Hari in the form of a fish.

    '
8.24.41:
  dutt: 8.24.41
  text: 'Thereupon the ocean rose inundating the entire earth—and the dreadful clouds increasing, seemed to be on the point of pouring their contents.

    '
  modern: 'Then the ocean rose and flooded the whole earth. Dreadful clouds gathered and seemed ready to burst.

    '
8.24.42:
  dutt: 8.24.42
  text: 'Thinking of the Lord''s command he espied a boat approaching; taking the ascetics, Oshadhis and creepers, he got up on it.

    '
  modern: 'Remembering the Lord''s command, he saw a boat coming. He took the sages, the herbs, and the creepers, and climbed aboard.

    '
8.24.44:
  dutt: 8.24.44
  text: 'Thereupon being meditated upon by the king, one golden fish, having a horn, and a body extending over ten million of Yojanas, appeared in the great ocean.

    '
  modern: 'When the king meditated on him, a golden fish with one horn appeared in the great ocean. Its body was ten million yojanas long.

    '
8.24.55:
  dutt: 8.24.55
  text: '… communicated unto him … the celestial Purana and Samhita having in it Sankhya Yoga and various works and various secret truths about the self;

    '
  modern: '… He taught him … the divine Purana and Samhita, with Sankhya, Yoga, and many works, and all the secret truths about the self.

    '
8.24.57:
  dutt: 8.24.57
  text: 'Brahma rising at the end of the first dissolution, Hari, slaying the Asura Hayagriva, returned unto him the Vedas;

    '
  modern: 'When Brahmā rose at the end of the first dissolution, Hari killed the Asura Hayagriva and gave the Vedas back to him.

    '
8.24.58:
  dutt: 8.24.58
  text: '… the king Satyavrata being endued with knowledge and discriminative knowledge by the mercy of the Vishnu became the Manu Vivasvata''s son at this Kalpa.

    '
  modern: '… By Viṣṇu''s grace, King Satyavrata gained knowledge and wisdom. In this cycle he became Manu, the son of Vivasvat.

    '
9.10.2:
  dutt: 9.10.2
  text: 'The Vagawan, Vasudeva Hari (who is) full of Brahma being prayed by the Gods, (incarnated Himself) as the son of Dacaratha by dividing (Himself) into four parts; (and) took the names of Rama, Lakshmana, Bharata and Satrughna.

    '
  modern: 'The Lord Vāsudeva Hari, full of Brahman, was asked by the gods. He divided himself into four parts and was born as the son of Dasharatha, with the names Rāma, Lakṣmaṇa, Bharata, and Śatrughna.

    '
9.10.3:
  dutt: 9.10.3
  text: 'O king! the life of the said husband of Sita, repeatedly described by Munis having perfect knowledge of the Infinite, has been heard by you.

    '
  modern: 'O king, you have heard the life of the husband of Sita, which the sages who know the Infinite have told again and again.

    '
9.10.4:
  dutt: 9.10.4
  text: 'May he (Ramachandra) the lord of Kosalas protect us, who, for the promise of his father, went to forest, the weary of whose journey was releived by (his) wife having feet (as tender and delicate as) the lotus and which could not even bear the touch of (her husband''s) palms, (and) by Hanuman and his younger brother; who terrified the ocean by the angry movement of (his) eye-brows occasioned by the separation from his dear wife at Surpanakha having been disfigured; who bridged over the ocean and burnt the wicked forest (such as Ravana and others); …

    '
  modern: 'May Rāma, lord of Kosala, protect us. For his father''s promise he went to the forest. His wife, whose feet were as tender as lotuses and could not bear even the touch of his hands, and Hanuman and his younger brother eased his weary journey. Because Surpanakha was disfigured, he was parted from his dear wife, and his angry frown terrified the ocean. He bridged the ocean and burned the forest of the wicked, Ravana and the rest. …

    '
9.10.8:
  dutt: 9.10.8
  text: 'The said (Ramachandra) together with his wife, obeyed the order of (his) father who had, although hen-pecked, bound (himself) down by the fetters of promise; (and) renouncing the kingdom, wealth, the dear ones, the friends, and the house, repaired to forest (as) the Yogy (gives up his) life.

    '
  modern: 'Rāma, with his wife, obeyed his father''s order. His father had been bound by his promise, though he was ruled by his wife. Rāma gave up the kingdom, the wealth, his dear ones, his friends, and his house. He went to the forest, as a yogi gives up his life.

    '
9.10.11:
  dutt: 9.10.11
  text: 'The daughter of the king of Vaideha (Sita) being (as) stealthily stolen by the debased (Ravana) as the tiger (does, when stealing its prey), Rama separated from (his) wife, roved miserably in the forest followed by (his) brother, as if to teach the world (the lesson) "this is the ultimate fate of those who associate with females."

    '
  modern: 'The debased Ravana stole Sita, the daughter of the king of Videha, as a tiger takes its prey. Rāma lost his wife and wandered the forest in misery, with his brother beside him. It was as if to teach the world: this is the end of those who give themselves to women.

    '
9.10.52:
  dutt: 9.10.52
  text: '… (and though) the second cycle of creation was present (yet the advantages of) the first cycle were enjoyed. … Rama, who was conversant with Dharma and the giver of happiness to all creatures, having accepted sovereignty, …

    '
  modern: '… Though this was the second age, its people enjoyed the blessings of the first. … For Rāma, who knew dharma and brought happiness to all creatures, had taken up the rule …

    '
9.10.54:
  dutt: 9.10.54
  text: 'Rama, the manifestation of Vishnu, having accepted sovereignty, the mental and physical diseases, the effect of of old age, discomfort, misery, bereavement, fear, exhaustion and undesirable death (of people) were removed.

    '
  modern: 'Rāma, the form of Viṣṇu, took up the rule. Mental and bodily disease, old age, discomfort, misery, grief, fear, exhaustion, and early death were removed.

    '
9.10.55:
  dutt: 9.10.55
  text: 'Pure Rama, devoted to one (legitimate) wife taught (his subjects) the character (duties) of an ascetic King and the duties of the house-holder; and practised them himself.

    '
  modern: 'Pure Rāma kept faith with one wife. He taught his people the duties of a king who is also a sage and the duties of a householder, and he lived them himself.

    '
9.11.19:
  dutt: 9.11.19
  text: 'Then Rama having placed his feet pricked with the thorns of Dandaka (forest), on the heart of (the devotees) remembering (the incedent), attained his own (spiritual) illumination.

    '
  modern: 'Then Rāma placed his feet, pricked by the thorns of the Dandaka forest, in the hearts of those who remembered him. He went to his own light.

    '
9.15.12:
  dutt: 9.15.12
  text: 'She (Satyavati) also by reason of great meritorious acts became the river Kausiki which washes away the sin of people. Jamadagni married Renukd, the daughter of Renu.

    '
  modern: 'Because of her great merit, Satyavati became the river Kaushiki, which washes away the sins of people. Jamadagni married Renuka, the daughter of Renu.

    '
9.15.14:
  dutt: 9.15.14
  text: '… of whom the youngest is known as Rama, who is described (by the Munis) as being an incarnation of the Narayana and the determinator of the race of the Haihayas. He (the said Rama) rendered this world devoid of the Kshatriyas seven into three times.

    '
  modern: '… The youngest is called Rāma. The sages say he is an incarnation of Nārāyaṇa, and he ended the line of the Haihayas. He cleared the earth of Kshatriyas twenty-one times.

    '
9.15.18:
  dutt: 9.15.18
  text: '… gained a thousand hands, the quality of being invulnerable in the midst of the enemies, inexhaustible passions, prowess, glory, strength, …

    '
  modern: '… He won a thousand arms. His enemies could not overcome him, and he had unfailing senses, prowess, glory, and strength …

    '
9.15.20:
  dutt: 9.15.20
  text: '(Once on a time) Arjuna maddened with passion, wearing elysium garland and surrounded by the very jewels of women was (engaged at) play in the waters of the Narmada; and impeded (the course of) the river with his (thousand) hands.

    '
  modern: 'Once, Arjuna was drunk with pride. He wore a garland from paradise and was surrounded by the jewels of women. He was playing in the waters of the Narmadā, and he dammed the river with his thousand arms.

    '
9.15.22:
  dutt: 9.15.22
  text: '(Ravana) guilty of that sin committed in the presence of females, was easily imprisoned and kept in custody at Mahismaty (the capital of Arjuna); and by whom (Arjuna), he was set at liberty as a monkey (is let off as being worthless.)

    '
  modern: 'Ravana, guilty of a sin done before women, was easily caught and kept in prison at Mahishmati, the capital of Arjuna. Arjuna let him go, as one lets go of a monkey, as worthless.

    '
9.15.23:
  dutt: 9.15.23
  text: 'Once on a time, the said Arjuna (while) travelling through forests devoid of human beings on a hunting (excursion), willingly entered the hermitage of Jamadagni.

    '
  modern: 'Once, while hunting in a forest with no people in it, Arjuna came to the hermitage of Jamadagni.

    '
9.15.24:
  dutt: 9.15.24
  text: 'The said Muni to whom asceticism was wealth, showed hospitality to that God in man (Arjuna) who was followed by ministers, armies and horses, by a cow of plenty.

    '
  modern: 'The sage, whose wealth was his asceticism, welcomed that god in human form, who came with his ministers, armies, and horses, with a wish-granting cow.

    '
9.15.25:
  dutt: 9.15.25
  text: 'Considering that wealth (the cow of plenty) more valuable than his (own) possessions, he (Arjuna) did not appreciate that hospitality, and with his Haihaya army coveted her (the cow of plenty) the invaluable agent for (success in the) asceticism in which maintenance of a perpetual and sacred fire is necessary.

    '
  modern: 'Arjuna valued the wish-granting cow more than all his own riches. He did not value the hospitality. With his Haihaya army he wanted the cow, which the sage needed for his sacred fire rites.

    '
9.15.26:
  dutt: 9.15.26
  text: 'He (therefore) in his pride, directed his men to steal the cow of plenty belonging to the ascetic. They (the Haihaya army) carried off by force the lowing (cow) and its calf to Mahismati.

    '
  modern: 'In his pride he ordered his men to steal the sage''s wish-granting cow. They took the lowing cow and her calf by force to Mahishmati.

    '
9.15.27:
  dutt: 9.15.27
  text: 'Now as soon as the king (Arjuna) was gone, Rama (Paracurama) returned to the hermitage; and learning of the said oppression of (Arjuna) became angry like the serpent that is hurt.

    '
  modern: 'As soon as the king had left, Rāma (Parashurama) came back to the hermitage. When he learned what Arjuna had done, he flared up like a wounded snake.

    '
9.15.28:
  dutt: 9.15.28
  text: 'Having taken up a terrible axe, armour, and a bow with arrows, followed (Arjuna) as the fearful king of the beasts (lion) follows tiger.

    '
  modern: 'He took up a terrible axe, armor, and bow with arrows, and went after Arjuna, as a fierce lion goes after the leader of a herd.

    '
  departs: 'The Sanskrit has the lion pursue the leader of a herd (yūthapa, an elephant); Dutt has a tiger.

    '
9.15.30:
  dutt: 9.15.30
  text: '(Therefore Arjuna) sent out seventeen millions of terrible soldiers (equipped) with elephants, charriots, horses, clubs, arrows, swords, pikes, daggers, and lances; but Rama (i.e. Parasurama) alone killed the whole army.

    '
  modern: 'Arjuna sent out seventeen million terrible soldiers, with elephants, chariots, horses, clubs, arrows, swords, pikes, daggers, and lances. But Parashurama alone killed the whole army.

    '
9.15.33:
  dutt: 9.15.33
  text: 'Now, the said Arjuna darted at Rama arrows simultaneously (holding) five hundred bows in his (thousand) hands. Rama the foremost of the weilders of weapons, forthwith cut off those (arrows darted by Rama) with his one bow and arrow.

    '
  modern: 'Arjuna shot arrows at Rāma all at once, holding five hundred bows in his thousand hands. Rāma, the best of those who bear weapons, cut them all down at once with his one bow and one arrow.

    '
9.15.34:
  dutt: 9.15.34
  text: 'Then in the battle, Rama with sharpest axes forcibly cut off the (thousand) hands (resembling) the hood of serpents, of Arjuna who was hurrying towards the battle field and throwing with his own hands mountains and trees.

    '
  modern: 'In the battle, Rāma cut off with sharp axes the thousand arms of Arjuna, arms like a serpent''s hood, as Arjuna rushed at him throwing mountains and trees.

    '
9.15.36:
  dutt: 9.15.36
  text: '(Parasurama) the suppressor of enemies, having regained the cow (of plenty) with her calf, (which was as it were) the unavoidable agent in the yajna in which perpetual sacred fire is tobe maintaind, returned to the hermitage and presented the afflicted (cow of plenty) unto his father,

    '
  modern: 'Parashurama, who crushes enemies, took back the cow and her calf. She was needed for the sacrifice that keeps the sacred fire burning. He returned to the hermitage and gave the troubled cow to his father.

    '
9.15.37:
  dutt: 9.15.37
  text: 'Rama related unto his father and brother the said act of his; and listening to that Jamadagni said (as follows).

    '
  modern: 'Rāma told his father and brothers what he had done. When Jamadagni heard it, he spoke:

    '
9.15.38:
  dutt: 9.15.38
  text: 'Oh Rama! Oh Rama! Oh the gloriously armed thou hast committed sin. Thou hast unnecessarily killed the god in man (Arjuna) who is the personification of the all-pervading God.

    '
  modern: 'Rāma, Rāma, mighty-armed one, you have done a sin. You have killed in vain the god in human form, who embodies the all-pervading God.

    '
9.15.39:
  dutt: 9.15.39
  text: 'Oh child! we are Brahmanas. By the (quality of) forbearance, (we have) become objects of veneration. The divine, preceptor of human beings, (Brahma) attained by virtue of which (quality of forbearance) the position of universal veneration.

    '
  modern: 'My child, we are Brahmins. We are honored because of our patience. By patience the divine teacher of humankind, Brahmā, reached his supreme place.

    '
9.15.40:
  dutt: 9.15.40
  text: 'It is on account of forbearance, that Lakshmi of Brahma appears as resplendent as the rays of the sun. The Bhagawan, God Hari becomes easily pleased with the forbearing.

    '
  modern: 'Through patience, the splendor of Brahman shines like the rays of the sun. The Lord Hari is quickly pleased with the patient.

    '
9.15.41:
  dutt: 9.15.41
  text: 'Oh Rama! the taking of life of the king whose mind was consecrated has been more heinous than (that of) the murder of a Brahman. Now expiate this sin by concentrating (thy) mind in Bhagawan and by pilgrimage.

    '
  modern: 'Rāma, to kill a king who has been anointed is worse than killing a Brahmin. Now atone for this sin by fixing your mind on the Lord and by going on pilgrimage.

    '
9.16.1:
  dutt: 9.16.1
  speaker: 'The auspicious Suka said:'
  text: 'Being thus advised by his father, Rama passed a year in pilgrimage, (and then) returned to the hermitage.

    '
  modern: 'His father told him what to do, and Rāma spent a year on pilgrimage. Then he returned to the hermitage.

    '
9.16.10:
  dutt: 9.16.10
  text: 'Once on a time, when Rama with his brothers had gone to forest from the hermitage, (the sons of Arjuna) desirous of avenging themselves (for the murder of their father) found a favourable opportunity and came (to the hermitage).

    '
  modern: 'Once, when Rāma and his brothers had gone from the hermitage to the forest, the sons of Arjuna saw their chance. Wanting revenge for their father''s death, they came to the hermitage.

    '
9.16.11:
  dutt: 9.16.11
  text: 'They who had made up (their) mind to perpetrate that sin, saw the virtuous muni, who had brought his mental faculties to a focus, in the house wherein was blazing the sacrificial fire, (and they) killed him.

    '
  modern: 'They were set on that sin. They saw the virtuous sage, his mind fixed on the Lord, sitting in the house where the sacred fire blazed. They killed him.

    '
9.16.12:
  dutt: 9.16.12
  text: 'Although the mother of Rama plaintively prayed (for the life of the muni), they, who were most cruel and (as it were) the refuse of the Kshatriyas, carried off the head (of the muni) by suddenly cutting it down.

    '
  modern: 'Rāma''s mother begged them for the sage''s life. They were the cruelest, the scum of the Kshatriyas. They cut off his head at once and carried it away.

    '
9.16.13:
  dutt: 9.16.13
  text: 'Renuka the mother of Rama, cast down with sorrow and bereavement began loudly to cry by uttering "Ah my child! Rama! Rama," and hurting herself in various other way.

    '
  modern: 'Renuka, Rāma''s mother, broken by grief and loss, cried loudly, ''Ah, my child! Rāma! Rāma!'' and hurt herself in many ways.

    '
9.16.14:
  dutt: 9.16.14
  text: 'Rama having heard from distance the note of distress, "Oh Rama!" hastened to the hermitage and saw his father killed.

    '
  modern: 'Rāma heard her cry from far off. He hurried to the hermitage and saw his father dead.

    '
9.16.16:
  dutt: 9.16.16
  text: 'Rama having thus bewailed, placed the body of his father near that of his brothers and took up the axe and made up his mind to extirpate the Kshatriyas.

    '
  modern: 'Rāma mourned. He laid his father''s body beside his brothers'', took up his axe, and resolved to wipe out the Kshatriyas.

    '
9.16.17:
  dutt: 9.16.17
  text: 'Oh king! the said Rama having gone to Mahishmati, which the beauty was (already) destroyed for the sin of killing Brahman, built up a high mountain at the centre of the capital, with the heads of the sons of Arjuna;

    '
  modern: 'O king, Rāma went to Mahishmati, whose beauty was already ruined by the sin of killing a Brahmin. In the middle of the city he piled up a high mountain of the heads of Arjuna''s sons.

    '
9.16.19:
  dutt: 9.16.19
  text: '… Parasurama made the earth devoid of the Kshatriyas three into seven times and caused nine lakes of blood (to exist), at the holy place called Samanta Panchaka.

    '
  modern: '… Parashurama cleared the earth of Kshatriyas twenty-one times. He made nine lakes of blood at the holy place called Samanta Panchaka.

    '
9.16.20:
  dutt: 9.16.20
  text: 'Then Rama bringing the head of his father in contact with the body and spreading (the same on) Kusa grass worshipped the God, the universal soul pervading all the Gods.

    '
  modern: 'Then Rāma joined his father''s head to his body, laid them on kusha grass, and worshipped the God who is the soul of all the gods.

    '
9.16.24:
  dutt: 9.16.24
  text: 'The said Jamadagni being worshipped by Rama regained animation his body (existing, as it were) in the recollection and became the seventh saint in the constellation of (the seven) saints.

    '
  modern: 'Rāma worshipped Jamadagni, and Jamadagni came back to life in his memory. He became the seventh of the seven sages in the sky.

    '
9.16.25:
  dutt: 9.16.25
  text: 'O king! the adorable lotus-eyed Rama, the son of Jamadagni, also will in the next grand period of destruction and creation promulgate the Vedas.

    '
  modern: 'O king, the lotus-eyed Rāma, son of Jamadagni, will also teach the Vedas again in the next great age.

    '
9.16.26:
  dutt: 9.16.26
  text: 'The said (Parasurama), who has thrown aside the royal staff, whose intelligence is tranquil and whose character is being sung by the Sidhwas, Gandharvas, and Charanas, is still living on the mount Mahendra.

    '
  modern: 'Parashurama, who has put down his staff and whose mind is calm, still lives on Mount Mahendra. The Siddhas, Gandharvas, and Charanas sing of his deeds.

    '
10.1.17:
  dutt: 10.1.17
  text: When numerous Daityas were born on this earth under the guise of arrogant kings, she (this earth) oppressed under the heavy burthen of their warlike hosts, sought shelter in Brahma.
  modern: When many Daityas were born on earth in the guise of proud kings, the earth, bent under the weight of their armies, went to Brahmā for shelter.
10.1.23:
  dutt: 10.1.23
  text: Ere long, the supreme Purusha himself, the Almighty one, shall be born in the family of Vasudeva. So, let the divine damsels take birth to minister to his comforts.
  modern: Soon the supreme Puruṣa himself, the Almighty, will be born in the house of Vasudeva. Let the divine women be born to serve his pleasure.
10.1.24:
  dutt: 10.1.24
  text: The God Ananta, a portion of the illustrious Vasudeva, his constant companion, and the thousand-mouthed serpent, shall be born in the first instance to perform the favourite acts of Hari.
  modern: The god Ananta, a part of the illustrious Vasudeva and his constant companion, the thousand-headed serpent, will first be born to do Hari's favourite deeds.
10.1.25:
  dutt: 10.1.25
  text: The almighty (goddess of the) illusive energy of Vishnu; capable of paralysing this universe, will also partly incarnate herself, commanded by the Lord to do so, to fulfill his missions on Earth.’
  modern: The almighty goddess, Viṣṇu's illusive power, who can bewilder the whole universe, will also come down in part, commanded by the Lord, to carry out his work on earth.
10.1.26:
  dutt: 10.1.26
  text: Thus speaking unto the immortals, and consoling the goddess of Earth by his speech, the creator, the Lord of the Prajapatis, repaired to his own splendid regions.
  modern: Having spoken thus to the immortals, and comforted the earth with his words, the creator, lord of the Prajāpatis, went back to his own supreme abode.
10.1.27:
  dutt: 10.1.27
  text: In the days of yore, there lived in the city of Mathura a ruler of the Yadus, by name Surashena. This king reigned over Mathura, Surashena and many other countries.
  modern: Long ago, a lord of the Yadus named Śūrasena lived in the city of Mathurā. He ruled Mathurā, Śūrasena and many other lands.
10.1.29:
  dutt: 10.1.29
  text: Once upon a time, Vasudeva a descendant of the kingly line of Suva, married the princess of this city. On the day following the marriage, he, with his newly-married bride by name Devaki, ascended his car to repair to his own residence.
  modern: Once, Vasudeva, a descendant of the royal line of Śūra, married the princess of this city. The day after the wedding, he got into his chariot with his new bride, Devakī, to go home.
10.1.30:
  dutt: 10.1.30
  text: Desirous of pleasing his sister, Kansa the son of Ugrasena (the king of the city), took the reins of the horses of the car, and surrounded by hundreds of golden chariots, drove away.
  modern: Wanting to please his sister, Kaṃsa, son of Ugrasena (the king of the city), took the reins of the horses. Surrounded by hundreds of golden chariots, he drove away.
10.1.34:
  dutt: 10.1.34
  text: 'When Kansa had been driving on the road holding the reins, an incorporeal voice addressing him said: “O ignorant one! the eighth issue of this lady whom thou art even now driving, shall be thy slayer.’'
  modern: 'As Kaṃsa drove on the road holding the reins, a voice from the sky spoke to him: ‘You fool! The eighth child of this woman you are driving will be the one to kill you.’'
10.1.36:
  dutt: 10.1.36
  text: The illustrious Vasudeva, trying to appease that one of disgraceful deeds, of cruel nature, and devoid of bashfulness, said;
  modern: 'Vasudeva, the illustrious one, tried to calm that man of shameful deeds, cruel and shameless. He spoke:'
10.1.37:
  dutt: 10.1.37
  text: ‘Thou art glory to the race of the Bhojas; and the Suras are proud of thy qualifications. It behoveth thee not to kill thy helpless sister, even during the celebration of her marriage-festivities.
  modern: ‘You are the glory of the Bhoja race, and the heroes are proud of your gifts. You should not kill your helpless sister, even during the festivities of her wedding.
10.1.46:
  dutt: 10.1.46
  text: O foremost of the descendants of Kuru inspite of his being advised in concilliatory as well as frightening language, the heartless Kansa, following the examples of the cannibals did not desist (from killing his sister).
  modern: O best of the Kurus, though he was advised with soft words and with threats, the heartless Kaṃsa did not stop (from killing his sister). He kept to the ways of man-eaters.
10.1.47:
  dutt: 10.1.47
  text: Finding him obstinately bent on perpetrating the vile deed, Vasudeva began to think. After a short while he fixed upon this means preventing him (Kansa).
  modern: Seeing that Kaṃsa was set on the vile deed, Vasudeva began to think. After a while he settled on a way to stop him.
10.1.54:
  dutt: 10.1.54
  text: “O most gracious one! thou hast naught to fear from what the incorporeal voice hath spoken to thee. I shall leave to thee all the sons of this lady, who will be the cause of thy fear.”
  modern: “Gentle sir, you have nothing to fear from what the voice said. I will hand over her sons, the ones from whom your fear comes.”
10.1.55:
  dutt: 10.1.55
  text: Perceiving the weight of his (Vasudeva’s) words, Kansa desisted from slaying his relative. Immensely delighted, Vasudeva also entered his own abode, after having eulogised him (Kansa).
  modern: Seeing the force of Vasudeva's words, Kaṃsa gave up killing his relative. Vasudeva, very pleased, praised him and went into his own house.
10.1.66:
  dutt: 10.1.66
  text: Kansa, … confined Devaki and Vasudeva in prison after having bound them in chains. He killed their sons whenever one was born to them, fearing every one of their (sons) to be the unborn Divinity (Vishnu) himself.
  modern: Kaṃsa put Devakī and Vasudeva in prison, bound in chains. Each time a son was born to them, he killed it, fearing that each child was the unborn god Viṣṇu himself.
10.1.69:
  dutt: 10.1.69
  text: Sorely oppressing his own father Ugrasena, and the lords of the Yadus, the Vojas, and the Andhagas that wondrous-powerful being began to rule over the Surasenas.
  modern: He cruelly oppressed his own father Ugrasena and the lords of the Yadus, the Bhojas and the Andhakas. That mighty being began to rule the Śūrasenas.
10.2.1:
  dutt: 10.2.1
  text: The powerful Kansa the great ally of the sovereign of the Magadhas, in company with Pralamva, Chanura, Vaka, Trinavarta, Aghasur, Musthika, Aristha, Divida, Putana, Kesee, Dhenuk, and other Asura kings, as also in company with Vana and Vouma, began to spread havoc among the Yadus.
  modern: Kaṃsa, the mighty ally of the king of Magadha, with Pralamba, Cāṇūra, Baka, Tṛṇāvarta, Aghāsura, Muṣṭika, Ariṣṭa, Dvivida, Pūtanā, Keśī and Dhenuka, and other Asura kings, and with Bāṇa and Bhauma, began to ravage the Yadus.
10.2.2:
  dutt: 10.2.2
  text: (with 10.2.1)
10.2.8:
  dutt: 10.2.8
  text: Devaki beareth in her womb a portion of myself by name Sesha. Taking it out, do thou introduce it in the womb of Rohini.
  modern: Devakī carries in her womb a part of me, called Śeṣa. Take it out and place it in the womb of Rohiṇī.
10.2.9:
  dutt: 10.2.9
  text: O blessed One! then I will be born with fullness of parts, as a son of a Devaki; thou shalt be born in Josodha the wife of Nanda.
  modern: O blessed one, I will be born as Devakī's son with full parts of myself. You will be born to Yaśodā, the wife of Nanda.
10.2.14:
  dutt: 10.2.14
  text: Thus commanded by the Almighty Lord, she, the goddess of the illusive energy, respectfully accepted His words and assented to all of them. Then circumambulating Him she repaired to the terrestrial regions, and performed what she had been told to do.
  modern: Commanded thus by the Lord, she, the goddess of illusion, respectfully accepted his words and agreed to all of them. Then she circled him, went down to the earth, and did what she had been told.
10.2.15:
  dutt: 10.2.15
  text: When the embryo of Devaki had been removed to the womb of Rohini by Yoganidra (the goddess of the illusive energy), the citizens of Mathura cried aloud saying ‘Oh! Devaki has miscarried.’
  modern: When Yoganidrā had moved Devakī's embryo into Rohiṇī's womb, the people of Mathurā cried out, ‘Oh! Devakī has miscarried!’
10.2.18:
  dutt: 10.2.18
  text: Then like unto the eastern quarter bearing the delightful moon, the divine Devaki bore, in her mind,—having duly received it from the son of Sura,—the incarnation of the Deity that never lapseth, the source of all welfare of the worlds, and the essence of all things, and who was present in herself in the form of her soul.
  modern: As the eastern quarter bears the delightful moon, the divine Devakī bore in her mind the part of the Deity that never falls, received from the son of Śūra. He is the source of all welfare, the essence of all things, and was present in her as her own self.
10.2.19:
  dutt: 10.2.19
  text: Devaki, becoming the abode of the Lord, the container of the worlds, did appear to be supremely beautiful; she was confined in prison by Kansa like unto the flame of a lamp confined inside an earthen pot, as also, like unto the chaste goddess of learning mastered by one jealous of imparting knowledge to others.
  modern: Devakī, the abode of the Lord and the vessel of the worlds, looked very beautiful. Kaṃsa kept her shut up in prison, like a flame shut in an earthen pot, or like the chaste goddess of learning held by a man who grudges knowledge to others.
  departs: 'Our Sanskrit says she did not shine (nitarāṃ na reje): her light was hidden while she was shut in Kaṃsa''s house, as the similes of the covered flame and the withheld learning show. Dutt''s ''did appear to be supremely beautiful'' turns it to the opposite. The scan is whole at this line; no ''not'' has been lost.'
10.2.20:
  dutt: 10.2.20
  text: Seeing that lady of pure smiles bearing inside her womb the unconquerable divinity and illuminating the room with her effulgence, Kansa muttered:—‘Surely desirous of robbing me of my life, Hari had taken shelter in the cavity of her womb; for ere now she was not so resplendent.
  modern: 'Seeing the lady with her pure smile, lighting up the room with her glow and carrying the unconquerable god in her womb, Kaṃsa muttered: ‘Surely Hari, who wants my life, has taken shelter in her womb. She was never this bright before.'
10.2.23:
  dutt: 10.2.23
  text: Thus refraining from following his darkest intentions, that mighty being, keeping alive his inveterate enemity, waited for the birth of Hari.
  modern: Turning away from that cruel purpose, the mighty one kept his old hatred alive and waited for the birth of Hari.
10.2.24:
  dutt: 10.2.24
  text: Thinking of Hrishikesha (Krishna) when sitting, or lying, or standing or eating, or drinking or walking, he (Kansa) saw the universe pervaded by Him.
  modern: Sitting, lying, standing, eating, drinking, or walking, Kaṃsa thought of Hṛṣīkeśa (Kṛṣṇa), and he saw the whole world full of him.
10.3.1:
  dutt: 10.3.1
  text: On the advent of a highly delightful season fraught with all blessings—when the asterisk Rohini rode ascendant and when Asvini and other constellations and stars shed a holy light, when the cardinal quarters were all propitious and on the sky shone forth bright stars, when the earth with its towns, countries, pastures and mines, was filled with all benedictions, when rivers over-flowed with pure water, and lakes were beautified with lotuses, when forests rang with the songs of birds and droning of the bee and abounded in floral wealth, … when the hearts of the pious and of others, except Kansa, were enraptured, when, at the time of the birth of that unborn Divinity, kettle-drums were sounded, … when at the birth of Janardana during the gloomy night, … Vishnu, the knower of all hearts, brought himself out of the womb of the divine Devaki, like unto the full moon rising on the Eastern quarter of heaven.
  modern: It was a very pleasant season, full of blessings. The stars Rohiṇī and Aśvinī shone with a holy light. The quarters were clear, the sky was bright with stars, and the earth, with its towns, lands, pastures and mines, was full of good signs. Rivers ran clear, lakes were full of lotuses, and forests rang with the songs of birds and the hum of bees. The hearts of the good were glad, except Kaṃsa's. When the unborn one was born, drums sounded. On a dark night, when Janārdana was born, Viṣṇu, who knows every heart, came out of Devakī's womb like the full moon rising in the east.
10.3.2:
  dutt: 10.3.2
  text: (with 10.3.1)
10.3.3:
  dutt: 10.3.3
  text: (with 10.3.1)
10.3.5:
  dutt: 10.3.5
  text: (with 10.3.1)
10.3.8:
  dutt: 10.3.8
  text: (with 10.3.1)
10.3.9:
  dutt: 10.3.9
  text: Vasudeva saw that wonderful boy (new-born babe) having eyes like lotus petals and four arms, bearing a conch and armed with a mace and other weapons, having the sign of Srivatsa on his breast, and with neck adorned with the Kousthava gem. He saw the boy clad in a blue garment, with a complexion beautiful like that of dense rain-cloud, and with this flowing locks shinning with the rays of the invaluable lapises embossed in his crown and of the gems constituting his pendant; he (Vasudeva) saw him (the boy) with his person set off with a beautiful zone, with bracelets, armlets, and other ornaments.
  modern: Vasudeva saw the wonderful child, with eyes like lotus petals and four arms, holding a conch, a mace and other weapons. The mark of Śrīvatsa was on his breast, and the Kaustubha gem hung at his neck. He wore a blue garment, and his complexion was like a dark rain cloud. His hair flowed, bright with the light of rare lapis lazuli in his crown and of the gems in his pendant. He was set off with a fine belt, bracelets, armlets and other ornaments.
  departs: Our Sanskrit has pītāmbaraṃ, a yellow garment; Dutt prints 'blue garment' (the scan is clear).
10.3.10:
  dutt: 10.3.10
  text: (with 10.3.9)
10.3.12:
  dutt: 10.3.12
  text: O descendant of Bharata! thereafter ascertaining the babe to be the Supreme Purusha, with his body bent forward, his palms folded, his intellect composed and liberated from all terror, and conversant with the prowess of the Lord, Vasudeva began to pray unto Him who lay illuminating the lying-in-room with his effulgence.
  modern: O descendant of Bharata, Vasudeva then knew the child to be the Supreme Person. He bowed low with folded hands and a steady mind, free from fear, and aware of the Lord's power. He began to pray to him, who lay there lighting up the birth room with his glow.
10.3.21:
  dutt: 10.3.21
  text: O Lord of all the regions! O almighty one! desirous of protecting this universe, ‘thou hast’ incarnated thyself in our house. Thou shalt annihilate the mighty army that is being parraded by the innumerable Asura lords, none other than the sovereigns of the earth.
  modern: O Lord of all regions, O Almighty, you have come into our house, wanting to protect this world. You will destroy the army led out by countless Asura lords, who are kings in name only.
10.3.22:
  dutt: 10.3.22
  text: O lord of the celestials! this crooked Kansa, hearing that thou shalt be born in our house, has slain thy elders. He has been informed of thy incarnation by his menials, and ere long shall come here weilding weapons.
  modern: O lord of the gods, this crooked Kaṃsa heard that you would be born in our house, and he has already killed your elder brothers. His servants have told him of your birth, and soon he will come here with weapons in hand.
10.3.23:
  dutt: 10.3.23
  text: Thereupon Devaki, struck with wonder and afraid of Kansa, seeing her son possessed of the signs of the illustrious Lord, began to hymn the Lord thus.
  modern: Then Devakī, amazed and afraid of Kaṃsa, saw her son marked with the signs of the great Lord, and began to praise the Lord in these words.
10.3.29:
  dutt: 10.3.29
  text: O slayer of Madhu! let not the sinful Kansa know of thy birth out of my womb. I am afraid of Kansa on thy account. My mind misgiveth me.
  modern: O slayer of Madhu, do not let the sinful Kaṃsa learn of your birth from my womb. I am afraid of Kaṃsa because of you. My mind is uneasy.
10.3.30:
  dutt: 10.3.30
  text: O essence of the universe! conceal this thy superhuman form, furnished with four arms, and set off with the beauty of thy conch, the discus, the mace and the lotus.
  modern: O soul of the universe, hide this unearthly form with four arms, bright with the conch, the discus, the mace and the lotus.
10.3.47:
  dutt: 10.3.47
  text: When Vasudeva, who had been ordered by the almighty Lord to do so, was on the point of going out of the lying-in-room with his son, at that moment the unborn Yoga Maya, was born out of the womb of the wife of Nanda.
  modern: When Vasudeva, ordered by the Lord, was about to go out of the birth room with his son, at that moment the unborn Yogamāyā was born to the wife of Nanda.
10.3.48:
  dutt: 10.3.48
  text: Then through the agency of this Maya, the senses of the gate-keepers were deprived of the power of discharging their respective functions and the citizens lay unconscious in sleep. When Vasudeva bearing Krishna, came near the door-frames barred with heavy doors secured with iron chains and bolts, the doors flew open out of their own accord like unto darkness flying before the rising sun. The rain-cloud Parjannya poured down showers accompanied by low thunder; protecting Vasudeva from the rains by spreading on him his hood, the serpent Sesha followed him.
  modern: Through her power, the gatekeepers lost the use of their senses, and the people lay unconscious in sleep. When Vasudeva, carrying Kṛṣṇa, came to the doors barred with heavy iron bolts and chains, the doors opened of their own accord, like darkness fleeing before the rising sun. The rain cloud Parjanya poured down with low thunder. The serpent Śeṣa followed him, spreading his hood to keep the rain off Vasudeva.
10.3.49:
  dutt: 10.3.49
  text: (with 10.3.48)
10.3.51:
  dutt: 10.3.51
  text: Repairing to the kingdom of Nanda, Vasudeva saw the cow-herds profoundly asleep through the influence of Yoga Maya. Thereupon placing the babe on the bed of Yashoda and taking with him her daughter, he returned to his room.
  modern: Vasudeva went to Nanda's village. He found the cowherds fast asleep under the spell of Yogamāyā. He laid the boy on Yaśodā's bed, took her daughter, and went back to his room.
10.4.1:
  dutt: 10.4.1
  text: The inner as well as the outer doors became closed of themselves, as before. Thereafter hearing the cries of the babe, the warders of the prison awoke.
  modern: The inner and outer doors shut again by themselves, as before. Hearing the baby's cries, the prison guards woke up.
10.4.2:
  dutt: 10.4.2
  text: Repairing in all haste to the king of the Vojas, they informed him of Devaki’s delivery of a child; which event Kamsa was anxiously looking forward to.
  modern: They hurried to the king of the Bhojas and told him that Devakī had given birth to a child. Kaṃsa had been waiting anxiously for this news.
10.4.3:
  dutt: 10.4.3
  text: Hurriedly arising from his bed, bewildered and thinking that his death-day has come, Kansa speedily came to the lying-in-chamber with faltering steps and with his hair dishevelled.
  modern: Kaṃsa jumped up from his bed, dazed. He thought, ‘This is the day of my death,’ and hurried to the birth room, faltering, with his hair in disorder.
10.4.4:
  dutt: 10.4.4
  text: The divine and chaste lady, now very miserable, most piteously addressed her brother saying :—‘O blessed one! this baby is (will be) thy daughter-in-law. Thou ought not to kill this female child.
  modern: 'Devakī, now in great misery, begged her brother with pity: ‘Good brother, this baby will be your daughter-in-law. You must not kill this girl.'
10.4.8:
  dutt: 10.4.8
  text: Having his affection superseded by self-interest, he seized the new-born daughter of his sister by the feet, and with vehemence dashed her against the surface of a rock.
  modern: Kaṃsa's love had been uprooted by selfishness. He seized his sister's newborn daughter by the feet and dashed her hard against a rock.
10.4.11:
  dutt: 10.4.11
  text: Hymned by the Siddhas, Charanas, Gandharvas, Apsaras, Kinnaras, and serpents, and Adored with various offerings by them, she thus spoke (unto Kansa) —
  modern: Praised by Siddhas, Cāraṇas, Gandharvas, Apsaras, Kinnaras and serpents, who brought many offerings, she spoke to Kaṃsa —
10.4.29:
  dutt: 10.4.29
  text: But scarcely when the night had passed away, Kansa summoning his councillors, said unto them everything that had been said by Yogamaya.
  modern: When that night had passed, Kaṃsa called his advisers and told them everything that Yogamāyā had said.
10.4.31:
  dutt: 10.4.31
  text: … “O foremost of kings! even if it be as thou sayest, we will this day, slay all children above ten days or below, in every city, village, or pasture, or in any other place.
  modern: … ‘O best of kings, even if it is as you say, today we will kill every child under or over ten days old, in every town, village, or pasture, or any other place.
10.4.41:
  dutt: 10.4.41
  text: The Vipras, the kine, the Vedas, religious mortification, truth, quietitude, self-control, reverence, benevolence, forgiveness and sacrifices—these constitute the form of Vishnu.
  modern: 'Brahmins, cows, the Vedas, austerity, truth, self-control, calm, reverence, kindness, forgiveness and sacrifices: these are the form of Viṣṇu.'
10.4.43:
  dutt: 10.4.43
  text: Thus the evil-minded Kansa, holding consultation with his evil councillors considered the persecution of the Brahmanas as the best course open to him. For indeed he was environed by the noose of the Kala.
  modern: So Kaṃsa, the wicked man, took counsel with his wicked advisers and decided that harming the Brahmins was the best course. He was caught in the noose of Time.
10.4.44:
  dutt: 10.4.44
  text: Then delegating the Danavas, who were naturally fond of oppression and who could assume various forms at their will, to all the different quarters of the heavens for the persecution of pious people, he entered into his own apartment.
  modern: He sent out the Dānavas, who loved cruelty and could take any shape, to every quarter of the sky to harass the good. Then he went into his own room.
10.5.1:
  dutt: 10.5.1
  text: Enraptured at the birth of a son, the high-minded Nanda purified with a bath and wearing ornaments, calling the Brahmanas versed in the Vedas, made them at first pronounce benedictions on his (new-born) son and then duly perform the rites to be gone through at the birth of a child, as also the adoration of the ancestral manes and the deities.
  modern: Nanda was overjoyed at the birth of a son. The high-minded man bathed, put on ornaments, and called Brahmins learned in the Vedas. First he had them pronounce blessings on his newborn son. Then he had them duly perform the birth rites, and the worship of the ancestors and the gods.
10.5.2:
  dutt: 10.5.2
  text: (with 10.5.1)
10.5.6:
  dutt: 10.5.6
  text: The whole city of Vraja then shone forth with its doors, courtyards and interiors of houses cleansed and sprinkled with water. It was adorned with variegated pennons and flags, with garlands, pieces of sill raiments, twigs and artificial arches.
  modern: Then the whole town of Vraja shone. Its doors, courtyards and houses were swept and sprinkled with water. It was decked with pennons and flags of many colours, with garlands, pieces of cloth, twigs and arches.
10.5.7:
  dutt: 10.5.7
  text: All the oxen, the heifers and the calves were smeared with oil and turmeric paste. They were also decked with ornaments of valuable metals, peacocks’ feathers, garlands, garments and golden strings.
  modern: All the oxen, heifers and calves were smeared with oil and turmeric paste. They were also decked with ornaments of precious metal, peacock feathers, garlands, cloth and golden strings.
10.5.8:
  dutt: 10.5.8
  text: O king! the cow-herds also, wearing valuable garments and ornaments and beautified with Kanchukas and furnished with turbans, began to come to the royal palace carrying various presents in their hands.
  modern: O king, the cowherds also came to the royal palace. They wore costly clothes and ornaments, jackets and turbans, and each carried gifts in his hands.
10.5.9:
  dutt: 10.5.9
  text: The wives of the cow-herds having heard, that a son had been born to Yashoda, were greatly delighted and began to decorate their persons with garments, ornaments and collyrium.
  modern: The cowherd women heard that a son had been born to Yaśodā. They were glad, and they adorned themselves with clothes, ornaments and collyrium.
10.5.12:
  dutt: 10.5.12
  text: They pronounced benedictions on the baby saying ‘May it live long.’ Then smearing it with turmeric powder and oil and washing it with water, they hymned the unborn Divinity.
  modern: They blessed the baby, saying, ‘May he live long!’ Then they smeared him with turmeric powder and oil, washed him with water, and sang praise to the unborn god.
10.5.18:
  dutt: 10.5.18
  text: Thence forward Vraja, the kingdom of Nanda, was filled with all prosperity. O king! the goddess of prosperity, out of her free will, made it her pleasure garden in consequence of its becoming the abode of Hari.
  modern: From then on, Vraja, Nanda's land, was full of all prosperity. O king, the goddess of fortune, of her own will, made it her pleasure garden, because Hari lived there.
10.6.2:
  dutt: 10.6.2
  text: The infant-destroyer the terrible Putana, having been delegated by Kansa, wandered through cities, villages and pastures killing infants.
  modern: Pūtanā, the terrible killer of infants, sent by Kaṃsa, wandered through towns, villages and pastures, killing babies.
10.6.4:
  dutt: 10.6.4
  text: One night Putana—having the power of moving without restraint and sailing through the skies,—came flying (through the skies) to Gokula and entered into it, disguising herself by her own illusive energy, under the form of a damsel.
  modern: One night Pūtanā, who could move freely and fly through the sky, came flying to Gokula. By her own illusive power she took the form of a young woman and entered the village.
10.6.8:
  dutt: 10.6.8
  text: The essence of the mobile and immobile universe Krishna, knowing her to be a Rakhashi, the slayer of infants, shut his eyes. Then she (Putana) took the destroying Divinity on her lap.
  modern: Kṛṣṇa, the essence of all moving and unmoving things, knew she was a demoness who killed babies, and he closed his eyes. Then she took the god who destroys on her lap.
10.6.10:
  dutt: 10.6.10
  text: The Rakhashi then, placing the child on her lap, put into its mouth her nipple annointed over with virulent poison. Thereupon vehemently squeezing it with both his hands, and waxing irascible, the almighty Lord sucked it with her life.
  modern: The demoness then put her nipple, smeared with deadly poison, into the child's mouth. The Lord pressed it hard with both hands, grew angry, and sucked at it together with her life-breath.
10.6.13:
  dutt: 10.6.13
  text: O monarch! the demoness extremely pained in her breasts and devoid of consciousness, and gaping, and stretching forth her legs and arms and loosening her hair, assumed her true form, and, then fell down on that pasture, like unto Vyritra struck with the thunder-bolt.
  modern: O king, the demoness, in agony at her breasts, lost consciousness. She gaped, stretched out her legs and arms, and loosened her hair. She took her true shape and fell on the pasture, like Vṛtra struck by the thunderbolt.
10.7.4:
  dutt: 10.7.4
  text: One day, when the asterisk that had presided at the birth of the boy Krishna, was founded to ride ascendant, festivities were held in Vraja to celebrate the Uthdutka ceremony (of the boy). Then among the large number of females assembled in the palace, the chaste-hearted Yasodha carried out the rite of bathing her son with the water of the sacred places and rivers; then musical instruments were struck up, songs were sung and Mantras and benedictions were pronounced by the Brahmanas.
  modern: One day, when the star that had presided at Kṛṣṇa's birth rose to the ascendant, there was a festival in Vraja for the Utthānaka rite of the boy. Among the many women gathered in the palace, the chaste Yaśodā bathed her son with water from holy places and rivers. Then instruments played, songs were sung, and the Brahmins chanted mantras and blessings.
10.7.5:
  dutt: 10.7.5
  text: Then when the annointing of her son had been performed and benedictions were pronounced on him by the Vipras duly worshipped with the presentation of edibles, garments and garlands, Yashoda, seeing his (son’s) eyes closing in sleep, carefully laid him down underneath a car.
  modern: After her son was anointed, and the Brahmins had blessed him and been honoured with food, clothes and garlands, Yaśodā saw his eyes closing in sleep. She carefully laid him down under a cart.
10.7.6:
  dutt: 10.7.6
  text: The heart of this highly intelligent lady was anxious on account of the Uthdnika ceremony, and she was occupied in welcoming her guests, the inhabitants of Vraja; so she did not hear the cries of her son. The baby desirous of a suck from his mother’s breast, cried aloud and did not obtain it; he at times threw his legs in the air.
  modern: Yaśodā's mind was on the Utthānika rite, and she was busy welcoming the people of Vraja, so she did not hear her son's cries. The baby wanted to suck his mother's breast. He cried out and could not get it, and at times he kicked his legs in the air.
10.7.7:
  dutt: 10.7.7
  text: Struck with the little feet—delicate like unto the coral—of the babe that was lying under it, the car upturned and fell down. It crushed the pots containing various kinds of delicious liquids, and lay with its wheels, pole and yoke shattered.
  modern: The tiny feet of the baby, soft as coral, struck the cart from below. It tipped over and fell. It smashed the pots of many kinds of rich drink, and it lay there with its wheels, pole and yoke broken.
10.7.10:
  dutt: 10.7.10
  text: The cow-herds did not believe the words spoken by the boys, for, verily they were ignorant of the immeasurable prowess of that boy Krishna.
  modern: The cowherds did not believe the words the boys had spoken. They did not know the immeasurable strength of the boy Kṛṣṇa.
10.7.18:
  dutt: 10.7.18
  text: One day, when the chaste Yasodha, placing her son on her lap, was caressing him, she felt that her child had grown heavy like unto a mountain peak. And she was unable to bear him any longer on her lap.
  modern: One day, as Yaśodā held her son on her lap and was fondling him, she felt that the child had grown heavy like a mountain peak. She could no longer bear him on her lap.
10.7.20:
  dutt: 10.7.20
  text: At that moment, a Daitya Trinavarta by name, a servant of Kansa, being sent by him came in the form of whirl-wind and stole away the child.
  modern: A demon named Tṛṇāvarta, a servant of Kaṃsa, had been sent. He came in the form of a whirlwind and carried off the child.
10.7.28:
  dutt: 10.7.28
  text: On the other hand, being clasped by the neck, the Daitya became powerless and his eyes came out of their sockets. Then giving forth an indistinct groan and deprived of life, he fell down on Vraja with the boy hanging by his neck.
  modern: Gripped by the neck, the demon grew weak, and his eyes came out of their sockets. With a faint groan, lifeless, he fell on Vraja, with the boy still hanging from his neck.
