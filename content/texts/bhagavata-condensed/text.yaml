    iast: "karmaṇā karmanirhāro na hy ātyantika iṣyate | avidvadadhikāritvāt prāyaścittaṃ vimarśanam"
  - id: '6.1.12'
    kind: verse
    lines:
      - "नाश्नतः पथ्यमेवान्नं व्याधयोऽभिभवन्ति हि"
