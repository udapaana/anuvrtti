  - id: '5.10.15'
    kind: verse
    lines:
      - "_* स चापि पाण्डवेय सिन्धुसौवीरपतिस्तत्त्वजिज्ञासायां सम्यक्श्रद्धयाधिकृताधिकारस्तद्धृदयग्रन्थिमोचनं द्विजवच आश्रुत्य बहुयोगग्रन्थसम्मतं त्वरयावरुह्य शिरसा पादमूलमुपसृतः क्षमापयन्विगतनृपदेवस्मय उवाच"
    iast: "_* sa cāpi pāṇḍaveya sindhu-sauvīra-patis tattva-jijñāsāyāṃ samyak-śraddhayādhikṛtādhikāras tad dhṛdaya-granthi-mocanaṃ dvija-vaca āśrutya bahu-yoga-grantha-sammataṃ tvarayāvaruhya śirasā pāda-mūlam upasṛtaḥ kṣamāpayan vigata-nṛpa-deva-smaya uvāca"
  - id: '5.10.19'
    kind: verse
    lines:
      - "अहं च योगेश्वरमात्मतत्त्व विदां मुनीनां परमं गुरुं वै"
      - "प्रष्टुं प्रवृत्तः किमिहारणं तत्साक्षाद्धरिं ज्ञानकलावतीर्णम्"
    iast: "ahaṃ ca yogeśvaram ātma-tattva- vidāṃ munīnāṃ paramaṃ guruṃ vai | praṣṭuṃ pravṛttaḥ kim ihāraṇaṃ tat sākṣād dhariṃ jñāna-kalāvatīrṇam"
  - id: '5.10.20'
    kind: verse
    lines:
      - "स वै भवा लोकनिरीक्षणार्थमव्यक्तलिङ्गो विचरत्यपि स्वित्"
      - "योगेश्वराणां गतिमन्धबुद्धिः कथं विचक्षीत गृहानुबन्धः"
    iast: "sa vai bhavā loka-nirīkṣaṇārtham avyakta-liṅgo vicaraty api svit | yogeśvarāṇāṃ gatim andha-buddhiḥ kathaṃ vicakṣīta gṛhānubandhaḥ"
  - id: '5.10.24'
    kind: verse
    lines:
      - "तन्मे भवान्नरदेवाभिमान मदेन तुच्छीकृतसत्तमस्य"
      - "कृषीष्ट मैत्रीदृशमार्तबन्धो यथा तरे सदवध्यानमंहः"
    iast: "tan me bhavān nara-devābhimāna- madena tucchīkṛta-sattamasya | kṛṣīṣṭa maitrī-dṛśam ārta-bandho yathā tare sad-avadhyānam aṃhaḥ"
  - id: '5.11.8'
    kind: verse
    lines:
      - "गुणानुरक्तं व्यसनाय जन्तोः क्षेमाय नैर्गुण्यमथो मनः स्यात्"
      - "यथा प्रदीपो घृतवर्तिमश्नन्शिखाः सधूमा भजति ह्यन्यदा स्वम्"
      - "पदं तथा गुणकर्मानुबद्धं वृत्तीर्मनः श्रयतेऽन्यत्र तत्त्वम्"
    iast: "guṇānuraktaṃ vyasanāya jantoḥ kṣemāya nairguṇyam atho manaḥ syāt | yathā pradīpo ghṛta-vartim aśnan śikhāḥ sadhūmā bhajati hy anyadā svam | padaṃ tathā guṇa-karmānubaddhaṃ vṛttīr manaḥ śrayate 'nyatra tattvam"
  - id: '5.11.15'
    kind: verse
    lines:
      - "न यावदेतां तनुभृन्नरेन्द्र विधूय मायां वयुनोदयेन"
      - "विमुक्तसङ्गो जितषट्सपत्नो वेदात्मतत्त्वं भ्रमतीह तावत्"
    iast: "na yāvad etāṃ tanu-bhṛn narendra vidhūya māyāṃ vayunodayena | vimukta-saṅgo jita-ṣaṭ-sapatno vedātma-tattvaṃ bhramatīha tāvat"
  - id: '5.11.16'
    kind: verse
    lines:
      - "न यावदेतन्मन आत्मलिङ्गं संसारतापावपनं जनस्य"
      - "यच्छोकमोहामयरागलोभ वैरानुबन्धं ममतां विधत्ते"
    iast: "na yāvad etan mana ātma-liṅgaṃ saṃsāra-tāpāvapanaṃ janasya | yac choka-mohāmaya-rāga-lobha- vairānubandhaṃ mamatāṃ vidhatte"
  - id: '5.11.17'
    kind: verse
    lines:
      - "भ्रातृव्यमेनं तददभ्रवीर्यमुपेक्षयाध्येधितमप्रमत्तः"
      - "गुरोर्हरेश्चरणोपासनास्त्रो जहि व्यलीकं स्वयमात्ममोषम्"
    iast: "bhrātṛvyam enaṃ tad adabhra-vīryam upekṣayādhyedhitam apramattaḥ | guror hareś caraṇopāsanāstro jahi vyalīkaṃ svayam ātma-moṣam"
  - id: '5.12.5'
    kind: verse
    lines:
      - "अयं जनो नाम चलन्पृथिव्यां यः पार्थिवः पार्थिव कस्य हेतोः"
      - "तस्यापि चाङ्घ्र्योरधि गुल्फजङ्घा जानूरुमध्योरशिरोधरांसाः"
    iast: "ayaṃ jano nāma calan pṛthivyāṃ yaḥ pārthivaḥ pārthiva kasya hetoḥ | tasyāpi cāṅghryor adhi gulpha-jaṅghā- jānūru-madhyora-śirodharāṃsāḥ"
  - id: '5.12.6'
    kind: verse
    lines:
      - "अंसेऽधि दार्वी शिबिका च यस्यां सौवीरराजेत्यपदेश आस्ते"
      - "यस्मिन्भवान्रूढनिजाभिमानो राजास्मि सिन्धुष्विति दुर्मदान्धः"
    iast: "aṃse 'dhi dārvī śibikā ca yasyāṃ sauvīra-rājety apadeśa āste | yasmin bhavān rūḍha-nijābhimāno rājāsmi sindhuṣv iti durmadāndhaḥ"
  - id: '5.12.7'
    kind: verse
    lines:
      - "शोच्यानिमांस्त्वमधिकष्टदीनान्विष्ट्या निगृह्णन्निरनुग्रहोऽसि"
      - "जनस्य गोप्तास्मि विकत्थमानो न शोभसे वृद्धसभासु धृष्टः"
    iast: "śocyān imāṃs tvam adhikaṣṭa-dīnān viṣṭyā nigṛhṇan niranugraho 'si | janasya goptāsmi vikatthamāno na śobhase vṛddha-sabhāsu dhṛṣṭaḥ"
  - id: '5.12.12'
    kind: verse
    lines:
      - "रहूगणैतत्तपसा न याति न चेज्यया निर्वपणाद्गृहाद्वा"
      - "न च्छन्दसा नैव जलाग्निसूर्यैर्विना महत्पादरजोऽभिषेकम्"
    iast: "rahūgaṇaitat tapasā na yāti na cejyayā nirvapaṇād gṛhād vā | na cchandasā naiva jalāgni-sūryair vinā mahat-pāda-rajo-'bhiṣekam"
  - id: '5.12.16'
    kind: verse
    lines:
      - "तस्मान्नरोऽसङ्गसुसङ्गजात ज्ञानासिनेहैव विवृक्णमोहः"
      - "हरिं तदीहाकथनश्रुताभ्यां लब्धस्मृतिर्यात्यतिपारमध्वनः"
    iast: "tasmān naro 'saṅga-susaṅga-jāta- jñānāsinehaiva vivṛkṇa-mohaḥ | hariṃ tad-īhā-kathana-śrutābhyāṃ labdha-smṛtir yāty atipāram adhvanaḥ"
  - id: '5.13.20'
    kind: verse
    lines:
      - "रहूगण त्वमपि ह्यध्वनोऽस्य सन्न्यस्तदण्डः कृतभूतमैत्रः"
      - "असज्जितात्मा हरिसेवया शितं ज्ञानासिमादाय तरातिपारम्"
    iast: "rahūgaṇa tvam api hy adhvano 'sya sannyasta-daṇḍaḥ kṛta-bhūta-maitraḥ | asaj-jitātmā hari-sevayā śitaṃ jñānāsim ādāya tarāti-pāram"
  - id: '5.13.24'
    kind: verse
    lines:
      - "Bह्P_०५.१३.०२४ ० श्रीशुक उवाच इत्येवमुत्तरामातः स वै ब्रह्मर्षिसुतः सिन्धुपतय आत्मसतत्त्वं विगणयतः परानुभावः परमकारुणिकतयोपदिश्य रहूगणेन सकरुणमभिवन्दितचरण आपूर्णार्णव इव निभृतकरणोर्म्याशयो धरणिमिमां विचचार"
    iast: "BhP_05.13.024 0 śrī-śuka uvāca ity evam uttarā-mātaḥ sa vai brahmarṣi-sutaḥ sindhu-pataya ātma-satattvaṃ vigaṇayataḥ parānubhāvaḥ parama-kāruṇikatayopadiśya rahūgaṇena sakaruṇam abhivandita-caraṇa āpūrṇārṇava iva nibhṛta-karaṇormy-āśayo dharaṇim imāṃ vicacāra"
  - id: '5.13.25'
    kind: verse
    lines:
      - "_* सौवीरपतिरपि सुजनसमवगतपरमात्मसतत्त्व आत्मन्यविद्याध्यारोपितां च देहात्ममतिं विससर्ज एवं हि नृप भगवदाश्रिताश्रितानुभावः"
    iast: "_* sauvīra-patir api sujana-samavagata-paramātma-satattva ātmany avidyādhyāropitāṃ ca dehātma-matiṃ visasarja evaṃ hi nṛpa bhagavad-āśritāśritānubhāvaḥ"
  - id: '6.1.9'
    kind: verse
    lines:
      - "दृष्टश्रुताभ्यां यत्पापं जानन्नप्यात्मनोऽहितम्"
      - "करोति भूयो विवशः प्रायश्चित्तमथो कथम्"
    iast: "dṛṣṭaśrutābhyāṃ yat pāpaṃ jānannapy ātmano 'hitam | karoti bhūyo vivaśaḥ prāyaścittamatho katham"
  - id: '6.1.11'
    kind: verse
    lines:
      - "कर्मणा कर्मनिर्हारो न ह्यात्यन्तिक इष्यते"
