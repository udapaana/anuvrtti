  - id: '5.10.14'
    kind: verse
    lines:
      - "Bह्P_०५.१०.०१४ ० श्रीशुक उवाच एतावदनुवादपरिभाषया प्रत्युदीर्य मुनिवर उपशमशील उपरतानात्म्यनिमित्त उपभोगेन कर्मारब्धं व्यपनयन्राजयानमपि तथोवाह"
