sections:
  - id: '11.11.29'
    kind: verse
    lines:
      - "कृपालुरकृतद्रोहस्तितिक्षुः सर्वदेहिनाम्"
      - "सत्यसारोऽनवद्यात्मा समः सर्वोपकारकः"
    iast: "kṛpālur akṛta-drohas titikṣuḥ sarva-dehinām | satya-sāro 'navadyātmā samaḥ sarvopakārakaḥ"
  - id: '11.11.30'
    kind: verse
    lines:
      - "कामैरहतधीर्दान्तो मृदुः शुचिरकिञ्चनः"
      - "अनीहो मितभुक्शान्तः स्थिरो मच्छरणो मुनिः"
    iast: "kāmair ahata-dhīr dānto mṛduḥ śucir akiñcanaḥ | anīho mita-bhuk śāntaḥ sthiro mac-charaṇo muniḥ"
  - id: '1.1.1'
    kind: verse
    lines:
      - "जन्माद्यस्य यतोऽन्वयादितरतश्चार्थेष्वभिज्ञः स्वराट्तेने ब्रह्म हृदा य आदिकवये मुह्यन्ति यत्सूरयः"
      - "तेजोवारिमृदां यथा विनिमयो यत्र त्रिसर्गोऽमृषा धाम्ना स्वेन सदा निरस्तकुहकं सत्यं परं धीमहि"
    iast: "janmādyasya yato 'nvayāditarataścārtheṣvabhijñaḥ svarāṭ tene brahma hṛdā ya ādikavaye muhyanti yat sūrayaḥ | tejovārimṛdāṃ yathā vinimayo yatra trisargo 'mṛṣā dhāmnā svena sadā nirastakuhakaṃ satyaṃ paraṃ dhīmahi"
  - id: '1.1.4'
    kind: verse
    lines:
      - "नैमिषेऽनिमिषक्षेत्रे ईशयः शौनकादयः"
      - "सत्रं स्वर्गाय लोकाय सहस्रसममासत"
    iast: "naimiṣe 'nimiṣakṣetre īśayaḥ śaunakādayaḥ | satraṃ svargāya lokāya sahasrasamam āsata"
  - id: '1.1.6'
    kind: verse
    lines:
      - "त्वया खलु पुराणानि सेतिहासानि चानघ"
      - "आख्यातान्यप्यधीतानि धर्मशास्त्राणि यान्युत"
    iast: "tvayā khalu purāṇāni setihāsāni cānagha | ākhyātānyapyadhītāni dharmaśāstrāṇi yānyuta"
  - id: '1.1.9'
    kind: verse
    lines:
      - "तत्र तत्राञ्जसायुष्मन्भवता यद्विनिश्चितम्"
      - "पुंसामेकान्ततः श्रेयस्तन्नः शंसितुमर्हसि"
    iast: "tatra tatrāñjasāyuṣman bhavatā yadviniścitam | puṃsām ekāntataḥ śreyastan naḥ śaṃsitum arhasi"
  - id: '1.1.13'
    kind: verse
    lines:
      - "तन्नः शुष्रूषमाणानामर्हस्यङ्गानुवर्णितुम्"
      - "यस्यावतारो भूतानां क्षेमाय च भवाय च"
    iast: "tan naḥ śuṣrūṣamāṇānām arhasyaṅgānuvarṇitum | yasyāvatāro bhūtānāṃ kṣemāya ca bhavāya ca"
  - id: '1.1.18'
    kind: verse
    lines:
      - "अथाख्याहि हरेर्धीमन्नवतारकथाः शुभाः"
      - "ईला विदधतः स्वैरमीश्वरस्यात्ममायया"
    iast: "athākhyāhi harerdhīmann avatārakathāḥ śubhāḥ | īlā vidadhataḥ svairam īśvarasyātmamāyayā"
  - id: '1.2.1'
    kind: verse
    lines:
      - "इति सम्प्रश्नसंहृष्टो विप्राणां रौमहर्शणिः"
      - "प्रतिपूज्य वचस्तेशां प्रवक्तुमुपचक्रमे"
    iast: "iti sampraśnasaṃhṛṣṭo viprāṇāṃ raumaharśaṇiḥ | pratipūjya vacasteśāṃ pravaktum upacakrame"
  - id: '1.2.5'
    kind: verse
    lines:
      - "मुनयः साधु पृष्टोऽहं भवद्भिर्लोकमङ्गलम्"
      - "यत्कृतः कृष्णसम्प्रश्नो येनात्मा सुप्रसीदति"
    iast: "munayaḥ sādhu pṛṣṭo 'haṃ bhavadbhirlokamaṅgalam | yat kṛtaḥ kṛṣṇasampraśno yenātmā suprasīdati"
  - id: '1.2.6'
    kind: verse
    lines:
      - "स वै पुंसां परो धर्मो यतो भक्तिरधोक्षजे"
      - "अहैतुक्यप्रतिहता ययात्मा सुप्रसीदति"
    iast: "sa vai puṃsāṃ paro dharmo yato bhaktiradhokṣaje | ahaitukyapratihatā yayātmā suprasīdati"
  - id: '1.2.14'
    kind: verse
    lines:
      - "तस्मादेकेन मनसा भगवान्सात्वतां पतिः"
      - "श्रोतव्यः कीर्तितव्यश्च ध्येयः पूज्यश्च नित्यदा"
    iast: "tasmādekena manasā bhagavān sātvatāṃ patiḥ | śrotavyaḥ kīrtitavyaśca dhyeyaḥ pūjyaśca nityadā"
  - id: '1.2.28'
    kind: verse
    lines:
      - "वासुदेवपरा वेदा वासुदेवपरा मखाः"
      - "वासुदेवपरा योग वासुदेवपराः क्रियाः"
    iast: "vāsudevaparā vedā vāsudevaparā makhāḥ | vāsudevaparā yoga vāsudevaparāḥ kriyāḥ"
  - id: '1.2.29'
    kind: verse
    lines:
      - "वासुदेवपरं ज्ञानं वासुदेवपरं तपः"
      - "वासुदेवपरो धर्मो वासुदेवपरा गतिः"
    iast: "vāsudevaparaṃ jñānaṃ vāsudevaparaṃ tapaḥ | vāsudevaparo dharmo vāsudevaparā gatiḥ"
  - id: '1.2.32'
    kind: verse
    lines:
      - "यथा ह्यवहितो वह्निर्दारुष्वेकः स्वयोनिषु"
      - "नानेव भाति विश्वात्मा भूतेषु च तथा पुमान्"
    iast: "yathā hyavahito vahnirdāruṣvekaḥ svayoniṣu | nāneva bhāti viśvātmā bhūteṣu ca tathā pumān"
  - id: '1.3.26'
    kind: verse
    lines:
      - "अवतारा ह्यसङ्ख्येया हरेः सत्त्वनिधेर्द्विजाः"
      - "यथाविदासिनः कुल्याः सरसः स्युः सहस्रशः"
    iast: "avatārā hyasaṅkhyeyā hareḥ sattvanidherdvijāḥ | yathāvidāsinaḥ kulyāḥ sarasaḥ syuḥ sahasraśaḥ"
  - id: '1.3.40'
    kind: verse
    lines:
      - "इदं भागवतं नाम पुराणं ब्रह्मसम्मितम्"
      - "उत्तमश्लोकचरितं चकार भगवानृषिः"
    iast: "idaṃ bhāgavataṃ nāma purāṇaṃ brahmasammitam | uttamaślokacaritaṃ cakāra bhagavān ṛṣiḥ"
  - id: '1.3.42'
    kind: verse
    lines:
      - "सर्ववेदेतिहासानां सारं सारं समुद्धृतम्"
      - "स तु संश्रावयामासमहाराजं परीक्षितम्"
    iast: "sarvavedetihāsānāṃ sāraṃ sāraṃ samuddhṛtam | sa tu saṃśrāvayām āsamahārājaṃ parīkṣitam"
  - id: '1.4.18'
    kind: verse
    lines:
      - "दुर्भगांश्च जनान्वीक्ष्य मुनिर्दिव्येन चक्षुषा"
      - "सर्ववर्णाश्रमाणां यद्दध्यौ हितममोघदृक्"
    iast: "durbhagāṃśca janān vīkṣya munirdivyena cakṣuṣā | sarvavarṇāśramāṇāṃ yaddadhyau hitam amoghadṛk"
  - id: '1.4.28'
    kind: verse
    lines:
      - "धृतव्रतेन हि मया छन्दांसि गुरवोऽग्नयः"
      - "मानिता निर्व्यलीकेन गृहीतं चानुशासनम्"
    iast: "dhṛtavratena hi mayā chandāṃsi guravo 'gnayaḥ | mānitā nirvyalīkena gṛhītaṃ cānuśāsanam"
  - id: '1.4.29'
    kind: verse
    lines:
      - "भारतव्यपदेशेन ह्याम्नायार्थश्च प्रदर्शितः"
      - "दृश्यते यत्र धर्मादि स्त्रीशूद्रादिभिरप्युत"
    iast: "bhāratavyapadeśena hyāmnāyārthaśca pradarśitaḥ | dṛśyate yatra dharmādi strīśūdrādibhirapyuta"
  - id: '1.4.30'
    kind: verse
    lines:
      - "तथापि बत मे दैह्यो ह्यात्मा चैवात्मना विभुः"
      - "असम्पन्न इवाभाति ब्रह्मवर्चस्य सत्तमः"
    iast: "tathāpi bata me daihyo hyātmā caivātmanā vibhuḥ | asampanna ivābhāti brahmavarcasya sattamaḥ"
  - id: '1.4.32'
    kind: verse
    lines:
      - "तस्यैवं खिलमात्मानं मन्यमानस्य खिद्यतः"
      - "कृष्णस्य नारदोऽभ्यागादाश्रमं प्रागुदाहृतम्"
    iast: "tasyaivaṃ khilam ātmānaṃ manyamānasya khidyataḥ | kṛṣṇasya nārado 'bhyāgādāśramaṃ prāg udāhṛtam"
  - id: '1.5.1'
    kind: verse
    lines:
      - "अथ तं सुखमासीन उपासीनं बृहच्छ्रवाः"
      - "देवर्षिः प्राह विप्रर्षिं वीणापाणिः स्मयन्निव"
    iast: "atha taṃ sukham āsīna upāsīnaṃ bṛhacchravāḥ | devarṣiḥ prāha viprarṣiṃ vīṇāpāṇiḥ smayann iva"
  - id: '1.5.3'
    kind: verse
    lines:
      - "जिज्ञासितं सुसम्पन्नमपि ते महदद्भुतम्"
      - "कृतवान्भारतं यस्त्वं सर्वार्थपरिबृंहितम्"
    iast: "jijñāsitaṃ susampannam api te mahadadbhutam | kṛtavān bhārataṃ yastvaṃ sarvārthaparibṛṃhitam"
  - id: '1.5.4'
    kind: verse
    lines:
      - "जिज्ञासितमधीतं च ब्रह्म यत्तत्सनातनम्"
      - "तथापि शोचस्यात्मानमकृतार्थ इव प्रभो"
    iast: "jijñāsitam adhītaṃ ca brahma yat tat sanātanam | tathāpi śocasyātmānam akṛtārtha iva prabho"
  - id: '1.5.5'
    kind: verse
    lines:
      - "अस्त्येव मे सर्वमिदं त्वयोक्तं तथापि नात्मा परितुष्यते मे"
      - "तन्मूलमव्यक्तमगाधबोधं पृच्छामहे त्वात्मभवात्मभूतम्"
    iast: "astyeva me sarvam idaṃ tvayoktaṃ tathāpi nātmā parituṣyate me | tanmūlam avyaktam agādhabodhaṃ pṛcchāmahe tvātmabhavātmabhūtam"
  - id: '1.5.8'
    kind: verse
    lines:
      - "भवतानुदितप्रायं यशो भगवतोऽमलम्"
      - "येनैवासौ न तुष्येत मन्ये तद्दर्शनं खिलम्"
    iast: "bhavatānuditaprāyaṃ yaśo bhagavato 'malam | yenaivāsau na tuṣyeta manye taddarśanaṃ khilam"
  - id: '1.5.9'
    kind: verse
    lines:
      - "यथा धर्मादयश्चार्था मुनिवर्यानुकीर्तिताः"
      - "न तथा वासुदेवस्य महिमा ह्यनुवर्णितः"
    iast: "yathā dharmādayaścārthā munivaryānukīrtitāḥ | na tathā vāsudevasya mahimā hyanuvarṇitaḥ"
  - id: '1.5.11'
    kind: verse
    lines:
      - "तद्वाग्विसर्गो जनताघविप्लवो यस्मिन्प्रतिश्लोकमबद्धवत्यपि"
      - "नामान्यनन्तस्य यशोऽङ्कितानि यत्शृण्वन्ति गायन्ति गृणन्ति साधवः"
    iast: "tadvāgvisargo janatāghaviplavo yasmin pratiślokam abaddhavatyapi | nāmānyanantasya yaśo 'ṅkitāni yat śṛṇvanti gāyanti gṛṇanti sādhavaḥ"
  - id: '1.5.13'
    kind: verse
    lines:
      - "अथो महाभाग भवानमोघदृक्शुचिश्रवाः सत्यरतो धृतव्रतः"
      - "उरुक्रमस्याखिलबन्धमुक्तये समाधिनानुस्मर तद्विचेष्टितम्"
    iast: "atho mahābhāga bhavān amoghadṛk śuciśravāḥ satyarato dhṛtavrataḥ | urukramasyākhilabandhamuktaye samādhinānusmara tadviceṣṭitam"
  - id: '1.5.32'
    kind: verse
    lines:
      - "एतत्संसूचितं ब्रह्मंस्तापत्रयचिकित्सितम्"
      - "यदीश्वरे भगवति कर्म ब्रह्मणि भावितम्"
    iast: "etat saṃsūcitaṃ brahmaṃstāpatrayacikitsitam | yadīśvare bhagavati karma brahmaṇi bhāvitam"
  - id: '1.5.33'
    kind: verse
    lines:
      - "आमयो यश्च भूतानां जायते येन सुव्रत"
      - "तदेव ह्यामयं द्रव्यं न पुनाति चिकित्सितम्"
    iast: "āmayo yaśca bhūtānāṃ jāyate yena suvrata | tadeva hyāmayaṃ dravyaṃ na punāti cikitsitam"
  - id: '1.5.34'
    kind: verse
    lines:
      - "एवं नृणां क्रियायोगाः सर्वे संसृतिहेतवः"
      - "त एवात्मविनाशाय कल्पन्ते कल्पिताः परे"
    iast: "evaṃ nṛṇāṃ kriyāyogāḥ sarve saṃsṛtihetavaḥ | ta evātmavināśāya kalpante kalpitāḥ pare"
  - id: '1.7.3'
    kind: verse
    lines:
      - "तस्मिन्स्व आश्रमे व्यासो बदरीषण्डमण्डिते"
      - "आसीनोऽप उपस्पृश्य प्रणिदध्यौ मनः स्वयम्"
    iast: "tasmin sva āśrame vyāso badarīṣaṇḍamaṇḍite | āsīno 'pa upaspṛśya praṇidadhyau manaḥ svayam"
  - id: '1.7.8'
    kind: verse
    lines:
      - "स संहितां भागवतीं कृत्वानुक्रम्य चात्मजम्"
      - "शुकमध्यापयामास निवृत्तिनिरतं मुनिः"
    iast: "sa saṃhitāṃ bhāgavatīṃ kṛtvānukramya cātmajam | śukam adhyāpayām āsa nivṛttinirataṃ muniḥ"
  - id: '1.15.38'
    kind: verse
    lines:
      - "स्वराट्पौत्रं विनयिनमात्मनः सुसमं गुणैः"
      - "तोयनीव्याः पतिं भूमेरभ्यषिञ्चद्गजाह्वये"
    iast: "svarāṭ pautraṃ vinayinam ātmanaḥ susamaṃ guṇaiḥ | toyanīvyāḥ patiṃ bhūmerabhyaṣiñcadgajāhvaye"
  - id: '1.16.2'
    kind: verse
    lines:
      - "स उत्तरस्य तनयामुपयेम इरावतीम्"
      - "जनमेजयादींश्चतुरस्तस्यामुत्पादयत्सुतान्"
    iast: "sa uttarasya tanayām upayema irāvatīm | janamejayādīṃścaturastasyām utpādayat sutān"
  - id: '1.17.41'
    kind: verse
    lines:
      - "अथैतानि न सेवेत बुभूषुः पुरुषः क्वचित्"
      - "विशेषतो धर्मशीलो राजा लोकपतिर्गुरुः"
    iast: "athaitāni na seveta bubhūṣuḥ puruṣaḥ kvacit | viśeṣato dharmaśīlo rājā lokapatirguruḥ"
  - id: '1.17.42'
    kind: verse
    lines:
      - "वृषस्य नष्टांस्त्रीन्पादान्तपः शौचं दयामिति"
      - "प्रतिसन्दध आश्वास्य महीं च समवर्धयत्"
    iast: "vṛṣasya naṣṭāṃstrīn pādān tapaḥ śaucaṃ dayām iti | pratisandadha āśvāsya mahīṃ ca samavardhayat"
  - id: '1.18.24'
    kind: verse
    lines:
      - "एकदा धनुरुद्यम्य विचरन्मृगयां वने"
      - "मृगाननुगतः श्रान्तः क्षुधितस्तृषितो भृशम्"
    iast: "ekadā dhanurudyamya vicaran mṛgayāṃ vane | mṛgān anugataḥ śrāntaḥ kṣudhitastṛṣito bhṛśam"
  - id: '1.18.27'
    kind: verse
    lines:
      - "विप्रकीर्णजटाच्छन्नं रौरवेणाजिनेन च"
      - "विशुष्यत्तालुरुदकं तथाभूतमयाचत"
    iast: "viprakīrṇajaṭācchannaṃ rauraveṇājinena ca | viśuṣyattālurudakaṃ tathābhūtam ayācata"
  - id: '1.18.28'
    kind: verse
    lines:
      - "अलब्धतृणभूम्यादिरसम्प्राप्तार्घ्यसूनृतः"
      - "अवज्ञातमिवात्मानं मन्यमानश्चुकोप ह"
    iast: "alabdhatṛṇabhūmyādirasamprāptārghyasūnṛtaḥ | avajñātam ivātmānaṃ manyamānaścukopa ha"
  - id: '1.18.29'
    kind: verse
    lines:
      - "अभूतपूर्वः सहसा क्षुत्तृड्भ्यामर्दितात्मनः"
      - "ब्राह्मणं प्रत्यभूद्ब्रह्मन्मत्सरो मन्युरेव च"
    iast: "abhūtapūrvaḥ sahasā kṣuttṛḍbhyām arditātmanaḥ | brāhmaṇaṃ pratyabhūdbrahman matsaro manyureva ca"
  - id: '1.18.30'
    kind: verse
    lines:
      - "स तु ब्रह्मृषेरंसे गतासुमुरगं रुषा"
      - "विनिर्गच्छन्धनुष्कोट्या निधाय पुरमागतः"
    iast: "sa tu brahmaṛṣeraṃse gatāsum uragaṃ ruṣā | vinirgacchan dhanuṣkoṭyā nidhāya puram āgataḥ"
  - id: '1.18.32'
    kind: verse
    lines:
      - "तस्य पुत्रोऽतितेजस्वी विहरन्बालकोऽर्भकैः"
      - "राज्ञाघं प्रापितं तातं श्रुत्वा तत्रेदमब्रवीत्"
    iast: "tasya putro 'titejasvī viharan bālako 'rbhakaiḥ | rājñāghaṃ prāpitaṃ tātaṃ śrutvā tatredam abravīt"
  - id: '1.18.35'
    kind: verse
    lines:
      - "कृष्णे गते भगवति शास्तर्युत्पथगामिनाम्"
      - "तद्भिन्नसेतूनद्याहं शास्मि पश्यत मे बलम्"
    iast: "kṛṣṇe gate bhagavati śāstaryutpathagāminām | tadbhinnasetūn adyāhaṃ śāsmi paśyata me balam"
  - id: '1.18.37'
    kind: verse
    lines:
      - "इति लङ्घितमर्यादं तक्षकः सप्तमेऽहनि"
      - "दङ्क्ष्यति स्म कुलाङ्गारं चोदितो मे ततद्रुहम्"
    iast: "iti laṅghitamaryādaṃ takṣakaḥ saptame 'hani | daṅkṣyati sma kulāṅgāraṃ codito me tatadruham"
  - id: '1.18.41'
    kind: verse
    lines:
      - "निशम्य शप्तमतदर्हं नरेन्द्रं स ब्राह्मणो नात्मजमभ्यनन्दत्"
      - "अहो बतांहो महदद्य ते कृतमल्पीयसि द्रोह उरुर्दमो धृतः"
    iast: "niśamya śaptam atadarhaṃ narendraṃ sa brāhmaṇo nātmajam abhyanandat | aho batāṃho mahadadya te kṛtam alpīyasi droha ururdamo dhṛtaḥ"
  - id: '1.18.46'
    kind: verse
    lines:
      - "धर्मपालो नरपतिः स तु सम्राड्बृहच्छ्रवाः"
      - "साक्षान्महाभागवतो राजर्षिर्हयमेधयाट्"
      - "क्षुत्तृट्श्रमयुतो दीनो नैवास्मच्छापमर्हति"
    iast: "dharmapālo narapatiḥ sa tu samrāḍbṛhacchravāḥ | sākṣān mahābhāgavato rājarṣirhayamedhayāṭ | kṣuttṛṭśramayuto dīno naivāsmac chāpam arhati"
  - id: '1.19.1'
    kind: verse
    lines:
      - "महीपतिस्त्वथ तत्कर्म गर्ह्यं विचिन्तयन्नात्मकृतं सुदुर्मनाः"
      - "अहो मया नीचमनार्यवत्कृतं निरागसि ब्रह्मणि गूढतेजसि"
    iast: "mahīpatistvatha tatkarma garhyaṃ vicintayann ātmakṛtaṃ sudurmanāḥ | aho mayā nīcam anāryavat kṛtaṃ nirāgasi brahmaṇi gūḍhatejasi"
  - id: '1.19.4'
    kind: verse
    lines:
      - "स चिन्तयन्नित्थमथाशृणोद्यथा मुनेः सुतोक्तो निरृतिस्तक्षकाख्यः"
      - "स साधु मेने न चिरेण तक्षका नलं प्रसक्तस्य विरक्तिकारणम्"
    iast: "sa cintayann ittham athāśṛṇodyathā muneḥ sutokto nirṛtistakṣakākhyaḥ | sa sādhu mene na cireṇa takṣakā nalaṃ prasaktasya viraktikāraṇam"
  - id: '1.19.5'
    kind: verse
    lines:
      - "अथो विहायेमममुं च लोकं विमर्शितौ हेयतया पुरस्तात्"
      - "कृष्णाङ्घ्रिसेवामधिमन्यमान उपाविशत्प्रायममर्त्यनद्याम्"
    iast: "atho vihāyemam amuṃ ca lokaṃ vimarśitau heyatayā purastāt | kṛṣṇāṅghrisevām adhimanyamāna upāviśat prāyam amartyanadyām"
  - id: '1.19.7'
    kind: verse
    lines:
      - "इति व्यवच्छिद्य स पाण्डवेयः प्रायोपवेशं प्रति विष्णुपद्याम्"
      - "दधौ मुकुन्दाङ्घ्रिमनन्यभावो मुनिव्रतो मुक्तसमस्तसङ्गः"
    iast: "iti vyavacchidya sa pāṇḍaveyaḥ prāyopaveśaṃ prati viṣṇupadyām | dadhau mukundāṅghrim ananyabhāvo munivrato muktasamastasaṅgaḥ"
  - id: '1.19.8'
    kind: verse
    lines:
      - "तत्रोपजग्मुर्भुवनं पुनाना महानुभावा मुनयः सशिष्याः"
      - "प्रायेण तीर्थाभिगमापदेशैः स्वयं हि तीर्थानि पुनन्ति सन्तः"
    iast: "tatropajagmurbhuvanaṃ punānā mahānubhāvā munayaḥ saśiṣyāḥ | prāyeṇa tīrthābhigamāpadeśaiḥ svayaṃ hi tīrthāni punanti santaḥ"
  - id: '1.19.12'
    kind: verse
    lines:
      - "सुखोपविष्टेष्वथ तेषु भूयः कृतप्रणामः स्वचिकीर्षितं यत्"
      - "विज्ञापयामास विविक्तचेता उपस्थितोऽग्रेऽभिगृहीतपाणिः"
    iast: "sukhopaviṣṭeṣvatha teṣu bhūyaḥ kṛtapraṇāmaḥ svacikīrṣitaṃ yat | vijñāpayām āsa viviktacetā upasthito 'gre 'bhigṛhītapāṇiḥ"
  - id: '1.19.15'
    kind: verse
    lines:
      - "तं मोपयातं प्रतियन्तु विप्रा गङ्गा च देवी धृतचित्तमीशे"
      - "द्विजोपसृष्टः कुहकस्तक्षको वा दशत्वलं गायत विष्णुगाथाः"
    iast: "taṃ mopayātaṃ pratiyantu viprā gaṅgā ca devī dhṛtacittam īśe | dvijopasṛṣṭaḥ kuhakastakṣako vā daśatvalaṃ gāyata viṣṇugāthāḥ"
  - id: '1.19.16'
    kind: verse
    lines:
      - "पुनश्च भूयाद्भगवत्यनन्ते रतिः प्रसङ्गश्च तदाश्रयेषु"
      - "महत्सु यां यामुपयामि सृष्टिं मैत्र्यस्तु सर्वत्र नमो द्विजेभ्यः"
    iast: "punaśca bhūyādbhagavatyanante ratiḥ prasaṅgaśca tadāśrayeṣu | mahatsu yāṃ yām upayāmi sṛṣṭiṃ maitryastu sarvatra namo dvijebhyaḥ"
  - id: '1.19.25'
    kind: verse
    lines:
      - "तत्राभवद्भगवान्व्यासपुत्रो यदृच्छया गामटमानोऽनपेक्षः"
      - "अलक्ष्यलिङ्गो निजलाभतुष्टो वृतश्च बालैरवधूतवेषः"
    iast: "tatrābhavadbhagavān vyāsaputro yadṛcchayā gām aṭamāno 'napekṣaḥ | alakṣyaliṅgo nijalābhatuṣṭo vṛtaśca bālairavadhūtaveṣaḥ"
  - id: '1.19.38'
    kind: verse
    lines:
      - "यच्छ्रोतव्यमथो जप्यं यत्कर्तव्यं नृभिः प्रभो"
      - "स्मर्तव्यं भजनीयं वा ब्रूहि यद्वा विपर्ययम्"
    iast: "yac chrotavyam atho japyaṃ yat kartavyaṃ nṛbhiḥ prabho | smartavyaṃ bhajanīyaṃ vā brūhi yadvā viparyayam"
  - id: '1.19.40'
    kind: verse
    lines:
      - "एवमाभाषितः पृष्टः स राज्ञा श्लक्ष्णया गिरा"
      - "प्रत्यभाषत धर्मज्ञो भगवान्बादरायणिः"
    iast: "evam ābhāṣitaḥ pṛṣṭaḥ sa rājñā ślakṣṇayā girā | pratyabhāṣata dharmajño bhagavān bādarāyaṇiḥ"
  - id: '2.1.1'
    kind: verse
    lines:
      - "वरीयानेष ते प्रश्नः कृतो लोकहितं नृप"
      - "आत्मवित्सम्मतः पुंसां श्रोतव्यादिषु यः परः"
    iast: "varīyān eṣa te praśnaḥ kṛto lokahitaṃ nṛpa | ātmavitsammataḥ puṃsāṃ śrotavyādiṣu yaḥ paraḥ"
  - id: '2.1.2'
    kind: verse
    lines:
      - "श्रोतव्यादीनि राजेन्द्र नृणां सन्ति सहस्रशः"
      - "अपश्यतामात्मतत्त्वं गृहेषु गृहमेधिनाम्"
    iast: "śrotavyādīni rājendra nṛṇāṃ santi sahasraśaḥ | apaśyatām ātmatattvaṃ gṛheṣu gṛhamedhinām"
  - id: '2.1.5'
    kind: verse
    lines:
      - "तस्माद्भारत सर्वात्मा भगवानीश्वरो हरिः"
      - "श्रोतव्यः कीर्तितव्यश्च स्मर्तव्यश्चेच्छताभयम्"
    iast: "tasmādbhārata sarvātmā bhagavān īśvaro hariḥ | śrotavyaḥ kīrtitavyaśca smartavyaścecchatābhayam"
  - id: '2.1.14'
    kind: verse
    lines:
      - "तवाप्येतर्हि कौरव्य सप्ताहं जीवितावधिः"
      - "उपकल्पय तत्सर्वं तावद्यत्साम्परायिकम्"
    iast: "tavāpyetarhi kauravya saptāhaṃ jīvitāvadhiḥ | upakalpaya tat sarvaṃ tāvadyat sāmparāyikam"
  - id: '2.1.15'
    kind: verse
    lines:
      - "अन्तकाले तु पुरुष आगते गतसाध्वसः"
      - "छिन्द्यादसङ्गशस्त्रेण स्पृहां देहेऽनु ये च तम्"
    iast: "antakāle tu puruṣa āgate gatasādhvasaḥ | chindyādasaṅgaśastreṇa spṛhāṃ dehe 'nu ye ca tam"
  - id: '2.6.37'
    kind: verse
    lines:
      - "यस्यावतारकर्माणि गायन्ति ह्यस्मदादयः"
      - "न यं विदन्ति तत्त्वेन तस्मै भगवते नमः"
    iast: "yasyāvatārakarmāṇi gāyanti hyasmadādayaḥ | na yaṃ vidanti tattvena tasmai bhagavate namaḥ"
  - id: '2.6.39'
    kind: verse
    lines:
      - "विशुद्धं केवलं ज्ञानं प्रत्यक्सम्यगवस्थितम्"
      - "सत्यं पूर्णमनाद्यन्तं निर्गुणं नित्यमद्वयम्"
    iast: "viśuddhaṃ kevalaṃ jñānaṃ pratyak samyag avasthitam | satyaṃ pūrṇam anādyantaṃ nirguṇaṃ nityam advayam"
  - id: '2.6.44'
    kind: verse
    lines:
      - "यत्किञ्च लोके भगवन्महस्वदोजःसहस्वद्बलवत्क्षमावत्"
      - "श्रीह्रीविभूत्यात्मवदद्भुतार्णं तत्त्वं परं रूपवदस्वरूपम्"
    iast: "yat kiñca loke bhagavan mahasvad ojaḥsahasvadbalavat kṣamāvat | śrīhrīvibhūtyātmavadadbhutārṇaṃ tattvaṃ paraṃ rūpavadasvarūpam"
  - id: '2.6.45'
    kind: verse
    lines:
      - "प्राधान्यतो यानृष आमनन्ति लीलावतारान्पुरुषस्य भूम्नः"
      - "आपीयतां कर्णकषायशोषाननुक्रमिष्ये त इमान्सुपेशान्"
    iast: "prādhānyato yān ṛṣa āmananti līlāvatārān puruṣasya bhūmnaḥ | āpīyatāṃ karṇakaṣāyaśoṣān anukramiṣye ta imān supeśān"
  - id: '3.5.23'
    kind: verse
    lines:
      - "भगवानेक आसेदमग्र आत्मात्मनां विभुः"
      - "आत्मेच्छानुगतावात्मा नानामत्युपलक्षणः"
    iast: "bhagavān eka āsedam agra ātmātmanāṃ vibhuḥ | ātmecchānugatāv ātmā nānā-maty-upalakṣaṇaḥ"
  - id: '3.5.25'
    kind: verse
    lines:
      - "सा वा एतस्य संद्रष्टुः शक्तिः सदसदात्मिका"
      - "माया नाम महाभाग ययेदं निर्ममे विभुः"
    iast: "sā vā etasya saṃdraṣṭuḥ śaktiḥ sad-asad-ātmikā | māyā nāma mahā-bhāga yayedaṃ nirmame vibhuḥ"
  - id: '3.8.10'
    kind: verse
    lines:
      - "उदाप्लुतं विश्वमिदं तदासीद्यन्निद्रयामीलितदृङ्न्यमीलयत्"
      - "अहीन्द्रतल्पेऽधिशयान एकः कृतक्षणः स्वात्मरतौ निरीहः"
    iast: "udāplutaṃ viśvam idaṃ tadāsīd yan nidrayāmīlita-dṛṅ nyamīlayat | ahīndra-talpe 'dhiśayāna ekaḥ kṛta-kṣaṇaḥ svātma-ratau nirīhaḥ"
  - id: '3.8.11'
    kind: verse
    lines:
      - "सोऽन्तः शरीरेऽर्पितभूतसूक्ष्मः कालात्मिकां शक्तिमुदीरयाणः"
      - "उवास तस्मिन्सलिले पदे स्वे यथानलो दारुणि रुद्धवीर्यः"
    iast: "so 'ntaḥ śarīre 'rpita-bhūta-sūkṣmaḥ kālātmikāṃ śaktim udīrayāṇaḥ | uvāsa tasmin salile pade sve yathānalo dāruṇi ruddha-vīryaḥ"
  - id: '3.8.13'
    kind: verse
    lines:
      - "तस्यार्थसूक्ष्माभिनिविष्टदृष्टेरन्तर्गतोऽर्थो रजसा तनीयान्"
      - "गुणेन कालानुगतेन विद्धः सूष्यंस्तदाभिद्यत नाभिदेशात्"
    iast: "tasyārtha-sūkṣmābhiniviṣṭa-dṛṣṭer antar-gato 'rtho rajasā tanīyān | guṇena kālānugatena viddhaḥ sūṣyaṃs tadābhidyata nābhi-deśāt"
  - id: '3.8.14'
    kind: verse
    lines:
      - "स पद्मकोशः सहसोदतिष्ठत्कालेन कर्मप्रतिबोधनेन"
      - "स्वरोचिषा तत्सलिलं विशालं विद्योतयन्नर्क इवात्मयोनिः"
    iast: "sa padma-kośaḥ sahasodatiṣṭhat kālena karma-pratibodhanena | sva-rociṣā tat salilaṃ viśālaṃ vidyotayann arka ivātma-yoniḥ"
  - id: '3.8.15'
    kind: verse
    lines:
      - "तल्लोकपद्मं स उ एव विष्णुः प्रावीविशत्सर्वगुणावभासम्"
      - "तस्मिन्स्वयं वेदमयो विधाता स्वयम्भुवं यं स्म वदन्ति सोऽभूत्"
    iast: "tal loka-padmaṃ sa u eva viṣṇuḥ prāvīviśat sarva-guṇāvabhāsam | tasmin svayaṃ vedamayo vidhātā svayambhuvaṃ yaṃ sma vadanti so 'bhūt"
  - id: '3.8.21'
    kind: verse
    lines:
      - "ततो निवृत्तोऽप्रतिलब्धकामः स्वधिष्ण्यमासाद्य पुनः स देवः"
      - "शनैर्जितश्वासनिवृत्तचित्तो न्यषीददारूढसमाधियोगः"
    iast: "tato nivṛtto 'pratilabdha-kāmaḥ sva-dhiṣṇyam āsādya punaḥ sa devaḥ | śanair jita-śvāsa-nivṛtta-citto nyaṣīdad ārūḍha-samādhi-yogaḥ"
  - id: '3.8.23'
    kind: verse
    lines:
      - "मृणालगौरायतशेषभोग पर्यङ्क एकं पुरुषं शयानम्"
      - "फणातपत्रायुतमूर्धरत्न द्युभिर्हतध्वान्तयुगान्ततोये"
    iast: "mṛṇāla-gaurāyata-śeṣa-bhoga- paryaṅka ekaṃ puruṣaṃ śayānam | phaṇātapatrāyuta-mūrdha-ratna- dyubhir hata-dhvānta-yugānta-toye"
  - id: '3.8.33'
    kind: verse
    lines:
      - "स कर्मबीजं रजसोपरक्तः प्रजाः सिसृक्षन्नियदेव दृष्ट्वा"
      - "अस्तौद्विसर्गाभिमुखस्तमीड्यमव्यक्तवर्त्मन्यभिवेशितात्मा"
    iast: "sa karma-bījaṃ rajasoparaktaḥ prajāḥ sisṛkṣann iyad eva dṛṣṭvā | astaud visargābhimukhas tam īḍyam avyakta-vartmany abhiveśitātmā"
  - id: '3.9.2'
    kind: verse
    lines:
      - "रूपं यदेतदवबोधरसोदयेन शश्वन्निवृत्ततमसः सदनुग्रहाय"
      - "आदौ गृहीतमवतारशतैकबीजं यन्नाभिपद्मभवनादहमाविरासम्"
    iast: "rūpaṃ yad etad avabodha-rasodayena śaśvan-nivṛtta-tamasaḥ sad-anugrahāya | ādau gṛhītam avatāra-śataika-bījaṃ yan-nābhi-padma-bhavanād aham āvirāsam"
  - id: '3.9.3'
    kind: verse
    lines:
      - "नातः परं परम यद्भवतः स्वरूपमानन्दमात्रमविकल्पमविद्धवर्चः"
      - "पश्यामि विश्वसृजमेकमविश्वमात्मन्भूतेन्द्रियात्मकमदस्त उपाश्रितोऽस्मि"
    iast: "nātaḥ paraṃ parama yad bhavataḥ svarūpam ānanda-mātram avikalpam aviddha-varcaḥ | paśyāmi viśva-sṛjam ekam aviśvam ātman bhūtendriyātmaka-madas ta upāśrito 'smi"
  - id: '3.9.22'
    kind: verse
    lines:
      - "सोऽयं समस्तजगतां सुहृदेक आत्मा सत्त्वेन यन्मृडयते भगवान्भगेन"
      - "तेनैव मे दृशमनुस्पृशताद्यथाहं स्रक्ष्यामि पूर्ववदिदं प्रणतप्रियोऽसौ"
    iast: "so 'yaṃ samasta-jagatāṃ suhṛd eka ātmā sattvena yan mṛḍayate bhagavān bhagena | tenaiva me dṛśam anuspṛśatād yathāhaṃ srakṣyāmi pūrvavad idaṃ praṇata-priyo 'sau"
  - id: '3.9.23'
    kind: verse
    lines:
      - "एष प्रपन्नवरदो रमयात्मशक्त्या यद्यत्करिष्यति गृहीतगुणावतारः"
      - "तस्मिन्स्वविक्रममिदं सृजतोऽपि चेतो युञ्जीत कर्मशमलं च यथा विजह्याम्"
    iast: "eṣa prapanna-varado ramayātma-śaktyā yad yat kariṣyati gṛhīta-guṇāvatāraḥ | tasmin sva-vikramam idaṃ sṛjato 'pi ceto yuñjīta karma-śamalaṃ ca yathā vijahyām"
  - id: '3.9.29'
    kind: verse
    lines:
      - "मा वेदगर्भ गास्तन्द्रीं सर्ग उद्यममावह"
      - "तन्मयापादितं ह्यग्रे यन्मां प्रार्थयते भवान्"
    iast: "mā veda-garbha gās tandrīṃ sarga udyamam āvaha | tan mayāpāditaṃ hy agre yan māṃ prārthayate bhavān"
  - id: '3.9.34'
    kind: verse
    lines:
      - "नानाकर्मवितानेन प्रजा बह्वीः सिसृक्षतः"
      - "नात्मावसीदत्यस्मिंस्ते वर्षीयान्मदनुग्रहः"
    iast: "nānā-karma-vitānena prajā bahvīḥ sisṛkṣataḥ | nātmāvasīdaty asmiṃs te varṣīyān mad-anugrahaḥ"
  - id: '3.9.42'
    kind: verse
    lines:
      - "अहमात्मात्मनां धातः प्रेष्ठः सन्प्रेयसामपि"
      - "अतो मयि रतिं कुर्याद्देहादिर्यत्कृते प्रियः"
    iast: "aham ātmātmanāṃ dhātaḥ preṣṭhaḥ san preyasām api | ato mayi ratiṃ kuryād dehādir yat-kṛte priyaḥ"
  - id: '3.9.43'
    kind: verse
    lines:
      - "सर्ववेदमयेनेदमात्मनात्मात्मयोनिना"
      - "प्रजाः सृज यथापूर्वं याश्च मय्यनुशेरते"
    iast: "sarva-veda-mayenedam ātmanātmātma-yoninā | prajāḥ sṛja yathā-pūrvaṃ yāś ca mayy anuśerate"
  - id: '3.10.7'
    kind: verse
    lines:
      - "तद्विलोक्य वियद्व्यापि पुष्करं यदधिष्ठितम्"
      - "अनेन लोकान्प्राग्लीनान्कल्पितास्मीत्यचिन्तयत्"
    iast: "tad vilokya viyad-vyāpi puṣkaraṃ yad-adhiṣṭhitam | anena lokān prāg-līnān kalpitāsmīty acintayat"
  - id: '3.13.16'
    kind: verse
    lines:
      - "परमेष्ठी त्वपां मध्ये तथा सन्नामवेक्ष्य गाम्"
      - "कथमेनां समुन्नेष्य इति दध्यौ धिया चिरम्"
    iast: "parameṣṭhī tv apāṃ madhye tathā sannām avekṣya gām | katham enāṃ samunneṣya iti dadhyau dhiyā ciram"
  - id: '3.13.17'
    kind: verse
    lines:
      - "सृजतो मे क्षितिर्वार्भिः प्लाव्यमाना रसां गता"
      - "अथात्र किमनुष्ठेयमस्माभिः सर्गयोजितैः"
      - "यस्याहं हृदयादासं स ईशो विदधातु मे"
    iast: "sṛjato me kṣitir vārbhiḥ plāvyamānā rasāṃ gatā | athātra kim anuṣṭheyam asmābhiḥ sarga-yojitaiḥ | yasyāhaṃ hṛdayād āsaṃ sa īśo vidadhātu me"
  - id: '3.13.18'
    kind: verse
    lines:
      - "इत्यभिध्यायतो नासा विवरात्सहसानघ"
      - "वराहतोको निरगादङ्गुष्ठपरिमाणकः"
    iast: "ity abhidhyāyato nāsā- vivarāt sahasānagha | varāha-toko niragād aṅguṣṭha-parimāṇakaḥ"
  - id: '3.13.28'
    kind: verse
    lines:
      - "घ्राणेन पृथ्व्याः पदवीं विजिघ्रन्क्रोडापदेशः स्वयमध्वराङ्गः"
      - "करालदंष्ट्रोऽप्यकरालदृग्भ्यामुद्वीक्ष्य विप्रान्गृणतोऽविशत्कम्"
    iast: "ghrāṇena pṛthvyāḥ padavīṃ vijighran kroḍāpadeśaḥ svayam adhvarāṅgaḥ | karāla-daṃṣṭro 'py akarāla-dṛgbhyām udvīkṣya viprān gṛṇato 'viśat kam"
  - id: '3.13.32'
    kind: verse
    lines:
      - "स्वदंष्ट्रयोद्धृत्य महीं निमग्नां स उत्थितः संरुरुचे रसायाः"
      - "तत्रापि दैत्यं गदयापतन्तं सुनाभसन्दीपिततीव्रमन्युः"
    iast: "sva-daṃṣṭrayoddhṛtya mahīṃ nimagnāṃ sa utthitaḥ saṃruruce rasāyāḥ | tatrāpi daityaṃ gadayāpatantaṃ sunābha-sandīpita-tīvra-manyuḥ"
  - id: '3.13.33'
    kind: verse
    lines:
      - "जघान रुन्धानमसह्यविक्रमं स लीलयेभं मृगराडिवाम्भसि"
      - "तद्रक्तपङ्काङ्कितगण्डतुण्डो यथा गजेन्द्रो जगतीं विभिन्दन्"
    iast: "jaghāna rundhānam asahya-vikramaṃ sa līlayebhaṃ mṛgarāḍ ivāmbhasi | tad-rakta-paṅkāṅkita-gaṇḍa-tuṇḍo yathā gajendro jagatīṃ vibhindan"
  - id: '3.13.34'
    kind: verse
    lines:
      - "तमालनीलं सितदन्तकोट्या क्ष्मामुत्क्षिपन्तं गजलीलयाङ्ग"
      - "प्रज्ञाय बद्धाञ्जलयोऽनुवाकैर्विरिञ्चिमुख्या उपतस्थुरीशम्"
    iast: "tamāla-nīlaṃ sita-danta-koṭyā kṣmām utkṣipantaṃ gaja-līlayāṅga | prajñāya baddhāñjalayo 'nuvākair viriñci-mukhyā upatasthur īśam"
  - id: '3.13.48'
    kind: verse
    lines:
      - "स इत्थं भगवानुर्वीं विष्वक्सेनः प्रजापतिः"
      - "रसाया लीलयोन्नीतामप्सु न्यस्य ययौ हरिः"
    iast: "sa itthaṃ bhagavān urvīṃ viṣvaksenaḥ prajāpatiḥ | rasāyā līlayonnītām apsu nyasya yayau hariḥ"
  - id: '3.21.6'
    kind: verse
    lines:
      - "प्रजाः सृजेति भगवान्कर्दमो ब्रह्मणोदितः"
      - "सरस्वत्यां तपस्तेपे सहस्राणां समा दश"
    iast: "prajāḥ sṛjeti bhagavān kardamo brahmaṇoditaḥ | sarasvatyāṃ tapas tepe sahasrāṇāṃ samā daśa"
  - id: '3.21.7'
    kind: verse
    lines:
      - "ततः समाधियुक्तेन क्रियायोगेन कर्दमः"
      - "सम्प्रपेदे हरिं भक्त्या प्रपन्नवरदाशुषम्"
    iast: "tataḥ samādhi-yuktena kriyā-yogena kardamaḥ | samprapede hariṃ bhaktyā prapanna-varadāśuṣam"
  - id: '3.21.8'
    kind: verse
    lines:
      - "तावत्प्रसन्नो भगवान्पुष्कराक्षः कृते युगे"
      - "दर्शयामास तं क्षत्तः शाब्दं ब्रह्म दधद्वपुः"
    iast: "tāvat prasanno bhagavān puṣkarākṣaḥ kṛte yuge | darśayām āsa taṃ kṣattaḥ śābdaṃ brahma dadhad vapuḥ"
  - id: '3.21.26'
    kind: verse
    lines:
      - "स चेह विप्र राजर्षिर्महिष्या शतरूपया"
      - "आयास्यति दिदृक्षुस्त्वां परश्वो धर्मकोविदः"
    iast: "sa ceha vipra rājarṣir mahiṣyā śatarūpayā | āyāsyati didṛkṣus tvāṃ paraśvo dharma-kovidaḥ"
  - id: '3.21.27'
    kind: verse
    lines:
      - "आत्मजामसितापाङ्गीं वयःशीलगुणान्विताम्"
      - "मृगयन्तीं पतिं दास्यत्यनुरूपाय ते प्रभो"
    iast: "ātmajām asitāpāṅgīṃ vayaḥ-śīla-guṇānvitām | mṛgayantīṃ patiṃ dāsyaty anurūpāya te prabho"
  - id: '3.21.37'
    kind: verse
    lines:
      - "तस्मिन्सुधन्वन्नहनि भगवान्यत्समादिशत्"
      - "उपायादाश्रमपदं मुनेः शान्तव्रतस्य तत्"
    iast: "tasmin sudhanvann ahani bhagavān yat samādiśat | upāyād āśrama-padaṃ muneḥ śānta-vratasya tat"
  - id: '3.22.9'
    kind: verse
    lines:
      - "प्रियव्रतोत्तानपदोः स्वसेयं दुहिता मम"
      - "अन्विच्छति पतिं युक्तं वयःशीलगुणादिभिः"
    iast: "priyavratottānapadoḥ svaseyaṃ duhitā mama | anvicchati patiṃ yuktaṃ vayaḥ-śīla-guṇādibhiḥ"
  - id: '3.22.15'
    kind: verse
    lines:
      - "बाढमुद्वोढुकामोऽहमप्रत्ता च तवात्मजा"
      - "आवयोरनुरूपोऽसावाद्यो वैवाहिको विधिः"
    iast: "bāḍham udvoḍhu-kāmo 'ham aprattā ca tavātmajā | āvayor anurūpo 'sāv ādyo vaivāhiko vidhiḥ"
  - id: '3.22.22'
    kind: verse
    lines:
      - "सोऽनु ज्ञात्वा व्यवसितं महिष्या दुहितुः स्फुटम्"
      - "तस्मै गुणगणाढ्याय ददौ तुल्यां प्रहर्षितः"
    iast: "so 'nu jñātvā vyavasitaṃ mahiṣyā duhituḥ sphuṭam | tasmai guṇa-gaṇāḍhyāya dadau tulyāṃ praharṣitaḥ"
  - id: '3.24.6'
    kind: verse
    lines:
      - "तस्यां बहुतिथे काले भगवान्मधुसूदनः"
      - "कार्दमं वीर्यमापन्नो जज्ञेऽग्निरिव दारुणि"
    iast: "tasyāṃ bahu-tithe kāle bhagavān madhusūdanaḥ | kārdamaṃ vīryam āpanno jajñe 'gnir iva dāruṇi"
  - id: '3.24.26'
    kind: verse
    lines:
      - "स चावतीर्णं त्रियुगमाज्ञाय विबुधर्षभम्"
      - "विविक्त उपसङ्गम्य प्रणम्य समभाषत"
    iast: "sa cāvatīrṇaṃ tri-yugam ājñāya vibudharṣabham | vivikta upasaṅgamya praṇamya samabhāṣata"
  - id: '3.24.34'
    kind: verse
    lines:
      - "अ स्माभिपृच्छेऽद्य पतिं प्रजानां त्वयावतीर्णर्ण उताप्तकामः"
      - "परिव्रजत्पदवीमास्थितोऽहं चरिष्ये त्वां हृदि युञ्जन्विशोकः"
    iast: "a smābhipṛcche 'dya patiṃ prajānāṃ tvayāvatīrṇarṇa utāpta-kāmaḥ | parivrajat-padavīm āsthito 'haṃ cariṣye tvāṃ hṛdi yuñjan viśokaḥ"
  - id: '3.24.37'
    kind: verse
    lines:
      - "एष आत्मपथोऽव्यक्तो नष्टः कालेन भूयसा"
      - "तं प्रवर्तयितुं देहमिमं विद्धि मया भृतम्"
    iast: "eṣa ātma-patho 'vyakto naṣṭaḥ kālena bhūyasā | taṃ pravartayituṃ deham imaṃ viddhi mayā bhṛtam"
  - id: '3.24.38'
    kind: verse
    lines:
      - "गच्छ कामं मयापृष्टो मयि सन्न्यस्तकर्मणा"
      - "जित्वा सुदुर्जयं मृत्युममृतत्वाय मां भज"
    iast: "gaccha kāmaṃ mayāpṛṣṭo mayi sannyasta-karmaṇā | jitvā sudurjayaṃ mṛtyum amṛtatvāya māṃ bhaja"
  - id: '3.24.40'
    kind: verse
    lines:
      - "मात्र आध्यात्मिकीं विद्यां शमनीं सर्वकर्मणाम्"
      - "वितरिष्ये यया चासौ भयं चातितरिष्यति"
    iast: "mātra ādhyātmikīṃ vidyāṃ śamanīṃ sarva-karmaṇām | vitariṣye yayā cāsau bhayaṃ cātitariṣyati"
  - id: '3.24.41'
    kind: verse
    lines:
      - "एवं समुदितस्तेन कपिलेन प्रजापतिः"
      - "दक्षिणीकृत्य तं प्रीतो वनमेव जगाम ह"
    iast: "evaṃ samuditas tena kapilena prajāpatiḥ | dakṣiṇī-kṛtya taṃ prīto vanam eva jagāma ha"
  - id: '3.25.5'
    kind: verse
    lines:
      - "पितरि प्रस्थितेऽरण्यं मातुः प्रियचिकीर्षया"
      - "तस्मिन्बिन्दुसरेऽवात्सीद्भगवान्कपिलः किल"
    iast: "pitari prasthite 'raṇyaṃ mātuḥ priya-cikīrṣayā | tasmin bindusare 'vātsīd bhagavān kapilaḥ kila"
  - id: '3.25.9'
    kind: verse
    lines:
      - "य आद्यो भगवान्पुंसामीश्वरो वै भवान्किल"
      - "लोकस्य तमसान्धस्य चक्षुः सूर्य इवोदितः"
    iast: "ya ādyo bhagavān puṃsām īśvaro vai bhavān kila | lokasya tamasāndhasya cakṣuḥ sūrya ivoditaḥ"
  - id: '3.25.10'
    kind: verse
    lines:
      - "अथ मे देव सम्मोहमपाक्रष्टुं त्वमर्हसि"
      - "योऽवग्रहोऽहं ममेतीत्येतस्मिन्योजितस्त्वया"
    iast: "atha me deva sammoham apākraṣṭuṃ tvam arhasi | yo 'vagraho 'haṃ mametīty etasmin yojitas tvayā"
  - id: '3.25.13'
    kind: verse
    lines:
      - "योग आध्यात्मिकः पुंसां मतो निःश्रेयसाय मे"
      - "अत्यन्तोपरतिर्यत्र दुःखस्य च सुखस्य च"
    iast: "yoga ādhyātmikaḥ puṃsāṃ mato niḥśreyasāya me | atyantoparatir yatra duḥkhasya ca sukhasya ca"
  - id: '3.25.14'
    kind: verse
    lines:
      - "तमिमं ते प्रवक्ष्यामि यमवोचं पुरानघे"
      - "ऋषीणां श्रोतुकामानां योगं सर्वाङ्गनैपुणम्"
    iast: "tam imaṃ te pravakṣyāmi yam avocaṃ purānaghe | ṛṣīṇāṃ śrotu-kāmānāṃ yogaṃ sarvāṅga-naipuṇam"
  - id: '3.25.15'
    kind: verse
    lines:
      - "चेतः खल्वस्य बन्धाय मुक्तये चात्मनो मतम्"
      - "गुणेषु सक्तं बन्धाय रतं वा पुंसि मुक्तये"
    iast: "cetaḥ khalv asya bandhāya muktaye cātmano matam | guṇeṣu saktaṃ bandhāya rataṃ vā puṃsi muktaye"
  - id: '3.25.20'
    kind: verse
    lines:
      - "प्रसङ्गमजरं पाशमात्मनः कवयो विदुः"
      - "स एव साधुषु कृतो मोक्षद्वारमपावृतम्"
    iast: "prasaṅgam ajaraṃ pāśam ātmanaḥ kavayo viduḥ | sa eva sādhuṣu kṛto mokṣa-dvāram apāvṛtam"
  - id: '3.25.21'
    kind: verse
    lines:
      - "तितिक्षवः कारुणिकाः सुहृदः सर्वदेहिनाम्"
      - "अजातशत्रवः शान्ताः साधवः साधुभूषणाः"
    iast: "titikṣavaḥ kāruṇikāḥ suhṛdaḥ sarva-dehinām | ajāta-śatravaḥ śāntāḥ sādhavaḥ sādhu-bhūṣaṇāḥ"
  - id: '3.25.35'
    kind: verse
    lines:
      - "नैकात्मतां मे स्पृहयन्ति केचिन्मत्पादसेवाभिरता मदीहाः"
      - "येऽन्योन्यतो भागवताः प्रसज्य सभाजयन्ते मम पौरुषाणि"
    iast: "naikātmatāṃ me spṛhayanti kecin mat-pāda-sevābhiratā mad-īhāḥ | ye 'nyonyato bhāgavatāḥ prasajya sabhājayante mama pauruṣāṇi"
  - id: '3.25.39'
    kind: verse
    lines:
      - "न कर्हिचिन्मत्पराः शान्तरूपे नङ्क्ष्यन्ति नो मेऽनिमिषो लेढि हेतिः"
      - "येषामहं प्रिय आत्मा सुतश्च सखा गुरुः सुहृदो दैवमिष्टम्"
    iast: "na karhicin mat-parāḥ śānta-rūpe naṅkṣyanti no me 'nimiṣo leḍhi hetiḥ | yeṣām ahaṃ priya ātmā sutaś ca sakhā guruḥ suhṛdo daivam iṣṭam"
  - id: '3.25.45'
    kind: verse
    lines:
      - "एतावानेव लोकेऽस्मिन्पुंसां निःश्रेयसोदयः"
      - "तीव्रेण भक्तियोगेन मनो मय्यर्पितं स्थिरम्"
    iast: "etāvān eva loke 'smin puṃsāṃ niḥśreyasodayaḥ | tīvreṇa bhakti-yogena mano mayy arpitaṃ sthiram"
  - id: '3.28.3'
    kind: verse
    lines:
      - "ग्राम्यधर्मनिवृत्तिश्च मोक्षधर्मरतिस्तथा"
      - "मितमेध्यादनं शश्वद्विविक्तक्षेमसेवनम्"
    iast: "grāmya-dharma-nivṛttiś ca mokṣa-dharma-ratis tathā | mita-medhyādanaṃ śaśvad vivikta-kṣema-sevanam"
  - id: '3.28.4'
    kind: verse
    lines:
      - "अहिंसा सत्यमस्तेयं यावदर्थपरिग्रहः"
      - "ब्रह्मचर्यं तपः शौचं स्वाध्यायः पुरुषार्चनम्"
    iast: "ahiṃsā satyam asteyaṃ yāvad-artha-parigrahaḥ | brahmacaryaṃ tapaḥ śaucaṃ svādhyāyaḥ puruṣārcanam"
  - id: '3.29.8'
    kind: verse
    lines:
      - "अभिसन्धाय यो हिंसां दम्भं मात्सर्यमेव वा"
      - "संरम्भी भिन्नदृग्भावं मयि कुर्यात्स तामसः"
    iast: "abhisandhāya yo hiṃsāṃ dambhaṃ mātsaryam eva vā | saṃrambhī bhinna-dṛg bhāvaṃ mayi kuryāt sa tāmasaḥ"
  - id: '3.29.9'
    kind: verse
    lines:
      - "विषयानभिसन्धाय यश ऐश्वर्यमेव वा"
      - "अर्चादावर्चयेद्यो मां पृथग्भावः स राजसः"
    iast: "viṣayān abhisandhāya yaśa aiśvaryam eva vā | arcādāv arcayed yo māṃ pṛthag-bhāvaḥ sa rājasaḥ"
  - id: '3.29.10'
    kind: verse
    lines:
      - "कर्मनिर्हारमुद्दिश्य परस्मिन्वा तदर्पणम्"
      - "यजेद्यष्टव्यमिति वा पृथग्भावः स सात्त्विकः"
    iast: "karma-nirhāram uddiśya parasmin vā tad-arpaṇam | yajed yaṣṭavyam iti vā pṛthag-bhāvaḥ sa sāttvikaḥ"
  - id: '3.29.21'
    kind: verse
    lines:
      - "अहं सर्वेषु भूतेषु भूतात्मावस्थितः सदा"
      - "तमवज्ञाय मां मर्त्यः कुरुतेऽर्चाविडम्बनम्"
    iast: "ahaṃ sarveṣu bhūteṣu bhūtātmāvasthitaḥ sadā | tam avajñāya māṃ martyaḥ kurute 'rcā-viḍambanam"
  - id: '3.29.22'
    kind: verse
    lines:
      - "यो मां सर्वेषु भूतेषु सन्तमात्मानमीश्वरम्"
      - "हित्वार्चां भजते मौढ्याद्भस्मन्येव जुहोति सः"
    iast: "yo māṃ sarveṣu bhūteṣu santam ātmānam īśvaram | hitvārcāṃ bhajate mauḍhyād bhasmany eva juhoti saḥ"
  - id: '3.29.23'
    kind: verse
    lines:
      - "द्विषतः परकाये मां मानिनो भिन्नदर्शिनः"
      - "भूतेषु बद्धवैरस्य न मनः शान्तिमृच्छति"
    iast: "dviṣataḥ para-kāye māṃ mānino bhinna-darśinaḥ | bhūteṣu baddha-vairasya na manaḥ śāntim ṛcchati"
  - id: '3.29.25'
    kind: verse
    lines:
      - "अर्चादावर्चयेत्तावदीश्वरं मां स्वकर्मकृत्"
      - "यावन्न वेद स्वहृदि सर्वभूतेष्ववस्थितम्"
    iast: "arcādāv arcayet tāvad īśvaraṃ māṃ sva-karma-kṛt | yāvan na veda sva-hṛdi sarva-bhūteṣv avasthitam"
  - id: '3.29.27'
    kind: verse
    lines:
      - "अथ मां सर्वभूतेषु भूतात्मानं कृतालयम्"
      - "अर्हयेद्दानमानाभ्यां मैत्र्याभिन्नेन चक्षुषा"
    iast: "atha māṃ sarva-bhūteṣu bhūtātmānaṃ kṛtālayam | arhayed dāna-mānābhyāṃ maitryābhinnena cakṣuṣā"
  - id: '3.29.34'
    kind: verse
    lines:
      - "मनसैतानि भूतानि प्रणमेद्बहुमानयन्"
      - "ईश्वरो जीवकलया प्रविष्टो भगवानिति"
    iast: "manasaitāni bhūtāni praṇamed bahu-mānayan | īśvaro jīva-kalayā praviṣṭo bhagavān iti"
  - id: '3.33.11'
    kind: verse
    lines:
      - "श्रद्धत्स्वैतन्मतं मह्यं जुष्टं यद्ब्रह्मवादिभिः"
      - "येन मामभयं याया मृत्युमृच्छन्त्यतद्विदः"
    iast: "śraddhatsvaitan mataṃ mahyaṃ juṣṭaṃ yad brahma-vādibhiḥ | yena mām abhayaṃ yāyā mṛtyum ṛcchanty atad-vidaḥ"
  - id: '3.33.12'
    kind: verse
    lines:
      - "इति प्रदर्श्य भगवान्सतीं तामात्मनो गतिम्"
      - "स्वमात्रा ब्रह्मवादिन्या कपिलोऽनुमतो ययौ"
    iast: "iti pradarśya bhagavān satīṃ tām ātmano gatim | sva-mātrā brahma-vādinyā kapilo 'numato yayau"
  - id: '3.33.30'
    kind: verse
    lines:
      - "एवं सा कपिलोक्तेन मार्गेणाचिरतः परम्"
      - "आत्मानं ब्रह्मनिर्वाणं भगवन्तमवाप ह"
    iast: "evaṃ sā kapiloktena mārgeṇācirataḥ param | ātmānaṃ brahma-nirvāṇaṃ bhagavantam avāpa ha"
  - id: '4.8.7'
    kind: verse
    lines:
      - "प्रियव्रतोत्तानपादौ शतरूपापतेः सुतौ"
      - "वासुदेवस्य कलया रक्षायां जगतः स्थितौ"
    iast: "priyavratottānapādau śatarūpā-pateḥ sutau | vāsudevasya kalayā rakṣāyāṃ jagataḥ sthitau"
  - id: '4.8.8'
    kind: verse
    lines:
      - "जाये उत्तानपादस्य सुनीतिः सुरुचिस्तयोः"
      - "सुरुचिः प्रेयसी पत्युर्नेतरा यत्सुतो ध्रुवः"
    iast: "jāye uttānapādasya sunītiḥ surucis tayoḥ | suruciḥ preyasī patyur netarā yat-suto dhruvaḥ"
  - id: '4.8.9'
    kind: verse
    lines:
      - "एकदा सुरुचेः पुत्रमङ्कमारोप्य लालयन्"
      - "उत्तमं नारुरुक्षन्तं ध्रुवं राजाभ्यनन्दत"
    iast: "ekadā suruceḥ putram aṅkam āropya lālayan | uttamaṃ nārurukṣantaṃ dhruvaṃ rājābhyanandata"
  - id: '4.8.10'
    kind: verse
    lines:
      - "तथा चिकीर्षमाणं तं सपत्न्यास्तनयं ध्रुवम्"
      - "सुरुचिः शृण्वतो राज्ञः सेर्ष्यमाहातिगर्विता"
    iast: "tathā cikīrṣamāṇaṃ taṃ sapatnyās tanayaṃ dhruvam | suruciḥ śṛṇvato rājñaḥ serṣyam āhātigarvitā"
  - id: '4.8.13'
    kind: verse
    lines:
      - "तपसाराध्य पुरुषं तस्यैवानुग्रहेण मे"
      - "गर्भे त्वं साधयात्मानं यदीच्छसि नृपासनम्"
    iast: "tapasārādhya puruṣaṃ tasyaivānugraheṇa me | garbhe tvaṃ sādhayātmānaṃ yadīcchasi nṛpāsanam"
  - id: '4.8.14'
    kind: verse
    lines:
      - "मातुः सपत्न्याः स दुरुक्तिविद्धः श्वसन्रुषा दण्डहतो यथाहिः"
      - "हित्वा मिषन्तं पितरं सन्नवाचं जगाम मातुः प्ररुदन्सकाशम्"
    iast: "mātuḥ sapatnyāḥ sa durukti-viddhaḥ śvasan ruṣā daṇḍa-hato yathāhiḥ | hitvā miṣantaṃ pitaraṃ sanna-vācaṃ jagāma mātuḥ prarudan sakāśam"
  - id: '4.8.15'
    kind: verse
    lines:
      - "तं निःश्वसन्तं स्फुरिताधरोष्ठं सुनीतिरुत्सङ्ग उदूह्य बालम्"
      - "निशम्य तत्पौरमुखान्नितान्तं सा विव्यथे यद्गदितं सपत्न्या"
    iast: "taṃ niḥśvasantaṃ sphuritādharoṣṭhaṃ sunītir utsaṅga udūhya bālam | niśamya tat-paura-mukhān nitāntaṃ sā vivyathe yad gaditaṃ sapatnyā"
  - id: '4.8.17'
    kind: verse
    lines:
      - "दीर्घं श्वसन्ती वृजिनस्य पारमपश्यती बालकमाह बाला"
      - "मामङ्गलं तात परेषु मंस्था भुङ्क्ते जनो यत्परदुःखदस्तत्"
    iast: "dīrghaṃ śvasantī vṛjinasya pāram apaśyatī bālakam āha bālā | māmaṅgalaṃ tāta pareṣu maṃsthā bhuṅkte jano yat para-duḥkhadas tat"
  - id: '4.8.18'
    kind: verse
    lines:
      - "सत्यं सुरुच्याभिहितं भवान्मे यद्दुर्भगाया उदरे गृहीतः"
      - "स्तन्येन वृद्धश्च विलज्जते यां भार्येति वा वोढुमिडस्पतिर्माम्"
    iast: "satyaṃ surucyābhihitaṃ bhavān me yad durbhagāyā udare gṛhītaḥ | stanyena vṛddhaś ca vilajjate yāṃ bhāryeti vā voḍhum iḍaspatir mām"
  - id: '4.8.19'
    kind: verse
    lines:
      - "आतिष्ठ तत्तात विमत्सरस्त्वमुक्तं समात्रापि यदव्यलीकम्"
      - "आराधयाधोक्षजपादपद्मं यदीच्छसेऽध्यासनमुत्तमो यथा"
    iast: "ātiṣṭha tat tāta vimatsaras tvam uktaṃ samātrāpi yad avyalīkam | ārādhayādhokṣaja-pāda-padmaṃ yadīcchase 'dhyāsanam uttamo yathā"
  - id: '4.8.24'
    kind: verse
    lines:
      - "एवं सञ्जल्पितं मातुराकर्ण्यार्थागमं वचः"
      - "सन्नियम्यात्मनात्मानं निश्चक्राम पितुः पुरात्"
    iast: "evaṃ sañjalpitaṃ mātur ākarṇyārthāgamaṃ vacaḥ | sanniyamyātmanātmānaṃ niścakrāma pituḥ purāt"
  - id: '4.8.25'
    kind: verse
    lines:
      - "नारदस्तदुपाकर्ण्य ज्ञात्वा तस्य चिकीर्षितम्"
      - "स्पृष्ट्वा मूर्धन्यघघ्नेन पाणिना प्राह विस्मितः"
    iast: "nāradas tad upākarṇya jñātvā tasya cikīrṣitam | spṛṣṭvā mūrdhany agha-ghnena pāṇinā prāha vismitaḥ"
  - id: '4.8.27'
    kind: verse
    lines:
      - "नाधुनाप्यवमानं ते सम्मानं वापि पुत्रक"
      - "लक्षयामः कुमारस्य सक्तस्य क्रीडनादिषु"
    iast: "nādhunāpy avamānaṃ te sammānaṃ vāpi putraka | lakṣayāmaḥ kumārasya saktasya krīḍanādiṣu"
  - id: '4.8.28'
    kind: verse
    lines:
      - "विकल्पे विद्यमानेऽपि न ह्यसन्तोषहेतवः"
      - "पुंसो मोहमृते भिन्ना यल्लोके निजकर्मभिः"
    iast: "vikalpe vidyamāne 'pi na hy asantoṣa-hetavaḥ | puṃso moham ṛte bhinnā yal loke nija-karmabhiḥ"
  - id: '4.8.29'
    kind: verse
    lines:
      - "परितुष्येत्ततस्तात तावन्मात्रेण पूरुषः"
      - "दैवोपसादितं यावद्वीक्ष्येश्वरगतिं बुधः"
    iast: "parituṣyet tatas tāta tāvan-mātreṇa pūruṣaḥ | daivopasāditaṃ yāvad vīkṣyeśvara-gatiṃ budhaḥ"
  - id: '4.8.30'
    kind: verse
    lines:
      - "अथ मात्रोपदिष्टेन योगेनावरुरुत्ससि"
      - "यत्प्रसादं स वै पुंसां दुराराध्यो मतो मम"
    iast: "atha mātropadiṣṭena yogenāvarurutsasi | yat-prasādaṃ sa vai puṃsāṃ durārādhyo mato mama"
  - id: '4.8.32'
    kind: verse
    lines:
      - "अतो निवर्ततामेष निर्बन्धस्तव निष्फलः"
      - "यतिष्यति भवान्काले श्रेयसां समुपस्थिते"
    iast: "ato nivartatām eṣa nirbandhas tava niṣphalaḥ | yatiṣyati bhavān kāle śreyasāṃ samupasthite"
  - id: '4.8.34'
    kind: verse
    lines:
      - "गुणाधिकान्मुदं लिप्सेदनुक्रोशं गुणाधमात्"
      - "मैत्रीं समानादन्विच्छेन्न तापैरभिभूयते"
    iast: "guṇādhikān mudaṃ lipsed anukrośaṃ guṇādhamāt | maitrīṃ samānād anvicchen na tāpair abhibhūyate"
  - id: '4.8.35'
    kind: verse
    lines:
      - "सोऽयं शमो भगवता सुखदुःखहतात्मनाम्"
      - "दर्शितः कृपया पुंसां दुर्दर्शोऽस्मद्विधैस्तु यः"
    iast: "so 'yaṃ śamo bhagavatā sukha-duḥkha-hatātmanām | darśitaḥ kṛpayā puṃsāṃ durdarśo 'smad-vidhais tu yaḥ"
  - id: '4.8.36'
    kind: verse
    lines:
      - "अथापि मेऽविनीतस्य क्षात्त्रं घोरमुपेयुषः"
      - "सुरुच्या दुर्वचोबाणैर्न भिन्ने श्रयते हृदि"
    iast: "athāpi me 'vinītasya kṣāttraṃ ghoram upeyuṣaḥ | surucyā durvaco-bāṇair na bhinne śrayate hṛdi"
  - id: '4.8.40'
    kind: verse
    lines:
      - "जनन्याभिहितः पन्थाः स वै निःश्रेयसस्य ते"
      - "भगवान्वासुदेवस्तं भज तं प्रवणात्मना"
    iast: "jananyābhihitaḥ panthāḥ sa vai niḥśreyasasya te | bhagavān vāsudevas taṃ bhaja taṃ pravaṇātmanā"
  - id: '4.8.42'
    kind: verse
    lines:
      - "तत्तात गच्छ भद्रं ते यमुनायास्तटं शुचि"
      - "पुण्यं मधुवनं यत्र सान्निध्यं नित्यदा हरेः"
    iast: "tat tāta gaccha bhadraṃ te yamunāyās taṭaṃ śuci | puṇyaṃ madhuvanaṃ yatra sānnidhyaṃ nityadā hareḥ"
  - id: '4.8.51'
    kind: verse
    lines:
      - "स्मयमानमभिध्यायेत्सानुरागावलोकनम्"
      - "नियतेनैकभूतेन मनसा वरदर्षभम्"
    iast: "smayamānam abhidhyāyet sānurāgāvalokanam | niyatenaika-bhūtena manasā varadarṣabham"
  - id: '4.8.62'
    kind: verse
    lines:
      - "इत्युक्तस्तं परिक्रम्य प्रणम्य च नृपार्भकः"
      - "ययौ मधुवनं पुण्यं हरेश्चरणचर्चितम्"
    iast: "ity uktas taṃ parikramya praṇamya ca nṛpārbhakaḥ | yayau madhuvanaṃ puṇyaṃ hareś caraṇa-carcitam"
  - id: '4.8.71'
    kind: verse
    lines:
      - "तत्राभिषिक्तः प्रयतस्तामुपोष्य विभावरीम्"
      - "समाहितः पर्यचरदृष्यादेशेन पूरुषम्"
    iast: "tatrābhiṣiktaḥ prayatas tām upoṣya vibhāvarīm | samāhitaḥ paryacarad ṛṣy-ādeśena pūruṣam"
  - id: '4.8.76'
    kind: verse
    lines:
      - "पञ्चमे मास्यनुप्राप्ते जितश्वासो नृपात्मजः"
      - "ध्यायन्ब्रह्म पदैकेन तस्थौ स्थाणुरिवाचलः"
    iast: "pañcame māsy anuprāpte jita-śvāso nṛpātmajaḥ | dhyāyan brahma padaikena tasthau sthāṇur ivācalaḥ"
  - id: '4.8.78'
    kind: verse
    lines:
      - "आधारं महदादीनां प्रधानपुरुषेश्वरम्"
      - "ब्रह्म धारयमाणस्य त्रयो लोकाश्चकम्पिरे"
    iast: "ādhāraṃ mahad-ādīnāṃ pradhāna-puruṣeśvaram | brahma dhārayamāṇasya trayo lokāś cakampire"
  - id: '4.9.2'
    kind: verse
    lines:
      - "स वै धिया योगविपाकतीव्रया हृत्पद्मकोशे स्फुरितं तडित्प्रभम्"
      - "तिरोहितं सहसैवोपलक्ष्य बहिःस्थितं तदवस्थं ददर्श"
    iast: "sa vai dhiyā yoga-vipāka-tīvrayā hṛt-padma-kośe sphuritaṃ taḍit-prabham | tirohitaṃ sahasaivopalakṣya bahiḥ-sthitaṃ tad-avasthaṃ dadarśa"
  - id: '4.9.3'
    kind: verse
    lines:
      - "तद्दर्शनेनागतसाध्वसः क्षिताववन्दताङ्गं विनमय्य दण्डवत्"
      - "दृग्भ्यां प्रपश्यन्प्रपिबन्निवार्भकश्चुम्बन्निवास्येन भुजैरिवाश्लिषन्"
    iast: "tad-darśanenāgata-sādhvasaḥ kṣitāv avandatāṅgaṃ vinamayya daṇḍavat | dṛgbhyāṃ prapaśyan prapibann ivārbhakaś cumbann ivāsyena bhujair ivāśliṣan"
  - id: '4.9.4'
    kind: verse
    lines:
      - "स तं विवक्षन्तमतद्विदं हरिर्ज्ञात्वास्य सर्वस्य च हृद्यवस्थितः"
      - "कृताञ्जलिं ब्रह्ममयेन कम्बुना पस्पर्श बालं कृपया कपोले"
    iast: "sa taṃ vivakṣantam atad-vidaṃ harir jñātvāsya sarvasya ca hṛdy avasthitaḥ | kṛtāñjaliṃ brahmamayena kambunā pasparśa bālaṃ kṛpayā kapole"
  - id: '4.9.5'
    kind: verse
    lines:
      - "स वै तदैव प्रतिपादितां गिरं दैवीं परिज्ञातपरात्मनिर्णयः"
      - "तं भक्तिभावोऽभ्यगृणादसत्वरं परिश्रुतोरुश्रवसं ध्रुवक्षितिः"
    iast: "sa vai tadaiva pratipāditāṃ giraṃ daivīṃ parijñāta-parātma-nirṇayaḥ | taṃ bhakti-bhāvo 'bhyagṛṇād asatvaraṃ pariśrutoru-śravasaṃ dhruva-kṣitiḥ"
  - id: '4.9.6'
    kind: verse
    lines:
      - "योऽन्तः प्रविश्य मम वाचमिमां प्रसुप्तां सञ्जीवयत्यखिलशक्तिधरः स्वधाम्ना"
      - "अन्यांश्च हस्तचरणश्रवणत्वगादीन्प्राणान्नमो भगवते पुरुषाय तुभ्यम्"
    iast: "yo 'ntaḥ praviśya mama vācam imāṃ prasuptāṃ sañjīvayaty akhila-śakti-dharaḥ sva-dhāmnā | anyāṃś ca hasta-caraṇa-śravaṇa-tvag-ādīn prāṇān namo bhagavate puruṣāya tubhyam"
  - id: '4.9.16'
    kind: verse
    lines:
      - "यस्मिन्विरुद्धगतयो ह्यनिशं पतन्ति विद्यादयो विविधशक्तय आनुपूर्व्यात्"
      - "तद्ब्रह्म विश्वभवमेकमनन्तमाद्यमानन्दमात्रमविकारमहं प्रपद्ये"
    iast: "yasmin viruddha-gatayo hy aniśaṃ patanti vidyādayo vividha-śaktaya ānupūrvyāt | tad brahma viśva-bhavam ekam anantam ādyam ānanda-mātram avikāram ahaṃ prapadye"
  - id: '4.9.18'
    kind: verse
    lines:
      - "अथाभिष्टुत एवं वै सत्सङ्कल्पेन धीमता"
      - "भृत्यानुरक्तो भगवान्प्रतिनन्द्येदमब्रवीत्"
    iast: "athābhiṣṭuta evaṃ vai sat-saṅkalpena dhīmatā | bhṛtyānurakto bhagavān pratinandyedam abravīt"
  - id: '4.9.19'
    kind: verse
    lines:
      - "वेदाहं ते व्यवसितं हृदि राजन्यबालक"
      - "तत्प्रयच्छामि भद्रं ते दुरापमपि सुव्रत"
    iast: "vedāhaṃ te vyavasitaṃ hṛdi rājanya-bālaka | tat prayacchāmi bhadraṃ te durāpam api suvrata"
  - id: '4.9.20'
    kind: verse
    lines:
      - "नान्यैरधिष्ठितं भद्र यद्भ्राजिष्णु ध्रुवक्षिति"
      - "यत्र ग्रहर्क्षताराणां ज्योतिषां चक्रमाहितम्"
    iast: "nānyair adhiṣṭhitaṃ bhadra yad bhrājiṣṇu dhruva-kṣiti | yatra graharkṣa-tārāṇāṃ jyotiṣāṃ cakram āhitam"
  - id: '4.9.22'
    kind: verse
    lines:
      - "प्रस्थिते तु वनं पित्रा दत्त्वा गां धर्मसंश्रयः"
      - "षट्त्रिंशद्वर्षसाहस्रं रक्षिताव्याहतेन्द्रियः"
    iast: "prasthite tu vanaṃ pitrā dattvā gāṃ dharma-saṃśrayaḥ | ṣaṭ-triṃśad-varṣa-sāhasraṃ rakṣitāvyāhatendriyaḥ"
  - id: '4.9.24'
    kind: verse
    lines:
      - "इष्ट्वा मां यज्ञहृदयं यज्ञैः पुष्कलदक्षिणैः"
      - "भुक्त्वा चेहाशिषः सत्या अन्ते मां संस्मरिष्यसि"
    iast: "iṣṭvā māṃ yajña-hṛdayaṃ yajñaiḥ puṣkala-dakṣiṇaiḥ | bhuktvā cehāśiṣaḥ satyā ante māṃ saṃsmariṣyasi"
  - id: '4.9.25'
    kind: verse
    lines:
      - "ततो गन्तासि मत्स्थानं सर्वलोकनमस्कृतम्"
      - "उपरिष्टादृषिभ्यस्त्वं यतो नावर्तते गतः"
    iast: "tato gantāsi mat-sthānaṃ sarva-loka-namaskṛtam | upariṣṭād ṛṣibhyas tvaṃ yato nāvartate gataḥ"
  - id: '4.9.26'
    kind: verse
    lines:
      - "इत्यर्चितः स भगवानतिदिश्यात्मनः पदम्"
      - "बालस्य पश्यतो धाम स्वमगाद्गरुडध्वजः"
    iast: "ity arcitaḥ sa bhagavān atidiśyātmanaḥ padam | bālasya paśyato dhāma svam agād garuḍa-dhvajaḥ"
  - id: '4.9.34'
    kind: verse
    lines:
      - "मयैतत्प्रार्थितं व्यर्थं चिकित्सेव गतायुषि"
      - "प्रसाद्य जगदात्मानं तपसा दुष्प्रसादनम्"
      - "भवच्छिदमयाचेऽहं भवं भाग्यविवर्जितः"
    iast: "mayaitat prārthitaṃ vyarthaṃ cikitseva gatāyuṣi | prasādya jagad-ātmānaṃ tapasā duṣprasādanam | bhava-cchidam ayāce 'haṃ bhavaṃ bhāgya-vivarjitaḥ"
  - id: '4.9.35'
    kind: verse
    lines:
      - "स्वाराज्यं यच्छतो मौढ्यान्मानो मे भिक्षितो बत"
      - "ईश्वरात्क्षीणपुण्येन फलीकारानिवाधनः"
    iast: "svārājyaṃ yacchato mauḍhyān māno me bhikṣito bata | īśvarāt kṣīṇa-puṇyena phalī-kārān ivādhanaḥ"
  - id: '4.9.45'
    kind: verse
    lines:
      - "अभिवन्द्य पितुः पादावाशीर्भिश्चाभिमन्त्रितः"
      - "ननाम मातरौ शीर्ष्णा सत्कृतः सज्जनाग्रणीः"
    iast: "abhivandya pituḥ pādāv āśīrbhiś cābhimantritaḥ | nanāma mātarau śīrṣṇā sat-kṛtaḥ saj-janāgraṇīḥ"
  - id: '4.9.46'
    kind: verse
    lines:
      - "सुरुचिस्तं समुत्थाप्य पादावनतमर्भकम्"
      - "परिष्वज्याह जीवेति बाष्पगद्गदया गिरा"
    iast: "surucis taṃ samutthāpya pādāvanatam arbhakam | pariṣvajyāha jīveti bāṣpa-gadgadayā girā"
  - id: '4.9.47'
    kind: verse
    lines:
      - "यस्य प्रसन्नो भगवान्गुणैर्मैत्र्यादिभिर्हरिः"
      - "तस्मै नमन्ति भूतानि निम्नमाप इव स्वयम्"
    iast: "yasya prasanno bhagavānguṇair maitry-ādibhir hariḥ | tasmai namanti bhūtāni nimnam āpa iva svayam"
  - id: '4.9.49'
    kind: verse
    lines:
      - "सुनीतिरस्य जननी प्राणेभ्योऽपि प्रियं सुतम्"
      - "उपगुह्य जहावाधिं तदङ्गस्पर्शनिर्वृता"
    iast: "sunītir asya jananī prāṇebhyo 'pi priyaṃ sutam | upaguhya jahāv ādhiṃ tad-aṅga-sparśa-nirvṛtā"
  - id: '4.9.67'
    kind: verse
    lines:
      - "आत्मानं च प्रवयसमाकलय्य विशाम्पतिः"
      - "वनं विरक्तः प्रातिष्ठद्विमृशन्नात्मनो गतिम्"
    iast: "ātmānaṃ ca pravayasam ākalayya viśāmpatiḥ | vanaṃ viraktaḥ prātiṣṭhad vimṛśann ātmano gatim"
  - id: '4.12.11'
    kind: verse
    lines:
      - "सर्वात्मन्यच्युतेऽसर्वे तीव्रौघां भक्तिमुद्वहन्"
      - "ददर्शात्मनि भूतेषु तमेवावस्थितं विभुम्"
    iast: "sarvātmany acyute 'sarve tīvraughāṃ bhaktim udvahan | dadarśātmani bhūteṣu tam evāvasthitaṃ vibhum"
  - id: '4.12.12'
    kind: verse
    lines:
      - "तमेवं शीलसम्पन्नं ब्रह्मण्यं दीनवत्सलम्"
      - "गोप्तारं धर्मसेतूनां मेनिरे पितरं प्रजाः"
    iast: "tam evaṃ śīla-sampannaṃ brahmaṇyaṃ dīna-vatsalam | goptāraṃ dharma-setūnāṃ menire pitaraṃ prajāḥ"
  - id: '4.12.14'
    kind: verse
    lines:
      - "एवं बहुसवं कालं महात्माविचलेन्द्रियः"
      - "त्रिवर्गौपयिकं नीत्वा पुत्रायादान्नृपासनम्"
    iast: "evaṃ bahu-savaṃ kālaṃ mahātmāvicalendriyaḥ | tri-vargaupayikaṃ nītvā putrāyādān nṛpāsanam"
  - id: '4.12.38'
    kind: verse
    lines:
      - "इत्युत्तानपदः पुत्रो ध्रुवः कृष्णपरायणः"
      - "अभूत्त्रयाणां लोकानां चूडामणिरिवामलः"
    iast: "ity uttānapadaḥ putro dhruvaḥ kṛṣṇa-parāyaṇaḥ | abhūt trayāṇāṃ lokānāṃ cūḍā-maṇir ivāmalaḥ"
  - id: '4.13.18'
    kind: verse
    lines:
      - "सुनीथाङ्गस्य या पत्नी सुषुवे वेनमुल्बणम्"
      - "यद्दौःशील्यात्स राजर्षिर्निर्विण्णो निरगात्पुरात्"
    iast: "sunīthāṅgasya yā patnī suṣuve venam ulbaṇam | yad-dauḥśīlyāt sa rājarṣir nirviṇṇo niragāt purāt"
  - id: '4.13.42'
    kind: verse
    lines:
      - "तं विचक्ष्य खलं पुत्रं शासनैर्विविधैर्नृपः"
      - "यदा न शासितुं कल्पो भृशमासीत्सुदुर्मनाः"
    iast: "taṃ vicakṣya khalaṃ putraṃ śāsanair vividhair nṛpaḥ | yadā na śāsituṃ kalpo bhṛśam āsīt sudurmanāḥ"
  - id: '4.13.47'
    kind: verse
    lines:
      - "एवं स निर्विण्णमना नृपो गृहान्निशीथ उत्थाय महोदयोदयात्"
      - "अलब्धनिद्रोऽनुपलक्षितो नृभिर्हित्वा गतो वेनसुवं प्रसुप्ताम्"
    iast: "evaṃ sa nirviṇṇa-manā nṛpo gṛhān niśītha utthāya mahodayodayāt | alabdha-nidro 'nupalakṣito nṛbhir hitvā gato vena-suvaṃ prasuptām"
  - id: '4.14.1'
    kind: verse
    lines:
      - "भृग्वादयस्ते मुनयो लोकानां क्षेमदर्शिनः"
      - "गोप्तर्यसति वै नॄणां पश्यन्तः पशुसाम्यताम्"
    iast: "bhṛgv-ādayas te munayo lokānāṃ kṣema-darśinaḥ | goptary asati vai nṝṇāṃ paśyantaḥ paśu-sāmyatām"
  - id: '4.14.2'
    kind: verse
    lines:
      - "वीरमातरमाहूय सुनीथां ब्रह्मवादिनः"
      - "प्रकृत्यसम्मतं वेनमभ्यषिञ्चन्पतिं भुवः"
    iast: "vīra-mātaram āhūya sunīthāṃ brahma-vādinaḥ | prakṛty-asammataṃ venam abhyaṣiñcan patiṃ bhuvaḥ"
  - id: '4.14.4'
    kind: verse
    lines:
      - "स आरूढनृपस्थान उन्नद्धोऽष्टविभूतिभिः"
      - "अवमेने महाभागान्स्तब्धः सम्भावितः स्वतः"
    iast: "sa ārūḍha-nṛpa-sthāna unnaddho 'ṣṭa-vibhūtibhiḥ | avamene mahā-bhāgān stabdhaḥ sambhāvitaḥ svataḥ"
  - id: '4.14.6'
    kind: verse
    lines:
      - "न यष्टव्यं न दातव्यं न होतव्यं द्विजाः क्वचित्"
      - "इति न्यवारयद्धर्मं भेरीघोषेण सर्वशः"
    iast: "na yaṣṭavyaṃ na dātavyaṃ na hotavyaṃ dvijāḥ kvacit | iti nyavārayad dharmaṃ bherī-ghoṣeṇa sarvaśaḥ"
  - id: '4.14.8'
    kind: verse
    lines:
      - "अहो उभयतः प्राप्तं लोकस्य व्यसनं महत्"
      - "दारुण्युभयतो दीप्ते इव तस्करपालयोः"
    iast: "aho ubhayataḥ prāptaṃ lokasya vyasanaṃ mahat | dāruṇy ubhayato dīpte iva taskara-pālayoḥ"
  - id: '4.14.9'
    kind: verse
    lines:
      - "अराजकभयादेष कृतो राजातदर्हणः"
      - "ततोऽप्यासीद्भयं त्वद्य कथं स्यात्स्वस्ति देहिनाम्"
    iast: "arājaka-bhayād eṣa kṛto rājātad-arhaṇaḥ | tato 'py āsīd bhayaṃ tv adya kathaṃ syāt svasti dehinām"
  - id: '4.14.11'
    kind: verse
    lines:
      - "निरूपितः प्रजापालः स जिघांसति वै प्रजाः"
      - "तथापि सान्त्वयेमामुं नास्मांस्तत्पातकं स्पृशेत्"
    iast: "nirūpitaḥ prajā-pālaḥ sa jighāṃsati vai prajāḥ | tathāpi sāntvayemāmuṃ nāsmāṃs tat-pātakaṃ spṛśet"
  - id: '4.14.13'
    kind: verse
    lines:
      - "लोकधिक्कारसन्दग्धं दहिष्यामः स्वतेजसा"
      - "एवमध्यवसायैनं मुनयो गूढमन्यवः"
      - "उपव्रज्याब्रुवन्वेनं सान्त्वयित्वा च सामभिः"
    iast: "loka-dhikkāra-sandagdhaṃ dahiṣyāmaḥ sva-tejasā | evam adhyavasāyainaṃ munayo gūḍha-manyavaḥ | upavrajyābruvan venaṃ sāntvayitvā ca sāmabhiḥ"
  - id: '4.14.16'
    kind: verse
    lines:
      - "स ते मा विनशेद्वीर प्रजानां क्षेमलक्षणः"
      - "यस्मिन्विनष्टे नृपतिरैश्वर्यादवरोहति"
    iast: "sa te mā vinaśed vīra prajānāṃ kṣema-lakṣaṇaḥ | yasmin vinaṣṭe nṛpatir aiśvaryād avarohati"
  - id: '4.14.18'
    kind: verse
    lines:
      - "यस्य राष्ट्रे पुरे चैव भगवान्यज्ञपूरुषः"
      - "इज्यते स्वेन धर्मेण जनैर्वर्णाश्रमान्वितैः"
    iast: "yasya rāṣṭre pure caiva bhagavān yajña-pūruṣaḥ | ijyate svena dharmeṇa janair varṇāśramānvitaiḥ"
  - id: '4.14.19'
    kind: verse
    lines:
      - "तस्य राज्ञो महाभाग भगवान्भूतभावनः"
      - "परितुष्यति विश्वात्मा तिष्ठतो निजशासने"
    iast: "tasya rājño mahā-bhāga bhagavān bhūta-bhāvanaḥ | parituṣyati viśvātmā tiṣṭhato nija-śāsane"
  - id: '4.14.20'
    kind: verse
    lines:
      - "तस्मिंस्तुष्टे किमप्राप्यंजगतामीश्वरेश्वरे"
      - "लोकाः सपाला ह्येतस्मै हरन्ति बलिमादृताः"
    iast: "tasmiṃs tuṣṭe kim aprāpyaṃjagatām īśvareśvare | lokāḥ sapālā hy etasmai haranti balim ādṛtāḥ"
  - id: '4.14.23'
    kind: verse
    lines:
      - "बालिशा बत यूयं वा अधर्मे धर्ममानिनः"
      - "ये वृत्तिदं पतिं हित्वा जारं पतिमुपासते"
    iast: "bāliśā bata yūyaṃ vā adharme dharma-māninaḥ | ye vṛttidaṃ patiṃ hitvā jāraṃ patim upāsate"
  - id: '4.14.26'
    kind: verse
    lines:
      - "विष्णुर्विरिञ्चो गिरिश इन्द्रो वायुर्यमो रविः"
      - "पर्जन्यो धनदः सोमः क्षितिरग्निरपाम्पतिः"
    iast: "viṣṇur viriñco giriśa indro vāyur yamo raviḥ | parjanyo dhanadaḥ somaḥ kṣitir agnir apāmpatiḥ"
  - id: '4.14.27'
    kind: verse
    lines:
      - "एते चान्ये च विबुधाः प्रभवो वरशापयोः"
      - "देहे भवन्ति नृपतेः सर्वदेवमयो नृपः"
    iast: "ete cānye ca vibudhāḥ prabhavo vara-śāpayoḥ | dehe bhavanti nṛpateḥ sarva-devamayo nṛpaḥ"
  - id: '4.14.28'
    kind: verse
    lines:
      - "तस्मान्मां कर्मभिर्विप्रा यजध्वं गतमत्सराः"
      - "बलिं च मह्यं हरत मत्तोऽन्यः कोऽग्रभुक्पुमान्"
    iast: "tasmān māṃ karmabhir viprā yajadhvaṃ gata-matsarāḥ | baliṃ ca mahyaṃ harata matto 'nyaḥ ko 'gra-bhuk pumān"
  - id: '4.15.1'
    kind: verse
    lines:
      - "अथ तस्य पुनर्विप्रैरपुत्रस्य महीपतेः"
      - "बाहुभ्यां मथ्यमानाभ्यां मिथुनं समपद्यत"
    iast: "atha tasya punar viprair aputrasya mahīpateḥ | bāhubhyāṃ mathyamānābhyāṃ mithunaṃ samapadyata"
  - id: '4.15.4'
    kind: verse
    lines:
      - "अयं तु प्रथमो राज्ञां पुमान्प्रथयिता यशः"
      - "पृथुर्नाम महाराजो भविष्यति पृथुश्रवाः"
    iast: "ayaṃ tu prathamo rājñāṃ pumān prathayitā yaśaḥ | pṛthur nāma mahārājo bhaviṣyati pṛthu-śravāḥ"
  - id: '4.15.11'
    kind: verse
    lines:
      - "तस्याभिषेक आरब्धो ब्राह्मणैर्ब्रह्मवादिभिः"
      - "आभिषेचनिकान्यस्मै आजह्रुः सर्वतो जनाः"
    iast: "tasyābhiṣeka ārabdho brāhmaṇair brahma-vādibhiḥ | ābhiṣecanikāny asmai ājahruḥ sarvato janāḥ"
  - id: '4.16.4'
    kind: verse
    lines:
      - "एष धर्मभृतां श्रेष्ठो लोकं धर्मेऽनुवर्तयन्"
      - "गोप्ता च धर्मसेतूनां शास्ता तत्परिपन्थिनाम्"
    iast: "eṣa dharma-bhṛtāṃ śreṣṭho lokaṃ dharme 'nuvartayan | goptā ca dharma-setūnāṃ śāstā tat-paripanthinām"
  - id: '4.16.13'
    kind: verse
    lines:
      - "नादण्ड्यं दण्डयत्येष सुतमात्मद्विषामपि"
      - "दण्डयत्यात्मजमपि दण्ड्यं धर्मपथे स्थितः"
    iast: "nādaṇḍyaṃ daṇḍayaty eṣa sutam ātma-dviṣām api | daṇḍayaty ātmajam api daṇḍyaṃ dharma-pathe sthitaḥ"
  - id: '4.16.17'
    kind: verse
    lines:
      - "मातृभक्तिः परस्त्रीषु पत्न्यामर्ध इवात्मनः"
      - "प्रजासु पितृवत्स्निग्धः किङ्करो ब्रह्मवादिनाम्"
    iast: "mātṛ-bhaktiḥ para-strīṣu patnyām ardha ivātmanaḥ | prajāsu pitṛvat snigdhaḥ kiṅkaro brahma-vādinām"
  - id: '4.18.29'
    kind: verse
    lines:
      - "चूर्णयन्स्वधनुष्कोट्या गिरिकूटानि राजराट्"
      - "भूमण्डलमिदं वैन्यः प्रायश्चक्रे समं विभुः"
    iast: "cūrṇayan sva-dhanuṣ-koṭyā giri-kūṭāni rāja-rāṭ | bhū-maṇḍalam idaṃ vainyaḥ prāyaś cakre samaṃ vibhuḥ"
  - id: '4.18.30'
    kind: verse
    lines:
      - "अथास्मिन्भगवान्वैन्यः प्रजानां वृत्तिदः पिता"
      - "निवासान्कल्पयां चक्रे तत्र तत्र यथार्हतः"
    iast: "athāsmin bhagavān vainyaḥ prajānāṃ vṛttidaḥ pitā | nivāsān kalpayāṃ cakre tatra tatra yathārhataḥ"
  - id: '4.22.55'
    kind: verse
    lines:
      - "गोपीथाय जगत्सृष्टेः काले स्वे स्वेऽच्युतात्मकः"
      - "मनोवाग्वृत्तिभिः सौम्यैर्गुणैः संरञ्जयन्प्रजाः"
    iast: "gopīthāya jagat-sṛṣṭeḥ kāle sve sve 'cyutātmakaḥ | mano-vāg-vṛttibhiḥ saumyair guṇaiḥ saṃrañjayan prajāḥ"
  - id: '4.22.56'
    kind: verse
    lines:
      - "राजेत्यधान्नामधेयं सोमराज इवापरः"
      - "सूर्यवद्विसृजन्गृह्णन्प्रतपंश्च भुवो वसु"
    iast: "rājety adhān nāmadheyaṃ soma-rāja ivāparaḥ | sūryavad visṛjan gṛhṇan pratapaṃś ca bhuvo vasu"
  - id: '4.24.9'
    kind: verse
    lines:
      - "बर्हिषत्सुमहाभागो हाविर्धानिः प्रजापतिः"
      - "क्रियाकाण्डेषु निष्णातो योगेषु च कुरूद्वह"
    iast: "barhiṣat sumahā-bhāgo hāvirdhāniḥ prajāpatiḥ | kriyā-kāṇḍeṣu niṣṇāto yogeṣu ca kurūdvaha"
  - id: '4.24.10'
    kind: verse
    lines:
      - "यस्येदं देवयजनमनुयज्ञं वितन्वतः"
      - "प्राचीनाग्रैः कुशैरासीदास्तृतं वसुधातलम्"
    iast: "yasyedaṃ deva-yajanam anuyajñaṃ vitanvataḥ | prācīnāgraiḥ kuśair āsīd āstṛtaṃ vasudhā-talam"
  - id: '4.25.3'
    kind: verse
    lines:
      - "प्राचीनबर्हिषं क्षत्तः कर्मस्वासक्तमानसम्"
      - "नारदोऽध्यात्मतत्त्वज्ञः कृपालुः प्रत्यबोधयत्"
    iast: "prācīnabarhiṣaṃ kṣattaḥ karmasv āsakta-mānasam | nārado 'dhyātma-tattva-jñaḥ kṛpāluḥ pratyabodhayat"
  - id: '4.25.7'
    kind: verse
    lines:
      - "भो भोः प्रजापते राजन्पशून्पश्य त्वयाध्वरे"
      - "संज्ञापिताञ्जीवसङ्घान्निर्घृणेन सहस्रशः"
    iast: "bho bhoḥ prajāpate rājan paśūn paśya tvayādhvare | saṃjñāpitāñ jīva-saṅghān nirghṛṇena sahasraśaḥ"
  - id: '4.25.8'
    kind: verse
    lines:
      - "एते त्वां सम्प्रतीक्षन्ते स्मरन्तो वैशसं तव"
      - "सम्परेतमयःकूटैश्छिन्दन्त्युत्थितमन्यवः"
    iast: "ete tvāṃ sampratīkṣante smaranto vaiśasaṃ tava | samparetam ayaḥ-kūṭaiś chindanty utthita-manyavaḥ"
  - id: '4.29.33'
    kind: verse
    lines:
      - "यथा हि पुरुषो भारं शिरसा गुरुमुद्वहन्"
      - "तं स्कन्धेन स आधत्ते तथा सर्वाः प्रतिक्रियाः"
    iast: "yathā hi puruṣo bhāraṃ śirasā gurum udvahan | taṃ skandhena sa ādhatte tathā sarvāḥ pratikriyāḥ"
  - id: '4.29.34'
    kind: verse
    lines:
      - "नैकान्ततः प्रतीकारः कर्मणां कर्म केवलम्"
      - "द्वयं ह्यविद्योपसृतं स्वप्ने स्वप्न इवानघ"
    iast: "naikāntataḥ pratīkāraḥ karmaṇāṃ karma kevalam | dvayaṃ hy avidyopasṛtaṃ svapne svapna ivānagha"
  - id: '4.29.36'
    kind: verse
    lines:
      - "अथात्मनोऽर्थभूतस्य यतोऽनर्थपरम्परा"
      - "संसृतिस्तद्व्यवच्छेदो भक्त्या परमया गुरौ"
    iast: "athātmano 'rtha-bhūtasya yato 'nartha-paramparā | saṃsṛtis tad-vyavacchedo bhaktyā paramayā gurau"
  - id: '4.29.46'
    kind: verse
    lines:
      - "यदा यस्यानुगृह्णाति भगवानात्मभावितः"
      - "स जहाति मतिं लोके वेदे च परिनिष्ठिताम्"
    iast: "yadā yasyānugṛhṇāti bhagavān ātma-bhāvitaḥ | sa jahāti matiṃ loke vede ca pariniṣṭhitām"
  - id: '4.29.49'
    kind: verse
    lines:
      - "आस्तीर्य दर्भैः प्रागग्रैः कार्त्स्न्येन क्षितिमण्डलम्"
      - "स्तब्धो बृहद्वधान्मानी कर्म नावैषि यत्परम्"
      - "तत्कर्म हरितोषं यत्सा विद्या तन्मतिर्यया"
    iast: "āstīrya darbhaiḥ prāg-agraiḥ kārtsnyena kṣiti-maṇḍalam | stabdho bṛhad-vadhān mānī karma nāvaiṣi yat param | tat karma hari-toṣaṃ yat sā vidyā tan-matir yayā"
  - id: '4.29.50'
    kind: verse
    lines:
      - "हरिर्देहभृतामात्मा स्वयं प्रकृतिरीश्वरः"
      - "तत्पादमूलं शरणं यतः क्षेमो नृणामिह"
    iast: "harir deha-bhṛtām ātmā svayaṃ prakṛtir īśvaraḥ | tat-pāda-mūlaṃ śaraṇaṃ yataḥ kṣemo nṛṇām iha"
  - id: '4.29.51'
    kind: verse
    lines:
      - "स वै प्रियतमश्चात्मा यतो न भयमण्वपि"
      - "इति वेद स वै विद्वान्यो विद्वान्स गुरुर्हरिः"
    iast: "sa vai priyatamaś cātmā yato na bhayam aṇv api | iti veda sa vai vidvān yo vidvān sa gurur hariḥ"
  - id: '4.29.80'
    kind: verse
    lines:
      - "भागवतमुख्यो भगवान्नारदो हंसयोर्गतिम्"
      - "प्रदर्श्य ह्यमुमामन्त्र्य सिद्धलोकं ततोऽगमत्"
    iast: "bhāgavata-mukhyo bhagavān nārado haṃsayor gatim | pradarśya hy amum āmantrya siddha-lokaṃ tato 'gamat"
  - id: '4.29.81'
    kind: verse
    lines:
      - "प्राचीनबर्ही राजर्षिः प्रजासर्गाभिरक्षणे"
      - "आदिश्य पुत्रानगमत्तपसे कपिलाश्रमम्"
    iast: "prācīnabarhī rājarṣiḥ prajā-sargābhirakṣaṇe | ādiśya putrān agamat tapase kapilāśramam"
  - id: '4.29.82'
    kind: verse
    lines:
      - "तत्रैकाग्रमना धीरो गोविन्दचरणाम्बुजम्"
      - "विमुक्तसङ्गोऽनुभजन्भक्त्या तत्साम्यतामगात्"
    iast: "tatraikāgra-manā dhīro govinda-caraṇāmbujam | vimukta-saṅgo 'nubhajan bhaktyā tat-sāmyatām agāt"
  - id: '4.31.29'
    kind: verse
    lines:
      - "सोऽयमद्य महायोगिन्भवता करुणात्मना"
      - "दर्शितस्तमसः पारो यत्राकिञ्चनगो हरिः"
    iast: "so 'yam adya mahā-yogin bhavatā karuṇātmanā | darśitas tamasaḥ pāro yatrākiñcana-go hariḥ"
  - id: '5.1.6'
    kind: verse
    lines:
      - "_* यर्हि वाव ह राजन्स राजपुत्रः प्रियव्रतः परमभागवतो नारदस्य चरणोपसेवयाञ्जसावगतपरमार्थसतत्त्वो ब्रह्मसत्रेण दीक्षिष्यमाणोऽवनितलपरिपालनायाम्नातप्रवरगुणगणैकान्तभाजनतया स्वपित्रोपामन्त्रितो भगवति वासुदेव एवाव्यवधानसमाधियोगेन समावेशितसकलकारकक्रियाकलापो नैवाभ्यनन्दद्यद्यपि तदप्रत्याम्नातव्यं तदधिकरण आत्मनोऽन्यस्मादसतोऽपि पराभवमन्वीक्षमाणः"
    iast: "_* yarhi vāva ha rājan sa rāja-putraḥ priyavrataḥ parama-bhāgavato nāradasya caraṇopasevayāñjasāvagata-paramārtha-satattvo brahma-satreṇa dīkṣiṣyamāṇo 'vani-tala-paripālanāyāmnāta-pravara-guṇa-gaṇaikānta-bhājanatayā sva-pitropāmantrito bhagavati vāsudeva evāvyavadhāna-samādhi-yogena samāveśita-sakala-kāraka-kriyā-kalāpo naivābhyanandad yadyapi tad apratyāmnātavyaṃ tad-adhikaraṇa ātmano 'nyasmād asato 'pi parābhavam anvīkṣamāṇaḥ"
  - id: '5.1.17'
    kind: verse
    lines:
      - "भयं प्रमत्तस्य वनेष्वपि स्याद्यतः स आस्ते सहषट्सपत्नः"
      - "जितेन्द्रियस्यात्मरतेर्बुधस्य गृहाश्रमः किं नु करोत्यवद्यम्"
    iast: "bhayaṃ pramattasya vaneṣv api syād yataḥ sa āste saha-ṣaṭ-sapatnaḥ | jitendriyasyātma-rater budhasya gṛhāśramaḥ kiṃ nu karoty avadyam"
  - id: '5.1.19'
    kind: verse
    lines:
      - "त्वं त्वब्जनाभाङ्घ्रिसरोजकोश दुर्गाश्रितो निर्जितषट्सपत्नः"
      - "भुङ्क्ष्वेह भोगान्पुरुषातिदिष्टान्विमुक्तसङ्गः प्रकृतिं भजस्व"
    iast: "tvaṃ tv abja-nābhāṅghri-saroja-kośa- durgāśrito nirjita-ṣaṭ-sapatnaḥ | bhuṅkṣveha bhogān puruṣātidiṣṭān vimukta-saṅgaḥ prakṛtiṃ bhajasva"
