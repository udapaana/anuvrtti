  - id: '5.9.20'
    kind: verse
    lines:
      - "_* न वा एतद्विष्णुदत्त महदद्भुतं यदसम्भ्रमः स्वशिरश्छेदन आपतितेऽपि विमुक्तदेहाद्यात्मभावसुदृढहृदयग्रन्थीनां सर्वसत्त्वसुहृदात्मनां निर्वैराणां साक्षाद्भगवतानिमिषारिवरायुधेनाप्रमत्तेन तैस्तैर्भावैः परिरक्ष्यमाणानां तत्पादमूलमकुतश्चिद्भयमुपसृतानां भागवतपरमहंसानाम्"
