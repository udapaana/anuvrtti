  - id: '5.10.6'
    kind: verse
    lines:
      - "_* अहो कष्टं भ्रातर्व्यक्तमुरुपरिश्रान्तो दीर्घमध्वानमेक एव ऊहिवान्सुचिरं नातिपीवा न संहननाङ्गो जरसा चोपद्रुतो भवान्सखे नो एवापर एते सङ्घट्टिन इति बहुविप्रलब्धोऽप्यविद्यया रचितद्रव्यगुणकर्माशयस्वचरमकलेवरेऽवस्तुनि संस्थानविशेषेऽहं ममेत्यनध्यारोपितमिथ्याप्रत्ययो ब्रह्मभूतस्तूष्णीं शिबिकां पूर्ववदुवाह"
    iast: "_* aho kaṣṭaṃ bhrātar vyaktam uru-pariśrānto dīrgham adhvānam eka eva ūhivān suciraṃ nāti-pīvā na saṃhananāṅgo jarasā copadruto bhavān sakhe no evāpara ete saṅghaṭṭina iti bahu-vipralabdho 'py avidyayā racita-dravya-guṇa-karmāśaya-sva-carama-kalevare 'vastuni saṃsthāna-viśeṣe 'haṃ mamety anadhyāropita-mithyā-pratyayo brahma-bhūtas tūṣṇīṃ śibikāṃ pūrvavad uvāha"
  - id: '5.10.7'
    kind: verse
    lines:
      - "_* अथ पुनः स्वशिबिकायां विषमगतायां प्रकुपित उवाच रहूगणः किमिदमरे त्वं जीवन्मृतो मां कदर्थीकृत्य भर्तृशासनमतिचरसि प्रमत्तस्य च ते करोमि चिकित्सां दण्डपाणिरिव जनताया यथा प्रकृतिं स्वां भजिष्यस इति"
