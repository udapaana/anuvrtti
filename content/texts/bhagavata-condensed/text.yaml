    iast: "nāśnataḥ pathyamevānnaṃ vyādhayo 'bhibhavanti hi | evaṃ niyamakṛdrājan śanaiḥ kṣemāya kalpate"
  - id: '6.1.15'
    kind: verse
    lines:
      - "केचित्केवलया भक्त्या वासुदेवपरायणाः"
      - "अघं धुन्वन्ति कार्त्स्न्येन नीहारमिव भास्करः"
    iast: "kecit kevalayā bhaktyā vāsudevaparāyaṇāḥ | aghaṃ dhunvanti kārtsnyena nīhāramiva bhāskaraḥ"
  - id: '6.1.18'
    kind: verse
    lines:
      - "प्रायश्चित्तानि चीर्णानि नारायणपराङ्मुखम्"
      - "न निष्पुनन्ति राजेन्द्र सुराकुम्भमिवापगाः"
    iast: "prāyaścittāni cīrṇāni nārāyaṇaparāṅmukham | na niṣpunanti rājendra surākumbhamivāpagāḥ"
  - id: '6.1.20'
    kind: verse
    lines:
      - "अत्र चोदाहरन्तीममितिहासं पुरातनम्"
      - "दूतानां विष्णुयमयोः संवादस्तं निबोध मे"
    iast: "atra codāharantīmamitihāsaṃ purātanam | dūtānāṃ viṣṇuyamayoḥ saṃvādastaṃ nibodha me"
  - id: '6.1.21'
    kind: verse
    lines:
      - "कान्यकुब्जे द्विजः कश्चिद्दासीपतिरजामिलः"
      - "नाम्ना नष्टसदाचारो दास्याः संसर्गदूषितः"
    iast: "kānyakubje dvijaḥ kaściddāsīpatirajāmilaḥ | nāmnā naṣṭasadācāro dāsyāḥ saṃsargadūṣitaḥ"
  - id: '6.1.22'
    kind: verse
    lines:
      - "बन्द्यक्षैः कैतवैश्चौर्यैर्गर्हितां वृत्तिमास्थितः"
      - "बिभ्रत्कुटुम्बमशुचिर्यातयामास देहिनः"
    iast: "bandyakṣaiḥ kaitavaiścauryairgarhitāṃ vṛttimāsthitaḥ | bibhrat kuṭumbamaśuciryātayāmāsa dehinaḥ"
  - id: '6.1.25'
    kind: verse
    lines:
      - "स बद्धहृदयस्तस्मिन्नर्भके कलभाषिणि"
      - "निरीक्षमाणस्तल्लीलां मुमुदे जरठो भृशम्"
    iast: "sa baddhahṛdayastasminnarbhake kalabhāṣiṇi | nirīkṣamāṇastallīlāṃ mumude jaraṭho bhṛśam"
  - id: '6.1.27'
    kind: verse
    lines:
      - "स एवं वर्तमानोऽज्ञो मृत्युकाल उपस्थिते"
      - "मतिं चकार तनये बाले नारायणाह्वये"
    iast: "sa evaṃ vartamāno 'jño mṛtyukāla upasthite | matiṃ cakāra tanaye bāle nārāyaṇāhvaye"
  - id: '6.1.28'
    kind: verse
    lines:
      - "स पाशहस्तांस्त्रीन्दृष्ट्वा पुरुषानतिदारुणान्"
      - "वक्रतुण्डानूर्ध्वरोम्ण आत्मानं नेतुमागतान्"
    iast: "sa pāśahastāṃstrīn dṛṣṭvā puruṣān atidāruṇān | vakratuṇḍān ūrdhvaromṇa ātmānaṃ netumāgatān"
  - id: '6.1.29'
    kind: verse
    lines:
      - "दूरे क्रीडनकासक्तं पुत्रं नारायणाह्वयम्"
      - "प्लावितेन स्वरेणोच्चैराजुहावाकुलेन्द्रियः"
    iast: "dūre krīḍanakāsaktaṃ putraṃ nārāyaṇāhvayam | plāvitena svareṇoccairājuhāvākulendriyaḥ"
  - id: '6.1.31'
    kind: verse
    lines:
      - "विकर्षतोऽन्तर्हृदयाद्दासीपतिमजामिलम्"
      - "यमप्रेष्यान्विष्णुदूता वारयामासुरोजसा"
    iast: "vikarṣato 'ntarhṛdayāddāsīpatimajāmilam | yamapreṣyān viṣṇudūtā vārayāmāsurojasā"
  - id: '6.1.32'
    kind: verse
    lines:
      - "ऊचुर्निषेधितास्तांस्ते वैवस्वतपुरःसराः"
      - "के यूयं प्रतिषेद्धारो धर्मराजस्य शासनम्"
    iast: "ūcurniṣedhitāstāṃste vaivasvatapuraḥsarāḥ | ke yūyaṃ pratiṣeddhāro dharmarājasya śāsanam"
  - id: '6.1.40'
    kind: verse
    lines:
      - "वेदप्रणिहितो धर्मो ह्यधर्मस्तद्विपर्ययः"
      - "वेदो नारायणः साक्षात्स्वयम्भूरिति शुश्रुम"
    iast: "vedapraṇihito dharmo hy adharmastadviparyayaḥ | vedo nārāyaṇaḥ sākṣāt svayambhūriti śuśruma"
  - id: '6.1.43'
    kind: verse
    lines:
      - "एतैरधर्मो विज्ञातः स्थानं दण्डस्य युज्यते"
      - "सर्वे कर्मानुरोधेन दण्डमर्हन्ति कारिणः"
    iast: "etairadharmo vijñātaḥ sthānaṃ daṇḍasya yujyate | sarve karmānurodhena daṇḍamarhanti kāriṇaḥ"
  - id: '6.1.56'
    kind: verse
    lines:
      - "अयं हि श्रुतसम्पन्नः शीलवृत्तगुणालयः"
      - "धृतव्रतो मृदुर्दान्तः सत्यवाङ्मन्त्रविच्छुचिः"
    iast: "ayaṃ hi śrutasampannaḥ śīlavṛttaguṇālayaḥ | dhṛtavrato mṛdurdāntaḥ satyavāṅ mantravic chuciḥ"
  - id: '6.1.58'
    kind: verse
    lines:
      - "एकदासौ वनं यातः पितृसन्देशकृद्द्विजः"
      - "आदाय तत आवृत्तः फलपुष्पसमित्कुशान्"
    iast: "ekadāsau vanaṃ yātaḥ pitṛsandeśakṛddvijaḥ | ādāya tata āvṛttaḥ phalapuṣpasamitkuśān"
  - id: '6.1.59'
    kind: verse
    lines:
      - "ददर्श कामिनं कञ्चिच्छूद्रं सह भुजिष्यया"
      - "पीत्वा च मधु मैरेयं मदाघूर्णितनेत्रया"
    iast: "dadarśa kāminaṃ kañcic chūdraṃ saha bhujiṣyayā | pītvā ca madhu maireyaṃ madāghūrṇitanetrayā"
  - id: '6.1.60'
    kind: verse
    lines:
      - "मत्तया विश्लथन्नीव्या व्यपेतं निरपत्रपम्"
      - "क्रीडन्तमनुगायन्तं हसन्तमनयान्तिके"
    iast: "mattayā viślathannīvyā vyapetaṃ nirapatrapam | krīḍantamanugāyantaṃ hasantamanayāntike"
  - id: '6.1.63'
    kind: verse
    lines:
      - "तन्निमित्तस्मरव्याज ग्रहग्रस्तो विचेतनः"
      - "तामेव मनसा ध्यायन्स्वधर्माद्विरराम ह"
    iast: "tannimittasmaravyāja grahagrasto vicetanaḥ | tāmeva manasā dhyāyan svadharmādvirarāma ha"
  - id: '6.1.64'
    kind: verse
    lines:
      - "तामेव तोषयामास पित्र्येणार्थेन यावता"
      - "ग्राम्यैर्मनोरमैः कामैः प्रसीदेत यथा तथा"
    iast: "tāmeva toṣayāmāsa pitryeṇārthena yāvatā | grāmyairmanoramaiḥ kāmaiḥ prasīdeta yathā tathā"
  - id: '6.1.65'
    kind: verse
    lines:
      - "विप्रां स्वभार्यामप्रौढां कुले महति लम्भिताम्"
      - "विससर्जाचिरात्पापः स्वैरिण्यापाङ्गविद्धधीः"
    iast: "viprāṃ svabhāryāmaprauḍhāṃ kule mahati lambhitām | visasarjācirāt pāpaḥ svairiṇyāpāṅgaviddhadhīḥ"
  - id: '6.1.66'
    kind: verse
    lines:
      - "यतस्ततश्चोपनिन्ये न्यायतोऽन्यायतो धनम्"
      - "बभारास्याः कुटुम्बिन्याः कुटुम्बं मन्दधीरयम्"
    iast: "yatastataścopaninye nyāyato 'nyāyato dhanam | babhārāsyāḥ kuṭumbinyāḥ kuṭumbaṃ mandadhīrayam"
  - id: '6.1.67'
    kind: verse
    lines:
      - "यदसौ शास्त्रमुल्लङ्घ्य स्वैरचार्यतिगर्हितः"
      - "अवर्तत चिरं कालमघायुरशुचिर्मलात्"
    iast: "yadasau śāstramullaṅghya svairacāry atigarhitaḥ | avartata ciraṃ kālamaghāyuraśucirmalāt"
  - id: '6.1.68'
    kind: verse
    lines:
      - "तत एनं दण्डपाणेः सकाशं कृतकिल्बिषम्"
      - "नेष्यामोऽकृतनिर्वेशं यत्र दण्डेन शुद्ध्यति"
    iast: "tata enaṃ daṇḍapāṇeḥ sakāśaṃ kṛtakilbiṣam | neṣyāmo 'kṛtanirveśaṃ yatra daṇḍena śuddhyati"
  - id: '6.2.7'
    kind: verse
    lines:
      - "अयं हि कृतनिर्वेशो जन्मकोट्यंहसामपि"
      - "यद्व्याजहार विवशो नाम स्वस्त्ययनं हरेः"
    iast: "ayaṃ hi kṛtanirveśo janmakoṭyaṃhasāmapi | yadvyājahāra vivaśo nāma svastyayanaṃ hareḥ"
  - id: '6.2.10'
    kind: verse
    lines:
      - "सर्वेषामप्यघवतामिदमेव सुनिष्कृतम्"
      - "नामव्याहरणं विष्णोर्यतस्तद्विषया मतिः"
    iast: "sarveṣāmapy aghavatāmidameva suniṣkṛtam | nāmavyāharaṇaṃ viṣṇoryatastadviṣayā matiḥ"
  - id: '6.2.14'
    kind: verse
    lines:
      - "साङ्केत्यं पारिहास्यं वा स्तोभं हेलनमेव वा"
      - "वैकुण्ठनामग्रहणमशेषाघहरं विदुः"
    iast: "sāṅketyaṃ pārihāsyaṃ vā stobhaṃ helanameva vā | vaikuṇṭhanāmagrahaṇamaśeṣāghaharaṃ viduḥ"
  - id: '6.2.18'
    kind: verse
    lines:
      - "अज्ञानादथवा ज्ञानादुत्तमश्लोकनाम यत्"
      - "सङ्कीर्तितमघं पुंसो दहेदेधो यथानलः"
    iast: "ajñānādathavā jñānāduttamaślokanāma yat | saṅkīrtitamaghaṃ puṃso dahededho yathānalaḥ"
  - id: '6.2.19'
    kind: verse
    lines:
      - "यथागदं वीर्यतममुपयुक्तं यदृच्छया"
      - "अजानतोऽप्यात्मगुणं कुर्यान्मन्त्रोऽप्युदाहृतः"
    iast: "yathāgadaṃ vīryatamamupayuktaṃ yadṛcchayā | ajānato 'py ātmaguṇaṃ kuryān mantro 'py udāhṛtaḥ"
  - id: '6.2.21'
    kind: verse
    lines:
      - "इति प्रत्युदिता याम्या दूता यात्वा यमान्तिकम्"
      - "यमराज्ञे यथा सर्वमाचचक्षुररिन्दम"
    iast: "iti pratyuditā yāmyā dūtā yātvā yamāntikam | yamarājñe yathā sarvamācacakṣurarindama"
  - id: '6.2.25'
    kind: verse
    lines:
      - "भक्तिमान्भगवत्याशु माहात्म्यश्रवणाद्धरेः"
      - "अनुतापो महानासीत्स्मरतोऽशुभमात्मनः"
    iast: "bhaktimān bhagavaty āśu māhātmyaśravaṇāddhareḥ | anutāpo mahān āsīt smarato 'śubhamātmanaḥ"
  - id: '6.2.26'
    kind: verse
    lines:
      - "अहो मे परमं कष्टमभूदविजितात्मनः"
      - "येन विप्लावितं ब्रह्म वृषल्यां जायतात्मना"
    iast: "aho me paramaṃ kaṣṭamabhūdavijitātmanaḥ | yena viplāvitaṃ brahma vṛṣalyāṃ jāyatātmanā"
  - id: '6.2.27'
    kind: verse
    lines:
      - "धिङ्मां विगर्हितं सद्भिर्दुष्कृतं कुलकज्जलम्"
      - "हित्वा बालां सतीं योऽहं सुरापीमसतीमगाम्"
    iast: "dhiṅ māṃ vigarhitaṃ sadbhirduṣkṛtaṃ kulakajjalam | hitvā bālāṃ satīṃ yo 'haṃ surāpīmasatīmagām"
  - id: '6.2.28'
    kind: verse
    lines:
      - "वृद्धावनाथौ पितरौ नान्यबन्धू तपस्विनौ"
      - "अहो मयाधुना त्यक्तावकृतज्ञेन नीचवत्"
    iast: "vṛddhāvanāthau pitarau nānyabandhū tapasvinau | aho mayādhunā tyaktāvakṛtajñena nīcavat"
  - id: '6.2.30'
    kind: verse
    lines:
      - "किमिदं स्वप्न आहो स्वित्साक्षाद्दृष्टमिहाद्भुतम्"
      - "क्व याता अद्य ते ये मां व्यकर्षन्पाशपाणयः"
    iast: "kimidaṃ svapna āho svit sākṣāddṛṣṭamihādbhutam | kva yātā adya te ye māṃ vyakarṣan pāśapāṇayaḥ"
  - id: '6.2.31'
    kind: verse
    lines:
      - "अथ ते क्व गताः सिद्धाश्चत्वारश्चारुदर्शनाः"
      - "व्यामोचयन्नीयमानं बद्ध्वा पाशैरधो भुवः"
    iast: "atha te kva gatāḥ siddhāścatvāraścārudarśanāḥ | vyāmocayan nīyamānaṃ baddhvā pāśairadho bhuvaḥ"
  - id: '6.2.35'
    kind: verse
    lines:
      - "सोऽहं तथा यतिष्यामि यतचित्तेन्द्रियानिलः"
      - "यथा न भूय आत्मानमन्धे तमसि मज्जये"
    iast: "so 'haṃ tathā yatiṣyāmi yatacittendriyānilaḥ | yathā na bhūya ātmānamandhe tamasi majjaye"
  - id: '6.2.39'
    kind: verse
    lines:
      - "इति जातसुनिर्वेदः क्षणसङ्गेन साधुषु"
      - "गङ्गाद्वारमुपेयाय मुक्तसर्वानुबन्धनः"
    iast: "iti jātasunirvedaḥ kṣaṇasaṅgena sādhuṣu | gaṅgādvāramupeyāya muktasarvānubandhanaḥ"
  - id: '6.2.40'
    kind: verse
    lines:
      - "स तस्मिन्देवसदन आसीनो योगमास्थितः"
      - "प्रत्याहृतेन्द्रियग्रामो युयोज मन आत्मनि"
    iast: "sa tasmin devasadana āsīno yogamāsthitaḥ | pratyāhṛtendriyagrāmo yuyoja mana ātmani"
  - id: '6.3.3'
    kind: verse
    lines:
      - "भगवत्पुरुषै राजन्याम्याः प्रतिहतोद्यमाः"
      - "पतिं विज्ञापयामासुर्यमं संयमनीपतिम्"
    iast: "bhagavatpuruṣai rājan yāmyāḥ pratihatodyamāḥ | patiṃ vijñāpayāmāsuryamaṃ saṃyamanīpatim"
  - id: '6.3.4'
    kind: verse
    lines:
      - "कति सन्तीह शास्तारो जीवलोकस्य वै प्रभो"
      - "त्रैविध्यं कुर्वतः कर्म फलाभिव्यक्तिहेतवः"
    iast: "kati santīha śāstāro jīvalokasya vai prabho | traividhyaṃ kurvataḥ karma phalābhivyaktihetavaḥ"
  - id: '6.3.12'
    kind: verse
    lines:
      - "परो मदन्यो जगतस्तस्थुषश्च ओतं प्रोतं पटवद्यत्र विश्वम्"
      - "यदंशतोऽस्य स्थितिजन्मनाशा नस्योतवद्यस्य वशे च लोकः"
    iast: "paro madanyo jagatastasthuṣaśca otaṃ protaṃ paṭavadyatra viśvam | yadaṃśato 'sya sthitijanmanāśā nasy otavadyasya vaśe ca lokaḥ"
  - id: '6.3.13'
    kind: verse
    lines:
      - "यो नामभिर्वाचि जनं निजायां बध्नाति तन्त्र्यामिव दामभिर्गाः"
      - "यस्मै बलिं त इमे नामकर्म निबन्धबद्धाश्चकिता वहन्ति"
    iast: "yo nāmabhirvāci janaṃ nijāyāṃ badhnāti tantryāmiva dāmabhirgāḥ | yasmai baliṃ ta ime nāmakarma nibandhabaddhāścakitā vahanti"
  - id: '6.3.18'
    kind: verse
    lines:
      - "भूतानि विष्णोः सुरपूजितानि दुर्दर्शलिङ्गानि महाद्भुतानि"
      - "रक्षन्ति तद्भक्तिमतः परेभ्यो मत्तश्च मर्त्यानथ सर्वतश्च"
    iast: "bhūtāni viṣṇoḥ surapūjitāni durdarśaliṅgāni mahādbhutāni | rakṣanti tadbhaktimataḥ parebhyo mattaśca martyān atha sarvataśca"
  - id: '6.3.19'
    kind: verse
    lines:
      - "धर्मं तु साक्षाद्भगवत्प्रणीतं न वै विदुरृषयो नापि देवाः"
      - "न सिद्धमुख्या असुरा मनुष्याः कुतो नु विद्याधरचारणादयः"
    iast: "dharmaṃ tu sākṣādbhagavatpraṇītaṃ na vai vidurṛṣayo nāpi devāḥ | na siddhamukhyā asurā manuṣyāḥ kuto nu vidyādharacāraṇādayaḥ"
  - id: '6.3.22'
    kind: verse
    lines:
      - "एतावानेव लोकेऽस्मिन्पुंसां धर्मः परः स्मृतः"
      - "भक्तियोगो भगवति तन्नामग्रहणादिभिः"
    iast: "etāvān eva loke 'smin puṃsāṃ dharmaḥ paraḥ smṛtaḥ | bhaktiyogo bhagavati tannāmagrahaṇādibhiḥ"
  - id: '6.3.23'
    kind: verse
    lines:
      - "नामोच्चारणमाहात्म्यं हरेः पश्यत पुत्रकाः"
      - "अजामिलोऽपि येनैव मृत्युपाशादमुच्यत"
    iast: "nāmoccāraṇamāhātmyaṃ hareḥ paśyata putrakāḥ | ajāmilo 'pi yenaiva mṛtyupāśādamucyata"
  - id: '6.3.27'
    kind: verse
    lines:
      - "ते देवसिद्धपरिगीतपवित्रगाथा ये साधवः समदृशो भगवत्प्रपन्नाः"
      - "तान्नोपसीदत हरेर्गदयाभिगुप्तान्नैषां वयं न च वयः प्रभवाम दण्डे"
    iast: "te devasiddhaparigītapavitragāthā ye sādhavaḥ samadṛśo bhagavatprapannāḥ | tān nopasīdata harergadayābhiguptān naiṣāṃ vayaṃ na ca vayaḥ prabhavāma daṇḍe"
  - id: '6.3.29'
    kind: verse
    lines:
      - "जिह्वा न वक्ति भगवद्गुणनामधेयं चेतश्च न स्मरति तच्चरणारविन्दम्"
      - "कृष्णाय नो नमति यच्छिर एकदापि तानानयध्वमसतोऽकृतविष्णुकृत्यान्"
    iast: "jihvā na vakti bhagavadguṇanāmadheyaṃ cetaśca na smarati taccaraṇāravindam | kṛṣṇāya no namati yacchira ekadāpi tān ānayadhvamasato 'kṛtaviṣṇukṛtyān"
  - id: '6.7.2'
    kind: verse
    lines:
      - "इन्द्रस्त्रिभुवनैश्वर्य मदोल्लङ्घितसत्पथः"
      - "मरुद्भिर्वसुभी रुद्रैरादित्यैरृभुभिर्नृप"
    iast: "indrastribhuvanaiśvarya madollaṅghitasatpathaḥ | marudbhirvasubhī rudrairādityairṛbhubhirnṛpa"
  - id: '6.7.7'
    kind: verse
    lines:
      - "स यदा परमाचार्यं देवानामात्मनश्च ह"
      - "नाभ्यनन्दत सम्प्राप्तं प्रत्युत्थानासनादिभिः"
    iast: "sa yadā paramācāryaṃ devānāmātmanaśca ha | nābhyanandata samprāptaṃ pratyutthānāsanādibhiḥ"
  - id: '6.7.8'
    kind: verse
    lines:
      - "वाचस्पतिं मुनिवरं सुरासुरनमस्कृतम्"
      - "नोच्चचालासनादिन्द्रः पश्यन्नपि सभागतम्"
    iast: "vācaspatiṃ munivaraṃ surāsuranamaskṛtam | noccacālāsanādindraḥ paśyannapi sabhāgatam"
  - id: '6.7.9'
    kind: verse
    lines:
      - "ततो निर्गत्य सहसा कविराङ्गिरसः प्रभुः"
      - "आययौ स्वगृहं तूष्णीं विद्वान्श्रीमदविक्रियाम्"
    iast: "tato nirgatya sahasā kavirāṅgirasaḥ prabhuḥ | āyayau svagṛhaṃ tūṣṇīṃ vidvān śrīmadavikriyām"
  - id: '6.7.16'
    kind: verse
    lines:
      - "एवं चिन्तयतस्तस्य मघोनो भगवान्गृहात्"
      - "बृहस्पतिर्गतोऽदृष्टां गतिमध्यात्ममायया"
    iast: "evaṃ cintayatastasya maghono bhagavān gṛhāt | bṛhaspatirgato 'dṛṣṭāṃ gatimadhyātmamāyayā"
  - id: '6.7.18'
    kind: verse
    lines:
      - "तच्छ्रुत्वैवासुराः सर्व आश्रित्यौशनसं मतम्"
      - "देवान्प्रत्युद्यमं चक्रुर्दुर्मदा आततायिनः"
    iast: "tac chrutvaivāsurāḥ sarva āśrityauśanasaṃ matam | devān pratyudyamaṃ cakrurdurmadā ātatāyinaḥ"
  - id: '6.7.19'
    kind: verse
    lines:
      - "तैर्विसृष्टेषुभिस्तीक्ष्णैर्निर्भिन्नाङ्गोरुबाहवः"
      - "ब्रह्माणं शरणं जग्मुः सहेन्द्रा नतकन्धराः"
    iast: "tairvisṛṣṭeṣubhistīkṣṇairnirbhinnāṅgorubāhavaḥ | brahmāṇaṃ śaraṇaṃ jagmuḥ sahendrā natakandharāḥ"
  - id: '6.7.20'
    kind: verse
    lines:
      - "तांस्तथाभ्यर्दितान्वीक्ष्य भगवानात्मभूरजः"
      - "कृपया परया देव उवाच परिसान्त्वयन्"
    iast: "tāṃstathābhyarditān vīkṣya bhagavān ātmabhūrajaḥ | kṛpayā parayā deva uvāca parisāntvayan"
  - id: '6.7.21'
    kind: verse
    lines:
      - "अहो बत सुरश्रेष्ठा ह्यभद्रं वः कृतं महत्"
      - "ब्रह्मिष्ठं ब्राह्मणं दान्तमैश्वर्यान्नाभ्यनन्दत"
    iast: "aho bata suraśreṣṭhā hy abhadraṃ vaḥ kṛtaṃ mahat | brahmiṣṭhaṃ brāhmaṇaṃ dāntamaiśvaryān nābhyanandata"
  - id: '6.7.25'
    kind: verse
    lines:
      - "तद्विश्वरूपं भजताशु विप्रं तपस्विनं त्वाष्ट्रमथात्मवन्तम्"
      - "सभाजितोऽर्थान्स विधास्यते वो यदि क्षमिष्यध्वमुतास्य कर्म"
    iast: "tadviśvarūpaṃ bhajatāśu vipraṃ tapasvinaṃ tvāṣṭramathātmavantam | sabhājito 'rthān sa vidhāsyate vo yadi kṣamiṣyadhvamutāsya karma"
  - id: '6.7.26'
    kind: verse
    lines:
      - "त एवमुदिता राजन्ब्रह्मणा विगतज्वराः"
      - "ऋषिं त्वाष्ट्रमुपव्रज्य परिष्वज्येदमब्रुवन्"
    iast: "ta evamuditā rājan brahmaṇā vigatajvarāḥ | ṛṣiṃ tvāṣṭramupavrajya pariṣvajyedamabruvan"
  - id: '6.7.32'
    kind: verse
    lines:
      - "वृणीमहे त्वोपाध्यायं ब्रह्मिष्ठं ब्राह्मणं गुरुम्"
      - "यथाञ्जसा विजेष्यामः सपत्नांस्तव तेजसा"
    iast: "vṛṇīmahe tvopādhyāyaṃ brahmiṣṭhaṃ brāhmaṇaṃ gurum | yathāñjasā vijeṣyāmaḥ sapatnāṃstava tejasā"
  - id: '6.7.36'
    kind: verse
    lines:
      - "अकिञ्चनानां हि धनं शिलोञ्छनं तेनेह निर्वर्तितसाधुसत्क्रियः"
      - "कथं विगर्ह्यं नु करोम्यधीश्वराः पौरोधसं हृष्यति येन दुर्मतिः"
    iast: "akiñcanānāṃ hi dhanaṃ śiloñchanaṃ teneha nirvartitasādhusatkriyaḥ | kathaṃ vigarhyaṃ nu karomy adhīśvarāḥ paurodhasaṃ hṛṣyati yena durmatiḥ"
  - id: '6.7.37'
    kind: verse
    lines:
      - "तथापि न प्रतिब्रूयां गुरुभिः प्रार्थितं कियत्"
      - "भवतां प्रार्थितं सर्वं प्राणैरर्थैश्च साधये"
    iast: "tathāpi na pratibrūyāṃ gurubhiḥ prārthitaṃ kiyat | bhavatāṃ prārthitaṃ sarvaṃ prāṇairarthaiśca sādhaye"
  - id: '6.7.38'
    kind: verse
    lines:
      - "तेभ्य एवं प्रतिश्रुत्य विश्वरूपो महातपाः"
      - "पौरहित्यं वृतश्चक्रे परमेण समाधिना"
    iast: "tebhya evaṃ pratiśrutya viśvarūpo mahātapāḥ | paurahityaṃ vṛtaścakre parameṇa samādhinā"
  - id: '6.7.39'
    kind: verse
    lines:
      - "सुरद्विषां श्रियं गुप्तामौशनस्यापि विद्यया"
      - "आच्छिद्यादान्महेन्द्राय वैष्णव्या विद्यया विभुः"
    iast: "suradviṣāṃ śriyaṃ guptāmauśanasyāpi vidyayā | ācchidyādān mahendrāya vaiṣṇavyā vidyayā vibhuḥ"
  - id: '6.9.1'
    kind: verse
    lines:
      - "तस्यासन्विश्वरूपस्य शिरांसि त्रीणि भारत"
      - "सोमपीथं सुरापीथमन्नादमिति शुश्रुम"
    iast: "tasyāsan viśvarūpasya śirāṃsi trīṇi bhārata | somapīthaṃ surāpīthamannādamiti śuśruma"
  - id: '6.9.2'
    kind: verse
    lines:
      - "स वै बर्हिषि देवेभ्यो भागं प्रत्यक्षमुच्चकैः"
      - "अददद्यस्य पितरो देवाः सप्रश्रयं नृप"
    iast: "sa vai barhiṣi devebhyo bhāgaṃ pratyakṣamuccakaiḥ | adadadyasya pitaro devāḥ sapraśrayaṃ nṛpa"
  - id: '6.9.3'
    kind: verse
    lines:
      - "स एव हि ददौ भागं परोक्षमसुरान्प्रति"
      - "यजमानोऽवहद्भागं मातृस्नेहवशानुगः"
    iast: "sa eva hi dadau bhāgaṃ parokṣamasurān prati | yajamāno 'vahadbhāgaṃ mātṛsnehavaśānugaḥ"
  - id: '6.9.4'
    kind: verse
    lines:
      - "तद्देवहेलनं तस्य धर्मालीकं सुरेश्वरः"
      - "आलक्ष्य तरसा भीतस्तच्छीर्षाण्यच्छिनद्रुषा"
    iast: "taddevahelanaṃ tasya dharmālīkaṃ sureśvaraḥ | ālakṣya tarasā bhītastacchīrṣāṇy acchinadruṣā"
  - id: '6.9.11'
    kind: verse
    lines:
      - "तासु बुद्बुदफेनाभ्यां दृष्टं तद्धरति क्षिपन्"
      - "हतपुत्रस्ततस्त्वष्टा जुहावेन्द्राय शत्रवे"
    iast: "tāsu budbudaphenābhyāṃ dṛṣṭaṃ taddharati kṣipan | hataputrastatastvaṣṭā juhāvendrāya śatrave"
  - id: '6.9.12'
    kind: verse
    lines:
      - "इन्द्रशत्रो विवर्धस्व मा चिरं जहि विद्विषम्"
      - "अथान्वाहार्यपचनादुत्थितो घोरदर्शनः"
    iast: "indraśatro vivardhasva mā ciraṃ jahi vidviṣam | athānvāhāryapacanādutthito ghoradarśanaḥ"
  - id: '6.9.19'
    kind: verse
    lines:
      - "तं निजघ्नुरभिद्रुत्य सगणा विबुधर्षभाः"
      - "स्वैः स्वैर्दिव्यास्त्रशस्त्रौघैः सोऽग्रसत्तानि कृत्स्नशः"
    iast: "taṃ nijaghnurabhidrutya sagaṇā vibudharṣabhāḥ | svaiḥ svairdivyāstraśastraughaiḥ so 'grasat tāni kṛtsnaśaḥ"
  - id: '6.9.20'
    kind: verse
    lines:
      - "ततस्ते विस्मिताः सर्वे विषण्णा ग्रस्ततेजसः"
      - "प्रत्यञ्चमादिपुरुषमुपतस्थुः समाहिताः"
    iast: "tataste vismitāḥ sarve viṣaṇṇā grastatejasaḥ | pratyañcamādipuruṣamupatasthuḥ samāhitāḥ"
  - id: '6.9.47'
    kind: verse
    lines:
      - "प्रीतोऽहं वः सुरश्रेष्ठा मदुपस्थानविद्यया"
      - "आत्मैश्वर्यस्मृतिः पुंसां भक्तिश्चैव यया मयि"
    iast: "prīto 'haṃ vaḥ suraśreṣṭhā madupasthānavidyayā | ātmaiśvaryasmṛtiḥ puṃsāṃ bhaktiścaiva yayā mayi"
  - id: '6.9.51'
    kind: verse
    lines:
      - "मघवन्यात भद्रं वो दध्यञ्चमृषिसत्तमम्"
      - "विद्याव्रततपःसारं गात्रं याचत मा चिरम्"
    iast: "maghavan yāta bhadraṃ vo dadhyañcamṛṣisattamam | vidyāvratatapaḥsāraṃ gātraṃ yācata mā ciram"
  - id: '6.9.54'
    kind: verse
    lines:
      - "युष्मभ्यं याचितोऽश्विभ्यां धर्मज्ञोऽङ्गानि दास्यति"
      - "ततस्तैरायुधश्रेष्ठो विश्वकर्मविनिर्मितः"
      - "येन वृत्रशिरो हर्ता मत्तेजौपबृंहितः"
    iast: "yuṣmabhyaṃ yācito 'śvibhyāṃ dharmajño 'ṅgāni dāsyati | tatastairāyudhaśreṣṭho viśvakarmavinirmitaḥ | yena vṛtraśiro hartā mattejaupabṛṃhitaḥ"
  - id: '6.10.2'
    kind: verse
    lines:
      - "तथाभियाचितो देवैरृषिराथर्वणो महान्"
      - "मोदमान उवाचेदं प्रहसन्निव भारत"
    iast: "tathābhiyācito devairṛṣirātharvaṇo mahān | modamāna uvācedaṃ prahasanniva bhārata"
  - id: '6.10.8'
    kind: verse
    lines:
      - "योऽध्रुवेणात्मना नाथा न धर्मं न यशः पुमान्"
      - "ईहेत भूतदयया स शोच्यः स्थावरैरपि"
    iast: "yo 'dhruveṇātmanā nāthā na dharmaṃ na yaśaḥ pumān | īheta bhūtadayayā sa śocyaḥ sthāvarairapi"
  - id: '6.10.11'
    kind: verse
    lines:
      - "एवं कृतव्यवसितो दध्यङ्ङाथर्वणस्तनुम्"
      - "परे भगवति ब्रह्मण्यात्मानं सन्नयन्जहौ"
    iast: "evaṃ kṛtavyavasito dadhyaṅṅ ātharvaṇastanum | pare bhagavati brahmaṇy ātmānaṃ sannayan jahau"
  - id: '6.10.13'
    kind: verse
    lines:
      - "अथेन्द्रो वज्रमुद्यम्य निर्मितं विश्वकर्मणा"
      - "मुनेः शक्तिभिरुत्सिक्तो भगवत्तेजसान्वितः"
    iast: "athendro vajramudyamya nirmitaṃ viśvakarmaṇā | muneḥ śaktibhirutsikto bhagavattejasānvitaḥ"
  - id: '6.10.15'
    kind: verse
    lines:
      - "वृत्रमभ्यद्रवच्छत्रुमसुरानीकयूथपैः"
      - "पर्यस्तमोजसा राजन्क्रुद्धो रुद्र इवान्तकम्"
    iast: "vṛtramabhyadravac chatrumasurānīkayūthapaiḥ | paryastamojasā rājan kruddho rudra ivāntakam"
  - id: '6.10.16'
    kind: verse
    lines:
      - "ततः सुराणामसुरै रणः परमदारुणः"
      - "त्रेतामुखे नर्मदायामभवत्प्रथमे युगे"
    iast: "tataḥ surāṇāmasurai raṇaḥ paramadāruṇaḥ | tretāmukhe narmadāyāmabhavat prathame yuge"
  - id: '6.10.28'
    kind: verse
    lines:
      - "सर्वे प्रयासा अभवन्विमोघाः कृताः कृता देवगणेषु दैत्यैः"
      - "कृष्णानुकूलेषु यथा महत्सु क्षुद्रैः प्रयुक्ता ऊषती रूक्षवाचः"
    iast: "sarve prayāsā abhavan vimoghāḥ kṛtāḥ kṛtā devagaṇeṣu daityaiḥ | kṛṣṇānukūleṣu yathā mahatsu kṣudraiḥ prayuktā ūṣatī rūkṣavācaḥ"
  - id: '6.10.29'
    kind: verse
    lines:
      - "ते स्वप्रयासं वितथं निरीक्ष्य हरावभक्ता हतयुद्धदर्पाः"
      - "पलायनायाजिमुखे विसृज्य पतिं मनस्ते दधुरात्तसाराः"
    iast: "te svaprayāsaṃ vitathaṃ nirīkṣya harāvabhaktā hatayuddhadarpāḥ | palāyanāyājimukhe visṛjya patiṃ manaste dadhurāttasārāḥ"
  - id: '6.10.30'
    kind: verse
    lines:
      - "वृत्रोऽसुरांस्ताननुगान्मनस्वी प्रधावतः प्रेक्ष्य बभाष एतत्"
      - "पलायितं प्रेक्ष्य बलं च भग्नं भयेन तीव्रेण विहस्य वीरः"
    iast: "vṛtro 'surāṃstān anugān manasvī pradhāvataḥ prekṣya babhāṣa etat | palāyitaṃ prekṣya balaṃ ca bhagnaṃ bhayena tīvreṇa vihasya vīraḥ"
  - id: '6.10.32'
    kind: verse
    lines:
      - "जातस्य मृत्युर्ध्रुव एव सर्वतः प्रतिक्रिया यस्य न चेह कॢप्ता"
      - "लोको यशश्चाथ ततो यदि ह्यमुं को नाम मृत्युं न वृणीत युक्तम्"
    iast: "jātasya mṛtyurdhruva eva sarvataḥ pratikriyā yasya na ceha kḷptā | loko yaśaścātha tato yadi hy amuṃ ko nāma mṛtyuṃ na vṛṇīta yuktam"
  - id: '6.11.1'
    kind: verse
    lines:
      - "त एवं शंसतो धर्मं वचः पत्युरचेतसः"
      - "नैवागृह्णन्त सम्भ्रान्ताः पलायनपरा नृप"
    iast: "ta evaṃ śaṃsato dharmaṃ vacaḥ patyuracetasaḥ | naivāgṛhṇanta sambhrāntāḥ palāyanaparā nṛpa"
  - id: '6.11.13'
    kind: verse
    lines:
      - "स तं नृपेन्द्राहवकाम्यया रिपुं वज्रायुधं भ्रातृहणं विलोक्य"
      - "स्मरंश्च तत्कर्म नृशंसमंहः शोकेन मोहेन हसन्जगाद"
    iast: "sa taṃ nṛpendrāhavakāmyayā ripuṃ vajrāyudhaṃ bhrātṛhaṇaṃ vilokya | smaraṃśca tatkarma nṛśaṃsamaṃhaḥ śokena mohena hasan jagāda"
  - id: '6.11.14'
    kind: verse
    lines:
      - "दिष्ट्या भवान्मे समवस्थितो रिपुर्यो ब्रह्महा गुरुहा भ्रातृहा च"
      - "दिष्ट्यानृणोऽद्याहमसत्तम त्वया मच्छूलनिर्भिन्नदृषद्धृदाचिरात्"
    iast: "diṣṭyā bhavān me samavasthito ripur yo brahmahā guruhā bhrātṛhā ca | diṣṭyānṛṇo 'dyāhamasattama tvayā macchūlanirbhinnadṛṣaddhṛdācirāt"
  - id: '6.11.19'
    kind: verse
    lines:
      - "सुरेश कस्मान्न हिनोषि वज्रं पुरः स्थिते वैरिणि मय्यमोघम्"
      - "मा संशयिष्ठा न गदेव वज्रः स्यान्निष्फलः कृपणार्थेव याच्ञा"
    iast: "sureśa kasmān na hinoṣi vajraṃ puraḥ sthite vairiṇi mayy amogham | mā saṃśayiṣṭhā na gadeva vajraḥ syān niṣphalaḥ kṛpaṇārtheva yācñā"
  - id: '6.11.20'
    kind: verse
    lines:
      - "नन्वेष वज्रस्तव शक्र तेजसा हरेर्दधीचेस्तपसा च तेजितः"
      - "तेनैव शत्रुं जहि विष्णुयन्त्रितो यतो हरिर्विजयः श्रीर्गुणास्ततः"
    iast: "nanveṣa vajrastava śakra tejasā harerdadhīcestapasā ca tejitaḥ | tenaiva śatruṃ jahi viṣṇuyantrito yato harirvijayaḥ śrīrguṇāstataḥ"
  - id: '6.11.21'
    kind: verse
    lines:
      - "अहं समाधाय मनो यथाह नः सङ्कर्षणस्तच्चरणारविन्दे"
      - "त्वद्वज्ररंहोलुलितग्राम्यपाशो गतिं मुनेर्याम्यपविद्धलोकः"
    iast: "ahaṃ samādhāya mano yathāha naḥ saṅkarṣaṇastaccaraṇāravinde | tvadvajraraṃholulitagrāmyapāśo gatiṃ muneryāmy apaviddhalokaḥ"
  - id: '6.12.1'
    kind: verse
    lines:
      - "एवं जिहासुर्नृप देहमाजौ मृत्युं वरं विजयान्मन्यमानः"
      - "शूलं प्रगृह्याभ्यपतत्सुरेन्द्रं यथा महापुरुषं कैटभोऽप्सु"
    iast: "evaṃ jihāsurnṛpa dehamājau mṛtyuṃ varaṃ vijayān manyamānaḥ | śūlaṃ pragṛhyābhyapatat surendraṃ yathā mahāpuruṣaṃ kaiṭabho 'psu"
  - id: '6.12.2'
    kind: verse
    lines:
      - "ततो युगान्ताग्निकठोरजिह्वमाविध्य शूलं तरसासुरेन्द्रः"
      - "क्षिप्त्वा महेन्द्राय विनद्य वीरो हतोऽसि पापेति रुषा जगाद"
    iast: "tato yugāntāgnikaṭhorajihvam āvidhya śūlaṃ tarasāsurendraḥ | kṣiptvā mahendrāya vinadya vīro hato 'si pāpeti ruṣā jagāda"
  - id: '6.12.4'
    kind: verse
    lines:
      - "छिन्नैकबाहुः परिघेण वृत्रः संरब्ध आसाद्य गृहीतवज्रम्"
      - "हनौ तताडेन्द्रमथामरेभं वज्रं च हस्तान्न्यपतन्मघोनः"
    iast: "chinnaikabāhuḥ parigheṇa vṛtraḥ saṃrabdha āsādya gṛhītavajram | hanau tatāḍendramathāmarebhaṃ vajraṃ ca hastān nyapatan maghonaḥ"
  - id: '6.12.6'
    kind: verse
    lines:
      - "इन्द्रो न वज्रं जगृहे विलज्जितश्च्युतं स्वहस्तादरिसन्निधौ पुनः"
      - "तमाह वृत्रो हर आत्तवज्रो जहि स्वशत्रुं न विषादकालः"
    iast: "indro na vajraṃ jagṛhe vilajjitaś cyutaṃ svahastādarisannidhau punaḥ | tamāha vṛtro hara āttavajro jahi svaśatruṃ na viṣādakālaḥ"
  - id: '6.12.8'
    kind: verse
    lines:
      - "लोकाः सपाला यस्येमे श्वसन्ति विवशा वशे"
      - "द्विजा इव शिचा बद्धाः स काल इह कारणम्"
    iast: "lokāḥ sapālā yasyeme śvasanti vivaśā vaśe | dvijā iva śicā baddhāḥ sa kāla iha kāraṇam"
  - id: '6.12.9'
    kind: verse
    lines:
      - "ओजः सहो बलं प्राणममृतं मृत्युमेव च"
      - "तमज्ञाय जनो हेतुमात्मानं मन्यते जडम्"
    iast: "ojaḥ saho balaṃ prāṇamamṛtaṃ mṛtyumeva ca | tamajñāya jano hetumātmānaṃ manyate jaḍam"
  - id: '6.12.13'
    kind: verse
    lines:
      - "आयुः श्रीः कीर्तिरैश्वर्यमाशिषः पुरुषस्य याः"
      - "भवन्त्येव हि तत्काले यथानिच्छोर्विपर्ययाः"
    iast: "āyuḥ śrīḥ kīrtiraiśvaryamāśiṣaḥ puruṣasya yāḥ | bhavanty eva hi tatkāle yathānicchorviparyayāḥ"
  - id: '6.12.14'
    kind: verse
    lines:
      - "तस्मादकीर्तियशसोर्जयापजययोरपि"
      - "समः स्यात्सुखदुःखाभ्यां मृत्युजीवितयोस्तथा"
    iast: "tasmādakīrtiyaśasorjayāpajayayorapi | samaḥ syāt sukhaduḥkhābhyāṃ mṛtyujīvitayostathā"
  - id: '6.12.19'
    kind: verse
    lines:
      - "अहो दानव सिद्धोऽसि यस्य ते मतिरीदृशी"
      - "भक्तः सर्वात्मनात्मानं सुहृदं जगदीश्वरम्"
    iast: "aho dānava siddho 'si yasya te matirīdṛśī | bhaktaḥ sarvātmanātmānaṃ suhṛdaṃ jagadīśvaram"
  - id: '6.12.20'
    kind: verse
    lines:
      - "भवानतार्षीन्मायां वै वैष्णवीं जनमोहिनीम्"
      - "यद्विहायासुरं भावं महापुरुषतां गतः"
    iast: "bhavān atārṣīn māyāṃ vai vaiṣṇavīṃ janamohinīm | yadvihāyāsuraṃ bhāvaṃ mahāpuruṣatāṃ gataḥ"
  - id: '6.12.23'
    kind: verse
    lines:
      - "इति ब्रुवाणावन्योन्यं धर्मजिज्ञासया नृप"
      - "युयुधाते महावीर्याविन्द्रवृत्रौ युधाम्पती"
    iast: "iti bruvāṇāvanyonyaṃ dharmajijñāsayā nṛpa | yuyudhāte mahāvīryāvindravṛtrau yudhāmpatī"
  - id: '6.12.30'
    kind: verse
    lines:
      - "जग्रास स समासाद्य वज्रिणं सहवाहनम्"
      - "वृत्रग्रस्तं तमालोक्य सप्रजापतयः सुराः"
      - "हा कष्टमिति निर्विण्णाश्चुक्रुशुः समहर्षयः"
    iast: "jagrāsa sa samāsādya vajriṇaṃ sahavāhanam | vṛtragrastaṃ tamālokya saprajāpatayaḥ surāḥ | hā kaṣṭamiti nirviṇṇāścukruśuḥ samaharṣayaḥ"
  - id: '6.12.32'
    kind: verse
    lines:
      - "भित्त्वा वज्रेण तत्कुक्षिं निष्क्रम्य बलभिद्विभुः"
      - "उच्चकर्त शिरः शत्रोर्गिरिशृङ्गमिवौजसा"
    iast: "bhittvā vajreṇa tatkukṣiṃ niṣkramya balabhidvibhuḥ | uccakarta śiraḥ śatrorgiriśṛṅgamivaujasā"
  - id: '6.12.35'
    kind: verse
    lines:
      - "वृत्रस्य देहान्निष्क्रान्तमात्मज्योतिररिन्दम"
      - "पश्यतां सर्वदेवानामलोकं समपद्यत"
    iast: "vṛtrasya dehān niṣkrāntamātmajyotirarindama | paśyatāṃ sarvadevānāmalokaṃ samapadyata"
  - id: '6.13.19'
    kind: verse
    lines:
      - "अथेज्यमाने पुरुषे सर्वदेवमयात्मनि"
      - "अश्वमेधे महेन्द्रेण वितते ब्रह्मवादिभिः"
    iast: "athejyamāne puruṣe sarvadevamayātmani | aśvamedhe mahendreṇa vitate brahmavādibhiḥ"
  - id: '6.13.20'
    kind: verse
    lines:
      - "स वै त्वाष्ट्रवधो भूयानपि पापचयो नृप"
      - "नीतस्तेनैव शून्याय नीहार इव भानुना"
    iast: "sa vai tvāṣṭravadho bhūyān api pāpacayo nṛpa | nītastenaiva śūnyāya nīhāra iva bhānunā"
  - id: '7.1.26'
    kind: verse
    lines:
      - "यथा वैरानुबन्धेन मर्त्यस्तन्मयतामियात्"
      - "न तथा भक्तियोगेन इति मे निश्चिता मतिः"
    iast: "yathā vairānubandhena martyastanmayatāmiyāt | na tathā bhaktiyogena iti me niścitā matiḥ"
  - id: '7.1.28'
    kind: verse
    lines:
      - "एवं कृष्णे भगवति मायामनुज ईश्वरे"
      - "वैरेण पूतपाप्मानस्तमापुरनुचिन्तया"
    iast: "evaṃ kṛṣṇe bhagavati māyāmanuja īśvare | vaireṇa pūtapāpmānastamāpuranucintayā"
  - id: '7.1.29'
    kind: verse
    lines:
      - "कामाद्द्वेषाद्भयात्स्नेहाद्यथा भक्त्येश्वरे मनः"
      - "आवेश्य तदघं हित्वा बहवस्तद्गतिं गताः"
    iast: "kāmāddveṣādbhayāt snehādyathā bhaktyeśvare manaḥ | āveśya tadaghaṃ hitvā bahavastadgatiṃ gatāḥ"
  - id: '7.1.39'
    kind: verse
    lines:
      - "जज्ञाते तौ दितेः पुत्रौ दैत्यदानववन्दितौ"
      - "हिरण्यकशिपुर्ज्येष्ठो हिरण्याक्षोऽनुजस्ततः"
    iast: "jajñāte tau diteḥ putrau daityadānavavanditau | hiraṇyakaśipurjyeṣṭho hiraṇyākṣo 'nujastataḥ"
  - id: '7.1.40'
    kind: verse
    lines:
      - "हतो हिरण्यकशिपुर्हरिणा सिंहरूपिणा"
      - "हिरण्याक्षो धरोद्धारे बिभ्रता शौकरं वपुः"
    iast: "hato hiraṇyakaśipurhariṇā siṃharūpiṇā | hiraṇyākṣo dharoddhāre bibhratā śaukaraṃ vapuḥ"
  - id: '7.2.1'
    kind: verse
    lines:
      - "भ्रातर्येवं विनिहते हरिणा क्रोडमूर्तिना"
      - "हिरण्यकशिपू राजन्पर्यतप्यद्रुषा शुचा"
    iast: "bhrātaryevaṃ vinihate hariṇā kroḍamūrtinā | hiraṇyakaśipū rājan paryatapyadruṣā śucā"
  - id: '7.2.2'
    kind: verse
    lines:
      - "आह चेदं रुषा पूर्णः सन्दष्टदशनच्छदः"
      - "कोपोज्ज्वलद्भ्यां चक्षुर्भ्यां निरीक्षन्धूम्रमम्बरम्"
    iast: "āha cedaṃ ruṣā pūrṇaḥ sandaṣṭadaśanacchadaḥ | kopojjvaladbhyāṃ cakṣurbhyāṃ nirīkṣan dhūmramambaram"
  - id: '7.2.12'
    kind: verse
    lines:
      - "यत्र यत्र द्विजा गावो वेदा वर्णाश्रमक्रियाः"
      - "तं तं जनपदं यात सन्दीपयत वृश्चत"
    iast: "yatra yatra dvijā gāvo vedā varṇāśramakriyāḥ | taṃ taṃ janapadaṃ yāta sandīpayata vṛścata"
  - id: '7.3.1'
    kind: verse
    lines:
      - "हिरण्यकशिपू राजन्नजेयमजरामरम्"
      - "आत्मानमप्रतिद्वन्द्वमेकराजं व्यधित्सत"
    iast: "hiraṇyakaśipū rājannajeyamajarāmaram | ātmānamapratidvandvamekarājaṃ vyadhitsata"
  - id: '7.3.2'
    kind: verse
    lines:
      - "स तेपे मन्दरद्रोण्यां तपः परमदारुणम्"
      - "ऊर्ध्वबाहुर्नभोदृष्टिः पादाङ्गुष्ठाश्रितावनिः"
    iast: "sa tepe mandaradroṇyāṃ tapaḥ paramadāruṇam | ūrdhvabāhurnabhodṛṣṭiḥ pādāṅguṣṭhāśritāvaniḥ"
  - id: '7.3.3'
    kind: verse
    lines:
      - "जटादीधितिभी रेजे संवर्तार्क इवांशुभिः"
      - "तस्मिंस्तपस्तप्यमाने देवाः स्थानानि भेजिरे"
    iast: "jaṭādīdhitibhī reje saṃvartārka ivāṃśubhiḥ | tasmiṃstapastapyamāne devāḥ sthānāni bhejire"
  - id: '7.3.16'
    kind: verse
    lines:
      - "तपन्तं तपसा लोकान्यथाभ्रापिहितं रविम्"
      - "विलक्ष्य विस्मितः प्राह हसंस्तं हंसवाहनः"
    iast: "tapantaṃ tapasā lokān yathābhrāpihitaṃ ravim | vilakṣya vismitaḥ prāha hasaṃstaṃ haṃsavāhanaḥ"
  - id: '7.3.17'
    kind: verse
    lines:
      - "उत्तिष्ठोत्तिष्ठ भद्रं ते तपःसिद्धोऽसि काश्यप"
      - "वरदोऽहमनुप्राप्तो व्रियतामीप्सितो वरः"
    iast: "uttiṣṭhottiṣṭha bhadraṃ te tapaḥsiddho 'si kāśyapa | varado 'hamanuprāpto vriyatāmīpsito varaḥ"
  - id: '7.3.35'
    kind: verse
    lines:
      - "यदि दास्यस्यभिमतान्वरान्मे वरदोत्तम"
      - "भूतेभ्यस्त्वद्विसृष्टेभ्यो मृत्युर्मा भून्मम प्रभो"
    iast: "yadi dāsyasyabhimatān varān me varadottama | bhūtebhyastvadvisṛṣṭebhyo mṛtyurmā bhūn mama prabho"
  - id: '7.3.36'
    kind: verse
    lines:
      - "नान्तर्बहिर्दिवा नक्तमन्यस्मादपि चायुधैः"
      - "न भूमौ नाम्बरे मृत्युर्न नरैर्न मृगैरपि"
    iast: "nāntarbahirdivā naktamanyasmādapi cāyudhaiḥ | na bhūmau nāmbare mṛtyurna narairna mṛgairapi"
  - id: '7.3.37'
    kind: verse
    lines:
      - "व्यसुभिर्वासुमद्भिर्वा सुरासुरमहोरगैः"
      - "अप्रतिद्वन्द्वतां युद्धे ऐकपत्यं च देहिनाम्"
    iast: "vyasubhirvāsumadbhirvā surāsuramahoragaiḥ | apratidvandvatāṃ yuddhe aikapatyaṃ ca dehinām"
  - id: '7.3.38'
    kind: verse
    lines:
      - "सर्वेषां लोकपालानां महिमानं यथात्मनः"
      - "तपोयोगप्रभावाणां यन्न रिष्यति कर्हिचित्"
    iast: "sarveṣāṃ lokapālānāṃ mahimānaṃ yathātmanaḥ | tapoyogaprabhāvāṇāṃ yan na riṣyati karhicit"
  - id: '7.4.1'
    kind: verse
    lines:
      - "एवं वृतः शतधृतिर्हिरण्यकशिपोरथ"
      - "प्रादात्तत्तपसा प्रीतो वरांस्तस्य सुदुर्लभान्"
    iast: "evaṃ vṛtaḥ śatadhṛtirhiraṇyakaśiporatha | prādāt tattapasā prīto varāṃstasya sudurlabhān"
  - id: '7.4.4'
    kind: verse
    lines:
      - "एवं लब्धवरो दैत्यो बिभ्रद्धेममयं वपुः"
      - "भगवत्यकरोद्द्वेषं भ्रातुर्वधमनुस्मरन्"
    iast: "evaṃ labdhavaro daityo bibhraddhemamayaṃ vapuḥ | bhagavatyakaroddveṣaṃ bhrāturvadhamanusmaran"
  - id: '7.4.5'
    kind: verse
    lines:
      - "स विजित्य दिशः सर्वा लोकांश्च त्रीन्महासुरः"
      - "देवासुरमनुष्येन्द्र गन्धर्वगरुडोरगान्"
    iast: "sa vijitya diśaḥ sarvā lokāṃśca trīn mahāsuraḥ | devāsuramanuṣyendra gandharvagaruḍoragān"
  - id: '7.4.7'
    kind: verse
    lines:
      - "सर्वसत्त्वपतीन्जित्वा वशमानीय विश्वजित्"
      - "जहार लोकपालानां स्थानानि सह तेजसा"
    iast: "sarvasattvapatīn jitvā vaśamānīya viśvajit | jahāra lokapālānāṃ sthānāni saha tejasā"
  - id: '7.4.8'
    kind: verse
    lines:
      - "देवोद्यानश्रिया जुष्टमध्यास्ते स्म त्रिपिष्टपम्"
      - "महेन्द्रभवनं साक्षान्निर्मितं विश्वकर्मणा"
      - "त्रैलोक्यलक्ष्म्यायतनमध्युवासाखिलर्द्धिमत्"
    iast: "devodyānaśriyā juṣṭamadhyāste sma tripiṣṭapam | mahendrabhavanaṃ sākṣān nirmitaṃ viśvakarmaṇā | trailokyalakṣmyāyatanamadhyuvāsākhilarddhimat"
  - id: '7.4.21'
    kind: verse
    lines:
      - "तस्योग्रदण्डसंविग्नाः सर्वे लोकाः सपालकाः"
      - "अन्यत्रालब्धशरणाः शरणं ययुरच्युतम्"
    iast: "tasyogradaṇḍasaṃvignāḥ sarve lokāḥ sapālakāḥ | anyatrālabdhaśaraṇāḥ śaraṇaṃ yayuracyutam"
  - id: '7.4.24'
    kind: verse
    lines:
      - "तेषामाविरभूद्वाणी अरूपा मेघनिःस्वना"
      - "सन्नादयन्ती ककुभः साधूनामभयङ्करी"
    iast: "teṣāmāvirabhūdvāṇī arūpā meghaniḥsvanā | sannādayantī kakubhaḥ sādhūnāmabhayaṅkarī"
  - id: '7.4.25'
    kind: verse
    lines:
      - "मा भैष्ट विबुधश्रेष्ठाः सर्वेषां भद्रमस्तु वः"
      - "मद्दर्शनं हि भूतानां सर्वश्रेयोपपत्तये"
    iast: "mā bhaiṣṭa vibudhaśreṣṭhāḥ sarveṣāṃ bhadramastu vaḥ | maddarśanaṃ hi bhūtānāṃ sarvaśreyopapattaye"
  - id: '7.4.26'
    kind: verse
    lines:
      - "ज्ञातमेतस्य दौरात्म्यं दैतेयापसदस्य यत्"
      - "तस्य शान्तिं करिष्यामि कालं तावत्प्रतीक्षत"
    iast: "jñātametasya daurātmyaṃ daiteyāpasadasya yat | tasya śāntiṃ kariṣyāmi kālaṃ tāvat pratīkṣata"
  - id: '7.4.27'
    kind: verse
    lines:
      - "यदा देवेषु वेदेषु गोषु विप्रेषु साधुषु"
      - "धर्मे मयि च विद्वेषः स वा आशु विनश्यति"
    iast: "yadā deveṣu vedeṣu goṣu vipreṣu sādhuṣu | dharme mayi ca vidveṣaḥ sa vā āśu vinaśyati"
  - id: '7.4.28'
    kind: verse
    lines:
      - "निर्वैराय प्रशान्ताय स्वसुताय महात्मने"
      - "प्रह्रादाय यदा द्रुह्येद्धनिष्येऽपि वरोर्जितम्"
    iast: "nirvairāya praśāntāya svasutāya mahātmane | prahrādāya yadā druhyeddhaniṣye 'pi varorjitam"
  - id: '7.4.29'
    kind: verse
    lines:
      - "इत्युक्ता लोकगुरुणा तं प्रणम्य दिवौकसः"
      - "न्यवर्तन्त गतोद्वेगा मेनिरे चासुरं हतम्"
    iast: "ityuktā lokaguruṇā taṃ praṇamya divaukasaḥ | nyavartanta gatodvegā menire cāsuraṃ hatam"
  - id: '7.4.30'
    kind: verse
    lines:
      - "तस्य दैत्यपतेः पुत्राश्चत्वारः परमाद्भुताः"
      - "प्रह्रादोऽभून्महांस्तेषां गुणैर्महदुपासकः"
    iast: "tasya daityapateḥ putrāścatvāraḥ paramādbhutāḥ | prahrādo 'bhūn mahāṃsteṣāṃ guṇairmahadupāsakaḥ"
  - id: '7.4.31'
    kind: verse
    lines:
      - "ब्रह्मण्यः शीलसम्पन्नः सत्यसन्धो जितेन्द्रियः"
      - "आत्मवत्सर्वभूतानामेकप्रियसुहृत्तमः"
    iast: "brahmaṇyaḥ śīlasampannaḥ satyasandho jitendriyaḥ | ātmavat sarvabhūtānāmekapriyasuhṛttamaḥ"
  - id: '7.4.32'
    kind: verse
    lines:
      - "दासवत्सन्नतार्याङ्घ्रिः पितृवद्दीनवत्सलः"
      - "भ्रातृवत्सदृशे स्निग्धो गुरुष्वीश्वरभावनः"
      - "विद्यार्थरूपजन्माढ्यो मानस्तम्भविवर्जितः"
    iast: "dāsavat sannatāryāṅghriḥ pitṛvaddīnavatsalaḥ | bhrātṛvat sadṛśe snigdho guruṣvīśvarabhāvanaḥ | vidyārtharūpajanmāḍhyo mānastambhavivarjitaḥ"
  - id: '7.4.33'
    kind: verse
    lines:
      - "नोद्विग्नचित्तो व्यसनेषु निःस्पृहः श्रुतेषु दृष्टेषु गुणेष्ववस्तुदृक्"
      - "दान्तेन्द्रियप्राणशरीरधीः सदा प्रशान्तकामो रहितासुरोऽसुरः"
    iast: "nodvignacitto vyasaneṣu niḥspṛhaḥ śruteṣu dṛṣṭeṣu guṇeṣvavastudṛk | dāntendriyaprāṇaśarīradhīḥ sadā praśāntakāmo rahitāsuro 'suraḥ"
  - id: '7.4.36'
    kind: verse
    lines:
      - "गुणैरलमसङ्ख्येयैर्माहात्म्यं तस्य सूच्यते"
      - "वासुदेवे भगवति यस्य नैसर्गिकी रतिः"
    iast: "guṇairalamasaṅkhyeyairmāhātmyaṃ tasya sūcyate | vāsudeve bhagavati yasya naisargikī ratiḥ"
  - id: '7.4.43'
    kind: verse
    lines:
      - "तस्मिन्महाभागवते महाभागे महात्मनि"
      - "हिरण्यकशिपू राजन्नकरोदघमात्मजे"
    iast: "tasmin mahābhāgavate mahābhāge mahātmani | hiraṇyakaśipū rājannakarodaghamātmaje"
  - id: '7.5.4'
    kind: verse
    lines:
      - "एकदासुरराट्पुत्रमङ्कमारोप्य पाण्डव"
      - "पप्रच्छ कथ्यतां वत्स मन्यते साधु यद्भवान्"
    iast: "ekadāsurarāṭ putramaṅkamāropya pāṇḍava | papraccha kathyatāṃ vatsa manyate sādhu yadbhavān"
  - id: '7.5.5'
    kind: verse
    lines:
      - "तत्साधु मन्येऽसुरवर्य देहिनां सदा समुद्विग्नधियामसद्ग्रहात्"
      - "हित्वात्मपातं गृहमन्धकूपं वनं गतो यद्धरिमाश्रयेत"
    iast: "tat sādhu manye 'suravarya dehināṃ sadā samudvignadhiyāmasadgrahāt | hitvātmapātaṃ gṛhamandhakūpaṃ vanaṃ gato yaddharimāśrayeta"
  - id: '7.5.6'
    kind: verse
    lines:
      - "श्रुत्वा पुत्रगिरो दैत्यः परपक्षसमाहिताः"
      - "जहास बुद्धिर्बालानां भिद्यते परबुद्धिभिः"
    iast: "śrutvā putragiro daityaḥ parapakṣasamāhitāḥ | jahāsa buddhirbālānāṃ bhidyate parabuddhibhiḥ"
  - id: '7.5.7'
    kind: verse
    lines:
      - "सम्यग्विधार्यतां बालो गुरुगेहे द्विजातिभिः"
      - "विष्णुपक्षैः प्रतिच्छन्नैर्न भिद्येतास्य धीर्यथा"
    iast: "samyag vidhāryatāṃ bālo gurugehe dvijātibhiḥ | viṣṇupakṣaiḥ praticchannairna bhidyetāsya dhīryathā"
  - id: '7.5.8'
    kind: verse
    lines:
      - "गृहमानीतमाहूय प्रह्रादं दैत्ययाजकाः"
      - "प्रशस्य श्लक्ष्णया वाचा समपृच्छन्त सामभिः"
    iast: "gṛhamānītamāhūya prahrādaṃ daityayājakāḥ | praśasya ślakṣṇayā vācā samapṛcchanta sāmabhiḥ"
  - id: '7.5.9'
    kind: verse
    lines:
      - "वत्स प्रह्राद भद्रं ते सत्यं कथय मा मृषा"
      - "बालानति कुतस्तुभ्यमेष बुद्धिविपर्ययः"
    iast: "vatsa prahrāda bhadraṃ te satyaṃ kathaya mā mṛṣā | bālān ati kutastubhyameṣa buddhiviparyayaḥ"
  - id: '7.5.11'
    kind: verse
    lines:
      - "परः स्वश्चेत्यसद्ग्राहः पुंसां यन्मायया कृतः"
      - "विमोहितधियां दृष्टस्तस्मै भगवते नमः"
    iast: "paraḥ svaścetyasadgrāhaḥ puṃsāṃ yanmāyayā kṛtaḥ | vimohitadhiyāṃ dṛṣṭastasmai bhagavate namaḥ"
  - id: '7.5.14'
    kind: verse
    lines:
      - "यथा भ्राम्यत्ययो ब्रह्मन्स्वयमाकर्षसन्निधौ"
      - "तथा मे भिद्यते चेतश्चक्रपाणेर्यदृच्छया"
    iast: "yathā bhrāmyatyayo brahman svayamākarṣasannidhau | tathā me bhidyate cetaścakrapāṇeryadṛcchayā"
  - id: '7.5.15'
    kind: verse
    lines:
      - "एतावद्ब्राह्मणायोक्त्वा विरराम महामतिः"
      - "तं सन्निभर्त्स्य कुपितः सुदीनो राजसेवकः"
    iast: "etāvadbrāhmaṇāyoktvā virarāma mahāmatiḥ | taṃ sannibhartsya kupitaḥ sudīno rājasevakaḥ"
  - id: '7.5.18'
    kind: verse
    lines:
      - "इति तं विविधोपायैर्भीषयंस्तर्जनादिभिः"
      - "प्रह्रादं ग्राहयामास त्रिवर्गस्योपपादनम्"
    iast: "iti taṃ vividhopāyairbhīṣayaṃstarjanādibhiḥ | prahrādaṃ grāhayāmāsa trivargasyopapādanam"
  - id: '7.5.19'
    kind: verse
    lines:
      - "तत एनं गुरुर्ज्ञात्वा ज्ञातज्ञेयचतुष्टयम्"
      - "दैत्येन्द्रं दर्शयामास मातृमृष्टमलङ्कृतम्"
    iast: "tata enaṃ gururjñātvā jñātajñeyacatuṣṭayam | daityendraṃ darśayāmāsa mātṛmṛṣṭamalaṅkṛtam"
  - id: '7.5.20'
    kind: verse
    lines:
      - "पादयोः पतितं बालं प्रतिनन्द्याशिषासुरः"
      - "परिष्वज्य चिरं दोर्भ्यां परमामाप निर्वृतिम्"
    iast: "pādayoḥ patitaṃ bālaṃ pratinandyāśiṣāsuraḥ | pariṣvajya ciraṃ dorbhyāṃ paramāmāpa nirvṛtim"
  - id: '7.5.22'
    kind: verse
    lines:
      - "प्रह्रादानूच्यतां तात स्वधीतं किञ्चिदुत्तमम्"
      - "कालेनैतावतायुष्मन्यदशिक्षद्गुरोर्भवान्"
    iast: "prahrādānūcyatāṃ tāta svadhītaṃ kiñciduttamam | kālenaitāvatāyuṣman yadaśikṣadgurorbhavān"
  - id: '7.5.24'
    kind: verse
    lines:
      - "इति पुंसार्पिता विष्णौ भक्तिश्चेन्नवलक्षणा"
      - "क्रियेत भगवत्यद्धा तन्मन्येऽधीतमुत्तमम्"
    iast: "iti puṃsārpitā viṣṇau bhaktiścen navalakṣaṇā | kriyeta bhagavatyaddhā tan manye 'dhītamuttamam"
  - id: '7.5.25'
    kind: verse
    lines:
      - "निशम्यैतत्सुतवचो हिरण्यकशिपुस्तदा"
      - "गुरुपुत्रमुवाचेदं रुषा प्रस्फुरिताधरः"
    iast: "niśamyaitat sutavaco hiraṇyakaśipustadā | guruputramuvācedaṃ ruṣā prasphuritādharaḥ"
  - id: '7.5.26'
    kind: verse
    lines:
      - "ब्रह्मबन्धो किमेतत्ते विपक्षं श्रयतासता"
      - "असारं ग्राहितो बालो मामनादृत्य दुर्मते"
    iast: "brahmabandho kimetat te vipakṣaṃ śrayatāsatā | asāraṃ grāhito bālo māmanādṛtya durmate"
  - id: '7.5.28'
    kind: verse
    lines:
      - "न मत्प्रणीतं न परप्रणीतं सुतो वदत्येष तवेन्द्रशत्रो"
      - "नैसर्गिकीयं मतिरस्य राजन्नियच्छ मन्युं कददाः स्म मा नः"
    iast: "na matpraṇītaṃ na parapraṇītaṃ suto vadatyeṣa tavendraśatro | naisargikīyaṃ matirasya rājan niyaccha manyuṃ kadadāḥ sma mā naḥ"
  - id: '7.5.29'
    kind: verse
    lines:
      - "गुरुणैवं प्रतिप्रोक्तो भूय आहासुरः सुतम्"
      - "न चेद्गुरुमुखीयं ते कुतोऽभद्रासती मतिः"
    iast: "guruṇaivaṃ pratiprokto bhūya āhāsuraḥ sutam | na cedgurumukhīyaṃ te kuto 'bhadrāsatī matiḥ"
  - id: '7.5.30'
    kind: verse
    lines:
      - "मतिर्न कृष्णे परतः स्वतो वा मिथोऽभिपद्येत गृहव्रतानाम्"
      - "अदान्तगोभिर्विशतां तमिस्रं पुनः पुनश्चर्वितचर्वणानाम्"
    iast: "matirna kṛṣṇe parataḥ svato vā mitho 'bhipadyeta gṛhavratānām | adāntagobhirviśatāṃ tamisraṃ punaḥ punaścarvitacarvaṇānām"
  - id: '7.5.33'
    kind: verse
    lines:
      - "इत्युक्त्वोपरतं पुत्रं हिरण्यकशिपू रुषा"
      - "अन्धीकृतात्मा स्वोत्सङ्गान्निरस्यत महीतले"
    iast: "ityuktvoparataṃ putraṃ hiraṇyakaśipū ruṣā | andhīkṛtātmā svotsaṅgān nirasyata mahītale"
  - id: '7.5.34'
    kind: verse
    lines:
      - "आहामर्षरुषाविष्टः कषायीभूतलोचनः"
      - "वध्यतामाश्वयं वध्यो निःसारयत नैरृताः"
    iast: "āhāmarṣaruṣāviṣṭaḥ kaṣāyībhūtalocanaḥ | vadhyatāmāśvayaṃ vadhyo niḥsārayata nairṛtāḥ"
  - id: '7.5.35'
    kind: verse
    lines:
      - "अयं मे भ्रातृहा सोऽयं हित्वा स्वान्सुहृदोऽधमः"
      - "पितृव्यहन्तुः पादौ यो विष्णोर्दासवदर्चति"
    iast: "ayaṃ me bhrātṛhā so 'yaṃ hitvā svān suhṛdo 'dhamaḥ | pitṛvyahantuḥ pādau yo viṣṇordāsavadarcati"
  - id: '7.5.40'
    kind: verse
    lines:
      - "नदन्तो भैरवं नादं छिन्धि भिन्धीति वादिनः"
      - "आसीनं चाहनन्शूलैः प्रह्रादं सर्वमर्मसु"
    iast: "nadanto bhairavaṃ nādaṃ chindhi bhindhīti vādinaḥ | āsīnaṃ cāhanan śūlaiḥ prahrādaṃ sarvamarmasu"
  - id: '7.5.41'
    kind: verse
    lines:
      - "परे ब्रह्मण्यनिर्देश्ये भगवत्यखिलात्मनि"
      - "युक्तात्मन्यफला आसन्नपुण्यस्येव सत्क्रियाः"
    iast: "pare brahmaṇyanirdeśye bhagavatyakhilātmani | yuktātmanyaphalā āsannapuṇyasyeva satkriyāḥ"
  - id: '7.5.42'
    kind: verse
    lines:
      - "प्रयासेऽपहते तस्मिन्दैत्येन्द्रः परिशङ्कितः"
      - "चकार तद्वधोपायान्निर्बन्धेन युधिष्ठिर"
    iast: "prayāse 'pahate tasmin daityendraḥ pariśaṅkitaḥ | cakāra tadvadhopāyān nirbandhena yudhiṣṭhira"
  - id: '7.5.43'
    kind: verse
    lines:
      - "दिग्गजैर्दन्दशूकेन्द्रैरभिचारावपातनैः"
      - "मायाभिः सन्निरोधैश्च गरदानैरभोजनैः"
    iast: "diggajairdandaśūkendrairabhicārāvapātanaiḥ | māyābhiḥ sannirodhaiśca garadānairabhojanaiḥ"
  - id: '7.5.44'
    kind: verse
    lines:
      - "हिमवाय्वग्निसलिलैः पर्वताक्रमणैरपि"
      - "न शशाक यदा हन्तुमपापमसुरः सुतम्"
      - "चिन्तां दीर्घतमां प्राप्तस्तत्कर्तुं नाभ्यपद्यत"
    iast: "himavāyvagnisalilaiḥ parvatākramaṇairapi | na śaśāka yadā hantumapāpamasuraḥ sutam | cintāṃ dīrghatamāṃ prāptastatkartuṃ nābhyapadyata"
  - id: '7.5.47'
    kind: verse
    lines:
      - "अप्रमेयानुभावोऽयमकुतश्चिद्भयोऽमरः"
      - "नूनमेतद्विरोधेन मृत्युर्मे भविता न वा"
    iast: "aprameyānubhāvo 'yamakutaścidbhayo 'maraḥ | nūnametadvirodhena mṛtyurme bhavitā na vā"
  - id: '7.5.55'
    kind: verse
    lines:
      - "अथ तान्श्लक्ष्णया वाचा प्रत्याहूय महाबुधः"
      - "उवाच विद्वांस्तन्निष्ठां कृपया प्रहसन्निव"
    iast: "atha tān ślakṣṇayā vācā pratyāhūya mahābudhaḥ | uvāca vidvāṃstanniṣṭhāṃ kṛpayā prahasanniva"
  - id: '7.6.1'
    kind: verse
    lines:
      - "कौमार आचरेत्प्राज्ञो धर्मान्भागवतानिह"
      - "दुर्लभं मानुषं जन्म तदप्यध्रुवमर्थदम्"
    iast: "kaumāra ācaret prājño dharmān bhāgavatān iha | durlabhaṃ mānuṣaṃ janma tadapyadhruvamarthadam"
  - id: '7.6.3'
    kind: verse
    lines:
      - "सुखमैन्द्रियकं दैत्या देहयोगेन देहिनाम्"
      - "सर्वत्र लभ्यते दैवाद्यथा दुःखमयत्नतः"
    iast: "sukhamaindriyakaṃ daityā dehayogena dehinām | sarvatra labhyate daivādyathā duḥkhamayatnataḥ"
  - id: '7.6.7'
    kind: verse
    lines:
      - "मुग्धस्य बाल्ये कैशोरे क्रीडतो याति विंशतिः"
      - "जरया ग्रस्तदेहस्य यात्यकल्पस्य विंशतिः"
    iast: "mugdhasya bālye kaiśore krīḍato yāti viṃśatiḥ | jarayā grastadehasya yātyakalpasya viṃśatiḥ"
  - id: '7.6.8'
    kind: verse
    lines:
      - "दुरापूरेण कामेन मोहेन च बलीयसा"
      - "शेषं गृहेषु सक्तस्य प्रमत्तस्यापयाति हि"
    iast: "durāpūreṇa kāmena mohena ca balīyasā | śeṣaṃ gṛheṣu saktasya pramattasyāpayāti hi"
  - id: '7.6.10'
    kind: verse
    lines:
      - "को न्वर्थतृष्णां विसृजेत्प्राणेभ्योऽपि य ईप्सितः"
      - "यं क्रीणात्यसुभिः प्रेष्ठैस्तस्करः सेवको वणिक्"
    iast: "ko nvarthatṛṣṇāṃ visṛjet prāṇebhyo 'pi ya īpsitaḥ | yaṃ krīṇātyasubhiḥ preṣṭhaistaskaraḥ sevako vaṇik"
  - id: '7.6.13'
    kind: verse
    lines:
      - "त्यजेत कोशस्कृदिवेहमानः कर्माणि लोभादवितृप्तकामः"
      - "औपस्थ्यजैह्वं बहुमन्यमानः कथं विरज्येत दुरन्तमोहः"
    iast: "tyajeta kośaskṛdivehamānaḥ karmāṇi lobhādavitṛptakāmaḥ | aupasthyajaihvaṃ bahumanyamānaḥ kathaṃ virajyeta durantamohaḥ"
  - id: '7.6.14'
    kind: verse
    lines:
      - "कुटुम्बपोषाय वियन्निजायुर्न बुध्यतेऽर्थं विहतं प्रमत्तः"
      - "सर्वत्र तापत्रयदुःखितात्मा निर्विद्यते न स्वकुटुम्बरामः"
    iast: "kuṭumbapoṣāya viyan nijāyur na budhyate 'rthaṃ vihataṃ pramattaḥ | sarvatra tāpatrayaduḥkhitātmā nirvidyate na svakuṭumbarāmaḥ"
  - id: '7.6.18'
    kind: verse
    lines:
      - "ततो विदूरात्परिहृत्य दैत्या दैत्येषु सङ्गं विषयात्मकेषु"
      - "उपेत नारायणमादिदेवं स मुक्तसङ्गैरिषितोऽपवर्गः"
    iast: "tato vidūrāt parihṛtya daityā daityeṣu saṅgaṃ viṣayātmakeṣu | upeta nārāyaṇamādidevaṃ sa muktasaṅgairiṣito 'pavargaḥ"
  - id: '7.6.19'
    kind: verse
    lines:
      - "न ह्यच्युतं प्रीणयतो बह्वायासोऽसुरात्मजाः"
      - "आत्मत्वात्सर्वभूतानां सिद्धत्वादिह सर्वतः"
    iast: "na hyacyutaṃ prīṇayato bahvāyāso 'surātmajāḥ | ātmatvāt sarvabhūtānāṃ siddhatvādiha sarvataḥ"
  - id: '7.6.20'
    kind: verse
    lines:
      - "परावरेषु भूतेषु ब्रह्मान्तस्थावरादिषु"
      - "भौतिकेषु विकारेषु भूतेष्वथ महत्सु च"
    iast: "parāvareṣu bhūteṣu brahmāntasthāvarādiṣu | bhautikeṣu vikāreṣu bhūteṣvatha mahatsu ca"
  - id: '7.6.21'
    kind: verse
    lines:
      - "गुणेषु गुणसाम्ये च गुणव्यतिकरे तथा"
      - "एक एव परो ह्यात्मा भगवानीश्वरोऽव्ययः"
    iast: "guṇeṣu guṇasāmye ca guṇavyatikare tathā | eka eva paro hyātmā bhagavān īśvaro 'vyayaḥ"
  - id: '7.6.24'
    kind: verse
    lines:
      - "तस्मात्सर्वेषु भूतेषु दयां कुरुत सौहृदम्"
      - "भावमासुरमुन्मुच्य यया तुष्यत्यधोक्षजः"
    iast: "tasmāt sarveṣu bhūteṣu dayāṃ kuruta sauhṛdam | bhāvamāsuramunmucya yayā tuṣyatyadhokṣajaḥ"
  - id: '7.6.25'
    kind: verse
    lines:
      - "तुष्टे च तत्र किमलभ्यमनन्त आद्ये किं तैर्गुणव्यतिकरादिह ये स्वसिद्धाः अम्प्;"
      - "धर्मादयः किमगुणेन च काङ्क्षितेन सारं जुषां चरणयोरुपगायतां नः"
    iast: "tuṣṭe ca tatra kimalabhyamananta ādye kiṃ tairguṇavyatikarādiha ye svasiddhāḥ amp; | dharmādayaḥ kimaguṇena ca kāṅkṣitena sāraṃ juṣāṃ caraṇayorupagāyatāṃ naḥ"
  - id: '7.7.51'
    kind: verse
    lines:
      - "नालं द्विजत्वं देवत्वमृषित्वं वासुरात्मजाः"
      - "प्रीणनाय मुकुन्दस्य न वृत्तं न बहुज्ञता"
    iast: "nālaṃ dvijatvaṃ devatvamṛṣitvaṃ vāsurātmajāḥ | prīṇanāya mukundasya na vṛttaṃ na bahujñatā"
  - id: '7.7.52'
    kind: verse
    lines:
      - "न दानं न तपो नेज्या न शौचं न व्रतानि च"
      - "प्रीयतेऽमलया भक्त्या हरिरन्यद्विडम्बनम्"
    iast: "na dānaṃ na tapo nejyā na śaucaṃ na vratāni ca | prīyate 'malayā bhaktyā hariranyadviḍambanam"
  - id: '7.7.53'
    kind: verse
    lines:
      - "ततो हरौ भगवति भक्तिं कुरुत दानवाः"
      - "आत्मौपम्येन सर्वत्र सर्वभूतात्मनीश्वरे"
    iast: "tato harau bhagavati bhaktiṃ kuruta dānavāḥ | ātmaupamyena sarvatra sarvabhūtātmanīśvare"
  - id: '7.7.54'
    kind: verse
    lines:
      - "दैतेया यक्षरक्षांसि स्त्रियः शूद्रा व्रजौकसः"
      - "खगा मृगाः पापजीवाः सन्ति ह्यच्युततां गताः"
    iast: "daiteyā yakṣarakṣāṃsi striyaḥ śūdrā vrajaukasaḥ | khagā mṛgāḥ pāpajīvāḥ santi hyacyutatāṃ gatāḥ"
  - id: '7.7.55'
    kind: verse
    lines:
      - "एतावानेव लोकेऽस्मिन्पुंसः स्वार्थः परः स्मृतः"
      - "एकान्तभक्तिर्गोविन्दे यत्सर्वत्र तदीक्षणम्"
    iast: "etāvān eva loke 'smin puṃsaḥ svārthaḥ paraḥ smṛtaḥ | ekāntabhaktirgovinde yat sarvatra tadīkṣaṇam"
  - id: '7.8.1'
    kind: verse
    lines:
      - "अथ दैत्यसुताः सर्वे श्रुत्वा तदनुवर्णितम्"
      - "जगृहुर्निरवद्यत्वान्नैव गुर्वनुशिक्षितम्"
    iast: "atha daityasutāḥ sarve śrutvā tadanuvarṇitam | jagṛhurniravadyatvān naiva gurvanuśikṣitam"
  - id: '7.8.7'
    kind: verse
    lines:
      - "क्रुद्धस्य यस्य कम्पन्ते त्रयो लोकाः सहेश्वराः"
      - "तस्य मेऽभीतवन्मूढ शासनं किं बलोऽत्यगाः"
    iast: "kruddhasya yasya kampante trayo lokāḥ saheśvarāḥ | tasya me 'bhītavan mūḍha śāsanaṃ kiṃ balo 'tyagāḥ"
  - id: '7.8.8'
    kind: verse
    lines:
      - "न केवलं मे भवतश्च राजन्स वै बलं बलिनां चापरेषाम्"
      - "परेऽवरेऽमी स्थिरजङ्गमा ये ब्रह्मादयो येन वशं प्रणीताः"
    iast: "na kevalaṃ me bhavataśca rājan sa vai balaṃ balināṃ cāpareṣām | pare 'vare 'mī sthirajaṅgamā ye brahmādayo yena vaśaṃ praṇītāḥ"
  - id: '7.8.9'
    kind: verse
    lines:
      - "स ईश्वरः काल उरुक्रमोऽसावोजः सहः सत्त्वबलेन्द्रियात्मा"
      - "स एव विश्वं परमः स्वशक्तिभिः सृजत्यवत्यत्ति गुणत्रयेशः"
    iast: "sa īśvaraḥ kāla urukramo 'sāv ojaḥ sahaḥ sattvabalendriyātmā | sa eva viśvaṃ paramaḥ svaśaktibhiḥ sṛjatyavatyatti guṇatrayeśaḥ"
  - id: '7.8.10'
    kind: verse
    lines:
      - "जह्यासुरं भावमिमं त्वमात्मनः समं मनो धत्स्व न सन्ति विद्विषः"
      - "ऋतेऽजितादात्मन उत्पथे स्थितात्तद्धि ह्यनन्तस्य महत्समर्हणम्"
    iast: "jahyāsuraṃ bhāvamimaṃ tvamātmanaḥ samaṃ mano dhatsva na santi vidviṣaḥ | ṛte 'jitādātmana utpathe sthitāt taddhi hyanantasya mahat samarhaṇam"
  - id: '7.8.12'
    kind: verse
    lines:
      - "व्यक्तं त्वं मर्तुकामोऽसि योऽतिमात्रं विकत्थसे"
      - "मुमूर्षूणां हि मन्दात्मन्ननु स्युर्विक्लवा गिरः"
    iast: "vyaktaṃ tvaṃ martukāmo 'si yo 'timātraṃ vikatthase | mumūrṣūṇāṃ hi mandātman nanu syurviklavā giraḥ"
  - id: '7.8.13'
    kind: verse
    lines:
      - "यस्त्वया मन्दभाग्योक्तो मदन्यो जगदीश्वरः"
      - "क्वासौ यदि स सर्वत्र कस्मात्स्तम्भे न दृश्यते"
    iast: "yastvayā mandabhāgyokto madanyo jagadīśvaraḥ | kvāsau yadi sa sarvatra kasmāt stambhe na dṛśyate"
  - id: '7.8.15'
    kind: verse
    lines:
      - "एवं दुरुक्तैर्मुहुरर्दयन्रुषा सुतं महाभागवतं महासुरः"
      - "खड्गं प्रगृह्योत्पतितो वरासनात्स्तम्भं तताडातिबलः स्वमुष्टिना"
    iast: "evaṃ duruktairmuhurardayan ruṣā sutaṃ mahābhāgavataṃ mahāsuraḥ | khaḍgaṃ pragṛhyotpatito varāsanāt stambhaṃ tatāḍātibalaḥ svamuṣṭinā"
  - id: '7.8.16'
    kind: verse
    lines:
      - "तदैव तस्मिन्निनदोऽतिभीषणो बभूव येनाण्डकटाहमस्फुटत्"
      - "यं वै स्वधिष्ण्योपगतं त्वजादयः श्रुत्वा स्वधामात्ययमङ्ग मेनिरे"
    iast: "tadaiva tasmin ninado 'tibhīṣaṇo babhūva yenāṇḍakaṭāhamasphuṭat | yaṃ vai svadhiṣṇyopagataṃ tvajādayaḥ śrutvā svadhāmātyayamaṅga menire"
  - id: '7.8.18'
    kind: verse
    lines:
      - "सत्यं विधातुं निजभृत्यभाषितं व्याप्तिं च भूतेष्वखिलेषु चात्मनः"
      - "अदृश्यतात्यद्भुतरूपमुद्वहन्स्तम्भे सभायां न मृगं न मानुषम्"
    iast: "satyaṃ vidhātuṃ nijabhṛtyabhāṣitaṃ vyāptiṃ ca bhūteṣvakhileṣu cātmanaḥ | adṛśyatātyadbhutarūpamudvahan stambhe sabhāyāṃ na mṛgaṃ na mānuṣam"
  - id: '7.8.19'
    kind: verse
    lines:
      - "स सत्त्वमेनं परितो विपश्यन्स्तम्भस्य मध्यादनुनिर्जिहानम्"
      - "नायं मृगो नापि नरो विचित्रमहो किमेतन्नृमृगेन्द्ररूपम्"
    iast: "sa sattvamenaṃ parito vipaśyan stambhasya madhyādanunirjihānam | nāyaṃ mṛgo nāpi naro vicitram aho kimetan nṛmṛgendrarūpam"
  - id: '7.8.23'
    kind: verse
    lines:
      - "दुरासदं सर्वनिजेतरायुध प्रवेकविद्रावितदैत्यदानवम्"
      - "प्रायेण मेऽयं हरिणोरुमायिना वधः स्मृतोऽनेन समुद्यतेन किम्"
    iast: "durāsadaṃ sarvanijetarāyudha pravekavidrāvitadaityadānavam | prāyeṇa me 'yaṃ hariṇorumāyinā vadhaḥ smṛto 'nena samudyatena kim"
  - id: '7.8.24'
    kind: verse
    lines:
      - "एवं ब्रुवंस्त्वभ्यपतद्गदायुधो नदन्नृसिंहं प्रति दैत्यकुञ्जरः"
      - "अलक्षितोऽग्नौ पतितः पतङ्गमो यथा नृसिंहौजसि सोऽसुरस्तदा"
    iast: "evaṃ bruvaṃstvabhyapatadgadāyudho nadan nṛsiṃhaṃ prati daityakuñjaraḥ | alakṣito 'gnau patitaḥ pataṅgamo yathā nṛsiṃhaujasi so 'surastadā"
  - id: '7.8.26'
    kind: verse
    lines:
      - "तं विक्रमन्तं सगदं गदाधरो महोरगं तार्क्ष्यसुतो यथाग्रहीत्"
      - "स तस्य हस्तोत्कलितस्तदासुरो विक्रीडतो यद्वदहिर्गरुत्मतः"
    iast: "taṃ vikramantaṃ sagadaṃ gadādharo mahoragaṃ tārkṣyasuto yathāgrahīt | sa tasya hastotkalitastadāsuro vikrīḍato yadvadahirgarutmataḥ"
  - id: '7.8.30'
    kind: verse
    lines:
      - "संरम्भदुष्प्रेक्ष्यकराललोचनो व्यात्ताननान्तं विलिहन्स्वजिह्वया"
      - "असृग्लवाक्तारुणकेशराननो यथान्त्रमाली द्विपहत्यया हरिः"
    iast: "saṃrambhaduṣprekṣyakarālalocano vyāttānanāntaṃ vilihan svajihvayā | asṛglavāktāruṇakeśarānano yathāntramālī dvipahatyayā hariḥ"
  - id: '7.8.35'
    kind: verse
    lines:
      - "निशाम्य लोकत्रयमस्तकज्वरं तमादिदैत्यं हरिणा हतं मृधे"
      - "प्रहर्षवेगोत्कलितानना मुहुः प्रसूनवर्षैर्ववृषुः सुरस्त्रियः"
    iast: "niśāmya lokatrayamastakajvaraṃ tamādidaityaṃ hariṇā hataṃ mṛdhe | praharṣavegotkalitānanā muhuḥ prasūnavarṣairvavṛṣuḥ surastriyaḥ"
  - id: '7.9.5'
    kind: verse
    lines:
      - "स्वपादमूले पतितं तमर्भकं विलोक्य देवः कृपया परिप्लुतः"
      - "उत्थाप्य तच्छीर्ष्ण्यदधात्कराम्बुजं कालाहिवित्रस्तधियां कृताभयम्"
    iast: "svapādamūle patitaṃ tamarbhakaṃ vilokya devaḥ kṛpayā pariplutaḥ | utthāpya tacchīrṣṇyadadhāt karāmbujaṃ kālāhivitrastadhiyāṃ kṛtābhayam"
  - id: '7.9.7'
    kind: verse
    lines:
      - "अस्तौषीद्धरिमेकाग्र मनसा सुसमाहितः"
      - "प्रेमगद्गदया वाचा तन्न्यस्तहृदयेक्षणः"
    iast: "astauṣīddharimekāgra manasā susamāhitaḥ | premagadgadayā vācā tannyastahṛdayekṣaṇaḥ"
  - id: '7.9.10'
    kind: verse
    lines:
      - "विप्राद्द्विषड्गुणयुतादरविन्दनाभ पादारविन्दविमुखात्श्वपचं वरिष्ठम्"
      - "मन्ये तदर्पितमनोवचनेहितार्थ प्राणं पुनाति स कुलं न तु भूरिमानः"
    iast: "viprāddviṣaḍguṇayutādaravindanābha pādāravindavimukhāt śvapacaṃ variṣṭham | manye tadarpitamanovacanehitārtha prāṇaṃ punāti sa kulaṃ na tu bhūrimānaḥ"
  - id: '7.9.11'
    kind: verse
    lines:
      - "नैवात्मनः प्रभुरयं निजलाभपूर्णो मानं जनादविदुषः करुणो वृणीते"
      - "यद्यज्जनो भगवते विदधीत मानं तच्चात्मने प्रतिमुखस्य यथा मुखश्रीः"
    iast: "naivātmanaḥ prabhurayaṃ nijalābhapūrṇo mānaṃ janādaviduṣaḥ karuṇo vṛṇīte | yadyaj jano bhagavate vidadhīta mānaṃ tac cātmane pratimukhasya yathā mukhaśrīḥ"
  - id: '7.9.13'
    kind: verse
    lines:
      - "सर्वे ह्यमी विधिकरास्तव सत्त्वधाम्नो ब्रह्मादयो वयमिवेश न चोद्विजन्तः"
      - "क्षेमाय भूतय उतात्मसुखाय चास्य विक्रीडितं भगवतो रुचिरावतारैः"
    iast: "sarve hyamī vidhikarāstava sattvadhāmno brahmādayo vayamiveśa na codvijantaḥ | kṣemāya bhūtaya utātmasukhāya cāsya vikrīḍitaṃ bhagavato rucirāvatāraiḥ"
  - id: '7.9.14'
    kind: verse
    lines:
      - "तद्यच्छ मन्युमसुरश्च हतस्त्वयाद्य मोदेत साधुरपि वृश्चिकसर्पहत्या"
      - "लोकाश्च निर्वृतिमिताः प्रतियन्ति सर्वे रूपं नृसिंह विभयाय जनाः स्मरन्ति"
    iast: "tadyaccha manyumasuraśca hatastvayādya modeta sādhurapi vṛścikasarpahatyā | lokāśca nirvṛtimitāḥ pratiyanti sarve rūpaṃ nṛsiṃha vibhayāya janāḥ smaranti"
  - id: '7.9.15'
    kind: verse
    lines:
      - "नाहं बिभेम्यजित तेऽतिभयानकास्य जिह्वार्कनेत्रभ्रुकुटीरभसोग्रदंष्ट्रात्"
      - "आन्त्रस्रजःक्षतजकेशरशङ्कुकर्णान्निर्ह्रादभीतदिगिभादरिभिन्नखाग्रात्"
    iast: "nāhaṃ bibhemyajita te 'tibhayānakāsya jihvārkanetrabhrukuṭīrabhasogradaṃṣṭrāt | āntrasrajaḥkṣatajakeśaraśaṅkukarṇān nirhrādabhītadigibhādaribhinnakhāgrāt"
  - id: '7.9.16'
    kind: verse
    lines:
      - "त्रस्तोऽस्म्यहं कृपणवत्सल दुःसहोग्र संसारचक्रकदनाद्ग्रसतां प्रणीतः"
      - "बद्धः स्वकर्मभिरुशत्तम तेऽङ्घ्रिमूलं प्रीतोऽपवर्गशरणं ह्वयसे कदा नु"
    iast: "trasto 'smyahaṃ kṛpaṇavatsala duḥsahogra saṃsāracakrakadanādgrasatāṃ praṇītaḥ | baddhaḥ svakarmabhiruśattama te 'ṅghrimūlaṃ prīto 'pavargaśaraṇaṃ hvayase kadā nu"
  - id: '7.9.19'
    kind: verse
    lines:
      - "बालस्य नेह शरणं पितरौ नृसिंह नार्तस्य चागदमुदन्वति मज्जतो नौः"
      - "तप्तस्य तत्प्रतिविधिर्य इहाञ्जसेष्टस्तावद्विभो तनुभृतां त्वदुपेक्षितानाम्"
    iast: "bālasya neha śaraṇaṃ pitarau nṛsiṃha nārtasya cāgadamudanvati majjato nauḥ | taptasya tatpratividhirya ihāñjaseṣṭas tāvadvibho tanubhṛtāṃ tvadupekṣitānām"
  - id: '7.9.45'
    kind: verse
    lines:
      - "यन्मैथुनादिगृहमेधिसुखं हि तुच्छं कण्डूयनेन करयोरिव दुःखदुःखम्"
      - "तृप्यन्ति नेह कृपणा बहुदुःखभाजः कण्डूतिवन्मनसिजं विषहेत धीरः"
    iast: "yan maithunādigṛhamedhisukhaṃ hi tucchaṃ kaṇḍūyanena karayoriva duḥkhaduḥkham | tṛpyanti neha kṛpaṇā bahuduḥkhabhājaḥ kaṇḍūtivan manasijaṃ viṣaheta dhīraḥ"
  - id: '7.9.46'
    kind: verse
    lines:
      - "मौनव्रतश्रुततपोऽध्ययनस्वधर्म व्याख्यारहोजपसमाधय आपवर्ग्याः"
      - "प्रायः परं पुरुष ते त्वजितेन्द्रियाणां वार्ता भवन्त्युत न वात्र तु दाम्भिकानाम्"
    iast: "maunavrataśrutatapo 'dhyayanasvadharma vyākhyārahojapasamādhaya āpavargyāḥ | prāyaḥ paraṃ puruṣa te tvajitendriyāṇāṃ vārtā bhavantyuta na vātra tu dāmbhikānām"
  - id: '7.9.50'
    kind: verse
    lines:
      - "तत्तेऽर्हत्तम नमः स्तुतिकर्मपूजाः कर्म स्मृतिश्चरणयोः श्रवणं कथायाम्"
      - "संसेवया त्वयि विनेति षडङ्गया किं भक्तिं जनः परमहंसगतौ लभेत"
    iast: "tat te 'rhattama namaḥ stutikarmapūjāḥ karma smṛtiścaraṇayoḥ śravaṇaṃ kathāyām | saṃsevayā tvayi vineti ṣaḍaṅgayā kiṃ bhaktiṃ janaḥ paramahaṃsagatau labheta"
  - id: '7.9.52'
    kind: verse
    lines:
      - "प्रह्राद भद्र भद्रं ते प्रीतोऽहं तेऽसुरोत्तम"
      - "वरं वृणीष्वाभिमतं कामपूरोऽस्म्यहं नृणाम्"
    iast: "prahrāda bhadra bhadraṃ te prīto 'haṃ te 'surottama | varaṃ vṛṇīṣvābhimataṃ kāmapūro 'smyahaṃ nṛṇām"
  - id: '7.10.7'
    kind: verse
    lines:
      - "यदि दास्यसि मे कामान्वरांस्त्वं वरदर्षभ"
      - "कामानां हृद्यसंरोहं भवतस्तु वृणे वरम्"
    iast: "yadi dāsyasi me kāmān varāṃstvaṃ varadarṣabha | kāmānāṃ hṛdyasaṃrohaṃ bhavatastu vṛṇe varam"
  - id: '7.10.15'
    kind: verse
    lines:
      - "वरं वरय एतत्ते वरदेशान्महेश्वर"
      - "यदनिन्दत्पिता मे त्वामविद्वांस्तेज ऐश्वरम्"
    iast: "varaṃ varaya etat te varadeśān maheśvara | yadanindat pitā me tvāmavidvāṃsteja aiśvaram"
  - id: '7.10.17'
    kind: verse
    lines:
      - "तस्मात्पिता मे पूयेत दुरन्ताद्दुस्तरादघात्"
      - "पूतस्तेऽपाङ्गसंदृष्टस्तदा कृपणवत्सल"
    iast: "tasmāt pitā me pūyeta durantāddustarādaghāt | pūtaste 'pāṅgasaṃdṛṣṭastadā kṛpaṇavatsala"
  - id: '7.10.18'
    kind: verse
    lines:
      - "त्रिःसप्तभिः पिता पूतः पितृभिः सह तेऽनघ"
      - "यत्साधोऽस्य कुले जातो भवान्वै कुलपावनः"
    iast: "triḥsaptabhiḥ pitā pūtaḥ pitṛbhiḥ saha te 'nagha | yat sādho 'sya kule jāto bhavān vai kulapāvanaḥ"
  - id: '7.10.21'
    kind: verse
    lines:
      - "भवन्ति पुरुषा लोके मद्भक्तास्त्वामनुव्रताः"
      - "भवान्मे खलु भक्तानां सर्वेषां प्रतिरूपधृक्"
    iast: "bhavanti puruṣā loke madbhaktāstvāmanuvratāḥ | bhavān me khalu bhaktānāṃ sarveṣāṃ pratirūpadhṛk"
  - id: '7.10.31'
    kind: verse
    lines:
      - "इत्युक्त्वा भगवान्राजंस्ततश्चान्तर्दधे हरिः"
      - "अदृश्यः सर्वभूतानां पूजितः परमेष्ठिना"
    iast: "ityuktvā bhagavān rājaṃstataścāntardadhe hariḥ | adṛśyaḥ sarvabhūtānāṃ pūjitaḥ parameṣṭhinā"
  - id: '7.10.33'
    kind: verse
    lines:
      - "ततः काव्यादिभिः सार्धं मुनिभिः कमलासनः"
      - "दैत्यानां दानवानां च प्रह्रादमकरोत्पतिम्"
    iast: "tataḥ kāvyādibhiḥ sārdhaṃ munibhiḥ kamalāsanaḥ | daityānāṃ dānavānāṃ ca prahrādamakarot patim"
  - id: '8.2.14'
    kind: verse
    lines:
      - "बिल्वैः कपित्थैर्जम्बीरैर्वृतो भल्लातकादिभिः"
      - "तस्मिन्सरः सुविपुलं लसत्काञ्चनपङ्कजम्"
    iast: "bilvaiḥ kapitthairjambīrairvṛto bhallātakādibhiḥ | tasmin saraḥ suvipulaṃ lasatkāñcanapaṅkajam"
  - id: '8.2.20'
    kind: verse
    lines:
      - "तत्रैकदा तद्गिरिकाननाश्रयः करेणुभिर्वारणयूथपश्चरन्"
      - "सकण्टकं कीचकवेणुवेत्रवद्विशालगुल्मं प्ररुजन्वनस्पतीन्"
    iast: "tatraikadā tadgirikānanāśrayaḥ kareṇubhirvāraṇayūthapaścaran | sakaṇṭakaṃ kīcakaveṇuvetravad viśālagulmaṃ prarujan vanaspatīn"
  - id: '8.2.24'
    kind: verse
    lines:
      - "सरोऽनिलं पङ्कजरेणुरूषितं जिघ्रन्विदूरान्मदविह्वलेक्षणः"
      - "वृतः स्वयूथेन तृषार्दितेन तत्सरोवराभ्यासमथागमद्द्रुतम्"
    iast: "saro 'nilaṃ paṅkajareṇurūṣitaṃ jighran vidūrān madavihvalekṣaṇaḥ | vṛtaḥ svayūthena tṛṣārditena tat sarovarābhyāsamathāgamaddrutam"
  - id: '8.2.25'
    kind: verse
    lines:
      - "विगाह्य तस्मिन्नमृताम्बु निर्मलं हेमारविन्दोत्पलरेणुरूषितम्"
      - "पपौ निकामं निजपुष्करोद्धृतमात्मानमद्भिः स्नपयन्गतक्लमः"
    iast: "vigāhya tasminnamṛtāmbu nirmalaṃ hemāravindotpalareṇurūṣitam | papau nikāmaṃ nijapuṣkaroddhṛtam ātmānamadbhiḥ snapayan gataklamaḥ"
  - id: '8.2.27'
    kind: verse
    lines:
      - "तं तत्र कश्चिन्नृप दैवचोदितो ग्राहो बलीयांश्चरणे रुषाग्रहीत्"
      - "यदृच्छयैवं व्यसनं गतो गजो यथाबलं सोऽतिबलो विचक्रमे"
    iast: "taṃ tatra kaścin nṛpa daivacodito grāho balīyāṃścaraṇe ruṣāgrahīt | yadṛcchayaivaṃ vyasanaṃ gato gajo yathābalaṃ so 'tibalo vicakrame"
  - id: '8.2.28'
    kind: verse
    lines:
      - "तथातुरं यूथपतिं करेणवो विकृष्यमाणं तरसा बलीयसा"
      - "विचुक्रुशुर्दीनधियोऽपरे गजाः पार्ष्णिग्रहास्तारयितुं न चाशकन्"
    iast: "tathāturaṃ yūthapatiṃ kareṇavo vikṛṣyamāṇaṃ tarasā balīyasā | vicukruśurdīnadhiyo 'pare gajāḥ pārṣṇigrahāstārayituṃ na cāśakan"
  - id: '8.2.31'
    kind: verse
    lines:
      - "इत्थं गजेन्द्रः स यदाप सङ्कटं प्राणस्य देही विवशो यदृच्छया"
      - "अपारयन्नात्मविमोक्षणे चिरं दध्याविमां बुद्धिमथाभ्यपद्यत"
    iast: "itthaṃ gajendraḥ sa yadāpa saṅkaṭaṃ prāṇasya dehī vivaśo yadṛcchayā | apārayannātmavimokṣaṇe ciraṃ dadhyāvimāṃ buddhimathābhyapadyata"
  - id: '8.2.32'
    kind: verse
    lines:
      - "न मामिमे ज्ञातय आतुरं गजाः कुतः करिण्यः प्रभवन्ति मोचितुम्"
      - "ग्राहेण पाशेन विधातुरावृतोऽप्यहं च तं यामि परं परायणम्"
    iast: "na māmime jñātaya āturaṃ gajāḥ kutaḥ kariṇyaḥ prabhavanti mocitum | grāheṇa pāśena vidhāturāvṛto 'py ahaṃ ca taṃ yāmi paraṃ parāyaṇam"
  - id: '8.3.1'
    kind: verse
    lines:
      - "एवं व्यवसितो बुद्ध्या समाधाय मनो हृदि"
      - "जजाप परमं जाप्यं प्राग्जन्मन्यनुशिक्षितम्"
    iast: "evaṃ vyavasito buddhyā samādhāya mano hṛdi | jajāpa paramaṃ jāpyaṃ prāgjanmany anuśikṣitam"
  - id: '8.3.2'
    kind: verse
    lines:
      - "ओं नमो भगवते तस्मै यत एतच्चिदात्मकम्"
      - "पुरुषायादिबीजाय परेशायाभिधीमहि"
    iast: "oṃ namo bhagavate tasmai yata etac cidātmakam | puruṣāyādibījāya pareśāyābhidhīmahi"
  - id: '8.3.17'
    kind: verse
    lines:
      - "मादृक्प्रपन्नपशुपाशविमोक्षणाय मुक्ताय भूरिकरुणाय नमोऽलयाय"
      - "स्वांशेन सर्वतनुभृन्मनसि प्रतीत प्रत्यग्दृशे भगवते बृहते नमस्ते"
    iast: "mādṛk prapannapaśupāśavimokṣaṇāya muktāya bhūrikaruṇāya namo 'layāya | svāṃśena sarvatanubhṛnmanasi pratīta pratyagdṛśe bhagavate bṛhate namaste"
  - id: '8.3.25'
    kind: verse
    lines:
      - "जिजीविषे नाहमिहामुया किमन्तर्बहिश्चावृतयेभयोन्या"
      - "इच्छामि कालेन न यस्य विप्लवस्तस्यात्मलोकावरणस्य मोक्षम्"
    iast: "jijīviṣe nāhamihāmuyā kim antarbahiścāvṛtayebhayonyā | icchāmi kālena na yasya viplavas tasyātmalokāvaraṇasya mokṣam"
  - id: '8.3.31'
    kind: verse
    lines:
      - "तं तद्वदार्तमुपलभ्य जगन्निवासः स्तोत्रं निशम्य दिविजैः सह संस्तुवद्भिः"
      - "छन्दोमयेन गरुडेन समुह्यमानश्चक्रायुधोऽभ्यगमदाशु यतो गजेन्द्रः"
    iast: "taṃ tadvadārtamupalabhya jagannivāsaḥ stotraṃ niśamya divijaiḥ saha saṃstuvadbhiḥ | chandomayena garuḍena samuhyamānaś cakrāyudho 'bhyagamadāśu yato gajendraḥ"
  - id: '8.3.32'
    kind: verse
    lines:
      - "सोऽन्तःसरस्युरुबलेन गृहीत आर्तो दृष्ट्वा गरुत्मति हरिं ख उपात्तचक्रम्"
      - "उत्क्षिप्य साम्बुजकरं गिरमाह कृच्छ्रान्नारायणाखिलगुरो भगवन्नमस्ते"
    iast: "so 'ntaḥsarasy urubalena gṛhīta ārto dṛṣṭvā garutmati hariṃ kha upāttacakram | utkṣipya sāmbujakaraṃ giramāha kṛcchrān nārāyaṇākhilaguro bhagavan namaste"
  - id: '8.3.33'
    kind: verse
    lines:
      - "तं वीक्ष्य पीडितमजः सहसावतीर्य सग्राहमाशु सरसः कृपयोज्जहार"
      - "ग्राहाद्विपाटितमुखादरिणा गजेन्द्रं संपश्यतां हरिरमूमुचदुच्छ्रियाणाम्"
    iast: "taṃ vīkṣya pīḍitamajaḥ sahasāvatīrya sagrāhamāśu sarasaḥ kṛpayojjahāra | grāhādvipāṭitamukhādariṇā gajendraṃ saṃpaśyatāṃ hariramūmucaducchriyāṇām"
  - id: '8.4.3'
    kind: verse
    lines:
      - "योऽसौ ग्राहः स वै सद्यः परमाश्चर्यरूपधृक्"
      - "मुक्तो देवलशापेन हूहूर्गन्धर्वसत्तमः"
    iast: "yo 'sau grāhaḥ sa vai sadyaḥ paramāścaryarūpadhṛk | mukto devalaśāpena hūhūrgandharvasattamaḥ"
  - id: '8.4.5'
    kind: verse
    lines:
      - "सोऽनुकम्पित ईशेन परिक्रम्य प्रणम्य तम्"
      - "लोकस्य पश्यतो लोकं स्वमगान्मुक्तकिल्बिषः"
    iast: "so 'nukampita īśena parikramya praṇamya tam | lokasya paśyato lokaṃ svamagān muktakilbiṣaḥ"
  - id: '8.4.6'
    kind: verse
    lines:
      - "गजेन्द्रो भगवत्स्पर्शाद्विमुक्तोऽज्ञानबन्धनात्"
      - "प्राप्तो भगवतो रूपं पीतवासाश्चतुर्भुजः"
    iast: "gajendro bhagavatsparśādvimukto 'jñānabandhanāt | prāpto bhagavato rūpaṃ pītavāsāścaturbhujaḥ"
  - id: '8.4.7'
    kind: verse
    lines:
      - "स वै पूर्वमभूद्राजा पाण्ड्यो द्रविडसत्तमः"
      - "इन्द्रद्युम्न इति ख्यातो विष्णुव्रतपरायणः"
    iast: "sa vai pūrvamabhūdrājā pāṇḍyo draviḍasattamaḥ | indradyumna iti khyāto viṣṇuvrataparāyaṇaḥ"
  - id: '8.4.8'
    kind: verse
    lines:
      - "स एकदाराधनकाल आत्मवान्गृहीतमौनव्रत ईश्वरं हरिम्"
      - "जटाधरस्तापस आप्लुतोऽच्युतं समर्चयामास कुलाचलाश्रमः"
    iast: "sa ekadārādhanakāla ātmavān gṛhītamaunavrata īśvaraṃ harim | jaṭādharastāpasa āpluto 'cyutaṃ samarcayāmāsa kulācalāśramaḥ"
  - id: '8.4.9'
    kind: verse
    lines:
      - "यदृच्छया तत्र महायशा मुनिः समागमच्छिष्यगणैः परिश्रितः"
      - "तं वीक्ष्य तूष्णीमकृतार्हणादिकं रहस्युपासीनमृषिश्चुकोप ह"
    iast: "yadṛcchayā tatra mahāyaśā muniḥ samāgamac chiṣyagaṇaiḥ pariśritaḥ | taṃ vīkṣya tūṣṇīmakṛtārhaṇādikaṃ rahasy upāsīnamṛṣiścukopa ha"
  - id: '8.4.10'
    kind: verse
    lines:
      - "तस्मा इमं शापमदादसाधुरयं दुरात्माकृतबुद्धिरद्य"
      - "विप्रावमन्ता विशतां तमिस्रं यथा गजः स्तब्धमतिः स एव"
    iast: "tasmā imaṃ śāpamadādasādhur ayaṃ durātmākṛtabuddhiradya | viprāvamantā viśatāṃ tamisraṃ yathā gajaḥ stabdhamatiḥ sa eva"
  - id: '8.4.13'
    kind: verse
    lines:
      - "एवं विमोक्ष्य गजयूथपमब्जनाभस्तेनापि पार्षदगतिं गमितेन युक्तः अम्प्;"
      - "गन्धर्वसिद्धविबुधैरुपगीयमान कर्माद्भुतं स्वभवनं गरुडासनोऽगात्"
    iast: "evaṃ vimokṣya gajayūthapamabjanābhas tenāpi pārṣadagatiṃ gamitena yuktaḥ amp; | gandharvasiddhavibudhairupagīyamāna karmādbhutaṃ svabhavanaṃ garuḍāsano 'gāt"
  - id: '8.5.17'
    kind: verse
    lines:
      - "निशाम्यैतत्सुरगणा महेन्द्रवरुणादयः"
      - "नाध्यगच्छन्स्वयं मन्त्रैर्मन्त्रयन्तो विनिश्चितम्"
    iast: "niśāmyaitat suragaṇā mahendravaruṇādayaḥ | nādhyagacchan svayaṃ mantrairmantrayanto viniścitam"
  - id: '8.5.18'
    kind: verse
    lines:
      - "ततो ब्रह्मसभां जग्मुर्मेरोर्मूर्धनि सर्वशः"
      - "सर्वं विज्ञापयां चक्रुः प्रणताः परमेष्ठिने"
    iast: "tato brahmasabhāṃ jagmurmerormūrdhani sarvaśaḥ | sarvaṃ vijñāpayāṃ cakruḥ praṇatāḥ parameṣṭhine"
  - id: '8.5.24'
    kind: verse
    lines:
      - "इत्याभाष्य सुरान्वेधाः सह देवैररिन्दम"
      - "अजितस्य पदं साक्षाज्जगाम तमसः परम्"
    iast: "ity ābhāṣya surān vedhāḥ saha devairarindama | ajitasya padaṃ sākṣāj jagāma tamasaḥ param"
  - id: '8.5.25'
    kind: verse
    lines:
      - "तत्रादृष्टस्वरूपाय श्रुतपूर्वाय वै प्रभुः"
      - "स्तुतिमब्रूत दैवीभिर्गीर्भिस्त्ववहितेन्द्रियः"
    iast: "tatrādṛṣṭasvarūpāya śrutapūrvāya vai prabhuḥ | stutimabrūta daivībhirgīrbhistvavahitendriyaḥ"
  - id: '8.5.49'
    kind: verse
    lines:
      - "यथा हि स्कन्धशाखानां तरोर्मूलावसेचनम्"
      - "एवमाराधनं विष्णोः सर्वेषामात्मनश्च हि"
    iast: "yathā hi skandhaśākhānāṃ tarormūlāvasecanam | evamārādhanaṃ viṣṇoḥ sarveṣāmātmanaśca hi"
  - id: '8.5.50'
    kind: verse
    lines:
      - "नमस्तुभ्यमनन्ताय दुर्वितर्क्यात्मकर्मणे"
      - "निर्गुणाय गुणेशाय सत्त्वस्थाय च साम्प्रतम्"
    iast: "namastubhyamanantāya durvitarkyātmakarmaṇe | nirguṇāya guṇeśāya sattvasthāya ca sāmpratam"
  - id: '8.6.1'
    kind: verse
    lines:
      - "एवं स्तुतः सुरगणैर्भगवान्हरिरीश्वरः"
      - "तेषामाविरभूद्राजन्सहस्रार्कोदयद्युतिः"
    iast: "evaṃ stutaḥ suragaṇairbhagavān harirīśvaraḥ | teṣāmāvirabhūdrājan sahasrārkodayadyutiḥ"
  - id: '8.6.19'
    kind: verse
    lines:
      - "यात दानवदैतेयैस्तावत्सन्धिर्विधीयताम्"
      - "कालेनानुगृहीतैस्तैर्यावद्वो भव आत्मनः"
    iast: "yāta dānavadaiteyaistāvat sandhirvidhīyatām | kālenānugṛhītaistairyāvadvo bhava ātmanaḥ"
  - id: '8.6.20'
    kind: verse
    lines:
      - "अरयोऽपि हि सन्धेयाः सति कार्यार्थगौरवे"
      - "अहिमूषिकवद्देवा ह्यर्थस्य पदवीं गतैः"
    iast: "arayo 'pi hi sandheyāḥ sati kāryārthagaurave | ahimūṣikavaddevā hy arthasya padavīṃ gataiḥ"
  - id: '8.6.21'
    kind: verse
    lines:
      - "अमृतोत्पादने यत्नः क्रियतामविलम्बितम्"
      - "यस्य पीतस्य वै जन्तुर्मृत्युग्रस्तोऽमरो भवेत्"
    iast: "amṛtotpādane yatnaḥ kriyatāmavilambitam | yasya pītasya vai janturmṛtyugrasto 'maro bhavet"
  - id: '8.6.22'
    kind: verse
    lines:
      - "क्षिप्त्वा क्षीरोदधौ सर्वा वीरुत्तृणलतौषधीः"
      - "मन्थानं मन्दरं कृत्वा नेत्रं कृत्वा तु वासुकिम्"
    iast: "kṣiptvā kṣīrodadhau sarvā vīruttṛṇalatauṣadhīḥ | manthānaṃ mandaraṃ kṛtvā netraṃ kṛtvā tu vāsukim"
  - id: '8.6.23'
    kind: verse
    lines:
      - "सहायेन मया देवा निर्मन्थध्वमतन्द्रिताः"
      - "क्लेशभाजो भविष्यन्ति दैत्या यूयं फलग्रहाः"
    iast: "sahāyena mayā devā nirmanthadhvamatandritāḥ | kleśabhājo bhaviṣyanti daityā yūyaṃ phalagrahāḥ"
  - id: '8.6.24'
    kind: verse
    lines:
      - "यूयं तदनुमोदध्वं यदिच्छन्त्यसुराः सुराः"
      - "न संरम्भेण सिध्यन्ति सर्वार्थाः सान्त्वया यथा"
    iast: "yūyaṃ tadanumodadhvaṃ yadicchanty asurāḥ surāḥ | na saṃrambheṇa sidhyanti sarvārthāḥ sāntvayā yathā"
  - id: '8.6.25'
    kind: verse
    lines:
      - "न भेतव्यं कालकूटाद्विषाज्जलधिसम्भवात्"
      - "लोभः कार्यो न वो जातु रोषः कामस्तु वस्तुषु"
    iast: "na bhetavyaṃ kālakūṭādviṣāj jaladhisambhavāt | lobhaḥ kāryo na vo jātu roṣaḥ kāmastu vastuṣu"
  - id: '8.6.26'
    kind: verse
    lines:
      - "इति देवान्समादिश्य भगवान्पुरुषोत्तमः"
      - "तेषामन्तर्दधे राजन्स्वच्छन्दगतिरीश्वरः"
    iast: "iti devān samādiśya bhagavān puruṣottamaḥ | teṣāmantardadhe rājan svacchandagatirīśvaraḥ"
  - id: '8.6.32'
    kind: verse
    lines:
      - "ततो देवासुराः कृत्वा संविदं कृतसौहृदाः"
      - "उद्यमं परमं चक्रुरमृतार्थे परन्तप"
    iast: "tato devāsurāḥ kṛtvā saṃvidaṃ kṛtasauhṛdāḥ | udyamaṃ paramaṃ cakruramṛtārthe parantapa"
  - id: '8.6.33'
    kind: verse
    lines:
      - "ततस्ते मन्दरगिरिमोजसोत्पाट्य दुर्मदाः"
      - "नदन्त उदधिं निन्युः शक्ताः परिघबाहवः"
    iast: "tataste mandaragirimojasotpāṭya durmadāḥ | nadanta udadhiṃ ninyuḥ śaktāḥ parighabāhavaḥ"
  - id: '8.7.1'
    kind: verse
    lines:
      - "ते नागराजमामन्त्र्य फलभागेन वासुकिम्"
      - "परिवीय गिरौ तस्मिन्नेत्रमब्धिं मुदान्विताः"
    iast: "te nāgarājamāmantrya phalabhāgena vāsukim | parivīya girau tasmin netramabdhiṃ mudānvitāḥ"
  - id: '8.7.2'
    kind: verse
    lines:
      - "आरेभिरे सुरा यत्ता अमृतार्थे कुरूद्वह"
      - "हरिः पुरस्ताज्जगृहे पूर्वं देवास्ततोऽभवन्"
    iast: "ārebhire surā yattā amṛtārthe kurūdvaha | hariḥ purastāj jagṛhe pūrvaṃ devāstato 'bhavan"
  - id: '8.7.7'
    kind: verse
    lines:
      - "मथ्यमानेऽर्णवे सोऽद्रिरनाधारो ह्यपोऽविशत्"
      - "ध्रियमाणोऽपि बलिभिर्गौरवात्पाण्डुनन्दन"
    iast: "mathyamāne 'rṇave so 'driranādhāro hy apo 'viśat | dhriyamāṇo 'pi balibhirgauravāt pāṇḍunandana"
  - id: '8.7.9'
    kind: verse
    lines:
      - "विलोक्य विघ्नेशविधिं तदेश्वरो दुरन्तवीर्योऽवितथाभिसन्धिः"
      - "कृत्वा वपुः कच्छपमद्भुतं महत्प्रविश्य तोयं गिरिमुज्जहार"
    iast: "vilokya vighneśavidhiṃ tadeśvaro durantavīryo 'vitathābhisandhiḥ | kṛtvā vapuḥ kacchapamadbhutaṃ mahat praviśya toyaṃ girimujjahāra"
  - id: '8.7.10'
    kind: verse
    lines:
      - "तमुत्थितं वीक्ष्य कुलाचलं पुनः समुद्यता निर्मथितुं सुरासुराः"
      - "दधार पृष्ठेन स लक्षयोजन प्रस्तारिणा द्वीप इवापरो महान्"
    iast: "tamutthitaṃ vīkṣya kulācalaṃ punaḥ samudyatā nirmathituṃ surāsurāḥ | dadhāra pṛṣṭhena sa lakṣayojana prastāriṇā dvīpa ivāparo mahān"
  - id: '8.7.19'
    kind: verse
    lines:
      - "निर्मथ्यमानादुदधेरभूद्विषं महोल्बणं हालहलाह्वमग्रतः"
      - "सम्भ्रान्तमीनोन्मकराहिकच्छपात्तिमिद्विपग्राहतिमिङ्गिलाकुलात्"
    iast: "nirmathyamānādudadherabhūdviṣaṃ maholbaṇaṃ hālahalāhvamagrataḥ | sambhrāntamīnonmakarāhikacchapāt timidvipagrāhatimiṅgilākulāt"
  - id: '8.7.20'
    kind: verse
    lines:
      - "तदुग्रवेगं दिशि दिश्युपर्यधो विसर्पदुत्सर्पदसह्यमप्रति"
      - "भीताः प्रजा दुद्रुवुरङ्ग सेश्वरा अरक्ष्यमाणाः शरणं सदाशिवम्"
    iast: "tadugravegaṃ diśi diśy upary adho visarpadutsarpadasahyamaprati | bhītāḥ prajā dudruvuraṅga seśvarā arakṣyamāṇāḥ śaraṇaṃ sadāśivam"
  - id: '8.7.37'
    kind: verse
    lines:
      - "तद्वीक्ष्य व्यसनं तासां कृपया भृशपीडितः"
      - "सर्वभूतसुहृद्देव इदमाह सतीं प्रियाम्"
    iast: "tadvīkṣya vyasanaṃ tāsāṃ kṛpayā bhṛśapīḍitaḥ | sarvabhūtasuhṛddeva idamāha satīṃ priyām"
  - id: '8.7.38'
    kind: verse
    lines:
      - "अहो बत भवान्येतत्प्रजानां पश्य वैशसम्"
      - "क्षीरोदमथनोद्भूतात्कालकूटादुपस्थितम्"
    iast: "aho bata bhavāny etat prajānāṃ paśya vaiśasam | kṣīrodamathanodbhūtāt kālakūṭādupasthitam"
  - id: '8.7.39'
    kind: verse
    lines:
      - "आसां प्राणपरीप्सूनां विधेयमभयं हि मे"
      - "एतावान्हि प्रभोरर्थो यद्दीनपरिपालनम्"
    iast: "āsāṃ prāṇaparīpsūnāṃ vidheyamabhayaṃ hi me | etāvān hi prabhorartho yaddīnaparipālanam"
  - id: '8.7.41'
    kind: verse
    lines:
      - "पुंसः कृपयतो भद्रे सर्वात्मा प्रीयते हरिः"
      - "प्रीते हरौ भगवति प्रीयेऽहं सचराचरः"
      - "तस्मादिदं गरं भुञ्जे प्रजानां स्वस्तिरस्तु मे"
    iast: "puṃsaḥ kṛpayato bhadre sarvātmā prīyate hariḥ | prīte harau bhagavati prīye 'haṃ sacarācaraḥ | tasmādidaṃ garaṃ bhuñje prajānāṃ svastirastu me"
  - id: '8.7.43'
    kind: verse
    lines:
      - "ततः करतलीकृत्य व्यापि हालाहलं विषम्"
      - "अभक्षयन्महादेवः कृपया भूतभावनः"
    iast: "tataḥ karatalīkṛtya vyāpi hālāhalaṃ viṣam | abhakṣayan mahādevaḥ kṛpayā bhūtabhāvanaḥ"
  - id: '8.8.1'
    kind: verse
    lines:
      - "पीते गरे वृषाङ्केण प्रीतास्तेऽमरदानवाः"
      - "ममन्थुस्तरसा सिन्धुं हविर्धानी ततोऽभवत्"
    iast: "pīte gare vṛṣāṅkeṇa prītāste 'maradānavāḥ | mamanthustarasā sindhuṃ havirdhānī tato 'bhavat"
  - id: '8.8.3'
    kind: verse
    lines:
      - "तत उच्चैःश्रवा नाम हयोऽभूच्चन्द्रपाण्डुरः"
      - "तस्मिन्बलिः स्पृहां चक्रे नेन्द्र ईश्वरशिक्षया"
    iast: "tata uccaiḥśravā nāma hayo 'bhūc candrapāṇḍuraḥ | tasmin baliḥ spṛhāṃ cakre nendra īśvaraśikṣayā"
  - id: '8.8.4'
    kind: verse
    lines:
      - "तत ऐरावतो नाम वारणेन्द्रो विनिर्गतः"
      - "दन्तैश्चतुर्भिः श्वेताद्रेर्हरन्भगवतो महिम्"
    iast: "tata airāvato nāma vāraṇendro vinirgataḥ | dantaiścaturbhiḥ śvetādrerharan bhagavato mahim"
  - id: '8.8.6'
    kind: verse
    lines:
      - "कौस्तुभाख्यमभूद्रत्नं पद्मरागो महोदधेः"
      - "तस्मिन्मणौ स्पृहां चक्रे वक्षोऽलङ्करणे हरिः"
    iast: "kaustubhākhyamabhūdratnaṃ padmarāgo mahodadheḥ | tasmin maṇau spṛhāṃ cakre vakṣo 'laṅkaraṇe hariḥ"
  - id: '8.8.7'
    kind: verse
    lines:
      - "ततोऽभवत्पारिजातः सुरलोकविभूषणम्"
      - "पूरयत्यर्थिनो योऽर्थैः शश्वद्भुवि यथा भवान्"
    iast: "tato 'bhavat pārijātaḥ suralokavibhūṣaṇam | pūrayaty arthino yo 'rthaiḥ śaśvadbhuvi yathā bhavān"
  - id: '8.8.8'
    kind: verse
    lines:
      - "ततश्चाप्सरसो जाता निष्ककण्ठ्यः सुवाससः"
      - "रमण्यः स्वर्गिणां वल्गु गतिलीलावलोकनैः"
    iast: "tataścāpsaraso jātā niṣkakaṇṭhyaḥ suvāsasaḥ | ramaṇyaḥ svargiṇāṃ valgu gatilīlāvalokanaiḥ"
  - id: '8.8.9'
    kind: verse
    lines:
      - "ततश्चाविरभूत्साक्षाच्छ्री रमा भगवत्परा"
      - "रञ्जयन्ती दिशः कान्त्या विद्युत्सौदामनी यथा"
    iast: "tataścāvirabhūt sākṣāc chrī ramā bhagavatparā | rañjayantī diśaḥ kāntyā vidyut saudāmanī yathā"
  - id: '8.8.10'
    kind: verse
    lines:
      - "तस्यां चक्रुः स्पृहां सर्वे ससुरासुरमानवाः"
      - "रूपौदार्यवयोवर्ण महिमाक्षिप्तचेतसः"
    iast: "tasyāṃ cakruḥ spṛhāṃ sarve sasurāsuramānavāḥ | rūpaudāryavayovarṇa mahimākṣiptacetasaḥ"
  - id: '8.8.18'
    kind: verse
    lines:
      - "ततः कृतस्वस्त्ययनोत्पलस्रजं नदद्द्विरेफां परिगृह्य पाणिना"
      - "चचाल वक्त्रं सुकपोलकुण्डलं सव्रीडहासं दधती सुशोभनम्"
    iast: "tataḥ kṛtasvastyayanotpalasrajaṃ nadaddvirephāṃ parigṛhya pāṇinā | cacāla vaktraṃ sukapolakuṇḍalaṃ savrīḍahāsaṃ dadhatī suśobhanam"
  - id: '8.8.20'
    kind: verse
    lines:
      - "विलोकयन्ती निरवद्यमात्मनः पदं ध्रुवं चाव्यभिचारिसद्गुणम्"
      - "गन्धर्वसिद्धासुरयक्षचारण त्रैपिष्टपेयादिषु नान्वविन्दत"
    iast: "vilokayantī niravadyamātmanaḥ padaṃ dhruvaṃ cāvyabhicārisadguṇam | gandharvasiddhāsurayakṣacāraṇa traipiṣṭapeyādiṣu nānvavindata"
  - id: '8.8.21'
    kind: verse
    lines:
      - "नूनं तपो यस्य न मन्युनिर्जयो ज्ञानं क्वचित्तच्च न सङ्गवर्जितम्"
      - "कश्चिन्महांस्तस्य न कामनिर्जयः स ईश्वरः किं परतो व्यपाश्रयः"
    iast: "nūnaṃ tapo yasya na manyunirjayo jñānaṃ kvacit tac ca na saṅgavarjitam | kaścin mahāṃstasya na kāmanirjayaḥ sa īśvaraḥ kiṃ parato vyapāśrayaḥ"
  - id: '8.8.22'
    kind: verse
    lines:
      - "धर्मः क्वचित्तत्र न भूतसौहृदं त्यागः क्वचित्तत्र न मुक्तिकारणम्"
      - "वीर्यं न पुंसोऽस्त्यजवेगनिष्कृतं न हि द्वितीयो गुणसङ्गवर्जितः"
    iast: "dharmaḥ kvacit tatra na bhūtasauhṛdaṃ tyāgaḥ kvacit tatra na muktikāraṇam | vīryaṃ na puṃso 'sty ajaveganiṣkṛtaṃ na hi dvitīyo guṇasaṅgavarjitaḥ"
  - id: '8.8.23'
    kind: verse
    lines:
      - "क्वचिच्चिरायुर्न हि शीलमङ्गलं क्वचित्तदप्यस्ति न वेद्यमायुषः"
      - "यत्रोभयं कुत्र च सोऽप्यमङ्गलः सुमङ्गलः कश्च न काङ्क्षते हि माम्"
    iast: "kvacic cirāyurna hi śīlamaṅgalaṃ kvacit tadapy asti na vedyamāyuṣaḥ | yatrobhayaṃ kutra ca so 'py amaṅgalaḥ sumaṅgalaḥ kaśca na kāṅkṣate hi mām"
  - id: '8.8.24'
    kind: verse
    lines:
      - "एवं विमृश्याव्यभिचारिसद्गुणैर्वरं निजैकाश्रयतयागुणाश्रयम्"
      - "वव्रे वरं सर्वगुणैरपेक्षितं रमा मुकुन्दं निरपेक्षमीप्सितम्"
    iast: "evaṃ vimṛśyāvyabhicārisadguṇair varaṃ nijaikāśrayatayāguṇāśrayam | vavre varaṃ sarvaguṇairapekṣitaṃ ramā mukundaṃ nirapekṣamīpsitam"
  - id: '8.8.25'
    kind: verse
    lines:
      - "तस्यांसदेश उशतीं नवकञ्जमालां माद्यन्मधुव्रतवरूथगिरोपघुष्टामम्प्;"
      - "तस्थौ निधाय निकटे तदुरः स्वधाम सव्रीडहासविकसन्नयनेन याता"
    iast: "tasyāṃsadeśa uśatīṃ navakañjamālāṃ mādyanmadhuvratavarūthagiropaghuṣṭām amp; | tasthau nidhāya nikaṭe taduraḥ svadhāma savrīḍahāsavikasannayanena yātā"
  - id: '8.8.26'
    kind: verse
    lines:
      - "तस्याः श्रियस्त्रिजगतो जनको जनन्या वक्षो निवासमकरोत्परमं विभूतेः"
      - "श्रीः स्वाः प्रजाः सकरुणेन निरीक्षणेन यत्र स्थितैधयत साधिपतींस्त्रिलोकान्"
    iast: "tasyāḥ śriyastrijagato janako jananyā vakṣo nivāsamakarot paramaṃ vibhūteḥ | śrīḥ svāḥ prajāḥ sakaruṇena nirīkṣaṇena yatra sthitaidhayata sādhipatīṃstrilokān"
  - id: '8.8.31'
    kind: verse
    lines:
      - "अथासीद्वारुणी देवी कन्या कमललोचना"
      - "असुरा जगृहुस्तां वै हरेरनुमतेन ते"
    iast: "athāsīdvāruṇī devī kanyā kamalalocanā | asurā jagṛhustāṃ vai hareranumatena te"
  - id: '8.8.35'
    kind: verse
    lines:
      - "अमृतापूर्णकलसं बिभ्रद्वलयभूषितः"
      - "स वै भगवतः साक्षाद्विष्णोरंशांशसम्भवः"
    iast: "amṛtāpūrṇakalasaṃ bibhradvalayabhūṣitaḥ | sa vai bhagavataḥ sākṣādviṣṇoraṃśāṃśasambhavaḥ"
  - id: '8.8.36'
    kind: verse
    lines:
      - "धन्वन्तरिरिति ख्यात आयुर्वेददृगिज्यभाक्"
      - "तमालोक्यासुराः सर्वे कलसं चामृताभृतम्"
    iast: "dhanvantaririti khyāta āyurvedadṛg ijyabhāk | tamālokyāsurāḥ sarve kalasaṃ cāmṛtābhṛtam"
  - id: '8.8.37'
    kind: verse
    lines:
      - "लिप्सन्तः सर्ववस्तूनि कलसं तरसाहरन्"
      - "नीयमानेऽसुरैस्तस्मिन्कलसेऽमृतभाजने"
    iast: "lipsantaḥ sarvavastūni kalasaṃ tarasāharan | nīyamāne 'suraistasmin kalase 'mṛtabhājane"
  - id: '8.8.38'
    kind: verse
    lines:
      - "विषण्णमनसो देवा हरिं शरणमाययुः"
      - "इति तद्दैन्यमालोक्य भगवान्भृत्यकामकृत्"
      - "मा खिद्यत मिथोऽर्थं वः साधयिष्ये स्वमायया"
    iast: "viṣaṇṇamanaso devā hariṃ śaraṇamāyayuḥ | iti taddainyamālokya bhagavān bhṛtyakāmakṛt | mā khidyata mitho 'rthaṃ vaḥ sādhayiṣye svamāyayā"
  - id: '8.8.39'
    kind: verse
    lines:
      - "मिथः कलिरभूत्तेषां तदर्थे तर्षचेतसाम्"
      - "अहं पूर्वमहं पूर्वं न त्वं न त्वमिति प्रभो"
    iast: "mithaḥ kalirabhūt teṣāṃ tadarthe tarṣacetasām | ahaṃ pūrvamahaṃ pūrvaṃ na tvaṃ na tvamiti prabho"
  - id: '8.8.42'
    kind: verse
    lines:
      - "एतस्मिन्नन्तरे विष्णुः सर्वोपायविदीश्वरः"
      - "योषिद्रूपमनिर्देश्यं दधारपरमाद्भुतम्"
    iast: "etasminnantare viṣṇuḥ sarvopāyavidīśvaraḥ | yoṣidrūpamanirdeśyaṃ dadhāraparamādbhutam"
  - id: '8.8.47'
    kind: verse
    lines:
      - "सव्रीडस्मितविक्षिप्त भ्रूविलासावलोकनैः"
      - "दैत्ययूथपचेतःसु काममुद्दीपयन्मुहुः"
    iast: "savrīḍasmitavikṣipta bhrūvilāsāvalokanaiḥ | daityayūthapacetaḥsu kāmamuddīpayan muhuḥ"
  - id: '8.9.3'
    kind: verse
    lines:
      - "का त्वं कञ्जपलाशाक्षि कुतो वा किं चिकीर्षसि"
      - "कस्यासि वद वामोरु मथ्नतीव मनांसि नः"
    iast: "kā tvaṃ kañjapalāśākṣi kuto vā kiṃ cikīrṣasi | kasyāsi vada vāmoru mathnatīva manāṃsi naḥ"
  - id: '8.9.6'
    kind: verse
    lines:
      - "सा त्वं नः स्पर्धमानानामेकवस्तुनि मानिनि"
      - "ज्ञातीनां बद्धवैराणां शं विधत्स्व सुमध्यमे"
    iast: "sā tvaṃ naḥ spardhamānānāmekavastuni mānini | jñātīnāṃ baddhavairāṇāṃ śaṃ vidhatsva sumadhyame"
  - id: '8.9.7'
    kind: verse
    lines:
      - "वयं कश्यपदायादा भ्रातरः कृतपौरुषाः"
      - "विभजस्व यथान्यायं नैव भेदो यथा भवेत्"
    iast: "vayaṃ kaśyapadāyādā bhrātaraḥ kṛtapauruṣāḥ | vibhajasva yathānyāyaṃ naiva bhedo yathā bhavet"
  - id: '8.9.12'
    kind: verse
    lines:
      - "ततो गृहीत्वामृतभाजनं हरिर्बभाष ईषत्स्मितशोभया गिरा"
      - "यद्यभ्युपेतं क्व च साध्वसाधु वा कृतं मया वो विभजे सुधामिमाम्"
    iast: "tato gṛhītvāmṛtabhājanaṃ harir babhāṣa īṣatsmitaśobhayā girā | yady abhyupetaṃ kva ca sādhvasādhu vā kṛtaṃ mayā vo vibhaje sudhāmimām"
  - id: '8.9.13'
    kind: verse
    lines:
      - "इत्यभिव्याहृतं तस्या आकर्ण्यासुरपुङ्गवाः"
      - "अप्रमाणविदस्तस्यास्तत्तथेत्यन्वमंसत"
    iast: "ity abhivyāhṛtaṃ tasyā ākarṇyāsurapuṅgavāḥ | apramāṇavidastasyāstat tathety anvamaṃsata"
  - id: '8.9.16'
    kind: verse
    lines:
      - "प्राङ्मुखेषूपविष्टेषु सुरेषु दितिजेषु च"
      - "धूपामोदितशालायांजुष्टायां माल्यदीपकैः"
    iast: "prāṅmukheṣūpaviṣṭeṣu sureṣu ditijeṣu ca | dhūpāmoditaśālāyāṃjuṣṭāyāṃ mālyadīpakaiḥ"
  - id: '8.9.20'
    kind: verse
    lines:
      - "कल्पयित्वा पृथक्पङ्क्तीरुभयेषां जगत्पतिः"
      - "तांश्चोपवेशयामास स्वेषु स्वेषु च पङ्क्तिषु"
    iast: "kalpayitvā pṛthak paṅktīrubhayeṣāṃ jagatpatiḥ | tāṃścopaveśayāmāsa sveṣu sveṣu ca paṅktiṣu"
  - id: '8.9.21'
    kind: verse
    lines:
      - "दैत्यान्गृहीतकलसो वञ्चयन्नुपसञ्चरैः"
      - "दूरस्थान्पाययामासजरामृत्युहरां सुधाम्"
    iast: "daityān gṛhītakalaso vañcayannupasañcaraiḥ | dūrasthān pāyayāmāsajarāmṛtyuharāṃ sudhām"
  - id: '8.9.23'
    kind: verse
    lines:
      - "तस्यां कृतातिप्रणयाः प्रणयापायकातराः"
      - "बहुमानेन चाबद्धा नोचुः किञ्चन विप्रियम्"
    iast: "tasyāṃ kṛtātipraṇayāḥ praṇayāpāyakātarāḥ | bahumānena cābaddhā nocuḥ kiñcana vipriyam"
  - id: '8.9.28'
    kind: verse
    lines:
      - "एवं सुरासुरगणाः समदेशकाल हेत्वर्थकर्ममतयोऽपि फले विकल्पाः अम्प्;"
      - "तत्रामृतं सुरगणाः फलमञ्जसापुर्यत्पादपङ्कजरजःश्रयणान्न दैत्याः"
    iast: "evaṃ surāsuragaṇāḥ samadeśakāla hetvarthakarmamatayo 'pi phale vikalpāḥ amp; | tatrāmṛtaṃ suragaṇāḥ phalamañjasāpur yatpādapaṅkajarajaḥśrayaṇān na daityāḥ"
  - id: '8.10.2'
    kind: verse
    lines:
      - "साधयित्वामृतं राजन्पाययित्वा स्वकान्सुरान्"
      - "पश्यतां सर्वभूतानां ययौ गरुडवाहनः"
    iast: "sādhayitvāmṛtaṃ rājan pāyayitvā svakān surān | paśyatāṃ sarvabhūtānāṃ yayau garuḍavāhanaḥ"
  - id: '8.15.4'
    kind: verse
    lines:
      - "तं ब्राह्मणा भृगवः प्रीयमाणा अयाजयन्विश्वजिता त्रिणाकम्"
      - "जिगीषमाणं विधिनाभिषिच्य महाभिषेकेण महानुभावाः"
    iast: "taṃ brāhmaṇā bhṛgavaḥ prīyamāṇā ayājayan viśvajitā triṇākam | jigīṣamāṇaṃ vidhinābhiṣicya mahābhiṣekeṇa mahānubhāvāḥ"
  - id: '8.15.5'
    kind: verse
    lines:
      - "ततो रथः काञ्चनपट्टनद्धो हयाश्च हर्यश्वतुरङ्गवर्णाः"
      - "ध्वजश्च सिंहेन विराजमानो हुताशनादास हविर्भिरिष्टात्"
    iast: "tato rathaḥ kāñcanapaṭṭanaddho hayāśca haryaśvaturaṅgavarṇāḥ | dhvajaśca siṃhena virājamāno hutāśanādāsa havirbhiriṣṭāt"
  - id: '8.15.8'
    kind: verse
    lines:
      - "अथारुह्य रथं दिव्यं भृगुदत्तं महारथः"
      - "सुस्रग्धरोऽथ सन्नह्य धन्वी खड्गी धृतेषुधिः"
    iast: "athāruhya rathaṃ divyaṃ bhṛgudattaṃ mahārathaḥ | susragdharo 'tha sannahya dhanvī khaḍgī dhṛteṣudhiḥ"
  - id: '8.15.11'
    kind: verse
    lines:
      - "वृतो विकर्षन्महतीमासुरीं ध्वजिनीं विभुः"
      - "ययाविन्द्रपुरीं स्वृद्धां कम्पयन्निव रोदसी"
    iast: "vṛto vikarṣan mahatīmāsurīṃ dhvajinīṃ vibhuḥ | yayāvindrapurīṃ svṛddhāṃ kampayanniva rodasī"
  - id: '8.15.22'
    kind: verse
    lines:
      - "यां न व्रजन्त्यधर्मिष्ठाः खला भूतद्रुहः शठाः"
      - "मानिनः कामिनो लुब्धा एभिर्हीना व्रजन्ति यत्"
    iast: "yāṃ na vrajanty adharmiṣṭhāḥ khalā bhūtadruhaḥ śaṭhāḥ | māninaḥ kāmino lubdhā ebhirhīnā vrajanti yat"
  - id: '8.15.23'
    kind: verse
    lines:
      - "तां देवधानीं स वरूथिनीपतिर्बहिः समन्ताद्रुरुधे पृतन्यया"
      - "आचार्यदत्तं जलजं महास्वनं दध्मौ प्रयुञ्जन्भयमिन्द्रयोषिताम्"
    iast: "tāṃ devadhānīṃ sa varūthinīpatir bahiḥ samantādrurudhe pṛtanyayā | ācāryadattaṃ jalajaṃ mahāsvanaṃ dadhmau prayuñjan bhayamindrayoṣitām"
  - id: '8.15.24'
    kind: verse
    lines:
      - "मघवांस्तमभिप्रेत्य बलेः परममुद्यमम्"
      - "सर्वदेवगणोपेतो गुरुमेतदुवाच ह"
    iast: "maghavāṃstamabhipretya baleḥ paramamudyamam | sarvadevagaṇopeto gurumetaduvāca ha"
  - id: '8.15.25'
    kind: verse
    lines:
      - "भगवन्नुद्यमो भूयान्बलेर्नः पूर्ववैरिणः"
      - "अविषह्यमिमं मन्ये केनासीत्तेजसोर्जितः"
    iast: "bhagavannudyamo bhūyān balernaḥ pūrvavairiṇaḥ | aviṣahyamimaṃ manye kenāsīt tejasorjitaḥ"
  - id: '8.15.28'
    kind: verse
    lines:
      - "जानामि मघवन्छत्रोरुन्नतेरस्य कारणम्"
      - "शिष्यायोपभृतं तेजो भृगुभिर्ब्रह्मवादिभिः"
    iast: "jānāmi maghavan chatrorunnaterasya kāraṇam | śiṣyāyopabhṛtaṃ tejo bhṛgubhirbrahmavādibhiḥ"
  - id: '8.15.29'
    kind: verse
    lines:
      - "ओजस्विनं बलिं जेतुं न समर्थोऽस्ति कश्चन"
      - "भवद्विधो भवान्वापि वर्जयित्वेश्वरं हरिम्"
    iast: "ojasvinaṃ baliṃ jetuṃ na samartho 'sti kaścana | bhavadvidho bhavān vāpi varjayitveśvaraṃ harim"
  - id: '8.15.30'
    kind: verse
    lines:
      - "विजेष्यति न कोऽप्येनं ब्रह्मतेजःसमेधितम्"
      - "नास्य शक्तः पुरः स्थातुं कृतान्तस्य यथा जनाः"
    iast: "vijeṣyati na ko 'py enaṃ brahmatejaḥsamedhitam | nāsya śaktaḥ puraḥ sthātuṃ kṛtāntasya yathā janāḥ"
  - id: '8.15.31'
    kind: verse
    lines:
      - "तस्मान्निलयमुत्सृज्य यूयं सर्वे त्रिविष्टपम्"
      - "यात कालं प्रतीक्षन्तो यतः शत्रोर्विपर्ययः"
    iast: "tasmān nilayamutsṛjya yūyaṃ sarve triviṣṭapam | yāta kālaṃ pratīkṣanto yataḥ śatrorviparyayaḥ"
  - id: '8.15.34'
    kind: verse
    lines:
      - "देवेष्वथ निलीनेषु बलिर्वैरोचनः पुरीम्"
      - "देवधानीमधिष्ठाय वशं निन्ये जगत्त्रयम्"
    iast: "deveṣvatha nilīneṣu balirvairocanaḥ purīm | devadhānīmadhiṣṭhāya vaśaṃ ninye jagattrayam"
  - id: '8.16.1'
    kind: verse
    lines:
      - "एवं पुत्रेषु नष्टेषु देवमातादितिस्तदा"
      - "हृते त्रिविष्टपे दैत्यैः पर्यतप्यदनाथवत्"
    iast: "evaṃ putreṣu naṣṭeṣu devamātāditistadā | hṛte triviṣṭape daityaiḥ paryatapyadanāthavat"
  - id: '8.16.3'
    kind: verse
    lines:
      - "स पत्नीं दीनवदनां कृतासनपरिग्रहः"
      - "सभाजितो यथान्यायमिदमाह कुरूद्वह"
    iast: "sa patnīṃ dīnavadanāṃ kṛtāsanaparigrahaḥ | sabhājito yathānyāyamidamāha kurūdvaha"
  - id: '8.16.10'
    kind: verse
    lines:
      - "अपि सर्वे कुशलिनस्तव पुत्रा मनस्विनि"
      - "लक्षयेऽस्वस्थमात्मानं भवत्या लक्षणैरहम्"
    iast: "api sarve kuśalinastava putrā manasvini | lakṣaye 'svasthamātmānaṃ bhavatyā lakṣaṇairaham"
  - id: '8.16.15'
    kind: verse
    lines:
      - "तस्मादीश भजन्त्या मे श्रेयश्चिन्तय सुव्रत"
      - "हृतश्रियो हृतस्थानान्सपत्नैः पाहि नः प्रभो"
    iast: "tasmādīśa bhajantyā me śreyaścintaya suvrata | hṛtaśriyo hṛtasthānān sapatnaiḥ pāhi naḥ prabho"
  - id: '8.16.17'
    kind: verse
    lines:
      - "यथा तानि पुनः साधो प्रपद्येरन्ममात्मजाः"
      - "तथा विधेहि कल्याणं धिया कल्याणकृत्तम"
    iast: "yathā tāni punaḥ sādho prapadyeran mamātmajāḥ | tathā vidhehi kalyāṇaṃ dhiyā kalyāṇakṛttama"
  - id: '8.16.21'
    kind: verse
    lines:
      - "स विधास्यति ते कामान्हरिर्दीनानुकम्पनः"
      - "अमोघा भगवद्भक्तिर्नेतरेति मतिर्मम"
    iast: "sa vidhāsyati te kāmān harirdīnānukampanaḥ | amoghā bhagavadbhaktirnetareti matirmama"
  - id: '8.17.1'
    kind: verse
    lines:
      - "इत्युक्ता सादिती राजन्स्वभर्त्रा कश्यपेन वै"
      - "अन्वतिष्ठद्व्रतमिदं द्वादशाहमतन्द्रिता"
    iast: "ity uktā sāditī rājan svabhartrā kaśyapena vai | anvatiṣṭhadvratamidaṃ dvādaśāhamatandritā"
  - id: '8.17.3'
    kind: verse
    lines:
      - "मनश्चैकाग्रया बुद्ध्या भगवत्यखिलात्मनि"
      - "वासुदेवे समाधाय चचार ह पयोव्रतम्"
    iast: "manaścaikāgrayā buddhyā bhagavaty akhilātmani | vāsudeve samādhāya cacāra ha payovratam"
  - id: '8.17.4'
    kind: verse
    lines:
      - "तस्याः प्रादुरभूत्तात भगवानादिपुरुषः"
      - "पीतवासाश्चतुर्बाहुः शङ्खचक्रगदाधरः"
    iast: "tasyāḥ prādurabhūt tāta bhagavān ādipuruṣaḥ | pītavāsāścaturbāhuḥ śaṅkhacakragadādharaḥ"
  - id: '8.17.5'
    kind: verse
    lines:
      - "तं नेत्रगोचरं वीक्ष्य सहसोत्थाय सादरम्"
      - "ननाम भुवि कायेन दण्डवत्प्रीतिविह्वला"
    iast: "taṃ netragocaraṃ vīkṣya sahasotthāya sādaram | nanāma bhuvi kāyena daṇḍavatprītivihvalā"
  - id: '8.17.12'
    kind: verse
    lines:
      - "देवमातर्भवत्या मे विज्ञातं चिरकाङ्क्षितम्"
      - "यत्सपत्नैर्हृतश्रीणां च्यावितानां स्वधामतः"
    iast: "devamātarbhavatyā me vijñātaṃ cirakāṅkṣitam | yat sapatnairhṛtaśrīṇāṃ cyāvitānāṃ svadhāmataḥ"
  - id: '8.17.15'
    kind: verse
    lines:
      - "आत्मजान्सुसमृद्धांस्त्वं प्रत्याहृतयशःश्रियः"
      - "नाकपृष्ठमधिष्ठाय क्रीडतो द्रष्टुमिच्छसि"
    iast: "ātmajān susamṛddhāṃstvaṃ pratyāhṛtayaśaḥśriyaḥ | nākapṛṣṭhamadhiṣṭhāya krīḍato draṣṭumicchasi"
  - id: '8.17.16'
    kind: verse
    lines:
      - "प्रायोऽधुना तेऽसुरयूथनाथा अपारणीया इति देवि मे मतिः"
      - "यत्तेऽनुकूलेश्वरविप्रगुप्ता न विक्रमस्तत्र सुखं ददाति"
    iast: "prāyo 'dhunā te 'surayūthanāthā apāraṇīyā iti devi me matiḥ | yat te 'nukūleśvaravipraguptā na vikramastatra sukhaṃ dadāti"
  - id: '8.17.17'
    kind: verse
    lines:
      - "अथाप्युपायो मम देवि चिन्त्यः सन्तोषितस्य व्रतचर्यया ते"
      - "ममार्चनं नार्हति गन्तुमन्यथा श्रद्धानुरूपं फलहेतुकत्वात्"
    iast: "athāpy upāyo mama devi cintyaḥ santoṣitasya vratacaryayā te | mamārcanaṃ nārhati gantumanyathā śraddhānurūpaṃ phalahetukatvāt"
  - id: '8.17.18'
    kind: verse
    lines:
      - "त्वयार्चितश्चाहमपत्यगुप्तये पयोव्रतेनानुगुणं समीडितः"
      - "स्वांशेन पुत्रत्वमुपेत्य ते सुतान्गोप्तास्मि मारीचतपस्यधिष्ठितः"
    iast: "tvayārcitaścāhamapatyaguptaye payovratenānuguṇaṃ samīḍitaḥ | svāṃśena putratvamupetya te sutān goptāsmi mārīcatapasy adhiṣṭhitaḥ"
  - id: '8.17.21'
    kind: verse
    lines:
      - "एतावदुक्त्वा भगवांस्तत्रैवान्तरधीयत"
      - "अदितिर्दुर्लभं लब्ध्वा हरेर्जन्मात्मनि प्रभोः"
    iast: "etāvaduktvā bhagavāṃstatraivāntaradhīyata | aditirdurlabhaṃ labdhvā harerjanmātmani prabhoḥ"
  - id: '8.18.1'
    kind: verse
    lines:
      - "इत्थं विरिञ्चस्तुतकर्मवीर्यः प्रादुर्बभूवामृतभूरदित्याम्"
      - "चतुर्भुजः शङ्खगदाब्जचक्रः पिशङ्गवासा नलिनायतेक्षणः"
    iast: "itthaṃ viriñcastutakarmavīryaḥ prādurbabhūvāmṛtabhūradityām | caturbhujaḥ śaṅkhagadābjacakraḥ piśaṅgavāsā nalināyatekṣaṇaḥ"
  - id: '8.18.12'
    kind: verse
    lines:
      - "यत्तद्वपुर्भाति विभूषणायुधैरव्यक्तचिद्व्यक्तमधारयद्धरिः"
      - "बभूव तेनैव स वामनो वटुः सम्पश्यतोर्दिव्यगतिर्यथा नटः"
    iast: "yat tadvapurbhāti vibhūṣaṇāyudhair avyaktacidvyaktamadhārayaddhariḥ | babhūva tenaiva sa vāmano vaṭuḥ sampaśyatordivyagatiryathā naṭaḥ"
  - id: '8.18.13'
    kind: verse
    lines:
      - "तं वटुं वामनं दृष्ट्वा मोदमाना महर्षयः"
      - "कर्माणि कारयामासुः पुरस्कृत्य प्रजापतिम्"
    iast: "taṃ vaṭuṃ vāmanaṃ dṛṣṭvā modamānā maharṣayaḥ | karmāṇi kārayāmāsuḥ puraskṛtya prajāpatim"
  - id: '8.18.18'
    kind: verse
    lines:
      - "स ब्रह्मवर्चसेनैवं सभां सम्भावितो वटुः"
      - "ब्रह्मर्षिगणसञ्जुष्टामत्यरोचत मारिषः"
    iast: "sa brahmavarcasenaivaṃ sabhāṃ sambhāvito vaṭuḥ | brahmarṣigaṇasañjuṣṭāmatyarocata māriṣaḥ"
  - id: '8.18.20'
    kind: verse
    lines:
      - "श्रुत्वाश्वमेधैर्यजमानमूर्जितं बलिं भृगूणामुपकल्पितैस्ततः"
      - "जगाम तत्राखिलसारसम्भृतो भारेण गां सन्नमयन्पदे पदे"
    iast: "śrutvāśvamedhairyajamānamūrjitaṃ baliṃ bhṛgūṇāmupakalpitaistataḥ | jagāma tatrākhilasārasambhṛto bhāreṇa gāṃ sannamayan pade pade"
  - id: '8.18.25'
    kind: verse
    lines:
      - "प्रविष्टं वीक्ष्य भृगवः सशिष्यास्ते सहाग्निभिः"
      - "प्रत्यगृह्णन्समुत्थाय सङ्क्षिप्तास्तस्य तेजसा"
    iast: "praviṣṭaṃ vīkṣya bhṛgavaḥ saśiṣyāste sahāgnibhiḥ | pratyagṛhṇan samutthāya saṅkṣiptāstasya tejasā"
  - id: '8.18.27'
    kind: verse
    lines:
      - "स्वागतेनाभिनन्द्याथ पादौ भगवतो बलिः"
      - "अवनिज्यार्चयामास मुक्तसङ्गमनोरमम्"
    iast: "svāgatenābhinandyātha pādau bhagavato baliḥ | avanijyārcayāmāsa muktasaṅgamanoramam"
  - id: '8.18.32'
    kind: verse
    lines:
      - "यद्यद्वटो वाञ्छसि तत्प्रतीच्छ मे त्वामर्थिनं विप्रसुतानुतर्कये"
      - "गां काञ्चनं गुणवद्धाम मृष्टं तथान्नपेयमुत वा विप्रकन्याम्"
      - "ग्रामान्समृद्धांस्तुरगान्गजान्वा रथांस्तथार्हत्तम सम्प्रतीच्छ"
    iast: "yadyadvaṭo vāñchasi tat pratīccha me tvāmarthinaṃ viprasutānutarkaye | gāṃ kāñcanaṃ guṇavaddhāma mṛṣṭaṃ tathānnapeyamuta vā viprakanyām | grāmān samṛddhāṃsturagān gajān vā rathāṃstathārhattama sampratīccha"
  - id: '8.19.3'
    kind: verse
    lines:
      - "न ह्येतस्मिन्कुले कश्चिन्निःसत्त्वः कृपणः पुमान्"
      - "प्रत्याख्याता प्रतिश्रुत्य यो वादाता द्विजातये"
    iast: "na hy etasmin kule kaścin niḥsattvaḥ kṛpaṇaḥ pumān | pratyākhyātā pratiśrutya yo vādātā dvijātaye"
  - id: '8.19.14'
    kind: verse
    lines:
      - "पिता प्रह्रादपुत्रस्ते तद्विद्वान्द्विजवत्सलः"
      - "स्वमायुर्द्विजलिङ्गेभ्यो देवेभ्योऽदात्स याचितः"
    iast: "pitā prahrādaputraste tadvidvān dvijavatsalaḥ | svamāyurdvijaliṅgebhyo devebhyo 'dāt sa yācitaḥ"
  - id: '8.19.16'
    kind: verse
    lines:
      - "तस्मात्त्वत्तो महीमीषद्वृणेऽहं वरदर्षभात्"
      - "पदानि त्रीणि दैत्येन्द्र सम्मितानि पदा मम"
    iast: "tasmāt tvatto mahīmīṣadvṛṇe 'haṃ varadarṣabhāt | padāni trīṇi daityendra sammitāni padā mama"
  - id: '8.19.17'
    kind: verse
    lines:
      - "नान्यत्ते कामये राजन्वदान्याज्जगदीश्वरात्"
      - "नैनः प्राप्नोति वै विद्वान्यावदर्थप्रतिग्रहः"
    iast: "nānyat te kāmaye rājan vadānyāj jagadīśvarāt | nainaḥ prāpnoti vai vidvān yāvadarthapratigrahaḥ"
  - id: '8.19.18'
    kind: verse
    lines:
      - "अहो ब्राह्मणदायाद वाचस्ते वृद्धसम्मताः"
      - "त्वं बालो बालिशमतिः स्वार्थं प्रत्यबुधो यथा"
    iast: "aho brāhmaṇadāyāda vācaste vṛddhasammatāḥ | tvaṃ bālo bāliśamatiḥ svārthaṃ praty abudho yathā"
  - id: '8.19.19'
    kind: verse
    lines:
      - "मां वचोभिः समाराध्य लोकानामेकमीश्वरम्"
      - "पदत्रयं वृणीते योऽबुद्धिमान्द्वीपदाशुषम्"
    iast: "māṃ vacobhiḥ samārādhya lokānāmekamīśvaram | padatrayaṃ vṛṇīte yo 'buddhimān dvīpadāśuṣam"
  - id: '8.19.20'
    kind: verse
    lines:
      - "न पुमान्मामुपव्रज्य भूयो याचितुमर्हति"
      - "तस्माद्वृत्तिकरीं भूमिं वटो कामं प्रतीच्छ मे"
    iast: "na pumān māmupavrajya bhūyo yācitumarhati | tasmādvṛttikarīṃ bhūmiṃ vaṭo kāmaṃ pratīccha me"
  - id: '8.19.21'
    kind: verse
    lines:
      - "यावन्तो विषयाः प्रेष्ठास्त्रिलोक्यामजितेन्द्रियम्"
      - "न शक्नुवन्ति ते सर्वे प्रतिपूरयितुं नृप"
    iast: "yāvanto viṣayāḥ preṣṭhāstrilokyāmajitendriyam | na śaknuvanti te sarve pratipūrayituṃ nṛpa"
  - id: '8.19.23'
    kind: verse
    lines:
      - "सप्तद्वीपाधिपतयो नृपा वैण्यगयादयः"
      - "अर्थैः कामैर्गता नान्तं तृष्णाया इति नः श्रुतम्"
    iast: "saptadvīpādhipatayo nṛpā vaiṇyagayādayaḥ | arthaiḥ kāmairgatā nāntaṃ tṛṣṇāyā iti naḥ śrutam"
  - id: '8.19.26'
    kind: verse
    lines:
      - "यदृच्छालाभतुष्टस्य तेजो विप्रस्य वर्धते"
      - "तत्प्रशाम्यत्यसन्तोषादम्भसेवाशुशुक्षणिः"
    iast: "yadṛcchālābhatuṣṭasya tejo viprasya vardhate | tat praśāmyaty asantoṣādambhasevāśuśukṣaṇiḥ"
  - id: '8.19.27'
    kind: verse
    lines:
      - "तस्मात्त्रीणि पदान्येव वृणे त्वद्वरदर्षभात्"
      - "एतावतैव सिद्धोऽहं वित्तं यावत्प्रयोजनम्"
    iast: "tasmāt trīṇi padāny eva vṛṇe tvadvaradarṣabhāt | etāvataiva siddho 'haṃ vittaṃ yāvat prayojanam"
  - id: '8.19.28'
    kind: verse
    lines:
      - "इत्युक्तः स हसन्नाह वाञ्छातः प्रतिगृह्यताम्"
      - "वामनाय महीं दातुं जग्राह जलभाजनम्"
    iast: "ity uktaḥ sa hasannāha vāñchātaḥ pratigṛhyatām | vāmanāya mahīṃ dātuṃ jagrāha jalabhājanam"
  - id: '8.19.29'
    kind: verse
    lines:
      - "विष्णवे क्ष्मां प्रदास्यन्तमुशना असुरेश्वरम्"
      - "जानंश्चिकीर्षितं विष्णोः शिष्यं प्राह विदां वरः"
    iast: "viṣṇave kṣmāṃ pradāsyantamuśanā asureśvaram | jānaṃścikīrṣitaṃ viṣṇoḥ śiṣyaṃ prāha vidāṃ varaḥ"
  - id: '8.19.31'
    kind: verse
    lines:
      - "प्रतिश्रुतं त्वयैतस्मै यदनर्थमजानता"
      - "न साधु मन्ये दैत्यानां महानुपगतोऽनयः"
    iast: "pratiśrutaṃ tvayaitasmai yadanarthamajānatā | na sādhu manye daityānāṃ mahān upagato 'nayaḥ"
  - id: '8.19.32'
    kind: verse
    lines:
      - "एष ते स्थानमैश्वर्यं श्रियं तेजो यशः श्रुतम्"
      - "दास्यत्याच्छिद्य शक्राय मायामाणवको हरिः"
    iast: "eṣa te sthānamaiśvaryaṃ śriyaṃ tejo yaśaḥ śrutam | dāsyaty ācchidya śakrāya māyāmāṇavako hariḥ"
  - id: '8.20.3'
    kind: verse
    lines:
      - "स चाहं वित्तलोभेन प्रत्याचक्षे कथं द्विजम्"
      - "प्रतिश्रुत्य ददामीति प्राह्रादिः कितवो यथा"
    iast: "sa cāhaṃ vittalobhena pratyācakṣe kathaṃ dvijam | pratiśrutya dadāmīti prāhrādiḥ kitavo yathā"
  - id: '8.20.5'
    kind: verse
    lines:
      - "नाहं बिभेमि निरयान्नाधन्यादसुखार्णवात्"
      - "न स्थानच्यवनान्मृत्योर्यथा विप्रप्रलम्भनात्"
    iast: "nāhaṃ bibhemi nirayān nādhanyādasukhārṇavāt | na sthānacyavanān mṛtyoryathā viprapralambhanāt"
  - id: '8.20.21'
    kind: verse
    lines:
      - "तद्वामनं रूपमवर्धताद्भुतं हरेरनन्तस्य गुणत्रयात्मकम्"
      - "भूः खं दिशो द्यौर्विवराः पयोधयस्तिर्यङ्नृदेवा ऋषयो यदासत"
    iast: "tadvāmanaṃ rūpamavardhatādbhutaṃ hareranantasya guṇatrayātmakam | bhūḥ khaṃ diśo dyaurvivarāḥ payodhayas tiryaṅnṛdevā ṛṣayo yadāsata"
  - id: '8.20.22'
    kind: verse
    lines:
      - "काये बलिस्तस्य महाविभूतेः सहर्त्विगाचार्यसदस्य एतत्"
      - "ददर्श विश्वं त्रिगुणं गुणात्मके भूतेन्द्रियार्थाशयजीवयुक्तम्"
    iast: "kāye balistasya mahāvibhūteḥ sahartvigācāryasadasya etat | dadarśa viśvaṃ triguṇaṃ guṇātmake bhūtendriyārthāśayajīvayuktam"
  - id: '8.20.33'
    kind: verse
    lines:
      - "मधुव्रतस्रग्वनमालयावृतो रराज राजन्भगवानुरुक्रमः"
      - "क्षितिं पदैकेन बलेर्विचक्रमे नभः शरीरेण दिशश्च बाहुभिः"
    iast: "madhuvratasragvanamālayāvṛto rarāja rājan bhagavān urukramaḥ | kṣitiṃ padaikena balervicakrame nabhaḥ śarīreṇa diśaśca bāhubhiḥ"
  - id: '8.20.34'
    kind: verse
    lines:
      - "पदं द्वितीयं क्रमतस्त्रिविष्टपं न वै तृतीयाय तदीयमण्वपि"
      - "उरुक्रमस्याङ्घ्रिरुपर्युपर्यथो महर्जनाभ्यां तपसः परं गतः"
    iast: "padaṃ dvitīyaṃ kramatastriviṣṭapaṃ na vai tṛtīyāya tadīyamaṇvapi | urukramasyāṅghrirupary upary atho maharjanābhyāṃ tapasaḥ paraṃ gataḥ"
  - id: '8.21.29'
    kind: verse
    lines:
      - "पदानि त्रीणि दत्तानि भूमेर्मह्यं त्वयासुर"
      - "द्वाभ्यां क्रान्ता मही सर्वा तृतीयमुपकल्पय"
    iast: "padāni trīṇi dattāni bhūmermahyaṃ tvayāsura | dvābhyāṃ krāntā mahī sarvā tṛtīyamupakalpaya"
  - id: '8.21.34'
    kind: verse
    lines:
      - "विप्रलब्धो ददामीति त्वयाहं चाढ्यमानिना"
      - "तद्व्यलीकफलं भुङ्क्ष्व निरयं कतिचित्समाः"
    iast: "vipralabdho dadāmīti tvayāhaṃ cāḍhyamāninā | tadvyalīkaphalaṃ bhuṅkṣva nirayaṃ katicit samāḥ"
  - id: '8.22.2'
    kind: verse
    lines:
      - "यद्युत्तमश्लोक भवान्ममेरितं वचो व्यलीकं सुरवर्य मन्यते"
      - "करोम्यृतं तन्न भवेत्प्रलम्भनं पदं तृतीयं कुरु शीर्ष्णि मे निजम्"
    iast: "yady uttamaśloka bhavān mameritaṃ vaco vyalīkaṃ suravarya manyate | karomy ṛtaṃ tan na bhavet pralambhanaṃ padaṃ tṛtīyaṃ kuru śīrṣṇi me nijam"
  - id: '8.22.3'
    kind: verse
    lines:
      - "बिभेमि नाहं निरयात्पदच्युतो न पाशबन्धाद्व्यसनाद्दुरत्ययात्"
      - "नैवार्थकृच्छ्राद्भवतो विनिग्रहादसाधुवादाद्भृशमुद्विजे यथा"
    iast: "bibhemi nāhaṃ nirayāt padacyuto na pāśabandhādvyasanādduratyayāt | naivārthakṛcchrādbhavato vinigrahād asādhuvādādbhṛśamudvije yathā"
  - id: '8.22.6'
    kind: verse
    lines:
      - "यस्मिन्वैरानुबन्धेन व्यूढेन विबुधेतराः"
      - "बहवो लेभिरे सिद्धिं यामु हैकान्तयोगिनः"
    iast: "yasmin vairānubandhena vyūḍhena vibudhetarāḥ | bahavo lebhire siddhiṃ yāmu haikāntayoginaḥ"
  - id: '8.22.14'
    kind: verse
    lines:
      - "तस्मै बलिर्वारुणपाशयन्त्रितः समर्हणं नोपजहार पूर्ववत्"
      - "ननाम मूर्ध्नाश्रुविलोललोचनः सव्रीडनीचीनमुखो बभूव ह"
    iast: "tasmai balirvāruṇapāśayantritaḥ samarhaṇaṃ nopajahāra pūrvavat | nanāma mūrdhnāśruvilolalocanaḥ savrīḍanīcīnamukho babhūva ha"
  - id: '8.22.16'
    kind: verse
    lines:
      - "त्वयैव दत्तं पदमैन्द्रमूर्जितं हृतं तदेवाद्य तथैव शोभनम्"
      - "मन्ये महानस्य कृतो ह्यनुग्रहो विभ्रंशितो यच्छ्रिय आत्ममोहनात्"
    iast: "tvayaiva dattaṃ padamaindramūrjitaṃ hṛtaṃ tadevādya tathaiva śobhanam | manye mahān asya kṛto hy anugraho vibhraṃśito yac chriya ātmamohanāt"
  - id: '8.22.24'
    kind: verse
    lines:
      - "ब्रह्मन्यमनुगृह्णामि तद्विशो विधुनोम्यहम्"
      - "यन्मदः पुरुषः स्तब्धो लोकं मां चावमन्यते"
    iast: "brahman yamanugṛhṇāmi tadviśo vidhunomy aham | yanmadaḥ puruṣaḥ stabdho lokaṃ māṃ cāvamanyate"
  - id: '8.22.28'
    kind: verse
    lines:
      - "एष दानवदैत्यानामग्रनीः कीर्तिवर्धनः"
      - "अजैषीदजयां मायां सीदन्नपि न मुह्यति"
    iast: "eṣa dānavadaityānāmagranīḥ kīrtivardhanaḥ | ajaiṣīdajayāṃ māyāṃ sīdannapi na muhyati"
  - id: '8.22.31'
    kind: verse
    lines:
      - "एष मे प्रापितः स्थानं दुष्प्रापममरैरपि"
      - "सावर्णेरन्तरस्यायं भवितेन्द्रो मदाश्रयः"
    iast: "eṣa me prāpitaḥ sthānaṃ duṣprāpamamarairapi | sāvarṇerantarasyāyaṃ bhavitendro madāśrayaḥ"
  - id: '8.22.33'
    kind: verse
    lines:
      - "इन्द्रसेन महाराज याहि भो भद्रमस्तु ते"
      - "सुतलं स्वर्गिभिः प्रार्थ्यं ज्ञातिभिः परिवारितः"
    iast: "indrasena mahārāja yāhi bho bhadramastu te | sutalaṃ svargibhiḥ prārthyaṃ jñātibhiḥ parivāritaḥ"
  - id: '8.22.35'
    kind: verse
    lines:
      - "रक्षिष्ये सर्वतोऽहं त्वां सानुगं सपरिच्छदम्"
      - "सदा सन्निहितं वीर तत्र मां द्रक्ष्यते भवान्"
    iast: "rakṣiṣye sarvato 'haṃ tvāṃ sānugaṃ saparicchadam | sadā sannihitaṃ vīra tatra māṃ drakṣyate bhavān"
  - id: '8.23.9'
    kind: verse
    lines:
      - "वत्स प्रह्राद भद्रं ते प्रयाहि सुतलालयम्"
      - "मोदमानः स्वपौत्रेण ज्ञातीनां सुखमावह"
    iast: "vatsa prahrāda bhadraṃ te prayāhi sutalālayam | modamānaḥ svapautreṇa jñātīnāṃ sukhamāvaha"
  - id: '8.23.10'
    kind: verse
    lines:
      - "नित्यं द्रष्टासि मां तत्र गदापाणिमवस्थितम्"
      - "मद्दर्शनमहाह्लाद ध्वस्तकर्मनिबन्धनः"
    iast: "nityaṃ draṣṭāsi māṃ tatra gadāpāṇimavasthitam | maddarśanamahāhlāda dhvastakarmanibandhanaḥ"
  - id: '8.23.12'
    kind: verse
    lines:
      - "परिक्रम्यादिपुरुषं सर्वासुरचमूपतिः"
      - "प्रणतस्तदनुज्ञातः प्रविवेश महाबिलम्"
    iast: "parikramyādipuruṣaṃ sarvāsuracamūpatiḥ | praṇatastadanujñātaḥ praviveśa mahābilam"
  - id: '8.23.19'
    kind: verse
    lines:
      - "एवं बलेर्महीं राजन्भिक्षित्वा वामनो हरिः"
      - "ददौ भ्रात्रे महेन्द्राय त्रिदिवं यत्परैर्हृतम्"
    iast: "evaṃ balermahīṃ rājan bhikṣitvā vāmano hariḥ | dadau bhrātre mahendrāya tridivaṃ yat parairhṛtam"
  - id: '8.24.5'
    kind: verse
    lines:
      - "गोविप्रसुरसाधूनां छन्दसामपि चेश्वरः"
      - "रक्षामिच्छंस्तनूर्धत्ते धर्मस्यार्थस्य चैव हि"
    iast: "goviprasurasādhūnāṃ chandasāmapi ceśvaraḥ | rakṣāmicchaṃstanūrdhatte dharmasyārthasya caiva hi"
  - id: '8.24.7'
    kind: verse
    lines:
      - "आसीदतीतकल्पान्ते ब्राह्मो नैमित्तिको लयः"
      - "समुद्रोपप्लुतास्तत्र लोका भूरादयो नृप"
    iast: "āsīdatītakalpānte brāhmo naimittiko layaḥ | samudropaplutāstatra lokā bhūrādayo nṛpa"
  - id: '8.24.8'
    kind: verse
    lines:
      - "कालेनागतनिद्रस्य धातुः शिशयिषोर्बली"
      - "मुखतो निःसृतान्वेदान्हयग्रीवोऽन्तिकेऽहरत्"
    iast: "kālenāgatanidrasya dhātuḥ śiśayiṣorbalī | mukhato niḥsṛtān vedān hayagrīvo 'ntike 'harat"
  - id: '8.24.9'
    kind: verse
    lines:
      - "ज्ञात्वा तद्दानवेन्द्रस्य हयग्रीवस्य चेष्टितम्"
      - "दधार शफरीरूपं भगवान्हरिरीश्वरः"
    iast: "jñātvā taddānavendrasya hayagrīvasya ceṣṭitam | dadhāra śapharīrūpaṃ bhagavān harirīśvaraḥ"
  - id: '8.24.10'
    kind: verse
    lines:
      - "तत्र राजृषिः कश्चिन्नाम्ना सत्यव्रतो महान्"
      - "नारायणपरोऽतपत्तपः स सलिलाशनः"
    iast: "tatra rājaṛṣiḥ kaścin nāmnā satyavrato mahān | nārāyaṇaparo 'tapat tapaḥ sa salilāśanaḥ"
  - id: '8.24.12'
    kind: verse
    lines:
      - "एकदा कृतमालायां कुर्वतो जलतर्पणम्"
      - "तस्याञ्जल्युदके काचिच्छफर्येकाभ्यपद्यत"
    iast: "ekadā kṛtamālāyāṃ kurvato jalatarpaṇam | tasyāñjalyudake kācic chaphary ekābhyapadyata"
  - id: '8.24.16'
    kind: verse
    lines:
      - "तस्या दीनतरं वाक्यमाश्रुत्य स महीपतिः"
      - "कलशाप्सु निधायैनां दयालुर्निन्य आश्रमम्"
    iast: "tasyā dīnataraṃ vākyamāśrutya sa mahīpatiḥ | kalaśāpsu nidhāyaināṃ dayālurninya āśramam"
  - id: '8.24.17'
    kind: verse
    lines:
      - "सा तु तत्रैकरात्रेण वर्धमाना कमण्डलौ"
      - "अलब्ध्वात्मावकाशं वा इदमाह महीपतिम्"
    iast: "sā tu tatraikarātreṇa vardhamānā kamaṇḍalau | alabdhvātmāvakāśaṃ vā idamāha mahīpatim"
  - id: '8.24.19'
    kind: verse
    lines:
      - "स एनां तत आदाय न्यधादौदञ्चनोदके"
      - "तत्र क्षिप्ता मुहूर्तेन हस्तत्रयमवर्धत"
    iast: "sa enāṃ tata ādāya nyadhādaudañcanodake | tatra kṣiptā muhūrtena hastatrayamavardhata"
  - id: '8.24.21'
    kind: verse
    lines:
      - "तत आदाय सा राज्ञा क्षिप्ता राजन्सरोवरे"
      - "तदावृत्यात्मना सोऽयं महामीनोऽन्ववर्धत"
    iast: "tata ādāya sā rājñā kṣiptā rājan sarovare | tadāvṛtyātmanā so 'yaṃ mahāmīno 'nvavardhata"
  - id: '8.24.23'
    kind: verse
    lines:
      - "इत्युक्तः सोऽनयन्मत्स्यं तत्र तत्राविदासिनि"
      - "जलाशयेऽसम्मितं तं समुद्रे प्राक्षिपज्झषम्"
    iast: "ity uktaḥ so 'nayan matsyaṃ tatra tatrāvidāsini | jalāśaye 'sammitaṃ taṃ samudre prākṣipaj jhaṣam"
  - id: '8.24.32'
    kind: verse
    lines:
      - "सप्तमे ह्यद्यतनादूर्ध्वमहन्येतदरिन्दम"
      - "निमङ्क्ष्यत्यप्ययाम्भोधौ त्रैलोक्यं भूर्भुवादिकम्"
    iast: "saptame hy adyatanādūrdhvamahany etadarindama | nimaṅkṣyaty apyayāmbhodhau trailokyaṃ bhūrbhuvādikam"
  - id: '8.24.33'
    kind: verse
    lines:
      - "त्रिलोक्यां लीयमानायां संवर्ताम्भसि वै तदा"
      - "उपस्थास्यति नौः काचिद्विशाला त्वां मयेरिता"
    iast: "trilokyāṃ līyamānāyāṃ saṃvartāmbhasi vai tadā | upasthāsyati nauḥ kācidviśālā tvāṃ mayeritā"
  - id: '8.24.34'
    kind: verse
    lines:
      - "त्वं तावदोषधीः सर्वा बीजान्युच्चावचानि च"
      - "सप्तर्षिभिः परिवृतः सर्वसत्त्वोपबृंहितः"
    iast: "tvaṃ tāvadoṣadhīḥ sarvā bījāny uccāvacāni ca | saptarṣibhiḥ parivṛtaḥ sarvasattvopabṛṃhitaḥ"
  - id: '8.24.36'
    kind: verse
    lines:
      - "दोधूयमानां तां नावं समीरेण बलीयसा"
      - "उपस्थितस्य मे शृङ्गे निबध्नीहि महाहिना"
    iast: "dodhūyamānāṃ tāṃ nāvaṃ samīreṇa balīyasā | upasthitasya me śṛṅge nibadhnīhi mahāhinā"
  - id: '8.24.37'
    kind: verse
    lines:
      - "अहं त्वामृषिभिः सार्धं सहनावमुदन्वति"
      - "विकर्षन्विचरिष्यामि यावद्ब्राह्मी निशा प्रभो"
    iast: "ahaṃ tvāmṛṣibhiḥ sārdhaṃ sahanāvamudanvati | vikarṣan vicariṣyāmi yāvadbrāhmī niśā prabho"
  - id: '8.24.38'
    kind: verse
    lines:
      - "मदीयं महिमानं च परं ब्रह्मेति शब्दितम्"
      - "वेत्स्यस्यनुगृहीतं मे सम्प्रश्नैर्विवृतं हृदि"
    iast: "madīyaṃ mahimānaṃ ca paraṃ brahmeti śabditam | vetsyasy anugṛhītaṃ me sampraśnairvivṛtaṃ hṛdi"
  - id: '8.24.39'
    kind: verse
    lines:
      - "इत्थमादिश्य राजानं हरिरन्तरधीयत"
      - "सोऽन्ववैक्षत तं कालं यं हृषीकेश आदिशत्"
    iast: "itthamādiśya rājānaṃ harirantaradhīyata | so 'nvavaikṣata taṃ kālaṃ yaṃ hṛṣīkeśa ādiśat"
  - id: '8.24.40'
    kind: verse
    lines:
      - "आस्तीर्य दर्भान्प्राक्कूलान्राजर्षिः प्रागुदङ्मुखः"
      - "निषसाद हरेः पादौ चिन्तयन्मत्स्यरूपिणः"
    iast: "āstīrya darbhān prākkūlān rājarṣiḥ prāgudaṅmukhaḥ | niṣasāda hareḥ pādau cintayan matsyarūpiṇaḥ"
  - id: '8.24.41'
    kind: verse
    lines:
      - "ततः समुद्र उद्वेलः सर्वतः प्लावयन्महीम्"
      - "वर्धमानो महामेघैर्वर्षद्भिः समदृश्यत"
    iast: "tataḥ samudra udvelaḥ sarvataḥ plāvayan mahīm | vardhamāno mahāmeghairvarṣadbhiḥ samadṛśyata"
  - id: '8.24.42'
    kind: verse
    lines:
      - "ध्यायन्भगवदादेशं ददृशे नावमागताम्"
      - "तामारुरोह विप्रेन्द्रैरादायौषधिवीरुधः"
    iast: "dhyāyan bhagavadādeśaṃ dadṛśe nāvamāgatām | tāmāruroha viprendrairādāyauṣadhivīrudhaḥ"
  - id: '8.24.44'
    kind: verse
    lines:
      - "सोऽनुध्यातस्ततो राज्ञा प्रादुरासीन्महार्णवे"
      - "एकशृङ्गधरो मत्स्यो हैमो नियुतयोजनः"
    iast: "so 'nudhyātastato rājñā prādurāsīn mahārṇave | ekaśṛṅgadharo matsyo haimo niyutayojanaḥ"
  - id: '8.24.55'
    kind: verse
    lines:
      - "पुराणसंहितां दिव्यां साङ्ख्ययोगक्रियावतीम्"
      - "सत्यव्रतस्य राजर्षेरात्मगुह्यमशेषतः"
    iast: "purāṇasaṃhitāṃ divyāṃ sāṅkhyayogakriyāvatīm | satyavratasya rājarṣerātmaguhyamaśeṣataḥ"
  - id: '8.24.57'
    kind: verse
    lines:
      - "अतीतप्रलयापाय उत्थिताय स वेधसे"
      - "हत्वासुरं हयग्रीवं वेदान्प्रत्याहरद्धरिः"
    iast: "atītapralayāpāya utthitāya sa vedhase | hatvāsuraṃ hayagrīvaṃ vedān pratyāharaddhariḥ"
  - id: '8.24.58'
    kind: verse
    lines:
      - "स तु सत्यव्रतो राजा ज्ञानविज्ञानसंयुतः"
      - "विष्णोः प्रसादात्कल्पेऽस्मिन्नासीद्वैवस्वतो मनुः"
    iast: "sa tu satyavrato rājā jñānavijñānasaṃyutaḥ | viṣṇoḥ prasādāt kalpe 'sminnāsīdvaivasvato manuḥ"
  - id: '9.10.2'
    kind: verse
    lines:
      - "तस्यापि भगवानेष साक्षाद्ब्रह्ममयो हरिः"
      - "अंशांशेन चतुर्धागात्पुत्रत्वं प्रार्थितः सुरैः"
      - "रामलक्ष्मणभरत शत्रुघ्ना इति संज्ञया"
    iast: "tasyāpi bhagavān eṣa sākṣādbrahmamayo hariḥ | aṃśāṃśena caturdhāgāt putratvaṃ prārthitaḥ suraiḥ | rāmalakṣmaṇabharata śatrughnā iti saṃjñayā"
  - id: '9.10.3'
    kind: verse
    lines:
      - "तस्यानुचरितं राजन्नृषिभिस्तत्त्वदर्शिभिः"
      - "श्रुतं हि वर्णितं भूरि त्वया सीतापतेर्मुहुः"
    iast: "tasyānucaritaṃ rājannṛṣibhistattvadarśibhiḥ | śrutaṃ hi varṇitaṃ bhūri tvayā sītāpatermuhuḥ"
  - id: '9.10.4'
    kind: verse
    lines:
      - "गुर्वर्थे त्यक्तराज्यो व्यचरदनुवनं पद्मपद्भ्यां प्रियायाः पाणिस्पर्शाक्षमाभ्यां मृजितपथरुजो यो हरीन्द्रानुजाभ्यामम्प्;"
      - "वैरूप्याच्छूर्पणख्याः प्रियविरहरुषारोपितभ्रूविजृम्भ त्रस्ताब्धिर्बद्धसेतुः खलदवदहनः कोसलेन्द्रोऽवतान्नः"
    iast: "gurvarthe tyaktarājyo vyacaradanuvanaṃ padmapadbhyāṃ priyāyāḥ pāṇisparśākṣamābhyāṃ mṛjitapatharujo yo harīndrānujābhyām amp; | vairūpyāc chūrpaṇakhyāḥ priyaviraharuṣāropitabhrūvijṛmbha trastābdhirbaddhasetuḥ khaladavadahanaḥ kosalendro 'vatān naḥ"
  - id: '9.10.8'
    kind: verse
    lines:
      - "यः सत्यपाशपरिवीतपितुर्निदेशं स्त्रैणस्य चापि शिरसा जगृहे सभार्यः"
      - "राज्यं श्रियं प्रणयिनः सुहृदो निवासं त्यक्त्वा ययौ वनमसूनिव मुक्तसङ्गः"
    iast: "yaḥ satyapāśaparivītapiturnideśaṃ straiṇasya cāpi śirasā jagṛhe sabhāryaḥ | rājyaṃ śriyaṃ praṇayinaḥ suhṛdo nivāsaṃ tyaktvā yayau vanamasūn iva muktasaṅgaḥ"
  - id: '9.10.11'
    kind: verse
    lines:
      - "रक्षोऽधमेन वृकवद्विपिनेऽसमक्षं वैदेहराजदुहितर्यपयापितायाम्"
      - "भ्रात्रा वने कृपणवत्प्रियया वियुक्तः स्त्रीसङ्गिनां गतिमिति प्रथयंश्चचार"
    iast: "rakṣo 'dhamena vṛkavadvipine 'samakṣaṃ vaideharājaduhitaryapayāpitāyām | bhrātrā vane kṛpaṇavat priyayā viyuktaḥ strīsaṅgināṃ gatimiti prathayaṃścacāra"
  - id: '9.10.52'
    kind: verse
    lines:
      - "त्रेतायां वर्तमानायां कालः कृतसमोऽभवत्"
      - "रामे राजनि धर्मज्ञे सर्वभूतसुखावहे"
    iast: "tretāyāṃ vartamānāyāṃ kālaḥ kṛtasamo 'bhavat | rāme rājani dharmajñe sarvabhūtasukhāvahe"
  - id: '9.10.54'
    kind: verse
    lines:
      - "नाधिव्याधिजराग्लानि दुःखशोकभयक्लमाः"
      - "मृत्युश्चानिच्छतां नासीद्रामे राजन्यधोक्षजे"
    iast: "nādhivyādhijarāglāni duḥkhaśokabhayaklamāḥ | mṛtyuścānicchatāṃ nāsīdrāme rājanyadhokṣaje"
  - id: '9.10.55'
    kind: verse
    lines:
      - "एकपत्नीव्रतधरो राजर्षिचरितः शुचिः"
      - "स्वधर्मं गृहमेधीयं शिक्षयन्स्वयमाचरत्"
    iast: "ekapatnīvratadharo rājarṣicaritaḥ śuciḥ | svadharmaṃ gṛhamedhīyaṃ śikṣayan svayamācarat"
  - id: '9.11.19'
    kind: verse
    lines:
      - "स्मरतां हृदि विन्यस्य विद्धं दण्डककण्टकैः"
      - "स्वपादपल्लवं राम आत्मज्योतिरगात्ततः"
    iast: "smaratāṃ hṛdi vinyasya viddhaṃ daṇḍakakaṇṭakaiḥ | svapādapallavaṃ rāma ātmajyotiragāt tataḥ"
  - id: '9.10.20'
    kind: verse
    lines:
      - "नेदं यशो रघुपतेः सुरयाच्ञयात्त लीलातनोरधिकसाम्यविमुक्तधाम्नः अम्प्;"
      - "रक्षोवधो जलधिबन्धनमस्त्रपूगैः किं तस्य शत्रुहनने कपयः सहायाः"
    iast: "nedaṃ yaśo raghupateḥ surayācñayātta līlātanoradhikasāmyavimuktadhāmnaḥ amp; | rakṣovadho jaladhibandhanamastrapūgaiḥ kiṃ tasya śatruhanane kapayaḥ sahāyāḥ"
  - id: '9.11.23'
    kind: verse
    lines:
      - "पुरुषो रामचरितं श्रवणैरुपधारयन्"
      - "आनृशंस्यपरो राजन्कर्मबन्धैर्विमुच्यते"
    iast: "puruṣo rāmacaritaṃ śravaṇairupadhārayan | ānṛśaṃsyaparo rājan karmabandhairvimucyate"
  - id: '9.15.12'
    kind: verse
    lines:
      - "सा चाभूत्सुमहत्पुण्या कौशिकी लोकपावनी"
      - "रेणोः सुतां रेणुकां वै जमदग्निरुवाह याम्"
    iast: "sā cābhūt sumahatpuṇyā kauśikī lokapāvanī | reṇoḥ sutāṃ reṇukāṃ vai jamadagniruvāha yām"
  - id: '9.15.14'
    kind: verse
    lines:
      - "यमाहुर्वासुदेवांशं हैहयानां कुलान्तकम्"
      - "त्रिःसप्तकृत्वो य इमां चक्रे निःक्षत्रियां महीम्"
    iast: "yamāhurvāsudevāṃśaṃ haihayānāṃ kulāntakam | triḥsaptakṛtvo ya imāṃ cakre niḥkṣatriyāṃ mahīm"
  - id: '9.15.18'
    kind: verse
    lines:
      - "बाहून्दशशतं लेभे दुर्धर्षत्वमरातिषु"
      - "अव्याहतेन्द्रियौजः श्री तेजोवीर्ययशोबलम्"
    iast: "bāhūn daśaśataṃ lebhe durdharṣatvamarātiṣu | avyāhatendriyaujaḥ śrī tejovīryayaśobalam"
  - id: '9.15.20'
    kind: verse
    lines:
      - "स्त्रीरत्नैरावृतः क्रीडन्रेवाम्भसि मदोत्कटः"
      - "वैजयन्तीं स्रजं बिभ्रद्रुरोध सरितं भुजैः"
    iast: "strīratnairāvṛtaḥ krīḍan revāmbhasi madotkaṭaḥ | vaijayantīṃ srajaṃ bibhradrurodha saritaṃ bhujaiḥ"
  - id: '9.15.22'
    kind: verse
    lines:
      - "गृहीतो लीलया स्त्रीणां समक्षं कृतकिल्बिषः"
      - "माहिष्मत्यां सन्निरुद्धो मुक्तो येन कपिर्यथा"
    iast: "gṛhīto līlayā strīṇāṃ samakṣaṃ kṛtakilbiṣaḥ | māhiṣmatyāṃ sanniruddho mukto yena kapiryathā"
  - id: '9.15.23'
    kind: verse
    lines:
      - "स एकदा तु मृगयां विचरन्विजने वने"
      - "यदृच्छयाश्रमपदं जमदग्नेरुपाविशत्"
    iast: "sa ekadā tu mṛgayāṃ vicaran vijane vane | yadṛcchayāśramapadaṃ jamadagnerupāviśat"
  - id: '9.15.24'
    kind: verse
    lines:
      - "तस्मै स नरदेवाय मुनिरर्हणमाहरत्"
      - "ससैन्यामात्यवाहाय हविष्मत्या तपोधनः"
    iast: "tasmai sa naradevāya munirarhaṇamāharat | sasainyāmātyavāhāya haviṣmatyā tapodhanaḥ"
  - id: '9.15.25'
    kind: verse
    lines:
      - "स वै रत्नं तु तद्दृष्ट्वा आत्मैश्वर्यातिशायनम्"
      - "तन्नाद्रियताग्निहोत्र्यां साभिलाषः सहैहयः"
    iast: "sa vai ratnaṃ tu taddṛṣṭvā ātmaiśvaryātiśāyanam | tan nādriyatāgnihotryāṃ sābhilāṣaḥ sahaihayaḥ"
  - id: '9.15.26'
    kind: verse
    lines:
      - "हविर्धानीमृषेर्दर्पान्नरान्हर्तुमचोदयत्"
      - "ते च माहिष्मतीं निन्युः सवत्सां क्रन्दतीं बलात्"
    iast: "havirdhānīmṛṣerdarpān narān hartumacodayat | te ca māhiṣmatīṃ ninyuḥ savatsāṃ krandatīṃ balāt"
  - id: '9.15.27'
    kind: verse
    lines:
      - "अथ राजनि निर्याते राम आश्रम आगतः"
      - "श्रुत्वा तत्तस्य दौरात्म्यं चुक्रोधाहिरिवाहतः"
    iast: "atha rājani niryāte rāma āśrama āgataḥ | śrutvā tat tasya daurātmyaṃ cukrodhāhirivāhataḥ"
  - id: '9.15.28'
    kind: verse
    lines:
      - "घोरमादाय परशुं सतूणं वर्म कार्मुकम्"
      - "अन्वधावत दुर्मर्षो मृगेन्द्र इव यूथपम्"
    iast: "ghoramādāya paraśuṃ satūṇaṃ varma kārmukam | anvadhāvata durmarṣo mṛgendra iva yūthapam"
  - id: '9.15.30'
    kind: verse
    lines:
      - "अचोदयद्धस्तिरथाश्वपत्तिभिर्गदासिबाणर्ष्टिशतघ्निशक्तिभिः"
      - "अक्षौहिणीः सप्तदशातिभीषणास्ता राम एको भगवानसूदयत्"
    iast: "acodayaddhastirathāśvapattibhir gadāsibāṇarṣṭiśataghniśaktibhiḥ | akṣauhiṇīḥ saptadaśātibhīṣaṇās tā rāma eko bhagavān asūdayat"
  - id: '9.15.33'
    kind: verse
    lines:
      - "अथार्जुनः पञ्चशतेषु बाहुभिर्धनुःषु बाणान्युगपत्स सन्दधे"
      - "रामाय रामोऽस्त्रभृतां समग्रणीस्तान्येकधन्वेषुभिराच्छिनत्समम्"
    iast: "athārjunaḥ pañcaśateṣu bāhubhir dhanuḥṣu bāṇān yugapat sa sandadhe | rāmāya rāmo 'strabhṛtāṃ samagraṇīs tānyekadhanveṣubhirācchinat samam"
  - id: '9.15.34'
    kind: verse
    lines:
      - "पुनः स्वहस्तैरचलान्मृधेऽङ्घ्रिपानुत्क्षिप्य वेगादभिधावतो युधि"
      - "भुजान्कुठारेण कठोरनेमिना चिच्छेद रामः प्रसभं त्वहेरिव"
    iast: "punaḥ svahastairacalān mṛdhe 'ṅghripān utkṣipya vegādabhidhāvato yudhi | bhujān kuṭhāreṇa kaṭhoraneminā ciccheda rāmaḥ prasabhaṃ tv aheriva"
  - id: '9.15.36'
    kind: verse
    lines:
      - "अग्निहोत्रीमुपावर्त्य सवत्सां परवीरहा"
      - "समुपेत्याश्रमं पित्रे परिक्लिष्टां समर्पयत्"
    iast: "agnihotrīmupāvartya savatsāṃ paravīrahā | samupetyāśramaṃ pitre parikliṣṭāṃ samarpayat"
  - id: '9.15.37'
    kind: verse
    lines:
      - "स्वकर्म तत्कृतं रामः पित्रे भ्रातृभ्य एव च"
      - "वर्णयामास तच्छ्रुत्वाजमदग्निरभाषत"
    iast: "svakarma tat kṛtaṃ rāmaḥ pitre bhrātṛbhya eva ca | varṇayāmāsa tac chrutvājamadagnirabhāṣata"
  - id: '9.15.38'
    kind: verse
    lines:
      - "राम राम महाबाहो भवान्पापमकारषीत्"
      - "अवधीन्नरदेवं यत्सर्वदेवमयं वृथा"
    iast: "rāma rāma mahābāho bhavān pāpamakāraṣīt | avadhīn naradevaṃ yat sarvadevamayaṃ vṛthā"
  - id: '9.15.39'
    kind: verse
    lines:
      - "वयं हि ब्राह्मणास्तात क्षमयार्हणतां गताः"
      - "यया लोकगुरुर्देवः पारमेष्ठ्यमगात्पदम्"
    iast: "vayaṃ hi brāhmaṇāstāta kṣamayārhaṇatāṃ gatāḥ | yayā lokagururdevaḥ pārameṣṭhyamagāt padam"
  - id: '9.15.40'
    kind: verse
    lines:
      - "क्षमया रोचते लक्ष्मीर्ब्राह्मी सौरी यथा प्रभा"
      - "क्षमिणामाशु भगवांस्तुष्यते हरिरीश्वरः"
    iast: "kṣamayā rocate lakṣmīrbrāhmī saurī yathā prabhā | kṣamiṇāmāśu bhagavāṃstuṣyate harirīśvaraḥ"
  - id: '9.15.41'
    kind: verse
    lines:
      - "राज्ञो मूर्धाभिषिक्तस्य वधो ब्रह्मवधाद्गुरुः"
      - "तीर्थसंसेवया चांहो जह्यङ्गाच्युतचेतनः"
    iast: "rājño mūrdhābhiṣiktasya vadho brahmavadhādguruḥ | tīrthasaṃsevayā cāṃho jahyaṅgācyutacetanaḥ"
  - id: '9.16.1'
    kind: verse
    lines:
      - "पित्रोपशिक्षितो रामस्तथेति कुरुनन्दन"
      - "संवत्सरं तीर्थयात्रां चरित्वाश्रममाव्रजत्"
    iast: "pitropaśikṣito rāmastatheti kurunandana | saṃvatsaraṃ tīrthayātrāṃ caritvāśramamāvrajat"
  - id: '9.16.10'
    kind: verse
    lines:
      - "एकदाश्रमतो रामे सभ्रातरि वनं गते"
      - "वैरं सिषाधयिषवो लब्धच्छिद्रा उपागमन्"
    iast: "ekadāśramato rāme sabhrātari vanaṃ gate | vairaṃ siṣādhayiṣavo labdhacchidrā upāgaman"
  - id: '9.16.11'
    kind: verse
    lines:
      - "दृष्ट्वाग्न्यागार आसीनमावेशितधियं मुनिम्"
      - "भगवत्युत्तमश्लोके जघ्नुस्ते पापनिश्चयाः"
    iast: "dṛṣṭvāgnyāgāra āsīnamāveśitadhiyaṃ munim | bhagavatyuttamaśloke jaghnuste pāpaniścayāḥ"
  - id: '9.16.12'
    kind: verse
    lines:
      - "याच्यमानाः कृपणया राममात्रातिदारुणाः"
      - "प्रसह्य शिर उत्कृत्य निन्युस्ते क्षत्रबन्धवः"
    iast: "yācyamānāḥ kṛpaṇayā rāmamātrātidāruṇāḥ | prasahya śira utkṛtya ninyuste kṣatrabandhavaḥ"
  - id: '9.16.13'
    kind: verse
    lines:
      - "रेणुका दुःखशोकार्ता निघ्नन्त्यात्मानमात्मना"
      - "राम रामेति तातेति विचुक्रोशोच्चकैः सती"
    iast: "reṇukā duḥkhaśokārtā nighnantyātmānamātmanā | rāma rāmeti tāteti vicukrośoccakaiḥ satī"
  - id: '9.16.14'
    kind: verse
    lines:
      - "तदुपश्रुत्य दूरस्था हा रामेत्यार्तवत्स्वनम्"
      - "त्वरयाश्रममासाद्य ददृशुः पितरं हतम्"
    iast: "tadupaśrutya dūrasthā hā rāmetyārtavat svanam | tvarayāśramamāsādya dadṛśuḥ pitaraṃ hatam"
  - id: '9.16.16'
    kind: verse
    lines:
      - "विलप्यैवं पितुर्देहं निधाय भ्रातृषु स्वयम्"
      - "प्रगृह्य परशुं रामः क्षत्रान्ताय मनो दधे"
    iast: "vilapyaivaṃ piturdehaṃ nidhāya bhrātṛṣu svayam | pragṛhya paraśuṃ rāmaḥ kṣatrāntāya mano dadhe"
  - id: '9.16.17'
    kind: verse
    lines:
      - "गत्वा माहिष्मतीं रामो ब्रह्मघ्नविहतश्रियम्"
      - "तेषां स शीर्षभी राजन्मध्ये चक्रे महागिरिम्"
    iast: "gatvā māhiṣmatīṃ rāmo brahmaghnavihataśriyam | teṣāṃ sa śīrṣabhī rājan madhye cakre mahāgirim"
  - id: '9.16.18'
    kind: verse
    lines:
      - "तद्रक्तेन नदीं घोरामब्रह्मण्यभयावहाम्"
      - "हेतुं कृत्वा पितृवधं क्षत्रेऽमङ्गलकारिणि"
    iast: "tadraktena nadīṃ ghorāmabrahmaṇyabhayāvahām | hetuṃ kṛtvā pitṛvadhaṃ kṣatre 'maṅgalakāriṇi"
  - id: '9.16.19'
    kind: verse
    lines:
      - "त्रिःसप्तकृत्वः पृथिवीं कृत्वा निःक्षत्रियां प्रभुः"
      - "समन्तपञ्चके चक्रे शोणितोदान्ह्रदान्नव"
    iast: "triḥsaptakṛtvaḥ pṛthivīṃ kṛtvā niḥkṣatriyāṃ prabhuḥ | samantapañcake cakre śoṇitodān hradān nava"
  - id: '9.16.20'
    kind: verse
    lines:
      - "पितुः कायेन सन्धाय शिर आदाय बर्हिषि"
      - "सर्वदेवमयं देवमात्मानमयजन्मखैः"
    iast: "pituḥ kāyena sandhāya śira ādāya barhiṣi | sarvadevamayaṃ devamātmānamayajan makhaiḥ"
  - id: '9.16.24'
    kind: verse
    lines:
      - "स्वदेहं जमदग्निस्तु लब्ध्वा संज्ञानलक्षणम्"
      - "ऋषीणां मण्डले सोऽभूत्सप्तमो रामपूजितः"
    iast: "svadehaṃ jamadagnistu labdhvā saṃjñānalakṣaṇam | ṛṣīṇāṃ maṇḍale so 'bhūt saptamo rāmapūjitaḥ"
  - id: '9.16.25'
    kind: verse
    lines:
      - "जामदग्न्योऽपि भगवान्रामः कमललोचनः"
      - "आगामिन्यन्तरे राजन्वर्तयिष्यति वै बृहत्"
    iast: "jāmadagnyo 'pi bhagavān rāmaḥ kamalalocanaḥ | āgāminyantare rājan vartayiṣyati vai bṛhat"
  - id: '9.16.26'
    kind: verse
    lines:
      - "आस्तेऽद्यापि महेन्द्राद्रौ न्यस्तदण्डः प्रशान्तधीः"
      - "उपगीयमानचरितः सिद्धगन्धर्वचारणैः"
    iast: "āste 'dyāpi mahendrādrau nyastadaṇḍaḥ praśāntadhīḥ | upagīyamānacaritaḥ siddhagandharvacāraṇaiḥ"
  - id: '10.1.17'
    kind: verse
    lines:
      - "भूमिर्दृप्तनृपव्याज दैत्यानीकशतायुतैः"
      - "आक्रान्ता भूरिभारेण ब्रह्माणं शरणं ययौ"
    iast: "bhūmir dṛpta-nṛpa-vyāja- daityānīka-śatāyutaiḥ | ākrāntā bhūri-bhāreṇa brahmāṇaṃ śaraṇaṃ yayau"
  - id: '10.1.23'
    kind: verse
    lines:
      - "वसुदेवगृहे साक्षाद्भगवान्पुरुषः परः"
      - "जनिष्यते तत्प्रियार्थं सम्भवन्तु सुरस्त्रियः"
    iast: "vasudeva-gṛhe sākṣād bhagavān puruṣaḥ paraḥ | janiṣyate tat-priyārthaṃ sambhavantu sura-striyaḥ"
  - id: '10.1.24'
    kind: verse
    lines:
      - "वासुदेवकलानन्तः सहस्रवदनः स्वराट्"
      - "अग्रतो भविता देवो हरेः प्रियचिकीर्षया"
    iast: "vāsudeva-kalānantaḥ sahasra-vadanaḥ svarāṭ | agrato bhavitā devo hareḥ priya-cikīrṣayā"
  - id: '10.1.25'
    kind: verse
    lines:
      - "विष्णोर्माया भगवती यया सम्मोहितं जगत्"
      - "आदिष्टा प्रभुणांशेन कार्यार्थे सम्भविष्यति"
    iast: "viṣṇor māyā bhagavatī yayā sammohitaṃ jagat | ādiṣṭā prabhuṇāṃśena kāryārthe sambhaviṣyati"
  - id: '10.1.26'
    kind: verse
    lines:
      - "इत्यादिश्यामरगणान्प्रजापतिपतिर्विभुः"
      - "आश्वास्य च महीं गीर्भिः स्वधाम परमं ययौ"
    iast: "ity ādiśyāmara-gaṇān prajāpati-patir vibhuḥ | āśvāsya ca mahīṃ gīrbhiḥ sva-dhāma paramaṃ yayau"
  - id: '10.1.27'
    kind: verse
    lines:
      - "शूरसेनो यदुपतिर्मथुरामावसन्पुरीम्"
      - "माथुराञ्छूरसेनांश्च विषयान्बुभुजे पुरा"
    iast: "śūraseno yadupatir mathurām āvasan purīm | māthurāñ chūrasenāṃś ca viṣayān bubhuje purā"
  - id: '10.1.29'
    kind: verse
    lines:
      - "तस्यां तु कर्हिचिच्छौरिर्वसुदेवः कृतोद्वहः"
      - "देवक्या सूर्यया सार्धं प्रयाणे रथमारुहत्"
    iast: "tasyāṃ tu karhicic chaurir vasudevaḥ kṛtodvahaḥ | devakyā sūryayā sārdhaṃ prayāṇe ratham āruhat"
  - id: '10.1.30'
    kind: verse
    lines:
      - "उग्रसेनसुतः कंसः स्वसुः प्रियचिकीर्षया"
      - "रश्मीन्हयानां जग्राह रौक्मै रथशतैर्वृतः"
    iast: "ugrasena-sutaḥ kaṃsaḥ svasuḥ priya-cikīrṣayā | raśmīn hayānāṃ jagrāha raukmai ratha-śatair vṛtaḥ"
  - id: '10.1.34'
    kind: verse
    lines:
      - "पथि प्रग्रहिणं कंसमाभाष्याहाशरीरवाक्"
      - "अस्यास्त्वामष्टमो गर्भो हन्ता यां वहसेऽबुध"
    iast: "pathi pragrahiṇaṃ kaṃsam ābhāṣyāhāśarīra-vāk | asyās tvām aṣṭamo garbho hantā yāṃ vahase 'budha"
  - id: '10.1.36'
    kind: verse
    lines:
      - "तं जुगुप्सितकर्माणं नृशंसं निरपत्रपम्"
      - "वसुदेवो महाभाग उवाच परिसान्त्वयन्"
    iast: "taṃ jugupsita-karmāṇaṃ nṛśaṃsaṃ nirapatrapam | vasudevo mahā-bhāga uvāca parisāntvayan"
  - id: '10.1.37'
    kind: verse
    lines:
      - "श्लाघनीयगुणः शूरैर्भवान्भोजयशस्करः"
      - "स कथं भगिनीं हन्यात्स्त्रियमुद्वाहपर्वणि"
    iast: "ślāghanīya-guṇaḥ śūrair bhavān bhoja-yaśaskaraḥ | sa kathaṃ bhaginīṃ hanyāt striyam udvāha-parvaṇi"
  - id: '10.1.46'
    kind: verse
    lines:
      - "एवं स सामभिर्भेदैर्बोध्यमानोऽपि दारुणः"
      - "न न्यवर्तत कौरव्य पुरुषादाननुव्रतः"
    iast: "evaṃ sa sāmabhir bhedair bodhyamāno 'pi dāruṇaḥ | na nyavartata kauravya puruṣādān anuvrataḥ"
  - id: '10.1.47'
    kind: verse
    lines:
      - "निर्बन्धं तस्य तं ज्ञात्वा विचिन्त्यानकदुन्दुभिः"
      - "प्राप्तं कालं प्रतिव्योढुमिदं तत्रान्वपद्यत"
    iast: "nirbandhaṃ tasya taṃ jñātvā vicintyānakadundubhiḥ | prāptaṃ kālaṃ prativyoḍhum idaṃ tatrānvapadyata"
  - id: '10.1.54'
    kind: verse
    lines:
      - "न ह्यस्यास्ते भयं सौम्य यद्वै साहाशरीरवाक्"
      - "पुत्रान्समर्पयिष्येऽस्या यतस्ते भयमुत्थितम्"
    iast: "na hy asyās te bhayaṃ saumya yad vai sāhāśarīra-vāk | putrān samarpayiṣye 'syā yatas te bhayam utthitam"
  - id: '10.1.55'
    kind: verse
    lines:
      - "स्वसुर्वधान्निववृते कंसस्तद्वाक्यसारवित्"
      - "वसुदेवोऽपि तं प्रीतः प्रशस्य प्राविशद्गृहम्"
    iast: "svasur vadhān nivavṛte kaṃsas tad-vākya-sāra-vit | vasudevo 'pi taṃ prītaḥ praśasya prāviśad gṛham"
  - id: '10.1.66'
    kind: verse
    lines:
      - "देवकीं वसुदेवं च निगृह्य निगडैर्गृहे"
      - "जातं जातमहन्पुत्रं तयोरजनशङ्कया"
    iast: "devakīṃ vasudevaṃ ca nigṛhya nigaḍair gṛhe | jātaṃ jātam ahan putraṃ tayor ajana-śaṅkayā"
  - id: '10.1.69'
    kind: verse
    lines:
      - "उग्रसेनं च पितरं यदुभोजान्धकाधिपम्"
      - "स्वयं निगृह्य बुभुजे शूरसेनान्महाबलः"
    iast: "ugrasenaṃ ca pitaraṃ yadu-bhojāndhakādhipam | svayaṃ nigṛhya bubhuje śūrasenān mahā-balaḥ"
  - id: '10.2.1'
    kind: verse
    lines:
      - "प्रलम्बबकचाणूर तृणावर्तमहाशनैः"
      - "मुष्टिकारिष्टद्विविद पूतनाकेशीधेनुकैः"
    iast: "pralamba-baka-cāṇūra- tṛṇāvarta-mahāśanaiḥ | muṣṭikāriṣṭa-dvivida- pūtanā-keśī-dhenukaiḥ"
  - id: '10.2.2'
    kind: verse
    lines:
      - "अन्यैश्चासुरभूपालैर्बाणभौमादिभिर्युतः"
      - "यदूनां कदनं चक्रे बली मागधसंश्रयः"
    iast: "anyaiś cāsura-bhūpālair bāṇa-bhaumādibhir yutaḥ | yadūnāṃ kadanaṃ cakre balī māgadha-saṃśrayaḥ"
  - id: '10.2.5'
    kind: verse
    lines:
      - "सप्तमो वैष्णवं धाम यमनन्तं प्रचक्षते"
      - "गर्भो बभूव देवक्या हर्षशोकविवर्धनः"
    iast: "saptamo vaiṣṇavaṃ dhāma yam anantaṃ pracakṣate | garbho babhūva devakyā harṣa-śoka-vivardhanaḥ"
  - id: '10.2.6'
    kind: verse
    lines:
      - "भगवानपि विश्वात्मा विदित्वा कंसजं भयम्"
      - "यदूनां निजनाथानां योगमायां समादिशत्"
    iast: "bhagavān api viśvātmā viditvā kaṃsajaṃ bhayam | yadūnāṃ nija-nāthānāṃ yogamāyāṃ samādiśat"
  - id: '10.2.7'
    kind: verse
    lines:
      - "गच्छ देवि व्रजं भद्रे गोपगोभिरलङ्कृतम्"
      - "रोहिणी वसुदेवस्य भार्यास्ते नन्दगोकुले"
      - "अन्याश्च कंससंविग्ना विवरेषु वसन्ति हि"
    iast: "gaccha devi vrajaṃ bhadre gopa-gobhir alaṅkṛtam | rohiṇī vasudevasya bhāryāste nanda-gokule | anyāś ca kaṃsa-saṃvignā vivareṣu vasanti hi"
  - id: '10.2.8'
    kind: verse
    lines:
      - "देवक्या जठरे गर्भं शेषाख्यं धाम मामकम्"
      - "तत्सन्निकृष्य रोहिण्या उदरे सन्निवेशय"
    iast: "devakyā jaṭhare garbhaṃ śeṣākhyaṃ dhāma māmakam | tat sannikṛṣya rohiṇyā udare sanniveśaya"
  - id: '10.2.9'
    kind: verse
    lines:
      - "अथाहमंशभागेन देवक्याः पुत्रतां शुभे"
      - "प्राप्स्यामि त्वं यशोदायां नन्दपत्न्यां भविष्यसि"
    iast: "athāham aṃśa-bhāgena devakyāḥ putratāṃ śubhe | prāpsyāmi tvaṃ yaśodāyāṃ nanda-patnyāṃ bhaviṣyasi"
  - id: '10.2.14'
    kind: verse
    lines:
      - "सन्दिष्टैवं भगवता तथेत्योमिति तद्वचः"
      - "प्रतिगृह्य परिक्रम्य गां गता तत्तथाकरोत्"
    iast: "sandiṣṭaivaṃ bhagavatā tathety om iti tad-vacaḥ | pratigṛhya parikramya gāṃ gatā tat tathākarot"
  - id: '10.2.15'
    kind: verse
    lines:
      - "गर्भे प्रणीते देवक्या रोहिणीं योगनिद्रया"
      - "अहो विस्रंसितो गर्भ इति पौरा विचुक्रुशुः"
    iast: "garbhe praṇīte devakyā rohiṇīṃ yoga-nidrayā | aho visraṃsito garbha iti paurā vicukruśuḥ"
  - id: '10.2.18'
    kind: verse
    lines:
      - "ततो जगन्मङ्गलमच्युतांशं समाहितं शूरसुतेन देवी"
      - "दधार सर्वात्मकमात्मभूतं काष्ठा यथानन्दकरं मनस्तः"
    iast: "tato jagan-maṅgalam acyutāṃśaṃ samāhitaṃ śūra-sutena devī | dadhāra sarvātmakam ātma-bhūtaṃ kāṣṭhā yathānanda-karaṃ manastaḥ"
  - id: '10.2.19'
    kind: verse
    lines:
      - "सा देवकी सर्वजगन्निवास निवासभूता नितरां न रेजे"
      - "भोजेन्द्रगेहेऽग्निशिखेव रुद्धा सरस्वती ज्ञानखले यथा सती"
    iast: "sā devakī sarva-jagan-nivāsa- nivāsa-bhūtā nitarāṃ na reje | bhojendra-gehe 'gni-śikheva ruddhā sarasvatī jñāna-khale yathā satī"
  - id: '10.2.20'
    kind: verse
    lines:
      - "तां वीक्ष्य कंसः प्रभयाजितान्तरां विरोचयन्तीं भवनं शुचिस्मितामम्प्;"
      - "आहैष मे प्राणहरो हरिर्गुहां ध्रुवं श्रितो यन्न पुरेयमीदृशी"
    iast: "tāṃ vīkṣya kaṃsaḥ prabhayājitāntarāṃ virocayantīṃ bhavanaṃ śuci-smitām amp; | āhaiṣa me prāṇa-haro harir guhāṃ dhruvaṃ śrito yan na pureyam īdṛśī"
  - id: '10.2.23'
    kind: verse
    lines:
      - "इति घोरतमाद्भावात्सन्निवृत्तः स्वयं प्रभुः"
      - "आस्ते प्रतीक्षंस्तज्जन्म हरेर्वैरानुबन्धकृत्"
    iast: "iti ghoratamād bhāvāt sannivṛttaḥ svayaṃ prabhuḥ | āste pratīkṣaṃs taj-janma harer vairānubandha-kṛt"
  - id: '10.2.24'
    kind: verse
    lines:
      - "आसीनः संविशंस्तिष्ठन्भुञ्जानः पर्यटन्महीम्"
      - "चिन्तयानो हृषीकेशमपश्यत्तन्मयं जगत्"
    iast: "āsīnaḥ saṃviśaṃs tiṣṭhan bhuñjānaḥ paryaṭan mahīm | cintayāno hṛṣīkeśam apaśyat tanmayaṃ jagat"
  - id: '10.3.1'
    kind: verse
    lines:
      - "अथ सर्वगुणोपेतः कालः परमशोभनः"
      - "यर्ह्येवाजनजन्मर्क्षं शान्तर्क्षग्रहतारकम्"
    iast: "atha sarva-guṇopetaḥ kālaḥ parama-śobhanaḥ | yarhy evājana-janmarkṣaṃ śāntarkṣa-graha-tārakam"
  - id: '10.3.2'
    kind: verse
    lines:
      - "दिशः प्रसेदुर्गगनं निर्मलोडुगणोदयम्"
      - "मही मङ्गलभूयिष्ठ पुरग्रामव्रजाकरा"
    iast: "diśaḥ prasedur gaganaṃ nirmaloḍu-gaṇodayam | mahī maṅgala-bhūyiṣṭha- pura-grāma-vrajākarā"
  - id: '10.3.3'
    kind: verse
    lines:
      - "नद्यः प्रसन्नसलिला ह्रदा जलरुहश्रियः"
      - "द्विजालिकुलसन्नाद स्तवका वनराजयः"
    iast: "nadyaḥ prasanna-salilā hradā jalaruha-śriyaḥ | dvijāli-kula-sannāda- stavakā vana-rājayaḥ"
  - id: '10.3.5'
    kind: verse
    lines:
      - "मनांस्यासन्प्रसन्नानि साधूनामसुरद्रुहाम्"
      - "जायमानेऽजने तस्मिन्नेदुर्दुन्दुभयः समम्"
    iast: "manāṃsy āsan prasannāni sādhūnām asura-druhām | jāyamāne 'jane tasmin nedur dundubhayaḥ samam"
  - id: '10.3.8'
    kind: verse
    lines:
      - "निशीथे तमौद्भूते जायमाने जनार्दने"
      - "देवक्यां देवरूपिण्यां विष्णुः सर्वगुहाशयः"
      - "आविरासीद्यथा प्राच्यां दिशीन्दुरिव पुष्कलः"
    iast: "niśīthe tama-udbhūte jāyamāne janārdane | devakyāṃ deva-rūpiṇyāṃ viṣṇuḥ sarva-guhā-śayaḥ | āvirāsīd yathā prācyāṃ diśīndur iva puṣkalaḥ"
  - id: '10.3.9'
    kind: verse
    lines:
      - "तमद्भुतं बालकमम्बुजेक्षणं चतुर्भुजं शङ्खगदाद्युदायुधम्"
      - "श्रीवत्सलक्ष्मं गलशोभिकौस्तुभं पीताम्बरं सान्द्रपयोदसौभगम्"
    iast: "tam adbhutaṃ bālakam ambujekṣaṇaṃ catur-bhujaṃ śaṅkha-gadādy-udāyudham | śrīvatsa-lakṣmaṃ gala-śobhi-kaustubhaṃ pītāmbaraṃ sāndra-payoda-saubhagam"
  - id: '10.3.10'
    kind: verse
    lines:
      - "महार्हवैदूर्यकिरीटकुण्डल त्विषा परिष्वक्तसहस्रकुन्तलम्"
      - "उद्दामकाञ्च्यङ्गदकङ्कणादिभिर्विरोचमानं वसुदेव ऐक्षत"
    iast: "mahārha-vaidūrya-kirīṭa-kuṇḍala- tviṣā pariṣvakta-sahasra-kuntalam | uddāma-kāñcy-aṅgada-kaṅkaṇādibhir virocamānaṃ vasudeva aikṣata"
  - id: '10.3.12'
    kind: verse
    lines:
      - "अथैनमस्तौदवधार्य पूरुषं परं नताङ्गः कृतधीः कृताञ्जलिः"
      - "स्वरोचिषा भारत सूतिकागृहं विरोचयन्तं गतभीः प्रभाववित्"
    iast: "athainam astaud avadhārya pūruṣaṃ paraṃ natāṅgaḥ kṛta-dhīḥ kṛtāñjaliḥ | sva-rociṣā bhārata sūtikā-gṛhaṃ virocayantaṃ gata-bhīḥ prabhāva-vit"
  - id: '10.3.21'
    kind: verse
    lines:
      - "त्वमस्य लोकस्य विभो रिरक्षिषुर्गृहेऽवतीर्णोऽसि ममाखिलेश्वर"
      - "राजन्यसंज्ञासुरकोटियूथपैर्निर्व्यूह्यमाना निहनिष्यसे चमूः"
    iast: "tvam asya lokasya vibho rirakṣiṣur gṛhe 'vatīrṇo 'si mamākhileśvara | rājanya-saṃjñāsura-koṭi-yūthapair nirvyūhyamānā nihaniṣyase camūḥ"
  - id: '10.3.22'
    kind: verse
    lines:
      - "अयं त्वसभ्यस्तव जन्म नौ गृहे श्रुत्वाग्रजांस्ते न्यवधीत्सुरेश्वर अम्प्;"
      - "स तेऽवतारं पुरुषैः समर्पितं श्रुत्वाधुनैवाभिसरत्युदायुधः"
    iast: "ayaṃ tv asabhyas tava janma nau gṛhe śrutvāgrajāṃs te nyavadhīt sureśvara amp; | sa te 'vatāraṃ puruṣaiḥ samarpitaṃ śrutvādhunaivābhisaraty udāyudhaḥ"
  - id: '10.3.23'
    kind: verse
    lines:
      - "अथैनमात्मजं वीक्ष्य महापुरुषलक्षणम्"
      - "देवकी तमुपाधावत्कंसाद्भीता सुविस्मिता"
    iast: "athainam ātmajaṃ vīkṣya mahā-puruṣa-lakṣaṇam | devakī tam upādhāvat kaṃsād bhītā suvismitā"
  - id: '10.3.29'
    kind: verse
    lines:
      - "जन्म ते मय्यसौ पापो मा विद्यान्मधुसूदन"
      - "समुद्विजे भवद्धेतोः कंसादहमधीरधीः"
    iast: "janma te mayy asau pāpo mā vidyān madhusūdana | samudvije bhavad-dhetoḥ kaṃsād aham adhīra-dhīḥ"
  - id: '10.3.30'
    kind: verse
    lines:
      - "उपसंहर विश्वात्मन्नदो रूपमलौकिकम्"
      - "शङ्खचक्रगदापद्म श्रिया जुष्टं चतुर्भुजम्"
    iast: "upasaṃhara viśvātmann ado rūpam alaukikam | śaṅkha-cakra-gadā-padma- śriyā juṣṭaṃ catur-bhujam"
  - id: '10.3.47'
    kind: verse
    lines:
      - "ततश्च शौरिर्भगवत्प्रचोदितः सुतं समादाय स सूतिकागृहातम्प्;"
      - "यदा बहिर्गन्तुमियेष तर्ह्यजा या योगमायाजनि नन्दजायया"
    iast: "tataś ca śaurir bhagavat-pracoditaḥ sutaṃ samādāya sa sūtikā-gṛhāt amp; | yadā bahir gantum iyeṣa tarhy ajā yā yogamāyājani nanda-jāyayā"
  - id: '10.3.48'
    kind: verse
    lines:
      - "तया हृतप्रत्ययसर्ववृत्तिषु द्वाःस्थेषु पौरेष्वपि शायितेष्वथ"
      - "द्वारश्च सर्वाः पिहिता दुरत्यया बृहत्कपाटायसकीलशृङ्खलैः"
    iast: "tayā hṛta-pratyaya-sarva-vṛttiṣu dvāḥ-stheṣu paureṣv api śāyiteṣv atha | dvāraś ca sarvāḥ pihitā duratyayā bṛhat-kapāṭāyasa-kīla-śṛṅkhalaiḥ"
  - id: '10.3.49'
    kind: verse
    lines:
      - "ताः कृष्णवाहे वसुदेव आगते स्वयं व्यवर्यन्त यथा तमो रवेः"
      - "ववर्ष पर्जन्य उपांशुगर्जितः शेषोऽन्वगाद्वारि निवारयन्फणैः"
    iast: "tāḥ kṛṣṇa-vāhe vasudeva āgate svayaṃ vyavaryanta yathā tamo raveḥ | vavarṣa parjanya upāṃśu-garjitaḥ śeṣo 'nvagād vāri nivārayan phaṇaiḥ"
  - id: '10.3.51'
    kind: verse
    lines:
      - "नन्दव्रजं शौरिरुपेत्य तत्र तान्गोपान्प्रसुप्तानुपलभ्य निद्रया अम्प्;"
      - "सुतं यशोदाशयने निधाय तत् सुतामुपादाय पुनर्गृहानगात्"
    iast: "nanda-vrajaṃ śaurir upetya tatra tān gopān prasuptān upalabhya nidrayā amp; | sutaṃ yaśodā-śayane nidhāya tat- sutām upādāya punar gṛhān agāt"
  - id: '10.4.1'
    kind: verse
    lines:
      - "बहिरन्तःपुरद्वारः सर्वाः पूर्ववदावृताः"
      - "ततो बालध्वनिं श्रुत्वा गृहपालाः समुत्थिताः"
    iast: "bahir-antaḥ-pura-dvāraḥ sarvāḥ pūrvavad āvṛtāḥ | tato bāla-dhvaniṃ śrutvā gṛha-pālāḥ samutthitāḥ"
  - id: '10.4.2'
    kind: verse
    lines:
      - "ते तु तूर्णमुपव्रज्य देवक्या गर्भजन्म तत्"
      - "आचख्युर्भोजराजाय यदुद्विग्नः प्रतीक्षते"
    iast: "te tu tūrṇam upavrajya devakyā garbha-janma tat | ācakhyur bhoja-rājāya yad udvignaḥ pratīkṣate"
  - id: '10.4.3'
    kind: verse
    lines:
      - "स तल्पात्तूर्णमुत्थाय कालोऽयमिति विह्वलः"
      - "सूतीगृहमगात्तूर्णं प्रस्खलन्मुक्तमूर्धजः"
    iast: "sa talpāt tūrṇam utthāya kālo 'yam iti vihvalaḥ | sūtī-gṛham agāt tūrṇaṃ praskhalan mukta-mūrdhajaḥ"
  - id: '10.4.4'
    kind: verse
    lines:
      - "तमाह भ्रातरं देवी कृपणा करुणं सती"
      - "स्नुषेयं तव कल्याण स्त्रियं मा हन्तुमर्हसि"
    iast: "tam āha bhrātaraṃ devī kṛpaṇā karuṇaṃ satī | snuṣeyaṃ tava kalyāṇa striyaṃ mā hantum arhasi"
  - id: '10.4.8'
    kind: verse
    lines:
      - "तां गृहीत्वा चरणयोर्जातमात्रां स्वसुः सुताम्"
      - "अपोथयच्छिलापृष्ठे स्वार्थोन्मूलितसौहृदः"
    iast: "tāṃ gṛhītvā caraṇayor jāta-mātrāṃ svasuḥ sutām | apothayac chilā-pṛṣṭhe svārthonmūlita-sauhṛdaḥ"
  - id: '10.4.11'
    kind: verse
    lines:
      - "सिद्धचारणगन्धर्वैरप्सरःकिन्नरोरगैः"
      - "उपाहृतोरुबलिभिः स्तूयमानेदमब्रवीत्"
    iast: "siddha-cāraṇa-gandharvair apsaraḥ-kinnaroragaiḥ | upāhṛtoru-balibhiḥ stūyamānedam abravīt"
  - id: '10.4.12'
    kind: verse
    lines:
      - "किं मया हतया मन्द जातः खलु तवान्तकृत्"
      - "यत्र क्व वा पूर्वशत्रुर्मा हिंसीः कृपणान्वृथा"
    iast: "kiṃ mayā hatayā manda jātaḥ khalu tavānta-kṛt | yatra kva vā pūrva-śatrur mā hiṃsīḥ kṛpaṇān vṛthā"
  - id: '10.4.29'
    kind: verse
    lines:
      - "तस्यां रात्र्यां व्यतीतायां कंस आहूय मन्त्रिणः"
      - "तेभ्य आचष्ट तत्सर्वं यदुक्तं योगनिद्रया"
    iast: "tasyāṃ rātryāṃ vyatītāyāṃ kaṃsa āhūya mantriṇaḥ | tebhya ācaṣṭa tat sarvaṃ yad uktaṃ yoga-nidrayā"
  - id: '10.4.31'
    kind: verse
    lines:
      - "एवं चेत्तर्हि भोजेन्द्र पुरग्रामव्रजादिषु"
      - "अनिर्दशान्निर्दशांश्च हनिष्यामोऽद्य वै शिशून्"
    iast: "evaṃ cet tarhi bhojendra pura-grāma-vrajādiṣu | anirdaśān nirdaśāṃś ca haniṣyāmo 'dya vai śiśūn"
  - id: '10.4.41'
    kind: verse
    lines:
      - "विप्रा गावश्च वेदाश्च तपः सत्यं दमः शमः"
      - "श्रद्धा दया तितिक्षा च क्रतवश्च हरेस्तनूः"
    iast: "viprā gāvaś ca vedāś ca tapaḥ satyaṃ damaḥ śamaḥ | śraddhā dayā titikṣā ca kratavaś ca hares tanūḥ"
  - id: '10.4.43'
    kind: verse
    lines:
      - "एवं दुर्मन्त्रिभिः कंसः सह सम्मन्त्र्य दुर्मतिः"
      - "ब्रह्महिंसां हितं मेने कालपाशावृतोऽसुरः"
    iast: "evaṃ durmantribhiḥ kaṃsaḥ saha sammantrya durmatiḥ | brahma-hiṃsāṃ hitaṃ mene kāla-pāśāvṛto 'suraḥ"
  - id: '10.4.44'
    kind: verse
    lines:
      - "सन्दिश्य साधुलोकस्य कदने कदनप्रियान्"
      - "कामरूपधरान्दिक्षु दानवान्गृहमाविशत्"
    iast: "sandiśya sādhu-lokasya kadane kadana-priyān | kāma-rūpa-dharān dikṣu dānavān gṛham āviśat"
  - id: '10.5.1'
    kind: verse
    lines:
      - "नन्दस्त्वात्मज उत्पन्ने जाताह्लादो महामनाः"
      - "आहूय विप्रान्वेदज्ञान्स्नातः शुचिरलङ्कृतः"
    iast: "nandas tv ātmaja utpanne jātāhlādo mahā-manāḥ | āhūya viprān veda-jñān snātaḥ śucir alaṅkṛtaḥ"
  - id: '10.5.2'
    kind: verse
    lines:
      - "वाचयित्वा स्वस्त्ययनं जातकर्मात्मजस्य वै"
      - "कारयामास विधिवत्पितृदेवार्चनं तथा"
    iast: "vācayitvā svastyayanaṃ jāta-karmātmajasya vai | kārayām āsa vidhivat pitṛ-devārcanaṃ tathā"
  - id: '10.5.6'
    kind: verse
    lines:
      - "व्रजः सम्मृष्टसंसिक्त द्वाराजिरगृहान्तरः"
      - "चित्रध्वजपताकास्रक् चैलपल्लवतोरणैः"
    iast: "vrajaḥ sammṛṣṭa-saṃsikta- dvārājira-gṛhāntaraḥ | citra-dhvaja-patākā-srak- caila-pallava-toraṇaiḥ"
  - id: '10.5.7'
    kind: verse
    lines:
      - "गावो वृषा वत्सतरा हरिद्रातैलरूषिताः"
      - "विचित्रधातुबर्हस्रग् वस्त्रकाञ्चनमालिनः"
    iast: "gāvo vṛṣā vatsatarā haridrā-taila-rūṣitāḥ | vicitra-dhātu-barhasrag- vastra-kāñcana-mālinaḥ"
  - id: '10.5.8'
    kind: verse
    lines:
      - "महार्हवस्त्राभरण कञ्चुकोष्णीषभूषिताः"
      - "गोपाः समाययू राजन्नानोपायनपाणयः"
    iast: "mahārha-vastrābharaṇa- kañcukoṣṇīṣa-bhūṣitāḥ | gopāḥ samāyayū rājan nānopāyana-pāṇayaḥ"
  - id: '10.5.9'
    kind: verse
    lines:
      - "गोप्यश्चाकर्ण्य मुदिता यशोदायाः सुतोद्भवम्"
      - "आत्मानं भूषयां चक्रुर्वस्त्राकल्पाञ्जनादिभिः"
    iast: "gopyaś cākarṇya muditā yaśodāyāḥ sutodbhavam | ātmānaṃ bhūṣayāṃ cakrur vastrākalpāñjanādibhiḥ"
  - id: '10.5.12'
    kind: verse
    lines:
      - "ता आशिषः प्रयुञ्जानाश्चिरं पाहीति बालके"
      - "हरिद्राचूर्णतैलाद्भिः सिञ्चन्त्योऽजनमुज्जगुः"
    iast: "tā āśiṣaḥ prayuñjānāś ciraṃ pāhīti bālake | haridrā-cūrṇa-tailādbhiḥ siñcantyo 'janam ujjaguḥ"
  - id: '10.5.18'
    kind: verse
    lines:
      - "तत आरभ्य नन्दस्य व्रजः सर्वसमृद्धिमान्"
      - "हरेर्निवासात्मगुणै रमाक्रीडमभून्नृप"
    iast: "tata ārabhya nandasya vrajaḥ sarva-samṛddhimān | harer nivāsātma-guṇai ramākrīḍam abhūn nṛpa"
  - id: '10.6.2'
    kind: verse
    lines:
      - "कंसेन प्रहिता घोरा पूतना बालघातिनी"
      - "शिशूंश्चचार निघ्नन्ती पुरग्रामव्रजादिषु"
    iast: "kaṃsena prahitā ghorā pūtanā bāla-ghātinī | śiśūṃś cacāra nighnantī pura-grāma-vrajādiṣu"
  - id: '10.6.4'
    kind: verse
    lines:
      - "सा खेचर्येकदोत्पत्य पूतना नन्दगोकुलम्"
      - "योषित्वा माययात्मानं प्राविशत्कामचारिणी"
    iast: "sā khe-cary ekadotpatya pūtanā nanda-gokulam | yoṣitvā māyayātmānaṃ prāviśat kāma-cāriṇī"
  - id: '10.6.8'
    kind: verse
    lines:
      - "विबुध्य तां बालकमारिकाग्रहं चराचरात्मा स निमीलितेक्षणः"
      - "अनन्तमारोपयदङ्कमन्तकं यथोरगं सुप्तमबुद्धिरज्जुधीः"
    iast: "vibudhya tāṃ bālaka-mārikā-grahaṃ carācarātmā sa nimīlitekṣaṇaḥ | anantam āropayad aṅkam antakaṃ yathoragaṃ suptam abuddhi-rajju-dhīḥ"
  - id: '10.6.10'
    kind: verse
    lines:
      - "तस्मिन्स्तनं दुर्जरवीर्यमुल्बणं घोराङ्कमादाय शिशोर्ददावथ अम्प्;"
      - "गाढं कराभ्यां भगवान्प्रपीड्य तत् प्राणैः समं रोषसमन्वितोऽपिबत्"
    iast: "tasmin stanaṃ durjara-vīryam ulbaṇaṃ ghorāṅkam ādāya śiśor dadāv atha amp; | gāḍhaṃ karābhyāṃ bhagavān prapīḍya tat- prāṇaiḥ samaṃ roṣa-samanvito 'pibat"
  - id: '10.6.13'
    kind: verse
    lines:
      - "निशाचरीत्थं व्यथितस्तना व्यसुर्व्यादाय केशांश्चरणौ भुजावपि अम्प्;"
      - "प्रसार्य गोष्ठे निजरूपमास्थिता वज्राहतो वृत्र इवापतन्नृप"
    iast: "niśā-carītthaṃ vyathita-stanā vyasur vyādāya keśāṃś caraṇau bhujāv api amp; | prasārya goṣṭhe nija-rūpam āsthitā vajrāhato vṛtra ivāpatan nṛpa"
  - id: '10.7.4'
    kind: verse
    lines:
      - "कदाचिदौत्थानिककौतुकाप्लवे जन्मर्क्षयोगे समवेतयोषिताम्"
      - "वादित्रगीतद्विजमन्त्रवाचकैश्चकार सूनोरभिषेचनं सती"
    iast: "kadācid autthānika-kautukāplave janmarkṣa-yoge samaveta-yoṣitām | vāditra-gīta-dvija-mantra-vācakaiś cakāra sūnor abhiṣecanaṃ satī"
  - id: '10.7.5'
    kind: verse
    lines:
      - "नन्दस्य पत्नी कृतमज्जनादिकं विप्रैः कृतस्वस्त्ययनं सुपूजितैः"
      - "अन्नाद्यवासःस्रगभीष्टधेनुभिः सञ्जातनिद्राक्षमशीशयच्छनैः"
    iast: "nandasya patnī kṛta-majjanādikaṃ vipraiḥ kṛta-svastyayanaṃ supūjitaiḥ | annādya-vāsaḥ-srag-abhīṣṭa-dhenubhiḥ sañjāta-nidrākṣam aśīśayac chanaiḥ"
  - id: '10.7.6'
    kind: verse
    lines:
      - "औत्थानिकौत्सुक्यमना मनस्विनी समागतान्पूजयती व्रजौकसः"
      - "नैवाशृणोद्वै रुदितं सुतस्य सा रुदन्स्तनार्थी चरणावुदक्षिपत्"
    iast: "autthānikautsukya-manā manasvinī samāgatān pūjayatī vrajaukasaḥ | naivāśṛṇod vai ruditaṃ sutasya sā rudan stanārthī caraṇāv udakṣipat"
  - id: '10.7.7'
    kind: verse
    lines:
      - "अधःशयानस्य शिशोरनोऽल्पक प्रवालमृद्वङ्घ्रिहतं व्यवर्तत"
      - "विध्वस्तनानारसकुप्यभाजनं व्यत्यस्तचक्राक्षविभिन्नकूबरम्"
    iast: "adhaḥ-śayānasya śiśor ano 'lpaka- pravāla-mṛdv-aṅghri-hataṃ vyavartata | vidhvasta-nānā-rasa-kupya-bhājanaṃ vyatyasta-cakrākṣa-vibhinna-kūbaram"
  - id: '10.7.10'
    kind: verse
    lines:
      - "न ते श्रद्दधिरे गोपा बालभाषितमित्युत"
      - "अप्रमेयं बलं तस्य बालकस्य न ते विदुः"
    iast: "na te śraddadhire gopā bāla-bhāṣitam ity uta | aprameyaṃ balaṃ tasya bālakasya na te viduḥ"
  - id: '10.7.18'
    kind: verse
    lines:
      - "एकदारोहमारूढं लालयन्ती सुतं सती"
      - "गरिमाणं शिशोर्वोढुं न सेहे गिरिकूटवत्"
    iast: "ekadāroham ārūḍhaṃ lālayantī sutaṃ satī | garimāṇaṃ śiśor voḍhuṃ na sehe giri-kūṭavat"
  - id: '10.7.20'
    kind: verse
    lines:
      - "दैत्यो नाम्ना तृणावर्तः कंसभृत्यः प्रणोदितः"
      - "चक्रवातस्वरूपेण जहारासीनमर्भकम्"
    iast: "daityo nāmnā tṛṇāvartaḥ kaṃsa-bhṛtyaḥ praṇoditaḥ | cakravāta-svarūpeṇa jahārāsīnam arbhakam"
  - id: '10.7.22'
    kind: verse
    lines:
      - "मुहूर्तमभवद्गोष्ठं रजसा तमसावृतम्"
      - "सुतं यशोदा नापश्यत्तस्मिन्न्यस्तवती यतः"
    iast: "muhūrtam abhavad goṣṭhaṃ rajasā tamasāvṛtam | sutaṃ yaśodā nāpaśyat tasmin nyastavatī yataḥ"
  - id: '10.7.28'
    kind: verse
    lines:
      - "गलग्रहणनिश्चेष्टो दैत्यो निर्गतलोचनः"
      - "अव्यक्तरावो न्यपतत्सहबालो व्यसुर्व्रजे"
    iast: "gala-grahaṇa-niśceṣṭo daityo nirgata-locanaḥ | avyakta-rāvo nyapatat saha-bālo vyasur vraje"
  - id: '10.8.11'
    kind: verse
    lines:
      - "एवं सम्प्रार्थितो विप्रः स्वचिकीर्षितमेव तत्"
      - "चकार नामकरणं गूढो रहसि बालयोः"
    iast: "evaṃ samprārthito vipraḥ sva-cikīrṣitam eva tat | cakāra nāma-karaṇaṃ gūḍho rahasi bālayoḥ"
  - id: '10.8.12'
    kind: verse
    lines:
      - "अयं हि रोहिणीपुत्रो रमयन्सुहृदो गुणैः"
      - "आख्यास्यते राम इति बलाधिक्याद्बलं विदुः"
      - "यदूनामपृथग्भावात्सङ्कर्षणमुशन्त्यपि"
    iast: "ayaṃ hi rohiṇī-putro ramayan suhṛdo guṇaiḥ | ākhyāsyate rāma iti balādhikyād balaṃ viduḥ | yadūnām apṛthag-bhāvāt saṅkarṣaṇam uśanty api"
  - id: '10.8.14'
    kind: verse
    lines:
      - "प्रागयं वसुदेवस्य क्वचिज्जातस्तवात्मजः"
      - "वासुदेव इति श्रीमानभिज्ञाः सम्प्रचक्षते"
    iast: "prāg ayaṃ vasudevasya kvacij jātas tavātmajaḥ | vāsudeva iti śrīmān abhijñāḥ sampracakṣate"
  - id: '10.8.15'
    kind: verse
    lines:
      - "बहूनि सन्ति नामानि रूपाणि च सुतस्य ते"
      - "गुणकर्मानुरूपाणि तान्यहं वेद नो जनाः"
    iast: "bahūni santi nāmāni rūpāṇi ca sutasya te | guṇa-karmānurūpāṇi tāny ahaṃ veda no janāḥ"
  - id: '10.8.16'
    kind: verse
    lines:
      - "एष वः श्रेय आधास्यद्गोपगोकुलनन्दनः"
      - "अनेन सर्वदुर्गाणि यूयमञ्जस्तरिष्यथ"
    iast: "eṣa vaḥ śreya ādhāsyad gopa-gokula-nandanaḥ | anena sarva-durgāṇi yūyam añjas tariṣyatha"
  - id: '10.8.20'
    kind: verse
    lines:
      - "इत्यात्मानं समादिश्य गर्गे च स्वगृहं गते"
      - "नन्दः प्रमुदितो मेने आत्मानं पूर्णमाशिषाम्"
    iast: "ity ātmānaṃ samādiśya garge ca sva-gṛhaṃ gate | nandaḥ pramudito mene ātmānaṃ pūrṇam āśiṣām"
  - id: '10.8.32'
    kind: verse
    lines:
      - "एकदा क्रीडमानास्ते रामाद्या गोपदारकाः"
      - "कृष्णो मृदं भक्षितवानिति मात्रे न्यवेदयन्"
    iast: "ekadā krīḍamānās te rāmādyā gopa-dārakāḥ | kṛṣṇo mṛdaṃ bhakṣitavān iti mātre nyavedayan"
  - id: '10.8.35'
    kind: verse
    lines:
      - "नाहं भक्षितवानम्ब सर्वे मिथ्याभिशंसिनः"
      - "यदि सत्यगिरस्तर्हि समक्षं पश्य मे मुखम्"
    iast: "nāhaṃ bhakṣitavān amba sarve mithyābhiśaṃsinaḥ | yadi satya-giras tarhi samakṣaṃ paśya me mukham"
  - id: '10.8.36'
    kind: verse
    lines:
      - "यद्येवं तर्हि व्यादेही त्युक्तः स भगवान्हरिः"
      - "व्यादत्ताव्याहतैश्वर्यः क्रीडामनुजबालकः"
    iast: "yady evaṃ tarhi vyādehī- ty uktaḥ sa bhagavān hariḥ | vyādattāvyāhataiśvaryaḥ krīḍā-manuja-bālakaḥ"
  - id: '10.8.37'
    kind: verse
    lines:
      - "सा तत्र ददृशे विश्वं जगत्स्थास्नु च खं दिशः"
      - "साद्रिद्वीपाब्धिभूगोलं सवाय्वग्नीन्दुतारकम्"
    iast: "sā tatra dadṛśe viśvaṃ jagat sthāsnu ca khaṃ diśaḥ | sādri-dvīpābdhi-bhūgolaṃ sa-vāyv-agnīndu-tārakam"
  - id: '10.8.45'
    kind: verse
    lines:
      - "त्रय्या चोपनिषद्भिश्च साङ्ख्ययोगैश्च सात्वतैः"
      - "उपगीयमानमाहात्म्यं हरिं सामन्यतात्मजम्"
    iast: "trayyā copaniṣadbhiś ca sāṅkhya-yogaiś ca sātvataiḥ | upagīyamāna-māhātmyaṃ hariṃ sāmanyatātmajam"
  - id: '10.9.1'
    kind: verse
    lines:
      - "एकदा गृहदासीषु यशोदा नन्दगेहिनी"
      - "कर्मान्तरनियुक्तासु निर्ममन्थ स्वयं दधि"
    iast: "ekadā gṛha-dāsīṣu yaśodā nanda-gehinī | karmāntara-niyuktāsu nirmamantha svayaṃ dadhi"
  - id: '10.9.4'
    kind: verse
    lines:
      - "तां स्तन्यकाम आसाद्य मथ्नन्तीं जननीं हरिः"
      - "गृहीत्वा दधिमन्थानं न्यषेधत्प्रीतिमावहन्"
    iast: "tāṃ stanya-kāma āsādya mathnantīṃ jananīṃ hariḥ | gṛhītvā dadhi-manthānaṃ nyaṣedhat prītim āvahan"
  - id: '10.9.5'
    kind: verse
    lines:
      - "तमङ्कमारूढमपाययत्स्तनं स्नेहस्नुतं सस्मितमीक्षती मुखम्"
      - "अतृप्तमुत्सृज्य जवेन सा ययावुत्सिच्यमाने पयसि त्वधिश्रिते"
    iast: "tam aṅkam ārūḍham apāyayat stanaṃ sneha-snutaṃ sa-smitam īkṣatī mukham | atṛptam utsṛjya javena sā yayāv utsicyamāne payasi tv adhiśrite"
  - id: '10.9.6'
    kind: verse
    lines:
      - "सञ्जातकोपः स्फुरितारुणाधरं सन्दश्य दद्भिर्दधिमन्थभाजनम्"
      - "भित्त्वा मृषाश्रुर्दृषदश्मना रहो जघास हैयङ्गवमन्तरं गतः"
    iast: "sañjāta-kopaḥ sphuritāruṇādharaṃ sandaśya dadbhir dadhi-mantha-bhājanam | bhittvā mṛṣāśrur dṛṣad-aśmanā raho jaghāsa haiyaṅgavam antaraṃ gataḥ"
  - id: '10.9.9'
    kind: verse
    lines:
      - "तामात्तयष्टिं प्रसमीक्ष्य सत्वरस्ततोऽवरुह्यापससार भीतवतम्प्;"
      - "गोप्यन्वधावन्न यमाप योगिनां क्षमं प्रवेष्टुं तपसेरितं मनः"
    iast: "tām ātta-yaṣṭiṃ prasamīkṣya satvaras tato 'varuhyāpasasāra bhītavat amp; | gopy anvadhāvan na yam āpa yogināṃ kṣamaṃ praveṣṭuṃ tapaseritaṃ manaḥ"
  - id: '10.9.11'
    kind: verse
    lines:
      - "कृतागसं तं प्ररुदन्तमक्षिणी कषन्तमञ्जन्मषिणी स्वपाणिना"
      - "उद्वीक्षमाणं भयविह्वलेक्षणं हस्ते गृहीत्वा भिषयन्त्यवागुरत्"
    iast: "kṛtāgasaṃ taṃ prarudantam akṣiṇī kaṣantam añjan-maṣiṇī sva-pāṇinā | udvīkṣamāṇaṃ bhaya-vihvalekṣaṇaṃ haste gṛhītvā bhiṣayanty avāgurat"
  - id: '10.9.12'
    kind: verse
    lines:
      - "त्यक्त्वा यष्टिं सुतं भीतं विज्ञायार्भकवत्सला"
      - "इयेष किल तं बद्धुं दाम्नातद्वीर्यकोविदा"
    iast: "tyaktvā yaṣṭiṃ sutaṃ bhītaṃ vijñāyārbhaka-vatsalā | iyeṣa kila taṃ baddhuṃ dāmnātad-vīrya-kovidā"
  - id: '10.9.13'
    kind: verse
    lines:
      - "न चान्तर्न बहिर्यस्य न पूर्वं नापि चापरम्"
      - "पूर्वापरं बहिश्चान्तर्जगतो यो जगच्च यः"
    iast: "na cāntar na bahir yasya na pūrvaṃ nāpi cāparam | pūrvāparaṃ bahiś cāntar jagato yo jagac ca yaḥ"
  - id: '10.9.14'
    kind: verse
    lines:
      - "तं मत्वात्मजमव्यक्तं मर्त्यलिङ्गमधोक्षजम्"
      - "गोपिकोलूखले दाम्ना बबन्ध प्राकृतं यथा"
    iast: "taṃ matvātmajam avyaktaṃ martya-liṅgam adhokṣajam | gopikolūkhale dāmnā babandha prākṛtaṃ yathā"
  - id: '10.9.15'
    kind: verse
    lines:
      - "तद्दाम बध्यमानस्य स्वार्भकस्य कृतागसः"
      - "द्व्यङ्गुलोनमभूत्तेन सन्दधेऽन्यच्च गोपिका"
    iast: "tad dāma badhyamānasya svārbhakasya kṛtāgasaḥ | dvy-aṅgulonam abhūt tena sandadhe 'nyac ca gopikā"
  - id: '10.9.16'
    kind: verse
    lines:
      - "यदासीत्तदपि न्यूनं तेनान्यदपि सन्दधे"
      - "तदपि द्व्यङ्गुलं न्यूनं यद्यदादत्त बन्धनम्"
    iast: "yadāsīt tad api nyūnaṃ tenānyad api sandadhe | tad api dvy-aṅgulaṃ nyūnaṃ yad yad ādatta bandhanam"
  - id: '10.9.18'
    kind: verse
    lines:
      - "स्वमातुः स्विन्नगात्राया विस्रस्तकबरस्रजः"
      - "दृष्ट्वा परिश्रमं कृष्णः कृपयासीत्स्वबन्धने"
    iast: "sva-mātuḥ svinna-gātrāyā visrasta-kabara-srajaḥ | dṛṣṭvā pariśramaṃ kṛṣṇaḥ kṛpayāsīt sva-bandhane"
  - id: '10.9.22'
    kind: verse
    lines:
      - "कृष्णस्तु गृहकृत्येषु व्यग्रायां मातरि प्रभुः"
      - "अद्राक्षीदर्जुनौ पूर्वं गुह्यकौ धनदात्मजौ"
    iast: "kṛṣṇas tu gṛha-kṛtyeṣu vyagrāyāṃ mātari prabhuḥ | adrākṣīd arjunau pūrvaṃ guhyakau dhanadātmajau"
  - id: '10.10.26'
    kind: verse
    lines:
      - "इत्यन्तरेणार्जुनयोः कृष्णस्तु यमयोर्ययौ"
      - "आत्मनिर्वेशमात्रेण तिर्यग्गतमुलूखलम्"
    iast: "ity antareṇārjunayoḥ kṛṣṇas tu yamayor yayau | ātma-nirveśa-mātreṇa tiryag-gatam ulūkhalam"
  - id: '10.10.27'
    kind: verse
    lines:
      - "बालेन निष्कर्षयतान्वगुलूखलं तद्दामोदरेण तरसोत्कलिताङ्घ्रिबन्धौ अम्प्;"
      - "निष्पेततुः परमविक्रमितातिवेप स्कन्धप्रवालविटपौ कृतचण्डशब्दौ"
    iast: "bālena niṣkarṣayatānvag ulūkhalaṃ tad dāmodareṇa tarasotkalitāṅghri-bandhau amp; | niṣpetatuḥ parama-vikramitātivepa- skandha-pravāla-viṭapau kṛta-caṇḍa-śabdau"
  - id: '10.10.43'
    kind: verse
    lines:
      - "इत्युक्तौ तौ परिक्रम्य प्रणम्य च पुनः पुनः"
      - "बद्धोलूखलमामन्त्र्य जग्मतुर्दिशमुत्तराम्"
    iast: "ity uktau tau parikramya praṇamya ca punaḥ punaḥ | baddholūkhalam āmantrya jagmatur diśam uttarām"
  - id: '10.11.41'
    kind: verse
    lines:
      - "कदाचिद्यमुनातीरे वत्सांश्चारयतोः स्वकैः"
      - "वयस्यैः कृष्णबलयोर्जिघांसुर्दैत्य आगमत्"
    iast: "kadācid yamunā-tīre vatsāṃś cārayatoḥ svakaiḥ | vayasyaiḥ kṛṣṇa-balayor jighāṃsur daitya āgamat"
  - id: '10.11.42'
    kind: verse
    lines:
      - "तं वत्सरूपिणं वीक्ष्य वत्सयूथगतं हरिः"
      - "दर्शयन्बलदेवाय शनैर्मुग्ध इवासदत्"
    iast: "taṃ vatsa-rūpiṇaṃ vīkṣya vatsa-yūtha-gataṃ hariḥ | darśayan baladevāya śanair mugdha ivāsadat"
  - id: '10.11.43'
    kind: verse
    lines:
      - "गृहीत्वापरपादाभ्यां सहलाङ्गूलमच्युतः"
      - "भ्रामयित्वा कपित्थाग्रे प्राहिणोद्गतजीवितम्"
      - "स कपित्थैर्महाकायः पात्यमानैः पपात ह"
    iast: "gṛhītvāpara-pādābhyāṃ saha-lāṅgūlam acyutaḥ | bhrāmayitvā kapitthāgre prāhiṇod gata-jīvitam | sa kapitthair mahā-kāyaḥ pātyamānaiḥ papāta ha"
  - id: '10.11.46'
    kind: verse
    lines:
      - "स्वं स्वं वत्सकुलं सर्वे पाययिष्यन्त एकदा"
      - "गत्वा जलाशयाभ्याशं पाययित्वा पपुर्जलम्"
    iast: "svaṃ svaṃ vatsa-kulaṃ sarve pāyayiṣyanta ekadā | gatvā jalāśayābhyāśaṃ pāyayitvā papur jalam"
  - id: '10.11.47'
    kind: verse
    lines:
      - "ते तत्र ददृशुर्बाला महासत्त्वमवस्थितम्"
      - "तत्रसुर्वज्रनिर्भिन्नं गिरेः शृङ्गमिव च्युतम्"
    iast: "te tatra dadṛśur bālā mahā-sattvam avasthitam | tatrasur vajra-nirbhinnaṃ gireḥ śṛṅgam iva cyutam"
  - id: '10.11.48'
    kind: verse
    lines:
      - "स वै बको नाम महानसुरो बकरूपधृक्"
      - "आगत्य सहसा कृष्णं तीक्ष्णतुण्डोऽग्रसद्बली"
    iast: "sa vai bako nāma mahān asuro baka-rūpa-dhṛk | āgatya sahasā kṛṣṇaṃ tīkṣṇa-tuṇḍo 'grasad balī"
  - id: '10.11.49'
    kind: verse
    lines:
      - "कृष्णं महाबकग्रस्तं दृष्ट्वा रामादयोऽर्भकाः"
      - "बभूवुरिन्द्रियाणीव विना प्राणं विचेतसः"
    iast: "kṛṣṇaṃ mahā-baka-grastaṃ dṛṣṭvā rāmādayo 'rbhakāḥ | babhūvur indriyāṇīva vinā prāṇaṃ vicetasaḥ"
  - id: '10.11.50'
    kind: verse
    lines:
      - "तं तालुमूलं प्रदहन्तमग्निवद्गोपालसूनुं पितरं जगद्गुरोः"
      - "चच्छर्द सद्योऽतिरुषाक्षतं बकस्तुण्डेन हन्तुं पुनरभ्यपद्यत"
    iast: "taṃ tālu-mūlaṃ pradahantam agnivad gopāla-sūnuṃ pitaraṃ jagad-guroḥ | caccharda sadyo 'tiruṣākṣataṃ bakas tuṇḍena hantuṃ punar abhyapadyata"
  - id: '10.11.51'
    kind: verse
    lines:
      - "तमापतन्तं स निगृह्य तुण्डयोर्दोर्भ्यां बकं कंससखं सतां पतिः"
      - "पश्यत्सु बालेषु ददार लीलया मुदावहो वीरणवद्दिवौकसाम्"
    iast: "tam āpatantaṃ sa nigṛhya tuṇḍayor dorbhyāṃ bakaṃ kaṃsa-sakhaṃ satāṃ patiḥ | paśyatsu bāleṣu dadāra līlayā mudāvaho vīraṇavad divaukasām"
  - id: '10.12.1'
    kind: verse
    lines:
      - "क्वचिद्वनाशाय मनो दधद्व्रजात्प्रातः समुत्थाय वयस्यवत्सपान्"
      - "प्रबोधयञ्छृङ्गरवेण चारुणा विनिर्गतो वत्सपुरःसरो हरिः"
    iast: "kvacid vanāśāya mano dadhad vrajāt prātaḥ samutthāya vayasya-vatsapān | prabodhayañ chṛṅga-raveṇa cāruṇā vinirgato vatsa-puraḥsaro hariḥ"
  - id: '10.12.2'
    kind: verse
    lines:
      - "तेनैव साकं पृथुकाः सहस्रशः स्निग्धाः सुशिग्वेत्रविषाणवेणवः"
      - "स्वान्स्वान्सहस्रोपरिसङ्ख्ययान्वितान्वत्सान्पुरस्कृत्य विनिर्ययुर्मुदा"
    iast: "tenaiva sākaṃ pṛthukāḥ sahasraśaḥ snigdhāḥ suśig-vetra-viṣāṇa-veṇavaḥ | svān svān sahasropari-saṅkhyayānvitān vatsān puraskṛtya viniryayur mudā"
  - id: '10.12.3'
    kind: verse
    lines:
      - "कृष्णवत्सैरसङ्ख्यातैर्यूथीकृत्य स्ववत्सकान्"
      - "चारयन्तोऽर्भलीलाभिर्विजह्रुस्तत्र तत्र ह"
    iast: "kṛṣṇa-vatsair asaṅkhyātair yūthī-kṛtya sva-vatsakān | cārayanto 'rbha-līlābhir vijahrus tatra tatra ha"
  - id: '10.12.13'
    kind: verse
    lines:
      - "अथाघनामाभ्यपतन्महासुरस्तेषां सुखक्रीडनवीक्षणाक्षमः"
      - "नित्यं यदन्तर्निजजीवितेप्सुभिः पीतामृतैरप्यमरैः प्रतीक्ष्यते"
    iast: "athāgha-nāmābhyapatan mahāsuras teṣāṃ sukha-krīḍana-vīkṣaṇākṣamaḥ | nityaṃ yad-antar nija-jīvitepsubhiḥ pītāmṛtair apy amaraiḥ pratīkṣyate"
  - id: '10.12.16'
    kind: verse
    lines:
      - "इति व्यवस्याजगरं बृहद्वपुः स योजनायाममहाद्रिपीवरम्"
      - "धृत्वाद्भुतं व्यात्तगुहाननं तदा पथि व्यशेत ग्रसनाशया खलः"
    iast: "iti vyavasyājagaraṃ bṛhad vapuḥ sa yojanāyāma-mahādri-pīvaram | dhṛtvādbhutaṃ vyātta-guhānanaṃ tadā pathi vyaśeta grasanāśayā khalaḥ"
  - id: '10.12.24'
    kind: verse
    lines:
      - "अस्मान्किमत्र ग्रसिता निविष्टानयं तथा चेद्बकवद्विनङ्क्ष्यति"
      - "क्षणादनेनेति बकार्युशन्मुखं वीक्ष्योद्धसन्तः करताडनैर्ययुः"
    iast: "asmān kim atra grasitā niviṣṭān ayaṃ tathā ced bakavad vinaṅkṣyati | kṣaṇād aneneti bakāry-uśan-mukhaṃ vīkṣyoddhasantaḥ kara-tāḍanair yayuḥ"
  - id: '10.12.26'
    kind: verse
    lines:
      - "तावत्प्रविष्टास्त्वसुरोदरान्तरं परं न गीर्णाः शिशवः सवत्साः"
      - "प्रतीक्षमाणेन बकारिवेशनं हतस्वकान्तस्मरणेन रक्षसा"
    iast: "tāvat praviṣṭās tv asurodarāntaraṃ paraṃ na gīrṇāḥ śiśavaḥ sa-vatsāḥ | pratīkṣamāṇena bakāri-veśanaṃ hata-sva-kānta-smaraṇena rakṣasā"
  - id: '10.12.27'
    kind: verse
    lines:
      - "तान्वीक्ष्य कृष्णः सकलाभयप्रदो ह्यनन्यनाथान्स्वकरादवच्युतानम्प्;"
      - "दीनांश्च मृत्योर्जठराग्निघासान्घृणार्दितो दिष्टकृतेन विस्मितः"
    iast: "tān vīkṣya kṛṣṇaḥ sakalābhaya-prado hy ananya-nāthān sva-karād avacyutān amp; | dīnāṃś ca mṛtyor jaṭharāgni-ghāsān ghṛṇārdito diṣṭa-kṛtena vismitaḥ"
  - id: '10.12.28'
    kind: verse
    lines:
      - "कृत्यं किमत्रास्य खलस्य जीवनं न वा अमीषां च सतां विहिंसनम्"
      - "द्वयं कथं स्यादिति संविचिन्त्य ज्ञात्वाविशत्तुण्डमशेषदृग्घरिः"
    iast: "kṛtyaṃ kim atrāsya khalasya jīvanaṃ na vā amīṣāṃ ca satāṃ vihiṃsanam | dvayaṃ kathaṃ syād iti saṃvicintya jñātvāviśat tuṇḍam aśeṣa-dṛg ghariḥ"
  - id: '10.12.30'
    kind: verse
    lines:
      - "तच्छ्रुत्वा भगवान्कृष्णस्त्वव्ययः सार्भवत्सकम्"
      - "चूर्णीचिकीर्षोरात्मानं तरसा ववृधे गले"
    iast: "tac chrutvā bhagavān kṛṣṇas tv avyayaḥ sārbha-vatsakam | cūrṇī-cikīrṣor ātmānaṃ tarasā vavṛdhe gale"
  - id: '10.12.31'
    kind: verse
    lines:
      - "ततोऽतिकायस्य निरुद्धमार्गिणो ह्युद्गीर्णदृष्टेर्भ्रमतस्त्वितस्ततः"
      - "पूर्णोऽन्तरङ्गे पवनो निरुद्धो मूर्धन्विनिर्भिद्य विनिर्गतो बहिः"
    iast: "tato 'tikāyasya niruddha-mārgiṇo hy udgīrṇa-dṛṣṭer bhramatas tv itas tataḥ | pūrṇo 'ntar-aṅge pavano niruddho mūrdhan vinirbhidya vinirgato bahiḥ"
  - id: '10.12.32'
    kind: verse
    lines:
      - "तेनैव सर्वेषु बहिर्गतेषु प्राणेषु वत्सान्सुहृदः परेतान्"
      - "दृष्ट्या स्वयोत्थाप्य तदन्वितः पुनर्वक्त्रान्मुकुन्दो भगवान्विनिर्ययौ"
    iast: "tenaiva sarveṣu bahir gateṣu prāṇeṣu vatsān suhṛdaḥ paretān | dṛṣṭyā svayotthāpya tad-anvitaḥ punar vaktrān mukundo bhagavān viniryayau"
  - id: '10.13.4'
    kind: verse
    lines:
      - "तथाघवदनान्मृत्यो रक्षित्वा वत्सपालकान्"
      - "सरित्पुलिनमानीय भगवानिदमब्रवीत्"
    iast: "tathāgha-vadanān mṛtyo rakṣitvā vatsa-pālakān | sarit-pulinam ānīya bhagavān idam abravīt"
  - id: '10.13.6'
    kind: verse
    lines:
      - "अत्र भोक्तव्यमस्माभिर्दिवारूढं क्षुधार्दिताः"
      - "वत्साः समीपेऽपः पीत्वा चरन्तु शनकैस्तृणम्"
    iast: "atra bhoktavyam asmābhir divārūḍhaṃ kṣudhārditāḥ | vatsāḥ samīpe 'paḥ pītvā carantu śanakais tṛṇam"
  - id: '10.13.7'
    kind: verse
    lines:
      - "तथेति पाययित्वार्भा वत्सानारुध्य शाद्वले"
      - "मुक्त्वा शिक्यानि बुभुजुः समं भगवता मुदा"
    iast: "tatheti pāyayitvārbhā vatsān ārudhya śādvale | muktvā śikyāni bubhujuḥ samaṃ bhagavatā mudā"
  - id: '10.13.8'
    kind: verse
    lines:
      - "कृष्णस्य विष्वक्पुरुराजिमण्डलैरभ्याननाः फुल्लदृशो व्रजार्भकाः अम्प्;"
      - "सहोपविष्टा विपिने विरेजुश्छदा यथाम्भोरुहकर्णिकायाः"
    iast: "kṛṣṇasya viṣvak puru-rāji-maṇḍalair abhyānanāḥ phulla-dṛśo vrajārbhakāḥ amp; | sahopaviṣṭā vipine virejuś chadā yathāmbhoruha-karṇikāyāḥ"
  - id: '10.13.10'
    kind: verse
    lines:
      - "सर्वे मिथो दर्शयन्तः स्वस्वभोज्यरुचिं पृथक्"
      - "हसन्तो हासयन्तश्चा भ्यवजह्रुः सहेश्वराः"
    iast: "sarve mitho darśayantaḥ sva-sva-bhojya-ruciṃ pṛthak | hasanto hāsayantaś cā- bhyavajahruḥ saheśvarāḥ"
  - id: '10.13.12'
    kind: verse
    lines:
      - "भारतैवं वत्सपेषु भुञ्जानेष्वच्युतात्मसु"
      - "वत्सास्त्वन्तर्वने दूरं विविशुस्तृणलोभिताः"
    iast: "bhārataivaṃ vatsa-peṣu bhuñjāneṣv acyutātmasu | vatsās tv antar-vane dūraṃ viviśus tṛṇa-lobhitāḥ"
  - id: '10.13.13'
    kind: verse
    lines:
      - "तान्दृष्ट्वा भयसन्त्रस्तानूचे कृष्णोऽस्य भीभयम्"
      - "मित्राण्याशान्मा विरमते हानेष्ये वत्सकानहम्"
    iast: "tān dṛṣṭvā bhaya-santrastān ūce kṛṣṇo 'sya bhī-bhayam | mitrāṇy āśān mā viramate- hāneṣye vatsakān aham"
  - id: '10.13.14'
    kind: verse
    lines:
      - "इत्युक्त्वाद्रिदरीकुञ्ज गह्वरेष्वात्मवत्सकान्"
      - "विचिन्वन्भगवान्कृष्णः सपाणिकवलो ययौ"
    iast: "ity uktvādri-darī-kuñja- gahvareṣv ātma-vatsakān | vicinvan bhagavān kṛṣṇaḥ sapāṇi-kavalo yayau"
  - id: '10.13.16'
    kind: verse
    lines:
      - "ततो वत्सानदृष्ट्वैत्य पुलिनेऽपि च वत्सपान्"
      - "उभावपि वने कृष्णो विचिकाय समन्ततः"
    iast: "tato vatsān adṛṣṭvaitya puline 'pi ca vatsapān | ubhāv api vane kṛṣṇo vicikāya samantataḥ"
  - id: '10.13.17'
    kind: verse
    lines:
      - "क्वाप्यदृष्ट्वान्तर्विपिने वत्सान्पालांश्च विश्ववित्"
      - "सर्वं विधिकृतं कृष्णः सहसावजगाम ह"
    iast: "kvāpy adṛṣṭvāntar-vipine vatsān pālāṃś ca viśva-vit | sarvaṃ vidhi-kṛtaṃ kṛṣṇaḥ sahasāvajagāma ha"
  - id: '10.13.20'
    kind: verse
    lines:
      - "स्वयमात्मात्मगोवत्सान्प्रतिवार्यात्मवत्सपैः"
      - "क्रीडन्नात्मविहारैश्च सर्वात्मा प्राविशद्व्रजम्"
    iast: "svayam ātmātma-govatsān prativāryātma-vatsapaiḥ | krīḍann ātma-vihāraiś ca sarvātmā prāviśad vrajam"
  - id: '10.13.27'
    kind: verse
    lines:
      - "इत्थमात्मात्मनात्मानं वत्सपालमिषेण सः"
      - "पालयन्वत्सपो वर्षं चिक्रीडे वनगोष्ठयोः"
    iast: "ittham ātmātmanātmānaṃ vatsa-pāla-miṣeṇa saḥ | pālayan vatsapo varṣaṃ cikrīḍe vana-goṣṭhayoḥ"
  - id: '10.13.46'
    kind: verse
    lines:
      - "तावत्सर्वे वत्सपालाः पश्यतोऽजस्य तत्क्षणात्"
      - "व्यदृश्यन्त घनश्यामाः पीतकौशेयवाससः"
    iast: "tāvat sarve vatsa-pālāḥ paśyato 'jasya tat-kṣaṇāt | vyadṛśyanta ghana-śyāmāḥ pīta-kauśeya-vāsasaḥ"
  - id: '10.13.47'
    kind: verse
    lines:
      - "चतुर्भुजाः शङ्खचक्र गदाराजीवपाणयः"
      - "किरीटिनः कुण्डलिनो हारिणो वनमालिनः"
    iast: "catur-bhujāḥ śaṅkha-cakra- gadā-rājīva-pāṇayaḥ | kirīṭinaḥ kuṇḍalino hāriṇo vana-mālinaḥ"
  - id: '10.13.54'
    kind: verse
    lines:
      - "सत्यज्ञानानन्तानन्द मात्रैकरसमूर्तयः"
      - "अस्पृष्टभूरिमाहात्म्या अपि ह्युपनिषद्दृशाम्"
    iast: "satya-jñānānantānanda- mātraika-rasa-mūrtayaḥ | aspṛṣṭa-bhūri-māhātmyā api hy upaniṣad-dṛśām"
  - id: '10.13.55'
    kind: verse
    lines:
      - "एवं सकृद्ददर्शाजः परब्रह्मात्मनोऽखिलान्"
      - "यस्य भासा सर्वमिदं विभाति सचराचरम्"
    iast: "evaṃ sakṛd dadarśājaḥ para-brahmātmano 'khilān | yasya bhāsā sarvam idaṃ vibhāti sa-carācaram"
  - id: '10.14.32'
    kind: verse
    lines:
      - "अहो भाग्यमहो भाग्यं नन्दगोपव्रजौकसाम्"
      - "यन्मित्रं परमानन्दं पूर्णं ब्रह्म सनातनम्"
    iast: "aho bhāgyam aho bhāgyaṃ nanda-gopa-vrajaukasām | yan-mitraṃ paramānandaṃ pūrṇaṃ brahma sanātanam"
  - id: '10.15.28'
    kind: verse
    lines:
      - "बलः प्रविश्य बाहुभ्यां तालान्सम्परिकम्पयन्"
      - "फलानि पातयामास मतङ्गज इवौजसा"
    iast: "balaḥ praviśya bāhubhyāṃ tālān samparikampayan | phalāni pātayām āsa mataṅ-gaja ivaujasā"
  - id: '10.15.29'
    kind: verse
    lines:
      - "फलानां पततां शब्दं निशम्यासुररासभः"
      - "अभ्यधावत्क्षितितलं सनगं परिकम्पयन्"
    iast: "phalānāṃ patatāṃ śabdaṃ niśamyāsura-rāsabhaḥ | abhyadhāvat kṣiti-talaṃ sa-nagaṃ parikampayan"
  - id: '10.15.32'
    kind: verse
    lines:
      - "स तं गृहीत्वा प्रपदोर्भ्रामयित्वैकपाणिना"
      - "चिक्षेप तृणराजाग्रे भ्रामणत्यक्तजीवितम्"
    iast: "sa taṃ gṛhītvā prapador bhrāmayitvaika-pāṇinā | cikṣepa tṛṇa-rājāgre bhrāmaṇa-tyakta-jīvitam"
  - id: '10.15.36'
    kind: verse
    lines:
      - "ततः कृष्णं च रामं च ज्ञातयो धेनुकस्य ये"
      - "क्रोष्टारोऽभ्यद्रवन्सर्वे संरब्धा हतबान्धवाः"
    iast: "tataḥ kṛṣṇaṃ ca rāmaṃ ca jñātayo dhenukasya ye | kroṣṭāro 'bhyadravan sarve saṃrabdhā hata-bāndhavāḥ"
  - id: '10.15.37'
    kind: verse
    lines:
      - "तांस्तानापततः कृष्णो रामश्च नृप लीलया"
      - "गृहीतपश्चाच्चरणान्प्राहिणोत्तृणराजसु"
    iast: "tāṃs tān āpatataḥ kṛṣṇo rāmaś ca nṛpa līlayā | gṛhīta-paścāc-caraṇān prāhiṇot tṛṇa-rājasu"
  - id: '10.15.47'
    kind: verse
    lines:
      - "एवं स भगवान्कृष्णो वृन्दावनचरः क्वचित्"
      - "ययौ राममृते राजन्कालिन्दीं सखिभिर्वृतः"
    iast: "evaṃ sa bhagavān kṛṣṇo vṛndāvana-caraḥ kvacit | yayau rāmam ṛte rājan kālindīṃ sakhibhir vṛtaḥ"
  - id: '10.16.4'
    kind: verse
    lines:
      - "कालिन्द्यां कालियस्यासीध्रदः कश्चिद्विषाग्निना"
      - "श्रप्यमाणपया यस्मिन्पतन्त्युपरिगाः खगाः"
    iast: "kālindyāṃ kāliyasyāsīd hradaḥ kaścid viṣāgninā | śrapyamāṇa-payā yasmin patanty upari-gāḥ khagāḥ"
  - id: '10.16.6'
    kind: verse
    lines:
      - "तं चण्डवेगविषवीर्यमवेक्ष्य तेन दुष्टां नदीं च खलसंयमनावतारः अम्प्;"
      - "कृष्णः कदम्बमधिरुह्य ततोऽतितुङ्गमास्फोट्य गाढरशनो न्यपतद्विषोदे"
    iast: "taṃ caṇḍa-vega-viṣa-vīryam avekṣya tena duṣṭāṃ nadīṃ ca khala-saṃyamanāvatāraḥ amp; | kṛṣṇaḥ kadambam adhiruhya tato 'ti-tuṅgam āsphoṭya gāḍha-raśano nyapatad viṣode"
  - id: '10.16.8'
    kind: verse
    lines:
      - "तस्य ह्रदे विहरतो भुजदण्डघूर्ण वार्घोषमङ्ग वरवारणविक्रमस्य"
      - "आश्रुत्य तत्स्वसदनाभिभवं निरीक्ष्य चक्षुःश्रवाः समसरत्तदमृष्यमाणः"
    iast: "tasya hrade viharato bhuja-daṇḍa-ghūrṇa- vār-ghoṣam aṅga vara-vāraṇa-vikramasya | āśrutya tat sva-sadanābhibhavaṃ nirīkṣya cakṣuḥ-śravāḥ samasarat tad amṛṣyamāṇaḥ"
  - id: '10.16.9'
    kind: verse
    lines:
      - "तं प्रेक्षणीयसुकुमारघनावदातं श्रीवत्सपीतवसनं स्मितसुन्दरास्यम्"
      - "क्रीडन्तमप्रतिभयं कमलोदराङ्घ्रिं सन्दश्य मर्मसु रुषा भुजया चछाद"
    iast: "taṃ prekṣaṇīya-sukumāra-ghanāvadātaṃ śrīvatsa-pīta-vasanaṃ smita-sundarāsyam | krīḍantam apratibhayaṃ kamalodarāṅghriṃ sandaśya marmasu ruṣā bhujayā cachāda"
  - id: '10.16.24'
    kind: verse
    lines:
      - "तत्प्रथ्यमानवपुषा व्यथितात्मभोगस्त्यक्त्वोन्नमय्य कुपितः स्वफणान्भुजङ्गः"
      - "तस्थौ श्वसञ्छ्वसनरन्ध्रविषाम्बरीष स्तब्धेक्षणोल्मुकमुखो हरिमीक्षमाणः"
    iast: "tat-prathyamāna-vapuṣā vyathitātma-bhogas tyaktvonnamayya kupitaḥ sva-phaṇān bhujaṅgaḥ | tasthau śvasañ chvasana-randhra-viṣāmbarīṣa- stabdhekṣaṇolmuka-mukho harim īkṣamāṇaḥ"
  - id: '10.16.29'
    kind: verse
    lines:
      - "तस्याक्षिभिर्गरलमुद्वमतः शिरःसु यद्यत्समुन्नमति निःश्वसतो रुषोच्चैः"
      - "नृत्यन्पदानुनमयन्दमयां बभूव पुष्पैः प्रपूजित इवेह पुमान्पुराणः"
    iast: "tasyākṣibhir garalam udvamataḥ śiraḥsu yad yat samunnamati niḥśvasato ruṣoccaiḥ | nṛtyan padānunamayan damayāṃ babhūva puṣpaiḥ prapūjita iveha pumān purāṇaḥ"
  - id: '10.16.67'
    kind: verse
    lines:
      - "सकलत्रसुहृत्पुत्रो द्वीपमब्धेर्जगाम ह"
      - "तदैव सामृतजला यमुना निर्विषाभवत्"
      - "अनुग्रहाद्भगवतः क्रीडामानुषरूपिणः"
    iast: "sa-kalatra-suhṛt-putro dvīpam abdher jagāma ha | tadaiva sāmṛta-jalā yamunā nirviṣābhavat | anugrahād bhagavataḥ krīḍā-mānuṣa-rūpiṇaḥ"
  - id: '10.18.2'
    kind: verse
    lines:
      - "व्रजे विक्रीडतोरेवं गोपालच्छद्ममायया"
      - "ग्रीष्मो नामर्तुरभवन्नातिप्रेयाञ्छरीरिणाम्"
    iast: "vraje vikrīḍator evaṃ gopāla-cchadma-māyayā | grīṣmo nāmartur abhavan nāti-preyāñ charīriṇām"
  - id: '10.18.17'
    kind: verse
    lines:
      - "पशूंश्चारयतोर्गोपैस्तद्वने रामकृष्णयोः"
      - "गोपरूपी प्रलम्बोऽगादसुरस्तज्जिहीर्षया"
    iast: "paśūṃś cārayator gopais tad-vane rāma-kṛṣṇayoḥ | gopa-rūpī pralambo 'gād asuras taj-jihīrṣayā"
  - id: '10.18.18'
    kind: verse
    lines:
      - "तं विद्वानपि दाशार्हो भगवान्सर्वदर्शनः"
      - "अन्वमोदत तत्सख्यं वधं तस्य विचिन्तयन्"
    iast: "taṃ vidvān api dāśārho bhagavān sarva-darśanaḥ | anvamodata tat-sakhyaṃ vadhaṃ tasya vicintayan"
  - id: '10.18.19'
    kind: verse
    lines:
      - "तत्रोपाहूय गोपालान्कृष्णः प्राह विहारवित्"
      - "हे गोपा विहरिष्यामो द्वन्द्वीभूय यथायथम्"
    iast: "tatropāhūya gopālān kṛṣṇaḥ prāha vihāra-vit | he gopā vihariṣyāmo dvandvī-bhūya yathā-yatham"
  - id: '10.18.21'
    kind: verse
    lines:
      - "आचेरुर्विविधाः क्रीडा वाह्यवाहकलक्षणाः"
      - "यत्रारोहन्ति जेतारो वहन्ति च पराजिताः"
    iast: "ācerur vividhāḥ krīḍā vāhya-vāhaka-lakṣaṇāḥ | yatrārohanti jetāro vahanti ca parājitāḥ"
  - id: '10.18.24'
    kind: verse
    lines:
      - "उवाह कृष्णो भगवान्श्रीदामानं पराजितः"
      - "वृषभं भद्रसेनस्तु प्रलम्बो रोहिणीसुतम्"
    iast: "uvāha kṛṣṇo bhagavān śrīdāmānaṃ parājitaḥ | vṛṣabhaṃ bhadrasenas tu pralambo rohiṇī-sutam"
  - id: '10.18.26'
    kind: verse
    lines:
      - "तमुद्वहन्धरणिधरेन्द्रगौरवं महासुरो विगतरयो निजं वपुः अम्प्;"
      - "स आस्थितः पुरटपरिच्छदो बभौ तडिद्द्युमानुडुपतिवाडिवाम्बुदः"
    iast: "tam udvahan dharaṇi-dharendra-gauravaṃ mahāsuro vigata-rayo nijaṃ vapuḥ amp; | sa āsthitaḥ puraṭa-paricchado babhau taḍid-dyumān uḍupati-vāḍ ivāmbudaḥ"
  - id: '10.18.29'
    kind: verse
    lines:
      - "स आहतः सपदि विशीर्णमस्तको मुखाद्वमन्रुधिरमपस्मृतोऽसुरः"
      - "महारवं व्यसुरपतत्समीरयन्गिरिर्यथा मघवत आयुधाहतः"
    iast: "sa āhataḥ sapadi viśīrṇa-mastako mukhād vaman rudhiram apasmṛto 'suraḥ | mahā-ravaṃ vyasur apatat samīrayan girir yathā maghavata āyudhāhataḥ"
  - id: '10.22.1'
    kind: verse
    lines:
      - "हेमन्ते प्रथमे मासि नन्दव्रजकमारिकाः"
      - "चेरुर्हविष्यं भुञ्जानाः कात्यायन्यर्चनव्रतम्"
    iast: "hemante prathame māsi nanda-vraja-kamārikāḥ | cerur haviṣyaṃ bhuñjānāḥ kātyāyany-arcana-vratam"
  - id: '10.22.5'
    kind: verse
    lines:
      - "एवं मासं व्रतं चेरुः कुमार्यः कृष्णचेतसः"
      - "भद्रकालीं समानर्चुर्भूयान्नन्दसुतः पतिः"
    iast: "evaṃ māsaṃ vrataṃ ceruḥ kumāryaḥ kṛṣṇa-cetasaḥ | bhadrakālīṃ samānarcur bhūyān nanda-sutaḥ patiḥ"
  - id: '10.22.7'
    kind: verse
    lines:
      - "नद्याः कदाचिदागत्य तीरे निक्षिप्य पूर्ववत्"
      - "वासांसि कृष्णं गायन्त्यो विजह्रुः सलिले मुदा"
    iast: "nadyāḥ kadācid āgatya tīre nikṣipya pūrva-vat | vāsāṃsi kṛṣṇaṃ gāyantyo vijahruḥ salile mudā"
  - id: '10.22.9'
    kind: verse
    lines:
      - "तासां वासांस्युपादाय नीपमारुह्य सत्वरः"
      - "हसद्भिः प्रहसन्बालैः परिहासमुवाच ह"
    iast: "tāsāṃ vāsāṃsy upādāya nīpam āruhya satvaraḥ | hasadbhiḥ prahasan bālaiḥ parihāsam uvāca ha"
  - id: '10.22.10'
    kind: verse
    lines:
      - "अत्रागत्याबलाः कामं स्वं स्वं वासः प्रगृह्यताम्"
      - "सत्यं ब्रवाणि नो नर्म यद्यूयं व्रतकर्शिताः"
    iast: "atrāgatyābalāḥ kāmaṃ svaṃ svaṃ vāsaḥ pragṛhyatām | satyaṃ bravāṇi no narma yad yūyaṃ vrata-karśitāḥ"
  - id: '10.22.12'
    kind: verse
    lines:
      - "तस्य तत्क्ष्वेलितं दृष्ट्वा गोप्यः प्रेमपरिप्लुताः"
      - "व्रीडिताः प्रेक्ष्य चान्योन्यं जातहासा न निर्ययुः"
    iast: "tasya tat kṣvelitaṃ dṛṣṭvā gopyaḥ prema-pariplutāḥ | vrīḍitāḥ prekṣya cānyonyaṃ jāta-hāsā na niryayuḥ"
  - id: '10.22.19'
    kind: verse
    lines:
      - "यूयं विवस्त्रा यदपो धृतव्रता व्यगाहतैतत्तदु देवहेलनम्"
      - "बद्ध्वाञ्जलिं मूर्ध्न्यपनुत्तयेऽंहसः कृत्वा नमोऽधोवसनं प्रगृह्यताम्"
    iast: "yūyaṃ vivastrā yad apo dhṛta-vratā vyagāhataitat tad u deva-helanam | baddhvāñjaliṃ mūrdhny apanuttaye 'ṃhasaḥ kṛtvā namo 'dho-vasanaṃ pragṛhyatām"
  - id: '10.22.21'
    kind: verse
    lines:
      - "तास्तथावनता दृष्ट्वा भगवान्देवकीसुतः"
      - "वासांसि ताभ्यः प्रायच्छत्करुणस्तेन तोषितः"
    iast: "tās tathāvanatā dṛṣṭvā bhagavān devakī-sutaḥ | vāsāṃsi tābhyaḥ prāyacchat karuṇas tena toṣitaḥ"
  - id: '10.22.25'
    kind: verse
    lines:
      - "सङ्कल्पो विदितः साध्व्यो भवतीनां मदर्चनम्"
      - "मयानुमोदितः सोऽसौ सत्यो भवितुमर्हति"
    iast: "saṅkalpo viditaḥ sādhvyo bhavatīnāṃ mad-arcanam | mayānumoditaḥ so 'sau satyo bhavitum arhati"
  - id: '10.22.26'
    kind: verse
    lines:
      - "न मय्यावेशितधियां कामः कामाय कल्पते"
      - "भर्जिता क्वथिता धानाः प्रायो बीजाय नेशते"
    iast: "na mayy āveśita-dhiyāṃ kāmaḥ kāmāya kalpate | bharjitā kvathitā dhānāḥ prāyo bījāya neśate"
  - id: '10.22.27'
    kind: verse
    lines:
      - "याताबला व्रजं सिद्धा मयेमा रंस्यथा क्षपाः"
      - "यदुद्दिश्य व्रतमिदं चेरुरार्यार्चनं सतीः"
    iast: "yātābalā vrajaṃ siddhā mayemā raṃsyathā kṣapāḥ | yad uddiśya vratam idaṃ cerur āryārcanaṃ satīḥ"
  - id: '10.22.28'
    kind: verse
    lines:
      - "इत्यादिष्टा भगवता लब्धकामाः कुमारिकाः"
      - "ध्यायन्त्यस्तत्पदाम्भोजम्कृच्छ्रान्निर्विविशुर्व्रजम्"
    iast: "ity ādiṣṭā bhagavatā labdha-kāmāḥ kumārikāḥ | dhyāyantyas tat-padāmbhojam kṛcchrān nirviviśur vrajam"
  - id: '10.24.1'
    kind: verse
    lines:
      - "भगवानपि तत्रैव बलदेवेन संयुतः"
      - "अपश्यन्निवसन्गोपानिन्द्रयागकृतोद्यमान्"
    iast: "bhagavān api tatraiva baladevena saṃyutaḥ | apaśyan nivasan gopān indra-yāga-kṛtodyamān"
  - id: '10.24.2'
    kind: verse
    lines:
      - "तदभिज्ञोऽपि भगवान्सर्वात्मा सर्वदर्शनः"
      - "प्रश्रयावनतोऽपृच्छद्वृद्धान्नन्दपुरोगमान्"
    iast: "tad-abhijño 'pi bhagavān sarvātmā sarva-darśanaḥ | praśrayāvanato 'pṛcchad vṛddhān nanda-purogamān"
  - id: '10.24.3'
    kind: verse
    lines:
      - "कथ्यतां मे पितः कोऽयं सम्भ्रमो व उपागतः"
      - "किं फलं कस्य वोद्देशः केन वा साध्यते मखः"
    iast: "kathyatāṃ me pitaḥ ko 'yaṃ sambhramo va upāgataḥ | kiṃ phalaṃ kasya voddeśaḥ kena vā sādhyate makhaḥ"
  - id: '10.24.8'
    kind: verse
    lines:
      - "पर्जन्यो भगवानिन्द्रो मेघास्तस्यात्ममूर्तयः"
      - "तेऽभिवर्षन्ति भूतानां प्रीणनं जीवनं पयः"
    iast: "parjanyo bhagavān indro meghās tasyātma-mūrtayaḥ | te 'bhivarṣanti bhūtānāṃ prīṇanaṃ jīvanaṃ payaḥ"
  - id: '10.24.9'
    kind: verse
    lines:
      - "तं तात वयमन्ये च वार्मुचां पतिमीश्वरम्"
      - "द्रव्यैस्तद्रेतसा सिद्धैर्यजन्ते क्रतुभिर्नराः"
    iast: "taṃ tāta vayam anye ca vārmucāṃ patim īśvaram | dravyais tad-retasā siddhair yajante kratubhir narāḥ"
  - id: '10.24.10'
    kind: verse
    lines:
      - "तच्छेषेणोपजीवन्ति त्रिवर्गफलहेतवे"
      - "पुंसां पुरुषकाराणां पर्जन्यः फलभावनः"
    iast: "tac-cheṣeṇopajīvanti tri-varga-phala-hetave | puṃsāṃ puruṣa-kārāṇāṃ parjanyaḥ phala-bhāvanaḥ"
  - id: '10.24.13'
    kind: verse
    lines:
      - "कर्मणा जायते जन्तुः कर्मणैव प्रलीयते"
      - "सुखं दुःखं भयं क्षेमं कर्मणैवाभिपद्यते"
    iast: "karmaṇā jāyate jantuḥ karmaṇaiva pralīyate | sukhaṃ duḥkhaṃ bhayaṃ kṣemaṃ karmaṇaivābhipadyate"
  - id: '10.24.15'
    kind: verse
    lines:
      - "किमिन्द्रेणेह भूतानां स्वस्वकर्मानुवर्तिनाम्"
      - "अनीशेनान्यथा कर्तुं स्वभावविहितं नृणाम्"
    iast: "kim indreṇeha bhūtānāṃ sva-sva-karmānuvartinām | anīśenānyathā kartuṃ svabhāva-vihitaṃ nṛṇām"
  - id: '10.24.18'
    kind: verse
    lines:
      - "तस्मात्सम्पूजयेत्कर्म स्वभावस्थः स्वकर्मकृत्"
      - "अन्जसा येन वर्तेत तदेवास्य हि दैवतम्"
    iast: "tasmāt sampūjayet karma svabhāva-sthaḥ sva-karma-kṛt | anjasā yena varteta tad evāsya hi daivatam"
  - id: '10.24.24'
    kind: verse
    lines:
      - "न नः पुरोजनपदा न ग्रामा न गृहा वयम्"
      - "वनौकसस्तात नित्यं वनशैलनिवासिनः"
    iast: "na naḥ purojanapadā na grāmā na gṛhā vayam | vanaukasas tāta nityaṃ vana-śaila-nivāsinaḥ"
  - id: '10.24.31'
    kind: verse
    lines:
      - "कालात्मना भगवता शक्रदर्पजिघांसया"
      - "प्रोक्तं निशम्य नन्दाद्याः साध्वगृह्णन्त तद्वचः"
    iast: "kālātmanā bhagavatā śakra-darpa-jighāṃsayā | proktaṃ niśamya nandādyāḥ sādhv agṛhṇanta tad-vacaḥ"
  - id: '10.24.32'
    kind: verse
    lines:
      - "तथा च व्यदधुः सर्वं यथाह मधुसूदनः"
      - "वाचयित्वा स्वस्त्ययनं तद्द्रव्येण गिरिद्विजान्"
    iast: "tathā ca vyadadhuḥ sarvaṃ yathāha madhusūdanaḥ | vācayitvā svasty-ayanaṃ tad-dravyeṇa giri-dvijān"
  - id: '10.24.33'
    kind: verse
    lines:
      - "उपहृत्य बलीन्सम्यगादृता यवसं गवाम्"
      - "गोधनानि पुरस्कृत्य गिरिं चक्रुः प्रदक्षिणम्"
    iast: "upahṛtya balīn samyag ādṛtā yavasaṃ gavām | go-dhanāni puraskṛtya giriṃ cakruḥ pradakṣiṇam"
  - id: '10.25.2'
    kind: verse
    lines:
      - "गणं सांवर्तकं नाम मेघानां चान्तकारीणाम्"
      - "इन्द्रः प्रचोदयत्क्रुद्धो वाक्यं चाहेशमान्युत"
    iast: "gaṇaṃ sāṃvartakaṃ nāma meghānāṃ cānta-kārīṇām | indraḥ pracodayat kruddho vākyaṃ cāheśa-māny uta"
  - id: '10.25.8'
    kind: verse
    lines:
      - "इत्थं मघवताज्ञप्ता मेघा निर्मुक्तबन्धनाः"
      - "नन्दगोकुलमासारैः पीडयामासुरोजसा"
    iast: "itthaṃ maghavatājñaptā meghā nirmukta-bandhanāḥ | nanda-gokulam āsāraiḥ pīḍayām āsur ojasā"
  - id: '10.25.11'
    kind: verse
    lines:
      - "अत्यासारातिवातेन पशवो जातवेपनाः"
      - "गोपा गोप्यश्च शीतार्ता गोविन्दं शरणं ययुः"
    iast: "aty-āsārāti-vātena paśavo jāta-vepanāḥ | gopā gopyaś ca śītārtā govindaṃ śaraṇaṃ yayuḥ"
  - id: '10.25.19'
    kind: verse
    lines:
      - "इत्युक्त्वैकेन हस्तेन कृत्वा गोवर्धनाचलम्"
      - "दधार लीलया विष्णुश्छत्राकमिव बालकः"
    iast: "ity uktvaikena hastena kṛtvā govardhanācalam | dadhāra līlayā viṣṇuś chatrākam iva bālakaḥ"
  - id: '10.25.23'
    kind: verse
    lines:
      - "क्षुत्तृड्व्यथां सुखापेक्षां हित्वा तैर्व्रजवासिभिः"
      - "वीक्ष्यमाणो दधाराद्रिं सप्ताहं नाचलत्पदात्"
    iast: "kṣut-tṛḍ-vyathāṃ sukhāpekṣāṃ hitvā tair vraja-vāsibhiḥ | vīkṣyamāṇo dadhārādriṃ saptāhaṃ nācalat padāt"
  - id: '10.25.24'
    kind: verse
    lines:
      - "कृष्णयोगानुभावं तं निशम्येन्द्रोऽतिविस्मितः"
      - "निस्तम्भो भ्रष्टसङ्कल्पः स्वान्मेघान्सन्न्यवारयत्"
    iast: "kṛṣṇa-yogānubhāvaṃ taṃ niśamyendro 'ti-vismitaḥ | nistambho bhraṣṭa-saṅkalpaḥ svān meghān sannyavārayat"
  - id: '10.27.1'
    kind: verse
    lines:
      - "गोवर्धने धृते शैले आसाराद्रक्षिते व्रजे"
      - "गोलोकादाव्रजत्कृष्णं सुरभिः शक्र एव च"
    iast: "govardhane dhṛte śaile āsārād rakṣite vraje | go-lokād āvrajat kṛṣṇaṃ surabhiḥ śakra eva ca"
  - id: '10.27.23'
    kind: verse
    lines:
      - "इन्द्रः सुरर्षिभिः साकं चोदितो देवमातृभिः"
      - "अभ्यसिञ्चत दाशार्हं गोविन्द इति चाभ्यधात्"
    iast: "indraḥ surarṣibhiḥ sākaṃ codito deva-mātṛbhiḥ | abhyasiñcata dāśārhaṃ govinda iti cābhyadhāt"
  - id: '10.29.1'
    kind: verse
    lines:
      - "भगवानपि ता रातृईः शारदोत्फुल्लमल्लिकाः"
      - "वीक्ष्य रन्तुं मनश्चक्रे योगमायामुपाश्रितः"
    iast: "bhagavān api tā rātṛīḥ śāradotphulla-mallikāḥ | vīkṣya rantuṃ manaś cakre yoga-māyām upāśritaḥ"
  - id: '10.29.3'
    kind: verse
    lines:
      - "दृष्ट्वा कुमुद्वन्तमखण्डमण्डलं रमाननाभं नवकुङ्कुमारुणमम्प्;"
      - "वनं च तत्कोमलगोभी रञ्जितं जगौ कलं वामदृशां मनोहरम्"
    iast: "dṛṣṭvā kumudvantam akhaṇḍa-maṇḍalaṃ ramānanābhaṃ nava-kuṅkumāruṇam amp; | vanaṃ ca tat-komala-gobhī rañjitaṃ jagau kalaṃ vāma-dṛśāṃ manoharam"
  - id: '10.29.4'
    kind: verse
    lines:
      - "निशम्य गीतां तदनङ्गवर्धनं व्रजस्त्रियः कृष्णगृहीतमानसाः"
      - "आजग्मुरन्योन्यमलक्षितोद्यमाः स यत्र कान्तो जवलोलकुण्डलाः"
    iast: "niśamya gītāṃ tad anaṅga-vardhanaṃ vraja-striyaḥ kṛṣṇa-gṛhīta-mānasāḥ | ājagmur anyonyam alakṣitodyamāḥ sa yatra kānto java-lola-kuṇḍalāḥ"
  - id: '10.29.18'
    kind: verse
    lines:
      - "स्वागतं वो महाभागाः प्रियं किं करवाणि वः"
      - "व्रजस्यानामयं कच्चिद्ब्रूतागमनकारणम्"
    iast: "svāgataṃ vo mahā-bhāgāḥ priyaṃ kiṃ karavāṇi vaḥ | vrajasyānāmayaṃ kaccid brūtāgamana-kāraṇam"
  - id: '10.29.19'
    kind: verse
    lines:
      - "रजन्येषा घोररूपा घोरसत्त्वनिषेविता"
      - "प्रतियात व्रजं नेह स्थेयं स्त्रीभिः सुमध्यमाः"
    iast: "rajany eṣā ghora-rūpā ghora-sattva-niṣevitā | pratiyāta vrajaṃ neha stheyaṃ strībhiḥ su-madhyamāḥ"
  - id: '10.29.31'
    kind: verse
    lines:
      - "मैवं विभोऽर्हति भवान्गदितुं नृशंसं सन्त्यज्य सर्वविषयांस्तव पादमूलम्"
      - "भक्ता भजस्व दुरवग्रह मा त्यजास्मान्देवो यथादिपुरुषो भजते मुमुक्षून्"
    iast: "maivaṃ vibho 'rhati bhavān gadituṃ nṛ-śaṃsaṃ santyajya sarva-viṣayāṃs tava pāda-mūlam | bhaktā bhajasva duravagraha mā tyajāsmān devo yathādi-puruṣo bhajate mumukṣūn"
  - id: '10.29.42'
    kind: verse
    lines:
      - "इति विक्लवितं तासां श्रुत्वा योगेश्वरेश्वरः"
      - "प्रहस्य सदयं गोपीरात्मारामोऽप्यरीरमत्"
    iast: "iti viklavitaṃ tāsāṃ śrutvā yogeśvareśvaraḥ | prahasya sa-dayaṃ gopīr ātmārāmo 'py arīramat"
  - id: '10.29.47'
    kind: verse
    lines:
      - "एवं भगवतः कृष्णाल्लब्धमाना महात्मनः"
      - "आत्मानं मेनिरे स्त्रीणां मानिन्यो ह्यधिकं भुवि"
    iast: "evaṃ bhagavataḥ kṛṣṇāl labdha-mānā mahātmanaḥ | ātmānaṃ menire strīṇāṃ māninyo hy adhikaṃ bhuvi"
  - id: '10.30.1'
    kind: verse
    lines:
      - "अन्तर्हिते भगवति सहसैव व्रजाङ्गनाः"
      - "अतप्यंस्तमचक्षाणाः करिण्य इव यूथपम्"
    iast: "antarhite bhagavati sahasaiva vrajāṅganāḥ | atapyaṃs tam acakṣāṇāḥ kariṇya iva yūthapam"
  - id: '10.30.43'
    kind: verse
    lines:
      - "तन्मनस्कास्तदलापास्तद्विचेष्टास्तदात्मिकाः"
      - "तद्गुणानेव गायन्त्यो नात्मगाराणि सस्मरुः"
    iast: "tan-manaskās tad-alāpās tad-viceṣṭās tad-ātmikāḥ | tad-guṇān eva gāyantyo nātmagārāṇi sasmaruḥ"
  - id: '10.31.1'
    kind: verse
    lines:
      - "जयति तेऽधिकं जन्मना व्रजः श्रयत इन्दिरा शश्वदत्र हि"
      - "दयित दृश्यतां दिक्षु तावकास्त्वयि धृतासवस्त्वां विचिन्वते"
    iast: "jayati te 'dhikaṃ janmanā vrajaḥ śrayata indirā śaśvad atra hi | dayita dṛśyatāṃ dikṣu tāvakās tvayi dhṛtāsavas tvāṃ vicinvate"
  - id: '10.31.4'
    kind: verse
    lines:
      - "न खलु गोपीकानन्दनो भवानखिलदेहिनामन्तरात्मदृक्"
      - "विखनसार्थितो विश्वगुप्तये सख उदेयिवान्सात्वतां कुले"
    iast: "na khalu gopīkā-nandano bhavān akhila-dehinām antarātma-dṛk | vikhanasārthito viśva-guptaye sakha udeyivān sātvatāṃ kule"
  - id: '10.31.9'
    kind: verse
    lines:
      - "तव कथामृतं तप्तजीवनं कविभिरीडितं कल्मषापहम्"
      - "श्रवणमङ्गलं श्रीमदाततं भुवि गृणन्ति ये भूरिदा जनाः"
    iast: "tava kathāmṛtaṃ tapta-jīvanaṃ kavibhir īḍitaṃ kalmaṣāpaham | śravaṇa-maṅgalaṃ śrīmad ātataṃ bhuvi gṛṇanti ye bhūri-dā janāḥ"
  - id: '10.32.1'
    kind: verse
    lines:
      - "इति गोप्यः प्रगायन्त्यः प्रलपन्त्यश्च चित्रधा"
      - "रुरुदुः सुस्वरं राजन्कृष्णदर्शनलालसाः"
    iast: "iti gopyaḥ pragāyantyaḥ pralapantyaś ca citradhā | ruruduḥ su-svaraṃ rājan kṛṣṇa-darśana-lālasāḥ"
  - id: '10.32.2'
    kind: verse
    lines:
      - "तासामाविरभूच्छौरिः स्मयमानमुखाम्बुजः"
      - "पीताम्बरधरः स्रग्वी साक्षान्मन्मथमन्मथः"
    iast: "tāsām āvirabhūc chauriḥ smayamāna-mukhāmbujaḥ | pītāmbara-dharaḥ sragvī sākṣān manmatha-manmathaḥ"
  - id: '10.32.3'
    kind: verse
    lines:
      - "तं विलोक्यागतं प्रेष्ठं प्रीत्युत्फुल्लदृशोऽबलाः"
      - "उत्तस्थुर्युगपत्सर्वास्तन्वः प्राणमिवागतम्"
    iast: "taṃ vilokyāgataṃ preṣṭhaṃ prīty-utphulla-dṛśo 'balāḥ | uttasthur yugapat sarvās tanvaḥ prāṇam ivāgatam"
  - id: '10.32.11'
    kind: verse
    lines:
      - "ताः समादाय कालिन्द्या निर्विश्य पुलिनं विभुः"
      - "विकसत्कुन्दमन्दार सुरभ्यनिलषट्पदम्"
    iast: "tāḥ samādāya kālindyā nirviśya pulinaṃ vibhuḥ | vikasat-kunda-mandāra surabhy-anila-ṣaṭpadam"
  - id: '10.33.2'
    kind: verse
    lines:
      - "तत्रारभत गोविन्दो रासक्रीडामनुव्रतैः"
      - "स्त्रीरत्नैरन्वितः प्रीतैरन्योन्याबद्धबाहुभिः"
    iast: "tatrārabhata govindo rāsa-krīḍām anuvrataiḥ | strī-ratnair anvitaḥ prītair anyonyābaddha-bāhubhiḥ"
  - id: '10.33.19'
    kind: verse
    lines:
      - "कृत्वा तावन्तमात्मानं यावतीर्गोपयोषितः"
      - "रेमे स भगवांस्ताभिरात्मारामोऽपि लीलया"
    iast: "kṛtvā tāvantam ātmānaṃ yāvatīr gopa-yoṣitaḥ | reme sa bhagavāṃs tābhir ātmārāmo 'pi līlayā"
  - id: '10.36.1'
    kind: verse
    lines:
      - "अथ तर्ह्यागतो गोष्ठमरिष्टो वृषभासुरः"
      - "महीम्महाककुत्कायः कम्पयन्खुरविक्षताम्"
    iast: "atha tarhy āgato goṣṭham ariṣṭo vṛṣabhāsuraḥ | mahīm mahā-kakut-kāyaḥ kampayan khura-vikṣatām"
  - id: '10.36.5'
    kind: verse
    lines:
      - "पशवो दुद्रुवुर्भीता राजन्सन्त्यज्य गोकुलम्"
      - "कृष्ण कृष्णेति ते सर्वे गोविन्दं शरणं ययुः"
    iast: "paśavo dudruvur bhītā rājan santyajya go-kulam | kṛṣṇa kṛṣṇeti te sarve govindaṃ śaraṇaṃ yayuḥ"
  - id: '10.36.13'
    kind: verse
    lines:
      - "तमापतन्तं स निगृह्य शृङ्गयोः पदा समाक्रम्य निपात्य भूतले"
      - "निष्पीडयामास यथार्द्रमम्बरं कृत्वा विषाणेन जघान सोऽपतत्"
    iast: "tam āpatantaṃ sa nigṛhya śṛṅgayoḥ padā samākramya nipātya bhū-tale | niṣpīḍayām āsa yathārdram ambaraṃ kṛtvā viṣāṇena jaghāna so 'patat"
  - id: '10.36.14'
    kind: verse
    lines:
      - "असृग्वमन्मूत्रशकृत्समुत्सृजन्क्षिपंश्च पादाननवस्थितेक्षणः"
      - "जगाम कृच्छ्रं निरृतेरथ क्षयं पुष्पैः किरन्तो हरिमीडिरे सुराः"
    iast: "asṛg vaman mūtra-śakṛt samutsṛjan kṣipaṃś ca pādān anavasthitekṣaṇaḥ | jagāma kṛcchraṃ nirṛter atha kṣayaṃ puṣpaiḥ kiranto harim īḍire surāḥ"
  - id: '10.36.21'
    kind: verse
    lines:
      - "ततो मुष्टिकचाणूर शलतोशलकादिकान्"
      - "अमात्यान्हस्तिपांश्चैव समाहूयाह भोजराट्"
    iast: "tato muṣṭika-cāṇūra śala-tośalakādikān | amātyān hastipāṃś caiva samāhūyāha bhoja-rāṭ"
  - id: '10.36.22'
    kind: verse
    lines:
      - "भो भो निशम्यतामेतद्वीरचाणूरमुष्टिकौ"
      - "नन्दव्रजे किलासाते सुतावानकदुन्दुभेः"
    iast: "bho bho niśamyatām etad vīra-cāṇūra-muṣṭikau | nanda-vraje kilāsāte sutāv ānakadundubheḥ"
  - id: '10.36.23'
    kind: verse
    lines:
      - "रामकृष्णौ ततो मह्यं मृत्युः किल निदर्शितः"
      - "भवद्भ्यामिह सम्प्राप्तौ हन्येतां मल्ललीलया"
    iast: "rāma-kṛṣṇau tato mahyaṃ mṛtyuḥ kila nidarśitaḥ | bhavadbhyām iha samprāptau hanyetāṃ malla-līlayā"
  - id: '10.36.24'
    kind: verse
    lines:
      - "मञ्चाः क्रियन्तां विविधा मल्लरङ्गपरिश्रिताः"
      - "पौरा जानपदाः सर्वे पश्यन्तु स्वैरसंयुगम्"
    iast: "mañcāḥ kriyantāṃ vividhā malla-raṅga-pariśritāḥ | paurā jānapadāḥ sarve paśyantu svaira-saṃyugam"
  - id: '10.36.25'
    kind: verse
    lines:
      - "महामात्र त्वया भद्र रङ्गद्वार्युपनीयताम्"
      - "द्विपः कुवलयापीडो जहि तेन ममाहितौ"
    iast: "mahāmātra tvayā bhadra raṅga-dvāry upanīyatām | dvipaḥ kuvalayāpīḍo jahi tena mamāhitau"
  - id: '10.36.26'
    kind: verse
    lines:
      - "आरभ्यतां धनुर्यागश्चतुर्दश्यां यथाविधि"
      - "विशसन्तु पशून्मेध्यान्भूतराजाय मीढुषे"
    iast: "ārabhyatāṃ dhanur-yāgaś caturdaśyāṃ yathā-vidhi | viśasantu paśūn medhyān bhūta-rājāya mīḍhuṣe"
  - id: '10.36.27'
    kind: verse
    lines:
      - "इत्याज्ञाप्यार्थतन्त्रज्ञ आहूय यदुपुङ्गवम्"
      - "गृहीत्वा पाणिना पाणिं ततोऽक्रूरमुवाच ह"
    iast: "ity ājñāpyārtha-tantra-jña āhūya yadu-puṅgavam | gṛhītvā pāṇinā pāṇiṃ tato 'krūram uvāca ha"
  - id: '10.36.31'
    kind: verse
    lines:
      - "निसृष्टः किल मे मृत्युर्देवैर्वैकुण्ठसंश्रयैः"
      - "तावानय समं गोपैर्नन्दाद्यैः साभ्युपायनैः"
    iast: "nisṛṣṭaḥ kila me mṛtyur devair vaikuṇṭha-saṃśrayaiḥ | tāv ānaya samaṃ gopair nandādyaiḥ sābhyupāyanaiḥ"
  - id: '10.38.1'
    kind: verse
    lines:
      - "अक्रूरोऽपि च तां रात्रिं मधुपुर्यां महामतिः"
      - "उषित्वा रथमास्थाय प्रययौ नन्दगोकुलम्"
    iast: "akrūro 'pi ca tāṃ rātriṃ madhu-puryāṃ mahā-matiḥ | uṣitvā ratham āsthāya prayayau nanda-gokulam"
  - id: '10.38.2'
    kind: verse
    lines:
      - "गच्छन्पथि महाभागो भगवत्यम्बुजेक्षणे"
      - "भक्तिं परामुपगत एवमेतदचिन्तयत्"
    iast: "gacchan pathi mahā-bhāgo bhagavaty ambujekṣaṇe | bhaktiṃ parām upagata evam etad acintayat"
  - id: '10.38.3'
    kind: verse
    lines:
      - "किं मयाचरितं भद्रं किं तप्तं परमं तपः"
      - "किं वाथाप्यर्हते दत्तं यद्द्रक्ष्याम्यद्य केशवम्"
    iast: "kiṃ mayācaritaṃ bhadraṃ kiṃ taptaṃ paramaṃ tapaḥ | kiṃ vāthāpy arhate dattaṃ yad drakṣyāmy adya keśavam"
  - id: '10.38.24'
    kind: verse
    lines:
      - "इति सञ्चिन्तयन्कृष्णं श्वफल्कतनयोऽध्वनि"
      - "रथेन गोकुलं प्राप्तः सूर्यश्चास्तगिरिं नृप"
    iast: "iti sañcintayan kṛṣṇaṃ śvaphalka-tanayo 'dhvani | rathena gokulaṃ prāptaḥ sūryaś cāsta-giriṃ nṛpa"
  - id: '10.38.34'
    kind: verse
    lines:
      - "रथात्तूर्णमवप्लुत्य सोऽक्रूरः स्नेहविह्वलः"
      - "पपात चरणोपान्ते दण्डवद्रामकृष्णयोः"
    iast: "rathāt tūrṇam avaplutya so 'krūraḥ sneha-vihvalaḥ | papāta caraṇopānte daṇḍa-vad rāma-kṛṣṇayoḥ"
  - id: '10.38.35'
    kind: verse
    lines:
      - "भगवद्दर्शनाह्लाद बाष्पपर्याकुलेक्षणः"
      - "पुलकचिताङ्ग औत्कण्ठ्यात्स्वाख्याने नाशकन्नृप"
    iast: "bhagavad-darśanāhlāda- bāṣpa-paryākulekṣaṇaḥ | pulakacitāṅga autkaṇṭhyāt svākhyāne nāśakan nṛpa"
  - id: '10.38.36'
    kind: verse
    lines:
      - "भगवांस्तमभिप्रेत्य रथाङ्गाङ्कितपाणिना"
      - "परिरेभेऽभ्युपाकृष्य प्रीतः प्रणतवत्सलः"
    iast: "bhagavāṃs tam abhipretya rathāṅgāṅkita-pāṇinā | parirebhe 'bhyupākṛṣya prītaḥ praṇata-vatsalaḥ"
  - id: '10.38.37'
    kind: verse
    lines:
      - "सङ्कर्षणश्च प्रणतमुपगुह्य महामनाः"
      - "गृहीत्वा पाणिना पाणी अनयत्सानुजो गृहम्"
    iast: "saṅkarṣaṇaś ca praṇatam upaguhya mahā-manāḥ | gṛhītvā pāṇinā pāṇī anayat sānujo gṛham"
  - id: '10.39.1'
    kind: verse
    lines:
      - "सुखोपविष्टः पर्यङ्के रमकृष्णोरुमानितः"
      - "लेभे मनोरथान्सर्वान्पथि यान्स चकार ह"
    iast: "sukhopaviṣṭaḥ paryaṅke rama-kṛṣṇoru-mānitaḥ | lebhe manorathān sarvān pathi yān sa cakāra ha"
  - id: '10.39.8'
    kind: verse
    lines:
      - "पृष्टो भगवता सर्वं वर्णयामास माधवः"
      - "वैरानुबन्धं यदुषु वसुदेववधोद्यमम्"
    iast: "pṛṣṭo bhagavatā sarvaṃ varṇayām āsa mādhavaḥ | vairānubandhaṃ yaduṣu vasudeva-vadhodyamam"
  - id: '10.39.11'
    kind: verse
    lines:
      - "गोपान्समादिशत्सोऽपि गृह्यतां सर्वगोरसः"
      - "उपायनानि गृह्णीध्वं युज्यन्तां शकटानि च"
    iast: "gopān samādiśat so 'pi gṛhyatāṃ sarva-go-rasaḥ | upāyanāni gṛhṇīdhvaṃ yujyantāṃ śakaṭāni ca"
  - id: '10.39.12'
    kind: verse
    lines:
      - "यास्यामः श्वो मधुपुरीं दास्यामो नृपते रसान्"
      - "द्रक्ष्यामः सुमहत्पर्व यान्ति जानपदाः किल"
      - "एवमाघोषयत्क्षत्रा नन्दगोपः स्वगोकुले"
    iast: "yāsyāmaḥ śvo madhu-purīṃ dāsyāmo nṛpate rasān | drakṣyāmaḥ su-mahat parva yānti jānapadāḥ kila | evam āghoṣayat kṣatrā nanda-gopaḥ sva-gokule"
  - id: '10.39.40'
    kind: verse
    lines:
      - "अक्रूरस्तावुपामन्त्र्य निवेश्य च रथोपरि"
      - "कालिन्द्या ह्रदमागत्य स्नानं विधिवदाचरत्"
    iast: "akrūras tāv upāmantrya niveśya ca rathopari | kālindyā hradam āgatya snānaṃ vidhi-vad ācarat"
  - id: '10.39.41'
    kind: verse
    lines:
      - "निमज्ज्य तस्मिन्सलिले जपन्ब्रह्म सनातनम्"
      - "तावेव ददृशेऽक्रूरो रामकृष्णौ समन्वितौ"
    iast: "nimajjya tasmin salile japan brahma sanātanam | tāv eva dadṛśe 'krūro rāma-kṛṣṇau samanvitau"
  - id: '10.39.46'
    kind: verse
    lines:
      - "तस्योत्सङ्गे घनस्यामं पीतकौशेयवाससम्"
      - "पुरुषं चतुर्भुजं शान्तम्पद्मपत्रारुणेक्षणम्"
    iast: "tasyotsaṅge ghana-syāmaṃ pīta-kauśeya-vāsasam | puruṣaṃ catur-bhujaṃ śāntam padma-patrāruṇekṣaṇam"
  - id: '10.39.57'
    kind: verse
    lines:
      - "गिरा गद्गदयास्तौषीत्सत्त्वमालम्ब्य सात्वतः"
      - "प्रणम्य मूर्ध्नावहितः कृताञ्जलिपुटः शनैः"
    iast: "girā gadgadayāstauṣīt sattvam ālambya sātvataḥ | praṇamya mūrdhnāvahitaḥ kṛtāñjali-puṭaḥ śanaiḥ"
  - id: '10.41.1'
    kind: verse
    lines:
      - "स्तुवतस्तस्य भगवान्दर्शयित्वा जले वपुः"
      - "भूयः समाहरत्कृष्णो नटो नाट्यमिवात्मनः"
    iast: "stuvatas tasya bhagavān darśayitvā jale vapuḥ | bhūyaḥ samāharat kṛṣṇo naṭo nāṭyam ivātmanaḥ"
  - id: '10.41.3'
    kind: verse
    lines:
      - "तमपृच्छद्धृषीकेशः किं ते दृष्टमिवाद्भुतम्"
      - "भूमौ वियति तोये वा तथा त्वां लक्षयामहे"
    iast: "tam apṛcchad dhṛṣīkeśaḥ kiṃ te dṛṣṭam ivādbhutam | bhūmau viyati toye vā tathā tvāṃ lakṣayāmahe"
  - id: '10.41.4'
    kind: verse
    lines:
      - "अद्भुतानीह यावन्ति भूमौ वियति वा जले"
      - "त्वयि विश्वात्मके तानि किं मेऽदृष्टं विपश्यतः"
    iast: "adbhutānīha yāvanti bhūmau viyati vā jale | tvayi viśvātmake tāni kiṃ me 'dṛṣṭaṃ vipaśyataḥ"
  - id: '10.41.6'
    kind: verse
    lines:
      - "इत्युक्त्वा चोदयामास स्यन्दनं गान्दिनीसुतः"
      - "मथुरामनयद्रामं कृष्णं चैव दिनात्यये"
    iast: "ity uktvā codayām āsa syandanaṃ gāndinī-sutaḥ | mathurām anayad rāmaṃ kṛṣṇaṃ caiva dinātyaye"
  - id: '10.41.8'
    kind: verse
    lines:
      - "तावद्व्रजौकसस्तत्र नन्दगोपादयोऽग्रतः"
      - "पुरोपवनमासाद्य प्रतीक्षन्तोऽवतस्थिरे"
    iast: "tāvad vrajaukasas tatra nanda-gopādayo 'grataḥ | puropavanam āsādya pratīkṣanto 'vatasthire"
  - id: '10.41.10'
    kind: verse
    lines:
      - "भवान्प्रविशतामग्रे सहयानः पुरीं गृहम्"
      - "वयं त्विहावमुच्याथ ततो द्रक्ष्यामहे पुरीम्"
    iast: "bhavān praviśatām agre saha-yānaḥ purīṃ gṛham | vayaṃ tv ihāvamucyātha tato drakṣyāmahe purīm"
  - id: '10.41.17'
    kind: verse
    lines:
      - "आयास्ये भवतो गेहमहमर्यसमन्वितः"
      - "यदुचक्रद्रुहं हत्वा वितरिष्ये सुहृत्प्रियम्"
    iast: "āyāsye bhavato geham aham arya-samanvitaḥ | yadu-cakra-druhaṃ hatvā vitariṣye suhṛt-priyam"
  - id: '10.41.18'
    kind: verse
    lines:
      - "एवमुक्तो भगवता सोऽक्रूरो विमना इव"
      - "पुरीं प्रविष्टः कंसाय कर्मावेद्य गृहं ययौ"
    iast: "evam ukto bhagavatā so 'krūro vimanā iva | purīṃ praviṣṭaḥ kaṃsāya karmāvedya gṛhaṃ yayau"
  - id: '10.41.29'
    kind: verse
    lines:
      - "प्रासादशिखरारूढाः प्रीत्युत्फुल्लमुखाम्बुजाः"
      - "अभ्यवर्षन्सौमनस्यैः प्रमदा बलकेशवौ"
    iast: "prāsāda-śikharārūḍhāḥ prīty-utphulla-mukhāmbujāḥ | abhyavarṣan saumanasyaiḥ pramadā bala-keśavau"
  - id: '10.42.15'
    kind: verse
    lines:
      - "ततः पौरान्पृच्छमानो धनुषः स्थानमच्युतः"
      - "तस्मिन्प्रविष्टो ददृशे धनुरैन्द्रमिवाद्भुतम्"
    iast: "tataḥ paurān pṛcchamāno dhanuṣaḥ sthānam acyutaḥ | tasmin praviṣṭo dadṛśe dhanur aindram ivādbhutam"
  - id: '10.42.16'
    kind: verse
    lines:
      - "पुरुषैर्बहुभिर्गुप्तमर्चितं परमर्द्धिमत्"
      - "वार्यमाणो नृभिः कृष्णः प्रसह्य धनुराददे"
    iast: "puruṣair bahubhir guptam arcitaṃ paramarddhimat | vāryamāṇo nṛbhiḥ kṛṣṇaḥ prasahya dhanur ādade"
  - id: '10.42.18'
    kind: verse
    lines:
      - "धनुषो भज्यमानस्य शब्दः खं रोदसी दिशः"
      - "पूरयामास यं श्रुत्वा कंसस्त्रासमुपागमत्"
    iast: "dhanuṣo bhajyamānasya śabdaḥ khaṃ rodasī diśaḥ | pūrayām āsa yaṃ śrutvā kaṃsas trāsam upāgamat"
  - id: '10.42.19'
    kind: verse
    lines:
      - "तद्रक्षिणः सानुचरं कुपिता आततायिनः"
      - "गृहीतुकामा आवव्रुर्गृह्यतां वध्यतामिति"
    iast: "tad-rakṣiṇaḥ sānucaraṃ kupitā ātatāyinaḥ | gṛhītu-kāmā āvavrur gṛhyatāṃ vadhyatām iti"
  - id: '10.42.20'
    kind: verse
    lines:
      - "अथ तान्दुरभिप्रायान्विलोक्य बलकेशवौ"
      - "क्रुद्धौ धन्वन आदाय शकले तांश्च जघ्नतुः"
    iast: "atha tān durabhiprāyān vilokya bala-keśavau | kruddhau dhanvana ādāya śakale tāṃś ca jaghnatuḥ"
  - id: '10.42.21'
    kind: verse
    lines:
      - "बलं च कंसप्रहितं हत्वा शालामुखात्ततः"
      - "निष्क्रम्य चेरतुर्हृष्टौ निरीक्ष्य पुरसम्पदः"
    iast: "balaṃ ca kaṃsa-prahitaṃ hatvā śālā-mukhāt tataḥ | niṣkramya ceratur hṛṣṭau nirīkṣya pura-sampadaḥ"
  - id: '10.42.23'
    kind: verse
    lines:
      - "तयोर्विचरतोः स्वैरमादित्योऽस्तमुपेयिवान्"
      - "कृष्णरामौ वृतौ गोपैः पुराच्छकटमीयतुः"
    iast: "tayor vicaratoḥ svairam ādityo 'stam upeyivān | kṛṣṇa-rāmau vṛtau gopaiḥ purāc chakaṭam īyatuḥ"
  - id: '10.42.25'
    kind: verse
    lines:
      - "अवनिक्ताङ्घ्रियुगलौ भुक्त्वा क्षीरोपसेचनम्"
      - "ऊषतुस्तां सुखं रात्रिं ज्ञात्वा कंसचिकीर्षितम्"
    iast: "avaniktāṅghri-yugalau bhuktvā kṣīropasecanam | ūṣatus tāṃ sukhaṃ rātriṃ jñātvā kaṃsa-cikīrṣitam"
  - id: '10.42.27'
    kind: verse
    lines:
      - "दीर्घप्रजागरो भीतो दुर्निमित्तानि दुर्मतिः"
      - "बहून्यचष्टोभयथा मृत्योर्दौत्यकराणि च"
    iast: "dīrgha-prajāgaro bhīto durnimittāni durmatiḥ | bahūny acaṣṭobhayathā mṛtyor dautya-karāṇi ca"
  - id: '10.42.31'
    kind: verse
    lines:
      - "अन्यानि चेत्थंभूतानि स्वप्नजागरितानि च"
      - "पश्यन्मरणसन्त्रस्तो निद्रां लेभे न चिन्तया"
    iast: "anyāni cetthaṃ-bhūtāni svapna-jāgaritāni ca | paśyan maraṇa-santrasto nidrāṃ lebhe na cintayā"
  - id: '10.42.32'
    kind: verse
    lines:
      - "व्युष्टायां निशि कौरव्य सूर्ये चाद्भ्यः समुत्थिते"
      - "कारयामास वै कंसो मल्लक्रीडामहोत्सवम्"
    iast: "vyuṣṭāyāṃ niśi kauravya sūrye cādbhyaḥ samutthite | kārayām āsa vai kaṃso malla-krīḍā-mahotsavam"
  - id: '10.42.34'
    kind: verse
    lines:
      - "तेषु पौरा जानपदा ब्रह्मक्षत्रपुरोगमाः"
      - "यथोपजोषं विविशू राजानश्च कृतासनाः"
    iast: "teṣu paurā jānapadā brahma-kṣatra-purogamāḥ | yathopajoṣaṃ viviśū rājānaś ca kṛtāsanāḥ"
  - id: '10.42.35'
    kind: verse
    lines:
      - "कंसः परिवृतोऽमात्यै राजमञ्च उपाविशत्"
      - "मण्डलेश्वरमध्यस्थो हृदयेन विदूयता"
    iast: "kaṃsaḥ parivṛto 'mātyai rāja-mañca upāviśat | maṇḍaleśvara-madhya-stho hṛdayena vidūyatā"
  - id: '10.42.36'
    kind: verse
    lines:
      - "वाद्यमानेसु तूर्येषु मल्लतालोत्तरेषु च"
      - "मल्लाः स्वलङ्कृताः दृप्ताः सोपाध्यायाः समासत"
    iast: "vādyamānesu tūryeṣu malla-tālottareṣu ca | mallāḥ sv-alaṅkṛtāḥ dṛptāḥ sopādhyāyāḥ samāsata"
  - id: '10.42.37'
    kind: verse
    lines:
      - "चाणूरो मुष्टिकः कूतः शलस्तोशल एव च"
      - "त आसेदुरुपस्थानं वल्गुवाद्यप्रहर्षिताः"
    iast: "cāṇūro muṣṭikaḥ kūtaḥ śalas tośala eva ca | ta āsedur upasthānaṃ valgu-vādya-praharṣitāḥ"
  - id: '10.42.38'
    kind: verse
    lines:
      - "नन्दगोपादयो गोपा भोजराजसमाहुताः"
      - "निवेदितोपायनास्त एकस्मिन्मञ्च आविशन्"
    iast: "nanda-gopādayo gopā bhoja-rāja-samāhutāḥ | niveditopāyanās ta ekasmin mañca āviśan"
  - id: '10.43.1'
    kind: verse
    lines:
      - "अथ कृष्णश्च रामश्च कृतशौचौ परन्तप"
      - "मल्लदुन्दुभिनिर्घोषं श्रुत्वा द्रष्टुमुपेयतुः"
    iast: "atha kṛṣṇaś ca rāmaś ca kṛta-śaucau parantapa | malla-dundubhi-nirghoṣaṃ śrutvā draṣṭum upeyatuḥ"
  - id: '10.43.2'
    kind: verse
    lines:
      - "रङ्गद्वारं समासाद्य तस्मिन्नागमवस्थितम्"
      - "अपश्यत्कुवलयापीडं कृष्णोऽम्बष्ठप्रचोदितम्"
    iast: "raṅga-dvāraṃ samāsādya tasmin nāgam avasthitam | apaśyat kuvalayāpīḍaṃ kṛṣṇo 'mbaṣṭha-pracoditam"
  - id: '10.43.13'
    kind: verse
    lines:
      - "तमापतन्तमासाद्य भगवान्मधुसूदनः"
      - "निगृह्य पाणिना हस्तं पातयामास भूतले"
    iast: "tam āpatantam āsādya bhagavān madhusūdanaḥ | nigṛhya pāṇinā hastaṃ pātayām āsa bhū-tale"
  - id: '10.43.14'
    kind: verse
    lines:
      - "पतितस्य पदाक्रम्य मृगेन्द्र इव लीलया"
      - "दन्तमुत्पाट्य तेनेभं हस्तिपांश्चाहनद्धरिः"
    iast: "patitasya padākramya mṛgendra iva līlayā | dantam utpāṭya tenebhaṃ hastipāṃś cāhanad dhariḥ"
  - id: '10.43.16'
    kind: verse
    lines:
      - "वृतौ गोपैः कतिपयैर्बलदेवजनार्दनौ"
      - "रङ्गं विविशतू राजन्गजदन्तवरायुधौ"
    iast: "vṛtau gopaiḥ katipayair baladeva-janārdanau | raṅgaṃ viviśatū rājan gaja-danta-varāyudhau"
  - id: '10.43.31'
    kind: verse
    lines:
      - "जनेष्वेवं ब्रुवाणेषु तूर्येषु निनदत्सु च"
      - "कृष्णरामौ समाभाष्य चाणूरो वाक्यमब्रवीत्"
    iast: "janeṣv evaṃ bruvāṇeṣu tūryeṣu ninadatsu ca | kṛṣṇa-rāmau samābhāṣya cāṇūro vākyam abravīt"
  - id: '10.43.32'
    kind: verse
    lines:
      - "हे नन्दसूनो हे राम भवन्तौ वीरसम्मतौ"
      - "नियुद्धकुशलौ श्रुत्वा राज्ञाहूतौ दिदृक्षुणा"
    iast: "he nanda-sūno he rāma bhavantau vīra-sammatau | niyuddha-kuśalau śrutvā rājñāhūtau didṛkṣuṇā"
  - id: '10.44.2'
    kind: verse
    lines:
      - "हस्ताभ्यां हस्तयोर्बद्ध्वा पद्भ्यामेव च पादयोः"
      - "विचकर्षतुरन्योन्यं प्रसह्य विजिगीषया"
    iast: "hastābhyāṃ hastayor baddhvā padbhyām eva ca pādayoḥ | vicakarṣatur anyonyaṃ prasahya vijigīṣayā"
  - id: '10.44.24'
    kind: verse
    lines:
      - "तथैव मुष्टिकः पूर्वं स्वमुष्ट्याभिहतेन वै"
      - "बलभद्रेण बलिना तलेनाभिहतो भृशम्"
    iast: "tathaiva muṣṭikaḥ pūrvaṃ sva-muṣṭyābhihatena vai | balabhadreṇa balinā talenābhihato bhṛśam"
  - id: '10.44.34'
    kind: verse
    lines:
      - "एवं विकत्थमाने वै कंसे प्रकुपितोऽव्ययः"
      - "लघिम्नोत्पत्य तरसा मञ्चमुत्तुङ्गमारुहत्"
    iast: "evaṃ vikatthamāne vai kaṃse prakupito 'vyayaḥ | laghimnotpatya tarasā mañcam uttuṅgam āruhat"
  - id: '10.44.35'
    kind: verse
    lines:
      - "तमाविशन्तमालोक्य मृत्युमात्मन आसनात्"
      - "मनस्वी सहसोत्थाय जगृहे सोऽसिचर्मणी"
    iast: "tam āviśantam ālokya mṛtyum ātmana āsanāt | manasvī sahasotthāya jagṛhe so 'si-carmaṇī"
  - id: '10.44.36'
    kind: verse
    lines:
      - "तं खड्गपाणिं विचरन्तमाशु श्येनं यथा दक्षिणसव्यमम्बरे"
      - "समग्रहीद्दुर्विषहोग्रतेजा यथोरगं तार्क्ष्यसुतः प्रसह्य"
    iast: "taṃ khaḍga-pāṇiṃ vicarantam āśu śyenaṃ yathā dakṣiṇa-savyam ambare | samagrahīd durviṣahogra-tejā yathoragaṃ tārkṣya-sutaḥ prasahya"
  - id: '10.44.37'
    kind: verse
    lines:
      - "प्रगृह्य केशेषु चलत्किरीतं निपात्य रङ्गोपरि तुङ्गमञ्चात्"
      - "तस्योपरिष्टात्स्वयमब्जनाभः पपात विश्वाश्रय आत्मतन्त्रः"
    iast: "pragṛhya keśeṣu calat-kirītaṃ nipātya raṅgopari tuṅga-mañcāt | tasyopariṣṭāt svayam abja-nābhaḥ papāta viśvāśraya ātma-tantraḥ"
  - id: '10.44.38'
    kind: verse
    lines:
      - "तं सम्परेतं विचकर्ष भूमौ हरिर्यथेभं जगतो विपश्यतः"
      - "हा हेति शब्दः सुमहांस्तदाभूदुदीरितः सर्वजनैर्नरेन्द्र"
    iast: "taṃ samparetaṃ vicakarṣa bhūmau harir yathebhaṃ jagato vipaśyataḥ | hā heti śabdaḥ su-mahāṃs tadābhūd udīritaḥ sarva-janair narendra"
  - id: '10.44.50'
    kind: verse
    lines:
      - "मातरं पितरं चैव मोचयित्वाथ बन्धनात्"
      - "कृष्णरामौ ववन्दाते शिरसा स्पृश्य पादयोः"
    iast: "mātaraṃ pitaraṃ caiva mocayitvātha bandhanāt | kṛṣṇa-rāmau vavandāte śirasā spṛśya pādayoḥ"
  - id: '10.44.51'
    kind: verse
    lines:
      - "देवकी वसुदेवश्च विज्ञाय जगदीश्वरौ"
      - "कृतसंवन्दनौ पुत्रौ सस्वजाते न शङ्कितौ"
    iast: "devakī vasudevaś ca vijñāya jagad-īśvarau | kṛta-saṃvandanau putrau sasvajāte na śaṅkitau"
  - id: '10.45.12'
    kind: verse
    lines:
      - "एवमाश्वास्य पितरौ भगवान्देवकीसुतः"
      - "मातामहं तूग्रसेनं यदूनामकरोन्णृपम्"
    iast: "evam āśvāsya pitarau bhagavān devakī-sutaḥ | mātāmahaṃ tūgrasenaṃ yadūnām akaron ṇṛpam"
  - id: '10.45.15'
    kind: verse
    lines:
      - "सर्वान्स्वान्ज्ञतिसम्बन्धान्दिग्भ्यः कंसभयाकुलान्"
      - "यदुवृष्ण्यन्धकमधु दाशार्हकुकुरादिकान्"
    iast: "sarvān svān jñati-sambandhān digbhyaḥ kaṃsa-bhayākulān | yadu-vṛṣṇy-andhaka-madhu dāśārha-kukurādikān"
  - id: '10.45.20'
    kind: verse
    lines:
      - "अथ नन्दं समसाद्य भगवान्देवकीसुतः"
      - "सङ्कर्षणश्च राजेन्द्र परिष्वज्येदमूचतुः"
    iast: "atha nandaṃ samasādya bhagavān devakī-sutaḥ | saṅkarṣaṇaś ca rājendra pariṣvajyedam ūcatuḥ"
  - id: '10.45.29'
    kind: verse
    lines:
      - "ततश्च लब्धसंस्कारौ द्विजत्वं प्राप्य सुव्रतौ"
      - "गर्गाद्यदुकुलाचार्याद्गायत्रं व्रतमास्थितौ"
    iast: "tataś ca labdha-saṃskārau dvijatvaṃ prāpya su-vratau | gargād yadu-kulācāryād gāyatraṃ vratam āsthitau"
  - id: '10.45.31'
    kind: verse
    lines:
      - "अथो गुरुकुले वासमिच्छन्तावुपजग्मतुः"
      - "काश्यं सान्दीपनिं नाम ह्यवन्तिपुरवासिनम्"
    iast: "atho guru-kule vāsam icchantāv upajagmatuḥ | kāśyaṃ sāndīpaniṃ nāma hy avanti-pura-vāsinam"
  - id: '10.46.1'
    kind: verse
    lines:
      - "वृष्णीनां प्रवरो मन्त्री कृष्णस्य दयितः सखा"
      - "शिष्यो बृहस्पतेः साक्षादुद्धवो बुद्धिसत्तमः"
    iast: "vṛṣṇīnāṃ pravaro mantrī kṛṣṇasya dayitaḥ sakhā | śiṣyo bṛhaspateḥ sākṣād uddhavo buddhi-sattamaḥ"
  - id: '10.46.2'
    kind: verse
    lines:
      - "तमाह भगवान्प्रेष्ठं भक्तमेकान्तिनं क्वचित्"
      - "गृहीत्वा पाणिना पाणिं प्रपन्नार्तिहरो हरिः"
    iast: "tam āha bhagavān preṣṭhaṃ bhaktam ekāntinaṃ kvacit | gṛhītvā pāṇinā pāṇiṃ prapannārti-haro hariḥ"
  - id: '10.46.3'
    kind: verse
    lines:
      - "गच्छोद्धव व्रजं सौम्य पित्रोर्नौ प्रीतिमावह"
      - "गोपीनां मद्वियोगाधिं मत्सन्देशैर्विमोचय"
    iast: "gacchoddhava vrajaṃ saumya pitror nau prītim āvaha | gopīnāṃ mad-viyogādhiṃ mat-sandeśair vimocaya"
  - id: '10.46.7'
    kind: verse
    lines:
      - "इत्युक्त उद्धवो राजन्सन्देशं भर्तुरादृतः"
      - "आदाय रथमारुह्य प्रययौ नन्दगोकुलम्"
    iast: "ity ukta uddhavo rājan sandeśaṃ bhartur ādṛtaḥ | ādāya ratham āruhya prayayau nanda-gokulam"
  - id: '10.46.14'
    kind: verse
    lines:
      - "तमागतं समागम्य कृष्णस्यानुचरं प्रियम्"
      - "नन्दः प्रीतः परिष्वज्य वासुदेवधियार्चयत्"
    iast: "tam āgataṃ samāgamya kṛṣṇasyānucaraṃ priyam | nandaḥ prītaḥ pariṣvajya vāsudeva-dhiyārcayat"
  - id: '10.46.18'
    kind: verse
    lines:
      - "अपि स्मरति नः कृष्णो मातरं सुहृदः सखीन्"
      - "गोपान्व्रजं चात्मनाथं गावो वृन्दावनं गिरिम्"
    iast: "api smarati naḥ kṛṣṇo mātaraṃ suhṛdaḥ sakhīn | gopān vrajaṃ cātma-nāthaṃ gāvo vṛndāvanaṃ girim"
  - id: '10.46.21'
    kind: verse
    lines:
      - "स्मरतां कृष्णवीर्याणि लीलापाङ्गनिरीक्षितम्"
      - "हसितं भाषितं चाङ्ग सर्वा नः शिथिलाः क्रियाः"
    iast: "smaratāṃ kṛṣṇa-vīryāṇi līlāpāṅga-nirīkṣitam | hasitaṃ bhāṣitaṃ cāṅga sarvā naḥ śithilāḥ kriyāḥ"
  - id: '10.46.22'
    kind: verse
    lines:
      - "सरिच्छैलवनोद्देशान्मुकुन्दपदभूषितान्"
      - "आक्रीडानीक्ष्यमाणानां मनो याति तदात्मताम्"
    iast: "saric-chaila-vanoddeśān mukunda-pada-bhūṣitān | ākrīḍān īkṣyamāṇānāṃ mano yāti tad-ātmatām"
  - id: '10.46.36'
    kind: verse
    lines:
      - "मा खिद्यतं महाभागौ द्रक्ष्यथः कृष्णमन्तिके"
      - "अन्तर्हृदि स भूतानामास्ते ज्योतिरिवैधसि"
    iast: "mā khidyataṃ mahā-bhāgau drakṣyathaḥ kṛṣṇam antike | antar hṛdi sa bhūtānām āste jyotir ivaidhasi"
  - id: '10.46.37'
    kind: verse
    lines:
      - "न ह्यस्यास्ति प्रियः कश्चिन्नाप्रियो वास्त्यमानिनः"
      - "नोत्तमो नाधमो वापि समानस्यासमोऽपि वा"
    iast: "na hy asyāsti priyaḥ kaścin nāpriyo vāsty amāninaḥ | nottamo nādhamo vāpi sa-mānasyāsamo 'pi vā"
  - id: '10.46.42'
    kind: verse
    lines:
      - "युवयोरेव नैवायमात्मजो भगवान्हरिः"
      - "सर्वेषामात्मजो ह्यात्मा पिता माता स ईश्वरः"
    iast: "yuvayor eva naivāyam ātmajo bhagavān hariḥ | sarveṣām ātmajo hy ātmā pitā mātā sa īśvaraḥ"
  - id: '10.47.4'
    kind: verse
    lines:
      - "जानीमस्त्वां यदुपतेः पार्षदं समुपागतम्"
      - "भर्त्रेह प्रेषितः पित्रोर्भवान्प्रियचिकीर्षया"
    iast: "jānīmas tvāṃ yadu-pateḥ pārṣadaṃ samupāgatam | bhartreha preṣitaḥ pitror bhavān priya-cikīrṣayā"
  - id: '10.47.23'
    kind: verse
    lines:
      - "अहो यूयं स्म पूर्णार्था भवत्यो लोकपूजिताः"
      - "वासुदेवे भगवति यासामित्यर्पितं मनः"
    iast: "aho yūyaṃ sma pūrṇārthā bhavatyo loka-pūjitāḥ | vāsudeve bhagavati yāsām ity arpitaṃ manaḥ"
  - id: '10.47.24'
    kind: verse
    lines:
      - "दानव्रततपोहोम जपस्वाध्यायसंयमैः"
      - "श्रेयोभिर्विविधैश्चान्यैः कृष्णे भक्तिर्हि साध्यते"
    iast: "dāna-vrata-tapo-homa japa-svādhyāya-saṃyamaiḥ | śreyobhir vividhaiś cānyaiḥ kṛṣṇe bhaktir hi sādhyate"
  - id: '10.47.28'
    kind: verse
    lines:
      - "श्रूयतां प्रियसन्देशो भवतीनां सुखावहः"
      - "यमादायागतो भद्रा अहं भर्तू रहस्करः"
    iast: "śrūyatāṃ priya-sandeśo bhavatīnāṃ sukhāvahaḥ | yam ādāyāgato bhadrā ahaṃ bhartū rahas-karaḥ"
  - id: '10.47.34'
    kind: verse
    lines:
      - "यत्त्वहं भवतीनां वै दूरे वर्ते प्रियो दृशाम्"
      - "मनसः सन्निकर्षार्थं मदनुध्यानकाम्यया"
    iast: "yat tv ahaṃ bhavatīnāṃ vai dūre varte priyo dṛśām | manasaḥ sannikarṣārthaṃ mad-anudhyāna-kāmyayā"
  - id: '10.47.35'
    kind: verse
    lines:
      - "यथा दूरचरे प्रेष्ठे मन आविश्य वर्तते"
      - "स्त्रीणां च न तथा चेतः सन्निकृष्टेऽक्षिगोचरे"
    iast: "yathā dūra-care preṣṭhe mana āviśya vartate | strīṇāṃ ca na tathā cetaḥ sannikṛṣṭe 'kṣi-gocare"
  - id: '10.47.36'
    kind: verse
    lines:
      - "मय्यावेश्य मनः कृत्स्नं विमुक्ताशेषवृत्ति यत्"
      - "अनुस्मरन्त्यो मां नित्यमचिरान्मामुपैष्यथ"
    iast: "mayy āveśya manaḥ kṛtsnaṃ vimuktāśeṣa-vṛtti yat | anusmarantyo māṃ nityam acirān mām upaiṣyatha"
  - id: '10.47.64'
    kind: verse
    lines:
      - "अथ गोपीरनुज्ञाप्य यशोदां नन्दमेव च"
      - "गोपानामन्त्र्य दाशार्हो यास्यन्नारुरुहे रथम्"
    iast: "atha gopīr anujñāpya yaśodāṃ nandam eva ca | gopān āmantrya dāśārho yāsyann āruruhe ratham"
  - id: '10.47.68'
    kind: verse
    lines:
      - "एवं सभाजितो गोपैः कृष्णभक्त्या नराधिप"
      - "उद्धवः पुनरागच्छन्मथुरां कृष्णपालिताम्"
    iast: "evaṃ sabhājito gopaiḥ kṛṣṇa-bhaktyā narādhipa | uddhavaḥ punar āgacchan mathurāṃ kṛṣṇa-pālitām"
  - id: '10.52.21'
    kind: verse
    lines:
      - "राजासीद्भीष्मको नाम विदर्भाधिपतिर्महान्"
      - "तस्य पन्चाभवन्पुत्राः कन्यैका च वरानना"
    iast: "rājāsīd bhīṣmako nāma vidarbhādhipatir mahān | tasya pancābhavan putrāḥ kanyaikā ca varānanā"
  - id: '10.52.23'
    kind: verse
    lines:
      - "सोपश्रुत्य मुकुन्दस्य रूपवीर्यगुणश्रियः"
      - "गृहागतैर्गीयमानास्तं मेने सदृशं पतिम्"
    iast: "sopaśrutya mukundasya rūpa-vīrya-guṇa-śriyaḥ | gṛhāgatair gīyamānās taṃ mene sadṛśaṃ patim"
  - id: '10.52.25'
    kind: verse
    lines:
      - "बन्धूनामिच्छतां दातुं कृष्णाय भगिनीं नृप"
      - "ततो निवार्य कृष्णद्विड्रुक्मी चैद्यममन्यत"
    iast: "bandhūnām icchatāṃ dātuṃ kṛṣṇāya bhaginīṃ nṛpa | tato nivārya kṛṣṇa-dviḍ rukmī caidyam amanyata"
  - id: '10.52.26'
    kind: verse
    lines:
      - "तदवेत्यासितापाङ्गी वैदर्भी दुर्मना भृशम्"
      - "विचिन्त्याप्तं द्विजं कञ्चित्कृष्णाय प्राहिणोद्द्रुतम्"
    iast: "tad avetyāsitāpāṅgī vaidarbhī durmanā bhṛśam | vicintyāptaṃ dvijaṃ kañcit kṛṣṇāya prāhiṇod drutam"
  - id: '10.52.27'
    kind: verse
    lines:
      - "द्वारकां स समभ्येत्य प्रतीहारैः प्रवेशितः"
      - "अपश्यदाद्यं पुरुषमासीनं काञ्चनासने"
    iast: "dvārakāṃ sa samabhyetya pratīhāraiḥ praveśitaḥ | apaśyad ādyaṃ puruṣam āsīnaṃ kāñcanāsane"
  - id: '10.52.37'
    kind: verse
    lines:
      - "श्रुत्वा गुणान्भुवनसुन्दर शृण्वतां ते निर्विश्य कर्णविवरैर्हरतोऽङ्गतापम्"
      - "रूपं दृशां दृशिमतामखिलार्थलाभं त्वय्यच्युताविशति चित्तमपत्रपं मे"
    iast: "śrutvā guṇān bhuvana-sundara śṛṇvatāṃ te nirviśya karṇa-vivarair harato 'ṅga-tāpam | rūpaṃ dṛśāṃ dṛśimatām akhilārtha-lābhaṃ tvayy acyutāviśati cittam apatrapaṃ me"
  - id: '10.52.38'
    kind: verse
    lines:
      - "का त्वा मुकुन्द महती कुलशीलरूप विद्यावयोद्रविणधामभिरात्मतुल्यम्"
      - "धीरा पतिं कुलवती न वृणीत कन्या काले नृसिंह नरलोकमनोऽभिरामम्"
    iast: "kā tvā mukunda mahatī kula-śīla-rūpa- vidyā-vayo-draviṇa-dhāmabhir ātma-tulyam | dhīrā patiṃ kulavatī na vṛṇīta kanyā kāle nṛ-siṃha nara-loka-mano-'bhirāmam"
  - id: '10.52.39'
    kind: verse
    lines:
      - "तन्मे भवान्खलु वृतः पतिरङ्ग जायामात्मार्पितश्च भवतोऽत्र विभो विधेहि"
      - "मा वीरभागमभिमर्शतु चैद्य आराद्गोमायुवन्मृगपतेर्बलिमम्बुजाक्ष"
    iast: "tan me bhavān khalu vṛtaḥ patir aṅga jāyām ātmārpitaś ca bhavato 'tra vibho vidhehi | mā vīra-bhāgam abhimarśatu caidya ārād gomāyu-van mṛga-pater balim ambujākṣa"
  - id: '10.52.41'
    kind: verse
    lines:
      - "श्वो भाविनि त्वमजितोद्वहने विदर्भान्गुप्तः समेत्य पृतनापतिभिः परीतः"
      - "निर्मथ्य चैद्यमगधेन्द्रबलं प्रसह्य मां राक्षसेन विधिनोद्वह वीर्यशुल्काम्"
    iast: "śvo bhāvini tvam ajitodvahane vidarbhān guptaḥ sametya pṛtanā-patibhiḥ parītaḥ | nirmathya caidya-magadhendra-balaṃ prasahya māṃ rākṣasena vidhinodvaha vīrya-śulkām"
  - id: '10.52.42'
    kind: verse
    lines:
      - "अन्तःपुरान्तरचरीमनिहत्य बन्धून्त्वामुद्वहे कथमिति प्रवदाम्युपायम्"
      - "पूर्वेद्युरस्ति महती कुलदेवयात्रा यस्यां बहिर्नववधूर्गिरिजामुपेयात्"
    iast: "antaḥ-purāntara-carīm anihatya bandhūn tvām udvahe katham iti pravadāmy upāyam | pūrve-dyur asti mahatī kula-deva-yātrā yasyāṃ bahir nava-vadhūr girijām upeyāt"
  - id: '10.53.1'
    kind: verse
    lines:
      - "वैदर्भ्याः स तु सन्देशं निशम्य यदुनन्दनः"
      - "प्रगृह्य पाणिना पाणिं प्रहसन्निदमब्रवीत्"
    iast: "vaidarbhyāḥ sa tu sandeśaṃ niśamya yadu-nandanaḥ | pragṛhya pāṇinā pāṇiṃ prahasann idam abravīt"
  - id: '10.53.6'
    kind: verse
    lines:
      - "आरुह्य स्यन्दनं शौरिर्द्विजमारोप्य तूर्णगैः"
      - "आनर्तादेकरात्रेण विदर्भानगमद्धयैः"
    iast: "āruhya syandanaṃ śaurir dvijam āropya tūrṇa-gaiḥ | ānartād eka-rātreṇa vidarbhān agamad dhayaiḥ"
  - id: '10.53.7'
    kind: verse
    lines:
      - "राजा स कुण्डिनपतिः पुत्रस्नेहवशानुगः"
      - "शिशुपालाय स्वां कन्यां दास्यन्कर्माण्यकारयत्"
    iast: "rājā sa kuṇḍina-patiḥ putra-sneha-vaśānugaḥ | śiśupālāya svāṃ kanyāṃ dāsyan karmāṇy akārayat"
  - id: '10.53.17'
    kind: verse
    lines:
      - "तत्र शाल्वो जरासन्धो दन्तवक्रो विदूरथः"
      - "आजग्मुश्चैद्यपक्षीयाः पौण्ड्रकाद्याः सहस्रशः"
    iast: "tatra śālvo jarāsandho dantavakro vidūrathaḥ | ājagmuś caidya-pakṣīyāḥ pauṇḍrakādyāḥ sahasraśaḥ"
  - id: '10.53.18'
    kind: verse
    lines:
      - "कृष्णरामद्विषो यत्ताः कन्यां चैद्याय साधितुम्"
      - "यद्यागत्य हरेत्कृष्नो रामाद्यैर्यदुभिर्वृतः"
    iast: "kṛṣṇa-rāma-dviṣo yattāḥ kanyāṃ caidyāya sādhitum | yady āgatya haret kṛṣno rāmādyair yadubhir vṛtaḥ"
  - id: '10.53.20'
    kind: verse
    lines:
      - "श्रुत्वैतद्भगवान्रामो विपक्षीय नृपोद्यमम्"
      - "कृष्णं चैकं गतं हर्तुं कन्यां कलहशङ्कितः"
    iast: "śrutvaitad bhagavān rāmo vipakṣīya nṛpodyamam | kṛṣṇaṃ caikaṃ gataṃ hartuṃ kanyāṃ kalaha-śaṅkitaḥ"
  - id: '10.53.21'
    kind: verse
    lines:
      - "बलेन महता सार्धं भ्रातृस्नेहपरिप्लुतः"
      - "त्वरितः कुण्डिनं प्रागाद्गजाश्वरथपत्तिभिः"
    iast: "balena mahatā sārdhaṃ bhrātṛ-sneha-pariplutaḥ | tvaritaḥ kuṇḍinaṃ prāgād gajāśva-ratha-pattibhiḥ"
  - id: '10.53.39'
    kind: verse
    lines:
      - "एवं प्रेमकलाबद्धा वदन्ति स्म पुरौकसः"
      - "कन्या चान्तःपुरात्प्रागाद्भटैर्गुप्ताम्बिकालयम्"
    iast: "evaṃ prema-kalā-baddhā vadanti sma puraukasaḥ | kanyā cāntaḥ-purāt prāgād bhaṭair guptāmbikālayam"
  - id: '10.53.45'
    kind: verse
    lines:
      - "तां वै प्रवयसो बालां विधिज्ञा विप्रयोषितः"
      - "भवानीं वन्दयां चक्रुर्भवपत्नीं भवान्विताम्"
    iast: "tāṃ vai pravayaso bālāṃ vidhi-jñā vipra-yoṣitaḥ | bhavānīṃ vandayāṃ cakrur bhava-patnīṃ bhavānvitām"
  - id: '10.53.46'
    kind: verse
    lines:
      - "नमस्ये त्वाम्बिकेऽभीक्ष्णं स्वसन्तानयुतां शिवाम्"
      - "भूयात्पतिर्मे भगवान्कृष्णस्तदनुमोदताम्"
    iast: "namasye tvāmbike 'bhīkṣṇaṃ sva-santāna-yutāṃ śivām | bhūyāt patir me bhagavān kṛṣṇas tad anumodatām"
  - id: '10.53.50'
    kind: verse
    lines:
      - "मुनिव्रतमथ त्यक्त्वा निश्चक्रामाम्बिकागृहात्"
      - "प्रगृह्य पाणिना भृत्यां रत्नमुद्रोपशोभिना"
    iast: "muni-vratam atha tyaktvā niścakrāmāmbikā-gṛhāt | pragṛhya pāṇinā bhṛtyāṃ ratna-mudropaśobhinā"
  - id: '10.53.55'
    kind: verse
    lines:
      - "उत्सार्य वामकरजैरलकानपङ्गैः प्राप्तान्ह्रियैक्षत नृपान्ददृशेऽच्युतं च"
      - "तां राजकन्यां रथमारुरक्षतीं जहार कृष्णो द्विषतां समीक्षताम्"
    iast: "utsārya vāma-karajair alakān apaṅgaiḥ prāptān hriyaikṣata nṛpān dadṛśe 'cyutaṃ ca | tāṃ rāja-kanyāṃ ratham ārurakṣatīṃ jahāra kṛṣṇo dviṣatāṃ samīkṣatām"
  - id: '10.53.56'
    kind: verse
    lines:
      - "रथं समारोप्य सुपर्णलक्षणं राजन्यचक्रं परिभूय माधवः"
      - "ततो ययौ रामपुरोगमः शनैः शृगालमध्यादिव भागहृद्धरिः"
    iast: "rathaṃ samāropya suparṇa-lakṣaṇaṃ rājanya-cakraṃ paribhūya mādhavaḥ | tato yayau rāma-purogamaḥ śanaiḥ śṛgāla-madhyād iva bhāga-hṛd dhariḥ"
  - id: '10.54.9'
    kind: verse
    lines:
      - "हन्यमानबलानीका वृष्णिभिर्जयकाङ्क्षिभिः"
      - "राजानो विमुखा जग्मुर्जरासन्धपुरःसराः"
    iast: "hanyamāna-balānīkā vṛṣṇibhir jaya-kāṅkṣibhiḥ | rājāno vimukhā jagmur jarāsandha-puraḥ-sarāḥ"
  - id: '10.59.3'
    kind: verse
    lines:
      - "सभार्यो गरुडारूढः प्राग्ज्योतिषपुरं ययौ"
      - "गिरिदुर्गैः शस्त्रदुर्गैर्जलाग्न्यनिलदुर्गमम्"
      - "मुरपाशायुतैर्घोरैर्दृढैः सर्वत आवृतम्"
    iast: "sa-bhāryo garuḍārūḍhaḥ prāg-jyotiṣa-puraṃ yayau | giri-durgaiḥ śastra-durgair jalāgny-anila-durgamam | mura-pāśāyutair ghorair dṛḍhaiḥ sarvata āvṛtam"
  - id: '10.59.6'
    kind: verse
    lines:
      - "पाञ्चजन्यध्वनिं श्रुत्वा युगान्तशनिभीषणम्"
      - "मुरः शयान उत्तस्थौ दैत्यः पञ्चशिरा जलात्"
    iast: "pāñcajanya-dhvaniṃ śrutvā yugāntaśani-bhīṣaṇam | muraḥ śayāna uttasthau daityaḥ pañca-śirā jalāt"
  - id: '10.59.21'
    kind: verse
    lines:
      - "शूलं भौमोऽच्युतं हन्तुमाददे वितथोद्यमः"
      - "तद्विसर्गात्पूर्वमेव नरकस्य शिरो हरिः"
      - "अपाहरद्गजस्थस्य चक्रेण क्षुरनेमिना"
    iast: "śūlaṃ bhaumo 'cyutaṃ hantum ādade vitathodyamaḥ | tad-visargāt pūrvam eva narakasya śiro hariḥ | apāharad gaja-sthasya cakreṇa kṣura-neminā"
  - id: '10.60.21'
    kind: verse
    lines:
      - "एतावदुक्त्वा भगवानात्मानं वल्लभामिव"
      - "मन्यमानामविश्लेषात्तद्दर्पघ्न उपारमत्"
    iast: "etāvad uktvā bhagavān ātmānaṃ vallabhām iva | manyamānām aviśleṣāt tad-darpa-ghna upāramat"
  - id: '10.60.22'
    kind: verse
    lines:
      - "इति त्रिलोकेशपतेस्तदात्मनः प्रियस्य देव्यश्रुतपूर्वमप्रियम्"
      - "आश्रुत्य भीता हृदि जातवेपथुश्चिन्तां दुरन्तां रुदती जगाम ह"
    iast: "iti trilokeśa-pates tadātmanaḥ priyasya devy aśruta-pūrvam apriyam | āśrutya bhītā hṛdi jāta-vepathuś cintāṃ durantāṃ rudatī jagāma ha"
  - id: '10.60.25'
    kind: verse
    lines:
      - "तद्दृष्ट्वा भगवान्कृष्णः प्रियायाः प्रेमबन्धनम्"
      - "हास्यप्रौढिमजानन्त्याः करुणः सोऽन्वकम्पत"
    iast: "tad dṛṣṭvā bhagavān kṛṣṇaḥ priyāyāḥ prema-bandhanam | hāsya-prauḍhim ajānantyāḥ karuṇaḥ so 'nvakampata"
  - id: '10.60.27'
    kind: verse
    lines:
      - "प्रमृज्याश्रुकले नेत्रे स्तनौ चोपहतौ शुचा"
      - "आश्लिष्य बाहुना राजननन्यविषयां सतीम्"
    iast: "pramṛjyāśru-kale netre stanau copahatau śucā | āśliṣya bāhunā rājan ananya-viṣayāṃ satīm"
  - id: '10.60.29'
    kind: verse
    lines:
      - "मा मा वैदर्भ्यसूयेथा जाने त्वां मत्परायणाम्"
      - "त्वद्वचः श्रोतुकामेन क्ष्वेल्याचरितमङ्गने"
    iast: "mā mā vaidarbhy asūyethā jāne tvāṃ mat-parāyaṇām | tvad-vacaḥ śrotu-kāmena kṣvelyācaritam aṅgane"
  - id: '10.60.30'
    kind: verse
    lines:
      - "मुखं च प्रेमसंरम्भ स्फुरिताधरमीक्षितुम्"
      - "कटाक्षेपारुणापाङ्गं सुन्दरभ्रुकुटीतटम्"
    iast: "mukhaṃ ca prema-saṃrambha- sphuritādharam īkṣitum | kaṭā-kṣepāruṇāpāṅgaṃ sundara-bhru-kuṭī-taṭam"
  - id: '10.60.34'
    kind: verse
    lines:
      - "नन्वेवमेतदरविन्दविलोचनाह यद्वै भवान्भगवतोऽसदृशी विभूम्नः"
      - "क्व स्वे महिम्न्यभिरतो भगवांस्त्र्यधीशः क्वाहं गुणप्रकृतिरज्ञगृहीतपादा"
    iast: "nanv evam etad aravinda-vilocanāha yad vai bhavān bhagavato 'sadṛśī vibhūmnaḥ | kva sve mahimny abhirato bhagavāṃs try-adhīśaḥ kvāhaṃ guṇa-prakṛtir ajña-gṛhīta-pādā"
  - id: '10.60.37'
    kind: verse
    lines:
      - "निष्किञ्चनो ननु भवान्न यतोऽस्ति किञ्चिद्यस्मै बलिं बलिभुजोऽपि हरन्त्यजाद्याः"
      - "न त्वा विदन्त्यसुतृपोऽन्तकमाढ्यतान्धाः प्रेष्ठो भवान्बलिभुजामपि तेऽपि तुभ्यम्"
    iast: "niṣkiñcano nanu bhavān na yato 'sti kiñcid yasmai baliṃ bali-bhujo 'pi haranty ajādyāḥ | na tvā vidanty asu-tṛpo 'ntakam āḍhyatāndhāḥ preṣṭho bhavān bali-bhujām api te 'pi tubhyam"
  - id: '10.60.46'
    kind: verse
    lines:
      - "अस्त्वम्बुजाक्ष मम ते चरणानुराग आत्मन्रतस्य मयि चानतिरिक्तदृष्टेः"
      - "यर्ह्यस्य वृद्धय उपात्तरजोऽतिमात्रो मामीक्षसे तदु ह नः परमानुकम्पा"
    iast: "astv ambujākṣa mama te caraṇānurāga ātman ratasya mayi cānatirikta-dṛṣṭeḥ | yarhy asya vṛddhaya upātta-rajo-'ti-mātro mām īkṣase tad u ha naḥ paramānukampā"
  - id: '10.62.2'
    kind: verse
    lines:
      - "बाणः पुत्रशतज्येष्ठो बलेरासीन्महात्मनः"
      - "येन वामनरूपाय हरयेऽदायि मेदिनी"
    iast: "bāṇaḥ putra-śata-jyeṣṭho baler āsīn mahātmanaḥ | yena vāmana-rūpāya haraye 'dāyi medinī"
  - id: '10.62.4'
    kind: verse
    lines:
      - "शोणिताख्ये पुरे रम्ये स राज्यमकरोत्पुरा"
      - "तस्य शम्भोः प्रसादेन किङ्करा इव तेऽमराः"
      - "सहस्रबाहुर्वाद्येन ताण्दवेऽतोषयन्मृडम्"
    iast: "śoṇitākhye pure ramye sa rājyam akarot purā | tasya śambhoḥ prasādena kiṅkarā iva te 'marāḥ | sahasra-bāhur vādyena tāṇdave 'toṣayan mṛḍam"
  - id: '10.62.5'
    kind: verse
    lines:
      - "भगवान्सर्वभूतेशः शरण्यो भक्तवत्सलः"
      - "वरेण छन्दयामास स तं वव्रे पुराधिपम्"
    iast: "bhagavān sarva-bhūteśaḥ śaraṇyo bhakta-vatsalaḥ | vareṇa chandayām āsa sa taṃ vavre purādhipam"
  - id: '10.62.12'
    kind: verse
    lines:
      - "तस्योषा नाम दुहिता स्वप्ने प्राद्युम्निना रतिम्"
      - "कन्यालभत कान्तेन प्रागदृष्टश्रुतेन सा"
    iast: "tasyoṣā nāma duhitā svapne prādyumninā ratim | kanyālabhata kāntena prāg adṛṣṭa-śrutena sā"
  - id: '10.62.23'
    kind: verse
    lines:
      - "तत्र सुप्तं सुपर्यङ्के प्राद्युम्निं योगमास्थिता"
      - "गृहीत्वा शोणितपुरं सख्यै प्रियमदर्शयत्"
    iast: "tatra suptaṃ su-paryaṅke prādyumniṃ yogam āsthitā | gṛhītvā śoṇita-puraṃ sakhyai priyam adarśayat"
  - id: '10.62.26'
    kind: verse
    lines:
      - "गूढः कन्यापुरे शश्वत् प्रवृद्धस्नेहया तया"
      - "नाहर्गणान्स बुबुधे ऊषयापहृतेन्द्रियः"
    iast: "gūḍhaḥ kanyā-pure śaśvat- pravṛddha-snehayā tayā | nāhar-gaṇān sa bubudhe ūṣayāpahṛtendriyaḥ"
  - id: '10.62.35'
    kind: verse
    lines:
      - "तं नागपाशैर्बलिनन्दनो बली घ्नन्तं स्वसैन्यं कुपितो बबन्ध ह"
      - "ऊषा भृशं शोकविषादविह्वला बद्धं निशम्याश्रुकलाक्ष्यरौत्सीत्"
    iast: "taṃ nāga-pāśair bali-nandano balī ghnantaṃ sva-sainyaṃ kupito babandha ha | ūṣā bhṛśaṃ śoka-viṣāda-vihvalā baddhaṃ niśamyāśru-kalākṣy arautsīt"
  - id: '10.63.2'
    kind: verse
    lines:
      - "नारदात्तदुपाकर्ण्य वार्तां बद्धस्य कर्म च"
      - "प्रययुः शोणितपुरं वृष्णयः कृष्णदैवताः"
    iast: "nāradāt tad upākarṇya vārtāṃ baddhasya karma ca | prayayuḥ śoṇita-puraṃ vṛṣṇayaḥ kṛṣṇa-daivatāḥ"
  - id: '10.63.4'
    kind: verse
    lines:
      - "अक्षौहिणीभिर्द्वादशभिः समेताः सर्वतो दिशम्"
      - "रुरुधुर्बाणनगरं समन्तात्सात्वतर्षभाः"
    iast: "akṣauhiṇībhir dvādaśabhiḥ sametāḥ sarvato diśam | rurudhur bāṇa-nagaraṃ samantāt sātvatarṣabhāḥ"
  - id: '10.63.30'
    kind: verse
    lines:
      - "इत्युक्तोऽच्युतमानम्य गतो माहेश्वरो ज्वरः"
      - "बाणस्तु रथमारूढः प्रागाद्योत्स्यन्जनार्दनम्"
    iast: "ity ukto 'cyutam ānamya gato māheśvaro jvaraḥ | bāṇas tu ratham ārūḍhaḥ prāgād yotsyan janārdanam"
  - id: '10.63.32'
    kind: verse
    lines:
      - "तस्यास्यतोऽस्त्राण्यसकृच्चक्रेण क्षुरनेमिना"
      - "चिच्छेद भगवान्बाहून्शाखा इव वनस्पतेः"
    iast: "tasyāsyato 'strāṇy asakṛc cakreṇa kṣura-neminā | ciccheda bhagavān bāhūn śākhā iva vanaspateḥ"
  - id: '10.63.47'
    kind: verse
    lines:
      - "अवध्योऽयं ममाप्येष वैरोचनिसुतोऽसुरः"
      - "प्रह्रादाय वरो दत्तो न वध्यो मे तवान्वयः"
    iast: "avadhyo 'yaṃ mamāpy eṣa vairocani-suto 'suraḥ | prahrādāya varo datto na vadhyo me tavānvayaḥ"
  - id: '10.63.50'
    kind: verse
    lines:
      - "इति लब्ध्वाभयं कृष्णं प्रणम्य शिरसासुरः"
      - "प्राद्युम्निं रथमारोप्य सवध्वो समुपानयत्"
    iast: "iti labdhvābhayaṃ kṛṣṇaṃ praṇamya śirasāsuraḥ | prādyumniṃ ratham āropya sa-vadhvo samupānayat"
  - id: '10.63.51'
    kind: verse
    lines:
      - "अक्षौहिण्या परिवृतं सुवासःसमलङ्कृतम्"
      - "सपत्नीकं पुरस्कृत्य ययौ रुद्रानुमोदितः"
    iast: "akṣauhiṇyā parivṛtaṃ su-vāsaḥ-samalaṅkṛtam | sa-patnīkaṃ puras-kṛtya yayau rudrānumoditaḥ"
  - id: '10.69.1'
    kind: verse
    lines:
      - "नरकं निहतं श्रुत्वा तथोद्वाहं च योषिताम्"
      - "कृष्णेनैकेन बह्वीनां तद्दिदृक्षुः स्म नारदः"
    iast: "narakaṃ nihataṃ śrutvā tathodvāhaṃ ca yoṣitām | kṛṣṇenaikena bahvīnāṃ tad-didṛkṣuḥ sma nāradaḥ"
  - id: '10.69.20'
    kind: verse
    lines:
      - "दीव्यन्तमक्षैस्तत्रापि प्रियया चोद्धवेन च"
      - "पूजितः परया भक्त्या प्रत्युत्थानासनादिभिः"
    iast: "dīvyantam akṣais tatrāpi priyayā coddhavena ca | pūjitaḥ parayā bhaktyā pratyutthānāsanādibhiḥ"
  - id: '10.69.21'
    kind: verse
    lines:
      - "पृष्टश्चाविदुषेवासौ कदायातो भवानिति"
      - "क्रियते किं नु पूर्णानामपूर्णैरस्मदादिभिः"
    iast: "pṛṣṭaś cāviduṣevāsau kadāyāto bhavān iti | kriyate kiṃ nu pūrṇānām apūrṇair asmad-ādibhiḥ"
  - id: '10.69.22'
    kind: verse
    lines:
      - "अथापि ब्रूहि नो ब्रह्मन्जन्मैतच्छोभनं कुरु"
      - "स तु विस्मित उत्थाय तूष्णीमन्यदगाद्गृहम्"
    iast: "athāpi brūhi no brahman janmaitac chobhanaṃ kuru | sa tu vismita utthāya tūṣṇīm anyad agād gṛham"
  - id: '10.69.23'
    kind: verse
    lines:
      - "तत्राप्यचष्ट गोविन्दं लालयन्तं सुतान्शिशून्"
      - "ततोऽन्यस्मिन्गृहेऽपश्यन्मज्जनाय कृतोद्यमम्"
    iast: "tatrāpy acaṣṭa govindaṃ lālayantaṃ sutān śiśūn | tato 'nyasmin gṛhe 'paśyan majjanāya kṛtodyamam"
  - id: '10.69.25'
    kind: verse
    lines:
      - "क्वापि सन्ध्यामुपासीनं जपन्तं ब्रह्म वाग्यतम्"
      - "एकत्र चासिचर्माभ्यां चरन्तमसिवर्त्मसु"
    iast: "kvāpi sandhyām upāsīnaṃ japantaṃ brahma vāg-yatam | ekatra cāsi-carmābhyāṃ carantam asi-vartmasu"
  - id: '10.69.26'
    kind: verse
    lines:
      - "अश्वैर्गजै रथैः क्वापि विचरन्तं गदाग्रजम्"
      - "क्वचिच्छयानं पर्यङ्के स्तूयमानं च वन्दिभिः"
    iast: "aśvair gajai rathaiḥ kvāpi vicarantaṃ gadāgrajam | kvacic chayānaṃ paryaṅke stūyamānaṃ ca vandibhiḥ"
  - id: '10.69.27'
    kind: verse
    lines:
      - "मन्त्रयन्तं च कस्मिंश्चिन्मन्त्रिभिश्चोद्धवादिभिः"
      - "जलक्रीडारतं क्वापि वारमुख्याबलावृतम्"
    iast: "mantrayantaṃ ca kasmiṃścin mantribhiś coddhavādibhiḥ | jala-krīḍā-rataṃ kvāpi vāramukhyābalāvṛtam"
  - id: '10.69.29'
    kind: verse
    lines:
      - "हसन्तं हासकथया कदाचित्प्रियया गृहे"
      - "क्वापि धर्मं सेवमानमर्थकामौ च कुत्रचित्"
    iast: "hasantaṃ hāsa-kathayā kadācit priyayā gṛhe | kvāpi dharmaṃ sevamānam artha-kāmau ca kutracit"
  - id: '10.69.37'
    kind: verse
    lines:
      - "अथोवाच हृषीकेशं नारदः प्रहसन्निव"
      - "योगमायोदयं वीक्ष्य मानुषीमीयुषो गतिम्"
    iast: "athovāca hṛṣīkeśaṃ nāradaḥ prahasann iva | yoga-māyodayaṃ vīkṣya mānuṣīm īyuṣo gatim"
  - id: '10.69.38'
    kind: verse
    lines:
      - "विदाम योगमायास्ते दुर्दर्शा अपि मायिनाम्"
      - "योगेश्वरात्मन्निर्भाता भवत्पादनिषेवया"
    iast: "vidāma yoga-māyās te durdarśā api māyinām | yogeśvarātman nirbhātā bhavat-pāda-niṣevayā"
  - id: '10.69.40'
    kind: verse
    lines:
      - "ब्रह्मन्धन्नस्य वक्ताहं कर्ता तदनुमोदिता"
      - "तच्छिक्षयन्लोकमिममास्थितः पुत्र मा खिदः"
    iast: "brahman dhannasya vaktāhaṃ kartā tad-anumoditā | tac chikṣayan lokam imam āsthitaḥ putra mā khidaḥ"
  - id: '10.70.41'
    kind: verse
    lines:
      - "यक्ष्यति त्वां मखेन्द्रेण राजसूयेन पाण्डवः"
      - "पारमेष्ठ्यकामो नृपतिस्तद्भवाननुमोदताम्"
    iast: "yakṣyati tvāṃ makhendreṇa rājasūyena pāṇḍavaḥ | pārameṣṭhya-kāmo nṛpatis tad bhavān anumodatām"
  - id: '10.71.12'
    kind: verse
    lines:
      - "अथादिशत्प्रयाणाय भगवान्देवकीसुतः"
      - "भृत्यान्दारुकजैत्रादीननुज्ञाप्य गुरून्विभुः"
    iast: "athādiśat prayāṇāya bhagavān devakī-sutaḥ | bhṛtyān dāruka-jaitrādīn anujñāpya gurūn vibhuḥ"
  - id: '10.71.23'
    kind: verse
    lines:
      - "तमुपागतमाकर्ण्य प्रीतो दुर्दर्शनं नृनाम्"
      - "अजातशत्रुर्निरगात्सोपध्यायः सुहृद्वृतः"
    iast: "tam upāgatam ākarṇya prīto durdarśanaṃ nṛnām | ajāta-śatrur niragāt sopadhyāyaḥ suhṛd-vṛtaḥ"
  - id: '10.71.25'
    kind: verse
    lines:
      - "दृष्ट्वा विक्लिन्नहृदयः कृष्णं स्नेहेन पाण्डवः"
      - "चिराद्दृष्टं प्रियतमं सस्वजेऽथ पुनः पुनः"
    iast: "dṛṣṭvā viklinna-hṛdayaḥ kṛṣṇaṃ snehena pāṇḍavaḥ | cirād dṛṣṭaṃ priyatamaṃ sasvaje 'tha punaḥ punaḥ"
  - id: '10.71.27'
    kind: verse
    lines:
      - "तं मातुलेयं परिरभ्य निर्वृतो भीमः स्मयन्प्रेमजलाकुलेन्द्रियः"
      - "यमौ किरीटी च सुहृत्तमं मुदा प्रवृद्धबाष्पाः परिरेभिरेऽच्युतम्"
    iast: "taṃ mātuleyaṃ parirabhya nirvṛto bhīmaḥ smayan prema-jalākulendriyaḥ | yamau kirīṭī ca suhṛttamaṃ mudā pravṛddha-bāṣpāḥ parirebhire 'cyutam"
  - id: '10.71.37'
    kind: verse
    lines:
      - "अन्तःपुरजनैः प्रीत्या मुकुन्दः फुल्ललोचनैः"
      - "ससम्भ्रमैरभ्युपेतः प्राविशद्राजमन्दिरम्"
    iast: "antaḥ-pura-janaiḥ prītyā mukundaḥ phulla-locanaiḥ | sa-sambhramair abhyupetaḥ prāviśad rāja-mandiram"
  - id: '10.71.38'
    kind: verse
    lines:
      - "पृथा विलोक्य भ्रात्रेयं कृष्णं त्रिभुवनेश्वरम्"
      - "प्रीतात्मोत्थाय पर्यङ्कात्सस्नुषा परिषस्वजे"
    iast: "pṛthā vilokya bhrātreyaṃ kṛṣṇaṃ tri-bhuvaneśvaram | prītātmotthāya paryaṅkāt sa-snuṣā pariṣasvaje"
  - id: '10.72.3'
    kind: verse
    lines:
      - "क्रतुराजेन गोविन्द राजसूयेन पावनीः"
      - "यक्ष्ये विभूतीर्भवतस्तत्सम्पादय नः प्रभो"
    iast: "kratu-rājena govinda rājasūyena pāvanīḥ | yakṣye vibhūtīr bhavatas tat sampādaya naḥ prabho"
  - id: '10.72.9'
    kind: verse
    lines:
      - "विजित्य नृपतीन्सर्वान्कृत्वा च जगतीं वशे"
      - "सम्भृत्य सर्वसम्भारानाहरस्व महाक्रतुम्"
    iast: "vijitya nṛpatīn sarvān kṛtvā ca jagatīṃ vaśe | sambhṛtya sarva-sambhārān āharasva mahā-kratum"
  - id: '10.72.12'
    kind: verse
    lines:
      - "निशम्य भगवद्गीतं प्रीतः फुल्लमुखाम्बुजः"
      - "भ्रातॄन्दिग्विजयेऽयुङ्क्त विष्णुतेजोपबृंहितान्"
    iast: "niśamya bhagavad-gītaṃ prītaḥ phulla-mukhāmbujaḥ | bhrātṝn dig-vijaye 'yuṅkta viṣṇu-tejopabṛṃhitān"
  - id: '10.72.16'
    kind: verse
    lines:
      - "भीमसेनोऽर्जुनः कृष्णो ब्रह्मलिन्गधरास्त्रयः"
      - "जग्मुर्गिरिव्रजं तात बृहद्रथसुतो यतः"
    iast: "bhīmaseno 'rjunaḥ kṛṣṇo brahma-linga-dharās trayaḥ | jagmur girivrajaṃ tāta bṛhadratha-suto yataḥ"
  - id: '10.72.17'
    kind: verse
    lines:
      - "ते गत्वातिथ्यवेलायां गृहेषु गृहमेधिनम्"
      - "ब्रह्मण्यं समयाचेरन्राजन्या ब्रह्मलिङ्गिनः"
    iast: "te gatvātithya-velāyāṃ gṛheṣu gṛha-medhinam | brahmaṇyaṃ samayāceran rājanyā brahma-liṅginaḥ"
  - id: '10.72.27'
    kind: verse
    lines:
      - "इत्युदारमतिः प्राह कृष्णार्जुनवृकोदरान्"
      - "हे विप्रा व्रियतां कामो ददाम्यात्मशिरोऽपि वः"
    iast: "ity udāra-matiḥ prāha kṛṣṇārjuna-vṛkodarān | he viprā vriyatāṃ kāmo dadāmy ātma-śiro 'pi vaḥ"
  - id: '10.72.28'
    kind: verse
    lines:
      - "युद्धं नो देहि राजेन्द्र द्वन्द्वशो यदि मन्यसे"
      - "युद्धार्थिनो वयं प्राप्ता राजन्या नान्यकाङ्क्षिणः"
    iast: "yuddhaṃ no dehi rājendra dvandvaśo yadi manyase | yuddhārthino vayaṃ prāptā rājanyā nānya-kāṅkṣiṇaḥ"
  - id: '10.72.31'
    kind: verse
    lines:
      - "न त्वया भीरुणा योत्स्ये युधि विक्लवतेजसा"
      - "मथुरां स्वपुरीं त्यक्त्वा समुद्रं शरणं गतः"
    iast: "na tvayā bhīruṇā yotsye yudhi viklava-tejasā | mathurāṃ sva-purīṃ tyaktvā samudraṃ śaraṇaṃ gataḥ"
  - id: '10.72.33'
    kind: verse
    lines:
      - "इत्युक्त्वा भीमसेनाय प्रादाय महतीं गदाम्"
      - "द्वितीयां स्वयमादाय निर्जगाम पुराद्बहिः"
    iast: "ity uktvā bhīmasenāya prādāya mahatīṃ gadām | dvitīyāṃ svayam ādāya nirjagāma purād bahiḥ"
  - id: '10.72.39'
    kind: verse
    lines:
      - "तयोरेवं प्रहरतोः समशिक्षाबलौजसोः"
      - "निर्विशेषमभूद्युद्धमक्षीणजवयोर्नृप"
    iast: "tayor evaṃ praharatoḥ sama-śikṣā-balaujasoḥ | nirviśeṣam abhūd yuddham akṣīṇa-javayor nṛpa"
  - id: '10.72.40'
    kind: verse
    lines:
      - "शत्रोर्जन्ममृती विद्वाञ्जीवितं च जराकृतम्"
      - "पार्थमाप्याययन्स्वेन तेजसाचिन्तयद्धरिः"
    iast: "śatror janma-mṛtī vidvāñ jīvitaṃ ca jarā-kṛtam | pārtham āpyāyayan svena tejasācintayad dhariḥ"
  - id: '10.72.41'
    kind: verse
    lines:
      - "सञ्चिन्त्यारीवधोपायं भीमस्यामोघदर्शनः"
      - "दर्शयामास विटपं पाटयन्निव संज्ञया"
    iast: "sañcintyārī-vadhopāyaṃ bhīmasyāmogha-darśanaḥ | darśayām āsa viṭapaṃ pāṭayann iva saṃjñayā"
  - id: '10.72.42'
    kind: verse
    lines:
      - "तद्विज्ञाय महासत्त्वो भीमः प्रहरतां वरः"
      - "गृहीत्वा पादयोः शत्रुं पातयामास भूतले"
    iast: "tad vijñāya mahā-sattvo bhīmaḥ praharatāṃ varaḥ | gṛhītvā pādayoḥ śatruṃ pātayām āsa bhū-tale"
  - id: '10.72.43'
    kind: verse
    lines:
      - "एकम्पादं पदाक्रम्य दोर्भ्यामन्यं प्रगृह्य सः"
      - "गुदतः पाटयामास शाखमिव महागजः"
    iast: "ekam pādaṃ padākramya dorbhyām anyaṃ pragṛhya saḥ | gudataḥ pāṭayām āsa śākham iva mahā-gajaḥ"
  - id: '10.72.45'
    kind: verse
    lines:
      - "हाहाकारो महानासीन्निहते मगधेश्वरे"
      - "पूजयामासतुर्भीमं परिरभ्य जयाच्यतौ"
    iast: "hāhā-kāro mahān āsīn nihate magadheśvare | pūjayām āsatur bhīmaṃ parirabhya jayācyatau"
  - id: '10.72.46'
    kind: verse
    lines:
      - "सहदेवं तत्तनयं भगवान्भूतभावनः"
      - "अभ्यषिञ्चदमेयात्मा मगधानां पतिं प्रभुः"
      - "मोचयामास राजन्यान्संरुद्धा मागधेन ये"
    iast: "sahadevaṃ tat-tanayaṃ bhagavān bhūta-bhāvanaḥ | abhyaṣiñcad ameyātmā magadhānāṃ patiṃ prabhuḥ | mocayām āsa rājanyān saṃruddhā māgadhena ye"
  - id: '10.74.1'
    kind: verse
    lines:
      - "एवं युधिष्ठिरो राजा जरासन्धवधं विभोः"
      - "कृष्णस्य चानुभावं तं श्रुत्वा प्रीतस्तमब्रवीत्"
    iast: "evaṃ yudhiṣṭhiro rājā jarāsandha-vadhaṃ vibhoḥ | kṛṣṇasya cānubhāvaṃ taṃ śrutvā prītas tam abravīt"
  - id: '10.74.26'
    kind: verse
    lines:
      - "श्रुत्वा द्विजेरितं राजा ज्ञात्वा हार्दं सभासदाम्"
      - "समर्हयद्धृषीकेशं प्रीतः प्रणयविह्वलः"
    iast: "śrutvā dvijeritaṃ rājā jñātvā hārdaṃ sabhā-sadām | samarhayad dhṛṣīkeśaṃ prītaḥ praṇaya-vihvalaḥ"
  - id: '10.74.38'
    kind: verse
    lines:
      - "एवमादीन्यभद्राणि बभाषे नष्टमङ्गलः"
      - "नोवाच किञ्चिद्भगवान्यथा सिंहः शिवारुतम्"
    iast: "evam-ādīny abhadrāṇi babhāṣe naṣṭa-maṅgalaḥ | novāca kiñcid bhagavān yathā siṃhaḥ śivā-rutam"
  - id: '10.74.42'
    kind: verse
    lines:
      - "ततश्चैद्यस्त्वसम्भ्रान्तो जगृहे खड्गचर्मणी"
      - "भर्त्सयन्कृष्णपक्षीयान्राज्ञः सदसि भारत"
    iast: "tataś caidyas tv asambhrānto jagṛhe khaḍga-carmaṇī | bhartsayan kṛṣṇa-pakṣīyān rājñaḥ sadasi bhārata"
  - id: '10.74.43'
    kind: verse
    lines:
      - "तावदुत्थाय भगवान्स्वान्निवार्य स्वयं रुषा"
      - "शिरः क्षुरान्तचक्रेण जहार पततो रिपोः"
    iast: "tāvad utthāya bhagavān svān nivārya svayaṃ ruṣā | śiraḥ kṣurānta-cakreṇa jahāra patato ripoḥ"
  - id: '10.74.45'
    kind: verse
    lines:
      - "चैद्यदेहोत्थितं ज्योतिर्वासुदेवमुपाविशत्"
      - "पश्यतां सर्वभूतानामुल्केव भुवि खाच्च्युता"
    iast: "caidya-dehotthitaṃ jyotir vāsudevam upāviśat | paśyatāṃ sarva-bhūtānām ulkeva bhuvi khāc cyutā"
  - id: '10.74.46'
    kind: verse
    lines:
      - "जन्मत्रयानुगुणित वैरसंरब्धया धिया"
      - "ध्यायंस्तन्मयतां यातो भावो हि भवकारणम्"
    iast: "janma-trayānuguṇita- vaira-saṃrabdhayā dhiyā | dhyāyaṃs tan-mayatāṃ yāto bhāvo hi bhava-kāraṇam"
  - id: '10.78.13'
    kind: verse
    lines:
      - "एवं सौभं च शाल्वं च दन्तवक्रं सहानुजम्"
      - "हत्वा दुर्विषहानन्यैरीडितः सुरमानवैः"
    iast: "evaṃ saubhaṃ ca śālvaṃ ca dantavakraṃ sahānujam | hatvā durviṣahān anyair īḍitaḥ sura-mānavaiḥ"
  - id: '10.80.6'
    kind: verse
    lines:
      - "कृष्णस्यासीत्सखा कश्चिद्ब्राह्मणो ब्रह्मवित्तमः"
      - "विरक्त इन्द्रियार्थेषु प्रशान्तात्मा जितेन्द्रियः"
    iast: "kṛṣṇasyāsīt sakhā kaścid brāhmaṇo brahma-vittamaḥ | virakta indriyārtheṣu praśāntātmā jitendriyaḥ"
  - id: '10.80.7'
    kind: verse
    lines:
      - "यदृच्छयोपपन्नेन वर्तमानो गृहाश्रमी"
      - "तस्य भार्या कुचैलस्य क्षुत्क्षामा च तथाविधा"
    iast: "yadṛcchayopapannena vartamāno gṛhāśramī | tasya bhāryā ku-cailasya kṣut-kṣāmā ca tathā-vidhā"
  - id: '10.80.8'
    kind: verse
    lines:
      - "पतिव्रता पतिं प्राह म्लायता वदनेन सा"
      - "दरिद्रं सीदमाना वै वेपमानाभिगम्य च"
    iast: "pati-vratā patiṃ prāha mlāyatā vadanena sā | daridraṃ sīdamānā vai vepamānābhigamya ca"
  - id: '10.80.9'
    kind: verse
    lines:
      - "ननु ब्रह्मन्भगवतः सखा साक्षाच्छ्रियः पतिः"
      - "ब्रह्मण्यश्च शरण्यश्च भगवान्सात्वतर्षभः"
    iast: "nanu brahman bhagavataḥ sakhā sākṣāc chriyaḥ patiḥ | brahmaṇyaś ca śaraṇyaś ca bhagavān sātvatarṣabhaḥ"
  - id: '10.80.10'
    kind: verse
    lines:
      - "तमुपैहि महाभाग साधूनां च परायणम्"
      - "दास्यति द्रविणं भूरि सीदते ते कुटुम्बिने"
    iast: "tam upaihi mahā-bhāga sādhūnāṃ ca parāyaṇam | dāsyati draviṇaṃ bhūri sīdate te kuṭumbine"
  - id: '10.80.12'
    kind: verse
    lines:
      - "स एवं भार्यया विप्रो बहुशः प्रार्थितो मुहुः"
      - "अयं हि परमो लाभ उत्तमःश्लोकदर्शनम्"
    iast: "sa evaṃ bhāryayā vipro bahuśaḥ prārthito muhuḥ | ayaṃ hi paramo lābha uttamaḥśloka-darśanam"
  - id: '10.80.13'
    kind: verse
    lines:
      - "इति सञ्चिन्त्य मनसा गमनाय मतिं दधे"
      - "अप्यस्त्युपायनं किञ्चिद्गृहे कल्याणि दीयताम्"
    iast: "iti sañcintya manasā gamanāya matiṃ dadhe | apy asty upāyanaṃ kiñcid gṛhe kalyāṇi dīyatām"
  - id: '10.80.14'
    kind: verse
    lines:
      - "याचित्वा चतुरो मुष्टीन्विप्रान्पृथुकतण्डुलान्"
      - "चैलखण्डेन तान्बद्ध्वा भर्त्रे प्रादादुपायनम्"
    iast: "yācitvā caturo muṣṭīn viprān pṛthuka-taṇḍulān | caila-khaṇḍena tān baddhvā bhartre prādād upāyanam"
  - id: '10.80.15'
    kind: verse
    lines:
      - "स तानादाय विप्राग्र्यः प्रययौ द्वारकां किल"
      - "कृष्णसन्दर्शनं मह्यं कथं स्यादिति चिन्तयन्"
    iast: "sa tān ādāya viprāgryaḥ prayayau dvārakāṃ kila | kṛṣṇa-sandarśanaṃ mahyaṃ kathaṃ syād iti cintayan"
  - id: '10.80.17'
    kind: verse
    lines:
      - "गृहं द्व्यष्टसहस्राणां महिषीणां हरेर्द्विजः"
      - "विवेशैकतमं श्रीमद्ब्रह्मानन्दं गतो यथा"
    iast: "gṛhaṃ dvy-aṣṭa-sahasrāṇāṃ mahiṣīṇāṃ harer dvijaḥ | viveśaikatamaṃ śrīmad brahmānandaṃ gato yathā"
  - id: '10.80.18'
    kind: verse
    lines:
      - "तं विलोक्याच्युतो दूरात्प्रियापर्यङ्कमास्थितः"
      - "सहसोत्थाय चाभ्येत्य दोर्भ्यां पर्यग्रहीन्मुदा"
    iast: "taṃ vilokyācyuto dūrāt priyā-paryaṅkam āsthitaḥ | sahasotthāya cābhyetya dorbhyāṃ paryagrahīn mudā"
  - id: '10.80.20'
    kind: verse
    lines:
      - "अथोपवेश्य पर्यङ्के स्वयम्सख्युः समर्हणम्"
      - "उपहृत्यावनिज्यास्य पादौ पादावनेजनीः"
    iast: "athopaveśya paryaṅke svayam sakhyuḥ samarhaṇam | upahṛtyāvanijyāsya pādau pādāvanejanīḥ"
  - id: '10.80.23'
    kind: verse
    lines:
      - "कुचैलं मलिनं क्षामं द्विजं धमनिसन्ततम्"
      - "देवी पर्यचरत्साक्षाच्चामरव्यजनेन वै"
    iast: "ku-cailaṃ malinaṃ kṣāmaṃ dvijaṃ dhamani-santatam | devī paryacarat sākṣāc cāmara-vyajanena vai"
  - id: '10.80.27'
    kind: verse
    lines:
      - "कथयां चक्रतुर्गाथाः पूर्वा गुरुकुले सतोः"
      - "आत्मनोर्ललिता राजन्करौ गृह्य परस्परम्"
    iast: "kathayāṃ cakratur gāthāḥ pūrvā guru-kule satoḥ | ātmanor lalitā rājan karau gṛhya parasparam"
  - id: '10.80.29'
    kind: verse
    lines:
      - "प्रायो गृहेषु ते चित्तमकामविहितं तथा"
      - "नैवातिप्रीयसे विद्वन्धनेषु विदितं हि मे"
    iast: "prāyo gṛheṣu te cittam akāma-vihitaṃ tathā | naivāti-prīyase vidvan dhaneṣu viditaṃ hi me"
  - id: '10.81.3'
    kind: verse
    lines:
      - "किमुपायनमानीतं ब्रह्मन्मे भवता गृहात्"
      - "अण्वप्युपाहृतं भक्तैः प्रेम्णा भुर्येव मे भवेत्"
      - "भूर्यप्यभक्तोपहृतं न मे तोषाय कल्पते"
    iast: "kim upāyanam ānītaṃ brahman me bhavatā gṛhāt | aṇv apy upāhṛtaṃ bhaktaiḥ premṇā bhury eva me bhavet | bhūry apy abhaktopahṛtaṃ na me toṣāya kalpate"
  - id: '10.81.4'
    kind: verse
    lines:
      - "पत्रं पुष्पं फलं तोयं यो मे भक्त्या प्रयच्छति"
      - "तदहं भक्त्युपहृतमश्नामि प्रयतात्मनः"
    iast: "patraṃ puṣpaṃ phalaṃ toyaṃ yo me bhaktyā prayacchati | tad ahaṃ bhakty-upahṛtam aśnāmi prayatātmanaḥ"
  - id: '10.81.5'
    kind: verse
    lines:
      - "इत्युक्तोऽपि द्वियस्तस्मै व्रीडितः पतये श्रियः"
      - "पृथुकप्रसृतिं राजन्न प्रायच्छदवाङ्मुखः"
    iast: "ity ukto 'pi dviyas tasmai vrīḍitaḥ pataye śriyaḥ | pṛthuka-prasṛtiṃ rājan na prāyacchad avāṅ-mukhaḥ"
  - id: '10.81.6'
    kind: verse
    lines:
      - "सर्वभूतात्मदृक्साक्षात्तस्यागमनकारणम्"
      - "विज्ङायाचिन्तयन्नायं श्रीकामो माभजत्पुरा"
    iast: "sarva-bhūtātma-dṛk sākṣāt tasyāgamana-kāraṇam | vijṅāyācintayan nāyaṃ śrī-kāmo mābhajat purā"
  - id: '10.81.7'
    kind: verse
    lines:
      - "पत्न्याः पतिव्रतायास्तु सखा प्रियचिकीर्षया"
      - "प्राप्तो मामस्य दास्यामि सम्पदोऽमर्त्यदुर्लभाः"
    iast: "patnyāḥ pati-vratāyās tu sakhā priya-cikīrṣayā | prāpto mām asya dāsyāmi sampado 'martya-durlabhāḥ"
  - id: '10.81.8'
    kind: verse
    lines:
      - "इत्थं विचिन्त्य वसनाच्चीरबद्धान्द्विजन्मनः"
      - "स्वयं जहार किमिदमिति पृथुकतण्डुलान्"
    iast: "itthaṃ vicintya vasanāc cīra-baddhān dvi-janmanaḥ | svayaṃ jahāra kim idam iti pṛthuka-taṇḍulān"
  - id: '10.81.9'
    kind: verse
    lines:
      - "नन्वेतदुपनीतं मे परमप्रीणनं सखे"
      - "तर्पयन्त्यङ्ग मां विश्वमेते पृथुकतण्डुलाः"
    iast: "nanv etad upanītaṃ me parama-prīṇanaṃ sakhe | tarpayanty aṅga māṃ viśvam ete pṛthuka-taṇḍulāḥ"
  - id: '10.81.10'
    kind: verse
    lines:
      - "इति मुष्टिं सकृज्जग्ध्वा द्वितीयां जग्धुमाददे"
      - "तावच्छ्रीर्जगृहे हस्तं तत्परा परमेष्ठिनः"
    iast: "iti muṣṭiṃ sakṛj jagdhvā dvitīyāṃ jagdhum ādade | tāvac chrīr jagṛhe hastaṃ tat-parā parameṣṭhinaḥ"
  - id: '10.81.11'
    kind: verse
    lines:
      - "एतावतालं विश्वात्मन्सर्वसम्पत्समृद्धये"
      - "अस्मिन्लोकेऽथ वामुष्मिन्पुंसस्त्वत्तोषकारणम्"
    iast: "etāvatālaṃ viśvātman sarva-sampat-samṛddhaye | asmin loke 'tha vāmuṣmin puṃsas tvat-toṣa-kāraṇam"
  - id: '10.81.12'
    kind: verse
    lines:
      - "ब्राह्मणस्तां तु रजनीमुषित्वाच्युतमन्दिरे"
      - "भुक्त्वा पीत्वा सुखं मेने आत्मानं स्वर्गतं यथा"
    iast: "brāhmaṇas tāṃ tu rajanīm uṣitvācyuta-mandire | bhuktvā pītvā sukhaṃ mene ātmānaṃ svar-gataṃ yathā"
  - id: '10.81.13'
    kind: verse
    lines:
      - "श्वोभूते विश्वभावेन स्वसुखेनाभिवन्दितः"
      - "जगाम स्वालयं तात पथ्यनव्रज्य नन्दितः"
    iast: "śvo-bhūte viśva-bhāvena sva-sukhenābhivanditaḥ | jagāma svālayaṃ tāta pathy anavrajya nanditaḥ"
  - id: '10.81.14'
    kind: verse
    lines:
      - "स चालब्ध्वा धनं कृष्णान्न तु याचितवान्स्वयम्"
      - "स्वगृहान्व्रीडितोऽगच्छन्महद्दर्शननिर्वृतः"
    iast: "sa cālabdhvā dhanaṃ kṛṣṇān na tu yācitavān svayam | sva-gṛhān vrīḍito 'gacchan mahad-darśana-nirvṛtaḥ"
  - id: '10.81.16'
    kind: verse
    lines:
      - "क्वाहं दरिद्रः पापीयान्क्व कृष्णः श्रीनिकेतनः"
      - "ब्रह्मबन्धुरिति स्माहं बाहुभ्यां परिरम्भितः"
    iast: "kvāhaṃ daridraḥ pāpīyān kva kṛṣṇaḥ śrī-niketanaḥ | brahma-bandhur iti smāhaṃ bāhubhyāṃ parirambhitaḥ"
  - id: '10.81.19'
    kind: verse
    lines:
      - "स्वर्गापवर्गयोः पुंसां रसायां भुवि सम्पदाम्"
      - "सर्वासामपि सिद्धीनां मूलं तच्चरणार्चनम्"
    iast: "svargāpavargayoḥ puṃsāṃ rasāyāṃ bhuvi sampadām | sarvāsām api siddhīnāṃ mūlaṃ tac-caraṇārcanam"
  - id: '10.81.20'
    kind: verse
    lines:
      - "अधनोऽयं धनं प्राप्य माद्यन्नुच्चैर्न मां स्मरेत्"
      - "इति कारुणिको नूनं धनं मेऽभूरि नाददात्"
    iast: "adhano 'yaṃ dhanaṃ prāpya mādyann uccair na māṃ smaret | iti kāruṇiko nūnaṃ dhanaṃ me 'bhūri nādadāt"
  - id: '10.81.21'
    kind: verse
    lines:
      - "इति तच्चिन्तयन्नन्तः प्राप्तो नियगृहान्तिकम्"
      - "सूर्यानलेन्दुसङ्काशैर्विमानैः सर्वतो वृतम्"
    iast: "iti tac cintayann antaḥ prāpto niya-gṛhāntikam | sūryānalendu-saṅkāśair vimānaiḥ sarvato vṛtam"
  - id: '10.81.22'
    kind: verse
    lines:
      - "विचित्रोपवनोद्यानैः कूजद्द्विजकुलाकुलैः"
      - "प्रोत्फुल्लकमुदाम्भोज कह्लारोत्पलवारिभिः"
    iast: "vicitropavanodyānaiḥ kūjad-dvija-kulākulaiḥ | protphulla-kamudāmbhoja- kahlārotpala-vāribhiḥ"
  - id: '10.81.23'
    kind: verse
    lines:
      - "जुष्टं स्वलङ्कृतैः पुम्भिः स्त्रीभिश्च हरिणाक्षिभिः"
      - "किमिदं कस्य वा स्थानं कथं तदिदमित्यभूत्"
    iast: "juṣṭaṃ sv-alaṅkṛtaiḥ pumbhiḥ strībhiś ca hariṇākṣibhiḥ | kim idaṃ kasya vā sthānaṃ kathaṃ tad idam ity abhūt"
  - id: '10.81.24'
    kind: verse
    lines:
      - "एवं मीमांसमानं तं नरा नार्योऽमरप्रभाः"
      - "प्रत्यगृह्णन्महाभागं गीतवाद्येन भूयसा"
    iast: "evaṃ mīmāṃsamānaṃ taṃ narā nāryo 'mara-prabhāḥ | pratyagṛhṇan mahā-bhāgaṃ gīta-vādyena bhūyasā"
  - id: '10.81.25'
    kind: verse
    lines:
      - "पतिमागतमाकर्ण्य पत्न्युद्धर्षातिसम्भ्रमा"
      - "निश्चक्राम गृहात्तूर्णं रूपिणी श्रीरिवालयात्"
    iast: "patim āgatam ākarṇya patny uddharṣāti-sambhramā | niścakrāma gṛhāt tūrṇaṃ rūpiṇī śrīr ivālayāt"
  - id: '10.81.26'
    kind: verse
    lines:
      - "पतिव्रता पतिं दृष्ट्वा प्रेमोत्कण्ठाश्रुलोचना"
      - "मीलिताक्ष्यनमद्बुद्ध्या मनसा परिषस्वजे"
    iast: "pati-vratā patiṃ dṛṣṭvā premotkaṇṭhāśru-locanā | mīlitākṣy anamad buddhyā manasā pariṣasvaje"
  - id: '10.81.28'
    kind: verse
    lines:
      - "प्रीतः स्वयं तया युक्तः प्रविष्टो निजमन्दिरम्"
      - "मणिस्तम्भशतोपेतं महेन्द्रभवनं यथा"
    iast: "prītaḥ svayaṃ tayā yuktaḥ praviṣṭo nija-mandiram | maṇi-stambha-śatopetaṃ mahendra-bhavanaṃ yathā"
  - id: '10.81.33'
    kind: verse
    lines:
      - "नूनं बतैतन्मम दुर्भगस्य शश्वद्दरिद्रस्य समृद्धिहेतुः"
      - "महाविभूतेरवलोकतोऽन्यो नैवोपपद्येत यदूत्तमस्य"
    iast: "nūnaṃ bataitan mama durbhagasya śaśvad daridrasya samṛddhi-hetuḥ | mahā-vibhūter avalokato 'nyo naivopapadyeta yadūttamasya"
  - id: '10.81.38'
    kind: verse
    lines:
      - "इत्थं व्यवसितो बुद्ध्या भक्तोऽतीव जनार्दने"
      - "विषयान्जायया त्यक्ष्यन्बुभुजे नातिलम्पटः"
    iast: "itthaṃ vyavasito buddhyā bhakto 'tīva janārdane | viṣayān jāyayā tyakṣyan bubhuje nāti-lampaṭaḥ"
  - id: '11.1.1'
    kind: verse
    lines:
      - "कृत्वा दैत्यवधं कृष्णः सरामो यदुभिर्वृतः"
      - "भुवोऽवतारयद्भारं जविष्ठं जनयन्कलिम्"
    iast: "kṛtvā daitya-vadhaṃ kṛṣṇaḥ sa-rāmo yadubhir vṛtaḥ | bhuvo 'vatārayad bhāraṃ javiṣṭhaṃ janayan kalim"
  - id: '11.1.2'
    kind: verse
    lines:
      - "ये कोपिताः सुबहु पाण्डुसुताः सपत्नैर्दुर्द्यूतहेलनकचग्रहणादिभिस्तानम्प्;"
      - "कृत्वा निमित्तमितरेतरतः समेतान्हत्वा नृपान्निरहरत्क्षितिभारमीशः"
    iast: "ye kopitāḥ su-bahu pāṇḍu-sutāḥ sapatnair durdyūta-helana-kaca-grahaṇādibhis tān amp; | kṛtvā nimittam itaretarataḥ sametān hatvā nṛpān niraharat kṣiti-bhāram īśaḥ"
  - id: '11.6.20'
    kind: verse
    lines:
      - "इत्यभिष्टूय विबुधैः सेशः शतधृतिर्हरिम्"
      - "अभ्यभाषत गोविन्दं प्रणम्याम्बरमाश्रितः"
    iast: "ity abhiṣṭūya vibudhaiḥ seśaḥ śata-dhṛtir harim | abhyabhāṣata govindaṃ praṇamyāmbaram āśritaḥ"
  - id: '11.6.21'
    kind: verse
    lines:
      - "भूमेर्भारावताराय पुरा विज्ञापितः प्रभो"
      - "त्वमस्माभिरशेषात्मन्तत्तथैवोपपादितम्"
    iast: "bhūmer bhārāvatārāya purā vijñāpitaḥ prabho | tvam asmābhir aśeṣātman tat tathaivopapāditam"
  - id: '11.6.22'
    kind: verse
    lines:
      - "धर्मश्च स्थापितः सत्सु सत्यसन्धेषु वै त्वया"
      - "कीर्तिश्च दिक्षु विक्षिप्ता सर्वलोकमलापहा"
    iast: "dharmaś ca sthāpitaḥ satsu satya-sandheṣu vai tvayā | kīrtiś ca dikṣu vikṣiptā sarva-loka-malāpahā"
  - id: '11.6.27'
    kind: verse
    lines:
      - "ततः स्वधाम परमं विशस्व यदि मन्यसे"
      - "सलोकाल्लोकपालान्नः पाहि वैकुण्ठकिङ्करान्"
    iast: "tataḥ sva-dhāma paramaṃ viśasva yadi manyase | sa-lokāl loka-pālān naḥ pāhi vaikuṇṭha-kiṅkarān"
  - id: '11.6.28'
    kind: verse
    lines:
      - "अवधारितमेतन्मे यदात्थ विबुधेश्वर"
      - "कृतं वः कार्यमखिलं भूमेर्भारोऽवतारितः"
    iast: "avadhāritam etan me yad āttha vibudheśvara | kṛtaṃ vaḥ kāryam akhilaṃ bhūmer bhāro 'vatāritaḥ"
  - id: '11.6.29'
    kind: verse
    lines:
      - "तदिदं यादवकुलं वीर्यशौर्यश्रियोद्धतम्"
      - "लोकं जिघृक्षद्रुद्धं मे वेलयेव महार्णवः"
    iast: "tad idaṃ yādava-kulaṃ vīrya-śaurya-śriyoddhatam | lokaṃ jighṛkṣad ruddhaṃ me velayeva mahārṇavaḥ"
  - id: '11.6.30'
    kind: verse
    lines:
      - "यद्यसंहृत्य दृप्तानां यदूनां विपुलं कुलम्"
      - "गन्तास्म्यनेन लोकोऽयमुद्वेलेन विनङ्क्ष्यति"
    iast: "yady asaṃhṛtya dṛptānāṃ yadūnāṃ vipulaṃ kulam | gantāsmy anena loko 'yam udvelena vinaṅkṣyati"
  - id: '11.6.33'
    kind: verse
    lines:
      - "अथ तस्यां महोत्पातान्द्वारवत्यां समुत्थितान्"
      - "विलोक्य भगवानाह यदुवृद्धान्समागतान्"
    iast: "atha tasyāṃ mahotpātān dvāravatyāṃ samutthitān | vilokya bhagavān āha yadu-vṛddhān samāgatān"
  - id: '11.6.35'
    kind: verse
    lines:
      - "न वस्तव्यमिहास्माभिर्जिजीविषुभिरार्यकाः"
      - "प्रभासं सुमहत्पुण्यं यास्यामोऽद्यैव मा चिरम्"
    iast: "na vastavyam ihāsmābhir jijīviṣubhir āryakāḥ | prabhāsaṃ su-mahat-puṇyaṃ yāsyāmo 'dyaiva mā ciram"
  - id: '11.6.39'
    kind: verse
    lines:
      - "एवं भगवतादिष्टा यादवाः कुरुनन्दन"
      - "गन्तुं कृतधियस्तीर्थं स्यन्दनान्समयूयुजन्"
    iast: "evaṃ bhagavatādiṣṭā yādavāḥ kuru-nandana | gantuṃ kṛta-dhiyas tīrthaṃ syandanān samayūyujan"
  - id: '11.6.40'
    kind: verse
    lines:
      - "तन्निरीक्ष्योद्धवो राजन्श्रुत्वा भगवतोदितम्"
      - "दृष्ट्वारिष्टानि घोराणि नित्यं कृष्णमनुव्रतः"
    iast: "tan nirīkṣyoddhavo rājan śrutvā bhagavatoditam | dṛṣṭvāriṣṭāni ghorāṇi nityaṃ kṛṣṇam anuvrataḥ"
  - id: '11.6.41'
    kind: verse
    lines:
      - "विविक्त उपसङ्गम्य जगतामीश्वरेश्वरम्"
      - "प्रणम्य शिरिसा पादौ प्राञ्जलिस्तमभाषत"
    iast: "vivikta upasaṅgamya jagatām īśvareśvaram | praṇamya śirisā pādau prāñjalis tam abhāṣata"
  - id: '11.6.42'
    kind: verse
    lines:
      - "देवदेवेश योगेश पुण्यश्रवणकीर्तन"
      - "संहृत्यैतत्कुलं नूनं लोकं सन्त्यक्ष्यते भवान्"
      - "विप्रशापं समर्थोऽपि प्रत्यहन्न यदीश्वरः"
    iast: "deva-deveśa yogeśa puṇya-śravaṇa-kīrtana | saṃhṛtyaitat kulaṃ nūnaṃ lokaṃ santyakṣyate bhavān | vipra-śāpaṃ samartho 'pi pratyahan na yad īśvaraḥ"
  - id: '11.6.43'
    kind: verse
    lines:
      - "नाहं तवाङ्घ्रिकमलं क्षणार्धमपि केशव"
      - "त्यक्तुं समुत्सहे नाथ स्वधाम नय मामपि"
    iast: "nāhaṃ tavāṅghri-kamalaṃ kṣaṇārdham api keśava | tyaktuṃ samutsahe nātha sva-dhāma naya mām api"
  - id: '11.7.2'
    kind: verse
    lines:
      - "मया निष्पादितं ह्यत्र देवकार्यमशेषतः"
      - "यदर्थमवतीर्णोऽहमंशेन ब्रह्मणार्थितः"
    iast: "mayā niṣpāditaṃ hy atra deva-kāryam aśeṣataḥ | yad-artham avatīrṇo 'ham aṃśena brahmaṇārthitaḥ"
  - id: '11.7.3'
    kind: verse
    lines:
      - "कुलं वै शापनिर्दग्धं नङ्क्ष्यत्यन्योन्यविग्रहात्"
      - "समुद्रः सप्तमे ह्येनां पुरीं च प्लावयिष्यति"
    iast: "kulaṃ vai śāpa-nirdagdhaṃ naṅkṣyaty anyonya-vigrahāt | samudraḥ saptame hy enāṃ purīṃ ca plāvayiṣyati"
  - id: '11.7.4'
    kind: verse
    lines:
      - "यर्ह्येवायं मया त्यक्तो लोकोऽयं नष्टमङ्गलः"
      - "भविष्यत्यचिरात्साधो कलिनापि निराकृतः"
    iast: "yarhy evāyaṃ mayā tyakto loko 'yaṃ naṣṭa-maṅgalaḥ | bhaviṣyaty acirāt sādho kalināpi nirākṛtaḥ"
  - id: '11.7.5'
    kind: verse
    lines:
      - "न वस्तव्यं त्वयैवेह मया त्यक्ते महीतले"
      - "जनोऽभद्ररुचिर्भद्र भविष्यति कलौ युगे"
    iast: "na vastavyaṃ tvayaiveha mayā tyakte mahī-tale | jano 'bhadra-rucir bhadra bhaviṣyati kalau yuge"
  - id: '11.7.6'
    kind: verse
    lines:
      - "त्वं तु सर्वं परित्यज्य स्नेहं स्वजनबन्धुषु"
      - "मय्यावेश्य मनः संयक्समदृग्विचरस्व गाम्"
    iast: "tvaṃ tu sarvaṃ parityajya snehaṃ sva-jana-bandhuṣu | mayy āveśya manaḥ saṃyak sama-dṛg vicarasva gām"
  - id: '11.7.9'
    kind: verse
    lines:
      - "तस्माद्युक्तेन्द्रियग्रामो युक्तचित्त इदम्जगत्"
      - "आत्मनीक्षस्व विततमात्मानं मय्यधीश्वरे"
    iast: "tasmād yuktendriya-grāmo yukta-citta idam jagat | ātmanīkṣasva vitatam ātmānaṃ mayy adhīśvare"
  - id: '11.11.29#2'
    kind: verse
    lines:
      - "कृपालुरकृतद्रोहस्तितिक्षुः सर्वदेहिनाम्"
      - "सत्यसारोऽनवद्यात्मा समः सर्वोपकारकः"
    iast: "kṛpālur akṛta-drohas titikṣuḥ sarva-dehinām | satya-sāro 'navadyātmā samaḥ sarvopakārakaḥ"
  - id: '11.11.30#2'
    kind: verse
    lines:
      - "कामैरहतधीर्दान्तो मृदुः शुचिरकिञ्चनः"
      - "अनीहो मितभुक्शान्तः स्थिरो मच्छरणो मुनिः"
    iast: "kāmair ahata-dhīr dānto mṛduḥ śucir akiñcanaḥ | anīho mita-bhuk śāntaḥ sthiro mac-charaṇo muniḥ"
  - id: '11.11.32'
    kind: verse
    lines:
      - "आज्ञायैवं गुणान्दोषान्मयादिष्टानपि स्वकान्"
      - "धर्मान्सन्त्यज्य यः सर्वान्मां भजेत स तु सत्तमः"
    iast: "ājñāyaivaṃ guṇān doṣān mayādiṣṭān api svakān | dharmān santyajya yaḥ sarvān māṃ bhajeta sa tu sattamaḥ"
  - id: '11.14.21'
    kind: verse
    lines:
      - "भक्त्याहमेकया ग्राह्यः श्रद्धयात्मा प्रियः सताम्"
      - "भक्तिः पुनाति मन्निष्ठा श्वपाकानपि सम्भवात्"
    iast: "bhaktyāham ekayā grāhyaḥ śraddhayātmā priyaḥ satām | bhaktiḥ punāti man-niṣṭhā śva-pākān api sambhavāt"
  - id: '11.14.24'
    kind: verse
    lines:
      - "वाग्गद्गदा द्रवते यस्य चित्तं रुदत्यभीक्ष्णं हसति क्वचिच्च"
      - "विलज्ज उद्गायति नृत्यते च मद्भक्तियुक्तो भुवनं पुनाति"
    iast: "vāg gadgadā dravate yasya cittaṃ rudaty abhīkṣṇaṃ hasati kvacic ca | vilajja udgāyati nṛtyate ca mad-bhakti-yukto bhuvanaṃ punāti"
  - id: '11.16.9'
    kind: verse
    lines:
      - "अहमात्मोद्धवामीषां भूतानां सुहृदीश्वरः"
      - "अहं सर्वाणि भूतानि तेषां स्थित्युद्भवाप्ययः"
    iast: "aham ātmoddhavāmīṣāṃ bhūtānāṃ suhṛd īśvaraḥ | ahaṃ sarvāṇi bhūtāni teṣāṃ sthity-udbhavāpyayaḥ"
  - id: '11.16.23'
    kind: verse
    lines:
      - "यज्ञानां ब्रह्मयज्ञोऽहं व्रतानामविहिंसनम्"
      - "वाय्वग्न्यर्काम्बुवागात्मा शुचीनामप्यहं शुचिः"
    iast: "yajñānāṃ brahma-yajño 'haṃ vratānām avihiṃsanam | vāyv-agny-arkāmbu-vāg-ātmā śucīnām apy ahaṃ śuciḥ"
  - id: '11.16.26'
    kind: verse
    lines:
      - "धर्माणामस्मि सन्न्यासः क्षेमाणामबहिर्मतिः"
      - "गुह्यानां सुनृतं मौनं मिथुनानामजस्त्वहम्"
    iast: "dharmāṇām asmi sannyāsaḥ kṣemāṇām abahir-matiḥ | guhyānāṃ su-nṛtaṃ maunaṃ mithunānām ajas tv aham"
  - id: '11.16.31'
    kind: verse
    lines:
      - "व्यवसायिनामहं लक्ष्मीः कितवानां छलग्रहः"
      - "तितिक्षास्मि तितिक्षूणां सत्त्वं सत्त्ववतामहम्"
    iast: "vyavasāyinām ahaṃ lakṣmīḥ kitavānāṃ chala-grahaḥ | titikṣāsmi titikṣūṇāṃ sattvaṃ sattvavatām aham"
  - id: '11.16.39'
    kind: verse
    lines:
      - "सङ्ख्यानं परमाणूनां कालेन क्रियते मया"
      - "न तथा मे विभूतीनां सृजतोऽण्डानि कोटिशः"
    iast: "saṅkhyānaṃ paramāṇūnāṃ kālena kriyate mayā | na tathā me vibhūtīnāṃ sṛjato 'ṇḍāni koṭiśaḥ"
  - id: '11.16.40'
    kind: verse
    lines:
      - "तेजः श्रीः कीर्तिरैश्वर्यं ह्रीस्त्यागः सौभगं भगः"
      - "वीर्यं तितिक्षा विज्ञानं यत्र यत्र स मेऽंशकः"
    iast: "tejaḥ śrīḥ kīrtir aiśvaryaṃ hrīs tyāgaḥ saubhagaṃ bhagaḥ | vīryaṃ titikṣā vijñānaṃ yatra yatra sa me 'ṃśakaḥ"
  - id: '11.17.21'
    kind: verse
    lines:
      - "अहिंसा सत्यमस्तेयमकामक्रोधलोभता"
      - "भूतप्रियहितेहा च धर्मोऽयं सार्ववर्णिकः"
    iast: "ahiṃsā satyam asteyam akāma-krodha-lobhatā | bhūta-priya-hitehā ca dharmo 'yaṃ sārva-varṇikaḥ"
  - id: '11.20.6'
    kind: verse
    lines:
      - "योगास्त्रयो मया प्रोक्ता नॄणां श्रेयोविधित्सया"
      - "ज्ञानं कर्म च भक्तिश्च नोपायोऽन्योऽस्ति कुत्रचित्"
    iast: "yogās trayo mayā proktā nṝṇāṃ śreyo-vidhitsayā | jñānaṃ karma ca bhaktiś ca nopāyo 'nyo 'sti kutracit"
  - id: '11.20.7'
    kind: verse
    lines:
      - "निर्विण्णानां ज्ञानयोगो न्यासिनामिह कर्मसु"
      - "तेष्वनिर्विण्णचित्तानां कर्मयोगस्तु कामिनाम्"
    iast: "nirviṇṇānāṃ jñāna-yogo nyāsinām iha karmasu | teṣv anirviṇṇa-cittānāṃ karma-yogas tu kāminām"
  - id: '11.20.8'
    kind: verse
    lines:
      - "यदृच्छया मत्कथादौ जातश्रद्धस्तु यः पुमान्"
      - "न निर्विण्णो नातिसक्तो भक्तियोगोऽस्य सिद्धिदः"
    iast: "yadṛcchayā mat-kathādau jāta-śraddhas tu yaḥ pumān | na nirviṇṇo nāti-sakto bhakti-yogo 'sya siddhi-daḥ"
  - id: '11.20.9'
    kind: verse
    lines:
      - "तावत्कर्माणि कुर्वीत न निर्विद्येत यावता"
      - "मत्कथाश्रवणादौ वा श्रद्धा यावन्न जायते"
    iast: "tāvat karmāṇi kurvīta na nirvidyeta yāvatā | mat-kathā-śravaṇādau vā śraddhā yāvan na jāyate"
  - id: '11.20.35'
    kind: verse
    lines:
      - "नैरपेक्ष्यं परं प्राहुर्निःश्रेयसमनल्पकम्"
      - "तस्मान्निराशिषो भक्तिर्निरपेक्षस्य मे भवेत्"
    iast: "nairapekṣyaṃ paraṃ prāhur niḥśreyasam analpakam | tasmān nirāśiṣo bhaktir nirapekṣasya me bhavet"
  - id: '11.21.1'
    kind: verse
    lines:
      - "य एतान्मत्पथो हित्वा भक्तिज्ञानक्रियात्मकान्"
      - "क्षुद्रान्कामांश्चलैः प्राणैर्जुषन्तः संसरन्ति ते"
    iast: "ya etān mat-patho hitvā bhakti-jñāna-kriyātmakān | kṣudrān kāmāṃś calaiḥ prāṇair juṣantaḥ saṃsaranti te"
  - id: '11.23.18'
    kind: verse
    lines:
      - "स्तेयं हिंसानृतं दम्भः कामः क्रोधः स्मयो मदः"
      - "भेदो वैरमविश्वासः संस्पर्धा व्यसनानि च"
    iast: "steyaṃ hiṃsānṛtaṃ dambhaḥ kāmaḥ krodhaḥ smayo madaḥ | bhedo vairam aviśvāsaḥ saṃspardhā vyasanāni ca"
  - id: '11.28.1'
    kind: verse
    lines:
      - "परस्वभावकर्माणि न प्रशंसेन्न गर्हयेत्"
      - "विश्वमेकामकं पश्यन्प्रकृत्या पुरुषेण च"
    iast: "para-svabhāva-karmāṇi na praśaṃsen na garhayet | viśvam ekāmakaṃ paśyan prakṛtyā puruṣeṇa ca"
  - id: '11.29.9'
    kind: verse
    lines:
      - "कुर्यात्सर्वाणि कर्माणि मदर्थं शनकैः स्मरन्"
      - "मय्यर्पितमनश्चित्तो मद्धर्मात्ममनोरतिः"
    iast: "kuryāt sarvāṇi karmāṇi mad-arthaṃ śanakaiḥ smaran | mayy arpita-manaś-citto mad-dharmātma-mano-ratiḥ"
  - id: '11.29.13'
    kind: verse
    lines:
      - "इति सर्वाणि भूतानि मद्भावेन महाद्युते"
      - "सभाजयन्मन्यमानो ज्ञानं केवलमाश्रितः"
    iast: "iti sarvāṇi bhūtāni mad-bhāvena mahā-dyute | sabhājayan manyamāno jñānaṃ kevalam āśritaḥ"
  - id: '11.29.14'
    kind: verse
    lines:
      - "ब्राह्मणे पुक्कसे स्तेने ब्रह्मण्येऽर्के स्फुलिङ्गके"
      - "अक्रूरे क्रूरके चैव समदृक्पण्डितो मतः"
    iast: "brāhmaṇe pukkase stene brahmaṇye 'rke sphuliṅgake | akrūre krūrake caiva sama-dṛk paṇḍito mataḥ"
  - id: '11.29.15'
    kind: verse
    lines:
      - "नरेष्वभीक्ष्णं मद्भावं पुंसो भावयतोऽचिरात्"
      - "स्पर्धासूयातिरस्काराः साहङ्कारा वियन्ति हि"
    iast: "nareṣv abhīkṣṇaṃ mad-bhāvaṃ puṃso bhāvayato 'cirāt | spardhāsūyā-tiraskārāḥ sāhaṅkārā viyanti hi"
  - id: '11.29.16'
    kind: verse
    lines:
      - "विसृज्य स्मयमानान्स्वान्दृशं व्रीडां च दैहिकीम्"
      - "प्रणमेद्दण्डवद्भूमावाश्वचाण्डालगोखरम्"
    iast: "visṛjya smayamānān svān dṛśaṃ vrīḍāṃ ca daihikīm | praṇamed daṇḍa-vad bhūmāv ā-śva-cāṇḍāla-go-kharam"
  - id: '11.29.22'
    kind: verse
    lines:
      - "एषा बुद्धिमतां बुद्धिर्मनीषा च मनीषिणाम्"
      - "यत्सत्यमनृतेनेह मर्त्येनाप्नोति मामृतम्"
    iast: "eṣā buddhimatāṃ buddhir manīṣā ca manīṣiṇām | yat satyam anṛteneha martyenāpnoti māmṛtam"
  - id: '11.29.32'
    kind: verse
    lines:
      - "नैतद्विज्ञाय जिज्ञासोर्ज्ञातव्यमवशिष्यते"
      - "पीत्वा पीयूषममृतं पातव्यं नावशिष्यते"
    iast: "naitad vijñāya jijñāsor jñātavyam avaśiṣyate | pītvā pīyūṣam amṛtaṃ pātavyaṃ nāvaśiṣyate"
  - id: '11.29.35'
    kind: verse
    lines:
      - "स एवमादर्शितयोगमार्गस्तदोत्तमःश्लोकवचो निशम्य"
      - "बद्धाञ्जलिः प्रीत्युपरुद्धकण्ठो न किञ्चिदूचेऽश्रुपरिप्लुताक्षः"
    iast: "sa evam ādarśita-yoga-mārgas tadottamaḥśloka-vaco niśamya | baddhāñjaliḥ prīty-uparuddha-kaṇṭho na kiñcid ūce 'śru-pariplutākṣaḥ"
  - id: '11.29.36'
    kind: verse
    lines:
      - "विष्टभ्य चित्तं प्रणयावघूर्णं धैर्येण राजन्बहुमन्यमानः"
      - "कृताञ्जलिः प्राह यदुप्रवीरं शीर्ष्णा स्पृशंस्तच्चरणारविन्दम्"
    iast: "viṣṭabhya cittaṃ praṇayāvaghūrṇaṃ dhairyeṇa rājan bahu-manyamānaḥ | kṛtāñjaliḥ prāha yadu-pravīraṃ śīrṣṇā spṛśaṃs tac-caraṇāravindam"
  - id: '11.29.37'
    kind: verse
    lines:
      - "विद्रावितो मोहमहान्धकारो य आश्रितो मे तव सन्निधानात्"
      - "विभावसोः किं नु समीपगस्य शीतं तमो भीः प्रभवन्त्यजाद्य"
    iast: "vidrāvito moha-mahāndhakāro ya āśrito me tava sannidhānāt | vibhāvasoḥ kiṃ nu samīpa-gasya śītaṃ tamo bhīḥ prabhavanty ajādya"
  - id: '11.29.38'
    kind: verse
    lines:
      - "प्रत्यर्पितो मे भवतानुकम्पिना भृत्याय विज्ञानमयः प्रदीपः"
      - "हित्वा कृतज्ञस्तव पादमूलं कोऽन्यं समीयाच्छरणं त्वदीयम्"
    iast: "pratyarpito me bhavatānukampinā bhṛtyāya vijñāna-mayaḥ pradīpaḥ | hitvā kṛta-jñas tava pāda-mūlaṃ ko 'nyaṃ samīyāc charaṇaṃ tvadīyam"
  - id: '11.29.41'
    kind: verse
    lines:
      - "गच्छोद्धव मयादिष्टो बदर्याख्यं ममाश्रमम्"
      - "तत्र मत्पादतीर्थोदे स्नानोपस्पर्शनैः शुचिः"
    iast: "gacchoddhava mayādiṣṭo badary-ākhyaṃ mamāśramam | tatra mat-pāda-tīrthode snānopasparśanaiḥ śuciḥ"
  - id: '11.29.44'
    kind: verse
    lines:
      - "मत्तोऽनुशिक्षितं यत्ते विविक्तमनुभावयन्"
      - "मय्यावेशितवाक्चित्तो मद्धर्मनिरतो भव"
      - "अतिव्रज्य गतीस्तिस्रो मामेष्यसि ततः परम्"
    iast: "matto 'nuśikṣitaṃ yat te viviktam anubhāvayan | mayy āveśita-vāk-citto mad-dharma-nirato bhava | ativrajya gatīs tisro mām eṣyasi tataḥ param"
  - id: '11.29.47'
    kind: verse
    lines:
      - "ततस्तमन्तर्हृदि सन्निवेश्य गतो महाभागवतो विशालाम्"
      - "यथोपदिष्टां जगदेकबन्धुना तपः समास्थाय हरेरगाद्गतिम्"
    iast: "tatas tam antar hṛdi sanniveśya gato mahā-bhāgavato viśālām | yathopadiṣṭāṃ jagad-eka-bandhunā tapaḥ samāsthāya harer agād gatim"
  - id: '11.30.4'
    kind: verse
    lines:
      - "दिवि भुव्यन्तरिक्षे च महोत्पातान्समुत्थितान्"
      - "दृष्ट्वासीनान्सुधर्मायां कृष्णः प्राह यदूनिदम्"
    iast: "divi bhuvy antarikṣe ca mahotpātān samutthitān | dṛṣṭvāsīnān su-dharmāyāṃ kṛṣṇaḥ prāha yadūn idam"
  - id: '11.30.10'
    kind: verse
    lines:
      - "इति सर्वे समाकर्ण्य यदुवृद्धा मधुद्विषः"
      - "तथेति नौभिरुत्तीर्य प्रभासं प्रययू रथैः"
    iast: "iti sarve samākarṇya yadu-vṛddhā madhu-dviṣaḥ | tatheti naubhir uttīrya prabhāsaṃ prayayū rathaiḥ"
  - id: '11.30.12'
    kind: verse
    lines:
      - "ततस्तस्मिन्महापानं पपुर्मैरेयकं मधु"
      - "दिष्टविभ्रंशितधियो यद्द्रवैर्भ्रश्यते मतिः"
    iast: "tatas tasmin mahā-pānaṃ papur maireyakaṃ madhu | diṣṭa-vibhraṃśita-dhiyo yad-dravair bhraśyate matiḥ"
  - id: '11.30.13'
    kind: verse
    lines:
      - "महापानाभिमत्तानां वीराणां दृप्तचेतसाम्"
      - "कृष्णमायाविमूढानां सङ्घर्षः सुमहानभूत्"
    iast: "mahā-pānābhimattānāṃ vīrāṇāṃ dṛpta-cetasām | kṛṣṇa-māyā-vimūḍhānāṃ saṅgharṣaḥ su-mahān abhūt"
  - id: '11.30.19'
    kind: verse
    lines:
      - "पुत्रा अयुध्यन्पितृभिर्भ्रातृभिश्च स्वस्रीयदौहित्रपितृव्यमातुलैः"
      - "मित्राणि मित्रैः सुहृदः सुहृद्भिर्ज्ञातींस्त्वहन्ज्ञातय एव मूढाः"
    iast: "putrā ayudhyan pitṛbhir bhrātṛbhiś ca svasrīya-dauhitra-pitṛvya-mātulaiḥ | mitrāṇi mitraiḥ suhṛdaḥ suhṛdbhir jñātīṃs tv ahan jñātaya eva mūḍhāḥ"
  - id: '11.30.26'
    kind: verse
    lines:
      - "रामः समुद्रवेलायां योगमास्थाय पौरुषम्"
      - "तत्याज लोकं मानुष्यं संयोज्यात्मानमात्मनि"
    iast: "rāmaḥ samudra-velāyāṃ yogam āsthāya pauruṣam | tatyāja lokaṃ mānuṣyaṃ saṃyojyātmānam ātmani"
  - id: '11.30.27'
    kind: verse
    lines:
      - "रामनिर्याणमालोक्य भगवान्देवकीसुतः"
      - "निषसाद धरोपस्थे तुष्णीमासाद्य पिप्पलम्"
    iast: "rāma-niryāṇam ālokya bhagavān devakī-sutaḥ | niṣasāda dharopasthe tuṣṇīm āsādya pippalam"
  - id: '11.31.7'
    kind: verse
    lines:
      - "दिवि दुन्दुभयो नेदुः पेतुः सुमनसश्च खात्"
      - "सत्यं धर्मो धृतिर्भूमेः कीर्तिः श्रीश्चानु तं ययुः"
    iast: "divi dundubhayo neduḥ petuḥ sumanasaś ca khāt | satyaṃ dharmo dhṛtir bhūmeḥ kīrtiḥ śrīś cānu taṃ yayuḥ"
  - id: '12.2.12'
    kind: verse
    lines:
      - "क्षीयमाणेषु देहेषु देहिनां कलिदोषतः"
      - "वर्णाश्रमवतां धर्मे नष्टे वेदपथे नृणाम्"
    iast: "kṣīyamāṇeṣu deheṣu dehināṃ kali-doṣataḥ | varṇāśramavatāṃ dharme naṣṭe veda-pathe nṛṇām"
  - id: '12.2.13'
    kind: verse
    lines:
      - "पाषण्डप्रचुरे धर्मे दस्युप्रायेषु राजसु"
      - "चौर्यानृतवृथाहिंसा नानावृत्तिषु वै नृषु"
    iast: "pāṣaṇḍa-pracure dharme dasyu-prāyeṣu rājasu | cauryānṛta-vṛthā-hiṃsā- nānā-vṛttiṣu vai nṛṣu"
  - id: '12.2.16'
    kind: verse
    lines:
      - "इत्थं कलौ गतप्राये जनेषु खरधर्मिषु"
      - "धर्मत्राणाय सत्त्वेन भगवानवतरिष्यति"
    iast: "itthaṃ kalau gata-prāye janeṣu khara-dharmiṣu | dharma-trāṇāya sattvena bhagavān avatariṣyati"
  - id: '12.2.18'
    kind: verse
    lines:
      - "शम्भलग्राममुख्यस्य ब्राह्मणस्य महात्मनः"
      - "भवने विष्णुयशसः कल्किः प्रादुर्भविष्यति"
    iast: "śambhala-grāma-mukhyasya brāhmaṇasya mahātmanaḥ | bhavane viṣṇuyaśasaḥ kalkiḥ prādurbhaviṣyati"
  - id: '12.2.19'
    kind: verse
    lines:
      - "अश्वमाशुगमारुह्य देवदत्तं जगत्पतिः"
      - "असिनासाधुदमनमष्टैश्वर्यगुणान्वितः"
    iast: "aśvam āśu-gam āruhya devadattaṃ jagat-patiḥ | asināsādhu-damanam aṣṭaiśvarya-guṇānvitaḥ"
  - id: '12.2.20'
    kind: verse
    lines:
      - "विचरन्नाशुना क्षौण्यां हयेनाप्रतिमद्युतिः"
      - "नृपलिङ्गच्छदो दस्यून्कोटिशो निहनिष्यति"
    iast: "vicarann āśunā kṣauṇyāṃ hayenāpratima-dyutiḥ | nṛpa-liṅga-cchado dasyūn koṭiśo nihaniṣyati"
  - id: '12.2.23'
    kind: verse
    lines:
      - "यदावतीर्णो भगवान्कल्किर्धर्मपतिर्हरिः"
      - "कृतं भविष्यति तदा प्रजासूतिश्च सात्त्विकी"
    iast: "yadāvatīrṇo bhagavān kalkir dharma-patir hariḥ | kṛtaṃ bhaviṣyati tadā prajā-sūtiś ca sāttvikī"
  - id: '12.2.40'
    kind: verse
    lines:
      - "राजन्नेते मया प्रोक्ता नरदेवास्तथापरे"
      - "भूमौ ममत्वं कृत्वान्ते हित्वेमां निधनं गताः"
    iast: "rājann ete mayā proktā nara-devās tathāpare | bhūmau mamatvaṃ kṛtvānte hitvemāṃ nidhanaṃ gatāḥ"
  - id: '12.3.5'
    kind: verse
    lines:
      - "समुद्रावरणां जित्वा मां विशन्त्यब्धिमोजसा"
      - "कियदात्मजयस्यैतन्मुक्तिरात्मजये फलम्"
    iast: "samudrāvaraṇāṃ jitvā māṃ viśanty abdhim ojasā | kiyad ātma-jayasyaitan muktir ātma-jaye phalam"
  - id: '12.3.49'
    kind: verse
    lines:
      - "तस्मात्सर्वात्मना राजन्हृदिस्थं कुरु केशवम्"
      - "म्रियमाणो ह्यवहितस्ततो यासि परां गतिम्"
    iast: "tasmāt sarvātmanā rājan hṛdi-sthaṃ kuru keśavam | mriyamāṇo hy avahitas tato yāsi parāṃ gatim"
  - id: '12.5.2'
    kind: verse
    lines:
      - "त्वं तु राजन्मरिष्येति पशुबुद्धिमिमां जहि"
      - "न जातः प्रागभूतोऽद्य देहवत्त्वं न नङ्क्ष्यसि"
    iast: "tvaṃ tu rājan mariṣyeti paśu-buddhim imāṃ jahi | na jātaḥ prāg abhūto 'dya deha-vat tvaṃ na naṅkṣyasi"
  - id: '12.5.5'
    kind: verse
    lines:
      - "घटे भिन्ने घटाकाश आकाशः स्याद्यथा पुरा"
      - "एवं देहे मृते जीवो ब्रह्म सम्पद्यते पुनः"
    iast: "ghaṭe bhinne ghaṭākāśa ākāśaḥ syād yathā purā | evaṃ dehe mṛte jīvo brahma sampadyate punaḥ"
  - id: '12.5.11'
    kind: verse
    lines:
      - "अहं ब्रह्म परं धाम ब्रह्माहं परमं पदम्"
      - "एवं समीक्ष्य चात्मानमात्मन्याधाय निष्कले"
    iast: "ahaṃ brahma paraṃ dhāma brahmāhaṃ paramaṃ padam | evaṃ samīkṣya cātmānam ātmany ādhāya niṣkale"
  - id: '12.5.12'
    kind: verse
    lines:
      - "दशन्तं तक्षकं पादे लेलिहानं विषाननैः"
      - "न द्रक्ष्यसि शरीरं च विश्वं च पृथगात्मनः"
    iast: "daśantaṃ takṣakaṃ pāde lelihānaṃ viṣānanaiḥ | na drakṣyasi śarīraṃ ca viśvaṃ ca pṛthag ātmanaḥ"
  - id: '12.6.2'
    kind: verse
    lines:
      - "सिद्धोऽस्म्यनुगृहीतोऽस्मि भवता करुणात्मना"
      - "श्रावितो यच्च मे साक्षादनादिनिधनो हरिः"
    iast: "siddho 'smy anugṛhīto 'smi bhavatā karuṇātmanā | śrāvito yac ca me sākṣād anādi-nidhano hariḥ"
  - id: '12.6.5'
    kind: verse
    lines:
      - "भगवंस्तक्षकादिभ्यो मृत्युभ्यो न बिभेम्यहम्"
      - "प्रविष्टो ब्रह्म निर्वाणमभयं दर्शितं त्वया"
    iast: "bhagavaṃs takṣakādibhyo mṛtyubhyo na bibhemy aham | praviṣṭo brahma nirvāṇam abhayaṃ darśitaṃ tvayā"
  - id: '12.6.6'
    kind: verse
    lines:
      - "अनुजानीहि मां ब्रह्मन्वाचं यच्छाम्यधोक्षजे"
      - "मुक्तकामाशयं चेतः प्रवेश्य विसृजाम्यसून्"
    iast: "anujānīhi māṃ brahman vācaṃ yacchāmy adhokṣaje | mukta-kāmāśayaṃ cetaḥ praveśya visṛjāmy asūn"
  - id: '12.6.8'
    kind: verse
    lines:
      - "इत्युक्तस्तमनुज्ञाप्य भगवान्बादरायणिः"
      - "जगाम भिक्षुभिः साकं नरदेवेन पूजितः"
    iast: "ity uktas tam anujñāpya bhagavān bādarāyaṇiḥ | jagāma bhikṣubhiḥ sākaṃ nara-devena pūjitaḥ"
  - id: '12.6.9'
    kind: verse
    lines:
      - "परीक्षिदपि राजर्षिरात्मन्यात्मानमात्मना"
      - "समाधाय परं दध्यावस्पन्दासुर्यथा तरुः"
    iast: "parīkṣid api rājarṣir ātmany ātmānam ātmanā | samādhāya paraṃ dadhyāv aspandāsur yathā taruḥ"
  - id: '12.6.10'
    kind: verse
    lines:
      - "प्राक्कूले बर्हिष्यासीनो गङ्गाकूल उदङ्मुखः"
      - "ब्रह्मभूतो महायोगी निःसङ्गश्छिन्नसंशयः"
    iast: "prāk-kūle barhiṣy āsīno gaṅgā-kūla udaṅ-mukhaḥ | brahma-bhūto mahā-yogī niḥsaṅgaś chinna-saṃśayaḥ"
  - id: '12.6.13'
    kind: verse
    lines:
      - "ब्रह्मभूतस्य राजर्षेर्देहोऽहिगरलाग्निना"
      - "बभूव भस्मसात्सद्यः पश्यतां सर्वदेहिनाम्"
    iast: "brahma-bhūtasya rājarṣer deho 'hi-garalāgninā | babhūva bhasmasāt sadyaḥ paśyatāṃ sarva-dehinām"
  - id: '12.6.15'
    kind: verse
    lines:
      - "देवदुन्दुभयो नेदुर्गन्धर्वाप्सरसो जगुः"
      - "ववृषुः पुष्पवर्षाणि विबुधाः साधुवादिनः"
    iast: "deva-dundubhayo nedur gandharvāpsaraso jaguḥ | vavṛṣuḥ puṣpa-varṣāṇi vibudhāḥ sādhu-vādinaḥ"
  - id: '12.6.35'
    kind: verse
    lines:
      - "नमो भगवते तस्मै कृष्णायाकुण्ठमेधसे"
      - "यत्पादाम्बुरुहध्यानात्संहितामध्यगामिमाम्"
    iast: "namo bhagavate tasmai kṛṣṇāyākuṇṭha-medhase | yat-pādāmburuha-dhyānāt saṃhitām adhyagām imām"
  - id: '12.13.13'
    kind: verse
    lines:
      - "प्रौष्ठपद्यां पौर्णमास्यां हेमसिंहसमन्वितम्"
      - "ददाति यो भागवतं स याति परमां गतिम्"
    iast: "prauṣṭhapadyāṃ paurṇamāsyāṃ hema-siṃha-samanvitam | dadāti yo bhāgavataṃ sa yāti paramāṃ gatim"
  - id: '12.13.15'
    kind: verse
    lines:
      - "सर्ववेदान्तसारं हि श्रीभागवतमिष्यते"
      - "तद्रसामृततृप्तस्य नान्यत्र स्याद्रतिः क्वचित्"
    iast: "sarva-vedānta-sāraṃ hi śrī-bhāgavatam iṣyate | tad-rasāmṛta-tṛptasya nānyatra syād ratiḥ kvacit"
