  - id: '5.10.8'
    kind: verse
    lines:
      - "_* एवं बह्वबद्धमपि भाषमाणं नरदेवाभिमानं रजसा तमसानुविद्धेन मदेन तिरस्कृताशेषभगवत्प्रियनिकेतं पण्डितमानिनं स भगवान्ब्राह्मणो ब्रह्मभूतसर्वभूतसुहृदात्मा योगेश्वरचर्यायां नातिव्युत्पन्नमतिं स्मयमान इव विगतस्मय इदमाह"
    iast: "_* evaṃ bahv abaddham api bhāṣamāṇaṃ nara-devābhimānaṃ rajasā tamasānuviddhena madena tiraskṛtāśeṣa-bhagavat-priya-niketaṃ paṇḍita-māninaṃ sa bhagavān brāhmaṇo brahma-bhūta-sarva-bhūta-suhṛd-ātmā yogeśvara-caryāyāṃ nāti-vyutpanna-matiṃ smayamāna iva vigata-smaya idam āha"
  - id: '5.10.10'
    kind: verse
    lines:
