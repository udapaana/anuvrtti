      - "_* एवमघटमानमनोरथाकुलहृदयो मृगदारकाभासेन स्वारब्धकर्मणा योगारम्भणतो विभ्रंशितः स योगतापसो भगवदाराधनलक्षणाच्च कथमितरथा जात्यन्तर एणकुणक आसङ्गः साक्षान्निःश्रेयसप्रतिपक्षतया प्राक्परित्यक्तदुस्त्यजहृदयाभिजातस्य तस्यैवमन्तरायविहतयोगारम्भणस्य राजर्षेर्भरतस्य तावन्मृगार्भकपोषणपालनप्रीणनलालनानुषङ्गेणाविगणयत आत्मानमहिरिवाखुबिलं दुरतिक्रमः कालः करालरभस आपद्यत"
