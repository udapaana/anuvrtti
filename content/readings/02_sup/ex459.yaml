  kind: graded
  segment: 180
  order: 12
  sentence: 'कृषकस्य द्वे कर्मणी स्तः — कृषिः वाणिज्यम् च। सः द्वाभ्याम् कर्मभ्याम् प्रातः उत्तिष्ठति। सः द्वयोः कर्मणोः कुशलः। ताभ्याम् कर्मभ्याम् तस्य कुलस्य अन्नम् आगच्छति।'
  translation: 'The farmer has two kinds of work — farming and trade. He rises at dawn for both. He is skilled in both. From those two kinds of work comes his family''s food.'
  teaches: 'कर्मन् in the dual: कर्मणी, कर्मभ्याम् (dative, then ablative), कर्मणोः (locative).'
