- id: ex311
  kind: graded
  segment: 185
  order: 1
  sentence: 'देवदत्तः वदति — मित्र, माता नौ पश्यति, आवाभ्याम् च फलानि यच्छति। अस्मत् मा बिभीत, सा बालान् वदति। सा आवयोः स्निह्यति। यज्ञदत्तः वदति — युवाभ्याम् सह अहम् अपि क्रीडामि। गुरुः वाम् ग्रन्थौ यच्छति, युवयोः च प्रसीदति। युष्मत् न कः अपि बिभेति। अनयोः बालयोः पिता राजा, आभ्याम् च सः धनम् ददाति। ताभ्याम् राज्ञः भयम् न अस्ति। काभ्याम् तत् दूरम् गच्छति? एताभ्याम् एव। कयोः विश्वसिमि? एतयोः।'
  translation: 'Devadatta says: "Friend, mother sees us two and gives us two fruit. ''Do not be afraid of us,'' she tells the boys. She is fond of us two." Yajñadatta says: "I too play with you two. The teacher gives you two two books, and is pleased with you two. No one is afraid of you." The father of these two boys is the king, and he gives these two money. Those two have no fear of the king. "From which two does it go far?" "From these two." "In which two do I trust?" "In these two."'
  teaches: 'The last cells of the personal pronouns'' duals and plurals — the enclitic नौ and वाम्, आवाभ्याम्, अस्मत्, आवयोः, युवाभ्याम्, युवयोः, युष्मत् — and इदम्, तद्, किम्, एतद् in the dual.'
