- id: ex311
  kind: graded
  segment: 185
  order: 1
  sentence: 'रात्रौ द्वौ छात्रौ वने मार्गम् न जानीतः। तौ एकम् कुटीरम् पश्यतः, यत्र वृद्धः वृद्धा च वसतः। वृद्धः पृच्छति — युवाम् कौ? छात्रौ वदतः — आवाम् छात्रौ; मार्गम् न जानीवः। आवाभ्याम् जलम् यच्छतम्। वृद्धा वदति — आभ्याम् बालाभ्याम् भोजनम् आनयामि। सा द्वौ कटौ आनयति — युवाम् एतयोः कटयोः स्वपितम्। छात्रौ पृच्छतः — प्रातः युवाम् आवाम् ग्रामम् नेष्यथः? वृद्धः वदति — आम्; एताभ्याम् वृक्षाभ्याम् परम् ग्रामः। छात्रौ वदतः — युवाभ्याम् नमः।'
  translation: 'At night two students cannot find the path in the forest. They see a hut where an old man and an old woman live. The old man asks: "Who are you two?" The students say: "We are students; we do not know the way. Give us water." The old woman says: "I will bring food for these two boys." She brings two mats: "You two sleep on these two mats." The students ask: "In the morning will you take us to the village?" The old man says: "Yes; the village lies beyond these two trees." The students say: "Our homage to you both."'
  teaches: 'The dual pronouns as two speaking to two need them: युवाम्, आवाम् (nominative and accusative), आवाभ्याम्, युवाभ्याम्; and इदम्/एतद् pointing at pairs — आभ्याम्, एतयोः, एताभ्याम्.'
