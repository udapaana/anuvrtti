- id: ex311
  kind: graded
  segment: 185
  order: 1
  sentence: 'रात्रौ द्वौ छात्रौ वने मार्गम् न जानीतः। ते एकम् कुटीरम् पश्यतः, यत्र वृद्धौ वसतः। छात्रौ वदतः — आवाभ्याम् जलम् यच्छतम्। एकः छात्रः वदति — आवाम् भिन्नयोः ग्रामयोः वसावः। वृद्धः पृच्छति — युवाम् काभ्याम् ग्रामाभ्याम् आगच्छथः? छात्रौ वदतः — नद्याः पारे ताभ्याम् ग्रामाभ्याम्। वृद्धा वदति — आभ्याम् बालाभ्याम् भोजनम् आनय। छात्रौ पश्यतः — कुटीरे कटौ न स्तः। ते पृच्छतः — कयोः कटयोः? वृद्धा स्वकटौ आनयति — एतयोः कटयोः युवाम् स्वपितम्। छात्रौ पृच्छतः — प्रातः युवाम् आवाम् ग्रामम् नेष्यथः? वृद्धौ वदतः — आम्; एताभ्याम् वृक्षाभ्याम् परम् ग्रामः। आवयोः विश्वसितम्; आवयोः स्नेहः युवयोः। छात्रौ वदतः — युवाभ्याम् नमः। वृद्धः हसति — न अस्मत्, न युष्मत् — धर्मात् एव सुखम्।'
  translation: 'At night two students cannot find the path in the forest. They see a hut where an old couple lives. The students say: "Give us water." One student says: "We live in different villages." The old man asks: "From which two villages have you come?" The students say: "From those two villages across the river." The old woman says: "Bring food for these two boys. " The students look — there are no mats in the hut. They ask: "On which two mats?" The old woman brings her own two mats: "Sleep on these two mats." The students ask: "Will you two take us to the village in the morning?" The old couple say: "Yes; the village lies beyond these two trees. Trust us two; our affection is with you two." The students say: "Homage to you two." The old man laughs: "Not from us, not from you — happiness comes from dharma alone."'
  teaches: 'The dual pronouns as a dialogue needs them — two speaking to two: आवाभ्याम्, आवाम्, आवयोः, युवयोः, युवाभ्याम्; काभ्याम्, कयोः, ताभ्याम्, आभ्याम्, एतयोः — and the ablative plurals अस्मत्, युष्मत्.'
