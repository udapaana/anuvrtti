  vyakhya: 'यत्-तदोः नित्यसम्बन्धः। ये भ्रमराः … ते; याः लताः … ताः; यानि पुष्पाणि … तानि।'
  vyakhya_en: |
    A relative clause names a group and the main clause says what happens to it; यद् and तद् come in pairs. In the plural यद् has three forms by gender: ये भ्रमराः (masculine), याः लताः (feminine), यानि पुष्पाणि (neuter) — answered by ते, ताः, तानि.
