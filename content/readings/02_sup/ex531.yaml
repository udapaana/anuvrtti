  sentence: 'एकः वृद्धः उद्यानम् रक्षति। उद्याने बहूनि पुष्पाणि सन्ति। यानि पुष्पाणि रक्तानि, तानि वृद्धः देवाय ददाति। ये भ्रमराः आगच्छन्ति, ते मधु पिबन्ति। याः लताः शुष्काः, ताः वृद्धः छिनत्ति।'
  translation: 'An old man looks after a garden. In the garden there are many flowers. The flowers that are red, the old man offers to the god. The bees that come drink the nectar. The creepers that are dry, the old man cuts away.'
  teaches: 'यद् in the nominative plural, three genders — ये, याः, यानि — each answered by तद्'
