  sentence: 'ग्रामे हरिः नाम गोपः वसति। सः प्रतिदिनम् गवाम् समूहम् वनम् नयति। सायम् सः गवाम् दुग्धम् ग्रामम् आनयति। एकदा ग्रामे महान् उत्सवः आसीत्। हरिः महते उत्सवाय बहु दुग्धम् अयच्छत्।'
