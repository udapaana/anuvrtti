  vyakhya: 'गो-शब्दस्य षष्ठीबहुवचने गवाम्। महत्-शब्दस्य चतुर्थ्याम् महते, प्रथमायाम् महान्।'
  vyakhya_en: |
    गो "cow" is an ओ-stem: before a vowel ending its ओ becomes अव्, so the genitive plural is गवाम् — not a noun's नाम्. महत् "great" lengthens and takes न् only in the strong cases (महान्), so the dative is plain महत् + ए → महते, agreeing with उत्सवाय.
