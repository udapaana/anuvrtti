  sentence: 'पितामहः पुनः वेदम् पठति — हे ऋचः, आगच्छत। मन्त्राः आगच्छन्ति। सः वेदम् सर्वेभ्यः वस्तुभ्यः श्रेष्ठम् मन्यते।'
  translation: 'Grandfather recites the Veda again — "Verses, come!" The mantras come back. He holds the Veda dearer than all things.'
