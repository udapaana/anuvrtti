  order: 6
  sentence: 'पितामहः पुनः वेदम् पठति। अद्य ते द्वे ऋचौ अपि आगच्छतः। सः वेदम् सर्वेभ्यः वस्तुभ्यः श्रेष्ठम् मन्यते।'
  translation: 'Grandfather recites the Veda again. Today those two verses come to him too. He holds the Veda dearer than all things.'
  teaches: 'Mālatī, part 5 — the verses return: ऋचौ, the two he forgot, and वस्तुभ्यः as the ablative of comparison.'
