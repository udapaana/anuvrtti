- id: ex323
  kind: graded
  segment: 183
  order: 6
  sentence: 'पितामहः पुनः वेदम् पठति। पूर्वम् सः द्वे ऋचौ विस्मरति स्म; अद्य ते ऋचौ अपि तस्य स्मृतिम् आगच्छतः। सः वेदम् सर्वेभ्यः वस्तुभ्यः श्रेष्ठम् मन्यते।'
  translation: 'Grandfather recites the Veda again. Before, he had forgotten two verses; today those verses too come back to his memory. He holds the Veda dearer than all things.'
  teaches: 'Mālatī, part 5 — the verses return: ऋचौ, accusative and then nominative dual; लट् with स्म for the past; वस्तुभ्यः, the ablative of comparison.'
