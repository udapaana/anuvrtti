- id: ex300
  kind: graded
  segment: 181
  order: 1
  sentence: 'शिष्याः गुरुभ्याम् विद्याम् लभन्ते, पुत्राः पितृभ्यः मातृभ्यः च धर्मम्। कन्ये पितृभ्याम् मातृभ्याम् च आशिषः लभेते। मुनिभ्यः ज्ञानम्, मुनिभ्याम् च उपदेशः प्रभवति। प्रजाः राजभ्यः बिभ्यति, न तु राजभ्याम्। नदीभ्यः जलम्, कन्याभ्यः च पुष्पाणि आगच्छन्ति। मनसः कामः जायते, मनोभ्यः च विचाराः।'
  translation: 'Pupils gain knowledge from their two teachers, sons dharma from their fathers and mothers. The two girls receive blessings from father and mother. From sages knowledge arises, and from the two sages, teaching. Subjects fear kings — but not these two kings. From the rivers comes water, and from the girls, flowers. Desire is born from the mind, and thoughts from minds.'
  teaches: 'The ablative in the dual and plural — गुरुभ्याम्, पितृभ्यः/पितृभ्याम्, मातृभ्यः/मातृभ्याम्, मुनिभ्यः/मुनिभ्याम्, राजभ्यः/राजभ्याम्, नदीभ्यः, कन्याभ्यः, मनसः, मनोभ्यः.'
