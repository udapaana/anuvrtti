- id: ex300
  kind: graded
  segment: 181
  order: 1
  sentence: 'गुरुः पृच्छति — शुभम् कुतः आगच्छति? शिष्याः वदन्ति — अन्येभ्यः। गुरुः वदति — सत्यम्। पाण्डवाः गुरुभ्याम् — द्रोणात् कृपात् च — धनुर्विद्याम् अलभन्त। रामः मुनिभ्याम् — वसिष्ठात् विश्वामित्रात् च — विद्याम् अलभत। वेदः ऋषिभ्यः आगच्छति। कृष्णः मातृभ्याम् — देवक्याः यशोदायाः च — स्नेहम् अलभत। रामलक्ष्मणौ राजभ्याम् — दशरथात् जनकात् च — आशिषः अलभेताम्। वयम् पितृभ्यः मातृभ्यः च जन्म लभामहे। यथा सरोभ्यः कमलानि लताभ्यः च पुष्पाणि, तथा गुरुभ्यः विद्या। विद्यायाः तु न चोरेभ्यः भयम्, न राजभ्यः।'
  translation: 'The teacher asks: "Where does good come from?" The pupils say: "From others." The teacher says: "True. The Pāṇḍavas got archery from two teachers — Droṇa and Kṛpa. Rāma got learning from two sages — Vasiṣṭha and Viśvāmitra. The Veda comes from the seers. Kṛṣṇa got love from two mothers — Devakī and Yaśodā. Rāma and Lakṣmaṇa got blessings from two kings — Daśaratha and Janaka. We get birth from our fathers and mothers. As lotuses come from lakes and flowers from creepers, so knowledge comes from teachers. But knowledge has nothing to fear — not from thieves, not from kings."'
  teaches: 'The ablative of source, -भ्याम् and -भ्यः, through famous pairs: गुरुभ्याम् (Droṇa and Kṛpa), मुनिभ्याम्, मातृभ्याम् (Devakī and Yaśodā), राजभ्याम्; and ऋषिभ्यः, पितृभ्यः, मातृभ्यः, सरोभ्यः, लताभ्यः, राजभ्यः — the last after भय (1.4.25).'
