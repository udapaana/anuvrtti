- id: ex284
  kind: graded
  segment: 176
  order: 3
  sentence: 'बालाः अवदन् — वयम् ह्यः वनम् अगच्छाम। तत्र अस्मान् गुरुः अपश्यत्, अस्मभ्यम् फलानि च अयच्छत्, अस्माभिः सह अक्रीडत् च। गुरुः अस्मासु प्रसीदति। यूयम् ह्यः कुत्र अगच्छत? युष्माकम् ग्रामे उत्सवः आसीत्, वयम् युष्मान् तत्र अपश्याम। अधुना वयम् युष्माभिः सह क्रीडामः, युष्मभ्यम् पुष्पाणि च यच्छामः। अस्माकम् माता युष्मासु अपि स्निह्यति।'
  translation: 'The boys said: "Yesterday we went to the forest. There the teacher saw us, gave us fruit, and played with us. The teacher is pleased with us. Where did you go yesterday? There was a festival in your village; we saw you there. Now we will play with you and give you flowers. Our mother is fond of you too."'
  teaches: 'The plural of अहम् and त्वम् in every case — वयम्, अस्मान्, अस्माभिः, अस्मभ्यम्, अस्माकम्, अस्मासु and the यूयम् set — with the imperfect plural.'
