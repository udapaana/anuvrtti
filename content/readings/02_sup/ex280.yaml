- id: ex280
  kind: graded
  segment: 172
  order: 1
  sentence: 'कृषकः भूमिम् कर्षति। भूमिः तस्मै अन्नम् ददाति। भूम्या सर्वे जीवन्ति। कृषकः भूम्यै नमति, भूमौ बीजानि वपति। सः वदति — हे भूमे, रक्ष माम्।'
  translation: 'The farmer ploughs the earth. The earth gives him food. By the earth all live. The farmer bows to the earth and sows seeds in it. He says: "O earth, protect me."'
  teaches: 'भूमि (इ-stem feminine) through the singular — भूम्या, भूम्यै, भूमौ, हे भूमे.'
