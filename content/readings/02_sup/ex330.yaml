- id: ex330
  kind: graded
  segment: 191
  order: 1
  sentence: 'रात्रौ वणिजौ गृहम् प्रति अचलताम्। सर्वासु दिक्षु अन्धकारः आसीत्। न दिक् न मार्गः अदृश्यत। सागरदत्तः अपृच्छत् — कस्याम् दिशि उज्जयिनी? तदा धनदत्तस्य द्वौ सुवर्णवर्णौ पक्षिणौ उत्तरया दिशा उदपतताम्। वणिजौ अपि ताम् एव दिशम् अगच्छताम्। प्रातः सूर्यः सर्वाः दिशः अप्रकाशयत्, वणिजौ च उज्जयिन्याः मार्गम् अपश्यताम्।'
  translation: 'At night the merchants set off for home. In every direction there was darkness. Neither direction nor road could be seen. Sāgaradatta asked: "In which direction is Ujjayinī?" Then Dhanadatta''s two golden birds flew off by the northern direction. The merchants too went that same way. At dawn the sun lit up all the directions, and the merchants saw the road to Ujjayinī.'
  teaches: 'Part 5 — the night road: दिश् through the cases — दिक्षु, दिक्, दिशि, दिशा, दिशम्, दिशः (accusative plural).'
