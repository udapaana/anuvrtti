- id: ex330
  kind: graded
  segment: 191
  order: 1
  sentence: 'रात्रौ वणिजौ गृहम् प्रति अचलताम्। सर्वासु दिक्षु अन्धकारः आसीत्। न दिक् न मार्गः अदृश्यत। सागरदत्तः अपृच्छत् — कस्याम् दिशि उज्जयिनी? तदा पक्षिणौ उत्तरया दिशा उदपतताम्। वणिजौ अपि ताम् एव दिशम् अगच्छताम्। मरुत् शीतः अवहत्। मरुति हिमम् आसीत्। मरुताम् वेगः महान्। मार्गे द्वे सरितौ आस्ताम्। सरितोः जलम् गभीरम्। उज्जयिनी सरिद्भ्याम् न दूरम्। प्रातः सूर्यः सर्वाः दिशः अप्रकाशयत्। सूर्यः दिशाम् स्वामी।'
  translation: 'At night the merchants set off for home. In every direction there was darkness. Neither direction nor road could be seen. Sāgaradatta asked: "In which direction is Ujjayinī?" Then the two birds flew off by the northern direction. The merchants too went that same way. A cold wind blew. In the wind there was frost. The force of the winds was great. On the road were two rivers. The water of the two rivers was deep. Ujjayinī is not far from the two rivers. At dawn the sun lit up all the directions. The sun is the lord of the directions.'
  teaches: 'Part 5 — the night road: दिश् (दिक्षु, दिक्, दिशि, दिशा, दिशम्, दिशः, दिशाम्), मरुत् (मरुत्, मरुति, मरुताम्), सरित् (सरितौ, सरितोः, सरिद्भ्याम्).'
