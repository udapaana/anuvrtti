  vyakhya: 'समीपे खद्योताः — इमे। दूरे तारकाः — अमूः। अदसः स्त्रियाम् प्रथमाबहुवचने अमूः।'
  vyakhya_en: |
    Near and far again, now in the plural. The fireflies at hand are इमे (इदम्, masculine plural); the stars far up are अमूः — अदस् in the feminine plural, its आ turned to ऊ by 8.2.80. The question words match: के for the masculine खद्योताः, काः for the feminine तारकाः.
