  sentence: 'रात्रौ बालिका मात्रा सह उद्याने तिष्ठति। समीपे खद्योताः दीप्यन्ते। सा पृच्छति — इमे के? माता वदति — इमे खद्योताः। बालिका आकाशम् पश्यति — अमूः काः? माता वदति — अमूः तारकाः।'
  translation: 'At night a girl stands in the garden with her mother. Nearby, fireflies are glowing. She asks: "What are these?" Her mother says: "These are fireflies." The girl looks at the sky: "What are those?" Her mother says: "Those are stars."'
  teaches: 'अदस् feminine plural अमूः for the far stars, against इमे for the near fireflies'
