- id: ex259
  kind: graded
  segment: 161
  sentence: 'सर्वे बालाः क्रीडन्ति। पूर्वः बालः हसति, परः बालः तस्य पश्चात् धावति।'
  translation: 'All the boys are playing. The boy in front laughs; the boy behind runs after him.'
  teaches: 'more सर्वादि — the pair पूर्व / पर, each declining like तद् (पूर्वः, परः) and agreeing in gender with बाल.'
