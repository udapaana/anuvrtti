- id: ex333
  kind: graded
  segment: 192
  order: 2
  sentence: 'एकदा रात्रौ तौ खगौ मनुष्यवाचा अवदताम्। राजा अपृच्छत् — हे पक्षिणौ, युवाम् कौ? खगौ अवदताम् — आवाम् मरुतौ स्वः। त्रीणि जगन्ति सन्ति — स्वर्गः, पृथिवी, पातालः च। त्रिषु जगत्सु आवाम् चरावः। जगतः रक्षणम् आवयोः कर्म। आवाम् जगते हितम् कुर्वः। राजा मरुतोः वचनम् अशृणोत्, मरुद्भ्याम् पुष्पाणि च अयच्छत्।'
  translation: 'One night the two birds spoke in a human voice. The king asked: "Birds, who are you?" The birds said: "We two are winds. There are three worlds — heaven, earth and the underworld. In the three worlds we roam. Guarding the world is our work. We do good to the world." The king heard the winds'' words, and gave flowers to the two winds.'
  teaches: 'Part 8 — the birds'' secret: पक्षिणौ (vocative), मरुतौ, मरुतोः, मरुद्भ्याम्; the neuter जगत् — जगन्ति, जगत्सु, जगतः, जगते.'
