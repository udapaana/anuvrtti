- id: ex010
  segment: 20
  sentence: नरः नद्याम् फलम् पश्यति।
  translation: The man sees fruit in the river.
  teaches: 'a feminine stem in -ई: नदी becomes नद्याम् in the locative, the ई turning to य् before the ending'
  words:
  - form: नरः
    lemma: नर
    gloss: the man
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: नद्याम्
    gloss: in the river
    notes:
    - term: अधिकरण
      en: locus
    - term: सप्तमी
      en: locative
    - term: एकवचन
      en: singular
    - cite: 2.3.36
      role: सप्तम्यधिकरणे च → नद्याम् (the locus)
    - term: स्त्रीलिङ्ग
      en: feminine — a ङीप्-formed ई-stem
    - cite: 4.1.3
      role: स्त्रियाम् — the feminine, opening the stems नदी belongs to
    - cite: 4.1.5
      role: ऋन्नेभ्यो ङीप् — नदी is a ङीप्-formed ī-stem feminine
    - text: नदी + आम्
    - cite: 7.3.116
      role: 'ङेराम्नद्याम्नीभ्यः — ī-stem fem locative sg takes आम्: नदी+आम्'
    - text: → नद्याम्
    - cite: 6.1.77
      role: 'इको यणचि — ई before आम् becomes य्: नदी+आम् → नद्याम्'
  - form: फलम्
    lemma: फल
    gloss: the fruit
    notes:
    - term: कर्मन्
      en: object
    - term: नपुंसक
      en: neuter (nom.=acc.)
  - form: पश्यति
    lemma: दृश्
    gloss: sees
    notes:
    - term: दृश्
      en: '"see"'
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  vyakhya: अधिकरणे सप्तमी — स्त्रीलिङ्गेऽपि सैव।
  vyakhya_en: |
    ग्रामे and नद्याम् are the same case — both say "in" — but they look nothing
    alike, because ग्राम and नदी belong to different stem-classes and take
    different endings. The part a word plays decides WHICH case; the shape of
    the stem decides what that case looks like on it.
