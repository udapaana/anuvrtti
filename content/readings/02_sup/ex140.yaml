- id: ex140
  segment: 150
  sentence: दण्डिनम् पश्यति।
  translation: He sees the staff-bearer.
  teaches: 'the इन्-stem in the accusative: दण्डिनम् — the न् stays before a vowel ending, where दण्डी loses it'
  words:
  - form: दण्डिनम्
    lemma: दण्डिन्
    gloss: the staff-bearer (object)
    notes:
    - term: कर्मन्
      en: object
    - text: 'before the vowel ending अम्, the न् is retained → दण्डिनम् (no न-lopa)'
    - cite: '2.3.2'
      role: कर्मणि द्वितीया → दण्डिनम्
    - term: द्वितीया
      en: accusative singular
  - form: पश्यति
    lemma: दृश्
    gloss: sees
    notes:
    - term: दृश्
      en: '"see"'
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  vyakhya: अजादौ प्रत्यये नकारः तिष्ठति। दण्डिन् + अम् → दण्डिनम् (न लोपः)।
  vyakhya_en: |
    दण्डी (nom.) vs दण्डिनम् (acc.): the नलोपः of 8.2.7 happens only at the END of a word, so when a vowel-initial ending like अम् follows, the न् has something to attach to and is kept → दण्डिनम्. The pair दण्डी / दण्डिनम् mirrors भगवान् / भगवतः and राजा / राज्ञः — every consonant stem shows this front (strong, visible) vs back (weak, stem-revealing) contrast.
