- id: ex331
  kind: graded
  segment: 191
  order: 2
  sentence: 'तौ नगरम् अगच्छताम्। सभायाम् बुद्धिमन्तः जनाः आसन्, अन्ये राजानः अपि। राजा गुणवन्तौ वणिजौ अपश्यत्। सः धनवतः नागरिकान् अन्यान् राज्ञः च आह्वयत्। मन्त्री श्रीमते राज्ञे पक्षिणौ अदर्शयत्। राजा अवदत् — हे मन्त्रिणः, एतौ पश्यत। मन्त्रिषु एकः वृद्धः अवदत् — बुद्धिमताम् मध्ये इमौ श्रेष्ठौ। राजा वणिजोः कर्माणि अप्रशंसत्, अवदत् च — युवयोः नामनी अमरे भविष्यतः। सः वणिग्भ्याम् मन्त्रिभ्याम् च सह भोजनम् अकरोत्।'
  translation: 'The merchants reached the city. In the hall were wise people, and other kings too. The king saw the two worthy merchants. He summoned the wealthy citizens and the other kings. The minister showed the birds to the glorious king. The king said: "Ministers, look at these two." Among the ministers an old one said: "Among the wise these two are the best." The king praised the merchants'' deeds and said: "Your two names will be immortal." He dined with the two merchants and the two ministers.'
  teaches: 'Part 6 — the court: राजानः, राज्ञः (accusative plural); the मत्/वत् stems in the plural and dual — बुद्धिमन्तः, गुणवन्तौ, धनवतः, श्रीमते, बुद्धिमताम्; मन्त्रिणः (vocative), मन्त्रिषु, मन्त्रिभ्याम्; कर्माणि, नामनी; वणिजौ (accusative), वणिजोः, वणिग्भ्याम्.'
