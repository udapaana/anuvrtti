- id: ex331
  kind: graded
  segment: 191
  order: 2
  sentence: दूरात् द्वौ वणिजौ राज्ञः नगरम् अगच्छताम्, द्वौ दुर्लभौ पक्षिणौ च आनयताम्। राजा गुणवन्तौ वणिजौ सभाम् आह्वयत्, धनवतः नागरिकान् अन्यान् राज्ञः च। सभायाम् बुद्धिमन्तः मन्त्रिणः ते राजानः च आसन्। एकः मन्त्री श्रीमते राज्ञे पक्षिणौ अदर्शयत्। राजा अवदत् — हे मन्त्रिणः, एतौ पश्यत। मन्त्रिषु एकः वृद्धः अवदत् — बुद्धिमताम् मध्ये इमौ वणिजौ श्रेष्ठौ। राजा वणिजोः कर्माणि प्राशंसत्, अवदत् च — युवयोः नामनी अमरे भविष्यतः। सः वणिग्भ्याम् मन्त्रिभ्याम् च सह भोजनम् अकरोत्।
  translation: 'From far away two merchants went to the king''s city, and they brought two rare birds. The king summoned the two worthy merchants to the hall, along with the wealthy citizens and the neighbouring kings. In the hall were the wise ministers and those kings. One minister showed the birds to the glorious king. The king said: "Ministers, look at these two." Among the ministers an old one said: "Among the wise, these two merchants are the best." The king praised the merchants'' deeds and said: "Your two names will be immortal." He dined with the two merchants and two ministers.'
  teaches: 'Part 6 — the court: राजानः, राज्ञः (accusative plural); the मत्/वत् stems in the plural and dual — बुद्धिमन्तः, गुणवन्तौ, धनवतः, श्रीमते, बुद्धिमताम्; मन्त्रिणः (nominative and vocative), मन्त्रिषु, मन्त्रिभ्याम्; कर्माणि, नामनी; वणिजौ, वणिजोः, वणिग्भ्याम्.'
