  sentence: 'राजा द्वयोः ऋत्विजोः विश्वसिति।'
  translation: 'The king trusts his two priests.'
  teaches: 'the ज्-stem ऋत्विज् in the locative dual, ऋत्विजोः, with विश्वस् "trust in"'
  words:
  - form: राजा
    lemma: राजन्
    gloss: 'the king'
    notes:
    - term: पुंलिङ्ग
      en: 'masculine'
    - term: कर्तृ
      en: 'the one who trusts'
    - term: प्रथमा
      en: 'nominative — अन्-stem राजन् drops its न्: राजा'
  - form: द्वयोः
