- id: ex345
  kind: graded
  segment: 179
  order: 3
  sentence: ऋषिः वदति — प्रजाः राजसु विश्वसन्ति, पुत्राः पितृषु मातृषु च।
  translation: 'A sage says: "Subjects trust their kings, and sons their fathers and mothers."'
  teaches: विश्वस् "trust" takes the सप्तमी of the one relied on — राजसु, पितृषु, मातृषु, the locative plurals of the अन्- and ऋ-stems.
  words:
  - form: ऋषिः
    lemma: ऋषि
    gloss: a sage
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: वदति
    lemma: वद्
    gloss: says
    notes:
    - term: लट्
      en: present
  - form: प्रजाः
    lemma: प्रजा
    gloss: subjects
    notes:
    - term: कर्तृ
      en: subject of विश्वसन्ति — आ-stem feminine nom. pl -आः
    - term: प्रथमा
      en: nominative plural
  - form: राजसु
    lemma: राजन्
    gloss: in their kings
    notes:
    - term: अधिकरण
      en: the object of trust — the न् drops before सु
    - term: सप्तमी
      en: locative plural
  - form: विश्वसन्ति
    lemma: श्वस्
    gloss: trust
    notes:
    - term: 'वि'
      en: 'preverb वि — विश्वसन्ति is वि + श्वस्'
    - term: लट्
      en: present, with the preverb वि
  - form: पुत्राः
    lemma: पुत्र
    gloss: sons
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative plural
  - form: पितृषु
    lemma: पितृ
    gloss: in their fathers
    notes:
    - term: अधिकरण
      en: location
    - term: सप्तमी
      en: locative plural
  - form: मातृषु
    lemma: मातृ
    gloss: in their mothers
    notes:
    - term: अधिकरण
      en: location
    - term: सप्तमी
      en: locative plural
  - form: च
    lemma: च
    gloss: and
    notes:
    - term: अव्यय
      en: indeclinable
