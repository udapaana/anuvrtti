- id: ex329
  kind: graded
  segment: 190
  order: 2
  sentence: 'समुद्रस्य तीरे एकः वृद्धः वणिक् अवसत्। वणिजः गृहे सुवर्णवर्णयोः पक्षिणोः नीडम् आसीत्। धनदत्तः तम् वणिजम् अपश्यत्, अवदत् च — हे वणिक्, मह्यम् पक्षिणौ देहि। वृद्धः अवदत् — मम मनः एतयोः पक्षिणोः अस्ति। धनदत्तः पक्षिभ्याम् फलानि अयच्छत्। पक्षिणौ तस्य हस्तात् फलानि अखादताम्। तदा वृद्धे वणिजि दया अभवत्। ततः धनदत्तः तस्मात् वणिजः पक्षिणौ अक्रीणात्।'
  translation: 'On the seashore lived an old merchant. In the merchant''s house was the nest of two golden birds. Dhanadatta saw the merchant and said: "Merchant, give me the two birds." The old man said: "My heart is set on these two birds." Dhanadatta gave fruit to the two birds. The birds ate the fruit from his hand. Then kindness arose in the old merchant. So Dhanadatta bought the birds from him.'
  teaches: 'Part 4 — the seller: वणिजम्, वणिक् (vocative), वणिजि, वणिजः (ablative — bought from); पक्षिणोः (genitive and locative), पक्षिभ्याम्.'
