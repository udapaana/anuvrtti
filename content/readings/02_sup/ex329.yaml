- id: ex329
  kind: graded
  segment: 190
  order: 2
  sentence: 'समुद्रस्य तीरे एकः वृद्धः अवसत्। तस्य गृहे सुवर्णवर्णयोः पक्षिणोः नीडम् आसीत्। धनदत्तः तम् वणिजम् अपश्यत्, अवदत् च — हे वणिक्, अस्मभ्यम् पक्षिणौ देहि। वृद्धः अवदत् — मम मनः अस्मिन् पक्षिणि अस्ति। तथापि वणिजि दया आसीत्। धनदत्तः पक्षिभ्याम् फलानि अयच्छत्। ततः सः वणिजः पक्षिणौ रत्नानि च अक्रीणात्।'
  translation: 'On the seashore lived an old man. In his house was the nest of two golden birds. Dhanadatta saw that merchant and said: "Merchant, give us the two birds." The old man said: "My heart is in this bird." Yet there was kindness in the merchant. Dhanadatta gave fruit to the two birds. Then he bought the birds and the jewels from the merchant.'
  teaches: 'Part 4 — the seller: वणिजम्, वणिक् (vocative), वणिजि, वणिजः (ablative — bought from); पक्षिणोः, पक्षिणि, पक्षिभ्याम्.'
