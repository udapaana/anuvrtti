- id: ex340
  kind: graded
  segment: 196
  order: 2
  sentence: 'उज्जयिन्याम् एकस्याम् शिलायाम् वणिजोः नामनी स्तः। तयोः नाम्नोः अधः राजा श्लोकम् अलिखत् — हे जगत्, त्वम् एतौ मरुतौ स्मर। एतौ वणिग्भ्याम् सह बह्वीः सरितः अतरताम्, महद्भ्याम् वनाभ्याम् च निरगच्छताम्। तौ देवौ अद्य अपि उज्जयिन्याम् पूज्येते।'
  translation: 'In Ujjayinī the two merchants'' names stand on a stone. Below those two names the king wrote a verse: "O world, remember these two winds. With the two merchants they crossed many rivers, and came out of two great forests." Those two gods are worshipped in Ujjayinī even today.'
  teaches: 'Part 15 — the verse on the temple: नाम्नोः (genitive dual, with अधः), जगत् (vocative), मरुतौ (accusative dual), वणिग्भ्याम् (with सह), सरितः (accusative plural), महद्भ्याम् वनाभ्याम् (ablative dual); तौ देवौ with the passive dual पूज्येते.'
