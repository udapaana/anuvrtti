- id: ex340
  kind: graded
  segment: 196
  order: 2
  sentence: 'मन्दिरस्य भित्तौ राजा श्लोकम् अलिखत् — हे नाम, त्वम् अमरम् भव। हे कर्माणि, यूयम् जगते सुखम् यच्छत। हे जगत्, त्वम् एतौ स्मर। एकदा पुत्रौ पुनः मरुतौ अपश्यताम्। तौ द्वे दिशौ प्रति अचलताम्, पुत्रौ च ताभ्याम् दिग्भ्याम् नमः अकुरुताम्। मार्गे तौ बह्वीः सरितः अतरताम्, महद्भ्याम् वनाभ्याम् च निरगच्छताम्। ते देवौ उभाभ्याम् जगद्भ्याम् पूज्येते। अन्ते तौ जगद्भ्यः ऊर्ध्वम् उदपतताम्।'
  translation: 'On the temple wall the king wrote a verse: "O name, be immortal. O deeds, give happiness to the world. O world, remember these two." One day the sons saw the two winds again. The winds set out towards two directions, and the sons bowed to those two directions. On the way they crossed many rivers, and came out of two great forests. Those two gods are worshipped by both worlds. At last the winds flew up, above the worlds.'
  teaches: 'Part 15 — the inscription: नाम, कर्माणि and जगत् as vocatives; मरुतौ, दिशौ and सरितः as accusatives; दिग्भ्याम् (dative), महद्भ्याम् (ablative), जगद्भ्याम् (instrumental — the agent of the passive), जगद्भ्यः (ablative).'
