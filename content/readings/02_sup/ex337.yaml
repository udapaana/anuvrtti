- id: ex337
  kind: graded
  segment: 194
  order: 2
  sentence: 'हिमवतः शिखरे तौ पुराणान् सुहृदः अपश्यताम्। शिवदत्तः सुहृदे मणिम् अयच्छत्, गुणवद्भ्याम् अन्याभ्याम् सुहृद्भ्याम् च रत्ने। तयोः सुहृदोः तस्य विश्वासः। शिखरात् उभे जगती दृश्येते। उभयोः जगतोः शोभा महती। जगतः दूरम् एकः मुनिः वसति। तस्य प्रीतिः बुद्धिमति शिष्ये। सः गायति — हे सरितः, हे दिशः, हे जगन्ति, हे मरुतः, युष्मभ्यम् नमः। देवाः जगद्भ्यः हितम् कुर्वन्ति, ऋषयः च सरिद्भ्यः दिग्भ्यः च नमः कुर्वन्ति।'
  translation: 'On the Himālaya''s peak the two saw their old friends. Śivadatta gave a gem to one friend, and jewels to the two other worthy friends. In those two friends he trusted. From the peak both worlds can be seen. The beauty of both worlds is great. Far from the world lives a sage. His love is for his clever pupil. He sings: "O rivers, O directions, O worlds, O winds — obeisance to you. The gods do good to the worlds, and the sages bow to the rivers and the directions."'
  teaches: 'Part 12 — the peak and the hymn: सुहृदः, सुहृदे, सुहृदोः, गुणवद्भ्याम् (dative), बुद्धिमति; जगती, जगतोः, जगतः (ablative), जगद्भ्यः; the vocative plurals सरितः, दिशः, जगन्ति, मरुतः; सरिद्भ्यः and दिग्भ्यः as datives.'
