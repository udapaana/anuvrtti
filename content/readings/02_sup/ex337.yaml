- id: ex337
  kind: graded
  segment: 194
  order: 2
  sentence: 'हिमवतः शिखरे वणिजौ एकम् मुनिम् अपश्यताम्, यः तत्र तपः अकरोत्। वणिजौ मुनिम् अनमताम्, तस्मै यात्रायाः कथाम् च अवदताम्। सागरदत्तः मरुतः प्रश्नस्य उत्तरम् अवदत् इति मुनिः अशृणोत्; तस्य प्रीतिः बुद्धिमति सागरदत्ते अभवत्। ततः मुनिः दिशः सरितः मरुतः च आह्वयत् — हे दिशः, हे सरितः, हे मरुतः, गृहस्य मार्गे एतौ वणिजौ रक्षत। सरिद्भ्यः दिग्भ्यः मरुद्भ्यः च नमः। सः गुणवद्भ्याम् वणिग्भ्याम् आशिषम् अयच्छत्। वणिजौ मुनये एकम् रत्नम् अयच्छताम्।'
  translation: 'On a peak of the Himālaya the merchants found a sage who was practising austerities there. They bowed to the sage and told him the story of their journey. The sage heard that Sāgaradatta had answered the wind''s question, and his affection went to clever Sāgaradatta. Then the sage called on the directions, the rivers and the winds: "O directions, O rivers, O winds, guard these two merchants on the road home. Homage to the rivers, the directions and the winds." He gave his blessing to the two worthy merchants. The merchants gave the sage a jewel.'
  teaches: 'Part 12 — the sage''s blessing: the vocative plurals दिशः, सरितः, मरुतः, the same shapes as the accusatives just before them; नमः with the dative सरिद्भ्यः, दिग्भ्यः, मरुद्भ्यः; बुद्धिमति (locative of affection), गुणवद्भ्याम्; मरुतः (genitive).'
