- id: ex337
  kind: graded
  segment: 194
  order: 2
  sentence: 'हिमवतः शिखरे वणिजौ तम् एव मुनिम् अपश्यताम्। सः तत्र तपः अकरोत्। वणिजौ मुनिम् अनमताम्। मरुतौ मुनये सर्वम् अवदताम्। तस्य प्रीतिः बुद्धिमति सागरदत्ते आसीत्, यतः सः मरुतः प्रश्नस्य उत्तरम् अवदत्। ततः मुनिः दिशः सरितः मरुतः च आह्वयत् — हे दिशः, हे सरितः, हे मरुतः, एतौ वणिजौ रक्षत। सरिद्भ्यः दिग्भ्यः मरुद्भ्यः च नमः। सः गुणवद्भ्याम् वणिग्भ्याम् आशिषम् अयच्छत्। वणिजौ मुनये एकम् रत्नम् अयच्छताम्।'
  translation: 'On the Himālaya''s peak the merchants found that same sage. He was practising austerities there. The merchants bowed to the sage. The two winds told the sage everything. His affection went to clever Sāgaradatta, because he had answered the wind''s question. Then the sage called on the directions, the rivers and the winds: "O directions, O rivers, O winds, guard these two merchants. Homage to the rivers, the directions and the winds." He gave his blessing to the two worthy merchants. The merchants gave the sage a jewel.'
  teaches: 'Part 12 — the sage''s blessing: the vocative plurals दिशः, सरितः, मरुतः, the same shapes as the accusatives just before them; नमः with the dative सरिद्भ्यः, दिग्भ्यः, मरुद्भ्यः; बुद्धिमति (locative of affection), गुणवद्भ्याम्; मरुतः (genitive).'
