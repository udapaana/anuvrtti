  sentence: 'माता पुत्रम् पृच्छति — एते फले काभ्याम् यच्छसि? पुत्रः वदति — मम मित्राभ्याम्।'
  translation: 'The mother asks her son: "To which two are you giving these two fruits?" The son says: "To my two friends."'
  teaches: 'The dative dual of किम् — काभ्याम्, "to which two?" — answered with a dative dual, मित्राभ्याम्.'
