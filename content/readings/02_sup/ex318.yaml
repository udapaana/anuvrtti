- id: ex318
  kind: graded
  segment: 183
  order: 1
  sentence: 'गोपालः धेनुभ्याम् सह वनम् गच्छति। धेन्वोः घण्टे स्तः। सः गोभ्याम् तृणम् ददाति। धेनोः दुग्धम् प्राप्नोति, गोः अपि क्षीरम्। गवोः काकौ तिष्ठतः। व्याघ्रः गोभ्यः दूरम् तिष्ठति। हे गौः, आगच्छ। गावौ, गृहम् चलतम्।'
  translation: 'The cowherd goes to the forest with the two cows. On the two cows are two bells. He gives grass to the two cows. He gets milk from the cow, and milk from the other cow too. On the two cows stand two crows. The tiger stays far from the cows. "O cow, come! You two cows, go home!"'
  teaches: 'धेनु and the irregular गो in the cells the corpus lacked: धेनुभ्याम्, धेन्वोः, धेनोः (ablative), गोभ्याम्, गोः (ablative), गवोः, गोभ्यः, and the vocatives गौः, गावौ.'
