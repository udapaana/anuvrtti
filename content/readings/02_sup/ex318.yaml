- id: ex318
  kind: graded
  segment: 183
  order: 1
  sentence: 'गोपालः द्वे धेनू वनम् नयति। धेन्वोः घण्टे लम्बेते। सः ताभ्याम् तृणम् ददाति। सायम् एकः व्याघ्रः आगच्छति, गोभ्याम् न दूरम्। गोपालः वदति — हे गावौ, मम पृष्ठतः तिष्ठतम्। सः दण्डम् उद्यच्छति, व्याघ्रः च धावति। ततः गोपालः गवोः पृष्ठयोः हस्तौ स्थापयति, धेनुभ्याम् सह च गृहम् गच्छति।'
  translation: 'A cowherd leads two cows to the forest. On the two cows hang two bells. He gives them grass. At dusk a tiger comes, not far from the two cows. The cowherd says: "You two, stand behind me." He raises his staff, and the tiger runs. Then the cowherd lays his hands on the two cows'' backs and goes home with them.'
  teaches: 'धेनु and the irregular गो in the dual — धेनू, धेनुभ्याम्, धेन्वोः; गोभ्याम् (far from), गवोः, and the vocative गावौ — in one evening with a tiger.'
