- id: ex318
  kind: graded
  segment: 183
  order: 1
  sentence: 'गोपालः धेनुभ्याम् सह वनम् गच्छति। धेन्वोः घण्टे लम्बेते। सः ताभ्याम् तृणम् ददाति। सायम् एकः व्याघ्रः आगच्छति, गोभ्याम् न दूरम्। गोपालः वदति — हे कपिले गौः, अत्र तिष्ठ। हे गावौ, मम पृष्ठतः तिष्ठतम्। सः दण्डम् उद्यच्छति, व्याघ्रः च धावति। ततः गोपालः गवोः पृष्ठयोः हस्तौ स्थापयति। गृहे अन्याः गावः प्रतीक्षन्ते; सर्वाभ्यः गोभ्यः माता दुग्धम् प्राप्नोति। द्वौ वत्सौ — एकः वत्सः धेनोः न दूरम् गच्छति, अपरः गोः।'
  translation: 'A cowherd goes to the forest with his two cows. On the two cows hang two bells. He gives them grass. At dusk a tiger comes, not far from the two cows. The cowherd says: "Kapilā, stay here. You two, stand behind me." He raises his staff, and the tiger runs. Then the cowherd lays his hands on the two cows'' backs. At home the other cows are waiting; from all the cows his mother gets milk. Two calves — one does not stray from its mother, nor the other from its own.'
  teaches: 'धेनु and the irregular गो — धेनुभ्याम्, धेन्वोः, धेनोः; गोभ्याम् (far from), गवोः, गोभ्यः, गोः, and the vocatives गौः, गावौ — in one evening with a tiger.'
