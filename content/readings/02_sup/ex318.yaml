- id: ex318
  kind: graded
  segment: 183
  order: 1
  sentence: 'गोपालः धेनुभ्याम् सह वनम् गच्छति। धेन्वोः घण्टे लम्बेते। सः गोभ्याम् तृणम् ददाति। गोपालस्य अन्याः गावः अपि ग्रामे सन्ति। सायम् एकः व्याघ्रः आगच्छति, गोभ्यः न दूरम्। गोपालः वदति — हे गौः, अत्र तिष्ठ। हे गावौ, मम पृष्ठतः तिष्ठतम्। सः दण्डम् उद्यच्छति, व्याघ्रः च धावति। ततः गोपालः गवोः पृष्ठयोः हस्तौ स्थापयति। गृहे धेनोः दुग्धम् स्रवति; वत्सः गोः न दूरम्।'
  translation: 'A cowherd goes to the forest with his two cows. On the two cows hang two bells. He gives grass to the two cows. The cowherd has other cows too, in the village. At dusk a tiger comes, not far from the cows. The cowherd says: "Cow, stay here. You two, stand behind me." He raises his staff, and the tiger runs. Then the cowherd lays his hands on the two cows'' backs. At home milk flows from the cow; the calf is not far from its mother.'
  teaches: 'धेनु and the irregular गो — धेनुभ्याम्, धेन्वोः, धेनोः; गोभ्याम्, गोभ्यः, गवोः, गोः, and the vocatives गौः, गावौ — in one evening with a tiger.'
