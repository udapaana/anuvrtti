- id: ex304
  kind: graded
  segment: 182
  order: 3
  sentence: 'कवेः वाक् मधुरा। वाचौ तस्य द्वे — एका गीतस्य, अपरा कथायाः। सः वाग्भिः जनान् आनन्दयति। वाचे सः तपः करोति। वाचः एव तस्य यशः जायते। वाचाम् देवी सरस्वती। वाचि सत्यम् तिष्ठति, वाक्षु च धर्मः। हे वाक्, मम मुखे वस।'
  translation: 'The poet''s speech is sweet. His speech is of two kinds — one of song, the other of story. With words he delights people. For speech he does penance. From speech alone his fame is born. Sarasvatī is the goddess of speech. Truth stands in speech, and dharma in words. "O speech, dwell in my mouth."'
  teaches: 'वाच् (consonant-stem feminine) — वाक्, वाचौ, वाग्भिः, वाचे, वाचः, वाचाम्, वाचि, वाक्षु, हे वाक्.'
