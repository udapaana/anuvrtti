- id: ex008
  segment: 20
  sentence: बालः फलम् पश्यति।
  translation: The boy sees the fruit.
  teaches: 'the neuter stem फल — प्रथमा and द्वितीया are the same form'
  words:
  - form: बालः
    gloss: the boy, masculine like नर
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
    - term: पुंलिङ्ग
      en: masculine
  - form: फलम्
    gloss: the fruit
    notes:
    - term: कर्मन्
      en: object
    - term: द्वितीया
      en: accusative
    - term: नपुंसक
      en: neuter
    - text: here प्रथमा and द्वितीया share one form, both फलम्
    - cite: 7.1.24
      role: अतोऽम् — neuter a-stem सु/अम् → अम्, so nom.sg फलम्
    - cite: 7.1.23
      role: 'स्वमोर्नपुंसकात् — neuter सु and अम् behave alike: फलम् serves as both प्रथमा and द्वितीया'
  - form: पश्यति
    lemma: दृश्
    gloss: sees
    notes:
    - term: दृश्
      en: '"see"'
    - term: धातु
      en: verbal root
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  vyakhya: नपुंसके प्रथमा द्वितीया च समाने रूपे — फलम् इति।
  vyakhya_en: |
    फलम् looks the same whether the fruit is doing something or having
    something done to it — neuter nouns do not distinguish the two. Here the
    boy is looking and the fruit is looked at, and you know that from बालः,
    which does distinguish them, and from the sense.
