- id: ex332
  kind: graded
  segment: 192
  order: 1
  sentence: 'रात्रौ राजा उत्सवम् अकरोत्, सर्वान् वणिजः च निमन्त्रयत्। धनदत्तः सागरदत्तः च सुवर्णवर्णौ पक्षिणौ राज्ञे अयच्छताम्। सेवकाः पक्षिभ्याम् पात्रेषु अपः आनयन्। पक्षिणौ अद्भिः स्नानम् अकुरुताम्, अप्सु अक्रीडताम्, ततः अद्भ्यः उदपतताम्। अपाम् शब्दः मधुरः, सर्वे अतिथयः च अहसन्। राजा सर्वेभ्यः वणिग्भ्यः वस्त्राणि अयच्छत्। राज्ञः वचनम् वणिजोः मनसी अहर्षयत्; तयोः मनसोः आनन्दः महान्। उत्सवे एकः मुनिः अपि आसीत्। सः अवदत् — हे वणिजौ, युवाम् यशोभिः पूर्णौ; जनाः युवयोः यशसाम् कथाः वदिष्यन्ति। ततः सः तपोभ्यः वनम् अगच्छत्।'
  translation: 'At night the king held a feast and invited all the merchants. Dhanadatta and Sāgaradatta gave the two golden birds to the king. Servants brought water in vessels for the two birds. The birds bathed in the water, played in the water, then flew up out of the water. The sound of the water was sweet, and all the guests laughed. The king gave clothes to all the merchants. The king''s words delighted the two merchants'' hearts; the joy of their two hearts was great. At the feast there was a sage too. He said: "Merchants, you two are full of honours; people will tell stories of your honours." Then he went to the forest for austerities.'
  teaches: 'Part 7 — the feast: अप् (always plural — अपः, अद्भिः, अप्सु, अद्भ्यः, अपाम्); the अस्-neuters मनसी, मनसोः, यशोभिः, यशसाम्, तपोभ्यः; वणिजः, वणिग्भ्यः, वणिजौ (vocative).'
