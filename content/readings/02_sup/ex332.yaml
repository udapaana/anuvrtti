- id: ex332
  kind: graded
  segment: 192
  order: 1
  sentence: 'रात्रौ उत्सवः अभवत्। राजा सर्वान् वणिजः निमन्त्रयत्। भोजने पयांसि मधूनि च आसन्। सेवकाः पात्रेषु अपः आनयन्। अपाम् शब्दः मधुरः। पक्षिणौ अद्भिः स्नानम् अकुरुताम्, अप्सु अक्रीडताम्, ततः अद्भ्यः उदपतताम्। राजा वणिग्भ्यः वस्त्राणि अयच्छत्। वणिक्षु धनदत्तः श्रेष्ठः इति जनाः अवदन्। राज्ञः वचनम् वणिजोः मनसी अहर्षयत्। तयोः मनसोः आनन्दः महान्। सः मुनिः अपि आगच्छत्, अवदत् च — हे वणिजौ, युवाम् यशोभिः पूर्णौ। जनाः युवयोः यशसाम् कथाः वदिष्यन्ति। अहम् तपोभ्यः वनम् गच्छामि।'
  translation: 'At night there was a feast. The king invited all the merchants. At the meal there were milks and honeys. Servants brought water in vessels. The sound of the water was sweet. The two birds bathed in the water, played in the water, then flew up out of the water. The king gave clothes to the merchants. "Among merchants Dhanadatta is the best," people said. The king''s words delighted the two merchants'' hearts. The joy of their two hearts was great. That sage came too, and said: "Merchants, you two are full of glories. People will tell stories of your glories. I go to the forest for austerities."'
  teaches: 'Part 7 — the feast: अप् (always plural — अपः, अपाम्, अद्भिः, अप्सु, अद्भ्यः); the अस्-neuters पयांसि, मनसी, मनसोः, यशोभिः, यशसाम्, तपोभ्यः; वणिजः, वणिग्भ्यः, वणिक्षु, वणिजौ (vocative).'
