- id: ex328
  kind: graded
  segment: 190
  order: 1
  sentence: 'परे तीरे बहवः यात्रिकाः आसन्। धनदत्तः अपृच्छत् — हे वणिजः, यूयम् कुतः आगच्छथ? एकः वृद्धः अवदत् — वयम् प्राच्याः दिशः आगच्छामः। धनदत्तः तस्मै वणिजे फलानि अयच्छत्। सागरदत्तः अपि अन्येन वणिजा सह मित्रताम् अकरोत्। ततः वणिजौ अन्यैः वणिग्भिः सह नगरम् अगच्छताम्। तेषाम् वणिजाम् मध्ये एकः मुनिः अपि आसीत्। वणिजौ भगवन्तम् अनमताम्, अवदताम् च — हे भगवन्, अस्माकम् कर्मणः सिद्धिः भवतु। वणिजौ भगवता सह रात्रिम् अवसताम्।'
  translation: 'On the far bank were many travellers. Dhanadatta asked: "Merchants, where do you come from?" An old man said: "We come from the eastern quarter." Dhanadatta gave that merchant fruit. Sāgaradatta too made friends with another merchant. Then the two went on to the city with the other merchants. Among those merchants was a sage as well. The two bowed to the holy one and said: "Holy one, may our task succeed." They spent the night with the holy one.'
  teaches: 'Part 3 — the caravan: वणिजः (vocative), वणिजे, वणिजा, वणिग्भिः, वणिजाम्; दिशः (ablative); the मत्/वत् stem भगवत् — भगवन्तम्, भगवन्, भगवता; and कर्मणः.'
