    lemma: देव
    gloss: 'a god'
    notes:
    - term: कर्तृ
      en: 'agent — the one who lives'
    - term: प्रथमा
      en: 'nominative — the naming case'
  - form: वने
    lemma: वन
    gloss: 'in the forest'
    notes:
    - term: अधिकरण
      en: 'locus'
      # CONFIRM: context-dependent — copied from ex181, but whether
