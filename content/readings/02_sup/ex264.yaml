- id: ex264
  kind: graded
  segment: 90
  sentence: 'देवः वने वसति। नरः देवम् पश्यति। सः देवेन तुष्यति। सः देवाय नमति। सः देवात् बिभेति। सः देवस्य वनम् गच्छति। सः देवे रमते। हे देव।'
  translation: 'A god lives in the forest. A man sees the god, is pleased by the god, bows to the god, fears the god, goes to the god''s forest, and delights in the god. O god!'
  teaches: 'one stem through all eight cases — देवः देवम् देवेन देवाय देवात् देवस्य देवे, हे देव — the अ-stem masculine endings seen as a single system.'
