- id: ex264
  kind: graded
  segment: 90
  sentence: वने देवः वसति। एकः नरः वनम् गच्छति, देवम् च पश्यति। प्रथमम् सः देवात् बिभेति। किन्तु देवः हसति, नरः च देवेन तुष्यति। सः देवाय नमति। ततः सः प्रतिदिनम् देवस्य वनम् गच्छति, देवे च रमते। सः गायति — हे देव!
  translation: 'A god lives in the forest. A man goes into the forest and sees the god. At first he fears the god. But the god smiles, and the man is pleased by the god. He bows to the god. After that he goes to the god''s forest every day, and delights in the god. He sings: "O god!"'
  teaches: 'One stem through every case, in the order a meeting takes — देवम् (seen), देवात् (feared), देवेन (pleased by), देवाय (bowed to), देवस्य (whose forest), देवे (delighted in), and देव, called on at the end.

    '
