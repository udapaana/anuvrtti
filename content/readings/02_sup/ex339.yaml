- id: ex339
  kind: graded
  segment: 196
  order: 1
  sentence: 'वणिजौ उज्जयिनीम् आगच्छताम्। राजा अपृच्छत् — युवाम् कानि स्थानानि अपश्यतम्? वणिजौ अवदताम् — आवाम् हिमवन्तम् अपश्याव, गङ्गाम् यमुनाम् च — द्वे सरितौ। उदीच्याम् दिशि बह्व्यः सरितः सन्ति। सर्वाभ्यः दिग्भ्यः जनाः तत्र स्नानाय आगच्छन्ति। आवाम् मरुद्भ्याम् मार्गम् अजानीव। वणिजोः वाचः राज्ञः मनः अहर्षयन्। राजा गुणवतोः वणिजोः नामनी शिलायाम् अलिखत्।'
  translation: 'The merchants came back to Ujjayinī. The king asked: "What places did you see?" The merchants said: "We saw the Himālaya, and the Gaṅgā and the Yamunā — two rivers. In the northern quarter there are many rivers. People come there from every direction to bathe. We learned the way from the two winds." The merchants'' words delighted the king''s heart. The king wrote the two names of the worthy merchants on a stone.'
  teaches: 'Part 14 — the return: सरितौ (accusative dual, in apposition), सरितः and बह्व्यः (nominative plural); दिग्भ्यः and मरुद्भ्याम् (ablative); गुणवतोः (genitive dual), नामनी; वाचः (nominative plural).'
