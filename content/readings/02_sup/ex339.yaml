- id: ex339
  kind: graded
  segment: 196
  order: 1
  sentence: 'पुत्रौ उज्जयिनीम् आगच्छताम्। तयोः वाचः मधुराः आसन्। राजा अपृच्छत् — युवाम् कानि जगन्ति अपश्यतम्? पुत्रौ अवदताम् — आवाम् उभे जगती अपश्याव, द्वे सरितौ च। तत्र बह्व्यः सरितः सन्ति। आवाम् मरुद्भ्याम् मार्गम् अजानीव। मरुतः आशिषा आवाम् सुखिनौ। मरुत्सु शक्तिः महती, आवयोः मरुद्भ्यः भयम् न आसीत्। आवाम् द्वाभ्याम् दिग्भ्याम् अचलाव। दिशोः सीमा हिमवान्। सर्वाभ्यः दिग्भ्यः जनाः तत्र आगच्छन्ति। राजा प्रीतः अभवत्। तस्य यशः उभयोः जगतोः प्रसरति। देवाः त्रिभिः जगद्भिः पूज्यन्ते, ते च जगद्भ्याम् हितम् कुर्वन्ति। राजा तयोः नामभ्याम् मन्दिरम् अकरोत्। कर्मभ्याम् फलम् आगच्छत्।'
  translation: 'The sons came back to Ujjayinī. Their words were sweet. The king asked: "Which worlds did you see?" The sons said: "We saw both worlds, and two rivers. There are many rivers there. We learned the way from the two winds. By the wind''s blessing we were happy. In the winds there is great power; we had no fear of the winds. We travelled by two directions. The boundary of the two directions is the Himālaya. From every direction people come there." The king was pleased. His fame spreads in both worlds. The gods are worshipped by the three worlds, and they do good to the two worlds. The king built a temple for their two names. From the two deeds came the fruit.'
  teaches: 'Part 14 — home again: वाचः (nominative), जगन्ति and जगती (accusative), जगतोः, जगद्भिः, जगद्भ्याम्; सरितौ and सरितः; मरुद्भ्याम्, मरुतः (genitive), मरुत्सु, मरुद्भ्यः (ablative); दिग्भ्याम्, दिशोः, दिग्भ्यः (ablative); नामभ्याम्, कर्मभ्याम् (ablative); and आशिषा, the instrumental of आशिस्.'
