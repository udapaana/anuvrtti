- id: ex343
  kind: graded
  segment: 178
  order: 4
  sentence: नगरम् द्वयोः नद्योः मध्ये अस्ति।
  translation: The city lies between two rivers.
  teaches: 'मध्ये "between" takes the genitive: द्वयोः नद्योः, the -ओः dual of the नदी-class.'
  words:
  - form: नगरम्
    lemma: नगर
    gloss: the city
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative — the neuter -म् ending serves the subject too
  - form: द्वयोः
    lemma: द्वि
    gloss: two
    notes:
    - term: संख्या
      en: numeral
    - term: विशेषण
      en: qualifying नद्योः
    - term: षष्ठी
      en: genitive dual — द्वि becomes द्वय before ओस्
    rel:
    - kind: विशेषण
      to: 2
  - form: नद्योः
    lemma: नदी
    gloss: of the two rivers
    notes:
    - term: सम्बन्ध
      en: relation
    - term: षष्ठी
      en: genitive dual
  - form: मध्ये
    lemma: मध्ये
    gloss: among
    notes:
    - term: अव्यय
      en: 'indeclinable "among" — takes the genitive वणिजाम्: "among the merchants"'
  - form: अस्ति
    lemma: अस्
    gloss: is
    notes:
    - term: अस्
      en: '"to be"'
    - term: लट्
      en: present
    - cite: 3.2.123
      role: वर्तमाने लट् — present tense
