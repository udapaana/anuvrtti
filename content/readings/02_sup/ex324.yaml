  order: 1
  sentence: 'कौन्तेयः विद्यायै वनम् गच्छति। माद्रेयः तम् अनुगच्छति। तत्र गार्ग्यः आचार्यः वसति। सः भारतीयान् शिष्यान् पाठयति। सः तेजस्वी मेधावी च। आचार्यः तौ अपि पाठयति।'
  translation: 'Kuntī''s son goes to the forest for learning. Mādrī''s son follows him. There lives Garga''s descendant, a teacher. He teaches Indian pupils. He is brilliant and wise. The teacher teaches the two of them too.'
  teaches: 'तद्धित names and adjectives the corpus had not shown: ढक् (कौन्तेयः, माद्रेयः), यञ् (गार्ग्यः), छ (भारतीयान्), विनि (तेजस्वी, मेधावी).'
