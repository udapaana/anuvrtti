    lemma: वृक्ष
    gloss: 'on the tree'
    notes:
    - term: अधिकरण
      en: 'locus'
    - term: सप्तमी
      en: 'locative'
  - form: फलम्
    lemma: फल
    gloss: 'a fruit'
    notes:
    - term: कर्तृ
      en: 'agent — the one that grows'
    - term: प्रथमा
      en: 'nominative — neuter अ-stem'
  - form: रोहति
    lemma: रुह्
    gloss: 'grows'
    notes:
    - term: शप्
      en: 'रुह् + अ + ति → रोहति'
    - term: लट्
      en: 'present'
  - form: बालः
    lemma: बाल
    gloss: 'a boy'
    notes:
