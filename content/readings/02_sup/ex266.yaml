- id: ex266
  kind: graded
  segment: 167
  sentence: 'वृक्षे फलम् रोहति। बालः फलम् पश्यति, फलाय च धावति। सः फलेन देवम् पूजयति। फलात् बीजम् पतति। फलस्य रसः मधुरः। फले कीटः वसति। हे फल।'
  translation: 'A fruit grows on the tree. A boy sees the fruit and runs for the fruit. He worships the god with the fruit. A seed falls from the fruit. The fruit''s juice is sweet. An insect lives in the fruit. O fruit!'
  teaches: 'फल (अ-stem neuter) through all eight cases — and the neuter signature: फलम् is both प्रथमा (it grows) and द्वितीया (he sees it), one form for two cases.'
  words:
