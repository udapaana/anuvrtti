- id: ex307
  kind: graded
  segment: 183
  order: 2
  sentence: 'गुरुः पृच्छति — कौ एतौ? शिष्यः वदति — एतौ मम भ्रातरौ। के त्वम् पश्यसि? एते लते। काः गायन्ति? कन्याः। कान् त्वम् इच्छसि? मोदकान्। केन लिखसि? एतेन कलमेन। काभ्याम् चलसि? एताभ्याम् पादाभ्याम्। कैः क्रीडसि? एतैः कन्दुकैः।'
  translation: 'The teacher asks: "Who are these two?" The pupil says: "These two are my brothers." "Which two do you see?" "These two creepers." "Who sing?" "Girls." "What do you want?" "Sweets." "With what do you write?" "With this pen." "With which two do you walk?" "With these two feet." "With what do you play?" "With these balls."'
  teaches: 'किम् in question and एतद् in answer, cell for cell — कौ/एतौ, के/एते, काः, कान्, केन/एतेन, काभ्याम्/एताभ्याम्, कैः/एतैः.'
