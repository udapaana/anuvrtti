- id: ex294
  kind: graded
  segment: 179
  order: 3
  sentence: उत्सवे राजानः सभायाम् उपविशन्ति। राज्ञाम् नाम्नाम् घोषः मातॄणाम् गीतानि च श्रूयन्ते।
  translation: At the festival the kings sit in the assembly. The kings' names are proclaimed, and the mothers' songs are heard.
  teaches: Genitive plurals of the consonant and ऋ-stems — राज्ञाम्, नाम्नाम्, मातॄणाम् (with णत्व).
  words:
  - form: उत्सवे
    lemma: उत्सव
    gloss: at the festival
    notes:
    - term: अधिकरण
      en: the occasion — locative of time and place
    - term: सप्तमी
      en: locative
  - form: राजानः
    lemma: राजन्
    gloss: kings
    notes:
    - term: पुंलिङ्ग
      en: masculine
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative plural
  - form: सभायाम्
    lemma: सभा
    gloss: in the assembly
    notes:
    - term: अधिकरण
      en: location
    - term: सप्तमी
      en: locative
  - form: उपविशन्ति
    lemma: विश्
    gloss: sit
    notes:
    - term: 'उप'
      en: 'preverb उप — उपविशन्ति is उप + विश्'
    - term: लट्
      en: present, plural, with the preverb उप
  - form: राज्ञाम्
    lemma: राजन्
    gloss: of the kings
    notes:
    - term: सम्बन्ध
      en: whose names — the herald announces each king
    - term: षष्ठी
      en: genitive plural
  - form: नाम्नाम्
    lemma: नामन्
    gloss: of names
    notes:
    - term: सम्बन्ध
      en: relation
    - term: षष्ठी
      en: genitive plural
  - form: घोषः
    lemma: घोष
    gloss: the calling
    notes:
    - term: कर्तृ
      en: subject of श्रूयन्ते — the herald's proclaiming of each king's name
    - term: प्रथमा
      en: nominative
  - form: मातॄणाम्
    lemma: मातृ
    gloss: of the mothers
    notes:
    - term: सम्बन्ध
      en: ऋ lengthened before नाम्, with णत्व
    - term: षष्ठी
      en: genitive plural
  - form: गीतानि
    lemma: गीत
    gloss: songs
    notes:
    - term: कर्तृ
      en: subject of the passive श्रूयन्ते — neuter nom. pl -आनि
    - term: प्रथमा
      en: nominative plural
  - form: च
    lemma: च
    gloss: and
    notes:
    - term: अव्यय
      en: indeclinable
  - form: श्रूयन्ते
    lemma: श्रु
    gloss: are heard
    notes:
    - term: लट्
      en: present, passive (यक्)
