- id: ex294
  kind: graded
  segment: 179
  order: 3
  sentence: 'उत्सवे राज्ञाम् सभायाम् फलानाम् राशिः अस्ति। राज्ञाम् नाम्नाम् घोषः मातॄणाम् गीतानि च श्रूयन्ते। ततः एकः ऋषिः वदति — प्रजाः राजसु विश्वसन्ति, पुत्राः पितृषु मातृषु च, ऋषयः तु मनःसु एव।'
  translation: 'At the festival a heap of fruit lies in the kings'' assembly. The kings'' names are proclaimed, and the mothers'' songs are heard. Then a sage says: "Subjects trust their kings, sons their fathers and mothers — but sages only their minds."'
  teaches: 'Genitive and locative plurals of the ऋ- and consonant stems — मातॄणाम्, राज्ञाम्, नाम्नाम्; राजसु, पितृषु, मातृषु, मनःसु.'
