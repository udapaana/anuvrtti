- id: ex294
  kind: graded
  segment: 179
  order: 3
  sentence: 'फलानाम् राशिः राज्ञाम् सभायाम् अस्ति। मातॄणाम् गीतानि नाम्नाम् घोषः च श्रूयन्ते। प्रजाः राजसु विश्वसन्ति, पुत्राः पितृषु मातृषु च, ऋषयः तु मनःसु एव।'
  translation: 'A heap of fruit lies in the assembly of the kings. The songs of the mothers and the calling of names are heard. Subjects trust their kings, sons their fathers and mothers — but sages only their minds.'
  teaches: 'Genitive and locative plurals of the ऋ- and consonant stems — मातॄणाम्, राज्ञाम्, नाम्नाम्; राजसु, पितृषु, मातृषु, मनःसु.'
