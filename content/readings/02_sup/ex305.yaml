- id: ex305
  kind: graded
  segment: 182
  order: 4
  sentence: 'भ्रमराः पुष्पेभ्यः मधु आनयन्ति। मधुनः गन्धः वने प्रसरति। द्वे मधुनी स्तः — एकम् कमलस्य, अपरम् आम्रस्य। बालाः मधूनि इच्छन्ति। माता मधुने धनम् ददाति। मधुनि मक्षिका पतति। मधुनोः रसे भेदः अस्ति। बालाः मधूनाम् स्वादम् जानन्ति, मधुषु च स्निह्यन्ति।'
  translation: 'Bees bring honey from the flowers. The scent of honey spreads in the forest. There are two honeys — one of the lotus, the other of the mango. The children want honeys. The mother gives money for honey. A fly falls into the honey. There is a difference in the taste of the two honeys. The children know the taste of honeys, and love them.'
  teaches: 'मधु (उ-stem neuter) — मधु, मधुनः, मधुनी, मधूनि, मधुने, मधुनि, मधुनोः, मधूनाम्, मधुषु; the न that the neuter adds before a vowel.'
