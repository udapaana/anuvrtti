- id: ex305
  kind: graded
  segment: 182
  order: 4
  sentence: 'एकः भल्लूकः मधुने वृक्षम् आरोहति। वृक्षे मधुनि मधुमक्षिकाः सन्ति। तस्य गन्धः मधुरः। सहसा शाखा भज्यते, भल्लूकः च पतति। जानुनी रुजतः, जानुनोः वेदना महती। तथापि सः वदति — मधुनः मधुरतरम् किम्? सर्वेषाम् वस्तूनाम् मधु एव श्रेष्ठम्। सः अश्रुषु अपि हसति।'
  translation: 'A bear climbs a tree for honey. In the honey on the tree are bees. Its smell is sweet. Suddenly the branch breaks, and the bear falls. Both knees ache; the pain in his knees is great. Still he says: "What is sweeter than honey? Of all things, honey is the best." Even in tears he laughs.'
  teaches: 'The उ-stem neuters: मधुने (for honey), मधुनि, मधुनः; the dual of a real pair — जानुनी, जानुनोः, the knees; वस्तूनाम्, अश्रुषु.'
