- id: ex296
  kind: graded
  segment: 180
  order: 1
  sentence: 'अतिथयः द्वे रात्री आश्रमे वसन्ति। रात्रयः शीघ्रम् गच्छन्ति। उत्सवस्य सर्वाणि कर्माणि शुभानि। प्रातः नृपौ आश्रमाय अनेकाः गाः यच्छतः, ऋषीन् च पितॄन् इव नमतः। कुमारौ आश्रमस्य सर्वाः मातॄः नमतः, मातरः च तौ आशिषा वर्धयन्ति। ततः कुमारौ स्वे मातरौ अनुसरतः। ऋषी राजानौ ग्रामस्य सीमाम् यावत् अनुगच्छतः। वनवासिनः तेषाम् यशांसि गायन्ति।'
  translation: 'The guests stay two nights in the hermitage. The nights pass quickly. All the festival''s rites are auspicious. In the morning the kings give the hermitage many cows, and bow to the sages as to fathers. The princes bow to all the hermitage''s mothers, and the mothers bless them. Then the princes follow their own two mothers. The sages accompany the two kings to the edge of the village. The forest-dwellers sing their glories.'
  teaches: 'The visit, part 4 — leaving: the accusatives that pair and multiply — रात्री (duration), गाः, पितॄन्, मातॄः, मातरौ, राजानौ, यशांसि — beside the nominative plurals रात्रयः, मातरः, कर्माणि.'
