  order: 1
  sentence: 'उत्सवस्य रात्रयः शीघ्रम् गच्छन्ति। मातरः धेनवः च गृहम् आगच्छन्ति। बालाः पितॄन् मातॄः च नमन्ति, नदीः गाः च पश्यन्ति। राजा तेषाम् मनांसि जानाति, तेषाम् नामानि च श्रूयन्ते। सः द्वे रात्री जागर्ति, राजानौ मातरौ च आह्वयति। कन्ये नामनी लिखतः।'
  translation: 'The festival''s nights pass quickly. The mothers and the cows come home. The boys bow to their fathers and mothers, and look at the rivers and the cattle. The king knows their minds, and their names are heard. He stays awake two nights, and summons the two kings and the two mothers. The two girls write their two names.'
  teaches: 'Nominative and accusative plurals and duals — रात्रयः, मातरः, धेनवः, पितॄन्, मातॄः, नदीः, गाः, मनांसि, नामानि; रात्री, राजानौ, मातरौ, नामनी.'
