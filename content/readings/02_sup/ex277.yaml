- id: ex277
  kind: graded
  segment: 170
  order: 2
  sentence: 'वसन्ते उद्याने अनेकाः लताः सन्ति; द्वारे द्वे लते वर्धेते। लतयोः भ्रमराः भ्रमन्ति। एकस्याः लतायाः पुष्पम् पतति। बाला सर्वाः लताः सिञ्चति, लताभ्यः जलम् च आनयति। लतानाम् पुष्पैः सा मालाम् करोति। लतासु पक्षिणः वसन्ति, बाला च लताभिः शोभिते उद्याने गायति।'
  translation: 'In spring there are many creepers in the garden; by the gate two creepers grow. Bees wander over those two. From one creeper a flower falls. The girl waters all the creepers and brings water for them. With the creepers'' flowers she makes a garland. Birds live among the creepers, and the girl sings in the garden the creepers adorn.'
  teaches: 'लता in the dual and plural — लते, लतयोः, लताः, लताभ्यः, लतानाम्, लतासु, लताभिः (the agent of the participle शोभिते) — and the ablative लतायाः.'
