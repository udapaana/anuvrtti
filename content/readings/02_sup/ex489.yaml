  order: 29
  sentence: 'राजा धीमद्भ्याम् मन्त्रिभ्याम् सह मन्त्रयते। सः तयोः धीमतोः विश्वसिति।'
  translation: 'The king takes counsel with his two wise ministers. He trusts those two wise men.'
  teaches: 'the मत्-stem धीमत् in the dual: instrumental धीमद्भ्याम् with सह, locative धीमतोः with विश्वस्'
