- id: ex306
  kind: graded
  segment: 183
  order: 1
  sentence: 'मार्गदर्शकः वदति — इमौ बालौ अत्र तिष्ठतः, इमाः कन्याः च गायन्ति। पश्य इमे लते, इमान् वृक्षान् च। आभ्याम् हस्ताभ्याम् अहम् पुष्पाणि चिनोमि, एभिः पुष्पैः च देवम् पूजयामि। अस्मै देवाय नमः, अस्यै देव्यै च। एभ्यः बालेभ्यः फलानि यच्छ। अस्मात् वृक्षात् फलम् पतति। आभ्यः नदीभ्यः जलम् आनय। अनयोः बालयोः नामनी शृणु। एषाम् वृक्षाणाम् छायायाम् उपविश। अस्मिन् मन्दिरे देवः वसति, एषु वृक्षेषु च पक्षिणः।'
  translation: 'The guide says: "These two boys stand here, and these girls sing. Look at these two creepers, and these trees. With these two hands I gather flowers, and with these flowers I worship the god. Homage to this god, and to this goddess. Give fruit to these boys. From this tree a fruit falls. Bring water from these rivers. Hear the names of these two boys. Sit in the shade of these trees. In this temple the god dwells, and in these trees, the birds."'
  teaches: 'इदम् "this" through fourteen cells, in all three genders — इमौ, इमाः, इमे, इमान्, आभ्याम्, एभिः, अस्मै/अस्यै, एभ्यः, अस्मात्, आभ्यः, अनयोः, एषाम्, अस्मिन्, एषु.'
