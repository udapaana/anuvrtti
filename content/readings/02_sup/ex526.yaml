  vyakhya: 'समीपस्थम् वस्तु इदम् शब्देन, दूरस्थम् अदस् शब्देन निर्दिश्यते — अयम् ग्रामः, असौ ग्रामः। अदसः प्रथमैकवचने पुंसि स्त्रियाम् च असौ।'
  vyakhya_en: |
    Sanskrit points two ways: इदम् for what is near (अयम् ग्रामः, the village below), अदस् for what is far off (असौ ग्रामः, the one across the river). अदस् has the nominative singular असौ in both the masculine and the feminine — असौ ग्रामः, असौ नदी — formed by its own rule, 7.2.107.
