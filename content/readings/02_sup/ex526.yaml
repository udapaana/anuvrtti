  sentence: 'पिता पुत्रेण सह पर्वतम् आरोहति। सः हस्तेन दर्शयति — अयम् ग्रामः अस्माकम्। असौ ग्रामः नद्याः पारे। असौ नदी गङ्गा।'
  translation: 'A father climbs a hill with his son. He points with his hand: "This village is ours. That village over there is across the river. That river is the Gaṅgā."'
  teaches: 'अदस् "that, yonder" — असौ, masculine and feminine alike — against अयम् "this, here"'
