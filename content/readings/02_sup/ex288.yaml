- id: ex288
  kind: graded
  segment: 178
  order: 2
  sentence: 'मुनी ताभ्याम् कन्याभ्याम् फलानि यच्छतः। कन्ये बाहुभ्याम् फलानि गृह्णीतः, नेत्राभ्याम् च तौ पश्यतः। ततः ते मुनिभ्याम् सह नदीभ्याम् गृहम् आगच्छतः। गृहे ते पितृभ्याम् नमतः।'
  translation: 'The sages give fruit to the two girls. The girls take the fruit with both hands and look at the two of them with both eyes. Then, with the two sages, they come home from the rivers. At home they bow to their parents.'
  teaches: 'The -भ्याम् dual in three cases on different stems — instrumental बाहुभ्याम्, नेत्राभ्याम्, मुनिभ्याम्; dative कन्याभ्याम्, पितृभ्याम्; ablative नदीभ्याम्.'
