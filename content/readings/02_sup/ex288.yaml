- id: ex288
  kind: graded
  segment: 178
  order: 2
  sentence: सङ्गमे मुनी ताभ्याम् कन्याभ्याम् फलानि यच्छतः। कन्ये बाहुभ्याम् फलानि गृह्णीतः। ततः ते मुनिभ्याम् सह गृहम् आगच्छतः। गृहे ते पितृभ्याम् नमतः।
  translation: At the confluence the two sages give fruit to those two girls. The girls take the fruit with both hands. Then they come home with the two sages. At home they bow to their parents.
  teaches: The -भ्याम् dual in three uses — dative ताभ्याम् कन्याभ्याम्, पितृभ्याम्; instrumental of means बाहुभ्याम्; instrumental with सह, मुनिभ्याम्.
