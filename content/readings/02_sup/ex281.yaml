- id: ex281
  kind: graded
  segment: 172
  order: 2
  sentence: ग्रामस्य समीपे द्वयोः भ्रात्रोः द्वे भूमी स्तः। भ्रातरौ भूम्योः धान्यम् वपतः। भूमेः अन्नम् उत्पद्यते।
  translation: Near the village two brothers have two fields. The brothers sow grain in the two fields. From the earth food arises.
  teaches: भूमि in the dual — भूमी, भूम्योः — beside the ablative singular भूमेः; and द्वयोः भ्रात्रोः, the genitive of possession with अस्.
  words:
  - form: ग्रामस्य
    lemma: ग्राम
    gloss: of the village
    notes:
    - term: सम्बन्ध
      en: relation
    - term: षष्ठी
      en: genitive
  - form: समीपे
    lemma: समीप
    gloss: near
    notes:
    - term: अधिकरण
      en: location
    - term: सप्तमी
      en: locative of समीप "nearness" — with the genitive ग्रामस्य it means "near the village"
  - form: द्वयोः
    lemma: द्वि
    gloss: two
    notes:
    - term: संख्या
      en: numeral
    - term: विशेषण
      en: qualifying भ्रात्रोः
    - term: षष्ठी
      en: genitive dual — द्वि becomes द्वय before ओस्
    rel:
    - kind: विशेषण
      to: 3
  - form: भ्रात्रोः
    lemma: भ्रातृ
    gloss: of the brothers
    notes:
    - term: सम्बन्ध
      en: whose the fields are — "of two brothers there are two fields", i.e. they own them
    - term: षष्ठी
      en: genitive dual — ऋ-stem, भ्रातृ + ओस् → भ्रात्रोः
  - form: द्वे
    lemma: द्वि
    gloss: two
    notes:
    - term: संख्या
      en: numeral
    - term: विशेषण
      en: qualifying the noun
    - term: प्रथमा
      en: nominative dual
    rel:
    - kind: विशेषण
      to: 5
  - form: भूमी
    lemma: भूमि
    gloss: two plots of land
    notes:
    - term: कर्तृ
      en: the ones that are — the dual, इ lengthened
    - term: प्रथमा
      en: nominative dual
  - form: स्तः
    lemma: अस्
    gloss: are
    notes:
    - term: लट्
      en: present, dual
  - form: भ्रातरौ
    lemma: भ्रातृ
    gloss: the brothers
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative dual — the two brothers just named
  - form: भूम्योः
    lemma: भूमि
    gloss: in the two fields
    notes:
    - term: अधिकरण
      en: location
    - term: सप्तमी
      en: locative dual
  - form: धान्यम्
    lemma: धान्य
    gloss: grain
    notes:
    - term: कर्मन्
      en: object
    - term: द्वितीया
      en: object of वपन्ति — neuter अ-stem, acc. sg = nom. sg
  - form: वपतः
    lemma: वप्
    gloss: sow
    notes:
    - term: परस्मैपद
      en: parasmaipada
    - term: द्विवचन
      en: dual
    - term: प्रथमपुरुष
      en: 3rd person
    - term: लट्
      en: present, 3rd dual — the two brothers sow
  - form: भूमेः
    lemma: भूमि
    gloss: from the earth
    notes:
    - term: अपादान
      en: the source — the गुण, -एः
    - term: पञ्चमी
      en: ablative
  - form: अन्नम्
    lemma: अन्न
    gloss: food
    notes:
    - term: कर्तृ
      en: what arises
    - term: प्रथमा
      en: nominative
  - form: उत्पद्यते
    lemma: पद्
    gloss: arises
    notes:
    - term: 'उद्'
      en: 'preverb उद् — उत्पद्यते is उद् + पद्'
    - term: लट्
      en: present, with the preverb उद् (पद् is दिवादि, आत्मनेपद)
