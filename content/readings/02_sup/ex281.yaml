- id: ex281
  kind: graded
  segment: 172
  order: 2
  sentence: 'ग्रामस्य समीपे द्वे भूमी स्तः। भूम्योः कृषकाः धान्यम् वपन्ति। भूमेः अन्नम् उत्पद्यते। वर्षाकाले मेघाः भूमीः सिञ्चन्ति। भूमिषु शस्यम् वर्धते। भूमीनाम् फलेन जनाः जीवन्ति। कृषकाः भूमिभ्यः नमन्ति।'
  translation: 'Near the village there are two fields. In the two fields the farmers sow grain. From the earth food arises. In the rainy season the clouds water the fields. In the fields the crop grows. By the fruit of the fields people live. The farmers bow to the fields.'
  teaches: 'भूमि in the dual and plural — भूमी, भूम्योः, भूमीः, भूमिषु, भूमीनाम्, भूमिभ्यः — and the ablative भूमेः.'
