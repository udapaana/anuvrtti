- id: ex334
  kind: graded
  segment: 193
  order: 1
  sentence: राजा द्वौ मुनी अपृच्छत् — हे भगवन्तौ, राज्ञः धर्मः कः? तौ अवदताम् — राजा धीमद्भिः तपस्विभिः च सह वसेत्, प्रजाः च बलिनः शत्रोः रक्षेत्। राजा अपृच्छत् — राजा कस्मात् बिभेति? तौ अवदताम् — सः बलवद्भ्यः न बिभेति; दण्डिभ्यः तु चोराः बिभ्यति। राजा अपृच्छत् — सः कस्मै धनम् ददाति? तौ अवदताम् — धनवद्भ्यः न, दीनेभ्यः। राजा अपृच्छत् — मन्त्रः कुत्र तिष्ठति? तौ अवदताम् — बुद्धिमत्सु एव। अन्ते राजा अपृच्छत् — कर्मणः फलम् किम्? तौ अवदताम् — कर्मणः फलम् अवश्यम् आगच्छति, अतः दुष्टेभ्यः कर्मभ्यः विरमेत्। राजा कर्मणे जीवेत्, यतः कर्मसु कौशलम् योगः।
  translation: 'The king asked two sages: "Venerable ones, what is a king''s duty?" The two said: "A king should live with the wise and with ascetics, and guard his people from a strong enemy." The king asked: "Whom does a king fear?" They said: "He does not fear the strong; it is thieves who fear the men with staves." The king asked: "To whom does he give wealth?" They said: "Not to the rich — to the poor." The king asked: "Where does counsel rest?" They said: "Only among the wise." Last the king asked: "What is the fruit of a deed?" They said: "The fruit of a deed surely comes, so one should keep from wicked deeds. A king should live for his work, for skill in actions is yoga."'
  teaches: 'Part 9 — two sages answer a king: भगवन्तौ (vocative dual); the मत्/वत् stems in the oblique plural — धीमद्भिः, बलवद्भ्यः, धनवद्भ्यः, बुद्धिमत्सु; the इन् stems — तपस्विभिः, दण्डिभ्यः, बलिनः; and कर्मन् — कर्मणः, कर्मभ्यः, कर्मणे, कर्मसु (the last from the Gītā, 2.50).'
