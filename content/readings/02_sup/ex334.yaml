- id: ex334
  kind: graded
  segment: 193
  order: 1
  sentence: 'राजा अपृच्छत् — हे मरुतौ, राज्ञः धर्मः कः? तौ अवदताम् — राजा धीमद्भिः तपस्विभिः च सह वसेत्। सः बलवद्भ्यः न बिभेति, दण्डिभ्यः तु चोराः बिभ्यति। सः धनवद्भ्यः न, दीनेभ्यः धनम् ददाति। बलिनः शत्रोः प्रजाः रक्षति। सेवकः स्वामिने सत्यम् वदेत्। मन्त्रः बुद्धिमत्सु एव तिष्ठति। कर्मणः फलम् आगच्छति, अतः दुष्टेभ्यः कर्मभ्यः विरमेत्। जनाः कर्मणे जीवन्ति। कर्मसु कौशलम् योगः।'
  translation: 'The king asked: "Winds, what is a king''s duty?" The winds said: "A king should live with the wise and with ascetics. He does not fear the strong; it is thieves who fear the men with staves. He gives wealth not to the rich but to the poor. He guards his people from a strong enemy. A servant should speak the truth to his master. Counsel rests only among the wise. From a deed comes its fruit, so one should keep from wicked deeds. People live for work. Skill in actions is yoga."'
  teaches: 'Part 9 — the winds'' counsel: मरुतौ (vocative); the मत्/वत् stems in the oblique plural — धीमद्भिः, बलवद्भ्यः, धनवद्भ्यः, बुद्धिमत्सु; the इन् stems — तपस्विभिः, दण्डिभ्यः, बलिनः, स्वामिने; and कर्मन् — कर्मणः, कर्मभ्यः, कर्मणे, कर्मसु (the last from the Gītā, 2.50).'
