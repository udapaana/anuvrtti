  vyakhya: 'अदसः द्वितीयायाम् अमुम्, सप्तम्याम् अमुष्मिन्। दकारात् परस्य उवर्णः, दस्य मः।'
  vyakhya_en: |
    Except in the nominative singular, अदस् turns its द to म and its vowel to उ (8.2.80): accusative अमुम्, locative अमुष्मिन् (the pronoun's स्मिन्, with स् to ष् after उ). The traveller uses it because the tree is far — the near tree would be इमम्.
