  sentence: 'पथिकौ मार्गे श्रान्तौ। एकः दूरे वृक्षम् पश्यति, वदति च — अमुम् वृक्षम् गच्छावः। अमुष्मिन् वृक्षे छाया अस्ति, जलम् अपि समीपे।'
  translation: 'Two travellers are tired on the road. One sees a tree in the distance and says: "Let us go to that tree. In that tree there is shade, and water nearby too."'
  teaches: 'अदस् in the accusative and locative — अमुम्, अमुष्मिन् — for a goal in the distance'
