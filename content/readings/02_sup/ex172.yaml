- id: ex172
  segment: 130
  kind: paradigm
  sentence: फलम् फले फलानि। फलम् फले फलानि। फलेन फलाभ्याम् फलैः। फलाय फलाभ्याम् फलेभ्यः। फलात् फलाभ्याम् फलेभ्यः। फलस्य फलयोः फलानाम्। फले फलयोः फलेषु। हे फल हे फले हे फलानि॥
  translation: The complete declension of फल "fruit" (a-stem neuter) — eight cases × three numbers.
  teaches: 'the whole अकारान्त नपुंसक paradigm — फल follows देव everywhere but the प्रथमा and द्वितीया (फलम्/फले/फलानि), where the neuter rules take over'
  words:
  - form: फलम्
    gloss: 'प्रथमा/द्वितीया एक — nom.=acc. sg. (अम्)'
    notes:
    - text: 'neuter प्रथमा = द्वितीया throughout — the defining feature'
    - cite: '7.1.24'
      role: अतोऽम् — after a short अ, neuter सु/अम् both → अम् → फलम्
    - term: नपुंसक
      en: neuter — nom. and acc. always identical
  - form: फले
    gloss: 'प्रथमा/द्वितीया द्वि — nom.=acc. dual (शी → ई)'
    notes:
    - cite: '7.1.23'
      role: स्वमोर्नपुंसकात् — neuter सु/अम् drop; the dual takes शी
    - cite: '6.1.102'
      role: अ + ई → ए → फले
    - term: द्विवचन
      en: dual (nom. = acc.)
  - form: फलानि
    gloss: 'प्रथमा/द्वितीया बहु — nom.=acc. pl. (शि → नुम् + इ)'
    notes:
    - cite: '7.1.20'
      role: जश्शसोः शिः — neuter जस्/शस् → शि (इ) in the plural
    - cite: '7.1.72'
      role: नपुंसकस्य झलचः — नुम् (न्) inserted before the ending → फलानि
    - term: बहुवचन
      en: plural (nom. = acc.)
  - form: फलेन
    gloss: 'तृतीया एक — instr. sg. (= देव: फलेन)'
    notes:
    - text: 'from the instrumental on, neuter declines EXACTLY like देव (masculine)'
    - term: तृतीया
      en: instrumental singular
  vyakhya: अकारान्तनपुंसकं देववत्, किन्तु प्रथमाद्वितीययोः नपुंसकविशेषः — फलम्/फले/फलानि। शेषं समानम्।
  vyakhya_en: |
    The neuter फल is the masculine देव (ex094) with ONE difference, repeated thrice: in the प्रथमा and द्वितीया — which are always identical in the neuter — the cells are फलम् (sg, अतोऽम्), फले (dual, शी), फलानि (pl, शि + नुम्). From the तृतीया down (फलेन, फलाय, फलस्य, फले…) it is letter-for-letter देव. So learn देव, change three cells, and you have every a-stem neuter — फल, वन, ज्ञान, पुष्प.
