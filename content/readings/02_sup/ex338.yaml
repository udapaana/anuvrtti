- id: ex338
  kind: graded
  segment: 195
  order: 1
  sentence: 'वणिजौ मरुतौ च हिमवतः प्रयागम् आगच्छन्, यत्र गङ्गा यमुना च मिलतः। वणिजौ अवदताम् — हे सरितौ, युवाम् पवित्रे। हे गङ्गे, सरित्, त्वम् श्रेष्ठा। तौ सरितोः अस्नाताम्, सरिद्भ्याम् दीपौ च अयच्छताम्। तत्र मरुतौ अवदताम् — हे धीमन्तौ, युवयोः कर्मभ्याम् आवाम् तुष्टौ। अधुना आवाम् गच्छावः। वणिजौ मरुतोः वाचः अशृणुताम्। मरुतौ धीमद्भ्याम् वणिग्भ्याम् पुष्पाणि अगृह्णीताम्। तयोः स्नेहः धीमतोः वणिजोः आसीत्। ततः मरुतौ द्वे दिशौ प्रति उदपतताम् — तयोः एकः पूर्वाम्, अपरः पश्चिमाम्। वणिजौ ताभ्याम् दिग्भ्याम् नमः अकुरुताम्।'
  translation: 'The merchants and the two winds came down from the Himālaya to Prayāga, where the Gaṅgā and the Yamunā meet. The merchants said: "O two rivers, you are pure. O Gaṅgā, O river, you are the best." They bathed in the two rivers, and offered two lamps to the rivers. There the winds said: "Clever ones, we two are pleased by your two deeds. Now we go." The merchants heard the winds'' words. The winds accepted flowers from the two clever merchants. Their affection rested on the clever merchants. Then the winds flew up towards two directions — one of them to the east, the other to the west. The merchants bowed to those two directions.'
  teaches: 'Part 13 — the parting at the confluence: the vocatives सरितौ, सरित्, धीमन्तौ; सरितोः (locative), सरिद्भ्याम् (dative); धीमद्भ्याम् and वणिग्भ्याम् (ablative), धीमतोः (locative); कर्मभ्याम्; मरुतोः; दिशौ, दिग्भ्याम्; वाचः.'
