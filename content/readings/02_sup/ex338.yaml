- id: ex338
  kind: graded
  segment: 195
  order: 1
  sentence: 'पुत्रौ प्रयागम् अगच्छताम्, यत्र गङ्गा यमुना च मिलतः। तौ अवदताम् — हे सरितौ, युवाम् पवित्रे। हे गङ्गे, सरित्, त्वम् श्रेष्ठा। तौ सरितोः अस्नाताम्, सरिद्भ्याम् दीपौ च अयच्छताम्। तत्र सः मुनिः पुनः आगच्छत्। पुत्रौ मुनेः वाचः अशृणुताम्। सः धीमद्भ्याम् पुत्राभ्याम् उपहारम् अगृह्णात्। तस्य स्नेहः धीमतोः पुत्रयोः। सुहृदः अपि तत्र आसन्। मुनिः अवदत् — हे धीमन्तौ, युवयोः कर्मभ्याम् जगत् तुष्टम्। हे नामनी, युवाम् अमरे भवतम्। हे श्रीमन्तः, शृणुत — मरुद्भ्यः नमः कुरुत, मरुतः न बिभीत। पुत्रौ अगायताम् — हे जगती, हे दिशौ, हे उदीचि दिक्, युष्मभ्यम् नमः।'
  translation: 'The sons came to Prayāga, where the Gaṅgā and the Yamunā meet. They said: "O two rivers, you are pure. O Gaṅgā, river, you are the best." They bathed in the two rivers, and offered two lamps to the rivers. There that sage came again. The sons heard the sage''s words. He accepted a gift from the two clever sons. His affection was for the two clever sons. Their friends were there too. The sage said: "Clever ones, through your two deeds the world is pleased. O two names, be immortal. Glorious ones, listen — bow to the winds, and do not fear the wind." The sons sang: "O two worlds, O two directions, O northern direction — obeisance to you."'
  teaches: 'Part 13 — the confluence: the vocatives सरितौ, सरित्, धीमन्तौ, श्रीमन्तः, नामनी, जगती, दिशौ, दिक्; सरितोः, सरिद्भ्याम् (dative); धीमद्भ्याम्, धीमतोः; कर्मभ्याम्; मरुद्भ्यः, मरुतः (ablative); वाचः.'
