- id: ex338
  kind: graded
  segment: 195
  order: 1
  sentence: 'वणिजौ मरुतौ च हिमवतः प्रयागम् आगच्छन्, यत्र गङ्गा यमुना च मिलतः। वणिजौ अवदताम् — हे गङ्गे, हे यमुने, युवाम् पवित्रे। तौ सरितोः सङ्गमे अस्नाताम्। तदा मरुतौ अवदताम् — हे धीमन्तौ, अधुना आवाम् गच्छावः। ततः मरुतौ द्वे दिशौ प्रति उदपतताम् — तयोः एकः पूर्वाम्, अपरः पश्चिमाम्। वणिजौ ताभ्याम् दिग्भ्याम् नमः अकुरुताम्।'
  translation: 'The merchants and the two winds came down from the Himālaya to Prayāga, where the Gaṅgā and the Yamunā meet. The merchants said: "O Gaṅgā, O Yamunā, you two are pure." They bathed at the meeting of the two rivers. Then the winds said: "Wise ones, now we two go." Then the winds flew up towards two directions — one of them to the east, the other to the west. The merchants bowed to those two directions.'
  teaches: 'Part 13 — the parting at the confluence: the vocatives गङ्गे, यमुने, धीमन्तौ; पवित्रे (feminine dual); सरितोः (genitive dual); दिशौ, and दिग्भ्याम् with नमः.'
