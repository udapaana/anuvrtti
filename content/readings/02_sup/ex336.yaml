- id: ex336
  kind: graded
  segment: 194
  order: 1
  sentence: 'ततः वणिजौ हिमवन्तम् प्रति अचलताम्। मार्गे गङ्गा नाम सरित् आसीत्। तौ सरितः जलम् अपिबताम्। यमुना अपि तया सरिता सह मिलति। ताभ्याम् सरिद्भ्याम् भूमिः शस्यवती। सरिताम् गङ्गा श्रेष्ठा। सरित्सु स्नानम् पुण्यम्। तौ सरिते पुष्पाणि अयच्छताम्। हिमवान् उदीच्याः दिशः भूषणम्। सः द्वयोः दिशोः समुद्रौ स्पृशति। द्वाभ्याम् दिग्भ्याम् मेघाः आगच्छन्। वणिजौ उदीच्यै दिशे नमः अकुरुताम्।'
  translation: 'Then the merchants went on towards the Himālaya. On the way was a river called Gaṅgā. They drank water from the river. The Yamunā too joins that river. Through those two rivers the land is fruitful. Of rivers the Gaṅgā is the best. Bathing in rivers is holy. They offered flowers to the river. The Himālaya is the ornament of the northern quarter. On its two sides, east and west, it touches the two oceans. From those two quarters the clouds came. The merchants bowed to the northern quarter.'
  teaches: 'Part 11 — the rivers and the mountain: सरित् in the singular and the oblique plural (सरित्, सरितः, सरिता, सरिते, सरिद्भ्याम्, सरिताम्, सरित्सु); दिश् — दिशः, दिशोः, दिग्भ्याम्, दिशे. The mountain spanning the two oceans is Kālidāsa''s (कुमारसंभव 1.1).'
