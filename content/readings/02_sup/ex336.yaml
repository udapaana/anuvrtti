- id: ex336
  kind: graded
  segment: 194
  order: 1
  sentence: 'विष्णुदत्तः शिवदत्तः च हिमवन्तम् प्रति अचलताम्। मार्गे गङ्गा नाम सरित् आसीत्। तौ सरितः जलम् अपिबताम्। यमुना अपि तया सरिता सह मिलति। ताभ्याम् सरिद्भ्याम् भूमिः शस्यवती। सागरः सर्वाभिः सरिद्भिः पूर्णः। जनाः सरिद्भ्यः जलम् आनयन्ति। सरिताम् गङ्गा श्रेष्ठा। सरित्सु स्नानम् पुण्यम्। पुत्रौ सरिते पुष्पाणि अयच्छताम्। हिमवान् उदीच्याः दिशः भूषणम्। सः द्वयोः दिशोः समुद्रौ स्पृशति। द्वाभ्याम् दिग्भ्याम् मेघाः आगच्छन्। पुत्रौ उदीच्यै दिशे नमः अकुरुताम्।'
  translation: 'Viṣṇudatta and Śivadatta set out towards the Himālaya. On the way was a river called Gaṅgā. They drank water from the river. The Yamunā too joins that river. Through those two rivers the land is fruitful. The ocean is filled by all the rivers. People fetch water from the rivers. Of rivers the Gaṅgā is the best. Bathing in rivers is holy. The sons offered flowers to the river. The Himālaya is the ornament of the northern quarter. In two directions it touches the two oceans. From two directions the clouds came. The sons bowed to the northern quarter.'
  teaches: 'Part 11 — the rivers and the mountain: सरित् in the singular and the oblique plural (सरित्, सरितः, सरिता, सरिते, सरिद्भ्याम्, सरिद्भिः, सरिद्भ्यः, सरिताम्, सरित्सु); दिश् — दिशः, दिशोः, दिग्भ्याम्, दिशे. The mountain spanning the two oceans is Kālidāsa''s (कुमारसंभव 1.1).'
