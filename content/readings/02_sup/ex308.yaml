- id: ex308
  kind: graded
  segment: 183
  order: 3
  sentence: 'गुरुः पुनः पृच्छति — कस्मै फलम् ददासि? एतस्मै बालाय। केभ्यः पुष्पाणि? एतेभ्यः देवेभ्यः। कस्मात् भयम्? एतस्मात् सर्पात्। काभ्यः जलम्? एताभ्यः नदीभ्यः। एतस्य नाम किम्? कयोः गृहम् एतत्? एतयोः भ्रात्रोः। केषाम् एते ग्रन्थाः? एतेषाम् शिष्याणाम्। कस्मिन् देवः? एतस्मिन् मन्दिरे। केषु पक्षिणः? एतेषु वृक्षेषु।'
  translation: 'The teacher asks again: "To whom do you give the fruit?" "To this boy." "To whom the flowers?" "To these gods." "Fear of what?" "Of this snake." "From which rivers the water?" "From these rivers." "What is this one''s name? Whose house is this?" "These two brothers''." "Whose are these books?" "These pupils''." "In what is the god?" "In this temple." "In what are the birds?" "In these trees."'
  teaches: 'More of किम् and एतद् — कस्मै/एतस्मै, केभ्यः/एतेभ्यः, कस्मात्/एतस्मात्, काभ्यः/एताभ्यः, एतस्य, कयोः/एतयोः, केषाम्/एतेषाम्, कस्मिन्/एतस्मिन्, केषु/एतेषु.'
