  order: 4
  sentence: द्वयोः राज्ञोः युद्धम् अभवत्।
  translation: A war broke out between two kings.
  teaches: The genitive dual of an अन्-stem, राज्ञोः (weak stem राज्ञ्), with द्वयोः — "between two" is the genitive.
  words:
  - form: द्वयोः
    lemma: द्वि
    gloss: two
    notes:
    - term: संख्या
      en: numeral
    - term: विशेषण
      en: qualifying राज्ञोः
    - term: षष्ठी
      en: genitive dual — द्वि becomes द्वय before ओस्
    rel:
    - kind: विशेषण
      to: 1
  - form: राज्ञोः
    lemma: राजन्
    gloss: of two kings
    notes:
    - term: सम्बन्ध
      en: relation
    - term: षष्ठी
      en: genitive dual — the weak stem राज्ञ् before the vowel ending ओस्
  - form: युद्धम्
    lemma: युद्ध
    gloss: a war
    notes:
    - term: एकवचन
      en: singular
    - term: नपुंसकलिङ्ग
      en: neuter
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative — neuter -म्, the subject of अभवत्
  - form: अभवत्
    lemma: भू
    gloss: arose
    notes:
    - term: लङ्
      en: imperfect, 3rd singular — "came to be", the augment अ before भव
