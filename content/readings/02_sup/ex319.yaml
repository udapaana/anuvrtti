- id: ex319
  kind: graded
  segment: 183
  order: 2
  sentence: 'मालती स्रग्भ्यः पुष्पाणि चिनोति, स्रग्भ्याम् च वाग्देव्याः मूर्तिम् अलङ्करोति। स्रजोः भ्रमराः भ्रमन्ति। सा प्रार्थयते — हे वाक्, मम पितामहस्य जिह्वायाम् वस। तदा पितामहः वेदम् पठति, किन्तु ऋग्द्वयम् विस्मरति। सः वदति — हे ऋचौ, मम स्मृतौ तिष्ठतम्। ततः सः देव्याः पुरतः जानुनी भूमौ स्थापयति, वेदनया च "आः" इति वदति। मालती माक्षिकम् आनयति, वदति च — मधु एव औषधम्। मधुनः स्वादेन पितामहः हसति, अश्रुभिः सह। द्वयोः मनोभ्याम् चिन्ता अपगच्छति।'
  translation: 'Mālatī gathers flowers for garlands, and with two garlands adorns the image of the goddess of Speech. Bees hover over the two garlands. She prays: "Speech, dwell on my grandfather''s tongue." Just then Grandfather recites the Veda, but forgets two verses. He says: "Verses, stay in my memory!" Then he sets both knees on the ground before the goddess, and says "Ah!" in pain. Mālatī brings honey and says: "Honey is the medicine." At the taste of the honey Grandfather laughs, with tears. Worry leaves both their minds.'
  teaches: 'Mālatī and her grandfather, part 1 — the consonant stems स्रज् (स्रग्भ्यः, स्रग्भ्याम्, स्रजोः), वाच् (वाक्, the goddess addressed), ऋच् (ऋचौ addressed); and the neuter उ-stems जानुनी, मधु, मधुनः, अश्रुभिः; मनोभ्याम्.'
