- id: ex319
  kind: graded
  segment: 183
  order: 2
  sentence: 'मालती प्रातः स्रग्भ्यः पुष्पाणि चिनोति। सा स्रग्भ्याम् देवीम् वाचम् अलङ्करोति, स्रजोः च भ्रमराः भ्रमन्ति। सा प्रार्थयते — हे वाक्, मम पितामहस्य जिह्वायाम् वस। पितामहः वेदम् पठति, किन्तु ऋग्द्वयम् विस्मरति। सः वदति — हे ऋचौ, मम स्मृतौ तिष्ठतम्। ततः सः जानुनी स्पृशति; ते अपि रुजतः। मालती तस्मै माक्षिकम् आनयति — मधु तस्य औषधम्। पितामहस्य मुखम् अश्रुभिः आर्द्रम्। द्वयोः मनोभ्याम् चिन्ता अपगच्छति। सः गायति — हे मनांसि, यूयम् शिवसङ्कल्पानि भवत।'
  translation: 'In the morning Mālatī gathers flowers for garlands. She adorns the goddess Speech with two garlands, and bees hover over the two garlands. She prays: "Speech, dwell on my grandfather''s tongue." Grandfather recites the Veda, but forgets two verses. He says: "Verses, stay in my memory!" Then he touches his knees; they ache too. Mālatī brings him honey — honey is his medicine. Grandfather''s face is wet with tears. Worry leaves both their minds. He sings: "Minds, be of good resolve."'
  teaches: 'Mālatī and her grandfather, part 1 — the consonant stems स्रज् (स्रग्भ्यः, स्रग्भ्याम्, स्रजोः), वाच् (वाक् as the goddess), ऋच् (ऋचौ); जानुनी, मधु, अश्रुभिः; मनोभ्याम्, and मनांसि from the prayer that minds be "of auspicious resolve" (शिवसङ्कल्प).'
