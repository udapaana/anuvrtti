- id: ex319
  kind: graded
  segment: 183
  order: 2
  sentence: 'हे वाक्, त्वम् मधुरा भव। वाचौ, युवाम् सदा सत्ये भवतम्। सः वाग्भ्याम् एव सर्वम् वदति। बालाः वाग्भ्यः स्पृहयन्ति। वाचोः भेदः न अस्ति। मधु मधुरम् अस्ति। पुष्पेषु मधूनि सन्ति। आपणिकः मधुनी आनयति। माता मधुभिः मोदकान् करोति। भयम् मनोभ्याम् अपगच्छतु। मनांसि, शान्तिम् लभध्वम्।'
  translation: 'O speech, be sweet. You two words, always be true. He says everything with just two words. Children long for words. Between the two words there is no difference. Honey is sweet. In flowers there are honeys. The shopkeeper brings two kinds of honey. Mother makes sweets with honeys. May fear leave both minds. O minds, find peace.'
  teaches: 'The consonant stem वाच् and the neuters मधु, मनस् in the cells the corpus lacked — वाक्, वाचौ (vocative), वाग्भ्याम्, वाग्भ्यः, वाचोः; मधु, मधूनि, मधुनी, मधुभिः; मनोभ्याम्, मनांसि (vocative).'
