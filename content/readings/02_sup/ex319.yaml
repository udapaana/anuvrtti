- id: ex319
  kind: graded
  segment: 183
  order: 2
  sentence: 'मालती उद्याने स्रग्भ्यः पुष्पाणि चिनोति, स्रग्भ्याम् च वाग्देव्याः मूर्तिम् अलङ्करोति। स्रजोः भ्रमराः भ्रमन्ति। सा प्रार्थयते — हे वाक्, मम पितामहस्य जिह्वायाम् वस। तदा पितामहः वेदम् पठति, किन्तु तस्य कण्ठः शुष्कः, सः ऋग्द्वयम् विस्मरति। ततः सः देव्याः पुरतः जानुनी भूमौ स्थापयति; सः वृद्धः, अतः वेदनया "आः" इति वदति। मालती माक्षिकम् आनयति, वदति च — मधु एव कण्ठस्य औषधम्। मधुनः स्वादेन पितामहः हसति, अश्रुभिः सह। द्वयोः मनोभ्याम् चिन्ता अपगच्छति।'
  translation: 'In the garden Mālatī gathers flowers for garlands, and with two garlands adorns the image of the goddess of Speech. Bees hover over the two garlands. She prays: "Speech, dwell on my grandfather''s tongue." Just then Grandfather recites the Veda, but his throat is dry, and he forgets two verses. Then he sets both knees on the ground before the goddess; he is old, so he says "Ah!" in pain. Mālatī brings honey and says: "Honey is the medicine for a throat." At the taste of the honey Grandfather laughs, with tears. Worry leaves both their minds.'
  teaches: 'Mālatī and her grandfather, part 1 — the consonant stems स्रज् (स्रग्भ्यः, स्रग्भ्याम्, स्रजोः), वाच् (वाक्, the goddess addressed), ऋच् (in ऋग्द्वयम्); and the neuter उ-stems जानुनी, मधु, मधुनः, अश्रुभिः; मनोभ्याम्.'
