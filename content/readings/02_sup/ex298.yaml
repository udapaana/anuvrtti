- id: ex298
  kind: graded
  segment: 180
  order: 3
  sentence: 'कन्या वदति — हे पितः, हे मातः, शृणुतम्। अहम् पितुः धर्मम् अशिक्षे, मातुः च मधुराम् वाचम्। मधुरया वाचा सर्वे प्रसीदन्ति। अस्माकम् गौः धेनुम् अनुगच्छति। अहम् गवे तृणम् ददामि, गवि च स्निह्यामि। मधुना सह क्षीरम् पिबामि। शुद्धाय मनसे नमः।'
  translation: 'The girl says: "O father, O mother, listen, both of you. From father I learned dharma, and from mother sweet speech. With sweet speech everyone is pleased. Our cow follows the heifer. I give grass to the cow, and I am fond of the cow. I drink milk with honey. Homage to a pure mind."'
  teaches: 'Singulars of the rarer stems — हे पितः, हे मातः, पितुः and मातुः as ablatives, वाचम्/वाचा, गौः/गवे/गवि, मधुना, मनसे — and the imperative dual शृणुतम्.'
