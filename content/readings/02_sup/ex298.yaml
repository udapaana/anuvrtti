- id: ex298
  kind: graded
  segment: 180
  order: 3
  sentence: 'कन्या वदति — हे पितः, हे मातः, शृणुतम्। अहम् पितुः धर्मम् अशिक्षे, मातुः च मधुराम् वाचम्। मधुरया वाचा सर्वे प्रसीदन्ति, अस्माकम् गौः अपि। अहम् गवे तृणम् ददामि, गवि च स्निह्यामि। तस्याः क्षीरम् मधुना सह पिबामि। युवाम् मम गुरू।'
  translation: 'The girl says: "O father, O mother, listen, both of you. From father I learned dharma, and from mother sweet speech. With sweet speech everyone is pleased — even our cow. I give her grass, and I am fond of her. I drink her milk with honey. You two are my teachers."'
  teaches: 'Singulars of the rarer stems — हे पितः, हे मातः, पितुः and मातुः as ablatives, वाचम्/वाचा, गौः/गवे/गवि, मधुना — and the imperative dual शृणुतम्.'
