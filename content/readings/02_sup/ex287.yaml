  kind: graded
  segment: 178
  order: 1
  sentence: 'एकस्य राज्ञः द्वे दुहितरौ स्तः। प्रातः ते नद्यौ गच्छतः। तत्र धेनू चरतः। कन्ये द्वौ मुनी पश्यतः। एकः मुनिः तयोः बाहू स्पृशति, शुभे वाचौ च वदति — युवयोः मनसी शुद्धे भवताम्।'
  translation: 'A king has two daughters. In the morning they go to the two rivers. There two cows are grazing. The girls see two sages. One sage touches their arms and speaks two blessings: "May your minds be pure."'
  teaches: 'Duals across the stem classes — दुहितरौ, नद्यौ, धेनू, मुनी, बाहू, वाचौ, मनसी — and the imperative dual भवताम्.'
