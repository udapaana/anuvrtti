- id: ex287
  kind: graded
  segment: 178
  order: 1
  sentence: 'एकस्य राज्ञः द्वे दुहितरौ स्तः। प्रातः ते सङ्गमम् गच्छतः, यत्र द्वे नद्यौ मिलतः। तत्र धेनू चरतः। कन्ये द्वौ मुनी पश्यतः। एकः मुनिः तयोः बाहू स्पृशति, शुभाम् वाचम् च वदति — हे कन्ये, युवयोः मनसी शुद्धे भवताम्।'
  translation: 'A king has two daughters. In the morning they go to the confluence, where two rivers meet. There two cows are grazing. The girls see two sages. One sage touches their arms and speaks a blessing: "Girls, may your minds be pure."'
  teaches: 'Duals across the stem classes — दुहितरौ, नद्यौ, धेनू, मुनी, बाहू, मनसी — and the imperative dual भवताम्.'
