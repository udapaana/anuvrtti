- id: ex327
  kind: graded
  segment: 189
  order: 2
  sentence: 'मार्गे वणिजौ महतीम् सरितम् अपश्यताम्। सरितः तीरे पक्षिणाम् गणः आसीत्। धनदत्तः पक्षिभ्यः धान्यम् अयच्छत्। तदा मरुतः प्रचण्डाः अवहन्। मरुद्भिः वृक्षाः अकम्पन्त। सागरदत्तः अवदत् — हे मरुत्, त्वम् शान्तः भव। सरिति एका नौका आसीत्। नौकायाः स्वामिनः साहाय्येन वणिजौ सरितम् अतरताम्।'
  translation: 'On the way the merchants saw a great river. On the river''s bank was a flock of birds. Dhanadatta gave grain to the birds. Then fierce winds blew. The trees shook with the winds. Sāgaradatta said: "O wind, be calm." On the river was a boat. With the help of the boat''s owner the merchants crossed the river.'
  teaches: 'Part 2 — the river: सरितम्, सरितः, सरिति (त्-stem, feminine); मरुतः, मरुद्भिः, मरुत् (vocative); पक्षिणाम्, पक्षिभ्यः, स्वामिनः (इन्).'
