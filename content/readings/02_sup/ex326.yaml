- id: ex326
  kind: graded
  segment: 189
  order: 1
  sentence: 'पुरा उज्जयिन्याम् धनदत्तः सागरदत्तः च अवसताम्। तौ वणिजौ बुद्धिमन्तौ। तयोः यशः महत्। एकदा राजा एतौ आह्वयत्। सः अवदत् — मम द्वे कर्मणी कुरुतम्। समुद्रात् रत्नानि आनयतम्, सुवर्णवर्णौ पक्षिणौ च। राजा वणिग्भ्याम् रथम् अयच्छत्। तौ मन्त्रिणा सह अगच्छताम्।'
  translation: 'Long ago in Ujjayinī lived Dhanadatta and Sāgaradatta. The two merchants were clever. Their fame was great. One day the king summoned them. He said: "Do two tasks for me. Bring jewels from the sea — and two golden birds." The king gave the merchants a chariot. They set out with a minister.'
  teaches: 'The merchants'' journey, part 1 — consonant stems in the dual: वणिजौ, बुद्धिमन्तौ (मत्), कर्मणी (अन्, neuter), पक्षिणौ (इन्), वणिग्भ्याम्, and the instrumental मन्त्रिणा.'
