- id: ex320
  kind: graded
  segment: 183
  order: 3
  sentence: 'पितामहस्य जानुनोः वेदना न शाम्यति। मालती वस्तुभ्यः आपणम् गच्छति। मार्गे द्वे धेनू वत्साभ्याम् सह चरतः, वत्सौ च धेनुभ्याम् दूरम् न गच्छतः। एका धेनुः जानुभ्याम् भूमौ उपविशति, पितामहः इव। मालती हसति, गोः पृष्ठम् च स्पृशति। आपणे सा स्रजौ विक्रीणीते। स्रजोः मूल्येन सा औषधम् क्रीणाति, स्रग्भ्याम् च नवम् सूत्रम्। स्रग्भ्यः सुगन्धः आपणे प्रसरति।'
  translation: 'The pain in Grandfather''s knees does not ease. Mālatī goes to the market for things. On the way two cows graze with their calves, and the calves do not stray from their mothers. One cow sits down on the ground knees first, just like Grandfather. Mālatī laughs and pats the cow''s back. In the market she sells the two garlands. With the price of the two garlands she buys medicine, and new thread for two more garlands. The garlands'' fragrance spreads through the market.'
  teaches: 'Mālatī, part 2 — to market: जानुनोः, जानुभ्याम्, वस्तुभ्यः (the dative of what one goes for, 2.3.14); धेनुभ्याम् (ablative), गोः; स्रज् in the dual and plural — स्रजौ, स्रजोः, स्रग्भ्याम् (dative), स्रग्भ्यः (ablative).'
