- id: ex320
  kind: graded
  segment: 183
  order: 3
  sentence: 'गोपालः गोभ्याम् धेनुभ्याम् च दूरम् न गच्छति। गोः वत्सः क्रीडति। शिष्यः गुरोः वाग्भ्याम् स्पृहयति। बालः दुष्टानाम् वाग्भ्यः बिभेति। तयोः वाचोः अर्थः समानः। सा मधुभ्याम् पायसम् करोति। भ्रमराः मधुभ्यः भ्रमन्ति। मधुनः बिन्दुः पतति। मधुनोः मक्षिके स्तः।'
  translation: 'The cowherd does not go far from the two cows. The cow''s calf plays. The pupil longs for two words from the teacher. The child fears the words of the wicked. The meaning of those two words is the same. She makes rice-pudding with two honeys. Bees roam for honeys. A drop falls from the honey. In the two honeys are two flies.'
  teaches: 'The rest of the case-forms of गो, धेनु, वाच् and मधु: गोभ्याम्, धेनुभ्याम् (ablative), गोः (genitive), वाग्भ्याम् (dative), वाग्भ्यः (ablative), वाचोः (genitive), मधुभ्याम्, मधुभ्यः, मधुनः, मधुनोः.'
