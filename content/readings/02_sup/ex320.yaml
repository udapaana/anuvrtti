- id: ex320
  kind: graded
  segment: 183
  order: 3
  sentence: 'पितामहस्य जानुनोः वेदना न शाम्यति। मालती वदति — अहम् वस्तुभ्यः आपणम् गच्छामि। मार्गे सः गोपालः गोभ्याम् धेनुभ्याम् च दूरम् न गच्छति; गोः वत्सः क्रीडति, एका धेनुः जानुभ्याम् भूमौ उपविशति। आपणे मधुनः बिन्दवः पतन्ति। मालती द्वे स्रजौ विक्रीणीते — स्रजोः मूल्येन सा औषधम् क्रीणाति, स्रग्भ्याम् च नवम् सूत्रम्। स्रग्भ्यः सुगन्धः आपणे प्रसरति।'
  translation: 'The pain in Grandfather''s knees does not ease. Mālatī says: "I am going to the market for things." On the way that cowherd does not go far from his two cows; the cow''s calf plays, and one cow sits down on the ground, knees first. In the market drops fall from the honey. Mālatī sells two garlands — with the price of the two garlands she buys medicine, and new thread for two more garlands. The fragrance of the garlands spreads through the market.'
  teaches: 'Mālatī, part 2 — to market: जानुनोः, जानुभ्याम्, मधुनः, वस्तुभ्यः; गोभ्याम् and धेनुभ्याम् (ablative), गोः; स्रज् in the dual and plural — स्रजौ, स्रजोः, स्रग्भ्याम् (dative), स्रग्भ्यः (ablative).'
