- id: ex297
  kind: graded
  segment: 180
  order: 2
  sentence: 'नृपौ राजधानीम् प्रतिगच्छतः। मार्गः नदीभिः रम्यः। कतिपयाभिः रात्रिभिः ते नगरम् प्राप्नुवन्ति। नगरे जनाः पितृभिः मातृभिः च सह स्वागतम् कुर्वन्ति। अन्यैः राजभिः सह सभा भवति। नृपौ ऋषीणाम् गुणान् वदतः — तेषाम् कर्मभिः आश्रमः पवित्रः, अस्माकम् गोभिः च सः इदानीम् समृद्धः।'
  translation: 'The kings return to the capital. The road is lovely with rivers. In a few nights they reach the city. In the city people come out with their fathers and mothers to welcome them. There is an assembly with other kings. The kings tell of the sages'' virtues: "By their deeds the hermitage is holy — and with our cows it is now prosperous too."'
  teaches: 'The visit, part 5 — home: the instrumental plural -भिः across the stem classes — नदीभिः, रात्रिभिः (time taken, 2.3.6), पितृभिः, मातृभिः, राजभिः, कर्मभिः, गोभिः.'
