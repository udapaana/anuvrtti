- id: ex297
  kind: graded
  segment: 180
  order: 2
  sentence: 'नृपौ ऋष्योः आश्रमात् राजधानीम् प्रतिगच्छतः। मार्गः नदीभिः रम्यः। कतिपयाभिः रात्रिभिः तौ नगरम् प्राप्नुतः। नगरे बालाः पितृभिः मातृभिः च सह नृपयोः स्वागतम् कुर्वन्ति। अन्यैः राजभिः सह सभा भवति। नृपौ ऋष्योः गुणान् वदतः — तयोः कर्मभिः आश्रमः पवित्रः, गोभिः च समृद्धः।'
  translation: 'The two kings return from the two sages'' hermitage to the capital. The road is lovely with rivers. In a few nights they reach the city. In the city children come with their fathers and mothers to welcome the kings. There is an assembly with other kings. The kings tell of the two sages'' virtues: "By their deeds the hermitage is holy, and it is rich in cows."'
  teaches: 'The visit, part 5 — home: the instrumental plural -भिः across the stem classes — नदीभिः, रात्रिभिः (time taken, 2.3.6), पितृभिः, मातृभिः, राजभिः, कर्मभिः, गोभिः.'
