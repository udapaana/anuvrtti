- id: ex297
  kind: graded
  segment: 180
  order: 2
  sentence: 'राजभिः पितृभिः मातृभिः च सह जनाः गायन्ति। नदीभिः क्षेत्राणि सिच्यन्ते। रात्रिभिः उत्सवः शोभते। गोपाः गोभिः जीवन्ति। गुरुः नामभिः बालान् आह्वयति।'
  translation: 'With the kings, the fathers and the mothers, the people sing. The fields are watered by the rivers. The festival is lovely with its nights. The cowherds live by their cattle. The teacher calls the boys by their names.'
  teaches: 'Instrumental plurals across the stem classes — राजभिः, पितृभिः, मातृभिः, नदीभिः, रात्रिभिः, गोभिः, नामभिः.'
