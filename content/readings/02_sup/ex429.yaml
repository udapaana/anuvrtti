  sentence: 'अन्धकारे बालः रज्ज्वाः बिभेति, सर्पम् इव ताम् पश्यति।'
  translation: 'In the dark the boy is afraid of the rope; he sees it as a snake.'
  teaches: 'रज्ज्वाः — the ablative singular of an उ-stem feminine, with the optional feminine ending -आः (रज्जोः is the other form); भी takes the ablative.'
