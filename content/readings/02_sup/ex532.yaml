  sentence: 'रात्रौ ग्रामे दीपानाम् उत्सवः भवति। सर्वाणि गृहाणि दीपैः शोभन्ते। सर्वेषाम् बालकानाम् मुखानि प्रसन्नानि। सर्वासाम् बालिकानाम् हस्तेषु पुष्पाणि।'
  translation: 'At night there is a festival of lamps in the village. All the houses shine with lamps. All the boys'' faces are bright. In all the girls'' hands are flowers.'
  teaches: 'सर्व in the plural — सर्वाणि, सर्वेषाम्, सर्वासाम् — taking the pronoun''s ending, not the noun''s'
