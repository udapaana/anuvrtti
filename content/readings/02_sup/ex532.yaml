  vyakhya: 'सर्व-शब्दः सर्वादिः, अतः षष्ठीबहुवचने सर्वेषाम्, सर्वासाम् — न तु सर्वाणाम्। नपुंसके प्रथमाबहुवचने सर्वाणि।'
  vyakhya_en: |
    सर्व "all" declines as a pronoun: where a noun has -आनाम् (बालकानाम्), सर्व has -एषाम् in the masculine and -आसाम् in the feminine (7.1.52 with 7.3.103). The neuter plural सर्वाणि is the same as a noun's (गृहाणि).
