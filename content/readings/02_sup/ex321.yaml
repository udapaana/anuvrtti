- id: ex321
  kind: graded
  segment: 183
  order: 4
  sentence: 'वैद्यः तैलम् ददाति — इदम् जानुभ्याम् हितम्। पितामहः हसति — हे जानुनी, इदानीम् मम आज्ञाम् शृणुतम्। मालत्याः नेत्रयोः आनन्दबाष्पः; सा वदति — हे अश्रूणि, गच्छत। मालत्याः स्रग्भ्याम् पुष्पाणि पितामहस्य पादयोः पतन्ति। पितामहः वदति — युवाभ्याम्, वैद्येन मालत्या च, सह अहम् मन्दिरम् गमिष्यामि।'
  translation: 'The doctor gives an oil — "this is good for both knees." Grandfather laughs: "Knees, now obey me!" There are tears of joy in Mālatī''s eyes; she says: "Tears, go away." Petals fall from Mālatī''s two garlands at Grandfather''s feet. Grandfather says: "With you two — the doctor and Mālatī — I will go to the temple."'
  teaches: 'Mālatī, part 3 — the cure: जानुभ्याम् (for the knees), जानुनी and अश्रूणि addressed, स्रग्भ्याम् (from the garlands), and युवाभ्याम् with सह.'
