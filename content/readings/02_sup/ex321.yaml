- id: ex321
  kind: graded
  segment: 183
  order: 4
  sentence: 'वैद्यः तैलम् ददाति — इदम् जानुभ्याम् हितम्। तैलेन पितामहः पुनः चलति। सः हसति — हे जानुनी, इदानीम् मम आज्ञाम् शृणुतम्। मालती मन्दिराय द्वे स्रजौ धारयति; हर्षेण सा नृत्यति, स्रग्भ्याम् च पुष्पाणि पितामहस्य पादयोः पतन्ति। तस्याः नेत्रयोः आनन्दबाष्पः; सा वदति — हे अश्रूणि, गच्छत। पितामहः वदति — युवाभ्याम्, वैद्येन मालत्या च, सह अहम् मन्दिरम् गमिष्यामि।'
  translation: 'The doctor gives an oil — "this is good for both knees." With the oil Grandfather walks again. He laughs: "Knees, now obey me!" Mālatī is carrying two garlands for the temple; she dances for joy, and petals fall from the two garlands at Grandfather''s feet. There are tears of joy in her eyes; she says: "Tears, go away." Grandfather says: "With you two — the doctor and Mālatī — I will go to the temple."'
  teaches: 'Mālatī, part 3 — the cure: जानुभ्याम् (for the knees), तैलेन (the means), जानुनी and अश्रूणि addressed, स्रग्भ्याम् (from the garlands), and युवाभ्याम् with सह.'
