- id: ex321
  kind: graded
  segment: 183
  order: 4
  sentence: 'भ्रमरः वदति — हे मधूनि, यूयम् मधुराणि स्थ। मधुनी, युवाम् अपि मधुरे स्थः। अहम् मधुभ्याम् स्पृहयामि। कवेः वाग्भ्याम् रसः स्रवति।'
  translation: 'The bee says: "O honeys, you are sweet. You two honeys, you too are sweet. I long for the two honeys." From the poet''s two words flows delight.'
  teaches: 'The last cells of मधु and वाच्: the vocatives मधूनि, मधुनी, the dative मधुभ्याम् and the ablative वाग्भ्याम्.'
