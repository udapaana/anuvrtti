- id: ex265
  kind: graded
  segment: 166
  sentence: 'पर्वतात् नदी वहति। नद्याः जलम् जनाः इच्छन्ति। जनाः नदीम् सेवन्ते, नद्यै नमन्ति च। नद्या क्षेत्राणि सिञ्चन्ति, नद्याः जलम् लभन्ते। नद्याम् बालाः क्रीडन्ति। हे नदि।'
  translation: 'From the mountain a river flows. The people want the river''s water. They serve the river and bow to the river. With the river they water the fields; from the river they get water. In the river the children play. O river!'
  teaches: 'नदी (ई-stem feminine) through all eight cases as a village lives by it — and नद्याः does double duty, षष्ठी (of the river) and पञ्चमी (from the river).'
