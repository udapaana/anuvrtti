- id: ex299
  kind: graded
  segment: 180
  order: 4
  sentence: 'सायम् वने ज्येष्ठा भगिनी वदति — हे स्वसारौ, शीघ्रम् आगच्छतम्। हे धेनवः, गृहम् चलत। किन्तु मार्गः न दृश्यते। कनिष्ठायाः तृष्णा महती। सा वदति — हे अम्बु, कुत्र असि? तदा ताः द्वयोः सरसोः जलम् पश्यन्ति। ज्येष्ठा हसति — हे सरसी! युवाम् अस्माकम् रक्षके। सरसोः तीरे द्वे नार्यौ तिष्ठतः। ते पृच्छतः — हे कन्ये, युवाम् कुतः? ज्येष्ठा वदति — हे युवती, अस्माकम् ग्रामम् दर्शयतम्। ग्रामस्य द्वारे द्वे सख्यौ धावतः; ज्येष्ठा वदति — हे मित्रे, वयम् क्षेमेण स्मः। ततः सा सर्वाः ग्रामस्य बालाः वदति — हे मित्राणि, हे युवतयः, अद्य तोयम् अस्मान् अरक्षत्।'
  translation: 'At dusk in the forest the eldest sister says: "Sisters, come quickly! Cows, go home!" But the path cannot be seen. The youngest is very thirsty. She says: "Water, where are you?" Then they see the water of two lakes. The eldest laughs: "Lakes, you two are our rescuers!" On the lakes'' bank stand two women. They say: "Girls, where are you two from?" The eldest says: "Ladies, show us our village." At the village gate two friends come running; the eldest tells them: "Friends, we are safe." Then she tells all the village girls: "Friends, young women — today the water saved us!"'
  teaches: 'The vocative across the classes, each with someone to call: स्वसारौ, धेनवः, अम्बु, सरसी, कन्ये, युवती, मित्रे, मित्राणि, युवतयः. Lost at dusk, one calls out to everything.'
