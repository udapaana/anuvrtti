- id: ex299
  kind: graded
  segment: 180
  order: 4
  sentence: 'सायम् तिस्रः भगिन्यः धेनुभिः सह वने मार्गम् न जानन्ति। ज्येष्ठा वदति — हे स्वसारौ, शीघ्रम् आगच्छतम्; हे धेनवः, चलत। कनिष्ठा "जलम्, जलम्" इति रोदिति। ताः द्वयोः सरसोः तीरम् गच्छन्ति, यत्र द्वे नार्यौ जलम् आनयतः। ताः सरसः जलम् पिबन्ति। नार्यौ पृच्छतः — हे कन्ये, युवाम् कुतः? ज्येष्ठा वदति — हे युवती, अस्माकम् ग्रामस्य मार्गम् दर्शयतम्। भगिन्यः युवतिभ्याम् मार्गम् जानन्ति। ग्रामस्य द्वारे द्वे सख्यौ धावतः; ज्येष्ठा वदति — हे मित्रे, वयम् क्षेमेण स्मः। ततः सा ग्रामबालाः प्रति वदति — हे मित्राणि, हे युवतयः, एते नार्यौ अस्मान् अरक्षताम्।'
  translation: 'At dusk three sisters and their cows cannot find the path in the forest. The eldest says: "Sisters, come quickly; cows, move on." The youngest cries, "Water, water!" They go to the bank of two ponds, where two women are drawing water. They drink water from the pond. The women ask: "Girls, where are you two from?" The eldest says: "Ladies, show us the way to our village." The sisters learn the way from the two women. At the village gate two friends come running; the eldest says: "Friends, we are safe." Then she tells the village girls: "Friends, young women — these two women saved us."'
  teaches: 'Lost at dusk, one calls to whoever is there — the vocatives स्वसारौ, धेनवः, कन्ये, युवती, मित्रे, मित्राणि, युवतयः; and the ablative of the one learnt from, युवतिभ्याम् (1.4.29), beside सरसः, the source of the water.'
