- id: ex299
  kind: graded
  segment: 180
  order: 4
  sentence: 'कविः गायति — हे वनानि, हे नद्यः, हे रात्रयः, हे गिरयः, हे धेनवः, युष्मासु मम मनः रमते। हे वने, हे रात्री, हे कन्ये, हे मातरौ, हे मनसी, युवाम् अपि सुखेन वसतम्। हे मधु, सदा प्रसीद।'
  translation: 'The poet sings: "O forests, O rivers, O nights, O mountains, O cows — my mind delights in you. O two forests, O two nights, O two girls, O two mothers, O two minds — may you two also live in happiness. O honey, be ever gracious."'
  teaches: 'The vocative in all three numbers on the neuter and feminine stems — वनानि/वने, रात्रयः/रात्री, नद्यः, गिरयः, धेनवः, कन्ये, मातरौ, मनसी, मधु.'
