  sentence: 'गङ्गा यमुना च द्वे सरितौ प्रयागे मिलतः। प्रातः जनाः तयोः सरितोः स्नान्ति।'
  translation: 'The Gaṅgā and the Yamunā, two rivers, meet at Prayāga. In the morning people bathe in those two rivers.'
  teaches: 'सरित् in the dual: सरितौ (nominative) and सरितोः as a locative — the same shape as the genitive, read here by the verb of bathing.'
