- id: ex301
  kind: graded
  segment: 181
  order: 2
  sentence: 'द्वाभ्याम् रात्रिभ्याम् नद्यौ पूर्णे भवतः। जनाः नदीभ्याम् क्षेत्राणि सिञ्चन्ति। कृषकाः भूमिभ्याम् बीजानि आनयन्ति। जलम् वनाभ्याम् हितम्। राजा मातृभ्याम् वस्त्रे यच्छति, राजभ्याम् कन्याभ्याम् च सह सभाम् गच्छति। प्रजाः मुन्योः विश्वसन्ति। ऋषिः शुभेभ्यः कर्मभ्यः शुद्धाभ्याम् मनोभ्याम् च नमति, वदति च — हे मनः, शाम्य।'
  translation: 'In two nights the two rivers become full. People water the fields with the two rivers. Farmers bring seed for the two fields. Water is good for the two forests. The king gives clothes to the two mothers, and goes to the assembly with the two kings and the two girls. The subjects trust the two sages. The seer bows to good deeds and to pure minds, and says: "O mind, be still."'
  teaches: 'The last empty duals — रात्रिभ्याम्, नद्यौ, नदीभ्याम्, भूमिभ्याम्, वनाभ्याम्, मातृभ्याम्, राजभ्याम्, कन्याभ्याम्, मुन्योः, मनोभ्याम् — with कर्मभ्यः and the neuter vocative हे मनः.'
