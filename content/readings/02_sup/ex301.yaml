- id: ex301
  kind: graded
  segment: 181
  order: 2
  sentence: 'मिथिलायाम् जनकः स्वे कन्ये — सीताम् ऊर्मिलाम् च — रामलक्ष्मणाभ्याम् यच्छति। दशरथः अपि देवीभ्याम् सह आगच्छति। जनाः ताभ्याम् राजभ्याम् सह नृत्यन्ति। ब्राह्मणाः शुभेभ्यः कर्मभ्यः आगच्छन्ति। दूताः मातृभ्याम् — कौसल्यायै सुमित्रायै च — सन्देशम् नयन्ति। राज्ञ्यः युवतिभ्याम् भूषणानि यच्छन्ति। वध्वौ मौक्तिकावलिभ्याम् शोभेते, तयोः पाण्योः कङ्कणानि। रामलक्ष्मणौ कन्याभ्याम् सह अग्निम् परिक्रामतः। सः उत्सवः द्वयोः राज्ञोः नेत्राभ्याम् आनन्दः, द्वयोः वध्वोः मनोभ्याम् सुखम्। रामः चिन्तयति — मनः, अद्य त्वम् धन्यम्।'
  translation: 'In Mithilā Janaka gives his two daughters — Sītā and Ūrmilā — to Rāma and Lakṣmaṇa. Daśaratha comes too, with two queens. The people dance with the two kings. Brahmins come for the auspicious rites. Messengers carry the news to the two mothers — Kausalyā and Sumitrā. The queens give ornaments to the two young women. The two brides shine with their pearl strings, bangles on both their hands. Rāma and Lakṣmaṇa walk round the fire with the two maidens. That festival is a delight to both kings'' eyes, and a joy for the two brides'' hearts. Rāma thinks: "Heart, today you are blessed."'
  teaches: 'A double wedding, where every pair is real: the dative dual (रामलक्ष्मणाभ्याम्, मातृभ्याम्, युवतिभ्याम्, नेत्राभ्याम्, मनोभ्याम्), the instrumental dual (देवीभ्याम्, राजभ्याम्, मौक्तिकावलिभ्याम्, कन्याभ्याम्), पाण्योः, कर्मभ्यः — and मनः, addressing one''s own heart.'
