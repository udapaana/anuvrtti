  sentence: 'वणिक् द्वाभ्याम् विपद्भ्याम् मुक्तः — रोगात् ऋणात् च।'
  translation: 'The merchant is free of two misfortunes — sickness and debt.'
  teaches: 'the द्-stem विपद् in the ablative dual, विपद्भ्याम्, with मुक्त "freed from"'
