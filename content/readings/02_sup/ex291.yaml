- id: ex291
  kind: graded
  segment: 178
  order: 5
  sentence: 'आश्रमे द्वौ ऋषी वसतः। एकदा तत्र द्वौ नृपौ आगच्छतः — ताभ्याम् सह राज्ञ्यौ, आचार्यौ, कुमारौ, द्वे गावौ च। ज्येष्ठः ऋषिः वदति — हे राजानौ, हे देव्यौ, हे गुरू, स्वागतम्। नृपौ वदतः — हे मुनी, आवाम् नमावः। राज्ञ्यौ वदतः — हे पुत्रौ, युवाम् अपि नमतम्। ऋषेः कन्ये हसतः, वदतः च — हे भ्रातरौ, हे धेनू, युवयोः अपि स्वागतम्।'
  translation: 'Two sages live in a hermitage. One day two kings come there — and with them two queens, two teachers, two princes and two cows. The elder sage says: "O kings, O queens, O teachers — welcome." The kings say: "O sages, we bow to you." The queens say: "Sons, you bow too." The sage''s two daughters laugh and say: "Brothers — and cows — you are welcome too!"'
  teaches: 'The visit of the two kings, part 1 — the vocative dual, which is the nominative dual''s form: राजानौ, देव्यौ, गुरू, मुनी, पुत्रौ, भ्रातरौ, धेनू. Whom one greets in pairs, one addresses in the dual.'
