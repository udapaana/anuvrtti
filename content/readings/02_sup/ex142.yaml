- id: ex142
  segment: 150
  sentence: राज्ञा सह राजानौ गच्छतः।
  translation: Together with the king, the two kings go.
  teaches: 'राजन् in the dual: strong राजानौ beside weak राज्ञा — the last two grades of the stem'
  words:
  - form: राज्ञा
    lemma: राजन्
    gloss: with/by the king
    notes:
    - term: करण
      en: accompaniment — "(together) with the king"
    - text: 'instr.sg = WEAK cell: राजन् loses its अ (अल्लोपः) → राज्ञ् + आ → राज्ञा'
    - cite: '6.4.134'
      role: अल्लोपोऽनः — the अ of the अन्-stem drops before a vowel ending → राज्ञ्
    - cite: '2.3.18'
      role: कर्तृकरणयोस्तृतीया → करण → राज्ञा
    - term: तृतीया
      en: instrumental singular (weak)
  - form: सह
    lemma: सह
    gloss: together with
    notes:
    - term: सहार्थ
      en: governs the तृतीया (accompaniment), as in ex032
  - form: राजानौ
    lemma: राजन्
    gloss: the two kings
    notes:
    - term: कर्तृ
      en: agent (dual)
    - text: 'nom.DUAL = STRONG cell: the अ lengthens → राजान् + औ → राजानौ'
    - cite: '6.4.8'
      role: सर्वनामस्थाने चासम्बुद्धौ — the न-stem lengthens in the strong cases → राजान्
    - cite: '1.4.22'
      role: द्व्येकयोर्द्विवचने → dual → राजानौ
    - term: प्रथमा
      en: nominative dual (strong)
  - form: गच्छतः
    lemma: गम्
    gloss: the two go
    notes:
    - term: गम्
      en: '"go" — 3rd person DUAL'
    - cite: '1.4.22'
      role: द्व्येकयोर्द्विवचने → dual verb → गच्छतः
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present dual
  vyakhya: सर्वनामस्थाने बलवत् (राजान्), अन्यत्र अल्लोपेन दुर्बलम् (राज्ञ्)। राजानौ — राज्ञा।
  vyakhya_en: |
    One sentence holds both halves of the राजन् paradigm. राजानौ "the two kings" is a STRONG cell (nom.dual, सर्वनामस्थान): the stem lengthens to राजान्. राज्ञा "with the king" is a WEAK cell (instr.sg): the अ of -अन् drops by अल्लोपः (6.4.134) → राज्ञ् + आ → राज्ञा. Strong राजान्- · weak राज्ञ्-: the same alternation as भगवान्/भगवतः and दण्डी/दण्डिनम्, now shown WITHIN one line, and in the dual you have been drilling since RV 1.2.
