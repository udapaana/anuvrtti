  segment: 183
  order: 8
  sentence: 'उद्याने द्वौ आम्रवृक्षौ स्तः। बालः पृच्छति — कयोः वृक्षयोः फलानि सन्ति? माता वदति — पश्य, ताभ्याम् फलानि पतन्ति।'
  translation: 'In the garden there are two mango trees. A boy asks: "On which of the two trees are there fruits?" His mother says: "Look, fruits are falling from both of them."'
  teaches: 'The locative dual of किम् — कयोः, "on which two?" — and the ablative dual of तद्, ताभ्याम्, "from those two".'
