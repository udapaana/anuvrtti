  vyakhya: 'यशस्, मनस् — सकारान्ताः नपुंसकाः। तृतीयायाम् यशसा, सप्तम्याम् मनसि।'
  vyakhya_en: |
    यशस् "glory" and मनस् "mind" are neuter stems in अस्. Before a vowel ending the स् simply stays: यशस् + आ → यशसा, "by (his) glory", the cause of fame; मनस् + इ → मनसि, "in the mind". In the nominative they show visarga: यशः, मनः.
