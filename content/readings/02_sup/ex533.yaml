  sentence: 'विक्रमः नाम राजा यशसा प्रसिद्धः आसीत्। परन्तु तस्य मनसि एका चिन्ता आसीत् — मम प्रजाः सुखिताः वा? सः रात्रौ एकाकी नगरम् अचरत्, प्रजानाम् वचनानि च अशृणोत्।'
  translation: 'There was a king named Vikrama, famous for his glory. But in his mind there was one worry: "Are my subjects happy?" At night he walked through the city alone, and listened to what his subjects said.'
