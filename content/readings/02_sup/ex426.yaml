- id: ex426
  kind: graded
  segment: 178
  order: 12
  sentence: 'ग्रामस्य जनाः द्वयोः नद्योः स्नान्ति, उभाभ्याम् नदीभ्याम् च जलम् आनयन्ति।'
  translation: 'The village people bathe in the two rivers, and bring water from both.'
  teaches: 'The two duals of नदी: नद्योः, locative (where they bathe), and नदीभ्याम्, ablative (where the water comes from).'
  words:
  - form: ग्रामस्य
    lemma: ग्राम
    gloss: 'of the village'
    notes:
    - term: पुंलिङ्ग
      en: 'masculine'
    - term: एकवचन
      en: 'singular'
    - term: सम्बन्ध
      en: 'whose people'
    - term: षष्ठी
      en: 'genitive — अ + ङस् → स्य'
  - form: जनाः
    lemma: जन
    gloss: 'people'
    notes:
    - term: पुंलिङ्ग
      en: 'masculine'
    - term: बहुवचन
      en: 'plural'
    - term: कर्तृ
      en: 'the bathers'
    - term: प्रथमा
      en: 'nominative plural'
  - form: द्वयोः
    lemma: द्वि
    gloss: 'two'
    notes:
    - term: संख्या
      en: 'numeral'
    - term: स्त्रीलिङ्ग
      en: 'feminine, with नद्योः'
    - term: सप्तमी
      en: 'locative dual — द्वि becomes द्व, then ए before ओस्'
  - form: नद्योः
    lemma: नदी
    gloss: 'in the rivers'
    notes:
    - term: स्त्रीलिङ्ग
      en: 'नदी is feminine'
    - term: द्विवचन
      en: 'dual — the village sits between two rivers'
    - term: अधिकरण
      en: 'where they bathe'
    - term: सप्तमी
      en: 'locative dual — ई becomes य् before ओस्: नद्योः'
  - form: स्नान्ति
    lemma: स्ना
    gloss: 'bathe'
    notes:
    - term: लट्
      en: 'present, 3rd person plural — स्ना is अदादि, no vowel between root and ending'
  - form: उभाभ्याम्
    lemma: उभ
    gloss: 'both'
    notes:
    - term: विशेषण
      en: 'उभ "both" — a सर्वादि word, dual only, qualifying नदीभ्याम्'
    - term: स्त्रीलिङ्ग
      en: 'feminine, with नदीभ्याम्'
    - term: द्विवचन
      en: 'dual'
    - term: अपादान
      en: 'with नदीभ्याम्'
    - term: पञ्चमी
      en: 'ablative dual, agreeing with नदीभ्याम्'
  - form: नदीभ्याम्
    lemma: नदी
    gloss: 'from the rivers'
    notes:
    - term: स्त्रीलिङ्ग
      en: 'feminine'
    - term: द्विवचन
      en: 'dual'
    - term: अपादान
      en: 'where the water is taken from'
    - term: पञ्चमी
      en: 'ablative dual — भ्याम् on the bare stem नदी'
  - form: च
    lemma: च
    gloss: 'and'
    notes:
    - term: अव्यय
      en: 'joins the two clauses'
  - form: जलम्
