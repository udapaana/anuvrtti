    gloss: 'water'
    notes:
    - term: नपुंसकलिङ्ग
      en: 'neuter'
    - term: एकवचन
      en: 'singular'
    - term: कर्मन्
      en: 'what is brought'
    - term: द्वितीया
      en: 'accusative'
  - form: आनयन्ति
    lemma: नी
    gloss: 'bring'
    notes:
    - term: 'आङ्'
      en: 'preverb आ — आनयन्ति is आ + नी'
    - term: लट्
      en: 'present, 3rd person plural, with the preverb आ — "lead hither", bring'
