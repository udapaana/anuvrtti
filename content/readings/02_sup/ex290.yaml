  sentence: 'उत्सवे राजा सर्वान् वदति — हे बालाः, हे कन्याः, हे मुनयः, हे गुरवः, हे भ्रातरः, हे मातरः, हे राजानः, हे नार्यः, सुखेन वसत।'
