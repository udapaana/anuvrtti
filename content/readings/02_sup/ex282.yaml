- id: ex282
  kind: graded
  segment: 176
  order: 1
  sentence: 'देवदत्तः वदति — मित्र, ह्यः त्वम् कुत्र अगच्छः? अहम् त्वाम् ग्रामे न अपश्यम्, त्वम् अपि माम् न अपश्यः। यज्ञदत्तः वदति — अहम् मम पितुः गृहम् अगच्छम्। पिता मह्यम् फलानि अयच्छत्, मया सह उद्याने अक्रीडत् च। देवदत्तः वदति — तव पिता त्वयि स्निह्यति, मयि अपि। अहम् अपि तुभ्यम् फलम् यच्छामि। किम् त्वम् मत् बिभेषि? यज्ञदत्तः हसति — अहम् त्वत् न बिभेमि। त्वया सह अहम् सदा क्रीडामि।'
  translation: 'Devadatta says: "Friend, where did you go yesterday? I did not see you in the village, and you did not see me." Yajñadatta says: "I went to my father''s house. Father gave me fruit and played with me in the garden." Devadatta says: "Your father is fond of you — and of me too. I will give you a fruit as well. Are you afraid of me?" Yajñadatta laughs: "I am not afraid of you. I always play with you."'
  teaches: 'अहम् and त्वम् through every case of the singular, and the imperfect in the first and second person — अगच्छम्, अगच्छः, अपश्यम्, अपश्यः.'
