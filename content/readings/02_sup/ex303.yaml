- id: ex303
  kind: graded
  segment: 182
  order: 2
  sentence: 'गावौ नद्याम् जलम् पिबतः। गोपालः गवोः शृङ्गयोः मालाम् बध्नाति। सः गोभ्यः तृणम्, धेनुभ्याम् च जलम् आनयति। गवा सह वत्सः धावति। वत्साः धेनुभ्यः दूरम् न गच्छन्ति। धेन्वाम् वत्सः स्निह्यति, गोषु च गोपालः। सायम् सः गावौ वदति — शीघ्रम् आगच्छतम्।'
  translation: 'Two bulls drink water in the river. Gopāla ties a garland on the two bulls'' horns. He brings grass for the cattle and water for the two cows. The calf runs with the cow. The calves do not go far from the cows. The calf loves the cow, and Gopāla the cattle. In the evening he tells the two bulls: "Come quickly!"'
  teaches: 'More of गो and धेनु — गावौ (nom. du.), गवोः, गोभ्यः, गवा, गोषु; धेनुभ्याम्, धेनुभ्यः, धेन्वाम्.'
