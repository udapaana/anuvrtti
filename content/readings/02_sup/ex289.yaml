      en: pronoun
    - term: सम्बन्ध
      en: relation
    - term: षष्ठी
      en: genitive dual
  - form: नेत्रयोः
    lemma: नेत्र
    gloss: in the eyes
    notes:
    - term: अधिकरण
      en: where — locative dual
    - term: सप्तमी
      en: locative dual
  - form: अञ्जनम्
    lemma: अञ्जन
    gloss: collyrium
    notes:
