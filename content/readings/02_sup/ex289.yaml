- id: ex289
  kind: graded
  segment: 178
  order: 3
  sentence: 'कन्ययोः आगमनेन पित्रोः हर्षः अभवत्। राजा कन्ययोः बाह्वोः कङ्कणे बध्नाति। माता तयोः नेत्रयोः अञ्जनम् योजयति। द्वयोः रात्र्योः मध्ये नगरे उत्सवः भवति। नद्योः तीरयोः जनाः नृत्यन्ति। उत्सवे द्वौ राजानौ आगच्छतः। राज्ञोः मनसोः मैत्री वर्धते।'
  translation: 'At the girls'' return the parents rejoiced. The king fastens bracelets on the girls'' arms. The mother puts collyrium in their eyes. Between two nights there is a festival in the city. On the banks of the two rivers people dance. Two kings come to the festival. In the two kings'' minds friendship grows.'
  teaches: 'The -ओः dual, genitive and locative — कन्ययोः, पित्रोः, बाह्वोः, नेत्रयोः, रात्र्योः, नद्योः, तीरयोः, राज्ञोः, मनसोः.'
