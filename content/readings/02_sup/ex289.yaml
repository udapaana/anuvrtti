- id: ex289
  kind: graded
  segment: 178
  order: 3
  sentence: कन्ययोः आगमनेन पित्रोः हर्षः भवति। राजा कन्ययोः बाह्वोः कङ्कणे बध्नाति। माता तयोः नेत्रयोः अञ्जनम् योजयति। नगरे उत्सवः भवति, जनाः च नृत्यन्ति।
  translation: At the girls' return the parents rejoice. The king fastens bracelets on the girls' arms. The mother puts collyrium in their eyes. There is a festival in the city, and people dance.
  teaches: The -ओः dual, genitive and locative — कन्ययोः, पित्रोः, तयोः; बाह्वोः, नेत्रयोः.
  words:
  - form: कन्ययोः
    lemma: कन्या
    gloss: the girls'
    notes:
    - term: सम्बन्ध
      en: whose return — genitive dual
    - term: षष्ठी
      en: genitive dual
  - form: आगमनेन
    lemma: आगमन
    gloss: at the return
    notes:
    - term: करण
      en: instrumental of cause — the parents' joy comes through the girls' return
    - term: तृतीया
      en: instrumental
  - form: पित्रोः
    lemma: पितृ
    gloss: the parents'
    notes:
    - term: सम्बन्ध
      en: whose joy — ऋ → र् before ओस्
    - term: षष्ठी
      en: genitive dual
  - form: हर्षः
    lemma: हर्ष
    gloss: joy
    notes:
    - term: कर्तृ
      en: subject of अभवत् — अ-stem masculine, nom. sg in -अः
    - term: प्रथमा
      en: nominative
  - form: भवति
    lemma: भू
    gloss: arises
    notes:
    - term: लट्
      en: present
  - form: राजा
    lemma: राजन्
    gloss: the king
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: बाह्वोः
    lemma: बाहु
    gloss: on the arms
    notes:
    - term: अधिकरण
      en: where — उ → व् before ओस्
    - term: सप्तमी
      en: locative dual
  - form: कङ्कणे
    lemma: कङ्कण
    gloss: bracelets
    notes:
    - term: कर्मन्
      en: object
    - term: द्वितीया
      en: 'neuter dual in -ए: one bracelet for each of the two arms'
  - form: बध्नाति
    lemma: बन्ध्
    gloss: fastens
    notes:
    - term: लट्
      en: present (बन्ध् is क्र्यादि)
  - form: माता
    lemma: मातृ
    gloss: the mother
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: तयोः
    lemma: तद्
    gloss: their (of the two)
    notes:
