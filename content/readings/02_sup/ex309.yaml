- id: ex309
  kind: graded
  segment: 184
  order: 1
  sentence: 'यौ भ्रातरौ परस्परम् स्निह्यतः, तयोः लक्ष्मीः वसति। ये कन्ये गुरुः पाठयति, ते विदुष्यौ भवतः। यान् जनान् त्वम् रक्षसि, तान् देवाः रक्षन्ति। येन धर्मः आचर्यते, तेन सुखम् लभ्यते। याभ्याम् हस्ताभ्याम् दानम् दीयते, ताभ्याम् एव पुण्यम् अर्ज्यते। यैः सत्यम् उच्यते, तैः लोकः जीयते। यस्मै दानम् दीयते, सः सुखी भवति।'
  translation: 'The two brothers who love each other — in them Lakṣmī dwells. The two girls whom the teacher instructs become learned. The people you protect, the gods protect. By whom dharma is practised, by him happiness is gained. The two hands by which a gift is given — by those alone merit is earned. By whom the truth is spoken, by them the world is won. He to whom a gift is given becomes happy.'
  teaches: 'यद् … तद् correlatives, the way relative pronouns live in Sanskrit — यौ/तयोः, ये, यान्, येन, याभ्याम्/ताभ्याम्, यैः, यस्मै — mostly with passive verbs.'
