  order: 11
  sentence: 'राजा रक्षकान् वदति — हे वीराः, चोराः युष्मत् बिभ्यति।'
  translation: 'The king says to his guards: "Brave men, the thieves are afraid of you."'
  teaches: 'The ablative plural of त्वम् — युष्मत्, "of you" — with भी, which puts what is feared in the ablative (1.4.25).'
