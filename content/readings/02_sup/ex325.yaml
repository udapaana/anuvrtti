- id: ex325
  kind: graded
  segment: 184
  order: 2
  sentence: 'कति शिष्याः अत्र सन्ति? गुरुः शिष्यान् द्विधा विभजति। सः पञ्चकृत्वः पाठम् वदति। यत्र गुरुः वसति, तत्र जनता आगच्छति। कदा सा न आगच्छति? सा सर्वदा आगच्छति। सर्वथा गुरोः महिमा महान्। ज्ञानम् धनात् गरीयः।'
  translation: 'How many pupils are here? The teacher divides the pupils in two. He says the lesson five times. Where the teacher lives, there the people come. When do they not come? They always come. In every way the teacher''s greatness is great. Knowledge is weightier than wealth.'
  teaches: 'The adverb-making and numeral तद्धितs — डति (कति), त्रल् (अत्र, यत्र, तत्र), धा (द्विधा), कृत्वसुच् (पञ्चकृत्वः), दा (कदा, सर्वदा), था (सर्वथा) — with तल् of the collective (जनता), इमनिच् (महिमा) and ईयसुन् (गरीयः).'
  words:
