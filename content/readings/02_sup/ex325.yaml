- id: ex325
  kind: graded
  segment: 184
  order: 2
  sentence: 'अतिथिः गुरोः शिष्यम् पृच्छति — कति शिष्याः अत्र सन्ति? शिष्यः वदति — बहवः; अतः गुरुः शिष्यान् द्विधा विभजति। सः पञ्चकृत्वः पाठम् वदति, यतः जनता अपि आगच्छति। अतिथिः पृच्छति — जनता कदा आगच्छति? शिष्यः वदति — सर्वदा; यत्र गुरुः वसति, तत्र जनता आगच्छति। अतिथिः वदति — सर्वथा गुरोः महिमा प्रसिद्धः; ज्ञानम् धनात् गरीयः।'
  translation: 'A visitor asks the teacher''s pupil: "How many pupils are here?" The pupil says: "Many; so the teacher divides the pupils into two groups. He says each lesson five times, because the people come too." The visitor asks: "When do the people come?" The pupil says: "Always; where the teacher lives, there the people come." The visitor says: "In every way the teacher''s greatness is renowned; knowledge is weightier than wealth."'
  teaches: 'The adverb-making and numeral तद्धितs — डति (कति), त्रल् (अत्र, यत्र, तत्र), धा (द्विधा), कृत्वसुच् (पञ्चकृत्वः), दा (कदा, सर्वदा), था (सर्वथा) — with तल् of the collective (जनता), इमनिच् (महिमा) and ईयसुन् (गरीयः).'
