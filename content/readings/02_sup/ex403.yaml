  sentence: 'गुरुः शिष्यौ वदति — मम विश्वासः युवयोः अस्ति। शिष्यौ वदतः — आवयोः सदा दयाम् कुरु।'
  translation: 'The teacher says to his two pupils: "My trust is in you two." The pupils say: "Be kind to us two always."'
  teaches: 'The locative dual of त्वम् and अहम् — युवयोः, आवयोः — the locative of the person trust or kindness rests on.'
