- id: ex341
  kind: graded
  segment: 184
  order: 3
  sentence: 'औदुम्बरः नाम देशः। तत्र प्राज्ञः एकः कृषकः वसति। सः प्रातः अद्भ्यः नमः करोति, यतः अद्भिः क्षेत्राणि वर्धन्ते।'
  translation: 'There is a country called Audumbara. A wise farmer lives there. In the morning he bows to the waters, because the fields grow by the waters.'
  teaches: 'Two senses of अण् the corpus had not shown: चातुरर्थिक — औदुम्बरः, "the land where the उदुम्बर grows" — and स्वार्थ, where the derivative means what its base means — प्राज्ञः from प्रज्ञ. And अद्भ्यः, the dative of अप्.'
