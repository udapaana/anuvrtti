    - term: अण्
      en: 'the अण् suffix'
    - term: चातुरर्थिक
      en: 'sense: चातुरर्थिक'
    - cite: "4.2.67"
      role: 'तदस्मिन्नस्तीति देशे तन्नाम्नि — उदुम्बर + अण् → औदुम्बर, "the land of fig trees"'
