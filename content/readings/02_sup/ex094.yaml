- id: ex094
  segment: 130
  sentence: देवः देवौ देवाः। देवम् देवौ देवान्। देवेन देवाभ्याम् देवैः। देवाय देवाभ्याम् देवेभ्यः। देवात् देवाभ्याम् देवेभ्यः। देवस्य देवयोः देवानाम्। देवे देवयोः देवेषु। हे देव हे देवौ हे देवाः॥
  translation: The complete declension of देव "god" (a-stem masculine) — eight cases × three numbers.
  teaches: 'the whole अकारान्त पुंलिङ्ग paradigm — देव in every case and number, with the सूत्र behind each ending'
  words:
  - form: देवः
    gloss: 'प्रथमा एक — nom. sg. (सु → visarga)'
    notes:
    - term: प्रथमा
      en: nominative singular
    - cite: '4.1.2'
      role: स्वौजस्… — सु, the nom. sg. सुप् affix
    - cite: '8.2.66'
      role: ससजुषो रुः — final स् → रु → visarga → देवः
  - form: देवौ
    gloss: 'प्रथमा द्वि — nom. dual (औ)'
    notes:
    - term: द्विवचन
      en: dual
    - cite: '6.1.102'
      role: प्रथमयोः पूर्वसवर्णः — अ + औ (the dual ending) → औ → देवौ
  - form: देवाः
    gloss: 'प्रथमा बहु — nom. pl. (जस् → आः)'
    notes:
    - term: बहुवचन
      en: plural
    - cite: '6.1.102'
      role: प्रथमयोः पूर्वसवर्णः — अ + जस् (अस्) → आः → देवाः
  - form: देवम्
    gloss: 'द्वितीया एक — acc. sg. (अम्)'
    notes:
    - term: द्वितीया
      en: accusative singular
    - cite: '6.1.107'
      role: अमि पूर्वः — अ + अम् → अम् → देवम्
  - form: देवौ
    gloss: 'द्वितीया द्वि — acc. dual (= nom. dual)'
    notes:
    - text: acc. dual = nom. dual (औट् → औ), one form देवौ
  - form: देवान्
    gloss: 'द्वितीया बहु — acc. pl. (शस् → आन्)'
    notes:
    - cite: '6.1.103'
      role: तस्माच्छसो नः पुंसि — masc. शस् → आन् → देवान्
  - form: देवेन
    gloss: 'तृतीया एक — instr. sg. (टा → इन)'
    notes:
    - term: तृतीया
      en: instrumental singular
    - cite: '7.1.12'
      role: टाङसिङसामिनात्स्याः — a-stem टा → इन → देवेन
  - form: देवाभ्याम्
    gloss: 'तृ/च/पं द्वि — instr/dat/abl dual (भ्याम्); ONE form for all three'
    notes:
    - cite: '7.3.102'
      role: सुपि च — अ → आ before भ्याम् → देवाभ्याम् (covers तृतीया/चतुर्थी/पञ्चमी dual)
  - form: देवैः
    gloss: 'तृतीया बहु — instr. pl. (भिस् → ऐस्)'
    notes:
    - cite: '7.1.9'
      role: अतो भिस ऐस् — a-stem भिस् → ऐस् → देवैः
  - form: देवाय
    gloss: 'चतुर्थी एक — dat. sg. (ङे → य)'
    notes:
    - term: चतुर्थी
      en: dative singular
    - cite: '7.1.13'
      role: ङेर्यः — a-stem ङे → य; + सुपि च (अ→आ) → देवाय
  - form: देवेभ्यः
    gloss: 'च/पं बहु — dat/abl pl. (भ्यस्); ONE form for both'
    notes:
    - cite: '7.3.103'
      role: बहुवचने झल्येत् — अ → ए before भ्यस् → देवेभ्यः (covers चतुर्थी/पञ्चमी pl.)
  - form: देवात्
    gloss: 'पञ्चमी एक — abl. sg. (ङसि → आत्)'
    notes:
    - term: पञ्चमी
      en: ablative singular
    - cite: '7.1.12'
      role: टाङसिङसामिनात्स्याः — a-stem ङसि → आत् → देवात्
  - form: देवस्य
    gloss: 'षष्ठी एक — gen. sg. (ङस् → स्य)'
    notes:
    - term: षष्ठी
      en: genitive singular
    - cite: '7.1.12'
      role: टाङसिङसामिनात्स्याः — a-stem ङस् → स्य → देवस्य
  - form: देवयोः
    gloss: 'ष/स द्वि — gen/loc dual (ओस्); ONE form for both'
    notes:
    - cite: '7.3.104'
      role: ओसि च — अ → ए before ओस् → देवयोः (covers षष्ठी/सप्तमी dual)
  - form: देवानाम्
    gloss: 'षष्ठी बहु — gen. pl. (आम् → नाम्)'
    notes:
    - cite: '7.1.54'
      role: ह्रस्वनद्यापो नुट् — आम् takes नुट् → नाम्
    - cite: '6.4.3'
      role: नामि — vowel lengthens before नाम् → देवानाम्
  - form: देवे
    gloss: 'सप्तमी एक — loc. sg. (ङि → ए)'
    notes:
    - term: सप्तमी
      en: locative singular
    - cite: '7.1.13'
      role: ङेर्यः / अ + ङि — the अ-stem locative singular → देवे
  - form: देवेषु
    gloss: 'सप्तमी बहु — loc. pl. (सुप् → सु; स → ष)'
    notes:
    - cite: '7.3.104'
      role: ओसि च / अ → ए before the plural locative ending → देवेषु
    - cite: '8.3.59'
      role: आदेशप्रत्ययोः — स् → ष् after the इण् ए → देवेषु
  - form: हे देव
    gloss: 'सम्बोधन एक — voc. sg. (bare stem)'
    notes:
    - term: सम्बोधन
      en: vocative singular
    - cite: '2.3.47'
      role: सम्बोधने च — the vocative; sg. is the bare stem → हे देव
  vyakhya: |
    अकारान्तस्य पुंलिङ्गस्य (देव) सर्वाः विभक्तयः सर्वाणि वचनानि च — एकत्र दर्शिताः। एकैकं सूत्रं प्रत्येकं प्रत्ययम् आदेशं च साधयति।
  vyakhya_en: |
    You met प्रथमा through सप्तमी one cell at a time (ex001–ex013). Here is the WHOLE a-stem masculine paradigm of देव in one place — the reference table the readings were building toward. Read down each column for a number (sg · dual · pl), across each row for a case. Note the economies Pāṇini builds in: the dual collapses three oblique cases into देवाभ्याम् and two more into देवयोः; the plural shares देवेभ्यः for dative and ablative. Every other a-stem masculine — नर, राम, बाल, पुत्र, अश्व — declines exactly thus; learn देव and you hold them all. Each cell names the sūtra that shapes its ending, so the table doubles as an index into the अङ्ग-operations of adhyāyas 6–7.
