- id: ex283
  kind: graded
  segment: 176
  order: 2
  sentence: 'देवदत्तः यज्ञदत्तः च नदीम् अगच्छताम्। तत्र बालाः तौ अपश्यन्, अवदन् च — युवाम् कुत्र अगच्छतम्? युवयोः गृहम् कुत्र? मित्रे अवदताम् — आवाम् नदीम् अगच्छाव। आवयोः गृहम् समीपे एव। आवाभ्याम् सह आगच्छत।'
  translation: 'Devadatta and Yajñadatta went to the river. There some boys saw the two of them and said: "Where did you two go? Where is your house?" The two friends said: "We two went to the river. Our house is close by. Come with us two."'
  teaches: 'The dual of अहम् and त्वम् — आवाम्, आवयोः, आवाभ्याम्, युवाम्, युवयोः — and the imperfect dual in all three persons.'
