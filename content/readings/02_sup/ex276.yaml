- id: ex276
  kind: graded
  segment: 170
  order: 1
  sentence: 'उद्याने एका लता अस्ति। बाला प्रतिदिनम् लताम् सिञ्चति, लतायै जलम् च आनयति। लतया उद्यानम् शोभते। लतायाम् भ्रमरः वसति, लतायाः पुष्पाणि च पश्यति। बाला वदति — हे लते, शीघ्रम् वर्धस्व।'
  translation: 'In the garden there is a creeper. Every day a girl waters the creeper and brings water for it. The garden is lovely with the creeper. A bee lives on the creeper and looks at its flowers. The girl says: "O creeper, grow quickly!"'
  teaches: 'लता (आ-stem feminine) through the singular — लताम्, लतया, लतायै, लतायाः, लतायाम्, हे लते.'
