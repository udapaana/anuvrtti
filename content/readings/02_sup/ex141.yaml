- id: ex141
  segment: 150
  sentence: पितरः आगच्छन्ति।
  translation: The fathers come.
  teaches: 'ऋ-stem strong plural पितरः — गुण अर् in the nom.pl (vs sg पिता with vṛddhi), closing the ऋ-paradigm'
  words:
  - form: पितरः
    lemma: पितृ
    gloss: the fathers
    notes:
    - term: कर्तृ
      en: agent (plural)
    - text: 'पितृ nom.PL: the ऋ → गुण अर् before the strong ending → पितर् + अस् → पितरः'
    - cite: '7.3.110'
      role: ऋतो ङिसर्वनामस्थानयोः — ऋ takes गुण (अर्) in सर्वनामस्थान cells → पितर्
    - cite: '1.4.21'
      role: बहुषु बहुवचनम् → plural → पितरः
    - term: प्रथमा
      en: nominative plural (strong)
  - form: आगच्छन्ति
    lemma: गम्
    gloss: come
    notes:
    - term: गम्
      en: '"come" (आ + गम्)'
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present plural
  vyakhya: ऋदन्तस्य सर्वनामस्थाने गुणः। पितृ + अस् → पितरः। (एकवचने वृद्धिः — पिता।)
  vyakhya_en: |
    You met पिता (nom.sg, with vṛddhi आ → पिता) and पितरम् (acc., गुण अर्) in ex043–044. Here is the nominative PLURAL: पितरः, गुण अर् + the plural ending अस् (7.3.110). So the ऋ-stem grades its strength by cell — vṛddhi in the nom.sg (पिता), गुण elsewhere-strong (पितरम्, पितरः), plain ऋ in the weak cells (पितृभिः). The kinship and agent nouns (मातृ, भ्रातृ, कर्तृ, दातृ) all follow.
