- id: ex278
  kind: graded
  segment: 171
  order: 1
  sentence: 'आश्रमे एकः गुरुः वसति। शिष्यः प्रातः गुरुम् नमति, गुरवे फलानि च यच्छति। गुरुणा सह सः नदीम् गच्छति। शिष्यः गुरोः विद्याम् लभते। गुरौ तस्य भक्तिः अस्ति। सः वदति — हे गुरो, तुभ्यम् नमः।'
  translation: 'In a hermitage lives a teacher. In the morning the pupil bows to the teacher and gives the teacher fruit. With the teacher he goes to the river. The pupil gains knowledge from the teacher. He has devotion toward the teacher. He says: "O teacher, homage to you."'
  teaches: 'गुरु (उ-stem masculine) through the singular — the गुण in गुरवे, गुरोः, गुरो, and गुरौ.'
