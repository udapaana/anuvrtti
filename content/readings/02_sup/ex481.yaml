- id: ex481
  kind: graded
  segment: 150
  order: 21
  sentence: 'नगरस्य धनम् वणिक्षु तिष्ठति।'
  translation: 'The wealth of a city rests with its merchants.'
  teaches: 'the ज्-stem वणिज् in the locative plural, वणिक्षु — ज् becomes क् before सु, and स् becomes ष्'
  words:
  - form: नगरस्य
    lemma: नगर
    gloss: 'of the city'
    notes:
    - term: नपुंसकलिङ्ग
      en: 'neuter'
    - term: सम्बन्ध
      en: 'whose wealth'
    - term: षष्ठी
      en: 'genitive'
  - form: धनम्
    lemma: धन
    gloss: 'wealth'
    notes:
    - term: नपुंसकलिङ्ग
      en: 'neuter'
    - term: कर्तृ
      en: 'subject of तिष्ठति'
    - term: प्रथमा
      en: 'nominative — neuter अ-stem, same as the accusative'
  - form: वणिक्षु
    lemma: वणिज्
    gloss: 'in the merchants'
    notes:
    - term: बहुवचन
      en: 'plural'
    - term: पुंलिङ्ग
      en: 'masculine'
    - term: अधिकरण
      en: 'where the wealth rests'
    - term: सप्तमी
      en: 'locative plural — वणिज् + सु: ज् → क्, then सु → षु after क्'
  - form: तिष्ठति
    lemma: स्था
    gloss: 'rests, stands'
    notes:
    - term: लट्
      en: 'present — स्था takes the stem तिष्ठ before शप्'
