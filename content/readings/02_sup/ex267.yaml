- id: ex267
  kind: graded
  segment: 168
  sentence: 'राजा नगरम् शास्ति। जनाः राजानम् पश्यन्ति, राज्ञा सुखम् लभन्ते, राज्ञे नमन्ति च। बालः राज्ञः बिभेति। सर्वे राज्ञः आज्ञाम् रक्षन्ति। राज्ञि धर्मः तिष्ठति। हे राजन्।'
  translation: 'A king rules the city. The people see the king, gain happiness through the king, and bow to the king. A boy fears the king. All keep the king''s command. In the king dharma stands firm. O king!'
  teaches: 'राजन् (consonant stem) through all eight cases — the strong stem राजान् (राजा, राजानम्) against the weak राज्ञ् (राज्ञा, राज्ञे, राज्ञः, राज्ञि); and राज्ञः is both पञ्चमी and षष्ठी.'
  words:
  - form: राजा
    lemma: राजन्
    gloss: 'a king'
    notes:
    - term: कर्तृ
      en: 'agent — the one who rules'
    - term: प्रथमा
      en: 'nominative — the strong stem, न् lost (राजन् → राजा)'
  - form: नगरम्
    lemma: नगर
    gloss: 'the city'
    notes:
    - term: कर्मन्
      en: 'the one ruled'
    - term: द्वितीया
      en: 'accusative (neuter)'
  - form: शास्ति
    lemma: शास्
    gloss: 'rules'
    notes:
    - term: लट्
      en: 'present (शास् is अदादि — no शप्: शास्ति)'
  - form: जनाः
    lemma: जन
    gloss: 'the people'
    notes:
    - term: कर्तृ
