- id: ex044
  segment: 150
  sentence: सः पितरम् पश्यति।
  translation: He sees the father.
  teaches: 'the ऋ-stem strong stem पितर् — ऋ takes गुण (अर्) in the strong cases'
  words:
  - form: सः
    lemma: तद्
    gloss: he
    notes:
    - term: सर्वनाम
      en: pronoun (तद्)
    - term: प्रथमा
      en: nominative
  - form: पितरम्
    gloss: the father (object)
    notes:
    - term: कर्मन्
      en: object
    - term: द्वितीया
      en: accusative
    - cite: '2.3.2'
      role: कर्मणि द्वितीया → the object पितृ takes द्वितीया
    - term: गुण
      en: the grade अर् (ऋ → अर्)
    - cite: '7.3.110'
      role: ऋतो ङिसर्वनामस्थानयोः — the ऋ-stem takes गुण (अर्) in the strong cases; पितृ → पितर्
    - text: 'पितर् + अम् → पितरम्'
  - form: पश्यति
    lemma: दृश्
    gloss: sees
    notes:
    - term: दृश्
      en: '"see"'
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  vyakhya: सर्वनामस्थाने ऋतः गुणः। पितृ → पितर् → पितरम्।
  vyakhya_en: |
    In the strong cases the ऋ rises to its गुण grade अर्: पितृ → पितर्, giving पितरम् for the accusative. This is the same गुण principle as the इ-stem's अग्नये — इ→ए there, ऋ→अर् here. One rule of strengthening, each vowel-class to its own grade.

# ── Segment 17: सर्वनाम — the pronouns (तद् "that/he/she/it") ────────────
# Pronouns decline a little differently from nouns (their own class, सर्वनाम)
# and appear in nearly every sentence. तद् is the model; here its प्रथमा and
# the special dative तस्मै.
