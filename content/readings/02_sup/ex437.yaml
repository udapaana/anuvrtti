  order: 14
  sentence: 'वृद्धः वदति — दीर्घात् मार्गात् मम उभयोः जङ्घयोः वेदना अस्ति।'
  translation: 'The old man says: "After the long road both my legs ache."'
  teaches: 'जङ्घयोः — the locative dual of an आ-stem feminine: the आ becomes ए before ओस्; उभयोः agrees with it.'
