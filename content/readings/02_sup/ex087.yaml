- id: ex087
  segment: 120
  sentence: पिता ग्रामात् आगच्छति।
  translation: Father comes home from the village.
  teaches: अपादान/पञ्चमी singular — ङसि → आत् after the a-stem → ग्रामात्
  words:
  - form: पिता
    lemma: पितृ
    gloss: father
    notes:
    - term: पुंलिङ्ग
      en: masculine
    - term: कर्तृ
      en: agent — the one who comes
    - term: प्रथमा
      en: nominative — ऋ-stem पितृ → पिता
  - form: ग्रामात्
    lemma: ग्राम
    gloss: from the village
    notes:
    - term: अपादान
      en: the fixed point from which departure happens
    - cite: 1.4.24
      role: ध्रुवमपायेऽपादानम् — the fixed point one moves away from is अपादान
    - cite: 2.3.28
      role: अपादाने पञ्चमी — the अपादान takes पञ्चमी
    - cite: 7.1.12
      role: टाङसिङसामिनात्स्याः — after an a-stem ङसि → आत् → ग्रामात्
    - term: पञ्चमी
      en: ablative
  - form: आगच्छति
    lemma: गम्
    gloss: comes, approaches
    notes:
    - term: 'आङ्'
      en: 'preverb आ — आगच्छति is आ + गम्'
    - term: गम्
      en: आ + गम् "come"
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  vyakhya: ग्रामो ध्रुवम् अपायस्य, ततः पितुः आगमनम्। अतः ग्रामात् इति अपादाने पञ्चमी; अकारान्तत्वात् ङसेः आत्।
  vyakhya_en: 'The village is the fixed point the father moves away from, so it is अपादान (1.4.24), expressed by the पञ्चमी (2.3.28). Because the stem ends in अ, the ablative ending ङसि becomes आत् (7.1.12) → ग्रामात् "from the village."

    '
