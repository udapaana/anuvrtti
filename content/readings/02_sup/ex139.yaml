- id: ex139
  segment: 150
  sentence: दण्डी गच्छति।
  translation: The staff-bearer goes.
  teaches: 'इन्-stem strong nom.sg दण्डी — the न् of the stem drops, the इ lengthens (न-lopa)'
  words:
  - form: दण्डी
    lemma: दण्डिन्
    gloss: the staff-bearer, one who holds a staff
    notes:
    - term: कर्तृ
      en: agent
    - text: 'दण्डिन् is an इन्-stem (दण्ड + इन्, "possessing a staff")'
    - cite: '8.2.7'
      role: नलोपः प्रातिपदिकान्तस्य — final न् of the nominal stem drops → दण्डि
    - cite: '6.4.13'
      role: 'सौ च — the इन्-stem lengthens before the strong nom.sg ending, and the न् drops → दण्डी'
    - term: प्रथमा
      en: nominative singular
  - form: गच्छति
    lemma: गम्
    gloss: goes
    notes:
    - term: गम्
      en: '"go"'
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  vyakhya: इन्नन्तस्य प्रातिपदिकस्य नलोपः; दीर्घः। दण्डिन् → दण्डी।
  vyakhya_en: |
    इन्-stems (दण्डिन् "staff-bearer," ज्ञानिन् "knower," योगिन् "yogi") build agent/possessor nouns. In the nominative singular the stem-final न् drops (8.2.7, नलोपः प्रातिपदिकान्तस्य) and the इ lengthens → दण्डी. So the dictionary stem दण्डिन् surfaces as दण्डी "the staff-bearer." Compare योगी, ज्ञानी, स्वामी — all the same shape.
