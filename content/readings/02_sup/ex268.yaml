- id: ex268
  kind: graded
  segment: 169
  sentence: 'अग्निः ज्वलति। जनाः अग्निम् पूजयन्ति, अग्निना पचन्ति, अग्नये नमन्ति च। बालः अग्नेः बिभेति। जनाः अग्नेः प्रभाम् पश्यन्ति। अग्नौ पतङ्गः पतति। हे अग्ने।'
  translation: 'The fire blazes. The people worship the fire, cook with the fire, and bow to the fire. A boy fears the fire. The people see the fire''s light. Into the fire a moth falls. O fire!'
  teaches: 'अग्नि (इ-stem masculine) through all eight cases — and the गुण in the oblique: the इ becomes ए (अग्नये, अग्नेः) while the instrumental keeps it (अग्निना).'
