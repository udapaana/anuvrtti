  sentence: 'माता आपणम् गच्छति। सा विक्रेतारम् वदति — एतत् फलम् मधुरम्; एतत् क्रीणामि। एताम् मालाम् अपि देहि। विक्रेता वदति — एतम् घटम् अपि पश्य; अयम् नूतनः।'
  translation: 'Mother goes to the market. She says to the seller: "This fruit is sweet; I''ll buy this. Give me this garland too." The seller says: "Look at this pot as well; it is new."'
