  vyakhya: 'एतद् शब्दः समीपस्थम् निर्दिशति। द्वितीयैकवचने पुंसि एतम्, स्त्रियाम् एताम्, नपुंसके एतत्।'
  vyakhya_en: |
    एतद् "this one here" is what a shopper points with. Its accusative singular has three genders: एतम् घटम् (masculine), एताम् मालाम् (feminine), एतत् फलम् (neuter — the same form as the nominative एतत् a clause earlier). विक्रेता "seller" is वि + क्री + तृच्.
