- id: ex342
  kind: graded
  segment: 172
  order: 3
  sentence: वर्षाकाले मेघाः भूमीः सिञ्चन्ति। भूमिषु शस्यम् वर्धते, भूमीनाम् फलेन च जनाः जीवन्ति।
  translation: In the rainy season the clouds water the fields. In the fields the crop grows, and people live by the fruit of the fields.
  teaches: भूमि in the plural — भूमीः (accusative, lengthened -ईः), भूमिषु, भूमीनाम् (with नुट् and the long ई).
  words:
  - form: वर्षाकाले
    lemma: वर्षाकाल
    gloss: in the rainy season
    notes:
    - term: अधिकरण
      en: when
    - term: सप्तमी
      en: locative of time — "in the rains-season", अ-stem in -ए
  - form: मेघाः
    lemma: मेघ
    gloss: the clouds
    notes:
    - term: कर्तृ
      en: subject of सिञ्चन्ति — the clouds water the land; अ-stem masc. nom. pl -आः
    - term: प्रथमा
      en: nominative plural
  - form: भूमीः
    lemma: भूमि
    gloss: the fields
    notes:
    - term: कर्मन्
      en: what is watered — the feminine accusative plural in -ईः
    - term: द्वितीया
      en: accusative plural
  - form: सिञ्चन्ति
    lemma: सिच्
    gloss: water
    notes:
    - term: लट्
      en: present
  - form: भूमिषु
    lemma: भूमि
    gloss: in the fields
    notes:
