- id: ex292
  kind: graded
  segment: 179
  order: 1
  sentence: उत्सवे राजा मुनिभ्यः धेनूः यच्छति, नारीभ्यः वस्त्राणि, अतिथिभ्यः राजभ्यः रत्नानि च। जनाः पितृभ्यः मातृभ्यः च पिण्डान् यच्छन्ति। बालाः वनेभ्यः पुष्पाणि आनयन्ति, कन्याः च क्षेत्रेभ्यः धान्यम्। शिष्याः गुरुभ्यः मालाः आनयन्ति। गोपाः धेनुभ्यः तृणम् यच्छन्ति।
  translation: At the festival the king gives cows to the sages, clothes to the women, and jewels to the visiting kings. People give offerings to their fathers and mothers. Boys bring flowers from the forests, and girls grain from the fields. Pupils bring garlands to their teachers. Cowherds give grass to the cows.
  teaches: The -भ्यः plural as dative (मुनिभ्यः, नारीभ्यः, अतिथिभ्यः, राजभ्यः, पितृभ्यः, मातृभ्यः, गुरुभ्यः, धेनुभ्यः) and ablative (वनेभ्यः, क्षेत्रेभ्यः).
