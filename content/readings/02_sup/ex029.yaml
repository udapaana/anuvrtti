- id: ex029
  segment: 100
  sentence: अग्निः ज्वलति।
  translation: The fire blazes.
  teaches: 'an इ-stem masculine: nominative अग्निः (नर-like सु, but on an इ-stem)'
  words:
  - form: अग्निः
    gloss: the fire
    notes:
    - cite: "8.2.66"
      role: ससजुषो रुः — the ending स् becomes रु, then visarga → अग्निः
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
    - term: एकवचन
      en: singular
    - text: 'अग्नि + सु → अग्निः'
  - form: ज्वलति
    lemma: ज्वल्
    gloss: blazes
    notes:
    - term: ज्वल्
      en: '"blaze, burn"'
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  vyakhya: इकारान्तं पुंलिङ्गम् अग्निशब्दः। प्रथमायाम् अग्निः, यथा नरः।
  vyakhya_en: |
    अग्नि is a masculine stem ending in इ. In the प्रथमा it takes the same सु that नर did, giving अग्निः — outwardly like नरः. The stem-class shows itself not here but in the oblique cases, where the इ shifts.
