- id: ex295
  kind: graded
  segment: 179
  order: 4
  sentence: सायम् ऋषी कुमारयोः नाम्नोः अर्थम् पृच्छतः। राज्ञ्यौ वदतः — एकः जयः, यतः सः जयति; अपरः विजयः, यतः सः विशेषेण जयति।
  translation: 'In the evening the sages ask the meaning of the princes'' two names. The queens say: "One is Jaya, because he wins; the other Vijaya, because he wins outstandingly."'
  teaches: 'The visit, part 3 — the dual''s -ओः as genitive, twice over: कुमारयोः नाम्नोः "of the princes'' two names"; and a name explained by its root, जयः because जयति.'
