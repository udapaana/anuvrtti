- id: ex295
  kind: graded
  segment: 179
  order: 4
  sentence: 'सायम् ऋषी कुमारयोः नाम्नोः अर्थम् पृच्छतः। राज्ञ्यौ वदतः — एकः जयः, यतः सः जयति; अपरः विजयः, यतः सः विशेषेण जयति। कुमारौ मात्रोः वचनम् शृणुतः, पित्रोः च स्निह्यतः। ऋषेः कन्ये देव्योः स्निह्यतः, कुमारौ अपि नवयोः स्वस्रोः। ऋषी राज्ञोः विश्वसितः, राजानौ अपि मुन्योः वचनम् आदरेण शृणुतः।'
  translation: 'In the evening the sages ask the meaning of the princes'' two names. The queens say: "One is Jaya, because he wins; the other Vijaya, because he wins outstandingly." The princes listen to their two mothers'' words and love their parents. The sage''s daughters grow fond of the two queens, and the princes grow fond of their two new sisters. The sages trust the two kings, and the kings listen with respect to the two sages'' words.'
  teaches: 'The visit, part 3 — the dual''s other oblique form, -ओः, as genitive (नाम्नोः, मात्रोः, मुन्योः) and as the locative of what one loves or trusts (पित्रोः, देव्योः, स्वस्रोः, राज्ञोः) — स्निह् and विश्वस् take the सप्तमी.'
