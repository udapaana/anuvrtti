- id: ex295
  kind: graded
  segment: 179
  order: 4
  sentence: 'मुन्योः आश्रमः गिर्योः अन्तरे अस्ति। नद्योः मत्स्याः वसन्ति। प्रजाः राज्ञोः विश्वसन्ति। कन्ये पित्रोः मात्रोः च स्निह्यतः। जनाः स्वस्रोः गीतम् शृण्वन्ति। शुकः फलयोः रसम् पिबति। बालाः कन्ययोः नाम्नोः अर्थम् पृच्छन्ति।'
  translation: 'The two sages'' hermitage lies between two mountains. Fish live in the two rivers. The subjects trust the two kings. The girls are fond of their parents — father and mother. People listen to the two sisters'' song. A parrot drinks the juice of two fruits. The boys ask the meaning of the two girls'' names.'
  teaches: 'The -ओः dual on the stems still missing it — मुन्योः, गिर्योः, नद्योः, राज्ञोः, पित्रोः, मात्रोः, स्वस्रोः, फलयोः, नाम्नोः.'
