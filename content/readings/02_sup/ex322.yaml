  sentence: 'कतिपयैः दिनैः जानुभ्याम् वेदना अपगच्छति। पितामहः वदति — वाचः शक्तिः महती; वैद्यस्य मधुरा वाक् अपि औषधम्।'
  translation: 'In a few days the pain leaves both knees. Grandfather says: "Great is the power of speech; the doctor''s kind word was medicine too."'
  teaches: 'Mālatī, part 4 — जानुभ्याम् as ablative (the pain leaves the knees), and वाचः as genitive.'
