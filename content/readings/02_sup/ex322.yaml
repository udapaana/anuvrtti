  order: 5
  sentence: 'मालती प्रतिदिनम् पितामहाय मधुराः वाचः वदति। कतिपयैः दिनैः पितामहस्य जानुभ्याम् वेदना अपगच्छति। पितामहः वदति — वाचः शक्तिः महती; मालत्याः मधुरा वाक् अपि औषधम्।'
  translation: 'Every day Mālatī speaks sweet words to her grandfather. In a few days the pain leaves his knees. Grandfather says: "Great is the power of speech; Mālatī''s sweet word was medicine too."'
  teaches: 'Mālatī, part 4 — जानुभ्याम् as ablative (the pain leaves the knees), and वाचः as genitive.'
