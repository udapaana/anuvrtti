- id: ex335
  kind: graded
  segment: 193
  order: 2
  sentence: 'प्रातः मरुतौ हिमवन्तम् प्रति अचलताम्। राजा धनदत्तम् सागरदत्तम् च आह्वयत्, अवदत् च — युवाम् मरुद्भ्याम् सह गच्छतम्। वणिजौ अन्येभ्यः वणिग्भ्यः अन्नम् अक्रीणीताम्। ततः तौ हस्तिनोः उपाविशताम्, उदीचीम् दिशम् अचलताम् च। नद्याः तीरे तौ हस्तिभ्याम् अवातरताम्। तत्र तौ अन्यम् मरुतम् अपश्यताम्, प्रचण्डम् भीमम् च; वणिजौ तस्मात् मरुतः अबिभीताम्। सः अवदत् — अहम् मरुताम् एकः। मम प्रश्नस्य उत्तरम् वदतम्। कति दिशः सन्ति? मरुतः काभिः दिग्भिः वहन्ति? सागरदत्तः अवदत् — दश दिशः सन्ति — चतस्रः मुख्याः, चतस्रः विदिशः, द्वे दिशौ ऊर्ध्वा अधरा च। मरुतः सर्वाभिः दिग्भिः वहन्ति। मरुत् प्रीतः अभवत्। वणिजौ मरुता सह नदीम् अतरताम्।'
  translation: 'In the morning the two winds set off for the Himālaya. The king summoned Dhanadatta and Sāgaradatta and said: "Go with the two winds." The merchants bought provisions from other merchants. Then they mounted two elephants and set off in the northern direction. On a river''s bank they got down from the elephants. There they saw another wind, fierce and terrible; the merchants were afraid of that wind. He said: "I am one of the Maruts. Answer my question. How many directions are there? By which directions do the winds blow?" Sāgaradatta said: "There are ten directions — four chief ones, four in between, and two more, up and down. The winds blow by all the directions." The wind was pleased. The merchants crossed the river with the wind.'
  teaches: 'Part 10 — the wind''s riddle: मरुतम्, मरुता, मरुतः (ablative of fear), मरुताम्, मरुद्भ्याम्; दिशः, दिशौ, दिग्भिः; वणिग्भ्यः (ablative — bought from); हस्तिनोः, हस्तिभ्याम्.'
