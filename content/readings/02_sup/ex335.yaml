- id: ex335
  kind: graded
  segment: 193
  order: 2
  sentence: 'कालेन वणिजौ वृद्धौ अभवताम्। प्रजाः वणिजोः विश्वसन्ति स्म। एकस्य वणिजः पुत्रः विष्णुदत्तः, अपरस्य शिवदत्तः। गुणवतोः पुत्रयोः यशः अपि अवर्धत। पुत्रौ पितृभ्याम् वणिग्भ्याम् धनम् अलभेताम्, अन्येभ्यः वणिग्भ्यः च रत्नानि अक्रीणीताम्। ततः तौ बुद्धिमद्भ्याम् सुहृद्भ्याम् सह यात्राम् अकुरुताम्। पूर्वम् ते हस्तिनोः उपाविशन्, नद्याः तीरे हस्तिभ्याम् अवातरन्। तत्र तौ एकम् मरुतम् अपश्यताम्, अपृच्छताम् च — कति दिशः सन्ति? मरुत् अवदत् — दश दिशः सन्ति। तासु द्वे दिशौ विशेषे — ऊर्ध्वा अधरा च। मरुतः सर्वाभिः दिग्भिः वहन्ति। सूर्यः जगता पूज्यते, विष्णुः जगताम् पतिः। पुत्रौ मरुता सह आकाशम् अपश्यताम्। जनाः तयोः नाम्नोः प्रीतिम् अकुर्वन्। तौ श्रीमद्भ्याम् मरुद्भ्याम् इव जगति अचरताम्।'
  translation: 'In time the two merchants grew old. The people trusted the two merchants. One merchant''s son was Viṣṇudatta, the other''s Śivadatta. The fame of the two worthy sons grew too. The sons received wealth from their merchant fathers, and bought jewels from other merchants. Then they made a journey with two clever friends. At first they sat on two elephants; on the river-bank they climbed down from the elephants. There they saw a wind, and asked: "How many directions are there?" The wind said: "There are ten directions. Among them two directions are special — up and down. The winds blow by every direction." The sun is worshipped by the world; Viṣṇu is the lord of the worlds. The sons looked at the sky with the wind. People came to love those two names. The two roamed the world like the two glorious winds.'
  teaches: 'Part 10 — the sons: वणिजोः (locative), वणिजः (genitive), वणिग्भ्याम् and वणिग्भ्यः (ablative); गुणवतोः, बुद्धिमद्भ्याम्, श्रीमद्भ्याम्; हस्तिनोः, हस्तिभ्याम्; मरुतम्, मरुता; दिशः, दिशौ, दिग्भिः; जगता, जगताम्; नाम्नोः.'
