- id: ex310
  kind: graded
  segment: 184
  order: 2
  sentence: 'येभ्यः विद्या रोचते, तेभ्यः गुरुः ज्ञानम् ददाति। यस्मात् भयम् उत्पद्यते, तस्मात् दूरम् गच्छ। याभ्यः नदीभ्यः जलम् आयाति, ताभ्यः एव अन्नम् अपि। ययोः बालयोः माता न अस्ति, तौ अहम् पालयामि। येषाम् गृहे अतिथिः पूज्यते, तेषाम् गृहे लक्ष्मीः वसति। यस्मिन् देशे धर्मः, तस्मिन् जयः। येषु गुरुः प्रसीदति, ते धन्याः।'
  translation: 'To those who love learning the teacher gives knowledge. From whatever fear arises, go far from that. From the rivers water comes from, from those alone food comes too. The two boys who have no mother — them I raise. In whose house a guest is honoured, in their house Lakṣmī dwells. In whatever land dharma is, in that, victory. Those with whom the teacher is pleased are blessed.'
  teaches: 'More correlatives — येभ्यः/तेभ्यः, यस्मात्, याभ्यः/ताभ्यः, ययोः, येषाम्, यस्मिन्, येषु.'
