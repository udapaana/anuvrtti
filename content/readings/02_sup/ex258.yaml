  sentence: 'सर्वे मुनयः वने वसन्ति। अन्ये जनाः नगरे तिष्ठन्ति।'
  translation: 'All the sages dwell in the forest. Other people live in the city.'
  teaches: 'सर्व and अन्य are सर्वादि — adjectives that take pronominal endings (सर्वे, अन्ये, like तद्) yet keep their own gender, agreeing with the noun.'
