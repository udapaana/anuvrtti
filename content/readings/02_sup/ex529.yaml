  vyakhya: 'अदसः पुंसि प्रथमाबहुवचने अमी, तृतीयायाम् अमुना, षष्ठीबहुवचने अमीषाम्।'
  vyakhya_en: |
    The men are still far off, so the old man uses अदस्: nominative plural अमी (ए → ई after म, 8.2.81), instrumental अमुना "by that", genitive plural अमीषाम् "of those". Once named, they become plain ते "they".
