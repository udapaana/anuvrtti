  sentence: 'ग्रामम् त्रयः पुरुषाः आगच्छन्ति। बालकाः पृच्छन्ति — अमी के? वृद्धः वदति — अमी वणिजः। अमुना मार्गेण ते प्रतिवर्षम् आगच्छन्ति। अमीषाम् अश्वाः श्रान्ताः।'
  translation: 'Three men are coming toward the village. The boys ask: "Who are those?" An old man says: "Those are merchants. They come by that road every year. Their horses are tired."'
