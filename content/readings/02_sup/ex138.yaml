- id: ex138
  segment: 150
  sentence: भगवतः वचनम्।
  translation: The Lord's word.
  teaches: 'the weak stem of the same word: gen.sg भगवतः — plain भगवत् + ङस्, without the नुम् that भगवान् takes'
  words:
  - form: भगवतः
    lemma: भगवत्
    gloss: of the Lord
    notes:
    - term: सम्बन्ध
      en: genitive — "of ___"
    - text: 'in the oblique, the WEAK stem भगवत् appears — no नुम्, no lengthening'
    - cite: '2.3.50'
      role: षष्ठी शेषे → भगवतः
    - term: षष्ठी
      en: genitive singular (weak)
  - form: वचनम्
    lemma: वचन
    gloss: word, utterance
    notes:
    - term: कर्तृ
      en: the head noun
    - term: प्रथमा
      en: nominative
  vyakhya: सर्वनामस्थानभिन्ने भे दुर्बलम् अङ्गम्। भगवत् + ङस् → भगवतः (न नुम्)।
  vyakhya_en: |
    Set ex137 and ex138 side by side: भगवान् (nom.sg) vs भगवतः (gen.sg). The genitive is a भ/weak cell, so the stem stays plain भगवत् — no नुम्, no lengthening — and simply takes ङस् → भगवतः. Strong भगवान् · weak भगवतः: one stem, two shapes, and the case-cell decides which. This is exactly the राजन् pattern (राजा / राज्ञः, ex066) in a different stem-class.
