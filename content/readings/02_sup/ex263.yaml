      en: 'pronominal adjective — "which of many?" (डतमच्)'
    - term: कर्तृ
      en: 'agent — qualifies नरः'
    - term: प्रथमा
      en: 'nominative'
    rel:
    - kind: विशेषण
      to: 5
  - form: नरः
    lemma: नर
    gloss: 'man'
    notes:
    - term: कर्तृ
      en: 'agent'
    - term: प्रथमा
      en: 'nominative (अ-stem masculine)'
  - form: सत्यम्
    lemma: सत्य
    gloss: 'the truth'
    notes:
