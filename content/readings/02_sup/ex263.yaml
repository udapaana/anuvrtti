- id: ex263
  kind: graded
  segment: 165
  sentence: 'कतरः मार्गः ग्रामम् नयति? कतमः नरः सत्यम् जानाति?'
  translation: 'Which of the two roads leads to the village? Which of the many men knows the truth?'
  teaches: 'the interrogative सर्वादि कतर (which of TWO) and कतम (which of MANY) — the same distinction as द्वि vs बहु, carried by the stem.'
  words:
  - form: कतरः
    lemma: कतर
    gloss: 'which of the two'
    notes:
    - term: सर्वादि
      en: 'pronominal adjective — "which of two?" (डतरच्)'
    - term: कर्तृ
      en: 'agent — qualifies मार्गः'
    - term: प्रथमा
      en: 'nominative'
    rel:
    - kind: विशेषण
      to: 1
  - form: मार्गः
    lemma: मार्ग
    gloss: 'the road'
    notes:
    - term: कर्तृ
      en: 'agent'
    - term: प्रथमा
      en: 'nominative (अ-stem masculine)'
  - form: ग्रामम्
    lemma: ग्राम
    gloss: 'to the village'
    notes:
    - term: कर्मन्
      en: 'goal of नयति'
    - term: द्वितीया
      en: 'accusative'
  - form: नयति
    lemma: नी
    gloss: 'leads'
    notes:
    - term: शप्
      en: 'नी + अ + ति → नयति (गुण ने → नय्)'
    - term: लट्
      en: 'present'
  - form: कतमः
    lemma: कतम
    gloss: 'which of the many'
    notes:
