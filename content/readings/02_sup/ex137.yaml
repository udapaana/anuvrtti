- id: ex137
  segment: 150
  sentence: भगवान् वदति।
  translation: The Lord speaks.
  teaches: 'the वत्-stem in its strong form: nom.sg भगवान्, with the नुम् augment and lengthening'
  words:
  - form: भगवान्
    lemma: भगवत्
    gloss: the Lord, the blessed one
    notes:
    - term: कर्तृ
      en: agent
    - text: 'भगवत् is a त्/त-stem (मतुप् → वत्); the nom.sg is the STRONG stem'
    - cite: '7.1.70'
      role: उगिदचां सर्वनामस्थाने — a उगित् stem takes नुम् (न्) before a सर्वनामस्थान ending → भगवन्त्
    - cite: '6.4.10'
      role: सान्तमहतः संयोगस्य — the penult lengthens → भगवान्त् → भगवान्
    - term: प्रथमा
      en: nominative singular (strong)
  - form: वदति
    lemma: वद्
    gloss: speaks
    notes:
    - term: वद्
      en: '"speak"'
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  vyakhya: उगिदन्तस्य सर्वनामस्थाने नुम्; सान्तस्य दीर्घः। भगवत् → भगवान् (बलवत्-रूपम्)।
  vyakhya_en: |
    Consonant stems have TWO shapes — a STRONG stem in the सर्वनामस्थान cells (nom/voc/acc, roughly) and a WEAK stem elsewhere. भगवत् "the Lord," a वत्-stem, shows the strong form in the nominative singular: it takes the नुम् augment न् (7.1.70, because the stem is उगित्) → भगवन्त्, then the pre-cluster vowel lengthens (6.4.10) → भगवान्. This is why "blessed" appears as भगवान् here but भगवतः, भगवते in the oblique. The strong/weak split is the whole story of consonant declension.
