- id: ex261
  kind: graded
  segment: 163
  sentence: 'विश्वे देवाः यज्ञम् इच्छन्ति। इतरे जनाः न जानन्ति।'
  translation: 'All the gods want the sacrifice. Other people do not know.'
  teaches: 'more सर्वादि — विश्व "all" (विश्वे, beside सर्व) and इतर "the other", each taking तद्-type endings and agreeing with its noun.'
  words:
  - form: विश्वे
    lemma: विश्व
    gloss: 'all'
    notes:
    - term: सर्वादि
      en: 'pronominal adjective — विश्वे, like तद् (a synonym of सर्व)'
    - term: कर्तृ
      en: 'agent — qualifies देवाः, who want'
    - term: प्रथमा
      en: 'nominative'
    rel:
    - kind: विशेषण
      to: 1
  - form: देवाः
    lemma: देव
    gloss: 'the gods'
    notes:
    - term: कर्तृ
      en: 'agent'
    - term: प्रथमा
      en: 'nominative (अ-stem masculine, बहुवचन)'
  - form: यज्ञम्
    lemma: यज्ञ
    gloss: 'the sacrifice'
    notes:
    - term: कर्मन्
      en: 'object — what is wanted'
    - term: द्वितीया
      en: 'accusative'
  - form: इच्छन्ति
    lemma: इष्
    gloss: 'want'
    notes:
    - term: लट्
      en: 'present (इष् is तुदादि: इच्छति)'
  - form: इतरे
    lemma: इतर
    gloss: 'the others'
    notes:
    - term: सर्वादि
      en: 'pronominal adjective — इतरे, the counterpart to one group'
    - term: कर्तृ
      en: 'agent — qualifies जनाः, who do not know'
    - term: प्रथमा
      en: 'nominative'
    rel:
    - kind: विशेषण
      to: 5
  - form: जनाः
    lemma: जन
    gloss: 'people'
    notes:
    - term: कर्तृ
      en: 'agent'
    - term: प्रथमा
      en: 'nominative (अ-stem masculine, बहुवचन)'
  - form: 'न'
    lemma: 'न'
    gloss: 'not'
    notes:
    - term: अव्यय
      en: 'the verbal negator'
  - form: जानन्ति
    lemma: ज्ञा
    gloss: 'know'
    notes:
    - term: लट्
      en: 'present (ज्ञा is क्र्यादि: जानाति)'
