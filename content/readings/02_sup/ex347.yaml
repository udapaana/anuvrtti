  sentence: ऋषी राज्ञोः विश्वसितः, राजानौ अपि मुन्योः वचनम् आदरेण शृणुतः।
  translation: The two sages trust the two kings, and the kings in turn listen with respect to the sages' words.
  teaches: 'Trust both ways in the dual: राज्ञोः is the locative विश्वस् takes, मुन्योः the genitive of whose words.'
