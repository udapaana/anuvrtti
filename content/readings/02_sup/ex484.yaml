  sentence: 'दुर्जने न विश्वसेत्, सुहृत्सु विश्वसेत्।'
  translation: 'One should not trust a wicked man; one should trust friends.'
  teaches: 'the द्-stem सुहृद् in the locative plural, सुहृत्सु, set against दुर्जने'
