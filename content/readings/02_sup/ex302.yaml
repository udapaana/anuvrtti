- id: ex302
  kind: graded
  segment: 182
  order: 1
  sentence: 'गोपालः धेनूः गावौ च वनम् नयति। सः धेनुभिः गोभ्याम् च सह गच्छति। ज्येष्ठयोः धेन्वोः कण्ठयोः घण्टे स्तः। एका धेनुः वृद्धा; सः ताम् धेनुम् शनैः नयति, तस्यै धेन्वै च तृणम् ददाति। धेन्वाः क्षीरम् मधुरम्। धेनूनाम् वत्साः क्रीडन्ति। धेनुषु तस्य स्नेहः। सायम् सः वदति — हे गावः, गृहम् चलत। वृद्धा धेनुः पृष्ठतः तिष्ठति; सः वदति — हे धेनो, त्वम् अपि चल।'
  translation: 'Gopāla leads the cows and two bulls to the forest. He walks with the cows and the two bulls. On the necks of the two eldest cows are two bells. One cow is old; he leads that cow slowly and gives her grass. The cow''s milk is sweet. The cows'' calves play. His affection is for the cows. In the evening he says: "Cattle, go home!" The old cow stays behind; he says: "You too, cow, come along."'
  teaches: 'धेनु (उ-stem feminine) through its cells — धेनुः, धेनुम्, धेनूः, धेनुभिः, धेन्वै, धेन्वाः, धेन्वोः, धेनूनाम्, धेनुषु, हे धेनो; गो (irregular) — गावौ, गोभ्याम्, हे गावः.'
