  order: 1
  sentence: 'गोपालः गावौ धेनू च वनम् नयति। सः धेनुभिः गोभ्याम् च सह गच्छति। सः धेन्वै तृणम् ददाति। धेन्वाः क्षीरम् मधुरम्। धेन्वोः कण्ठयोः घण्टे स्तः। धेनूनाम् वत्साः क्रीडन्ति। धेनुषु तस्य स्नेहः। सायम् सः वदति — हे धेनो, हे गावः, गृहम् चलत।'
  translation: 'Gopāla leads two bulls and two cows to the forest. He walks with the cows and the two bulls. He gives grass to a cow. The cow''s milk is sweet. On the two cows'' necks are two bells. The cows'' calves play. His affection is for the cows. In the evening he says: "O cow, O cattle — go home."'
  teaches: 'धेनु (उ-stem feminine) and गो (irregular) through the cells the corpus lacked — धेनू, धेनुभिः, धेन्वै, धेन्वाः, धेन्वोः, धेनूनाम्, धेनुषु, हे धेनो; गावौ, गोभ्याम्, हे गावः.'
