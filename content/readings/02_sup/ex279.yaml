- id: ex279
  kind: graded
  segment: 171
  order: 2
  sentence: 'नगरे द्वौ गुरू वसतः। गुर्वोः शिष्याः बहवः सन्ति। एकस्य गुरोः गृहम् नद्याः तीरे अस्ति। शिष्याः गुरून् सेवन्ते, गुरुभ्यः च पुष्पाणि आनयन्ति। गुरुभिः सह ते वेदम् पठन्ति। गुरूणाम् वचनम् ते न विस्मरन्ति। गुरुषु तेषाम् श्रद्धा अस्ति।'
  translation: 'In the city live two teachers. The two teachers have many pupils. One teacher''s house is on the bank of the river. The pupils serve the teachers and bring them flowers. With the teachers they recite the Veda. They do not forget the teachers'' word. They have faith in the teachers.'
  teaches: 'गुरु in the dual and plural — गुरू, गुर्वोः, गुरून्, गुरुभ्यः, गुरुभिः, गुरूणाम्, गुरुषु — and the genitive गुरोः.'
