- id: ex293
  kind: graded
  segment: 179
  order: 2
  sentence: 'ऋषी प्रसन्नाभ्याम् मनोभ्याम् अतिथीन् पूजयतः। तौ राजभ्याम् आसने यच्छतः, देवीभ्याम् पुष्पाणि, गुरुभ्याम् फलानि। नृपौ अपि मुनिभ्याम् ते गावौ यच्छतः। ततः भोजनम्। पाकशालाभ्याम् अन्नम् आगच्छति, अतिथयः च पङ्क्त्योः उपविशन्ति। ऋषेः कन्ये कुमाराभ्याम् सह क्रीडतः, भ्रातृभ्याम् इव। कुमारौ अपि ताभ्याम् सह क्रीडतः, स्वसृभ्याम् इव। भोजनात् परम् सर्वे पङ्क्तिभ्याम् उत्तिष्ठन्ति।'
  translation: 'The sages honour their guests with glad hearts. They give seats to the two kings, flowers to the two queens, fruit to the two teachers. The kings in turn give the two sages those two cows. Then the meal. Food comes from the two kitchens, and the guests sit in two rows. The sage''s daughters play with the princes as if with brothers, and the princes play with them as if with sisters. After the meal everyone rises from the two rows.'
  teaches: 'The visit, part 2 — the dual''s one oblique form, -भ्याम्, in three cases: the dative of giving (राजभ्याम्, देवीभ्याम्, गुरुभ्याम्, मुनिभ्याम्), the instrumental of manner and company (मनोभ्याम्, भ्रातृभ्याम्, स्वसृभ्याम्), the ablative of source (पाकशालाभ्याम्, पङ्क्तिभ्याम्).'
