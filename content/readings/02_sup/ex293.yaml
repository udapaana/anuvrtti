- id: ex293
  kind: graded
  segment: 179
  order: 2
  sentence: 'शिष्यौ गुरुभ्याम् नमतः। जनाः मुनिभ्याम् राजभ्याम् च नमन्ति। राजा देवीभ्याम् माले यच्छति। बालाभ्याम् कन्दुकः पतति। लताभ्याम् पुष्पाणि पतन्ति। वनाभ्याम् मृगौ आगच्छतः। भूमिभ्याम् धान्यम् आगच्छति। बालौ पितृभ्याम् सह, कन्ये मातृभ्याम् सह क्रीडतः। सर्वे शुद्धाभ्याम् मनोभ्याम् देवम् पूजयन्ति।'
  translation: 'Two pupils bow to their two teachers. The people bow to the two sages and the two kings. The king gives garlands to the two queens. A ball falls from the two boys. Flowers fall from the two creepers. Two deer come from the two forests. Grain comes from the two fields. The two boys play with their fathers, the two girls with their mothers. All worship the god with pure minds.'
  teaches: 'The -भ्याम् dual in its other two cases — dative (गुरुभ्याम्, मुनिभ्याम्, राजभ्याम्, देवीभ्याम्), ablative (बालाभ्याम्, लताभ्याम्, वनाभ्याम्, भूमिभ्याम्) — and instrumental पितृभ्याम्, मातृभ्याम्, मनोभ्याम्.'
