readings:

# ── Segment 13: the four compound types ─────────────────────────────────
# Two or more सुबन्त words combine into one (2.1.3 समासः). Which TYPE a
# compound is depends on which member is primary — the whole sense of the
# chapter. कथा = the compound itself, with its विग्रह (analysis) in the gloss.

- id: ex037
  segment: 130
  sentence: राजपुरुषः
  translation: "the king's man (विग्रह: राज्ञः पुरुषः)"
  teaches: 'तत्पुरुष — the second member is primary, and the first qualifies it'
  words:
  - form: राजपुरुषः
    gloss: the king's man
    notes:
    - text: 'विग्रह: राज्ञः पुरुषः — "the man of the king"'
    - term: समास
      en: compound
    - cite: '2.1.3'
      role: प्राक् कडारात् समासः — from here the combinations are named समास
    - term: तत्पुरुष
      en: determinative — the second member is the head
    - cite: '2.1.22'
      role: तत्पुरुषः — a compound whose second member carries the main sense is तत्पुरुष
  vyakhya: उत्तरपदार्थप्रधानः तत्पुरुषः। राजपुरुषः — पुरुषः प्रधानम्।
  vyakhya_en: |
    In a तत्पुरुष the second member is the head and the first qualifies it: राजपुरुषः is a kind of पुरुष (man) — the king's. Resolve it (विग्रह) as राज्ञः पुरुषः, "the man of the king." The compound is whatever its last member is.
- id: ex038
  segment: 130
  sentence: द्वन्द्वः — रामकृष्णौ
  translation: "Rāma-and-Kṛṣṇa (विग्रह: रामः च कृष्णः च)"
  teaches: 'द्वन्द्व — members are coordinate ("and"); none subordinate'
  words:
  - form: रामकृष्णौ
    gloss: Rāma and Kṛṣṇa
    notes:
    - text: 'विग्रह: रामः च कृष्णः च'
    - term: द्वन्द्व
      en: copulative — members joined by "and"
    - cite: '2.2.29'
      role: चार्थे द्वन्द्वः — words standing in the sense of "च" (and) form a द्वन्द्व
    - term: द्विवचन
      en: dual — two people, so the compound is dual
  vyakhya: उभयपदार्थप्रधानः द्वन्द्वः। रामः च कृष्णः च = रामकृष्णौ।
  vyakhya_en: |
    A द्वन्द्व joins members that would each stand with "and" — none is subordinate, both are heads: रामः च कृष्णः च collapses to रामकृष्णौ, "Rāma and Kṛṣṇa." Two people, so the compound itself is dual.
- id: ex039
  segment: 130
  sentence: बहुव्रीहिः — पीताम्बरः
  translation: "the yellow-clothed one [Viṣṇu] (विग्रह: पीतम् अम्बरम् यस्य सः)"
  teaches: 'बहुव्रीहि — neither member is the head; the compound points outside itself'
  words:
  - form: पीताम्बरः
    gloss: the one whose garment is yellow
    notes:
    - text: 'विग्रह: पीतम् अम्बरम् यस्य सः'
    - term: बहुव्रीहि
      en: possessive / exocentric — denotes someone characterised by the members
    - cite: '2.2.23'
      role: शेषो बहुव्रीहिः — the remaining kind of compound is बहुव्रीहि
    - cite: '2.2.24'
      role: अनेकमन्यपदार्थे — several words denoting ANOTHER thing (the possessor) form a बहुव्रीहि
  vyakhya: अन्यपदार्थप्रधानः बहुव्रीहिः। पीतम् अम्बरम् यस्य — सः विष्णुः।
  vyakhya_en: |
    A बहुव्रीहि names neither member: पीताम्बरः is not "yellow" and not "garment" but the one who has a yellow garment — Viṣṇu. The sense lies OUTSIDE the compound (अन्यपदार्थ). Resolve with यस्य: "he whose (यस्य) garment is yellow."
- id: ex040
  segment: 130
  sentence: अव्ययीभावः — उपकृष्णम्
  translation: "near Kṛṣṇa (विग्रह: कृष्णस्य समीपम्)"
  teaches: 'अव्ययीभाव — the first member, an indeclinable, is primary, and the whole behaves as one'
  words:
  - form: उपकृष्णम्
    gloss: near Kṛṣṇa
    notes:
    - text: 'विग्रह: कृष्णस्य समीपम् — उप = "near"'
    - term: अव्ययीभाव
      en: adverbial — the compound behaves as an indeclinable
    - cite: '2.1.5'
      role: अव्ययीभावः — a compound headed by an indeclinable (here उप) is अव्ययीभाव
    - term: अव्यय
      en: indeclinable — takes no further case-ending
  vyakhya: पूर्वपदार्थप्रधानः अव्ययीभावः। उप कृष्णस्य समीपम् — सर्वम् अव्ययम्।
  vyakhya_en: |
    In an अव्ययीभाव the first member — an indeclinable like उप ("near") — is primary, and the whole compound becomes an indeclinable itself: उपकृष्णम्, "near Kṛṣṇa," fixed in form. Four types, four answers to one question: which member carries the sense?

# ── Segment 20: two तत्पुरुष sub-types a reader meets constantly ─────────
# कर्मधारय (adjective + noun, both same case) and द्विगु (numeral + noun).
# Both are तत्पुरुष — the second member heads — with a special first member.

- id: ex050
  segment: 200
  sentence: महापुरुषः
  translation: "a great man (विग्रह: महान् पुरुषः)"
  teaches: 'कर्मधारय — a तत्पुरुष whose members share one case (adjective + noun)'
  words:
  - form: महापुरुषः
    gloss: a great man
    vocab: true
    notes:
    - text: 'विग्रह: महान् पुरुषः — "a man who is great"'
    - term: कर्मधारय
      en: a तत्पुरुष of adjective + noun, both in the same case
    - cite: '1.2.42'
      role: तत्पुरुषः समानाधिकरणः कर्मधारयः — a तत्पुरुष whose members are co-referential (same case) is कर्मधारय
    - cite: '2.1.57'
      role: विशेषणं विशेष्येण — a qualifier (महत्) combines with the qualified (पुरुष)
  vyakhya: समानाधिकरणः तत्पुरुषः कर्मधारयः। महान् च असौ पुरुषः च।
  vyakhya_en: |
    A कर्मधारय is a तत्पुरुष where the two members refer to the SAME thing — adjective and noun, both nominative: महान् पुरुषः → महापुरुषः, "great man." Unlike राजपुरुषः (the king's man — two different things, genitive relation), here महत् simply describes पुरुष. (महत् → महा in the compound.)
- id: ex051
  segment: 200
  sentence: त्रिलोकी
  translation: "the three worlds (विग्रह: त्रयाणां लोकानां समाहारः)"
  teaches: 'द्विगु — a numeral-first तत्पुरुष, denoting an aggregate'
  words:
  - form: त्रिलोकी
    gloss: the three worlds (as a set)
    vocab: true
    notes:
    - text: 'विग्रह: त्रयाणां लोकानां समाहारः — "the aggregate of three worlds"'
    - term: द्विगु
      en: a numeral-first compound, naming a counted aggregate
    - cite: '2.1.52'
      role: संख्यापूर्वो द्विगुः — a तत्पुरुष with a number (त्रि) as its first member is द्विगु
  vyakhya: संख्यापूर्वः तत्पुरुषः द्विगुः। त्रयाणां लोकानां समाहारः त्रिलोकी।
  vyakhya_en: |
    A द्विगु is a तत्पुरुष whose first member is a numeral: त्रि (three) + लोक (world) → त्रिलोकी, "the three worlds" taken as one set. It names a counted aggregate — द्वि-गु itself means "worth two cows." Same तत्पुरुष frame (second member heads), special first member: a number.

- id: ex143
  segment: 130
  sentence: कृष्णश्रितः बालः।
  translation: The boy gone-to-Kṛṣṇa (who has taken refuge with Kṛṣṇa).
  teaches: 'द्वितीया-तत्पुरुष — the विग्रह uses the accusative (कृष्णं श्रितः); named by that case'
  words:
  - form: कृष्णश्रितः
    lemma: कृष्णश्रित
    gloss: gone to / having resorted to Kṛṣṇa
    notes:
    - text: 'विग्रह: कृष्णं श्रितः — "resorted-to Kṛष्ण"; the first member is logically accusative'
    - term: तत्पुरुष
      en: case-तत्पुरुष; the later member (श्रित) heads
    - cite: '2.1.24'
      role: द्वितीया श्रितातीतपतित… — a 2nd-case word compounds with श्रित etc. → द्वितीया-तत्पुरुष
    - term: समास
      en: compound
    - term: प्रथमा
      en: nominative (the whole, qualifying बालः)
  - form: बालः
    lemma: बाल
    gloss: the boy
    notes:
    - term: विशेष्य
      en: the noun the compound qualifies
    - term: प्रथमा
      en: nominative
  vyakhya: द्वितीयान्तं श्रितादिभिः समस्यते। कृष्णं श्रितः = कृष्णश्रितः।
  vyakhya_en: |
    तत्पुरुष compounds are NAMED by the case the analysis (विग्रह) would use. Here the विग्रह is कृष्णं श्रितः — "resorted-to Kṛṣṇa," with कृष्ण in the द्वितीया (accusative) — so the compound is a द्वितीया-तत्पुरुष (2.1.24). The later member श्रित heads it, as in every तत्पुरुष; only the internal case-relation differs. This is the template: each case gives a named sub-type.
- id: ex144
  segment: 130
  sentence: यूपदारु आनय।
  translation: Bring the wood for the sacrificial post.
  teaches: 'चतुर्थी-तत्पुरुष — the विग्रह uses a dative of purpose: यूपाय दारु, "wood for a post"'
  words:
  - form: यूपदारु
    lemma: यूपदारु
    gloss: wood for the sacrificial post
    notes:
    - text: 'विग्रह: यूपाय दारु — "wood for-a-post"; first member is logically dative (purpose)'
    - term: तत्पुरुष
      en: चतुर्थी-तत्पुरुष; the later member (दारु) heads
    - cite: '2.1.36'
      role: चतुर्थी तदर्थार्थ… — a 4th-case (purpose) word compounds → चतुर्थी-तत्पुरुष
    - term: समास
      en: compound
    - term: कर्मन्
      en: object of आनय (accusative neuter, unchanged in form)
  - form: आनय
    lemma: नी
    gloss: bring!
    notes:
    - term: नी
      en: '"lead, bring" (आ + नी)'
    - cite: '3.3.162'
      role: लोट् च → imperative → आनय
    - term: लोट्
      en: imperative
  vyakhya: चतुर्थ्यन्तं तदर्थेन समस्यते। यूपाय दारु = यूपदारु।
  vyakhya_en: |
    The dative-of-purpose तत्पुरुष: यूपाय दारु, "wood FOR a sacrificial post," compounds to यूपदारु (2.1.36). The विग्रह's चतुर्थी (purpose, "for") names it. Compare कृष्णश्रितः (द्वितीया, ex143): same heads-later frame, the internal case is what the name records.
- id: ex145
  segment: 130
  sentence: राजपुरुषः आगच्छति।
  translation: The king's man comes.
  teaches: 'षष्ठी-तत्पुरुष — the commonest तत्पुरुष; the विग्रह uses the genitive (राज्ञः पुरुषः)'
  words:
  - form: राजपुरुषः
    lemma: राजपुरुष
    gloss: the king's man, royal servant
    notes:
    - text: 'विग्रह: राज्ञः पुरुषः — "the king''s man"; first member is logically genitive'
    - term: तत्पुरुष
      en: षष्ठी-तत्पुरुष — the default, commonest case-तत्पुरुष
    - cite: '2.2.8'
      role: षष्ठी → a 6th-case word compounds with what it relates to → षष्ठी-तत्पुरुष
    - term: समास
      en: compound
    - term: प्रथमा
      en: nominative
  - form: आगच्छति
    lemma: गम्
    gloss: comes
    notes:
    - term: गम्
      en: '"come" (आ + गम्)'
    - term: लट्
      en: present
  vyakhya: षष्ठ्यन्तं सुबन्तेन समस्यते। राज्ञः पुरुषः = राजपुरुषः।
  vyakhya_en: |
    The षष्ठी-तत्पुरुष is the workhorse compound: राज्ञः पुरुषः "the king's man" → राजपुरुषः (2.2.8). Whenever the relation between two nouns is the plain "of / 's" (the genitive, षष्ठी शेषे), it can compound this way — देवदत्तस्य गृहम् → देवदत्तगृहम्, and so on. It is the तत्पुरुष you meet most.
- id: ex146
  segment: 130
  sentence: अक्षशौण्डः नरः।
  translation: A man skilled at dice.
  teaches: 'सप्तमी-तत्पुरुष — the विग्रह uses the locative (अक्षेषु शौण्डः, "expert AT dice")'
  words:
  - form: अक्षशौण्डः
    lemma: अक्षशौण्ड
    gloss: skilled at dice, a dice-expert
    notes:
    - text: 'विग्रह: अक्षेषु शौण्डः — "expert at dice"; first member is logically locative'
    - term: तत्पुरुष
      en: सप्तमी-तत्पुरुष; the later member (शौण्ड) heads
    - cite: '2.1.40'
      role: सप्तमी शौण्डैः — a 7th-case word compounds with शौण्ड etc. → सप्तमी-तत्पुरुष
    - term: समास
      en: compound
    - term: प्रथमा
      en: nominative
  - form: नरः
    lemma: नर
    gloss: the man
    notes:
    - term: विशेष्य
      en: the noun qualified
    - term: प्रथमा
      en: nominative
  vyakhya: सप्तम्यन्तं शौण्डादिभिः समस्यते। अक्षेषु शौण्डः = अक्षशौण्डः।
  vyakhya_en: |
    The locative तत्पुरुष: अक्षेषु शौण्डः, "expert AT dice," → अक्षशौण्डः (2.1.40). The विग्रह's सप्तमी (the locus of the skill) names it. With ex143–146 you now have the four case-तत्पुरुषes — द्वितीया, चतुर्थी, षष्ठी, सप्तमी — each the same heads-later compound, distinguished only by which case the analysis restores.
- id: ex147
  segment: 130
  sentence: अब्राह्मणः अयम्।
  translation: This one is a non-brahmin.
  teaches: 'नञ्-तत्पुरुष — negation by नञ् (न → अ before a consonant); "non-X"'
  words:
  - form: अब्राह्मणः
    lemma: अब्राह्मण
    gloss: a non-brahmin
    notes:
    - text: 'विग्रह: न ब्राह्मणः — "not a brahmin"; नञ् (न) prefixes, surfacing as अ before a consonant'
    - term: तत्पुरुष
      en: नञ्-तत्पुरुष — negation compound
    - cite: '2.2.6'
      role: नञ् → the negative नञ् compounds with the following word → नञ्-तत्पुरुष
    - term: समास
      en: compound
    - term: प्रथमा
      en: nominative
  - form: अयम्
    lemma: इदम्
    gloss: this one
    notes:
    - term: सर्वनाम
      en: pronoun इदम्, nom.sg masculine
    - term: प्रथमा
      en: nominative
  vyakhya: नञः समासे न-कारस्य अ-आदेशः (हलि)। न ब्राह्मणः = अब्राह्मणः।
  vyakhya_en: |
    The नञ्-तत्पुरुष negates: न ब्राह्मणः "not a brahmin" → अब्राह्मणः (2.2.6). The particle नञ् surfaces as अ- before a consonant (and as अन्- before a vowel — अनश्वः "non-horse"). This is the productive "non-/un-/a-" prefix of Sanskrit: अधर्मः, अहिंसा, असत्य — every one a नञ्-तत्पुरुष.
- id: ex148
  segment: 130
  sentence: प्राचार्यः उपदिशति।
  translation: The eminent teacher instructs.
  teaches: 'प्रादि-तत्पुरुष — a preverb/particle (here प्र "forth, eminent") compounds as the first member'
  words:
  - form: प्राचार्यः
    lemma: प्राचार्य
    gloss: an eminent / foremost teacher
    notes:
    - text: 'विग्रह: प्रगतः आचार्यः — "a foremost teacher"; प्र (preverb) is the first member'
    - term: तत्पुरुष
      en: प्रादि-तत्पुरुष — गति/preverb compound (कुगतिप्रादयः)
    - cite: '2.2.18'
      role: कुगतिप्रादयः → कु, गति-words, and the प्र-class particles compound (तत्पुरुष)
    - term: समास
      en: compound
    - term: प्रथमा
      en: nominative
  - form: उपदिशति
    lemma: दिश्
    gloss: instructs, teaches
    notes:
    - term: दिश्
      en: '"point out, instruct" (उप + दिश्)'
    - term: लट्
      en: present
  vyakhya: प्रादयः सुबन्तेन समस्यन्ते (कुगतिप्रादयः)। प्रगतः आचार्यः = प्राचार्यः।
  vyakhya_en: |
    The प्रादि-तत्पुरुष lets a preverb or particle head a compound: प्र "forth, eminent" + आचार्य → प्राचार्यः, "a foremost teacher" (2.2.18, कुगतिप्रादयः — कु "bad," the गति preverbs, and the प्र-series). The same rule gives अतिराजः "surpassing a king," कुपुरुषः "a wretched man." It rounds out the तत्पुरुष: not only case-relations but particles can occupy the first slot.
