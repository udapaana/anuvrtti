# ════════════════════════════════════════════════════════════════════════
#  11_samjna.yaml — संज्ञा & परिभाषा — the grammar's own metalanguage
#
#  The technical TERMS the Aṣṭādhyāyī uses on itself (वृद्धि, गुण, सवर्ण, इत्,
#  पद) and the interpretive RULES (परिभाषा) that drive substitution
#  (स्थानेऽन्तरतमः). Conceptually FIRST, introduced late: you need real forms
#  to motivate the metalanguage. High segments = reference, not entry.
#  Each reading defines one term and shows it acting in a form already met.
#  Every cite verified against data/sutras/.
# ════════════════════════════════════════════════════════════════════════
readings:
- id: ex174
  kind: samjna
  segment: 22
  sentence: आ, ऐ, औ — एते वृद्धिसंज्ञाः।
  translation: ā, ai, au — these bear the name "vṛddhi."
  teaches: 'the संज्ञा वृद्धि — Pāṇini''s name for the strongest vowel grade (आ ऐ औ); the term every "vṛddhi" rule invokes'
  words:
  - form: वृद्धिः
    lemma: वृद्धि
    gloss: '"vṛddhi" — the technical name'
    notes:
    - term: संज्ञा
      en: a technical term DEFINED here, used everywhere after
    - cite: '1.1.1'
      role: वृद्धिरादैच् — आत् (आ) and ऐच् (ऐ, औ) are named वृद्धि
    - term: प्रथमा
      en: nominative (the term being defined)
  - form: आदैच्
    lemma: आदैच्
    gloss: ā and the ऐच् pair (ऐ, औ)
    notes:
    - text: 'आत् = आ; ऐच् = the प्रत्याहार for ऐ, औ — together the वृद्धि vowels'
    - term: प्रत्याहार
      en: the अ-grouping naming ऐ + औ
  vyakhya: आ ऐ औ इति वृद्धिसंज्ञकाः। एषा संज्ञा "आदिवृद्धिः" "वृद्धिरेचि" इत्यादिषु प्रयुज्यते।
  vyakhya_en: |
    Before any rule can SAY "take vṛddhi," the term must be DEFINED — and 1.1.1, the very first sūtra of the Aṣṭādhyāyī, does it: वृद्धिः = आ, ऐ, औ, the strongest vowel grade. You have already SEEN वृद्धि act — दशरथ → दाशरथिः (आदिवृद्धि, ex080), तव + एव → तवैव (ex with वृद्धि-sandhi). Now you know its name. This is metalanguage: a संज्ञा is a label the grammar pins on a set of sounds so later rules can refer to them in one word.
- id: ex175
  kind: samjna
  segment: 22
  sentence: अ, ए, ओ — एते गुणसंज्ञाः।
  translation: a, e, o — these bear the name "guṇa."
  teaches: 'the संज्ञा गुण — the middle vowel grade (अ ए ओ); the term behind every गुण operation (अग्नये, नयति)'
  words:
  - form: गुणः
    lemma: गुण
    gloss: '"guṇa" — the technical name'
    notes:
    - term: संज्ञा
      en: technical term defined here
    - cite: '1.1.2'
      role: अदेङ् गुणः — अत् (अ) and एङ् (ए, ओ) are named गुण
    - term: प्रथमा
      en: nominative
  - form: इकः
    lemma: इक्
    gloss: the इक् vowels (इ उ ऋ ऌ) — what guṇa/vṛddhi apply TO
    notes:
    - text: 'इको गुणवृद्धी (1.1.3): गुण/वृद्धि, when ordered without specifics, fall on the इक् vowels'
    - cite: '1.1.3'
      role: इको गुणवृद्धी — गुण and वृद्धि operate on इक् (इ उ ऋ ऌ)
    - term: षष्ठी
      en: genitive (the locus of the change)
  vyakhya: अ ए ओ इति गुणसंज्ञकाः; इको गुणवृद्धी इति इकां गुणवृद्धी भवतः। नी → ने (नयति), अग्नि → अग्नये।
  vyakhya_en: |
    गुण, the MIDDLE grade, is named in 1.1.2: अ, ए, ओ. And 1.1.3 (इको गुणवृद्धी) says where it lands — on the इक् vowels (इ, उ, ऋ, ऌ): इ→ए, उ→ओ, ऋ→अर्. You have watched this everywhere — अग्नि → अग्नये (इ→ए, ex029), गुरु → गुरवे (उ→ओ, ex048), पितृ → पितरम् (ऋ→अर्, ex044). गुण and वृद्धि are the two strengthenings; इक् is what they strengthen. Three sūtras (1.1.1–3) underwrite half the sandhi and declension you have done.
- id: ex176
  kind: samjna
  segment: 22
  sentence: तुल्यास्यप्रयत्नं सवर्णम्।
  translation: Sounds made at the same place with the same effort are "savarṇa" (homorganic).
  teaches: 'the संज्ञा सवर्ण — same-place-and-effort sounds; the term behind सवर्णदीर्घ (अ+अ→आ)'
  words:
  - form: सवर्णम्
    lemma: सवर्ण
    gloss: '"savarṇa" — homorganic, of the same class'
    notes:
    - term: संज्ञा
      en: technical term defined here
    - cite: '1.1.9'
      role: तुल्यास्यप्रयत्नं सवर्णम् — same आस्य (place) + प्रयत्न (effort) → सवर्ण
    - term: प्रथमा
      en: nominative
  - form: तुल्यास्यप्रयत्नम्
    lemma: तुल्यास्यप्रयत्न
    gloss: of equal place-of-articulation and effort
    notes:
    - text: 'आस्य = the mouth-position (कण्ठ, तालु…); प्रयत्न = the manner/effort'
    - term: हेतु
      en: the criterion of sameness
  vyakhya: समानस्थानप्रयत्नौ वर्णौ सवर्णौ। अ इ-वर्गादीनां स्वस्ववर्गे सावर्ण्यम्। अतः अ + अ → आ (सवर्णदीर्घः)।
  vyakhya_en: |
    Why does अ + अ fuse to आ but अ + इ to ए? Because the first pair is सवर्ण — "homorganic," made at the same place with the same effort (1.1.9) — and the second is not. This संज्ञा is the hinge of सवर्णदीर्घ (दधि + इन्द्रः → दधीन्द्रः, ex with 6.1.101): two सवर्ण vowels lengthen into one. The term sorts every sound into क-class, च-class, and so on — the grid behind both sandhi and the सवर्ण-exclusions in declension.
- id: ex177
  kind: samjna
  segment: 22
  sentence: उपदेशे हल् अन्त्यम् इत्, तस्य लोपः।
  translation: A consonant at the end of an affix-citation is an "it"-marker — and it drops.
  teaches: 'the इत् mechanism — affixes carry silent marker-letters that trigger rules, then vanish (क्विप्, तृच्, ण्वुल् are all named by their इत्s)'
  words:
  - form: इत्
    lemma: इत्
    gloss: '"it" — a silent diacritic marker'
    notes:
    - term: संज्ञा
      en: the marker-letter status
    - cite: '1.3.3'
      role: हलन्त्यम् — a final consonant in an उपदेश (citation form) is इत्
    - cite: '1.3.2'
      role: उपदेशेऽजनुनासिक इत् — a nasalised vowel in citation is also इत्
    - term: प्रथमा
      en: nominative
  - form: लोपः
    lemma: लोप
    gloss: elision (the इत् disappears)
    notes:
    - cite: '1.3.9'
      role: तस्य लोपः — that इत् is then dropped, leaving only its effect
    - term: प्रथमा
      en: nominative
  vyakhya: उपदेशे अन्त्यो हल् इत्संज्ञकः, स च लुप्यते; कार्यं तु करोति। यथा तृच् → तृ (च् इत्); क्विप् → शून्यम् (सर्वे इतः)।
  vyakhya_en: |
    Affixes are cited with extra letters that never appear in the final word — they are इत्, silent markers (1.3.3 for a final consonant, 1.3.2 for a nasal vowel) that DROP by तस्य लोपः (1.3.9), having done their job of triggering rules. तृच् is really just तृ — the च् is an इत् (it conditions accent/operations). क्विप् is ALL इत् — every letter vanishes, which is why it leaves the bare root (ex161, भूः). Decoding इत्-markers is how you read Pāṇini's affix-names: शतृ = अत्, ल्युट् = अन, घञ् = अ.
- id: ex178
  kind: paribhasha
  segment: 22
  sentence: षष्ठी स्थानेयोगा; स्थाने अन्तरतमः।
  translation: A genitive (in a rule) means "in the place of"; and the substitute is the one nearest (to the original).
  teaches: 'the two परिभाषाs that drive every substitution (आदेश) — what the षष्ठी means in a rule, and how to pick the replacement'
  words:
  - form: स्थानेयोगा
    lemma: स्थानेयोग
    gloss: '"in-the-place-of" — how a rule''s genitive is read'
    notes:
    - term: परिभाषा
      en: an interpretive meta-rule
    - cite: '1.1.49'
      role: षष्ठी स्थानेयोगा — a षष्ठी in a sūtra means "in the place of X" (X is replaced)
    - term: प्रथमा
      en: nominative
  - form: अन्तरतमः
    lemma: अन्तरतम
    gloss: the nearest, most similar (substitute)
    notes:
    - cite: '1.1.50'
      role: स्थानेऽन्तरतमः — among possible substitutes, the one closest to the original is chosen
    - term: प्रथमा
      en: nominative
  vyakhya: सूत्रस्थषष्ठी स्थानिनं सूचयति (तस्य स्थाने आदेशः); बहुषु आदेशेषु अन्तरतमः ग्राह्यः। एताभ्यां सर्वः आदेशविधिः प्रवर्तते।
  vyakhya_en: |
    These two are not about Sanskrit words — they are about reading the GRAMMAR. 1.1.49: when a rule puts a word in the genitive (इकः, अचः…), it means "IN THE PLACE OF that" — a substitution. 1.1.50: when several substitutes are possible, take the अन्तरतम, the one nearest in place/effort to the original. Together they govern every आदेश you have met — why ऋ becomes अर् (the nearest गुण) and not something else, why इ + vowel goes to य् (the nearest semivowel, यण्). The परिभाषाs are the operating system under the rules.
- id: ex179
  kind: samjna
  segment: 22
  sentence: सुप्तिङन्तं पदम्।
  translation: A form ending in a सुप् (noun-ending) or तिङ् (verb-ending) is a "pada" (word).
  teaches: 'the संज्ञा पद — the definition of a finished WORD; it gates पद-level sandhi and the final-consonant rules'
  words:
  - form: पदम्
    lemma: पद
    gloss: '"pada" — a complete, ending-bearing word'
    notes:
    - term: संज्ञा
      en: technical term defined here
    - cite: '1.4.14'
      role: सुप्तिङन्तं पदम् — what ends in सुप् or तिङ् is a पद
    - term: प्रथमा
      en: nominative
  - form: सुप्तिङन्तम्
    lemma: सुप्तिङन्त
    gloss: ending in a सुप् or a तिङ्
    notes:
    - text: 'सुप् = the 21 noun-endings (4.1.2); तिङ् = the 18 verb-endings (3.4.78)'
    - term: बहुव्रीहि
      en: '"that which has सुप्/तिङ् at its end"'
  vyakhya: यत् सुबन्तं तिङन्तं वा तत् पदम्। पदान्ते एव जश्त्वादीनि, पदयोः सन्धिः च प्रवर्तते। नरः, गच्छति — पदे।
  vyakhya_en: |
    Many rules say "at the end of a पद" or "between पदs" — so the term must be fixed: a पद is anything ending in a noun-ending (सुप्) or a verb-ending (तिङ्), by 1.4.14. नरः (सुबन्त) and गच्छति (तिङन्त) are both पदs; a bare stem नर or root गम् is not. This संज्ञा gates the whole final-tail of the grammar — जश्त्व (वाक्→वाग्), न-lopa (राजन्→राजा), म्→anusvāra all fire at पद-end, and external sandhi happens between पदs. The word-boundary is itself a defined object.
