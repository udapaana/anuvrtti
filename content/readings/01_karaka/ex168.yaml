- id: ex168
  segment: 110
  sentence: अन्नस्य हेतोः वसति।
  translation: He dwells (there) for the sake of food.
  teaches: 'षष्ठी हेतुप्रयोगे — when हेतु is used, both it and the cause stand in the षष्ठी'
  words:
  - form: अन्नस्य
    lemma: अन्न
    gloss: of food (the cause)
    notes:
    - term: हेतु
      en: the cause — here in the genitive because हेतु is used
    - cite: '2.3.26'
      role: षष्ठी हेतुप्रयोगे — with the word हेतु, the cause takes the षष्ठी
    - term: षष्ठी
      en: genitive
  - form: हेतोः
    lemma: हेतु
    gloss: for the sake of, by reason of
    notes:
    - text: 'हेतु itself stands in the षष्ठी, agreeing with the cause-word'
    - term: षष्ठी
      en: genitive
  - form: वसति
    lemma: वस्
    gloss: dwells
    notes:
    - term: वस्
      en: '"dwell"'
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  vyakhya: हेतुशब्दप्रयोगे कारणं हेतुश्च षष्ठ्याम्। अन्नस्य हेतोः — कारणे षष्ठी।
  vyakhya_en: |
    Cause is normally the तृतीया (धनेन "because of wealth," ex033). But when the explicit word हेतु "reason" is used, BOTH it and the cause it names go into the षष्ठी (2.3.26): अन्नस्य हेतोः "for the sake of food," literally "by-reason of-food." So किम् + हेतु → किं हेतोः "why," and the common कस्य हेतोः. The presence of हेतु re-cases the cause.
