- id: ex006
  segment: 10
  sentence: नरः ग्रामे वसति।
  translation: The man lives in the village.
  teaches: adds अधिकरण → सप्तमी
  words:
  - form: नरः
    lemma: नर
    gloss: the man
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: ग्रामे
    gloss: in the village
    notes:
    - term: अधिकरण
      en: locus
    - cite: 1.4.45
      role: ग्राम is अधिकरण — the locus of the action
    - term: सप्तमी
      en: locative
    - term: एकवचन
      en: singular
    - cite: 2.3.36
      role: सप्तम्यधिकरणे च → ग्रामे
  - form: वसति
    lemma: वस्
    gloss: lives
    notes:
    - term: वस्
      en: '"dwell"'
    - term: धातु
      en: verbal root
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  vyakhya: आधारः अधिकरण, सप्तमी अधिकरणे।
  vyakhya_en: |
    A third ending on the same village. ग्रामम् when he went to it, ग्रामात्
    when he came from it, ग्रामे now that he lives in it. Three sentences, one
    noun, and the ending is the only thing carrying the difference.
