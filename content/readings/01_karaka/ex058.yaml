- id: ex058
  segment: 130
  sentence: सूर्ये उदिते कमलं विकसति।
  translation: When the sun has risen, the lotus opens.
  teaches: 'सति सप्तमी — the locative absolute: one act marking the time of another'
  words:
  - form: सूर्ये
    gloss: when the sun (is/has)
    notes:
    - term: अधिकरण
      en: the locative-absolute subject — its action marks the time
    - cite: 2.3.37
      role: यस्य च भावेन भावलक्षणम् — that whose action marks another's time takes सप्तमी
    - term: सप्तमी
      en: locative
  - form: उदिते
    gloss: having risen
    notes:
    - term: कृदन्त
      en: a past participle (क्त), agreeing with सूर्ये in सप्तमी
    - term: सप्तमी
      en: locative
    - text: उद् + इ → उदित "risen"
  - form: कमलं
    gloss: the lotus
    notes:
    - cite: "8.3.23"
      role: मोऽनुस्वारः — word-final म् becomes anusvāra before a consonant → कमलं
    - term: कर्तृ
      en: subject of the main clause
    - term: प्रथमा
      en: nominative
    - term: नपुंसक
      en: neuter
  - form: विकसति
    lemma: कस्
    gloss: opens, blossoms
    notes:
    - term: कस्
      en: 'वि + कस् "open out"'
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  vyakhya: यस्य भावेन अन्यस्य भावः लक्ष्यते, तत्र सप्तमी — सति सप्तमी। सूर्ये उदिते इति कालः।
  vyakhya_en: |
    The "locative absolute" (सति सप्तमी): when one event fixes the *time* of another, the first stands — subject and participle together — in the locative (2.3.37). सूर्ये उदिते "the sun having risen" = "when the sun rose." It is Sanskrit's compact "when / while" clause: a noun + participle in सप्तमी, needing no conjunction.
