- id: ex055
  segment: 110
  sentence: विद्यया यशः।
  translation: Fame (comes) through learning.
  teaches: 'हेतु — the cause/motive takes तृतीया'
  words:
  - form: विद्यया
    lemma: विद्या
    gloss: through learning, because of learning
    notes:
    - term: हेतु
      en: cause — the reason for which something happens
    - cite: 2.3.23
      role: हेतौ — a word denoting the cause takes तृतीया (विद्यया यशः, धनेन कुलम्)
    - term: तृतीया
      en: instrumental — आ-stem feminine, विद्या → विद्यया
  - form: यशः
    lemma: यशस्
    gloss: fame
    notes:
    - term: कर्तृ
      en: subject (of an understood "arises")
    - term: प्रथमा
      en: nominative (स्-stem neuter → यशः)
  vyakhya: हेतौ तृतीया। विद्या हेतुः, तया यशः — विद्यया।
  vyakhya_en: |
    The cause or motive — "because of X" — takes the instrumental (2.3.23). विद्यया यशः "fame through learning," धनेन कुलम् "a family (raised) by wealth." It is the same तृतीया as instrument and accompaniment, now in a third sense: the reason. Note how much one case-ending does — the reader must read the *sense* from context, not the form alone.
