- id: ex001
  segment: 10
  sentence: नरः गच्छति।
  translation: The man goes.
  teaches: bare कर्तृ + verb; the प्रथमा as the base case
  words:
  - form: नरः
    gloss: the man
    notes:
    - term: कर्तृ
      en: agent
    - cite: 1.4.54
      role: नर is the कर्तृ — the independent agent
    - term: प्रथमा
      en: nominative
    - term: एकवचन
      en: singular
    - cite: 2.3.46
      role: प्रथमा for the bare prātipadika-sense → नरः
    - cite: 4.1.2
      role: 'सुप्: सु (nom.sg) on नर'
    - text: नर + सु, then नरस् → नरः
    - cite: 8.2.66
      role: 'नरस्: final स → रु'
    - cite: 8.3.15
      role: रु → visarga before pause → नरः
  - form: गच्छति
    lemma: गम्
    gloss: goes
    notes:
    - term: गम्
      en: '"go"'
    - term: धातु
      en: verbal root
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
    - cite: 3.2.123
      role: वर्तमाने लट् — present tense
    - term: तिप्
      en: 3rd person singular
    - cite: 3.4.78
      role: 'तिङ्: तिप् (3·sg) → ति'
  vyakhya: नरः स्वतन्त्रः, अतः प्रथमा।
  vyakhya_en: |
    Two words, and the second one is the verb. नरः is the man; गच्छति is what
    he does. The ः on the end of नरः is not decoration — it is the ending that
    marks him as the one acting, and Sanskrit will change that ending every time
    his part in the sentence changes. The next six sentences change nothing but
    that.
