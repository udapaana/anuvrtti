- id: ex002
  segment: 10
  sentence: नरः ग्रामम् गच्छति।
  translation: The man goes to the village.
  teaches: adds कर्मन् → द्वितीया
  words:
  - form: नरः
    lemma: नर
    gloss: the man
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: ग्रामम्
    lemma: ग्राम
    gloss: to the village
    notes:
    - term: कर्मन्
      en: object — what the agent reaches (the goal of motion)
    - cite: 1.4.49
      role: ग्राम is कर्मन् — what the agent reaches
    - term: द्वितीया
      en: accusative
    - term: एकवचन
      en: singular
    - cite: 2.3.2
      role: कर्मणि द्वितीया → ग्रामम्
  - form: गच्छति
    lemma: गम्
    gloss: goes
    notes:
    - term: गम्
      en: '"go"'
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  vyakhya: यत् कर्तुः ईप्सिततमम् तत् कर्मन्, कर्मणि द्वितीया।
  vyakhya_en: |
    One word longer than the last. ग्रामम् is where he is going, and the म् on
    the end says so — the village is what the going reaches. Change that ending
    and the village stops being the destination.
