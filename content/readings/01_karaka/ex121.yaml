- id: ex121
  segment: 50
  sentence: बालः पुष्पेभ्यः स्पृहयति।
  translation: The boy longs for flowers.
  teaches: 'special government: with स्पृह् "desire," the desired thing is सम्प्रदान → चतुर्थी'
  words:
  - form: बालः
    lemma: बाल
    gloss: the boy
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: पुष्पेभ्यः
    lemma: पुष्प
    gloss: for the flowers — the thing desired
    notes:
    - term: सम्प्रदान
      en: the desired object, treated as the goal of longing
    - cite: 1.4.36
      role: स्पृहेरीप्सितः — with स्पृह्, the desired thing is सम्प्रदान
    - term: चतुर्थी
      en: dative
    - cite: 2.3.13
      role: चतुर्थी सम्प्रदाने → पुष्पेभ्यः
    - term: बहुवचन
      en: plural
  - form: स्पृहयति
    lemma: स्पृह्
    gloss: longs for, desires
    notes:
    - term: स्पृह्
      en: '"desire, long for"'
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  vyakhya: स्पृहेः ईप्सितः सम्प्रदानम्। पुष्पेभ्यः स्पृहयति — न पुष्पाणि।
  vyakhya_en: |
    One expects the desired thing to be the object (कर्मन्, द्वितीया). But with स्पृह् "long for," Pāṇini names the desired thing सम्प्रदान — so it takes the चतुर्थी: पुष्पेभ्यः स्पृहयति "longs for flowers," not पुष्पाणि (1.4.36). Compare रुच् in ex120: a whole family of emotion-verbs routes their target through the dative.
