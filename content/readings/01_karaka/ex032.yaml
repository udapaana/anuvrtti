- id: ex032
  segment: 110
  sentence: पुत्रेण सह पिता आगच्छति।
  translation: The father comes with the son.
  teaches: 'सह "with" → the accompanying (subordinate) person takes तृतीया'
  words:
  - form: पुत्रेण
    gloss: with the son
    notes:
    - term: तृतीया
      en: instrumental — here the sense "along with"
    - cite: '2.3.19'
      role: सहयुक्तेऽप्रधाने — with सह, the accompanying (non-principal) thing takes तृतीया
    - term: एकवचन
      en: singular
  - form: सह
    gloss: with, together
    notes:
    - term: अव्यय
      en: indeclinable
    - text: the particle governing पुत्रेण
  - form: पिता
    lemma: पितृ
    gloss: the father
    notes:
    - term: कर्तृ
      en: agent (ऋ-stem nom.)
    - term: प्रथमा
      en: nominative
  - form: आगच्छति
    lemma: गम्
    gloss: comes
    notes:
    - term: गम्
      en: आ + गम् "come"
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  vyakhya: सहयोगे अप्रधाने तृतीया। पिता प्रधानम्, पुत्रः अप्रधानम् — पुत्रेण सह।
  vyakhya_en: |
    With सह "together," the secondary companion — not the principal actor — stands in the तृतीया: पुत्रेण सह "with the son." The father is principal (प्रधान, प्रथमा); the son accompanies (अप्रधान, तृतीया). The same case that named the instrument also names the companion.
