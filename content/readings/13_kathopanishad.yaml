    - term: लट्
      en: present (3sg)
  - form: ताः
    lemma: तद्
    gloss: these (cows)
    notes:
    - term: सर्वनाम
      en: pronoun (feminine)
    - term: कर्मन्
      en: object of ददत्
    - term: द्वितीया
      en: accusative plural
  - form: ददत्
    lemma: दा
    gloss: giving
    notes:
    - term: कृदन्त
      en: present participle (शतृ) of दा "give," reduplicating — "(while) giving"
    - term: शतृ
      en: the active present participle
    - term: विशेषण
      en: with सः
    - term: प्रथमा
