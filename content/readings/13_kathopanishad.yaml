    - term: बहुव्रीहि
      en: possessive — "whose milk-yield (दोह) is milked dry (दुग्ध)"
    - term: विशेषण
      en: describing the cows
    - term: प्रथमा
      en: nominative plural
  - form: निरिन्द्रियाः
