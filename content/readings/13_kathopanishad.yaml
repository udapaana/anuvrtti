    - cite: '3.2.124'
      role: लटः शतृशानचौ — शानच् replaces लट् in the आत्मनेपद/passive → नीयमान
    - term: शानच्
      en: the middle/passive present participle
    - term: विशेषण
      en: with दक्षिणासु
    - term: सप्तमी
      en: locative plural
    rel:
    - kind: विशेषण
      to: 4
  - form: श्रद्धा
    lemma: श्रद्धा
    gloss: faith
    vocab: true
    notes:
    - term: कर्तृ
      en: subject — "faith entered (him)"
    - term: प्रथमा
      en: nominative (आ-stem feminine)
  - form: आविवेश
    lemma: विश्
    gloss: entered
    vocab: true
    notes:
    - cite: '3.2.115'
      role: परोक्षे लिट् — the perfect of आ-विश् "enter" → आविवेश
    - term: लिट्
      en: perfect (3sg)
  - form: सः
    lemma: तद्
    gloss: he
    notes:
    - term: सर्वनाम
      en: pronoun
    - term: कर्तृ
      en: subject
    - term: प्रथमा
      en: nominative
  - form: अमन्यत
    lemma: मन्
    gloss: thought, reflected
    notes:
    - term: लङ्
      en: past (आत्मनेपद 3sg)
  vyakhya: 'भावलक्षणसप्तमी। दक्षिणासु नीयमानासु इति सतिसप्तमी (यस्य च भावेन…) — नीयमानासु इति नियतेः कर्मणि शानच्। सन्तम् इति अस्तेः शतृ। आविवेश इति विशेः लिट्; अमन्यत इति मनेः लङ्।'
  vyakhya_en: |
    A **locative absolute**, and this time in the plural: दक्षिणासु नीयमानासु,
    "the (sacrificial) gifts being led out" — both noun and participle in the
    locative (2.3.37). नीयमानासु is a *passive* present participle (शानच् on the
    passive stem नीय-), "being led." सन्तम् is the शतृ of अस्, "(him) being (a
    boy)." The perfect आविवेश "entered" carries the strange event — श्रद्धा,
    "faith," enters a child — and अमन्यत "he thought" (imperfect) hands us to his
    reflection in the next verse.
- id: ku0103
  kind: attested
  segment: 422
  source:
    text: कठोपनिषद्
    ref: "Kaṭha Upaniṣad 1.1.3 — the worthless cows"
    curated: "the whole verse, verbatim and unaccented; word-separated (pausa forms). From GRETIL's edition of Olivelle 1998 (sa_kathopaniSad, KaU 1.3)."
  sentence: पीतोदकाः जग्धतृणाः दुग्धदोहाः निरिन्द्रियाः। अनन्दाः नाम ते लोकाः तान् सः गच्छति ताः ददत्॥
  translation: Their water drunk, their grass eaten, their milk milked dry, barren — joyless indeed are the worlds he goes to, giving away such (cows).
  teaches: |
    four बहुव्रीहि compounds in a line, each describing the useless cows —
    पीतोदकाः "whose water is drunk," जग्धतृणाः "whose grass is eaten" — and the
    boy's thought that a gift like this leads only to joyless worlds.
  words:
  - form: पीतोदकाः
    lemma: पीतोदक
    gloss: their water drunk
    vocab: true
    notes:
    - text: 'विग्रह: पीतम् उदकम् याभिः — "by which the water has been drunk"'
    - term: बहुव्रीहि
      en: possessive — "(cows) whose water (उदक) has been drunk (पीत)"
    - term: विशेषण
      en: describing the given cows
    - term: प्रथमा
      en: nominative plural
  - form: जग्धतृणाः
    lemma: जग्धतृण
    gloss: their grass eaten
    vocab: true
    notes:
    - text: 'विग्रह: जग्धम् तृणम् याभिः — "by which the grass has been eaten"'
    - term: बहुव्रीहि
      en: possessive — "whose grass (तृण) has been eaten (जग्ध)"
    - term: विशेषण
      en: describing the cows
    - term: प्रथमा
      en: nominative plural
  - form: दुग्धदोहाः
