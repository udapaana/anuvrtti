- id: ku0101
  kind: attested
  segment: 420
  source:
    text: कठोपनिषद्
    ref: "Kaṭha Upaniṣad 1.1.1 — Naciketas is born"
    curated: "the whole verse, verbatim and unaccented; word-separated (pausa forms). Every form is the text's. From GRETIL's edition of Olivelle 1998 (sa_kathopaniSad, KaU 1.1)."
  sentence: उशन् ह वै वाजश्रवसः सर्ववेदसम् ददौ। तस्य ह नचिकेता नाम पुत्र आस॥
  translation: Desiring (its reward), Vājaśravasa gave away all his wealth. He had a son named Naciketas.
  teaches: |
    the opening of an Upaniṣad tale, and its two signatures — the perfect tense
    of narration (ददौ "gave," आस "was") and the little Vedic story-particles ह
    वै, which a reader learns to read straight past.
  words:
  - form: उशन्
    lemma: वश्
    gloss: desiring (the reward)
    vocab: true
    notes:
    - term: कृदन्त
      en: present participle (शतृ) of वश् "wish, desire" — "one who desires (the fruit of the gift)"
    - term: विशेषण
      en: with वाजश्रवसः / the giver
    - term: प्रथमा
      en: nominative
  - form: ह
    lemma: ह
    gloss: (narrative particle)
    notes:
    - term: अव्यय
      en: a particle of past narration, common in Upaniṣad/Brāhmaṇa prose — often left untranslated
  - form: वै
    lemma: वै
    gloss: verily, indeed
    notes:
    - term: अव्यय
      en: emphatic particle — like ह, a mark of the register more than of the sense
  - form: वाजश्रवसः
    lemma: वाजश्रवस्
    gloss: Vājaśravasa (son of Vājaśravas)
    vocab: true
    notes:
    - term: सम्बन्ध
      en: the descendant "of Vājaśravas" — the giver, named by his lineage
    - term: षष्ठी
      en: genitive (स्-stem वाजश्रवस् → वाजश्रवसः)
  - form: सर्ववेदसम्
    lemma: सर्ववेदस्
    gloss: all his wealth
    vocab: true
    notes:
    - text: 'विग्रह: सर्वम् वेदसम् — "all (his) property"'
    - term: समास
      en: compound — सर्व "all" + वेदस् "wealth, possessions"
    - term: कर्मन्
      en: what was given
    - term: द्वितीया
      en: accusative
  - form: ददौ
    lemma: दा
    gloss: gave (away)
    vocab: true
    notes:
    - cite: '3.2.115'
      role: परोक्षे लिट् — for the remote past, the लिट् (perfect); दा reduplicates → द-दौ
    - term: लिट्
      en: perfect (3sg)
  - form: तस्य
    lemma: तद्
    gloss: his
    notes:
    - term: सर्वनाम
      en: pronoun
    - term: सम्बन्ध
      en: "his (son)"
    - term: षष्ठी
      en: genitive
  - form: नचिकेता
    lemma: नचिकेतस्
    gloss: Naciketas
    vocab: true
    notes:
    - term: कर्तृ
      en: subject
    - term: प्रथमा
      en: nominative (स्-stem नचिकेतस् → नचिकेता)
  - form: नाम
    lemma: नाम
    gloss: by name
    notes:
    - term: अव्यय
      en: '"by name" — marks the preceding as a name'
  - form: पुत्र
    lemma: पुत्र
    gloss: a son
    notes:
    - term: कर्तृ
      en: in apposition to नचिकेता (पुत्रः → पुत्र, visarga dropped before आ)
    - term: प्रथमा
      en: nominative
  - form: आस
    lemma: अस्
    gloss: there was, he had
    vocab: true
    notes:
    - cite: '3.2.115'
      role: परोक्षे लिट् — the perfect of अस् "be" → आस
    - term: लिट्
      en: perfect (3sg)
  vyakhya: 'उपनिषदाख्यानस्य आरम्भः। ददौ आस इति लिटि प्रथमपुरुषैकवचने (परोक्षे लिट्)। ह वै इति आख्यायिकायाम् निपातौ। उशन् इति वशेः शतृ। पुत्र आस इति विसर्गलोपे "पुत्रः आस"।'
  vyakhya_en: |
    An Upaniṣad opens the way its stories do — in the **perfect**, the tense of
    the remote, handed-down past: ददौ "he gave," आस "there was" (both 3.2.115).
    And it carries the two particles that flavour this register, ह and वै — Vedic
    narrative markers with almost no translatable weight; the reader's job is to
    see them and move on. उशन् "desiring" is the शतृ participle of वश्, and पुत्र
    (for पुत्रः, its visarga dropped before आ) sits in apposition to नचिकेता.
- id: ku0102
  kind: attested
  segment: 421
  source:
    text: कठोपनिषद्
    ref: "Kaṭha Upaniṣad 1.1.2 — faith enters the boy"
    curated: "the whole verse, verbatim and unaccented; word-separated (श्रद्धाविवेश and सोऽमन्यत shown split at their word-boundaries, sandhi noted). From GRETIL's edition of Olivelle 1998 (sa_kathopaniSad, KaU 1.2)."
  sentence: तम् ह कुमारम् सन्तम् दक्षिणासु नीयमानासु श्रद्धा आविवेश। सः अमन्यत॥
  translation: While he was still a boy, as the sacrificial gifts were being led out, faith entered him — and he thought.
  teaches: |
    a locative absolute in the plural — दक्षिणासु नीयमानासु "the gifts being led
    out" — with a passive present participle (नीयमानासु); and the perfect आविवेश
    "entered," closing on the imperfect अमन्यत "he thought."
  words:
  - form: तम्
    lemma: तद्
    gloss: him
    notes:
    - term: सर्वनाम
      en: pronoun
    - term: कर्मन्
      en: object
    - term: द्वितीया
      en: accusative
  - form: ह
    lemma: ह
    gloss: (narrative particle)
    notes:
    - term: अव्यय
      en: Vedic particle of past narration
  - form: कुमारम्
    lemma: कुमार
    gloss: a boy
    vocab: true
    notes:
    - term: कर्मन्
      en: "him, (being) a boy"
    - term: द्वितीया
      en: accusative
  - form: सन्तम्
    lemma: अस्
    gloss: being, while (he was)
    notes:
    - term: कृदन्त
      en: present participle (शतृ) of अस् "be," agreeing with कुमारम्
    - cite: '3.2.124'
      role: लटः शतृशानचौ — the शतृ participle replaces लट् → सत् → सन्तम्
    - term: शतृ
      en: the active present participle
    - term: विशेषण
      en: qualifying कुमारम्
    - term: द्वितीया
      en: accusative
    rel:
    - kind: विशेषण
      to: 2
  - form: दक्षिणासु
    lemma: दक्षिणा
    gloss: (as) the sacrificial gifts
    vocab: true
    notes:
    - cite: '2.3.37'
      role: यस्य च भावेन भावलक्षणम् — the noun of a locative-absolute clause stands in the सप्तमी → दक्षिणासु … नीयमानासु
    - term: अधिकरण
      en: the absolute locus
    - term: सप्तमी
