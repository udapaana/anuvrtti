# ════════════════════════════════════════════════════════════════════════
#  syllabus.yaml — the THIN skeleton of the reader.
#
#  Purpose: just enough structure to (a) order topics pedagogically, (b) tell
#  us "what's left in this topic / are we done with X." It is NOT a full
#  partition of all 3,983 sūtras — a learner's grammar doesn't cover every
#  taddhita affix or phonological micro-rule. Each topic pins the sūtra
#  RANGE(S) that DEFINE it (its saṃjñā/vidhi core); the ledger reports
#  coverage WITHIN those ranges. Pending refs in a topic's range = what's
#  left to write for that topic.
#
#  Order follows the Aṣṭādhyāyī's own conceptual order (= broadly pedagogical),
#  not a Western outline. Topic N uses only grammar from topics ≤ N (graded).
#
#  Granularity rule: FIRM at the top, DISCOVERED toward the leaves. Detail the
#  chapters in progress + the next one; leave later chapters as coarse stubs.
#  Subtopics get added as the writing reveals the right boundaries — do not
#  outline a chapter to its leaves before writing any of it.
#
#  status: done | in_progress | next | stub
#  Each topic: id, title, sutra ranges (defining core), prerequisites, the
#  reading ids (from readings.yaml) that serve it, and a status.
# ════════════════════════════════════════════════════════════════════════

chapters:

  # ── 1. कारक — the semantic roles and their cases ──────────────────────
  - id: karaka
    title: "कारक — the roles a noun plays, and the case each takes"
    ranges: ["1.4.23-1.4.55", "2.3.1-2.3.73"]   # role saṃjñās + विभक्ति assignment
    prereqs: []
    status: in_progress
    subtopics:
      - id: karaka.roles
        title: "the six कारकas + शेष (कर्तृ कर्मन् करण सम्प्रदान अपादान अधिकरण; षष्ठी)"
        ranges: ["1.4.23-1.4.55"]
        readings: [ex001, ex002, ex003, ex004, ex005, ex006, ex007]
        status: done
      - id: karaka.vibhakti
        title: "which विभक्ति each role takes (कर्मणि द्वितीया etc.) + sense-government"
        ranges: ["2.3.1-2.3.50"]
        readings: [ex001, ex002, ex003, ex004, ex005, ex006, ex007, ex021, ex022, ex032, ex033, ex052, ex053, ex054, ex055, ex056, ex057, ex058, ex059]
        status: in_progress
        note: "core cases + idioms done; sense-rule batch (गत्यर्थ 2.3.12, अत्यन्तसंयोग 2.3.5, सह 2.3.19, हेतु 2.3.23, विना 2.3.32, सति-सप्तमी 2.3.37, कृत्-षष्ठी 2.3.65) added; remaining 2.3 micro-rules are the tail"

  # ── 2. सुप् — nominal declension (the paradigms) ──────────────────────
  - id: sup
    title: "सुप् — nominal declension: stem-classes × विभक्ति × वचन"
    ranges: ["4.1.1-4.1.2", "7.1.1-7.3.120"]   # सुप् intro + the अङ्ग operations that build forms
    prereqs: [karaka]
    status: in_progress
    note: "This is Track B (paradigms = DAG-verified). Subtopics = stem-classes."
    subtopics:
      - id: sup.number
        title: "वचन — singular / dual / plural (the number axis)"
        ranges: ["1.4.21-1.4.22"]
        readings: [ex011, ex012, ex013]
        status: done
      - id: sup.a_masc
        title: "अ-stem masculine (नर, राम) — the model paradigm"
        ranges: ["6.1.102", "7.1.9"]   # nom.pl, instr.pl so far; full DAG in paradigms/a_masc.dag.yaml
        readings: [ex001, ex011, ex012, ex013]
        status: in_progress
        note: "partial — only the cells the readings have hit; full paradigm is the DAG"
      - id: sup.a_neut
        title: "अ-stem neuter (फल) — प्रथमा = द्वितीया"
        ranges: ["7.1.23-7.1.24", "7.1.20", "7.1.72"]
        readings: [ex008, ex009, ex013]
        status: in_progress
      - id: sup.i_fem
        title: "ई-stem feminine (नदी) — ङीप् stems"
        ranges: ["4.1.3-4.1.5", "7.3.116"]
        readings: [ex010]
        status: in_progress
      - id: sup.i_masc
        title: "इ-stem masculine (अग्नि) — गुण in the oblique (अग्नये, अग्नयः)"
        ranges: ["7.3.109", "7.3.111"]
        readings: [ex029, ex030, ex031]
        status: in_progress
      - id: sup.r_stem
        title: "ऋ-stem (पितृ, कर्तृ) — kinship & agent nouns; ऋ → गुण अर्"
        ranges: ["7.1.94", "7.3.110"]
        readings: [ex043, ex044]
        status: in_progress
      - id: sup.pronoun
        title: "सर्वनाम — pronouns (तद्/यद्): सः, तस्मै, the यः…सः frame"
        ranges: ["1.1.27", "7.1.14", "7.2.102"]
        readings: [ex045, ex046, ex047]
        status: in_progress
      - id: sup.u_stem
        title: "उ-stem (गुरु) — same गुण rule as इ-stem, उ → ओ (गुरवे, गुरवः)"
        ranges: ["7.3.111", "7.3.109"]
        readings: [ex048, ex049]
        status: in_progress
      - id: sup.consonant
        title: "consonant stems — न-stem राजन् (strong/weak), अस्-stem neuter मनस्"
        ranges: ["8.2.7", "6.4.8", "6.4.134", "6.4.14"]
        readings: [ex066, ex067, ex068, ex069]
        status: in_progress
        note: "राजन् across न-loss (राजा) / strong (राजानम्) / weak अ-loss (राज्ञः); मनस् neuter (मनः). More consonant families (मत्/वत्, इन्, अञ्च्) are the tail"
      - id: sup.other
        title: "remaining stem-classes (मत्/वत्-stems, इन्-stems, ऋ-stem plurals, dual cells)"
        ranges: []
        readings: []
        status: stub

  # ── 3. तिङ् — verbal conjugation ──────────────────────────────────────
  - id: tin
    title: "तिङ् — verbal conjugation: पुरुष × वचन × लकार"
    ranges: ["1.4.99-1.4.102", "3.2.110-3.4.78"]   # पद/पुरुष saṃjñās + लकार vidhi + endings
    prereqs: [karaka]
    status: in_progress
    note: "noun frame (sup) and verb frame (tin) are parallel; can interleave"
    subtopics:
      - id: tin.frame
        title: "the तिङ् frame — three पुरुष × three वचन, परस्मै/आत्मनेपद"
        ranges: ["1.4.99-1.4.102", "3.4.78"]
        readings: [ex014, ex015]
        status: in_progress
      - id: tin.lat
        title: "लट् — the present tense (वर्तमाने लट्)"
        ranges: ["3.2.123"]
        readings: [ex001, ex014, ex015]
        status: in_progress
      - id: tin.past
        title: "the past — लङ् (imperfect), लिट् (perfect), लुङ् (aorist), by remoteness"
        ranges: ["3.2.110-3.2.115"]
        readings: [ex016, ex027, ex060, ex061, ex062]
        status: in_progress
        note: "all three pasts now contrasted by remoteness — लङ् not-today (ex060), लिट् remote/परोक्ष (ex061), लुङ् general/today (ex062); full ending derivations are Track B"
      - id: tin.future
        title: "future — लृट् (general) and लुट् (not-today)"
        ranges: ["3.3.13", "3.3.15"]
        readings: [ex028, ex063]
        status: in_progress
        note: "लृट् general (ex028) + लुट् anadyatana periphrastic (ex063); the today/not-today split mirrors the past"
      - id: tin.mood
        title: "mood — लोट् (imperative), विधिलिङ् (optative), आशीर्लिङ् (benedictive)"
        ranges: ["3.3.161", "3.3.162", "3.3.173"]
        readings: [ex041, ex042, ex064, ex065]
        status: in_progress
        note: "imperative + optative (ex041/042) + विधिलिङ् vs आशीर्लिङ् contrast (ex064 कुर्यात् / ex065 क्रियात्)"
      - id: tin.other
        title: "remaining: conditional लृङ्, voice/पद detail, full ending paradigms"
        ranges: []
        readings: []
        status: stub

  # ── 4. सन्धि — the phonological rules (shared DAG tail) ────────────────
