# ════════════════════════════════════════════════════════════════════════
#  syllabus.yaml — the THIN skeleton of the reader.
#
#  Purpose: just enough structure to (a) order topics pedagogically, (b) tell
#  us "what's left in this topic / are we done with X." It is NOT a full
#  partition of all 3,983 sūtras — a learner's grammar doesn't cover every
#  taddhita affix or phonological micro-rule. Each topic pins the sūtra
#  RANGE(S) that DEFINE it (its saṃjñā/vidhi core); the ledger reports
#  coverage WITHIN those ranges. Pending refs in a topic's range = what's
#  left to write for that topic.
#
#  Order follows the Aṣṭādhyāyī's own conceptual order (= broadly pedagogical),
#  not a Western outline. Topic N uses only grammar from topics ≤ N (graded).
#
#  Granularity rule: FIRM at the top, DISCOVERED toward the leaves. Detail the
#  chapters in progress + the next one; leave later chapters as coarse stubs.
#  Subtopics get added as the writing reveals the right boundaries — do not
#  outline a chapter to its leaves before writing any of it.
#
#  ── numbering conventions (read before authoring) ──────────────────────
#
#  `segment` is the AUTHORED difficulty tier, numbered in TENS (10, 20, 30…).
#  The ×10 spacing is deliberate: tiers were once packed 1..57 with no gaps,
#  so inserting a consolidation passage between two tiers meant renumbering
#  every reading above it. Number new tiers in 10s and use the nine slots
#  between (71..79) for anything that must sit inside an existing tier.
#  The reader never displays `segment` — the build derives a dense
#  `position` (1..n) on every rebuild, so display order cannot drift.
#
#  `id` (ex001, rd001…) is AUTHORING order and nothing more. It disagrees
#  with pedagogical order on ~33% of pairs — ex119-130 were written late but
#  belong at tier 50 — so never read an id as a sequence, and never renumber
#  ids to "fix" the disagreement: the next batch authored into an early tier
#  would break it again. Ids are permanent labels; `segment` is the order.
#  Optional `order:` breaks ties within one tier when sequence matters.
#
#  ── register of the `vyakhya_en` note ──────────────────────────────────
#
#  The note is for the reader who has just met this sentence, NOT for someone
#  who already knows the grammar. ex001's note used to read:
#
#    "The agent acting on its own stands in the प्रथमा — the base case."
#
#  which restates the rule in the metalanguage and explains नरः to someone who
#  already knows what प्रथमा is. The first sentence in the reader cannot assume
#  that word. Rewritten, it points at what is on the page instead:
#
#    "The ः on the end of नरः is not decoration — it is the ending that marks
#     him as the one acting."
#
#  The word-level glosses already carry the technical names (प्रथमा=nominative
#  sits right there in the notes). The note's job is to say what the sentence
#  DOES, in words the reader has. Name a term only where the reading itself
#  introduces it, and prefer pointing at a form the reader can see —
#  ग्रामम् / ग्रामात् / ग्रामे — over naming the rule that produced it.
#
#  Two habits to avoid, both caught late because the note reads fine in
#  isolation and only looks wrong beside the reading:
#
#    - A CLOSING PARAGRAPH THAT RESTATES THE FIRST. ex182 ended "Together, the
#      endings carry the whole difference" after a paragraph that had already
#      shown ग्रामे / ग्रामात् / ग्रामम् doing exactly that. If the second
#      paragraph does not point at something new in the text — a non-adjacent
#      trigger, a word that will not unpack — it is padding. Cut it.
#    - EXPLAINING THE METHOD rather than the Sanskrit. "That difference is what
#      consolidation means", "presented as a minimal pair, this looks like an
#      irregularity" — those describe how the corpus is built. So does
#      "already met", which is the same corpus-scaffolding tic as the banned
#      `teaches` phrasing, in longer form.
#
#  `bun run check:register` reports technical terms used in a note before any
#  reading has introduced them.
#
#  ── register of the `teaches` line ─────────────────────────────────────
#
#  `teaches` is READER-FACING. It says what is in this reading, in the voice
#  of someone describing a text — not notes to a fellow author. A full sweep
#  of all 223 lines fixed four habits; they are easy to slip back into:
#
#    - Caps for emphasis (REAL, NOT, FULL, WEAK, DECLINES). Italics do not
#      exist here, so caps became a shout. Rewrite so the sentence carries
#      the emphasis.
#    - Corpus-internal references — "minimal pair with ex122", "vs the
#      ओ-outcome of ex155", "parallel to the देव table (ex094)". The reader
#      has no ids and no tier numbers. Name the contrast, not the row.
#    - Build vocabulary — "reference-fill", "cell", "foil", "the batch",
#      "the special-government wall". These describe the corpus as a
#      construction project.
#    - `+`-chained feature lists: "a simile + सम्प्रदान dative + imperatives".
#      That is a changelog. Write the sentence.
#    - LENGTH. The corpus median is ~78 characters. Passages authored later
#      drifted to a median of 260 and a maximum of 409 — four times the
#      inherited lines — by narrating what the passage is FOR rather than
#      naming what is in it. Say the one thing worth noticing and stop.
#    - "meeting" a rule, "grammar already met", "at volume", "the reader".
#      A reader does not meet a case; they read a sentence. These describe the
#      corpus's construction, not the text on the page.
#
#  Scaffolding facts belong in `note`, never in `teaches`: that rd001 is the
#  "first REAL sentence" is a fact about how the corpus was built, and a
#  learner neither knows nor cares that the previous 164 were manufactured.
#
#  status: done | in_progress | next | stub
#  Each topic: id, title, sutra ranges (defining core), prerequisites, the
#  reading ids (from readings.yaml) that serve it, and a status.
# ════════════════════════════════════════════════════════════════════════

