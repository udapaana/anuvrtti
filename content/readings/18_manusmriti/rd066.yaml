  vyakhya: 'सङ्ख्यासम्बन्धप्रधानः श्लोकः। चत्वारि इति चतुःशब्दस्य नपुंसके प्रथमा — विशेष्यानुसारि। अभिवादनशीलस्य वृद्धोपसेविनः तस्य इति सम्बन्धे षष्ठी ("यस्य वर्धन्ते")। आयुः यशः इति सान्तनपुंसकानि। वर्धन्ते इति वृधेः आत्मनेपदे।'
  vyakhya_en: |
    A verse of increase. **चत्वारि** "four" is the numeral in action — चतुर्
    declines, and in the neuter (agreeing with the four neuter/mixed nouns) it is
    चत्वारि. The two long genitives — अभिवादनशीलस्य "of the salutation-natured,"
    वृद्धोपसेविनः "of the elder-serving," picked up by तस्य "his" — name the
    *person for whom* the growth happens (Sanskrit's genitive of the beneficiary).
    And the four that grow are स्-stem and neuter nominatives: आयुः, धर्मः, यशः,
    बलम्, with the आत्मनेपद वर्धन्ते "they increase."
