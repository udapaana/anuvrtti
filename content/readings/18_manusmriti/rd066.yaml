  sentence: अभिवादनशीलस्य नित्यम् वृद्धोपसेविनः। चत्वारि तस्य वर्धन्ते आयुः धर्मः यशः बलम्॥
  translation: For one whose habit is salutation, ever attending on elders, four things increase — lifespan, dharma, fame, and strength.
