  sentence: यत्र नार्यः तु पूज्यन्ते रमन्ते तत्र देवताः। यत्र एताः तु न पूज्यन्ते सर्वाः तत्र अफलाः क्रियाः॥
  translation: Where women are honored, there the gods rejoice; where they are not honored, all rites are fruitless.
  teaches: |
    the passive voice on the page — पूज्यन्ते "are honored," with the यक्
    passive-marker, the honored women standing as the grammatical subject; and
    a यण्-सन्धि (नारी → नार्यः) and a नञ्-compound (अफलाः "fruitless").
