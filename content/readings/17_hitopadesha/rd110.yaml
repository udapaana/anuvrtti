  vyakhya: 'दमनकवचनम्। अत्युच्छ्रिते मन्त्रिणि पार्थिवे च इति अधिकरणे सप्तमी; मन्त्रिणि इति इन्नन्तस्य सप्तम्येकवचनम्। स्त्रीस्वभावात् इति हेतौ पञ्चमी। तयोः द्वयोः इति निर्धारणे षष्ठी, एकतरम् इति कर्म।'
  vyakhya_en: |
    Damanaka's warning to the lion-king, in a verse on royal Fortune (श्री). She
    stands with one foot on the king and one on the minister — the two
    locatives पार्थिवे and **मन्त्रिणि**. मन्त्रिन् is an इन्-stem: the locative
    ending इ attaches directly, and न् turns ण् after the र्, मन्त्रिणि. When
    both are over-raised (अत्युच्छ्रिते), the stance cannot hold: she, unable to
    bear the weight (असहा भरस्य), lets go of one of the two — तयोः द्वयोः
    एकतरम्, the genitive of the whole and the pronominal एकतर "one of two."
