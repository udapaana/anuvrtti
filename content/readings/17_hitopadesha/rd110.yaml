  source:
    text: हितोपदेश
    ref: "Hitopadeśa 2.127 — Fortune cannot carry two"
    curated: "the whole verse, word-separated (pausa forms; compounds kept whole). From GRETIL (sa_nArAyaNa-hitopadeza, hit_2.127). Damanaka warns the lion-king that Saṃjīvaka, his one all-powerful minister, now covets the throne."
  sentence: अत्युच्छ्रिते मन्त्रिणि पार्थिवे च विष्टभ्य पादौ उपतिष्ठते श्रीः। सा स्त्रीस्वभावात् असहा भरस्य तयोः द्वयोः एकतरम् जहाति॥
  translation: When minister and king are both raised too high, Fortune stands with a foot planted on each; but she, by a woman's nature unable to bear the load, lets one of the two fall.
  teaches: |
    the locative singular of an इन्-stem — मन्त्रिणि "on the minister" (मन्त्रिन्
    + इ, न् → ण्), beside पार्थिवे, both the ground Fortune stands on; an
    ablative of cause, स्त्रीस्वभावात्; and a genitive of the whole, तयोः द्वयोः
    एकतरम् "one of the two."
