  vyakhya: 'विध्यर्थ-घञ्-सतिसप्तमीनां श्लोकः। उत्सृजेत् इति विधिलिङ् (विधिनिमन्त्रण… लिङ्)। त्यागः इति त्यजेः भावे घञ्। विनाशे नियते सति इति भावलक्षणसप्तमी। परार्थे सन्निमित्ते इति निमित्तसप्तम्यौ। धनानि इति नपुंसकशसि शिः।'
  vyakhya_en: |
    A maxim of sacrifice, and three constructions you now know well. The
    **optative** उत्सृजेत् "should give up" (3.3.161) — the mood of counsel. The
    **भावे घञ्** action-noun त्यागः "renunciation" (3.3.18), from त्यज्. And a
    **locative absolute** of impending doom: विनाशे नियते सति, "destruction being
    made certain" (2.3.37, with सति again the participle of अस्). Even the two
    सप्तमीs परार्थे / सन्निमित्ते are worth marking — the locative of purpose, "for
    the sake of."
