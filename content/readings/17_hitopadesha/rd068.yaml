  source:
    text: हितोपदेश
    ref: "Hitopadeśa 1.44 — the wise give up all for a cause"
    curated: "the whole verse, word-separated (pausa forms; चैव kept fused to show the सन्धि); every form is the text's. From Ambuda's GRETIL edition (ambuda-org/gretil, sa_nArAyaNa-hitopadeza, Hit_1.44)"
  sentence: धनानि जीवितम् चैव परार्थे प्राज्ञः उत्सृजेत्। सन्निमित्ते वरम् त्यागः विनाशे नियते सति॥
  translation: For another's sake the wise would give up riches, and even life; when destruction is certain, sacrifice for a worthy cause is the better course.
  teaches: |
    the optative of counsel उत्सृजेत् "one should give up"; the भावे-घञ् action-
    noun त्यागः "renunciation"; and a locative absolute of foreboding — विनाशे
    नियते सति, "destruction being certain."
