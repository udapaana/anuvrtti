- id: rd038
  kind: attested
  segment: 275
  source:
    text: हितोपदेश
    ref: "Hitopadeśa, मित्रलाभ — the frame of the कथामुख"
    curated: "the opening of the frame story, lightly abridged; the words are the text's own"
  sentence: अस्ति भागीरथीतीरे पाटलिपुत्रनामधेयं नगरम्। तत्र सर्वस्वामिगुणोपेतः सुदर्शनो नाम नरपतिः आसीत्। सः भूपतिः एकदा केनचित् पठ्यमानं श्लोकद्वयं शुश्राव।
  translation: There is, on the bank of the Bhāgīrathī, a city named Pāṭaliputra. There lived a king called Sudarśana, endowed with every quality of a sovereign. One day that lord of the earth heard two verses being recited by someone.
  teaches: |
    the Hitopadeśa frame opens. Three long compounds — भागीरथीतीरे,
    पाटलिपुत्रनामधेयं, सर्वस्वामिगुणोपेतः — of the kind classical prose runs on.
  words:
  - form: अस्ति
    lemma: अस्
    gloss: there is
    notes:
    - term: लट्
      en: 'present — the storyteller''s opening, "there is / there was"'
  - form: भागीरथीतीरे
    lemma: भागीरथीतीर
    gloss: on the bank of the Bhāgīrathī
    vocab: true
    notes:
    - term: षष्ठी-तत्पुरुष
      en: 'भागीरथ्याः तीरे — "the bank OF the Gaṅgā", compounded'
    - term: अधिकरण
      en: locus
    - term: सप्तमी
      en: locative
  - form: पाटलिपुत्रनामधेयं
    lemma: पाटलिपुत्रनामधेय
    gloss: named Pāṭaliputra
    vocab: true
    notes:
    - cite: "8.3.23"
      role: मोऽनुस्वारः — word-final म् becomes anusvāra before a consonant → पाटलिपुत्रनामधेयं
    - term: बहुव्रीहि
      en: '"having Pāṭaliputra as its name" — the compound describes the city, not itself'
    - term: प्रथमा
      en: neuter nominative, agreeing with नगरम्
  - form: नगरम्
    lemma: नगर
    gloss: a city
    notes:
    - term: प्रथमा
      en: neuter nominative — what अस्ति asserts the existence of
    - cite: "7.1.24"
      role: अतोऽम् — the neuter अ-stem takes अम् in प्रथमा and द्वितीया → नगरम्
  - form: तत्र
    lemma: तत्र
    gloss: there
    notes:
    - term: अव्यय
      en: indeclinable
  - form: सर्वस्वामिगुणोपेतः
    lemma: सर्वस्वामिगुणोपेत
    gloss: endowed with every quality of a sovereign
    vocab: true
    notes:
    - term: तत्पुरुष
      en: सर्वस्वामिगुणैः उपेतः — a four-member compound, resolved from the end backwards
    - term: निष्ठा
      en: 'उपेत is a past participle — "come near to, endowed with"'
    - term: प्रथमा
      en: nominative, agreeing with नरपतिः
  - form: सुदर्शनो
    lemma: सुदर्शन
    gloss: Sudarśana
    vocab: true
    notes:
    - term: सन्धि
      en: सुदर्शनः + नाम — the visarga becomes ओ before a voiced sound
    - term: प्रथमा
      en: nominative
  - form: नाम
    lemma: नामन्
    gloss: by name
    notes:
    - term: अव्यय
      en: '"by name" — in apposition, not declined'
  - form: नरपतिः
    lemma: नरपति
    gloss: a king
    vocab: true
    notes:
    - term: षष्ठी-तत्पुरुष
      en: 'नराणां पतिः — "lord of men"'
    - term: प्रथमा
      en: nominative
  - form: आसीत्
    lemma: अस्
    gloss: was
    notes:
    - term: लङ्
      en: past of अस् — the frame shifts from अस्ति to आसीत्
  - form: सः
    lemma: तद्
    gloss: that
    notes:
    - term: सर्वनाम
      en: pronoun
    - term: प्रथमा
      en: nominative
  - form: भूपतिः
    lemma: भूपति
    gloss: lord of the earth
    vocab: true
    notes:
    - term: षष्ठी-तत्पुरुष
      en: भुवः पतिः — a second compound for the same man, as classical prose prefers
    - term: प्रथमा
      en: nominative
  - form: एकदा
    lemma: एकदा
    gloss: one day
    notes:
    - term: अव्यय
      en: indeclinable
  - form: केनचित्
    lemma: किम्
    gloss: by someone
    notes:
    - term: सर्वनाम
      en: pronoun
    - term: कर्तृ
      en: the agent of the passive participle — who was doing the reciting
    - term: तृतीया
      en: instrumental, with the indefinite particle चित्
  - form: पठ्यमानं
    lemma: पठ्
    gloss: being recited
    notes:
    - term: शानच्
      en: the present participle of the PASSIVE — पठ् + य + मान
    - term: यक्
      en: the passive विकरण — what is recited, not who recites
    - cite: "3.1.67"
      role: सार्वधातुके यक् — यक् in the passive → पठ्यमान
  - form: श्लोकद्वयं
    lemma: श्लोकद्वय
    gloss: two verses
    vocab: true
    notes:
    - cite: "8.3.23"
      role: मोऽनुस्वारः — word-final म् becomes anusvāra before a consonant → श्लोकद्वयं
    - term: द्विगु
      en: द्वौ श्लोकौ — a numeral compound, taken as a single neuter aggregate
    - term: कर्मन्
      en: object of शुश्राव
    - term: द्वितीया
      en: accusative
  - form: शुश्राव
    lemma: श्रु
    gloss: heard
    notes:
    - term: लिट्
      en: the perfect — reduplicated श्रु → शुश्राव, the narrative past of a told tale
    - cite: "3.2.115"
      role: परोक्षे लिट् — the perfect for a past outside the speaker's sight → शुश्राव
  vyakhya: कथामुखम् — अस्ति इति आरम्भः। समासबहुला गद्यरीतिः।
  vyakhya_en: |
    Up to here the attested readings have been single-line maxims. This is
    narrative, and it moves differently: three of its nouns are compounds
    several members deep — भागीरथीतीरे, सर्वस्वामिगुणोपेतः, पाटलिपुत्रनामधेयं —
    and unpacking them is most of the work of reading classical prose.

    Take सर्वस्वामिगुणोपेतः from the back: उपेत, "endowed with"; endowed with
    गुण, qualities; whose qualities — those of a सर्वस्वामिन्, an absolute
    lord. English needs a clause where Sanskrit uses one word.
