  vyakhya: विद्या कर्त्री, विनयः कर्म, ददाति क्रिया — सर्वं पूर्वोक्तम्।
  vyakhya_en: |
    Your first real sentence, from the Hitopadeśa — and you can already read it. विद्या (knowledge) is the कर्तृ in प्रथमा; विनयम् (humility) is the कर्मन् in द्वितीया; ददाति (gives) is a present-tense verb. Every piece is grammar you have met on toy sentences; here it stands in real Sanskrit, unchanged.
