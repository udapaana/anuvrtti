  sentence: विद्या ददाति विनयम्।
  translation: Knowledge gives humility.
  teaches: 'a line of Hitopadeśa, read whole — an आ-stem feminine agent, a कर्मन् in the द्वितीया, a present verb'
  words:
  - form: विद्या
