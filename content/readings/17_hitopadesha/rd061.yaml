  sentence: मातृवत् परदारेषु परद्रव्येषु लोष्ट्रवत्। आत्मवत् सर्वभूतेषु यः पश्यति सः पण्डितः॥
  translation: He who looks on others' wives as on a mother, on others' wealth as on a clod of earth, on all beings as on himself — he is the wise one.
  teaches: |
    the वति suffix — "just like ___": मातृवत् "as (one would toward) a mother,"
    लोष्ट्रवत् "like a clod," आत्मवत् "as oneself." One little suffix turns a
    noun into an adverb of comparison.
