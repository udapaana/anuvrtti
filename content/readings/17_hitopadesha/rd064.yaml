- id: rd064
  kind: attested
  segment: 372
  source:
    text: हितोपदेश
    ref: "Hitopadeśa 1.19 — where trust is misplaced"
    curated: "the whole verse, word-separated (pausa forms; नैव kept fused to show the सन्धि; compounds kept whole); every form is the text's. From Ambuda's GRETIL edition (ambuda-org/gretil, sa_nArAyaNa-hitopadeza, Hit_1.19)"
  sentence: नदीनाम् शस्त्रपाणीनाम् नखिनाम् शृङ्गिणाम् तथा। विश्वासः नैव कर्तव्यः स्त्रीषु राजकुलेषु च॥
  translation: In rivers, in men with weapons in hand, in the clawed and the horned — and in women and royal houses — trust should never be placed.
  teaches: |
    the gerundive of obligation कर्तव्यः "is to be made / should be done"; the
    इनि possessives नखिन् "clawed," शृङ्गिन् "horned"; and a बहुव्रीहि शस्त्रपाणि
    "weapon-in-hand."
  words:
  - form: नदीनाम्
    lemma: नदी
    gloss: in rivers
    notes:
    - term: सम्बन्ध
      en: the object of (mis)trust — genitive
    - term: षष्ठी
      en: genitive plural (नदी → नदीनाम्, with नुट्)
  - form: शस्त्रपाणीनाम्
    lemma: शस्त्रपाणि
    gloss: of men weapon-in-hand
    vocab: true
    notes:
    - text: 'विग्रह: शस्त्रम् पाणौ येषाम् — "those with a weapon in hand"'
    - term: बहुव्रीहि
      en: possessive — "those in WHOSE hand (पाणि) is a weapon (शस्त्र)"
    - cite: '2.2.24'
      role: अनेकमन्यपदार्थे — a बहुव्रीहि naming the possessor → शस्त्र + पाणि → शस्त्रपाणि
    - term: षष्ठी
      en: genitive plural
  - form: नखिनाम्
    lemma: नखिन्
    gloss: of the clawed
    vocab: true
    notes:
    - term: तद्धित
      en: possessive (इनि) — नख "claw" → नखिन् "having claws"
    - cite: '5.2.115'
      role: अत इनिठनौ — इनि in the "possessing" sense → नख + इनि → नखिन्
    - term: षष्ठी
      en: genitive plural
  - form: शृङ्गिणाम्
    lemma: शृङ्गिन्
    gloss: of the horned
    vocab: true
    notes:
    - term: तद्धित
      en: possessive (इनि) — शृङ्ग "horn" → शृङ्गिन् "having horns"
    - term: षष्ठी
      en: genitive plural
  - form: तथा
    lemma: तथा
    gloss: likewise
    notes:
    - term: अव्यय
      en: connective adverb — "and so too"
  - form: विश्वासः
    lemma: विश्वास
    gloss: trust
    vocab: true
    notes:
    - term: कर्मन्
      en: what is to be done — grammatical subject of the gerundive
    - term: प्रथमा
      en: nominative
  - form: नैव
    lemma: न
    gloss: never
    notes:
    - cite: '6.1.88'
      role: वृद्धिरेचि — न + एव → नैव (a + e → the वृद्धि vowel ऐ)
    - term: अव्यय
      en: न "not" + एव "at all" — emphatic negation
  - form: कर्तव्यः
    lemma: कृ
    gloss: should be placed
    notes:
    - term: कृदन्त
      en: gerundive (तव्य) of कृ — "to be done/made"
    - cite: '3.1.96'
      role: तव्यत्तव्यानीयरः — the "ought" sense → कृ + तव्य → कर्तव्य
    - term: तव्य
      en: the gerundive suffix
    - term: विशेषण
      en: predicate of विश्वासः
    - term: प्रथमा
      en: nominative
    rel:
    - kind: विशेषण
      to: 6
  - form: स्त्रीषु
    lemma: स्त्री
    gloss: in women
    notes:
    - term: अधिकरण
      en: the sphere — "in the matter of ___"
    - term: सप्तमी
      en: locative plural (स्त्री → स्त्रीषु)
  - form: राजकुलेषु
    lemma: राजकुल
    gloss: in royal houses
    vocab: true
    notes:
    - text: 'विग्रह: राज्ञः कुलम् — "the family of a king"'
    - term: तत्पुरुष
      en: compound — राज्ञः कुलम् "a king's family"
    - term: अधिकरण
      en: the sphere
    - term: सप्तमी
      en: locative plural
  - form: च
    lemma: च
