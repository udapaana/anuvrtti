      en: connective
  vyakhya: 'कृत्यप्रधानं नीतिवचनम्। कर्तव्यः इति कृञः तव्यप्रत्ययान्तम् (तव्यत्तव्यानीयरः)। नखिन् शृङ्गिन् इति इनिप्रत्ययान्तौ (अत इनिठनौ); शस्त्रपाणि इति बहुव्रीहिः। नदीनाम् … इति विश्वासकर्मणि षष्ठी, स्त्रीषु राजकुलेषु इति विषयसप्तमी — उभयथा निर्देशः। नैव इति वृद्धिसन्धिः।'
  vyakhya_en: |
    A nīti maxim built on the **gerundive**: कर्तव्यः "is to be placed / should be
    made," the तव्य form of कृ (3.1.96) — the register of "one ought." The list of
    the untrustworthy is a little museum of the इनि possessive (नखिन् "clawed,"
    शृङ्गिन् "horned," 5.2.115) and the बहुव्रीहि (शस्त्रपाणि "weapon-in-hand,"
    2.2.24). Notice the verse names its objects two ways — some in the genitive
    (नदीनाम्, "of rivers"), some in the locative (स्त्रीषु, "in women") — both
    idiomatic for the thing one trusts (or shouldn't).
