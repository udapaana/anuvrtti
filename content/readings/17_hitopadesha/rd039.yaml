  sentence: अनेकसंशयोच्छेदि परोक्षार्थस्य दर्शकम्। सर्वस्य लोचनं शास्त्रं यस्य नास्त्य् अन्ध एव सः॥
  translation: Destroying many doubts, revealing what lies beyond sight — learning is the eye of everyone; he who has it not is blind indeed.
  teaches: |
    the verse the king overhears. परोक्षार्थस्य दर्शकम् — an agent-noun takes
    the षष्ठी where the sense is transitive.
