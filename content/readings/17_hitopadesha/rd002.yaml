  source:
    text: हितोपदेश
    ref: "Hit_0.6 (pāda b)"
    curated: "second quarter of the same verse as rd001; taken whole"
  sentence: विनयाद् याति पात्रताम्।
  translation: From humility one attains worthiness.
  teaches: 'the next quarter of the same verse — विनयात् is अपादान, the पञ्चमी of "from"'
  words:
  - form: विनयाद्
    lemma: विनय
    gloss: from humility
    notes:
    - term: अपादान
      en: source — that from which one proceeds
    - cite: '1.4.24'
      role: ध्रुवमपायेऽपादानम् — the starting point (humility, whence worthiness comes) is अपादान
    - term: पञ्चमी
      en: ablative
    - cite: '2.3.28'
      role: अपादाने पञ्चमी → विनयात् (→ विनयाद् before the voiced य, by जश्त्व)
  - form: याति
    lemma: या
    gloss: goes, attains
    vocab: true
    notes:
    - term: या
      en: '"go, attain"'
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  - form: पात्रताम्
    lemma: पात्रता
    gloss: worthiness, fitness
    vocab: true
    notes:
    - term: कर्मन्
      en: object — what is attained
    - cite: '1.4.49'
      role: कर्तुरीप्सिततमं कर्म → पात्रता is the कर्मन्
    - term: द्वितीया
      en: accusative
    - cite: '2.3.2'
      role: कर्मणि द्वितीया → पात्रताम्
  vyakhya: विनयात् इति अपादानम्, पात्रताम् इति कर्म। एकस्माद् गुणाद् अन्यः फलति।
  vyakhya_en: |
    The verse continues: from humility (विनयाद्, अपादान/पञ्चमी) one attains worthiness (पात्रताम्, कर्मन्/द्वितीया). Note विनयात् → विनयाद् — the final त् softens to द् before the voiced य (जश्त्व, the consonant-sandhi you met). Real text, real sandhi, all grammar you hold. The chain so far: knowledge → humility → worthiness.
