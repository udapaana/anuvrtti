    ref: "Hitopadeśa 1.38 — the three natural well-wishers"
    curated: "the whole verse, word-separated (pausa forms; चेति and चान्ये kept fused to show the सन्धि); every form is the text's. From Ambuda's GRETIL edition (ambuda-org/gretil, sa_nArAyaNa-hitopadeza, Hit_1.38)"
  sentence: माता मित्रम् पिता चेति स्वभावात् त्रितयम् हितम्। कार्यकारणतः चान्ये भवन्ति हितबुद्धयः॥
  translation: Mother, friend, and father — this triad is well-wishing by nature; others become well-disposed (only) out of cause and interest.
  teaches: |
    the तसिल् adverb — कार्यकारणतः "from cause-and-effect, out of interest"; the
    collective त्रितयम् "the set of three"; and two सन्धि joins hiding in plain
    sight — चेति (guṇa) and चान्ये (savarṇa lengthening).
