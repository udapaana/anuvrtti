  vyakhya: 'तसिल्-सन्धि-प्रधानः श्लोकः। कार्यकारणतः इति पञ्चम्यर्थे तसिल् (पञ्चम्यास्तसिल्) — अव्ययम्। चेति इति च-इति गुणसन्धौ (आद्गुणः); चान्ये इति च-अन्ये सवर्णदीर्घे (अकः सवर्णे दीर्घः)। त्रितयम् इति समाहारे तयप्। हितबुद्धयः इति बहुव्रीहिः।'
  vyakhya_en: |
    Three small mechanisms in one line. **तसिल्** — कार्यकारणतः "from cause and
    effect," the -तस् adverb that stands in for an ablative (5.3.7,
    पञ्चम्यास्तसिल्). And two सन्धि joins that a fast reader must simply *know*:
    चेति = च + इति (guṇa, अ+इ → ए, 6.1.87) and चान्ये = च + अन्ये (savarṇa
    lengthening, अ+अ → आ, 6.1.101). Add the collective त्रितयम् "the triad" and
    the बहुव्रीहि हितबुद्धयः "kindly-minded," and the verse's quiet claim lands:
    three love you by nature; the rest, for a reason.
