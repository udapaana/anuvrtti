  translation: Two brothers divided a field. The elder spoke — "Today I have taken half; you take the other half." The younger heard that, but was not satisfied. He asked the village elders — "By whom was this land divided?" The elders spoke — "He who divides himself does not himself take." Hearing that, the elder became ashamed, and gave the better half to the younger.
  teaches: |
    अवादीत्, अश्रौषीत्, अवादिषुः, अभूत् — the aorist across three persons and
    both numbers. विभक्ता names the act as done; वृद्धाः and अवादिषुः close on
    visarga at the pause.
