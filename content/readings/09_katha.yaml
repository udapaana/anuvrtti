  vyakhya_en: |
    The last sentence has no finite verb in it. त्यक्तानि and त्यक्तम् are
    participles, and they carry the whole statement — the friends left, the
    city left, and तेन telling you by whom.

    Classical Sanskrit prefers this to a past-tense verb, which is why so much
    narrative reads as a chain of participles with the agent in the
    instrumental. Once मित्राणि त्यक्तानि stops needing to be translated as a
    passive, it starts reading as ordinary past narration.

- id: ex196
  kind: graded
  segment: 420
  source:
    text: पञ्चतन्त्र (our graded retelling)
    ref: "Pañcatantra I — ब्राह्मणः नकुलः च, the mongoose"
    curated: our simple Sanskrit telling of the well-known episode; NOT the verbatim text
  sentence: कस्मिंश्चित् ग्रामे एकः ब्राह्मणः वसति स्म। तस्य गृहे एकः नकुलः आसीत्। ब्राह्मणस्य पत्नी बालम् रक्षन्ती गृहे तिष्ठति स्म। एकदा सा जलम् आनेतुम् बहिः अगच्छत्। तस्मिन् काले एकः कृष्णसर्पः बालस्य समीपम् आगच्छत्। तम् दृष्ट्वा नकुलः सर्पेण सह अयुध्यत। तेन सर्पः हतः, नकुलस्य मुखम् च रक्तेन लिप्तम् आसीत्। पत्नी प्रत्यागच्छत्। रक्तानि नकुलस्य मुखे दृष्ट्वा सा अचिन्तयत् — "अनेन मम बालः खादितः" इति। क्रुद्धा सा घटम् तस्य उपरि अक्षिपत्। नकुलः अम्रियत। गृहम् प्रविश्य सा बालम् सुप्तम् अपश्यत्, हतम् सर्पम् च। तदा सा अतीव अरोदीत् — "अहम् मूढा, विचार्य न कृतवती" इति।
  translation: In a certain village there lived a brahmin. In his house was a mongoose. The brahmin's wife, guarding the child, used to stay at home. One day she went out to fetch water. At that time a black snake came near the child. Seeing it, the mongoose fought with the snake. By that the snake was killed, and the mongoose's mouth was smeared with blood. The wife returned. Seeing the blood on the mongoose's mouth, she thought — "My child has been eaten by this one." Enraged, she threw a pot upon him. The mongoose died. Entering the house, she saw the child asleep, and the snake killed. Then she wept bitterly — "I am a fool; I did not act after thinking."
  teaches: |
    the mongoose story, told in participles. The tragedy turns on one of them:
    रक्तानि दृष्ट्वा, seeing the blood, and what the wife concludes from it.
