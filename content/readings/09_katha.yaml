    - term: द्वन्द्व
      en: joined with बुद्धिः by च — two things counted together
    - term: प्रथमा
      en: neuter nominative
  - form: बुद्धिः
    lemma: बुद्धि
    gloss: intelligence
    notes:
    - term: प्रथमा
      en: nominative
    - cite: "2.2.29"
      role: चार्थे द्वन्द्वः — the coordinate pair बलम् बुद्धिः च
  - form: च
    lemma: च
    gloss: and
    notes:
    - term: अव्यय
      en: indeclinable
  - form: तयोः
    lemma: तद्
    gloss: of the two
    notes:
    - term: षष्ठी
      en: genitive dual — the निर्धारण, selecting from a pair
  - form: श्रेष्ठा
    lemma: श्रेष्ठ
    gloss: the better
    notes:
    - term: प्रथमा
      en: nominative feminine, agreeing with बुद्धिः
    - cite: "5.3.55"
      role: अतिशायने तमबिष्ठनौ — the superlative इष्ठन् → श्रेष्ठ
  vyakhya: बलवान् सिंहः मृतः, बुद्धिमान् शशकः जीवति। न बलेन, बुद्ध्या जयः।
  vyakhya_en: |
    The lion never sees another lion. He sees himself and cannot tell, and the
    echo he answers is his own voice returning. The story spends its whole
    length on that one joke, and the last line names it: बलम् बुद्धिः च, and
    of the two, बुद्धिः.

    Nine finite verbs here and eight of them are past — अनयत्, अपश्यत्,
    अमन्यत, अक्रुध्यत्, अपतत्, अम्रियत, अरक्षत्, आसीत्. Against them stand
    वसति and श्रूयते inside quoted or reported speech, where the present holds,
    and हनिष्यामि, the only future in the passage: the one thing the lion
    intends and does not accomplish.

