  vyakhya: 'द्वे नवीने — शतृप्रत्ययः (लटः शतृशानचौ) पिबन्त्यः नृत्यन् च; स्म-सहितः लट् भूतार्थे। कर्मणिप्रयोगः त्रिवारम् — दूषितम् आसीत्, मूर्च्छिताः अभवन्, पराजितः। जलचरे युद्धम् वर्णयितुम् क्त्वा-ल्यपौ बहुशः।'
  vyakhya_en: |
    Two new tools. First, **शतृ** (the active present participle — लटः शतृशानचौ, 3.2.124): पिबन्त्यः "while drinking" (fem. pl., simultaneous with अभवन्) and नृत्यन् "while dancing" (masc. sg., simultaneous with अदमयत्). The participle says the background action runs alongside the main verb — not before it (that's क्त्वा) and not after it. Second, **वसति स्म** — a present-tense verb with the particle स्म shifts into past habitual: "used to dwell." Passive क्त appears three times (दूषितम्, मूर्च्छिताः, पराजितः), anchoring the pattern from ex098. The gerunds आरुह्य → अपतत् chain the action sequence into one breath.

- id: ex101
  kind: graded
  segment: 280
  source:
    text: "बालकृष्णकथा (our graded retelling)"
    ref: "Bhāgavata 10.24–25 — the गोवर्धन episode"
    curated: "our graded prose; the story is canonical, the sentences are ours"
  sentence: 'एकदा व्रजवासिनः इन्द्राय पूजाम् अकुर्वन्। कृष्णः अवदत् — "गोवर्धनाय पूजाम् कुरुत, न तु इन्द्राय।" जनाः तस्य वचनं श्रुत्वा तथा अकुर्वन्। तदा क्रुद्धः इन्द्रः मेघैः वर्षम् अप्रेरयत्। वर्षेण भयभीताः गावः च गोपाः च कृष्णम् अशरणम् अगच्छन्। कृष्णः तु गोवर्धनम् एव एकेन हस्तेन उद्धृत्य सप्त दिवसान् अधारयत्। एवम् गोवर्धनः कृष्णेन छत्रम् इव धृतः।'
  translation: Once the inhabitants of Vraja were performing a puja for Indra. Kṛṣṇa said — "Offer puja to Govardhana, not to Indra." The people, having heard his words, did so. Then angry Indra sent rain-clouds. Frightened by the rain, the cows and cowherds went to Kṛṣṇa as their refuge. But Kṛṣṇa alone, lifting Govardhana with one hand, held it for seven days. Thus Govardhana was held by Kṛṣṇa like an umbrella.
  teaches: 'anīyar gerundive (implicitly: "the mountain is to-be-held"); upasarga + gerund उद्धृत्य; instrumental of cause (वर्षेण); accusative of duration (सप्त दिवसान्); simile (उपमा with इव); passive close (धृतः)'
  words:
  - form: एकदा
    lemma: एकदा
    gloss: once
    notes:
    - term: अव्यय
      en: temporal adverb
  - form: व्रजवासिनः
    lemma: व्रजवासिन्
    gloss: the inhabitants of Vraja
    vocab: true
    notes:
    - term: तत्पुरुष
      en: व्रज + वासिन् — "Vraja-dwellers"
    - term: कर्तृ
      en: subject (nom. pl. of इन्-stem)
    - term: प्रथमा
      en: nominative plural
  - form: इन्द्राय
    lemma: इन्द्र
    gloss: for Indra
    notes:
