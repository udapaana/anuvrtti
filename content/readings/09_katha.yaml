  sentence: 'एकदा शशकस्य वारः आगच्छत्। सः बुद्धिमान् शशकः चिरम् विचिन्त्य एकम् उपायम् अकरोत्। सः मन्दम् मन्दम् सिंहस्य समीपम् अगच्छत्। क्रुद्धः सिंहः अपृच्छत् — "किमर्थम् त्वम् विलम्बेन आगतः?" शशकः अवदत् — "मार्गे अन्यः बलवान् सिंहः माम् अरुणत्। सः त्वाम् एव स्वामिनम् न मन्यते।" तत् श्रुत्वा क्रुद्धः सिंहः तम् द्रष्टुम् इच्छति स्म।'
  translation: One day the rabbit's turn came. That clever rabbit, after thinking for a long time, devised a plan. He went very slowly toward the lion. The angry lion asked — "Why have you come late?" The rabbit said — "On the road another strong lion stopped me. He does not regard you alone as master." Having heard that, the angry lion wished to see him.
  teaches: 'longer dialogue — किमर्थम् (why?), past participle as predicate (आगतः "have come"), gerund विचिन्त्य + श्रुत्वा, accusative of person stopped (माम् अरुणत्), infinitive of purpose (द्रष्टुम्), मन्यते आत्मनेपद'
  words:
