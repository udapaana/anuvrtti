  vyakhya: 'कथायाः शिखरम् — द्वौ सम्बन्धौ यद्-तद्। कर्तरि यः…सः (यः इच्छति स्म सः कम्पते); कर्मणि यम्…सः (यं अबिभयुः सः हतः)। अपादानम् द्विधा — उच्चासनात् (departure), भयस्य हेतुः भी-धातुना अबिभयुः। वधम् इति कृत्, तत्र कर्म षष्ठ्याम् (कृष्णस्य वधम्)। अन्ते कर्मणि हतः — कथार्धम् सर्वम् कर्मणि समाप्यते।'
  vyakhya_en: |
    The climax, and it gathers everything. Two relative-correlatives frame it, one on each axis: यः … सः on the **subject** ("he who long wished Kṛṣṇa's death — that one now trembles") and यम् … सः on the **object** ("the king whom all feared — he was killed"). Two ablatives of separation: उच्चासनात् "from the high throne" (2.3.28) and the fear-source folded into अबिभयुः. The action-noun वधम् "killing" takes its object in the **genitive** — कृष्णस्य वधम् "the killing OF Kṛṣṇa" (2.3.65, the कृत्-षष्ठी). The arc that began with butter and a rope ends as it must, in the passive: हतः "was killed" — and the whole Kṛṣṇa-childhood sequence closes on its grammatical signature, the कर्मणि क्त, now carrying the weight of a death rather than a game.

