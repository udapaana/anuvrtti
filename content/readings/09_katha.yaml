  vyakhya: 'संवादः दीर्घतरः। किमर्थम् इति हेतुप्रश्ने; आगतः इति निष्ठा कर्तरि ("त्वम् आगतः")। माम् अरुणत् इति रुध्-धातोः सप्तमगणे लङ्। स्वामिनम् इति द्विकर्मके मन्यतेः अभिन्ननिर्देशे। द्रष्टुम् इच्छति इति तुमुन् इष्-धातुना।'
  vyakhya_en: |
    The dialogue lengthens — the trick is told, not just narrated. New touches: किमर्थम् "why? for what purpose?" (the interrogative of cause); the past participle as a finite-like **predicate** — त्वम् … आगतः "you have come" (क्त standing in for "you came/are come"); and a double-accusative with मन्यते — त्वाम् स्वामिनम् न मन्यते "does not regard you AS master," the object and its predicate-complement both accusative. The infinitive द्रष्टुम् इच्छति "wishes to see" closes on the hook that will spring the trap. Everything else is consolidation: four लङ् pasts, two gerunds (विचिन्त्य, श्रुत्वा), locatives, the मतुप् adjectives बलवान्/बुद्धिमान्.
