# ════════════════════════════════════════════════════════════════════════
#  09_katha.yaml — कथा — the graded STORY track (connected narrative)
#
#  These are MULTI-SENTENCE graded readings that tell extant, canonical stories
#  (bāla-Kṛṣṇa first) in OUR simple Sanskrit, pitched to grammar already met.
#  The STORY is the tradition's; the SENTENCES are ours (kind: graded). We do
#  NOT claim these are the verbatim Bhāgavata — the `source` note credits the
#  episode's origin and discloses that the prose is our graded retelling.
#
#  Principle: continuity over isolation. A recurring cast (कृष्णः, यशोदा, गोप्यः,
#  गावः, गोकुलम्) threads through, so vocabulary compounds and the reader builds
#  a world. New grammar enters as the story needs it; only the NEW/notable form
#  in each reading gets full annotation — known forms are glossed lightly.
#  Difficulty climbs: sentences lengthen as the arc proceeds, feeding into the
#  attested Hitopadeśa/Pañcatantra ladder (06_readings.yaml).
#  Source of truth; the app is derived. Schema: readings/_SCHEMA.md.
# ════════════════════════════════════════════════════════════════════════

readings:

- id: ex095
  kind: graded
  segment: 16
  source:
    text: "बालकृष्णकथा (our graded retelling)"
    ref: "Bhāgavata 10.8 — Kṛṣṇa's childhood in Gokula"
    curated: "our simple Sanskrit telling the well-known episode; NOT the verbatim text"
  sentence: गोकुले कृष्णः नाम बालः वसति। यशोदा तस्य माता। सः गोपानां गृहेषु क्रीडति। सर्वे गोपाः तं बालं पश्यन्ति, सर्वाः गोप्यः च तं कामयन्ते।
  translation: In Gokula lives a boy named Kṛṣṇa. Yaśodā is his mother. He plays in the houses of the cowherds. All the cowherds see the boy, and all the cowherd-women love him.
  teaches: 'first STORY reading — connected prose reusing known grammar (loc., gen.pl, सः/तम्, present pl.); introduces the cast'
  words:
  - form: गोकुले
    lemma: गोकुल
    gloss: in Gokula (the cowherd village)
    notes:
    - term: अधिकरण
      en: locus — where the story is set
    - cite: '2.3.36'
      role: सप्तम्यधिकरणे च → सप्तमी for the locus → गोकुले
  - form: कृष्णः
    lemma: कृष्ण
    gloss: Kṛṣṇa (the boy)
    vocab: true
    notes:
    - term: कर्तृ
      en: agent — our hero (an a-stem masc., declined like देव)
    - term: प्रथमा
      en: nominative
  - form: नाम
    lemma: नामन्
    gloss: by name, named
    vocab: true
    notes:
    - term: अव्यय
      en: '"by name" — in apposition (कृष्णः नाम बालः = a boy named Kṛṣṇa)'
  - form: वसति
    lemma: वस्
    gloss: dwells, lives
    vocab: true
    notes:
    - term: वस्
      en: '"dwell"'
    - term: लट्
      en: present
  - form: यशोदा
    lemma: यशोदा
    gloss: Yaśodā (his mother)
    vocab: true
    notes:
    - term: कर्तृ
      en: an आ-stem feminine (declined like सेना)
    - term: प्रथमा
      en: nominative
  - form: तस्य
    lemma: तद्
    gloss: his
    notes:
    - term: षष्ठी
      en: genitive of सः — "his"
    - cite: '2.3.50'
      role: षष्ठी शेषे → तस्य
  - form: गोपानाम्
    lemma: गोप
    gloss: of the cowherds
    vocab: true
    notes:
    - term: षष्ठी
      en: genitive plural (a-stem → आनाम्, as देवानाम्)
    - term: बहुवचन
      en: plural
  - form: गृहेषु
    lemma: गृह
    gloss: in the houses
    notes:
    - term: सप्तमी
      en: locative plural (neuter a-stem → एषु, as देवेषु)
    - term: बहुवचन
      en: plural
  - form: क्रीडति
    lemma: क्रीड्
    gloss: plays
    vocab: true
    notes:
    - term: क्रीड्
      en: '"play"'
    - term: लट्
      en: present
  - form: गोप्यः
    lemma: गोपी
    gloss: the cowherd-women, the gopīs
    vocab: true
    notes:
    - term: कर्तृ
      en: agent (ī-stem fem. nom. plural, as नद्यः)
    - term: बहुवचन
      en: plural
  - form: कामयन्ते
    lemma: कम्
    gloss: love, desire
    vocab: true
    notes:
    - term: कम्
      en: '"love" (आत्मनेपद, 3rd pl.)'
    - term: लट्
      en: present
  vyakhya: कथायाः आरम्भः। गोकुलम् अधिकरणम्, कृष्णः कर्ता, यशोदा माता। ज्ञातमेव व्याकरणम् — केवलं कथा नूतना।
  vyakhya_en: |
    Your first connected story — and almost every form is grammar you already hold: a locative setting (गोकुले), genitive plurals (गोपानाम्), the सः/तस्य/तं pronoun, present verbs singular and plural. Nothing new to learn — that is the point. Meet the cast: कृष्णः the boy, यशोदा his mother, the गोपाः (cowherds) and गोप्यः (gopīs). They return in every episode, so their forms grow familiar. From here the sentences lengthen.

- id: ex096
  kind: graded
  segment: 18
  source:
    text: "बालकृष्णकथा (our graded retelling)"
    ref: "Bhāgavata 10.9 — the नवनीतचोर (butter-thief) episode"
    curated: "our graded prose telling the famous butter-theft; not the verbatim text"
  sentence: यशोदा गृहे नवनीतम् रक्षति। किन्तु कृष्णः नवनीतम् इच्छति। सः शनैः गृहम् प्रविशति, उच्चैः च नवनीतम् चोरयति। ततः सः मित्रेभ्यः तत् नवनीतम् यच्छति, स्वयम् च खादति। यशोदा तं पश्यति, क्रुध्यति च।
  translation: Yaśodā keeps butter in the house. But Kṛṣṇa wants the butter. He quietly enters the house and steals the butter from up high. Then he gives that butter to his friends and eats it himself. Yaśodā sees him and grows angry.
  teaches: 'a real SCENE — adversative किन्तु/ततः, adverbs (शनैः, उच्चैः, स्वयम्), सम्प्रदान (मित्रेभ्यः), clauses joined'
  words:
  - form: नवनीतम्
    lemma: नवनीत
    gloss: butter (fresh)
    vocab: true
    notes:
    - term: कर्मन्
      en: object — the prize of the whole episode (neuter a-stem)
    - cite: '2.3.2'
      role: कर्मणि द्वितीया → नवनीतम्
    - term: द्वितीया
      en: accusative
  - form: रक्षति
    lemma: रक्ष्
    gloss: guards, keeps
    vocab: true
    notes:
    - term: रक्ष्
      en: '"protect, keep"'
    - term: लट्
      en: present
  - form: किन्तु
    lemma: किन्तु
    gloss: but, however
    vocab: true
    notes:
    - term: अव्यय
      en: adversative connective — turns the scene
  - form: इच्छति
    lemma: इष्
    gloss: wants, wishes
    vocab: true
    notes:
    - term: इष्
      en: '"wish, want"'
    - term: लट्
      en: present
  - form: शनैः
    lemma: शनैस्
    gloss: slowly, quietly
    vocab: true
    notes:
    - term: अव्यय
      en: adverb — "softly"
  - form: प्रविशति
    lemma: विश्
    gloss: enters
    vocab: true
    notes:
    - term: विश्
      en: 'प्र + विश् "enter"'
    - term: लट्
      en: present
  - form: उच्चैः
    lemma: उच्चैस्
    gloss: high up, on high
    vocab: true
    notes:
    - term: अव्यय
      en: adverb — "aloft" (the butter hung high; Kṛṣṇa reaches it)
  - form: चोरयति
    lemma: चुर्
    gloss: steals
    vocab: true
    notes:
    - term: चुर्
      en: '"steal" (चुरादि present चोरयति)'
    - term: लट्
      en: present
  - form: मित्रेभ्यः
    lemma: मित्र
    gloss: to his friends
    vocab: true
    notes:
    - term: सम्प्रदान
      en: recipients — to whom he gives the butter
    - cite: '2.3.13'
      role: चतुर्थी सम्प्रदाने → मित्रेभ्यः (dat. pl., as देवेभ्यः)
    - term: चतुर्थी
      en: dative plural
  - form: यच्छति
    lemma: दा
    gloss: gives
    notes:
    - term: दा
      en: '"give" (यच्छति)'
    - term: लट्
      en: present
  - form: स्वयम्
    lemma: स्वयम्
    gloss: himself, of his own accord
    vocab: true
    notes:
    - term: अव्यय
      en: indeclinable — "himself"
  - form: क्रुध्यति
    lemma: क्रुध्
    gloss: grows angry
    vocab: true
    notes:
    - term: क्रुध्
      en: '"be angry"'
    - term: लट्
      en: present
  vyakhya: दृश्यं विस्तृतम् — किन्तु, ततः, च इति योजकैः वाक्यानि सम्बद्धानि। नवनीतम् कर्म, मित्रेभ्यः सम्प्रदानम्।
  vyakhya_en: |
    Now a whole scene, not a single fact. Sentences link by connectives — किन्तु ("but," turning Yaśodā's guarding into Kṛṣṇa's wanting), ततः ("then"), च ("and") — so the action flows. The new pieces are small and natural: adverbs (शनैः "quietly," उच्चैः "high up," स्वयम् "himself") and a chain of present verbs (इच्छति, प्रविशति, चोरयति, यच्छति, खादति). The case-roles are all known — नवनीतम् the object, मित्रेभ्यः the dative of recipient. You are reading a story now.

- id: ex097
  kind: graded
  segment: 20
  source:
    text: "बालकृष्णकथा (our graded retelling)"
    ref: "Bhāgavata 10.9 — the दामबन्धन (binding) episode"
    curated: "our graded prose telling the दामोदर binding; not the verbatim text"
  sentence: क्रुद्धा यशोदा रज्ज्वा कृष्णम् बध्नाति। किन्तु रज्जुः सर्वदा ह्रस्वा भवति। सा पुनः पुनः यतते, तथापि बालम् बन्धितुम् न शक्नोति। अन्ते कृष्णः स्वयम् एव मातुः प्रेम्णा बद्धः। तेन सः दामोदरः इति प्रसिद्धः।
  translation: Angry Yaśodā binds Kṛṣṇa with a rope. But the rope is always too short. She tries again and again, yet cannot bind the boy. In the end Kṛṣṇa is bound only by his mother's love, of his own accord. By this he became famous as "Dāmodara" (bound-at-the-belly).
  teaches: 'longest yet — past participles (क्रुद्धा, बद्धः), an infinitive (बन्धितुम्) with शक्, तृतीया of means (रज्ज्वा, प्रेम्णा), closing name-etymology'
  words:
  - form: क्रुद्धा
    lemma: क्रुध्
    gloss: angry (she)
    vocab: true
    notes:
    - term: कृदन्त
      en: past participle (क्त) of क्रुध्, feminine, agreeing with यशोदा
    - cite: '3.2.102'
      role: निष्ठा → क्त → क्रुद्ध; fem. क्रुद्धा
  - form: रज्ज्वा
    lemma: रज्जु
    gloss: with a rope
    vocab: true
    notes:
    - term: करण
      en: instrument — that with which she binds
    - cite: '2.3.18'
      role: कर्तृकरणयोस्तृतीया → रज्ज्वा (ū-stem fem. instr.)
    - cite: '6.1.77'
      role: इको यणचि → रज्जु + आ → रज्ज्वा
    - term: तृतीया
      en: instrumental
  - form: बध्नाति
    lemma: बन्ध्
    gloss: binds, ties
    vocab: true
    notes:
    - term: बन्ध्
      en: '"bind"'
    - term: लट्
      en: present
  - form: ह्रस्वा
    lemma: ह्रस्व
    gloss: short (too short)
    vocab: true
    notes:
    - term: विशेषण
      en: predicate adjective of रज्जुः (fem.)
    - term: प्रथमा
      en: nominative
  - form: यतते
    lemma: यत्
    gloss: strives, tries
    vocab: true
    notes:
    - term: यत्
      en: '"strive" (आत्मनेपद)'
    - term: लट्
      en: present
  - form: तथापि
    lemma: तथापि
    gloss: yet, even so
    vocab: true
    notes:
    - term: अव्यय
      en: concessive connective — "nevertheless"
  - form: बन्धितुम्
    lemma: बन्ध्
    gloss: to bind
    notes:
    - term: कृदन्त
      en: infinitive (तुमुन्) — "to bind"
    - cite: '3.3.10'
      role: तुमुन्ण्वुलौ क्रियायां क्रियार्थायाम् → बन्धितुम् (with शक्नोति)
    - term: अव्यय
      en: indeclinable
  - form: शक्नोति
    lemma: शक्
    gloss: is able
    vocab: true
    notes:
    - term: शक्
      en: '"be able" (शक्नोति + infinitive = "can")'
    - term: लट्
      en: present
  - form: मातुः
    lemma: मातृ
    gloss: of the mother
    notes:
    - term: षष्ठी
      en: genitive (ऋ-stem मातृ → मातुः)
    - cite: '2.3.50'
      role: षष्ठी शेषे → मातुः
  - form: प्रेम्णा
    lemma: प्रेमन्
    gloss: by love
    vocab: true
    notes:
    - term: करण
      en: means — that by which he is bound (न-stem प्रेमन् instr.)
    - cite: '2.3.18'
      role: कर्तृकरणयोस्तृतीया → प्रेम्णा
    - term: तृतीया
      en: instrumental
  - form: बद्धः
    lemma: बन्ध्
    gloss: bound
    vocab: true
    notes:
    - term: कृदन्त
      en: past participle (क्त) of बन्ध् — the predicate "is bound"
    - cite: '3.2.102'
      role: निष्ठा → क्त → बद्ध; passive past participle as predicate
    - term: प्रथमा
      en: nominative (agreeing with कृष्णः)
  - form: दामोदरः
    lemma: दामोदर
    gloss: '"Dāmodara" — bound-at-the-belly'
    vocab: true
    notes:
    - term: बहुव्रीहि
      en: possessive compound — दाम (rope) + उदर (belly) → "(he) at whose belly is the rope"
    - term: प्रथमा
      en: nominative
  vyakhya: कथा दीर्घतरा। क्रुद्धा बद्धः इति निष्ठे, बन्धितुम् इति तुमुन्, रज्ज्वा प्रेम्णा इति करणे। अन्ते नामनिर्वचनम् — दाम उदरे यस्य सः दामोदरः।
  vyakhya_en: |
    The longest reading yet, weaving together what you met as isolated cells: past participles as adjective and predicate (क्रुद्धा "angry," बद्धः "bound"), an infinitive with "can" (बन्धितुम् न शक्नोति "cannot bind"), and the instrumental of means twice (रज्ज्वा "with a rope," प्रेम्णा "by love"). It closes the way Sanskrit tales love to — a name-etymology: दाम (rope) + उदर (belly) makes the बहुव्रीहि दामोदर, "the one with a rope at his belly." The grammar is familiar; the story now carries it.
