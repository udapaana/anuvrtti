  vyakhya: कथा दीर्घतरा। क्रुद्धा बद्धः इति निष्ठे, बन्धितुम् इति तुमुन्, रज्ज्वा प्रेम्णा इति करणे। अन्ते नामनिर्वचनम् — दाम उदरे यस्य सः दामोदरः।
  vyakhya_en: |
    The longest reading yet, weaving together what you met as isolated cells: past participles as adjective and predicate (क्रुद्धा "angry," बद्धः "bound"), an infinitive with "can" (बन्धितुम् न शक्नोति "cannot bind"), and the instrumental of means twice (रज्ज्वा "with a rope," प्रेम्णा "by love"). It closes the way Sanskrit tales love to — a name-etymology: दाम (rope) + उदर (belly) makes the बहुव्रीहि दामोदर, "the one with a rope at his belly." The grammar is familiar; the story now carries it.

- id: ex098
  kind: graded
  segment: 220
  source:
    text: "बालकृष्णकथा (our graded retelling)"
    ref: "Bhāgavata 10.6 — the Pūtanā episode"
    curated: "our graded prose; the story is canonical, the sentences are ours"
  sentence: 'पूतना राक्षसी गोकुलं आगत्य शिशुरूपेण तिष्ठति। सा कृष्णं स्तनयित्वा विषेण हन्तुम् इच्छति। किन्तु कृष्णेन सः स्तनः पीतः, विषं च पीतम्। एवम् पूतना कृष्णेन हता।'
  translation: The demoness Pūtanā comes to Gokula and stands there in the form of a child (i.e. a woman). She wishes to kill Kṛṣṇa by nursing him with poison. But by Kṛṣṇa the breast was suckled, and the poison too was drunk. Thus Pūtanā was slain by Kṛṣṇa.
  teaches: 'passive construction (कर्मणि क्त — पीतः, हता, with instrumental of agent); gerund आगत्य (prior action); accusative object (कृष्णम्, विषम्)'
  words:
