      en: gerund (क्त्वा after prefix → ल्यप्) — prior action of same agent
    - cite: '3.4.21'
      role: समानकर्तृकयोः पूर्वकाले क्त्वा → ल्यप् (prefix + root → आगत्य)
  - form: शिशुरूपेण
