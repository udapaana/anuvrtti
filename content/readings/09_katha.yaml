  vyakhya: 'सर्वाधिकदीर्घा कथा — एका वाक्यपरम्परा। नवीनम् — उपमा (इव); अत्यन्तसंयोगे द्वितीया (सप्त दिवसान्); एकेन हस्तेन इति करणम्; क्रुद्धः इन्द्रः इति निष्ठाविशेषणम्। लोट् कुरुत इति विधौ; लङ् बहुशः कथावर्णने।'
  vyakhya_en: |
    The longest katha reading, and it earns its length: five separate clauses, each moving the story. New arrivals: **इव** (the simile particle — Govardhana held "like an umbrella," छत्रम् इव); **accusative of duration** — सप्त दिवसान् "for seven days" (अत्यन्तसंयोगे द्वितीया, 2.3.5); the **instrumental of instrument with body-part** — एकेन हस्तेन "with one hand" (2.3.18); and the **dual coordinator** गावः च गोपाः च "both cows and cowherds." The closing passive (धृतः, 3.2.102) rounds the arc: episodes ex098–ex101 all end with a कर्मणि क्त — "was killed," "she saw," "was defeated," "was held" — each one a summary judgment on what just happened.

