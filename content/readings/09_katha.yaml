    ref: "the sage, the king, and the two brothers — our own telling"
    curated: our simple Sanskrit; not from any single source
  sentence: राजा वनम् गच्छन् एकम् मुनिम् अपश्यत्। मुनिः वृक्षस्य अधः उपविशन् शिष्यान् अवदत् — कर्तव्यम् धर्मम् जानीत। राज्ञः भ्राता अपि तत्र आसीत्। सः पितुः वचनम् स्मरन् मुनिम् अपृच्छत् — किम् मया करणीयम्। मुनिः अवदत् — भ्रातरम् रक्ष, राजानम् सेव, पितरम् च मा त्यज। एतत् त्रयम् सर्वदा स्मरणीयम्। तत् श्रुत्वा भ्रातरौ शान्तौ अभवताम्।
  translation: The king, going to the forest, saw a sage. The sage, sitting beneath a tree, said to his students — "Know the dharma that is to be done." The king's brother was there too. He, remembering his father's words, asked the sage — "What is to be done by me?" The sage said — "Protect your brother, serve the king, and do not abandon your father. These three are always to be remembered." Having heard that, the two brothers became calm.
  teaches: |
    three participles doing the work of "while" — गच्छन्, उपविशन्, स्मरन् —
    and three gerundives stating obligation with no verb: कर्तव्यम्, करणीयम्,
    स्मरणीयम्.
