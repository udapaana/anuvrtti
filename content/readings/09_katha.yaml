  sentence: 'एकदा व्रजवासिनः इन्द्राय पूजाम् अकुर्वन्। कृष्णः अवदत् — "गोवर्धनाय पूजाम् कुरुत, न तु इन्द्राय।" जनाः तस्य वचनं श्रुत्वा तथा अकुर्वन्। तदा क्रुद्धः इन्द्रः मेघैः वर्षम् अप्रेरयत्। वर्षेण भयभीताः गावः च गोपाः च कृष्णम् अशरणम् अगच्छन्। कृष्णः तु गोवर्धनम् एव एकेन हस्तेन उद्धृत्य सप्त दिवसान् अधारयत्। एवम् गोवर्धनः कृष्णेन छत्रम् इव धृतः।'
  translation: Once the inhabitants of Vraja were performing a puja for Indra. Kṛṣṇa said — "Offer puja to Govardhana, not to Indra." The people, having heard his words, did so. Then angry Indra sent rain-clouds. Frightened by the rain, the cows and cowherds went to Kṛṣṇa as their refuge. But Kṛṣṇa alone, lifting Govardhana with one hand, held it for seven days. Thus Govardhana was held by Kṛṣṇa like an umbrella.
  teaches: 'anīyar gerundive (implicitly: "the mountain is to-be-held"); upasarga + gerund उद्धृत्य; instrumental of cause (वर्षेण); accusative of duration (सप्त दिवसान्); simile (उपमा with इव); passive close (धृतः)'
