  sentence: एकदा नरपतेः दूतः उपगोकुलम् आगच्छत्। सः राजपुरुषः नद्याः तीरे गोपकृष्णौ अपश्यत्। तौ ग्रामस्य पटुतमौ बालौ आस्ताम्। तयोः दामोदरः ज्येष्ठः महाबुद्धिः च आसीत्। दूतः तौ अवदत् — नरपतिः युवाम् द्रष्टुम् इच्छति इति। बालौ न अबिभीताम्, हसन्तौ च तेन सह अगच्छताम्।
  translation: Once a king's messenger came to the vicinity of Gokula. That royal servant saw Gopa and Kṛṣṇa on the river's bank. The two were the cleverest boys of the village. Of them Dāmodara was the elder, and of great intelligence. The messenger said to them — "The king wishes to see you two." The boys were not afraid, and laughing they went with him.
  teaches: |
    the compound types across a Gokula scene: नरपतेः and राजपुरुषः (तत्पुरुष),
    उपगोकुलम् (अव्ययीभाव), गोपकृष्णौ (द्वन्द्व), दामोदरः (बहुव्रीहि), and the
    superlative पटुतमौ, ज्येष्ठः.
  words:
