    curated: our simple Sanskrit; not from any single source
  sentence: नद्याः तीरे वणिजः वसन्ति स्म। तेषाम् गृहेषु धनम् धान्यम् च आसीत्। एकदा एकः वणिक् दूरम् देशम् गन्तुम् ऐच्छत्। मित्राणि तम् अवदन् — मार्गः दीर्घः, मा गच्छ इति। किन्तु सः अशृणोत् न। श्वः गमिष्यामि इति उक्त्वा सः रात्रौ यानम् असज्जयत्। प्रभाते तेन मित्राणि त्यक्तानि, नगरम् च त्यक्तम्।
  translation: On the bank of a river lived merchants. In their houses were wealth and grain. One day one merchant wished to go to a distant country. His friends said to him — "The road is long; do not go." But he did not listen. Saying "I will go tomorrow," he made ready a cart in the night. At dawn the friends were left behind by him, and the city too was left.
