  sentence: 'यः कंसः चिरम् कृष्णस्य वधम् इच्छति स्म, सः एव अधुना भयेन कम्पते। कृष्णः मथुराम् प्रविश्य रङ्गभूमौ मल्लान् अहन्। ततः सः उच्चासनात् कंसम् आकृष्य भूमौ अपातयत्। यम् राजानम् सर्वे जनाः अबिभयुः, सः कृष्णेन क्षणेन एव हतः। एवम् अधर्मस्य अन्तः, धर्मस्य च जयः अभवत्।'
  translation: He who for long had wished for Kṛṣṇa's death — that very one now trembles with fear. Kṛṣṇa, having entered Mathurā, killed the wrestlers in the arena. Then he dragged Kaṃsa down from his high throne and threw him to the ground. The king whom all people had feared — he was killed by Kṛṣṇa in but a moment. Thus came the end of unrighteousness, and the victory of dharma.
  teaches: 'climax — two relative-correlatives (यः…सः on the subject, यम्…सः on the object); अपादान (भयस्य source → उच्चासनात् ablative, अबिभयुः with 5th); causative अपातयत्; षष्ठी of object with कृत् (कृष्णस्य वधम्, 2.3.65); passive close (हतः)'
