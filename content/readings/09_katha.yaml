  sentence: द्वौ बालौ आस्ताम्। रामः श्यामात् बलवत्तरः आसीत्। श्यामः तु रामात् बुद्धिमत्तरः आसीत्। सर्वेषु बालेषु रामः बलवत्तमः। श्यामः तु सर्वेषु बुद्धिमत्तमः।
  translation: There were two boys. Rāma was stronger than Śyāma. But Śyāma was more intelligent than Rāma. Among all the boys Rāma was the strongest; but Śyāma was the most intelligent of all.
  teaches: |
