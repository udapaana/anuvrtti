    The longest reading yet, weaving together what you met as isolated cells: past participles as adjective and predicate (क्रुद्धा "angry," बद्धः "bound"), an infinitive with "can" (बन्धितुम् न शक्नोति "cannot bind"), and the instrumental of means twice (रज्ज्वा "with a rope," प्रेम्णा "by love"). It closes the way Sanskrit tales love to — a name-etymology: दाम (rope) + उदर (belly) makes the बहुव्रीहि दामोदर, "the one with a rope at his belly." The grammar is familiar; the story now carries it.

- id: ex098
  kind: graded
