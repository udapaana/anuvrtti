      role: ङेर्यः — the अ-stem dative — ङे becomes य → गोवर्धनाय
    - term: सम्प्रदान
      en: recipient (dative)
    - term: चतुर्थी
      en: dative
  - form: पूजाम्
    lemma: पूजा
    gloss: puja
    notes:
