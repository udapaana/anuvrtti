  vyakhya: 'द्विकर्मकयाचिना सह कथा। नृपम् धनम् अयाचत इति अकथितं च (१.४.५१) — याचेः द्वे कर्मणी, प्रधानम् धनम्, अकथितः नृपः। दद्यात् इति विध्यर्थे लिङ् (विधिनिमन्त्रण…)। भिक्षवे इति उदन्तस्य चतुर्थ्येकवचनम् (गुणः → भिक्षवे)।'
  vyakhya_en: |
    Two grammar points sit at the center. First, a **two-object verb**: याच्
    "ask for" governs *two* accusatives — नृपम् धनम् अयाचत, "asked the king (for)
    wealth." The thing wanted (धनम्) is the plain object; the person asked
    (नृपम्) is the कर्मन् only because 1.4.51 (अकथितं च) sweeps up such a
    "residual," otherwise-unnamed participant into the object category. The same
    rule covers दुह् "milk (a cow of milk)" and प्रच्छ् "ask (someone the way)."
    Second, the **optative of precept**: दद्यात् "one should give," लिङ् in the
    विधि sense (3.3.161). Around them, भिक्षवे is the उ-stem dative singular
    (भिक्षु → भिक्षवे).
- id: ex239
  kind: graded
  segment: 254
  source:
    text: कथा (our graded retelling)
    ref: "how conduct is learned — our own telling, in the passive voice"
    curated: our simple Sanskrit; not from any single source
  sentence: आचार्येण कथा कथ्यते। शिष्यैः सा श्रूयते। तया कथया सदाचारः शिक्ष्यते। एवम् बालाः धर्मेण रक्ष्यन्ते।
  translation: By the teacher a story is told. By the students it is heard. By that story good conduct is learned. Thus the children are protected by dharma.
  teaches: |
    the passive voice, and the case that comes with it: the doer stands in the
    instrumental — आचार्येण "by the teacher," शिष्यैः "by the students" — while
    the thing done becomes the subject. Every verb here carries यक्.
  words:
  - form: आचार्येण
    lemma: आचार्य
    gloss: by the teacher
    notes:
    - term: कर्तृ
      en: the agent — in the passive the doer is not the subject
    - cite: '2.3.18'
      role: कर्तृकरणयोस्तृतीया — an unexpressed agent (कर्तृ) or instrument (करण) takes the तृतीया → आचार्येण
    - term: तृतीया
      en: instrumental
  - form: कथा
    lemma: कथा
    gloss: a story
    notes:
    - term: कर्मन्
      en: what is told — grammatical subject of the passive
    - term: प्रथमा
      en: nominative (कर्मणि उक्त)
  - form: कथ्यते
    lemma: कथ्
    gloss: is told
    notes:
    - term: यक्
      en: the passive विकरण
    - cite: '3.1.67'
      role: सार्वधातुके यक् — passive विकरण before a सार्वधातुक ending → कथ् + यक् → कथ्यते
    - term: कर्मणि
      en: passive
    - term: लट्
      en: present (passive 3sg)
  - form: शिष्यैः
    lemma: शिष्य
    gloss: by the students
    notes:
    - term: कर्तृ
      en: the agent (plural)
    - cite: '2.3.18'
      role: कर्तृकरणयोस्तृतीया — the agent takes तृतीया → शिष्यैः
    - term: तृतीया
      en: instrumental plural
  - form: सा
    lemma: तद्
    gloss: it (the story)
    notes:
    - term: सर्वनाम
      en: pronoun (feminine)
    - term: कर्मन्
      en: subject of श्रूयते
    - term: प्रथमा
      en: nominative
  - form: श्रूयते
    lemma: श्रु
    gloss: is heard
    notes:
    - term: यक्
      en: the passive विकरण (श्रु → श्रूयते)
    - term: कर्मणि
      en: passive
    - term: लट्
      en: present (passive 3sg)
  - form: तया
    lemma: तद्
    gloss: by that
    notes:
    - term: सर्वनाम
      en: pronoun (feminine instr., qualifying कथया)
    - term: तृतीया
      en: instrumental
  - form: कथया
    lemma: कथा
    gloss: by the story
    notes:
    - term: करण
      en: means
    - cite: '2.3.18'
      role: कर्तृकरणयोस्तृतीया — the instrument takes तृतीया → कथया
    - term: तृतीया
      en: instrumental
  - form: सदाचारः
    lemma: सदाचार
    gloss: good conduct
    vocab: true
    notes:
    - term: समास
      en: compound — सत् आचारः, "good conduct" (कर्मधारय)
    - term: कर्मन्
      en: subject of शिक्ष्यते
    - term: प्रथमा
      en: nominative
  - form: शिक्ष्यते
    lemma: शिक्ष्
    gloss: is learned
    notes:
    - term: यक्
      en: the passive विकरण
    - term: कर्मणि
      en: passive
    - term: लट्
      en: present (passive 3sg)
  - form: एवम्
    lemma: एवम्
    gloss: thus
    notes:
    - term: अव्यय
      en: adverb — "in this way"
  - form: बालाः
    lemma: बाल
    gloss: the children
    notes:
    - term: कर्मन्
      en: subject of रक्ष्यन्ते (those protected)
    - term: प्रथमा
      en: nominative plural
  - form: धर्मेण
    lemma: धर्म
    gloss: by dharma
    notes:
    - term: करण
      en: means
    - term: तृतीया
      en: instrumental
  - form: रक्ष्यन्ते
    lemma: रक्ष्
    gloss: are protected
    notes:
    - term: यक्
      en: the passive विकरण
    - term: कर्मणि
      en: passive
    - term: लट्
      en: present (passive 3pl)
  vyakhya: 'कर्मणिप्रयोगाभ्यासः। कथ्यते श्रूयते शिक्ष्यते रक्ष्यन्ते इति सर्वाणि यगन्तानि (सार्वधातुके यक्)। आचार्येण शिष्यैः इति कर्तरि तृतीया, कथया धर्मेण इति करणे — उभयत्र कर्तृकरणयोस्तृतीया। कर्म तु प्रथमायाम् — कथा सदाचारः बालाः।'
  vyakhya_en: |
    A drill in the **passive**. Four verbs, all built with यक् (3.1.67):
    कथ्यते, श्रूयते, शिक्ष्यते, रक्ष्यन्ते. The point to feel is the case-shift the
    passive forces: the **agent leaves the nominative** and goes to the
    instrumental — आचार्येण, शिष्यैः — sharing that case with the plain instrument
    कथया, धर्मेण (both by 2.3.18, कर्तृकरणयोस्तृतीया). What is left holding the
    nominative is the **object**: कथा "the story," सदाचारः "good conduct," बालाः
    "the children." Read it beside an active sentence and the machinery is clear.
- id: ex240
  kind: graded
