  sentence: 'कृष्णे गच्छति सति गोप्यः अतीव अरुदन्। याः गोप्यः कृष्णम् प्रेम्णा अपश्यन्, ताः सर्वाः शोकेन मग्नाः अभवन्। रथे स्थितः कृष्णः ताः रुदतीः दृष्ट्वा अपि न न्यवर्तत। तस्य हृदये तु ताः एव सर्वदा अवसन्।'
