  sentence: 'कंसः नाम क्रूरः राजा कृष्णस्य मातुलः आसीत्। सः अचिन्तयत् — "अयम् बालः मया हन्तव्यः, अन्यथा सः माम् हनिष्यति।" तस्मात् सः अक्रूरम् गोकुलम् प्रैषयत्। अक्रूरः रथेन गत्वा कृष्णम् अवदत् — "मथुराम् आगच्छ, यतः तव दर्शनम् सर्वे इच्छन्ति।"'
  translation: A cruel king named Kaṃsa was Kṛṣṇa's maternal uncle. He thought — "This boy must be killed by me, otherwise he will kill me." Therefore he sent Akrūra to Gokula. Akrūra, having gone by chariot, said to Kṛṣṇa — "Come to Mathurā, for everyone desires the sight of you."
