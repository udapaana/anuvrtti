  vyakhya: 'नूतनकथारम्भः — पञ्चतन्त्रात्। कस्मिंश्चित् वने इति लोकप्रसिद्धम् आख्यानारम्भपदम्। मा हन् इति प्रतिषेधे लुङ् अनद्यतनः अनागमकः। आहाराय इति तादर्थ्ये चतुर्थी; प्रेषयिष्यामः इति लृट् उत्तमपुरुषबहुवचने।'
  vyakhya_en: |
    A new story begins — from the Pañcatantra, and it opens with the formula every Sanskrit tale is built on: कस्मिंश्चित् वने "in a certain forest" (कः + चित् = the indefinite "some"). One genuinely new construction: the **prohibitive** — मा with an augmentless past (मा … हन् "do not kill"), the standard way Sanskrit says "don't." Against it stands the animals' **future promise** — प्रेषयिष्यामः "we will send" (लृट्, 1st plural). The dative आहाराय "for food" is the dative of purpose (तादर्थ्य). All the rest — past tenses, gerund मिलित्वा, instrumental of cause भयेन — is grammar you already own, now carrying a fable instead of a god.

