      role: निष्ठा → क्त; passive sense — कर्मणि क्त
    - cite: '1.3.13'
      role: भावकर्मणोः — passive ल-affixes become आत्मनेपद; क्त signals the same कर्मणि sense
  - form: विषम्
    lemma: विष
    gloss: poison
    notes:
    - term: कर्मन्
      en: patient in passive
    - term: प्रथमा
      en: nominative (कर्मणि)
  - form: च
    lemma: च
    gloss: and, also
    notes:
    - term: अव्यय
      en: conjunctive particle
  - form: पीतम्
    lemma: पा
    gloss: was drunk
    notes:
    - term: कृदन्त
      en: past passive participle (क्त) of √पा — neuter agreeing with विषम्
    - cite: '3.2.102'
      role: निष्ठा → क्त
  - form: एवम्
    lemma: एवम्
    gloss: thus, in this way
    notes:
    - term: अव्यय
      en: adverb — "thus"
  - form: पूतना
    lemma: पूतना
    gloss: Pūtanā
    notes:
    - term: कर्मन्
      en: patient in passive construction
    - term: प्रथमा
      en: nominative (कर्मणि)
