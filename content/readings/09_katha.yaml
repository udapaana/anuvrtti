  sentence: कस्मिंश्चित् देशे धनवान् राजा आसीत्। तस्य पिता वृद्धः दरिद्रः च अभवत्। राजा पितरम् न अपश्यत्, न च तम् अस्मरत्। एकदा भगवान् मुनिः सभाम् आगच्छत्। सः राजानम् अवदत् — पितरि भक्तिः एव धर्मः। यः पितरम् त्यजति सः राज्ञः नाम न अर्हति। तत् श्रुत्वा राज्ञा शिरः अवनतम्। ततः सः पितुः गृहम् अगच्छत्, तस्य पादौ च अस्पृशत्।
