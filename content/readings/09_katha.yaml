  vyakhya: रक्तानि दृष्ट्वा सा अमन्यत। दर्शनम् सत्यम्, अनुमानम् मिथ्या।
  vyakhya_en: |
    Everything the wife sees is true. There is blood on the mongoose's mouth.
    What she adds is the inference, and the story hangs the whole tragedy on
    the gap between them — रक्तानि दृष्ट्वा, seeing the blood, and then
    खादितः, "he has been eaten", which she never saw at all.

    The participles carry it. हतः, लिप्तम्, सुप्तम्, हतम् are all states
    someone else could have verified; खादितः is the one she supplied. And the
    last word answers it: कृतवती, the active past participle — not something
    done to her, but the thing she did.
- id: ex195
  kind: graded
  segment: 400
  source:
    text: पञ्चतन्त्र (our graded retelling)
    ref: "Pañcatantra I — सिंहः शशकः च, the closing"
    curated: our simple Sanskrit telling of the well-known episode; NOT the verbatim text
  sentence: शशकः सिंहम् एकम् कूपम् अनयत्। "अत्र सः शत्रुः वसति" इति सः अवदत्। सिंहः कूपम् अपश्यत्। जले तस्य एव प्रतिबिम्बम् आसीत्, किन्तु सः तत् अन्यम् सिंहम् अमन्यत। क्रुद्धः सः गर्जितुम् आरभत। कूपात् प्रतिशब्दः श्रूयते स्म। तेन सः अतीव अक्रुध्यत्। "अहम् एनम् हनिष्यामि" इति उक्त्वा सः कूपे अपतत्। तत्र मग्नः सिंहः अम्रियत। एवम् बुद्ध्या शशकः सर्वान् मृगान् अरक्षत्। बलम् बुद्धिः च — तयोः बुद्धिः एव श्रेष्ठा।
  translation: The rabbit led the lion to a well. "Your enemy lives here," he said. The lion looked into the well. In the water was his own reflection, but he took it for another lion. Enraged, he began to roar. An echo was heard from the well. At that he grew still angrier. Saying "I will kill him," he leapt into the well. Sunk there, the lion died. Thus by his wit the rabbit saved all the beasts. Strength and intelligence — of the two, intelligence is the better.
  teaches: |
    the close of the सिंह-शशक story. Eight past verbs against one future —
    हनिष्यामि, the thing the lion intends and does not accomplish.
