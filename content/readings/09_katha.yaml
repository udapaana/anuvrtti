  vyakhya: कथा दीर्घतरा। क्रुद्धा बद्धः इति निष्ठे, बन्धितुम् इति तुमुन्, रज्ज्वा प्रेम्णा इति करणे। अन्ते नामनिर्वचनम् — दाम उदरे यस्य सः दामोदरः।
