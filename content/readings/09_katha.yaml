  sentence: यशोदा गृहे नवनीतम् रक्षति। किन्तु कृष्णः नवनीतम् इच्छति। सः शनैः गृहम् प्रविशति, उच्चैः च नवनीतम् चोरयति। ततः सः मित्रेभ्यः तत् नवनीतम् यच्छति, स्वयम् च खादति। यशोदा तं पश्यति, क्रुध्यति च।
