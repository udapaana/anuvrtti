  sentence: ग्रामे कुलालः वसन् घटान् अकरोत्। एकदा राज्ञः भ्राता तम् ग्रामम् आगच्छत्। कुलालम् कार्यम् कुर्वन्तम् दृष्ट्वा सः अवदत् — मम गृहे शतम् घटाः स्थापनीयाः। कुलालः अवदत् — कर्तव्यम् एतत्, किन्तु मूल्यम् दातव्यम्। भ्राता हसन् अवदत् — पिता मे राजा आसीत्, अहम् न मूल्यम् ददामि। कुलालः अवदत् — तर्हि घटाः न सन्ति। तत् श्रुत्वा भ्राता लज्जितः अभवत्।
