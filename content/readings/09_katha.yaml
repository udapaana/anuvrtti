# ════════════════════════════════════════════════════════════════════════
#  09_katha.yaml — कथा — the graded STORY track (connected narrative)
#
#  These are MULTI-SENTENCE graded readings that tell extant, canonical stories
#  (bāla-Kṛṣṇa first) in OUR simple Sanskrit, pitched to grammar already met.
#  The STORY is the tradition's; the SENTENCES are ours (kind: graded). We do
#  NOT claim these are the verbatim Bhāgavata — the `source` note credits the
#  episode's origin and discloses that the prose is our graded retelling.
#
#  Principle: continuity over isolation. A recurring cast (कृष्णः, यशोदा, गोप्यः,
#  गावः, गोकुलम्) threads through, so vocabulary compounds and the reader builds
#  a world. New grammar enters as the story needs it; only the NEW/notable form
#  in each reading gets full annotation — known forms are glossed lightly.
#  Difficulty climbs: sentences lengthen as the arc proceeds, feeding into the
#  attested Hitopadeśa/Pañcatantra ladder (06_readings.yaml).
#  Source of truth; the app is derived. Schema: readings/_SCHEMA.md.
# ════════════════════════════════════════════════════════════════════════

