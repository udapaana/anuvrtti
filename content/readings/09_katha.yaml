  vyakhya: 'इह कालभेदः स्पष्टः — बालाः अवदन्, यशोदा पप्रच्छ, कृष्णः उवाच इति लिट् परोक्षे; परन्तु स्मृत्या न परोक्षं — नाटकीयतया लिट् उचितः। लङ् तु अनद्यतने — अभक्षयत्, अखादः, अखादम्, अपश्यत् इति। लोट् विवृणुष्व इति विधौ।'
  vyakhya_en: |
    Two tenses meet in this reading. **लिट् perfect** (परोक्षे लिट्, 3.2.115) appears where the narrator stands at a remove — पप्रच्छ "she asked," उवाच "he said" — verbs of reported or narrated speech. **लङ्** (अनद्यतन, 3.2.111) marks the events directly recalled: the eating (अभक्षयत्), Kṛṣṇa's denial (न अखादम्), and Yaśodā's vision (अपश्यत्). One **लोट् imperative** (3.3.162) lives inside the quoted command — विवृणुष्व "open (your mouth)!" The vision that follows — sky, earth, gods, stars — is the whole universe listed in a single accusative string, with one past-active participle (दृष्टवती, क्तवतु fem.) as the main predicate: "she who saw."

