      en: the क्त्वा suffix, same-subject prior action
    - cite: '1.1.40'
      role: क्त्वातोसुन्कसुनः — a क्त्वा-form is अव्यय, taking no endings → श्रुत्वा
    - term: अव्यय
      en: indeclinable
  - form: अहसत्
    lemma: हस्
    gloss: laughed
