  sentence: नगरे धनवान् वणिक् वसति स्म। सः चिन्तयत् — किम् मया कर्तव्यम्, केन मम जीवनम् सफलम् भवेत्। एकः मुनिः अवदत् — दानम् कुरु। तत् श्रुत्वा वणिक् दरिद्रेभ्यः अन्नम् अयच्छत्। तस्य दानेन बहवः जनाः अतुष्यन्। रामेण तत् दृष्टम्, सः च अवदत् — एतत् एव धर्मस्य आचरणम्।
  translation: In a city there lived a wealthy merchant. He thought — "What should I do? By what would my life be fruitful?" A sage said — "Practise giving." Hearing that, the merchant gave food to the poor. By his giving many people were satisfied. Rāma saw that, and said — "This alone is the practice of dharma."
