    - cite: '2.1.22'
      role: तत्पुरुषः — a compound whose second member carries the main sense is तत्पुरुष
    - cite: '2.2.8'
      role: षष्ठी — a षष्ठी-relation (नराणाम्) compounded → षष्ठी-तत्पुरुष
    - term: सम्बन्ध
