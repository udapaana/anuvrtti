      en: object
    - term: द्वितीया
      en: accusative
  - form: कुरुत
    lemma: कृ
    gloss: do! perform! (imperative pl.)
    notes:
    - term: कृ
      en: '"do"'
    - cite: '3.3.162'
      role: लोट् च — command takes लोट् → कुरुत (2pl लोट्)
  - form: न
    lemma: न
    gloss: not
