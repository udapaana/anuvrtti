  vyakhya: दाशरथिः रामः दीनेभ्यः धनम् अयच्छत् — यत् दानम् श्रेष्ठम् इति मुनेः वचनम्।
  vyakhya_en: |
    A story built from two derivations. दाशरथिः is a patronymic — दशरथ + इञ् with
    आदिवृद्धि, "the son of Daśaratha" (4.1.92, 4.1.95) — a नाम that is itself a
    grammar. And the sage's counsel turns on a gerundive: धनम् देयम्, "wealth is
    TO BE given," दा + यत् (3.1.97). The one who gives, दाता, is the तृच् agent-noun
    of the same root — so the giving, the giver, and the thing-to-be-given all
    stand on दा.
- id: ex222
  kind: graded
  segment: 550
  source:
