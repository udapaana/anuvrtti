  sentence: पुरा अयोध्यायाम् दशरथः नाम राजा आसीत्। तस्य पुत्रः दाशरथिः रामः महाबलः अभवत्। एकदा मुनिः तम् अवदत् — हे राजपुत्र, दीनेभ्यः धनम् देयम्। यः दाता सः श्रेष्ठः। तत् श्रुत्वा रामः बहुभ्यः जनेभ्यः धनम् अयच्छत्। सर्वे तम् अपूजयन्।
  translation: Long ago in Ayodhyā there was a king named Daśaratha. His son Dāśarathi Rāma grew mighty. One day a sage said to him — "O prince, wealth is to be given to the poor. He who gives is the best." Having heard that, Rāma gave wealth to many people. Everyone honored him.
  teaches: |
    a patronymic and a gerundive in a story: दाशरथिः "son of Daśaratha" (the
    तस्यापत्यम् sense, इञ्), and देयम् "to be given," the यत् gerundive of दा.
