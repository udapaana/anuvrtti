  sentence: 'कस्मिंश्चित् वने भासुरको नाम सिंहः वसति स्म। सः बलवान् आसीत्, किन्तु अतीव क्रूरः। प्रतिदिनम् सः बहून् पशून् अहन्। तेन सर्वे मृगाः भयेन कम्पन्ते स्म। ते मिलित्वा सिंहम् ऊचुः — "हे स्वामिन्, मा सर्वान् पशून् हन्। वयम् एव प्रतिदिनम् एकम् पशुम् तव आहाराय प्रेषयिष्यामः।"'
  translation: In a certain forest there lived a lion named Bhāsuraka. He was strong, but exceedingly cruel. Every day he killed many animals. Because of this all the beasts trembled with fear. They, having gathered, said to the lion — "O master, do not kill all the animals. We ourselves will send one animal every day for your food."
