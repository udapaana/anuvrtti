    - cite: '3.1.67'
      role: सार्वधातुके यक् → यक् marks the passive stem → श्रु + य → श्रूय
    - cite: '3.4.69'
      role: लः कर्मणि च → the ल-affix denotes the कर्म (passive) → आत्मनेपद ending → अश्रूयत
    - term: लङ्
      en: imperfect
    - term: कर्मणि
      en: passive — the object, not the agent, governs the verb
  - form: गुरुः
    lemma: गुरु
    gloss: the teacher
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: ततः
    lemma: ततस्
    gloss: thereupon, from that
    notes:
    - term: तद्धित
      en: adverb from तद् — "from that," then "thereupon"
    - term: तसिल्
      en: the तसिल् (-तस्) suffix, अर्थ = पञ्चमी (ablative sense)
    - cite: '5.3.7'
      role: पञ्चम्यास्तसिल् → तसिल् in the ablative sense → तद् + तस् → ततः
    - term: अव्यय
      en: indeclinable
  - form: तुष्टः
    lemma: तुष्
    gloss: pleased
    vocab: true
    notes:
    - term: कृदन्त
      en: past participle — "having become pleased"
    - term: क्त
      en: the क्त निष्ठा suffix
    - cite: '3.2.102'
      role: निष्ठा → क्त past participle → तुष् + त → तुष्टः
    - term: प्रथमा
      en: nominative — predicated of गुरुः
  - form: अभवत्
    lemma: भू
    gloss: became
    notes:
    - term: लङ्
      en: imperfect
  - form: श्रेष्ठाय
    lemma: श्रेष्ठ
    gloss: to the best one
    vocab: true
    notes:
    - term: तद्धित
      en: superlative derivative — "best"
    - term: इष्ठन्
      en: the इष्ठन् superlative suffix, अर्थ = अतिशायन (of all)
    - cite: '5.3.55'
      role: अतिशायने तमबिष्ठनौ → इष्ठन् for surpassing all → प्रशस्य + इष्ठ → श्रेष्ठ
    - term: सम्प्रदान
      en: recipient of the giving
    - term: चतुर्थी
      en: dative
  - form: वरम्
    lemma: वर
    gloss: a boon
    notes:
    - term: कर्मन्
      en: object
    - term: द्वितीया
      en: accusative
  - form: अददात्
    lemma: दा
    gloss: gave
    notes:
    - term: लङ्
      en: imperfect
  vyakhya: एकस्मिन्नाख्याने तरप्, कर्मधारयः, यक्, तसिल्, इष्ठन् — पञ्च शब्दप्रकाराः।
  vyakhya_en: |
    Degrees and a passive, in one scene. पटुः is the plain grade; पटुतरः the
    **comparative** — पटु + तर, "cleverer of the two"; श्रेष्ठ the **superlative**,
    the इष्ठन्-grade of प्रशस्य, "best of all." महाबुद्धिः is a **compound** —
    महती बुद्धिः यस्य, "he whose mind is great." अश्रूयत is a **passive**: the यक्
    stem turns श्रु into "is heard," so तत् (the question) becomes the प्रथमा and
    सर्वैः (all who hear) the तृतीया — the object rises to subject, the agent
    steps back. And ततः is a **तसिल् adverb**, तद् + तस्, "from that → thereupon."

