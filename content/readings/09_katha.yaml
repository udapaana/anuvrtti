  sentence: 'कालियो नाम महासर्पः कालिन्दीनद्यां वसति स्म। तस्य विषेण जलं दूषितम् आसीत्। गावः पिबन्त्यः तत् जलम् पीत्वा मूर्च्छिताः अभवन्। तदा कृष्णः तरुम् आरुह्य नद्यां अपतत्। सः सर्पस्य फणेषु नृत्यन् तम् अदमयत्। एवम् कालियः कृष्णेन पराजितः।'
  translation: A great serpent named Kāliya lived in the Yamunā river. By his poison the water was polluted. The cows, while drinking, drank that water and fainted. Then Kṛṣṇa climbed a tree and fell into the river. He danced on the serpent's hoods and subdued it. Thus Kāliya was defeated by Kṛṣṇa.
  teaches: 'लिट्-style past (वसति स्म as past habitual); passive क्त with आसीत् (past passive predicate); gerund आरुह्य + अपतत्; present participle (शतृ) पिबन्त्यः, नृत्यन् (action simultaneous with main verb); passive अदमयत् → पराजितः'
