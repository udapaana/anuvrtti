  vyakhya: 'सुप्तिङन्तरूपप्रधाना कथा। पिता इति ऋदन्तस्य प्रथमैकवचनम् (७.१.९४)। पुत्रयोः इति ओसि ए-आदेशः (७.३.१०४); पुत्राभ्याम् इति भ्यामि अकारस्य दीर्घः (७.३.१०२)। स्नेहम् धनम् क्षेत्रम् इति अमि पूर्वरूपम् (६.१.१०७)। तथैव इति वृद्धिसन्धिः (६.१.८८)।'
  vyakhya_en: |
    A story that shows off the **endings** rather than a new construction. The
    quiet machinery of declension: पिता, the ऋ-stem nominative singular (7.1.94,
    पितृ → पिता); the two dual obliques of an अ-stem — पुत्रयोः (genitive, 7.3.104
    अ → ए before ओस्) and पुत्राभ्याम् (dative, 7.3.102 अ → आ before भ्याम्); and
    the accusative singular धनम् / स्नेहम् / क्षेत्रम्, which is 6.1.107 अमि पूर्वः
    (the stem-अ and the ending-अ of अम् fuse to one अ) on every page you will ever
    read. Even तथैव hides a rule — तथा + एव → तथैव is the vṛddhi सन्धि (6.1.88).
- id: ex238
  kind: graded
  segment: 253
  source:
    text: कथा (our graded retelling)
    ref: "the beggar and the giving king — our own telling"
    curated: our simple Sanskrit; not from any single source
  sentence: एकदा भिक्षुः नृपम् धनम् अयाचत। नृपः अचिन्तयत् — दीनेभ्यः सदा धनम् दद्यात् इति। ततः सः भिक्षवे बहु धनम् अददात्। भिक्षुः तुष्टः अभवत्।
  translation: One day a beggar asked the king for wealth. The king thought — "One should always give wealth to the needy." Then he gave much wealth to the beggar. The beggar became satisfied.
  teaches: |
    a two-object verb — नृपम् धनम् अयाचत "asked the king for wealth": the thing
    asked-for is the plain object, but the person asked is a second, "residual"
    object. And दद्यात् "one should give," the optative of precept.
  words:
  - form: एकदा
    lemma: एकदा
    gloss: one day
    notes:
    - term: अव्यय
      en: adverb of time
  - form: भिक्षुः
    lemma: भिक्षु
    gloss: a beggar, mendicant
    vocab: true
    notes:
    - term: कर्तृ
      en: subject
    - term: प्रथमा
      en: nominative (उ-stem)
  - form: नृपम्
    lemma: नृप
    gloss: the king (whom he asks)
    notes:
    - term: कर्मन्
      en: the "residual" second object — the person asked
    - cite: '1.4.51'
      role: अकथितं च — with verbs like याच् (ask), दुह् (milk), प्रच्छ् (ask the way), a second participant not otherwise named takes the कर्मन् संज्ञा → नृपम् धनम् अयाचत
    - term: द्वितीया
      en: accusative
  - form: धनम्
    lemma: धन
    gloss: wealth (what he asks for)
    notes:
    - term: कर्मन्
      en: the principal object — what is asked for
    - term: द्वितीया
      en: accusative
