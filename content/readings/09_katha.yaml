  vyakhya: 'अधिकरणं त्रिविधम् इह — सति-सप्तमी (कृष्णे गच्छति सति) कालार्थे; रथे हृदये इति देशाधिकरणे। याः…ताः इति वाक्यद्वये सम्बन्धः। रुदतीः इति शतृ कर्मणि (ताः रुदतीः)। दृष्ट्वा अपि इति अनुमत्यर्थे — "दृष्ट्वापि न न्यवर्तत"।'
  vyakhya_en: |
    Three locatives, three jobs. The **locative absolute** (सति-सप्तमी, 2.3.37) sets the scene in time — कृष्णे गच्छति सति "Kṛṣṇa being-in-the-act-of-going," i.e. "as Kṛṣṇa was leaving": a whole subordinate clause folded into two locative words. Ordinary locatives of place follow — रथे "in the chariot," हृदये "in the heart" (2.3.36). The relative-correlative याः … ताः now spans a full clause ("those gopīs who used to look on him — they all sank in grief"). And the शतृ participle appears for the first time **as an accusative object** — ताः रुदतीः "them, the weeping ones." दृष्ट्वा अपि "even having seen" gives the concessive: he saw, yet did not turn.

