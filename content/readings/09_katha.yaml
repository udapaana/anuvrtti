  sentence: कस्मिंश्चित् देशे धनवान् राजा आसीत्। तस्य पिता वृद्धः दरिद्रः च अभवत्। राजा पितरम् न अपश्यत्, न च तम् अस्मरत्। एकदा भगवान् मुनिः सभाम् आगच्छत्। सः राजानम् अवदत् — पितरि भक्तिः एव धर्मः। यः पितरम् त्यजति सः राज्ञः नाम न अर्हति। तत् श्रुत्वा राज्ञा शिरः अवनतम्। ततः सः पितुः गृहम् अगच्छत्, तस्य पादौ च अस्पृशत्।
  translation: In a certain country there was a wealthy king. His father had become old and poor. The king did not look at his father, nor did he remember him. One day the Blessed One, a sage, came to the assembly. He said to the king — "Devotion toward one's father is dharma itself. He who abandons his father does not deserve the name of king." Having heard that, the king's head was bowed. Then he went to his father's house, and touched his feet.
  teaches: |
    a king who forgets his father. पितृ appears in four cases across the
    story — पिता, पितरम्, पितरि, पितुः.
