  sentence: 'एकदा कृष्णः मृत्तिकाम् अभक्षयत् इति बालाः यशोदां अवदन्। यशोदा पुत्रं पप्रच्छ — "किम् त्वं मृत्तिकाम् अखादः?" कृष्णः उवाच — "न अखादम्।" तदा यशोदा मुखं विवृणुष्व इति उक्त्वा दृष्टवती। तस्मिन् मुखे सा सर्वम् जगत् अपश्यत् — खम्, भूमिम्, देवान्, नक्षत्राणि च।'
