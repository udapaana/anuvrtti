- id: ex118
  kind: graded
  segment: 250
  sentence: नन्दनः नाम पुत्रः मातरम् नन्दयति।
  translation: A son named Nandana ("Delighter") gladdens his mother.
  teaches: ल्यु (→ अन) forms an agent-noun from नन्दि-group roots.
  words:
  - form: नन्दनः
    lemma: नन्दन
    gloss: '"delighting one / son" — one who delights'
    vocab: true
    notes:
    - cite: '3.1.134'
      role: नन्दिग्रहिपचादिभ्यो ल्युणिन्यचः → नन्द् + ल्यु (अन) → नन्दनः
    - term: कृदन्त
      en: agent-noun in अन from the नन्दि-group
    - term: ल्यु
      en: नन्द् + ल्यु — ल्यु's यु becomes अन (7.1.1), so the doer is नन्दन
    - term: कर्तरि
      en: names the doer — the one who delights
    - term: प्रथमा
      en: nominative singular
    - cite: "1.3.9"
      role: "तस्य लोपः — इत् markers are dropped → नन्दनः"
    - cite: "1.4.14"
      role: "सुप्तिङन्तं पदम् — the पद saṃjñā → नन्दनः"
  - form: नाम
    lemma: नामन्
    gloss: by name
    notes:
    - term: अव्यय
      en: '"by name" — marks नन्दनः as the son''s name'
    - term: निपात
      en: particle
  - form: पुत्रः
    lemma: पुत्र
    gloss: a son
    notes:
    - term: कर्तृ
      en: agent — the one named नन्दनः
    - term: प्रथमा
      en: nominative
  - form: मातरम्
    lemma: मातृ
    gloss: '"mother" — object of the verb'
    vocab: true
    notes:
    - term: कर्मन्
      en: object of नन्दयति
    - term: द्वितीया
      en: accusative (ऋ-stem, strong → मातरम्)
  - form: नन्दयति
    lemma: नन्द्
    gloss: gladdens, causes to rejoice
    notes:
    - term: नन्द्
      en: the finite verb (causative)
    - term: लट्
      en: present
  vyakhya: नन्दतीति नन्दनः। नन्दिग्रहिपचादिगणे नन्दिधातोः ल्युप्रत्ययः, यस्य अनादेशः।
  vyakhya_en: |
    Roots of the नन्दि-group take ल्यु, and ल्यु is replaced by अन, giving agent-nouns like नन्दनः "the delighter" — fit name for a son: नन्दनः नाम पुत्रः मातरम् नन्दयति. Unlike अण् and क above, this ल्यु-formation needs no उपपद object to attach; the affix alone names the doer. The same rule routes ग्रहि-roots to णिनि and पच्-group roots to अच्.
