- id: ex112
  kind: graded
  segment: 210
  sentence: सः प्रातः वनाय गमनम् आरभते।
  translation: In the morning he sets out for the forest.
  teaches: ल्युट् makes a neuter भाव action-noun in -अन; गम् → गमनम्.
  words:
  - form: सः
    lemma: तद्
    gloss: he
    notes:
    - term: सर्वनाम
      en: pronoun
    - term: पुंलिङ्ग
      en: masculine
    - term: कर्तृ
      en: agent of आरभते
    - term: प्रथमा
      en: nominative
  - form: प्रातः
    lemma: प्रातर्
    gloss: in the morning
    notes:
    - term: अव्यय
      en: indeclinable — time
  - form: वनाय
    lemma: वन
    gloss: for the forest
    notes:
    - term: सम्प्रदान
      en: goal of the going — गमन allows the goal in चतुर्थी as well as द्वितीया
    - cite: '2.3.12'
      role: गत्यर्थकर्मणि द्वितीयाचतुर्थ्यौ — goal of motion in द्वितीया or चतुर्थी → वनाय
    - term: चतुर्थी
      en: dative
  - form: गमनम्
    lemma: गम्
    gloss: '"going" — the act of going (action-noun)'
    vocab: true
    notes:
    - term: ल्युट्
      en: the ल्युट् action-noun suffix — names the bare act (भाव)
    - term: द्वितीया
      en: accusative; here the object
    - cite: '3.3.115'
      role: ल्युट् च → गम् → गमनम् (neuter action-noun in -अन)
  - form: आरभते
    lemma: रभ्
    gloss: begins, undertakes
    vocab: true
    notes:
    - term: आ-रभ्
