    - term: लट्
      en: present
  vyakhya: धातोः भावे ल्युट् प्रत्ययः, तस्य अन इति आदेशः। गम् इत्यस्मात् गमनम् इति नपुंसकं कृदन्तम्। तत् द्वितीयायां कर्म।
  vyakhya_en: |
    By 3.3.115 the affix ल्युट् (realized as -अन) is added to a root to name the bare action (भाव), giving a neuter noun. From गम् "to go" we get गमनम्, "going". Here it stands in the accusative as the object of आरभते — सः प्रातः वनाय गमनम् आरभते, "in the morning he begins his going to the forest," its goal वनाय in the dative that motion allows (2.3.12).

