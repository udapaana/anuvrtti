  source:
    text: कथा (our graded retelling)
    ref: "the generous king — our own telling"
    curated: our simple Sanskrit; not from any single source
  sentence: राजा धनवान् शूरः च आसीत्। सः दूतम् धनम् आनाययत्, ब्राह्मणेभ्यः च तत् अददात्। एवम् सः महान् दाता अभवत्। तस्य शूरत्वम् सर्वे अगायन्। राजा तत् श्रुत्वा अहसत्, किन्तु गर्वम् न अकरोत्।
  translation: The king was wealthy and brave. He had a messenger bring wealth, and gave it to the brahmins. Thus he became a great giver. All sang of his bravery. The king, having heard that, laughed, but felt no pride.
  teaches: |
    one causative (आनाययत्, "had brought"), one agent-noun (दाता), one abstract
    (शूरत्वम्, "bravery"), one possessive (धनवान्), one gerund (श्रुत्वा) — four
    parts of speech in five clauses.
