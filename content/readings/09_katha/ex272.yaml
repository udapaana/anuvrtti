- id: ex272
  kind: graded
  segment: 284
  order: 4
  sentence: "एकस्मिन् नगरे राजा वसति। एकदा मुनिः नगरम् आगच्छति। सः तस्मै राज्ञे चतुर्णाम् भ्रातॄणाम् कथाम् आचष्टे। ते भ्रातरः कलहेन नष्टाः।"
  translation: "In a certain city lives a king. One day a sage comes to the city. He tells that king the story of four brothers. Those brothers were ruined by quarrelling."
  teaches: 'आचष्टे "tells" (आ + चक्ष्, अदादि) with ष्टुत्व; णत्व in चतुर्णाम् भ्रातॄणाम्; तस्मै राज्ञे.'
