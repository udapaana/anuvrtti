- id: ex272
  kind: graded
  segment: 284
  order: 4
  sentence: 'एकदा मुनिः नगरम् आगच्छति। सः तस्मै राज्ञे चतुर्णाम् भ्रातॄणाम् कथाम् आचष्टे।'
  translation: 'One day a sage comes to the city. He tells that king the story of four brothers.'
  teaches: 'आचष्टे "tells" (आ + चक्ष्, अदादि) with ष्टुत्व; णत्व in चतुर्णाम् भ्रातॄणाम्; तस्मै राज्ञे.'
  words:
  - form: एकदा
    lemma: एकदा
    gloss: 'once, one day'
    notes:
    - term: अव्यय
      en: 'indeclinable — time'
  - form: मुनिः
    lemma: मुनि
    gloss: 'a sage'
    notes:
    - term: कर्तृ
      en: 'the one who comes'
    - term: प्रथमा
      en: 'nominative'
  - form: नगरम्
    lemma: नगर
    gloss: 'the city'
    notes:
    - term: कर्मन्
      en: 'the goal of motion'
    - term: द्वितीया
      en: 'accusative'
  - form: आगच्छति
    lemma: गम्
    gloss: 'comes'
    notes:
    - term: लट्
      en: 'present, with the preverb आ'
  - form: सः
    lemma: तद्
    gloss: 'he'
    notes:
    - term: सर्वनाम
      en: 'pronoun'
    - term: प्रथमा
      en: 'nominative'
    - term: कर्तृ
      en: 'the teller'
  - form: तस्मै
    lemma: तद्
    gloss: 'that'
    notes:
    - term: सर्वनाम
      en: 'pronoun, here qualifying राज्ञे'
    - term: चतुर्थी
      en: 'dative'
    - cite: "7.1.14"
      role: 'सर्वनाम्नः स्मै — the pronoun dative in स्मै → तस्मै'
  - form: राज्ञे
    lemma: राजन्
    gloss: 'to the king'
    notes:
    - term: सम्प्रदान
      en: 'the one told'
    - term: चतुर्थी
      en: 'dative'
  - form: चतुर्णाम्
    lemma: चतुर्
    gloss: 'four'
    notes:
    - term: संख्या
      en: 'numeral'
    - term: विशेषण
      en: 'qualifying भ्रातॄणाम्'
    - term: षष्ठी
      en: 'genitive plural'
    - cite: "8.4.1"
      role: 'रषाभ्यां नो णः — after र्, न becomes ण → चतुर्णाम्'
    rel:
    - kind: विशेषण
      to: 8
  - form: भ्रातॄणाम्
    lemma: भ्रातृ
    gloss: 'of brothers'
    notes:
    - term: सम्बन्ध
      en: 'whose story'
    - term: षष्ठी
      en: 'genitive plural'
    - cite: "8.4.1"
      role: 'रषाभ्यां नो णः — after ऋ, न becomes ण → भ्रातॄणाम्'
  - form: कथाम्
    lemma: कथा
    gloss: 'the story'
    notes:
    - term: कर्मन्
      en: 'what is told'
    - term: द्वितीया
      en: 'accusative'
  - form: आचष्टे
    lemma: चक्ष्
    gloss: 'tells'
    notes:
    - term: लट्
      en: 'present (आ + चक्ष्, अदादि, आत्मनेपद)'
    - cite: "8.4.41"
      role: 'ष्टुना ष्टुः — after ष्, the त of the ending becomes ट → आचष्टे'
