- id: ex272
  kind: graded
  segment: 284
  order: 4
  sentence: एकस्मिन् नगरे राजा वसति; तस्य पुत्राः सदा कलहम् कुर्वन्ति। एकदा मुनिः नगरम् आगच्छति। सः तस्मै राज्ञे चतुर्णाम् भ्रातॄणाम् कथाम् आचष्टे — ते भ्रातरः कलहेन नष्टाः। ततः राजा पुत्रान् वदति — कलहम् त्यजत।
  translation: 'In a certain city lives a king; his sons are always quarrelling. One day a sage comes to the city. He tells that king the story of four brothers: those brothers were ruined by quarrelling. Then the king says to his sons: "Give up quarrelling."'
  teaches: 'आचष्टे "tells" (आ + चक्ष्, अदादि) with ष्टुत्व; णत्व in चतुर्णाम् भ्रातॄणाम्; तस्मै राज्ञे. The tale is told for a reason: the king''s own sons, and the imperative त्यजत at the end.'
  words:
  - form: एकस्मिन्
    lemma: एक
    gloss: in a certain
    notes:
    - term: संख्या
      en: '"one, a certain" — declines like a pronoun'
    - term: विशेषण
      en: qualifying नगरे
    - term: एकवचन
      en: singular
    - term: नपुंसकलिङ्ग
      en: neuter, with नगरे
    - term: सप्तमी
      en: 'locative — एक declines like a pronoun, taking स्मिन्: एकस्मिन्'
  - form: नगरे
