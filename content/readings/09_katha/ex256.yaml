  vyakhya: 'मनोरथकथा — लृड्लिङोः प्रयोगः। क्रेष्यामि भविष्यामि इति मनोराज्ये लृट्; यदि … सेवेत तर्हि … ताडयेयम् इति सम्भावनायां लिङ् (विधिनिमन्त्रण… लिङ्)। विक्रीय इति ल्यप्; चिन्तयन् इति शतृ। अन्ते तु लङ् — अहन् नष्टाः — स्वप्नभङ्गे।'
  vyakhya_en: |
    The castle-in-the-air, and the two moods that build it. The daydream runs in
    the **future** — क्रेष्यामि "I will buy," भविष्यामि "I will become." Then the
    **conditional**, framed यदि … तर्हि "if … then," takes the **optative** in both
    halves: यदि भार्या न सेवेत, तर्हि ताम् ताडयेयम्, "if my wife would not obey, then
    I would beat her" (3.3.161). And the moment the imagined arm swings, the tense
    snaps back to plain past — पादेन घटम् अहन्, सक्तवः नष्टाः: "he struck the pot;
    the meal was lost." Grammar telling the joke.
