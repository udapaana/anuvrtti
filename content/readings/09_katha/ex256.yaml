  source:
    text: कथा (our graded retelling)
    ref: "the daydreaming brahmin — our own telling (after the Pañcatantra)"
    curated: our simple Sanskrit; a retelling, not quoting any edition
  sentence: दरिद्रः ब्राह्मणः सक्तून् अलभत। सः अचिन्तयत् — एतान् विक्रीय अहम् अजाः क्रेष्यामि। ताभिः अहम् धनी भविष्यामि। यदि भार्या माम् न सेवेत तर्हि ताम् ताडयेयम् — इति चिन्तयन् सः पादेन घटम् अहन्। सक्तवः नष्टाः।
  translation: A poor brahmin got some barley-meal. He thought — "Selling this, I will buy goats. By them I will become rich. If my wife does not obey me, then I would beat her" — and thinking so, he struck the pot with his foot. The barley-meal was lost.
  teaches: |
    the tenses of imagination — the future (क्रेष्यामि "I will buy," भविष्यामि "I
    will become") for the daydream, and the optative in a यदि … तर्हि condition
    (यदि … न सेवेत, तर्हि … ताडयेयम्, "if she wouldn't … then I would").
