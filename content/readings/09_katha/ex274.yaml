- id: ex274
  kind: graded
  segment: 286
  order: 6
  sentence: 'ज्येष्ठः अनुजम् न द्वेष्टि। सः पितॄणाम् धनम् तस्मै यच्छति। ततः द्वयोः भ्रात्रोः मैत्री भवति।'
  translation: 'The elder no longer hates his younger brother. He gives him their fathers'' wealth. Then there is friendship between the two brothers.'
  teaches: 'पितॄणाम् — the ऋ-stem genitive plural, with णत्व; द्वयोः, the dual''s ए before ओस्.'
  words:
  - form: ज्येष्ठः
    lemma: ज्येष्ठ
    gloss: 'the elder'
    notes:
    - term: तद्धित
      en: 'secondary derivative'
    - term: इष्ठन्
      en: 'superlative'
    - term: कर्तृ
      en: 'the one who no longer hates'
    - term: प्रथमा
      en: 'nominative'
  - form: अनुजम्
    lemma: अनुज
    gloss: 'his younger brother'
    notes:
    - term: कर्मन्
      en: 'the one not hated'
    - term: द्वितीया
      en: 'accusative'
  - form: न
    lemma: न
    gloss: 'not'
    notes:
