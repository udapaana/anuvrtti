- id: ex273
  kind: graded
  segment: 285
  order: 5
  sentence: 'द्वौ भ्रातरौ कलहम् कुरुतः। यः भ्रातरम् द्वेष्टि, सः आत्मानम् एव द्वेष्टि इति मुनिः आचष्टे। ज्येष्ठः तत् वचनम् शृणोति।'
  translation: 'Two brothers are quarrelling. "He who hates his brother hates only himself," the sage says. The elder of them hears those words.'
  teaches: 'A यः … सः maxim, quoted with इति; द्वेष्टि and आचष्टे both show ष्टुत्व.'
  words:
  - form: द्वौ
    lemma: द्वि
    gloss: 'two'
    notes:
    - term: संख्या
      en: 'numeral'
    - term: विशेषण
      en: 'qualifying भ्रातरौ'
    - term: प्रथमा
      en: 'nominative dual'
    rel:
    - kind: विशेषण
      to: 1
  - form: भ्रातरौ
    lemma: भ्रातृ
    gloss: 'two brothers'
    notes:
    - term: सर्वनामस्थान
      en: 'strong dual — भ्रातृ takes the गुण grade अर् before औ'
    - term: कर्तृ
      en: 'the two who quarrel; the elder later is one of them'
    - term: द्विवचन
      en: 'nominative dual'
  - form: कलहम्
    lemma: कलह
    gloss: 'a quarrel'
    notes:
    - term: कर्मन्
      en: 'what they make — कलहम् करोति, "to quarrel"'
    - term: द्वितीया
      en: 'accusative'
  - form: कुरुतः
    lemma: कृ
    gloss: 'make'
    notes:
