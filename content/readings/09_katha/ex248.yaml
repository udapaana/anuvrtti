  sentence: शिष्यः विद्याम् जिज्ञासते। सः गुरोः समीपम् गन्तुम् इच्छति। गुरुः अपि तम् शिक्षितुम् चिकीर्षति। एवम् द्वौ अपि ज्ञानम् इच्छतः।
  translation: The student wishes to know knowledge. He wants to go to the teacher's side. The teacher too wishes to instruct him. Thus both of them desire knowledge.
  teaches: |
    the desiderative — a verb that means "wishes to ___," built by reduplicating
    the root and adding सन्: जिज्ञासते "wants to know" (from ज्ञा), चिकीर्षति
    "wants to do" (from कृ).
