  kind: graded
  segment: 251
  source:
    text: कथा (our graded retelling)
    ref: "the teacher of Mithilā — our own telling"
    curated: our simple Sanskrit; not from any single source
  sentence: पुरा मिथिलायाम् एका राज्ञी वसति स्म। तस्याः नगरे विद्वान् आचार्यः आसीत्। सः प्रतिदिनम् शिष्यम् वेदम् अध्यापयत्। एकदा बालः आचार्यम् द्रष्टुम् ग्रामम् अगच्छत्। तत्र आचार्यः तम् धर्मम् अबोधयत्। बोधेन सः बालः पण्डितः अभवत्। राज्ञी अपि तम् अपूजयत्।
  translation: Long ago in Mithilā there lived a queen. In her city there was a learned teacher. Every day he taught a student the Veda. One day a boy went to the village in order to see the teacher. There the teacher made him understand dharma. By that understanding the boy became learned. The queen too honored him.
  teaches: |
    the causative in the wild: शिष्यम् वेदम् अध्यापयत् "taught the student the
    Veda" — the one made to act (शिष्यम्) turns into an object, so the causative
    carries two accusatives. And the causer himself is the हेतु-agent.
