- id: ex216
  kind: graded
  segment: 165
  source:
    text: बालकृष्णकथा (our graded retelling)
    ref: Bhāgavata 10.8 — Kṛṣṇa's childhood in Gokula
    curated: our simple Sanskrit telling the well-known episode; NOT the verbatim text
  sentence: उपगोकुलम् एकः गोपपुत्रः वसति। सः च कृष्णः च सदा क्रीडतः, तौ गोपकृष्णौ इति ग्रामः वदति। एकदा नीलाम्बरः कश्चन बालः आगच्छत्। यशोदा तम् अपश्यत्, किन्तु न अजानात्। कृष्णः अवदत् — अयम् नीलाम्बरः एव मम भ्राता बलरामः।
  translation: 'Near Gokula lives a cowherd''s son. He and Kṛṣṇa always play together, and the village calls the two "the cowherd-and-Kṛṣṇa." One day a boy in blue clothes came. Yaśodā saw him, but did not know him. Kṛṣṇa said: "This blue-clad one is my brother Balarāma himself."'
  teaches: 'Kṛṣṇa''s friends, in compounds: उपगोकुलम् (अव्ययीभाव, "near Gokula"), गोपपुत्रः (तत्पुरुष), गोपकृष्णौ (द्वन्द्व), and नीलाम्बरः — the बहुव्रीहि "whose clothes are blue", Balarāma''s own epithet beside Kṛṣṇa''s पीताम्बर.

    '
