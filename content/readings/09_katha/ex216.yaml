  vyakhya: पुनः चत्वारः समासाः, अधुना गोकुलकथायाम्। गोपपुत्रः, उपगोकुलम्, गोपकृष्णौ, नीलाम्बरः।
  vyakhya_en: |
    The same four types, now inside the Gokula story rather than beside it.
    गोपपुत्रः is a तत्पुरुष, उपगोकुलम् an अव्ययीभाव, गोपकृष्णौ a द्वन्द्व
    naming two boys together, and नीलाम्बरः a बहुव्रीहि — not "blue," not
    "garment," but the blue-clad one himself, whom यशोदा takes for इन्द्र.
