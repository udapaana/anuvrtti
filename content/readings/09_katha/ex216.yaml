    text: "बालकृष्णकथा (our graded retelling)"
    ref: "Bhāgavata 10.8 — Kṛṣṇa's childhood in Gokula"
    curated: "our simple Sanskrit telling the well-known episode; NOT the verbatim text"
  sentence: उपगोकुलम् एकः गोपपुत्रः वसति। सः च कृष्णः च क्रीडतः, तौ गोपकृष्णौ इति ग्रामः वदति। एकदा नीलाम्बरः कश्चन बालः आगच्छत्। यशोदा तम् अपश्यत् — नीलाम्बरः एव इन्द्रः, इति सा अमन्यत।
  translation: Near Gokula lives a certain cowherd's son. He and Kṛṣṇa play, and the village calls those two "the cowherd-and-Kṛṣṇa." Once a blue-clad boy came. Yaśodā saw him — "the blue-clad one is Indra himself," she thought.
  teaches: |
    the four compound types again, in the Gokula story: गोपपुत्रः (तत्पुरुष),
    उपगोकुलम् (अव्ययीभाव), गोपकृष्णौ (द्वन्द्व), नीलाम्बरः (बहुव्रीहि).
