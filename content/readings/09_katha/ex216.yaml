- id: ex216
  kind: graded
  segment: 165
  source:
    text: बालकृष्णकथा (our graded retelling)
    ref: Bhāgavata 10.8 — Kṛṣṇa's childhood in Gokula
    curated: our simple Sanskrit telling the well-known episode; NOT the verbatim text
  sentence: उपगोकुलम् श्रीदामा नाम गोपपुत्रः वसति। सः कृष्णः च सदा सह क्रीडतः। एकदा नीलाम्बरः कश्चन बालः आगच्छत्। श्रीदामा तम् अपश्यत्, किन्तु न अजानात्। कृष्णः अवदत् — अयम् नीलाम्बरः एव मम भ्राता बलरामः।
  translation: 'Near Gokula lives a cowherd''s son named Śrīdāman. He and Kṛṣṇa always play together. One day a boy in blue clothes came. Śrīdāman saw him, but did not know him. Kṛṣṇa said: "This blue-clad one is my own brother Balarāma."'
  teaches: 'Kṛṣṇa''s friends, in compounds: उपगोकुलम् (अव्ययीभाव, "near Gokula"), गोपपुत्रः (तत्पुरुष, "a cowherd''s son"), and नीलाम्बरः — the बहुव्रीहि "whose clothes are blue", Balarāma''s own epithet beside Kṛṣṇa''s पीताम्बर.'
  vyakhya_en: 'Three types, now inside the Gokula story rather than beside it.

    गोपपुत्रः is a तत्पुरुष, उपगोकुलम् an अव्ययीभाव, and नीलाम्बरः a बहुव्रीहि —

    not "blue," not "garment," but the blue-clad one himself, whom Śrīdāman

    does not know.

    '
  vyakhya: पुनः समासाः, अधुना गोकुलकथायाम्। गोपपुत्रः, उपगोकुलम्, नीलाम्बरः।
