  vyakhya: 'महत् नवीनम् — कृत्यप्रत्ययः। हन्तव्यः इति तव्य (तव्यत्तव्यानीयरः), अर्थे "अवश्यं हननीयः"। कृत्ये कर्ता तृतीयायाम् (मया), कर्म प्रथमायाम् (बालः) — कर्मणिवत्। लृट् हनिष्यति इति भविष्यति; यतः इति हेतौ।'
  vyakhya_en: |
    The big new arrival: the **gerundive** (कृत्य) — हन्तव्यः "(he) who must be killed," तव्य of √हन् (तव्यत्तव्यानीयरः, 3.1.96). It expresses necessity/obligation, and it governs case exactly like the passive: the agent goes to **instrumental** (मया "by me") and the patient to **nominative** (बालः). So "the boy is-to-be-killed by me" reads with मया … बालः … हन्तव्यः all in agreement. Against it stands the plain **future** हनिष्यति "he will kill" (लृट्, 3.3.13) — Kaṃsa weighs necessity against consequence. The reason-clause opens with यतः "because." This is the grammatical hinge from playful Gokula into the Mathurā confrontation.
