    - term: प्रथमा
      en: nominative
    rel:
    - kind: विशेषण
      to: 1
  - form: नरः
    lemma: नर
    gloss: a man
    notes:
    - term: कर्तृ
      en: subject
    - term: प्रथमा
      en: nominative (अ-stem, सु → नरः)
  - form: वने
    lemma: वन
    gloss: in the forest
    notes:
    - term: अधिकरण
      en: locus
    - term: सप्तमी
      en: locative
  - form: अवसत्
    lemma: वस्
    gloss: lived
    notes:
    - term: लङ्
      en: past
  - form: एकदा
    lemma: एकदा
    gloss: one day
    notes:
    - term: अव्यय
      en: indeclinable — time
  - form: नरम्
    lemma: नर
    gloss: the man
    notes:
    - term: कर्मन्
      en: object of अपश्यत्
    - term: द्वितीया
      en: accusative (नर + अम् → नरम्, अमि पूर्वः)
  - form: व्याघ्रः
    lemma: व्याघ्र
    gloss: a tiger
    vocab: true
    notes:
    - term: कर्तृ
      en: subject
    - term: प्रथमा
      en: nominative
  - form: अपश्यत्
    lemma: दृश्
    gloss: saw
    notes:
    - term: लङ्
      en: past
  - form: नराय
    lemma: नर
    gloss: at the man
    notes:
    - cite: '1.4.37'
      role: क्रुधद्रुहेर्ष्यासूयार्थानां यं प्रति कोपः — the one at whom anger is directed (with क्रुध् etc.) is सम्प्रदान → dative नराय
    - cite: '7.1.13'
      role: ङेर्यः — the अ-stem dative ending ङे becomes य → नर + य → नराय
    - term: सम्प्रदान
      en: the target of the anger
    - term: चतुर्थी
      en: dative
    - cite: "7.3.102"
      role: "सुपि च — अ → आ before भ्याम्/भिस्, the अ-stem obliques → नराय"
  - form: अक्रुध्यत्
    lemma: क्रुध्
    gloss: grew angry
    vocab: true
    notes:
    - term: क्रुध्
