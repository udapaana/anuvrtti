- id: ex257
  kind: graded
  segment: 272
  source:
    text: कथा (our graded retelling)
    ref: "the man and the tiger — our own telling, through the cases"
    curated: our simple Sanskrit; not from any single source
  sentence: एकः नरः वने अवसत्। नरम् व्याघ्रः अपश्यत्। नरः वृक्षम् आरोहत्। व्याघ्रः नराय अक्रुध्यत्। नरः तस्मै फलानि अक्षिपत्। ततः नरात् व्याघ्रः अबिभेत्। नरस्य बुद्धिः महती आसीत्।
  translation: A man lived in the forest. A tiger saw the man. The man climbed a tree. The tiger grew angry at the man. The man threw fruits at it. Then the tiger became afraid of the man. The man's wit was great.
  teaches: |
    one noun through its cases — नरः, नरम्, नराय, नरात्, नरस्य — and the verbs
    that pick special cases: क्रुध् "be angry" wants the dative (नराय), भी "fear"
    wants the ablative (नरात्).
  words:
