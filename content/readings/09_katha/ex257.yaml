    gloss: of the man
    notes:
    - cite: '7.1.12'
      role: टाङसिङसामिनात्स्याः — the अ-stem genitive ending ङस् → स्य → नरस्य
    - term: सम्बन्ध
      en: possessor
    - term: षष्ठी
      en: genitive
