  vyakhya: "विभक्तिपरिचयकथा। एकम् एव नरशब्दं सर्वासु प्रायः विभक्तिषु — नरः नरम् नराय नरात् नरस्य। क्रुध्यतेः सम्प्रदानम् (क्रुधद्रुहेर्ष्या… यं प्रति कोपः) → नराय; बिभेतेः अपादानम् (भीत्रार्थानां भयहेतुः) → नरात्, अग्नेः च आदानस्य अपादानम्। तस्मै इति सर्वनाम्नः स्मै; नराय इति ङेर्यः।"
  vyakhya_en: "Watch one word walk through the cases: नरः (nom), नरम् (acc), नराय (dat), नरात् (abl), नरस्य (gen) — a whole अ-stem paradigm inside a story. And two verbs that demand a case you might not expect: **क्रुध्** \"be angry\" takes its target in the **dative** (नराय अक्रुध्यत्, 1.4.37), and **भी** \"fear\" takes what is feared in the **ablative** (नरात् अबिभेत्, 1.4.25). अग्नेः is the ablative of the fire the brand is taken from, and तस्मै the pronoun dative (स्मै, 7.1.14).\n"
