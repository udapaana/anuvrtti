- id: ex257
  kind: graded
  segment: 272
  source:
    text: कथा (our graded retelling)
    ref: "the man and the tiger — our own telling, through the cases"
    curated: our simple Sanskrit; not from any single source
  sentence: "एकः नरः वने अवसत्। एकदा नरम् व्याघ्रः अपश्यत्। व्याघ्रः नराय अक्रुध्यत्। नरः अग्नेः उल्मुकम् अगृह्णात्, उच्चैः अक्रोशत्, तस्मै च तत् अक्षिपत्। ततः नरात् व्याघ्रः अबिभेत्। नरस्य बुद्धिः महती आसीत्।"
  translation: "A man lived in the forest. One day a tiger saw the man. The tiger grew angry at the man. The man took a burning brand from his fire, shouted loudly, and threw it at the tiger. Then the tiger became afraid of the man. The man's wit was great."
  teaches: |
    one noun through its cases — नरः, नरम्, नराय, नरात्, नरस्य — and the verbs
    that pick special cases: क्रुध् "be angry" wants the dative (नराय), भी "fear"
    wants the ablative (नरात्).
  words:
