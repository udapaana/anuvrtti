  - form: नराय
    lemma: नर
    gloss: at the man
    notes:
    - cite: '1.4.37'
      role: क्रुधद्रुहेर्ष्यासूयार्थानां यं प्रति कोपः — the one at whom anger is directed (with क्रुध् etc.) is सम्प्रदान → dative नराय
    - cite: '7.1.13'
      role: ङेर्यः — the अ-stem dative ending ङे becomes य → नर + य → नराय
    - term: सम्प्रदान
      en: the target of the anger
    - term: चतुर्थी
      en: dative
  - form: अक्रुध्यत्
