      en: past
  - form: नरम्
    lemma: नर
    gloss: the man
    notes:
    - term: कर्मन्
      en: object of अपश्यत्
    - term: द्वितीया
      en: accusative (नर + अम् → नरम्, अमि पूर्वः)
  - form: व्याघ्रः
    lemma: व्याघ्र
    gloss: a tiger
    vocab: true
    notes:
    - term: कर्तृ
      en: subject
    - term: प्रथमा
      en: nominative
  - form: अपश्यत्
    lemma: दृश्
    gloss: saw
    notes:
    - term: लङ्
      en: past
  - form: वृक्षम्
    lemma: वृक्ष
    gloss: a tree
    notes:
    - term: कर्मन्
      en: goal of आरोहत्
    - term: द्वितीया
      en: accusative
  - form: आरोहत्
    lemma: रुह्
    gloss: climbed
    vocab: true
    notes:
