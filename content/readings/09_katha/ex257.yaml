    lemma: एक
    gloss: a
    notes:
    - term: संख्या
      en: "a, one"
    - term: विशेषण
      en: qualifying नरः
    - term: प्रथमा
      en: nominative
    rel:
    - kind: विशेषण
      to: 1
  - form: नरः
    lemma: नर
    gloss: a man
    notes:
    - term: कर्तृ
      en: subject
    - term: प्रथमा
      en: nominative (अ-stem, सु → नरः)
  - form: वने
    lemma: वन
    gloss: in the forest
    notes:
    - term: अधिकरण
      en: locus
    - term: सप्तमी
      en: locative
  - form: अवसत्
    lemma: वस्
    gloss: lived
    notes:
