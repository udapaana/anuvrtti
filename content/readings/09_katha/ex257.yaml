      role: सर्वनाम्नः स्मै — a pronoun's dative singular ending is स्मै → तद् → तस्मै
    - term: सम्प्रदान
      en: recipient (of the thrown fruit)
    - term: चतुर्थी
      en: dative (pronominal)
    - term: पुंलिङ्ग
      en: masculine — the tiger
  - form: च
