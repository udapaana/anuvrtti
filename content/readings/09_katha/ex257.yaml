    gloss: of the man
    notes:
    - cite: '1.4.25'
      role: भीत्रार्थानां भयहेतुः — the source of fear (with भी "fear") is अपादान → ablative नरात्
    - term: अपादान
      en: the thing feared
    - term: पञ्चमी
      en: ablative
  - form: अबिभेत्
    lemma: भी
    gloss: became afraid
    vocab: true
    notes:
    - term: भी
      en: '"fear" (जुहोत्यादि, reduplicating)'
    - term: लङ्
      en: past
  - form: नरस्य
