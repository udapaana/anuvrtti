  source:
    text: कथा (our graded retelling)
    ref: "a father and son speak — our own telling, with address"
    curated: our simple Sanskrit; not from any single source
  sentence: पिता पुत्रम् अवदत् — हे पुत्र, शृणु। सत्यम् वद, धर्मम् चर। पुत्रः अवदत् — हे तात, तव वचनम् पालयिष्यामि।
  translation: The father said to the son — "O son, listen. Speak the truth, walk in dharma." The son said — "O father, I will keep your word."
  teaches: |
    direct address — the vocative: हे पुत्र "O son," हे तात "O father." When you
    call to someone, the naming word stands in the सम्बोधन (the "calling" case).
