  sentence: 'पूतना राक्षसी गोकुलम् आगत्य सुन्दरीरूपेण तिष्ठति। सा कृष्णम् अङ्के गृहीत्वा विषेण हन्तुम् इच्छति। किन्तु कृष्णेन तस्याः स्तनः पीतः, विषम् च पीतम्। एवम् पूतना कृष्णेन हता।'
  translation: The demoness Pūtanā comes to Gokula and stays there in the form of a beautiful woman. Taking Kṛṣṇa on her lap, she wishes to kill him with poison. But by Kṛṣṇa her breast was suckled, and the poison too was drunk. Thus Pūtanā was slain by Kṛṣṇa.
  teaches: 'passive construction (कर्मणि क्त — पीतः, हता, with instrumental of agent); gerund आगत्य (prior action); accusative object (कृष्णम्, विषम्)'
