  vyakhya: 'कर्मणिप्रयोगः — इह कर्ता तृतीयायां, कर्म प्रथमायाम्। कृष्णेन पूतना हता इति न कर्तरि, कर्मणि। दोषाः — आगत्य स्तनयित्वा इति पूर्वकालकृदन्ते।'
  vyakhya_en: |
    The grammar turn: for the first time the story is told in the **passive** (कर्मणि). In active voice Kṛṣṇa is the subject (कर्तृ) and takes the nominative; in passive he becomes the agent (still the doer, but now marked by तृतीया — instrumental — while the object rises to nominative). The past-passive participle क्त (निष्ठा, 3.2.102) carries this sense: पीतः (was drunk, masc.), पीतम् (neuter), हता (fem.). Two gerunds (क्त्वा / ल्यप्) chain the prior actions: Pūtanā "comes, then nurses, then wishes to kill" — each gerund hands off to the next.
