- id: ex271
  kind: graded
  segment: 283
  order: 3
  sentence: 'माता गृहे धान्यम् पिनष्टि। सा पुत्रयोः कलहम् शृणोति, शोचति च।'
  translation: 'The mother grinds grain at home. She hears her two sons quarrelling, and grieves.'
  teaches: 'पिनष्टि (पिष्, रुधादि: the न infix) with ष्टुत्व; पुत्रयोः, the अ-stem ए before ओस्.'
  words:
  - form: माता
    lemma: मातृ
    gloss: 'the mother'
    notes:
    - term: कर्तृ
      en: 'the one who grinds'
    - term: प्रथमा
      en: 'nominative'
  - form: गृहे
    lemma: गृह
    gloss: 'at home'
    notes:
    - term: अधिकरण
      en: 'where'
    - term: सप्तमी
      en: 'locative'
  - form: धान्यम्
    lemma: धान्य
    gloss: 'grain'
    notes:
    - term: कर्मन्
      en: 'what is ground'
    - term: द्वितीया
      en: 'accusative'
  - form: पिनष्टि
    lemma: पिष्
    gloss: 'grinds'
    notes:
    - term: लट्
      en: 'present (पिष् is रुधादि: श्नम् puts न inside the root)'
    - cite: "8.4.41"
      role: 'ष्टुना ष्टुः — after ष्, the त of the ending becomes ट: पिनष् + ति → पिनष्टि'
  - form: सा
    lemma: तद्
    gloss: 'she'
    notes:
    - term: सर्वनाम
      en: 'pronoun'
    - term: प्रथमा
      en: 'nominative'
    - term: कर्तृ
      en: 'the one who hears'
  - form: पुत्रयोः
    lemma: पुत्र
    gloss: 'of her two sons'
    notes:
    - term: सम्बन्ध
      en: 'whose quarrel'
    - term: षष्ठी
      en: 'genitive dual'
    - cite: "7.3.104"
      role: 'ओसि च — the अ of पुत्र becomes ए before ओस् → पुत्रयोः'
  - form: कलहम्
    lemma: कलह
    gloss: 'quarrel'
    notes:
    - term: कर्मन्
      en: 'what is heard'
    - term: द्वितीया
      en: 'accusative'
  - form: शृणोति
    lemma: श्रु
    gloss: 'hears'
    notes:
    - term: लट्
      en: 'present'
    - cite: "8.4.1"
      role: 'रषाभ्यां नो णः — after ऋ, न becomes ण → शृणोति'
  - form: शोचति
    lemma: शुच्
    gloss: 'grieves'
    notes:
    - term: लट्
      en: 'present'
  - form: च
    lemma: च
    gloss: 'and'
    notes:
    - term: अव्यय
      en: 'indeclinable'
