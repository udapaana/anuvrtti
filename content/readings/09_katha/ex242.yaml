- id: ex242
  kind: graded
  segment: 257
  source:
    text: कथा (our graded retelling)
    ref: "when the sun rises — our own telling, in the locative absolute"
    curated: our simple Sanskrit; not from any single source
  sentence: सूर्ये उदिते कमलानि विकसन्ति। मेघे गर्जति मयूराः नृत्यन्ति। गुरौ आगते शिष्याः उत्तिष्ठन्ति। एवम् काले गते ज्ञानम् वर्धते।
  translation: When the sun has risen, lotuses open. When the cloud thunders, peacocks dance. When the teacher has come, the students rise. Thus, as time passes, knowledge grows.
  teaches: |
    the locative absolute — a whole clause folded into the locative: सूर्ये उदिते
    "the sun having risen," गुरौ आगते "the teacher having come." Both the noun and
    its participle stand in the seventh case.
