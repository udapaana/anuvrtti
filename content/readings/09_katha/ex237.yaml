  source:
    text: कथा (our graded retelling)
    ref: "the father and his two sons — our own telling"
    curated: our simple Sanskrit; not from any single source
  sentence: पुरा एकः पिता आसीत्। तस्य द्वौ पुत्रौ आस्ताम्। पिता पुत्रयोः समम् स्नेहम् अकरोत्। एकदा सः पुत्राभ्याम् धनम् अयच्छत्। ज्येष्ठः पुत्रः तत् धनम् द्यूतेन अनाशयत्। कनिष्ठः तु तेन धनेन क्षेत्रम् अक्रीणात्। तथैव कनिष्ठः सुखम् अलभत। तदा पिता तम् एव अपूजयत्।
  translation: Long ago there was a father. He had two sons. The father loved both sons equally. One day he gave wealth to the two of them. The elder son destroyed that wealth by gambling; but the younger bought a field with that wealth. Just so, the younger obtained happiness. Then the father honored him alone.
  teaches: |
    the shapes of the endings themselves: पिता (the ऋ-stem nominative), पुत्रयोः
    and पुत्राभ्याम् (the dual obliques of an अ-stem), and the accusatives धनम्,
    क्षेत्रम् — each a small सन्धि rule doing its quiet work.
