  source:
    text: कथा (our graded retelling)
    ref: "the potter and the king's brother — our own telling"
    curated: our simple Sanskrit; not from any single source
  sentence: ग्रामे कुलालः वसन् घटान् अकरोत्। एकदा राज्ञः भ्राता तम् ग्रामम् आगच्छत्। कुलालम् कार्यम् कुर्वन्तम् दृष्ट्वा सः अवदत् — मम गृहे शतम् घटाः स्थापनीयाः। कुलालः अवदत् — कर्तव्यम् एतत्, किन्तु मूल्यम् दातव्यम्। भ्राता हसन् अवदत् — पिता मे राजा आसीत्, अहम् न मूल्यम् ददामि। कुलालः अवदत् — तर्हि घटाः न सन्ति। तत् श्रुत्वा भ्राता लज्जितः अभवत्।
  translation: In a village a potter lived, making pots. One day the king's brother came to that village. Seeing the potter doing his work, he said — "A hundred pots are to be placed in my house." The potter said — "This is to be done, but the price is to be given." The brother, laughing, said — "My father was a king; I do not give a price." The potter said — "Then there are no pots." Having heard that, the brother was ashamed.
  teaches: |
    a potter refuses a prince. Four participles and three gerundives against
    six finite verbs; पिता and भ्राता carry their ऋ-stem grades through it.
