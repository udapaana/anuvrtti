  sentence: एकः यतिः उपनदि अवसत्। सः प्रतिगृहम् अटन् यथाशक्ति भिक्षाम् अयाचत। निर्मक्षिकम् सः भोजनम् अखादत्।
  translation: A monk lived near the river. Going house to house, he begged for alms according to his means. He ate his food in a fly-free quiet.
  teaches: |
    the अव्ययीभाव — the compound that turns into an adverb, its first member an
    indeclinable: उपनदि "near the river," प्रतिगृहम् "at each house," यथाशक्ति
    "according to ability," निर्मक्षिकम् "free of flies."
