  vyakhya: 'अव्ययीभावप्रधाना कथा। उपनदि (समीपे), प्रतिगृहम् (वीप्सायाम्), निर्मक्षिकम् (अभावे) इति अव्ययं पूर्वपदम् इति अव्ययीभावाः (अव्ययं विभक्तिसमीप…)। यथाशक्ति इति यथार्थे (यथाऽसादृश्ये)। सर्वे नपुंसकैकवचनवत् अव्ययानि।'
  vyakhya_en: |
    The last of the four great compound-types: the **अव्ययीभाव**, which comes out
    as an *adverb*. Its first member is an indeclinable, and it carries a
    relational sense — nearness, distribution, absence, accordance: उपनदि "by the
    river" (समीप), प्रतिगृहम् "house by house" (वीप्सा, "each"), निर्मक्षिकम्
    "fly-free" (अभाव), यथाशक्ति "as one is able" (2.1.6–7). The whole compound
    behaves like a fixed neuter singular and never declines — you have now met
    तत्पुरुष, कर्मधारय, बहुव्रीहि, द्वन्द्व, and अव्ययीभाव, the five doors of
    Sanskrit compounding.
