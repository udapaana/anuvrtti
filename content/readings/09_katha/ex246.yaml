  source:
    text: कथा (our graded retelling)
    ref: "the craftsmen of the village — our own telling"
    curated: our simple Sanskrit; not from any single source
  sentence: ग्रामे बहवः कारवः वसन्ति स्म। कुम्भकारः घटान् अकरोत्। स्वर्णकारः अलंकारान् अरचयत्। ग्रन्थकारः शास्त्राणि अलिखत्। सर्वे स्वेन कर्मणा सुखम् अलभन्त।
  translation: In the village lived many craftsmen. The potter made pots. The goldsmith fashioned ornaments. The author wrote treatises. All of them found happiness by their own work.
  teaches: |
    the agent-compound — कुम्भकारः "pot-maker," स्वर्णकारः "gold-maker,"
    ग्रन्थकारः "book-maker": a root of doing (कृ → कार) with its object built
    right in, the everyday way Sanskrit names a trade.
