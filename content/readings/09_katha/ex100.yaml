  vyakhya: 'द्वे नवीने — शतृप्रत्ययः (लटः शतृशानचौ) पिबन्त्यः नृत्यन् च; स्म-सहितः लट् भूतार्थे। कर्मणिप्रयोगः त्रिवारम् — दूषितम् आसीत्, मूर्च्छिताः अभवन्, पराजितः। जलचरे युद्धम् वर्णयितुम् क्त्वा-ल्यपौ बहुशः।'
  vyakhya_en: |
    Two new tools. First, **शतृ** (the active present participle — लटः शतृशानचौ, 3.2.124): पिबन्त्यः "while drinking" (fem. pl., simultaneous with अभवन्) and नृत्यन् "while dancing" (masc. sg., simultaneous with अदमयत्). The participle says the background action runs alongside the main verb — not before it (that's क्त्वा) and not after it. Second, **वसति स्म** — a present-tense verb with the particle स्म shifts into past habitual: "used to dwell." Passive क्त appears three times (दूषितम्, मूर्च्छिताः, पराजितः), anchoring the pattern from ex098. The gerunds आरुह्य → अपतत् chain the action sequence into one breath.
