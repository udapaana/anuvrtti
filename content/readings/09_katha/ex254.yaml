  vyakhya: 'णिजन्तद्विकर्मकप्रधाना कथा। अध्यापयत् अगमयत् अभोजयत् इति बुद्धि-गति-प्रत्यवसानार्थेषु णिचि — मूलकर्ता कर्म (गतिबुद्धिप्रत्यवसान… अणि कर्ता स णौ)। अतः द्वे कर्मणी प्रतिवाक्यम् — शिष्यम् वेदम्, दूतम् नगरम्, बालम् अन्नम्। प्रयोजकाः इति हेतवः (तत्प्रयोजको हेतुश्च)।'
  vyakhya_en: |
    Three causatives, three double-objects — the pattern to fix in memory. When
    the underlying verb is one of **knowing, going, or eating** (the गतिबुद्धि-
    प्रत्यवसान class), its causative pulls the *base agent* into the accusative
    (1.4.52): शिष्यम् वेदम् अध्यापयत् "made the student (study) the Veda," दूतम्
    नगरम् अगमयत् "made the messenger (go) to the city," बालम् अन्नम् अभोजयत् "made
    the child (eat) food." The causer standing over them all is the **हेतु**
    (1.4.55) — here named outright: प्रयोजकाः हेतवः, "the instigators, the causes."
