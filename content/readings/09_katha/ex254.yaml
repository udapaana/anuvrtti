- id: ex254
  kind: graded
  segment: 269
  source:
    text: कथा (our graded retelling)
    ref: "those who set others to work — our own telling, in causatives"
    curated: our simple Sanskrit; not from any single source
  sentence: एकदा राज्ञः गृहे प्रातः गुरुः शिष्यम् वेदम् अध्यापयत्। तदा राजा दूतम् नगरम् अगमयत्। राज्ञी च बालम् अन्नम् अभोजयत्। एवम् गृहे राज्ये च सर्वे अन्यान् कर्मणि नियोजयन्ति।
  translation: One morning in the king's house the teacher made his pupil study the Veda. Then the king sent the messenger to the city. And the queen fed the child. Thus, at home and in the kingdom, everyone sets others to their tasks.
  teaches: |
    the causative's double object — with verbs of knowing, going, and eating, the
    one made to act (शिष्यम्, दूतम्, बालम्) turns into an accusative alongside the
    real object (वेदम्, नगरम्, अन्नम्); and the causer is the हेतु.
