  vyakhya: 'द्वन्द्वसमासप्रधाना कथा। रामलक्ष्मणौ सुखदुःखे मातापितरौ इति चार्थे द्वन्द्वः — "अयं च अयं च" इति समाहारे वा इतरेतरे वा। अहर्निशम् इति समाहारद्वन्द्वः अव्ययवत्। सर्वत्र द्विवचनम् — कर्तरि क्रियापदे च (अगच्छताम् अन्वभवताम् अस्मरताम्)।'
  vyakhya_en: |
    The **द्वन्द्व** — the compound that means "and." Where English strings items
    with commas, Sanskrit fuses them: रामलक्ष्मणौ "Rāma and Lakṣmaṇa," सुखदुःखे
    "joy and sorrow," मातापितरौ "mother and father" (2.2.29, चार्थे द्वन्द्वः, "a
    द्वन्द्व in the sense of 'and'"). Two members means the compound is **dual** —
    and the whole sentence answers in the dual, verbs included: अगच्छताम्,
    अन्वभवताम्, अस्मरताम् "the two went / felt / remembered." (अहर्निशम् "day and
    night" is the other kind — a द्वन्द्व frozen into a single adverb.)
