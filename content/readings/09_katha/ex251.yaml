  sentence: रामलक्ष्मणौ वनम् अगच्छताम्। तौ सुखदुःखे समम् अन्वभवताम्। अहर्निशम् मातापितरौ अस्मरताम्।
  translation: Rāma-and-Lakṣmaṇa went to the forest. The two experienced pleasure and pain alike. Day and night they remembered their mother and father.
  teaches: |
    the द्वन्द्व, the "and" compound — रामलक्ष्मणौ "Rāma and Lakṣmaṇa," सुखदुःखे
    "pleasure and pain," मातापितरौ "mother and father": two (or more) coordinate
    things fused into one word, and the number follows the total.
