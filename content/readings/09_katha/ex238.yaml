  source:
    text: कथा (our graded retelling)
    ref: "the beggar and the giving king — our own telling"
    curated: our simple Sanskrit; not from any single source
  sentence: एकदा भिक्षुः नृपम् धनम् अयाचत। नृपः अचिन्तयत् — दीनेभ्यः सदा धनम् दद्यात् इति। ततः सः भिक्षवे बहु धनम् अददात्। भिक्षुः तुष्टः अभवत्।
  translation: One day a beggar asked the king for wealth. The king thought — "One should always give wealth to the needy." Then he gave much wealth to the beggar. The beggar became satisfied.
  teaches: |
    a two-object verb — नृपम् धनम् अयाचत "asked the king for wealth": the thing
    asked-for is the plain object, but the person asked is a second, "residual"
    object. And दद्यात् "one should give," the optative of precept.
