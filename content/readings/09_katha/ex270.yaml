- id: ex270
  kind: graded
  segment: 282
  order: 2
  sentence: 'ज्येष्ठः पुत्रः कनिष्ठम् द्वेष्टि। कनिष्ठः तु ज्येष्ठस्य वचनम् शृणोति, तस्मै फलानि च यच्छति।'
  translation: 'The elder son hates the younger. But the younger listens to the elder''s word, and gives him fruit.'
  teaches: 'द्वेष्टि (द्विष्, अदादि) — ष्टुत्व turns its त to ट; तस्मै, the pronoun dative in स्मै.'
  words:
  - form: ज्येष्ठः
    lemma: ज्येष्ठ
    gloss: 'the elder'
    notes:
    - term: तद्धित
      en: 'secondary derivative'
    - term: इष्ठन्
      en: 'the superlative affix — "eldest"'
    - term: विशेषण
      en: 'qualifying पुत्रः'
    - term: प्रथमा
      en: 'nominative'
    rel:
    - kind: विशेषण
      to: 1
  - form: पुत्रः
    lemma: पुत्र
    gloss: 'son'
    notes:
