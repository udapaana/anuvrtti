    - term: इष्ठन्
      en: 'superlative — "youngest"'
    - term: कर्मन्
      en: 'the one hated'
    - term: द्वितीया
      en: 'accusative'
  - form: द्वेष्टि
    lemma: द्विष्
    gloss: 'hates'
    notes:
    - term: लट्
      en: 'present (द्विष् is अदादि: no विकरण, guṇa of the root)'
    - cite: "8.4.41"
      role: 'ष्टुना ष्टुः — after ष्, the त of the ending becomes ट: द्वेष् + ति → द्वेष्टि'
  - form: कनिष्ठः
