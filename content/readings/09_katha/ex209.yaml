  kind: graded
  segment: 530
  source:
    text: कथा (our graded retelling)
    ref: "the messenger who came today — our own telling"
    curated: our simple Sanskrit; not from any single source
  sentence: अद्य दूतः नगरम् अगमत्। सः राज्ञः पुरतः अवादीत् — शत्रवः सेनाम् अनयन्, ग्रामान् च अदहन्। राजा तत् अश्रौषीत्, क्षणम् च तूष्णीम् आसीत्। ततः सः अवादीत् — यत् त्वया उक्तम् तत् सत्यम् चेत्, अहम् अद्य एव सेनाम् प्रेषयामि। मन्त्री अवदत् — देव, धैर्यम् एव बलम्। राजा अकार्षीत् यत् मन्त्री अवदत्।
  translation: Today a messenger went to the city. He spoke before the king — "The enemies led out an army, and burned the villages." The king heard that, and was silent a moment. Then he spoke — "If what has been said by you is true, I send the army this very day." The minister said — "Your majesty, steadiness alone is strength." The king did what the minister said.
  teaches: |
    अगमत्, अवादीत्, अश्रौषीत्, अकार्षीत् — four aorists, the past of what
    happened today. शत्रवः and राज्ञः show the visarga taking a sibilant and
    a stop; तूष्णीम् holds its ष् unchanged.
