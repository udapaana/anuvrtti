  vyakhya: 'अद्येति लुङः निमित्तम्। अगमत् अवादीत् अश्रौषीत् अकार्षीत् इति चत्वारः लुङः। अनयन् अदहन् अवदत् इति लङः, तयोः भेदः कालमात्रे। यत् त्वया उक्तम् इति भावे क्तम्, त्वयेति कर्तरि तृतीया। चेदिति न वाक्यादौ तिष्ठति।'
  vyakhya_en: |
    अद्य sets the tense: four verbs here are aorists — अगमत्, अवादीत्, अश्रौषीत्, अकार्षीत् — and three are the ordinary past in लङ् — अनयन्, अदहन्, अवदत्. The two sit side by side in one paragraph, so the difference is a matter of what the sentence is doing rather than of what happened. अश्रौषीत् shows the ष् of सिच् after वृद्धि, while तूष्णीम् carries a ष् that no join produced. यत् त्वया उक्तम् puts the agent in the instrumental and the verb in a participle — the clause has no finite verb at all, and तत् सत्यम् answers it with none either.
