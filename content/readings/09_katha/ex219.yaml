- id: ex219
  kind: graded
  segment: 310
  source:
    text: कथा (our graded retelling)
    ref: two students — our own telling
    curated: our simple Sanskrit; not from any single source
  sentence: गुरुकुले द्वौ शिष्यौ आस्ताम्; एकः पटुः, अपरः पटुतरः। एकदा गुरुः अपृच्छत् — सर्वेषु धनेषु किम् श्रेष्ठम्? सर्वे अशृण्वन्, किन्तु कः अपि उत्तरम् न अवदत्। ततः पटुतरः महाबुद्धिः अवदत् — विद्या एव। गुरुः ततः तुष्टः अभवत्, पटुतराय च आशीर्वादम् अददात्।
  translation: 'In the teacher''s school there were two pupils; one was able, the other abler. One day the teacher asked: "Of all riches, which is the best?" All of them heard, but no one gave an answer. Then the abler one, great of mind, said: "Knowledge." The teacher was pleased at that, and gave his blessing to the abler one.'
  teaches: A question in class — पटुः, पटुतरः, पटुतराय, श्रेष्ठम् (the comparative and superlative); महाबुद्धिः (कर्मधारय); the imperfects अशृण्वन्, अवदत्, अददात्; and ततः doing two jobs, "then" and "from that".
  vyakhya_en: 'Degrees in one scene. पटुः is the plain grade; पटुतरः the

    **comparative** — पटु + तर, "cleverer of the two"; श्रेष्ठ the **superlative**,

    the इष्ठन्-grade of प्रशस्य, "best of all." महाबुद्धिः is a **compound** —

    महती बुद्धिः यस्य, "he whose mind is great." The story runs in the imperfect:

    अशृण्वन्, अवदत्, अददात्, each with the augment अ. And ततः is a **तसिल् adverb**,

    तद् + तस्, "from that → thereupon."

    '
  vyakhya: एकस्मिन्नाख्याने तरप्, कर्मधारयः, तसिल्, इष्ठन् (श्रेष्ठम्) — चत्वारः शब्दप्रकाराः।
