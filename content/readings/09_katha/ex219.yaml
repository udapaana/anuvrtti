  kind: graded
  segment: 310
  source:
    text: कथा (our graded retelling)
    ref: two students — our own telling
    curated: our simple Sanskrit; not from any single source
  sentence: गुरुकुले द्वौ शिष्यौ आस्ताम्; एकः पटुः, अपरः पटुतरः। एकदा गुरुः अपृच्छत् — सर्वेषु धनेषु किम् श्रेष्ठम्? तत् च सर्वैः अश्रूयत, किन्तु न कः अपि उत्तरम् अवदत्। ततः महाबुद्धिः बालः अवदत् — विद्या एव। गुरुः ततः तुष्टः अभवत्, श्रेष्ठाय च वरम् अददात्।
  translation: 'In the teacher''s school there were two pupils; one was able, the other abler. One day the teacher asked: "Of all riches, which is the best?" The question was heard by all, but nobody answered. Then the great-minded boy said: "Knowledge." The teacher was pleased at that, and gave a boon to the best one.'
  teaches: 'A question in class — पटुः, पटुतरः, श्रेष्ठाय (the comparative and superlative); महाबुद्धिः (कर्मधारय); the passive अश्रूयत with its agent सर्वैः; and ततः doing two jobs, "then" and "from that".

    '
