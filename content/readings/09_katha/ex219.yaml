- id: ex219
  kind: graded
  segment: 310
  source:
    text: कथा (our graded retelling)
    ref: "two students — our own telling"
    curated: our simple Sanskrit; not from any single source
  sentence: गुरुकुले द्वौ शिष्यौ आस्ताम्। एकः पटुः, अपरः पटुतरः। महाबुद्धिः बालः प्रश्नम् अपृच्छत्, तत् च सर्वैः अश्रूयत। गुरुः ततः तुष्टः अभवत्, श्रेष्ठाय च वरम् अददात्।
  translation: In the teacher's school there were two students. One was clever, the other cleverer. The great-minded boy asked a question, and it was heard by all. The teacher thereupon was pleased, and gave a boon to the best one.
  teaches: |
    a comparative (पटुतरः), a कर्मधारय (महाबुद्धिः), a passive (अश्रूयत), a
    तसिल् adverb (ततः), a superlative (श्रेष्ठ) — five built words, one scene.
