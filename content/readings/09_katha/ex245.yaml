    ref: "the brahmin of Mathurā — our own telling, in derivatives"
    curated: our simple Sanskrit; not from any single source
  sentence: मथुरायाम् एकः माथुरः ब्राह्मणः आसीत्। सः रामायणम् अपठत्। तत्र दाशरथेः चरितम् आसीत्। तत् पठित्वा सः प्रसन्नः अभवत्।
  translation: In Mathurā there was a certain Māthura (Mathurā-born) brahmin. He read the Rāmāyaṇa. In it was the story of Dāśarathi (the son of Daśaratha). Having read that, he became pleased.
  teaches: |
    two तद्धित derivatives of naming — माथुरः "one born in Mathurā" (the "situated
    there" sense) and दाशरथिः "descendant of Daśaratha" (the patronymic) — the
    everyday machinery by which Sanskrit turns a place or a father into an adjective.
