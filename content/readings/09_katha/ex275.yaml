- id: ex275
  kind: graded
  segment: 287
  order: 7
  sentence: 'राजा मोदते। अधुना पुत्रयोः ज्येष्ठः नगरस्य ईष्टे, सर्वस्मै जनाय च धर्मम् आचष्टे।'
  translation: 'The king rejoices. Now the elder of the two sons rules the city, and teaches dharma to all the people.'
  teaches: 'पुत्रयोः ज्येष्ठः — the षष्ठी of selection; सर्वस्मै, a सर्वादि dative in स्मै.'
  words:
  - form: राजा
    lemma: राजन्
    gloss: 'the king'
    notes:
    - term: कर्तृ
      en: 'the one who rejoices'
    - term: प्रथमा
      en: 'nominative'
  - form: मोदते
    lemma: मुद्
    gloss: 'rejoices'
    notes:
    - term: लट्
      en: 'present (मुद्, आत्मनेपद)'
  - form: अधुना
    lemma: अधुना
    gloss: 'now'
    notes:
    - term: अव्यय
      en: 'indeclinable — time'
  - form: पुत्रयोः
    lemma: पुत्र
    gloss: 'of the two sons'
    notes:
    - term: निर्धारण
      en: 'the group one is picked out of'
    - term: षष्ठी
      en: 'genitive dual, by 2.3.41'
    - cite: "7.3.104"
      role: 'ओसि च — अ becomes ए before ओस् → पुत्रयोः'
  - form: ज्येष्ठः
    lemma: ज्येष्ठ
    gloss: 'the elder'
    notes:
    - term: तद्धित
      en: 'secondary derivative'
    - term: इष्ठन्
      en: 'superlative'
    - term: कर्तृ
      en: 'the one who rules'
    - term: प्रथमा
      en: 'nominative'
  - form: नगरस्य
    lemma: नगर
    gloss: 'the city'
    notes:
    - term: कर्मन्
      en: 'what is ruled'
    - term: षष्ठी
      en: 'genitive — ईश् takes the षष्ठी'
  - form: ईष्टे
    lemma: ईश्
    gloss: 'rules'
    notes:
