  source:
    text: कथा (our graded retelling)
    ref: "a girl in the forest — our own telling"
    curated: our simple Sanskrit; not from any single source
  sentence: कन्या वने तिष्ठति। सा लताम् पश्यति, मालाम् च रचयति। समीपे गङ्गा वहति। कन्या गङ्गायाम् स्नाति, देवीम् च नमति। मार्गेण राज्ञः सेना अपि आगच्छति, किन्तु कन्या न बिभेति, यतः देवी ताम् रक्षति।
  translation: A girl stands in the forest. She sees a creeper, and makes a garland. Nearby flows the Ganges. The girl bathes in the Ganges, and bows to the goddess. A king's army comes along the road too, but the girl is not afraid, because the goddess protects her.
  teaches: |
    कन्या, लता, माला, देवी — new words, all in endings already met: सेना's आ
    in the nominative, सभाम्'s द्वितीया, सभायाम्'s सप्तमी.
