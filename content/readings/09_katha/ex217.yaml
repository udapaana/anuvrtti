  source:
    text: कथा (our graded retelling)
    ref: "a girl in the forest — our own telling"
    curated: our simple Sanskrit; not from any single source
  sentence: कन्या वने तिष्ठति। सा लताम् पश्यति, मालाम् च रचयति। गङ्गायाम् जलम् अस्ति। कन्या तत्र स्नाति, देवीम् च नमति। सेना अपि आगच्छति, किन्तु कन्या न बिभेति।
  translation: A girl stands in the forest. She sees a creeper, and makes a garland. In the Ganges there is water. The girl bathes there, and bows to the goddess. An army comes too, but the girl is not afraid.
  teaches: |
    कन्या, लता, माला, देवी — new words, all in endings already met: सेना's आ
    in the nominative, सभाम्'s द्वितीया, सभायाम्'s सप्तमी.
