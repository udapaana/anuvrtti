- id: ex285
  kind: graded
  segment: 182
  order: 1
  sentence: 'पुरा अयोध्यायाम् दशरथः नाम राजा उवास। तस्य चत्वारः पुत्राः बभूवुः। रामः लक्ष्मणः च वनम् जग्मतुः। तत्र तौ बहून् ऋषीन् ददृशतुः। ऋषयः तौ ऊचुः — राक्षसाः अस्मान् पीडयन्ति। रामः तत् शुश्राव, राक्षसान् च जघान।'
  translation: 'Long ago in Ayodhyā there lived a king named Daśaratha. He had four sons. Rāma and Lakṣmaṇa went to the forest. There the two of them saw many sages. The sages said to them: "Demons torment us." Rāma heard that, and slew the demons.'
  teaches: 'The perfect (लिट्) of the narrated past — उवास, बभूवुः, जग्मतुः, ददृशतुः, ऊचुः, शुश्राव, जघान — in all three numbers.'
