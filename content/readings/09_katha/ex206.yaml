- id: ex206
  kind: graded
  segment: 500
  source:
    text: कथा (our graded retelling)
    ref: "the student who went to the forest — our own telling"
    curated: our simple Sanskrit; not from any single source
  sentence: शिष्यः वनम् अगच्छत्। तत्र सः फलानि अभक्षयत्, जलम् च अपिबत्। सायम् गुरुः अपृच्छत् — कुत्र आसीः। शिष्यः अवदत् — वने आसम्, गुरो। तत् श्रुत्वा गुरुः अवदत् — पठनम् एव तव कार्यम्, न तु वनगमनम्। शिष्यः अवदत् — क्षमस्व, अद्य प्रभृति पठेयम्। रामेण अपि तत् श्रुतम्, सः च अहसत्।
  translation: The student went to the forest. There he ate fruits and drank water. In the evening the teacher asked — "Where were you?" The student said — "I was in the forest, teacher." Hearing that, the teacher said — "Studying alone is your work, not going to the forest." The student said — "Forgive me; from today I will study." Rāma too heard that, and he laughed.
  teaches: |
    two action-nouns set against each other — पठनम् and वनगमनम् — and the
    optative पठेयम् answering the teacher. अभक्षयत् and अपिबत् carry the
    narrative; तच्छ्रुत्वा shows श्चुत्व at the join.
