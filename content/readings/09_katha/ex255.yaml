    ref: "the girl at the river — our own telling, in feminine stems"
    curated: our simple Sanskrit; not from any single source
  sentence: ग्रामे एका बाला अवसत्। सा नद्याः तीरम् अगच्छत्। तत्र देव्यै पुष्पाणि अयच्छत्। सायम् सा मात्रा सह गृहम् अगच्छत्।
  translation: In the village lived a girl. She went to the bank of the river. There she gave flowers to the goddess. In the evening she went home with her mother.
  teaches: |
    the feminine and ऋ-stems in their oblique forms — बाला (the टाप् feminine),
    नद्याः "of the river," देव्यै "to the goddess," मात्रा "with (her) mother":
    the endings that look strange until you have met them.
