  vyakhya: 'स्त्रीप्रत्ययर्दन्तरूपप्रधाना कथा। बाला इति अकारात् टाप् (अजाद्यतष्टाप्)। नद्याः देव्यै इति ईकारान्तस्त्रीरूपे (स्त्रियाम् इत्यधिकारे) — षष्ठी-चतुर्थ्यौ। मात्रा इति ऋदन्तस्त्रियाः तृतीया। सहयोगे तृतीया।'
  vyakhya_en: |
    A quiet drill in the shapes that trip up beginners: the **feminine and
    ऋ-stems** off the beaten nominative. बाला is the टाप् feminine of बाल (4.1.4);
    नद्याः "of the river" and देव्यै "to the goddess" are the genitive and dative
    of ई-stem feminines (under the स्त्रियाम् heading, 4.1.3), where the ī turns to
    य् before the ending; मात्रा "with mother" is the instrumental of the ऋ-stem
    मातृ. Meet these four forms once in a sentence and the paradigm charts stop
    being abstract.
