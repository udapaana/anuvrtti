  sentence: वने एकः तपस्वी अवसत्। एकदा ग्रामगतः बालः तत्र अगच्छत्। सः सरसि नीलोत्पलम् अपश्यत्। तपस्वी बालाय फलानि अयच्छत्। इदम् बालहितम् इति सः अवदत्।
  translation: In the forest lived an ascetic. One day a village-going boy came there. In the lake he saw a blue lotus. The ascetic gave the boy fruits. "This is for the boy's good," he said.
  teaches: |
    three kinds of तत्पुरुष compound in one story — ग्रामगतः "gone to the village"
    (accusative-type), बालहितम् "good for the boy" (dative-type), and नीलोत्पलम्
    "blue lotus" (the कर्मधारय, qualifier + qualified).
