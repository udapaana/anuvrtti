  sentence: वने एकः तपस्वी अवसत्। एकदा ग्रामगतः बालः मार्गम् न अजानात्, तत्र च अगच्छत्। तस्य क्षुधा महती आसीत्। तपस्वी बालाय फलानि अयच्छत्; इदम् बालहितम् इति सः अवदत्। बालः सरसि नीलोत्पलम् अपश्यत्, तत् च तपस्विने अयच्छत्।
  translation: In the forest lived an ascetic. One day a boy who had gone to the village lost his way, and came there. He was very hungry. The ascetic gave the boy fruit; "this is good for a boy," he said. The boy saw a blue lotus in the lake, and gave it to the ascetic.
  teaches: 'A lost boy and an ascetic — ग्रामगतः, बालहितम् (तत्पुरुष), नीलोत्पलम् (कर्मधारय), and the gift given each way: बालाय, तपस्विने.

    '
