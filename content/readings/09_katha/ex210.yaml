  vyakhya: 'लुङः चत्वारि रूपाणि — अवादीत् अश्रौषीत् इति प्रथमपुरुषे एकवचनम्, अवादिषुः इति बहुवचनम्, अभूत् इति भू-धातोः अपुसीयम्। ज्येष्ठः कनिष्ठः इति इष्ठन्प्रत्ययान्तौ। केन एषा भूमिः विभक्ता इति कर्मणि क्तम्, कर्तरि तृतीया।'
  vyakhya_en: |
    The aorist widens here: अवादीत् and अश्रौषीत् are third singular, अवादिषुः is third plural of the same verb as अवादीत्, and अभूत् is √भू with no सिच् at all — the ending sits straight on the root. ज्येष्ठः and कनिष्ठः are the same suffix इष्ठन् on two opposed adjectives, and they carry the whole plot between them. केन एषा भूमिः विभक्ता asks the question with a participle and an instrumental agent, and the elders answer with a present-tense generality rather than a fact about this field.
