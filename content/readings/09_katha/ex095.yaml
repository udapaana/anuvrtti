  sentence: गोकुले कृष्णः नाम बालः वसति। यशोदा तस्य माता। सः गोपानां गृहेषु क्रीडति। सर्वे गोपाः तं बालं पश्यन्ति, सर्वाः गोप्यः च तं कामयन्ते।
  translation: In Gokula lives a boy named Kṛṣṇa. Yaśodā is his mother. He plays in the houses of the cowherds. All the cowherds see the boy, and all the cowherd-women love him.
  teaches: 'the story opens. Connected prose, and the cast is introduced here'
