    lemma: आचार्य
    gloss: by the teacher
    notes:
    - term: कर्तृ
      en: the agent — in the passive the doer is not the subject
    - cite: '2.3.18'
      role: कर्तृकरणयोस्तृतीया — an unexpressed agent (कर्तृ) or instrument (करण) takes the तृतीया → आचार्येण
    - term: तृतीया
      en: instrumental
  - form: कथा
    lemma: कथा
    gloss: a story
    notes:
    - term: कर्मन्
      en: what is told — grammatical subject of the passive
    - term: प्रथमा
      en: nominative (कर्मणि उक्त)
  - form: कथ्यते
    lemma: कथ्
    gloss: is told
    notes:
    - term: यक्
      en: the passive विकरण
    - cite: '3.1.67'
      role: सार्वधातुके यक् — passive विकरण before a सार्वधातुक ending → कथ् + यक् → कथ्यते
    - term: कर्मणि
