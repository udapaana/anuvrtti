- id: ex239
  kind: graded
  segment: 254
  source:
    text: कथा (our graded retelling)
    ref: "how conduct is learned — our own telling, in the passive voice"
    curated: our simple Sanskrit; not from any single source
  sentence: आचार्येण कथा कथ्यते। शिष्यैः सा श्रूयते। तया कथया सदाचारः शिक्ष्यते। एवम् बालाः धर्मेण रक्ष्यन्ते।
  translation: By the teacher a story is told. By the students it is heard. By that story good conduct is learned. Thus the children are protected by dharma.
  teaches: |
    the passive voice, and the case that comes with it: the doer stands in the
    instrumental — आचार्येण "by the teacher," शिष्यैः "by the students" — while
    the thing done becomes the subject. Every verb here carries यक्.
  words:
