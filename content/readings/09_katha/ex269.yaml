- id: ex269
  kind: graded
  segment: 281
  order: 1
  sentence: 'नगरस्य चतुर्णाम् ग्रामाणाम् च राजा धर्मेण ईष्टे। सः पुत्रयोः स्निह्यति।'
  translation: 'The king rules the city and its four villages with dharma. He is fond of his two sons.'
  teaches: 'ईष्टे "rules" takes the षष्ठी of what is ruled (नगरस्य); ष्टुत्व in ईष्टे, णत्व in चतुर्णाम्.'
  words:
  - form: नगरस्य
    lemma: नगर
    gloss: 'the city'
    notes:
    - term: कर्मन्
      en: 'what is ruled — ईश् puts it in the षष्ठी'
    - term: षष्ठी
      en: 'genitive, by 2.3.52'
    - cite: "2.3.52"
      role: 'अधीगर्थदयेशां कर्मणि — the object of ईश् "rule" takes the षष्ठी → नगरस्य'
  - form: चतुर्णाम्
    lemma: चतुर्
    gloss: 'four'
    notes:
    - term: संख्या
      en: 'numeral'
    - term: विशेषण
      en: 'qualifying ग्रामाणाम्'
    - term: षष्ठी
      en: 'genitive plural'
    - cite: "8.4.1"
      role: 'रषाभ्यां नो णः — the र् of चतुर् makes the न of नाम् retroflex → चतुर्णाम्'
    rel:
    - kind: विशेषण
      to: 2
  - form: ग्रामाणाम्
    lemma: ग्राम
    gloss: 'the villages'
    notes:
    - term: कर्मन्
      en: 'also ruled'
    - term: षष्ठी
      en: 'genitive plural'
  - form: च
    lemma: च
    gloss: 'and'
    notes:
    - term: अव्यय
      en: 'indeclinable'
  - form: राजा
    lemma: राजन्
    gloss: 'the king'
    notes:
    - term: कर्तृ
      en: 'the one who rules'
    - term: प्रथमा
      en: 'nominative'
  - form: धर्मेण
    lemma: धर्म
    gloss: 'with dharma'
    notes:
    - term: करण
      en: 'the means — how he rules'
    - term: तृतीया
      en: 'instrumental'
  - form: ईष्टे
    lemma: ईश्
    gloss: 'rules'
    notes:
    - term: लट्
      en: 'present (ईश् is अदादि, आत्मनेपद)'
    - cite: "8.4.41"
      role: 'ष्टुना ष्टुः — after ष्, the त of the ending becomes ट: ईष् + ते → ईष्टे'
  - form: सः
    lemma: तद्
    gloss: 'he'
    notes:
    - term: सर्वनाम
      en: 'pronoun'
    - term: प्रथमा
      en: 'nominative'
    - term: कर्तृ
      en: 'the one who is fond'
  - form: पुत्रयोः
    lemma: पुत्र
    gloss: 'his two sons'
    notes:
    - term: अधिकरण
      en: 'the object of affection — स्निह् takes the सप्तमी'
    - term: सप्तमी
      en: 'locative dual'
    - cite: "7.3.104"
      role: 'ओसि च — the अ of पुत्र becomes ए before ओस् → पुत्रयोः'
  - form: स्निह्यति
    lemma: स्निह्
    gloss: 'is fond of'
    notes:
    - term: लट्
      en: 'present (स्निह् is दिवादि: श्यन् → स्निह्यति)'
