  sentence: 'कृष्णे गच्छति सति गोप्यः अतीव अरुदन्। याः गोप्यः कृष्णम् प्रेम्णा अपश्यन्, ताः सर्वाः शोकेन मग्नाः अभवन्। रथे स्थितः कृष्णः ताः रुदतीः दृष्ट्वा अपि न न्यवर्तत। तस्य हृदये तु ताः एव सर्वदा अवसन्।'
  translation: When Kṛṣṇa was leaving, the gopīs wept bitterly. Those gopīs who used to look upon Kṛṣṇa with love — all of them were sunk in grief. Kṛṣṇa, seated in the chariot, though he saw them weeping, did not turn back. Yet in his heart they alone dwelt always.
  teaches: 'locative absolute (सति-सप्तमी — कृष्णे गच्छति सति, 2.3.37); relative-correlative याः…ताः over a full clause; present participle as object (रुदतीः "weeping ones"); gerund दृष्ट्वा with concessive अपि'
