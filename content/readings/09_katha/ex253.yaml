  vyakhya: 'दीर्घा कथा — पूर्वाभ्यस्तानाम् एकत्र प्रयोगः। उपगम्य विलम्ब्य इति ल्यप्; श्रुत्वा दृष्ट्वा इति क्त्वा; प्रेषयिष्यामः इति लृट्; बहून् पशून् इति शसि आन्; सिंहम् कूपम् इति गत्यर्थे द्वितीया; भीताः क्रुद्धः इति क्तप्रत्ययाः। पञ्चतन्त्रकथायाः संक्षिप्तं रूपम् — पाठनाभ्यासाय।'
  vyakhya_en: |
    A longer read, and a familiar one — the rabbit who drowns the lion in a well.
    Nothing new; the point is to carry the machinery across a real narrative arc:
    prefixed gerunds (उपगम्य, विलम्ब्य) and plain ones (श्रुत्वा, दृष्ट्वा) chaining
    the events; a first-person plural future (प्रेषयिष्यामः) in the animals' bargain;
    accusative plurals (बहून् पशून्), motion-goals (सिंहम्, कूपम्), and क्त
    participles (भीताः, क्रुद्धः) coloring the actors. Read it for speed, not for
    parsing — that is what fluency feels like.
