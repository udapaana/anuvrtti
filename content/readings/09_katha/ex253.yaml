  source:
    text: कथा (our graded retelling)
    ref: "the lion and the clever rabbit — our own longer telling (after the Pañcatantra)"
    curated: our simple Sanskrit; a retelling, not quoting any edition
  sentence: कस्मिन्चित् वने क्रूरः सिंहः अवसत्। सः प्रतिदिनम् बहून् पशून् अहन्। भीताः पशवः तम् उपगम्य अवदन् — वयम् प्रतिदिनम् एकम् पशुम् प्रेषयिष्यामः। एकदा एकः शशकः विलम्ब्य सिंहम् अगच्छत्। क्रुद्धः सिंहः तम् अपृच्छत्। शशकः अवदत् — अन्यः सिंहः त्वाम् द्रष्टुम् इच्छति। तत् श्रुत्वा सिंहः कूपम् अगच्छत्। तत्र स्वम् प्रतिबिम्बम् दृष्ट्वा सः कूपे अपतत्।
  translation: In a certain forest lived a cruel lion. Every day he killed many animals. The frightened animals, approaching him, said — "We will send one animal each day." One day a rabbit went to the lion, delaying. The angry lion asked him. The rabbit said — "Another lion wishes to see you." Hearing that, the lion went to a well. Seeing his own reflection there, he fell into the well.
  teaches: |
    a longer read for fluency — the whole apparatus at work together: the
    prefixed gerunds उपगम्य, विलम्ब्य; the plain gerunds श्रुत्वा, दृष्ट्वा; a
    future प्रेषयिष्यामः; an accusative plural बहून् पशून्; and motion-verb goals.
