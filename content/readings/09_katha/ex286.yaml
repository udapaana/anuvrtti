- id: ex286
  kind: graded
  segment: 182
  order: 2
  sentence: 'एकदा रामः सीता च वने सुषुपतुः। प्रातः रामः सीताम् उवाच — अहम् स्वप्ने अयोध्याम् जगम, पितरम् च ददर्श। सीता उवाच — त्वम् तत्र किम् चकर्थ? रामः उवाच — अहम् पितरम् ननम, सः माम् उवाच — पुत्र, चिरम् जीव। सीता उवाच — आवाम् अपि स्वप्ने अयोध्याम् जग्मिव इति मन्ये।'
  translation: 'Once Rāma and Sītā slept in the forest. In the morning Rāma said to Sītā: "In a dream I went to Ayodhyā and saw my father." Sītā said: "What did you do there?" Rāma said: "I bowed to my father, and he said to me: ''Son, live long.''" Sītā said: "I think we two went to Ayodhyā in a dream as well."'
  teaches: 'The perfect in the first and second person — what one did unawares, in a dream (3.2.115 परोक्षे लिट्): जगम, ददर्श, ननम, चकर्थ, जग्मिव.'
