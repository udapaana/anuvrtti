  sentence: राज्ञः पञ्च पुत्राः आसन्। प्रथमः शूरः आसीत्। द्वितीयः पण्डितः। तृतीयः धनी। चतुर्थः दाता। पञ्चमः तु सर्वेषु श्रेष्ठः आसीत्।
  translation: The king had five sons. The first was brave. The second, learned. The third, rich. The fourth, a giver. But the fifth was the best of all.
  teaches: |
    counting — the cardinal पञ्च "five," and the ordinals प्रथम, द्वितीय …
    पञ्चम "first, second … fifth," the पूरण ("filling-the-number") derivatives;
    plus दाता, the तृच् agent-noun.
