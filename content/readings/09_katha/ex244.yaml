  source:
    text: कथा (our graded retelling)
    ref: "the thirsty crow — our own longer telling"
    curated: our simple Sanskrit; not from any single source
  sentence: एकदा एकः काकः तृषितः अभवत्। सः जलम् अन्वेष्टुम् इतस्ततः अभ्रमत्। ततः मार्गे एकम् घटम् अपश्यत्। तस्मिन् घटे अल्पम् जलम् आसीत्। काकः चञ्च्वा जलम् प्राप्तुम् न अशक्नोत्। तदा सः बुद्धिम् अकरोत्। सः पाषाणान् आनीय घटे अक्षिपत्। शनैः जलम् उपरि आगच्छत्। एवम् बुद्धिमान् काकः जलम् अपिबत् तृप्तः च अभवत्।
  translation: One day a crow grew thirsty. It wandered here and there to look for water. Then on the road it saw a pot. In that pot there was a little water. With its beak the crow could not reach the water. Then it had an idea. It brought stones and dropped them into the pot. Slowly the water rose up. Thus the clever crow drank the water and was satisfied.
  teaches: |
    a whole little story, to read at length: infinitives of purpose
    (अन्वेष्टुम्, प्राप्तुम्), a prefixed gerund (आनीय, ल्यप्), a masculine
    accusative plural (पाषाणान्), and eight past-tense verbs carrying the action.
