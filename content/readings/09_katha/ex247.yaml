  sentence: राज्ञा प्रजाः रक्षणीयाः। गुरवे सेवा देया। सत्यम् वक्तव्यम्। धर्मः पालनीयः। एतत् सर्वैः ज्ञेयम्।
  translation: The subjects must be protected by the king. Service is to be given to the teacher. The truth must be spoken. Dharma must be upheld. All this must be known by everyone.
  teaches: |
    the gerundive — the "must / to-be-done" verbal adjective: देया "to be given"
    and ज्ञेयम् "to be known" (the यत् suffix on vowel-final roots), beside
    रक्षणीयाः, वक्तव्यम्, पालनीयः (the अनीयर् and तव्य suffixes).
