# ════════════════════════════════════════════════════════════════════════
#  08_taddhita.yaml — तद्धित — secondary derivation: noun → noun
#  A NEW chapter. तद्धित affixes attach to a FINISHED noun (प्रातिपदिक) to make
#  another noun: patronymics, "born/found in", possessives, comparatives,
#  abstracts. The 4-5 adhyāyas are vast; a learner's reference covers only the
#  common, productive affixes. Prereq: सुप् (the base must be a प्रातिपदिक).
#  Graded ~ segment 20 (after compounds; both are word-building from words).
#  Source of truth; the app is derived. Schema: readings/_SCHEMA.md.
# ════════════════════════════════════════════════════════════════════════

readings:

- id: ex080
  segment: 200
  sentence: दशरथस्य अपत्यं दाशरथिः।
  translation: The descendant of Daśaratha is "Dāśarathi" (= Rāma).
  teaches: 'अपत्य — the patronymic; इञ् after an अ-stem, with आदिवृद्धि'
  words:
  - form: दशरथस्य
    gloss: of Daśaratha
    notes:
    - term: षष्ठी
      en: genitive — the विग्रह "of ___" that the affix replaces
    - cite: '2.3.50'
      role: षष्ठी शेषे → दशरथस्य (the analysis; the तद्धित condenses it)
  - form: अपत्यं
    gloss: descendant, offspring
    notes:
    - cite: "8.3.23"
      role: मोऽनुस्वारः — word-final म् becomes anusvāra before a consonant → अपत्यं
    - term: अर्थ
      en: the SENSE the affix carries — "descendant of"
  - form: दाशरथिः
    lemma: दाशरथि
    gloss: son/descendant of Daśaratha
    notes:
    - term: तद्धित
      en: a secondary derivative — noun made from a noun
    - term: इञ्
      en: the इञ् patronymic suffix
    - term: अपत्य
      en: अर्थ — "descendant of"
    - cite: '4.1.92'
      role: तस्यापत्यम् → in the sense "descendant of ___", a तद्धित affix
    - cite: '4.1.95'
      role: अत इञ् → after an अ-stem the affix is इञ् → दशरथ + इ → दाशरथि (आदिवृद्धि अ→आ)
    - term: प्रथमा
      en: nominative
  vyakhya: तस्य अपत्यम् इति अर्थे इञ्; आदेर्वृद्धिः। दशरथ → दाशरथिः।
  vyakhya_en: |
    A तद्धित attaches to a *finished* word and makes a new one. The patronymic: "descendant of X" (4.1.92) becomes a single word by adding इञ् after an अ-stem (4.1.95), with vṛddhi of the first vowel — दशरथ → दाशरथिः "son of Daśaratha." The genitive phrase दशरथस्य अपत्यम् collapses into one derived noun. (Other bases take अण् → गार्ग्यः, यञ् → for गोत्र lines.)

- id: ex081
  segment: 200
  sentence: मथुरायां भवः माथुरः।
  translation: One born/found in Mathurā is "Māthura."
  teaches: 'तत्र भवः — "born in / belonging to a place", with आदिवृद्धि'
  words:
  - form: मथुरायां
    gloss: in Mathurā
    notes:
    - term: अधिकरण
      en: locus — the सप्तमी base of the derivation
    - cite: '2.3.36'
      role: सप्तम्यधिकरणे च → मथुरायाम् (the विग्रह "in Mathurā")
    - term: सप्तमी
      en: locative
  - form: भवः
    gloss: arising, being (in)
    notes:
    - term: अर्थ
      en: the sense — "who/which is in ___"
  - form: माथुरः
    lemma: माथुर
    gloss: of Mathurā, a Mathurā-man
    notes:
    - term: तद्धित
      en: secondary derivative from the place-name
    - term: अण्
      en: the अण् affix, with आदिवृद्धि
    - term: तत्र-भवः
      en: अर्थ — "situated/born in ___"
    - cite: '4.3.53'
      role: तत्र भवः → "being in (that place)" → an affix after the locative base → माथुरः (आदिवृद्धि)
    - term: प्रथमा
      en: nominative
  vyakhya: तत्र भवः इति अर्थे अण्; मथुरा → माथुरः। देशकालादेः भवार्थः।
  vyakhya_en: |
    "Born in / found in / belonging to a place" — तत्र भवः (4.3.53) — turns a locative phrase into one adjective: मथुरायां भवः → माथुरः "of Mathurā," with vṛddhi (मथुरा → माथुर). The same family gives "relating to X" (तस्येदम्, 4.3.120) and "good for X" (तस्मै हितम्, 5.1.5). These locative/genitive/dative taddhitas are how Sanskrit forms its everyday relational adjectives.

- id: ex082
  segment: 200
  sentence: धनम् अस्य अस्ति इति धनवान्।
  translation: He who has wealth is "wealthy" (dhanavān).
  teaches: 'मतुप् — the possessive "having ___"'
  words:
  - form: धनम्
    gloss: wealth
    notes:
    - term: प्रथमा
      en: the base — the thing possessed
  - form: अस्य
    lemma: इदम्
    gloss: his, of this
    notes:
    - term: सर्वनाम
      en: pronoun
    - term: षष्ठी
      en: genitive (इदम्/अयम्)
  - form: अस्ति
    gloss: there is, exists
    notes:
    - term: अस्
      en: '"be" — the विग्रह "X is his / in him"'
  - form: इति
    lemma: इति
    gloss: thus ("…")
    notes:
    - term: अव्यय
      en: quotative — closes a name/quote
  - form: धनवान्
    lemma: धनवत्
    gloss: wealthy, possessing wealth
    notes:
    - term: तद्धित
      en: possessive derivative
    - cite: '5.2.94'
      role: तदस्यास्त्यस्मिन्निति मतुप् → मतुप् "it is his / in him" → धन + मतुप् → धनवत् → धनवान्
    - cite: '7.1.70'
      role: उगिदचां सर्वनामस्थाने → the मतुप् (वत्) stem inserts नुम् before strong endings → धनवान्
    - term: प्रथमा
      en: nominative
  vyakhya: तत् अस्य अस्ति इति मतुप् — मत्वर्थः। धन + मतुप् → धनवान् (बुद्धिमान् वत्)।
  vyakhya_en: |
    The possessive: "having X / in whom X is" — मतुप् (5.2.94). धन + मतुप् → धनवान् "wealthy," बुद्धि + मतुप् → बुद्धिमान् "wise" (the affix shows as -वत्/-मत्, declining राजन्-style with नुम्). You met गुणवान् and वीरवत्तमं in real text; this is the rule behind them — the workhorse that turns any noun into "the one who has it."

- id: ex083
  segment: 200
  sentence: अयं ततः पटुतरः।
  translation: This one is cleverer than that.
  teaches: 'तरप् — the comparative ("more ___ than")'
  words:
  - form: अयं
    gloss: this one
    notes:
    - cite: "8.3.23"
      role: मोऽनुस्वारः — word-final म् becomes anusvāra before a consonant → अयं
    - term: सर्वनाम
      en: demonstrative (इदम्)
    - term: प्रथमा
      en: nominative
  - form: ततः
    gloss: than that
    notes:
    - term: अपादान
      en: the standard of comparison → पञ्चमी
    - cite: '2.3.42'
      role: पञ्चमी विभक्ते → the term compared-from takes पञ्चमी → ततः
    - term: पञ्चमी
      en: ablative
  - form: पटुतरः
    lemma: पटुतर
    gloss: cleverer, more skilled
    notes:
    - term: तद्धित
      en: comparative derivative
    - cite: '5.3.57'
      role: द्विवचनविभज्योपपदे तरबीयसुनौ → तरप् (तर)/ईयसुन् for comparison of two → पटु + तर → पटुतरः
    - term: प्रथमा
      en: nominative
  vyakhya: द्वयोः विभजने तरप्; पञ्चमी विभक्ते। पटु → पटुतरः, अन्यस्मात्।
  vyakhya_en: |
    Comparing TWO: तरप् → -तर (5.3.57), "more X (than the other)" — पटु → पटुतरः "cleverer." The thing surpassed stands in the ablative (पञ्चमी, 2.3.42): ततः पटुतरः "cleverer than that." The matching ईयस् (-ीयस्) is the irregular comparative (श्रेयस्, the श्रेयः you met). For surpassing ALL — the superlative — it is तमप्/इष्ठन् (5.3.55): पटुतमः "cleverest" (you saw रत्नधातमम्, वीरवत्तमम्).

- id: ex084
  segment: 200
  sentence: गुरोः भावः गुरुत्वम्।
  translation: The state of being heavy/a-teacher is "gurutva" (heaviness / gravity).
  teaches: 'त्व/तल् — the abstract noun ("-ness, the state of")'
  words:
  - form: गुरोः
    gloss: of the heavy one / of the teacher
    notes:
    - term: षष्ठी
      en: genitive — the base whose "-ness" is named (उ-stem गुरु → गुरोः)
    - cite: '2.3.50'
      role: षष्ठी शेषे → गुरोः
  - form: भावः
    gloss: state, being, abstract quality
    notes:
    - term: अर्थ
      en: the sense — "the state/quality of being ___"
  - form: गुरुत्वम्
    lemma: गुरुत्व
    gloss: heaviness, gravity; the state of being a guru
    notes:
    - term: तद्धित
      en: abstract derivative
    - cite: '5.1.119'
      role: तस्य भावस्त्वतलौ → त्व (and तल् → ता) for "the state of ___" → गुरु + त्व → गुरुत्वम्
    - term: प्रथमा
      en: nominative
    - term: नपुंसक
      en: neuter (-त्व abstracts are neuter)
  vyakhya: तस्य भावः इति त्व-तलौ। गुरुत्वम् (नपुंसकम्), गुरुता (स्त्री)। भाववाचकम्।
  vyakhya_en: |
    The abstract: "the state of being X" — त्व and तल् (5.1.119). गुरु → गुरुत्वम् "heaviness/gurutva" (neuter, with -त्व) or गुरुता "guru-hood" (feminine, with -ता). देव → देवत्वम्/देवता. This is Sanskrit's "-ness / -hood": take any noun or adjective, add त्व or ता, and you have named its quality as a thing. Patronymic, place-adjective, possessive, comparative, abstract — the तद्धित system's productive core.

- id: ex085
  segment: 200
  sentence: सर्वेषु पटुषु अयं पटुतमः।
  translation: Among all the clever, this one is the cleverest.
  teaches: 'तमप् — the superlative ("most ___ of all"); निर्धारण in सप्तमी'
  words:
  - form: सर्वेषु
    gloss: among all
    notes:
    - term: निर्धारण
      en: selection-from-a-group → सप्तमी
    - cite: '2.3.41'
      role: यतश्च निर्धारणम् → the group one is singled out from → सप्तमी (or षष्ठी) → सर्वेषु
    - term: सप्तमी
      en: locative
  - form: पटुषु
    gloss: among the clever (ones)
    notes:
    - term: निर्धारण
      en: the class — locative plural, parallel to सर्वेषु
    - term: सप्तमी
      en: locative
  - form: अयं
    gloss: this one
    notes:
    - cite: "8.3.23"
      role: मोऽनुस्वारः — word-final म् becomes anusvāra before a consonant → अयं
    - term: प्रथमा
      en: nominative
  - form: पटुतमः
    lemma: पटुतम
    gloss: the cleverest
    notes:
    - term: तद्धित
      en: superlative derivative
    - cite: '5.3.55'
      role: अतिशायने तमबिष्ठनौ → तमप् (तम)/इष्ठन् for surpassing all → पटु + तम → पटुतमः
    - term: प्रथमा
      en: nominative
  vyakhya: अतिशायने तमप्; निर्धारणे सप्तमी। सर्वेषु पटुषु पटुतमः।
  vyakhya_en: |
    The superlative completes the pair: तमप् → -तम (5.3.55), "most X of all" — पटु → पटुतमः "the cleverest." The group one is singled out FROM takes निर्धारण-सप्तमी (2.3.41): सर्वेषु पटुषु "among all the clever." So तर/तम are the degree-affixes — पटुतरः "cleverer (of two)," पटुतमः "cleverest (of all)" — closing the productive तद्धित set the reader needs.

- id: ex131
  segment: 200
  sentence: उपगोः इदम् औपगवम्।
  translation: This belongs to Upagu — it is "Aupagava" (Upagu's).
  teaches: 'तस्येदम् — "belonging to / coming from X"; अण् with आदिवृद्धि (उपगु → औपगव)'
  words:
  - form: उपगोः
    gloss: of Upagu
    notes:
    - term: षष्ठी
      en: genitive — the विग्रह "of ___" the affix replaces
    - cite: '2.3.50'
      role: षष्ठी शेषे → उपगोः
  - form: इदम्
    gloss: this (thing)
    notes:
    - term: अर्थ
      en: the sense — "this is X's"
  - form: औपगवम्
    lemma: औपगव
    gloss: belonging to Upagu
    notes:
    - term: तद्धित
      en: secondary derivative — "X's, of X"
    - term: अण्
      en: the अण् affix, with आदिवृद्धि
    - term: तस्येदम्
      en: अर्थ — "belonging to ___"
    - cite: '4.3.120'
      role: तस्येदम् → in the sense "belonging to ___", the affix अण्
    - cite: '7.2.117'
      role: तद्धितेष्वचामादेः → आदिवृद्धि उ→औ → औपगव
    - term: प्रथमा
      en: nominative (neuter)
  vyakhya: तस्य इदम् इति अर्थे अण्; आदेर्वृद्धिः। उपगु → औपगवम्।
  vyakhya_en: |
    The "possession / belonging" affix: तस्येदम् "this is X's" (4.3.120) condenses into one word with अण्, plus आदिवृद्धि — vṛddhi of the first vowel (7.2.117). उपगोः इदम् "Upagu's" → औपगवम्. The same आदिवृद्धि you saw in the patronymic दाशरथिः (ex080) is the signature of this whole अण् family.
- id: ex132
  segment: 200
  sentence: सुवर्णस्य विकारः सौवर्णम्।
  translation: A modification of gold is "golden" (made of gold).
  teaches: 'तस्य विकारः — "made of / a modification of X"; अण् with आदिवृद्धि'
  words:
  - form: सुवर्णस्य
    gloss: of gold
    notes:
    - term: षष्ठी
      en: genitive — "of ___", the material
    - cite: '2.3.50'
      role: षष्ठी शेषे → सुवर्णस्य
  - form: विकारः
    gloss: a modification, a product
    notes:
    - term: अर्थ
      en: the sense — "a thing made of / changed from X"
  - form: सौवर्णम्
    lemma: सौवर्ण
    gloss: made of gold, golden
    notes:
    - term: तद्धित
      en: secondary derivative — "made of ___"
    - term: अण्
      en: the अण् affix, with आदिवृद्धि
    - term: विकार
      en: अर्थ — "a modification/product of ___"
    - cite: '4.3.134'
      role: तस्य विकारः → in the sense "modification/product of ___", अण्
    - cite: '7.2.117'
      role: तद्धितेष्वचामादेः → आदिवृद्धि उ→औ → सौवर्ण
    - term: प्रथमा
      en: nominative (neuter)
  vyakhya: तस्य विकारः इति अर्थे अण्। सुवर्ण → सौवर्णम् "स्वर्णमयम्"।
  vyakhya_en: |
    "Made of X / a product of X": तस्य विकारः (4.3.134) → अण् with आदिवृद्धि. सुवर्णस्य विकारः "a modification of gold" → सौवर्णम् "golden, of gold." This is the material-adjective: the same shape names "made of wood" (दारु → दारवम्), "made of clay," and so on.
- id: ex133
  segment: 200
  sentence: कषायेण रक्तं वस्त्रं काषायम्।
  translation: A cloth dyed with ochre is a "kāṣāya" (ochre robe).
  teaches: 'तेन रक्तं रागात् — "dyed with X"; अण् from the name of a dye, with आदिवृद्धि'
  words:
  - form: कषायेण
    gloss: with ochre (the dye)
    notes:
    - term: करण
      en: instrument — "dyed BY ___"
    - cite: '2.3.18'
      role: कर्तृकरणयोस्तृतीया → करण → कषायेण
    - term: तृतीया
      en: instrumental
  - form: रक्तम्
    gloss: dyed, coloured
    notes:
    - term: अर्थ
      en: the sense — "coloured with X"
  - form: वस्त्रम्
    gloss: cloth, garment
    notes:
    - term: कर्मन्
      en: the thing dyed
  - form: काषायम्
    lemma: काषाय
    gloss: ochre-dyed (robe)
    notes:
    - term: तद्धित
      en: secondary derivative — "dyed with ___"
    - term: अण्
      en: the अण् affix, with आदिवृद्धि
    - term: तस्येदम्
      en: अर्थ — here the specialised "dyed-with" sense (तेन रक्तम्)
    - cite: '4.2.1'
      role: तेन रक्तं रागात् → "dyed with (a dye)", अण् from the dye-name
    - cite: '7.2.117'
      role: तद्धितेष्वचामादेः → आदिवृद्धि अ→आ → काषाय
    - term: प्रथमा
      en: nominative (neuter)
  vyakhya: तेन रक्तम् इति रागवाचिनः अण्। कषाय → काषायम्। (मुनीनां वस्त्रम्।)
  vyakhya_en: |
    From the name of a dye, "dyed with X": तेन रक्तं रागात् (4.2.1) → अण् with आदिवृद्धि. कषायेण रक्तम् "dyed with ochre" → काषायम् — the ochre robe of ascetics. Notice the विग्रह uses the तृतीया (कषायेण, "by the dye"), the instrument; the affix swallows it into one adjective.
- id: ex134
  segment: 200
  sentence: सर्वस्मै हितं सर्वहितम्।
  translation: That which is good for all is the "all-good."
  teaches: 'तस्मै हितम् — "good for / suited to X"; the relational set (विग्रह in चतुर्थी)'
  words:
  - form: सर्वस्मै
    gloss: for all
    notes:
    - term: सम्प्रदान
      en: the one it is good FOR
    - cite: '5.1.5'
      role: तस्मै हितम् → in the sense "good for ___", a तद्धित affix
    - term: चतुर्थी
      en: dative — the विग्रह "for ___"
  - form: हितम्
    gloss: good, beneficial, suited
    notes:
    - term: अर्थ
      en: the sense — "beneficial for X"
  - form: सर्वहितम्
    lemma: सर्वहित
    gloss: good for all, the common good
    notes:
    - term: तद्धित
      en: relational derivative — "suited to ___"
    - cite: '5.1.5'
      role: तस्मै हितम् → the affix condensing "good for ___"
    - term: प्रथमा
      en: nominative (neuter)
  vyakhya: तस्मै हितम् इति अर्थे प्रत्ययः; विग्रहे चतुर्थी। सर्वस्मै हितं सर्वहितम्।
  vyakhya_en: |
    A relational affix whose विग्रह uses the चतुर्थी: तस्मै हितम् "good FOR X" (5.1.5). सर्वस्मै हितम् "good for all" → सर्वहितम्. This sits beside तत्र भवः (place, 4.3.53, ex081) and तस्येदम् (possession, ex131): a family of affixes each replacing one case-relation — dative here, locative and genitive there.
- id: ex135
  segment: 200
  sentence: ग्रामतः आगच्छति।
  translation: He comes from the village.
  teaches: 'पञ्चम्यास्तसिल् — the adverb-affix तसिल् (-तस्) in the ablative sense ("from ___")'
  words:
  - form: ग्रामतः
    lemma: ग्राम
    gloss: from the village
    notes:
    - term: अपादान
      en: source — "from ___" (the ablative sense)
    - cite: '5.3.7'
      role: पञ्चम्यास्तसिल् → in the पञ्चमी (ablative) sense, the affix तसिल् → -तस्
    - term: तद्धित
      en: an indeclinable तद्धित — ग्राम + तस् = ग्रामतः ("from the village")
    - term: अव्यय
      en: indeclinable (it does not take सुप् endings)
  - form: आगच्छति
    lemma: गम्
    gloss: comes
    notes:
    - term: गम्
      en: '"come" (आ + गम्)'
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  vyakhya: पञ्चम्यर्थे तसिल्; ग्राम + तस् = ग्रामतः अव्ययम्। ग्रामात् = ग्रामतः।
  vyakhya_en: |
    Instead of the case-ending पञ्चमी (ग्रामात्), the same ablative sense can be carried by a तद्धित adverb: पञ्चम्यास्तसिल् (5.3.7) adds -तस् → ग्रामतः "from the village," an indeclinable. So ग्रामात् आगच्छति and ग्रामतः आगच्छति say the same thing — the second with an अव्यय taddhita. This affix gives ततः, यतः, सर्वतः, and the like.
- id: ex136
  segment: 200
  sentence: ब्राह्मणवत् अधीते।
  translation: He studies like a brahmin.
  teaches: 'तेन तुल्यं…वतिः — the affix वति (-वत्), "like / in the manner of X"'
  words:
  - form: ब्राह्मणवत्
    lemma: ब्राह्मण
    gloss: like a brahmin, in a brahmin's manner
    notes:
    - term: अर्थ
      en: the sense — "similar to / as ___ does"
    - cite: '5.1.115'
      role: तेन तुल्यं क्रिया चेद्वतिः → in the sense "like ___ (in action)", the affix वति
    - term: तद्धित
      en: an indeclinable तद्धित — ब्राह्मण + वत् = ब्राह्मणवत् ("brahmin-like")
    - term: अव्यय
      en: indeclinable (manner adverb)
  - form: अधीते
    lemma: इ
    gloss: studies
    notes:
    - term: इ
      en: '"study" (अधि + इ, आत्मनेपद)'
    - term: लट्
      en: present
  vyakhya: तेन तुल्यं क्रिया चेत् वतिः। ब्राह्मण + वत् = ब्राह्मणवत् "ब्राह्मणेन तुल्यम्"।
  vyakhya_en: |
    "Like X, in the manner of X (when comparing an action)": तेन तुल्यं क्रिया चेद्वतिः (5.1.115) → the affix वति, -वत्. ब्राह्मणवत् अधीते "studies like a brahmin" = ब्राह्मणेन तुल्यम्. An indeclinable adverb of comparison — the same वत् gives मातृवत् "like a mother," राजवत् "like a king."
