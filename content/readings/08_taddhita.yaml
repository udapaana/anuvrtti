#  08_taddhita.yaml — तद्धित — secondary derivation: noun → noun
#  A NEW chapter. तद्धित affixes attach to a FINISHED noun (प्रातिपदिक) to make
#  another noun: patronymics, "born/found in", possessives, comparatives,
#  abstracts. The 4-5 adhyāyas are vast; a learner's reference covers only the
#  common, productive affixes. Prereq: सुप् (the base must be a प्रातिपदिक).
#  Graded ~ segment 20 (after compounds; both are word-building from words).
#  Source of truth; the app is derived. Schema: readings/_SCHEMA.md.
# ════════════════════════════════════════════════════════════════════════

readings:

- id: ex080
  segment: 20
  sentence: दशरथस्य अपत्यं दाशरथिः।
  translation: The descendant of Daśaratha is "Dāśarathi" (= Rāma).
  teaches: 'अपत्य — the patronymic; इञ् after an अ-stem, with आदिवृद्धि'
  words:
  - form: दशरथस्य
    gloss: of Daśaratha
    notes:
    - term: षष्ठी
      en: genitive — the विग्रह "of ___" that the affix replaces
    - cite: '2.3.50'
      role: षष्ठी शेषे → दशरथस्य (the analysis; the तद्धित condenses it)
  - form: अपत्यं
    gloss: descendant, offspring
    notes:
    - term: अर्थ
      en: the SENSE the affix carries — "descendant of"
  - form: दाशरथिः
    lemma: दाशरथि
    gloss: son/descendant of Daśaratha
    notes:
    - term: तद्धित
      en: a secondary derivative — noun made from a noun
    - cite: '4.1.92'
      role: तस्यापत्यम् → in the sense "descendant of ___", a तद्धित affix
    - cite: '4.1.95'
      role: अत इञ् → after an अ-stem the affix is इञ् → दशरथ + इ → दाशरथि (आदिवृद्धि अ→आ)
    - term: प्रथमा
      en: nominative
  vyakhya: तस्य अपत्यम् इति अर्थे इञ्; आदेर्वृद्धिः। दशरथ → दाशरथिः।
  vyakhya_en: |
    A तद्धित attaches to a *finished* word and makes a new one. The patronymic: "descendant of X" (4.1.92) becomes a single word by adding इञ् after an अ-stem (4.1.95), with vṛddhi of the first vowel — दशरथ → दाशरथिः "son of Daśaratha." The genitive phrase दशरथस्य अपत्यम् collapses into one derived noun. (Other bases take अण् → गार्ग्यः, यञ् → for गोत्र lines.)

- id: ex081
  segment: 20
  sentence: मथुरायां भवः माथुरः।
  translation: One born/found in Mathurā is "Māthura."
  teaches: 'तत्र भवः — "born in / belonging to a place", with आदिवृद्धि'
  words:
  - form: मथुरायां
    gloss: in Mathurā
    notes:
    - term: अधिकरण
      en: locus — the सप्तमी base of the derivation
    - cite: '2.3.36'
      role: सप्तम्यधिकरणे च → मथुरायाम् (the विग्रह "in Mathurā")
    - term: सप्तमी
      en: locative
  - form: भवः
    gloss: arising, being (in)
    notes:
    - term: अर्थ
      en: the sense — "who/which is in ___"
  - form: माथुरः
    lemma: माथुर
    gloss: of Mathurā, a Mathurā-man
    notes:
    - term: तद्धित
      en: secondary derivative from the place-name
    - cite: '4.3.53'
      role: तत्र भवः → "being in (that place)" → an affix after the locative base → माथुरः (आदिवृद्धि)
    - term: प्रथमा
      en: nominative
  vyakhya: तत्र भवः इति अर्थे अण्; मथुरा → माथुरः। देशकालादेः भवार्थः।
  vyakhya_en: |
    "Born in / found in / belonging to a place" — तत्र भवः (4.3.53) — turns a locative phrase into one adjective: मथुरायां भवः → माथुरः "of Mathurā," with vṛddhi (मथुरा → माथुर). The same family gives "relating to X" (तस्येदम्, 4.3.120) and "good for X" (तस्मै हितम्, 5.1.5). These locative/genitive/dative taddhitas are how Sanskrit forms its everyday relational adjectives.

- id: ex082
  segment: 20
  sentence: धनम् अस्य अस्ति इति धनवान्।
  translation: He who has wealth is "wealthy" (dhanavān).
  teaches: 'मतुप् — the possessive "having ___"'
  words:
  - form: धनम्
    gloss: wealth
    notes:
    - term: प्रथमा
      en: the base — the thing possessed
  - form: अस्य
    lemma: इदम्
    gloss: his, of this
    notes:
    - term: षष्ठी
      en: genitive (इदम्/अयम्)
  - form: अस्ति
    gloss: there is, exists
    notes:
    - term: अस्
      en: '"be" — the विग्रह "X is his / in him"'
  - form: इति
    lemma: इति
    gloss: thus ("…")
    notes:
    - term: अव्यय
      en: quotative — closes a name/quote
  - form: धनवान्
    lemma: धनवत्
    gloss: wealthy, possessing wealth
    notes:
    - term: तद्धित
      en: possessive derivative
    - cite: '5.2.94'
      role: तदस्यास्त्यस्मिन्निति मतुप् → मतुप् "it is his / in him" → धन + मतुप् → धनवत् → धनवान्
    - cite: '7.1.70'
      role: उगिदचां सर्वनामस्थाने → the मतुप् (वत्) stem inserts नुम् before strong endings → धनवान्
    - term: प्रथमा
      en: nominative
  vyakhya: तत् अस्य अस्ति इति मतुप् — मत्वर्थः। धन + मतुप् → धनवान् (बुद्धिमान् वत्)।
  vyakhya_en: |
    The possessive: "having X / in whom X is" — मतुप् (5.2.94). धन + मतुप् → धनवान् "wealthy," बुद्धि + मतुप् → बुद्धिमान् "wise" (the affix shows as -वत्/-मत्, declining राजन्-style with नुम्). You met गुणवान् and वीरवत्तमं in real text; this is the rule behind them — the workhorse that turns any noun into "the one who has it."

- id: ex083
  segment: 20
  sentence: अयं ततः पटुतरः।
  translation: This one is cleverer than that.
  teaches: 'तरप् — the comparative ("more ___ than")'
  words:
  - form: अयं
    gloss: this one
    notes:
    - term: सर्वनाम
      en: demonstrative (इदम्)
    - term: प्रथमा
      en: nominative
  - form: ततः
    gloss: than that
    notes:
    - term: अपादान
      en: the standard of comparison → पञ्चमी
    - cite: '2.3.42'
      role: पञ्चमी विभक्ते → the term compared-from takes पञ्चमी → ततः
    - term: पञ्चमी
      en: ablative
  - form: पटुतरः
    lemma: पटुतर
    gloss: cleverer, more skilled
    notes:
    - term: तद्धित
      en: comparative derivative
    - cite: '5.3.57'
      role: द्विवचनविभज्योपपदे तरबीयसुनौ → तरप् (तर)/ईयसुन् for comparison of two → पटु + तर → पटुतरः
    - term: प्रथमा
      en: nominative
  vyakhya: द्वयोः विभजने तरप्; पञ्चमी विभक्ते। पटु → पटुतरः, अन्यस्मात्।
  vyakhya_en: |
    Comparing TWO: तरप् → -तर (5.3.57), "more X (than the other)" — पटु → पटुतरः "cleverer." The thing surpassed stands in the ablative (पञ्चमी, 2.3.42): ततः पटुतरः "cleverer than that." The matching ईयस् (-ीयस्) is the irregular comparative (श्रेयस्, the श्रेयः you met). For surpassing ALL — the superlative — it is तमप्/इष्ठन् (5.3.55): पटुतमः "cleverest" (you saw रत्नधातमम्, वीरवत्तमम्).

- id: ex084
  segment: 20
  sentence: गुरोः भावः गुरुत्वम्।
  translation: The state of being heavy/a-teacher is "gurutva" (heaviness / gravity).
  teaches: 'त्व/तल् — the abstract noun ("-ness, the state of")'
  words:
  - form: गुरोः
    gloss: of the heavy one / of the teacher
    notes:
    - term: षष्ठी
      en: genitive — the base whose "-ness" is named
    - cite: '2.3.50'
      role: षष्ठी शेषे → गुरोः
    - term: पञ्चमी
      en: (उ-stem गुरु → गुरोः)
  - form: भावः
    gloss: state, being, abstract quality
    notes:
    - term: अर्थ
      en: the sense — "the state/quality of being ___"
  - form: गुरुत्वम्
    lemma: गुरुत्व
    gloss: heaviness, gravity; the state of being a guru
    notes:
    - term: तद्धित
      en: abstract derivative
    - cite: '5.1.119'
      role: तस्य भावस्त्वतलौ → त्व (and तल् → ता) for "the state of ___" → गुरु + त्व → गुरुत्वम्
    - term: प्रथमा
      en: nominative
    - term: नपुंसक
      en: neuter (-त्व abstracts are neuter)
  vyakhya: तस्य भावः इति त्व-तलौ। गुरुत्वम् (नपुंसकम्), गुरुता (स्त्री)। भाववाचकम्।
  vyakhya_en: |
    The abstract: "the state of being X" — त्व and तल् (5.1.119). गुरु → गुरुत्वम् "heaviness/gurutva" (neuter, with -त्व) or गुरुता "guru-hood" (feminine, with -ता). देव → देवत्वम्/देवता. This is Sanskrit's "-ness / -hood": take any noun or adjective, add त्व or ता, and you have named its quality as a thing. Patronymic, place-adjective, possessive, comparative, abstract — the तद्धित system's productive core.

- id: ex085
  segment: 20
  sentence: सर्वेषु पटुषु अयं पटुतमः।
  translation: Among all the clever, this one is the cleverest.
  teaches: 'तमप् — the superlative ("most ___ of all"); निर्धारण in सप्तमी'
  words:
  - form: सर्वेषु
    gloss: among all
    notes:
    - term: निर्धारण
      en: selection-from-a-group → सप्तमी
    - cite: '2.3.41'
      role: यतश्च निर्धारणम् → the group one is singled out from → सप्तमी (or षष्ठी) → सर्वेषु
    - term: सप्तमी
      en: locative
  - form: पटुषु
    gloss: among the clever (ones)
    notes:
    - term: निर्धारण
      en: the class — locative plural, parallel to सर्वेषु
    - term: सप्तमी
      en: locative
  - form: अयं
    gloss: this one
    notes:
    - term: प्रथमा
      en: nominative
  - form: पटुतमः
    lemma: पटुतम
    gloss: the cleverest
    notes:
    - term: तद्धित
      en: superlative derivative
    - cite: '5.3.55'
      role: अतिशायने तमबिष्ठनौ → तमप् (तम)/इष्ठन् for surpassing all → पटु + तम → पटुतमः
    - term: प्रथमा
      en: nominative
  vyakhya: अतिशायने तमप्; निर्धारणे सप्तमी। सर्वेषु पटुषु पटुतमः।
  vyakhya_en: |
    The superlative completes the pair: तमप् → -तम (5.3.55), "most X of all" — पटु → पटुतमः "the cleverest." The group one is singled out FROM takes निर्धारण-सप्तमी (2.3.41): सर्वेषु पटुषु "among all the clever." So तर/तम are the degree-affixes — पटुतरः "cleverer (of two)," पटुतमः "cleverest (of all)" — closing the productive तद्धित set the reader needs.
