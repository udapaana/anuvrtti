  vyakhya: 'कस्यचित् कालस्य इति कालाध्वनोः षष्ठी — "कालान्तरे"। युधाजित् केकयराजः स्वगुरुं गार्ग्यं राघवाय प्रेषयामास। अङ्गिरसः पुत्रम् इति षष्ठी, अङ्गिरस्शब्दस्य सकारान्तस्य पुंलिङ्गे षष्ठ्येकवचनम्। प्रेषयामास इति णिजन्ताद् आम्प्रत्ययः, लिटि कृञ्भ्वस्तियोगः।'
  vyakhya_en: |
    The Uttarakāṇḍa resumes: "after some time" — कस्यचित् कालस्य, the genitive
    of elapsed time, with the indefinite किम् + चित्. Yudhājit, king of the
    Kekayas and Bharata's uncle, sends (प्रेषयामास — a causative, so its perfect
    is periphrastic: प्रेषयाम् + आस) his own preceptor Gārgya. The preceptor is
    described as **अङ्गिरसः पुत्रम्**, "the son of Aṅgiras": अङ्गिरस् is a
    masculine स्-stem, and before the vowel of the genitive ending its स्
    stays — अङ्गिरस् + अस् → अङ्गिरसः, as मनस् gives मनसः. With him go ten
    thousand horses, दश … अश्वसहस्राणि, "a gift of friendship beyond compare."
