  source:
    text: रामायण
    ref: "Rāmāyaṇa 7.90.1–2 — Yudhājit sends Gārgya to Rāma"
    curated: "the two verses whole, word-separated (pausa forms; compounds kept whole; कस्य चित् written as the one indefinite कस्यचित्); every form is Vālmīki's. From GRETIL's edition (sa_rAmAyaNa, R_7.090.001–002). Yudhājit, Bharata's maternal uncle, sends his own preceptor to Rāma with a gift."
  sentence: कस्यचित् तु अथ कालस्य युधाजित् केकयः नृपः। स्वगुरुम् प्रेषयामास राघवाय महात्मने॥ गार्ग्यम् अङ्गिरसः पुत्रम् ब्रह्मर्षिम् अमितप्रभम्। दश च अश्वसहस्राणि प्रीतिदानम् अनुत्तमम्॥
  translation: Then, after some time, Yudhājit, king of the Kekayas, sent his own preceptor to the great-souled Rāghava — Gārgya, the son of Aṅgiras, a brahmarṣi of boundless radiance — and ten thousand horses, a gift of friendship beyond compare.
  teaches: |
    the masculine अस्-stem genitive — अङ्गिरसः "of Aṅgiras," the father named
    in the son's description; the genitive of time with किम् + चित्, कस्यचित्
    कालस्य "after some time"; a periphrastic perfect of a causative, प्रेषयामास;
    and a patronymic in यञ्, गार्ग्यम्.
