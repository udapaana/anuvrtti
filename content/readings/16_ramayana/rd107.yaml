    ref: "Rāmāyaṇa 2.101.14 — all rests on truth"
    curated: "the whole verse, word-separated (pausa forms; compounds kept whole); every form is Vālmīki's. From Ambuda's GRETIL edition (ambuda-org/gretil, sa_rAmAyaNa, R_2.101.014). Jābāli has urged Rāma to break his word and take the throne; Rāma answers that every rite stands on truth."
  sentence: दत्तम् इष्टम् हुतम् च एव तप्तानि च तपांसि च। वेदाः सत्यप्रतिष्ठानाः तस्मात् सत्यपरः भवेत्॥
  translation: What is given, what is sacrificed, what is offered in the fire, and the austerities performed, and the Vedas — all have truth for their foundation. Therefore one should be devoted to truth.
  teaches: |
    the neuter nominative plural of an अस्-stem — तपांसि "austerities," with
    the nasal and the long vowel of the strong stem (तपस् → तपांस् + इ) — beside
    its participle तप्तानि; neuter क्त participles standing as nouns (दत्तम्
    "what is given"); and the optative of general rule, भवेत् "one should be."
