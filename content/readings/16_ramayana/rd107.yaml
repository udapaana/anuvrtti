  vyakhya: 'रामवचनं जाबालिं प्रति। दत्तम् इष्टम् हुतम् इति नपुंसके भावे क्तः। तपांसि इति अस्-अन्तस्य नपुंसकस्य प्रथमाबहुवचनम् — शि सर्वनामस्थानम्, नुम् उपधादीर्घः च। सत्यप्रतिष्ठानाः इति बहुव्रीहिः। भवेत् इति विधौ लिङ्।'
  vyakhya_en: |
    Rāma's reply to Jābāli, who had told him a promise to a dead father binds
    no one: every rite there is — the gift (दत्तम्), the sacrifice (इष्टम्), the
    offering in the fire (हुतम्), **तपांसि** "austerities" practised, the Vedas
    themselves — stands on truth. तपांसि is the neuter plural of an अस्-stem:
    the ending इ counts as a strong ending, so the vowel lengthens and a nasal
    enters, तपस् → तपांसि (as मनस् → मनांसि). Then the rule, in the optative of
    injunction: तस्मात् सत्यपरः भवेत्, "therefore one should hold truth highest."
