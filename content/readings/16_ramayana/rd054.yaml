- id: rd054
  kind: attested
  segment: 362
  source:
    text: रामायण
    ref: "Rāmāyaṇa 1.32.7 — forgiveness, the ornament"
    curated: "the first hemistich, a maxim on its own; text from Ambuda's GRETIL edition (ambuda-org/gretil, sa_rAmAyaNa, R_1.032.007ab)"
  sentence: अलंकारो हि नारीणाम् क्षमा तु पुरुषस्य वा॥
  translation: Forgiveness is the ornament of women — and of a man as well.
  teaches: |
    a balanced maxim of genitives: नारीणाम् "of women" (with णत्व, न → ण after
    the र of नारी) and पुरुषस्य "of a man" (the अ-stem genitive स्य).
  words:
  - form: अलंकारो
    lemma: अलंकार
    gloss: an ornament
    vocab: true
    notes:
    - term: कर्तृ
      en: subject / predicate nominative
    - term: प्रथमा
      en: nominative (अलंकारः → अलंकारो before ह, विसर्ग-सन्धि)
  - form: हि
    lemma: हि
    gloss: indeed
    notes:
    - term: अव्यय
      en: emphatic particle
  - form: नारीणाम्
    lemma: नारी
    gloss: of women
    vocab: true
    notes:
    - cite: '8.4.1'
      role: रषाभ्यां नो णः — a dental न् becomes retroflex ण् when a र् or ष् precedes (even across vowels); the र of नारी retroflexes the न of the नाम् ending → नारीणाम्
    - term: सम्बन्ध
      en: the possessor — "of women"
    - term: षष्ठी
      en: genitive plural
  - form: क्षमा
    lemma: क्षमा
    gloss: forgiveness, forbearance
    vocab: true
    notes:
    - term: कर्तृ
      en: subject — "forgiveness is the ornament"
    - term: प्रथमा
      en: nominative singular (आ-stem feminine)
  - form: तु
    lemma: तु
    gloss: but, and
    notes:
    - term: अव्यय
      en: mildly contrastive particle
  - form: पुरुषस्य
    lemma: पुरुष
    gloss: of a man
    vocab: true
    notes:
    - cite: '7.1.12'
      role: टाङसिङसामिनात्स्याः — after an अ-stem, the genitive-singular ending ङस् is replaced by स्य → पुरुष + स्य → पुरुषस्य
    - term: सम्बन्ध
      en: the possessor — "of a man"
    - term: षष्ठी
      en: genitive singular
  - form: वा
    lemma: वा
    gloss: too, as well
    notes:
    - term: अव्यय
      en: '"or, as well" — extending the claim to men'
  vyakhya: 'सुभाषितम्। नारीणाम् इति नारीशब्दस्य षष्ठीबहुवचनम् — रेफात् नकारस्य णत्वम् (रषाभ्यां नो णः)। पुरुषस्य इति अकारान्तस्य ङसः स्यादेशः (टाङसिङसामिनात्स्याः)। क्षमा प्रथमा; अलंकारो विसर्गसन्धौ ओकारः।'
  vyakhya_en: |
    A single-line subhāṣita, and a tidy pairing of genitives. नारीणाम् "of
    women" is where you catch **णत्व** at work: the न् of the genitive-plural
    ending नाम् turns retroflex ण् because the र of नारी precedes it (8.4.1
    रषाभ्यां नो णः — र/ष retroflex a following न even across vowels). Its partner
    पुरुषस्य "of a man" shows the ordinary अ-stem genitive singular, the ending
    ङस् becoming स्य (7.1.12). Between them sits क्षमा, an आ-stem feminine
    nominative, the whole balanced by तु … वा "for women — and for men too."
