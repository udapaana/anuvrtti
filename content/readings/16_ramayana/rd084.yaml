  source:
    text: रामायण
    ref: "Rāmāyaṇa 1.17.35 — 'you have attained brahman-sagehood'"
    curated: "the whole verse, word-separated (pausa forms; compounds kept whole); every form is Vālmīki's. From Ambuda's GRETIL edition (ambuda-org/gretil, sa_rAmAyaNa, R_1.017.035). Spoken to Viśvāmitra when, having won his end, he is received as an honoured guest — naming the outcome of the austerity he had vowed."
  sentence: पूर्वम् राजर्षिशब्देन तपसा द्योतितप्रभः। ब्रह्मर्षित्वम् अनुप्राप्तः पूज्यः असि बहुधा मया॥
  translation: Once, by austerity, you shone under the title of royal-sage; you have (now) attained brahman-sagehood — you are honoured by me in many ways.
  teaches: |
    the arc named in one verse — the abstract-noun ब्रह्मर्षित्वम् "the state of
    being a brahman-sage" (the त्व suffix), the क्त अनुप्राप्तः "attained," and
    the gerundive पूज्यः "to be honoured"; the means throughout in the instrumental.
