  vyakhya: 'विश्वामित्रस्य फलकथनम्। ब्रह्मर्षित्वम् इति ब्रह्मर्षिशब्दात् भावे त्वप्रत्ययः (तस्य भावस्त्वतलौ)। अनुप्राप्तः इति निष्ठा कर्तरि। पूज्यः इति पूजेः ण्यत् (ऋहलोर्ण्यत्), मया इति तत्र कर्तरि तृतीया। राजर्षिशब्देन तपसा इति करणे। पूर्वम् राजर्षिः, इदानीम् ब्रह्मर्षिः — क्रमेण उत्कर्षः।'
  vyakhya_en: |
    One verse names the whole climb. The abstract **ब्रह्मर्षित्वम्** "brahman-
    sagehood" is ब्रह्मर्षि + त्व, "the *state of being* a brahman-sage" (5.1.119) —
    and अनुप्राप्तः "attained" (a क्त predicate) says he reached it. पूज्यः "to be
    honoured" is a gerundive (ण्यत्), its agent in the instrumental — पूज्यः … मया,
    "to be honoured *by me*." The means run through the तृतीया — तपसा "by
    austerity," राजर्षिशब्देन "by the title of royal-sage" — and the two titles,
    राजर्षि then ब्रह्मर्षि, mark the two stages.
