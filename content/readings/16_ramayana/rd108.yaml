  vyakhya: 'सुग्रीवाज्ञया वानराः आगच्छन्। वनेभ्यः गह्वरेभ्यः सरिद्भ्यः इति अपादाने पञ्चमी; सरिद्भ्यः इति सरिच्छब्दस्य स्त्रीलिङ्गे पञ्चमीबहुवचनम्। वानरी इति तस्येदम् इत्यण्, ङीप्। पिबन्ती इति शत्रन्तं स्त्रियाम्।'
  vyakhya_en: |
    Sugrīva's summons has gone out, and the monkeys come from everywhere — the
    three sources stand in the ablative of separation: वनेभ्यः "from the
    forests," गह्वरेभ्यः "from the caves," **सरिद्भ्यः** "from the rivers."
    सरित् is a feminine त्-stem; before भ्यस् its त् is voiced, सरिद्भ्यः. The
    army, singular and feminine (सेना, qualified by वानरी "of monkeys"), is
    pictured with a feminine participle — पिबन्ती इव दिवाकरम्, "as if drinking
    up the sun," so thick is their dust.
