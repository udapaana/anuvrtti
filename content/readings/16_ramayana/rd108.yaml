    ref: "Rāmāyaṇa 4.36.26 — the monkey army gathers"
    curated: "the whole verse, word-separated (pausa forms; compounds kept whole); every form is Vālmīki's. From Ambuda's GRETIL edition (ambuda-org/gretil, sa_rAmAyaNa, R_4.036.026). Sugrīva has summoned the monkeys of every land to search for Sītā, and they pour in."
  sentence: वनेभ्यः गह्वरेभ्यः च सरिद्भ्यः च महाजवाः। आगच्छत् वानरी सेना पिबन्ती इव दिवाकरम्॥
  translation: From the forests, from the caves and from the rivers the swift ones came — a monkey army, as if drinking up the sun.
  teaches: |
    three ablative plurals of "whence" — वनेभ्यः, गह्वरेभ्यः and सरिद्भ्यः
    "from the rivers," the last a feminine त्-stem, सरित् + भ्यस् with त्
    voiced to द्; a feminine present participle, पिबन्ती "drinking," in an
    इव simile.
