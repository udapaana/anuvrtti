  vyakhya: 'लक्ष्मणवचनम्। महता तपसा महता कर्मणा इति करणे तृतीया; महता इति नपुंसके महच्छब्दस्य तृतीयैकवचनम्। राज्ञा दशरथेन इति कर्तरि तृतीया, लब्धः इति कर्मणि क्तः। अमरैः अमृतम् इव इति उपमा।'
  vyakhya_en: |
    Lakṣmaṇa reminds his grieving brother what he is worth: Daśaratha won him
    **महता तपसा, महता कर्मणा** — "by great austerity, by great rites." The one
    adjective serves two neuter nouns, तपस् and कर्मन्, and so stands twice in
    its neuter instrumental, महता: the weak stem महत् with the ending आ. The
    sentence is passive — लब्धः "obtained," with the winner, राज्ञा दशरथेन, in
    the instrumental — and it closes on the oldest of comparisons: as the gods
    won the nectar from the churned ocean.
