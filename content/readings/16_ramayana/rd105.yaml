    - term: नपुंसकलिङ्ग
      en: 'neuter, agreeing with तपस्'
    - term: तृतीया
      en: 'instrumental — the weak stem महत् + आ (टा); the strong महान्त् is only for the direct cases'
    rel:
    - kind: विशेषण
