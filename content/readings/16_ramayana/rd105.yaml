- id: rd105
  kind: attested
  segment: 404
  source:
    text: रामायण
    ref: "Rāmāyaṇa 3.62.3 — how Rāma was won"
    curated: "the whole verse, word-separated (pausa forms; compounds kept whole); every form is Vālmīki's. From Ambuda's GRETIL edition (ambuda-org/gretil, sa_rAmAyaNa, R_3.062.003). Sītā is gone and Rāma is lost in grief; Lakṣmaṇa, pressing his feet, reminds him what his life cost their father."
  sentence: महता तपसा राम महता च अपि कर्मणा। राज्ञा दशरथेन आसीत् लब्धः अमृतम् इव अमरैः॥
  translation: By great austerity, O Rāma, and by great rites as well, you were won by King Daśaratha — as the immortals won the nectar.
  teaches: |
    the neuter instrumental of महत् — महता, twice: महता तपसा "by great
    austerity" (an अस्-stem neuter) and महता कर्मणा "by great rites" (an
    अन्-stem neuter); the agent of a passive participle in the instrumental,
    राज्ञा दशरथेन; and a simile with इव.
  words:
