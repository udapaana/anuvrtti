  vyakhya: 'त्रिजटावचनम्। अलम् इति शक्तौ, परित्रातुम् इति तुमुन्। महतः भयात् इति भीत्रार्थानां भयहेतुः इत्यपादाने पञ्चमी; महतः इति नपुंसके महच्छब्दस्य पञ्चम्येकवचनम्। राक्षस्यः इति सम्बोधनबहुवचनम्।'
  vyakhya_en: |
    Trijaṭā has dreamt of Laṅkā's ruin and counsels her fellow guards: bow to
    Sītā, for she forgives at a bow, and अलम् एषा परित्रातुम् — "she is able to
    save (you)." From what? **महतः भयात्**, "from great danger": with a verb of
    protecting, the danger stands in the ablative (1.4.25), and महत् follows
    the neuter भय into the ablative singular, महतः. राक्षस्यः is the address —
    the feminine ई-stem plural, said to the rākṣasīs themselves.
