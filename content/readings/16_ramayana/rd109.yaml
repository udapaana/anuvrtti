  source:
    text: रामायण
    ref: "Rāmāyaṇa 5.25.31 — Trijaṭā's counsel"
    curated: "the whole verse, word-separated (pausa forms; compounds kept whole); every form is Vālmīki's. From Ambuda's GRETIL edition (ambuda-org/gretil, sa_rAmAyaNa, R_5.025.031). Trijaṭā has dreamt of Rāvaṇa's fall, and tells the rākṣasīs guarding Sītā to beg her pardon."
  sentence: प्रणिपातप्रसन्ना हि मैथिली जनकात्मजा। अलम् एषा परित्रातुम् राक्षस्यः महतः भयात्॥
  translation: For Maithilī, Janaka's daughter, is won over by a bow at her feet; she is able, rākṣasīs, to save you from great danger.
  teaches: |
    the neuter ablative of महत् — महतः भयात् "from great danger," the ablative
    of what one is saved from; अलम् with an infinitive, "able to (save)"; and
    a feminine vocative plural in address, राक्षस्यः.
