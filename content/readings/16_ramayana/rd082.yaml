  vyakhya: 'विश्वामित्रस्य उद्गारः। धिक् इति निपातः द्वितीयायोगे — धिक् बलम् क्षत्रियबलम् इति। ब्रह्मतेजोबलम् बलम् इति प्रथमायाम् — "एतद् एव बलम्"। हतानि इति निष्ठा कर्मणि, सर्वास्त्राणि इति प्रथमान्तम्। ब्रह्मदण्डेन इति करणे। षष्ठीतत्पुरुषाः बहवः।'
  vyakhya_en: |
    Viśvāmitra's own words, in the moment of defeat. The particle **धिक्** "fie
    on" governs the accusative — धिक् बलम् क्षत्रियबलम् — while the line's second
    half answers in the nominative: ब्रह्मतेजोबलम् बलम्, "*brahmic* power is (the)
    strength." Note how each kind of strength is a षष्ठी-तत्पुरुष compound
    (क्षत्रिय-बल, ब्रह्मतेजस्-बल). The proof he cites is a **क्त participle acting
    as a passive**: एकेन ब्रह्मदण्डेन सर्वास्त्राणि हतानि — "by one brahma-staff all
    weapons (were) struck down," the agent ब्रह्मदण्डेन in the instrumental.
