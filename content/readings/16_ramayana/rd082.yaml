  source:
    text: रामायण
    ref: "Rāmāyaṇa 1.55.23 — Viśvāmitra's outcry"
    curated: "the whole verse, word-separated (pausa forms; compounds kept whole); every form is Vālmīki's. From Ambuda's GRETIL edition (ambuda-org/gretil, sa_rAmAyaNa, R_1.055.023). His army routed and his weapons consumed by Vasiṣṭha's brahma-power, Viśvāmitra, sighing, said this."
  sentence: धिक् बलम् क्षत्रियबलम् ब्रह्मतेजोबलम् बलम्। एकेन ब्रह्मदण्डेन सर्वास्त्राणि हतानि मे॥
  translation: Fie on strength — a warrior's strength! The strength of brahman-power is (real) strength. By a single brahma-staff all my weapons have been destroyed.
  teaches: |
    the particle धिक् "fie on," which casts its object into the accusative
    (धिक् बलम्); a stack of तत्पुरुष compounds naming kinds of strength; and a
    क्त participle standing as a passive — सर्वास्त्राणि हतानि "all weapons (were) destroyed."
