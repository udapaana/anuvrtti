  vyakhya: 'रामवचनं वालिनं प्रति। एभिः कारणैः इति हेतौ तृतीया; महद्भिः इति नपुंसके महच्छब्दस्य तृतीयाबहुवचनम्, कारणैः इत्यस्य विशेषणम्। यत् … तत् इति सम्बन्धः। भवान् इति प्रथमपुरुषे प्रयोगः, अतः अनुमन्यताम् इति लोटि प्रथमपुरुषः।'
  vyakhya_en: |
    Rāma rests his case before the dying Vālin. The reasons come in the
    instrumental of cause — एभिः कारणैः सर्वैः **महद्भिः** धर्मसंहितैः, "for all
    these great reasons, bound up with dharma" — and महत् follows कारण into the
    neuter instrumental plural, महद्भिः (weak stem, त् voiced to द् before
    भिस्). Then the verdict, framed with the relative pair यत् … तत् and the
    courtesy that Sanskrit builds into grammar: भवान् "your honour" takes the
    third person, so the request is अनुमन्यताम्, "let (your honour) accept."
