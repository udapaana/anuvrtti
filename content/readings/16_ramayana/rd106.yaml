  sentence: तत् एभिः कारणैः सर्वैः महद्भिः धर्मसंहितैः। शासनम् तव यत् युक्तम् तत् भवान् अनुमन्यताम्॥
  translation: So, for all these great reasons, bound up with dharma — the punishment that was fitting for you, that, sir, you should accept.
  teaches: |
    the neuter instrumental plural of महत् — महद्भिः, agreeing with कारणैः "for
    (these) reasons," an instrumental of cause; a relative pair यत् … तत्;
    and the polite imperative with भवान्, which takes a third-person verb:
    भवान् अनुमन्यताम् "may your honour accept."
