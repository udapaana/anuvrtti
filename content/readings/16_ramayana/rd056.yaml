  sentence: तपःस्वाध्यायनिरतम् तपस्वी वाग्विदाम् वरम्। नारदम् परिपप्रच्छ वाल्मीकिः मुनिपुंगवम्॥
  translation: Vālmīki the ascetic questioned Nārada — the best of the eloquent, that bull among sages, ever devoted to austerity and study.
