  vyakhya: 'विश्वामित्राख्यानस्य आरम्भः — निष्ठाशत्रोः बहुलम्। परमप्रीतः प्रणतः इति क्तान्तानि; परमप्रीतः इति कर्मधारयः, महाबलः इति बहुव्रीहिः। विनयात् इति हेतौ पञ्चमी। जपताम् इति जपेः शतरि षष्ठीबहुवचनम् (लटः शतृ…) — वरम् जपताम् इति निर्धारणे। वसिष्ठम् प्रणतः इति नमेः कर्मणि द्वितीया।'
  vyakhya_en: |
    The Viśvāmitra tale opens on manners, and on **participles**, which is how
    Sanskrit narration packs a scene. Two क्त forms describe the visitor —
    परमप्रीतः "much pleased" (a कर्मधारय) and प्रणतः "bowed" (the main predicate) —
    while महाबलः "mighty" is a बहुव्रीहि. विनयात् "out of humility" is the ablative
    of motive. The gem is जपताम् "of those who murmur (prayers)," a **शतृ present
    participle** (3.2.124) in the genitive plural — वरम् जपताम्, "the best of the
    prayerful," names Vasiṣṭha by the company he leads.
