  sentence: सः दृष्ट्वा परमप्रीतः विश्वामित्रः महाबलः। प्रणतः विनयात् वीरः वसिष्ठम् जपताम् वरम्॥
  translation: Seeing him, Viśvāmitra the mighty — greatly pleased, that hero — bowed out of humility to Vasiṣṭha, best of those who tell their prayers.
