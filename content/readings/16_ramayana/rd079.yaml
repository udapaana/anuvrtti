  vyakhya: 'कामधुक्प्रादुर्भावः। उक्ता वसिष्ठेन इति निष्ठायाम् कर्तरि तृतीया (कर्मणि क्तः)। विदधे इति वि-धाञः लिटि आत्मनेपदम्। कामधुक् इति कामान् दोग्धीति उपपदसमासः (दुहो धुक्)। यस्य यस्य इति वीप्सायाम् द्विरुक्तिः। यथेप्सितम् इति अव्ययीभावः। शत्रुसूदन इति रामसम्बोधनम्।'
  vyakhya_en: |
    The wish-cow steps in, and three familiar machines turn together. A **passive
    participle** with its doer in the instrumental — उक्ता वसिष्ठेन, "she,
    addressed by Vasiṣṭha." The **perfect** विदधे "she brought forth" (वि-धा,
    आत्मनेपद). And her very name is a compound: कामधुक् = कामान् दोग्धि, "she who
    *milks out* desires" (दुह् surfacing as धुक्). The doubled यस्य यस्य means "of
    each and every one," and यथेप्सितम् "just as wished" is an अव्ययीभाव — the cow
    gives every guest exactly his heart's wish, which is precisely what will make
    a king want to own her.
