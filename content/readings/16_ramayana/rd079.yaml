  sentence: एवम् उक्ता वसिष्ठेन शबला शत्रुसूदन। विदधे कामधुक् कामान् यस्य यस्य यथेप्सितम्॥
  translation: So addressed by Vasiṣṭha, Śabalā — O slayer of foes — the wish-milking cow, produced the desires of each and every one, just as he wished.
  teaches: |
    the wish-cow appears — a passive participle with its agent in the
    instrumental (उक्ता वसिष्ठेन "addressed by Vasiṣṭha"), the perfect विदधे "she
    produced," and the compound कामधुक् "she who milks out desires."
