  vyakhya: 'प्रतिषेधः — लृटि निश्चयः। दास्यामि इति दाञः लृटि उत्तमपुरुषैकवचनम्, न-निपातेन प्रतिषिद्धम्। शतसहस्रेण कोटिशतैः राशिभिः इति मूल्ये तृतीया। गवाम् रजतस्य इति षष्ठ्यौ। न … न अपि इति भूयःप्रतिषेधे। कोटिशतैः इति भिस ऐस् (अतो भिस ऐस्)।'
  vyakhya_en: |
    The vow of refusal takes the **future**: दास्यामि "I will give," pinned under
    न … न अपि, "not … not even" — *I will not give her.* The greatness of the
    offer he is turning down is stacked in **instrumentals of price** — शतसहस्रेण
    "for a hundred thousand," कोटिशतैः "for hundreds of crores," राशिभिः रजतस्य
    "for heaps of silver" (an exchange, in Sanskrit, is named by the तृतीया). Note
    कोटिशतैः, where the अ-stem's भिस् surfaces as ऐस् (7.1.9). No price moves the
    sage — and so the war begins.
