  sentence: न अहम् शतसहस्रेण न अपि कोटिशतैः गवाम्। राजन् दास्यामि शबलाम् राशिभिः रजतस्य वा॥
  translation: Not for a hundred thousand, O king, nor even for a hundred crore of cows, will I give up Śabalā — nor for heaps of silver.
  teaches: |
    the refusal, set in the future — दास्यामि "I will (not) give" — its force
    piled up in instrumentals of price (शतसहस्रेण, कोटिशतैः, राशिभिः), the whole
    thing framed by न … न अपि "not … not even."
