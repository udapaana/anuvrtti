  vyakhya: विद्या पुरुषस्य श्रेष्ठम् रूपम् गूढम् धनम् च; सा भोगम् यशः सुखम् च ददाति, गुरूणाम् अपि गुरुः। प्रवासे सा बन्धुः, सा परमा देवता; राजानः विद्याम् पूजयन्ति न धनम्। विद्यया रहितः नरः पशुः एव।
  vyakhya_en: |
    The subject never changes: विद्या, seven times. Its predicates do, and
    each keeps its own gender — रूपम् and धनम् neuter, गुरुः and बन्धुजनः
    masculine, देवता feminine — since a predicate noun need not agree with
    its subject. Predicate adjectives must agree, so भोगकरी and यशःसुखकरी
    take the feminine ई (ङीप्). In the last line पूज्यते is passive: the
    thing honoured, विद्या, is the nominative.
