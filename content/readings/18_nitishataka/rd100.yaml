  sentence: विद्या नाम नरस्य रूपम् अधिकम् प्रच्छन्नगुप्तम् धनम् विद्या भोगकरी यशःसुखकरी विद्या गुरूणाम् गुरुः। विद्या बन्धुजनः विदेशगमने विद्या परा देवता विद्या राजसु पूज्यते न तु धनम् विद्याविहीनः पशुः॥
  translation: Learning, they say, is a man's greater beauty, a wealth hidden and guarded; learning brings enjoyment, fame and happiness; learning is the teacher of teachers. Learning is one's kin when travelling abroad; learning is the highest deity; it is learning that kings honour, not wealth. A man without learning is a beast.
  teaches: |
    one subject, विद्या, repeated seven times with a different predicate
    noun each time — रूपम्, धनम्, गुरुः, बन्धुजनः, देवता — so the predicate
    keeps its own gender; feminine उपपद compounds in -करी; and the passive
    पूज्यते.
