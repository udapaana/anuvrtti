  sentence: आरम्भगुर्वी क्षयिणी क्रमेण लघ्वी पुरा वृद्धिमती च पश्चात्। दिनस्य पूर्वार्धपरार्धभिन्ना छाया इव मैत्री खलसज्जनानाम्॥
  translation: Long at the start and shrinking by degrees, or short at first and growing afterwards — like the shadow of the day's first half and of its second, the friendship of the wicked differs from that of the good.
  teaches: |
    feminine adjectives made three ways — गुर्वी and लघ्वी (उ-stems + ङीष्),
    क्षयिणी (इनि + ङीप्), वृद्धिमती (मतुप् + ङीप्) — all agreeing with one
    feminine noun, मैत्री, and a द्वन्द्व in the genitive plural.
