  vyakhya: खलानाम् मैत्री पूर्वाह्णस्य छाया इव आदौ दीर्घा क्रमेण क्षीणा च; सज्जनानाम् मैत्री अपराह्णस्य छाया इव आदौ लघ्वी पश्चात् वर्धमाना।
  vyakhya_en: |
    One feminine subject, मैत्री, and six feminine adjectives. The first
    pair — आरम्भगुर्वी, क्षयिणी क्रमेण — is the wicked man's friendship, long
    like a morning shadow and shrinking; the second — लघ्वी पुरा,
    वृद्धिमती पश्चात् — is the good man's, short like the noon shadow and
    lengthening. The feminines are formed three ways: ङीष् on an उ-stem
    (गुर्वी, लघ्वी), ङीप् after इनि (क्षयिणी) and after मतुप् (वृद्धिमती).
