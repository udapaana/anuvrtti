  sentence: केयूराणि न भूषयन्ति पुरुषम् हाराः न चन्द्रोज्ज्वलाः न स्नानम् न विलेपनम् न कुसुमम् न अलङ्कृताः मूर्धजाः। वाणी एका समलङ्करोति पुरुषम् या संस्कृता धार्यते क्षीयन्ते खलु भूषणानि सततम् वाग्भूषणम् भूषणम्॥
  translation: Armlets do not adorn a man, nor necklaces bright as the moon, nor bathing, nor perfumed ointment, nor flowers, nor dressed hair. Speech alone adorns a man — speech that is refined and kept so. Ornaments wear away, every one of them; the ornament of speech is the true ornament.
  teaches: |
    a string of subjects of three genders under one plural verb
    (भूषयन्ति), the relative clause या संस्कृता धार्यते with a causative
    passive, two passives side by side (धार्यते, क्षीयन्ते), and the
    pointed repetition वाग्भूषणम् भूषणम्.
