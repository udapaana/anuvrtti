  vyakhya: केयूरैः हारैः स्नानेन विलेपनेन पुष्पैः अलङ्कृतकेशैः वा पुरुषः न शोभते। संस्कृता वाणी एव तम् भूषयति, यतः अन्यानि भूषणानि नश्यन्ति, वाक् एव स्थिरम् भूषणम्।
  vyakhya_en: |
    The first line lists six things that do not adorn a man — armlets,
    moon-bright necklaces, bathing, ointment, flowers, dressed hair — all
    under one plural verb, न भूषयन्ति, with न repeated before each. The
    second answers with a singular: वाणी एका समलङ्करोति, "speech alone
    adorns," if it is refined (संस्कृता) and kept so (धार्यते, causative
    passive). Ornaments wear out (क्षीयन्ते); वाग्भूषणम् भूषणम्.
