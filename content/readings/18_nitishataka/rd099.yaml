  vyakhya: नीतिज्ञाः निन्दाम् स्तुतिम् वा कुर्वन्तु, धनम् आगच्छतु गच्छतु वा, मृत्युः अद्य वा कालान्तरे वा भवतु — धीराः न्यायमार्गात् पदम् अपि न चलन्ति।
  vyakhya_en: |
    Three pairs of imperatives, each a concession: let them blame or
    praise (निन्दन्तु, स्तुवन्तु), let Fortune come or go (समाविशतु,
    गच्छतु), let death be today or ages off (अस्तु). Against these लोट्
    forms stands one plain present, न प्रविचलन्ति: the steadfast (धीराः,
    last word) do not move a step (पदम्) from the right path (न्याय्यात्
    पथः, ablative).
