  sentence: निन्दन्तु नीतिनिपुणाः यदि वा स्तुवन्तु लक्ष्मीः समाविशतु गच्छतु वा यथेष्टम्। अद्य एव वा मरणम् अस्तु युगान्तरे वा न्याय्यात् पथः प्रविचलन्ति पदम् न धीराः॥
  translation: Let the men versed in policy blame them or let them praise; let Fortune come in, or go as she pleases; let death come this very day or in another age — the steadfast do not stray one step from the right path.
  teaches: |
    the imperative लोट् in the third person as concession — "let them
    blame, let them praise" (निन्दन्तु, स्तुवन्तु, समाविशतु, गच्छतु, अस्तु)
    — against one plain present (प्रविचलन्ति), and the ablative of पथिन्
    (पथः), "from the path."
