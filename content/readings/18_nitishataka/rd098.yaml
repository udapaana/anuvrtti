  source:
    text: नीतिशतक
    ref: "bharst_1.23 — what good company does"
    curated: "the whole verse, split into padas (sandhi undone); every form is Bhartṛhari's. GRETIL sa_bhatRhari-zatakatraya, bharst_1.23"
  sentence: जाड्यम् धियः हरति सिञ्चति वाचि सत्यम् मानोन्नतिम् दिशति पापम् अपाकरोति। चेतः प्रसादयति दिक्षु तनोति कीर्तिम् सत्सङ्गतिः कथय किम् न करोति पुंसाम्॥
  translation: It takes away the dullness of the mind, sprinkles truth on speech, grants a rise in honour, drives off wrong, makes the heart clear and spreads one's fame in every direction — tell me, what does the company of the good not do for men?
  teaches: |
    six present verbs from five गणs sharing one subject held back to the
    end (सत्सङ्गतिः), the causative प्रसादयति, the imperative कथय, and the
    irregular stems धी, वाच्, दिश्, चेतस्, पुंस् in their oblique cases.
