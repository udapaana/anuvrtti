  vyakhya: सज्जनानाम् सङ्गः बुद्धेः जडताम् नाशयति, वाण्याम् सत्यम् योजयति, मानम् वर्धयति, पापम् दूरीकरोति, मनः प्रसन्नम् करोति, यशः सर्वत्र विस्तारयति। सत्सङ्गः पुरुषाणाम् सर्वम् करोति।
  vyakhya_en: |
    Six clauses, one subject, and the subject waits: हरति, सिञ्चति,
    दिशति, अपाकरोति, प्रसादयति, तनोति all belong to सत्सङ्गतिः, which
    arrives only in the last line. The verbs come from different गणs —
    हृ (भ्वादि), सिच् and दिश् (तुदादि), कृ and तन् (तनादि), and the
    causative प्रसादयति. Then the poet turns to us: कथय, "tell me,"
    किम् न करोति — what does it not do?
