  sentence: ऐश्वर्यस्य विभूषणम् सुजनता शौर्यस्य वाक्संयमः ज्ञानस्य उपशमः श्रुतस्य विनयः वित्तस्य पात्रे व्ययः। अक्रोधः तपसः क्षमा प्रभवितुः धर्मस्य निर्व्याजता सर्वेषाम् अपि सर्वकारणम् इदम् शीलम् परम् भूषणम्॥
  translation: The ornament of power is courtesy; of valour, restraint in speech; of knowledge, calm; of learning, modesty; of wealth, spending it on the deserving; of austerity, freedom from anger; of the mighty, forbearance; of dharma, freedom from guile. But for all of them, the highest ornament is this — character, the source of them all.
  teaches: |
    a chain of genitive–nominative pairs sharing one predicate stated once
    (विभूषणम्) — "the ornament of X is Y" eight times — the abstracts
    सुजनता and निर्व्याजता in तल्, the तृच् agent noun प्रभवितृ in the
    genitive, and सर्वेषाम्, the genitive plural of the pronominal सर्व.
