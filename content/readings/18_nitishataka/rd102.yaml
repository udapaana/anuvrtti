  vyakhya: प्रभुत्वस्य शोभा सौजन्यम्, शौर्यस्य मितभाषणम्, ज्ञानस्य शान्तिः, शास्त्रज्ञानस्य विनयः, धनस्य सत्पात्रे दानम्, तपसः क्रोधाभावः, समर्थस्य क्षमा, धर्मस्य निष्कपटता। एतेषाम् सर्वेषाम् मूलम् शीलम् एव श्रेष्ठम् आभरणम्।
  vyakhya_en: |
    The verse states its predicate once — विभूषणम्, "the ornament" — and
    then runs eight genitive-nominative pairs: ऐश्वर्यस्य सुजनता, शौर्यस्य
    वाक्संयमः, and so on, each read "the ornament of X is Y." The last line
    gathers them: सर्वेषाम् अपि, "of all of them," with सर्व taking the
    pronoun's -एषाम्, the ornament is शीलम्, character, the cause of all.
