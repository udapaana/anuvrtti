  - form: महाशैलशिलासङ्घातकर्कशम्
    lemma: महाशैलशिलासङ्घातकर्कश
    gloss: hard as a mass of rock from a great mountain
    notes:
    - text: 'विग्रह: महाशैलस्य शिलानाम् सङ्घातः इव कर्कशम्'
    - term: उपमान
      en: 'the whole chain महाशैलशिलासङ्घात is the standard of hardness'
    - term: विशेषण
      en: 'second predicate of चित्तम्'
    - term: कर्तृ
      en: 'agrees with the subject चित्तम्'
    - term: प्रथमा
      en: 'nominative neuter; महत् becomes महा- as a compound’s first member'
  vyakhya: महान्तः जनाः सम्पत्तौ उत्पलम् इव मृदवः भवन्ति, विपत्तौ तु पर्वतस्य शिला इव दृढाः।
  vyakhya_en: |
    Two locatives frame the verse: सम्पत्सु, "in good times," and आपत्सु,
    "in bad" — both feminine द्-stems whose द् turns to त् before the
    ending सु. The great man's heart (चित्तम्) is lotus-soft (उत्पलकोमलम्)
    in the first and rock-hard in the second; each compound puts the thing
    compared to first and the quality last.
