  source:
    text: नीतिशतक
    ref: "bharst_1.66 — soft as a lotus, hard as rock"
    curated: "the whole verse, split into padas (sandhi undone); every form is Bhartṛhari's. GRETIL sa_bhatRhari-zatakatraya, bharst_1.66"
  sentence: सम्पत्सु महताम् चित्तम् भवति उत्पलकोमलम्। आपत्सु च महाशैलशिलासङ्घातकर्कशम्॥
  translation: In good fortune the heart of the great is soft as a lotus; in misfortune, hard as a mass of rock from a great mountain.
  teaches: |
    the locative plural of two त्-stems (सम्पत्सु, आपत्सु) setting the
    occasion, the genitive plural of the अत्-stem महत् (महताम्), and two
    comparison compounds — "lotus-soft," "rock-hard."
  words:
  - form: सम्पत्सु
    lemma: सम्पद्
    gloss: in prosperity
    vocab: true
    notes:
    - term: स्त्रीलिङ्ग
      en: feminine
    - term: अधिकरण
      en: 'the circumstance — "when fortune is good"'
    - term: सप्तमी
      en: 'locative plural — सम्पद् + सु, the द् devoiced to त् before स्'
  - form: महताम्
    lemma: महत्
    gloss: of the great
    vocab: true
    notes:
    - term: पुंलिङ्ग
      en: 'masculine — great men'
    - term: सम्बन्ध
      en: 'whose heart it is'
    - term: षष्ठी
      en: 'genitive plural — the weak stem महत्, not the strong महान्त्'
  - form: चित्तम्
    lemma: चित्त
    gloss: the mind, heart
    vocab: true
    notes:
    - term: नपुंसकलिङ्ग
      en: neuter
    - term: कर्तृ
      en: 'subject of भवति — the heart that becomes soft'
    - term: प्रथमा
      en: 'nominative singular neuter — -अम् like the accusative'
  - form: भवति
    lemma: भू
    gloss: is, becomes
    notes:
    - term: लट्
      en: 'present — a general truth: "it is (always) so"'
  - form: उत्पलकोमलम्
    lemma: उत्पलकोमल
    gloss: soft as a lotus
    notes:
    - text: 'विग्रह: उत्पलम् इव कोमलम्'
    - term: उपमान
      en: 'the standard (उत्पल) comes first: "lotus-soft"'
    - term: विशेषण
      en: 'predicate adjective of चित्तम्'
    - term: कर्तृ
      en: 'agrees with the subject चित्तम्'
    - term: प्रथमा
      en: 'nominative neuter, agreeing with चित्तम्'
  - form: आपत्सु
    lemma: आपद्
    gloss: in misfortune
    vocab: true
    notes:
    - term: स्त्रीलिङ्ग
      en: feminine
    - term: अधिकरण
      en: 'the opposite occasion, set against सम्पत्सु'
    - term: सप्तमी
      en: 'locative plural — आपद् + सु → आपत्सु, as सम्पत्सु'
  - form: च
    lemma: च
