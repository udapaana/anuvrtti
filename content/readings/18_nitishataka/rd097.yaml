  vyakhya: निर्दयत्वम्, निष्कारणम् कलहः, परस्य धने परस्य स्त्रियाम् च इच्छा, सज्जनेषु बन्धुषु च असहनम् — एतत् सर्वम् दुर्जनानाम् स्वभावतः एव सिद्धम्।
  vyakhya_en: |
    A list of five vices, each a nominative, then one neuter इदम् that
    gathers them up: "this is natural to the wicked." Two of them are
    abstracts made with the twin suffixes of 5.1.119 — अकरुणत्वम् with
    त्व (neuter), असहिष्णुता with तल् (feminine -ता). स्पृहा takes its
    objects in the locative: परधने परयोषिति च, "for another's wealth and
    wife."
