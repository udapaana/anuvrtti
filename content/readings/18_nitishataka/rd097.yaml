    curated: "the whole verse, split into padas (sandhi undone); every form is Bhartṛhari's. GRETIL sa_bhatRhari-zatakatraya, bharst_1.52"
  sentence: अकरुणत्वम् अकारणविग्रहः परधने परयोषिति च स्पृहा। सुजनबन्धुजनेषु असहिष्णुता प्रकृतिसिद्धम् इदम् हि दुरात्मनाम्॥
  translation: Pitilessness, quarrels without cause, craving for another's wealth and another's wife, impatience with good men and kinsmen — this comes to the wicked by their very nature.
  teaches: |
    the two abstract suffixes त्व and तल् (अकरुणत्वम्, असहिष्णुता) — "-ness"
    as a neuter and as a feminine — a list of subjects summed up by one
    neuter इदम्, and the locative of the object of desire (परधने … स्पृहा).
