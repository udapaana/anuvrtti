  sentence: वने रणे शत्रुजलाग्निमध्ये महार्णवे पर्वतमस्तके वा। सुप्तम् प्रमत्तम् विषमस्थितम् वा रक्षन्ति पुण्यानि पुराकृतानि॥
  translation: In the forest, in battle, amid enemies, water or fire, on the great ocean or a mountain peak — asleep, off guard, or in a tight place, a man is protected by the merit he did long before.
  teaches: |
    a run of locatives naming places of danger, three क्त participles of a
    man's state in the accusative (सुप्तम्, प्रमत्तम्, विषमस्थितम्), and a
    neuter plural subject (पुण्यानि) with a plural verb.
