  vyakhya: वने युद्धे शत्रूणाम् जलस्य अग्नेः वा मध्ये, समुद्रे पर्वतशिखरे वा सुप्तम् प्रमत्तम् सङ्कटे स्थितम् वा पुरुषम् पूर्वकृतानि पुण्यानि रक्षन्ति।
  vyakhya_en: |
    The first line is all locatives: forest, battle, the midst of enemies,
    water and fire, the ocean, a peak. The second gives the man's state in
    three accusatives — सुप्तम्, प्रमत्तम्, विषमस्थितम् — objects of
    रक्षन्ति though the man himself is never named. The subject comes last:
    पुण्यानि पुराकृतानि, merit done before.
