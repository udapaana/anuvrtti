  vyakhya: यः साहित्येन सङ्गीतेन कलाभिः च विहीनः, सः पुच्छविषाणरहितः साक्षात् पशुः एव। सः तृणम् अखादन् अपि जीवति — तत् पशूनाम् महत् भाग्यम्।
  vyakhya_en: |
    A man without the arts is a beast that happens to lack a tail and horns.
    The joke lands on the participles: he lives — जीवमानः, शानच् — without
    eating grass — न खादन्, शतृ — and that is the beasts' great luck, since
    otherwise he would eat their fodder.
