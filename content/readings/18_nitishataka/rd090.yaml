    curated: "the whole verse, split into padas (sandhi undone); every form is Bhartṛhari's. GRETIL sa_bhatRhari-zatakatraya, bharst_1.12"
  sentence: साहित्यसङ्गीतकलाविहीनः साक्षात् पशुः पुच्छविषाणहीनः। तृणम् न खादन् अपि जीवमानः तत् भागधेयम् परमम् पशूनाम्॥
  translation: A man without literature, music or the arts is a beast plain and simple, only without tail and horns; that he lives without eating grass is the great good fortune of the beasts.
  teaches: |
    long descriptive compounds (साहित्यसङ्गीतकलाविहीनः, पुच्छविषाणहीनः), two
    present participles side by side — खादन् (शतृ, परस्मैपद) and जीवमानः
    (शानच्) — and a genitive plural (पशूनाम्).
