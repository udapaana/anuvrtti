  sentence: येषाम् न विद्या न तपः न दानम् ज्ञानम् न शीलम् न गुणः न धर्मः। ते मर्त्यलोके भुवि भारभूताः मनुष्यरूपेण मृगाः चरन्ति॥
  translation: Those who have neither learning nor austerity nor generosity, neither knowledge nor good conduct nor virtue nor dharma — they wander the world of mortals as a burden on the earth, beasts in human form.
  teaches: |
    the relative–correlative pair येषाम् … ते, the genitive of possession
    with an unstated "is" (येषाम् न विद्या — "whose is no learning"),
    the स्-stem तपः, and the तृतीया of manner मनुष्यरूपेण.
