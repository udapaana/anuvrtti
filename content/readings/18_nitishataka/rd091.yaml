  vyakhya: येषाम् विद्या तपः दानम् ज्ञानम् शीलम् गुणः धर्मः च न सन्ति, ते पृथिव्याः भारभूताः मनुष्यरूपधारिणः पशवः एव।
  vyakhya_en: |
    A list of seven nominatives, each denied with न, all hung on one
    genitive: येषाम् "whose." The correlative ते picks them up, and the
    verse delivers its verdict with चरन्ति — they wander the earth as
    beasts, मनुष्यरूपेण "in human form," an instrumental of manner.
