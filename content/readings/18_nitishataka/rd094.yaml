- id: rd094
  kind: attested
  segment: 378
  source:
    text: नीतिशतक
    ref: "bharst_1.14 — better the mountains than a fool"
    curated: "the whole verse, split into padas (sandhi undone); every form is Bhartṛhari's. GRETIL sa_bhatRhari-zatakatraya, bharst_1.14"
  sentence: वरम् पर्वतदुर्गेषु भ्रान्तम् वनचरैः सह। न मूर्खजनसम्पर्कः सुरेन्द्रभवनेषु अपि॥
  translation: Better to have wandered through mountain wilds with the forest tribes — than the company of fools, even in the palaces of Indra.
  teaches: |
    वरम् … न "better … than not," the क्त participle used as a bare action
    (भ्रान्तम्, "a wandering"), सह with the instrumental (वनचरैः सह), and
    two locative plurals of place.
  words:
  - form: वरम्
    lemma: वरम्
    gloss: better
    notes:
    - term: निपात
      en: '"better (is)" — sets up the preference; न in the second line marks what is worse'
  - form: पर्वतदुर्गेषु
    lemma: पर्वतदुर्ग
    gloss: in mountain fastnesses
    notes:
    - text: 'विग्रह: पर्वतानाम् दुर्गाणि'
    - term: षष्ठी-तत्पुरुष
      en: '"the hard places of the mountains"'
    - term: नपुंसकलिङ्ग
      en: 'neuter — दुर्ग, "a hard-to-reach place," decides the gender'
    - term: अधिकरण
      en: 'where the wandering happens'
    - term: सप्तमी
      en: 'locative plural — अ-stem, -एषु'
  - form: भ्रान्तम्
    lemma: भ्रम्
    gloss: a wandering, to have wandered
    vocab: true
    notes:
    - term: क्त
      en: 'भ्रम् + क्त → भ्रान्त; the root vowel lengthens before त'
    - term: भावे
      en: 'impersonal — the neuter participle names the act itself: "(a) having-wandered"'
    - term: कर्तृ
      en: 'subject of the unstated "is better"'
    - term: प्रथमा
      en: 'nominative singular neuter'
  - form: वनचरैः
    lemma: वनचर
    gloss: forest-dwellers
    vocab: true
    notes:
    - text: 'विग्रह: वने चरन्ति इति'
    - term: उपपद-तत्पुरुष
      en: 'वन + चर (चर् + ट) — "forest-roamer," the hunting tribes'
    - term: पुंलिङ्ग
      en: masculine
    - term: सहार्थ
      en: 'the company — "with the forest tribes"'
    - term: तृतीया
      en: 'instrumental plural, required by सह'
  - form: सह
    lemma: सह
    gloss: with
    notes:
    - term: अव्यय
      en: '"together with" — governs the instrumental वनचरैः'
  - form: न
    lemma: न
    gloss: not
    notes:
    - term: negation
      en: 'after वरम्: "better X, not Y" — the rejected alternative'
  - form: मूर्खजनसम्पर्कः
    lemma: मूर्खजनसम्पर्क
    gloss: contact with foolish people
    notes:
    - text: 'विग्रह: मूर्खाः जनाः — मूर्खजनाः; तैः सम्पर्कः'
    - term: तृतीया-तत्पुरुष
      en: '"association with fools" — the instrumental of company inside the compound'
    - term: पुंलिङ्ग
      en: masculine
    - term: कर्तृ
      en: 'subject of the rejected alternative'
    - term: प्रथमा
      en: 'nominative singular — "(not) the company of fools"'
  - form: सुरेन्द्रभवनेषु
    lemma: सुरेन्द्रभवन
    gloss: in the palaces of Indra
    notes:
    - text: 'विग्रह: सुराणाम् इन्द्रः सुरेन्द्रः; तस्य भवनानि'
    - term: षष्ठी-तत्पुरुष
      en: '"the dwellings of the lord of the gods"'
    - term: नपुंसकलिङ्ग
      en: neuter
    - term: अधिकरण
      en: 'where even a fool''s company is not worth having'
    - term: सप्तमी
      en: 'locative plural, the counterpart of पर्वतदुर्गेषु'
  - form: अपि
    lemma: अपि
    gloss: even
    notes:
    - term: निपात
      en: '"even" — not even in heaven'
  vyakhya: मूर्खैः सह स्वर्गे वासः अपि न वरम्; वने वनचरैः सह भ्रमणम् ततः श्रेयः।
  vyakhya_en: |
    वरम् … न is the Sanskrit "better A than B." A is भ्रान्तम् — a क्त
    participle in the neuter, standing for the act ("to have wandered"),
    in the mountains (पर्वतदुर्गेषु) with the forest tribes (वनचरैः सह,
    instrumental with सह). B is मूर्खजनसम्पर्कः, "company with fools,"
    rejected even in Indra's palaces — two locative plurals, wild and divine.
