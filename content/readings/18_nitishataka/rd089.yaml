  vyakhya: अज्ञः सुखेन आराध्यः, विशेषज्ञः ततः अपि सुखेन। यः तु ज्ञानस्य लवेन एव गर्वितः, तम् ब्रह्मा अपि न प्रसादयति।
  vyakhya_en: |
    Three listeners. The ignorant man is easy to win — आराध्यः, the ण्यत्
    gerundive, "to-be-won." The expert is easier still — आराध्यते, a plain
    passive, with सुखतरम् carrying the comparative तरप्. But the half-learned
    man, ज्ञानलवदुर्विदग्धम् (one compound, "spoiled by a scrap of learning"),
    defeats even Brahmā: न रञ्जयति, the causative "does not make pleased."
