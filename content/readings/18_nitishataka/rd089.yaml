  sentence: अज्ञः सुखम् आराध्यः सुखतरम् आराध्यते विशेषज्ञः। ज्ञानलवदुर्विदग्धम् ब्रह्मा अपि तम् नरम् न रञ्जयति॥
  translation: An ignorant man is easily won over; a discerning man is won over more easily still; but the man puffed up with a scrap of knowledge — not even Brahmā can please him.
  teaches: |
    ण्यत् "to be won over" (आराध्यः) beside the passive आराध्यते, the
    comparative तरप् on an adverb (सुखतरम्), and the causative रञ्जयति —
    in one verse that ranks three kinds of listener.
