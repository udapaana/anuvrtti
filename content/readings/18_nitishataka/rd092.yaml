  sentence: दानम् भोगः नाशः तिस्रः गतयः भवन्ति वित्तस्य। यः न ददाति न भुङ्क्ते तस्य तृतीया गतिः भवति॥
  translation: Giving, enjoying, losing — wealth has three ways to go. Whoever neither gives nor enjoys, his takes the third.
