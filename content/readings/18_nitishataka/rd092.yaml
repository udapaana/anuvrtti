  vyakhya: वित्तस्य त्रयः मार्गाः — दानम् भोगः नाशः च। यः धनम् न ददाति न च उपभुङ्क्ते, तस्य धनम् नाशम् एव गच्छति।
  vyakhya_en: |
    Wealth goes one of three ways — दानम्, भोगः, नाशः, a list in apposition
    to तिस्रः गतयः. तिस्रः is the feminine of त्रि, agreeing with गतयः. The
    second line is a relative clause (यः … तस्य): the miser who neither gives
    (ददाति) nor enjoys (भुङ्क्ते, आत्मनेपद) — his wealth takes the third,
    तृतीया गतिः: loss.
