  sentence: ग्रामे बहवः बालाः सन्ति। रामः पटुः, कृष्णः तु रामात् पटुतरः। सर्वेषु बालेषु कृष्णः एव पटुतमः। सः धनवान् अपि, किन्तु गर्वम् न करोति।
  translation: In the village are many boys. Rāma is clever, but Kṛṣṇa is cleverer than Rāma. Among all the boys it is Kṛṣṇa who is the cleverest. He is wealthy too, but he is not proud.
  teaches: |
    the three degree-and-quality तद्धितs together: रामात् पटुतरः (तरप्, with पञ्चमी),
    सर्वेषु बालेषु पटुतमः (तमप्, निर्धारण-सप्तमी), and धनवान् (मतुप्).
