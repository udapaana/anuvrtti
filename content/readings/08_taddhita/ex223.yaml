  sentence: ग्रामे बहवः बालाः सन्ति। रामः पटुः, कृष्णः तु रामात् पटुतरः। सर्वेषु बालेषु दामोदरः पटुतमः। सः धनवान् अपि, किन्तु धनस्य गुरुत्वम् न मन्यते।
  translation: In the village are many boys. Rāma is clever, but Kṛṣṇa is cleverer than Rāma. Among all the boys Dāmodara is the cleverest. He is wealthy too, yet does not regard the weight of wealth.
  teaches: |
    the four degree-and-quality तद्धितs together: रामात् पटुतरः (तरप्, with पञ्चमी),
    सर्वेषु बालेषु पटुतमः (तमप्, निर्धारण-सप्तमी), धनवान् (मतुप्), and गुरुत्वम् (त्व).
