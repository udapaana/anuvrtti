- id: ex084
  segment: 200
  sentence: गुरोः भावः गुरुत्वम्।
  translation: The state of being heavy/a-teacher is "gurutva" (heaviness / gravity).
  teaches: 'त्व/तल् — the abstract noun ("-ness, the state of")'
  words:
  - form: गुरोः
    gloss: of the heavy one / of the teacher
    notes:
    - term: षष्ठी
      en: genitive — the base whose "-ness" is named (उ-stem गुरु → गुरोः)
    - cite: '2.3.50'
      role: षष्ठी शेषे → गुरोः
  - form: भावः
    gloss: state, being, abstract quality
    notes:
    - term: अर्थ
      en: the sense — "the state/quality of being ___"
  - form: गुरुत्वम्
    lemma: गुरुत्व
    gloss: heaviness, gravity; the state of being a guru
    notes:
    - term: तद्धित
      en: abstract derivative
    - cite: '5.1.119'
      role: तस्य भावस्त्वतलौ → त्व (and तल् → ता) for "the state of ___" → गुरु + त्व → गुरुत्वम्
    - term: प्रथमा
      en: nominative
    - term: नपुंसक
      en: neuter (-त्व abstracts are neuter)
  vyakhya: तस्य भावः इति त्व-तलौ। गुरुत्वम् (नपुंसकम्), गुरुता (स्त्री)। भाववाचकम्।
  vyakhya_en: |
    The abstract: "the state of being X" — त्व and तल् (5.1.119). गुरु → गुरुत्वम् "heaviness/gurutva" (neuter, with -त्व) or गुरुता "guru-hood" (feminine, with -ता). देव → देवत्वम्/देवता. This is Sanskrit's "-ness / -hood": take any noun or adjective, add त्व or ता, and you have named its quality as a thing. Patronymic, place-adjective, possessive, comparative, abstract — the तद्धित system's productive core.
