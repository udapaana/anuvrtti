- id: ex229
  segment: 235
  sentence: बलवान् वीरः शत्रून् जयति। सः सर्वेभ्यः शूरतरः। तस्य जयः सर्वत्र गीयते।
  translation: The strong hero conquers his enemies. He is braver than all. His victory is sung everywhere.
  teaches: |
    the same three, closed on a hero — बलवान् (मतुप्), शूरतरः (तरप्, सर्वेभ्यः the
    पञ्चमी standard), and जयः गीयते, "is sung," the passive.
  words:
  - form: बलवान्
    lemma: बलवत्
    gloss: strong
    notes:
    - term: तद्धित
      en: possessive derivative
    - term: मतुप्
      en: the मतुप् possessive suffix — "having strength" (shows as -वत्)
    - cite: '5.2.94'
      role: तदस्यास्त्यस्मिन्निति मतुप् — बल + मतुप् → बलवत् → बलवान्
    - term: विशेषण
      en: qualifying वीरः
    - term: प्रथमा
      en: nominative
    rel:
    - kind: विशेषण
      to: 1
  - form: वीरः
    lemma: वीर
    gloss: the hero
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: शत्रून्
    lemma: शत्रु
    gloss: enemies
    notes:
    - term: कर्मन्
      en: object
    - term: द्वितीया
      en: accusative plural
  - form: जयति
    lemma: जि
    gloss: conquers
    notes:
    - term: लट्
      en: present
  - form: सः
    lemma: तद्
    gloss: he
    notes:
    - term: सर्वनाम
      en: pronoun
    - term: प्रथमा
      en: nominative
  - form: सर्वेभ्यः
    lemma: सर्व
    gloss: than all
    notes:
    - term: सर्वादि
      en: pronominal adjective सर्व — takes सर्वेभ्यः
    - term: अपादान
      en: the standard of comparison → पञ्चमी
    - cite: '2.3.42'
      role: पञ्चमी विभक्ते — the term compared-from takes पञ्चमी → सर्वेभ्यः
    - term: पञ्चमी
      en: ablative plural
  - form: शूरतरः
    lemma: शूरतर
    gloss: braver
    notes:
    - term: तद्धित
      en: comparative derivative
    - term: तरप्
      en: the तरप् comparative suffix — "braver" of two
    - term: अतिशायन
      en: degree of comparison — the comparative sense
    - cite: '5.3.57'
      role: द्विवचनविभज्योपपदे तरबीयसुनौ — तरप् for comparison → शूर + तर → शूरतरः
    - term: विशेषण
      en: predicated of सः
    - term: प्रथमा
      en: nominative
    rel:
    - kind: विशेषण
      to: 4
  - form: तस्य
    lemma: तद्
    gloss: his
    notes:
    - term: सर्वनाम
      en: pronoun
    - term: सम्बन्ध
      en: possession
    - term: षष्ठी
      en: genitive
  - form: जयः
    lemma: जय
    gloss: victory
    notes:
    - term: कर्मन्
      en: what is sung — subject of the passive
    - term: प्रथमा
      en: nominative
  - form: सर्वत्र
    lemma: सर्वत्र
    gloss: everywhere
    notes:
    - term: अव्यय
      en: adverb of place (सर्व + त्रल्)
  - form: गीयते
    lemma: गै
    gloss: is sung
    notes:
    - term: लट्
      en: present
    - term: कर्मणि
      en: passive — जयः is sung; no expressed agent
    - cite: '3.4.69'
      role: लः कर्मणि च — the ल-affix (लट्) denotes the कर्मन् → passive गीयते
  vyakhya: बलवान् वीरः सर्वेभ्यः शूरतरः; तस्य जयः सर्वत्र गीयते।
  vyakhya_en: |
    The trio closes on a hero. बलवान् is again the possessive मतुप् (5.2.94).
    शूरतरः is the comparative तरप् (5.3.57), and those he surpasses, सर्वेभ्यः,
    stand in the पञ्चमी of comparison. And his victory गीयते, "is sung" — the
    passive of गै (3.4.69), जयः the thing sung.
