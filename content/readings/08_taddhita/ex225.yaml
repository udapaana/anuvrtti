- id: ex225
  segment: 215
  sentence: बुद्धिमान् नरः बलवतः श्रेष्ठतरः। जनाः ततः बुद्धेः गुरुत्वम् जानन्ति।
  translation: A wise man is better than a strong one. From that, people know the weight of intelligence.
  teaches: |
    the तद्धितs in a maxim: बुद्धिमान् and बलवतः (मतुप्), बलवतः श्रेष्ठतरः (तरप्,
    with पञ्चमी), ततः (तसिल्), गुरुत्वम् (त्व).
  words:
  - form: बुद्धिमान्
    lemma: बुद्धिमत्
    gloss: wise, having intelligence
    notes:
    - term: तद्धित
      en: possessive derivative
    - term: मतुप्
      en: the मतुप् possessive suffix — "having intelligence" (shows as -मत्)
    - cite: '5.2.94'
      role: तदस्यास्त्यस्मिन्निति मतुप् — "it is his / in him" → बुद्धि + मतुप् → बुद्धिमत् → बुद्धिमान्
    - term: विशेषण
      en: qualifying नरः
    - term: प्रथमा
      en: nominative
    rel:
    - kind: विशेषण
      to: 1
  - form: नरः
    lemma: नर
    gloss: a man
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: बलवतः
    lemma: बलवत्
    gloss: than the strong one
    notes:
    - term: तद्धित
      en: possessive derivative — बल + मतुप् → बलवत् ("having strength")
    - cite: '5.2.94'
      role: तदस्यास्त्यस्मिन्निति मतुप् — बल + मतुप् → बलवत् ("strong")
    - term: अपादान
      en: the standard of comparison → पञ्चमी
    - cite: '2.3.42'
      role: पञ्चमी विभक्ते — the term compared-from takes पञ्चमी → बलवतः
    - term: पञ्चमी
      en: ablative
  - form: श्रेष्ठतरः
    lemma: श्रेष्ठतर
    gloss: better
    notes:
    - term: तद्धित
      en: comparative derivative
    - term: तरप्
      en: the तरप् comparative suffix — "more" of two
    - term: अतिशायन
      en: degree of comparison — the comparative sense
    - cite: '5.3.57'
      role: द्विवचनविभज्योपपदे तरबीयसुनौ — तरप्/ईयसुन् for comparison of two → श्रेष्ठ + तर → श्रेष्ठतरः
    - term: विशेषण
      en: predicated of नरः
    - term: प्रथमा
      en: nominative
    rel:
    - kind: विशेषण
      to: 1
  - form: जनाः
    lemma: जन
    gloss: people
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative plural
  - form: ततः
    lemma: तद्
    gloss: from that, therefore
    notes:
    - term: अपादान
      en: source — "from that" (the ablative sense)
    - cite: '5.3.7'
      role: पञ्चम्यास्तसिल् — in the पञ्चमी (ablative) sense, the affix तसिल् → -तस् → ततः
    - term: तद्धित
      en: an indeclinable तद्धित — तद् + तस् = ततः
    - term: अव्यय
      en: indeclinable (it does not take सुप् endings)
  - form: बुद्धेः
    lemma: बुद्धि
    gloss: of intelligence
    notes:
    - term: सम्बन्ध
      en: possession
    - term: षष्ठी
      en: genitive (इ-stem बुद्धि → बुद्धेः)
  - form: गुरुत्वम्
    lemma: गुरुत्व
    gloss: the weight, importance
    notes:
    - term: तद्धित
      en: abstract derivative
    - term: त्व
      en: the त्व abstract suffix — "the state/weight of"
    - term: अर्थ
      en: भाव — the state or quality named as a thing
    - cite: '5.1.119'
      role: तस्य भावस्त्वतलौ — त्व (and तल् → ता) for "the state of" → गुरु + त्व → गुरुत्वम्
    - term: कर्मन्
      en: object of जानन्ति
    - term: द्वितीया
      en: accusative (neuter)
  - form: जानन्ति
    lemma: ज्ञा
    gloss: know
    notes:
    - term: लट्
      en: present
  vyakhya: तद्धिताः सुभाषिते — मतुप्, तरप्, तसिल्, त्व — बुद्धेः प्रशंसा।
  vyakhya_en: |
    A maxim carries the same तद्धितs the intros gave singly. बुद्धिमान् and बलवत्
    are the possessive मतुप् (5.2.94), "having intelligence," "having strength." The
    stronger is surpassed: बलवतः श्रेष्ठतरः is the comparative तरप् (5.3.57) with the
    surpassed term in पञ्चमी. ततः is the तसिल् ablative adverb (5.3.7), "from that,"
    and गुरुत्वम् the abstract त्व (5.1.119) — the weight of a quality named as a
    thing.
