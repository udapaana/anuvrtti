- id: ex082
  segment: 200
  sentence: धनम् अस्य अस्ति इति धनवान्।
  translation: He who has wealth is "wealthy" (dhanavān).
  teaches: 'मतुप् — the possessive "having ___"'
  words:
  - form: धनम्
    gloss: wealth
    notes:
    - term: प्रथमा
      en: the base — the thing possessed
  - form: अस्य
    lemma: इदम्
    gloss: his, of this
    notes:
    - term: सर्वनाम
      en: pronoun
    - term: षष्ठी
      en: genitive (इदम्/अयम्)
  - form: अस्ति
    gloss: there is, exists
    notes:
    - term: अस्
      en: '"be" — the विग्रह "X is his / in him"'
  - form: इति
    lemma: इति
    gloss: thus ("…")
    notes:
    - term: अव्यय
      en: quotative — closes a name/quote
  - form: धनवान्
    lemma: धनवत्
    gloss: wealthy, possessing wealth
    notes:
    - term: तद्धित
      en: possessive derivative
    - cite: '5.2.94'
      role: तदस्यास्त्यस्मिन्निति मतुप् → मतुप् "it is his / in him" → धन + मतुप् → धनवत् → धनवान्
    - cite: '7.1.70'
      role: उगिदचां सर्वनामस्थाने → the मतुप् (वत्) stem inserts नुम् before strong endings → धनवान्
    - term: प्रथमा
      en: nominative
  vyakhya: तत् अस्य अस्ति इति मतुप् — मत्वर्थः। धन + मतुप् → धनवान् (बुद्धिमान् वत्)।
  vyakhya_en: |
    The possessive: "having X / in whom X is" — मतुप् (5.2.94). धन + मतुप् → धनवान् "wealthy," बुद्धि + मतुप् → बुद्धिमान् "wise" (the affix shows as -वत्/-मत्, declining राजन्-style with नुम्). You met गुणवान् and वीरवत्तमं in real text; this is the rule behind them — the workhorse that turns any noun into "the one who has it."
