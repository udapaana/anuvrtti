- id: ex135
  segment: 200
  sentence: ग्रामतः आगच्छति।
  translation: He comes from the village.
  teaches: 'पञ्चम्यास्तसिल् — the adverb-affix तसिल् (-तस्) in the ablative sense ("from ___")'
  words:
  - form: ग्रामतः
    lemma: ग्राम
    gloss: from the village
    notes:
    - term: अपादान
      en: source — "from ___" (the ablative sense)
    - cite: '5.3.7'
      role: पञ्चम्यास्तसिल् → in the पञ्चमी (ablative) sense, the affix तसिल् → -तस्
    - term: तद्धित
      en: an indeclinable तद्धित — ग्राम + तस् = ग्रामतः ("from the village")
    - term: अव्यय
      en: indeclinable (it does not take सुप् endings)
  - form: आगच्छति
    lemma: गम्
    gloss: comes
    notes:
    - term: गम्
      en: '"come" (आ + गम्)'
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  vyakhya: पञ्चम्यर्थे तसिल्; ग्राम + तस् = ग्रामतः अव्ययम्। ग्रामात् = ग्रामतः।
  vyakhya_en: |
    Instead of the case-ending पञ्चमी (ग्रामात्), the same ablative sense can be carried by a तद्धित adverb: पञ्चम्यास्तसिल् (5.3.7) adds -तस् → ग्रामतः "from the village," an indeclinable. So ग्रामात् आगच्छति and ग्रामतः आगच्छति say the same thing — the second with an अव्यय taddhita. This affix gives ततः, यतः, सर्वतः, and the like.
