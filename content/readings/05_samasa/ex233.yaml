  sentence: नीलोत्पलम् जले तिष्ठति। ग्रामगतः बालः तत् पश्यति। असत्यम् न वदति, गोहितम् च करोति।
  translation: A blue lotus stands in the water. A boy who has gone to the village sees it. He speaks no untruth, and does what is good for cattle.
  teaches: |
    four तत्पुरुष/कर्मधारय subtypes, each named by its विग्रह — नीलोत्पलम् (कर्मधारय),
    ग्रामगतः (द्वितीया-), असत्यम् (नञ्-), गोहितम् (चतुर्थी-तत्पुरुष).
