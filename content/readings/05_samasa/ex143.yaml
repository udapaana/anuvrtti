- id: ex143
  segment: 130
  sentence: कृष्णश्रितः बालः।
  translation: The boy gone-to-Kṛṣṇa (who has taken refuge with Kṛṣṇa).
  teaches: 'द्वितीया-तत्पुरुष — the विग्रह uses the accusative (कृष्णं श्रितः); named by that case'
  words:
  - form: कृष्णश्रितः
    lemma: कृष्णश्रित
    gloss: gone to / having resorted to Kṛṣṇa
    notes:
    - text: 'विग्रह: कृष्णं श्रितः — "resorted-to Kṛष्ण"; the first member is logically accusative'
    - term: तत्पुरुष
      en: case-तत्पुरुष; the later member (श्रित) heads
    - cite: '2.1.24'
      role: द्वितीया श्रितातीतपतित… — a 2nd-case word compounds with श्रित etc. → द्वितीया-तत्पुरुष
    - term: समास
      en: compound
    - term: प्रथमा
      en: nominative (the whole, qualifying बालः)
  - form: बालः
    lemma: बाल
    gloss: the boy
    notes:
    - term: विशेष्य
      en: the noun the compound qualifies
    - term: प्रथमा
      en: nominative
  vyakhya: द्वितीयान्तं श्रितादिभिः समस्यते। कृष्णं श्रितः = कृष्णश्रितः।
  vyakhya_en: |
    तत्पुरुष compounds are NAMED by the case the analysis (विग्रह) would use. Here the विग्रह is कृष्णं श्रितः — "resorted-to Kṛṣṇa," with कृष्ण in the द्वितीया (accusative) — so the compound is a द्वितीया-तत्पुरुष (2.1.24). The later member श्रित heads it, as in every तत्पुरुष; only the internal case-relation differs. This is the template: each case gives a named sub-type.
