- id: ex224
  segment: 195
  sentence: महाबलः नृपः प्रतिदिनम् देवगृहम् अगच्छत्। तत्र सः देवम् अपश्यत्, नमः च अकरोत्।
  translation: The mighty king went to the temple every day. There he saw the god, and made obeisance.
  teaches: |
    three compound types in one errand — महाबलः (बहुव्रीहि), प्रतिदिनम्
    (अव्ययीभाव), देवगृहम् (तत्पुरुष).
  words:
  - form: महाबलः
    lemma: महाबल
    gloss: the mighty one
    notes:
    - term: बहुव्रीहि
      en: possessive — neither member is the head; the one whose strength is great
    - text: 'विग्रह: महत् बलं यस्य सः — "he whose strength is great"'
    - cite: '2.2.23'
      role: शेषो बहुव्रीहिः — the remaining kind of compound is बहुव्रीहि
    - cite: '2.2.24'
      role: अनेकमन्यपदार्थे — several words denoting ANOTHER thing (the possessor) form a बहुव्रीहि
    - term: विशेषण
      en: qualifying नृपः
    - term: प्रथमा
      en: nominative
    rel:
    - kind: विशेषण
      to: 1
  - form: नृपः
    lemma: नृप
    gloss: the king
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: प्रतिदिनम्
    lemma: प्रतिदिन
    gloss: every day
    notes:
    - term: अव्ययीभाव
      en: adverbial — प्रति heads it (distributive), and the whole is indeclinable
    - text: 'विग्रह: दिनं दिनं प्रति — "day by day"'
    - cite: '2.1.5'
      role: अव्ययीभावः — a compound headed by an indeclinable is अव्ययीभाव
  - form: देवगृहम्
    lemma: देवगृह
    gloss: the temple (the god's house)
    notes:
    - term: तत्पुरुष
      en: determinative — गृहम्, the second member, is the head; देवस्य गृहम्
    - text: 'विग्रह: देवस्य गृहम् — "the house of the god"'
    - cite: '2.1.22'
      role: तत्पुरुषः — a compound whose second member carries the main sense is तत्पुरुष
    - cite: '2.2.8'
      role: षष्ठी — a षष्ठी-relation (देवस्य) compounded → षष्ठी-तत्पुरुष
    - term: कर्मन्
      en: goal of motion
    - term: द्वितीया
      en: accusative
  - form: अगच्छत्
    lemma: गम्
    gloss: went
    notes:
    - term: लङ्
      en: past
  - form: तत्र
    lemma: तत्र
    gloss: there
    notes:
    - term: अव्यय
      en: adverb of place
  - form: सः
    lemma: तद्
    gloss: he
    notes:
    - term: सर्वनाम
      en: pronoun
    - term: प्रथमा
      en: nominative
  - form: देवम्
    lemma: देव
    gloss: the god
    notes:
    - term: कर्मन्
      en: the one seen
    - term: द्वितीया
      en: accusative
  - form: अपश्यत्
    lemma: दृश्
    gloss: saw
    notes:
    - term: लङ्
      en: past
  - form: नमः
    lemma: नमस्
    gloss: obeisance
    notes:
    - term: कर्मन्
      en: the thing made — नमः + कृ, "to make obeisance"
    - term: द्वितीया
      en: accusative (neuter)
  - form: च
    lemma: च
    gloss: and
    notes:
    - term: निपात
      en: enclitic particle
  - form: अकरोत्
    lemma: कृ
    gloss: made
    notes:
    - term: लङ्
      en: past
  vyakhya: त्रयः समासाः एकस्मिन् वाक्ये — महाबलः, प्रतिदिनम्, देवगृहम्।
  vyakhya_en: |
    One short errand carries three of the compound types. महाबलः is a बहुव्रीहि,
    the one whose strength is great — the king, not the strength. प्रतिदिनम् is an
    अव्ययीभाव, प्रति heading it in the distributive "day by day" and the whole
    going indeclinable. And देवगृहम् is a तत्पुरुष — देवस्य गृहम्, the god's house,
    the temple — its second member the head.
