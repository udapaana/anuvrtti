- id: ex145
  segment: 130
  sentence: राजपुरुषः आगच्छति।
  translation: The king's man comes.
  teaches: 'षष्ठी-तत्पुरुष — the commonest तत्पुरुष; the विग्रह uses the genitive (राज्ञः पुरुषः)'
  words:
  - form: राजपुरुषः
    lemma: राजपुरुष
    gloss: the king's man, royal servant
    notes:
    - text: 'विग्रह: राज्ञः पुरुषः — "the king''s man"; first member is logically genitive'
    - term: तत्पुरुष
      en: षष्ठी-तत्पुरुष — the default, commonest case-तत्पुरुष
    - cite: '2.2.8'
      role: षष्ठी → a 6th-case word compounds with what it relates to → षष्ठी-तत्पुरुष
    - term: समास
      en: compound
    - term: प्रथमा
      en: nominative
  - form: आगच्छति
    lemma: गम्
    gloss: comes
    notes:
    - term: गम्
      en: '"come" (आ + गम्)'
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  vyakhya: षष्ठ्यन्तं सुबन्तेन समस्यते। राज्ञः पुरुषः = राजपुरुषः।
  vyakhya_en: |
    The षष्ठी-तत्पुरुष is the workhorse compound: राज्ञः पुरुषः "the king's man" → राजपुरुषः (2.2.8). Whenever the relation between two nouns is the plain "of / 's" (the genitive, षष्ठी शेषे), it can compound this way — देवदत्तस्य गृहम् → देवदत्तगृहम्, and so on. It is the तत्पुरुष you meet most.
