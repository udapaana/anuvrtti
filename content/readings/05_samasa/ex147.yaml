- id: ex147
  segment: 130
  sentence: अब्राह्मणः अयम्।
  translation: This one is a non-brahmin.
  teaches: 'नञ्-तत्पुरुष — negation by नञ् (न → अ before a consonant); "non-X"'
  words:
  - form: अब्राह्मणः
    lemma: अब्राह्मण
    gloss: a non-brahmin
    notes:
    - text: 'विग्रह: न ब्राह्मणः — "not a brahmin"; नञ् (न) prefixes, surfacing as अ before a consonant'
    - term: तत्पुरुष
      en: नञ्-तत्पुरुष — negation compound
    - cite: '2.2.6'
      role: नञ् → the negative नञ् compounds with the following word → नञ्-तत्पुरुष
    - term: समास
      en: compound
    - term: प्रथमा
      en: nominative
  - form: अयम्
    lemma: इदम्
    gloss: this one
    notes:
    - term: सर्वनाम
      en: pronoun इदम्, nom.sg masculine
    - term: प्रथमा
      en: nominative
  vyakhya: नञः समासे न-कारस्य अ-आदेशः (हलि)। न ब्राह्मणः = अब्राह्मणः।
  vyakhya_en: |
    The नञ्-तत्पुरुष negates: न ब्राह्मणः "not a brahmin" → अब्राह्मणः (2.2.6). The particle नञ् surfaces as अ- before a consonant (and as अन्- before a vowel — अनश्वः "non-horse"). This is the productive "non-/un-/a-" prefix of Sanskrit: अधर्मः, अहिंसा, असत्य — every one a नञ्-तत्पुरुष.
