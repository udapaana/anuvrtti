- id: ex146
  segment: 130
  sentence: अक्षशौण्डः नरः।
  translation: A man skilled at dice.
  teaches: 'सप्तमी-तत्पुरुष — the विग्रह uses the locative (अक्षेषु शौण्डः, "expert AT dice")'
  words:
  - form: अक्षशौण्डः
    lemma: अक्षशौण्ड
    gloss: skilled at dice, a dice-expert
    notes:
    - text: 'विग्रह: अक्षेषु शौण्डः — "expert at dice"; first member is logically locative'
    - term: तत्पुरुष
      en: सप्तमी-तत्पुरुष; the later member (शौण्ड) heads
    - cite: '2.1.40'
      role: सप्तमी शौण्डैः — a 7th-case word compounds with शौण्ड etc. → सप्तमी-तत्पुरुष
    - term: समास
      en: compound
    - term: प्रथमा
      en: nominative
  - form: नरः
    lemma: नर
    gloss: the man
    notes:
    - term: विशेष्य
      en: the noun qualified
    - term: प्रथमा
      en: nominative
  vyakhya: सप्तम्यन्तं शौण्डादिभिः समस्यते। अक्षेषु शौण्डः = अक्षशौण्डः।
  vyakhya_en: |
    The locative तत्पुरुष: अक्षेषु शौण्डः, "expert AT dice," → अक्षशौण्डः (2.1.40). The विग्रह's सप्तमी (the locus of the skill) names it. With ex143–146 you now have the four case-तत्पुरुषes — द्वितीया, चतुर्थी, षष्ठी, सप्तमी — each the same heads-later compound, distinguished only by which case the analysis restores.
