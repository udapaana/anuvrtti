  order: 1
  sentence: पीताम्बरः गुरुः शिष्यैः सह उपवनम् अगच्छत्। ते सर्वे धर्मशास्त्राणि अपठन्। तेषु रामकृष्णौ पटुतमौ आस्ताम्। ज्येष्ठः बालः गुरुम् अपृच्छत् — कः धर्मः इति।
  translation: The yellow-robed teacher went with his pupils to the forest's edge. They all read the treatises on dharma. Among them Rāma and Kṛṣṇa were the cleverest. The eldest boy asked the teacher — "What is dharma?"
  teaches: |
    the compounds again, and the superlative beside them: पीताम्बरः (बहुव्रीहि),
    उपवनम् (अव्ययीभाव), धर्मशास्त्राणि (तत्पुरुष), रामकृष्णौ (द्वन्द्व), and the
    तमप्/इष्ठन् pair पटुतमौ, ज्येष्ठः.
