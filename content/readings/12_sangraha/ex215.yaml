  sentence: राजपुरुषः उपकृष्णम् आसीत्। तत्र रामकृष्णौ अपि आगच्छताम्। राजपुरुषः तौ अपश्यत् — रामः श्यामः, कृष्णः पीताम्बरः। सः पीताम्बरं ननाम, यतः पीताम्बरः एव विष्णुः।
  translation: The king's man was near Kṛṣṇa. There Rāma-and-Kṛṣṇa also arrived. The king's man saw the two of them — Rāma dark, Kṛṣṇa yellow-clad. He bowed to the yellow-clad one, because the yellow-clad one is Viṣṇu himself.
  teaches: |
    all four compound types back to back, doing no new work: राजपुरुषः
    (तत्पुरुष), उपकृष्णम् (अव्ययीभाव), रामकृष्णौ (द्वन्द्व), पीताम्बरः
    (बहुव्रीहि).
