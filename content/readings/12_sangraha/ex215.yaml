  sentence: राजपुरुषः मार्गे आसीत्। तत्र रामकृष्णौ आगच्छताम्। राजपुरुषः तौ अपश्यत् — रामः गौरः, कृष्णः पीताम्बरः। सः उपकृष्णम् आगत्य पीताम्बरम् ननाम, यतः पीताम्बरः एव विष्णुः।
  translation: The king's man was on the road. There Rāma-and-Kṛṣṇa arrived. The king's man saw the two of them — Rāma fair, Kṛṣṇa yellow-clad. Coming up close to Kṛṣṇa, he bowed to the yellow-clad one, because the yellow-clad one is Viṣṇu himself.
  teaches: |
    all four compound types back to back, doing no new work: राजपुरुषः
    (तत्पुरुष), उपकृष्णम् (अव्ययीभाव), रामकृष्णौ (द्वन्द्व), पीताम्बरः
    (बहुव्रीहि).
