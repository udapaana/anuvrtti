- id: ex181
  kind: sangraha
  segment: 55
  order: 1
  sentence: बालः मात्रे क्रुध्यति, यतः सा तम् वनम् न नयति। सः एकः गच्छति, वने च वृकात् बिभेति। सः वृकात् धावति, गिरिम् च आरोहति। मुनिः तम् गिरिम् अधिशेते। बालः मुनये श्लाघते, मुनेः फलेभ्यः च स्पृहयति। मुनिः बालाय फलानि यच्छति। बालाय फलानि रोचन्ते। सः गृहम् आगच्छति, मात्रे च फलानि यच्छति।
  translation: The boy is angry at his mother, because she does not take him to the forest. He goes alone, and in the forest he is afraid of a wolf. He runs from the wolf and climbs a mountain. Upon that mountain a sage lies. The boy flatters the sage, and longs for the sage's fruits. The sage gives the boy fruits. The fruits please the boy. He comes home, and gives fruits to his mother.
  teaches: |
    six verbs, each choosing its own case. मात्रे and वृकात् sit in adjacent
    sentences: two objects of emotion, two different cases — and मात्रे returns
    at the end, now the one who receives.
