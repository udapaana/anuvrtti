- id: ex181
  kind: sangraha
  segment: 55
  order: 1
  sentence: बालः वने वृकात् बिभेति। सः मात्रे क्रुध्यति, यतः सा तम् वनम् न नयति। मुनिः गिरिम् अधिशेते। बालः मुनये श्लाघते, मुनेः फलेभ्यः च स्पृहयति। मुनिः बालाय फलानि यच्छति। बालाय फलानि रोचन्ते। सः गृहम् आगच्छति, मातुः च न बिभेति।
  translation: In the forest the boy is afraid of a wolf. He is angry at his mother, because she does not take him to the forest. A sage lies upon the mountain. The boy flatters the sage, and longs for the sage's fruits. The sage gives the boy fruits. The fruits please the boy. He comes home, and is no longer afraid of his mother.
  teaches: |
    six verbs, each choosing its own case. वृकात् and मात्रे sit in adjacent
    clauses: two objects of emotion, two different cases.
  words:
  - form: बालः
    lemma: बाल
    gloss: the boy
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: वने
    lemma: वन
    gloss: in the forest
    notes:
    - term: अधिकरण
      en: locus
    - term: सप्तमी
      en: locative
  - form: वृकात्
    lemma: वृक
    gloss: of a wolf (afraid of)
    notes:
    - term: अपादान
      en: the thing feared — treated as what one shrinks away FROM
    - term: पञ्चमी
      en: ablative
    - cite: "1.4.25"
      role: भीत्रार्थानां भयहेतुः — with verbs of fearing, the cause of fear is अपादान → वृकात्
  - form: बिभेति
    lemma: भी
    gloss: is afraid
    notes:
    - term: लट्
      en: present — reduplicated stem बिभे-
  - form: सः
    lemma: तद्
    gloss: he
    notes:
    - term: सर्वनाम
      en: pronoun
    - term: प्रथमा
      en: nominative
  - form: मात्रे
    lemma: मातृ
    gloss: at his mother
    notes:
    - term: सम्प्रदान
      en: the one angered at — NOT the accusative one might expect
    - term: चतुर्थी
      en: dative
    - cite: "1.4.37"
      role: क्रुधद्रुहोरुपसृष्टयोः… — the target of क्रुध् is सम्प्रदान → मात्रे
  - form: क्रुध्यति
    lemma: क्रुध्
    gloss: is angry
    notes:
