      role: नपुंसकस्य झलचः — नुम् before the neuter plural ending → फलानि
    - term: कर्मन्
      en: object
    - term: बहुवचन
      en: neuter plural
  - form: यच्छति
    lemma: दा
    gloss: gives
    notes:
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present — दा has the stem यच्छ्
  - form: रोचन्ते
    lemma: रुच्
    gloss: are pleasing
    notes:
    - term: गुण
      en: the root vowel strengthens before शप् — रुच् → रोच्
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present plural — the FRUITS are the agent here, not the boy
    - cite: "1.4.33"
      role: रुच्यर्थानां प्रीयमाणः — the one pleased is सम्प्रदान → बालाय
  - form: गृहम्
