  - form: 'यतः'
    lemma: यतस्
    gloss: because
    vocab: true
    notes:
    - term: अव्यय
      en: indeclinable — subordinating connective
  - form: सा
    lemma: तद्
    gloss: she
    notes:
    - term: सर्वनाम
      en: pronoun
    - term: प्रथमा
      en: nominative feminine
  - form: तम्
    lemma: तद्
    gloss: him
    notes:
    - term: सर्वनाम
      en: pronoun
    - term: कर्मन्
      en: object
    - term: द्वितीया
      en: accusative
  - form: वनम्
    lemma: वन
    gloss: to the forest
    notes:
    - term: कर्मन्
