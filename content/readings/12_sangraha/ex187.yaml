- id: ex187
  kind: sangraha
  segment: 45
  order: 1
  sentence: रामः वदति — अहम् ग्रामम् गच्छामि। त्वम् अपि ग्रामम् गच्छसि? कृष्णः वदति — न। अहम् तत्र अगच्छम्; त्वम् न अगच्छः। पश्य — ग्रामात् बालाः आगच्छन्ति, नरौ च ग्रामम् गच्छतः। रामः वदति — अहम् अपि गच्छामि।
  translation: 'Rāma says: "I am going to the village. Are you going to the village too?" Kṛṣṇa says: "No. I went there; you did not go. Look — the boys are coming back from the village, and two men are going to it." Rāma says: "I am going too."'
  teaches: 'One verb in three persons, both numbers, and the past: गच्छामि, गच्छसि, गच्छतः, आगच्छन्ति, then अगच्छम्, अगच्छः — two friends deciding who goes to the village.

    '
