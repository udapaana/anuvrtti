  sentence: नद्याः तीरे तिष्ठन् राजा दूरात् आगच्छन्तम् भ्रातरम् अपश्यत्। भ्राता श्रान्तः आसीत्। राज्ञा जलम् दातव्यम् इति मन्त्री अवदत्। राजा स्वयम् जलम् अददात्। पिता तत् पश्यन् अवदत् — एतत् एव राज्ञः कर्म, न अन्यत्। स्मरणीयम् एतत् सर्वैः।
  translation: Standing on the bank of a river, the king saw his brother coming from afar. The brother was tired. The minister said that water was to be given by the king. The king himself gave water. The father, seeing that, said — "This alone is a king's work, not anything else. This is to be remembered by all."
  teaches: |
    three participles set against three finite verbs, with two gerundives in
    between: दातव्यम् and स्मरणीयम्, both stating obligation with no verb.
