  sentence: राजा सभाम् आगच्छति। जनाः राजानम् पश्यन्ति। गुरुः अपि तत्र। राजा गुरवे धनम् यच्छति, गुरुः च राज्ञे धर्मम् कथयति। गमनम् श्रेयः इति राजा वदति। ततः राजानौ अपि आगच्छतः।
  translation: The king comes to the assembly. The people see the king. The teacher is there too. The king gives wealth to the teacher, and the teacher tells the king about dharma. "Going is better," says the king. Then the two kings also arrive.
  teaches: |
    राजन् in four grades — राजा, राजानम्, राज्ञे, राजानौ — with गुरुः / गुरवे
    alongside. गमनम् closes as an action-noun.
