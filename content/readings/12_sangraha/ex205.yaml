  kind: sangraha
  segment: 255
  order: 1
  sentence: गुरुः अवदत् — शिष्यः पठेत्, न तु शयीत। तस्य पठनम् एव धर्मः। एकदा सः शिष्यः न अपठत्, वनम् अगच्छत् च। तत् श्रुत्वा गुरुः अक्रुध्यत्। रामेण तत् वचनम् श्रुतम्। सः चिन्तयत् — अहम् सदा पठेयम् इति।
  translation: The teacher said — "A student should study, and not sleep. His studying alone is his dharma." One day that student did not study, and went to the forest. Hearing that, the teacher grew angry. Rāma heard those words. He thought — "I will always study."
  teaches: |
    पठेत् and पठेयम् in one exchange, against अपठत् and अगच्छत्. पठनम् names
    the act rather than the actor; श्रुत्वा and श्रुतम् are built from one root.
