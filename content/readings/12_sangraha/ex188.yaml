  sentence: गुरुः शिष्यम् वदति — ग्रामम् गच्छ, तत्र धर्मम् पश्य। शिष्यः चिन्तयति — अहम् गच्छेयम्, किन्तु मार्गः दीर्घः। गुरुः वदति — यः धर्मम् इच्छति सः गच्छेत्। शिष्यः सुखी भूयात् इति गुरुः आशास्ते।
  translation: The teacher says to the student — "Go to the village; see dharma there." The student thinks — "I would go, but the road is long." The teacher says — "He who wants dharma should go." "May the student be happy," the teacher blesses.
  teaches: |
    three moods in one exchange: गच्छ orders, गच्छेत् recommends, भूयात्
    wishes. One root, three endings.
