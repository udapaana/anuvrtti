  kind: sangraha
  segment: 205
  order: 1
  sentence: दाशरथिः वनम् गच्छति। मार्गे सः माथुरम् एकम् ब्राह्मणम् पश्यति। सः ब्राह्मणः धनवान् बलवान् च, तथापि दाशरथेः गुरुत्वम् जानाति। दाशरथिः काषायम् वस्त्रम् धारयति, ब्राह्मणवत् च अधीते। ग्रामतः आगताः जनाः तम् पश्यन्ति, वदन्ति च — अयम् पटुतरः; सर्वेषु पटुषु पटुतमः इति।
  translation: 'The son of Daśaratha goes to the forest. On the way he sees a brahmin from Mathurā. That brahmin is wealthy and strong, yet he knows the greatness of Daśaratha''s son. Rāma wears an ochre robe, and studies like a brahmin. People who have come from the village see him and say: "This one is the abler; among all the able, the ablest."'
  teaches: 'Rāma on the forest road, named and described by तद्धितs: दाशरथिः (इञ्, the patronymic), माथुरम् (from Mathurā), धनवान्/बलवान् (मतुप्), गुरुत्वम् (त्व), काषायम् (dyed), ब्राह्मणवत् (वति), ग्रामतः (तसिल्), पटुतरः/पटुतमः.

    '
