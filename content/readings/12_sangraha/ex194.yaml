  kind: sangraha
  segment: 205
  order: 1
  sentence: दाशरथिः माथुरम् नगरम् गच्छति। सः धनवान् बलवान् च। तस्य गुरुत्वम् सर्वे जनाः जानन्ति। काषायम् वस्त्रम् धारयति सः, ब्राह्मणवत् च अधीते। ग्रामतः आगताः जनाः तम् पश्यन्ति। अयम् पटुतरः, सर्वेषु पटुषु पटुतमः इति ते वदन्ति।
  translation: The son of Daśaratha goes to the city of Mathurā. He is wealthy and strong. All people know his weightiness. He wears an ochre robe, and studies like a brahmin. People come from the village and see him. "This one is cleverer; among all the clever ones, the cleverest," they say.
  teaches: |
    तद्धित words in use rather than in their विग्रह — दाशरथिः as a name,
    माथुरम् qualifying a city. धनवान् declines; ब्राह्मणवत् does not.
