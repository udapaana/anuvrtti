  sentence: राजा सभायाम् आसीत्। तत्र भगवान् मुनिः आगच्छत्। राज्ञः पिता अपि तत्र। मुनिः राजानम् अवदत् — पितरम् पश्य, धनवान् सः न, तथापि श्रेष्ठः। राज्ञा तत् श्रुतम्। ततः सः पितरि भक्तिम् अकरोत्। भगवतः वचनेन राजा शान्तः अभवत्।
  translation: The king was in the assembly. There the Blessed One, a sage, came. The king's father was there too. The sage said to the king — "Look at your father; he is not wealthy, yet he is the better man." That was heard by the king. Then he showed devotion to his father. By the Blessed One's words the king became calm.
  teaches: |
    consonant stems in one scene, each in both grades: राजा / राज्ञः / राजानम्,
    भगवान् / भगवतः, पिता / पितरम्.
