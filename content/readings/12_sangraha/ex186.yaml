- id: ex186
  kind: sangraha
  segment: 85
  order: 1
  sentence: रामः च लक्ष्मणः च गुरुणा सह वनम् अगच्छताम्। तत्र ऋषिः उवाच रामम् — नमः ते वीर। त्वम् धर्मम् रक्षसि; लक्ष्मणः अपि धर्मम् रक्षति।
  translation: 'Rāma and Lakṣmaṇa went to the forest with their teacher. There a sage said to Rāma: "Homage to you, hero. You protect dharma; Lakṣmaṇa too protects dharma."'
  teaches: 'The two princes in the forest, told in joined words: रामश्च (श्चुत्व), तत्रर्षिः (गुण), लक्ष्मणोऽपि (ओ before अ, the avagraha), नमस्ते (the visarga before त्).'
  vyakhya_en: 'A sandhi rule is usually shown from the pieces inward: रामः + च, and watch

    them join. Text runs the other way. It gives you रामश्च and तत्रर्षिरुवाच

    whole, and the work is taking them apart. That is पदच्छेद — sandhi is not

    something performed in writing so much as undone in reading.


    Nothing in the sentence is marked. The joins are easier to hear than to

    see — रामश्च and नमस्ते वीर resolve on the tongue before they

    resolve on the page. The word-list carries the constituents for the ones

    that don''t.

    '
  vyakhya: सन्धिः पदच्छेदे ज्ञायते, न तु योजने। यत् पठसि तत् विभज।
