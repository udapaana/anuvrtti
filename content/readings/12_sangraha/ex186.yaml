  sentence: रामश्च लक्ष्मणश्च गुरुणा सह वनमगच्छताम्। तत्रर्षिरुवाच रामम् — नमस्ते वीर। त्वम् धर्मं रक्षसि; सोऽपि लक्ष्मणः धर्मं रक्षति। रात्रौ तौ स्वपितः; तयोर्गुरुराच्छादयति वस्त्रेण। प्रातः पुनर्ग्राममागच्छतो नरौ।
  translation: 'Rāma and Lakṣmaṇa went to the forest with their teacher. There a sage said to Rāma: "Homage to you, hero. You protect dharma; he too — Lakṣmaṇa — protects dharma." At night the two sleep; their teacher covers them with a cloth. In the morning the two men come back to the village again.'
  teaches: 'The two princes in the forest, told in joined words: रामश्च (श्चुत्व), तत्रर्षिः (सवर्णदीर्घ), सोऽपि, तयोर्गुरुराच्छादयति (the तुक् before छ), पुनर्ग्राममागच्छतो (the visarga sandhis).

    '
