  sentence: कस्मिंश्चित् ग्रामे मुनिः वसति स्म। जनाः तम् अपृच्छन् — किम् कुर्याम। मुनिः अवदत् — दानम् कुरुत, सत्यम् वदत। दानेन सुखम् भवति, असत्येन च दुःखम्। यः सत्यम् वदेत् सः श्रेष्ठः। रामेण एतत् वचनम् स्मृतम्।
  translation: In a certain village there lived a sage. The people asked him — "What should we do?" The sage said — "Practise giving, speak the truth. From giving comes happiness, and from untruth, sorrow. He who speaks truth is the best." These words were remembered by Rāma.
  teaches: |
    दानम् and असत्येन name acts as things; कुर्याम and वदेत् ask what ought to be
    done. कस्मिंश्चित् opens with a श्चुत्व join and रामेण closes with णत्व.
