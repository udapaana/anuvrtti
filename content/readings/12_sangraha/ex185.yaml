  order: 1
  sentence: देवदत्तः नित्यम् अन्नम् ददाति; सः दाता। दानम् तस्य धर्मः। ग्रामे सः बहूनि कर्माणि करोति — सः कर्ता, न तु भोक्ता। एकदा सः तीर्थम् प्रति गमनम् आरभते। मार्गे सः यात्रिकेभ्यः पाकम् करोति; तस्य पाकः अपि सर्वेभ्यः रोचते। जनाः तम् कर्तारम् दातारम् च वदन्ति।
  translation: Devadatta gives food every day; he is a giver. Giving is his dharma. In the village he does many tasks — he is a doer, not an enjoyer. One day he sets out on a journey to a pilgrimage place. On the way he cooks for the travellers; his cooking, too, pleases everyone. People call him a doer and a giver.
  teaches: 'One man described by the agent- and action-nouns that the कृत् affixes make: दाता, कर्ता, भोक्ता (तृच्/तृन्), दानम् and गमनम् (ल्युट्), पाकः (घञ्).

    '
