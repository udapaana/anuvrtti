  sentence: ग्रामे भगवान् वदति। तस्य वचनम् पिता शृणोति, पितरम् च पुत्रः पश्यति। तदा एकः दण्डी अपि आगच्छति; ग्रामस्य पितरः दण्डिनम् पश्यन्ति। भगवतः वचनेन ते तुष्यन्ति। ततः भगवतः दर्शनाय राजानौ अपि आगच्छतः।
  translation: In the village the Blessed One speaks. A father listens to his words, and his son watches the father. Then a staff-bearing ascetic arrives too; the village elders see the staff-bearer. By the Blessed One's words they are satisfied. Then two kings too come to see the Blessed One.
  teaches: 'The strong stems in one gathering: भगवान्, पितरम्, दण्डी, पितरः, राजानौ beside the weak भगवतः, दण्डिनम् — the crowd round a teacher grows, and so does the case-work.

    '
