- id: ex184
  kind: sangraha
  segment: 155
  order: 1
  sentence: ग्रामे भगवान् वदति। एकः पिता पुत्रेण सह तस्य वचनम् शृणोति। तदा एकः दण्डी अपि आगच्छति, भगवन्तम् च पृच्छति। भगवतः उत्तरेण सः तुष्यति। ततः भगवतः यशः श्रुत्वा राजानौ अपि तस्य दर्शनाय आगच्छतः।
  translation: In the village the Blessed One speaks. A father, with his son, listens to his words. Then a staff-bearing ascetic arrives too, and questions the Blessed One. He is satisfied by the Blessed One's answer. Then, hearing of the Blessed One's fame, two kings too come to see him.
  teaches: 'The strong stems beside the weak: भगवान्, भगवन्तम्, दण्डी, राजानौ beside भगवतः — the crowd round a teacher grows, and so does the case-work.'
  vyakhya_en: 'One stem in two grades: भगवान् and भगवन्तम् against भगवतः. Nothing about the

    meaning changes — they are the same person. What changes is the ending attached,

    and whether that ending belongs to the सर्वनामस्थान (strong) set: the strong

    endings keep the न्, the weak ones drop it. दण्डी and राजानौ are strong forms too.

    '
  vyakhya: एकं पदम् — बलवत् दुर्बलं च। भगवान् भगवन्तम्, भगवतः।
