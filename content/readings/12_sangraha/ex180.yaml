- id: ex180
  kind: sangraha
  segment: 70
  sentence: नरः ग्रामे वसति। तस्य पुत्रः बालः। प्रभाते नरः बालः च वनम् गच्छतः। वने वृक्षाः सन्ति। नरः वृक्षात् फलानि आहरति। बालः फलानि इच्छति। नरः बालाय फलम् यच्छति। बालः फलम् खादति। ततः नरौ ग्रामम् आगच्छतः।
  translation: A man lives in a village. His son is a boy. At dawn the man and the boy go to the forest. In the forest there are trees. The man brings down fruits from a tree. The boy wants the fruits. The man gives the boy a fruit. The boy eats the fruit. Then the two of them come back to the village.
  teaches: |
    all six कारकas across nine sentences of connected prose. प्रभाते and वने
    share the सप्तमी — time and place take the same case. The dual opens and
    closes the passage.
  words:
  - form: नरः
    lemma: नर
    gloss: a man
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: ग्रामे
    lemma: ग्राम
    gloss: in a village
    notes:
    - term: अधिकरण
      en: locus — where he lives
    - term: सप्तमी
      en: locative
  - form: वसति
    lemma: वस्
    gloss: dwells
    notes:
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  - form: तस्य
    lemma: तद्
    gloss: his
    notes:
    - term: सर्वनाम
      en: pronoun
    - term: षष्ठी
      en: genitive — a relation, not a कारक
  - form: पुत्रः
    lemma: पुत्र
    gloss: son
    notes:
    - term: प्रथमा
      en: nominative
  - form: बालः
    lemma: बाल
    gloss: (is) a boy
    notes:
    - term: प्रथमा
      en: nominative — a nominal sentence, no verb needed
  - form: प्रभाते
    lemma: प्रभात
    gloss: at dawn
    vocab: true
    notes:
    - term: अधिकरण
      en: locus in TIME — the same सप्तमी that marks place
    - term: सप्तमी
      en: locative
  - form: च
    lemma: च
    gloss: and
    vocab: true
    notes:
    - term: अव्यय
      en: indeclinable — joins two agents, so the verb goes dual
  - form: गच्छतः
    lemma: गम्
    gloss: the two go
    notes:
    - term: द्विवचन
      en: dual verb — two agents joined by च take the तस् ending
  - form: वनम्
    lemma: वन
    gloss: to the forest
    vocab: true
    notes:
    - term: कर्मन्
      en: goal of motion — what the agent reaches
    - term: द्वितीया
      en: accusative
  - form: वने
    lemma: वन
    gloss: in the forest
    notes:
    - term: अधिकरण
      en: locus — now the scene, not the goal
    - term: सप्तमी
      en: locative
  - form: वृक्षाः
    lemma: वृक्ष
    gloss: trees
    notes:
    - term: कर्तृ
      en: agent
    - term: बहुवचन
      en: plural — अ-stem नर-type, so वृक्ष + जस् → वृक्षाः
  - form: सन्ति
    lemma: अस्
    gloss: there are
    vocab: true
    notes:
    - term: लट्
      en: present, 3rd pl.
  - form: वृक्षात्
    lemma: वृक्ष
    gloss: from a tree
    notes:
    - term: अपादान
      en: source — the fixed point departed from
    - term: पञ्चमी
      en: ablative
  - form: फलानि
    lemma: फल
    gloss: fruits
    notes:
    - cite: "7.1.72"
      role: नपुंसकस्य झलचः — नुम् before the neuter plural ending → फलानि
    - term: कर्मन्
      en: object
    - term: बहुवचन
      en: neuter plural — प्रथमा = द्वितीया, so फलानि serves either
  - form: आहरति
    lemma: हृ
    gloss: brings down, fetches
    vocab: true
    notes:
    - term: आ + हृ
      en: "\"carry\" with आ — carry toward"
  - form: इच्छति
    lemma: इष्
    gloss: wants
    vocab: true
    notes:
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  - form: बालाय
    lemma: बाल
    gloss: to the boy
    notes:
    - term: सम्प्रदान
      en: recipient — the one the giving is aimed at
    - term: चतुर्थी
      en: dative
  - form: फलम्
    lemma: फल
    gloss: a fruit
    notes:
    - term: कर्मन्
      en: object — singular now, against the plural फलानि above
    - term: द्वितीया
      en: accusative
  - form: यच्छति
    lemma: दा
    gloss: gives
    notes:
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present — दा has the irregular stem यच्छ्
  - form: खादति
    lemma: खाद्
    gloss: eats
    vocab: true
    notes:
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  - form: ततः
    lemma: ततस्
    gloss: then, thereupon
    vocab: true
    notes:
    - term: अव्यय
      en: indeclinable — narrative connective
  - form: नरौ
    lemma: नर
    gloss: the two (men)
    notes:
    - term: कर्तृ
      en: agent
    - term: द्विवचन
      en: dual — the man and the boy, taken together
    - cite: "1.4.22"
      role: द्व्येकयोर्द्विवचनैकवचने — two of them, so द्विवचन → नरौ
  - form: ग्रामम्
    lemma: ग्राम
    gloss: to the village
    notes:
    - term: कर्मन्
      en: goal of motion
    - term: द्वितीया
      en: accusative
  - form: आगच्छतः
    lemma: गम्
    gloss: the two come back
    notes:
    - term: द्विवचन
      en: dual verb — तस् ending agrees with नरौ, closing the frame
  vyakhya: एकस्मिन् वाक्ये यत् पृथक् दृष्टं तत् अत्र सङ्गतम्। षट् कारकाणि एकस्याम् कथायाम्।
  vyakhya_en: |
    Nothing here is new, and none of it is the point. ग्रामे is where the man
    lives, not an example of the सप्तमी; वृक्षात् is where the fruit comes
    from, not a demonstration of अपादान.
