  sentence: राजपुरुषः सभाम् आगच्छति। सः महापुरुषः, पीताम्बरः च। रामकृष्णौ तम् पश्यतः। अब्राह्मणः अपि तत्र तिष्ठति। उपकृष्णम् जनाः सीदन्ति। राज्ञः पुरुषः धर्मम् कथयति।
  translation: The king's man comes to the assembly. He is a great man, and yellow-robed. Rāma and Kṛṣṇa see him. A non-brahmin stands there too. The people sit near Kṛṣṇa. The king's man speaks about dharma.
  teaches: |
    the four compound types in prose: राजपुरुषः, पीताम्बरः, रामकृष्णौ,
    उपकृष्णम्. The passage opens on राजपुरुषः and closes on राज्ञः पुरुषः —
    compounded and not.
