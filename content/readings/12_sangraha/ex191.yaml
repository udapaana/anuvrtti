  sentence: राजपुरुषः सभाम् आगच्छति, वदति च — रामकृष्णौ आगच्छतः। ततः पीताम्बरः कृष्णः रामेण सह सभाम् आगच्छति। सः महापुरुषः। जनाः उपकृष्णम् सीदन्ति। एकः अब्राह्मणः अपि तत्र तिष्ठति, दूरे; कृष्णः तम् अपि आह्वयति। ततः सः सर्वेभ्यः धर्मम् कथयति।
  translation: 'The king''s man comes into the assembly and announces: "Rāma and Kṛṣṇa are coming." Then yellow-robed Kṛṣṇa comes into the assembly with Rāma. He is a great man. The people sit near Kṛṣṇa. A non-brahmin stands there too, at a distance; Kṛṣṇa calls him over as well. Then he tells everyone about dharma.'
  teaches: 'One arrival, told in the four compound classes: राजपुरुषः (तत्पुरुष), रामकृष्णौ (द्वन्द्व), पीताम्बरः (बहुव्रीहि — the one whose robe is yellow), महापुरुषः (कर्मधारय), अब्राह्मणः (नञ्), उपकृष्णम् (अव्ययीभाव).

    '
