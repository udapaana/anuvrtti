  sentence: महाबलः नृपः सभाम् आगच्छत्। तस्य पार्श्वे मन्त्रिपुरोहितौ आस्ताम्। नीलाम्बरः दूतः प्रविश्य उपसभम् अतिष्ठत्। सः महाबलम् अवदत् — शत्रुसेना पराजिता, राष्ट्रम् च रक्षितम्।
  translation: The mighty king came to the assembly. At his side were the minister-and-priest. A blue-clad messenger, having entered, stood near the assembly. He said to the mighty one — "The enemy-army is defeated, and the kingdom protected."
  teaches: |
    the four compound types again, none of them new: महाबलः (बहुव्रीहि),
    मन्त्रिपुरोहितौ (द्वन्द्व), उपसभम् (अव्ययीभाव), शत्रुसेना (तत्पुरुष).
