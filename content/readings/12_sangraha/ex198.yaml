- id: ex198
  kind: sangraha
  segment: 345
  order: 1
  sentence: गुरुणा शिष्याः पाठ्यन्ते। तैः शास्त्राणि पठ्यन्ते, गुरोः वचनानि च श्रूयन्ते। श्वः ते ग्रामम् गमिष्यन्ति, यतः तत्र सस्योत्सवः। तत्र ते धनम् धान्यम् च लप्स्यन्ते, गुरवे च दास्यन्ति। गुरुः तान् पुनः द्रष्टुम् इच्छति। अद्य तु ते नद्याः तीरे तिष्ठन्ति, जलम् च पिबन्ति।
  translation: The pupils are taught by the teacher. By them the treatises are read, and the teacher's words are heard. Tomorrow they will go to the village, because there is a harvest festival there. There they will get wealth and grain, and give it to their teacher. The teacher wishes to see them again. Today, though, they stand on the river's bank and drink its water.
  teaches: 'A school before the holidays, in the passive (पाठ्यन्ते, पठ्यन्ते, श्रूयन्ते — the agent in the तृतीया), the future (गमिष्यन्ति, लप्स्यन्ते, दास्यन्ति), and तुमुन् after इच्छति (द्रष्टुम्).

    '
