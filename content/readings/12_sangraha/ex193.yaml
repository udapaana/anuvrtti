  sentence: वाग् अत्र शुभा। तच्च सत्यं वदति। वनं हसति, नदी च शोभते। रामेण सह मुनिर्गच्छति। संस्कृतं वचनं तेषां प्रियम्। नमस्ते गुरो, इति ते वदन्ति।
  translation: Speech here is auspicious. And it speaks the truth. The forest laughs, and the river shines. The sage goes with Rāma. Refined speech is dear to them. "Homage to you, teacher," they say.
  teaches: |
    consonant joins inside sentences rather than shown as transformations:
    वाग्, तच्च, वनं, संस्कृतं, रामेण, नमस्ते.
