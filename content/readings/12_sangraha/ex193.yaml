- id: ex193
  kind: sangraha
  segment: 125
  order: 1
  sentence: रामेण सह मुनिः गच्छति। मार्गे वनम् हसति, नदी च शोभते। मुनिः सत्यम् वदति, रामः तत् च शृणोति। मुनेः वाक् अत्र शुभा। आश्रमे शिष्याः तम् प्रतीक्षन्ते; संस्कृतम् वचनम् तेषाम् प्रियम्। नमः ते गुरो, इति ते वदन्ति।
  translation: A sage walks with Rāma. On the way the forest smiles with flowers, and the river shines. The sage speaks the truth, and Rāma listens to that too. The sage's speech is auspicious here. At the hermitage his pupils are waiting for him; refined speech is dear to them. "Homage to you, teacher," they say.
  teaches: 'A walk with a sage, in sandhi: वाग् (जश्त्व), तच्च (श्चुत्व), सत्यं/वनं/वचनं/तेषां (anusvāra), रामेण (णत्व across the word), मुनिर्गच्छति (visarga), संस्कृतं (the nasal made homorganic). हसति of a forest in bloom is the poets'' own word.

    '
