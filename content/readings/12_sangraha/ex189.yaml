- id: ex189
  kind: sangraha
  segment: 175
  order: 1
  sentence: यः पठति सः जानाति। सा अपि पठति, तस्यै गुरुः पुस्तकम् यच्छति। तस्मै बालाय अपि यच्छति। गुरोः शालायाम् ते बालाः ताः कन्याः च सह पठन्ति। गच्छन् बालः पुस्तकम् वहति। अहम् तान् पश्यामि।
  translation: He who reads, knows. She reads too; the teacher gives her a book. He gives one to that boy as well. In the teacher's school those boys and those girls read together. Walking along, the boy carries the book. I see them.
  teaches: |
    तद् and यद् through their forms: सः, सा, ते, ताः, तान्. तस्मै and बालाय
    sit in one clause — both datives, different endings.
  words:
  - form: 'यः'
    lemma: यद्
    gloss: he who
    notes:
    - term: सर्वनाम
      en: the relative pronoun, opening the correlative frame
    - term: प्रथमा
      en: nominative
    - cite: "1.1.27"
      role: सर्वादीनि सर्वनामानि — यद् and तद् belong to the सर्वनाम class
    - term: कर्तृ
      en: agent — the one who reads
  - form: पठति
    lemma: पठ्
    gloss: reads
    notes:
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  - form: सः
    lemma: तद्
    gloss: he
    notes:
    - term: सर्वनाम
      en: the correlative answering यः
    - term: प्रथमा
      en: nominative masculine
    - term: कर्तृ
      en: agent — the correlative of यः
  - form: जानाति
    lemma: ज्ञा
    gloss: knows
    notes:
    - term: लट्
      en: present
  - form: सा
    lemma: तद्
    gloss: she
    notes:
    - term: सर्वनाम
      en: pronoun
    - term: प्रथमा
      en: nominative feminine — सा beside masculine सः
    - cite: "4.1.4"
      role: "अजाद्यतष्टाप् — टाप्, the ordinary a-stem feminine → सा"
    - term: कर्तृ
      en: agent
  - form: अपि
    lemma: अपि
    gloss: too
    notes:
    - term: अव्यय
      en: indeclinable
  - form: तस्यै
    lemma: तद्
    gloss: to her
    notes:
    - term: सर्वनाम
      en: pronoun
    - term: सम्प्रदान
      en: recipient
    - term: चतुर्थी
      en: the सर्वनाम dative — स्यै, where a noun would take आय
  - form: गुरुः
    lemma: गुरु
    gloss: the teacher
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: पुस्तकम्
    lemma: पुस्तक
    gloss: a book
    vocab: true
    notes:
    - cite: "7.1.24"
      role: अतोऽम् — the neuter अ-stem takes अम् in प्रथमा and द्वितीया → पुस्तकम्
    - term: कर्मन्
      en: object
    - term: द्वितीया
      en: neuter accusative
  - form: यच्छति
    lemma: दा
    gloss: gives
    notes:
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
