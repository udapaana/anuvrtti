  sentence: अद्य राजा सभाम् अगमत्। तत्र दूतः अवादीत् — शत्रवः पराजिताः, ग्रामाः च रक्षिताः। राजा तत् अश्रौषीत्, मन्त्रिणः च अपृच्छत् — केन एतत् कृतम्। मन्त्रिणः अवादिषुः — यः स्वयम् न भाषते सः एव अकार्षीत्। ततः राजा तम् वीरम् आह्वयत्, वरम् च अददात्। सः वीरः तूष्णीम् आसीत्, न च किञ्चित् अयाचत।
  translation: Today the king went to the assembly. There a messenger spoke — "The enemies are defeated, and the villages protected." The king heard that, and asked the ministers — "By whom was this done?" The ministers spoke — "He who does not speak of himself is the very one who did it." Then the king summoned that hero, and gave a boon. That hero was silent, and asked for nothing.
  teaches: |
    अगमत्, अवादीत्, अश्रौषीत्, अवादिषुः, अकार्षीत् — five aorists in one
    scene. पराजिताः and रक्षिताः stand as predicates without a verb.
