  vyakhya: 'पञ्च लुङः एकस्मिन् प्रसङ्गे — अगमत् अवादीत् अश्रौषीत् अवादिषुः अकार्षीत्। पराजिताः रक्षिताः कृतम् इति कर्मणि क्तानि, तिङन्तम् अन्तरेण। मन्त्रिणः इति द्वितीयाबहुवचने प्रथमाबहुवचने च समानम्।'
  vyakhya_en: |
    Five aorists carry the scene, and three of the sentences have no finite verb at all — शत्रवः पराजिताः, ग्रामाः रक्षिताः, केन एतत् कृतम् all rest on a participle. मन्त्रिणः appears twice, first as the accusative of the persons asked and then as the nominative of the persons answering; nothing in the form distinguishes them, only the verb each one stands beside. The hero's silence is the point of the last sentence and also its grammar — तूष्णीम् आसीत् and न किञ्चित् अयाचत say it twice, once with an indeclinable and once with a verb.
