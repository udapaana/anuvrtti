      en: agent — an इ-stem masculine
    - term: प्रथमा
      en: nominative
  - form: ज्वलति
    lemma: ज्वल्
    gloss: blazes
    notes:
    - term: शप्
      en: ज्वल् + अ + ति — the अ between root and ending
    - term: लट्
      en: present
    - cite: "3.1.68"
      role: कर्तरि शप् — the शप् विकरण inserted after the root → ज्वल् + अ
