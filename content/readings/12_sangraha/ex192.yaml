  sentence: सायम् आश्रमे अग्निः ज्वलति। शिष्यः स्वपिति; गुरुः शिष्यम् बोधति, सः च नद्याः जलम् नयति। ततः गुरुः धर्मम् वदति, जनाः च शृण्वन्ति। रात्रौ ग्रामे अपि अग्नयः ज्वलन्ति, नराः च दूरात् पश्यन्ति।
  translation: At dusk a fire blazes in the hermitage. A pupil is asleep; the teacher wakes the pupil, and he carries water from the river. Then the teacher speaks of dharma, and the people listen. At night fires blaze in the village too, and the men watch from afar.
  teaches: 'One evening, with the present''s शप् and guṇa running through it — ज्वलति, नयति, बोधति — and अग्निः beside the plural अग्नयः.

    '
