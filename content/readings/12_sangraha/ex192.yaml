  order: 1
  sentence: अग्निः ज्वलति। नरः जलम् नयति। बालः वनम् गच्छति। गुरुः शिष्यम् बोधति। सः धर्मम् वदति। जनाः शृण्वन्ति। अग्नयः ज्वलन्ति, नराः च पश्यन्ति।
  translation: The fire blazes. The man leads the water. The boy goes to the forest. The teacher instructs the student. He speaks dharma. The people listen. The fires blaze, and the men watch.
  teaches: |
    seven present verbs built the same way: an अ between root and ending, and
    the root vowel strengthened before it. नी → नयति, बुध् → बोधति.
  words:
