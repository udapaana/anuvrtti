    gloss: the words
    notes:
    - cite: "7.1.24"
      role: अतोऽम् — the neuter अ-stem takes अम् in प्रथमा and द्वितीया → वचनम्
    - term: कर्मन्
      en: object
    - term: द्वितीया
      en: neuter accusative
  - form: पिता
