  vyakhya_en: |
    तस्मै and बालाय stand side by side in one clause, both datives, both
    pointing at the same boy. One takes स्मै because तद् is a सर्वनाम; the
    other takes आय because बाल is an ordinary noun. The सर्वनाम class is not
    a meaning — it is a list of stems that decline differently, and this is
    where the difference shows.

- id: ex188
  kind: sangraha
  segment: 145
  order: 1
  sentence: गुरुः शिष्यम् वदति — ग्रामम् गच्छ, तत्र धर्मम् पश्य। शिष्यः चिन्तयति — अहम् गच्छेयम्, किन्तु मार्गः दीर्घः। गुरुः वदति — यः धर्मम् इच्छति सः गच्छेत्। शिष्यः सुखी भूयात् इति गुरुः आशास्ते।
  translation: The teacher says to the student — "Go to the village; see dharma there." The student thinks — "I would go, but the road is long." The teacher says — "He who wants dharma should go." "May the student be happy," the teacher blesses.
  teaches: |
    the three moods set against each other in one exchange: गच्छ and पश्य as
    plain commands, गच्छेयम् and गच्छेत् for what one would or ought to do, and
    भूयात् as a blessing. The same root गम् carries the first three, so only the
    ending distinguishes an order from a recommendation.
  words:
  - form: गुरुः
    lemma: गुरु
    gloss: the teacher
    notes:
    - term: कर्तृ
      en: agent — a उ-stem masculine
    - term: प्रथमा
      en: nominative
  - form: शिष्यम्
    lemma: शिष्य
    gloss: to the student
    notes:
    - term: कर्मन्
      en: object of वद्
    - term: द्वितीया
      en: accusative
  - form: वदति
    lemma: वद्
    gloss: says
    notes:
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  - form: ग्रामम्
    lemma: ग्राम
    gloss: to the village
    notes:
    - term: कर्मन्
      en: goal of motion
    - term: द्वितीया
      en: accusative
  - form: गच्छ
    lemma: गम्
    gloss: go
    notes:
    - term: लोट्
      en: imperative — a bare command, no ending at all in the 2nd sg.
    - cite: "3.3.162"
      role: लोट् च — the imperative for a command → गच्छ
  - form: तत्र
    lemma: तत्र
    gloss: there
    notes:
    - term: अव्यय
      en: indeclinable
  - form: धर्मम्
    lemma: धर्म
    gloss: dharma
    notes:
    - term: कर्मन्
      en: object
    - term: द्वितीया
      en: accusative
  - form: पश्य
    lemma: दृश्
    gloss: see
    notes:
    - term: लोट्
      en: a second imperative alongside the first
  - form: शिष्यः
    lemma: शिष्य
    gloss: the student
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: चिन्तयति
    lemma: चिन्त्
    gloss: thinks
    vocab: true
    notes:
    - term: लट्
      en: present
  - form: अहम्
    lemma: अस्मद्
    gloss: I
    notes:
    - term: उत्तमपुरुष
      en: the speaker
  - form: गच्छेयम्
    lemma: गम्
    gloss: I would go
    notes:
    - term: विधिलिङ्
      en: optative, first person — what the speaker might or would do
    - cite: "3.3.161"
      role: विधिनिमन्त्रण… लिङ् — the optative → गच्छेयम्
  - form: किन्तु
    lemma: किन्तु
    gloss: but
    vocab: true
    notes:
    - term: अव्यय
      en: indeclinable — adversative
  - form: मार्गः
    lemma: मार्ग
    gloss: the road
    vocab: true
    notes:
    - term: प्रथमा
      en: nominative
  - form: दीर्घः
    lemma: दीर्घ
    gloss: (is) long
    vocab: true
    notes:
    - term: प्रथमा
      en: nominative — predicated without a verb
  - form: 'यः'
    lemma: यद्
    gloss: he who
    notes:
    - term: प्रथमा
      en: the relative, answered by सः
  - form: इच्छति
    lemma: इष्
    gloss: wants
    notes:
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  - form: सः
    lemma: तद्
    gloss: he
    notes:
    - term: प्रथमा
      en: nominative — answers यः
  - form: गच्छेत्
    lemma: गम्
    gloss: should go
    notes:
    - term: विधिलिङ्
      en: the same optative, third person — advice rather than an order
  - form: सुखी
    lemma: सुखिन्
    gloss: happy
    vocab: true
    notes:
    - term: प्रथमा
      en: nominative — इन्-stem, न् drops in the nom.sg
  - form: भूयात्
    lemma: भू
    gloss: may he be
    notes:
    - term: आशीर्लिङ्
      en: the benedictive — a wish, distinct in form from गच्छेत्
  - form: इति
    lemma: इति
    gloss: "thus"
    notes:
    - term: अव्यय
      en: closes the quotation
  - form: आशास्ते
    lemma: शास्
    gloss: blesses
    vocab: true
    notes:
    - term: आत्मनेपद
      en: middle voice
  vyakhya: आज्ञा गच्छ, विधिः गच्छेत्, आशीः भूयात्। एकः अर्थः, त्रीणि रूपाणि।
  vyakhya_en: |
    गच्छ orders, गच्छेत् recommends, भूयात् wishes. All three point at an action
    that has not happened yet, and nothing in the root or the sense separates
    them — only the ending does. That is what a लकार is: not a tense in the
    English sense, but a slot that carries mood and time together.

- id: ex187
  kind: sangraha
  segment: 45
  order: 1
  sentence: अहम् ग्रामम् गच्छामि। त्वम् अपि ग्रामम् गच्छसि। नरः ग्रामे भवति। नरौ ग्रामम् गच्छतः। बालाः ग्रामात् आगच्छन्ति। अहम् तत्र न अगच्छम्। त्वम् तत्र अगच्छः।
  translation: I go to the village. You too go to the village. The man is in the village. The two men go to the village. The boys come back from the village. I did not go there. You went there.
  teaches: |
    one verb-stem run across all three persons and all three numbers, then
    turned into the past: गच्छामि, गच्छसि, गच्छति, गच्छतः, आगच्छन्ति, and then
    अगच्छम् and अगच्छः with the augment. Only तत्र is new.
  words:
  - form: अहम्
    lemma: अस्मद्
    gloss: I
    notes:
    - term: उत्तमपुरुष
      en: the speaker
    - term: प्रथमा
      en: nominative
  - form: ग्रामम्
    lemma: ग्राम
    gloss: to the village
    notes:
    - term: कर्मन्
      en: goal of motion
    - term: द्वितीया
      en: accusative
  - form: गच्छामि
    lemma: गम्
    gloss: I go
    notes:
    - term: उत्तमपुरुष
      en: the मि ending — first person singular
    - cite: "3.4.78"
      role: तिप्तस्झि… — मिप् for the speaker, giving गच्छामि
  - form: त्वम्
    lemma: युष्मद्
    gloss: you
    notes:
    - term: मध्यमपुरुष
      en: the one addressed
    - term: प्रथमा
      en: nominative
  - form: अपि
    lemma: अपि
    gloss: too
    notes:
    - term: अव्यय
      en: indeclinable
  - form: गच्छसि
    lemma: गम्
    gloss: you go
    notes:
    - term: मध्यमपुरुष
      en: the सि ending — same stem गच्छ्, different person
  - form: नरः
    lemma: नर
    gloss: the man
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: ग्रामे
    lemma: ग्राम
    gloss: in the village
    notes:
    - term: अधिकरण
      en: locus
    - term: सप्तमी
      en: locative
  - form: भवति
    lemma: भू
    gloss: is
    notes:
    - term: प्रथमपुरुष
      en: the ति ending — भू takes गुण before शप्, भो → भव्
  - form: नरौ
    lemma: नर
    gloss: the two men
    notes:
    - term: द्विवचन
      en: dual
    - term: प्रथमा
      en: nominative dual
  - form: गच्छतः
    lemma: गम्
    gloss: the two go
    notes:
    - term: द्विवचन
      en: the तस् ending — the verb answers the dual agent
  - form: बालाः
    lemma: बाल
    gloss: the boys
    notes:
    - term: बहुवचन
      en: plural
    - term: प्रथमा
      en: nominative plural
  - form: ग्रामात्
    lemma: ग्राम
    gloss: from the village
    notes:
    - term: अपादान
      en: source
    - term: पञ्चमी
      en: ablative
  - form: आगच्छन्ति
    lemma: गम्
    gloss: they come back
    notes:
    - term: बहुवचन
      en: the अन्ति ending — third person plural
  - form: तत्र
    lemma: तत्र
    gloss: there
    vocab: true
    notes:
    - term: अव्यय
      en: indeclinable
  - form: 'न'
    lemma: न
    gloss: not
    notes:
    - term: अव्यय
      en: negation
  - form: अगच्छम्
    lemma: गम्
    gloss: I went
    notes:
    - term: लङ्
      en: the past — the augment अ in front, and the ending shortens to अम्
    - cite: "3.2.111"
      role: अनद्यतने लङ् — the past before today → अगच्छम्
  - form: अगच्छः
    lemma: गम्
    gloss: you went
    notes:
    - term: लङ्
      en: the same augment, second person — अगच्छम् beside अगच्छः
  vyakhya: एकः धातुः, नव रूपाणि। पुरुषः वचनं च अन्ते दृश्येते।
  vyakhya_en: |
    गम् does not change. गच्छ् is the same stem in all seven verbs here; what
    moves is the ending — मि, सि, ति, तः, अन्ति — and then the augment अ that
    marks the past. Sanskrit puts person and number where English puts a
    pronoun, which is why अहम् and त्वम् can be dropped without loss.

- id: ex186
  kind: sangraha
  segment: 85
  order: 1
  sentence: रामश्च लक्ष्मणश्च वनमगच्छताम्। तत्रर्षिरुवाच — नमस्ते वीर, सोऽपि धर्मं रक्षति। तयोर्गुरुराच्छादयति वनम्। पुनर्ग्राममागच्छतो नरौ।
  translation: Rāma and Lakṣmaṇa went to the forest. There a sage said — "Homage to you, hero; he too protects dharma." Their teacher covers the forest. The two men come back to the village again.
  teaches: |
    sandhi as it appears in running text, joined and unmarked: रामश्च,
    तत्रर्षिरुवाच, नमस्ते, सोऽपि, तयोर्गुरुराच्छादयति, पुनर्ग्राममागच्छतो.
    Each join is one already met on its own. The word-list carries the
    constituents; the sentence does not.
  words:
  - form: रामश्च
    lemma: राम
    gloss: and Rāma
    notes:
    - term: सन्धि
      en: रामः + च — the visarga becomes श् before a च्-class stop
    - cite: "8.4.40"
      role: स्तोः श्चुना श्चुः — श्चुत्व applied to the visarga-sibilant → रामश्च
  - form: लक्ष्मणश्च
    lemma: लक्ष्मण
    gloss: and Lakṣmaṇa
    notes:
    - term: सन्धि
      en: लक्ष्मणः + च — the same join, immediately repeated
    - term: प्रथमा
      en: nominative
  - form: वनमगच्छताम्
    lemma: वन
    gloss: went to the forest
    notes:
    - term: सन्धि
      en: वनम् + अगच्छताम् — the म् simply carries onto the following vowel
    - term: द्वितीया
      en: वनम् is कर्मन्, goal of motion; अगच्छताम् is dual past (लङ्)
  - form: तत्रर्षिरुवाच
    lemma: ऋषि
    gloss: there a sage said
    notes:
    - term: सन्धि
      en: तत्र + ऋषिः + उवाच — अ + ऋ merge, then the visarga of ऋषिः → र्
    - cite: "6.1.101"
      role: अकः सवर्णे दीर्घः — तत्र + ऋषिः gives तत्रर्षिः
  - form: नमस्ते
    lemma: नमस्
    gloss: homage to you
    notes:
    - term: सन्धि
      en: नमः + ते — the visarga becomes स् before a त्-class stop
    - term: चतुर्थी
      en: ते is dative — नमस् governs the चतुर्थी
  - form: वीर
    lemma: वीर
    gloss: O hero
    vocab: true
    notes:
    - term: सम्बोधन
      en: vocative — the one addressed
  - form: सोऽपि
    lemma: तद्
    gloss: he too
    notes:
    - term: सन्धि
      en: सः + अपि — visarga → ओ, and the अ of अपि elides, marked by ऽ
    - cite: "6.1.113"
      role: अतो रोरप्लुतादप्लुते — रु → उ, then गुण gives सो, and अपि loses its अ
  - form: धर्मं
    lemma: धर्म
    gloss: dharma
    notes:
    - term: कर्मन्
      en: object
    - term: द्वितीया
      en: accusative — written with anusvāra before the following र्
  - form: रक्षति
    lemma: रक्ष्
    gloss: protects
    vocab: true
    notes:
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  - form: तयोर्गुरुराच्छादयति
    lemma: गुरु
    gloss: their teacher covers
    notes:
    - term: सन्धि
      en: तयोः + गुरुः + आच्छादयति — two visargas → र्, then आ + छ doubles the छ
    - cite: "6.1.73"
      role: छे च — a short vowel before छ takes the तुक् augment → आच्छादयति
  - form: वनम्
    lemma: वन
    gloss: the forest
    notes:
    - term: कर्मन्
      en: object
    - term: द्वितीया
      en: accusative
  - form: पुनर्ग्राममागच्छतो
    lemma: ग्राम
    gloss: come back to the village again
    notes:
    - term: सन्धि
      en: पुनः + ग्रामम् + आगच्छतः — visarga → र्, then final visarga → ओ before न्
    - cite: "8.3.15"
      role: खरवसानयोर्विसर्जनीयः — the रु/visarga alternation running twice in one word-group
  - form: नरौ
    lemma: नर
    gloss: the two men
    notes:
    - term: द्विवचन
      en: nominative dual — agreeing with the dual verb आगच्छतः
  vyakhya: सन्धिः पदच्छेदे ज्ञायते, न तु योजने। यत् पठसि तत् विभज।
  vyakhya_en: |
    A sandhi rule is usually shown from the pieces inward: रामः + च, and watch
    them join. Text runs the other way. It gives you रामश्च and तत्रर्षिरुवाच
    whole, and the work is taking them apart. That is पदच्छेद — sandhi is not
    something performed in writing so much as undone in reading.

    Nothing in the sentence is marked. The joins are easier to hear than to
    see — रामश्च and पुनर्ग्राममागच्छतो resolve on the tongue before they
    resolve on the page. The word-list carries the constituents for the ones
    that don't.

- id: ex182
  kind: sangraha
  segment: 15
  order: 1
  sentence: नरः ग्रामे वसति। नरस्य पुत्रः बालः। नरः ग्रामात् गच्छति। सः पादाभ्याम् गच्छति। वृक्षात् फलम् पतति। नरः फलम् बालाय यच्छति। ततः नरः ग्रामम् आगच्छति।
  translation: A man lives in a village. The man's son is a boy. The man goes from the village. He goes on foot. A fruit falls from a tree. The man gives the fruit to the boy. Then the man comes back to the village.
  teaches: |
    the six कारकas together, after meeting them one at a time. ग्राम appears
    in three cases — ग्रामे, ग्रामात्, ग्रामम् — and every noun and verb here
    has been seen before. Singular throughout; only वृक्षात् and पतति are new
    vocabulary.
  words:
  - form: नरः
    lemma: नर
    gloss: a man
    notes:
    - term: कर्तृ
      en: agent — the one acting on its own
    - term: प्रथमा
      en: nominative
  - form: ग्रामे
    lemma: ग्राम
    gloss: in the village
    notes:
    - term: अधिकरण
      en: locus — where the action sits
    - term: सप्तमी
      en: locative
  - form: वसति
    lemma: वस्
    gloss: dwells, lives
    notes:
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  - form: नरस्य
    lemma: नर
    gloss: the man's
    notes:
    - term: षष्ठी
      en: genitive — a relation between two nouns, NOT one of the six कारकas
  - form: पुत्रः
    lemma: पुत्र
    gloss: son
    notes:
    - term: प्रथमा
      en: nominative
  - form: बालः
    lemma: बाल
    gloss: (is) a boy
    notes:
    - term: प्रथमा
      en: nominative — two nominatives, no verb; the sentence equates them
  - form: ग्रामात्
    lemma: ग्राम
    gloss: from the village
    notes:
    - term: अपादान
      en: source — the fixed point moved away from
    - term: पञ्चमी
      en: ablative
  - form: गच्छति
    lemma: गम्
    gloss: goes
    notes:
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  - form: सः
    lemma: तद्
    gloss: he
    vocab: true
    notes:
    - term: प्रथमा
      en: nominative — stands in for नरः, so the sentence need not repeat it
  - form: पादाभ्याम्
    lemma: पाद
    gloss: on foot (lit. by the two feet)
    notes:
    - term: करण
      en: instrument — the means by which the going happens
    - term: तृतीया
      en: instrumental
  - form: वृक्षात्
    lemma: वृक्ष
    gloss: from a tree
    vocab: true
    notes:
    - term: अपादान
      en: source again — same rule, different noun and different verb
    - term: पञ्चमी
      en: ablative
  - form: फलम्
    lemma: फल
    gloss: a fruit
    notes:
    - term: कर्तृ
      en: agent here — the fruit is what falls
    - term: प्रथमा
      en: neuter nominative — फलम् serves as both प्रथमा and द्वितीया
  - form: पतति
    lemma: पत्
    gloss: falls
    vocab: true
    notes:
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  - form: बालाय
    lemma: बाल
    gloss: to the boy
    notes:
    - term: सम्प्रदान
      en: recipient — the one the giving is aimed at
    - term: चतुर्थी
      en: dative
  - form: यच्छति
    lemma: दा
    gloss: gives
    notes:
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present — दा appears as the stem यच्छ्
  - form: ततः
    lemma: ततस्
    gloss: then
    vocab: true
    notes:
    - term: अव्यय
      en: indeclinable — a narrative connective, takes no ending
  - form: ग्रामम्
    lemma: ग्राम
    gloss: to the village
    notes:
    - term: कर्मन्
      en: goal of motion — what the agent reaches
    - term: द्वितीया
      en: accusative
  - form: आगच्छति
    lemma: गम्
    gloss: comes back
    notes:
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present — आ reverses the direction of गम्
  vyakhya: एकं ग्रामपदम् — त्रिषु विभक्तिषु। ग्रामे, ग्रामात्, ग्रामम्।
  vyakhya_en: |
    ग्राम appears three times: ग्रामे where the man lives, ग्रामात् where he
    leaves from, ग्रामम् where he returns to. One noun, three endings, and the
    ending alone says which relation the village has to the verb. That is what
    a कारक is — not a meaning the word carries, but a role the sentence
    assigns it.

    Each of these had its own sentence when it was introduced, one per rule.
    Together, the endings carry the whole difference.

