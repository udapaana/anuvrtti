  - form: मुनिः
    lemma: मुनि
    gloss: a sage
    notes:
    - term: कर्तृ
      en: agent — an इ-stem masculine
    - term: प्रथमा
      en: nominative
  - form: गिरिम्
    lemma: गिरि
    gloss: upon the mountain
    notes:
    - term: कर्मन्
      en: the locus turned OBJECT — अधि+शी makes it द्वितीया, not सप्तमी
    - term: द्वितीया
      en: accusative
    - cite: "1.4.46"
      role: अधिशीङ्स्थासां कर्म — with अधि + शी/स्था/आस्, the locus becomes कर्मन् → गिरिम्
  - form: अधिशेते
    lemma: शी
    gloss: lies upon
    notes:
    - term: आत्मनेपद
      en: शी is आत्मनेपदी — the ending is ते, not ति
  - form: मुनये
