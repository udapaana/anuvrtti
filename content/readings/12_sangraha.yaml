- id: ex184
  kind: sangraha
  segment: 155
  order: 1
  sentence: भगवान् वदति। तस्य वचनम् पिता शृणोति। पितरम् पुत्रः पश्यति। दण्डी अपि आगच्छति। दण्डिनम् पितरः पश्यन्ति। भगवतः वचनेन ते तुष्यन्ति। ततः राजानौ अपि आगच्छतः।
  translation: The Blessed One speaks. The father hears his words. The son sees the father. A staff-bearing ascetic also arrives. The fathers see the staff-bearer. By the Blessed One's words they are satisfied. Then the two kings also arrive.
  teaches: |
    three stems, each appearing in both grades within a few clauses: भगवान् then
    भगवतः, दण्डी then दण्डिनम्, पिता then पितरम् then पितरः. राजानौ closes with
    the dual. Nothing about the meaning changes between the two forms of a pair.
  words:
  - form: भगवान्
    lemma: भगवत्
    gloss: the Blessed One
    notes:
    - term: सर्वनामस्थान
      en: the STRONG stem — नुम् augment + lengthening give भगवान्
    - term: प्रथमा
      en: nominative singular
    - cite: "7.1.70"
      role: उगिदचां सर्वनामस्थानेऽधातोः — नुम् in the strong cases → भगवान्
  - form: वदति
    lemma: वद्
    gloss: speaks
    notes:
