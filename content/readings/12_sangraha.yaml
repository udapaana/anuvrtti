    - term: लट्
      en: present plural
  vyakhya: दाता ददाति, दानम् दीयते। कर्ता करोति, करणम् क्रियते। कर्तुः कर्म भिन्नम्।
  vyakhya_en: |
    दाता and दानम् come from the same root by different affixes, and the affix
    is the whole difference: one names the giver, the other the giving. So with
    कर्ता and गमनम्, भोक्ता and पाकः. A कृत् affix does not add a meaning to the
    root so much as decide WHICH PART of the action the new word names — the
    doer, the deed, or the instrument.

    Then कर्ता becomes कर्तारम्. The agent-noun is not a frozen label; it is an
    ऋ-stem noun and declines like पितृ. Both facts are usually met apart from
    each other; here they arrive in one paragraph.

- id: ex181
  kind: sangraha
  segment: 55
  order: 1
  sentence: बालः वने वृकात् बिभेति। सः मात्रे क्रुध्यति, यतः सा तम् वनम् न नयति। मुनिः गिरिम् अधिशेते। बालः मुनये श्लाघते, मुनेः फलेभ्यः च स्पृहयति। मुनिः बालाय फलानि यच्छति। बालाय फलानि रोचन्ते। सः गृहम् आगच्छति, मातुः च न बिभेति।
  translation: In the forest the boy is afraid of a wolf. He is angry at his mother, because she does not take him to the forest. A sage lies upon the mountain. The boy flatters the sage, and longs for the sage's fruits. The sage gives the boy fruits. The fruits please the boy. He comes home, and is no longer afraid of his mother.
  teaches: |
    six verbs that choose their own case, running in one story: भी takes the
    पञ्चमी, क्रुध् and स्पृह् and रुच् and श्लाघ् the चतुर्थी, अधि+शी the
    द्वितीया. वृकात् and मात्रे sit in adjacent clauses — two objects of
    emotion, two different cases — and भी returns later on मातुः.
  words:
  - form: बालः
    lemma: बाल
    gloss: the boy
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: वने
    lemma: वन
    gloss: in the forest
    notes:
    - term: अधिकरण
      en: locus
    - term: सप्तमी
      en: locative
  - form: वृकात्
    lemma: वृक
    gloss: of a wolf (afraid of)
    notes:
    - term: अपादान
      en: the thing feared — treated as what one shrinks away FROM
    - term: पञ्चमी
      en: ablative
    - cite: "1.4.25"
      role: भीत्रार्थानां भयहेतुः — with verbs of fearing, the cause of fear is अपादान → वृकात्
  - form: बिभेति
    lemma: भी
    gloss: is afraid
    notes:
    - term: लट्
      en: present — reduplicated stem बिभे-
  - form: सः
    lemma: तद्
    gloss: he
    notes:
    - term: प्रथमा
      en: nominative
  - form: मात्रे
    lemma: मातृ
    gloss: at his mother
    notes:
    - term: सम्प्रदान
      en: the one angered at — NOT the accusative one might expect
    - term: चतुर्थी
      en: dative
    - cite: "1.4.37"
      role: क्रुधद्रुहोरुपसृष्टयोः… — the target of क्रुध् is सम्प्रदान → मात्रे
  - form: क्रुध्यति
    lemma: क्रुध्
    gloss: is angry
    notes:
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  - form: 'यतः'
    lemma: यतस्
    gloss: because
    vocab: true
    notes:
    - term: अव्यय
      en: indeclinable — subordinating connective
  - form: सा
    lemma: तद्
    gloss: she
    notes:
    - term: प्रथमा
      en: nominative feminine
  - form: तम्
    lemma: तद्
    gloss: him
    notes:
    - term: कर्मन्
      en: object
    - term: द्वितीया
      en: accusative
  - form: वनम्
    lemma: वन
    gloss: to the forest
    notes:
    - term: कर्मन्
      en: goal of motion
    - term: द्वितीया
      en: accusative
  - form: 'न'
    lemma: न
    gloss: not
    vocab: true
    notes:
    - term: अव्यय
      en: negation
  - form: नयति
    lemma: नी
    gloss: leads, takes
    vocab: true
    notes:
    - term: गुण
      en: the root vowel strengthens before शप् — नी → ने → नय्
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present — नी + शप् → गुण ने → नय्
  - form: मुनिः
    lemma: मुनि
    gloss: a sage
    notes:
    - term: कर्तृ
      en: agent — an इ-stem masculine
    - term: प्रथमा
      en: nominative
  - form: गिरिम्
    lemma: गिरि
    gloss: upon the mountain
    notes:
    - term: कर्मन्
      en: the locus turned OBJECT — अधि+शी makes it द्वितीया, not सप्तमी
    - term: द्वितीया
      en: accusative
    - cite: "1.4.46"
      role: अधिशीङ्स्थासां कर्म — with अधि + शी/स्था/आस्, the locus becomes कर्मन् → गिरिम्
  - form: अधिशेते
    lemma: शी
    gloss: lies upon
    notes:
    - term: आत्मनेपद
      en: शी is आत्मनेपदी — the ending is ते, not ति
  - form: मुनये
    lemma: मुनि
    gloss: the sage (flatters)
    notes:
    - term: सम्प्रदान
      en: the one whose favour is courted
    - term: चतुर्थी
      en: dative — इ-stem takes गुण in the oblique, मुनि → मुनये
  - form: श्लाघते
    lemma: श्लाघ्
    gloss: flatters, praises
    notes:
    - term: आत्मनेपद
      en: middle voice
  - form: मुनेः
    lemma: मुनि
    gloss: the sage's
    notes:
    - term: षष्ठी
      en: genitive — a relation, not a कारक
  - form: फलेभ्यः
    lemma: फल
    gloss: for the fruits (longs)
    notes:
    - term: सम्प्रदान
      en: the thing desired — स्पृह् makes its object सम्प्रदान
    - term: चतुर्थी
      en: dative plural
    - cite: "1.4.36"
      role: स्पृहेरीप्सितः — what is longed for is सम्प्रदान → फलेभ्यः
  - form: च
    lemma: च
    gloss: and
    notes:
    - term: अव्यय
      en: indeclinable
  - form: स्पृहयति
    lemma: स्पृह्
    gloss: longs for
    notes:
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  - form: बालाय
    lemma: बाल
    gloss: to the boy
    notes:
    - term: सम्प्रदान
      en: recipient — here the ORDINARY dative, not a special government
    - term: चतुर्थी
      en: dative
  - form: फलानि
    lemma: फल
    gloss: fruits
    notes:
    - cite: "7.1.72"
      role: नपुंसकस्य झलचः — नुम् before the neuter plural ending → फलानि
    - term: कर्मन्
      en: object
    - term: बहुवचन
      en: neuter plural
  - form: यच्छति
    lemma: दा
    gloss: gives
    notes:
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present — दा has the stem यच्छ्
  - form: रोचन्ते
    lemma: रुच्
    gloss: are pleasing
    notes:
    - term: गुण
      en: the root vowel strengthens before शप् — रुच् → रोच्
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present plural — the FRUITS are the agent here, not the boy
    - cite: "1.4.33"
      role: रुच्यर्थानां प्रीयमाणः — the one pleased is सम्प्रदान → बालाय
  - form: गृहम्
    lemma: गृह
    gloss: home
    vocab: true
    notes:
    - term: कर्मन्
      en: goal of motion
    - term: द्वितीया
      en: accusative
  - form: आगच्छति
    lemma: गम्
    gloss: comes
    notes:
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  - form: मातुः
    lemma: मातृ
    gloss: of his mother
    notes:
    - term: अपादान
      en: भी again — a SECOND meeting with the rule, different noun
    - term: पञ्चमी
      en: ablative — ऋ-stem, मातृ → मातुः
  vyakhya: क्रियया विभक्तिः नियम्यते। भीत्रार्थे पञ्चमी, क्रुधार्थे चतुर्थी — एकस्मिन् वाक्ये उभे।
  vyakhya_en: |
    The boy fears the wolf and is angry at his mother in consecutive clauses.
    Both are objects of an emotion; neither takes the accusative; and they take
    DIFFERENT cases — वृकात् ablative, मात्रे dative. Nothing about the nouns
    explains that. Only the verb does.

    That is the whole content of special government, and a sentence like
    बालः वृकेभ्यः बिभेति cannot show it, because with one verb on the page
    there is no choice being made. Here the verb arrives first and the case
    follows from it.

- id: ex180
  kind: sangraha
  segment: 70
  sentence: नरः ग्रामे वसति। तस्य पुत्रः बालः। प्रभाते नरः बालः च वनम् गच्छतः। वने वृक्षाः सन्ति। नरः वृक्षात् फलानि आहरति। बालः फलानि इच्छति। नरः बालाय फलम् यच्छति। बालः फलम् खादति। ततः नरौ ग्रामम् आगच्छतः।
  translation: A man lives in a village. His son is a boy. At dawn the man and the boy go to the forest. In the forest there are trees. The man brings down fruits from a tree. The boy wants the fruits. The man gives the boy a fruit. The boy eats the fruit. Then the two of them come back to the village.
  teaches: |
    the कारकas and the षष्ठी across nine sentences, each in a different clause
    from where it was first met: अधिकरण (ग्रामे, वने, प्रभाते — place and time
    on the same सप्तमी), षष्ठी (तस्य), कर्मन् (वनम्, फलानि, फलम्), अपादान
    (वृक्षात्), सम्प्रदान (बालाय). Singular फलम् against plural फलानि, and the
    dual frames the passage: नरः बालः च … गच्छतः opens, नरौ … आगच्छतः closes.
  words:
  - form: नरः
    lemma: नर
    gloss: a man
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: ग्रामे
    lemma: ग्राम
    gloss: in a village
    notes:
    - term: अधिकरण
      en: locus — where he lives
    - term: सप्तमी
      en: locative
  - form: वसति
    lemma: वस्
    gloss: dwells
    notes:
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  - form: तस्य
    lemma: तद्
    gloss: his
    notes:
    - term: षष्ठी
      en: genitive — a relation, not a कारक
  - form: पुत्रः
    lemma: पुत्र
    gloss: son
    notes:
    - term: प्रथमा
      en: nominative
  - form: बालः
    lemma: बाल
    gloss: (is) a boy
    notes:
    - term: प्रथमा
      en: nominative — a nominal sentence, no verb needed
  - form: प्रभाते
    lemma: प्रभात
    gloss: at dawn
    vocab: true
    notes:
    - term: अधिकरण
      en: locus in TIME — the same सप्तमी that marks place
    - term: सप्तमी
      en: locative
  - form: च
    lemma: च
    gloss: and
    vocab: true
    notes:
    - term: अव्यय
      en: indeclinable — joins two agents, so the verb goes dual
  - form: गच्छतः
    lemma: गम्
    gloss: the two go
    notes:
    - term: द्विवचन
      en: dual verb — two agents joined by च take the तस् ending
  - form: वनम्
    lemma: वन
    gloss: to the forest
    vocab: true
    notes:
    - term: कर्मन्
      en: goal of motion — what the agent reaches
    - term: द्वितीया
      en: accusative
  - form: वने
    lemma: वन
    gloss: in the forest
    notes:
    - term: अधिकरण
      en: locus — now the scene, not the goal
    - term: सप्तमी
      en: locative
  - form: वृक्षाः
    lemma: वृक्ष
    gloss: trees
    notes:
    - term: कर्तृ
      en: agent
    - term: बहुवचन
      en: plural — अ-stem नर-type, so वृक्ष + जस् → वृक्षाः
  - form: सन्ति
    lemma: अस्
    gloss: there are
    vocab: true
    notes:
    - term: लट्
      en: present, 3rd pl.
  - form: वृक्षात्
    lemma: वृक्ष
    gloss: from a tree
    notes:
    - term: अपादान
      en: source — the fixed point departed from
    - term: पञ्चमी
      en: ablative
  - form: फलानि
    lemma: फल
    gloss: fruits
    notes:
    - cite: "7.1.72"
      role: नपुंसकस्य झलचः — नुम् before the neuter plural ending → फलानि
    - term: कर्मन्
      en: object
    - term: बहुवचन
      en: neuter plural — प्रथमा = द्वितीया, so फलानि serves either
  - form: आहरति
    lemma: हृ
    gloss: brings down, fetches
    vocab: true
    notes:
    - term: आ + हृ
      en: "\"carry\" with आ — carry toward"
  - form: इच्छति
    lemma: इष्
    gloss: wants
    vocab: true
    notes:
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  - form: बालाय
    lemma: बाल
    gloss: to the boy
    notes:
    - term: सम्प्रदान
      en: recipient — the one the giving is aimed at
    - term: चतुर्थी
      en: dative
  - form: फलम्
    lemma: फल
    gloss: a fruit
    notes:
    - term: कर्मन्
      en: object — singular now, against the plural फलानि above
    - term: द्वितीया
      en: accusative
  - form: यच्छति
    lemma: दा
    gloss: gives
    notes:
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present — दा has the irregular stem यच्छ्
  - form: खादति
    lemma: खाद्
    gloss: eats
    vocab: true
    notes:
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  - form: ततः
    lemma: ततस्
    gloss: then, thereupon
    vocab: true
    notes:
    - term: अव्यय
      en: indeclinable — narrative connective
  - form: नरौ
    lemma: नर
    gloss: the two (men)
    notes:
    - term: कर्तृ
      en: agent
    - term: द्विवचन
      en: dual — the man and the boy, taken together
    - cite: "1.4.22"
      role: द्व्येकयोर्द्विवचनैकवचने — two of them, so द्विवचन → नरौ
  - form: ग्रामम्
    lemma: ग्राम
    gloss: to the village
    notes:
    - term: कर्मन्
      en: goal of motion
    - term: द्वितीया
      en: accusative
  - form: आगच्छतः
    lemma: गम्
    gloss: the two come back
    notes:
    - term: द्विवचन
      en: dual verb — तस् ending agrees with नरौ, closing the frame
  vyakhya: एकस्मिन् वाक्ये यत् पृथक् दृष्टं तत् अत्र सङ्गतम्। षट् कारकाणि एकस्याम् कथायाम्।
  vyakhya_en: |
    Nothing here is new. Every case, every ending, every rule has been met
    already — but met once each, in a three-word sentence built to display it.
    Here they arrive together, and none of them is the point: ग्रामे is where
    the man lives, not an example of the सप्तमी; वृक्षात् is where the fruit
    comes from, not a demonstration of अपादान.

    That difference is what consolidation means. A rule you have seen once is
    a rule you can recognise when someone points at it. A rule you have read
    four times without noticing is a rule you know.
