  - form: अपि
    lemma: अपि
    gloss: too
    notes:
    - term: अव्यय
      en: indeclinable
  - form: तस्यै
    lemma: तद्
    gloss: to her
    notes:
    - term: सम्प्रदान
      en: recipient
    - term: चतुर्थी
      en: the सर्वनाम dative — स्यै, where a noun would take आय
  - form: गुरुः
    lemma: गुरु
    gloss: the teacher
    notes:
