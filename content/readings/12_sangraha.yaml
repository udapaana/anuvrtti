    - term: चतुर्थी
      en: dative plural
    - cite: "1.4.36"
      role: स्पृहेरीप्सितः — what is longed for is सम्प्रदान → फलेभ्यः
  - form: च
    lemma: च
    gloss: and
    notes:
    - term: अव्यय
      en: indeclinable
  - form: स्पृहयति
    lemma: स्पृह्
    gloss: longs for
    notes:
    - term: लट्
      en: present
  - form: बालाय
    lemma: बाल
    gloss: to the boy
    notes:
    - term: सम्प्रदान
      en: recipient — here the ORDINARY dative, not a special government
    - term: चतुर्थी
      en: dative
  - form: फलानि
    lemma: फल
    gloss: fruits
    notes:
    - term: कर्मन्
      en: object
    - term: बहुवचन
      en: neuter plural
  - form: यच्छति
    lemma: दा
    gloss: gives
    notes:
    - term: लट्
      en: present — दा has the stem यच्छ्
  - form: रोचन्ते
    lemma: रुच्
    gloss: are pleasing
    notes:
    - term: लट्
      en: present plural — the FRUITS are the agent here, not the boy
    - cite: "1.4.33"
      role: रुच्यर्थानां प्रीयमाणः — the one pleased is सम्प्रदान → बालाय
  - form: गृहम्
    lemma: गृह
    gloss: home
    vocab: true
    notes:
    - term: कर्मन्
      en: goal of motion
    - term: द्वितीया
      en: accusative
  - form: आगच्छति
    lemma: गम्
    gloss: comes
    notes:
    - term: लट्
      en: present
  - form: मातुः
    lemma: मातृ
    gloss: of his mother
    notes:
    - term: अपादान
      en: भी again — a SECOND meeting with the rule, different noun
    - term: पञ्चमी
      en: ablative — ऋ-stem, मातृ → मातुः
  vyakhya: क्रियया विभक्तिः नियम्यते। भीत्रार्थे पञ्चमी, क्रुधार्थे चतुर्थी — एकस्मिन् वाक्ये उभे।
  vyakhya_en: |
    The boy fears the wolf and is angry at his mother in consecutive clauses.
    Both are objects of an emotion; neither takes the accusative; and they take
    DIFFERENT cases — वृकात् ablative, मात्रे dative. Nothing about the nouns
    explains that. Only the verb does.

    That is the whole content of special government, and a sentence like
    बालः वृकेभ्यः बिभेति cannot show it, because with one verb on the page
    there is no choice being made. Here the verb arrives first and the case
    follows from it.

- id: ex180
  kind: sangraha
  segment: 70
  sentence: नरः ग्रामे वसति। तस्य पुत्रः बालः। प्रभाते नरः बालः च वनम् गच्छतः। वने वृक्षाः सन्ति। नरः वृक्षात् फलानि आहरति। बालः फलानि इच्छति। नरः बालाय फलम् यच्छति। बालः फलम् खादति। ततः नरौ ग्रामम् आगच्छतः।
  translation: A man lives in a village. His son is a boy. At dawn the man and the boy go to the forest. In the forest there are trees. The man brings down fruits from a tree. The boy wants the fruits. The man gives the boy a fruit. The boy eats the fruit. Then the two of them come back to the village.
  teaches: |
    the कारकas and the षष्ठी across nine sentences, each in a different clause
    from where it was first met: अधिकरण (ग्रामे, वने, प्रभाते — place and time
    on the same सप्तमी), षष्ठी (तस्य), कर्मन् (वनम्, फलानि, फलम्), अपादान
    (वृक्षात्), सम्प्रदान (बालाय). Singular फलम् against plural फलानि, and the
    dual frames the passage: नरः बालः च … गच्छतः opens, नरौ … आगच्छतः closes.
