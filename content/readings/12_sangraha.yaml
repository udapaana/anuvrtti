      en: instrument
    - term: तृतीया
      en: instrumental
  - form: ते
    lemma: तद्
    gloss: they
    notes:
    - term: प्रथमा
      en: nominative plural
  - form: तुष्यन्ति
    lemma: तुष्
    gloss: are satisfied
    vocab: true
    notes:
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present plural
  - form: ततः
    lemma: ततस्
    gloss: then
    notes:
    - term: अव्यय
      en: indeclinable
