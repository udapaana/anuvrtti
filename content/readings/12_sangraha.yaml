# ════════════════════════════════════════════════════════════════════════
#  12_sangraha.yaml — सङ्ग्रह — consolidation passages.
#
#  These are NOT introductions. Every rule in a सङ्ग्रह passage has already
#  been met in a short reading at or below its tier; the passage's job is to
#  make the reader meet those rules AGAIN, at volume, in connected prose —
#  where the rule is scenery rather than the point.
#
#  Why a separate chapter. The reader has two projections of one corpus
#  (chapters = reference view, sequence = difficulty view). A consolidation
#  passage belongs to no single grammatical topic — ex180 exercises all six
#  कारकas plus number plus both padas — so filing it under कारक or सुप्
#  would misreport the reference view. It sits in its own chapter and takes
#  its place in the sequence by `segment` like everything else.
#
#  Authoring rules for this chapter:
#
#    1. NO new load-bearing rules. A passage at tier N may use only rules
#       introduced at tier ≤ N. Check with `bun run ledger` before writing.
#    2. NO new vocabulary, or nearly none. Lexical novelty is the thing that
#       makes real text feel hard; it is handled by glossing, not sequencing.
#       Draw from lemmas the earlier tiers already used.
#    3. LIGHT glossing. The apparatus is the expensive part of authoring and
#       the reason short readings are cheap. Here most words carry a bare
#       identity tag (term/en) and NO cite — they are consolidation, not
#       derivation. Reserve `cite` notes for the two or three words the
#       passage is actually re-teaching. The reader's recall-first display
#       keys focality off the presence of a cite, so light glossing is also
#       what makes most of the passage collapse to bare Devanagari.
#    4. It must read as prose, not as a list of examples. If the sentences
#       could be shuffled without loss, it is a worksheet, not a passage.
#    5. The vyākhyā states what the passage DOES; it never instructs the
#       reader on how to read. "Read this straight through without consulting
#       the glosses" tells someone what to do with their own attention, and
#       four of the first seven passages had a line like it. Say what is on
#       the page — which word recurs, which contrast is live — and let the
#       reader decide how to approach it.
# ════════════════════════════════════════════════════════════════════════

readings:
- id: ex186
  kind: sangraha
  segment: 85
  order: 1
  sentence: रामश्च लक्ष्मणश्च वनमगच्छताम्। तत्रर्षिरुवाच — नमस्ते वीर, सोऽपि धर्मं रक्षति। तयोर्गुरुराच्छादयति वनम्। पुनर्ग्राममागच्छतो नरौ।
  translation: Rāma and Lakṣmaṇa went to the forest. There a sage said — "Homage to you, hero; he too protects dharma." Their teacher covers the forest. The two men come back to the village again.
  teaches: |
    sandhi as it appears in running text, joined and unmarked: रामश्च,
    तत्रर्षिरुवाच, नमस्ते, सोऽपि, तयोर्गुरुराच्छादयति, पुनर्ग्राममागच्छतो.
    Each join is one already met on its own. The word-list carries the
    constituents; the sentence does not.
  words:
  - form: रामश्च
    lemma: राम
    gloss: and Rāma
    notes:
    - term: सन्धि
      en: रामः + च — the visarga becomes श् before a च्-class stop
    - cite: "8.4.40"
      role: स्तोः श्चुना श्चुः — श्चुत्व applied to the visarga-sibilant → रामश्च
  - form: लक्ष्मणश्च
    lemma: लक्ष्मण
    gloss: and Lakṣmaṇa
    notes:
    - term: सन्धि
      en: लक्ष्मणः + च — the same join, immediately repeated
    - term: प्रथमा
      en: nominative
  - form: वनमगच्छताम्
    lemma: वन
    gloss: went to the forest
    notes:
    - term: सन्धि
      en: वनम् + अगच्छताम् — the म् simply carries onto the following vowel
    - term: द्वितीया
      en: वनम् is कर्मन्, goal of motion; अगच्छताम् is dual past (लङ्)
  - form: तत्रर्षिरुवाच
    lemma: ऋषि
    gloss: there a sage said
    notes:
    - term: सन्धि
      en: तत्र + ऋषिः + उवाच — अ + ऋ merge, then the visarga of ऋषिः → र्
    - cite: "6.1.101"
      role: अकः सवर्णे दीर्घः — तत्र + ऋषिः gives तत्रर्षिः
  - form: नमस्ते
    lemma: नमस्
    gloss: homage to you
    notes:
    - term: सन्धि
      en: नमः + ते — the visarga becomes स् before a त्-class stop
    - term: चतुर्थी
      en: ते is dative — नमस् governs the चतुर्थी
  - form: वीर
    lemma: वीर
    gloss: O hero
    vocab: true
    notes:
    - term: सम्बोधन
      en: vocative — the one addressed
  - form: सोऽपि
    lemma: तद्
    gloss: he too
    notes:
    - term: सन्धि
      en: सः + अपि — visarga → ओ, and the अ of अपि elides, marked by ऽ
    - cite: "6.1.113"
      role: अतो रोरप्लुतादप्लुते — रु → उ, then गुण gives सो, and अपि loses its अ
  - form: धर्मं
    lemma: धर्म
    gloss: dharma
    notes:
    - term: कर्मन्
      en: object
    - term: द्वितीया
      en: accusative — written with anusvāra before the following र्
  - form: रक्षति
    lemma: रक्ष्
    gloss: protects
    vocab: true
    notes:
    - term: लट्
      en: present
  - form: तयोर्गुरुराच्छादयति
    lemma: गुरु
    gloss: their teacher covers
    notes:
    - term: सन्धि
      en: तयोः + गुरुः + आच्छादयति — two visargas → र्, then आ + छ doubles the छ
    - cite: "6.1.73"
      role: छे च — a short vowel before छ takes the तुक् augment → आच्छादयति
  - form: वनम्
    lemma: वन
    gloss: the forest
    notes:
    - term: कर्मन्
      en: object
    - term: द्वितीया
      en: accusative
  - form: पुनर्ग्राममागच्छतो
    lemma: ग्राम
    gloss: come back to the village again
    notes:
    - term: सन्धि
      en: पुनः + ग्रामम् + आगच्छतः — visarga → र्, then final visarga → ओ before न्
    - cite: "8.3.15"
      role: खरवसानयोर्विसर्जनीयः — the रु/visarga alternation running twice in one word-group
  - form: नरौ
    lemma: नर
    gloss: the two men
    notes:
    - term: द्विवचन
      en: nominative dual — agreeing with the dual verb आगच्छतः
  vyakhya: सन्धिः पदच्छेदे ज्ञायते, न तु योजने। यत् पठसि तत् विभज।
  vyakhya_en: |
    A sandhi rule is usually shown from the pieces inward: रामः + च, and watch
    them join. Text runs the other way. It gives you रामश्च and तत्रर्षिरुवाच
    whole, and the work is taking them apart. That is पदच्छेद — sandhi is not
    something performed in writing so much as undone in reading.

    Nothing in the sentence is marked. The joins are easier to hear than to
    see — रामश्च and पुनर्ग्राममागच्छतो resolve on the tongue before they
    resolve on the page. The word-list carries the constituents for the ones
    that don't.

- id: ex182
  kind: sangraha
  segment: 15
  order: 1
  sentence: नरः ग्रामे वसति। नरस्य पुत्रः बालः। नरः ग्रामात् गच्छति। सः पादाभ्याम् गच्छति। वृक्षात् फलम् पतति। नरः फलम् बालाय यच्छति। ततः नरः ग्रामम् आगच्छति।
  translation: A man lives in a village. The man's son is a boy. The man goes from the village. He goes on foot. A fruit falls from a tree. The man gives the fruit to the boy. Then the man comes back to the village.
  teaches: |
    the six कारकas together, after meeting them one at a time. ग्राम appears
    in three cases — ग्रामे, ग्रामात्, ग्रामम् — and every noun and verb here
    has been seen before. Singular throughout; only वृक्षात् and पतति are new
    vocabulary.
  words:
  - form: नरः
    lemma: नर
    gloss: a man
    notes:
    - term: कर्तृ
      en: agent — the one acting on its own
    - term: प्रथमा
      en: nominative
  - form: ग्रामे
    lemma: ग्राम
    gloss: in the village
    notes:
    - term: अधिकरण
      en: locus — where the action sits
    - term: सप्तमी
      en: locative
  - form: वसति
    lemma: वस्
    gloss: dwells, lives
    notes:
    - term: लट्
      en: present
  - form: नरस्य
    lemma: नर
    gloss: the man's
    notes:
    - term: षष्ठी
      en: genitive — a relation between two nouns, NOT one of the six कारकas
  - form: पुत्रः
    lemma: पुत्र
    gloss: son
    notes:
    - term: प्रथमा
      en: nominative
  - form: बालः
    lemma: बाल
    gloss: (is) a boy
    notes:
    - term: प्रथमा
      en: nominative — two nominatives, no verb; the sentence equates them
  - form: ग्रामात्
    lemma: ग्राम
    gloss: from the village
    notes:
    - term: अपादान
      en: source — the fixed point moved away from
    - term: पञ्चमी
      en: ablative
  - form: गच्छति
    lemma: गम्
    gloss: goes
    notes:
    - term: लट्
      en: present
  - form: सः
    lemma: तद्
    gloss: he
    vocab: true
    notes:
    - term: प्रथमा
      en: nominative — stands in for नरः, so the sentence need not repeat it
  - form: पादाभ्याम्
    lemma: पाद
    gloss: on foot (lit. by the two feet)
    notes:
    - term: करण
      en: instrument — the means by which the going happens
    - term: तृतीया
      en: instrumental
  - form: वृक्षात्
    lemma: वृक्ष
    gloss: from a tree
    vocab: true
    notes:
    - term: अपादान
      en: source again — same rule, different noun and different verb
    - term: पञ्चमी
      en: ablative
  - form: फलम्
    lemma: फल
    gloss: a fruit
    notes:
    - term: कर्तृ
      en: agent here — the fruit is what falls
    - term: प्रथमा
      en: neuter nominative — फलम् serves as both प्रथमा and द्वितीया
  - form: पतति
    lemma: पत्
    gloss: falls
    vocab: true
    notes:
    - term: लट्
      en: present
  - form: बालाय
    lemma: बाल
    gloss: to the boy
    notes:
    - term: सम्प्रदान
      en: recipient — the one the giving is aimed at
    - term: चतुर्थी
      en: dative
  - form: यच्छति
    lemma: दा
    gloss: gives
    notes:
    - term: लट्
      en: present — दा appears as the stem यच्छ्
  - form: ततः
    lemma: ततस्
    gloss: then
    vocab: true
    notes:
    - term: अव्यय
      en: indeclinable — a narrative connective, takes no ending
  - form: ग्रामम्
    lemma: ग्राम
    gloss: to the village
    notes:
    - term: कर्मन्
      en: goal of motion — what the agent reaches
    - term: द्वितीया
      en: accusative
  - form: आगच्छति
    lemma: गम्
    gloss: comes back
    notes:
    - term: लट्
      en: present — आ reverses the direction of गम्
  vyakhya: एकं ग्रामपदम् — त्रिषु विभक्तिषु। ग्रामे, ग्रामात्, ग्रामम्।
  vyakhya_en: |
    ग्राम appears three times: ग्रामे where the man lives, ग्रामात् where he
    leaves from, ग्रामम् where he returns to. One noun, three endings, and the
    ending alone says which relation the village has to the verb. That is what
    a कारक is — not a meaning the word carries, but a role the sentence
    assigns it.

    Each of these had its own sentence when it was introduced, one per rule.
    Together, the endings carry the whole difference.

