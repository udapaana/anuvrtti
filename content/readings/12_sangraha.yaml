# ════════════════════════════════════════════════════════════════════════
#  12_sangraha.yaml — सङ्ग्रह — consolidation passages.
#
#  These are NOT introductions. Every rule in a सङ्ग्रह passage has already
#  been met in a short reading at or below its tier; the passage's job is to
#  make the reader meet those rules AGAIN, at volume, in connected prose —
#  where the rule is scenery rather than the point.
#
#  Why a separate chapter. The reader has two projections of one corpus
#  (chapters = reference view, sequence = difficulty view). A consolidation
#  passage belongs to no single grammatical topic — ex180 exercises all six
#  कारकas plus number plus both padas — so filing it under कारक or सुप्
#  would misreport the reference view. It sits in its own chapter and takes
#  its place in the sequence by `segment` like everything else.
#
#  Authoring rules for this chapter:
#
#    1. NO new load-bearing rules. A passage at tier N may use only rules
#       introduced at tier ≤ N. Check with `bun run ledger` before writing.
#    2. NO new vocabulary, or nearly none. Lexical novelty is the thing that
#       makes real text feel hard; it is handled by glossing, not sequencing.
#       Draw from lemmas the earlier tiers already used.
#    3. LIGHT glossing. The apparatus is the expensive part of authoring and
#       the reason short readings are cheap. Here most words carry a bare
#       identity tag (term/en) and NO cite — they are consolidation, not
#       derivation. Reserve `cite` notes for the two or three words the
#       passage is actually re-teaching. The reader's recall-first display
#       keys focality off the presence of a cite, so light glossing is also
#       what makes most of the passage collapse to bare Devanagari.
#    4. It must read as prose, not as a list of examples. If the sentences
#       could be shuffled without loss, it is a worksheet, not a passage.
# ════════════════════════════════════════════════════════════════════════

readings:
- id: ex186
  kind: sangraha
  segment: 85
  order: 1
  sentence: रामश्च लक्ष्मणश्च वनमगच्छताम्। तत्रर्षिरुवाच — नमस्ते वीर, सोऽपि धर्मं रक्षति। तयोर्गुरुराच्छादयति वनम्। पुनर्ग्राममागच्छतो नरौ।
  translation: Rāma and Lakṣmaṇa went to the forest. There a sage said — "Homage to you, hero; he too protects dharma." Their teacher covers the forest. The two men come back to the village again.
  teaches: |
    सङ्ग्रह for tier 80 — sandhi, and the ONE tier whose short readings cannot
    do their own job. The tier-80 readings are written as transformations:
    रामः च लक्ष्मणः च → रामश्च लक्ष्मणश्च. That display shows the mechanism
    perfectly and hides the only skill that matters, because the reader is
    given the un-joined form and asked to watch it join. In real text no one
    hands you दधि इन्द्रः; you meet दधीन्द्रः and must undo it.

    So this passage is written WITH the sandhi applied and nothing marked. Each
    word here is a join the reader met at tier 80, now unannounced: रामश्च
    (visarga → श् before च्), तत्रर्षिः (सवर्णदीर्घ, अ + ऋ), उवाच+नमस्ते
    (visarga → स् before त्), सोऽपि (visarga → ओ, with अवग्रह), तयोर्गुरुः
    (visarga → र्), आच्छादयति (छ-doubling), पुनर्ग्रामम् (the र्-outcome),
    आगच्छतो नरौ (visarga → ओ again, across a word boundary).

    The `words` table gives each joined form with its constituents, so the
    reader who stalls can see the seam — but the sentence itself never shows
    it. This is the format every sandhi consolidation should take.
  words:
  - form: रामश्च
    lemma: राम
    gloss: and Rāma
    notes:
    - term: सन्धि
      en: रामः + च — the visarga becomes श् before a च्-class stop
    - cite: "8.4.40"
      role: स्तोः श्चुना श्चुः — श्चुत्व applied to the visarga-sibilant → रामश्च
  - form: लक्ष्मणश्च
    lemma: लक्ष्मण
    gloss: and Lakṣmaṇa
    notes:
    - term: सन्धि
      en: लक्ष्मणः + च — the same join, immediately repeated
    - term: प्रथमा
      en: nominative
  - form: वनमगच्छताम्
    lemma: वन
    gloss: went to the forest
    notes:
    - term: सन्धि
      en: वनम् + अगच्छताम् — the म् simply carries onto the following vowel
    - term: द्वितीया
      en: वनम् is कर्मन्, goal of motion; अगच्छताम् is dual past (लङ्)
  - form: तत्रर्षिरुवाच
    lemma: ऋषि
    gloss: there a sage said
    notes:
    - term: सन्धि
      en: तत्र + ऋषिः + उवाच — अ + ऋ merge, then the visarga of ऋषिः → र्
    - cite: "6.1.101"
      role: अकः सवर्णे दीर्घः — तत्र + ऋषिः gives तत्रर्षिः
  - form: नमस्ते
    lemma: नमस्
    gloss: homage to you
    notes:
    - term: सन्धि
      en: नमः + ते — the visarga becomes स् before a त्-class stop
    - term: चतुर्थी
      en: ते is dative — नमस् governs the चतुर्थी
  - form: वीर
    lemma: वीर
    gloss: O hero
    vocab: true
    notes:
    - term: सम्बोधन
      en: vocative — the one addressed
  - form: सोऽपि
    lemma: तद्
    gloss: he too
    notes:
    - term: सन्धि
      en: सः + अपि — visarga → ओ, and the अ of अपि elides, marked by ऽ
    - cite: "6.1.113"
      role: अतो रोरप्लुतादप्लुते — रु → उ, then गुण gives सो, and अपि loses its अ
  - form: धर्मं
    lemma: धर्म
    gloss: dharma
    notes:
    - term: कर्मन्
      en: object
    - term: द्वितीया
      en: accusative — written with anusvāra before the following र्
  - form: रक्षति
    lemma: रक्ष्
    gloss: protects
    vocab: true
    notes:
    - term: लट्
      en: present
  - form: तयोर्गुरुराच्छादयति
    lemma: गुरु
    gloss: their teacher covers
    notes:
    - term: सन्धि
      en: तयोः + गुरुः + आच्छादयति — two visargas → र्, then आ + छ doubles the छ
    - cite: "6.1.73"
      role: छे च — a short vowel before छ takes the तुक् augment → आच्छादयति
  - form: वनम्
    lemma: वन
    gloss: the forest
    notes:
    - term: कर्मन्
      en: object
    - term: द्वितीया
      en: accusative
  - form: पुनर्ग्राममागच्छतो
    lemma: ग्राम
    gloss: come back to the village again
    notes:
    - term: सन्धि
      en: पुनः + ग्रामम् + आगच्छतः — visarga → र्, then final visarga → ओ before न्
    - cite: "8.3.15"
      role: खरवसानयोर्विसर्जनीयः — the रु/visarga alternation running twice in one word-group
  - form: नरौ
    lemma: नर
    gloss: the two men
    notes:
    - term: द्विवचन
      en: nominative dual — agreeing with the dual verb आगच्छतः
  vyakhya: सन्धिः पदच्छेदे ज्ञायते, न तु योजने। यत् पठसि तत् विभज।
  vyakhya_en: |
    Every tier-80 reading hands you the pieces and shows them joining. Real
    text does the opposite: it hands you रामश्च and तत्रर्षिरुवाच, and the work
    is to take them apart. That is पदच्छेद, and it is the actual skill — sandhi
    is not something you perform when writing, it is something you undo when
    reading.

    Nothing in this passage is marked. Read it aloud first; the joins are
    easier to hear than to see. Where you stall, the word-list below gives the
    constituents — but try the seam yourself before looking, because looking is
    what the tier-80 readings already let you do.

- id: ex182
  kind: sangraha
  segment: 15
  order: 1
  sentence: नरः ग्रामे वसति। नरस्य पुत्रः बालः। नरः ग्रामात् गच्छति। सः पादाभ्याम् गच्छति। वृक्षात् फलम् पतति। नरः फलम् बालाय यच्छति। ततः नरः ग्रामम् आगच्छति।
  translation: A man lives in a village. The man's son is a boy. The man goes from the village. He goes on foot. A fruit falls from a tree. The man gives the fruit to the boy. Then the man comes back to the village.
  teaches: |
    सङ्ग्रह for tier 10 — the very first passage a reader meets. Tier 10 is the
    six कारकas introduced one per sentence (ex001-007), each sentence differing
    from the last by exactly one word. That design makes each role visible, but
    it also means the reader has never seen two roles cooperate.

    Here all seven recur with no new grammar and almost no new vocabulary:
    every noun (नर, ग्राम, पुत्र, बाल, फल) and every verb (वस्, गम्, आगम्, दा)
    comes from tier 10 itself. Only वृक्षात् and पतति are new, and both are
    glossed as vocabulary. Singular throughout — number arrives at tier 30, so
    a dual or plural here would be a rule the reader has not met.
  words:
  - form: नरः
    lemma: नर
    gloss: a man
    notes:
    - term: कर्तृ
      en: agent — the one acting on its own
    - term: प्रथमा
      en: nominative
  - form: ग्रामे
    lemma: ग्राम
    gloss: in the village
    notes:
    - term: अधिकरण
      en: locus — where the action sits
    - term: सप्तमी
      en: locative
  - form: वसति
    lemma: वस्
    gloss: dwells, lives
    notes:
    - term: लट्
      en: present
  - form: नरस्य
    lemma: नर
    gloss: the man's
    notes:
    - term: षष्ठी
      en: genitive — a relation between two nouns, NOT one of the six कारकas
  - form: पुत्रः
    lemma: पुत्र
    gloss: son
    notes:
    - term: प्रथमा
      en: nominative
  - form: बालः
    lemma: बाल
    gloss: (is) a boy
    notes:
    - term: प्रथमा
      en: nominative — two nominatives, no verb; the sentence equates them
  - form: ग्रामात्
    lemma: ग्राम
    gloss: from the village
    notes:
    - term: अपादान
      en: source — the fixed point moved away from
    - term: पञ्चमी
      en: ablative
  - form: गच्छति
    lemma: गम्
    gloss: goes
    notes:
    - term: लट्
      en: present
  - form: सः
    lemma: तद्
    gloss: he
    vocab: true
    notes:
    - term: प्रथमा
      en: nominative — stands in for नरः, so the sentence need not repeat it
  - form: पादाभ्याम्
    lemma: पाद
    gloss: on foot (lit. by the two feet)
    notes:
    - term: करण
      en: instrument — the means by which the going happens
    - term: तृतीया
      en: instrumental
  - form: वृक्षात्
    lemma: वृक्ष
    gloss: from a tree
    vocab: true
    notes:
    - term: अपादान
      en: source again — same rule, different noun and different verb
    - term: पञ्चमी
      en: ablative
  - form: फलम्
    lemma: फल
    gloss: a fruit
    notes:
    - term: कर्तृ
      en: agent here — the fruit is what falls
    - term: प्रथमा
      en: neuter nominative — फलम् serves as both प्रथमा and द्वितीया
  - form: पतति
    lemma: पत्
    gloss: falls
    vocab: true
    notes:
    - term: लट्
      en: present
  - form: बालाय
    lemma: बाल
    gloss: to the boy
    notes:
    - term: सम्प्रदान
      en: recipient — the one the giving is aimed at
    - term: चतुर्थी
      en: dative
  - form: यच्छति
    lemma: दा
    gloss: gives
    notes:
    - term: लट्
      en: present — दा appears as the stem यच्छ्
  - form: ततः
    lemma: ततस्
    gloss: then
    vocab: true
    notes:
    - term: अव्यय
      en: indeclinable — a narrative connective, takes no ending
  - form: ग्रामम्
    lemma: ग्राम
    gloss: to the village
    notes:
    - term: कर्मन्
      en: goal of motion — what the agent reaches
    - term: द्वितीया
      en: accusative
  - form: आगच्छति
    lemma: गम्
    gloss: comes back
    notes:
    - term: लट्
      en: present — आ reverses the direction of गम्
  vyakhya: एकं ग्रामपदम् — त्रिषु विभक्तिषु। ग्रामे, ग्रामात्, ग्रामम्।
  vyakhya_en: |
    Watch one word. ग्राम appears three times: ग्रामे where the man lives,
    ग्रामात् where he leaves from, ग्रामम् where he returns to. One noun,
    three endings, and the ending alone says which relation the village has to
    the verb. That is what a कारक is — not a meaning the word carries, but a
    role the sentence assigns it.

    In tier 10 each of these appeared in its own sentence, one per rule. Read
    them together here and the endings start doing their real work.

- id: ex183
  kind: sangraha
  segment: 115
  order: 1
  sentence: तापसः गिरौ वसति। जटाभिः सः तापसः ज्ञायते। अन्नस्य हेतोः बालः तम् गच्छति। पुत्रेण सह सः आगच्छति। धनेन न सुखम्, धर्मेण सुखम् इति तापसः वदति। गवाम् स्वामी नृपः अपि तम् शृणोति।
  translation: An ascetic lives on a mountain. By his matted hair he is recognized as an ascetic. For the sake of food a boy goes to him. He comes with his son. "Happiness is not from wealth; happiness is from dharma," says the ascetic. Even the king, lord of cattle, listens to him.
  teaches: |
    सङ्ग्रह for tier 110 — the तृतीया/idiom cluster. Tier 110 collects the
    non-कारक uses of the instrumental and the word-government idioms (सह,
    हेतु, इत्थंभूतलक्षण, स्वामि-ईश्वर, अन्तरेण), each in a two- or three-word
    reading. Several of those readings are fragments rather than sentences —
    धनेन कुलम्, जटाभिः तापसः — which show the case but give the reader nothing
    to read.

    Here the same idioms carry a scene: जटाभिः as the MARK of recognition
    (2.3.21), हेतोः with its noun in the षष्ठी (2.3.26), सह with the तृतीया
    (2.3.19), स्वामी governing गवाम् (2.3.39). धनेन and धर्मेण sit in one
    sentence as parallel causes so the हेतु-instrumental is felt as a contrast
    rather than a label.
  words:
  - form: तापसः
    lemma: तापस
    gloss: an ascetic
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: गिरौ
    lemma: गिरि
    gloss: on the mountain
    notes:
    - term: अधिकरण
      en: locus
    - term: सप्तमी
      en: locative — इ-stem, गिरि → गिरौ
  - form: वसति
    lemma: वस्
    gloss: lives
    notes:
    - term: लट्
      en: present
  - form: जटाभिः
    lemma: जटा
    gloss: by his matted hair
    notes:
    - term: इत्थंभूतलक्षण
      en: the MARK by which someone is recognized — not an instrument proper
    - term: तृतीया
      en: instrumental plural
    - cite: "2.3.21"
      role: इत्थंभूतलक्षणे — the identifying mark takes तृतीया → जटाभिः
  - form: सः
    lemma: तद्
    gloss: he
    notes:
    - term: प्रथमा
      en: nominative
  - form: ज्ञायते
    lemma: ज्ञा
    gloss: is recognized
    vocab: true
    notes:
    - term: कर्मणि
      en: passive — the ascetic is what is known, not the knower
  - form: अन्नस्य
    lemma: अन्न
    gloss: of food
    notes:
    - term: षष्ठी
      en: genitive — with हेतोः, BOTH words stand in the षष्ठी
    - cite: "2.3.26"
      role: षष्ठी हेतुप्रयोगे — when हेतु is used, the cause takes षष्ठी → अन्नस्य हेतोः
  - form: हेतोः
    lemma: हेतु
    gloss: for the sake of
    notes:
    - term: षष्ठी
      en: genitive — agreeing with अन्नस्य
  - form: बालः
    lemma: बाल
    gloss: a boy
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: तम्
    lemma: तद्
    gloss: to him
    notes:
    - term: कर्मन्
      en: goal of motion
    - term: द्वितीया
      en: accusative
  - form: गच्छति
    lemma: गम्
    gloss: goes
    notes:
    - term: लट्
      en: present
  - form: पुत्रेण
    lemma: पुत्र
    gloss: with his son
    notes:
    - term: सहार्थ
      en: the accompanying (subordinate) party
    - term: तृतीया
      en: instrumental
    - cite: "2.3.19"
      role: सहयुक्तेऽप्रधाने — the accompanying party takes तृतीया → पुत्रेण सह
  - form: सह
    lemma: सह
    gloss: with
    notes:
    - term: अव्यय
      en: indeclinable governing the तृतीया
  - form: आगच्छति
    lemma: गम्
    gloss: comes
    notes:
    - term: लट्
      en: present
  - form: धनेन
    lemma: धन
    gloss: from wealth
    notes:
    - term: हेतु
      en: cause — the तृतीया of motive, not of instrument
    - term: तृतीया
      en: instrumental
  - form: 'न'
    lemma: न
    gloss: not
    notes:
    - term: अव्यय
      en: negation
  - form: सुखम्
    lemma: सुख
    gloss: happiness
    vocab: true
    notes:
    - term: प्रथमा
      en: neuter nominative
  - form: धर्मेण
    lemma: धर्म
    gloss: from dharma
    notes:
    - term: हेतु
      en: the same cause-instrumental, set against धनेन
    - term: तृतीया
      en: instrumental
  - form: इति
    lemma: इति
    gloss: "thus (closes a quotation)"
    vocab: true
    notes:
    - term: अव्यय
      en: indeclinable — marks the end of reported speech
  - form: वदति
    lemma: वद्
    gloss: says
    notes:
    - term: लट्
      en: present
  - form: गवाम्
    lemma: गो
    gloss: of cattle
    notes:
    - term: षष्ठी
      en: genitive plural — what is owned stands in the षष्ठी
    - cite: "2.3.39"
      role: स्वामीश्वराधिपति… — with "lord/owner" words the thing owned takes षष्ठी → गवाम् स्वामी
  - form: स्वामी
    lemma: स्वामिन्
    gloss: lord, owner
    notes:
    - term: प्रथमा
      en: nominative — इन्-stem, न् drops in the nom.sg
  - form: नृपः
    lemma: नृप
    gloss: the king
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: अपि
    lemma: अपि
    gloss: even, also
    vocab: true
    notes:
    - term: अव्यय
      en: indeclinable
  - form: शृणोति
    lemma: श्रु
    gloss: listens to
    vocab: true
    notes:
    - term: लट्
      en: present — श्रु takes the श्नु विकरण, श्रु → शृणो

- id: ex184
  kind: sangraha
  segment: 155
  order: 1
  sentence: भगवान् वदति। तस्य वचनम् पिता शृणोति। पितरम् पुत्रः पश्यति। दण्डी अपि आगच्छति। दण्डिनम् पितरः पश्यन्ति। भगवतः वचनेन ते तुष्यन्ति। ततः राजानौ अपि आगच्छतः।
  translation: The Blessed One speaks. The father hears his words. The son sees the father. A staff-bearing ascetic also arrives. The fathers see the staff-bearer. By the Blessed One's words they are satisfied. Then the two kings also arrive.
  teaches: |
    सङ्ग्रह for tier 150 — the strong/weak stem alternation. Tier 150 teaches
    it through minimal pairs presented separately: भगवान्/भगवतः, दण्डी/दण्डिनम्,
    पिता/पितरम्, राजानौ/राज्ञा. Each pair is exactly right for showing the
    alternation, and exactly wrong for internalising it, because the two forms
    never appear in the same breath.

    Here each stem shows BOTH grades within a few clauses: भगवान् (strong,
    nom.sg) then भगवतः (weak, gen.sg); दण्डी (strong) then दण्डिनम् (weak);
    पिता (strong sg) then पितरम् (strong acc) then पितरः (strong pl). The
    reader meets the alternation as a fact about how the word moves through a
    story, not as a table.
  words:
  - form: भगवान्
    lemma: भगवत्
    gloss: the Blessed One
    notes:
    - term: सर्वनामस्थान
      en: the STRONG stem — नुम् augment + lengthening give भगवान्
    - term: प्रथमा
      en: nominative singular
    - cite: "7.1.70"
      role: उगिदचां सर्वनामस्थानेऽधातोः — नुम् in the strong cases → भगवान्
  - form: वदति
    lemma: वद्
    gloss: speaks
    notes:
    - term: लट्
      en: present
  - form: तस्य
    lemma: तद्
    gloss: his
    notes:
    - term: षष्ठी
      en: genitive
  - form: वचनम्
    lemma: वचन
    gloss: the words
    notes:
    - term: कर्मन्
      en: object
    - term: द्वितीया
      en: neuter accusative
  - form: पिता
    lemma: पितृ
    gloss: the father
    notes:
    - term: कर्तृ
      en: agent — ऋ-stem strong nom.sg, ऋ → आ
    - term: प्रथमा
      en: nominative
  - form: शृणोति
    lemma: श्रु
    gloss: hears
    notes:
    - term: लट्
      en: present
  - form: पितरम्
    lemma: पितृ
    gloss: the father (obj.)
    notes:
    - term: सर्वनामस्थान
      en: strong stem पितर् — the SAME word as पिता, one clause later
    - term: द्वितीया
      en: accusative
  - form: पुत्रः
    lemma: पुत्र
    gloss: the son
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: पश्यति
    lemma: दृश्
    gloss: sees
    notes:
    - term: लट्
      en: present — दृश् appears as पश्य्
  - form: दण्डी
    lemma: दण्डिन्
    gloss: a staff-bearer
    notes:
    - term: सर्वनामस्थान
      en: strong nom.sg — the न् of दण्डिन् drops and the इ lengthens
    - term: प्रथमा
      en: nominative
  - form: अपि
    lemma: अपि
    gloss: also
    notes:
    - term: अव्यय
      en: indeclinable
  - form: आगच्छति
    lemma: गम्
    gloss: arrives
    notes:
    - term: लट्
      en: present
  - form: दण्डिनम्
    lemma: दण्डिन्
    gloss: the staff-bearer (obj.)
    notes:
    - term: कर्मन्
      en: the न् RETURNS before a vowel ending — the foil to दण्डी above
    - term: द्वितीया
      en: accusative
  - form: पितरः
    lemma: पितृ
    gloss: the fathers
    notes:
    - term: सर्वनामस्थान
      en: strong plural — गुण अर्, a third grade of the same stem
    - term: बहुवचन
      en: nominative plural
  - form: पश्यन्ति
    lemma: दृश्
    gloss: see
    notes:
    - term: लट्
      en: present plural
  - form: भगवतः
    lemma: भगवत्
    gloss: the Blessed One's
    notes:
    - term: षष्ठी
      en: the WEAK stem — plain भगवत् + ङस्, no नुम्; contrast भगवान् above
  - form: वचनेन
    lemma: वचन
    gloss: by the words
    notes:
    - term: करण
      en: instrument
    - term: तृतीया
      en: instrumental
  - form: ते
    lemma: तद्
    gloss: they
    notes:
    - term: प्रथमा
      en: nominative plural
  - form: तुष्यन्ति
    lemma: तुष्
    gloss: are satisfied
    vocab: true
    notes:
    - term: लट्
      en: present plural
  - form: ततः
    lemma: ततस्
    gloss: then
    notes:
    - term: अव्यय
      en: indeclinable
  - form: राजानौ
    lemma: राजन्
    gloss: the two kings
    notes:
    - term: सर्वनामस्थान
      en: strong DUAL — राजन् lengthens to राजान् before the dual ending
    - term: द्विवचन
      en: nominative dual
  - form: आगच्छतः
    lemma: गम्
    gloss: the two arrive
    notes:
    - term: द्विवचन
      en: dual verb agreeing with राजानौ
  vyakhya: एकं पदम् — बलवत् दुर्बलं च। भगवान् भगवतः, दण्डी दण्डिनम्, पिता पितरम्।
  vyakhya_en: |
    Three stems, each appearing twice, each time in a different grade:
    भगवान् / भगवतः, दण्डी / दण्डिनम्, पिता / पितरम् / पितरः. Nothing about the
    meaning changes between the two forms of a pair — भगवान् and भगवतः are the
    same person. What changes is the ending attached, and whether that ending
    belongs to the सर्वनामस्थान (strong) set.

    Presented as a minimal pair, this looks like an irregularity to memorise.
    Read in a story, it is simply what the word does.

- id: ex185
  kind: sangraha
  segment: 215
  order: 1
  sentence: यः अन्नम् ददाति सः दाता। दानम् तस्य धर्मः। नित्यम् कर्ता सः नरः, न तु भोक्ता। गमनम् आरभते, ग्रामम् गामी भवति। तस्य पाकः अपि रोचते। कर्तारम् तम् जनाः पश्यन्ति।
  translation: He who gives food is a giver. Giving is his dharma. That man is a constant doer, not an enjoyer. He begins the going, becomes a goer to the village. His cooking, too, is pleasing. People see him as the doer.
  teaches: |
    सङ्ग्रह for tier 210 — the कृत् affix reference-fill. Tier 210 isolates one
    affix per reading (तृच् दाता, तृन् कर्ता, णिनि गामी, घञ् पाकः, अच् जयः,
    ल्युट् गमनम्), which is the right shape for a reference and the wrong shape
    for reading: the reader learns six affixes and never sees an agent-noun and
    an action-noun in the same sentence, where the DIFFERENCE is what matters.

    Here agent-nouns (दाता, कर्ता, भोक्ता, गामी) and action-nouns (दानम्,
    गमनम्, पाकः) alternate, so the contrast is doing the work: दाता is the one
    who gives, दानम् is the giving. कर्ता then declines into कर्तारम्, showing
    that the तृच् agent-noun is itself an ऋ-stem — the point ex164 makes as a
    bare paradigm list.
  words:
  - form: 'यः'
    lemma: यद्
    gloss: he who
    notes:
    - term: प्रथमा
      en: nominative — the relative, answered by सः
  - form: अन्नम्
    lemma: अन्न
    gloss: food
    notes:
    - term: कर्मन्
      en: object
    - term: द्वितीया
      en: accusative
  - form: ददाति
    lemma: दा
    gloss: gives
    notes:
    - term: लट्
      en: present — reduplicated दा → ददा
  - form: सः
    lemma: तद्
    gloss: he
    notes:
    - term: प्रथमा
      en: nominative — answers यः
  - form: दाता
    lemma: दातृ
    gloss: a giver
    notes:
    - term: तृच्
      en: agent-noun from दा — the one who does the action
    - cite: "3.1.133"
      role: ण्वुल्तृचौ — तृच् forms the agent-noun दातृ → दाता
  - form: दानम्
    lemma: दान
    gloss: giving
    notes:
    - term: भाव
      en: action-noun — the ACT, not the actor; set directly against दाता
    - term: प्रथमा
      en: neuter nominative
  - form: तस्य
    lemma: तद्
    gloss: his
    notes:
    - term: षष्ठी
      en: genitive
  - form: धर्मः
    lemma: धर्म
    gloss: dharma, duty
    notes:
    - term: प्रथमा
      en: nominative
  - form: नित्यम्
    lemma: नित्य
    gloss: constantly
    notes:
    - term: अव्यय
      en: adverbial accusative — "as a habit"
  - form: कर्ता
    lemma: कर्तृ
    gloss: a doer
    notes:
    - term: तृन्
      en: the HABITUAL agent — तृन्, not तृच्; the habit is what नित्यम् marks
    - term: प्रथमा
      en: nominative
  - form: नरः
    lemma: नर
    gloss: man
    notes:
    - term: प्रथमा
      en: nominative
  - form: 'न'
    lemma: न
    gloss: not
    notes:
    - term: अव्यय
      en: negation
  - form: तु
    lemma: तु
    gloss: but
    vocab: true
    notes:
    - term: अव्यय
      en: indeclinable — adversative
  - form: भोक्ता
    lemma: भोक्तृ
    gloss: an enjoyer
    vocab: true
    notes:
    - term: तृच्
      en: another agent-noun, from भुज् — same affix, different root
    - term: प्रथमा
      en: nominative
  - form: गमनम्
    lemma: गमन
    gloss: the going
    notes:
    - term: ल्युट्
      en: action-noun in -अन from गम् — the going, not the goer
    - cite: "3.3.115"
      role: ल्युट् च — ल्युट् makes a neuter भाव action-noun → गमनम्
  - form: आरभते
    lemma: रभ्
    gloss: begins
    vocab: true
    notes:
    - term: आत्मनेपद
      en: middle voice
  - form: ग्रामम्
    lemma: ग्राम
    gloss: to the village
    notes:
    - term: कर्मन्
      en: the उपपद — the goal, standing before the agent-noun
    - term: द्वितीया
      en: accusative
  - form: गामी
    lemma: गामिन्
    gloss: a goer
    notes:
    - term: णिनि
      en: habit-agent with an उपपद — ग्रामं गामी "one who goes to the village"
    - term: प्रथमा
      en: nominative — इन्-stem, न् drops
  - form: भवति
    lemma: भू
    gloss: becomes
    notes:
    - term: लट्
      en: present
  - form: पाकः
    lemma: पाक
    gloss: cooking
    notes:
    - term: घञ्
      en: action-noun from पच् with vṛddhi — पच् → पाकः
    - term: प्रथमा
      en: nominative
  - form: अपि
    lemma: अपि
    gloss: too
    notes:
    - term: अव्यय
      en: indeclinable
  - form: रोचते
    lemma: रुच्
    gloss: is pleasing
    notes:
    - term: लट्
      en: present — the one pleased would stand in the चतुर्थी
  - form: कर्तारम्
    lemma: कर्तृ
    gloss: the doer (obj.)
    notes:
    - term: सर्वनामस्थान
      en: कर्ता DECLINES — the agent-noun is an ऋ-stem, strong अर् in the acc.
    - term: द्वितीया
      en: accusative
  - form: तम्
    lemma: तद्
    gloss: him
    notes:
    - term: कर्मन्
      en: object
    - term: द्वितीया
      en: accusative
  - form: जनाः
    lemma: जन
    gloss: people
    vocab: true
    notes:
    - term: कर्तृ
      en: agent
    - term: बहुवचन
      en: nominative plural
  - form: पश्यन्ति
    lemma: दृश्
    gloss: see
    notes:
    - term: लट्
      en: present plural
  vyakhya: दाता ददाति, दानम् दीयते। कर्ता करोति, करणम् क्रियते। कर्तुः कर्म भिन्नम्।
  vyakhya_en: |
    दाता and दानम् come from the same root by different affixes, and the affix
    is the whole difference: one names the giver, the other the giving. So with
    कर्ता and गमनम्, भोक्ता and पाकः. A कृत् affix does not add a meaning to the
    root so much as decide WHICH PART of the action the new word names — the
    doer, the deed, or the instrument.

    Then कर्ता becomes कर्तारम्. The agent-noun is not a frozen label; it is an
    ऋ-stem noun and declines like पितृ. Both facts are stated separately at
    tier 210. Here they arrive in one paragraph.

- id: ex181
  kind: sangraha
  segment: 55
  order: 1
  sentence: बालः वने वृकात् बिभेति। सः मात्रे क्रुध्यति, यतः सा तम् वनम् न नयति। मुनिः गिरिम् अधिशेते। बालः मुनये श्लाघते, मुनेः फलेभ्यः च स्पृहयति। मुनिः बालाय फलानि यच्छति। बालाय फलानि रोचन्ते। सः गृहम् आगच्छति, मातुः च न बिभेति।
  translation: In the forest the boy is afraid of a wolf. He is angry at his mother, because she does not take him to the forest. A sage lies upon the mountain. The boy flatters the sage, and longs for the sage's fruits. The sage gives the boy fruits. The fruits please the boy. He comes home, and is no longer afraid of his mother.
  teaches: |
    सङ्ग्रह for tier 50 — the special-government wall. Twelve short readings
    there each show one verb selecting one case in isolation (भी → पञ्चमी,
    क्रुध् → चतुर्थी, स्पृह् → चतुर्थी, रुच् → चतुर्थी, श्लाघ् → चतुर्थी,
    अधि+शी → द्वितीया). The POINT of special government is that the VERB
    picks the case, and that is invisible when each verb sits alone: here six
    of them run in one story, so the reader has to let the verb decide.
    Deliberately puts वृकात् (भी, पञ्चमी) and मात्रे (क्रुध्, चतुर्थी) in
    adjacent clauses — two objects of emotion, two different cases, and only
    the verb tells them apart. Closes by re-running भी with a different noun
    (मातुः) so the rule is met twice inside one passage.
  words:
  - form: बालः
    lemma: बाल
    gloss: the boy
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: वने
    lemma: वन
    gloss: in the forest
    notes:
    - term: अधिकरण
      en: locus
    - term: सप्तमी
      en: locative
  - form: वृकात्
    lemma: वृक
    gloss: of a wolf (afraid of)
    notes:
    - term: अपादान
      en: the thing feared — treated as what one shrinks away FROM
    - term: पञ्चमी
      en: ablative
    - cite: "1.4.25"
      role: भीत्रार्थानां भयहेतुः — with verbs of fearing, the cause of fear is अपादान → वृकात्
  - form: बिभेति
    lemma: भी
    gloss: is afraid
    notes:
    - term: लट्
      en: present — reduplicated stem बिभे-
  - form: सः
    lemma: तद्
    gloss: he
    notes:
    - term: प्रथमा
      en: nominative
  - form: मात्रे
    lemma: मातृ
    gloss: at his mother
    notes:
    - term: सम्प्रदान
      en: the one angered at — NOT the accusative one might expect
    - term: चतुर्थी
      en: dative
    - cite: "1.4.37"
      role: क्रुधद्रुहोरुपसृष्टयोः… — the target of क्रुध् is सम्प्रदान → मात्रे
  - form: क्रुध्यति
    lemma: क्रुध्
    gloss: is angry
    notes:
    - term: लट्
      en: present
  - form: 'यतः'
    lemma: यतस्
    gloss: because
    vocab: true
    notes:
    - term: अव्यय
      en: indeclinable — subordinating connective
  - form: सा
    lemma: तद्
    gloss: she
    notes:
    - term: प्रथमा
      en: nominative feminine
  - form: तम्
    lemma: तद्
    gloss: him
    notes:
    - term: कर्मन्
      en: object
    - term: द्वितीया
      en: accusative
  - form: वनम्
    lemma: वन
    gloss: to the forest
    notes:
    - term: कर्मन्
      en: goal of motion
    - term: द्वितीया
      en: accusative
  - form: 'न'
    lemma: न
    gloss: not
    vocab: true
    notes:
    - term: अव्यय
      en: negation
  - form: नयति
    lemma: नी
    gloss: leads, takes
    vocab: true
    notes:
    - term: लट्
      en: present — नी + शप् → गुण ने → नय्
  - form: मुनिः
    lemma: मुनि
    gloss: a sage
    notes:
    - term: कर्तृ
      en: agent — an इ-stem masculine
    - term: प्रथमा
      en: nominative
  - form: गिरिम्
    lemma: गिरि
    gloss: upon the mountain
    notes:
    - term: कर्मन्
      en: the locus turned OBJECT — अधि+शी makes it द्वितीया, not सप्तमी
    - term: द्वितीया
      en: accusative
    - cite: "1.4.46"
      role: अधिशीङ्स्थासां कर्म — with अधि + शी/स्था/आस्, the locus becomes कर्मन् → गिरिम्
  - form: अधिशेते
    lemma: शी
    gloss: lies upon
    notes:
    - term: आत्मनेपद
