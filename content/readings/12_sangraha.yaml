      en: nominative plural
  - form: वदन्ति
    lemma: वद्
    gloss: say
    notes:
    - term: शप्
      en: वद् + अ + न्ति
    - term: लट्
      en: present plural
  vyakhya: तद्धितान्तं पदम् — न विग्रहः। दाशरथिः नाम, न तु दशरथस्य अपत्यम् इति वाक्यम्।
  vyakhya_en: |
    Every तद्धित reading before this one is a विग्रह — दशरथस्य अपत्यं दाशरथिः,
    the analysis and the word side by side. That shows how the word is made and
    never shows it working. Here दाशरथिः is simply his name.

    Watch धनवान् against ब्राह्मणवत्. Both are built with a वत्-shaped affix,
    and they behave completely differently: धनवान् is a noun and declines,
    ब्राह्मणवत् is an indeclinable and does not. The affix decides what kind of
    word comes out, not just what it means.

- id: ex193
  kind: sangraha
  segment: 125
  order: 1
  sentence: वाग् अत्र शुभा। तच्च सत्यं वदति। वनं हसति, नदी च शोभते। रामेण सह मुनिर्गच्छति। संस्कृतं वचनं तेषां प्रियम्। नमस्ते गुरो, इति ते वदन्ति।
  translation: Speech here is auspicious. And it speaks the truth. The forest laughs, and the river shines. The sage goes with Rāma. Refined speech is dear to them. "Homage to you, teacher," they say.
  teaches: |
    the consonant joins met at tier 120, now inside sentences instead of shown
    as transformations: वाग् before a vowel, तच्च where त् meets च, वनं and
    संस्कृतं with the nasal taking the following point of articulation, रामेण
    where न् turns ण् after र्, and नमस्ते where the visarga becomes स्.
  words:
  - form: वाग्
    lemma: वाच्
    gloss: speech
    notes:
    - term: सन्धि
      en: वाक् + अत्र — the final क् voices to ग् before a vowel
    - cite: "8.2.39"
      role: झलां जशोऽन्ते — a final stop takes its voiced counterpart → वाग्
    - term: प्रथमा
      en: nominative
  - form: अत्र
    lemma: अत्र
    gloss: here
    vocab: true
    notes:
    - term: अव्यय
      en: indeclinable
  - form: शुभा
    lemma: शुभ
    gloss: auspicious
    notes:
    - term: प्रथमा
      en: nominative feminine — predicated of वाग्
  - form: तच्च
    lemma: तद्
    gloss: and it
    notes:
    - term: सन्धि
      en: तत् + च — त् becomes च् before a च्-class stop
    - cite: "8.4.40"
      role: स्तोः श्चुना श्चुः — श्चुत्व assimilates the dental to the palatal → तच्च
  - form: सत्यं
    lemma: सत्य
    gloss: the truth
    vocab: true
    notes:
    - cite: "8.3.23"
      role: मोऽनुस्वारः — word-final म् becomes anusvāra before a consonant → सत्यं
    - term: कर्मन्
      en: object
    - term: द्वितीया
      en: accusative
  - form: वदति
    lemma: वद्
    gloss: speaks
    notes:
    - term: शप्
      en: वद् + अ + ति
    - term: लट्
      en: present
  - form: वनं
    lemma: वन
    gloss: the forest
    notes:
    - term: सन्धि
      en: वनम् + हसति — final म् becomes anusvāra before a consonant
    - cite: "8.3.23"
      role: मोऽनुस्वारः — म् → anusvāra at a word join → वनं
    - term: प्रथमा
      en: nominative
  - form: हसति
    lemma: हस्
    gloss: laughs
    vocab: true
    notes:
    - term: शप्
      en: हस् + अ + ति
    - term: लट्
      en: present
  - form: नदी
    lemma: नदी
    gloss: the river
    notes:
    - term: कर्तृ
      en: agent — an ī-stem feminine
    - term: प्रथमा
      en: nominative
  - form: च
    lemma: च
    gloss: and
    notes:
    - term: अव्यय
      en: indeclinable
  - form: शोभते
    lemma: शुभ्
    gloss: shines
    notes:
    - term: गुण
      en: the root vowel strengthens before शप् — शुभ् → शोभ्
    - term: शप्
      en: शोभ् + अ + ते
    - term: लट्
      en: present
  - form: रामेण
    lemma: राम
    gloss: with Rāma
    notes:
    - term: सन्धि
      en: राम + इन → रामेन, then न् becomes ण् because र् precedes
    - cite: "8.4.2"
      role: अट्कुप्वाङ्नुम्व्यवायेऽपि — णत्व applies across the intervening vowel → ण्
    - term: तृतीया
      en: instrumental
  - form: सह
    lemma: सह
    gloss: with
    notes:
    - term: अव्यय
      en: indeclinable governing the तृतीया
  - form: मुनिर्गच्छति
    lemma: मुनि
    gloss: the sage goes
    notes:
    - term: सन्धि
      en: मुनिः + गच्छति — the visarga becomes र् before a voiced sound
    - cite: "8.3.15"
      role: खरवसानयोर्विसर्जनीयः — the रु/visarga alternation → मुनिर्
  - form: संस्कृतं
    lemma: संस्कृत
    gloss: refined
    notes:
    - term: सन्धि
      en: सम् + कृत — the nasal takes the point of the following स्क्
    - cite: "8.4.58"
      role: अनुस्वारस्य ययि परसवर्णः — the nasal goes homorganic → संस्कृतम्
  - form: वचनं
    lemma: वचन
    gloss: speech
    notes:
    - cite: "8.3.23"
      role: मोऽनुस्वारः — word-final म् becomes anusvāra before a consonant → वचनं
    - term: सन्धि
      en: वचनम् + तेषाम् — म् → anusvāra again, a second instance
    - term: प्रथमा
      en: neuter nominative
  - form: तेषां
    lemma: तद्
    gloss: to them
    notes:
    - cite: "8.3.23"
      role: मोऽनुस्वारः — word-final म् becomes anusvāra before a consonant → तेषां
    - term: षष्ठी
      en: genitive plural — "dear to them"
  - form: प्रियम्
    lemma: प्रिय
    gloss: dear
    vocab: true
    notes:
    - cite: "7.1.24"
      role: अतोऽम् — the neuter अ-stem takes अम् in प्रथमा and द्वितीया → प्रियम्
    - term: प्रथमा
      en: neuter nominative — predicated of वचनं
  - form: नमस्ते
    lemma: नमस्
    gloss: homage to you
    notes:
    - term: सन्धि
      en: नमः + ते — the visarga becomes स् before त्
    - term: चतुर्थी
      en: ते is dative — नमस् governs the चतुर्थी
  - form: गुरो
    lemma: गुरु
    gloss: O teacher
    notes:
    - term: सम्बोधन
      en: vocative — उ-stem, गुरु → गुरो
  - form: इति
    lemma: इति
    gloss: "thus"
    notes:
    - term: अव्यय
      en: closes the quotation
  - form: ते
    lemma: तद्
    gloss: they
    notes:
    - term: प्रथमा
      en: nominative plural
  - form: वदन्ति
    lemma: वद्
    gloss: say
    notes:
    - term: शप्
      en: वद् + अ + न्ति
    - term: लट्
      en: present plural
  vyakhya: यत्र पदं पदेन मिलति तत्र सन्धिः। वाग्, तच्च, वनं, रामेण — सर्वत्र।
  vyakhya_en: |
    Six joins here and none of them announced. वाक् voices to वाग् because a
    vowel follows; त् becomes च् because च follows; म् goes to anusvāra twice;
    न् turns ण् in रामेण because an र् sits two syllables back.

    That last one is worth noticing — the trigger is not adjacent. र् and न्
    are separated by ए, and the rule still reaches across. Sandhi is not only
    about what touches what.

- id: ex192
  kind: sangraha
  segment: 105
  order: 1
  sentence: अग्निः ज्वलति। नरः जलम् नयति। बालः वनम् गच्छति। गुरुः शिष्यम् बोधति। सः धर्मम् वदति। जनाः शृण्वन्ति। अग्नयः ज्वलन्ति, नराः च पश्यन्ति।
  translation: The fire blazes. The man leads the water. The boy goes to the forest. The teacher instructs the student. He speaks dharma. The people listen. The fires blaze, and the men watch.
  teaches: |
    seven present-tense verbs whose stems are built the same way — a अ inserted
    between root and ending, and the root vowel strengthened before it. नी gives
    नयति, बुध् gives बोधति, ज्वल् gives ज्वलति. The endings differ; the two steps
    that produce the stem do not.
  words:
  - form: अग्निः
    lemma: अग्नि
    gloss: the fire
    notes:
    - term: कर्तृ
      en: agent — an इ-stem masculine
    - term: प्रथमा
      en: nominative
  - form: ज्वलति
    lemma: ज्वल्
    gloss: blazes
    notes:
    - term: शप्
      en: ज्वल् + अ + ति — the अ between root and ending
    - term: लट्
      en: present
    - cite: "3.1.68"
      role: कर्तरि शप् — the शप् विकरण inserted after the root → ज्वल् + अ
  - form: नरः
    lemma: नर
    gloss: the man
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: जलम्
    lemma: जल
    gloss: water
    vocab: true
    notes:
    - term: कर्मन्
      en: object
    - term: द्वितीया
      en: accusative
  - form: नयति
    lemma: नी
    gloss: leads
    notes:
    - term: गुण
      en: the root vowel strengthens before शप् — नी → ने → नय्
    - term: शप्
      en: नी + अ + ति, and ई strengthens to ए — ने + अ gives नय्
    - cite: "7.3.84"
      role: सार्वधातुकार्धधातुकयोः — गुण of the root vowel before शप् → नयति
  - form: बालः
    lemma: बाल
    gloss: the boy
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: वनम्
    lemma: वन
    gloss: to the forest
    notes:
    - term: कर्मन्
      en: goal of motion
    - term: द्वितीया
      en: accusative
  - form: गच्छति
    lemma: गम्
    gloss: goes
    notes:
    - term: शप्
      en: the same अ, on a root that also changes shape — गम् appears as गच्छ्
    - term: लट्
      en: present
  - form: गुरुः
    lemma: गुरु
    gloss: the teacher
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: शिष्यम्
    lemma: शिष्य
    gloss: the student
    notes:
    - term: कर्मन्
      en: object
    - term: द्वितीया
      en: accusative
  - form: बोधति
    lemma: बुध्
    gloss: instructs
    vocab: true
    notes:
    - term: गुण
      en: the root vowel strengthens before शप् — बुध् → बोध्
    - term: शप्
      en: बुध् + अ + ति, and उ strengthens to ओ — the same step as in नयति
    - term: लट्
      en: present
  - form: सः
    lemma: तद्
    gloss: he
    notes:
    - term: प्रथमा
      en: nominative
  - form: धर्मम्
    lemma: धर्म
    gloss: dharma
    notes:
    - term: कर्मन्
      en: object
    - term: द्वितीया
      en: accusative
  - form: वदति
    lemma: वद्
    gloss: speaks
    notes:
    - term: शप्
      en: वद् + अ + ति — अ already, so nothing to strengthen
    - term: लट्
      en: present
  - form: जनाः
    lemma: जन
    gloss: the people
    notes:
    - term: कर्तृ
      en: agent
    - term: बहुवचन
      en: nominative plural
  - form: शृण्वन्ति
    lemma: श्रु
    gloss: listen
    notes:
    - term: लट्
      en: present plural — श्रु takes श्नु, not शप्, so the stem is शृणो/शृण्व्
  - form: अग्नयः
    lemma: अग्नि
    gloss: the fires
    notes:
    - term: बहुवचन
      en: nominative plural — इ strengthens before the ending, अग्नि → अग्नय्
    - cite: "7.3.109"
      role: जसि च — गुण before the plural ending → अग्नयः
  - form: ज्वलन्ति
    lemma: ज्वल्
    gloss: blaze
    notes:
    - term: बहुवचन
      en: same stem ज्वल + अ, a different ending — ज्वलति beside ज्वलन्ति
  - form: नराः
    lemma: नर
    gloss: the men
    notes:
    - term: बहुवचन
      en: nominative plural
  - form: च
    lemma: च
    gloss: and
    notes:
    - term: अव्यय
      en: indeclinable
  - form: पश्यन्ति
    lemma: दृश्
    gloss: watch
    notes:
    - term: बहुवचन
      en: present plural — दृश् appears as पश्य्
  vyakhya: धातोः परं शप्, तस्मात् पूर्वं गुणः। नी → ने → नय्। बुध् → बोध्।
  vyakhya_en: |
    Between the root and the ending there is almost always a अ. It is not part
    of either — it is inserted, and it is why भू gives भवति rather than भूति.
    Once it is there, a short इ उ ऋ in the root strengthens in front of it:
    नी becomes ने and then नय्, बुध् becomes बोध्.

    वद् shows nothing happening, because अ cannot strengthen further. शृण्वन्ति
    shows a root that takes a different insert altogether. The अ is the default,
    not the rule without exception.

