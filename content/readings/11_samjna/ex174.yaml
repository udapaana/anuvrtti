- id: ex174
  kind: samjna
  segment: 220
  sentence: आ, ऐ, औ — एते वृद्धिसंज्ञाः।
  translation: ā, ai, au — these bear the name "vṛddhi."
  teaches: 'the संज्ञा वृद्धि — Pāṇini''s name for the strongest vowel grade (आ ऐ औ); the term every "vṛddhi" rule invokes'
  words:
  - form: वृद्धिः
    lemma: वृद्धि
    gloss: '"vṛddhi" — the technical name'
    notes:
    - term: संज्ञा
      en: a technical term DEFINED here, used everywhere after
    - cite: '1.1.1'
      role: वृद्धिरादैच् — आत् (आ) and ऐच् (ऐ, औ) are named वृद्धि
    - term: प्रथमा
      en: nominative (the term being defined)
  - form: आदैच्
    lemma: आदैच्
    gloss: ā and the ऐच् pair (ऐ, औ)
    notes:
    - text: 'आत् = आ; ऐच् = the प्रत्याहार for ऐ, औ — together the वृद्धि vowels'
    - term: प्रत्याहार
      en: the अ-grouping naming ऐ + औ
  vyakhya: आ ऐ औ इति वृद्धिसंज्ञकाः। एषा संज्ञा "आदिवृद्धिः" "वृद्धिरेचि" इत्यादिषु प्रयुज्यते।
  vyakhya_en: |
    Before any rule can SAY "take vṛddhi," the term must be DEFINED — and 1.1.1, the very first sūtra of the Aṣṭādhyāyī, does it: वृद्धिः = आ, ऐ, औ, the strongest vowel grade. You have already SEEN वृद्धि act — दशरथ → दाशरथिः (आदिवृद्धि, ex080), तव + एव → तवैव (ex with वृद्धि-sandhi). Now you know its name. This is metalanguage: a संज्ञा is a label the grammar pins on a set of sounds so later rules can refer to them in one word.
