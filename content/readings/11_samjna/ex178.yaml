- id: ex178
  kind: paribhasha
  segment: 220
  sentence: षष्ठी स्थानेयोगा; स्थाने अन्तरतमः।
  translation: A genitive (in a rule) means "in the place of"; and the substitute is the one nearest (to the original).
  teaches: 'the two परिभाषाs that drive every substitution (आदेश) — what the षष्ठी means in a rule, and how to pick the replacement'
  words:
  - form: स्थानेयोगा
    lemma: स्थानेयोग
    gloss: '"in-the-place-of" — how a rule''s genitive is read'
    notes:
    - term: परिभाषा
      en: an interpretive meta-rule
    - cite: '1.1.49'
      role: षष्ठी स्थानेयोगा — a षष्ठी in a sūtra means "in the place of X" (X is replaced)
    - term: प्रथमा
      en: nominative
  - form: अन्तरतमः
    lemma: अन्तरतम
    gloss: the nearest, most similar (substitute)
    notes:
    - cite: '1.1.50'
      role: स्थानेऽन्तरतमः — among possible substitutes, the one closest to the original is chosen
    - term: प्रथमा
      en: nominative
  vyakhya: सूत्रस्थषष्ठी स्थानिनं सूचयति (तस्य स्थाने आदेशः); बहुषु आदेशेषु अन्तरतमः ग्राह्यः। एताभ्यां सर्वः आदेशविधिः प्रवर्तते।
  vyakhya_en: |
    These two are not about Sanskrit words — they are about reading the GRAMMAR. 1.1.49: when a rule puts a word in the genitive (इकः, अचः…), it means "IN THE PLACE OF that" — a substitution. 1.1.50: when several substitutes are possible, take the अन्तरतम, the one nearest in place/effort to the original. Together they govern every आदेश you have met — why ऋ becomes अर् (the nearest गुण) and not something else, why इ + vowel goes to य् (the nearest semivowel, यण्). The परिभाषाs are the operating system under the rules.
