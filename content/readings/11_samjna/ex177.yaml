- id: ex177
  kind: samjna
  segment: 220
  sentence: उपदेशे हल् अन्त्यम् इत्, तस्य लोपः।
  translation: A consonant at the end of an affix-citation is an "it"-marker — and it drops.
  teaches: 'the इत् mechanism — affixes carry silent marker-letters that trigger rules, then vanish (क्विप्, तृच्, ण्वुल् are all named by their इत्s)'
  words:
  - form: इत्
    lemma: इत्
    gloss: '"it" — a silent diacritic marker'
    notes:
    - term: संज्ञा
      en: the marker-letter status
    - cite: '1.3.3'
      role: हलन्त्यम् — a final consonant in an उपदेश (citation form) is इत्
    - cite: '1.3.2'
      role: उपदेशेऽजनुनासिक इत् — a nasalised vowel in citation is also इत्
    - term: प्रथमा
      en: nominative
  - form: लोपः
    lemma: लोप
    gloss: elision (the इत् disappears)
    notes:
    - cite: '1.3.9'
      role: तस्य लोपः — that इत् is then dropped, leaving only its effect
    - term: प्रथमा
      en: nominative
  vyakhya: उपदेशे अन्त्यो हल् इत्संज्ञकः, स च लुप्यते; कार्यं तु करोति। यथा तृच् → तृ (च् इत्); क्विप् → शून्यम् (सर्वे इतः)।
  vyakhya_en: |
    Affixes are cited with extra letters that never appear in the final word — they are इत्, silent markers (1.3.3 for a final consonant, 1.3.2 for a nasal vowel) that DROP by तस्य लोपः (1.3.9), having done their job of triggering rules. तृच् is really just तृ — the च् is an इत् (it conditions accent/operations). क्विप् is ALL इत् — every letter vanishes, which is why it leaves the bare root (ex161, भूः). Decoding इत्-markers is how you read Pāṇini's affix-names: शतृ = अत्, ल्युट् = अन, घञ् = अ.
