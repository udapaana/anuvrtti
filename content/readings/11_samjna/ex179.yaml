- id: ex179
  kind: samjna
  segment: 220
  sentence: सुप्तिङन्तं पदम्।
  translation: A form ending in a सुप् (noun-ending) or तिङ् (verb-ending) is a "pada" (word).
  teaches: 'the संज्ञा पद — what counts as a finished word, which decides where पद-level sandhi and the final-consonant rules apply'
  words:
  - form: पदम्
    lemma: पद
    gloss: '"pada" — a complete, ending-bearing word'
    notes:
    - term: संज्ञा
      en: technical term defined here
    - cite: '1.4.14'
      role: सुप्तिङन्तं पदम् — what ends in सुप् or तिङ् is a पद
    - term: प्रथमा
      en: nominative
  - form: सुप्तिङन्तम्
    lemma: सुप्तिङन्त
    gloss: ending in a सुप् or a तिङ्
    notes:
    - text: 'सुप् = the 21 noun-endings (4.1.2); तिङ् = the 18 verb-endings (3.4.78)'
    - term: बहुव्रीहि
      en: '"that which has सुप्/तिङ् at its end"'
  vyakhya: यत् सुबन्तं तिङन्तं वा तत् पदम्। पदान्ते एव जश्त्वादीनि, पदयोः सन्धिः च प्रवर्तते। नरः, गच्छति — पदे।
  vyakhya_en: |
    Many rules say "at the end of a पद" or "between पदs" — so the term must be fixed: a पद is anything ending in a noun-ending (सुप्) or a verb-ending (तिङ्), by 1.4.14. नरः (सुबन्त) and गच्छति (तिङन्त) are both पदs; a bare stem नर or root गम् is not. This संज्ञा gates the whole final-tail of the grammar — जश्त्व (वाक्→वाग्), न-lopa (राजन्→राजा), म्→anusvāra all fire at पद-end, and external sandhi happens between पदs. The word-boundary is itself a defined object.
