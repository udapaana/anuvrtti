- id: ex176
  kind: samjna
  segment: 220
  sentence: तुल्यास्यप्रयत्नं सवर्णम्।
  translation: Sounds made at the same place with the same effort are "savarṇa" (homorganic).
  teaches: 'the संज्ञा सवर्ण — same-place-and-effort sounds; the term behind सवर्णदीर्घ (अ+अ→आ)'
  words:
  - form: सवर्णम्
    lemma: सवर्ण
    gloss: '"savarṇa" — homorganic, of the same class'
    notes:
    - term: संज्ञा
      en: technical term defined here
    - cite: '1.1.9'
      role: तुल्यास्यप्रयत्नं सवर्णम् — same आस्य (place) + प्रयत्न (effort) → सवर्ण
    - term: प्रथमा
      en: nominative
  - form: तुल्यास्यप्रयत्नम्
    lemma: तुल्यास्यप्रयत्न
    gloss: of equal place-of-articulation and effort
    notes:
    - text: 'आस्य = the mouth-position (कण्ठ, तालु…); प्रयत्न = the manner/effort'
    - term: हेतु
      en: the criterion of sameness
  vyakhya: समानस्थानप्रयत्नौ वर्णौ सवर्णौ। अ इ-वर्गादीनां स्वस्ववर्गे सावर्ण्यम्। अतः अ + अ → आ (सवर्णदीर्घः)।
  vyakhya_en: |
    Why does अ + अ fuse to आ but अ + इ to ए? Because the first pair is सवर्ण — "homorganic," made at the same place with the same effort (1.1.9) — and the second is not. This संज्ञा is the hinge of सवर्णदीर्घ (दधि + इन्द्रः → दधीन्द्रः, ex with 6.1.101): two सवर्ण vowels lengthen into one. The term sorts every sound into क-class, च-class, and so on — the grid behind both sandhi and the सवर्ण-exclusions in declension.
