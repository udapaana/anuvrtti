  sentence: इंद्रा या॑हि धि॒येषि॒तो विप्र॑जूतः सु॒ताव॑तः। उप॒ ब्रह्मा॑णि वा॒घतः॑॥
  translation: Come, O Indra, urged on by the thought, hastened by the seers — up to the prayers of the soma-pressing worshipper.
