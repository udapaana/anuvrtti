  sentence: इंद्रा या॑हि॒ तूतु॑जान॒ उप॒ ब्रह्मा॑णि हरिवः। सु॒ते द॑धिष्व न॒श्चनः॑॥
  translation: Come, O Indra, hastening, up to the prayers, O lord of the bay steeds; at the pressing take delight in us.
  teaches: 'सुते "at the pressing" as a locative of occasion, the middle imperative दधिष्व "take, for yourself," and नः in the dative'
