  vyakhya: इन्द्र हरिवः — सम्बोधनम्; आ याहि — लोटि मध्यमपुरुषैकवचनम्; उप ब्रह्माणि — द्वितीया गत्यर्थे; सुते — सप्तमी अधिकरणे; दधिष्व — लोटि आत्मनेपदम्; नः चनः — आत्मने ग्रहणम्। इन्द्रसूक्तत्रयं समाप्तम्।
  vyakhya_en: |
    The third and last call to Indra adds one new case: सुते, a LOCATIVE — "at the pressing," the occasion when the soma is pressed (अधिकरण, सप्तमी, by 2.3.36). The verb दधिष्व is √धा again — the root of दधाते "the two hold" in rd025 — but here a MIDDLE (आत्मनेपद) imperative, "take FOR YOURSELF," carrying delight (चनः, the noun of the very चनस्यतम् "take pleasure" that opened the hymn in rd026). The triplet to Indra is complete: three times "come," each adding a case — instrument, goal, and now occasion.
