  vyakhya: इन्द्र चित्रभानो — सम्बोधने एकवचनम्; आ याहि — लोटि मध्यमपुरुषैकवचनम् (द्विवचनयातमः प्रतियोगि); सुताः इमे त्वायवः पूतासः — प्रथमाबहुवचने कर्तृविशेषणानि; अण्वीभिः तना — तृतीया करणे।
  vyakhya_en: |
    The hymn turns from the pair to a single god, and the grammar turns with it: इन्द्र is a SINGULAR vocative, and he is bidden आ याहि — "come!" — a 2nd-person SINGULAR imperative, exactly the dual आ यातम् of rd028 with one fewer. Hold the two side by side: यातम् = "come, you two," याहि = "come, you one." The soma is described in a nominative string (सुताः … त्वायवः … पूतासः, "pressed … longing for you … purified"), strained अण्वीभिः, "through the fine filter" (instrumental of means). The dual you drilled all through RV 1.2 now has its singular foil.
