  sentence: इंद्रा या॑हि चित्रभानो सु॒ता इ॒मे त्वा॒यवः॑। अण्वी॑भि॒स्तना॑ पू॒तासः॑॥
  translation: Come, O Indra of bright splendour — these pressed (soma-draughts) are longing for you, purified through the fine (filter), in continuous flow.
  teaches: 'the address turns singular: after the dual Aśvins, Indra alone — vocative इन्द्र and the singular imperative आ याहि, against the dual आ यातम् just before'
