  vyakhya: पावका सरस्वती वाजिनीवती धियावसुः — प्रथमैकवचने स्त्रीलिङ्गकर्तृविशेषणानि; वाजेभिः — तृतीया; यज्ञम् — द्वितीया कर्मणि; वष्टु — लोटि प्रथमपुरुषैकवचनम्।
  vyakhya_en: |
    The last triplet of the hymn turns to a single FEMININE deity: सरस्वती, an ई-stem noun of the same नदी class you first declined in rd010. She is the subject (nominative), wrapped in feminine epithets — पावका ("purifying," with the टाप् feminine-आ of 4.1.4), वाजिनीवती ("rich in abundance"), धियावसुः ("treasure of thought"). The verb वष्टु is a 3rd-person SINGULAR imperative — "may she desire" — a wish made ABOUT her, not a command TO her. After the dual, singular-Indra, and plural triplets, the hymn closes on one goddess, in the feminine.
