  sentence: पा॒व॒का नः॒ सर॑स्वती॒ वाजे॑भिर्वा॒जिनी॑वती। य॒ज्ञं व॑ष्टु धि॒याव॑सुः॥
  translation: Purifying Sarasvatī, rich in plenitudes through her abundances, treasure of thought — may she desire our sacrifice.
