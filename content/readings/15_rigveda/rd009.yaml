  sentence: अ॒ग्निः पूर्वे॑भि॒र्ऋषि॑भि॒रीड्यो॒ नूत॑नैरु॒त। स दे॒वाँ एह व॑क्षति॥
  translation: Agni, worthy to be praised by ancient seers and by new ones too — may he bring the gods here.
  teaches: 'the second verse of the same hymn — अग्नि now stands as कर्तृ, and the agents come in the instrumental plural'
  words:
  - form: अ॒ग्निः
    lemma: अग्नि
    gloss: Agni — now the subject
    notes:
    - term: कर्तृ
      en: agent
