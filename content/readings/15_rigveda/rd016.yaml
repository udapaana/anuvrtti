  vyakhya: पिता सूनवे इव, अग्ने नः सूपायनः भव; नः स्वस्तये सचस्व। चतुर्थ्यः बह्व्यः — सूनवे नः स्वस्तये।
  vyakhya_en: |
    The hymn closes with a prayer, dense with the चतुर्थी (dative): नः "for us," सूनवे "to a son," स्वस्तये "for well-being" — three datives, all the "for whom" case (सम्प्रदान). The heart is a simile: पिता इव सूनवे — "as a father (is) to a son." Two imperatives (लोट्) carry the request: भव "be!" and सचस्व "abide!" — the command mood you met in गच्छतु, here in real Vedic. With this you have read the whole first hymn of the Ṛgveda, end to end, with its accent.

