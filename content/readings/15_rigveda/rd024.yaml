  vyakhya: ऋतेन इति करणम्; मित्रावरुणौ ऋतावृधौ ऋतस्पृशा — द्विवचनसम्बोधनानि; बृहन्तं क्रतुम् आशाथे — लिटि द्विवचनम्।
  vyakhya_en: |
    Now Mitra-Varuṇa are ADDRESSED, as a single dual द्वन्द्व: मित्रावरुणौ (vocative dual), with two dual epithets, ऋतावृधौ ("Truth-increasers") and ऋतस्पृशा ("Truth-touchers"). The line opens with ऋतेन — "by the Truth," the instrumental of means. And the verb is new: आशाथे, "you two have attained" — a PERFECT (लिट्, the tense of चकार) in the DUAL. Tense, number, and compound all converge on the pair.

