  vyakhya: कवी मित्रावरुणा तुविजाता उरुक्षया — द्विवचनप्रथमायाम्; नः दक्षम् अपसं दधाते — द्विवचनतिङन्तम्। हिमवत् सूक्तं समाप्तम्।
  vyakhya_en: |
    The hymn closes with the pair as SUBJECTS, all in the nominative dual: कवी ("two seers"), मित्रावरुणा (now agents, not addressed), तुविजाता ("mightily born"), उरुक्षया ("wide-dwelling"). They दधाते — "the two hold" — a present DUAL verb of √धा, the same root as ददाति "gives." For us (नः, dative) they hold दक्षम् अपसम् ("a working skill," accusative). You have now read the whole second hymn, and through it drilled the entire dual — noun, pronoun, adjective, participle, and verb across three tenses.
