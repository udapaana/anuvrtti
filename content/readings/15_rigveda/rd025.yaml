  sentence: क॒वी नो॑ मि॒त्रावरु॑णा तुविजा॒ता उ॑रु॒क्षया॑। दक्षं॑ दधाते अ॒पसं॑॥
  translation: Two seers, Mitra and Varuṇa, of mighty birth, wide-dwelling — they hold for us a working skill.
  teaches: 'dual nominative epithets — कवी, तुविजाता, उरुक्षया — with the dual verb दधाते and नः in the dative'
