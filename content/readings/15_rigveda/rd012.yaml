  sentence: अ॒ग्निर्होता॑ क॒विक्र॑तुः स॒त्यश्चि॒त्रश्र॑वस्तमः। दे॒वो दे॒वेभि॒रा ग॑मत्॥
  translation: Agni the invoker, wise in will, true, most brilliant in fame — a god, may he come with the gods.
  teaches: 'nominative epithets predicated without a verb, a बहुव्रीहि compound, and the instrumental of accompaniment'
