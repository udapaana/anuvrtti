  vyakhya: होता कविक्रतुः सत्यः चित्रश्रवस्तमः देवः — सर्वाणि अग्निविशेषणानि प्रथमायाम्। देवेभिः इति सहार्थे तृतीया।
  vyakhya_en: |
    Verse 1 strung accusatives; this one strings NOMINATIVES. होता, कविक्रतुः, सत्यः, चित्रश्रवस्तमः, देवः — all प्रथमा, all naming अग्निः (predication, no copula needed). कविक्रतुः is a बहुव्रीहि: "(one) whose क्रतु is a sage's." Then देवेभिः is the तृतीया of accompaniment — "with the gods" — the सह-sense you met in पुत्रेण सह. आ गमत्: "may he come hither."

