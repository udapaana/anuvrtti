- id: rd032
  kind: attested
  segment: 520
  source:
    text: ऋग्वेद
    ref: "RV 1.3.7 (whole ṛc; saṃhitā + padapāṭha) — opens the Viśvedevas triplet"
    curated: "complete verse, taken whole; seventh ṛc of RV 1.3, the hymn turns to the All-Gods. Accent verbatim from sri-aurobindo.co.in"
  sentence: ओमा॑सश्चर्षणीधृतो॒ विश्वे॑ देवास॒ आ ग॑त। दा॒श्वांसो॑ दा॒शुषः॑ सु॒तं॥
  translation: O helpers, upholders of men, O All-Gods, come — you bestowers, to the soma of the worshipper.
  teaches: 'the address turns plural — after the dual Aśvins and Indra alone, the All-Gods as a crowd: विश्वे देवासः in the vocative plural, and आ गत "come, you all"'
  words:
  - form: ओमा॑सः
    lemma: ओमन्
    gloss: O helpers, O protectors
    vocab: true
    notes:
    - text: 'ओमास् = Vedic nom./voc. pl. of ओमन् "helper, friend"'
    - term: सम्बोधन
      en: vocative PLURAL — a whole company addressed
    - term: बहुवचन
      en: plural (contrast dual अश्विना rd026, singular इन्द्र rd029)
  - form: चर्षणीधृतः
    lemma: चर्षणीधृत्
    gloss: upholders of men
    vocab: true
    notes:
    - text: 'padapāṭha splits चर्षणि-धृतः; चर्षणि "men, peoples" + धृत् "holding, upholding"'
    - term: विशेषण
      en: vocative-plural epithet of the gods
    - term: बहुवचन
      en: plural
  - form: विश्वे॑
    lemma: विश्व
    gloss: all, O all
    notes:
    - term: विशेषण
      en: '"all" — qualifying देवासः, the standard epithet विश्वे देवाः "All-Gods"'
    - term: सम्बोधन
      en: vocative plural
    - term: बहुवचन
      en: plural
  - form: दे॒वासः
    lemma: देव
    gloss: O gods
    notes:
    - text: 'देवासः = Vedic voc./nom. pl. of देव (classical देवाः)'
    - term: सम्बोधन
      en: 'vocative plural — "O gods"'
    - term: बहुवचन
      en: plural
  - form: आ
    lemma: आ
    gloss: hither
    notes:
    - term: उपसर्ग
      en: preverb governing गत
  - form: ग॒त
    lemma: गम्
    gloss: come, you all!
    notes:
    - term: गम्
      en: '"go, come" (with आ → "come hither") — same root as आ गतम् (dual, rd020)'
    - term: मध्यमपुरुष
      en: '2nd person — PLURAL imperative ("you all, come"), vs dual गतम्, sg याहि'
    - cite: '3.3.162'
      role: लोट् च → imperative → गत
    - term: बहुवचन
      en: plural
  - form: दा॒श्वांसः
    lemma: दाश्वस्
    gloss: you bestowers, you givers
    vocab: true
    notes:
    - text: 'दाश्वस् = perfect active participle of दाश् "give, worship" — "having given"'
    - term: विशेषण
      en: 'vocative-plural epithet — "(you who are) givers"'
    - term: बहुवचन
      en: plural
  - form: दा॒शुषः॑
    lemma: दाश्वस्
    gloss: of the worshipper, of the giver
    vocab: true
    notes:
    - text: 'दाशुषः = genitive sg of the SAME दाश्वस् stem — here "of the (human) worshipper"'
    - term: सम्बन्ध
      en: 'genitive — "the soma OF the worshipper"'
    - term: षष्ठी
      en: genitive
  - form: सु॒तम्
    lemma: सुत
    gloss: the pressed soma
    vocab: true
    notes:
    - term: कर्मन्
      en: 'goal — "(come) to the pressed soma"'
    - cite: '2.3.2'
      role: कर्मणि द्वितीया → सुतम्
    - term: द्वितीया
      en: accusative
  vyakhya: ओमासः चर्षणीधृतः विश्वे देवासः दाश्वांसः — सम्बोधनबहुवचनम्; आ गत — लोटि मध्यमपुरुषबहुवचनम्; दाशुषः — षष्ठी; सुतम् — द्वितीया कर्मणि।
  vyakhya_en: |
    The number completes its circle. RV 1.3 has now addressed a DUAL (the Aśvins, आ यातम्), a SINGULAR (Indra, आ याहि), and here a PLURAL — विश्वे देवासः, "all the gods," a whole company, bidden आ गत, "come, you all." Set the three imperatives of √गम्/√या side by side: यातम् (two), याहि (one), गत (many). Every vocative here is plural too — ओमासः, चर्षणीधृतः, दाश्वांसः. They come दाशुषः सुतम्, "to the worshipper's pressed soma" (genitive + accusative goal). One hymn has now drilled the entire तीन वचन.
