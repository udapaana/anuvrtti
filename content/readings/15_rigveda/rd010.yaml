  vyakhya: अग्निना इति करणम्, रयिं पोषं च कर्म। दिवेदिवे इति आम्रेडितम्।
  vyakhya_en: |
    Now अग्नि steps into a third case: अग्निना, the तृतीया — "through Agni." You have met this stem as object (अग्निम्), as agent (अग्निः), and here as instrument (अग्निना): one इ-stem across three कारकas. Through Agni one wins रयिम् (wealth) and पोषम् (growth), both accusatives, qualified by यशसं वीरवत्तमं ("glorious, hero-rich"). दिवेदिवे — दिवे doubled — is an आम्रेडित, "day after day."

