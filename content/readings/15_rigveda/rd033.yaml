  vyakhya: विश्वे देवासः अप्तुरः तूर्णयः — सम्बोधनबहुवचनम्; सुतम् आ गन्त — द्वितीया गत्यर्थे लोटि बहुवचनम्; उस्राः इव स्वसराणि — उपमा (इव), द्वितीया गत्यर्थे।
  vyakhya_en: |
    The plural call repeats — सुतम् आ गन्त, "come to the soma, all of you" — but the verse closes with a SIMILE: उस्राः इव स्वसराणि, "like cattle (coming) to their pastures." इव "like" marks the comparison; उस्राः ("cattle") is the standard (nominative), and स्वसराणि ("pastures") is its accusative goal, mirroring सुतम्, the gods' own goal. The grammar of the simile is the grammar of the main clause — a goal-of-motion accusative in both halves. As cattle to the fold, so the gods to the soma.
