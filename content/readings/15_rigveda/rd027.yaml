  sentence: अश्वि॑ना॒ पुरु॑दंससा॒ नरा॒ शवी॑रया धि॒या। धिष्ण्या॒ वन॑तं॒ गिरः॑॥
  translation: O Aśvins of many deeds, O heroes, with your forceful thought, attentive ones, win our songs of praise.
