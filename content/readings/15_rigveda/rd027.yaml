  vyakhya: अश्विना नरा धिष्ण्या — सम्बोधनद्विवचनम्; शवीरया धिया — तृतीयैकवचनं करणे; गिरः — द्वितीयाबहुवचनं कर्मणि; वनतम् — लोटि मध्यमपुरुषद्विवचनम्।
  vyakhya_en: |
    The Aśvins again, addressed as नरा — which is नरौ, the dual of नर, the first noun this whole reader ever declined, now standing in a Vedic hymn. They are to वनतम् ("win, you two," dual imperative) the गिरः, "songs of praise" (accusative plural object). The means is शवीरया धिया, "with forceful thought" — an INSTRUMENTAL (करण, तृतीया), the same धी "thought" you met as धिया in rd014. One verse braids three threads you already hold: the dual address, the accusative object, and the instrument of means.
