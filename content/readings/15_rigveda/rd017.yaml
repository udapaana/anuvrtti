  vyakhya: वायो इति सम्बोधनम्; आ याहि पाहि श्रुधि इति लोडर्थाः। सोमाः कर्तारः, तेषां पाहि — षष्ठ्यर्थे।
  vyakhya_en: |
    A new hymn, a new god — but the grammar is the invocation pattern you just met closing hymn 1. वायो is the सम्बोधन (vocative of the उ-stem वायु, गुण → वायो like गुरो), and it is answered by a volley of imperatives (लोट्): आ याहि "come!", पाहि "drink!", श्रुधि "hear!". The Somas (सोमाः, nominative plural) stand ready (अरंकृताः); drink *of them* — तेषाम्, a genitive (षष्ठी) in the partitive sense — and hear the call (हवम्, accusative). The whole verse is address + command, the heartbeat of Vedic prayer.

