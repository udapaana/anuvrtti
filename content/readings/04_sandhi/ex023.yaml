- id: ex023
  segment: 80
  sentence: दधि इन्द्रः → दधीन्द्रः।
  translation: '"curds, Indra" → दधीन्द्रः (curds-Indra)'
  teaches: 'सवर्णदीर्घ — two like (सवर्ण) vowels merge into one long vowel'
  words:
  - form: दधीन्द्रः
    gloss: the merged form
    notes:
    - text: 'दधि + इन्द्रः: इ meets इ'
    - term: सवर्ण
      en: homogeneous — vowels of the same place of articulation
    - cite: '6.1.101'
      role: अकः सवर्णे दीर्घः — a simple vowel before a like vowel; the two become one long vowel
    - text: '→ ई → दधीन्द्रः'
  vyakhya: समाने सवर्णे अकः दीर्घ एकादेशः। इ + इ = ई।
  vyakhya_en: |
    When a simple vowel (अक्) meets a homogeneous vowel — इ with इ, उ with उ, अ with अ — the pair fuses into the single long vowel of that class. दधि + इन्द्रः gives दधीन्द्रः: two इ become one ई.
