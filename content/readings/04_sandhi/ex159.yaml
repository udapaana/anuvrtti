- id: ex159
  segment: 80
  sentence: पुनः गच्छति → पुनर्गच्छति।
  translation: He goes again.
  teaches: visarga → र् before a voiced sound — the other outcome, beside सोऽपि
  words:
  - form: पुनर्
    lemma: पुनर्
    gloss: again (पुनः before a voiced sound)
    notes:
    - text: पुनः ends in रु; before a voiced sound the visarga surfaces as र् (not ओ)
    - cite: 8.2.66
      role: ससजुषो रुः — word-final स् → रु; its visarga becomes र् before a voiced sound
    - cite: 6.1.113
      role: अतो रोरप्लुतादप्लुते — applies to अ-final रु (सः→सो); पुनर् keeps र् because its base is पुनर्, not अतः
    - term: सन्धि
      en: visarga → र् (रुत्व)
  - form: गच्छति
    lemma: गम्
    gloss: goes
    notes:
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
    - cite: 1.3.3
      role: हलन्त्यम् — final consonant in उपदेश is इत् → गच्छति
  vyakhya: रेफान्तस्य रुत्वम् घोषे। पुनः + गच्छति = पुनर्गच्छति। (अतो भिन्नत्वात् न ओत्वम्। रेफे परे तु रो रि — पुना रमते।)
  vyakhya_en: 'Not every visarga becomes ओ. Words whose underlying final is -र् (पुनर्, अन्तर्, प्रातर्) show र् before a voiced sound, NOT the अ + उ → ओ fusion of ex155: पुनः + गच्छति → पुनर्गच्छति "goes again." Contrast सोऽपि (सः, base स-अः → सो) with पुनर् (base पुनर्): the visarga''s outcome depends on what stands under it. One exception to watch for: before another र् the र् is dropped and the vowel before it lengthens (8.3.14 रो रि, 6.3.111) — पुनः + रमते is पुना रमते, never पुनर्रमते.

    '
