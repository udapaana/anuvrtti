- id: ex159
  segment: 80
  sentence: पुनः रमते → पुनर्रमते (पुनरमते)।
  translation: He delights again.
  teaches: 'visarga → र् before a voiced sound — the other outcome, beside सोऽपि'
  words:
  - form: पुनर्
    lemma: पुनर्
    gloss: again (पुनः before a voiced sound)
    notes:
    - text: 'पुनः ends in रु; before a voiced sound the visarga surfaces as र् (not ओ)'
    - cite: '8.2.66'
      role: ससजुषो रुः — word-final स् → रु; its visarga becomes र् before a voiced sound
    - cite: '6.1.113'
      role: अतो रोः — applies to अ-final रु (सः→सो); पुनर् keeps र् because its base is पुनर्, not अतः
    - term: सन्धि
      en: visarga → र् (रुत्व)
  - form: रमते
    lemma: रम्
    gloss: delights, takes pleasure
    notes:
    - term: रम्
      en: '"delight, sport" (ātmanepada)'
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  vyakhya: रेफान्तस्य रुत्वम् घोषे। पुनः + रमते = पुनर् रमते। (अतो भिन्नत्वात् न ओत्वम्।)
  vyakhya_en: |
    Not every visarga becomes ओ. Words whose underlying final is -र् (पुनर्, अन्तर्, प्रातर्) show र् before a voiced sound, NOT the अ + उ → ओ fusion of ex155. पुनः + रमते → पुनर् रमते "delights again." Contrast सोऽपि (सः, base स-अः → सो) with पुनर् (base पुनर्): the visarga's outcome depends on what stands under it — an अ that fuses to ओ, or an र् that simply reappears.
