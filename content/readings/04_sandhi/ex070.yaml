- id: ex070
  segment: 120
  sentence: रामेन → रामेण।
  translation: '"by Rāma": रामेन → रामेण (न becomes ण after र)'
  teaches: 'णत्व — न् becomes ण् after र्/ष् in the same word'
  words:
  - form: रामेण
    gloss: by Rāma (instrumental)
    notes:
    - text: 'राम + इन (instr.sg ending ट्→इन): the न् stands after the र् of राम'
    - term: णत्व
      en: cerebralisation of न् to ण्
    - cite: '8.4.2'
      role: अट्कुप्वाङ्नुम्व्यवायेऽपि — णत्व applies across the intervening vowel → ण्
    - cite: '8.4.2'
      role: अट्कुप्वाङ्नुम्व्यवायेऽपि → the change still applies across an intervening vowel/guttural/labial (here the ए) → रामेण
    - term: तृतीया
      en: instrumental
  vyakhya: रेफात् परः नकारः णकारः समानपदे, अट्-व्यवधानेऽपि। रामेन → रामेण।
  vyakhya_en: |
    Within one word, a न् turns cerebral (ण्) when an र् or ष् precedes it (8.4.1) — even when a vowel, guttural, or labial stands between them (8.4.2). So राम + the instrumental -इन gives रामेण, not *रामेन*: the र् of राम reaches across the ए to retroflex the न्. This णत्व is why we say रामायण, ब्राह्मणः, नारायण.
