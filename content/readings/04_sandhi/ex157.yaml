- id: ex157
  segment: 80
  sentence: आ छादयति → आच्छादयति।
  translation: He covers over.
  teaches: 'छ-doubling (तुक्) — a short vowel before छ inserts त् → च्छ (छे च)'
  words:
  - form: आच्छादयति
    lemma: छद्
    gloss: covers over (आ + छादयति)
    notes:
    - text: 'विग्रह: आ + छादयति; before छ a त् (तुक्) is inserted → च्छ'
    - cite: '6.1.73'
      role: छे च — a short vowel (here the आ-preverb context) before छ takes the augment तुक् (त्) → च्छ
    - term: सन्धि
      en: छ-doubling (तुगागम)
    - term: लट्
      en: present
  vyakhya: छकारे परे तुक् (त्); त् + छ = च्छ। आ + छादयति = आच्छादयति।
  vyakhya_en: |
    छ never stands alone after a vowel: छे च (6.1.73) inserts the augment तुक् (त्), and त् + छ surfaces as च्छ. आ + छादयति → आच्छादयति "covers over." The same doubling gives तच्छ्रुत्वा (तत् + छ्रुत्वा... via श्), शिवच्छाया (शिव + छाया "Śiva's shade"): a vowel + छ always becomes -च्छ-.
