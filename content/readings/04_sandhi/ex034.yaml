- id: ex034
  segment: 120
  sentence: वाक् अत्र → वाग् अत्र।
  translation: '"speech here" → वाग् अत्र'
  teaches: 'जश्त्व — a word-final hard stop softens to its voiced counterpart'
  words:
  - form: वाग्
    gloss: 'speech (← वाक्)'
    notes:
    - term: जश्
      en: the soft (voiced) stops ग् ज् ड् द् ब्
    - cite: '8.2.39'
      role: झलां जशोऽन्ते — a stop at word's end becomes its जश् (voiced) counterpart; क् → ग्
    - text: 'वाक् → वाग्'
  vyakhya: पदान्ते झलां जश्। क् → ग्, यथा वाक् → वाग्।
  vyakhya_en: |
    A hard stop standing at the end of a word softens to its voiced partner: क्→ग्, त्→द्, प्→ब्. So वाक् "speech" appears as वाग् before अत्र. The word's lemma is वाक्; its sentence-form follows the join.
