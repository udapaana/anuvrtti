- id: ex024
  segment: 80
  sentence: न इह → नेह।
  translation: '"not here" → नेह'
  teaches: 'गुण — अ/आ before इ/उ/ऋ yields the गुण vowel (ए, ओ, अर्)'
  words:
  - form: नेह
    gloss: the merged form
    notes:
    - text: 'न + इह: अ meets इ'
    - term: गुण
      en: the grade ए/ओ/अर्
    - cite: '6.1.87'
      role: आद्गुणः — when अ/आ is followed by another vowel, the two become the single गुण vowel
    - text: 'अ + इ → ए → नेह'
  vyakhya: अवर्णात् अचि गुण एकादेशः। अ + इ = ए।
  vyakhya_en: |
    An अ or आ followed by इ, उ, or ऋ does not merge to a long vowel but shifts to the गुण grade: अ + इ → ए, अ + उ → ओ, अ + ऋ → अर्. So न + इह → नेह. The same अ behaves differently depending on the vowel it meets.
