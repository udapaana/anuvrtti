- id: ex160
  segment: 80
  sentence: रामः च लक्ष्मणः च → रामश्च लक्ष्मणश्च।
  translation: Rāma and Lakṣmaṇa.
  teaches: 'visarga → श् before a च्-class stop (श्चुत्व applied to the visarga-sibilant)'
  words:
  - form: रामश्च
    lemma: राम
    gloss: and Rāma (रामः + च)
    notes:
    - text: 'विग्रह: रामः + च; visarga → स् (8.3.34), then स् → श् before च् (श्चुत्व)'
    - cite: '8.3.34'
      role: विसर्जनीयस्य सः — visarga → स् before the following stop
    - cite: '8.4.40'
      role: स्तोः श्चुना श्चुः — स्/त् before a च्-class sound become श्/च् → रामश्च
    - term: सन्धि
      en: visarga → श् before च
  - form: लक्ष्मणश्च
    lemma: लक्ष्मण
    gloss: and Lakṣmaṇa (लक्ष्मणः + च)
    notes:
    - text: 'same change: लक्ष्मणः + च → लक्ष्मणश्च'
    - cite: '8.4.40'
      role: स्तोः श्चुना श्चुः → श् before च
    - term: सन्धि
      en: visarga → श् before च
  vyakhya: विसर्जनीयस्य सः, ततः श्चुत्वम्। रामः + च = रामश्च। द्वयोः योगे चकारः।
  vyakhya_en: |
    The visarga before a च-class stop ends up as श्. First it becomes स् (8.3.34); then स् before च् is cerebralised — really palatalised — to श् by स्तोः श्चुना श्चुः (8.4.40). रामः च → रामश्च, लक्ष्मणः च → लक्ष्मणश्च, the standard "X and Y" linkage. The visarga's three sibilant outcomes — स् (before त्, ex156), श् (before च्, here), ष् (before ट्) — all follow the place of the stop that comes next.
