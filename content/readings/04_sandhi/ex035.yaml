- id: ex035
  segment: 120
  sentence: तत् च → तच्च।
  translation: '"and that" → तच्च'
  teaches: 'श्चुत्व — a dental meeting a palatal becomes palatal'
  words:
  - form: तच्च
    gloss: and that
    notes:
    - text: 'तत् + च: dental त् meets palatal च'
    - term: श्चु
      en: the palatal series श् च् छ् ज् झ् ञ्
    - cite: '8.4.40'
      role: स्तोः श्चुना श्चुः — a dental (त-class/स) next to a palatal (च-class/श) turns palatal; त् → च्
    - text: 'त् → च् → तच्च'
  vyakhya: स्तोः श्चुना श्चुत्वम्। त् + च → च् + च = च्च।
  vyakhya_en: |
    A dental sound touching a palatal is pulled into the palatal series: तत् + च → तच्च. The त् becomes च् to match the following च. Assimilation — the first sound takes on the place of the second.
