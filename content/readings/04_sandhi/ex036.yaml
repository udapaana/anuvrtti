- id: ex036
  segment: 120
  sentence: वनम् हसति → वनं हसति।
  translation: '"the forest laughs" → वनं हसति'
  teaches: 'a word-final म् becomes anusvāra (ं) before a consonant'
  words:
  - form: वनं
    gloss: 'the forest (← वनम्)'
    notes:
    - term: अनुस्वार
      en: the nasal ं
    - cite: '8.3.23'
      role: मोऽनुस्वारः — a word-final म् before a consonant becomes anusvāra; म् → ं
    - text: 'वनम् → वनं (before हसति)'
  vyakhya: पदान्ते मकारस्य हलि अनुस्वारः। वनम् → वनं हसति।
  vyakhya_en: |
    A म् at the end of a word, when a consonant follows, contracts to the anusvāra ं: वनम् हसति → वनं हसति. (Before a vowel, or at a true pause, the म् stays — so it is the following consonant that triggers the change.)

