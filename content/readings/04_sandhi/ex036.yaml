- id: ex036
  segment: 120
  sentence: फलम् पतति → फलं पतति।
  translation: '"the fruit falls" → फलं पतति'
  teaches: 'a word-final म् becomes anusvāra (ं) before a consonant'
  words:
  - form: फलं
    lemma: फल
    gloss: 'the fruit (← फलम्)'
    notes:
    - term: अनुस्वार
      en: the nasal ं
    - cite: '8.3.23'
      role: मोऽनुस्वारः — a word-final म् before a consonant becomes anusvāra; म् → ं
    - text: 'फलम् → फलं (before पतति)'
  vyakhya: पदान्ते मकारस्य हलि अनुस्वारः। फलम् → फलं पतति।
  vyakhya_en: |
    A म् at the end of a word, when a consonant follows, contracts to the anusvāra ं: फलम् पतति → फलं पतति. (Before a vowel, or at a true pause, the म् stays — so it is the following consonant that triggers the change.)

