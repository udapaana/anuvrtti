- id: ex026
  segment: 80
  sentence: सुधी उपास्यः → सुध्युपास्यः।
  translation: '"the wise one is to be served" → सुध्युपास्यः'
  teaches: 'यण् — इ/उ/ऋ before an unlike vowel become the glide य्/व्/र्'
  words:
  - form: सुध्युपास्यः
    gloss: the merged form
    notes:
    - text: 'सुधी + उपास्यः: ई meets उ (unlike)'
    - term: यण्
      en: the glides य् व् र् ल्
    - cite: '6.1.77'
      role: इको यणचि — an इक् vowel (इ उ ऋ ऌ) before any vowel becomes its corresponding यण् glide
    - text: 'ई → य् → सुध्युपास्यः'
  vyakhya: इकः अचि यण् आदेशः। ई + उ → य् + उ = यु।
  vyakhya_en: |
    When इ, उ, or ऋ meets an unlike vowel, it does not merge but turns into its glide — य्, व्, र् — and the following vowel stands: सुधी + उपास्यः → सुध्युपास्यः. (Like meeting like gave the long vowel of ex023; unlike gives the glide here.)

