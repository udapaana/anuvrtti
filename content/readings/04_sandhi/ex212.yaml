- id: ex212
  segment: 124
  sentence: पुनर् गच्छति → पुनः पुनः।
  translation: '"again and again" — पुनर् at the pause shows as पुनः'
  teaches: 'रु → visarga before a hard consonant and at the pause (खरवसानयोर्विसर्जनीयः)'
  words:
  - form: पुनः
    lemma: पुनर्
    gloss: 'again (← पुनर्)'
    notes:
    - term: अव्यय
      en: indeclinable
    - text: 'the word ends in र्; before a vowel or soft sound it stays पुनर् — पुनर् अपि'
    - cite: '8.3.15'
      role: खरवसानयोर्विसर्जनीयः — र् → visarga before a खर् consonant and at the pause
    - term: विसर्जनीय
      en: the visarga ः
  - form: पुनः
    lemma: पुनर्
    gloss: again
    notes:
    - term: अव्यय
      en: indeclinable
    - term: विसर्जनीय
      en: the visarga ः
    - text: 'the second one stands at the pause, and takes the visarga for that reason alone'
    - cite: '8.3.15'
      role: खरवसानयोर्विसर्जनीयः — अवसान, the pause, is the other trigger
  vyakhya: खरि अवसाने च रोः विसर्जनीयः। पुनर् → पुनः। स्वरे तु पुनर् अपि इति तिष्ठति।
  vyakhya_en: |
    One rule, two triggers. The र् of पुनर् becomes visarga both before a hard consonant (पुनः कः) and at a pause, where nothing follows at all — पुनः पुनः shows the second case twice over. Before a vowel the र् survives: पुनर् अपि. So the visarga is not part of the word; it is what the word's final र् turns into when the surroundings give it nothing voiced to lean on.
