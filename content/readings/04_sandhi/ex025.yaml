- id: ex025
  segment: 80
  sentence: तव एव → तवैव।
  translation: '"yours indeed" → तवैव'
  teaches: 'वृद्धि — अ/आ before ए/ऐ/ओ/औ yields the वृद्धि vowel (ऐ, औ)'
  words:
  - form: तवैव
    gloss: the merged form
    notes:
    - text: 'तव + एव: अ meets ए'
    - term: वृद्धि
      en: the grade ऐ/औ
    - cite: '6.1.88'
      role: वृद्धिरेचि — when अ/आ is followed by एच् (ए ऐ ओ औ), the two become the वृद्धि vowel
    - text: 'अ + ए → ऐ → तवैव'
  vyakhya: अवर्णात् एचि वृद्धिः एकादेशः। अ + ए = ऐ।
  vyakhya_en: |
    When अ or आ meets one of the diphthong-grade vowels (ए, ऐ, ओ, औ), the result climbs to the वृद्धि grade: अ + ए → ऐ, अ + ओ → औ. So तव + एव → तवैव. गुण and वृद्धि are the two upward grades of इ and उ.
