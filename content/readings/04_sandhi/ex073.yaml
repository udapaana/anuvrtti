- id: ex073
  segment: 120
  sentence: नमस् ते → नमस्ते।
  translation: '"homage to thee": the विसर्ग returns to स् before त'
  teaches: 'विसर्ग → स् — a visarga becomes स् before a hard dental (खर्)'
  words:
  - form: नमस्ते
    gloss: homage to you ("namaste")
    notes:
    - term: सन्धि
      en: a join — the two words are written as one
    - text: 'नमः + ते: the visarga of नमः meets the त् of ते'
    - cite: '8.3.34'
      role: विसर्जनीयस्य सः → a visarga → स् before a खर् consonant → नमस्ते
    - text: 'नमस् here is a गति/preverb-like form; 8.3.40 also fixes its स् → नमस्ते, नमस्कारः'
  vyakhya: विसर्गस्य सकारः खरि। नमः + ते → नमस्ते। पुनः सकारः प्रत्येति।
  vyakhya_en: |
    The visarga is not the end of the story — before a hard consonant (खर्) it can revert to स् (8.3.34): नमः + ते → नमस्ते, नमः + कारः → नमस्कारः. The final स् of नरः became visarga before pause (8.2.66 → 8.3.15); here the reverse environment pulls the visarga back to स्. Sandhi is contextual all the way down: the same sound shows different faces by what stands next.
