- id: ex071
  segment: 120
  sentence: रामस् षष्ठः → रामष्षष्ठः।
  translation: '"Rāma the sixth" → रामष्षष्ठः (स/त-series cerebralised by ष)'
  teaches: 'ष्टुत्व — स् and the dentals turn cerebral (ष्/ट-series) next to ष् or a cerebral'
  words:
  - form: रामष्षष्ठः
    gloss: Rāma the sixth (the joined form)
    notes:
    - text: 'रामस् + षष्ठः: a dental स् meets the cerebral ष्'
    - term: ष्टुत्व
      en: cerebralisation — स्/तवर्ग → ष्/टवर्ग in contact with ष् or a cerebral
    - cite: '8.4.41'
      role: ष्टुना ष्टुः → स् and the dentals next to ष्/टवर्ग become ष्/टवर्ग → रामष्षष्ठः
  vyakhya: षकारटवर्गसन्निधौ सकारतवर्गयोः ष्टुत्वम्। रामस् षष्ठः → रामष्षष्ठः।
  vyakhya_en: |
    Mirror of श्चुत्व (which palatalised before श्/च-series): ष्टुत्व *cerebralises*. A dental स् or त-series sound, meeting a cerebral ष् or ट-series sound, itself becomes cerebral (8.4.41). रामस् + षष्ठः → रामष्षष्ठः; तत् + टीका → तट्टीका. The articulation simply assimilates to its neighbour's place — the same logic as जश्त्व and श्चुत्व, one row over.
