- id: ex091
  segment: 4
  sentence: नरः ग्रामे भवति।
  translation: The man is (becomes) in the village.
  teaches: 'गुण of the root vowel — भू → भो → भव् before शप् gives भवति'
  words:
  - form: नरः
    gloss: the man
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: ग्रामे
    gloss: in the village
    notes:
    - term: अधिकरण
      en: locus
    - term: सप्तमी
      en: locative
  - form: भवति
    lemma: भू
    gloss: is, becomes
    notes:
    - term: भू
      en: '"be, become"'
    - term: लट्
      en: present
    - cite: '3.2.123'
      role: वर्तमाने लट् — present sense → लट्
    - cite: '3.1.68'
      role: कर्तरि शप् — when an agent is denoted, शप् (अ) is added after the root (the गण-1 vikaraṇa)
    - cite: '7.3.84'
      role: सार्वधातुकार्धधातुकयोः — before शप् the root vowel takes गुण → ऊ → ओ → (before अ) अव् → भव्
    - cite: '3.4.78'
      role: 'तिप्तस्झि… — the तिङ् ending तिप् for प्रथम·एक → भवति'
  vyakhya: भू इति धातुः। शपि परतः ऊकारस्य गुणः ओकारः, सोऽवादेशम् आपद्यते — भव्। तिपि भवति।
  vyakhya_en: |
    The root भू "be." Before शप् (the अ-vikaraṇa of गण 1, by कर्तरि शप्), the root vowel ऊ takes गुण (7.3.84): ऊ → ओ, which before the following अ becomes अव् — भू → भव्. With the प्रथम·एक ending तिप्, the present is भवति. Compare गच्छति: same लट्, same तिप्, but भू shows its गुण where गम् does not.

- id: ex092
  segment: 4
  sentence: नरौ ग्रामम् गच्छतः।
  translation: The two men go to the village.
  teaches: 'number on the VERB — two agents take the तस् ending → गच्छतः'
  words:
  - form: नरौ
    lemma: नर
    gloss: the two men
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
    - term: द्विवचन
      en: dual — two
    - cite: '1.4.22'
      role: द्व्येकयोर्द्विवचनैकवचने — for two, the द्विवचन
  - form: ग्रामम्
    lemma: ग्राम
    gloss: to the village
    notes:
    - term: कर्मन्
      en: goal of motion
    - term: द्वितीया
      en: accusative
  - form: गच्छतः
    lemma: गम्
    gloss: the two go
    notes:
    - term: गम्
      en: '"go"'
    - term: लट्
      en: present
    - term: प्रथमपुरुष
      en: third person
    - cite: '1.4.101'
      role: तिङस्त्रीणि त्रीणि प्रथममध्यमोत्तमाः — each triad of तिङ् endings is प्रथम/मध्यम/उत्तम
    - cite: '1.4.102'
      role: तान्येकवचनद्विवचनबहुवचनान्येकशः — within a triad the three are एक/द्वि/बहुवचन
    - cite: '3.4.78'
      role: 'तिप्तस्झि… — the तस् ending (प्रथम·द्वि) → गच्छतः'
    - term: द्विवचन
      en: dual
  vyakhya: द्वयोः कर्त्रोः द्विवचनम्। प्रथमपुरुषस्य द्विवचनं तस् — गच्छतः। एको गच्छति, द्वौ गच्छतः।
  vyakhya_en: |
    Number lives on the verb too. नरौ are two, so the verb takes the द्विवचन ending: of the प्रथम triad तिप्-तस्-झि (1.4.101/102), the middle one तस् gives गच्छतः. Side by side: गच्छति (one goes), गच्छतः (two go) — same root, tense, person; only वचन shifts.

- id: ex149
  segment: 9
  sentence: यदि सः अगमिष्यत् तर्हि सुखम् अलप्स्यत।
  translation: Had he gone, he would have obtained happiness.
  teaches: 'लृङ् — the conditional, for an act that did NOT come about (क्रियातिपत्ति, counterfactual)'
  words:
  - form: यदि
    lemma: यदि
    gloss: if
    notes:
    - term: अव्यय
      en: '"if" — marks the counterfactual condition'
  - form: सः
    lemma: तद्
    gloss: he
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: अगमिष्यत्
    lemma: गम्
    gloss: would have gone
    notes:
    - term: गम्
      en: '"go" — conditional (लृङ्)'
    - cite: '3.3.139'
      role: लिङ्निमित्ते लृङ् क्रियातिपत्तौ — when the act fails to happen, लृङ् → अगमिष्यत्
    - term: लृङ्
      en: conditional (augment अ + future-stem + लङ्-endings)
  - form: तर्हि
    lemma: तर्हि
    gloss: then
    notes:
    - term: अव्यय
      en: '"then" — heads the counterfactual result'
  - form: सुखम्
    lemma: सुख
    gloss: happiness
    notes:
    - term: कर्मन्
      en: object
    - cite: '2.3.2'
      role: कर्मणि द्वितीया → सुखम्
    - term: द्वितीया
      en: accusative
  - form: अलप्स्यत
    lemma: लभ्
    gloss: would have obtained
    notes:
    - term: लभ्
      en: '"obtain" — conditional (लृङ्, ātmanepada)'
    - cite: '3.3.139'
      role: लिङ्निमित्ते लृङ् क्रियातिपत्तौ → अलप्स्यत
    - term: लृङ्
      en: conditional
  vyakhya: क्रियायाः अनिष्पत्तौ लृङ्। यदि अगमिष्यत् — न तु अगच्छत्। फलमपि न लब्धम्।
  vyakhya_en: |
    The लृङ् conditional is for what would-have-been but was NOT — क्रियातिपत्ति, the act's non-occurrence (3.3.139). It looks like the future-stem (गमिष्य-, लप्स्य-) with the augment अ and the लङ् imperfect endings: अगमिष्यत्, अलप्स्यत. यदि सः अगमिष्यत् "had he gone" — implying he did not. This completes the ten लकारs: present, three pasts, two futures, three moods, and now the conditional.
- id: ex150
  segment: 9
  sentence: रामेण ग्रामः गम्यते।
  translation: The village is gone-to by Rāma. (Rāma goes to the village.)
  teaches: 'कर्मणि प्रयोग — the passive: the object becomes the nominative subject; agent → instrumental; यक् + आत्मनेपद'
  words:
  - form: रामेण
    lemma: राम
    gloss: by Rāma — the agent
    notes:
    - term: कर्तृ
      en: the agent, now in the instrumental (not nominative)
    - cite: '2.3.18'
      role: कर्तृकरणयोस्तृतीया → कर्तृ in the passive → रामेण
    - term: तृतीया
      en: instrumental
  - form: ग्रामः
    lemma: ग्राम
    gloss: the village — now the grammatical subject
    notes:
    - term: कर्मन्
      en: the logical object, raised to nominative subject in the passive
    - cite: '2.3.46'
      role: प्रातिपदिकार्थ…प्रथमा → the कर्म, when verb-denoted, takes प्रथमा → ग्रामः
    - term: प्रथमा
      en: nominative
  - form: गम्यते
    lemma: गम्
    gloss: is gone-to
    notes:
    - term: गम्
      en: '"go" — PASSIVE'
    - cite: '3.1.67'
      role: सार्वधातुके यक् — the passive विकरण यक् (य) → गम्यते
    - cite: '3.4.69'
      role: लः कर्मणि च — the ल-affix denotes the कर्म (passive) → ātmanepada ending
    - cite: '1.3.13'
      role: भावकर्मणोः — passive/impersonal take आत्मनेपद → गम्यते
    - term: कर्मणि
      en: passive voice
  vyakhya: कर्मणि यक्, आत्मनेपदं च। रामः गच्छति → रामेण ग्रामः गम्यते।
  vyakhya_en: |
    The passive (कर्मणि प्रयोग) re-stages the same act: the OBJECT becomes the nominative subject (ग्रामः), the AGENT drops to the instrumental (रामेण), and the verb takes the passive marker यक् (य, 3.1.67) with ātmanepada endings (1.3.13) — गम्यते "is gone-to." Active रामः ग्रामं गच्छति = passive रामेण ग्रामः गम्यते. The ल-affix now points to the कर्म, not the कर्तृ (3.4.69).
- id: ex151
  segment: 9
  sentence: देवदत्तेन सुप्यते।
  translation: It is slept by Devadatta. (Devadatta sleeps.)
  teaches: 'भावे प्रयोग — the impersonal passive of an intransitive verb: no subject, agent in the instrumental'
  words:
  - form: देवदत्तेन
    lemma: देवदत्त
    gloss: by Devadatta — the agent
    notes:
    - term: कर्तृ
      en: the agent, in the instrumental (no nominative exists)
    - cite: '2.3.18'
      role: कर्तृकरणयोस्तृतीया → कर्तृ in भाव/passive → देवदत्तेन
    - term: तृतीया
      en: instrumental
  - form: सुप्यते
    lemma: स्वप्
    gloss: it is slept (sleeping happens)
    notes:
    - term: स्वप्
      en: '"sleep" — intransitive; here IMPERSONAL passive (भावे)'
    - cite: '3.4.69'
      role: …भावे चाकर्मकेभ्यः — for intransitive roots the ल-affix denotes भाव (the bare act)
    - cite: '1.3.13'
      role: भावकर्मणोः → आत्मनेपद → सुप्यते (3sg, no agreement with any noun)
    - term: भावे
      en: impersonal (action-only) voice
  vyakhya: अकर्मकात् भावे प्रयोगः। कर्तृ तृतीयायाम्, क्रिया एव प्रधाना। देवदत्तेन सुप्यते।
  vyakhya_en: |
    An intransitive verb has no object to promote, so its passive is IMPERSONAL — भावे प्रयोग, "the bare act" (3.4.69 …भावे चाकर्मकेभ्यः). There is no subject at all: the verb stands in a fixed 3rd-singular (सुप्यते), and the agent is instrumental (देवदत्तेन). Literally "it-is-slept by Devadatta" = "Devadatta sleeps." Sanskrit's way of foregrounding the action over the doer.
- id: ex152
  segment: 9
  sentence: सः अकार्षीत्।
  translation: He did (it). / He made (it).
  teaches: 'लुङ् — the aorist, the simple/unmarked past (no restriction to a time-frame)'
  words:
  - form: सः
    lemma: तद्
    gloss: he
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: अकार्षीत्
    lemma: कृ
    gloss: did, made
    notes:
    - term: कृ
      en: '"do, make" — AORIST (लुङ्)'
    - cite: '3.2.110'
      role: लुङ् — past action without a time restriction → the aorist → अकार्षीत्
    - term: लुङ्
      en: aorist (augment अ + सिच् + endings)
  vyakhya: सामान्ये भूते लुङ्। अकार्षीत् — न अद्यतनानद्यतनविशेषः। कृ-धातोः सिजन्तम्।
  vyakhya_en: |
    The लुङ् aorist is the UNMARKED past: plain "did," with none of the today/before-today restrictions that लङ् (अकरोत्, imperfect) and लिट् (चकार, perfect) carry — 3.2.110 simply says लुङ् for past action. √कृ → अकार्षीत् "he did," with the augment अ and the सिच् marker. So √कृ now spans all four pasts-and-presents: करोति · अकरोत् · चकार · अकार्षीत्, plus the future करिष्यति. The full time-axis of one root.
- id: ex153
  segment: 9
  sentence: बालः पचति, ओदनः पच्यते।
  translation: The boy cooks; the rice is cooked.
  teaches: 'कर्तरि शप् vs कर्मणि यक् — the विकरण (stem-marker) shows the voice: active शप् (अ) vs passive यक् (य)'
  words:
  - form: बालः
    lemma: बाल
    gloss: the boy
    notes:
    - term: कर्तृ
      en: agent (active clause)
    - term: प्रथमा
      en: nominative
  - form: पचति
    lemma: पच्
    gloss: cooks (active)
    notes:
    - term: पच्
      en: '"cook" — ACTIVE'
    - cite: '3.1.68'
      role: कर्तरि शप् — in the active, the विकरण शप् (अ) → पच् + अ + ति → पचति
    - term: शप्
      en: the active class-marker (अ)
    - term: लट्
      en: present
  - form: ओदनः
    lemma: ओदन
    gloss: the rice — subject of the passive clause
    notes:
    - term: कर्मन्
      en: the object, raised to nominative in the passive
    - term: प्रथमा
      en: nominative
  - form: पच्यते
    lemma: पच्
    gloss: is cooked (passive)
    notes:
    - term: पच्
      en: '"cook" — PASSIVE'
    - cite: '3.1.67'
      role: सार्वधातुके यक् — in the passive, the विकरण यक् (य) → पच् + य + ते → पच्यते
    - term: यक्
      en: the passive marker (य)
    - term: कर्मणि
      en: passive voice
  vyakhya: कर्तरि शप्, कर्मणि यक्। पच् + अ → पचति; पच् + य → पच्यते। विकरणः प्रयोगं सूचयति।
  vyakhya_en: |
    What tells active from passive is the विकरण — the little stem-marker between root and ending. Active uses शप्, अ (3.1.68 कर्तरि शप्): पच् + अ + ति → पचति "cooks." Passive uses यक्, य (3.1.67 सार्वधातुके यक्): पच् + य + ते → पच्यते "is cooked." Same root पच्, same tense; the विकरण अ vs य, and the ending परस्मै- vs आत्मनेपद, carry the whole voice contrast.
- id: ex154
  segment: 9
  kind: paradigm
  sentence: भवामि भवावः भवामः। भवसि भवथः भवथ। भवति भवतः भवन्ति।
  translation: 'Present tense of भू "be", all nine cells: I/we-two/we am/are; you/you-two/you-all are; he/those-two/they are.'
  teaches: 'the तिङ् present-tense paradigm in one place — three पुरुष × three वचन, parallel to the देव declension table (ex094)'
  words:
  - form: भवामि
    lemma: भू
    gloss: I am
    notes:
    - term: उत्तमपुरुष
      en: 1st person singular
    - cite: '3.4.78'
      role: तिप्तस्झि… — the ending series; 1sg मिप् → भवामि
    - term: एकवचन
      en: singular
  - form: भवावः
    lemma: भू
    gloss: we two are
    notes:
    - term: उत्तमपुरुष
      en: 1st person dual (वस्) → भवावः
    - term: द्विवचन
      en: dual
  - form: भवामः
    lemma: भू
    gloss: we (all) are
    notes:
    - term: उत्तमपुरुष
      en: 1st person plural (मस्) → भवामः
    - term: बहुवचन
      en: plural
  - form: भवसि
    lemma: भू
    gloss: you are
    notes:
    - term: मध्यमपुरुष
      en: 2nd person singular (सिप्) → भवसि
    - term: एकवचन
      en: singular
  - form: भवथः
    lemma: भू
    gloss: you two are
    notes:
    - term: मध्यमपुरुष
      en: 2nd person dual (थस्) → भवथः
    - term: द्विवचन
      en: dual
  - form: भवथ
    lemma: भू
    gloss: you all are
    notes:
    - term: मध्यमपुरुष
      en: 2nd person plural (थ) → भवथ
    - term: बहुवचन
      en: plural
  - form: भवति
    lemma: भू
    gloss: he/she/it is
    notes:
    - term: प्रथमपुरुष
      en: 3rd person singular (तिप्) → भवति
    - cite: '3.4.78'
      role: तिप्तस्झि… → 3sg तिप् → भवति
    - term: एकवचन
      en: singular
  - form: भवतः
    lemma: भू
    gloss: those two are
    notes:
    - term: प्रथमपुरुष
      en: 3rd person dual (तस्) → भवतः
    - term: द्विवचन
      en: dual
  - form: भवन्ति
    lemma: भू
    gloss: they are
    notes:
    - term: प्रथमपुरुष
      en: 3rd person plural (झि → अन्ति) → भवन्ति
    - cite: '1.4.21'
      role: बहुषु बहुवचनम् → plural → भवन्ति
    - term: बहुवचन
      en: plural
  vyakhya: लटि परस्मैपदस्य नव तिङः — त्रयः पुरुषाः त्रीणि वचनानि च। भू + शप् + तिङ् = भवति इत्यादि।
  vyakhya_en: |
    You met the तिङ् frame one cell at a time (ex014–016, ex092). Here is the WHOLE present-tense paradigm of भू "be" in one place — the verbal counterpart to the देव declension table (ex094). Read across each row for a person (उत्तम / मध्यम / प्रथम), down each column for a number (sg · dual · pl). The nine endings come from one master sūtra, तिप्तस्झि… (3.4.78); the stem is भू + शप् (अ) → भव-. Learn these nine and every parasmaipada present (गच्छति, पठति, वदति) falls into place.
