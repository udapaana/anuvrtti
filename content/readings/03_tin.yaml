#  Extends the √कृ thread (करोति · अकरोत् · चकार · करिष्यति) to the remaining
#  लकारs: लुङ् aorist, लुट् periphrastic future, लङ् vs लिट् (anadyatana/parokṣa),
#  आशीर्लिङ् benedictive. Forms stated as siddha facts; derivation deferred.
# ════════════════════════════════════════════════════════════════════════

- id: ex060
  segment: 9
  sentence: सः ह्यः तत् अकरोत्।
  translation: He did that yesterday.
  teaches: 'लङ् — the imperfect, for a NON-today (अनद्यतन) past'
  words:
  - form: सः
    gloss: he
    notes:
    - term: सर्वनाम
      en: pronoun (तद्)
    - cite: 1.1.27
      role: सर्वादीनि सर्वनामानि → सः
    - term: प्रथमा
      en: nominative
  - form: ह्यः
    gloss: yesterday
    notes:
    - term: अव्यय
      en: indeclinable — "yesterday" (marks the अनद्यतन, not-today, past)
  - form: तत्
    gloss: that
    notes:
    - term: कर्मन्
      en: object
    - term: द्वितीया
      en: accusative
  - form: अकरोत्
    gloss: did, made
    notes:
    - term: कृ
      en: '"do, make"'
    - term: लङ्
      en: imperfect — past not including today
    - cite: 3.2.111
      role: अनद्यतने लङ् → the imperfect for a not-today past → अकरोत्
    - cite: 3.4.78
      role: 'तिङ्: तिप् (3·sg) on the past base → अकरोत् (with अट्-augment)'
  vyakhya: अनद्यतने भूते लङ्। ह्यः इति अनद्यतनकालः, अतः अकरोत्।
  vyakhya_en: |
    Sanskrit splits the past three ways by *remoteness*. लङ् (the imperfect, 3.2.111) is the past that does NOT fall on the current day — hence ह्यः "yesterday" → अकरोत् "he did." The अ- prefix (अट्-augment) is the past marker you also saw in अगच्छत्. Same root √कृ as करोति "does," now in the not-today past.

- id: ex061
  segment: 9
  sentence: सः पुरा तत् चकार।
  translation: He did that long ago.
  teaches: 'लिट् — the perfect, for a remote (परोक्ष) past beyond witness'
  words:
  - form: सः
    lemma: तद्
    gloss: he
    notes:
    - term: सर्वनाम
      en: pronoun (तद्)
    - term: प्रथमा
      en: nominative
  - form: पुरा
    gloss: long ago, formerly
    notes:
    - term: अव्यय
      en: indeclinable — "of old" (marks the परोक्ष, beyond-sight, past)
  - form: तत्
    lemma: तद्
    gloss: that
    notes:
    - term: सर्वनाम
      en: pronoun (तद्, neuter)
    - term: द्वितीया
      en: accusative
  - form: चकार
    gloss: did (long ago)
    notes:
    - term: कृ
      en: '"do, make"'
    - term: लिट्
      en: perfect — remote past, not directly witnessed
    - cite: 3.2.115
      role: परोक्षे लिट् → the perfect for a past beyond the speaker's witness → चकार (reduplicated)
  vyakhya: परोक्षे भूते लिट्। अदृष्टं चिरातीतं — चकार। तदेव कृ-धातुः, द्विरुक्तम्।
  vyakhya_en: |
    The perfect (लिट्, 3.2.115) is the *remote* past — परोक्ष, "beyond the eye," what the speaker did not himself witness (history, legend, "long ago"). √कृ reduplicates to चकार "he did (of old)." Contrast ex060: अकरोत् (लङ्) is yesterday's deed, चकार (लिट्) is the ancient deed. The tense itself tells you how far back, and whether anyone saw it.

- id: ex062
  segment: 9
  sentence: सः अद्य तत् अकार्षीत्।
  translation: He did that today.
  teaches: 'लुङ् — the aorist, the tense-neutral past (and today’s past)'
  words:
  - form: सः
    lemma: तद्
    gloss: he
    notes:
    - term: सर्वनाम
      en: pronoun (तद्)
    - term: प्रथमा
      en: nominative
  - form: अद्य
    gloss: today
    notes:
    - term: अव्यय
      en: indeclinable — "today"
  - form: तत्
    lemma: तद्
    gloss: that
    notes:
    - term: सर्वनाम
      en: pronoun (तद्, neuter)
    - term: द्वितीया
      en: accusative
  - form: अकार्षीत्
    gloss: did, has done
    notes:
    - term: कृ
      en: '"do, make"'
    - term: लुङ्
      en: aorist — the general past (and the past of today)
    - cite: 3.2.110
      role: लुङ् → the aorist for past sense → अकार्षीत्
    - cite: 3.1.44
      role: 'च्लेः सिच् — the aorist takes the सिच् (s-aorist) marker (derivation deferred)'
  vyakhya: भूते सामान्ये लुङ्। अद्यतनं भूतम् अपि लुङा — अकार्षीत्।
  vyakhya_en: |
    The aorist (लुङ्, 3.2.110) is the *unmarked* past — it states a past act without committing to remoteness, and it is the proper past for *today's* events (अद्य "today" → अकार्षीत् "he has done"). √कृ now spans all three pasts: अकरोत् (yesterday, लङ्) · चकार (long ago, लिट्) · अकार्षीत् (today, लुङ्). The full form-building (सिच्, वृद्धि) is a Track-B derivation.

- id: ex063
  segment: 9
  sentence: सः श्वः तत् कर्ता।
  translation: He will do that tomorrow.
  teaches: 'लुट् — the periphrastic future, for a NON-today (अनद्यतन) future'
  words:
  - form: सः
    lemma: तद्
    gloss: he
    notes:
    - term: सर्वनाम
      en: pronoun (तद्)
    - term: प्रथमा
      en: nominative
  - form: श्वः
    gloss: tomorrow
    notes:
    - term: अव्यय
      en: indeclinable — "tomorrow" (marks the अनद्यतन future)
  - form: तत्
    lemma: तद्
    gloss: that
    notes:
    - term: सर्वनाम
      en: pronoun (तद्, neuter)
    - term: द्वितीया
      en: accusative
  - form: कर्ता
    gloss: will do
    notes:
    - term: कृ
      en: '"do, make"'
    - term: लुट्
      en: periphrastic future — a future not on the current day
    - cite: 3.3.15
      role: अनद्यतने लुट् → the लुट् future for a not-today future → कर्ता (= कर्तृ + an understood अस्ति)
  vyakhya: अनद्यतने भविष्यति लुट्। श्वः इति अनद्यतनः, अतः कर्ता।
  vyakhya_en: |
    Sanskrit splits the FUTURE too. लुट् (3.3.15) is the future that does NOT fall today — श्वः "tomorrow" → कर्ता "he will do." It is "periphrastic": the form कर्ता is literally an agent-noun ("(he is) a doer (tomorrow)"). Contrast करिष्यति (लृट्, the general future, ex028). Past and future each have a today/not-today split — the लकार is the verb's calendar.

- id: ex064
  segment: 14
  sentence: सः कुर्यात्।
  translation: He should do (it). / Let him do (it).
  teaches: 'विधिलिङ् — the optative, for what ought or may happen'
  words:
  - form: सः
    lemma: तद्
    gloss: he
    notes:
    - term: सर्वनाम
      en: pronoun (तद्)
    - term: प्रथमा
      en: nominative
  - form: कुर्यात्
    gloss: should do, may do
    notes:
    - term: कृ
      en: '"do, make"'
    - term: विधिलिङ्
      en: optative — duty, possibility, rule ("should / may")
    - cite: 3.3.161
      role: विधिनिमन्त्रणामन्त्रण… लिङ् → लिङ् in commanding/advising/permitting → कुर्यात्
    - cite: 3.4.78
      role: 'तिङ्: the लिङ् 3·sg ending → कुर्यात्'
  vyakhya: विध्यादिषु लिङ्। कर्तव्यम् इति अर्थे — कुर्यात्। तदेव कृ-धातुः, विधिलिङि।
  vyakhya_en: |
    The optative (विधिलिङ्, 3.3.161) is the mood of *should* — duty, advice, permission, rule (विधि, निमन्त्रण, आमन्त्रण…). सः कुर्यात् "he should do / let him do." It is the mood in which Pāṇini's own rules are framed ("X should happen"). √कृ: करोति "does" (fact), कुर्यात् "should do" (norm). Tense says when; mood says how the speaker stands toward the act.

- id: ex065
  segment: 14
  sentence: सः कुर्यात् इति आशीः। क्रियात् सः।
  translation: 'May he do (it) — the blessing form kriyāt.'
  teaches: 'आशीर्लिङ् — the benedictive, a distinct लिङ् for blessings'
  words:
  - form: सः
    gloss: he
    notes:
    - term: सर्वनाम
      en: pronoun (तद्)
    - term: प्रथमा
      en: nominative
  - form: कुर्यात्
    lemma: कृ
    gloss: should do
    notes:
    - term: विधिलिङ्
      en: optative — "should do" (cf. ex064)
    - term: लट्
      en: (लिङ् mood)
  - form: इति
    lemma: इति
    gloss: thus ("…")
    notes:
    - term: अव्यय
      en: quotative — closes a name/quote
  - form: आशीः
    lemma: आशिस्
    gloss: a blessing
    notes:
    - term: आशीस्
      en: '"blessing" — the sense that selects आशीर्लिङ्'
    - term: प्रथमा
      en: nominative
  - form: क्रियात्
    gloss: may he do (benediction)
    notes:
    - term: कृ
      en: '"do, make"'
    - term: आशीर्लिङ्
      en: benedictive — the लिङ् used specifically for a blessing (आशीस्)
    - cite: 3.3.173
      role: आशिषि लिङ्लोटौ → for a blessing, लिङ् (or लोट्) is used
    - cite: 3.4.116
      role: लिङाशिषि → this लिङ् is the आशीर्लिङ् (distinct from the विधिलिङ्) → क्रियात्
  - form: सः
    lemma: तद्
    gloss: he
    notes:
    - term: सर्वनाम
      en: pronoun (तद्)
    - term: प्रथमा
      en: nominative
  vyakhya: आशिषि लिङ् — आशीर्लिङ्। "भूयात्", "क्रियात्" इति आशीर्वादरूपाणि।
  vyakhya_en: |
    A blessing has its own mood. For an आशीस् (benediction, "may you…") the लिङ् is used (3.3.173), and this benedictive लिङ् is formally distinct from the optative (3.4.116) — क्रियात् "may he do," भूयात् "may (he) be / may it prosper." So √कृ has two लिङ् forms: कुर्यात् "should do" (विधिलिङ्, the norm) vs क्रियात् "may he do" (आशीर्लिङ्, the blessing). The same mood-letter ल् branches by intent.

