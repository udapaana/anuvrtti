- id: ex234
  segment: 219
  sentence: धर्मस्य रक्षणम् नृपस्य कर्तव्यम्। तेन जनाः सुखम् लभन्ते।
  translation: The protection of dharma is the king's duty. By that, people obtain happiness.
  teaches: |
    the कृत्-governed षष्ठी twice — धर्मस्य, the object of the action-noun रक्षणम्
    (ल्युट्), and नृपस्य, the agent of the gerundive कर्तव्यम्.
  words:
  - form: धर्मस्य
    lemma: धर्म
    gloss: of dharma
    notes:
    - term: कर्मन्
      en: object of the action-noun रक्षणम्
    - cite: '2.3.65'
      role: कर्तृकर्मणोः कृति — object of a कृत्-noun takes षष्ठी → धर्मस्य
    - term: षष्ठी
      en: genitive
  - form: रक्षणम्
    lemma: रक्षण
    gloss: the protection
    vocab: true
    notes:
    - term: कृदन्त
      en: action-noun (declines, neuter)
    - term: ल्युट्
      en: the ल्युट् action-suffix (shows as -अन) — रक्ष् + ल्युट् → रक्षणम्
    - cite: '3.3.115'
      role: ल्युट् च — ल्युट् in the भाव/action sense → रक्ष् + ल्युट् → रक्षणम्
    - term: कर्तृ
      en: subject
    - term: प्रथमा
