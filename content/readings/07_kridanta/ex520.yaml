  vyakhya: 'गम्-धातोः क्तवतु — गतवत्। पुंसि गतवान्, स्त्रियाम् ङीप् — गतवती। क्तवतु कर्तरि, अतः कर्ता प्रथमायाम्।'
  vyakhya_en: |
    क्तवतु (3.2.102) says "has done", and agrees with the doer: रामः गतवान्, सीता गतवती — the feminine adds ङीप् (4.1.6). The participle stands in for a past verb with no अस्ति needed. With the preverb अनु, गम् means "follow", and its object भ्रातरम् is accusative.
