  sentence: 'अयोध्यायाम् जनाः शोचन्ति। रामः वनम् गतवान्। सीता अपि तेन सह गतवती। लक्ष्मणः अपि भ्रातरम् अनुगतवान्।'
  translation: 'In Ayodhyā the people grieve. Rāma has gone to the forest. Sītā too has gone with him. Lakṣmaṇa too has followed his brother.'
