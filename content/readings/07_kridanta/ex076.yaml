  vyakhya: लटः स्थाने शतृ — वर्तमाने कर्तरि। गच्छत् → गच्छन् नुमा। "गच्छन् पश्यति" = गच्छन् सन् पश्यति।
  vyakhya_en: 'The present participle: शतृ (active) replaces the present लट् (3.2.124) when the form is a participle agreeing with the agent — गम् → गच्छत्, which surfaces as गच्छन् (नुम्-insertion before strong endings, 7.1.70). "गच्छन् नरः सर्पम् पश्यति" = "the man, going, sees a snake" = "while he goes, he sees a snake." It is a त्-stem consonant participle, declining राजन्-style (strong/weak). The middle counterpart is शानच् (यजमानः "sacrificing").

    '
