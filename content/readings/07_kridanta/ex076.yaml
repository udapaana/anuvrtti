- id: ex076
  segment: 170
  sentence: गच्छन् नरः पश्यति।
  translation: The man, (while) going, sees.
  teaches: 'शतृ — the present active participle (replaces लट्)'
  words:
  - form: गच्छन्
    lemma: गम्
    gloss: going (while going)
    notes:
    - term: कृदन्त
      en: a present participle
    - term: शतृ
      en: the शतृ affix — present active participle, replacing लट्
    - cite: '3.2.124'
      role: लटः शतृशानचौ → शतृ/शानच् replace लट् for a participle → गच्छत् → गच्छन्
    - cite: '3.2.127'
      role: तौ सत् → these two are termed सत् (the "present-participle" साधन)
    - cite: '7.1.70'
      role: उगिदचां सर्वनामस्थाने → the त-stem inserts नुम् before strong endings → गच्छन्
    - term: विशेषण
      en: agrees with नरः (the agent)
  - form: नरः
    gloss: the man
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: पश्यति
    lemma: दृश्
    gloss: sees
    notes:
    - term: दृश्
      en: '"see"'
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  vyakhya: लटः स्थाने शतृ — वर्तमाने कर्तरि। गच्छत् → गच्छन् नुमा। "गच्छन् पश्यति" = गच्छन् सन् पश्यति।
  vyakhya_en: |
    The present participle: शतृ (active) replaces the present लट् (3.2.124) when the form is a participle agreeing with the agent — गम् → गच्छत्, which surfaces as गच्छन् (नुम्-insertion before strong endings, 7.1.70). "गच्छन् नरः पश्यति" = "the man, going, sees" = "while he goes, he sees." It is a त्-stem consonant participle, declining राजन्-style (strong/weak). The middle counterpart is शानच् (यजमानः "sacrificing").
