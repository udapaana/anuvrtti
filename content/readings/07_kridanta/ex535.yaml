  sentence: 'एकदा एकः शिष्यः गुरुम् पृष्टवान् — गुरो, मम किम् कर्तव्यम्? गुरुः उक्तवान् — प्रातः वेदः पठितव्यः। सायम् गवाम् सेवा कर्तव्या। सर्वदा सत्यवादी भव।'
  translation: 'Once a pupil asked his teacher: "Teacher, what is my duty?" The teacher said: "In the morning the Veda is to be studied. In the evening the cows are to be tended. Always be a speaker of truth."'
  teaches: 'क्तवतु for the past (पृष्टवान्, उक्तवान्) and तव्य gerundives agreeing in three genders'
