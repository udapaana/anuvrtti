  vyakhya: 'पृष्टवान् उक्तवान् इति क्तवत्वन्तौ। कर्तव्यम्, पठितव्यः, कर्तव्या — तव्यान्ताः, कर्मणः लिङ्गम् अनुसरन्ति।'
  vyakhya_en: |
    The past here is told with क्तवतु: प्रच्छ् → पृष्टवान् "asked", वच् → उक्तवान् "said" (the व of वच् contracts to उ). The duties are तव्य gerundives, each agreeing with its own subject: neuter कर्तव्यम् with किम्, masculine पठितव्यः with वेदः, feminine कर्तव्या with सेवा.
