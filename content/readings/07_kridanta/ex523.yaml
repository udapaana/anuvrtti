  sentence: 'कृषकः प्रतिदिनम् क्षेत्रम् गच्छति। सः वृक्षस्य अधः आसीनः वर्धमानानि सस्यानि पश्यति। सः हृष्यति, वदति च — अस्मिन् वर्षे धान्यम् बहु भविष्यति।'
  translation: 'Every day the farmer goes to the field. Sitting under a tree, he watches the growing crops. He is glad, and says: "This year there will be plenty of grain."'
  teaches: 'शानच् participles वर्धमानानि "growing" and आसीनः "sitting" — the second with ईन for आन'
