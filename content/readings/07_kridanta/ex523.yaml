  vyakhya: 'वृध्-धातोः शानच्, मुक् आगमः — वर्धमानः। आस्-धातोः शानच्, आनस्य ईनः — आसीनः।'
  vyakhya_en: |
    वृध् "grow" is आत्मनेपदी: वर्ध + शानच्, and after a thematic stem the आन gains म् (7.2.82) — वर्धमान, here neuter plural with सस्यानि. आस् "sit" also takes शानच्, but after आस् the आन becomes ईन (7.2.83): आसीनः.
