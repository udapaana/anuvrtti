  sentence: 'पथिकाः ग्रामम् आगच्छन्ति। ते तृषिताः। नद्याः जलम् मलिनम्, न पेयम्। कूपस्य जलम् शुद्धम्, पेयम् च। ग्रामस्य जनाः पथिकेभ्यः खाद्यम् अपि ददति।'
  translation: 'Travellers come to the village. They are thirsty. The river''s water is muddy — not fit to drink. The well''s water is clean and fit to drink. The village people also give the travellers something to eat.'
  teaches: 'यत् and ण्यत् gerundives — पेयम् "drinkable" (पा + यत्), खाद्यम् "edible" (खाद् + ण्यत्)'
