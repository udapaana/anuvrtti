  vyakhya: 'पातुम् योग्यम् पेयम् — पा-धातोः यत्, आकारस्य ईकारः, गुणः। खादितुम् योग्यम् खाद्यम् — ण्यत्।'
  vyakhya_en: |
    पेयम् is पा "drink" + यत् (3.1.97): the root's आ becomes ई (6.4.65) and then takes गुण, पे + य. खाद्यम् is खाद् + ण्यत् (3.1.124), the consonant-final root's gerundive. Both mean "fit to be —ed", so water is पेयम् or न पेयम्, and food given to guests is खाद्यम्.
