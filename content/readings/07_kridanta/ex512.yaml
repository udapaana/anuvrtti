  vyakhya: 'जलम् मुञ्चति इति जलमुक्। मुच्-धातोः क्विप्, तस्य सर्वापहारी लोपः। प्रथमैकवचने चकारस्य ककारः।'
  vyakhya_en: |
    जलमुच् is "what releases water" — मुच् with the zero affix क्विप् (3.2.76), which disappears entirely, so the bare root becomes a noun stem with जल before it. It declines as a consonant stem: जलमुचः in the plural, and जलमुक् in the singular, where the final च् becomes क् at the end of a word.
