  sentence: 'ग्रीष्मे क्षेत्राणि शुष्काणि। कृषकाः प्रतिदिनम् आकाशम् पश्यन्ति। एकदा जलमुचः आगच्छन्ति। जलमुक् गर्जति, वृष्टिः च पतति। कृषकाः हृष्यन्ति।'
  translation: 'In summer the fields are dry. Every day the farmers watch the sky. One day the clouds — the water-releasers — come. A cloud thunders, and rain falls. The farmers rejoice.'
