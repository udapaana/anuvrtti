  sentence: 'सीता मित्राय एकम् पुस्तकम् ददाति। सा वदति — इदम् पुस्तकम् पठनीयम्। अस्य कथाः रमणीयाः, स्मरणीयाः च।'
  translation: 'Sītā gives her friend a book. She says: "This book is worth reading. Its stories are delightful, and worth remembering."'
