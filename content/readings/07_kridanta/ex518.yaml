  vyakhya: 'पठनीयम्, रमणीयाः, स्मरणीयाः — अनीयर्-प्रत्ययान्ताः। पठितुम् योग्यम् पठनीयम्।'
  vyakhya_en: |
    अनीयर् (3.1.96) is the other common gerundive: पठ् + अनीय → पठनीय "fit to be read". On रम् it gives रमणीय, with न् turned to ण् after the र् (8.4.2) — "to be delighted in". On स्मृ the ऋ takes गुण: स्मरणीय. Like तव्य, each agrees with the thing judged.
