- id: ex516
  kind: graded
  segment: 175
  sentence: 'सभायाम् गुरुः वक्ता, शिष्याः श्रोतारः। वक्ता धर्मस्य कथाम् वदति। श्रोतारः तूष्णीम् शृण्वन्ति।'
  translation: 'In the assembly the teacher is the speaker, the pupils the listeners. The speaker tells a story of dharma. The listeners listen in silence.'
  teaches: 'तृच् nouns वक्ता and श्रोतारः — singular and plural of the agent in -तृ'
  words:
  - form: सभायाम्
    lemma: सभा
    gloss: 'in the assembly'
    notes:
    - term: अधिकरण
      en: 'where'
    - term: सप्तमी
      en: 'आ-stem feminine locative in आयाम्'
  - form: गुरुः
    lemma: गुरु
    gloss: 'the teacher'
    notes:
    - term: प्रथमा
      en: 'nominative'
    - term: कर्तृ
      en: 'subject of an understood अस्ति'
  - form: वक्ता
    lemma: वच्
    gloss: 'speaker'
    notes:
    - term: तृच्
      en: 'वच् + तृच् — च् becomes क् before त'
    - term: प्रथमा
      en: 'nominative predicate'
    - term: कर्तरि
      en: 'the one who speaks'
    - cite: '3.1.133'
      role: 'ण्वुल्तृचौ → वच् + तृच् → वक्ता'
  - form: शिष्याः
    lemma: शिष्य
