      en: 'present plural — the verb behind श्रोतारः'
  vyakhya: 'वक्ति इति वक्ता, शृणोति इति श्रोता — तृच्। बहुवचने श्रोतारः।'
  vyakhya_en: |
    वक्ता "speaker" is वच् + तृच् and श्रोता "listener" is श्रु + तृच्; the root vowel takes गुण before तृ (श्रु → श्रो). In the plural the ऋ-stem shows गुण with lengthening: श्रोतृ + जस् → श्रोतारः.
