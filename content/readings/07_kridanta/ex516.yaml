      en: 'nominative plural'
    - term: कर्तृ
      en: 'subject'
  - form: श्रोतारः
    lemma: श्रु
    gloss: 'listeners'
    notes:
    - term: तृच्
      en: 'श्रु + तृच् — उ takes गुण: श्रोतृ'
    - term: प्रथमा
      en: 'nominative plural — श्रोतृ + जस् → श्रोतारः'
    - term: कर्तरि
      en: 'those who listen'
    - term: पुंलिङ्ग
      en: 'masculine'
    - term: बहुवचन
      en: 'plural'
  - form: वक्ता
    lemma: वच्
    gloss: 'the speaker'
    notes:
    - term: तृच्
      en: 'the agent noun as subject'
    - term: प्रथमा
      en: 'nominative'
    - term: कर्तृ
      en: 'the one who tells'
    - term: कर्तरि
      en: 'agent'
  - form: धर्मस्य
    lemma: धर्म
