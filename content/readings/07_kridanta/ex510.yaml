- id: ex510
  kind: graded
  segment: 160
  sentence: 'माता प्रातः पाकम् करोति। पाकस्य गन्धः गृहे प्रसरति। बालकः गन्धम् जिघ्रति, हृष्यति च।'
  translation: 'In the morning Mother does the cooking. The smell of the cooking spreads through the house. The boy smells it and is delighted.'
  teaches: 'घञ् action-noun पाकः "cooking" from पच्, in the accusative and the genitive'
  words:
  - form: माता
    lemma: मातृ
    gloss: 'Mother'
    notes:
    - term: कर्तृ
      en: 'the one cooking'
    - term: प्रथमा
      en: 'nominative of the ऋ-stem मातृ — मातृ + सु → माता'
  - form: प्रातः
    lemma: प्रातर्
    gloss: 'in the morning'
    notes:
    - term: अव्यय
      en: 'time adverb — "at dawn, in the morning"'
