  vyakhya: 'पच्-धातोः भावे घञ्, चकारस्य कुत्वम् — पाकः। माता पाकम् करोति इति क्रियायाः नाम।'
  vyakhya_en: |
    पाकः is the act of cooking: पच् + घञ् (3.3.18), with the root's अ lengthened (7.2.116) and च् turned to क् before an affix marked घ् (7.3.52). It declines like any अ-stem noun — पाकम् as the object of करोति, पाकस्य "of the cooking".
