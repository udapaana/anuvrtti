    lemma: पच्
    gloss: 'the cooking'
    notes:
    - term: घञ्
      en: 'पच् + घञ् — the bare act of cooking; च् becomes क्'
    - term: कर्मन्
      en: 'what she does — object of करोति'
    - term: द्वितीया
      en: 'accusative of the अ-stem पाक'
    - term: भावे
      en: 'names the action itself, not a doer'
    - cite: '3.3.18'
      role: 'भावे घञ् → पच् + घञ् → पाकः'
