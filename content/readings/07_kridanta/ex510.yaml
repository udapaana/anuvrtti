      en: 'present — करोति "does", तनादि with उ'
  - form: पाकस्य
    lemma: पच्
    gloss: 'of the cooking'
    notes:
    - term: घञ्
      en: 'the same action-noun, now genitive'
    - term: षष्ठी
      en: 'genitive — whose smell'
    - term: सम्बन्ध
      en: 'the smell belongs to the cooking'
    - term: भावे
      en: 'the act, not the cook'
  - form: गन्धः
    lemma: गन्ध
    gloss: 'the smell'
    notes:
    - term: कर्तृ
      en: 'what spreads'
    - term: प्रथमा
