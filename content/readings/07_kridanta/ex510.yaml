  - form: गृहे
    lemma: गृह
    gloss: 'through the house'
    notes:
    - term: अधिकरण
      en: 'where it spreads'
    - term: सप्तमी
      en: 'locative of गृह'
  - form: प्रसरति
    lemma: सृ
    gloss: 'spreads'
    notes:
