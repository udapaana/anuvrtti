  vyakhya: 'वक्तव्यम्, दातव्यम्, रक्षितव्याः — तव्यत्-प्रत्ययान्ताः। कर्मणि प्रयोगः, अतः कर्म प्रथमायाम् — सत्यम्, अन्नम्, वृद्धाः।'
  vyakhya_en: |
    तव्य (3.1.96) makes "to be done": वच् → वक्तव्य, दा → दातव्य, रक्ष् → रक्षितव्य. It is passive in sense, so what is to be done stands in the nominative and the gerundive agrees with it — neuter सत्यम् वक्तव्यम्, masculine plural वृद्धाः रक्षितव्याः. A teacher's parting charge is exactly where Sanskrit uses it.
