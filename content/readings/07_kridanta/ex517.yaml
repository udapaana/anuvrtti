  sentence: 'शिष्याः गुरोः आश्रमात् गृहम् गच्छन्ति। गुरुः तान् वदति — सत्यम् वक्तव्यम्। दीनेभ्यः अन्नम् दातव्यम्। वृद्धाः रक्षितव्याः।'
  translation: 'The pupils are leaving the teacher''s hermitage for home. The teacher tells them: "Truth is to be spoken. Food is to be given to the poor. The old are to be protected."'
