- id: ex515
  kind: graded
  segment: 175
  sentence: 'रामः अयोध्यायाः राजा आसीत्। सः प्रजानाम् रक्षिता, दीनानाम् च दाता। प्रजाः रामम् पितरम् इव पश्यन्ति।'
  translation: 'Rāma was king of Ayodhyā. He was the protector of his subjects and the giver to the poor. The subjects see Rāma as a father.'
  teaches: 'तृच् agent nouns रक्षिता and दाता, with their objects in the genitive'
  words:
  - form: रामः
    lemma: राम
    gloss: 'Rāma'
    notes:
    - term: कर्तृ
      en: 'subject of आसीत्'
    - term: प्रथमा
      en: 'nominative'
  - form: अयोध्यायाः
    lemma: अयोध्या
    gloss: 'of Ayodhyā'
    notes:
    - term: षष्ठी
      en: 'genitive — आ-stem feminine takes याः'
    - term: सम्बन्ध
      en: 'king OF Ayodhyā'
  - form: राजा
    lemma: राजन्
    gloss: 'king'
    notes:
    - term: प्रथमा
      en: 'nominative — the predicate, राजन् → राजा'
    - term: कर्तृ
      en: 'predicate with रामः'
  - form: आसीत्
    lemma: अस्
    gloss: 'was'
    notes:
    - term: लङ्
      en: 'imperfect of अस्'
  - form: सः
    lemma: तद्
    gloss: 'he'
    notes:
    - term: सर्वनाम
      en: 'Rāma'
    - term: प्रथमा
      en: 'nominative'
    - term: कर्तृ
      en: 'subject'
  - form: प्रजानाम्
    lemma: प्रजा
    gloss: 'of the subjects'
    notes:
    - term: षष्ठी
      en: 'genitive — the object of a तृच् noun goes in षष्ठी'
    - term: सम्बन्ध
      en: 'whom he protects'
    - cite: '2.3.65'
      role: 'कर्तृकर्मणोः कृति → object of रक्षिता in the genitive'
  - form: रक्षिता
    lemma: रक्ष्
    gloss: 'protector'
    notes:
