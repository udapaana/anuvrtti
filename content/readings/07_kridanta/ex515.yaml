      en: 'रक्ष् + इट् + तृच् → रक्षितृ'
    - term: प्रथमा
      en: 'nominative — ऋ-stem: रक्षितृ → रक्षिता'
    - term: कर्तरि
      en: 'names the doer'
    - cite: '3.1.133'
      role: 'ण्वुल्तृचौ → रक्ष् + तृच् → रक्षिता'
  - form: दीनानाम्
    lemma: दीन
    gloss: 'of the poor'
    notes:
    - term: षष्ठी
      en: 'genitive plural — again the object of a तृच् noun'
    - term: सम्बन्ध
      en: 'to whom he gives'
  - form: च
    lemma: च
    gloss: 'and'
    notes:
    - term: अव्यय
      en: '"and" — joins the two titles'
    - term: निपात
      en: 'particle'
  - form: दाता
    lemma: दा
    gloss: 'giver'
    notes:
    - term: तृच्
      en: 'दा + तृच् → दातृ'
    - term: प्रथमा
      en: 'nominative — दातृ → दाता'
    - term: कर्तरि
      en: 'names the giver'
  - form: प्रजाः
    lemma: प्रजा
    gloss: 'the subjects'
    notes:
    - term: कर्तृ
      en: 'those who see'
    - term: प्रथमा
      en: 'nominative plural'
  - form: रामम्
    lemma: राम
    gloss: 'Rāma'
    notes:
    - term: कर्मन्
      en: 'the one seen'
    - term: द्वितीया
      en: 'accusative'
  - form: पितरम्
    lemma: पितृ
    gloss: 'a father'
    notes:
