  vyakhya: 'रक्षति इति रक्षिता, ददाति इति दाता — तृच्-प्रत्ययः। कर्तृकर्मणोः कृति इति कर्मणि षष्ठी — प्रजानाम्, दीनानाम्।'
  vyakhya_en: |
    रक्षिता and दाता are तृच् nouns (3.1.133): रक्ष् + इट् + तृ, दा + तृ — "protector", "giver". After a कृत् noun like these the object goes in the genitive (2.3.65), so "protector of the subjects" is प्रजानाम् रक्षिता, not प्रजाः. Both decline like पितृ: nominative singular in -ता.
