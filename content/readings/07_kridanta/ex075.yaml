- id: ex075
  segment: 160
  sentence: नरेण ओदनः कृतः।
  translation: The rice was made by the man.
  teaches: 'क्त as a passive past participle, with the agent in the तृतीया'
  words:
  - form: नरेण
    gloss: by the man
    notes:
    - term: कर्तृ
      en: agent — but in the passive, expressed by तृतीया
    - cite: '2.3.18'
      role: कर्तृकरणयोस्तृतीया → the agent of a passive takes तृतीया → नरेण (with णत्व, 8.4.1)
    - term: तृतीया
      en: instrumental
  - form: ओदनः
    gloss: the rice (cooked)
    notes:
    - term: कर्मन्
      en: the object — but the grammatical subject of the passive participle
    - term: प्रथमा
      en: nominative
  - form: कृतः
    lemma: कृ
    gloss: (was) made
    notes:
    - term: कृदन्त
      en: क्त participle of कृ "do/make"
    - cite: '3.2.102'
      role: निष्ठा → क्त → कृ + त → कृतः
    - term: विशेषण
      en: agrees with ओदनः (the patient), not the agent
    - term: प्रथमा
      en: nominative
  vyakhya: क्तप्रत्ययः कर्मणि — कर्ता तृतीयायाम्, कर्म प्रथमायाम्। नरेण ओदनः कृतः।
  vyakhya_en: |
    The क्त participle is usually PASSIVE: it agrees with the patient, and the agent stands in the instrumental (2.3.18) — exactly the कर्मणि (passive) construction. नरेण ओदनः कृतः = "by the man the rice (was) made." This is the everyday Sanskrit past: not a finite verb but a participle + agent-in-तृतीया. (Note रामेण-style णत्व in नरेण.)
