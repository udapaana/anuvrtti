  sentence: 'देवदत्तः नाम वणिक् नगरे वसति। अस्मिन् वर्षे तस्य लाभः महान्। सः लाभस्य भागम् निर्धनेभ्यः ददाति। जनाः तस्य त्यागम् प्रशंसन्ति।'
  translation: 'A merchant named Devadatta lives in the city. This year his profit is great. He gives a share of the profit to the poor. People praise his giving.'
  teaches: 'three घञ् nouns — लाभः from लभ्, भागः from भज्, त्यागः from त्यज्'
