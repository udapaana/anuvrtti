  vyakhya: 'लभ्-धातोः लाभः, भज्-धातोः भागः, त्यज्-धातोः त्यागः — त्रयः अपि घञन्ताः। घञि उपधायाः वृद्धिः, चजोः कुत्वम्।'
  vyakhya_en: |
    All three nouns are घञ् on a root: the अ of the root lengthens (7.2.116), and a final च् or ज् becomes a velar (7.3.52) — so भज् gives भागः and त्यज् gives त्यागः. लभ् has no palatal, so लाभः only lengthens. Each names the thing the action yields: what is gained, the portion, the giving-up.
