  vyakhya: 'क्तवतुप्रत्ययान्तः शब्दः कर्तुः लिङ्गम् अनुसरति — पुत्री वदति, अतः कृतवती, पठितवती, गतवती।'
  vyakhya_en: |
    A क्तवतु participle takes the gender of the doer, whatever the person — so a girl says अहम् … पठितवती and is asked त्वम् … कृतवती; a boy would say पठितवान्. पठ् takes इट् (पठितवत्); कृ and गम् do not.
