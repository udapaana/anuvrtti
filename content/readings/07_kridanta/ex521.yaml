  sentence: 'सायम् पिता पुत्रीम् पृच्छति — पुत्रि, अद्य त्वम् किम् कृतवती? पुत्री वदति — अहम् प्रातः पुस्तकम् पठितवती, सायम् उद्यानम् गतवती।'
  translation: 'In the evening the father asks his daughter: "Daughter, what did you do today?" The daughter says: "In the morning I read a book; in the evening I went to the garden."'
  teaches: 'feminine क्तवतु as a past verb with अहम् and त्वम् — कृतवती, पठितवती, गतवती'
