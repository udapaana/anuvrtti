- id: ex074
  segment: 160
  sentence: ग्रामं गतः नरः।
  translation: The man (who has) gone to the village.
  teaches: 'क्त — the past participle (निष्ठा); a root made into an adjective'
  words:
  - form: ग्रामं
    gloss: to the village
    notes:
    - term: कर्मन्
      en: goal of the going
    - cite: '2.3.2'
      role: कर्मणि द्वितीया → ग्रामम् (→ ग्रामं before ग)
    - term: द्वितीया
      en: accusative
  - form: गतः
    lemma: गम्
    gloss: gone (having gone)
    notes:
    - term: कृदन्त
      en: a कृत्-formed word — a participle built from a root
    - term: निष्ठा
      en: the क्त affix — past sense
    - cite: '3.2.102'
      role: निष्ठा → क्त (and क्तवतु) after a root for past sense → गम् + त → गतः
    - term: विशेषण
      en: adjective agreeing with नरः (प्रथमा, masc.)
    - term: प्रथमा
      en: nominative
  - form: नरः
    gloss: the man
    notes:
    - term: कर्तृ
      en: the one who has gone
    - term: प्रथमा
      en: nominative
  vyakhya: भूते निष्ठा — क्तप्रत्ययः। गम् + क्त → गतः। धातुः विशेषणं जातम्।
  vyakhya_en: |
    The first कृदन्त: the past participle. The निष्ठा affixes — क्त and क्तवतु (3.2.102) — attach to a root to give a past adjective. गम् + क्त → गतः "gone." It then declines like any अ-stem and agrees with its noun: ग्रामं गतः नरः "the man gone to the village." A root has become an adjective — this is what कृत् affixes do, and the whole chapter is their varieties.
