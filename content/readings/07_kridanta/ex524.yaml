  vyakhya: 'सत्यम् वदति शीलेन इति सत्यवादी। वद्-धातोः ताच्छील्ये णिनिः, उपधायाः वृद्धिः।'
  vyakhya_en: |
    वद् + णिनि (3.2.78) with the object सत्य before it makes सत्यवादिन्, "one who by nature speaks truth": the affix is इन्, and the ण् lengthens the root's अ (7.2.116). It declines like an इन्-stem: सत्यवादी in the nominative, सत्यवादिनम् in the accusative.
