- id: ex230
  segment: 217
  sentence: राजपुरुषः धर्मस्य रक्षिता। ततः जनाः तम् पूजयन्ति।
  translation: The king's man is a protector of dharma. Therefore the people honor him.
  teaches: |
    three at once — राजपुरुषः (षष्ठी-तत्पुरुष), रक्षिता (the तृच् agent-noun, with
    its object धर्मस्य in षष्ठी), and ततः (the तसिल् adverb).
  words:
  - form: राजपुरुषः
    lemma: राजपुरुष
    gloss: the king's man
    notes:
    - term: समास
      en: compound
    - term: तत्पुरुष
      en: determinative — राज्ञः पुरुषः; पुरुषः is the head
    - text: 'विग्रह: राज्ञः पुरुषः — "the king''s man"'
    - cite: '2.1.22'
      role: तत्पुरुषः — a compound whose last member carries the main sense is तत्पुरुष
    - cite: '2.2.8'
      role: षष्ठी — a षष्ठी-relation (राज्ञः) compounded → षष्ठी-तत्पुरुष
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: धर्मस्य
    lemma: धर्म
    gloss: of dharma
    notes:
    - term: कर्मन्
      en: object of the agent-noun रक्षिता
    - cite: '2.3.65'
      role: कर्तृकर्मणोः कृति — object of a कृत्-noun takes षष्ठी → धर्मस्य
    - term: षष्ठी
      en: genitive
  - form: रक्षिता
    lemma: रक्षितृ
    gloss: a protector
    notes:
    - term: कृदन्त
      en: agent-noun (declines)
    - term: तृच्
      en: the तृच् agent-suffix — "the one who protects"
    - cite: '3.1.133'
      role: ण्वुल्तृचौ — तृच् forms the agent-noun → रक्ष् + तृ → रक्षितृ; nom.sg रक्षिता
    - term: विशेषण
      en: predicated of राजपुरुषः
    - term: प्रथमा
      en: nominative
    rel:
    - kind: विशेषण
      to: 0
  - form: ततः
    lemma: तद्
    gloss: therefore, from that
    notes:
    - term: तद्धित
      en: an indeclinable तद्धित — तद् + तस् = ततः
    - term: तसिल्
      en: the तसिल् suffix (-तस्), the ablative sense
    - cite: '5.3.7'
      role: पञ्चम्यास्तसिल् — तसिल् in the ablative sense → तद् + तस् → ततः
    - term: अव्यय
      en: indeclinable (relative adverb of cause)
  - form: जनाः
    lemma: जन
    gloss: the people
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative plural
  - form: तम्
    lemma: तद्
    gloss: him
    notes:
    - term: सर्वनाम
      en: pronoun
    - term: कर्मन्
      en: object
    - term: द्वितीया
      en: accusative
  - form: पूजयन्ति
    lemma: पूज्
    gloss: honor
    notes:
    - term: लट्
      en: present
  vyakhya: राजपुरुषः धर्मस्य रक्षिता; ततः सः पूज्यते।
  vyakhya_en: |
    One line, three formations. राजपुरुषः is a षष्ठी-तत्पुरुष — राज्ञः पुरुषः, "the
    king's man" (2.2.8). रक्षिता is the agent-noun in तृच् (3.1.133), "protector,"
    and what it protects, धर्मस्य, stands in the षष्ठी that a कृत्-noun governs
    (2.3.65). And ततः is the तसिल् adverb (5.3.7), "from that, therefore" — the
    people's honour follows.
