  sentence: 'ग्रीष्मे मध्याह्ने एकः पथिकः वृक्षस्य छायायाम् शयानः आसीत्। वृक्षे एकः वानरः आसीत्। वानरः शयानम् पथिकम् अपश्यत्, तस्य फलानि च अहरत्।'
  translation: 'At noon in summer a traveller was lying in the shade of a tree. In the tree there was a monkey. The monkey saw the traveller lying there, and took his fruit.'
