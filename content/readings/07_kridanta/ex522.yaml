  vyakhya: 'शी-धातोः आत्मनेपदित्वात् शानच् — शयानः। शीङः गुणः — शे + आन।'
  vyakhya_en: |
    शी "lie" is आत्मनेपदी, so its present participle takes शानच् (3.2.124 with 1.4.100), not शतृ: शे + आन → शयानः, the root's ई taking गुण (7.4.21). It declines like an अ-stem adjective and agrees with the one lying — शयानः पथिकः, शयानम् पथिकम्.
