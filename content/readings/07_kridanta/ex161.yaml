  sentence: यः स्वयम् भवति सः स्वयम्भूः।
  translation: He who comes into being by himself is Svayambhū, the Self-Existent (Brahmā).
  teaches: 'क्विप् — the kṛt affix that vanishes entirely, leaving the bare root standing as a noun: स्वयम् + भू → स्वयम्भूः'
  words:
  - form: यः
    lemma: यद्
    gloss: he who
    notes:
