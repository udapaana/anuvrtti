    gloss: the Self-Existent (Brahmā)
    notes:
    - text: क्विप् = a कृत् affix that wholly disappears (its क्, व्, प् are all इत्), leaving स्वयम् + भू + सुप्
    - cite: 3.2.76
      role: क्विप् च — the affix क्विप् (zero) forms a kṛt-noun from the root → भू
    - cite: 3.2.178
      role: अन्येभ्योऽपि दृश्यते — क्विप् is seen widely, beyond its named bases
    - term: कृदन्त
      en: a kṛt noun with no visible suffix
    - term: पुंलिङ्ग
      en: masculine
    - term: प्रथमा
      en: nominative — predicate of सः
    - term: क्विप्
      en: the vanishing affix
    - term: कर्तरि
      en: agentive — "he who comes into being"
    - term: एकवचन
      en: singular
  vyakhya: क्विबन्तः प्रत्ययलोपे धातुरेव नाम। स्वयम् भवति इति स्वयम्भूः — भू + क्विप् = भू, सुपि स्वयम्भूः।
  vyakhya_en: 'Most kṛt affixes add visible material (-त, -मान, -तुम्). क्विप् is the opposite: every one of its letters is an इत्-marker, so the WHOLE affix vanishes, and the bare root stands as a noun (3.2.76). "He who comes into being (भवति) by himself (स्वयम्)" is स्वयम् + भू + क्विप् → स्वयम्भूः, Brahmā''s epithet. The sentence glosses the word by the very verb it is made from. This is how Sanskrit makes nouns like धी (thought, from ध्यै), स्तुत् (praiser), युज् (yoke-fellow) — roots used directly as words.

    '
