- id: ex513
  kind: graded
  segment: 170
  sentence: 'ग्रामे एकः वृद्धः ब्राह्मणः वसति। सः वेदवित्। प्रातः शिष्याः तम् वेदविदम् नमन्ति। वेदविदः वचनम् सर्वे शृण्वन्ति।'
  translation: 'In the village lives an old brahmin. He is a knower of the Veda. In the morning his pupils bow to the knower of the Veda. Everyone listens to the knower of the Veda''s word.'
  teaches: 'the root noun वेदविद् (विद् + क्विप्) in three cases: वेदवित्, वेदविदम्, वेदविदः'
