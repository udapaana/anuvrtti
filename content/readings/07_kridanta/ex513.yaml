  vyakhya: 'वेदम् वेत्ति इति वेदवित्। विद्-धातोः क्विप्। प्रथमायाम् वेदवित्, द्वितीयायाम् वेदविदम्, षष्ठ्याम् वेदविदः।'
  vyakhya_en: |
    वेदविद् is "one who knows the Veda" — विद् "know" with क्विप्, an affix that leaves nothing behind (3.2.61). The stem ends in द्: before a vowel ending it stays (वेदविदम्, वेदविदः), and at the end of the word it becomes त् (वेदवित्).
