  vyakhya: 'मन्यते आत्मानम् इति मानी — मन्-धातोः णिनिः। ग्रामे वसति इति ग्रामवासी।'
  vyakhya_en: |
    णिनि (3.2.78) names one whose habit an action is. मन् "think" gives मानिन् "proud" — one who thinks much of himself; वस् "dwell" with ग्राम before it gives ग्रामवासिन् "one who lives in a village". Both are इन्-stems: मानी, मानिनम्; ग्रामवासिनः, ग्रामवासिभिः.
