  sentence: 'नगरे एकः वणिक् वसति। सः मानी। सः ग्रामवासिभिः सह न वदति। अतः ग्रामवासिनः तम् मानिनम् न आद्रियन्ते।'
  translation: 'In the city lives a merchant. He is proud. He does not speak with the villagers. So the villagers do not respect him, the proud one.'
