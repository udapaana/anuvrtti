- id: ex232
  segment: 237
  sentence: शत्रुसेनायाः जेता वीरः। कुतः तस्य भयम्? ततः सः न बिभेति।
  translation: The hero is a conqueror of the enemy army. Whence his fear? Therefore he does not fear.
  teaches: |
    the three closed on a hero — शत्रुसेनायाः (षष्ठी-तत्पुरुष, कृत्-governed
    षष्ठी), जेता (the तृच् agent-noun), and कुतः / ततः (the तसिल् adverb, twice).
  words:
  - form: शत्रुसेनायाः
    lemma: शत्रुसेना
    gloss: of the enemy army
    notes:
    - term: समास
      en: compound
    - term: तत्पुरुष
      en: determinative — शत्रोः सेना, "the enemy's army"; सेना is the head
    - cite: '2.2.8'
      role: षष्ठी — a षष्ठी-relation (शत्रोः) compounded → षष्ठी-तत्पुरुष
    - term: कर्मन्
      en: object of the agent-noun जेता
    - cite: '2.3.65'
      role: कर्तृकर्मणोः कृति — object of a कृत्-noun takes षष्ठी → शत्रुसेनायाः
    - term: षष्ठी
      en: genitive (आ-stem feminine)
  - form: जेता
    lemma: जेतृ
    gloss: a conqueror
    notes:
    - term: कृदन्त
      en: agent-noun (declines)
    - term: तृच्
      en: the तृच् agent-suffix — "the one who conquers"
    - cite: '3.1.133'
      role: ण्वुल्तृचौ — तृच् forms the agent-noun → जि + तृ → जेतृ; nom.sg जेता
    - term: विशेषण
      en: predicated of वीरः
    - term: प्रथमा
      en: nominative
    rel:
    - kind: विशेषण
      to: 2
  - form: वीरः
    lemma: वीर
    gloss: the hero
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: कुतः
    lemma: किम्
    gloss: whence, from where
    notes:
    - term: तद्धित
      en: an indeclinable तद्धित — किम् + तस् = कुतः
    - term: तसिल्
      en: the तसिल् suffix (-तस्), the ablative sense — "from what?"
    - cite: '5.3.7'
      role: पञ्चम्यास्तसिल् — तसिल् in the ablative sense → किम् + तस् → कुतः
    - term: अव्यय
      en: indeclinable interrogative adverb
  - form: तस्य
    lemma: तद्
    gloss: his
    notes:
    - term: सर्वनाम
      en: pronoun
    - term: सम्बन्ध
      en: possession
    - term: षष्ठी
      en: genitive
  - form: भयम्
    lemma: भय
    gloss: fear
    notes:
    - term: कर्तृ
      en: subject of the elliptical question
    - term: प्रथमा
      en: nominative (neuter)
  - form: ततः
    lemma: तद्
    gloss: therefore
    notes:
    - term: तद्धित
      en: an indeclinable तद्धित — तद् + तस् = ततः
    - term: तसिल्
      en: the तसिल् suffix (-तस्), the ablative sense
    - cite: '5.3.7'
      role: पञ्चम्यास्तसिल् — तसिल् in the ablative sense → तद् + तस् → ततः
    - term: अव्यय
      en: indeclinable adverb of cause
  - form: सः
    lemma: तद्
    gloss: he
    notes:
    - term: सर्वनाम
      en: pronoun
    - term: प्रथमा
      en: nominative
  - form: न
    lemma: न
    gloss: not
    notes:
    - term: निपात
      en: verbal negation
  - form: बिभेति
    lemma: भी
    gloss: fears
    notes:
    - term: लट्
      en: present (जुहोत्यादि — भी → बिभेति)
  vyakhya: शत्रुसेनायाः जेता वीरः; कुतः तस्य भयम्? ततः सः न बिभेति।
  vyakhya_en: |
    The trio a last time, on a hero. शत्रुसेनायाः is a षष्ठी-तत्पुरुष — शत्रोः सेना
    (2.2.8) — standing in the षष्ठी that a कृत्-noun governs (2.3.65), the object of
    जेता, the तृच् agent-noun "conqueror" (3.1.133). Twice the तसिल् adverb turns
    (5.3.7): कुतः "whence?" and ततः "therefore" — whence would his fear come, and
    so he has none.
