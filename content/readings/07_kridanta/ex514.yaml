  vyakhya: 'चरति इति चरः। चर्-धातोः पचादिभ्यः अच्। चरः राज्ञः कृते नगरे चरति।'
  vyakhya_en: |
    चरः is चर् "move about" with अच्, the agent affix of the पचादि list (3.1.134): plain अ, no change to the root. So the noun and the verb sit side by side — चरः चरति, the roamer roams. Who roams the city at night for a king is a spy.
