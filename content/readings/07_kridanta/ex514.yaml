  sentence: 'राज्ञः एकः चरः आसीत्। चरः रात्रौ नगरे चरति, सर्वम् च पश्यति। प्रातः सः राज्ञे सर्वम् वदति।'
  translation: 'The king had a spy. At night the spy roams the city and sees everything. In the morning he tells the king everything.'
  teaches: 'अच् agent noun चरः "the one who roams, a spy" from चर्, beside the verb चरति'
