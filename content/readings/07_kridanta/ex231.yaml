- id: ex231
  segment: 227
  sentence: गुरुः धर्मशास्त्रस्य ज्ञाता। ततः शिष्याः तम् सेवन्ते।
  translation: The teacher is a knower of the treatise on dharma. Therefore the pupils serve him.
  teaches: |
    the same three in a different scene — धर्मशास्त्रस्य (षष्ठी-तत्पुरुष, and the
    कृत्-governed षष्ठी), ज्ञाता (the तृच् agent-noun), ततः (the तसिल् adverb).
  words:
  - form: गुरुः
    lemma: गुरु
    gloss: the teacher
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: धर्मशास्त्रस्य
    lemma: धर्मशास्त्र
    gloss: of the treatise on dharma
    notes:
    - term: समास
      en: compound
    - term: तत्पुरुष
      en: determinative — धर्मस्य शास्त्रम्, "the treatise of dharma"; शास्त्रम् is the head
    - cite: '2.2.8'
      role: षष्ठी — a षष्ठी-relation (धर्मस्य) compounded → षष्ठी-तत्पुरुष
    - term: कर्मन्
      en: object of the agent-noun ज्ञाता
    - cite: '2.3.65'
      role: कर्तृकर्मणोः कृति — object of a कृत्-noun takes षष्ठी → धर्मशास्त्रस्य
    - term: षष्ठी
      en: genitive
  - form: ज्ञाता
    lemma: ज्ञातृ
    gloss: a knower
    notes:
    - term: कृदन्त
      en: agent-noun (declines)
    - term: तृच्
      en: the तृच् agent-suffix — "the one who knows"
    - cite: '3.1.133'
      role: ण्वुल्तृचौ — तृच् forms the agent-noun → ज्ञा + तृ → ज्ञातृ; nom.sg ज्ञाता
    - term: विशेषण
      en: predicated of गुरुः
    - term: प्रथमा
      en: nominative
    rel:
    - kind: विशेषण
      to: 0
  - form: ततः
    lemma: तद्
    gloss: therefore, from that
    notes:
    - term: तद्धित
      en: an indeclinable तद्धित — तद् + तस् = ततः
    - term: तसिल्
      en: the तसिल् suffix (-तस्), the ablative sense
    - cite: '5.3.7'
      role: पञ्चम्यास्तसिल् — तसिल् in the ablative sense → तद् + तस् → ततः
    - term: अव्यय
      en: indeclinable (relative adverb of cause)
  - form: शिष्याः
    lemma: शिष्य
    gloss: the pupils
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative plural
  - form: तम्
    lemma: तद्
    gloss: him
    notes:
    - term: सर्वनाम
      en: pronoun
    - term: कर्मन्
      en: object
    - term: द्वितीया
      en: accusative
  - form: सेवन्ते
    lemma: सेव्
    gloss: serve
    notes:
    - term: लट्
      en: present — आत्मनेपद
  vyakhya: गुरुः धर्मशास्त्रस्य ज्ञाता; ततः शिष्याः तम् सेवन्ते।
  vyakhya_en: |
    The trio again, now among students. धर्मशास्त्रस्य is a षष्ठी-तत्पुरुष —
    धर्मस्य शास्त्रम् (2.2.8) — and it also stands in the षष्ठी a कृत्-noun governs
    (2.3.65), as the object of ज्ञाता, the तृच् agent-noun "knower" (3.1.133). ततः
    is the तसिल् adverb (5.3.7): from his knowing follows their service.
