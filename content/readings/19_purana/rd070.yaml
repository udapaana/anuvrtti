  vyakhya: 'आख्यानस्य द्वितीयपदम् — लिट्प्रत्यभिज्ञानम्। चक्रे इति कृञः लिटि आत्मनेपदे प्रथमपुरुषैकवचनम् (परोक्षे लिट्, द्वित्वम्)। मनोरथम् चक्रे इति "अभिलाषम् अकरोत्" इत्यर्थे। आरोढुम् इति क्रियार्थे तुमुन्। पितुः भ्रातरम् इति ऋदन्तयोः षष्ठी-द्वितीये। राजासनस्थितस्य इति तत्पुरुषः।'
  vyakhya_en: |
    The tale moves a step, and the **perfect** comes back to carry it: चक्रे "he
    made," the आत्मनेपद लिट् of कृ, its reduplication (च-क्र) the signature.
    चक्रे … मनोरथम् is the idiom "to form a wish" — मनोरथ literally a "chariot of
    the mind." The infinitive आरोढुम् "to climb" gives the wish its aim (3.3.10),
    and the ऋ-stems show their oblique faces: पितुः "of the father" (genitive),
    भ्रातरम् "brother" (accusative). One scene, and three tense-and-derivation
    machines turning at once — perfect, gerund, infinitive.
