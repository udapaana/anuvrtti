  sentence: राजासनस्थितस्य अङ्कम् पितुः भ्रातरम् आश्रितम्। दृष्ट्वा उत्तमम् ध्रुवः चक्रे तम् आरोढुम् मनोरथम्॥
  translation: Seeing his brother Uttama, who had climbed onto the lap of his father seated on the throne, Dhruva formed the wish to climb onto it too.
  teaches: |
    the story continues — and the perfect returns: चक्रे "he made / formed"
    (the आत्मनेपद लिट् of कृ), governing मनोरथम् "a wish"; with an infinitive of
    purpose आरोढुम् "to climb" and the ऋ-stem obliques पितुः, भ्रातरम्.
