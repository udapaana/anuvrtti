  vyakhya: 'आख्यानस्य तृतीयपदम्। प्रत्यक्षम् इति सम्बन्धसामीप्ये गतिः — तस्याः सुरुच्याः इति षष्ठ्यन्ते। सुरुच्याः इति विसर्गस्य नकारे लोपः (लोपः शाकल्यस्य) इति सुरुच्या। अभ्यनन्दत इति अभिनन्देः लङ्। उत्सङ्गारोहणोत्सुकम् इति दीर्घसमासः पुत्रविशेषणम्।'
  vyakhya_en: |
    The same instant, told from the king's side — and a lesson in reading long
    compounds. प्रत्यक्षम् "before the eyes of" takes a genitive: तस्याः सुरुच्याः,
    "in the sight of that Suruci" (its final visarga dropped before न, 8.3.19, so
    the text prints सुरुच्या). Then watch a whole clause fold into one accusative
    word: उत्सङ्ग-आरोहण-उत्सुकम् = "eager (उत्सुक) for climbing (आरोहण) onto the
    lap (उत्सङ्ग)" — three members, all describing पुत्रम्. Unfold the compound
    and the picture appears: a small boy, come in love, reaching for a lap that is
    not offered.
