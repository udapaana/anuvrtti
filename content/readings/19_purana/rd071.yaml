  sentence: प्रत्यक्षम् भूपतिः तस्याः सुरुच्याः न अभ्यनन्दत। प्रणयेन आगतम् पुत्रम् उत्सङ्गारोहणोत्सुकम्॥
  translation: There before the eyes of that Suruci, the king did not welcome the son who had come to him in affection, eager to climb onto his lap.
  teaches: |
    the same scene from the father's side — प्रत्यक्षम् "in the sight of" governing
    a genitive (तस्याः सुरुच्याः), and a long descriptive compound built to
    modify one word: उत्सङ्गारोहणोत्सुकम् "eager to climb onto the lap."
