  sentence: क्रियते किम् वृथा वत्स महान् एषः मनोरथः। अन्यस्त्रीगर्भजातेन हि असंभूय मम उदरे॥
  translation: Why, child, is this great wish cherished in vain — by one born of another woman's womb, one who did not come to be within my belly?
  teaches: |
    the cruel speech opens in the passive — क्रियते "is it cherished," its doer
    thrown into the instrumental (अन्यस्त्रीगर्भजातेन "by one born of another's
    womb"); with the vocative वत्स and a नञ्-prefixed gerund असंभूय "not having come to be."
