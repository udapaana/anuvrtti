  vyakhya: 'सुरुच्याः वाक्यम् — कर्मणि प्रश्नः। क्रियते किम् वृथा इति कर्मणि लटि प्रश्नः ("किमर्थम् एषः मनोरथः क्रियते")। अन्यस्त्रीगर्भजातेन इति कर्तरि तृतीया (अनभिहिते)। असंभूय इति नञ्पूर्वात् सम्भवतेः ल्यप्। वत्स इति सम्बोधनम्। कठोरम् अपि मृदुसम्बोधनेन आरब्धम्।'
  vyakhya_en: |
    Suruci begins — and cruelty speaks in the **passive**. क्रियते किम् वृथा "why
    is (this) vainly cherished?" leaves the doer unnamed in the verb and drops him
    into the instrumental: अन्यस्त्रीगर्भजातेन, "by one born of another woman's
    womb." Unfold that compound and the insult is bare — she will not even say
    "you." The gerund असंभूय "not having come to be" (सम्-भू with नञ्, so a
    prefixed ल्यप्) turns the knife: *not born in my womb.* And yet it opens वत्स
    "child" — the soft address that makes the rest colder.
