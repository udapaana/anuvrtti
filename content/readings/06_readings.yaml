  - form: ब्राह्मणः
    lemma: ब्राह्मण
    gloss: a brahmin
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: अवदत्
    lemma: वद्
    gloss: said
    notes:
    - term: लङ्
      en: past
  - form: देव
    lemma: देव
    gloss: Your Majesty
    notes:
    - term: सम्बोधन
      en: vocative
  - form: एतान्
    lemma: एतद्
    gloss: these
    notes:
    - term: सर्वनाम
      en: pronoun
    - term: द्वितीया
      en: accusative plural, agreeing with राजपुत्रान्
  - form: राजपुत्रान्
    lemma: राजपुत्र
    gloss: the princes
    vocab: true
    notes:
    - term: षष्ठी-तत्पुरुष
      en: राज्ञः पुत्राः — "sons of the king"
    - term: कर्मन्
      en: object of करिष्यामि
    - term: द्वितीया
      en: accusative plural
  - form: षण्मासाभ्यन्तरे
    lemma: षण्मासाभ्यन्तर
    gloss: within six months
    vocab: true
    notes:
    - term: द्विगु
      en: षट् मासाः — a numeral compound, then "within" compounded onto it
    - term: सप्तमी
      en: locative — the span inside which the thing happens
  - form: नीतिशास्त्रज्ञान्
    lemma: नीतिशास्त्रज्ञ
    gloss: knowers of the science of policy
    vocab: true
    notes:
    - term: उपपद-तत्पुरुष
      en: नीतिशास्त्रं जानन्ति इति — the object sits inside the compound with ज्ञ
    - term: कर्मन्
      en: the SECOND accusative — "make them INTO knowers"
    - term: द्वितीया
      en: accusative plural
  - form: करिष्यामि
    lemma: कृ
    gloss: I will make
    notes:
    - term: लृट्
      en: the future — the promise itself
    - cite: "3.3.13"
      role: लृट् शेषे च — लृट् for the future → करिष्यामि
  - form: यदि
    lemma: यदि
    gloss: if
    vocab: true
    notes:
    - term: अव्यय
      en: indeclinable — opens the condition
  - form: 'न'
    lemma: न
    gloss: not
    notes:
    - term: अव्यय
      en: negation
  - form: करोमि
    lemma: कृ
    gloss: I do
    notes:
    - term: लट्
      en: present — कृ is तनादि, taking उ rather than शप्
  - form: तदा
    lemma: तदा
    gloss: then
    notes:
    - term: अव्यय
      en: indeclinable — answers यदि
  - form: देवः
    lemma: देव
    gloss: Your Majesty
    notes:
    - term: कर्तृ
      en: agent — the king referred to in the third person, as courtesy requires
    - term: प्रथमा
      en: nominative
  - form: मम
    lemma: अस्मद्
    gloss: my
    notes:
    - term: सर्वनाम
      en: pronoun
    - term: षष्ठी
      en: genitive
  - form: नाम
    lemma: नामन्
    gloss: name
    notes:
    - term: कर्मन्
      en: object of त्यजतु — a different नाम from the indeclinable above
    - term: द्वितीया
      en: neuter accusative
  - form: त्यजतु
    lemma: त्यज्
    gloss: let him discard
    vocab: true
    notes:
    - term: लोट्
      en: imperative, third person — a formal undertaking, not a command
    - cite: "3.3.162"
      role: लोट् च — the imperative → त्यजतु
  vyakhya: नाम इति द्विः — अव्ययं नाम, नाम्नः नाम च। संदर्भः भेदं दर्शयति।
  vyakhya_en: |
    नाम appears twice and is not the same word. विष्णुशर्मा नाम ब्राह्मणः is
    the indeclinable, "by name"; मम नाम त्यजतु is the noun नामन् in the
    accusative, the thing to be discarded. Nothing but position and sense
    separates them.

    And note त्यजतु. A third-person imperative aimed at the king is not an
    order — it is how a formal oath is staked: let my name be thrown away if I
    fail. The grammar is imperative; the force is a wager.

- id: rd040
  kind: attested
  segment: 295
  source:
    text: पञ्चतन्त्र
    ref: "Pañcatantra, कथामुख — the frame"
    curated: "the opening of the frame story, lightly abridged; the words are the text's own"
  sentence: अस्ति दाक्षिणात्ये जनपदे महिलारोप्यं नाम नगरम्। तत्र अमरशक्तिर् नाम राजा बभूव। तस्य त्रयः पुत्राः परमदुर्मेधसः आसन्। ततः राजा मन्त्रिणः आहूय उवाच — किम् अत्र कर्तव्यम् इति।
  translation: There is, in a southern country, a city named Mahilāropya. There ruled a king named Amaraśakti. He had three sons, exceedingly dull-witted. Then the king, having summoned his ministers, said — "What is to be done here?"
  teaches: |
    the Pañcatantra frame, in the same अस्ति … नाम नगरम् formula. Closes on
    किम् अत्र कर्तव्यम् — a whole question with no verb in it.
  words:
  - form: अस्ति
    lemma: अस्
    gloss: there is
    notes:
    - term: लट्
      en: the same opening formula as the Hitopadeśa passage
  - form: दाक्षिणात्ये
    lemma: दाक्षिणात्य
    gloss: southern
    vocab: true
    notes:
    - term: तद्धित
      en: '"belonging to the south" — from दक्षिण with vṛddhi'
    - term: सप्तमी
      en: locative, agreeing with जनपदे
  - form: जनपदे
    lemma: जनपद
    gloss: in a country
    vocab: true
    notes:
    - term: अधिकरण
      en: locus
    - term: सप्तमी
      en: locative
  - form: महिलारोप्यं
    lemma: महिलारोप्य
    gloss: Mahilāropya
    vocab: true
    notes:
    - cite: "8.3.23"
      role: मोऽनुस्वारः — word-final म् becomes anusvāra before a consonant → महिलारोप्यं
    - term: प्रथमा
      en: neuter nominative, agreeing with नगरम्
  - form: नाम
    lemma: नामन्
    gloss: by name
    notes:
    - term: अव्यय
      en: indeclinable, in apposition
  - form: नगरम्
    lemma: नगर
    gloss: a city
    notes:
    - term: प्रथमा
      en: neuter nominative
  - form: तत्र
    lemma: तत्र
    gloss: there
    notes:
    - term: अव्यय
      en: indeclinable
  - form: अमरशक्तिर्
    lemma: अमरशक्ति
    gloss: Amaraśakti
    vocab: true
    notes:
    - term: सन्धि
      en: अमरशक्तिः + नाम — the visarga becomes र् before a voiced sound
    - term: प्रथमा
      en: nominative
  - form: राजा
    lemma: राजन्
    gloss: a king
    notes:
    - term: प्रथमा
      en: nominative — the न् of राजन् drops in the bare form
    - cite: "8.2.7"
      role: नलोपः प्रातिपदिकान्तस्य — the final न् of the stem drops → राजा
  - form: बभूव
    lemma: भू
    gloss: there was, came to be
    notes:
    - term: लिट्
      en: the perfect — reduplicated भू → बभूव, beside आसन् below
    - cite: "3.2.115"
      role: परोक्षे लिट् — the perfect for what lies outside the speaker's sight → बभूव
  - form: तस्य
    lemma: तद्
    gloss: his
    notes:
    - term: सर्वनाम
      en: pronoun
    - term: षष्ठी
      en: 'genitive — Sanskrit says "of him were three sons" for "he had"'
  - form: त्रयः
    lemma: त्रि
    gloss: three
    vocab: true
    notes:
    - term: प्रथमा
      en: nominative plural, agreeing with पुत्राः
  - form: पुत्राः
    lemma: पुत्र
    gloss: sons
    notes:
    - term: कर्तृ
      en: agent
    - term: बहुवचन
      en: nominative plural
  - form: परमदुर्मेधसः
    lemma: परमदुर्मेधस्
    gloss: exceedingly dull-witted
    vocab: true
    notes:
    - term: कर्मधारय
      en: 'परम + दुर्मेधस् — "extremely of-bad-intellect", one word in Sanskrit'
    - term: प्रथमा
      en: nominative plural, an अस्-stem
  - form: आसन्
    lemma: अस्
    gloss: were
    notes:
    - term: लङ्
      en: past plural — the imperfect beside the perfect बभूव above
  - form: ततः
    lemma: ततस्
    gloss: then
    notes:
    - term: अव्यय
      en: indeclinable — the narrative connective
  - form: मन्त्रिणः
    lemma: मन्त्रिन्
    gloss: the ministers
    vocab: true
    notes:
    - term: कर्मन्
      en: object of आहूय
    - term: द्वितीया
      en: accusative plural — an इन्-stem
  - form: आहूय
    lemma: ह्वे
    gloss: having summoned
    notes:
    - term: ल्यप्
      en: the gerund with a preverb — आ + ह्वे, the summoning before the speaking
    - cite: "3.4.21"
      role: समानकर्तृकयोः पूर्वकाले — the earlier of two acts by one agent → आहूय
  - form: उवाच
    lemma: वच्
    gloss: said
    notes:
    - term: लिट्
      en: the perfect — a third narrative past in four sentences
  - form: किम्
    lemma: किम्
    gloss: what
    notes:
    - term: सर्वनाम
      en: pronoun
    - term: प्रथमा
      en: neuter nominative — the subject of the gerundive
  - form: अत्र
    lemma: अत्र
    gloss: here
    notes:
    - term: अव्यय
      en: indeclinable
  - form: कर्तव्यम्
    lemma: कृ
    gloss: is to be done
    notes:
    - term: कृत्य
      en: the gerundive — obligation, and it needs no verb to predicate it
    - cite: "3.1.96"
      role: तव्यत्तव्यानीयरः — तव्य forms the gerundive → कर्तव्यम्
  - form: इति
    lemma: इति
    gloss: '"thus"'
    notes:
    - term: अव्यय
      en: closes the quotation
  vyakhya: अस्ति नाम नगरम् — कथामुखस्य रूढा रीतिः। हितोपदेशे अपि सैव।
  vyakhya_en: |
    The same three words open this as opened the Hitopadeśa passage: अस्ति,
    then a place, then नाम and the name. It is a formula, and recognising it
    is worth more than parsing it — a classical story announces itself this way
    and the reader can stop working until the कथा actually starts.

    किम् अत्र कर्तव्यम् has no verb in it. कर्तव्यम् is a gerundive, "to-be-done",
    and that is the whole predicate: what, here, is to-be-done. Sanskrit builds
    a complete question out of a participle and two indeclinables.

- id: rd038
  kind: attested
  segment: 275
  source:
    text: हितोपदेश
    ref: "Hitopadeśa, मित्रलाभ — the frame of the कथामुख"
    curated: "the opening of the frame story, lightly abridged; the words are the text's own"
  sentence: अस्ति भागीरथीतीरे पाटलिपुत्रनामधेयं नगरम्। तत्र सर्वस्वामिगुणोपेतः सुदर्शनो नाम नरपतिः आसीत्। सः भूपतिः एकदा केनचित् पठ्यमानं श्लोकद्वयं शुश्राव।
  translation: There is, on the bank of the Bhāgīrathī, a city named Pāṭaliputra. There lived a king called Sudarśana, endowed with every quality of a sovereign. One day that lord of the earth heard two verses being recited by someone.
  teaches: |
    the Hitopadeśa frame opens. Three long compounds — भागीरथीतीरे,
    पाटलिपुत्रनामधेयं, सर्वस्वामिगुणोपेतः — of the kind classical prose runs on.
  words:
  - form: अस्ति
    lemma: अस्
    gloss: there is
    notes:
    - term: लट्
      en: 'present — the storyteller''s opening, "there is / there was"'
  - form: भागीरथीतीरे
    lemma: भागीरथीतीर
    gloss: on the bank of the Bhāgīrathī
    vocab: true
    notes:
    - term: षष्ठी-तत्पुरुष
      en: 'भागीरथ्याः तीरे — "the bank OF the Gaṅgā", compounded'
    - term: अधिकरण
      en: locus
    - term: सप्तमी
      en: locative
  - form: पाटलिपुत्रनामधेयं
    lemma: पाटलिपुत्रनामधेय
    gloss: named Pāṭaliputra
    vocab: true
    notes:
    - cite: "8.3.23"
      role: मोऽनुस्वारः — word-final म् becomes anusvāra before a consonant → पाटलिपुत्रनामधेयं
    - term: बहुव्रीहि
      en: '"having Pāṭaliputra as its name" — the compound describes the city, not itself'
    - term: प्रथमा
      en: neuter nominative, agreeing with नगरम्
  - form: नगरम्
    lemma: नगर
    gloss: a city
    notes:
    - term: प्रथमा
      en: neuter nominative — what अस्ति asserts the existence of
    - cite: "7.1.24"
      role: अतोऽम् — the neuter अ-stem takes अम् in प्रथमा and द्वितीया → नगरम्
  - form: तत्र
    lemma: तत्र
    gloss: there
    notes:
    - term: अव्यय
      en: indeclinable
  - form: सर्वस्वामिगुणोपेतः
    lemma: सर्वस्वामिगुणोपेत
    gloss: endowed with every quality of a sovereign
    vocab: true
    notes:
    - term: तत्पुरुष
      en: सर्वस्वामिगुणैः उपेतः — a four-member compound, resolved from the end backwards
    - term: निष्ठा
      en: 'उपेत is a past participle — "come near to, endowed with"'
    - term: प्रथमा
      en: nominative, agreeing with नरपतिः
  - form: सुदर्शनो
    lemma: सुदर्शन
    gloss: Sudarśana
    vocab: true
    notes:
    - term: सन्धि
      en: सुदर्शनः + नाम — the visarga becomes ओ before a voiced sound
    - term: प्रथमा
      en: nominative
  - form: नाम
    lemma: नामन्
    gloss: by name
    notes:
    - term: अव्यय
      en: '"by name" — in apposition, not declined'
  - form: नरपतिः
    lemma: नरपति
    gloss: a king
    vocab: true
    notes:
    - term: षष्ठी-तत्पुरुष
      en: 'नराणां पतिः — "lord of men"'
    - term: प्रथमा
      en: nominative
  - form: आसीत्
    lemma: अस्
    gloss: was
    notes:
    - term: लङ्
      en: past of अस् — the frame shifts from अस्ति to आसीत्
  - form: सः
    lemma: तद्
    gloss: that
    notes:
    - term: सर्वनाम
      en: pronoun
    - term: प्रथमा
      en: nominative
  - form: भूपतिः
    lemma: भूपति
    gloss: lord of the earth
    vocab: true
    notes:
    - term: षष्ठी-तत्पुरुष
      en: भुवः पतिः — a second compound for the same man, as classical prose prefers
    - term: प्रथमा
      en: nominative
  - form: एकदा
    lemma: एकदा
    gloss: one day
    notes:
    - term: अव्यय
      en: indeclinable
  - form: केनचित्
    lemma: किम्
    gloss: by someone
    notes:
    - term: सर्वनाम
      en: pronoun
    - term: कर्तृ
      en: the agent of the passive participle — who was doing the reciting
