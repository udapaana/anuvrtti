      role: रषाभ्यां नो णः — a dental न् becomes retroflex ण् when a र् or ष् precedes (even across vowels); the र of नारी retroflexes the न of the नाम् ending → नारीणाम्
    - term: सम्बन्ध
      en: the possessor — "of women"
    - term: षष्ठी
      en: genitive plural
  - form: क्षमा
    lemma: क्षमा
    gloss: forgiveness, forbearance
    vocab: true
    notes:
    - term: कर्तृ
      en: subject — "forgiveness is the ornament"
    - term: प्रथमा
      en: nominative singular (आ-stem feminine)
  - form: तु
    lemma: तु
    gloss: but, and
    notes:
    - term: अव्यय
      en: mildly contrastive particle
  - form: पुरुषस्य
    lemma: पुरुष
    gloss: of a man
    vocab: true
    notes:
    - cite: '7.1.12'
      role: टाङसिङसामिनात्स्याः — after an अ-stem, the genitive-singular ending ङस् is replaced by स्य → पुरुष + स्य → पुरुषस्य
    - term: सम्बन्ध
      en: the possessor — "of a man"
    - term: षष्ठी
      en: genitive singular
  - form: वा
    lemma: वा
    gloss: too, as well
