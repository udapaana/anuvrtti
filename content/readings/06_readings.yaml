  translation: O helpers, upholders of men, O All-Gods, come — you bestowers, to the soma of the worshipper.
  teaches: 'the PLURAL turn — after the dual Aśvins and the singular Indra, the All-Gods are addressed as a crowd: vocative-plural विश्वे देवासः + the 2nd-person PLURAL imperative आ गत ("come, you all")'
