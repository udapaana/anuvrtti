    - term: द्वितीया
      en: accusative
  - form: द॒धे
    lemma: धा
    gloss: she has upheld, she has established
    vocab: true
    notes:
    - term: धा
      en: '"hold, establish" — the √धा of दधाते (rd025) and दधिष्व (rd031), here PERFECT'
    - term: प्रथमपुरुष
      en: 3rd person singular — perfect middle "she has held"
