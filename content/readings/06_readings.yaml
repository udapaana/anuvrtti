  sentence: न अग्निस् तृप्यति काष्ठानां न अपगानां महोदधिः।
  translation: Fire is not sated with logs, nor the great ocean with rivers.
  teaches: 'genitive plural (of-what one is sated) + a कर्मधारय compound (महा+उदधि) in real text'
  words:
  - form: न
    lemma: न
    gloss: not
    notes:
    - term: अव्यय
      en: negation particle
  - form: अग्निः
    lemma: अग्नि
    gloss: fire
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
    - text: 'the इ-stem अग्नि you declined (अग्निः); न+अग्निः → नाग्निः'
  - form: तृप्यति
    lemma: तृप्
    gloss: is sated, satisfied
    vocab: true
    notes:
    - term: तृप्
      en: '"be satisfied"'
    - term: लट्
      en: present
  - form: काष्ठानाम्
    lemma: काष्ठ
    gloss: with logs (lit. "of logs")
    vocab: true
    notes:
    - term: षष्ठी
      en: genitive — the thing one is sated OF
    - term: बहुवचन
      en: plural
    - cite: '2.3.50'
      role: षष्ठी शेषे — the relational genitive; "sated of logs" takes षष्ठी
  - form: अपगानाम्
    lemma: आपगा
    gloss: with rivers (lit. "of rivers")
    vocab: true
    notes:
    - term: षष्ठी
      en: genitive plural — parallel to काष्ठानाम्
  - form: महोदधिः
    lemma: महोदधि
    gloss: the great ocean
    vocab: true
    notes:
    - term: कर्मधारय
      en: compound — महा (great) + उदधि (ocean), adjective+noun same case
    - cite: '1.2.42'
      role: तत्पुरुषः समानाधिकरणः कर्मधारयः — महा+उदधि is a कर्मधारय (महा+उदधि → महोदधि by सन्धि)
    - term: कर्तृ
      en: agent (second clause)
    - term: प्रथमा
      en: nominative
  vyakhya: अग्निः काष्ठानां न तृप्यति, महोदधिः अपगानां न — षष्ठी तृप्तेः विषये।
  vyakhya_en: |
    Two parallel clauses: fire (अग्निः) is not sated of logs (काष्ठानां, genitive plural), the great ocean (महोदधिः, a कर्मधारय compound = महा "great" + उदधि "ocean") not of rivers. The genitive marks what one is sated *of*; the verb तृप्यति is shared across both halves. You now meet your own grammar — इ-stem, षष्ठी, कर्मधारय — in a real Pañcatantra verse.

