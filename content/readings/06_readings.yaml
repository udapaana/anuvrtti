  vyakhya: ओमासः चर्षणीधृतः विश्वे देवासः दाश्वांसः — सम्बोधनबहुवचनम्; आ गत — लोटि मध्यमपुरुषबहुवचनम्; दाशुषः — षष्ठी; सुतम् — द्वितीया कर्मणि।
  vyakhya_en: |
    The number completes its circle. RV 1.3 has now addressed a DUAL (the Aśvins, आ यातम्), a SINGULAR (Indra, आ याहि), and here a PLURAL — विश्वे देवासः, "all the gods," a whole company, bidden आ गत, "come, you all." Set the three imperatives of √गम्/√या side by side: यातम् (two), याहि (one), गत (many). Every vocative here is plural too — ओमासः, चर्षणीधृतः, दाश्वांसः. They come दाशुषः सुतम्, "to the worshipper's pressed soma" (genitive + accusative goal). One hymn has now drilled the entire तीन वचन.
