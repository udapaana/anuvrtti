  translation: May you never, O hunter, reach rest for the long years to come — since you killed one of the pair of krauñca birds, deluded by passion.
  teaches: |
    the first verse of Sanskrit poetry. मा with the aorist forbids — मा … अगमः,
    "may you not reach"; अवधीः is the aorist "you killed" of हन्.
  words:
  - form: मा
    lemma: मा
    gloss: do not, may not
    notes:
    - term: निपात
      en: prohibitive particle — with the aorist, a negative wish/command
  - form: निषाद
    lemma: निषाद
    gloss: O hunter
    vocab: true
    notes:
    - term: सम्बोधन
      en: address — the hunter called to
  - form: प्रतिष्ठाम्
    lemma: प्रतिष्ठा
    gloss: rest, standing, a settled place
    vocab: true
    notes:
    - term: कर्मन्
      en: what is (not) reached
    - term: द्वितीया
      en: accusative
  - form: त्वम्
    lemma: युष्मद्
    gloss: you
    notes:
    - term: सर्वनाम
      en: pronoun — second person
    - term: प्रथमा
      en: nominative
  - form: अगमः
    lemma: गम्
    gloss: may you reach / would go
    vocab: true
    notes:
    - term: लुङ्
      en: aorist — with मा it is the prohibitive ("may you not reach")
  - form: शाश्वतीः
    lemma: शाश्वत
    gloss: for endless
    vocab: true
    notes:
    - term: विशेषण
      en: qualifying समाः
    - term: द्वितीया
      en: accusative plural (feminine)
    rel:
    - kind: विशेषण
      to: 6
  - form: समाः
    lemma: समा
    gloss: years
    vocab: true
    notes:
    - term: कर्मन्
      en: duration — "for the years" (the द्वितीया of extent of time)
    - term: द्वितीया
      en: accusative plural
  - form: यत्
    lemma: यद्
    gloss: since, because
    notes:
    - term: अव्यय
      en: relative — "in that / because" (here causal)
  - form: क्रौञ्चमिथुनाद्
    lemma: क्रौञ्चमिथुन
    gloss: from the pair of krauñca birds
    vocab: true
    notes:
    - term: समास
      en: compound — क्रौञ्चयोः मिथुनम्, "the pair of the two krauñcas"
    - term: तत्पुरुष
      en: षष्ठी-तत्पुरुष
    - term: अपादान
      en: source — the one taken from the pair
    - cite: '2.3.28'
      role: अपादाने पञ्चमी — the point of separation takes पञ्चमी → क्रौञ्चमिथुनात्
    - term: पञ्चमी
      en: ablative (→ क्रौञ्चमिथुनाद् before a vowel)
  - form: एकम्
    lemma: एक
    gloss: one
    notes:
    - term: संख्या
      en: numeral
    - term: कर्मन्
      en: the one killed
    - term: द्वितीया
      en: accusative
  - form: अवधीः
    lemma: हन्
    gloss: you killed
    vocab: true
    notes:
    - term: लुङ्
      en: aorist — 2nd sg of हन् (the वध्-substitute), "you slew"
  - form: काममोहितम्
    lemma: काममोहित
    gloss: deluded by passion
    vocab: true
    notes:
    - term: समास
      en: compound — कामेन मोहितम्, "confused by desire"
    - term: तत्पुरुष
      en: तृतीया-तत्पुरुष (मोहित is a क्त participle)
    - term: विशेषण
      en: qualifying एकम् (the bird)
    - term: द्वितीया
      en: accusative
    rel:
    - kind: विशेषण
      to: 9
  vyakhya: मा निषाद प्रतिष्ठां त्वम् अगमः — यत् क्रौञ्चमिथुनात् एकम् अवधीः।
  vyakhya_en: |
    The verse grief wrung from Vālmīki, and with it Sanskrit poetry began. मा
    with the aorist is the prohibition: मा … अगमः, "may you never reach"
    प्रतिष्ठाम्, a resting place, शाश्वतीः समाः, for the endless years. The reason
    follows on यत्: because from the क्रौञ्च-pair (क्रौञ्चमिथुनात्, the ablative of
    what one is taken FROM) you killed एकम्, one — अवधीः, the aorist of हन् — while
    it was काममोहितम्, lost in love.
- id: rd043
  kind: attested
  segment: 325
  source:
    text: पञ्चतन्त्र
    ref: "Pañcatantra 0.2 — the maṅgala verse (Viṣṇuśarman and the five tantras)"
    curated: "the opening benedictory verse, whole; text from Ambuda's GRETIL edition (ambuda-org/gretil, sa_viSNuzarman-paJcatantra, ||Panc_0.2||)"
  sentence: सकलार्थशास्त्रसारं जगति समालोक्य विष्णुशर्मेदम्। तन्त्रैः पञ्चभिर् एतच् चकार सुमनोहरं शास्त्रम्॥
  translation: Having surveyed in the world the essence of all the treatises on statecraft, Viṣṇuśarman composed this charming work in five tantras.
  teaches: |
    the Pañcatantra's own opening — a long तत्पुरुष सार-compound as object of the
    ल्यप् gerund समालोक्य, and the perfect चकार "he composed."
  words:
  - form: सकलार्थशास्त्रसारम्
    lemma: सकलार्थशास्त्रसार
    gloss: the essence of all the treatises on statecraft
    vocab: true
    notes:
    - term: तत्पुरुष
      en: determinative — सारम्, the head, is qualified by the rest; सकलानाम् अर्थशास्त्राणाम् सारम्
    - text: 'विग्रह: सकलानाम् अर्थशास्त्राणाम् सारम् — "the essence of all the arthaśāstras"'
    - cite: '2.1.22'
      role: तत्पुरुषः — a compound whose last member carries the main sense is तत्पुरुष
    - term: कर्मन्
      en: object of समालोक्य
    - term: द्वितीया
      en: accusative (→ सारं, anusvāra before ज)
  - form: जगति
    lemma: जगत्
    gloss: in the world
    vocab: true
    notes:
    - term: अधिकरण
      en: locus
    - term: सप्तमी
      en: locative (त्-stem जगत् → जगति)
  - form: समालोक्य
    lemma: लोक्
    gloss: having surveyed
    notes:
    - term: कृदन्त
      en: gerund — a कृदन्त that does not decline
    - term: ल्यप्
      en: the ल्यप् suffix — a क्त्वा-gerund WITH a preverb (सम्-आ), so आगत्य-style
    - cite: '7.1.37'
      role: समासेऽनञ्पूर्वे क्त्वो ल्यप् — क्त्वा becomes ल्यप् after a preverb → -आलोक्य
    - term: उपसर्ग
      en: सम् + आ — the preverbs that select ल्यप् over क्त्वा
    - term: अव्यय
      en: indeclinable
  - form: विष्णुशर्मेदम्
    lemma: विष्णुशर्मन्
    gloss: Viṣṇuśarman + this (work)
    vocab: true
    notes:
    - term: कर्तृ
      en: agent — विष्णुशर्मा, the one who composed
    - term: प्रथमा
      en: nominative — an अन्-stem, so the न् drops (विष्णुशर्मा)
    - text: 'विष्णुशर्मा + इदम् → विष्णुशर्मेदम् (आ + इ → ए, गुणसन्धि); इदम् = "this work," द्वितीया'
  - form: तन्त्रैः
    lemma: तन्त्र
    gloss: by the tantras (books)
    vocab: true
    notes:
    - term: करण
      en: instrument — "by means of the five books"
    - term: तृतीया
      en: instrumental plural
  - form: पञ्चभिर्
    lemma: पञ्चन्
    gloss: five
    notes:
    - term: संख्या
      en: numeral qualifying तन्त्रैः (instrumental plural)
    - term: तृतीया
      en: instrumental
    - text: 'पञ्चभिः + एतत् → पञ्चभिर् (visarga → र् before a voiced sound)'
  - form: एतच्
    lemma: एतद्
    gloss: this
    notes:
    - term: सर्वनाम
      en: pronoun — the work, restated
    - term: कर्मन्
      en: object of चकार
    - term: द्वितीया
      en: accusative (neuter)
    - text: 'एतत् + चकार → एतच् चकार (त् → च् before च, श्चुत्व 8.4.40)'
  - form: चकार
    lemma: कृ
    gloss: made, composed
    notes:
    - term: लिट्
      en: perfect — the remote or reported past (परोक्ष)
    - cite: '3.2.115'
      role: परोक्षे लिट् — for a past beyond direct witness, लिट् replaces the लकार → चकार
  - form: सुमनोहरम्
    lemma: सुमनोहर
    gloss: very charming
    vocab: true
    notes:
    - term: विशेषण
      en: qualifying शास्त्रम्
    - term: द्वितीया
      en: accusative (→ सुमनोहरं, anusvāra before श)
    rel:
    - kind: विशेषण
      to: 9
  - form: शास्त्रम्
    lemma: शास्त्र
    gloss: the treatise, the work
    notes:
    - term: कर्मन्
      en: the thing composed
    - term: द्वितीया
      en: accusative (neuter)
  vyakhya: सकलार्थशास्त्रसारं समालोक्य विष्णुशर्मा पञ्चभिः तन्त्रैः शास्त्रम् चकार।
  vyakhya_en: |
    The Pañcatantra names itself in its second verse. The object of the gerund is
    one long तत्पुरुष — सकल-अर्थशास्त्र-सारम्, "the essence of all the treatises on
    statecraft" — which Viṣṇuśarman, having surveyed (समालोक्य, the ल्यप् gerund),
    made into a charming work. चकार is the perfect (लिट्, 3.2.115), the tense of
    reported past: "he composed it." तन्त्रैः पञ्चभिः, "by five books" — the five
    that give the book its name.
- id: rd044
  kind: attested
  segment: 295
  source:
    text: हितोपदेश
    ref: "Hit_0.36 — उद्यमेन हि सिध्यन्ति (effort, not wishes)"
    curated: "the whole verse; text from Ambuda's GRETIL edition (ambuda-org/gretil, sa_nArAyaNa-hitopadeza, ||Hit_0.36||)"
  sentence: उद्यमेन हि सिध्यन्ति कार्याणि न मनोरथैः। न हि सुप्तस्य सिंहस्य प्रविशन्ति मुखे मृगाः॥
  translation: By effort deeds succeed, not by wishes. For deer do not walk into the mouth of a sleeping lion.
  teaches: |
    a famous Hitopadeśa maxim. कार्याणि is the ण्यत् gerundive ("things to be
    done"); सुप्तस्य is a क्त participle qualifying सिंहस्य; success comes उद्यमेन
    (तृतीया, by means).
  words:
  - form: उद्यमेन
    lemma: उद्यम
    gloss: by effort
    vocab: true
    notes:
    - term: करण
      en: instrument — "by means of effort"
    - term: तृतीया
      en: instrumental
  - form: हि
    lemma: हि
    gloss: indeed, for
    notes:
    - term: निपात
      en: particle — gives a reason ("for")
  - form: सिध्यन्ति
    lemma: सिध्
    gloss: succeed, are accomplished
    vocab: true
    notes:
    - term: लट्
      en: present (दिवादि — सिध् → सिध्यति)
  - form: कार्याणि
    lemma: कार्य
    gloss: deeds, things to be done
    vocab: true
    notes:
    - term: कृदन्त
      en: gerundive — "that which is to be done" (declines, neuter)
    - term: ण्यत्
      en: the ण्यत् gerundive suffix on a हल्-final root
    - cite: '3.1.124'
      role: ऋहलोर्ण्यत् — ण्यत् after an ऋ/हल्-final root → कृ + ण्यत् → कार्य ("to be done")
    - term: कर्तृ
      en: agent — the subject of सिध्यन्ति
    - term: प्रथमा
      en: nominative (neuter plural → कार्याणि)
  - form: न
    lemma: न
    gloss: not
    notes:
    - term: निपात
      en: verbal negation
  - form: मनोरथैः
    lemma: मनोरथ
    gloss: by wishes
    vocab: true
    notes:
    - term: करण
      en: instrument — "by mere wishes" (मनसः रथः, "a chariot of the mind")
    - term: तृतीया
      en: instrumental plural
  - form: सुप्तस्य
    lemma: स्वप्
    gloss: of the sleeping (one)
    vocab: true
    notes:
    - term: कृदन्त
      en: past participle (declines)
    - term: क्त
      en: the क्त निष्ठा suffix — "asleep" (स्वप् → सुप्त)
    - term: विशेषण
      en: qualifying सिंहस्य (agrees — षष्ठी)
    - term: षष्ठी
      en: genitive
    rel:
    - kind: विशेषण
      to: 7
  - form: सिंहस्य
    lemma: सिंह
    gloss: of the lion
    vocab: true
    notes:
    - term: सम्बन्ध
      en: possession
    - term: षष्ठी
      en: genitive
  - form: प्रविशन्ति
    lemma: विश्
    gloss: enter
    vocab: true
    notes:
    - term: लट्
      en: present
    - term: उपसर्ग
      en: प्र — "forward, in"
  - form: मुखे
    lemma: मुख
    gloss: into the mouth
    vocab: true
    notes:
    - term: अधिकरण
      en: locus (goal of entering)
    - term: सप्तमी
      en: locative
  - form: मृगाः
    lemma: मृग
    gloss: deer, beasts
    vocab: true
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative plural
  vyakhya: उद्यमेन कार्याणि सिध्यन्ति, न मनोरथैः। सुप्तस्य सिंहस्य मुखे मृगाः न प्रविशन्ति।
  vyakhya_en: |
    Two instrumentals set the maxim: things get done उद्यमेन "by effort," not
    मनोरथैः "by wishes." कार्याणि is itself a गерundive — कृ + ण्यत् → कार्य, "what
    is to be done" (3.1.124), the very word Pāṇini's rule forms. The second line
    is the image: सुप्तस्य सिंहस्य, "of a sleeping lion" — सुप्त the क्त participle
    of स्वप् — into whose mouth (मुखे) the deer do not walk. Nothing comes without
    the effort of the doing.
- id: rd045
  kind: attested
