  vyakhya: सर्वाणि कर्माणि अग्निविशेषणानि — द्वितीयायाम्। स्वराः उपरि अधश्च चिह्निताः।
  vyakhya_en: |
    Your first Vedic verse, and the grammar is already yours: ईळे "I praise" governs a string of accusatives all in apposition to अग्निम् — पुरोहितम्, देवम्, ऋत्विजम्, होतारम्, रत्नधातमम् — "I praise Agni: priest, god, minister, invoker, treasure-giver." The ONE new thing is accent: the underline ॒ marks anudātta (low pitch), the stroke ॑ marks the raised/svarita pitch. Each word's accent is shown in its padapāṭha (isolated) form — पुरोहितं appears word-alone as पुरः-हितम्. Read it aloud with the pitches: this is how the Veda is chanted.

