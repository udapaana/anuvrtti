  vyakhya: विश्वे देवासः अस्रिधः एहिमायासः अद्रुहः वह्नयः — प्रथमाबहुवचने कर्तृविशेषणानि; मेधम् — द्वितीया कर्मणि; जुषन्त — प्रथमपुरुषबहुवचनम्। विश्वेदेवसूक्तत्रयं समाप्तम्।
  vyakhya_en: |
    The hymn's grammar turns one last time: from ADDRESS to STATEMENT. Through rd032–033 the gods were vocatives ("O All-Gods, come!"); here देवासः is NOMINATIVE — the SUBJECT — qualified by a string of nominative adjectives (अस्रिधः "unfailing," एहिमायासः a bahuvrīhi "whose power approaches," अद्रुहः "guileless," वह्नयः "bearers"). The verb is no longer an imperative TO them but a 3rd-person wish ABOUT them: मेधं जुषन्त, "may they enjoy the offering." The same noun in two cases across one triplet — vocative when called, nominative when described — is the whole lesson of address vs predication. The Viśvedevas triplet, and three-quarters of RV 1.3, complete.
