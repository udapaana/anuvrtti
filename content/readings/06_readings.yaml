# ── Segment 36: RV 1.1.9 — closing prayer; पितेव सूनवे (simile + dative), imperatives ──

- id: rd016
  kind: attested
  segment: 36
  source:
    text: ऋग्वेद
    ref: "RV 1.1.9 (whole ṛc; saṃhitā + padapāṭha) — closes the hymn"
    curated: "complete verse, taken whole; the final verse of the hymn. Accent verbatim from sri-aurobindo.co.in"
  sentence: स नः॑ पि॒तेव॑ सू॒नवेऽग्ने॑ सूपाय॒नो भ॑व। सच॑स्वा नः स्व॒स्तये॑॥
  translation: Be to us, O Agni, easy of approach, as a father to his son; abide with us for our well-being.
  teaches: 'a simile (पिता+इव "like a father") + सम्प्रदान dative (सूनवे, नः, स्वस्तये) + imperatives (भव, सचस्व, लोट्)'
  words:
  - form: सः
    lemma: तद्
    gloss: he, that one (= you, Agni)
    notes:
    - term: सर्वनाम
      en: pronoun
    - term: प्रथमा
      en: nominative
  - form: नः
    lemma: अस्मद्
    gloss: to/for us
    vocab: true
    notes:
    - term: सम्प्रदान
      en: recipient — "to us" (enclitic = अस्मभ्यम्)
