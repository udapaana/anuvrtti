  sentence: यदं॒ग दा॒शुषे॒ त्वमग्ने॑ भ॒द्रं क॑रि॒ष्यसि॑। तवेत्तत्स॒त्यमं॑गिरः॥
  translation: Whatever good you will do for the worshipper, O Agni — that, indeed, is your truth, O Aṅgiras.
  teaches: 'the सम्प्रदान (दाशुषे "for the giver", चतुर्थी) + a future verb (करिष्यसि, लृट्) in real Vedic'
