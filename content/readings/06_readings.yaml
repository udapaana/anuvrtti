  vyakhya_en: |
    The same hymn's second verse, and the frame holds: अग्निः is now the कर्तृ (nominative — last verse he was अग्निम्, the object). The seers who praise him stand in the तृतीया (पूर्वेभिः, ऋषिभिः, नूतनैः — "by the ancient, by the seers, by the new"), the same instrumental "by" you met in नरैः. ईड्यः is a gerundive — "to-be-praised." Then सः (he) देवान् (the gods, acc.) आ … वक्षति — "may bring here." One word, अग्नि, you now know in two cases and with its accent.
