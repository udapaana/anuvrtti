  - form: पि॒ताऽइ॑व
    lemma: पितृ
    gloss: like a father
    vocab: true
    notes:
    - text: 'padapāṭha splits पिता-इव; पिता (nom, the ऋ-stem you met) + इव "like"'
    - term: प्रथमा
      en: nominative (subject of the simile)
  - form: सू॒नवे॑
    lemma: सूनु
    gloss: to/for a son
    vocab: true
    notes:
    - term: सम्प्रदान
      en: recipient — "(as a father) to a son"
    - cite: '2.3.13'
      role: चतुर्थी सम्प्रदाने → सूनवे (an उ-stem dative, गुण → सूनवे, like अग्नये)
    - term: चतुर्थी
      en: dative
  - form: अग्ने॑
