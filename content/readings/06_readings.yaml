  sentence: सर्वद्रव्येषु विद्यैव द्रव्यम् आहुर् अनुत्तमम्। अहार्यत्वाद् अनर्घत्वाद् अक्षयत्वाच् च सर्वदा॥
  translation: Among all forms of wealth they call knowledge alone the unsurpassed wealth — because it cannot be stolen, is priceless, and is imperishable, always.
  teaches: |
    three त्व-abstracts giving the reason in the ablative — अहार्यत्वात् (unstealable),
    अनर्घत्वात् (priceless), अक्षयत्वात् (imperishable); "they call" is the perfect आहुः.
