  sentence: विद्या ददाति विनयम् विनयात् याति पात्रताम्। पात्रत्वात् धनम् आप्नोति धनात् धर्मम् ततः सुखम्॥
  translation: Knowledge gives humility; from humility one reaches worthiness; from worthiness one gains wealth; from wealth, dharma; and from that, happiness.
  teaches: |
    a chain of ablatives — विनयात्, पात्रत्वात्, धनात्, each "from ___," the
