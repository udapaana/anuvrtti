    lemma: श्लोकद्वय
    gloss: two verses
    vocab: true
    notes:
    - cite: "8.3.23"
      role: मोऽनुस्वारः — word-final म् becomes anusvāra before a consonant → श्लोकद्वयं
    - term: द्विगु
      en: द्वौ श्लोकौ — a numeral compound, taken as a single neuter aggregate
    - term: कर्मन्
