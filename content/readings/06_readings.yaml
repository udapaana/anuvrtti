  - form: रा॒जति
    lemma: राज्
    gloss: she shines over, she illumines
    vocab: true
    notes:
    - term: राज्
      en: '"shine, rule" — "she shines over / illumines"'
    - term: लट्
      en: present
    - term: प्रथमपुरुष
      en: 3rd person singular present
    - term: एकवचन
      en: singular
  vyakhya: महः अर्णः सरस्वती प्र चेतयति केतुना — द्वितीया कर्मणि, तृतीया करणे, प्रथमपुरुषैकवचनम्; धियः विश्वाः वि राजति — द्वितीयाबहुवचनं कर्मणि। ऋग्वेदस्य तृतीयं सूक्तं समाप्तम्।
  vyakhya_en: |
    The hymn closes with two preverb-verbs that mirror each other: प्र चेतयति, "she makes (it) forth-known," and वि राजति, "she shines over." Each preverb steers the sense of the verb. She makes known महः अर्णः, "the great flood" (accusative), केतुना, "by her banner" (instrument); she illumines धियः विश्वाः, "all the thoughts" (accusative plural) — the धी "thought" you have met since rd014, now the very thing the goddess of insight lights up. Object in the accusative, means in the instrumental, agent in the nominative: the कारक machinery of the whole reader, in the Veda's own words. **RV 1.3 is complete** — three hymns of the Ṛgveda (1.1, 1.2, 1.3) now read end to end.
