  sentence: म॒हो अर्णः॒ सर॑स्वती॒ प्र चे॑तयति के॒तुना॑। धियो॒ विश्वा॒ वि रा॑जति॥
  translation: Sarasvatī makes the great flood known by her banner; she illumines all our thoughts.
  teaches: 'two preverb+verb pairs (प्र चेतयति "makes known," वि राजति "shines over") + the instrument केतुना ("by her banner") — closing the whole hymn'
  words:
  - form: म॒हः
    lemma: महत्
    gloss: great, mighty
    vocab: true
    notes:
    - term: विशेषण
      en: adjective qualifying अर्णः — "the GREAT flood"
    - term: द्वितीया
      en: accusative
  - form: अर्णः॑
    lemma: अर्णस्
    gloss: the flood, the stream
    vocab: true
    notes:
    - term: कर्मन्
      en: object — what she makes known
    - cite: '2.3.2'
      role: कर्मणि द्वितीया → अर्णः
    - term: द्वितीया
      en: accusative
  - form: सर॑स्वती
    lemma: सरस्वती
    gloss: Sarasvatī
    notes:
    - term: कर्तृ
      en: subject — the goddess as agent
    - term: प्रथमा
      en: nominative singular
  - form: प्र
    lemma: प्र
    gloss: forth
    notes:
    - term: उपसर्ग
      en: preverb — "forth," with चेतयति → "makes known, reveals"
  - form: चे॒तयति
    lemma: चित्
    gloss: she makes known, she reveals
    vocab: true
    notes:
    - term: चित्
      en: '"perceive, make aware" (causative) — "she makes (it) known"'
    - term: प्रथमपुरुष
      en: 3rd person singular present
    - term: एकवचन
      en: singular
  - form: के॒तुना॑
    lemma: केतु
    gloss: by her banner, by her light-of-intelligence
    vocab: true
    notes:
    - term: करण
      en: instrument — "BY her banner (she makes it known)"
    - cite: '2.3.18'
      role: कर्तृकरणयोस्तृतीया → करण → केतुना
    - term: तृतीया
      en: instrumental
