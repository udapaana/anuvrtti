    A complete Pañcatantra maxim, and it parses cleanly: पानीयं (water, कर्तृ/प्रथमा) शमयति (extinguishes) पावकम् (fire, कर्मन्/द्वितीया). The particle अपि ("even") + सुतप्तम् ("well-heated") carry the twist — even water that has itself been heated still quells fire. Real text, real rhetoric, grammar you hold.

# ── Segment 26: Hitopadeśa — a genitive relative + passive verb ──────────

- id: rd006
  kind: attested
  segment: 26
  source:
    text: हितोपदेश
    ref: "Hit_0.23 (first hemistich)"
    curated: "first hemistich only; second (dhanur vaṃśa-viśuddho…) omitted"
  sentence: यस्य कस्य प्रसूतोऽपि गुणवान् पूज्यते नरः।
  translation: A virtuous man, though born of whomever, is honored.
  teaches: 'genitive relative (यस्य कस्य) + a passive verb (पूज्यते) in real text'
  words:
  - form: यस्य
    lemma: यद्
    gloss: of whom
    notes:
    - term: षष्ठी
      en: genitive
    - cite: '1.1.27'
      role: सर्वादीनि सर्वनामानि — यद् is a सर्वनाम (pronoun)
    - cite: '2.3.50'
      role: षष्ठी शेषे — the relational genitive → यस्य
  - form: कस्य
    lemma: किम्
    gloss: of whatever (paired with यस्य = "of whomsoever")
    vocab: true
    notes:
    - term: षष्ठी
      en: genitive
    - text: 'यस्य कस्य together = "of no matter whom"'
  - form: प्रसूतः
    lemma: प्रसू
    gloss: born
    vocab: true
    notes:
    - term: कर्तृ
      en: agent (a past participle agreeing with नरः)
    - term: प्रथमा
      en: nominative
    - text: 'प्रसूतः → प्रसूतो before अपि (visarga sandhi)'
  - form: अपि
    lemma: अपि
    gloss: even, though
    notes:
    - term: अव्यय
      en: indeclinable — "even / though"
  - form: गुणवान्
    lemma: गुणवत्
    gloss: virtuous, having merit
    vocab: true
    notes:
    - term: विशेषण
      en: adjective qualifying नरः (a वत्-stem, "possessing guṇa")
    - term: प्रथमा
      en: nominative
  - form: पूज्यते
    lemma: पूज्
    gloss: is honored
    vocab: true
    notes:
    - term: पूज्
      en: '"honor, worship"'
    - term: लट्
      en: present
    - text: 'passive (कर्मणि प्रयोग) — "is honored", as भुज्यन्ते earlier'
  - form: नरः
    lemma: नर
    gloss: the man
    notes:
    - term: कर्तृ
      en: agent (here the grammatical subject of the passive)
    - term: प्रथमा
      en: nominative
    - cite: '1.4.54'
      role: स्वतन्त्रः कर्ता → नर
  vyakhya: यस्य कस्य प्रसूतः अपि — सम्बन्धः अनिश्चितः; गुणवान् नरः पूज्यते।
  vyakhya_en: |
    The genitive pair यस्य कस्य ("of whomsoever") waives the question of birth; अपि ("even/though") concedes it; and the verse turns on पूज्यते — "is honored," a passive, the same कर्मणि form you met in नरैः फलानि भुज्यन्ते. The sense: a man of merit (गुणवान्) is honored whatever his lineage. A relative clause and a passive, working together in real Sanskrit.

# ── Segment 27: Pañcatantra — genitive plural + a कर्मधारय compound ──────

- id: rd007
  kind: attested
  segment: 27
  source:
    text: पञ्चतन्त्र
    ref: "Panc_1.148 (first hemistich)"
