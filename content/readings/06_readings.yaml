    - term: विशेषण
      en: predicate of त्रितयम्
    - term: प्रथमा
      en: nominative
    rel:
    - kind: विशेषण
      to: 5
  - form: कार्यकारणतः
    lemma: कार्यकारण
    gloss: out of cause and interest
    vocab: true
    notes:
    - term: तद्धित
      en: adverb from a noun — कार्यकारण + तसिल् (→ तस्), "from ___"
    - cite: '5.3.7'
      role: पञ्चम्यास्तसिल् — in the ablative sense, तसिल् (-तस्) forms an adverb → कार्यकारण + तसिल् → कार्यकारणतः
    - term: तसिल्
      en: the "-tas / from ___" adverbial suffix
    - term: अव्यय
      en: adverb (of cause)
  - form: चान्ये
    lemma: अन्य
    gloss: and others
    notes:
    - cite: '6.1.101'
      role: अकः सवर्णे दीर्घः — a simple vowel + its homogeneous vowel merge into one long vowel → च (अ) + अन्ये → चान्ये
    - term: सर्वादि
      en: सर्वनाम अन्य "other," with च "and"
    - term: कर्तृ
      en: subject
    - term: प्रथमा
      en: nominative plural
  - form: भवन्ति
    lemma: भू
    gloss: become
    notes:
    - term: लट्
      en: present (3pl)
  - form: हितबुद्धयः
    lemma: हितबुद्धि
    gloss: well-disposed
    vocab: true
    notes:
    - term: बहुव्रीहि
      en: possessive — "those WHOSE thought (बुद्धि) is kindly (हित)"
    - cite: '2.2.24'
      role: अनेकमन्यपदार्थे — a बहुव्रीहि naming the possessor → हित + बुद्धि → हितबुद्धि
    - term: विशेषण
      en: predicate of चान्ये
    - term: प्रथमा
      en: nominative plural
    rel:
    - kind: विशेषण
      to: 9
  vyakhya: 'तसिल्-सन्धि-प्रधानः श्लोकः। कार्यकारणतः इति पञ्चम्यर्थे तसिल् (पञ्चम्यास्तसिल्) — अव्ययम्। चेति इति च-इति गुणसन्धौ (आद्गुणः); चान्ये इति च-अन्ये सवर्णदीर्घे (अकः सवर्णे दीर्घः)। त्रितयम् इति समाहारे तयप्। हितबुद्धयः इति बहुव्रीहिः।'
  vyakhya_en: |
    Three small mechanisms in one line. **तसिल्** — कार्यकारणतः "from cause and
    effect," the -तस् adverb that stands in for an ablative (5.3.7,
    पञ्चम्यास्तसिल्). And two सन्धि joins that a fast reader must simply *know*:
    चेति = च + इति (guṇa, अ+इ → ए, 6.1.87) and चान्ये = च + अन्ये (savarṇa
    lengthening, अ+अ → आ, 6.1.101). Add the collective त्रितयम् "the triad" and
    the बहुव्रीहि हितबुद्धयः "kindly-minded," and the verse's quiet claim lands:
    three love you by nature; the rest, for a reason.
- id: rd061
  kind: attested
  segment: 369
  source:
    text: हितोपदेश
    ref: "Hitopadeśa 1.14 — the mark of the wise"
    curated: "the whole verse, word-separated (pausa forms; compounds kept whole); every form is the text's. From Ambuda's GRETIL edition (ambuda-org/gretil, sa_nArAyaNa-hitopadeza, Hit_1.14)"
  sentence: मातृवत् परदारेषु परद्रव्येषु लोष्ट्रवत्। आत्मवत् सर्वभूतेषु यः पश्यति सः पण्डितः॥
  translation: He who looks on others' wives as on a mother, on others' wealth as on a clod of earth, on all beings as on himself — he is the wise one.
  teaches: |
    the वति suffix — "just like ___": मातृवत् "as (one would toward) a mother,"
    लोष्ट्रवत् "like a clod," आत्मवत् "as oneself." One little suffix turns a
    noun into an adverb of comparison.
  words:
  - form: मातृवत्
    lemma: मातृ
    gloss: as toward a mother
    vocab: true
    notes:
    - term: तद्धित
      en: adverb of likeness — मातृ "mother" + वति "just as with a ___"
    - cite: '5.1.115'
      role: तेन तुल्यं क्रिया चेद्वतिः — when an action is done "equally with / just as toward" something, वति is added → मातृ + वति → मातृवत्
    - term: वति
      en: the "just-like" suffix (indeclinable)
  - form: परदारेषु
    lemma: परदार
    gloss: regarding others' wives
    notes:
    - term: तत्पुरुष
      en: compound — परस्य दाराः "another's wife"
    - term: अधिकरण
      en: the sphere — "in the matter of ___"
    - term: सप्तमी
      en: locative plural
  - form: परद्रव्येषु
    lemma: परद्रव्य
    gloss: regarding others' wealth
    notes:
    - term: तत्पुरुष
      en: compound — परस्य द्रव्यम् "another's property"
    - term: अधिकरण
      en: the sphere
    - term: सप्तमी
      en: locative plural
  - form: लोष्ट्रवत्
    lemma: लोष्ट्र
    gloss: like a clod of earth
    vocab: true
    notes:
    - term: तद्धित
      en: adverb of likeness — लोष्ट्र "clod" + वति
    - cite: '5.1.115'
      role: तेन तुल्यं क्रिया चेद्वतिः → लोष्ट्र + वति → लोष्ट्रवत् "just as (toward) a clod"
    - term: वति
      en: the "just-like" suffix
  - form: आत्मवत्
    lemma: आत्मन्
    gloss: as (toward) oneself
    vocab: true
    notes:
    - term: तद्धित
      en: adverb of likeness — आत्मन् "self" + वति
    - cite: '5.1.115'
      role: तेन तुल्यं क्रिया चेद्वतिः → आत्म + वति → आत्मवत् "just as toward oneself"
    - term: वति
