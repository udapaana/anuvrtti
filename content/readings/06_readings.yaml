      en: indeclinable
  - form: धर्मशास्त्राणि
    lemma: धर्मशास्त्र
    gloss: the treatises on dharma
    vocab: true
    notes:
    - term: षष्ठी-तत्पुरुष
      en: धर्मस्य शास्त्राणि — compounded
    - term: प्रथमा
      en: neuter nominative plural
  - form: अर्थशास्त्राणि
    lemma: अर्थशास्त्र
    gloss: the treatises on statecraft
    vocab: true
    notes:
    - term: प्रथमा
      en: neuter nominative plural — the same compound shape on a second stem
  - form: च
    lemma: च
    gloss: and
    notes:
    - term: अव्यय
      en: indeclinable
  - form: एवं
    lemma: एवम्
    gloss: in this way
    notes:
    - cite: "8.3.23"
      role: मोऽनुस्वारः — word-final म् becomes anusvāra before a consonant → एवं
    - term: अव्यय
      en: indeclinable
  - form: व्यतीते
    lemma: इ
    gloss: having passed
    notes:
    - term: निष्ठा
      en: past participle in the locative — half of the सति सप्तमी
    - term: सप्तमी
      en: locative, agreeing with काले
  - form: काले
    lemma: काल
    gloss: when the time
    notes:
    - term: सति सप्तमी
      en: the locative absolute — "when time had passed in this way"
    - term: सप्तमी
      en: locative
  - form: बुद्धिः
    lemma: बुद्धि
    gloss: the intellect
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: प्रबुध्यते
    lemma: बुध्
    gloss: awakens
    notes:
    - term: आत्मनेपद
      en: प्र + बुध् in the middle — it wakes of itself
  - form: इति
    lemma: इति
    gloss: "thus"
    notes:
    - term: अव्यय
      en: closes the quotation
  vyakhya: व्यतीते काले — सति सप्तमी। द्वादश वर्षाणि — कालद्वितीया।
  vyakhya_en: |
    Two constructions here do work that English gives to conjunctions.
    व्यतीते काले is a noun and a participle both in the locative, and together
    they mean "when the time had passed" — no "when" anywhere in the Sanskrit.
    Once recognised, it is everywhere in classical prose.

    And द्वादश वर्षाणि is accusative, though nothing is being acted on. The
    accusative also marks extent — how long, how far — so "for twelve years"
    takes the same case as an object would.

- id: rd042
  kind: attested
  segment: 315
  source:
    text: पञ्चतन्त्र
    ref: "Pañcatantra, कथामुख — Viṣṇuśarman's offer"
    curated: "Viṣṇuśarman's undertaking, lightly abridged; the words are the text's own"
  sentence: अथ विष्णुशर्मा नाम ब्राह्मणः अवदत् — देव, एतान् राजपुत्रान् षण्मासाभ्यन्तरे नीतिशास्त्रज्ञान् करिष्यामि। यदि न करोमि तदा देवः मम नाम त्यजतु।
  translation: Then a brahmin named Viṣṇuśarman said — "Your Majesty, within six months I will make these princes knowers of the science of policy. If I do not, then let Your Majesty discard my name."
  teaches: |
    the promise the Pañcatantra hangs on. नीतिशास्त्रज्ञान् is the second
    accusative of "make X into Y"; त्यजतु stakes an oath.
  words:
  - form: अथ
    lemma: अथ
    gloss: then
    vocab: true
    notes:
    - term: अव्यय
      en: indeclinable — the standard narrative connective
  - form: विष्णुशर्मा
    lemma: विष्णुशर्मन्
    gloss: Viṣṇuśarman
    vocab: true
    notes:
