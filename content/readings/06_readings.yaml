  sentence: विश्वे॑ दे॒वासो॑ अ॒स्रिध॒ एहि॑मायासो अ॒द्रुहः॑। मेधं॑ जुषंत॒ वह्न॑यः॥
  translation: The All-Gods, unfailing, of ever-approaching power, free of malice — may they, the bearers (of sacrifice), enjoy the offering.
  teaches: 'a shift from address to STATEMENT — the gods now in the NOMINATIVE (subject) + a 3rd-person plural verb जुषन्त ("may they enjoy"), closing the hymn on a wish'
  words:
  - form: विश्वे॑
    lemma: विश्व
    gloss: all
    notes:
    - term: विशेषण
      en: '"all" — now NOMINATIVE (the gods as subject, not addressed)'
    - term: प्रथमा
      en: nominative plural
  - form: दे॒वासः
    lemma: देव
    gloss: the gods
    notes:
    - text: 'देवासः — here NOMINATIVE (subject), not vocative as in rd032-033'
    - term: कर्तृ
      en: subject — "the All-Gods (enjoy)…"
    - cite: '1.4.21'
      role: बहुषु बहुवचनम् → plural → देवासः
    - term: प्रथमा
      en: nominative plural
  - form: अ॒स्रिधः॑
    lemma: अस्रिध्
    gloss: unfailing, not erring
    vocab: true
    notes:
    - text: 'अ-स्रिध् "not failing" (privative अ + स्रिध् "err")'
    - term: विशेषण
      en: nominative-plural adjective of the gods
    - term: प्रथमा
      en: nominative plural
  - form: एहि॑ऽमायासः
    lemma: एहिमाय
    gloss: of ever-approaching power, whose wisdom comes near
    vocab: true
    notes:
    - text: 'padapāṭha splits एहि-मायासः; एहि "come!" + माया "power, wisdom" — bahuvrīhi'
    - term: बहुव्रीहि
      en: possessive compound — "(those) whose power approaches"
    - term: प्रथमा
      en: nominative plural
  - form: अ॒द्रुहः॑
    lemma: अद्रुह्
    gloss: free of malice, guileless
    vocab: true
    notes:
    - text: 'अ-द्रुह् "not hostile" (privative अ + द्रुह् "harm")'
    - term: विशेषण
      en: nominative-plural adjective of the gods
    - term: प्रथमा
      en: nominative plural
  - form: मेध॑म्
    lemma: मेध
    gloss: the offering, the sacrifice
    vocab: true
    notes:
    - term: कर्मन्
      en: object — what they are to enjoy
    - cite: '2.3.2'
      role: कर्मणि द्वितीया → मेधम्
    - term: द्वितीया
      en: accusative
  - form: जु॒षन्त
    lemma: जुष्
    gloss: may they enjoy, let them take pleasure in
    vocab: true
    notes:
    - term: जुष्
      en: '"enjoy, take pleasure in" — 3rd-person PLURAL (injunctive, wish sense)'
    - term: प्रथमपुरुष
      en: 3rd person plural — "may they enjoy" (the gods as subject)
    - cite: '1.4.21'
      role: बहुषु बहुवचनम् → plural → जुषन्त
    - term: बहुवचन
      en: plural
  - form: वह्न॑यः
    lemma: वह्नि
    gloss: the bearers (of the sacrifice), the conveyers
    vocab: true
    notes:
    - text: 'वह्नि "bearer, conveyer" (from वह् "carry") — in apposition to देवासः'
    - term: कर्तृ
      en: subject — the gods as "bearers" (nominative)
    - term: प्रथमा
      en: nominative plural
  vyakhya: विश्वे देवासः अस्रिधः एहिमायासः अद्रुहः वह्नयः — प्रथमाबहुवचने कर्तृविशेषणानि; मेधम् — द्वितीया कर्मणि; जुषन्त — प्रथमपुरुषबहुवचनम्। विश्वेदेवसूक्तत्रयं समाप्तम्।
  vyakhya_en: |
    The hymn's grammar turns one last time: from ADDRESS to STATEMENT. Through rd032–033 the gods were vocatives ("O All-Gods, come!"); here देवासः is NOMINATIVE — the SUBJECT — qualified by a string of nominative adjectives (अस्रिधः "unfailing," एहिमायासः a bahuvrīhi "whose power approaches," अद्रुहः "guileless," वह्नयः "bearers"). The verb is no longer an imperative TO them but a 3rd-person wish ABOUT them: मेधं जुषन्त, "may they enjoy the offering." The same noun in two cases across one triplet — vocative when called, nominative when described — is the whole lesson of address vs predication. The Viśvedevas triplet, and three-quarters of RV 1.3, complete.
