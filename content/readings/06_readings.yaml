  sentence: अलंकारो हि नारीणाम् क्षमा तु पुरुषस्य वा॥
  translation: Forgiveness is the ornament of women — and of a man as well.
  teaches: |
    a balanced maxim of genitives: नारीणाम् "of women" (with णत्व, न → ण after
    the र of नारी) and पुरुषस्य "of a man" (the अ-stem genitive स्य).
  words:
  - form: अलंकारो
    lemma: अलंकार
    gloss: an ornament
    vocab: true
    notes:
    - term: कर्तृ
      en: subject / predicate nominative
    - term: प्रथमा
