    - cite: '4.1.4'
      role: अजाद्यतष्टाप् → feminine आ → पावका
    - term: प्रथमा
      en: nominative singular (feminine)
  - form: नः
    lemma: अस्मद्
    gloss: our
    notes:
    - term: सम्बन्ध
      en: 'our (sacrifice) — enclitic नः qualifying यज्ञम्'
    - term: षष्ठी
      en: genitive
  - form: सर॑स्वती
    lemma: सरस्वती
    gloss: Sarasvatī
    notes:
    - text: 'सरस्वती — feminine ई-stem (the नदी class you met as नदी in rd010)'
    - term: कर्तृ
      en: subject — the goddess as agent
    - term: प्रथमा
      en: nominative singular (feminine)
  - form: वाजे॑भिः
    lemma: वाज
    gloss: with plenitudes, with abundances
    vocab: true
