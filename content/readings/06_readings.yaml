  vyakhya: 'यत्तद्सम्बन्धप्रधानः श्लोकः। यस्य … तस्य इति षष्ठ्या सम्बन्धे ("यस्य अर्थाः सन्ति सः") — भवत्यर्थे षष्ठी। पुमान् इति पुंसः असुङि प्रथमैकवचनम् (पुंसोऽसुङ्)। मित्राणि इति नपुंसके नुम्। लोकोक्तिः अर्थमाहात्म्ये।'
  vyakhya_en: |
    A cynical proverb, and a clean lesson in the **possessive genitive**. Sanskrit
    has no verb "to have"; it says instead "of whom X (is), to him Y" — यस्य अर्थाः
    तस्य बान्धवाः, "whose the riches, his the kinsmen." The यस्य … तस्य / सः
    correlative pins each clause. Note पुमान्, the irregular nominative of पुंस्
    "man" (7.1.89, with the असुङ् augment), and मित्राणि with its neuter नुम्. The
    verse's sting is in the repetition: change one word — आर्यः to अर्थाः — and
    friendship becomes finance.
- id: rd062
  kind: attested
  segment: 370
  source:
    text: हितोपदेश
    ref: "Hitopadeśa 1.38 — the three natural well-wishers"
    curated: "the whole verse, word-separated (pausa forms; चेति and चान्ये kept fused to show the सन्धि); every form is the text's. From Ambuda's GRETIL edition (ambuda-org/gretil, sa_nArAyaNa-hitopadeza, Hit_1.38)"
  sentence: माता मित्रम् पिता चेति स्वभावात् त्रितयम् हितम्। कार्यकारणतः चान्ये भवन्ति हितबुद्धयः॥
  translation: Mother, friend, and father — this triad is well-wishing by nature; others become well-disposed (only) out of cause and interest.
  teaches: |
    the तसिल् adverb — कार्यकारणतः "from cause-and-effect, out of interest"; the
    collective त्रितयम् "the set of three"; and two सन्धि joins hiding in plain
    sight — चेति (guṇa) and चान्ये (savarṇa lengthening).
  words:
  - form: माता
    lemma: मातृ
    gloss: mother
    notes:
    - term: कर्तृ
      en: subject
    - term: प्रथमा
      en: nominative (ऋ-stem → माता)
  - form: मित्रम्
    lemma: मित्र
    gloss: friend
    notes:
    - term: कर्तृ
      en: subject
    - term: प्रथमा
      en: nominative (neuter)
  - form: पिता
    lemma: पितृ
    gloss: father
    notes:
    - term: कर्तृ
      en: subject
    - term: प्रथमा
      en: nominative (ऋ-stem → पिता)
  - form: चेति
    lemma: च
    gloss: — so (these)
    notes:
    - cite: '6.1.87'
      role: आद्गुणः — अ + इ coalesce to the guṇa vowel ए → च + इति → चेति
    - term: अव्यय
      en: च "and" + इति "thus" — closing the list
  - form: स्वभावात्
    lemma: स्वभाव
    gloss: by nature
    vocab: true
    notes:
    - term: हेतु
      en: the cause — "on account of (their) nature"
    - term: पञ्चमी
      en: ablative (of cause)
  - form: त्रितयम्
    lemma: त्रितय
    gloss: the triad
    vocab: true
    notes:
    - term: संख्या
      en: collective numeral — "the set of three" (त्रि + the collective तयप्)
    - term: कर्तृ
      en: subject (sums up the three)
    - term: प्रथमा
      en: nominative (neuter)
  - form: हितम्
    lemma: हित
    gloss: beneficial, well-wishing
