  vyakhya: इन्द्र — सम्बोधनम्; आ याहि — लोटि मध्यमपुरुषैकवचनम्; धिया — तृतीया करणे; इषितः विप्रजूतः — क्तान्तविशेषणे; उप ब्रह्माणि — द्वितीया कर्मणि गत्यर्थे; सुतावतः वाघतः — षष्ठी सम्बन्धे।
  vyakhya_en: |
    The same call — आ याहि, "come" — but now Indra is moved BY something and moves TO something. He is धिया इषितः, "urged on by the thought" (instrumental of means, the धी you met as धिया in rd027), and विप्रजूतः, "hastened by the seers." Where to? उप ब्रह्माणि वाघतः — "up to the prayers of the worshipper," where उप is a preverb steering the verb of motion onto an accusative goal (ब्रह्माणि), and वाघतः is a genitive ("of the worshipper"). Means in the instrumental, goal in the accusative, possession in the genitive — three cases you hold, in one line of the Veda.
