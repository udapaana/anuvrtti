  sentence: उत्तमोत्तमम् अप्राप्यम् अविवेकः हि वाञ्छसि। सत्यम् सुतः त्वम् अपि अस्य किन्तु न त्वम् मया धृतः॥
  translation: Without discernment you long for the highest of the high, which is beyond your reach. True, you too are his son — but you were not borne by me.
  teaches: |
    the speech turns the blade — a नञ्-gerundive अप्राप्यम् "not to be attained,"
    a नञ्-bahuvrīhi अविवेकः "you without sense," and the passive-in-participle
    त्वम् … मया धृतः "you (were) held by me," agent again in the instrumental.
