  vyakhya: 'वाक्यस्य अन्तः — निष्ठुरतमम्। उत्तमोत्तमम् अप्राप्यम् इति कर्मधारयः ण्यदन्तविशेषणेन (ऋहलोर्ण्यत्)। अविवेकः इति नञ्बहुव्रीहिः। त्वम् मया धृतः इति निष्ठायाम् कर्तरि तृतीया — "न धृतः" इति गर्भधारणनिषेधः। सुतः त्वम् अपि इति स्वीकारे अपि निराकरणम्।'
  vyakhya_en: |
    The speech ends on its coldest line, and it is built from things you now read
    at sight. उत्तमोत्तमम् अप्राप्यम् "the unattainable highest-of-high" — a
    कर्मधारय described by a नञ्-**gerundive**, अ-प्राप्य "not to be reached" (ण्यत्,
    3.1.124). अविवेकः "you, without sense" is a नञ्-**bahuvrīhi**. And the final
    cut is a **participle with its agent in the instrumental** — त्वम् … मया धृतः,
    "you were not held by me" — the क्त standing in for a passive: *I did not carry
    you.* She grants सुतः त्वम् अपि "you too are a son," only to take back the womb.
