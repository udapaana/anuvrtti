  vyakhya: दस्रा नासत्या रुद्रवर्तनी — सम्बोधनद्विवचनम्; युवाकवः सुताः वृक्तबर्हिषः — प्रथमायां प्रत्ययनामानि; आ यातम् — लोटि मध्यमपुरुषद्विवचनम्। अश्विसूक्तं समाप्तम्।
  vyakhya_en: |
    The triplet to the Aśvins closes with a NOMINATIVE string describing the offering: युवाकवः सुताः वृक्तबर्हिषः — "the pressed (soma), yearning for you, with sacred grass strewn." These are predicates: the rite is ready. The pair, addressed as दस्रा ("wondrous"), नासत्या ("truthful"), रुद्रवर्तनी ("of Rudra's path"), are bidden आ यातम् — "come, you two" — the very dual imperative you first met as आ गतम् in rd020. The Aśvin hymn is complete.
