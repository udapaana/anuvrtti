  vyakhya: 'आख्याने वात्सल्यपदम्। ईषत्प्रस्फुरिताधरम् इति बहुव्रीहिः पुत्रविशेषणम् — "किञ्चित् कम्पमानौष्ठम्"। आरोप्य इति आरोपयतेः (णिजन्तस्य) ल्यप्। मैत्रेय इति कथकस्य श्रोतृसम्बोधनम्। तम् कुपितम् पुत्रम् दृष्ट्वा … अभाषत इति क्रमः।'
  vyakhya_en: |
    The tenderness turns on one long word: ईषत्-प्रस्फुरित-अधरम्, "whose lower lip
    was *just barely* trembling" — a बहुव्रीहि that holds an entire observed detail
    (a child fighting not to cry) inside a single accusative describing पुत्रम्.
    Around it the ordinary machinery: दृष्ट्वा "having seen," and आरोप्य "having
    lifted (him) onto (her lap)" — a ल्यप् from the causative आ-रोपय्. मैत्रेय is
    the frame breaking through: Parāśara, telling the tale, turns to the pupil he
    is telling it to.
