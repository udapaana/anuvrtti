  sentence: तम् दृष्ट्वा कुपितम् पुत्रम् ईषत्प्रस्फुरिताधरम्। सुनीतिः अङ्कम् आरोप्य मैत्रेय इदम् अभाषत॥
  translation: Seeing that angry boy, his lip slightly quivering, Sunīti — O Maitreya — lifted him onto her lap and said this.
  teaches: |
    a whole descriptive clause folded into one word — ईषत्प्रस्फुरिताधरम् "whose
    lip was just barely quivering" — beside the प्रयोजक gerund आरोप्य "having
    lifted (him) onto," and the storyteller's aside मैत्रेय "O Maitreya."
