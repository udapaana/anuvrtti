  vyakhya: 'भगीरथतपःपदम् — बहुव्रीहिपुञ्जः। ऊर्ध्वबाहुः पञ्चतपाः मासाहारः जितेन्द्रियः इति चत्वारः बहुव्रीहयः, सर्वे सः इति कर्तुः विशेषणानि — तपोविधिम् आचक्षते। तपः दीर्घम् आतिष्ठत् इति आ-तिष्ठतेः लङ्; गोकर्णे इति अधिकरणे; रघुनन्दन इति रामसम्बोधनम्।'
  vyakhya_en: |
    The ascetic is drawn in four **possessive compounds**, one after another — the
    बहुव्रीहि's natural home. ऊर्ध्वबाहुः "arms-upraised," पञ्चतपाः "keeping the five
    fires," मासाहारः "eating once a month," जितेन्द्रियः "senses conquered": none of
    these words *is* an arm or a fire or a sense — each points outside itself to the
    man who has that feature. All four hang on सः, the one subject. The finite verb
    is आतिष्ठत् (आ-स्था, लङ्), "he set himself to" the तपः दीर्घम्, "long austerity."
