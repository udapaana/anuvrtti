  sentence: सः तपः दीर्घम् आतिष्ठत् गोकर्णे रघुनन्दन। ऊर्ध्वबाहुः पञ्चतपाः मासाहारः जितेन्द्रियः॥
  translation: He undertook long austerity at Gokarṇa, O delight of the Raghus — his arms upraised, keeping the five fires, eating but once a month, his senses mastered.
  teaches: |
    the possessive compound, four in a row — ऊर्ध्वबाहुः "arms-upraised,"
    पञ्चतपाः "five-fired," मासाहारः "month-eating," जितेन्द्रियः "senses-conquered":
    each names the ascetic by a feature that belongs to him.
