  vyakhya: मित्रं वरुणं च हुवे — द्वितीयायाम्। साधन्ता इति द्विवचनं कृदन्तम्, तयोः विशेषणम्।
  vyakhya_en: |
    A new divine pair enters — Mitra and Varuṇa. Here they are OBJECTS: मित्रम् … वरुणम् च, accusatives, "I call (हुवे, 1st-person singular) Mitra and Varuṇa," each with its epithet (पूतदक्षम् "pure-skilled," रिशादसम् "foe-destroying"). They jointly perfect धियं घृताचीम् ("the luminous thought," accusative) — and साधन्ता, "the two who perfect," is a participle in the DUAL, agreeing with the pair. The dual now appears even on a participle.

