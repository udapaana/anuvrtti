  sentence: न हि तद् विद्यते किञ्चिद् यद् अर्थेन न सिध्यति। यत्नेन मतिमान् तस्माद् अर्थम् एकम् प्रसाधयेत्॥
  translation: There is nothing at all that is not achieved by wealth; therefore the wise man should, by effort, secure wealth above all.
  teaches: |
    an optative maxim. प्रसाधयेत् is विधिलिङ्, "should secure"; मतिमान् is the
    मतुप् possessive "the one having wit"; अर्थेन / यत्नेन are the तृतीया of means.
