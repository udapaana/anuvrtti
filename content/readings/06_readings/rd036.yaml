  vyakhya: चोदयित्री चेतन्ती सरस्वती — प्रथमैकवचने स्त्रीलिङ्गकर्तृविशेषणानि; सूनृतानां सुमतीनाम् — षष्ठी कर्तृकर्मसम्बन्धे; यज्ञम् — द्वितीया कर्मणि; दधे — लिटि प्रथमपुरुषैकवचनम्।
  vyakhya_en: |
    Sarasvatī is named by two feminine agent-words: चोदयित्री ("the impeller," a तृच्-agent-noun made feminine with ई) and चेतन्ती ("awakening," a present participle, शतृ + ई). Both GOVERN a genitive — चोदयित्री सूनृतानाम् "impeller OF true words," चेतन्ती सुमतीनाम् "awakener OF good thoughts" — the षष्ठी शेषे relation (2.3.50). Her act is दधे, "she has upheld," a PERFECT of √धा, the same root you have now seen as a present dual (दधाते, rd025), a middle imperative (दधिष्व, rd031), and now a perfect. One root, four tenses-and-moods, across the Saṃhitā.
