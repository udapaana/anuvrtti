  sentence: चो॒द॒यि॒त्री सू॒नृता॑नां॒ चेतं॑ती सुमती॒नां। य॒ज्ञं द॑धे॒ सर॑स्वती॥
  translation: Impeller of true sayings, awakener of right thoughts — Sarasvatī has upheld the sacrifice.
  teaches: 'two feminine agent-nouns governing the genitive — चोदयित्री … सूनृतानाम्, "impeller of true words" — and the perfect दधे "she has upheld"'
