  vyakhya: 'आतिथ्यप्रस्तावः — उत्तमपुरुषे लट्, आज्ञायाम् लोट्। आतिथ्यम् कर्तुम् इच्छामि इति तुमुना सह इष्धातुः। बलस्य तव इति आतिथ्यसम्बन्धे षष्ठी। अप्रमेयस्य इति नञ्पूर्वो ण्यदन्तः। यथार्हम् इति अव्ययीभावः। संप्रतीच्छ मे इति प्रतिग्रहणे आज्ञा।'
  vyakhya_en: |
    The host speaks, and the verse runs on two moods of the first and second
    person. Vasiṣṭha's **present** इच्छामि "I wish," steered by an infinitive —
    आतिथ्यम् कर्तुम् "to do hospitality" — and then his **imperative** to the guest,
    संप्रतीच्छ "accept!" Around them, आतिथ्यम् is the abstract noun of अतिथि "guest"
    (ष्यञ्); अप्रमेयस्य "immeasurable" a नञ्-gerundive; and यथार्हम् "as is due" an
    अव्ययीभाव. This courtesy is the hinge of the whole story: to feast an army,
    Vasiṣṭha will call his wish-granting cow — and Viśvāmitra will want her.
