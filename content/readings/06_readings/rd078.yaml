    curated: "the whole verse, word-separated (pausa forms); every form is Vālmīki's. From Ambuda's GRETIL edition (ambuda-org/gretil, sa_rAmAyaNa, R_1.051.013). After they had talked happily a long while, Vasiṣṭha, smiling, said this."
  sentence: आतिथ्यम् कर्तुम् इच्छामि बलस्य अस्य महाबल। तव च एव अप्रमेयस्य यथार्हम् संप्रतीच्छ मे॥
  translation: I wish to offer hospitality to this army of yours, O mighty one, and to you, the immeasurable — accept from me what is fitting.
  teaches: |
    the host's offer — a first-person present इच्छामि "I wish" with an infinitive
    कर्तुम्, and an imperative संप्रतीच्छ "accept!"; plus the abstract आतिथ्यम्
    "hospitality" and the adverb-compound यथार्हम् "as is fitting."
