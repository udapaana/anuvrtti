    curated: "fourth quarter, completing the verse; taken whole"
  sentence: धनाद् धर्मं ततः सुखम्।
  translation: From wealth, righteousness; from that, happiness.
  teaches: 'the closing link, with the repeated verb left unspoken — आप्नोति is understood'
  words:
  - form: धनाद्
    lemma: धन
    gloss: from wealth
    notes:
    - term: अपादान
      en: source
    - term: पञ्चमी
      en: ablative
    - cite: '2.3.28'
      role: अपादाने पञ्चमी → धनात् (→ धनाद् before voiced ध, जश्त्व)
  - form: धर्मं
    lemma: धर्म
    gloss: righteousness
    vocab: true
    notes:
    - cite: "8.3.23"
      role: मोऽनुस्वारः — word-final म् becomes anusvāra before a consonant → धर्मं
    - term: कर्मन्
      en: object (of an understood आप्नोति)
    - term: द्वितीया
      en: accusative
    - text: 'धर्मम् → धर्मं (final म् → anusvāra before त, the sandhi you met)'
  - form: ततः
    lemma: ततस्
    gloss: from that, thence
    vocab: true
    notes:
    - term: अव्यय
      en: 'indeclinable adverb (= "from that", standing for तस्मात्)'
  - form: सुखम्
    lemma: सुख
    gloss: happiness
    vocab: true
    notes:
    - term: कर्मन्
      en: object (again of the understood verb)
    - term: द्वितीया
      en: accusative
  vyakhya: धनाद् धर्मः, धर्मात् सुखम् — क्रिया अनुवर्तते। विद्यायाः सुखपर्यन्तः क्रमः।
  vyakhya_en: |
    The verse closes: from wealth, righteousness (धर्मं); from that (ततः), happiness (सुखम्). The verb आप्नोति is not repeated — it is understood, carried over (अनुवृत्ति) from the previous line, exactly as a sūtra carries words forward. You have now read a whole verse: विद्या → विनय → पात्रत्व → धन → धर्म → सुख, knowledge leading step by step to happiness.

