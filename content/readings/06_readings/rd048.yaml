  sentence: यन् नवे भाजने लग्नः संस्कारो नान्यथा भवेत्। कथाच्छलेन बालानां नीतिस् तद् इह कथ्यते॥
  translation: Since an impression set on a new vessel cannot become otherwise, statecraft is here told to children through the guise of story.
  teaches: |
    the book's method, and a passive. लग्नः is a क्त participle; भवेत् is the
    optative; and नीतिः कथ्यते — "is told" — is the passive (कर्मणि) of कथ्.
