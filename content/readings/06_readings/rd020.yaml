  vyakhya: इन्द्रवायू इति द्वन्द्वः द्विवचने; आ गतम् इति द्विवचनलोट्; वाम् इति द्विवचनम्। द्वौ देवौ, द्विवचनम्।
  vyakhya_en: |
    The DUAL arrives — Sanskrit's third number, for exactly two. The pair इन्द्रवायू is a द्वन्द्व compound ("Indra and Vāyu") in the dual (द्विवचन, 1.4.22), and everything addressed to them is dual too: आ गतम् "come, *you two*" (a dual imperative), and वाम् "you two" (the dual of युष्मद्). Between, सुताः ("the pressed Somas") and इन्दवः ("the drops") are plural subjects. Singular, plural, and now dual — the वचन triad is complete, here in real Vedic.

