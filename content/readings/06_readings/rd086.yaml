  vyakhya: 'भगीरथस्य वरप्रार्थना — सम्भावनायाम् यदि, आशिषि लिङ्। यदि मे भगवान् प्रीतः, यदि तपसः फलम् अस्ति इति द्विः सम्भावना। आप्नुयुः इति आपः लिङि बहुवचनम् (विधिनिमन्त्रण… लिङ्)। मत्तः इति मदो तसिल् (पञ्चम्यास्तसिल्)। आत्मजाः इति आत्मनः जाताः।'
  vyakhya_en: |
    A wish laid on two conditions — यदि … यदि, "if the Lord is pleased with me, if
    my austerity has borne fruit." Its main clause is an **optative in the plural**:
    आप्नुयुः "may they obtain," the लिङ् of आप् (3.3.161). What they are to obtain is
    सलिलम्, "the water" — the release of the sons of Sagara, whose ashes still wait.
    Two forms carry the "from/through me": मत्तः, the ablative of the pronoun (मद् +
    तसिल्, 5.3.7), and the plain genitive मे. आत्मजाः "the self-born" is the compound
    Sanskrit uses for "children."
