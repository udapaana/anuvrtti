    ref: "Rāmāyaṇa 1.41.17 — Bhagīratha's boon"
    curated: "the whole verse, word-separated (pausa forms); every form is Vālmīki's. From Ambuda's GRETIL edition (ambuda-org/gretil, sa_rAmAyaNa, R_1.041.017). Brahmā, pleased, has told him to choose a boon; this is his answer — for his forefathers, the sons of Sagara, burnt to ash long before."
  sentence: यदि मे भगवान् प्रीतः यदि अस्ति तपसः फलम्। सगरस्य आत्मजाः सर्वे मत्तः सलिलम् आप्नुयुः॥
  translation: If the Lord is pleased with me, if there is any fruit of my austerity — then may all the sons of Sagara obtain the water (of release) through me.
  teaches: |
    a wish framed as a condition — यदि … यदि "if … if," answered by an optative
    in the plural, आप्नुयुः "may they obtain"; with the ablative pronoun मत्तः
    "from me" and the compound आत्मजाः "the self-born, sons."
