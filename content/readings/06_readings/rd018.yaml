  vyakhya: जरितारः कर्तारः, त्वां कर्म, उक्थेभिः इति करणम्। सुतसोमाः अहर्विदः च तेषां विशेषणे।
  vyakhya_en: |
    Hymn 1 ended with "we come"; here the worshippers are NAMED — जरितारः, "the singers," the agents (कर्तृ, an ऋ-stem nominative plural like कर्तारः). They praise (जरन्ते, 3rd-person plural) you (त्वाम्, accusative) with hymns (उक्थेभिः) — the तृतीया of means, the same "with/by" you met in नरैः and धिया. Two epithets describe them: सुतसोमाः ("Soma-pressed," a बहुव्रीहि) and अहर्विदः ("day-knowers"). All grammar you hold.

