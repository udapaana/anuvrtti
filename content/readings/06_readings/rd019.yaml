  vyakhya: तव धेना दाशुषे जिगाति। दाशुषे सोमपीतये च चतुर्थ्यौ — सम्प्रदाने तादर्थ्ये च।
  vyakhya_en: |
    A feminine subject leads: धेना ("stream," an आ-stem feminine like विद्या), with two feminine adjectives agreeing — प्रपृञ्चती ("nourishing") and उरूची ("broad"). It is तव ("yours," genitive) and it जिगाति ("goes") दाशुषे ("to the worshipper," dative). The last word shows a second flavour of the dative: सोमपीतये — *for the purpose of* Soma-drinking. One case (चतुर्थी), two senses: "to whom" (दाशुषे) and "for what" (सोमपीतये).

