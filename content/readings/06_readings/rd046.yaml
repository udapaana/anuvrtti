  sentence: मित्रलाभः सुहृद्भेदो विग्रहः सन्धिर् एव च। पञ्चतन्त्रात् तथान्यस्माद् ग्रन्थाद् आकृष्य लिख्यते॥
  translation: "Winning friends, splitting friends, war, and peace — [these four]; drawn from the Pañcatantra and from another work besides, it is written."
  teaches: |
    the book naming its own four parts. लाभः and भेदः are घञ् action-nouns;
    पञ्चतन्त्रात् / ग्रन्थात् are the ablative source (पञ्चमी), and लिख्यते is passive.
