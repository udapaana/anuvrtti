  vyakhya: अश्विना — सम्बोधने द्विवचनम्; यज्वरीः इषः — द्वितीयाबहुवचनं कर्मणि; द्रवत्पाणी शुभस्पती पुरुभुजा — सम्बोधनद्विवचनविशेषणानि; चनस्यतम् — लोटि मध्यमपुरुषद्विवचनम्।
  vyakhya_en: |
    A new hymn, a new dual pair: the अश्विन्s, the twin horsemen, addressed throughout in the dual vocative — अश्विना, द्रवत्पाणी ("swift-handed"), शुभस्पती ("lords of bliss"), पुरुभुजा ("of many bounties"). They are asked to चनस्यतम् — "take pleasure, you two" — a DUAL imperative (लोट्), the same dual-of-command you met as आ गतम् in rd020. What they enjoy is यज्वरीः इषः, "the worshipper's offerings," an accusative PLURAL object (कर्मन्). The dual you drilled across RV 1.2 now carries to a fresh pair.
