  sentence: गवाम् शतसहस्रेण दीयताम् शबला मम। रत्नम् हि भगवन् एतत् रत्नहारी च पार्थिवः॥
  translation: For a hundred thousand cows, let Śabalā be given to me; for this is a jewel, O lord — and a king is a taker of jewels.
  teaches: |
    the king's demand, put politely in the passive imperative — दीयताम् "let (her)
    be given" — with the price in the instrumental (शतसहस्रेण "for a hundred
    thousand"), the irregular गवाम् "of cows," and the agent-noun रत्नहारी.
