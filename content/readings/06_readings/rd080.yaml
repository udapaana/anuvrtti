  vyakhya: 'याचनम् — कर्मणि लोटि विनयेन। दीयताम् इति दाञः कर्मणि लोटि प्रथमपुरुषैकवचनम् (सार्वधातुके यक्)। गवाम् शतसहस्रेण इति मूल्ये तृतीया, गवाम् इति गोशब्दस्य षष्ठीबहुवचनम्। रत्नहारी इति उपपदे णिनिः। "राजा रत्नानि हरति" इति न्यायेन शबलाम् याचते।'
  vyakhya_en: |
    The demand, and the courtly way to make one: the **passive imperative**.
    दीयताम् "let (her) be given" (दा in the passive, यक्, plus a लोट् ending) is
    softer than देहि "give!" — the king asks without quite commanding. The price
    rides in the instrumental — गवाम् शतसहस्रेण, "for a hundred thousand cows"
    (गवाम्, the irregular genitive of गो). And the justification is a maxim in
    apposition: रत्नम् एतत्, रत्नहारी च पार्थिवः — "this is a jewel, and a king is a
    jewel-taker" (रत्नहारी, the उपपद agent-noun). The refusal comes next.
