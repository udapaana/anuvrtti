  vyakhya: 'आख्यानपदम् — लुङ्प्रवेशः। अभूत् इति भ्वस्तेः लुङि प्रथमपुरुषैकवचनम् (लुङ्); भूधातोः सिचो लुक् (गातिस्थाघुपाभूभ्यः…) इति अभूत्, न तु *अभावीत्। या … तस्य … यस्याः इति यत्तद्सम्बन्धः। द्विज इति सम्बोधनम्। प्रीतिमान् तस्याम् इति प्रीत्यर्थे विषयसप्तमी।'
  vyakhya_en: |
    Real narrative now, and the tense that carries it: **अभूत्** "he was," the
    लुङ् (aorist) of भू — the unmarked past a story leans on. Its shape is worth a
    look: भू would take सिच् like other roots, but 2.4.77 drops that सिच् after भू
    (गातिस्थाघु-पा-भू…), so the form is अभूत्, not *अभावीत्. The sentence is held
    together by the relative-correlative — या … तस्य … यस्याः, "she who … his …
    she whose" — and द्विज "O brahmin" is the storyteller (Maitreya) turning to
    the one he is telling it to. प्रीतिमान् तस्याम् shows the idiom "fond OF"
    taking the locative.
