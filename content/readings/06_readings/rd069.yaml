  sentence: सुनीतिः नाम या राज्ञः तस्य आसीत् महिषी द्विज। सः न अति प्रीतिमान् तस्याम् अभूत् यस्याः ध्रुवः सुतः॥
  translation: She who was named Sunīti was that king's queen, O brahmin; he was not very fond of her — she whose son was Dhruva.
  teaches: |
    a line of story, and with it the aorist — अभूत् "he was," the लुङ् past of भू;
    the relative-correlative frame या … तस्य … यस्याः; and the vocative द्विज "O
    brahmin," the narrator turning to his listener.
