  vyakhya: 'विध्यर्थलिङ्प्रधानः श्लोकः। ब्रूयात् इति ब्रुवः विधिलिङि प्रथमपुरुषैकवचनम् (चतुर्वारम्)। अप्रियम् अनृतम् इति नञ्समासौ — व्यञ्जने अ, अचि अन् (अनृतम्)। एष धर्मः सनातनः इति समापने।'
  vyakhya_en: |
    The verse is built on a single form repeated four times: **ब्रूयात्** "one
    should speak," the optative (लिङ्) of ब्रू in its precept sense (3.3.161).
    This is the mood of moral instruction — "one ought." Two नञ्-compounds carry
    the balance of the thought: अप्रियम् "unkind" (नञ् as अ- before a consonant)
    and अनृतम् "untruth" (नञ् as **अन्-** before the vowel of ऋत). The four ब्रूयात्
    clauses set truth and kindness against each other and against their negatives.
