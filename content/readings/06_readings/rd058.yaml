  sentence: सत्यम् ब्रूयात् प्रियम् ब्रूयात् न ब्रूयात् सत्यम् अप्रियम्। प्रियम् च न अनृतम् ब्रूयात् एष धर्मः सनातनः॥
  translation: One should speak the truth, one should speak what is kind; one should not speak an unkind truth. And one should not speak a pleasant falsehood — this is the eternal law.
  teaches: |
