  vyakhya: 'निश्चयवाक्यम् — लृटि प्रतिज्ञा। समास्थास्ये इति सम्-आ-तिष्ठतेः लृटि आत्मनेपदम्। समवेक्ष्य इति सोपसर्गात् ल्यप्। प्रसन्नेन्द्रियमानसः इति बहुव्रीहिः। तपः … यत् ब्रह्मत्वकारकम् इति यत्तद्भावे विशेषणम्। ब्रह्मत्व इति ब्रह्मन्शब्दात् त्वप्रत्ययः, कारकम् इति कृञः कर्तरि।'
  vyakhya_en: |
    The vow, in the **future**: समास्थास्ये "I will undertake," the आत्मनेपद लृट्
    of सम्-आ-स्था. A prefixed gerund sets the frame — समवेक्ष्य "having weighed
    (all this)" (ल्यप्) — and a बहुव्रीहि marks the change in the speaker:
    प्रसन्नेन्द्रियमानसः, "his senses and mind now calm." The relative यत् points
    back to तपः and closes on ब्रह्मत्वकारकम् — the austerity "that makes
    brahman-hood," a compound joining the abstract ब्रह्मत्व (ब्रह्मन् + त्व) to the
    agent कारक.
