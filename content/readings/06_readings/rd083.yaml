  sentence: तत् एतत् समवेक्ष्य अहम् प्रसन्नेन्द्रियमानसः। तपः महत् समास्थास्ये यत् वै ब्रह्मत्वकारकम्॥
  translation: Considering all this, with senses and mind grown calm, I will undertake a great austerity — the one that makes brahman-hood.
  teaches: |
    the resolve, in the future — समास्थास्ये "I will undertake" (आत्मनेपद लृट्);
    a prefixed gerund समवेक्ष्य "having considered"; a बहुव्रीहि of composure
    (प्रसन्नेन्द्रियमानसः); and a यत् relative closing on ब्रह्मत्वकारकम्.
