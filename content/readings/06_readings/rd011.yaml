  sentence: अग्ने॒ यं य॒ज्ञम॑ध्व॒रं वि॒श्वतः॑ परि॒भूरसि॑। स इद्दे॒वेषु॑ गच्छति॥
  translation: O Agni, the sacrifice, the rite which you encompass on every side — that alone goes to the gods.
  teaches: 'a Vedic relative-correlative यं … सः, the vocative अग्ने "O Agni," and असि "you are"'
