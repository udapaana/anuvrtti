  sentence: उद्यमेन हि सिध्यन्ति कार्याणि न मनोरथैः। न हि सुप्तस्य सिंहस्य प्रविशन्ति मुखे मृगाः॥
  translation: By effort deeds succeed, not by wishes. For deer do not walk into the mouth of a sleeping lion.
  teaches: |
    a famous Hitopadeśa maxim. कार्याणि is the ण्यत् gerundive ("things to be
    done"); सुप्तस्य is a क्त participle qualifying सिंहस्य; success comes उद्यमेन
    (तृतीया, by means).
