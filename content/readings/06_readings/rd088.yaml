  vyakhya: 'भगीरथकथायाः फलम्। तारिताः याताः इति निष्ठे कर्मणि, पुत्रसहस्राणि इति कर्तरि। देववत् इति तुल्यक्रियायाम् वतिः (तेन तुल्यं क्रिया चेद्वतिः)। षष्टिः पुत्रसहस्राणि इति संख्यासंख्येयभावः। नरशार्दूल इति रामसम्बोधनम्; महात्मनः इति सगरविशेषणम्।'
  vyakhya_en: |
    The end the whole tale was for: the sons of Sagara, ash for an age, are
    **delivered**. Two क्त participles carry it, both read as passives — तारिताः
    "(they were) ferried across" (the water did it) and याताः "(they are) gone (to
    heaven)." देववत् "like gods" is the वति adverb once more (5.1.115). And the
    number stands plainly in apposition — षष्टिः पुत्रसहस्राणि, "sixty thousand
    sons" — the count Bhagīratha's austerity, and one river, undid.
