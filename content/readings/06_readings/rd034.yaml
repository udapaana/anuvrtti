    ref: "RV 1.3.9 (whole ṛc; saṃhitā + padapāṭha) — closes the Viśvedevas triplet"
    curated: "complete verse, taken whole; ninth ṛc of RV 1.3, last to the All-Gods. Accent verbatim from sri-aurobindo.co.in"
  sentence: विश्वे॑ दे॒वासो॑ अ॒स्रिध॒ एहि॑मायासो अ॒द्रुहः॑। मेधं॑ जुषंत॒ वह्न॑यः॥
  translation: The All-Gods, unfailing, of ever-approaching power, free of malice — may they, the bearers (of sacrifice), enjoy the offering.
  teaches: 'the verse turns from address to statement: the gods now stand in the nominative, and जुषन्त "may they enjoy" closes the hymn on a wish'
