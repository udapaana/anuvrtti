- id: rd003
  kind: attested
  segment: 230
  source:
    text: हितोपदेश
    ref: "Hit_0.6 (pāda c)"
    curated: "third quarter; taken whole"
  sentence: पात्रत्वाद् धनम् आप्नोति।
  translation: From worthiness one obtains wealth.
  teaches: 'third link of the same chain — the अपादान→कर्मन् pattern is now a rhythm'
  words:
  - form: पात्रत्वाद्
    lemma: पात्रत्व
    gloss: from worthiness
    notes:
    - term: अपादान
      en: source
    - cite: '1.4.24'
      role: ध्रुवमपायेऽपादानम् — the source (worthiness) is अपादान
    - term: पञ्चमी
      en: ablative
    - cite: '2.3.28'
      role: अपादाने पञ्चमी → पात्रत्वात् (→ पात्रत्वाद् before the voiced ध, जश्त्व)
  - form: धनम्
    lemma: धन
    gloss: wealth
    vocab: true
    notes:
    - term: कर्मन्
      en: object
    - term: द्वितीया
      en: accusative
    - cite: '2.3.2'
      role: कर्मणि द्वितीया → धनम्
  - form: आप्नोति
    lemma: आप्
    gloss: obtains
    vocab: true
    notes:
    - term: आप्
      en: '"obtain, reach"'
    - term: लट्
      en: present
  vyakhya: पात्रत्वाद् इति अपादानम्, धनम् इति कर्म — स एव विधिः।
  vyakhya_en: |
    The same shape a third time: from worthiness (पात्रत्वाद्, पञ्चमी) one obtains wealth (धनम्, द्वितीया). Once you see the अपादान→कर्मन् rhythm — "from X, attain Y" — the verse reads itself. पात्रत्वात् → पात्रत्वाद् again by जश्त्व before ध.
