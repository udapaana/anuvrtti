  vyakhya: सुन्वतः निष्कृतम् उप आ यातम् — गत्यर्थे द्वितीया। नरा इति द्विवचनसम्बोधनम्।
  vyakhya_en: |
    The pair is called again — यातम्, "come, you two" — but now with a goal: उप … निष्कृतम्, "up to the prepared offering," where the goal of motion takes the accusative (द्वितीया, just as a destination does). सुन्वतः ("of the presser") is a genitive: whose offering it is. धिया ("by thought") is the instrumental of means you already hold. And the address नरा is नरौ — the DUAL of नर, the very first noun you ever declined, now standing in the vocative dual.

