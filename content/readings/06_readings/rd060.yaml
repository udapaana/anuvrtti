  sentence: अयम् निजः परः वा इति गणना लघुचेतसाम्। उदारचरितानाम् तु वसुधैव कुटुम्बकम्॥
  translation: "'This one is my own, that one a stranger' — such reckoning belongs to the small-minded. For the noble-hearted, the whole earth is but one family."
  teaches: |
    the बहुव्रीहि, the possessive compound that points outside itself:
    लघुचेतसाम् "of those whose mind is small," उदारचरितानाम् "of those whose
    conduct is noble" — neither word names mind or conduct as its subject.
