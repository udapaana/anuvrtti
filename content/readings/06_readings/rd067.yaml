  vyakhya: 'कर्मणि-तरप्-सतिसप्तमीनां संगमः। छाद्यन्ते इति यकि लट् कर्मणि; गुणवत्तर इति तरप् (गुणवत् + तरप्)। गुणिनाम् इति इनिः। भानौ उदिते सति इति भावलक्षणसप्तमी — "सति" इति अस्तेः शतृ, यतः "सति सप्तमी" इति नाम। दृष्टान्तेन अर्थः स्फुटः।'
  vyakhya_en: |
    A verse that gathers three familiar things into one image. The **passive**:
    गुणाः छाद्यन्ते "the merits are eclipsed," agent गुणवत्तरपात्रेण "by a greater
    vessel" in the instrumental. The **comparative**: गुणवत्-तर "more meritorious"
    (तरप्). And the **locative absolute** in its fullest, textbook form — भानौ
    उदिते सति, where सति is literally the participle of अस् "being," the very word
    that gives the construction its nickname **सति सप्तमी**. The lamp outshines
    nothing once the sun is up: so the good, beside the greater.
