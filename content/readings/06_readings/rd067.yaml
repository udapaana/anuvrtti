  sentence: गुणवत्तरपात्रेण छाद्यन्ते गुणिनाम् गुणाः। रात्रौ दीपशिखाकान्तिः न भानौ उदिते सति॥
  translation: By a vessel of greater merit the merits of the meritorious are eclipsed — the lamp-flame's brightness shines at night, not once the sun has risen.
  teaches: |
    three things you have met, working together: the passive छाद्यन्ते "are
    covered," with its agent in the instrumental; the comparative गुणवत्तर
    "greater in merit"; and a locative absolute made explicit — भानौ उदिते सति,
    "the sun being risen."
