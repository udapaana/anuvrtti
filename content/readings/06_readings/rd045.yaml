    gloss: youth
    vocab: true
    notes:
    - term: कर्तृ
      en: one of the four subjects
    - term: प्रथमा
      en: nominative (neuter)
  - form: धनसम्पत्तिः
    lemma: धनसम्पत्ति
    gloss: abundance of wealth
    vocab: true
    notes:
