    - term: तत्पुरुष
      en: determinative — धनस्य सम्पत्तिः, "attainment of wealth"; सम्पत्ति is the head
    - text: 'सम्पत्ति = सम् + पद् + क्तिन् — the feminine action-noun "attainment"'
    - cite: '3.3.94'
      role: स्त्रियां क्तिन् — क्तिन् forms a feminine action-noun → सम् + पद् + क्तिन् → सम्पत्ति
    - term: कर्तृ
      en: one of the four subjects
    - term: प्रथमा
      en: nominative (feminine)
