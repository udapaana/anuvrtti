    - cite: '5.1.119'
      role: तस्य भावस्त्वतलौ — त्व for "the state of" → प्रभु + त्व → प्रभुत्वम्
    - term: कर्तृ
      en: one of the four subjects
    - term: प्रथमा
      en: nominative (neuter)
