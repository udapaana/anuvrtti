    ref: "Hit_0.11 — यौवनं धनसम्पत्तिः (each alone is ruin)"
    curated: "the whole verse; text from Ambuda's GRETIL edition (ambuda-org/gretil, sa_nArAyaNa-hitopadeza, ||Hit_0.11||)"
  sentence: यौवनं धनसम्पत्तिः प्रभुत्वम् अविवेकिता। एकैकम् अप्य् अनर्थाय किम् उ यत्र चतुष्टयम्॥
  translation: Youth, abundance of wealth, power, and want of judgment — each one alone leads to ruin; how much more where the four are together.
  teaches: |
    four nouns, then the twist. धनसम्पत्तिः carries the क्तिन् action-noun सम्पत्ति;
    प्रभुत्वम् and अविवेकिता are the त्व/तल् abstracts — "power," "indiscretion."
