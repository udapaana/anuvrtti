    curated: "the whole verse, word-separated (pausa forms; compounds kept whole); every form is Vālmīki's. From Ambuda's GRETIL edition (ambuda-org/gretil, sa_rAmAyaNa, R_1.042.003). Brahmā has warned that the earth cannot bear Gaṅgā's fall, and that Śiva alone can hold her; Śiva now consents."
  sentence: प्रीतः ते अहम् नरश्रेष्ठ करिष्यामि तव प्रियम्। शिरसा धारयिष्यामि शैलराजसुताम् अहम्॥
  translation: I am pleased with you, O best of men; I will do what you wish. On my head I will bear the daughter of the mountain-king.
