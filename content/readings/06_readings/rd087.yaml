  vyakhya: 'शिवस्य प्रतिज्ञा — लृटि द्विः। करिष्यामि धारयिष्यामि इति कृ-धृधात्वोः लृटि उत्तमपुरुषैकवचने। शिरसा इति करणे। शैलराजसुताम् इति षष्ठीतत्पुरुषः (गङ्गा हिमवत्सुता)। प्रीतः ते इति प्रीत्यर्थे षष्ठी। अहम् इति द्विरुक्तम् आत्मनिश्चयार्थम्।'
  vyakhya_en: |
    A god's promise, and it stands on the **future** — stated twice, करिष्यामि "I
    will do (your wish)" and धारयिष्यामि "I will bear (her)." The means is in the
    instrumental — शिरसा, "with my head" — and Gaṅgā is named not by name but by a
    compound: शैलराजसुताम्, "the mountain-king's daughter." The doubled अहम् "I,
    I myself" underscores that only he can do it. Unfold the compound and Brahmā's
    warning is answered: the fall the earth could not take, this head will.
