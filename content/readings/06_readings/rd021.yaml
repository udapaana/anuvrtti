  vyakhya: वायुः इन्द्रश्च — द्वौ; चेतथः यातम् इति द्विवचने तिङन्ते। सर्वं द्विवचनम्।
  vyakhya_en: |
    The dual you just met now drives the VERB. वायो and इन्द्रः, joined by च, are two — so चेतथः ("you two perceive") is a dual finite verb, तौ ("you two") is the dual pronoun, यातम् ("come, you two") the dual imperative, and वाजिनीवसू a dual vocative epithet. Everything addressed to the pair is dual. They take note सुतानाम् — "of the pressed Somas," a partitive genitive (षष्ठी). The whole verse is a drill in द्विवचन.

