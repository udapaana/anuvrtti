  sentence: वाय॒विंद्र॑श्च चेतथः सु॒तानां॑ वाजिनीवसू। तावा या॑त॒मुप॑ द्र॒वत्॥
  translation: O Vāyu and Indra, you two take note of the pressed (Somas), O rich in plenty — come, you both, swiftly.
  teaches: 'the dual through the whole verse: चेतथः "you two perceive," the epithet वाजिनीवसू, and तौ'
