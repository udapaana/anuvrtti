  vyakhya: 'गुणगणश्लोकः — पदपरिचयाय। दश प्रथमान्तानि नामानि, दशकम् धर्मलक्षणम् इति समापनम्। अस्तेयम् अक्रोधः इति नञ्समासौ (नञ्)। इन्द्रियनिग्रहः धर्मलक्षणम् इति षष्ठीतत्पुरुषौ। दशकम् इति समाहारे कन्।'
  vyakhya_en: |
    A verse to grow vocabulary on: ten virtues, ten nominatives in a plain list,
    and one predicate closing it — दशकम् धर्मलक्षणम्, "(this) set of ten is the
    mark of dharma." Two of the ten are नञ्-compounds (negations): अस्तेयम्
    "non-stealing," अक्रोधः "non-anger" (2.2.6). Two more are षष्ठी-तत्पुरुष
    compounds: इन्द्रियनिग्रहः "restraint of the senses," धर्मलक्षणम् "the mark of
    dharma." And दशकम् is a collective — दशन् + कन्, "a group of ten" — the tidy
    Sanskrit way to say "these ten."
