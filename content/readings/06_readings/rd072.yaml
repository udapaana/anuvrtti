  sentence: सपत्नी तनयम् दृष्ट्वा तम् अङ्कारोहणोत्सुकम्। स्वपुत्रम् च तथारूढम् सुरुचिः वाक्यम् अब्रवीत्॥
  translation: The co-wife, seeing that boy eager to climb the lap, and her own son already mounted upon it — Suruci spoke these words.
  teaches: |
    two क्त participles doing the describing — अङ्कारोहणोत्सुकम् (eager to climb)
    and तथारूढम् (so mounted) — the gerund दृष्ट्वा setting the scene, and the
    irregular past अब्रवीत् "she said" from ब्रू.
