  vyakhya: 'आख्यानस्य चतुर्थपदम् — वक्तुम् उपक्रमः। सपत्नी सुरुचिः इति अभिन्ने कर्तरि। तम् अङ्कारोहणोत्सुकम्, स्वपुत्रम् तथारूढम् इति द्वे दृश्यमाने — विशेषणसमासौ। अब्रवीत् इति ब्रुवः लङि ईडागमे। वाक्यम् अब्रवीत् इति वक्ष्यमाणस्य उपोद्घातः।'
  vyakhya_en: |
    The camera turns to Suruci, and the verse loads two things she sees, each
    wrapped in a participle: तम् अङ्कारोहणोत्सुकम् "him, eager to climb the lap,"
    and स्वपुत्रम् तथारूढम् "her own son, already mounted so." The contrast is the
    whole point, and Sanskrit draws it with a matched pair of accusative
    descriptions. दृष्ट्वा "having seen" holds the moment; then अब्रवीत् "she said"
    — the irregular लङ् of ब्रू, with its ईट् augment — opens the cruel speech the
    next verses will carry.
