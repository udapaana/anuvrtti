  sentence: विद्या शस्त्रम् च शास्त्रम् च द्वे विद्ये प्रतिपत्तये। आद्या हास्याय वृद्धत्वे द्वितीया आद्रियते सदा॥
  translation: Knowledge is of two kinds — weapon-craft and the śāstra — two knowledges for mastery. The first is for ridicule in old age; the second is honored always.
  teaches: |
    two derived nouns of purpose. प्रतिपत्तये is the क्तिन् action-noun "for
    mastery"; हास्याय is the ण्यत् gerundive "for (being) laughed at."
