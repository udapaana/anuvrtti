  vyakhya: 'माता उपदिशति — आज्ञायाम् लोट्, दृष्टान्ते यथा। सुशीलः धर्मात्मा इति बहुव्रीही; भव इति भवतेः लोटि। प्राणिहिते रतः इति सप्तम्यन्तयोगे निष्ठा। निम्नम् यथा आपः प्रवणाः … पात्रम् … संपदः इति उपमानोपमेयभावः — "यथा जलम् निम्नगामि तथा पात्रगामिन्यः संपदः"।'
  vyakhya_en: |
    Sunīti stops consoling and counsels, and the mood shifts to the **imperative**:
    सुशीलः भव "be of good character," भव the लोट् of भू, gathering a little garland
    of बहुव्रीहि virtues — धर्मात्मा "dharma-souled," मैत्रः "friendly," रतः
    "intent" (on प्राणिहिते, the welfare of all that breathes). Then the image that
    makes it memorable: निम्नम् यथा आपः प्रवणाः — "as waters, sloping, seek the low
    ground" — [तथा] पात्रम् आयान्ति संपदः, "so do fortunes come to a worthy vessel."
    The यथा carries an unspoken तथा — the comparison's second half left for the ear
    to supply.
