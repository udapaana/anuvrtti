  sentence: सुशीलः भव धर्मात्मा मैत्रः प्राणिहिते रतः। निम्नम् यथा आपः प्रवणाः पात्रम् आयान्ति संपदः॥
  translation: Be of good character, righteous of soul, friendly, devoted to the welfare of living things; as sloping waters come to a low place, so fortunes come to a worthy vessel.
  teaches: |
    the mother's counsel, in the imperative — सुशीलः भव "be of good character";
    a string of बहुव्रीहि virtues (धर्मात्मा "dharma-souled"); and a यथा simile
    with the water-stem आपः, "as waters seek the low, so fortune seeks the worthy."
