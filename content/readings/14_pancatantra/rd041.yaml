  sentence: तत्र एकः अब्रवीत् — देव, व्याकरणम् एव द्वादश वर्षाणि अध्येतव्यम्। ततः धर्मशास्त्राणि अर्थशास्त्राणि च। एवं व्यतीते काले बुद्धिः प्रबुध्यते इति।
  translation: One of them said — "Your Majesty, grammar alone must be studied for twelve years. After that, the treatises on dharma and on statecraft. When time has passed in this way, the intellect awakens."
  teaches: |
    the ministers' counsel. व्यतीते काले is a locative absolute — "when the
    time had passed", with no "when" in the Sanskrit.
