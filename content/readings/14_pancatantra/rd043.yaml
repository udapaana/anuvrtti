  sentence: सकलार्थशास्त्रसारं जगति समालोक्य विष्णुशर्मेदम्। तन्त्रैः पञ्चभिर् एतच् चकार सुमनोहरं शास्त्रम्॥
  translation: Having surveyed in the world the essence of all the treatises on statecraft, Viṣṇuśarman composed this charming work in five tantras.
  teaches: |
    the Pañcatantra's own opening — a long तत्पुरुष सार-compound as object of the
    ल्यप् gerund समालोक्य, and the perfect चकार "he composed."
