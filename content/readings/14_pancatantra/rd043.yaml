    gloss: the essence of all the treatises on statecraft
    vocab: true
    notes:
    - term: तत्पुरुष
      en: determinative — सारम्, the head, is qualified by the rest; सकलानाम् अर्थशास्त्राणाम् सारम्
    - text: 'विग्रह: सकलानाम् अर्थशास्त्राणाम् सारम् — "the essence of all the arthaśāstras"'
    - cite: '2.1.22'
      role: तत्पुरुषः — a compound whose last member carries the main sense is तत्पुरुष
    - term: कर्मन्
      en: object of समालोक्य
    - term: द्वितीया
