  sentence: राजानम् एव संश्रित्य विद्वान् याति पराम् गतिम्। विना मलयम् अन्यत्र चन्दनम् न प्ररोहति॥
  translation: Only by taking refuge with a king does the learned man reach the highest station — sandalwood grows nowhere but the Malaya hills.
  teaches: |
    the gerund of a prefixed root — संश्रित्य "having resorted to," which is
    ल्यप् (not क्त्वा) precisely because सम्- is prefixed; and the strong-stem
    accusative राजानम्.
