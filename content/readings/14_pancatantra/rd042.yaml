  sentence: अथ विष्णुशर्मा नाम ब्राह्मणः अवदत् — देव, एतान् राजपुत्रान् षण्मासाभ्यन्तरे नीतिशास्त्रज्ञान् करिष्यामि। यदि न करोमि तदा देवः मम नाम त्यजतु।
  translation: Then a brahmin named Viṣṇuśarman said — "Your Majesty, within six months I will make these princes knowers of the science of policy. If I do not, then let Your Majesty discard my name."
  teaches: |
    the promise the Pañcatantra hangs on. नीतिशास्त्रज्ञान् is the second
    accusative of "make X into Y"; त्यजतु stakes an oath.
