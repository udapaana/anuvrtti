  source:
    text: पञ्चतन्त्र
    ref: "Pañcatantra 1.5 — the world befriends the rich"
    curated: "the whole verse; text from Ambuda's GRETIL edition (ambuda-org/gretil, sa_viSNuzarman-paJcatantra, ||Panc_1.5||)"
  sentence: इह लोके हि धनिनाम् परोऽपि स्वजनायते। स्वजनोऽपि दरिद्राणाम् सर्वदा दुर्जनायते॥
  translation: In this world, even a stranger behaves as kin toward the rich; even one's own kin always behaves as an enemy toward the poor.
  teaches: |
    the denominative — a whole verb built from a noun: स्वजनायते "acts as one's
    own," दुर्जनायते "acts as a foe," the क्यङ् formation "behave like X."
