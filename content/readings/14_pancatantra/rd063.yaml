  sentence: यस्य आर्यः तस्य मित्राणि यस्य अर्थाः तस्य बान्धवाः। यस्य अर्थाः सः पुमान् लोके यस्य अर्थाः सः च पण्डितः॥
  translation: He who is noble has friends; he who has wealth has kinsmen; he who has wealth is a "man" in the world; he who has wealth passes even for learned.
  teaches: |
    the यस्य … तस्य genitive correlative — "he to whom X (belongs)… to him Y";
    the possessive genitive that stands in for "to have"; and the irregular
    nominative पुमान् "a man."
