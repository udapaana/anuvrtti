  vyakhya: 'यत्तद्सम्बन्धप्रधानः श्लोकः। यस्य … तस्य इति षष्ठ्या सम्बन्धे ("यस्य अर्थाः सन्ति सः") — भवत्यर्थे षष्ठी। पुमान् इति पुंसः असुङि प्रथमैकवचनम् (पुंसोऽसुङ्)। मित्राणि इति नपुंसके नुम्। लोकोक्तिः अर्थमाहात्म्ये।'
  vyakhya_en: |
    A cynical proverb, and a clean lesson in the **possessive genitive**. Sanskrit
    has no verb "to have"; it says instead "of whom X (is), to him Y" — यस्य अर्थाः
    तस्य बान्धवाः, "whose the riches, his the kinsmen." The यस्य … तस्य / सः
    correlative pins each clause. Note पुमान्, the irregular nominative of पुंस्
    "man" (7.1.89, with the असुङ् augment), and मित्राणि with its neuter नुम्. The
    verse's sting is in the repetition: change one word — आर्यः to अर्थाः — and
    friendship becomes finance.
