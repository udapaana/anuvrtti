# ════════════════════════════════════════════════════════════════════════
#  14_pancatantra — पञ्चतन्त्रम् — attested tales (the ATTESTED track)
#
#  Viṣṇuśarman's Pañcatantra, read verbatim — kind: attested.
#  Text: ed. Ramchandra Jha, 6th ed., Varanasi: Chowkhamba Vidyabhavan, 1991
#  (Vidyabhavan Sanskrit Grantha Mala 17), also consulting M. R. Kāle
#  (Motilal Banarsidass) — via GRETIL's plain-text transformation
#  (sa_viSNuzarman-paJcatantra), transliterated IAST → Devanāgarī. Kept
#  VERBATIM; de-sandhi'd only as far as the reader needs to tokenize (यो → यः,
#  कीलोत्पाटीव → कीलोत्पाटी इव), exactly the Kaṭha convention.
#
#  Unlike the Vedic block, this is CLASSICAL Sanskrit — vidyut-prakriya's own
#  target — so every form is verifiable, and notable forms carry a confirmed
#  cite. A READ-THROUGH: most words enter as scenery (gloss + a bare identity
#  term, no cite); the compounds and the narrative perfect get the full
#  apparatus. The embedded सुभाषित verses are the natural first units; the
#  frame prose follows, sentence by sentence.
#
#  Reference: Pañcatantra <book>.<verse> for verses (panc_1.21 = book 1, v.21).
#  ids are pt<...> — pt0121 = the verse at 1.21; ptk1<NN> = the kīlotpāṭin
#  (wedge-pulling monkey) tale, sentence NN.
# ════════════════════════════════════════════════════════════════════════
