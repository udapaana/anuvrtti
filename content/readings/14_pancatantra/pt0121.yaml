- id: pt0121
  kind: attested
  segment: 360
  source:
    text: पञ्चतन्त्रम्
    ref: "Pañcatantra 1.21 (panc_1.21) — the moral of the kīlotpāṭin tale"
    curated: "the verse verbatim, de-sandhi'd only for tokenization (यो → यः, कीलोत्पाटीव → कीलोत्पाटी इव). Jha/Chowkhamba ed. via GRETIL, IAST → Devanāgarī."
  sentence: अव्यापारेषु व्यापारम् यः नरः कर्तुम् इच्छति। सः एव निधनम् याति कीलोत्पाटी इव वानरः॥
  translation: 'The man who wishes to do a task in things that are not his business — he alone goes to his destruction, like the wedge-pulling monkey.'
  teaches: |
    the frame's maxim against meddling — a यः … सः relative sentence with an
    infinitive (कर्तुम् इच्छति "wishes to do") and an इव simile closing on an
    agent compound, कीलोत्पाटी "the wedge-puller."
