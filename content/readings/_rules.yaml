# ════════════════════════════════════════════════════════════════════════
#  _rules.yaml — the TARGET SET: which sūtras this reader intends to teach,
#  and at what depth.
#
#  Why this file exists. "Coverage" is meaningless without a denominator.
#  The Aṣṭādhyāyī has 3,983 sūtras; a learner's reader needs a few hundred.
#  Counting progress against 3,983 (or against open-ended syllabus ranges)
#  can't distinguish progress from drift. This file names the target.
#
#  The load-bearing / leaf split. These are taught differently and must be
#  MEASURED differently:
#
#    load_bearing — structural rules the reader meets constantly (case
#      assignment, common lakāras, productive kṛt affixes, core sandhi).
#      A rule is learned by RECURRENCE, not by demonstration. Target:
#      >= `encounters_target` appearances across decreasing gloss density.
#      Most recurrence is FREE — it accrues because real sentences need
#      these rules, not because readings were authored to drill them.
#
#    leaf — the long tail (अन्तरेण-governance, one-off kṛt affixes, visarga
#      micro-outcomes). Met once, cited well, looked up later. ONE encounter
#      is the CORRECT outcome, not a deficit. The reference commentary
#      (all 3,983 sūtras, three tiers) carries these; the reader need not.
#
#  This distinction is the point of the file. Before it, 100 of 184 cited
#  sūtras appeared exactly once and that read as a 54% failure. Most of
#  those are leaves doing exactly what they should.
#
#  Membership is DECLARED, not derived. Deriving load-bearing status from
#  observed frequency is circular: it would only ever find rules already
#  well covered, and would miss precisely the under-taught core we want
#  surfaced (चतुर्थी, पञ्चमी, आत्मनेपद, the full लट् table). A rule can be
#  load-bearing and barely taught — that gap is the ledger's main product.
#
#  Not exhaustive, and not meant to be. Add rules as chapters firm up;
#  the same "FIRM at the top, DISCOVERED toward the leaves" rule that
#  governs _syllabus.yaml applies here.
#
#  Consumed by scripts/readings-ledger.ts. Anything cited by a reading but
#  absent here is reported as `unclassified` — a prompt to triage, not an
#  error.
# ════════════════════════════════════════════════════════════════════════

# Default number of distinct readings a load-bearing rule must appear in
# before it counts as taught. Override per-rule with `encounters_target`.
defaults:
  # Raised 5 → 8. The original 5 was set while the ledger counted only explicit
  # `cite`s, so it stood in for "a few real meetings" while measuring a fraction
  # of them. Once term-tagged consolidation counted (+302 encounters across 14
  # rules), 5 became trivial — any rule appearing in ordinary sentences clears
  # it, so it no longer discriminated.
  #
  # 8 is "met across a spread of contexts", not just an introduction plus a
  # couple of reuses. Deliberately NOT set near the ubiquity ceiling: 2.3.2 and
  # 3.2.123 sit above 100 because every sentence needs them, and a target near
  # that would punish rules that are load-bearing but less omnipresent — the
  # समास classes, the कृत् affixes.
  encounters_target: 8

# ── term → rule ─────────────────────────────────────────────────────────
# Consolidation passages tag words with a bare `term` and NO `cite`: that is
# the whole point of them — a word carrying full derivation apparatus is an
# introduction, not consolidation, and the reader's recall-first display keys
# focality off the presence of a cite.
#
# But a word tagged अधिकरण/सप्तमी IS an encounter with 2.3.36, and a ledger
# that counts only cites scores it as nothing. Six passages were written before
# this was noticed; they moved `taught` by zero while adding 140 term-tagged
# consolidation words.
#
# This maps the grammatical vocabulary back onto the rules it instantiates, so
# recurrence can be counted where it actually happens. Only unambiguous terms
# belong here — a term that could mean two different rules must NOT be listed,
# because a wrong encounter is worse than a missing one.
term_implies:
  कर्मन्: "2.3.2"       # object → accusative
  द्वितीया: "2.3.2"
  # ROLE names and CASE names are different facts and belong to different
  # sūtras. 1.4.x defines the कारक role (what part the noun plays); 2.3.x
  # assigns the विभक्ति that expresses it. They were both mapped to the 2.3
  # rule at first, so सम्प्रदान — which appears in 28 readings — counted
  # toward 2.3.13 and left 1.4.32 reading 2/8. The two co-occur on 119 words
  # and are annotated separately, so they can be counted separately.
  करण: "1.4.42"         # the instrument role
  तृतीया: "2.3.18"      # …and the case that expresses it
  सम्प्रदान: "1.4.32"    # the recipient role
  चतुर्थी: "2.3.13"
  अपादान: "1.4.24"      # the source role
  पञ्चमी: "2.3.28"
  अधिकरण: "1.4.45"      # the locus role
  सप्तमी: "2.3.36"
  षष्ठी: "2.3.50"       # the residual case
  सम्बोधन: "2.3.47"     # vocative
  द्विवचन: "1.4.22"     # dual
  बहुवचन: "1.4.21"      # plural
  लट्: "3.2.123"        # present
  लङ्: "3.2.111"        # imperfect
  लिट्: "3.2.115"       # perfect
  लृट्: "3.3.13"        # future
  लोट्: "3.3.162"       # imperative
  आत्मनेपद: "1.4.100"
  परस्मैपद: "1.4.99"
  सर्वनामस्थान: "7.1.70" # the strong-case set
  निष्ठा: "3.2.102"     # past participle
  तृच्: "3.1.133"       # agent-noun
  ल्युट्: "3.3.115"     # action-noun
  शप्: "3.1.68"         # the present-stem विकरण
  गुण: "7.3.84"         # root-vowel strengthening before a sārvadhātuka
  यक्: "3.1.67"         # the passive विकरण
  शतृ: "3.2.124"        # present participle
  क्त्वा: "3.4.21"      # gerund
  तुमुन्: "3.3.10"      # infinitive
  विधिलिङ्: "3.3.161"   # optative
# NOT mapped, deliberately: प्रथमा (2.3.46 vs 2.3.47 vocative — ambiguous),
# कर्तृ (a role saṃjñā spanning 1.4.54 and the passive-agent rules), सन्धि
# (names no single rule), अव्यय, विशेषण (not rule-bearing at all).
#
# ── known gap: the present stem is untagged ───────────────────────────────
# 118 readings contain a present-tense verb; 174 words carry a लट् tag. Only
# THREE readings mention शप् (3.1.68) or गुण (7.3.84) — the two rules that
# actually build those stems. गच्छति, वदति, पश्यति all have them and none says
# so, because the corpus tags the ENDING and never the stem-formation.
#
# So 3.1.68 and 7.3.84 read as barely-taught while being present on nearly
# every page. Not fixable from here: mapping लट् → 3.1.68 would be WRONG, as
# not every present verb takes शप् (श्रु takes श्नु → शृण्वन्ति, ज्ञा takes
# श्ना → जानाति), and a wrong encounter is worse than a missing one.
#
# The fix is authoring: tag शप् on the verbs that take it. ~102 readings have
# an unannotated लट् verb across 82 roots. Blocked on a data problem — `lemma`
# on those words is sometimes the inflected form (गच्छति, यच्छति, पश्यति)
# rather than the root, so गण membership cannot be derived mechanically.

load_bearing:

  # ── कारक: the role saṃjñās ──────────────────────────────────────────
