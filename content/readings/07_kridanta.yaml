  sentence: नरः ग्रामं गन्तुम् इच्छति।
  translation: The man wishes to go to the village.
  teaches: 'तुमुन् — the infinitive ("to do"), for a purposed action'
  words:
  - form: नरः
    lemma: नर
    gloss: the man
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: ग्रामं
    gloss: to the village
    notes:
    - cite: "8.3.23"
      role: मोऽनुस्वारः — word-final म् becomes anusvāra before a consonant → ग्रामं
    - term: कर्मन्
      en: goal of गन्तुम्
    - term: द्वितीया
      en: accusative
  - form: गन्तुम्
    lemma: गम्
    gloss: to go
    notes:
    - term: कृदन्त
      en: the infinitive
    - term: तुमुन्
      en: the तुमुन् affix — "to ___", an indeclinable verbal goal
    - cite: '3.3.10'
      role: तुमुन्ण्वुलौ क्रियायां क्रियार्थायाम् → तुमुन् for the purposed action → गम् + तुम् → गन्तुम्
    - term: अव्यय
      en: indeclinable (it does not decline)
  - form: इच्छति
    lemma: इष्
    gloss: wishes
    notes:
    - term: इष्
      en: '"wish" (इष् → इच्छ in the present)'
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  vyakhya: क्रियार्थायां क्रियायां तुमुन् — गन्तुम्। अव्ययम्, इच्छाद्यपेक्षम्।
  vyakhya_en: |
    The infinitive is तुमुन् (3.3.10): "to go" = गन्तुम्, "to do" = कर्तुम्, "to see" = द्रष्टुम्. It names the action one *aims at* — so it pairs with verbs of wishing, being able, beginning: गन्तुम् इच्छति "wishes to go," गन्तुं शक्नोति "can go." Unlike क्त and शतृ, तुमुन् is indeclinable (an अव्यय) — it never changes form.

- id: ex078
  segment: 180
  sentence: नरः ग्रामं गत्वा ओदनं खादति।
  translation: Having gone to the village, the man eats rice.
  teaches: 'क्त्वा — the gerund, naming the earlier of two acts by one agent'
  words:
  - form: नरः
    lemma: नर
    gloss: the man
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: ग्रामं
    gloss: to the village
    notes:
    - cite: "8.3.23"
      role: मोऽनुस्वारः — word-final म् becomes anusvāra before a consonant → ग्रामं
    - term: कर्मन्
      en: goal of गत्वा
    - term: द्वितीया
      en: accusative
  - form: गत्वा
    lemma: गम्
    gloss: having gone
    notes:
    - term: कृदन्त
      en: the gerund / absolutive
    - term: क्त्वा
      en: the क्त्वा affix — the prior action, same agent
    - cite: '3.4.21'
      role: समानकर्तृकयोः पूर्वकाले → क्त्वा after the verb of the EARLIER act, one shared agent → गत्वा
    - cite: '1.1.40'
      role: क्त्वातोसुन्कसुनः → a क्त्वा-form is an अव्यय (indeclinable)
    - term: अव्यय
      en: indeclinable
  - form: ओदनं
    gloss: rice
    notes:
    - cite: "8.3.23"
      role: मोऽनुस्वारः — word-final म् becomes anusvāra before a consonant → ओदनं
    - term: कर्मन्
      en: object of खादति
    - term: द्वितीया
      en: accusative
  - form: खादति
    lemma: खाद्
    gloss: eats
    notes:
    - term: खाद्
      en: '"eat"'
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  vyakhya: समानकर्तृकयोः पूर्वकाले क्त्वा — गत्वा खादति = गत्वा पश्चात् खादति। एकः कर्ता, द्वे क्रिये।
  vyakhya_en: |
    The gerund (क्त्वा, the "absolutive") chains two acts of ONE agent, marking the EARLIER (3.4.21): गत्वा … खादति = "having gone … (he) eats." First go, then eat — one man, two actions, the क्त्वा-form taking the first. It is indeclinable (1.1.40). When a prefix is present it becomes ल्यप् instead (आगत्य "having come"), but the meaning — "having ___, then ___" — is the same. This is how Sanskrit strings narrative: a row of gerunds ending in one finite verb.

- id: ex079
  segment: 190
  sentence: गमनं श्रेयः।
  translation: Going is better. / The going is preferable.
  teaches: 'ल्युट् — the action-noun ("the ___ing"), a कृत् abstract'
  words:
  - form: गमनं
    lemma: गम्
    gloss: the going, the act of going
    notes:
    - term: कृदन्त
      en: a verbal action-noun (भाव)
    - term: ल्युट्
      en: the ल्युट् affix (→ अन) — names the action
    - cite: '3.3.115'
      role: ल्युट् च → ल्युट् after a root for the action's name → गम् + अन → गमनम्
    - term: कर्तृ
      en: subject (an अ-stem neuter, like फल)
    - term: प्रथमा
      en: nominative
    - term: नपुंसक
      en: neuter
  - form: श्रेयः
    lemma: श्रेयस्
    gloss: better, preferable
    notes:
    - term: विशेषण
      en: predicate (an अस्-stem comparative, neuter)
    - term: प्रथमा
      en: nominative
  vyakhya: भावे ल्युट् — गमनम्। क्रियायाः नाम नपुंसकम्। घञापि भावः (यथा "यागः")।
  vyakhya_en: |
    Beyond participles, कृत् affixes also build action-NOUNS — "the going," "the doing." ल्युट् (→ अन, 3.3.115) gives गमनम् "going," दर्शनम् "seeing," a neuter अ-stem that declines like फल. The affix घञ् does the same with a different shape and grade (यज् → यागः "sacrifice," 3.3.18 भावे). So one root yields a whole family: गतः (gone), गच्छन् (going), गन्तुम् (to go), गत्वा (having gone), गमनम् (the going) — the कृदन्त system entire.

- id: ex161
  segment: 210
  sentence: यः जगतः अधीशः सः भूः।
  translation: He who is lord of the world — he is "Being" itself.
  teaches: 'क्विप् — the kṛt affix that vanishes entirely, leaving the bare root standing as a noun: भू → भूः'
  words:
  - form: भूः
    lemma: भू
    gloss: being, the existent one
    notes:
    - text: 'क्विप् = a कृत् affix that wholly disappears (its क्, व्, प् are all इत्), leaving भू + सुप्'
    - cite: '3.2.76'
      role: क्विप् च — the affix क्विप् (zero) forms a kṛt-noun from the root → भू
    - cite: '3.2.178'
      role: अन्येभ्योऽपि दृश्यते — क्विप् is seen widely, beyond its named bases
    - term: कृदन्त
      en: a kṛt noun with no visible suffix
    - term: प्रथमा
      en: nominative
  vyakhya: क्विबन्तः प्रत्ययलोपे धातुरेव नाम। भू + क्विप् = भू, सुपि भूः।
  vyakhya_en: |
    Most kṛt affixes add visible material (-त, -मान, -तुम्). क्विप् is the opposite: every one of its letters is an इत्-marker, so the WHOLE affix vanishes, and the bare root stands as a noun (3.2.76). भू "be" + क्विप् → भू, declined भूः "Being." This is how Sanskrit makes nouns like धी (thought, from ध्यै), स्तुत् (praiser), युज् (yoke-fellow) — roots used directly as words.
- id: ex162
  segment: 210
  sentence: यः धनं ददाति सः धनदः।
  translation: He who gives wealth is a "wealth-giver."
  teaches: 'क — the short kṛt: after an आ-ending root (with no preverb), क replaces the आ (दा → द)'
  words:
  - form: धनदः
    lemma: धनद
    gloss: wealth-giver
    notes:
    - text: 'धन (object) + दा + क; the क affix shortens दा → द → धन-द-ः'
    - cite: '3.2.3'
      role: आतोऽनुपसर्गे कः — after an आ-final root without a preverb, the affix is क → -द
    - cite: '3.2.1'
      role: कर्मण्यण्… — an object compounded with a kṛt; here क (not अण्) by 3.2.3
    - term: कृदन्त
      en: an upapada agent-noun in क
    - term: प्रथमा
      en: nominative
  - form: धनम्
    lemma: धन
    gloss: wealth (the thing given)
    notes:
    - term: कर्मन्
      en: object — incorporated into the compound
  - form: ददाति
    lemma: दा
    gloss: gives
    notes:
    - term: दा
      en: '"give"'
    - term: लट्
      en: present (the विग्रह verb)
  vyakhya: आदन्तात् अनुपसर्गात् कः; आकारलोपः। धन + दा + क = धनदः।
  vyakhya_en: |
    After a root ending in आ, with no preverb, the agent-suffix is the short क — and it cuts the आ to nothing (3.2.3, आतोऽनुपसर्गे कः). दा "give" → -द; धनं ददाति "gives wealth" condenses to धनदः "wealth-giver." The same क gives गोदः "cow-giver," जलदः "water-giver = cloud," पयोदः. Contrast कुम्भकारः (ex with अण्): the root's final sound decides which kṛt applies.
- id: ex163
  segment: 210
  sentence: सः भोजं भोजं गच्छति।
  translation: He goes along eating and eating (eating repeatedly).
  teaches: 'णमुल् — the absolutive of repeated or intense action, reduplicated for "again and again"'
  words:
  - form: भोजम्
    lemma: भुज्
    gloss: eating (repeatedly)
    notes:
    - text: 'भुज् + णमुल् → भोजम्; doubled (आभीक्ष्ण्य) to mean "again and again"'
    - cite: '3.4.22'
      role: आभीक्ष्ण्ये णमुल् च — for repeated action, the absolutive णमुल् (-अम्), often doubled
    - term: कृदन्त
      en: an indeclinable absolutive (अव्यय)
    - term: अव्यय
      en: indeclinable
  - form: गच्छति
    lemma: गम्
    gloss: goes
    notes:
    - term: गम्
      en: '"go"'
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  vyakhya: आभीक्ष्ण्ये णमुल्; द्विरुक्तिः। भुज् + णमुल् = भोजं भोजम् "पुनः पुनः भुक्त्वा"।
  vyakhya_en: |
    Beside क्त्वा "having Xed" (ex with गत्वा), णमुल् is a second absolutive — used for REPEATED or intense action and typically DOUBLED (3.4.22, आभीक्ष्ण्ये णमुल् च). भुज् "eat" → भोजं भोजम् "eating and eating, again and again." So स्मारं स्मारम् "remembering over and over," पायं पायम् "drinking repeatedly": an indeclinable that paints habitual or insistent action.
- id: ex164
  segment: 210
  kind: paradigm
  sentence: कर्ता, कर्तारम्, कर्त्रा, कर्त्रे, कर्तुः, कर्तरि।
  translation: 'The agent-noun कर्तृ "doer" declined: nom, acc, instr, dat, gen/abl, loc (singular).'
  teaches: 'कर्तृ through its cases — the तृच् agent-noun is an ऋ-stem, and takes the same strong and weak grades as पितृ'
  words:
  - form: कर्ता
    lemma: कर्तृ
    gloss: the doer (nominative)
    notes:
    - text: 'कृ + तृच् → कर्तृ "doer" (3.1.133); nom.sg कर्ता with vṛddhi, like पिता'
    - cite: '3.1.133'
      role: ण्वुल्तृचौ — the agent affixes ण्वुल् and तृच् → कर्तृ
    - term: प्रथमा
      en: nominative singular
  - form: कर्तारम्
    lemma: कर्तृ
    gloss: the doer (accusative)
    notes:
    - text: 'गुण-strengthened अर् in the strong cell → कर्तारम् (cf. पितरम्)'
    - cite: '7.3.110'
      role: ऋतो ङिसर्वनामस्थानयोः — ऋ → गुण अर् in the strong cells → कर्तार्
    - term: द्वितीया
      en: accusative singular
  - form: कर्त्रा
    lemma: कर्तृ
    gloss: by the doer (instrumental)
    notes:
    - text: 'weak cell: ऋ stays → कर्त्र् + आ → कर्त्रा'
    - term: करण
      en: instrumental
    - term: तृतीया
      en: instrumental singular (weak)
  - form: कर्त्रे
    lemma: कर्तृ
    gloss: to/for the doer (dative)
    notes:
    - term: सम्प्रदान
      en: dative
    - term: चतुर्थी
      en: dative singular
  - form: कर्तुः
    lemma: कर्तृ
    gloss: of/from the doer (gen/abl)
    notes:
    - term: सम्बन्ध
      en: genitive (= ablative form) singular
    - term: षष्ठी
      en: genitive singular
  - form: कर्तरि
    lemma: कर्तृ
    gloss: in the doer (locative)
    notes:
    - term: अधिकरण
      en: locative
    - term: सप्तमी
      en: locative singular
  vyakhya: तृजन्तम् ऋदन्तम्; पितृवत् नरबलदुर्बलभेदेन नमति। कर्ता — कर्तारम् — कर्त्रा …।
  vyakhya_en: |
    A तृच् agent-noun (कृ → कर्तृ "doer," 3.1.133) is not a fixed word — it DECLINES, exactly like the kinship ऋ-stem पितृ (ex043/044/141). Strong cells take गुण/vṛddhi (कर्ता nom, कर्तारम् acc), weak cells keep ऋ (कर्त्रा, कर्त्रे, कर्तुः, कर्तरि). So दातृ → दाता/दातारम्, नेतृ → नेता/नेतारम्: every agent-noun is an ऋ-stem paradigm. This closes the loop between कृदन्त (how the word is formed) and सुप् (how it then declines).
- id: ex165
  segment: 210
  sentence: यः सोमं सुनोति सः सोमसुत्।
  translation: He who presses the soma is a "soma-presser."
  teaches: 'क्विप् in an upapada compound — the root (here सु "press") stands as the second member, suffix elided'
  words:
  - form: सोमसुत्
    lemma: सोमसुत्
    gloss: soma-presser
    notes:
    - text: 'सोम (object) + सु + क्विप्; the affix vanishes, leaving सु → सुत् (with त्-augment in the cluster)'
    - cite: '3.2.61'
      role: सत्सूद्विषद्…उपसर्गेऽपि क्विप् — सू and the listed roots take क्विप् even in compounds → -सुत्
    - term: कृदन्त
      en: upapada क्विप्-compound (zero kṛt)
    - term: प्रथमा
      en: nominative
  - form: सोमम्
    lemma: सोम
    gloss: the soma (the thing pressed)
    notes:
    - term: कर्मन्
      en: object — incorporated into the compound
  - form: सुनोति
    lemma: सु
    gloss: presses (out)
    notes:
    - term: सु
      en: '"press, extract"'
    - term: लट्
      en: present (the विग्रह verb)
  vyakhya: क्विबन्तः उपपदे; प्रत्ययलोपात् धातुः अन्त्यपदम्। सोमं सुनोति = सोमसुत्।
  vyakhya_en: |
    क्विप् (the zero affix, ex161) is especially common in COMPOUNDS, where the root becomes the second member and the suffix vanishes (3.2.61). सोमं सुनोति "presses the soma" → सोमसुत् "soma-presser." The same gives अग्निचित् "fire-piler" (चि), धृतव्रत "vow-holder" type, ऋत्विज् "season-sacrificer" (यज्). Such root-final compounds fill the Vedic vocabulary — now you can parse them: object + bare root + क्विप्.
