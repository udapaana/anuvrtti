readings:

# ── Segment 8: vowel सन्धि — what happens when two vowels meet ───────────
# When a word ending in a vowel meets one beginning with a vowel, the two
# combine into one. Four basic outcomes, by which vowels meet.

- id: ex023
  segment: 80
  sentence: दधि इन्द्रः → दधीन्द्रः।
  translation: '"curds, Indra" → दधीन्द्रः (curds-Indra)'
  teaches: 'सवर्णदीर्घ — two like (सवर्ण) vowels merge into one long vowel'
  words:
  - form: दधीन्द्रः
    gloss: the merged form
    notes:
    - text: 'दधि + इन्द्रः: इ meets इ'
    - term: सवर्ण
      en: homogeneous — vowels of the same place of articulation
    - cite: '6.1.101'
      role: अकः सवर्णे दीर्घः — a simple vowel before a like vowel; the two become one long vowel
    - text: '→ ई → दधीन्द्रः'
  vyakhya: समाने सवर्णे अकः दीर्घ एकादेशः। इ + इ = ई।
  vyakhya_en: |
    When a simple vowel (अक्) meets a homogeneous vowel — इ with इ, उ with उ, अ with अ — the pair fuses into the single long vowel of that class. दधि + इन्द्रः gives दधीन्द्रः: two इ become one ई.
- id: ex024
  segment: 80
  sentence: न इह → नेह।
  translation: '"not here" → नेह'
  teaches: 'गुण — अ/आ before इ/उ/ऋ yields the गुण vowel (ए, ओ, अर्)'
  words:
  - form: नेह
    gloss: the merged form
    notes:
    - text: 'न + इह: अ meets इ'
    - term: गुण
      en: the grade ए/ओ/अर्
    - cite: '6.1.87'
      role: आद्गुणः — when अ/आ is followed by another vowel, the two become the single गुण vowel
    - text: 'अ + इ → ए → नेह'
  vyakhya: अवर्णात् अचि गुण एकादेशः। अ + इ = ए।
  vyakhya_en: |
    An अ or आ followed by इ, उ, or ऋ does not merge to a long vowel but shifts to the गुण grade: अ + इ → ए, अ + उ → ओ, अ + ऋ → अर्. So न + इह → नेह. The same अ behaves differently depending on the vowel it meets.
- id: ex025
  segment: 80
  sentence: तव एव → तवैव।
  translation: '"yours indeed" → तवैव'
  teaches: 'वृद्धि — अ/आ before ए/ऐ/ओ/औ yields the वृद्धि vowel (ऐ, औ)'
  words:
  - form: तवैव
    gloss: the merged form
    notes:
    - text: 'तव + एव: अ meets ए'
    - term: वृद्धि
      en: the grade ऐ/औ
    - cite: '6.1.88'
      role: वृद्धिरेचि — when अ/आ is followed by एच् (ए ऐ ओ औ), the two become the वृद्धि vowel
    - text: 'अ + ए → ऐ → तवैव'
  vyakhya: अवर्णात् एचि वृद्धिः एकादेशः। अ + ए = ऐ।
  vyakhya_en: |
    When अ or आ meets one of the diphthong-grade vowels (ए, ऐ, ओ, औ), the result climbs to the वृद्धि grade: अ + ए → ऐ, अ + ओ → औ. So तव + एव → तवैव. गुण and वृद्धि are the two upward grades of इ and उ.
- id: ex026
  segment: 80
  sentence: सुधी उपास्यः → सुध्युपास्यः।
  translation: '"the wise one is to be served" → सुध्युपास्यः'
  teaches: 'यण् — इ/उ/ऋ before an unlike vowel become the glide य्/व्/र्'
  words:
  - form: सुध्युपास्यः
    gloss: the merged form
    notes:
    - text: 'सुधी + उपास्यः: ई meets उ (unlike)'
    - term: यण्
      en: the glides य् व् र् ल्
    - cite: '6.1.77'
      role: इको यणचि — an इक् vowel (इ उ ऋ ऌ) before any vowel becomes its corresponding यण् glide
    - text: 'ई → य् → सुध्युपास्यः'
  vyakhya: इकः अचि यण् आदेशः। ई + उ → य् + उ = यु।
  vyakhya_en: |
    When इ, उ, or ऋ meets an unlike vowel, it does not merge but turns into its glide — य्, व्, र् — and the following vowel stands: सुधी + उपास्यः → सुध्युपास्यः. (Like meeting like gave the long vowel of ex023; unlike gives the glide here.)

# ── Segment 12: consonant सन्धि — what a word-final consonant becomes ────
# Vowel sandhi (seg 8) handled vowel-meets-vowel. These handle consonants
# at a word's end — the everyday changes a reader meets in running text.

- id: ex214
  segment: 128
  sentence: हरिः ऋषिषु वसति।
  translation: Hari dwells among the sages.
  teaches: 'one sentence, both sibilant outcomes — हरिः takes visarga, ऋषिषु takes ष्'
  words:
  - form: हरिः
    lemma: हरि
    gloss: Hari
    notes:
    - term: प्रथमा
      en: nominative — the ending स् stands at a pause before a vowel
    - cite: '8.3.15'
      role: खरवसानयोर्विसर्जनीयः — the स् of the ending → visarga → हरिः
  - form: ऋषिषु
    lemma: ऋषि
    gloss: among the sages
    notes:
    - term: सप्तमी
      en: locative
    - term: बहुवचन
      en: plural
    - cite: '8.3.59'
      role: आदेशप्रत्ययोः — the स् of सु → ष् after the इ → ऋषिषु
  - form: वसति
    lemma: वस्
    gloss: dwells
    notes:
    - term: लट्
      en: present
  vyakhya: एकस्मिन् वाक्ये द्वौ सकारौ द्वयोः गत्योः — हरिः इति विसर्जनीयः, ऋषिषु इति षत्वम्। उभयत्र इकारः पूर्वः, फलम् तु भिन्नम्।
  vyakhya_en: |
    Both words end their stem in इ and both have an ending in स्, and the two स् go different ways: हरिः becomes visarga, ऋषिषु becomes ष्. What separates them is where the स् stands — at the end of the word in हरिः, with nothing after it to give it a place, and inside the word in ऋषिषु, with a उ following. The इ before it is the same in both.
- id: ex212
  segment: 124
  sentence: पुनर् गच्छति → पुनः पुनः।
  translation: '"again and again" — पुनर् at the pause shows as पुनः'
  teaches: 'रु → visarga before a hard consonant and at the pause (खरवसानयोर्विसर्जनीयः)'
  words:
  - form: पुनः
    lemma: पुनर्
    gloss: 'again (← पुनर्)'
    notes:
    - term: अव्यय
      en: indeclinable
    - text: 'the word ends in र्; before a vowel or soft sound it stays पुनर् — पुनर् अपि'
    - cite: '8.3.15'
      role: खरवसानयोर्विसर्जनीयः — र् → visarga before a खर् consonant and at the pause
    - term: विसर्जनीय
      en: the visarga ः
  - form: पुनः
    lemma: पुनर्
    gloss: again
    notes:
    - term: अव्यय
      en: indeclinable
    - term: विसर्जनीय
      en: the visarga ः
    - text: 'the second one stands at the pause, and takes the visarga for that reason alone'
    - cite: '8.3.15'
      role: खरवसानयोर्विसर्जनीयः — अवसान, the pause, is the other trigger
  vyakhya: खरि अवसाने च रोः विसर्जनीयः। पुनर् → पुनः। स्वरे तु पुनर् अपि इति तिष्ठति।
  vyakhya_en: |
    One rule, two triggers. The र् of पुनर् becomes visarga both before a hard consonant (पुनः कः) and at a pause, where nothing follows at all — पुनः पुनः shows the second case twice over. Before a vowel the र् survives: पुनर् अपि. So the visarga is not part of the word; it is what the word's final र् turns into when the surroundings give it nothing voiced to lean on.
- id: ex213
  segment: 126
  sentence: अग्नि सु → अग्निषु।
  translation: '"in the fires" → अग्निषु'
  teaches: 'षत्व — the ending''s स् becomes ष् after an इ (आदेशप्रत्ययोः)'
  words:
  - form: अग्निषु
    lemma: अग्नि
    gloss: in the fires
    notes:
    - term: सप्तमी
      en: locative
    - term: बहुवचन
      en: plural
    - text: 'the ending is सु; its स् meets the इ of अग्नि'
    - cite: '8.3.59'
      role: आदेशप्रत्ययोः — a प्रत्यय's स् goes ष् after an इण् vowel → अग्निषु
    - term: षत्व
      en: retroflexion of स् to ष्
  vyakhya: प्रत्ययस्य सकारः इण्कुभ्याम् उत्तरः षकारः। अग्नि + सु = अग्निषु। न तु सर्वः सकारः — प्रत्ययस्य एव।
  vyakhya_en: |
    The locative plural ending सु carries a स्, and after the इ of अग्नि that स् retroflexes to ष् — अग्निषु. The rule is narrow in a way worth noticing: it applies to the स् of an ending, not to every स् in the language. A स् that belongs to the stem itself is untouched by it, which is why the same इ does nothing to the स् of a following separate word.
- id: ex034
  segment: 120
  sentence: वाक् अत्र → वाग् अत्र।
  translation: '"speech here" → वाग् अत्र'
  teaches: 'जश्त्व — a word-final hard stop softens to its voiced counterpart'
  words:
  - form: वाग्
    gloss: 'speech (← वाक्)'
    notes:
    - term: जश्
      en: the soft (voiced) stops ग् ज् ड् द् ब्
    - cite: '8.2.39'
      role: झलां जशोऽन्ते — a stop at word's end becomes its जश् (voiced) counterpart; क् → ग्
    - text: 'वाक् → वाग्'
  vyakhya: पदान्ते झलां जश्। क् → ग्, यथा वाक् → वाग्।
  vyakhya_en: |
    A hard stop standing at the end of a word softens to its voiced partner: क्→ग्, त्→द्, प्→ब्. So वाक् "speech" appears as वाग् before अत्र. The word's lemma is वाक्; its sentence-form follows the join.
- id: ex035
  segment: 120
  sentence: तत् च → तच्च।
  translation: '"and that" → तच्च'
  teaches: 'श्चुत्व — a dental meeting a palatal becomes palatal'
  words:
  - form: तच्च
    gloss: and that
    notes:
    - text: 'तत् + च: dental त् meets palatal च'
    - term: श्चु
      en: the palatal series श् च् छ् ज् झ् ञ्
    - cite: '8.4.40'
      role: स्तोः श्चुना श्चुः — a dental (त-class/स) next to a palatal (च-class/श) turns palatal; त् → च्
    - text: 'त् → च् → तच्च'
  vyakhya: स्तोः श्चुना श्चुत्वम्। त् + च → च् + च = च्च।
  vyakhya_en: |
    A dental sound touching a palatal is pulled into the palatal series: तत् + च → तच्च. The त् becomes च् to match the following च. Assimilation — the first sound takes on the place of the second.
- id: ex036
  segment: 120
  sentence: वनम् हसति → वनं हसति।
  translation: '"the forest laughs" → वनं हसति'
  teaches: 'a word-final म् becomes anusvāra (ं) before a consonant'
  words:
  - form: वनं
    gloss: 'the forest (← वनम्)'
    notes:
    - term: अनुस्वार
      en: the nasal ं
    - cite: '8.3.23'
      role: मोऽनुस्वारः — a word-final म् before a consonant becomes anusvāra; म् → ं
    - text: 'वनम् → वनं (before हसति)'
  vyakhya: पदान्ते मकारस्य हलि अनुस्वारः। वनम् → वनं हसति।
  vyakhya_en: |
    A म् at the end of a word, when a consonant follows, contracts to the anusvāra ं: वनम् हसति → वनं हसति. (Before a vowel, or at a true pause, the म् stays — so it is the following consonant that triggers the change.)

# ════════════════════════════════════════════════════════════════════════
#  REFERENCE-COMPLETION batch — sandhi.other (was a stub): the next consonant
#  sandhis beyond जश्त्व/श्चुत्व — णत्व (न → ण), ष्टुत्व (cerebralisation),
#  अनुस्वार → परसवर्ण (the homorganic nasal), and विसर्ग → स्. Arrow-कथा style.
# ════════════════════════════════════════════════════════════════════════

- id: ex070
  segment: 120
  sentence: रामेन → रामेण।
  translation: '"by Rāma": रामेन → रामेण (न becomes ण after र)'
  teaches: 'णत्व — न् becomes ण् after र्/ष् in the same word'
  words:
  - form: रामेण
    gloss: by Rāma (instrumental)
    notes:
    - text: 'राम + इन (instr.sg ending ट्→इन): the न् stands after the र् of राम'
    - term: णत्व
      en: cerebralisation of न् to ण्
    - cite: '8.4.2'
      role: अट्कुप्वाङ्नुम्व्यवायेऽपि — णत्व applies across the intervening vowel → ण्
    - cite: '8.4.2'
      role: अट्कुप्वाङ्नुम्व्यवायेऽपि → the change still applies across an intervening vowel/guttural/labial (here the ए) → रामेण
    - term: तृतीया
      en: instrumental
  vyakhya: रेफात् परः नकारः णकारः समानपदे, अट्-व्यवधानेऽपि। रामेन → रामेण।
  vyakhya_en: |
    Within one word, a न् turns cerebral (ण्) when an र् or ष् precedes it (8.4.1) — even when a vowel, guttural, or labial stands between them (8.4.2). So राम + the instrumental -इन gives रामेण, not *रामेन*: the र् of राम reaches across the ए to retroflex the न्. This णत्व is why we say रामायण, ब्राह्मणः, नारायण.

- id: ex071
  segment: 120
  sentence: रामस् षष्ठः → रामष्षष्ठः।
  translation: '"Rāma the sixth" → रामष्षष्ठः (स/त-series cerebralised by ष)'
  teaches: 'ष्टुत्व — स् and the dentals turn cerebral (ष्/ट-series) next to ष् or a cerebral'
  words:
  - form: रामष्षष्ठः
    gloss: Rāma the sixth (the joined form)
    notes:
    - text: 'रामस् + षष्ठः: a dental स् meets the cerebral ष्'
    - term: ष्टुत्व
      en: cerebralisation — स्/तवर्ग → ष्/टवर्ग in contact with ष् or a cerebral
    - cite: '8.4.41'
      role: ष्टुना ष्टुः → स् and the dentals next to ष्/टवर्ग become ष्/टवर्ग → रामष्षष्ठः
  vyakhya: षकारटवर्गसन्निधौ सकारतवर्गयोः ष्टुत्वम्। रामस् षष्ठः → रामष्षष्ठः।
  vyakhya_en: |
    Mirror of श्चुत्व (which palatalised before श्/च-series): ष्टुत्व *cerebralises*. A dental स् or त-series sound, meeting a cerebral ष् or ट-series sound, itself becomes cerebral (8.4.41). रामस् + षष्ठः → रामष्षष्ठः; तत् + टीका → तट्टीका. The articulation simply assimilates to its neighbour's place — the same logic as जश्त्व and श्चुत्व, one row over.

- id: ex072
  segment: 120
  sentence: सम् कृतम् → संस्कृतम् (सङ्… → the nasal homorganic).
  translation: '"well-made" सम्+कृत → the nasal matches the following stop'
  teaches: 'अनुस्वार → परसवर्ण — anusvāra becomes the nasal of the following class'
  words:
  - form: संस्कृतम्
    gloss: well-formed, "Sanskrit"
    notes:
    - text: 'सम् + कृत: final म् → anusvāra (8.3.23), then the anusvāra may take the class-nasal'
    - cite: '8.3.23'
      role: मोऽनुस्वारः → word-final म् before a consonant → anusvāra (संकृत)
    - term: परसवर्ण
      en: the nasal homogeneous with the following sound
    - cite: '8.4.58'
      role: अनुस्वारस्य ययि परसवर्णः → the anusvāra becomes the class-nasal of the following यय् consonant
  vyakhya: मकारः अनुस्वारः, सः ययि परसवर्णः। सम् + कृत → संकृत → सङ्… परसवर्णेन।
  vyakhya_en: |
    A final म् before a consonant first becomes anusvāra (8.3.23, the rule that gave वनं); then that anusvāra may take the *homorganic* nasal — the nasal belonging to the following sound's class (8.4.58). सम् + कृतम् → संस्कृतम्; सम् + गतः → सङ्गतः (the guttural ङ् before ग). The nasal quietly tunes itself to whatever stop follows.

- id: ex073
  segment: 120
  sentence: नमस् ते → नमस्ते।
  translation: '"homage to thee": the विसर्ग returns to स् before त'
  teaches: 'विसर्ग → स् — a visarga becomes स् before a hard dental (खर्)'
  words:
  - form: नमस्ते
    gloss: homage to you ("namaste")
    notes:
    - term: सन्धि
      en: a join — the two words are written as one
    - text: 'नमः + ते: the visarga of नमः meets the त् of ते'
    - cite: '8.3.34'
      role: विसर्जनीयस्य सः → a visarga → स् before a खर् consonant → नमस्ते
    - text: 'नमस् here is a गति/preverb-like form; 8.3.40 also fixes its स् → नमस्ते, नमस्कारः'
  vyakhya: विसर्गस्य सकारः खरि। नमः + ते → नमस्ते। पुनः सकारः प्रत्येति।
  vyakhya_en: |
    The visarga is not the end of the story — before a hard consonant (खर्) it can revert to स् (8.3.34): नमः + ते → नमस्ते, नमः + कारः → नमस्कारः. The final स् of नरः became visarga before pause (8.2.66 → 8.3.15); here the reverse environment pulls the visarga back to स्. Sandhi is contextual all the way down: the same sound shows different faces by what stands next.

- id: ex155
  segment: 80
  sentence: सः अपि गच्छति → सोऽपि गच्छति।
  translation: He too goes.
  teaches: 'visarga → ओ before a voiced sound (अतो रोः → उ, then गुण ओ); the अवग्रह (ऽ) marks the elided अ'
  words:
  - form: सोऽपि
    lemma: तद्
    gloss: he too (सः + अपि)
    notes:
    - term: सर्वनाम
      en: pronoun
    - text: 'विग्रह: सः + अपि; the अः before a voiced sound → ओ, and अ of अपि elides (ऽ)'
    - cite: '6.1.113'
      role: अतो रोरप्लुतादप्लुते — अः (from रु) becomes उ before a voiced sound → स उ
    - cite: '6.1.87'
      role: आद्गुणः — अ + उ → गुण ओ → सो; the following अ drops (पूर्वरूप), marked ऽ
    - term: सन्धि
      en: visarga sandhi (सः → सो before अ)
  - form: गच्छति
    lemma: गम्
    gloss: goes
    notes:
    - term: गम्
      en: '"go"'
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  vyakhya: अतो रोः उत्वम्, ततः गुणः। सः + अपि = सोऽपि। लोपे अवग्रहः।
  vyakhya_en: |
    The commonest visarga outcome: सः before a voiced sound. The अः (a visarga from रु, 8.2.66) becomes उ (6.1.113), then अ + उ fuse by गुण to ओ (6.1.87) → सो; the following short अ then drops, written with the अवग्रह ऽ. सः + अपि → सोऽपि "he too." This is why सः appears as सो only before voiced sounds — before a vowel other than अ, or a consonant, it shifts differently.
- id: ex156
  segment: 80
  sentence: नमः ते → नमस्ते।
  translation: Salutation to you.
  teaches: 'visarga → स् before a त्-class stop (विसर्जनीयस्य सः)'
  words:
  - form: नमस्ते
    lemma: नमस्
    gloss: salutation to you (नमः + ते)
    notes:
    - text: 'विग्रह: नमः + ते; the visarge before त् becomes स् (its homorganic sibilant)'
    - cite: '8.3.34'
      role: विसर्जनीयस्य सः — visarga → स् before a sibilant/dental-स् context → नमस्
    - term: सन्धि
      en: visarga → स् before त्
  - form: ते
    lemma: युष्मद्
    gloss: to you
    notes:
    - term: सर्वनाम
      en: pronoun
    - term: सम्प्रदान
      en: '"to you" — the enclitic ते'
    - term: चतुर्थी
      en: dative
  vyakhya: विसर्जनीयस्य सकारः सवर्णे। नमः + ते = नमस्ते।
  vyakhya_en: |
    Before a dental, the visarga assimilates to स् (8.3.34, विसर्जनीयस्य सः). नमः + ते → नमस्ते "salutations to you" — the visarga of नमः becomes स् before the त् of ते. The same gives दुस्तर (दुः + तर), निस्तेज (निः + तेज): visarga takes the sibilant of the place that follows.
- id: ex157
  segment: 80
  sentence: आ छादयति → आच्छादयति।
  translation: He covers over.
  teaches: 'छ-doubling (तुक्) — a short vowel before छ inserts त् → च्छ (छे च)'
  words:
  - form: आच्छादयति
    lemma: छद्
    gloss: covers over (आ + छादयति)
    notes:
    - text: 'विग्रह: आ + छादयति; before छ a त् (तुक्) is inserted → च्छ'
    - cite: '6.1.73'
      role: छे च — a short vowel (here the आ-preverb context) before छ takes the augment तुक् (त्) → च्छ
    - term: सन्धि
      en: छ-doubling (तुगागम)
    - term: लट्
      en: present
  vyakhya: छकारे परे तुक् (त्); त् + छ = च्छ। आ + छादयति = आच्छादयति।
  vyakhya_en: |
    छ never stands alone after a vowel: छे च (6.1.73) inserts the augment तुक् (त्), and त् + छ surfaces as च्छ. आ + छादयति → आच्छादयति "covers over." The same doubling gives तच्छ्रुत्वा (तत् + छ्रुत्वा... via श्), शिवच्छाया (शिव + छाया "Śiva's shade"): a vowel + छ always becomes -च्छ-.
- id: ex158
  segment: 80
  sentence: एतत् हि → एतद्धि।
  translation: For this (is so).
  teaches: 'before ह, a stop voices and doubles it — here त् + ह gives द्ध'
  words:
  - form: एतद्धि
    lemma: एतद्
    gloss: for this (एतत् + हि)
    notes:
    - term: सर्वनाम
      en: pronoun
    - text: 'विग्रह: एतत् + हि; final त् → द् (जश्त्व) before voiced ह, and ह → ध (झयो हः)'
    - cite: '8.2.39'
      role: झलां जशोऽन्ते — final त् voices to द् before a voiced sound
    - cite: '8.4.62'
      role: झयो होऽन्यतरस्याम् — ह after a झय् stop optionally becomes its voiced aspirate → ध
    - term: सन्धि
      en: जश्त्व + ह-assimilation → द्ध
  - form: हि
    lemma: हि
    gloss: for, indeed
    notes:
    - term: अव्यय
      en: '"for, indeed" (the ह that triggers the change)'
  vyakhya: अन्त्यस्य जश्त्वम् (त्→द्), झयः परस्य हस्य घोषवदादेशः (ह→ध)। एतत् + हि = एतद्धि।
  vyakhya_en: |
    Two changes meet at त् + ह. First जश्त्व: the final त् voices to द् before the voiced ह (8.2.39). Then the ह, now after a voiced stop, optionally becomes that stop's voiced aspirate — झयो होऽन्यतरस्याम् (8.4.62) — so ह → ध and the cluster surfaces as द्ध: एतत् + हि → एतद्धि. The same gives तद्धित (तत् + हित), वाग्घरि (वाक् + हरि): a stop + ह coalesces into a doubled voiced aspirate.
- id: ex159
  segment: 80
  sentence: पुनः रमते → पुनर्रमते (पुनरमते)।
  translation: He delights again.
  teaches: 'visarga → र् before a voiced sound — the other outcome, beside सोऽपि'
  words:
  - form: पुनर्
    lemma: पुनर्
    gloss: again (पुनः before a voiced sound)
    notes:
    - text: 'पुनः ends in रु; before a voiced sound the visarga surfaces as र् (not ओ)'
    - cite: '8.2.66'
      role: ससजुषो रुः — word-final स् → रु; its visarga becomes र् before a voiced sound
    - cite: '6.1.113'
      role: अतो रोः — applies to अ-final रु (सः→सो); पुनर् keeps र् because its base is पुनर्, not अतः
    - term: सन्धि
      en: visarga → र् (रुत्व)
  - form: रमते
    lemma: रम्
    gloss: delights, takes pleasure
    notes:
    - term: रम्
      en: '"delight, sport" (ātmanepada)'
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  vyakhya: रेफान्तस्य रुत्वम् घोषे। पुनः + रमते = पुनर् रमते। (अतो भिन्नत्वात् न ओत्वम्।)
  vyakhya_en: |
    Not every visarga becomes ओ. Words whose underlying final is -र् (पुनर्, अन्तर्, प्रातर्) show र् before a voiced sound, NOT the अ + उ → ओ fusion of ex155. पुनः + रमते → पुनर् रमते "delights again." Contrast सोऽपि (सः, base स-अः → सो) with पुनर् (base पुनर्): the visarga's outcome depends on what stands under it — an अ that fuses to ओ, or an र् that simply reappears.
- id: ex160
  segment: 80
  sentence: रामः च लक्ष्मणः च → रामश्च लक्ष्मणश्च।
  translation: Rāma and Lakṣmaṇa.
  teaches: 'visarga → श् before a च्-class stop (श्चुत्व applied to the visarga-sibilant)'
  words:
  - form: रामश्च
    lemma: राम
    gloss: and Rāma (रामः + च)
    notes:
    - text: 'विग्रह: रामः + च; visarga → स् (8.3.34), then स् → श् before च् (श्चुत्व)'
    - cite: '8.3.34'
      role: विसर्जनीयस्य सः — visarga → स् before the following stop
    - cite: '8.4.40'
      role: स्तोः श्चुना श्चुः — स्/त् before a च्-class sound become श्/च् → रामश्च
    - term: सन्धि
      en: visarga → श् before च
  - form: लक्ष्मणश्च
    lemma: लक्ष्मण
    gloss: and Lakṣmaṇa (लक्ष्मणः + च)
    notes:
    - text: 'same change: लक्ष्मणः + च → लक्ष्मणश्च'
    - cite: '8.4.40'
      role: स्तोः श्चुना श्चुः → श् before च
    - term: सन्धि
      en: visarga → श् before च
  vyakhya: विसर्जनीयस्य सः, ततः श्चुत्वम्। रामः + च = रामश्च। द्वयोः योगे चकारः।
  vyakhya_en: |
    The visarga before a च-class stop ends up as श्. First it becomes स् (8.3.34); then स् before च् is cerebralised — really palatalised — to श् by स्तोः श्चुना श्चुः (8.4.40). रामः च → रामश्च, लक्ष्मणः च → लक्ष्मणश्च, the standard "X and Y" linkage. The visarga's three sibilant outcomes — स् (before त्, ex156), श् (before च्, here), ष् (before ट्) — all follow the place of the stop that comes next.
