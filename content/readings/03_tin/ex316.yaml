- id: ex316
  kind: graded
  segment: 188
  order: 1
  sentence: 'गुरुः शिष्यान् आशास्ते — त्वम् विद्वान् भूयाः। युवाम् सुखिनौ भूयास्तम्। यूयम् धार्मिकाः भूयास्त। एतौ बालौ दीर्घायुषौ भूयास्ताम्। सर्वे जनाः सुखिनः भूयासुः। शिष्यः वदति — अहम् अपि गुरोः योग्यः भूयासम्। आवाम् भ्रातरौ सदा मित्रे भूयास्व। वयम् सत्यवादिनः भूयास्म।'
  translation: 'The teacher blesses the pupils: "May you be learned. May you two be happy. May you all be righteous. May these two boys be long-lived. May all people be happy." A pupil says: "May I too be worthy of my teacher. May we two brothers always be friends. May we be speakers of truth."'
  teaches: 'The precative (आशीर्लिङ्), the mood of blessing, in all the persons the corpus lacked — भूयाः, भूयास्तम्, भूयास्त, भूयास्ताम्, भूयासुः, भूयासम्, भूयास्व, भूयास्म — each with its predicate (विधेय).'
