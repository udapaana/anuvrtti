  sentence: 'ग्रामीणाः पथिकान् वदन्ति — यूयम् समुद्रम् ददृश इति वयम् शृणुमः।'
  translation: 'The villagers say to the travellers: "We hear that you have seen the ocean."'
  teaches: 'The perfect of report in the 2nd person plural — ददृश: the villagers did not see the travellers see it, they heard.'
