- id: ex042
  segment: 140
  sentence: सः ग्रामम् गच्छेत्।
  translation: He should go to the village. / He might go.
  teaches: 'विधिलिङ् — the optative, for what ought to be or might be'
  words:
  - form: सः
    lemma: तद्
    gloss: he
    notes:
    - term: सर्वनाम
      en: pronoun (तद्)
    - term: प्रथमा
      en: nominative
  - form: ग्रामम्
    lemma: ग्राम
    gloss: to the village
    notes:
    - term: कर्मन्
      en: goal of motion
    - term: द्वितीया
      en: accusative
  - form: गच्छेत्
    gloss: he should go
    notes:
    - term: गम्
      en: '"go"'
    - term: विधिलिङ्
      en: optative — ought, may, should
    - cite: '3.3.161'
      role: विधिनिमन्त्रण… लिङ् — for injunction, invitation, wish, request, the लिङ् is used
    - term: प्रथमपुरुष
      en: third person
    - term: एकवचन
      en: singular
  vyakhya: विधौ लिङ्। गच्छतु निश्चिता आज्ञा, गच्छेत् विधिः सम्भावना च।
  vyakhya_en: |
    The विधिलिङ् softens command into propriety and possibility: गच्छेत्, "he should go," or "he might go." Beside the blunt लोट् (गच्छतु, "go!"), the लिङ् carries ought, may, would — the mood of advice and supposition. Tense says when; mood says how the speaker stands toward the act.

