- id: ex313
  kind: graded
  segment: 186
  order: 2
  sentence: 'पिता वदति — श्वः वयम् नगरम् गन्तास्मः। अहम् प्रातः गन्तास्मि। त्वम् अपि गन्तासि वा? युवाम् मया सह गन्तास्थः। यूयम् सर्वे गन्तास्थ। मातरौ अपि गन्तारौ, बालाः च गन्तारः। आवाम् रथेन गन्तास्वः। नगरात् मित्रे वनम् गमिष्यतः। युवाम् नदीम् गमिष्यथः। यूयम् कुत्र गमिष्यथ? आवाम् मन्दिरम् गमिष्यावः।'
  translation: 'Father says: "Tomorrow we will go to the city. I will go in the morning. Will you go too? You two will go with me. All of you will go. The two mothers will go as well, and the children will go. We two will go by chariot." From the city the two friends will go to the forest. "You two will go to the river. Where will you all go?" "We two will go to the temple."'
  teaches: 'The periphrastic future (लुट्, a set future) in every person the corpus lacked — गन्तास्मः, गन्तास्मि, गन्तासि, गन्तास्थः, गन्तास्थ, गन्तारौ, गन्तारः, गन्तास्वः — and the simple future (लृट्) in the dual and second plural.'
