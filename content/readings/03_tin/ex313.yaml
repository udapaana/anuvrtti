  order: 2
  sentence: 'पिता पृच्छति — श्वः उत्सवः; यूयम् कुत्र गमिष्यथ? ततः सः वदति — वयम् सर्वे नगरम् गन्तास्मः। अहम् प्रातः आपणम् गन्तास्मि; पुत्र, त्वम् अपि मया सह गन्तासि वा? कन्ये, युवाम् जलाय नदीम् गन्तास्थः। मम पितरौ मन्दिरम् गन्तारौ, बालाः च ताभ्याम् सह गन्तारः। सायम् यूयम् सर्वे उत्सवम् गन्तास्थ; युष्माकम् माता अहम् च रथेन गन्तास्वः। कन्ये वदतः — आवाम् प्रातः नदीम् गमिष्यावः; आवयोः मित्रे अपि सह गमिष्यतः। पिता पृच्छति — युवाम् ततः मन्दिरम् अपि गमिष्यथः?'
  translation: 'Father asks: "Tomorrow is the festival; where will you all go?" Then he says: "We will all go to the city. I will go to the market in the morning; son, will you come with me? Daughters, you two will go to the river for water. My parents will go to the temple, and the children will go with them. In the evening all of you will go to the festival; your mother and I will go by chariot." The daughters say: "We two will go to the river in the morning; our two friends will come along too." Father asks: "Will you two go on to the temple after that?"'
  teaches: 'Errands for a festival day: the periphrastic future (लुट्, a set future) in every person — गन्तास्मः, गन्तास्मि, गन्तासि, गन्तास्थः, गन्तास्थ, गन्तारौ, गन्तारः, गन्तास्वः — and the simple future (लृट्) in the replies and questions: गमिष्यथ, गमिष्यावः, गमिष्यतः, गमिष्यथः.'
