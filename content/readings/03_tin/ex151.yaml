- id: ex151
  segment: 90
  sentence: देवदत्तेन सुप्यते।
  translation: It is slept by Devadatta. (Devadatta sleeps.)
  teaches: 'भावे प्रयोग — the impersonal passive of an intransitive verb: no subject, agent in the instrumental'
  words:
  - form: देवदत्तेन
    lemma: देवदत्त
    gloss: by Devadatta — the agent
    notes:
    - term: कर्तृ
      en: the agent, in the instrumental (no nominative exists)
    - cite: '2.3.18'
      role: कर्तृकरणयोस्तृतीया → कर्तृ in भाव/passive → देवदत्तेन
    - term: तृतीया
      en: instrumental
  - form: सुप्यते
    lemma: स्वप्
    gloss: it is slept (sleeping happens)
    notes:
    - term: यक्
      en: the passive विकरण — root + य, with आत्मनेपद endings
    - term: स्वप्
      en: '"sleep" — intransitive; here IMPERSONAL passive (भावे)'
    - cite: '3.4.69'
      role: …भावे चाकर्मकेभ्यः — for intransitive roots the ल-affix denotes भाव (the bare act)
    - cite: '1.3.13'
      role: भावकर्मणोः → आत्मनेपद → सुप्यते (3sg, no agreement with any noun)
    - term: भावे
      en: impersonal (action-only) voice
  vyakhya: अकर्मकात् भावे प्रयोगः। कर्तृ तृतीयायाम्, क्रिया एव प्रधाना। देवदत्तेन सुप्यते।
  vyakhya_en: |
    An intransitive verb has no object to promote, so its passive is IMPERSONAL — भावे प्रयोग, "the bare act" (3.4.69 …भावे चाकर्मकेभ्यः). There is no subject at all: the verb stands in a fixed 3rd-singular (सुप्यते), and the agent is instrumental (देवदत्तेन). Literally "it-is-slept by Devadatta" = "Devadatta sleeps." Sanskrit's way of foregrounding the action over the doer.
