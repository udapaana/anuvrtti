- id: ex152
  segment: 90
  sentence: सः अकार्षीत्।
  translation: He did (it). / He made (it).
  teaches: 'लुङ् — the aorist, the simple/unmarked past (no restriction to a time-frame)'
  words:
  - form: सः
    lemma: तद्
    gloss: he
    notes:
    - term: सर्वनाम
      en: pronoun
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: अकार्षीत्
    lemma: कृ
    gloss: did, made
    notes:
    - term: कृ
      en: '"do, make" — AORIST (लुङ्)'
    - cite: '3.2.110'
      role: लुङ् — past action without a time restriction → the aorist → अकार्षीत्
    - term: लुङ्
      en: aorist (augment अ + सिच् + endings)
  vyakhya: सामान्ये भूते लुङ्। अकार्षीत् — न अद्यतनानद्यतनविशेषः। कृ-धातोः सिजन्तम्।
  vyakhya_en: |
    The लुङ् aorist is the UNMARKED past: plain "did," with none of the today/before-today restrictions that लङ् (अकरोत्, imperfect) and लिट् (चकार, perfect) carry — 3.2.110 simply says लुङ् for past action. √कृ → अकार्षीत् "he did," with the augment अ and the सिच् marker. So √कृ now spans all four pasts-and-presents: करोति · अकरोत् · चकार · अकार्षीत्, plus the future करिष्यति. The full time-axis of one root.
