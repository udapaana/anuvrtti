- id: ex092
  segment: 40
  sentence: नरौ ग्रामम् गच्छतः।
  translation: The two men go to the village.
  teaches: 'number on the verb — two agents take the तस् ending → गच्छतः'
  words:
  - form: नरौ
    lemma: नर
    gloss: the two men
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
    - term: द्विवचन
      en: dual — two
    - cite: '1.4.22'
      role: द्व्येकयोर्द्विवचनैकवचने — for two, the द्विवचन
  - form: ग्रामम्
    lemma: ग्राम
    gloss: to the village
    notes:
    - term: कर्मन्
      en: goal of motion
    - term: द्वितीया
      en: accusative
  - form: गच्छतः
    lemma: गम्
    gloss: the two go
    notes:
    - term: गम्
      en: '"go"'
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
    - term: प्रथमपुरुष
      en: third person
    - cite: '1.4.101'
      role: तिङस्त्रीणि त्रीणि प्रथममध्यमोत्तमाः — each triad of तिङ् endings is प्रथम/मध्यम/उत्तम
    - cite: '1.4.102'
      role: तान्येकवचनद्विवचनबहुवचनान्येकशः — within a triad the three are एक/द्वि/बहुवचन
    - cite: '3.4.78'
      role: 'तिप्तस्झि… — the तस् ending (प्रथम·द्वि) → गच्छतः'
    - term: द्विवचन
      en: dual
  vyakhya: द्वयोः कर्त्रोः द्विवचनम्। प्रथमपुरुषस्य द्विवचनं तस् — गच्छतः। एको गच्छति, द्वौ गच्छतः।
  vyakhya_en: |
    Number lives on the verb too. नरौ are two, so the verb takes the द्विवचन ending: of the प्रथम triad तिप्-तस्-झि (1.4.101/102), the middle one तस् gives गच्छतः. Side by side: गच्छति (one goes), गच्छतः (two go) — same root, tense, person; only वचन shifts.
