      en: plural
  vyakhya: लटि परस्मैपदस्य नव तिङः — त्रयः पुरुषाः त्रीणि वचनानि च। भू + शप् + तिङ् = भवति इत्यादि।
  vyakhya_en: |
    You met the तिङ् frame one cell at a time (ex014–016, ex092). Here is the WHOLE present-tense paradigm of भू "be" in one place — the verbal counterpart to the देव declension table (ex094). Read across each row for a person (उत्तम / मध्यम / प्रथम), down each column for a number (sg · dual · pl). The nine endings come from one master sūtra, तिप्तस्झि… (3.4.78); the stem is भू + शप् (अ) → भव-. Learn these nine and every parasmaipada present (गच्छति, पठति, वदति) falls into place.
