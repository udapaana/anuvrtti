- id: ex154
  segment: 90
  kind: paradigm
  sentence: भवामि भवावः भवामः। भवसि भवथः भवथ। भवति भवतः भवन्ति।
  translation: 'Present tense of भू "be", all nine cells: I/we-two/we am/are; you/you-two/you-all are; he/those-two/they are.'
  teaches: 'the whole present-tense paradigm — three पुरुष across three वचन'
  words:
  - form: भवामि
    lemma: भू
    gloss: I am
    notes:
    - term: लट्
      en: present
    - term: उत्तमपुरुष
      en: 1st person singular
    - cite: '3.4.78'
      role: तिप्तस्झि… — the ending series; 1sg मिप् → भवामि
    - term: एकवचन
      en: singular
  - form: भवावः
    lemma: भू
    gloss: we two are
    notes:
    - term: लट्
      en: present
    - term: उत्तमपुरुष
      en: 1st person dual (वस्) → भवावः
    - term: द्विवचन
      en: dual
  - form: भवामः
    lemma: भू
    gloss: we (all) are
    notes:
    - term: लट्
      en: present
    - term: उत्तमपुरुष
      en: 1st person plural (मस्) → भवामः
    - term: बहुवचन
      en: plural
  - form: भवसि
    lemma: भू
    gloss: you are
    notes:
    - term: लट्
      en: present
    - term: मध्यमपुरुष
      en: 2nd person singular (सिप्) → भवसि
    - term: एकवचन
      en: singular
  - form: भवथः
    lemma: भू
    gloss: you two are
    notes:
    - term: लट्
      en: present
    - term: मध्यमपुरुष
      en: 2nd person dual (थस्) → भवथः
    - term: द्विवचन
      en: dual
  - form: भवथ
    lemma: भू
    gloss: you all are
    notes:
    - term: लट्
      en: present
    - term: मध्यमपुरुष
      en: 2nd person plural (थ) → भवथ
    - term: बहुवचन
