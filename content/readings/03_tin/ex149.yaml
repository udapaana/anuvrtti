- id: ex149
  segment: 90
  sentence: यदि सः अगमिष्यत् तर्हि सुखम् अलप्स्यत।
  translation: Had he gone, he would have obtained happiness.
  teaches: 'लृङ् — the conditional, for an act that never came about (क्रियातिपत्ति)'
  words:
  - form: यदि
    lemma: यदि
    gloss: if
    notes:
    - term: अव्यय
      en: '"if" — marks the counterfactual condition'
  - form: सः
    lemma: तद्
    gloss: he
    notes:
    - term: सर्वनाम
      en: pronoun
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: अगमिष्यत्
    lemma: गम्
    gloss: would have gone
    notes:
    - term: गम्
      en: '"go" — conditional (लृङ्)'
    - cite: '3.3.139'
      role: लिङ्निमित्ते लृङ् क्रियातिपत्तौ — when the act fails to happen, लृङ् → अगमिष्यत्
    - term: लृङ्
      en: conditional (augment अ + future-stem + लङ्-endings)
  - form: तर्हि
    lemma: तर्हि
    gloss: then
    notes:
    - term: अव्यय
      en: '"then" — heads the counterfactual result'
  - form: सुखम्
    lemma: सुख
    gloss: happiness
    notes:
    - term: कर्मन्
      en: object
    - cite: '2.3.2'
      role: कर्मणि द्वितीया → सुखम्
    - term: द्वितीया
      en: accusative
  - form: अलप्स्यत
    lemma: लभ्
    gloss: would have obtained
    notes:
    - term: लभ्
      en: '"obtain" — conditional (लृङ्, ātmanepada)'
    - cite: '3.3.139'
      role: लिङ्निमित्ते लृङ् क्रियातिपत्तौ → अलप्स्यत
    - term: लृङ्
      en: conditional
  vyakhya: क्रियायाः अनिष्पत्तौ लृङ्। यदि अगमिष्यत् — न तु अगच्छत्। फलमपि न लब्धम्।
  vyakhya_en: |
    The लृङ् conditional is for what would-have-been but was NOT — क्रियातिपत्ति, the act's non-occurrence (3.3.139). It looks like the future-stem (गमिष्य-, लप्स्य-) with the augment अ and the लङ् imperfect endings: अगमिष्यत्, अलप्स्यत. यदि सः अगमिष्यत् "had he gone" — implying he did not. This completes the ten लकारs: present, three pasts, two futures, three moods, and now the conditional.
