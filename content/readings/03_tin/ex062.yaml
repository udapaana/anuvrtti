- id: ex062
  segment: 90
  sentence: सः अद्य तत् अकार्षीत्।
  translation: He did that today.
  teaches: 'लुङ् — the aorist, the tense-neutral past (and today’s past)'
  words:
  - form: सः
    lemma: तद्
    gloss: he
    notes:
    - term: सर्वनाम
      en: pronoun (तद्)
    - term: प्रथमा
      en: nominative
  - form: अद्य
    gloss: today
    notes:
    - term: अव्यय
      en: indeclinable — "today"
  - form: तत्
    lemma: तद्
    gloss: that
    notes:
    - term: सर्वनाम
      en: pronoun (तद्, neuter)
    - term: द्वितीया
      en: accusative
  - form: अकार्षीत्
    gloss: did, has done
    notes:
    - term: कृ
      en: '"do, make"'
    - term: लुङ्
      en: aorist — the general past (and the past of today)
    - cite: 3.2.110
      role: लुङ् → the aorist for past sense → अकार्षीत्
    - cite: 3.1.44
      role: 'च्लेः सिच् — the aorist takes the सिच् (s-aorist) marker (derivation deferred)'
  vyakhya: भूते सामान्ये लुङ्। अद्यतनं भूतम् अपि लुङा — अकार्षीत्।
  vyakhya_en: |
    The aorist (लुङ्, 3.2.110) is the *unmarked* past — it states a past act without committing to remoteness, and it is the proper past for *today's* events (अद्य "today" → अकार्षीत् "he has done"). √कृ now spans all three pasts: अकरोत् (yesterday, लङ्) · चकार (long ago, लिट्) · अकार्षीत् (today, लुङ्). The full form-building (सिच्, वृद्धि) is a Track-B derivation.
