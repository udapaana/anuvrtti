- id: ex150
  segment: 90
  sentence: रामेण ग्रामः गम्यते।
  translation: The village is gone-to by Rāma. (Rāma goes to the village.)
  teaches: 'कर्मणि प्रयोग — the passive: the object becomes the nominative subject; agent → instrumental; यक् + आत्मनेपद'
  words:
  - form: रामेण
    lemma: राम
    gloss: by Rāma — the agent
    notes:
    - term: कर्तृ
      en: the agent, now in the instrumental (not nominative)
    - cite: '2.3.18'
      role: कर्तृकरणयोस्तृतीया → कर्तृ in the passive → रामेण
    - term: तृतीया
      en: instrumental
  - form: ग्रामः
    lemma: ग्राम
    gloss: the village — now the grammatical subject
    notes:
    - term: कर्मन्
      en: the logical object, raised to nominative subject in the passive
    - cite: '2.3.46'
      role: प्रातिपदिकार्थ…प्रथमा → the कर्म, when verb-denoted, takes प्रथमा → ग्रामः
    - term: प्रथमा
      en: nominative
  - form: गम्यते
    lemma: गम्
    gloss: is gone-to
    notes:
    - term: यक्
      en: the passive विकरण — root + य, with आत्मनेपद endings
    - term: गम्
      en: '"go" — PASSIVE'
    - cite: '3.1.67'
      role: सार्वधातुके यक् — the passive विकरण यक् (य) → गम्यते
    - cite: '3.4.69'
      role: लः कर्मणि च — the ल-affix denotes the कर्म (passive) → ātmanepada ending
    - cite: '1.3.13'
      role: भावकर्मणोः — passive/impersonal take आत्मनेपद → गम्यते
    - term: कर्मणि
      en: passive voice
  vyakhya: कर्मणि यक्, आत्मनेपदं च। रामः गच्छति → रामेण ग्रामः गम्यते।
  vyakhya_en: |
    The passive (कर्मणि प्रयोग) re-stages the same act: the OBJECT becomes the nominative subject (ग्रामः), the AGENT drops to the instrumental (रामेण), and the verb takes the passive marker यक् (य, 3.1.67) with ātmanepada endings (1.3.13) — गम्यते "is gone-to." Active रामः ग्रामं गच्छति = passive रामेण ग्रामः गम्यते. The ल-affix now points to the कर्म, not the कर्तृ (3.4.69).
