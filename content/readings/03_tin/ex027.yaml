- id: ex027
  segment: 90
  sentence: सः तत् चकार।
  translation: He did that (long ago / it is told).
  teaches: 'लिट् — the perfect, for remote or reported past; the root reduplicates'
  words:
  - form: सः
    lemma: तद्
    gloss: he
    notes:
    - term: सर्वनाम
      en: pronoun (तद्)
    - term: प्रथमा
      en: nominative
  - form: तत्
    lemma: तद्
    gloss: that
    notes:
    - term: सर्वनाम
      en: pronoun (तद्, neuter)
    - term: द्वितीया
      en: accusative
  - form: चकार
    lemma: कृ
    gloss: did, has done
    notes:
    - term: कृ
      en: '"do, make"'
    - term: लिट्
      en: perfect — the remote or reported past (परोक्ष)
    - cite: '3.2.115'
      role: परोक्षे लिट् — for a past beyond direct witness, लिट् replaces the लकार
    - term: प्रथमपुरुष
      en: third person
    - term: एकवचन
      en: singular
    - text: 'कृ reduplicates → च-कार → चकार'
  vyakhya: परोक्षे भूते लिट्। धातुः द्विरुक्तः — चकार।
  vyakhya_en: |
    For a past the speaker did not witness — the deep past of story and report — the लिट् is used, and the root doubles its first syllable: कृ → चकार, "he did" (out of sight, or long ago). Compare अकरोत् (लङ्, the past one saw): same act, different reach into time.
