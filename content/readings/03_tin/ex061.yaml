- id: ex061
  segment: 90
  sentence: सः पुरा तत् चकार।
  translation: He did that long ago.
  teaches: 'लिट् — the perfect, for a remote (परोक्ष) past beyond witness'
  words:
  - form: सः
    lemma: तद्
    gloss: he
    notes:
    - term: सर्वनाम
      en: pronoun (तद्)
    - term: प्रथमा
      en: nominative
  - form: पुरा
    gloss: long ago, formerly
    notes:
    - term: अव्यय
      en: indeclinable — "of old" (marks the परोक्ष, beyond-sight, past)
  - form: तत्
    lemma: तद्
    gloss: that
    notes:
    - term: सर्वनाम
      en: pronoun (तद्, neuter)
    - term: द्वितीया
      en: accusative
  - form: चकार
    lemma: कृ
    gloss: did (long ago)
    notes:
    - term: कृ
      en: '"do, make"'
    - term: लिट्
      en: perfect — remote past, not directly witnessed
    - cite: 3.2.115
      role: परोक्षे लिट् → the perfect for a past beyond the speaker's witness → चकार (reduplicated)
  vyakhya: परोक्षे भूते लिट्। अदृष्टं चिरातीतं — चकार। तदेव कृ-धातुः, द्विरुक्तम्।
  vyakhya_en: |
    The perfect (लिट्, 3.2.115) is the *remote* past — परोक्ष, "beyond the eye," what the speaker did not himself witness (history, legend, "long ago"). √कृ reduplicates to चकार "he did (of old)." Contrast ex060: अकरोत् (लङ्) is yesterday's deed, चकार (लिट्) is the ancient deed. The tense itself tells you how far back, and whether anyone saw it.
