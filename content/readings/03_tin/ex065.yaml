  - form: क्रियात्
    lemma: कृ
    gloss: may he do (benediction)
    notes:
    - term: कृ
      en: '"do, make"'
    - term: आशीर्लिङ्
      en: benedictive — the लिङ् used specifically for a blessing (आशीस्)
    - cite: 3.3.173
      role: आशिषि लिङ्लोटौ → for a blessing, लिङ् (or लोट्) is used
    - cite: 3.4.116
      role: लिङाशिषि → this लिङ् is the आशीर्लिङ् (distinct from the विधिलिङ्) → क्रियात्
  vyakhya: आशिषि लिङ् — आशीर्लिङ्। सः सुखी भूयात्, कार्यम् च क्रियात् — "भूयात्", "क्रियात्" इति आशीर्वादरूपाणि।
  vyakhya_en: |
    A blessing has its own mood. For an आशीस् (benediction, "may you…") the लिङ् is used (3.3.173), and this benedictive लिङ् is formally distinct from the optative (3.4.116) — क्रियात् "may he do," भूयात् "may (he) be / may it prosper." A blessing on a pupil: सः सुखी भूयात्, कार्यम् च क्रियात् "may he be happy, and may he do his work." So √कृ has two लिङ् forms: कुर्यात् "should do" (विधिलिङ्, the norm) vs क्रियात् "may he do" (आशीर्लिङ्, the blessing). The same mood-letter ल् branches by intent.

