  sentence: सः सुखी भूयात्, कार्यम् च क्रियात्।
  translation: 'May he be happy, and may he do his work.'
  teaches: 'आशीर्लिङ् — the benedictive, a distinct लिङ् for blessings: भूयात्, क्रियात्'
  words:
  - form: सः
    lemma: तद्
    gloss: he
    notes:
    - term: सर्वनाम
      en: pronoun (तद्)
    - term: पुंलिङ्ग
      en: masculine
    - term: कर्तृ
      en: the one blessed — subject of भूयात् and क्रियात्
    - term: प्रथमा
