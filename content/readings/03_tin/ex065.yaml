  - form: सुखी
    lemma: सुखिन्
    gloss: happy
    notes:
    - term: तद्धित
      en: possessive (इनि) — सुख "happiness" → सुखिन् "having happiness, happy"
    - term: इनि
      en: the इनि possessive suffix
    - term: मतुबर्थ
      en: the possessive sense — "one who has happiness"
    - term: विशेषण
      en: predicate with भूयात्
    - term: प्रथमा
      en: nominative — the इन्-stem drops its न् and lengthens, सुखिन् → सुखी
    rel:
