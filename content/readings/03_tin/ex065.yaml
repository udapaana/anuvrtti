  - form: भूयात्
    lemma: भू
    gloss: may he be
    notes:
    - term: आशीर्लिङ्
      en: benedictive of भू — the wish "may he be", not the optative भवेत्
  - form: कार्यम्
    lemma: कृ
    gloss: the work, what is to be done
    notes:
