- id: ex065
  segment: 140
  sentence: सः कुर्यात् इति आशीः। क्रियात् सः।
  translation: 'May he do (it) — the blessing form kriyāt.'
  teaches: 'आशीर्लिङ् — the benedictive, a distinct लिङ् for blessings'
  words:
  - form: सः
    gloss: he
    notes:
    - term: सर्वनाम
      en: pronoun (तद्)
    - term: प्रथमा
      en: nominative
  - form: कुर्यात्
    lemma: कृ
    gloss: should do
    notes:
    - term: विधिलिङ्
      en: optative — "should do" (cf. ex064); the लिङ् mood
  - form: इति
    lemma: इति
    gloss: thus ("…")
    notes:
    - term: अव्यय
      en: quotative — closes a name/quote
  - form: आशीः
    lemma: आशिस्
    gloss: a blessing
    notes:
    - term: आशीस्
      en: '"blessing" — the sense that selects आशीर्लिङ्'
    - term: प्रथमा
      en: nominative
  - form: क्रियात्
    gloss: may he do (benediction)
    notes:
    - term: कृ
      en: '"do, make"'
    - term: आशीर्लिङ्
      en: benedictive — the लिङ् used specifically for a blessing (आशीस्)
    - cite: 3.3.173
      role: आशिषि लिङ्लोटौ → for a blessing, लिङ् (or लोट्) is used
    - cite: 3.4.116
      role: लिङाशिषि → this लिङ् is the आशीर्लिङ् (distinct from the विधिलिङ्) → क्रियात्
  - form: सः
    lemma: तद्
    gloss: he
    notes:
    - term: सर्वनाम
      en: pronoun (तद्)
    - term: प्रथमा
      en: nominative
  vyakhya: आशिषि लिङ् — आशीर्लिङ्। "भूयात्", "क्रियात्" इति आशीर्वादरूपाणि।
  vyakhya_en: |
    A blessing has its own mood. For an आशीस् (benediction, "may you…") the लिङ् is used (3.3.173), and this benedictive लिङ् is formally distinct from the optative (3.4.116) — क्रियात् "may he do," भूयात् "may (he) be / may it prosper." So √कृ has two लिङ् forms: कुर्यात् "should do" (विधिलिङ्, the norm) vs क्रियात् "may he do" (आशीर्लिङ्, the blessing). The same mood-letter ल् branches by intent.

