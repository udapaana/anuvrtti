- id: ex315
  kind: graded
  segment: 187
  order: 2
  sentence: ह्यः ग्रामे उत्सवः आसीत्, किन्तु यज्ञदत्तः तस्य भ्राता च गृहे अतिष्ठताम्। देवदत्तः यज्ञदत्तम् वदति — यदि त्वम् उत्सवम् अगमिष्यः, नर्तकीः अद्रक्ष्यः। यज्ञदत्तः वदति — यदि अहम् अगमिष्यम्, अहम् अपि ताः अद्रक्ष्यम्। यदि आवाम् अगमिष्याव, गीतानि अश्रोष्याव। देवदत्तः वदति — यदि युवाम् अगमिष्यतम्, युवाम् अपि अनर्तिष्यतम्। माता पितरम् वदति — यदि बालौ अगमिष्यताम्, मोदकान् अखादिष्यताम्। यदि वयम् अगमिष्याम, वयम् अपि अनर्तिष्याम। पिता वदति — यदि यूयम् अगमिष्यत, यूयम् अनन्दिष्यत; किन्तु यदि सर्वे अगमिष्यन्, गृहम् कः अरक्षिष्यत्?
  translation: 'Yesterday there was a festival in the village, but Yajñadatta and his brother stayed at home. Devadatta says to Yajñadatta: "If you had gone to the festival, you would have seen the dancers." Yajñadatta says: "If I had gone, I too would have seen them. If we two had gone, we would have heard the songs." Devadatta says: "If you two had gone, you too would have danced." The mother says to the father: "If the two boys had gone, they would have eaten sweets. If we had gone, we too would have danced." The father says: "If you all had gone, you would have enjoyed it; but if everyone had gone, who would have guarded the house?"'
  teaches: 'The conditional (लृङ्) — what would have been, but was not — in every person, spread through a family''s regret: अगमिष्यः, अगमिष्यम्, अगमिष्याव, अगमिष्यतम्, अगमिष्यताम्, अगमिष्याम, अगमिष्यत, अगमिष्यन्, each paired with its consequence.'
