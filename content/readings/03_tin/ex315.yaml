- id: ex315
  kind: graded
  segment: 187
  order: 2
  sentence: 'यदि त्वम् ह्यः उत्सवम् अगमिष्यः, नर्तकीः अद्रक्ष्यः। यदि अहम् अगमिष्यम्, अहम् अपि ताः अद्रक्ष्यम्। यदि आवाम् अगमिष्याव, गीतानि अश्रोष्याव। यदि युवाम् अगमिष्यतम्, युवाम् अपि अनर्तिष्यतम्। यदि बालौ अगमिष्यताम्, मोदकान् अखादिष्यताम्। यदि बालाः अगमिष्यन्, अक्रीडिष्यन्। यदि यूयम् अगमिष्यत, यूयम् अनन्दिष्यत। यदि वयम् अगमिष्याम, वयम् अपि अनर्तिष्याम।'
  translation: 'If you had gone to the festival yesterday, you would have seen the dancers. If I had gone, I too would have seen them. If we two had gone, we would have heard the songs. If you two had gone, you too would have danced. If the two boys had gone, they would have eaten sweets. If the children had gone, they would have played. If you all had gone, you would have rejoiced. If we had gone, we too would have danced.'
  teaches: 'The conditional (लृङ्) — what would have been, but was not — in every person: अगमिष्यः, अगमिष्यम्, अगमिष्याव, अगमिष्यतम्, अगमिष्यताम्, अगमिष्यन्, अगमिष्यत, अगमिष्याम, each paired with its consequence.'
