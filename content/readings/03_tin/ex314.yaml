  sentence: 'माता पृच्छति — युवाम् अद्य कुत्र अगमतम्? पुत्रौ वदतः — आवाम् विद्यालयम् अगमाव। कन्या वदति — अहम् अपि अगमम्। तौ मित्रे अपि अगमताम्। माता वदति — यूयम् सर्वे अगमत, वयम् अपि आपणम् अगमाम।'
  translation: 'Mother asks: "Where did you two go today?" The two sons say: "We two went to school." The daughter says: "I went too." Their two friends went as well. Mother says: "You all went, and we too went to the market."'
