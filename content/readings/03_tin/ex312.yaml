- id: ex312
  kind: graded
  segment: 186
  order: 1
  sentence: 'गुरुः वदति — शिष्याः पाठशालाम् गच्छन्तु। अहम् अपि गच्छानि। देवदत्त, आवाम् सह गच्छाव। सर्वे वयम् गच्छाम। यूयम् प्रतिदिनम् पठेत। त्वम् शनैः पठेः। युवाम् सह पठेतम्। एतौ बालौ ग्रन्थम् पठेताम्। कन्याः अपि पठेयुः। आवाम् अपि पठेव।'
  translation: 'The teacher says: "Let the pupils go to school. Let me go too. Devadatta, let us two go together. Let us all go. You should study every day. You should read slowly. You two should study together. These two boys should read the book. The girls should study too. We two should study as well."'
  teaches: 'The imperative in the persons the corpus lacked — गच्छन्तु, गच्छानि, गच्छाव, गच्छाम — and the optative of advice — पठेत, पठेः, पठेतम्, पठेताम्, पठेयुः, पठेव.'
