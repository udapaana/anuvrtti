- id: ex317
  kind: graded
  segment: 188
  order: 2
  sentence: 'ऋषयः रामलक्ष्मणौ ऊचुः — हे राजपुत्रौ, युवाम् राक्षसानाम् वनम् जग्मथुः इति वयम् शुश्रुम। हे आश्रमवासिनः, यूयम् अपि ताभ्याम् सह तत्र जग्म। राक्षसाः युवाभ्याम् बिभ्यति। रामः उवाच — आवाभ्याम् ते पलायन्ते, न अन्येभ्यः। ऋषयः ऊचुः — याभ्याम् राक्षसाः पलायन्ते, ययोः धर्मः वसति, एताभ्याम् नमः। आश्रमम् चत्वारः अतिथयः आगच्छन्। एकः शिष्यः पप्रच्छ — काभ्याम् प्रथमम् फलानि यच्छामः? गुरुः उवाच — एताभ्याम् राजपुत्राभ्याम्। आभ्याम् वृक्षाभ्याम् फलानि आनयत। हे राजपुत्रौ, अनयोः पर्णशालयोः वसतम्।'
  translation: 'The sages said to Rāma and Lakṣmaṇa: "Princes, we have heard that you two went into the demons'' forest. Hermits, you went there with them too. The demons fear you two." Rāma said: "They flee from us two, not from others." The sages said: "Those from whom the demons flee, in whom dharma dwells — homage to these two." Four guests came to the hermitage. A pupil asked: "To which two shall we give fruit first?" The teacher said: "To these two princes. Bring fruit from these two trees. Princes, stay in these two leaf-huts."'
  teaches: 'The perfect of report — जग्मथुः, जग्म, शुश्रुम: the sages heard it, they did not see it — and the dual pronouns in a relative-and-correlative maxim: याभ्याम्, ययोः … एताभ्याम्; युवाभ्याम्, आवाभ्याम् (ablative); काभ्याम्; आभ्याम्, अनयोः.'
