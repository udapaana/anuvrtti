- id: ex317
  kind: graded
  segment: 188
  order: 2
  sentence: 'ऋषयः ऊचुः — हे रामलक्ष्मणौ, युवाम् राक्षसानाम् वनम् जग्मथुः इति वयम् शुश्रुम। सैनिकाः, यूयम् अपि तत्र जग्म इति जनाः वदन्ति। आवाभ्याम् राक्षसाः बिभ्यति, युवाभ्याम् अपि। यस्मै दीयते, तस्मै सः कुप्यति? याभ्याम् वृक्षाभ्याम् फलम् पतति, ययोः वृक्षयोः पक्षिणः वसन्ति, आभ्याम् अनयोः च दृश्यन्ते। काभ्याम् त्वम् फलानि ददासि? एताभ्याम्। एते लते पश्य।'
  translation: 'The sages said: "O Rāma and Lakṣmaṇa, we have heard that you two went to the demons'' forest. Soldiers, people say you went there too." The demons fear us two, and you two as well. Is he angry with the one to whom it is given? From the two trees from which the fruit falls, in which two trees the birds live — from these two, in these two, they are seen. "To which two do you give fruit?" "To these two." "Look at these two creepers."'
  teaches: 'The perfect''s last persons (जग्मथुः, जग्म, शुश्रुम), and the remaining pronoun cells — आवाभ्याम्, युवाभ्याम् (ablative), यस्मै, याभ्याम्, ययोः, आभ्याम्, अनयोः, काभ्याम्, एताभ्याम्, एते.'
