- id: ex317
  kind: graded
  segment: 188
  order: 2
  sentence: 'आश्रमम् रामलक्ष्मणौ आगच्छताम्। ऋषयः तौ ऊचुः — हे राजपुत्रौ, युवाम् राक्षसानाम् वनम् जग्मथुः इति वयम् शुश्रुम। राक्षसाः अस्मत् न बिभ्यति, युवाभ्याम् तु बिभ्यति। रामः उवाच — ते धर्मात् बिभ्यति, न आवाभ्याम्। ऋषयः ऊचुः — याभ्याम् राक्षसाः पलायन्ते, ययोः धर्मः वसति, एताभ्याम् नमः। गुरुः शिष्यान् उवाच — एताभ्याम् राजपुत्राभ्याम् आभ्याम् वृक्षाभ्याम् फलानि आनयत। हे राजपुत्रौ, अनयोः पर्णशालयोः वसतम्।'
  translation: 'Rāma and Lakṣmaṇa came to the hermitage. The sages said to them: "Princes, we have heard that you two went into the demons'' forest. The demons do not fear us, but they fear you two." Rāma said: "They fear dharma, not us two." The sages said: "Those from whom the demons flee, in whom dharma dwells — homage to these two." The teacher said to his pupils: "Bring fruit from these two trees for these two princes. Princes, stay in these two leaf-huts."'
  teaches: 'The perfect of report — जग्मथुः, शुश्रुम: the sages heard it, they did not see it — and the ablative of fear (1.4.25), अस्मत्, युवाभ्याम्, आवाभ्याम्; a relative-and-correlative: याभ्याम्, ययोः … एताभ्याम्; आभ्याम्, अनयोः.'
