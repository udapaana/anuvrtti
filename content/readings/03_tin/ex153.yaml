- id: ex153
  segment: 90
  sentence: बालः पचति, ओदनः पच्यते।
  translation: The boy cooks; the rice is cooked.
  teaches: 'कर्तरि शप् vs कर्मणि यक् — the विकरण (stem-marker) shows the voice: active शप् (अ) vs passive यक् (य)'
  words:
  - form: बालः
    lemma: बाल
    gloss: the boy
    notes:
    - term: कर्तृ
      en: agent (active clause)
    - term: प्रथमा
      en: nominative
  - form: पचति
    lemma: पच्
    gloss: cooks (active)
    notes:
    - term: पच्
      en: '"cook" — ACTIVE'
    - cite: '3.1.68'
      role: कर्तरि शप् — in the active, the विकरण शप् (अ) → पच् + अ + ति → पचति
    - term: शप्
      en: the active class-marker (अ)
    - term: लट्
      en: present
  - form: ओदनः
    lemma: ओदन
    gloss: the rice — subject of the passive clause
    notes:
    - term: कर्मन्
      en: the object, raised to nominative in the passive
    - term: प्रथमा
      en: nominative
  - form: पच्यते
    lemma: पच्
    gloss: is cooked (passive)
    notes:
    - term: पच्
      en: '"cook" — PASSIVE'
    - cite: '3.1.67'
      role: सार्वधातुके यक् — in the passive, the विकरण यक् (य) → पच् + य + ते → पच्यते
    - term: यक्
      en: the passive marker (य)
    - term: कर्मणि
      en: passive voice
  vyakhya: कर्तरि शप्, कर्मणि यक्। पच् + अ → पचति; पच् + य → पच्यते। विकरणः प्रयोगं सूचयति।
  vyakhya_en: |
    What tells active from passive is the विकरण — the little stem-marker between root and ending. Active uses शप्, अ (3.1.68 कर्तरि शप्): पच् + अ + ति → पचति "cooks." Passive uses यक्, य (3.1.67 सार्वधातुके यक्): पच् + य + ते → पच्यते "is cooked." Same root पच्, same tense; the विकरण अ vs य, and the ending परस्मै- vs आत्मनेपद, carry the whole voice contrast.
