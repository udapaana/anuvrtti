#  PARADIGM-FILL batch (parallel-authored, all cites re-verified centrally).
#  Filling missing paradigm cells: a-stem oblique cases, gen.pl, locative,
#  pronoun forms (सा fem, अहम् 1sg). One cell per reading.
# ════════════════════════════════════════════════════════════════════════

- id: ex086
  segment: 11
  sentence: नरेण फलम् दृश्यते।
  translation: The fruit is seen by the man.
  teaches: 'a-stem masc. नर तृतीया एकवचन = नरेण — टा→इन (7.1.12) + णत्व'
  words:
  - form: नरेण
    lemma: नर
    gloss: by the man
    notes:
    - term: करण
      en: agent expressed by the instrumental (of the passive दृश्यते)
    - term: तृतीया
      en: instrumental
    - term: एकवचन
      en: singular
    - cite: '2.3.18'
      role: कर्तृकरणयोस्तृतीया — the agent of the passive दृश्यते takes तृतीया
    - cite: '7.1.12'
      role: टाङसिङसामिनात्स्याः — after an a-stem, तृतीया टा → इन → नर + इन = नरेन
    - cite: '8.4.1'
      role: रषाभ्यां नो णः समानपदे — within one word the र turns the following न → ण → नरेण
  vyakhya: नरशब्दात् तृतीयैकवचने टा, सा अकारात् परा इनादेशम् (७.१.१२), ततो रेफात् नकारस्य णत्वम् (८.४.१), इति नरेण।
  vyakhya_en: |
    For नर in the instrumental singular the ending is टा; after an a-stem टा becomes इन (7.1.12), giving नरेन. The र then retroflexes the following न to ण (णत्व, 8.4.1) — नरेण. As the agent of the passive दृश्यते "is seen," it stands in the तृतीया (2.3.18).

- id: ex087
  segment: 12
  sentence: नरो ग्रामादागच्छति।
  translation: The man comes from the village.
  teaches: 'अपादान/पञ्चमी singular — ङसि → आत् after the a-stem → ग्रामात्'
  words:
  - form: नरः
    lemma: नर
    gloss: the man
    notes:
    - term: कर्तृ
      en: the agent who moves (nom. sg.)
    - term: प्रथमा
      en: nominative
    - text: नरः → नरो before the voiced ग (visarga सन्धि)
  - form: ग्रामात्
    lemma: ग्राम
    gloss: from the village
    notes:
    - term: अपादान
      en: the fixed point from which departure happens
    - cite: '1.4.24'
      role: ध्रुवमपायेऽपादानम् — the fixed point one moves away from is अपादान
    - cite: '2.3.28'
      role: अपादाने पञ्चमी — the अपादान takes पञ्चमी
    - cite: '7.1.12'
      role: टाङसिङसामिनात्स्याः — after an a-stem ङसि → आत् → ग्रामात्
    - term: पञ्चमी
      en: ablative
  - form: आगच्छति
    lemma: आगम्
    gloss: comes, approaches
    notes:
    - term: गम्
      en: 'आ + गम् "come"'
    - term: लट्
      en: present
  vyakhya: ग्रामो ध्रुवम् अपायस्य, ततो नरस्य आगमनम्। अतो ग्रामात् इति अपादाने पञ्चमी; अकारान्तत्वात् ङसेः आत्।
  vyakhya_en: |
    The village is the fixed point the man moves away from, so it is अपादान (1.4.24), expressed by the पञ्चमी (2.3.28). Because the stem ends in अ, the ablative ending ङसि becomes आत् (7.1.12) → ग्रामात् "from the village."

- id: ex088
  segment: 13
  sentence: नरः ग्रामे अस्ति।
  translation: The man is in the village.
  teaches: 'सप्तमी (locative) singular — the अधिकरण as locus → ग्रामे'
  words:
  - form: नरः
    lemma: नर
    gloss: the man
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: ग्रामे
    lemma: ग्राम
    gloss: in the village
    notes:
    - term: अधिकरण
      en: locus — the substratum of the action
    - cite: '1.4.45'
      role: आधारोऽधिकरणम् — the locus (आधार) is termed अधिकरण
    - cite: '2.3.36'
      role: सप्तम्यधिकरणे च — सप्तमी after the अधिकरण कारक
    - term: सप्तमी
      en: locative
    - term: एकवचन
      en: singular
    - text: ग्राम + ङि (loc.sg); the a-stem before ङि yields ग्रामे
  - form: अस्ति
    lemma: अस्
    gloss: is
    notes:
    - term: अस्
      en: '"to be"'
    - term: लट्
      en: present
    - cite: '3.2.123'
      role: वर्तमाने लट् — present tense
  vyakhya: ग्रामे इति अधिकरणे सप्तमी। आधारोऽधिकरणम् इति संज्ञा, सप्तम्यधिकरणे च इति विभक्तिः।
  vyakhya_en: |
    ग्रामे is the locus (अधिकरण) of the being: by आधारोऽधिकरणम् (1.4.45) the village as substratum gets the अधिकरण name, and सप्तम्यधिकरणे च (2.3.36) then assigns it the locative. The a-stem locative singular ending gives ग्रामे.

- id: ex089
  segment: 17
  sentence: सा नदीम् गच्छति।
  translation: She goes to the river.
  teaches: 'तद् in the feminine — nom.sg सा (contrast masc सः)'
  words:
  - form: सा
    lemma: तद्
    gloss: she / that one (fem.)
    vocab: true
    notes:
    - term: सर्वनाम
      en: pronoun — the सर्व-class
    - cite: '1.1.27'
      role: सर्वादीनि सर्वनामानि — तद् is a सर्वनाम
    - cite: '7.2.102'
      role: त्यदादीनामः — तद् takes अ for its final (the base ता- in the feminine)
    - cite: '4.1.4'
      role: अजाद्यतष्टाप् — an a-stem feminine takes टाप् (आ); तद् → ता
    - cite: '6.1.68'
      role: हल्ङ्याब्भ्यो दीर्घात्… — the nom.sg सु drops after the long आ-stem → सा
    - term: प्रथमा
      en: nominative
  - form: नदीम्
    lemma: नदी
    gloss: river
    notes:
    - term: नदी
      en: '"river" — an ई-stem feminine'
    - term: द्वितीया
      en: accusative (goal of motion)
  - form: गच्छति
    lemma: गम्
    gloss: goes
    notes:
    - term: गम्
      en: '"go"'
    - term: लट्
      en: present
  vyakhya: तच्छब्दः सर्वनाम। स्त्रियां टापा ता, सुलोपे सा।
  vyakhya_en: |
    You met सः, the masculine "he" (ex045). Its feminine is सा. तद् takes the अ-base (7.2.102), then the feminine टाप् (आ, 4.1.4) gives ता-; the nominative सु drops after this long आ-stem (6.1.68), leaving सा. One pronoun तद्, two genders — सः and सा.

- id: ex090
  segment: 17
  sentence: अहम् ग्रामम् गच्छामि।
  translation: I go to the village.
  teaches: 'अस्मद् "I" nom.sg = अहम् — the suppletive nominative'
  words:
  - form: अहम्
    lemma: अस्मद्
    gloss: I
    vocab: true
    notes:
    - term: सर्वनाम
      en: pronoun — अस्मद् ("I/we") is of the सर्व-class
    - cite: '1.1.27'
      role: सर्वादीनि सर्वनामानि — अस्मद् is a सर्वनाम
    - cite: '7.2.94'
      role: त्वाहौ सौ — before सु (nom.sg) अस्म् → अह; अस्मद् → अह + म् → अहम्
    - term: प्रथमा
      en: nominative
    - text: 'so अहम् is suppletive — built on अह-, not the मद्/अस्म् stem of the oblique (मम, मया, मयि)'
  - form: ग्रामम्
    lemma: ग्राम
    gloss: to the village
    notes:
    - term: कर्मन्
      en: object (goal of motion)
    - term: द्वितीया
      en: accusative
  - form: गच्छामि
    lemma: गम्
    gloss: I go
    notes:
    - term: गम्
      en: '"go"'
    - term: उत्तमपुरुष
      en: 1st person (उत्तम), singular
    - term: लट्
      en: present
  vyakhya: अस्मच्छब्दः सर्वनाम। सौ परे अस्म् इत्यस्य अह इत्यादेशः — अहम्। मम मया मयि इति तु मद्-रूपम्।
  vyakhya_en: |
    अस्मद् ("I/we") has the irregular nominative singular अहम्. By त्वाहौ सौ (7.2.94), before the nom.sg ending सु the portion अस्म् is replaced by अह — अस्मद् → अहम्. This is suppletion: अहम् is built on a stem found nowhere else, while every oblique case of "I" uses the मद्/अस्म् material — मम, मया, मयि.

- id: ex093
  segment: 13
  sentence: देवानां राजा शोभते।
  translation: The king of the gods shines.
  teaches: 'a-stem masc. षष्ठी plural — आम् takes नुट् → नाम्, vowel lengthens, न → ण'
  words:
  - form: देवानाम्
    lemma: देव
    gloss: of the gods (gen. pl.)
    notes:
    - term: षष्ठी
      en: the genitive of relation/possession (the शेष relation)
    - term: बहुवचन
      en: plural
    - cite: '2.3.50'
      role: षष्ठी शेषे — the षष्ठी for the leftover relation, here "of the gods"
    - cite: '7.1.54'
      role: ह्रस्वनद्यापो नुट् — after a short-vowel/नदी/आप् stem, आम् takes the नुट् augment → नाम्
    - cite: '6.4.3'
      role: नामि — before नाम्, the stem-final vowel lengthens → देवा
    - cite: '8.4.2'
      role: अट्कुप्वाङ्नुम्व्यवायेऽपि — णत्व applies across the intervening vowels → देवानाम्
  - form: राजा
    lemma: राजन्
    gloss: king (nom. sg.)
    notes:
    - term: कर्तृ
      en: subject — the one who shines
    - term: प्रथमा
      en: nominative
  - form: शोभते
    lemma: शुभ्
    gloss: shines, looks splendid
    notes:
    - term: शुभ्
      en: '"shine" (आत्मनेपद)'
    - term: लट्
      en: present
  vyakhya: देवानाम् इति षष्ठीबहुवचनम् — आमि नुट् (नाम्), नामि पूर्वस्य दीर्घः, रेफात् परस्य नस्य णत्वम्।
  vyakhya_en: |
    देवानाम् is the genitive plural. The ending आम् first takes the नुट् augment न (7.1.54) → नाम्; before नाम् the stem-vowel lengthens to देवा (6.4.3, नामि); finally the र retroflexes the न to ण across the intervening vowels (8.4.2) → देवानाम्. With राजा (nom. sg.) the phrase means "the king of the gods shines."
