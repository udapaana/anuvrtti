    You met सः, the masculine "he" (ex045). Its feminine is सा. तद् takes the अ-base (7.2.102), then the feminine टाप् (आ, 4.1.4) gives ता-; the nominative सु drops after this long आ-stem (6.1.68), leaving सा. One pronoun तद्, two genders — सः and सा.

