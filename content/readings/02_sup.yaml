    - cite: '7.2.102'
      role: त्यदादीनामः — तद् takes अ for its final (the base ता- in the feminine)
    - cite: '4.1.4'
      role: अजाद्यतष्टाप् — an a-stem feminine takes टाप् (आ); तद् → ता
    - cite: '6.1.68'
      role: हल्ङ्याब्भ्यो दीर्घात्… — the nom.sg सु drops after the long आ-stem → सा
    - term: प्रथमा
      en: nominative
  - form: नदीम्
    lemma: नदी
    gloss: river
    notes:
    - term: नदी
      en: '"river" — an ई-stem feminine'
    - term: द्वितीया
      en: accusative (goal of motion)
  - form: गच्छति
    lemma: गम्
    gloss: goes
    notes:
    - term: गम्
      en: '"go"'
    - term: लट्
      en: present
  vyakhya: तच्छब्दः सर्वनाम। स्त्रियां टापा ता, सुलोपे सा।
