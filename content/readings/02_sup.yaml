  vyakhya: |
    अकारान्तस्य पुंलिङ्गस्य (देव) सर्वाः विभक्तयः सर्वाणि वचनानि च — एकत्र दर्शिताः। एकैकं सूत्रं प्रत्येकं प्रत्ययम् आदेशं च साधयति।
