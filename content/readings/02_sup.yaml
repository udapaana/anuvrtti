    You met प्रथमा through सप्तमी one cell at a time (ex001–ex013). Here is the WHOLE a-stem masculine paradigm of देव in one place — the reference table the readings were building toward. Read down each column for a number (sg · dual · pl), across each row for a case. Note the economies Pāṇini builds in: the dual collapses three oblique cases into देवाभ्याम् and two more into देवयोः; the plural shares देवेभ्यः for dative and ablative. Every other a-stem masculine — नर, राम, बाल, पुत्र, अश्व — declines exactly thus; learn देव and you hold them all. Each cell names the sūtra that shapes its ending, so the table doubles as an index into the अङ्ग-operations of adhyāyas 6–7.

- id: ex137
  segment: 150
  sentence: भगवान् वदति।
  translation: The Lord speaks.
  teaches: 'the वत्-stem in its strong form: nom.sg भगवान्, with the नुम् augment and lengthening'
  words:
  - form: भगवान्
    lemma: भगवत्
    gloss: the Lord, the blessed one
    notes:
    - term: कर्तृ
      en: agent
    - text: 'भगवत् is a त्/त-stem (मतुप् → वत्); the nom.sg is the STRONG stem'
    - cite: '7.1.70'
      role: उगिदचां सर्वनामस्थाने — a उगित् stem takes नुम् (न्) before a सर्वनामस्थान ending → भगवन्त्
    - cite: '6.4.10'
      role: सान्तमहतः संयोगस्य — the penult lengthens → भगवान्त् → भगवान्
    - term: प्रथमा
      en: nominative singular (strong)
  - form: वदति
    lemma: वद्
    gloss: speaks
    notes:
    - term: वद्
      en: '"speak"'
    - term: लट्
      en: present
  vyakhya: उगिदन्तस्य सर्वनामस्थाने नुम्; सान्तस्य दीर्घः। भगवत् → भगवान् (बलवत्-रूपम्)।
  vyakhya_en: |
    Consonant stems have TWO shapes — a STRONG stem in the सर्वनामस्थान cells (nom/voc/acc, roughly) and a WEAK stem elsewhere. भगवत् "the Lord," a वत्-stem, shows the strong form in the nominative singular: it takes the नुम् augment न् (7.1.70, because the stem is उगित्) → भगवन्त्, then the pre-cluster vowel lengthens (6.4.10) → भगवान्. This is why "blessed" appears as भगवान् here but भगवतः, भगवते in the oblique. The strong/weak split is the whole story of consonant declension.
- id: ex138
  segment: 150
  sentence: भगवतः वचनम्।
  translation: The Lord's word.
  teaches: 'the weak stem of the same word: gen.sg भगवतः — plain भगवत् + ङस्, without the नुम् that भगवान् takes'
  words:
  - form: भगवतः
    lemma: भगवत्
    gloss: of the Lord
    notes:
    - term: सम्बन्ध
      en: genitive — "of ___"
    - text: 'in the oblique, the WEAK stem भगवत् appears — no नुम्, no lengthening'
    - cite: '2.3.50'
      role: षष्ठी शेषे → भगवतः
    - term: षष्ठी
      en: genitive singular (weak)
  - form: वचनम्
    lemma: वचन
    gloss: word, utterance
    notes:
    - term: कर्तृ
      en: the head noun
    - term: प्रथमा
      en: nominative
  vyakhya: सर्वनामस्थानभिन्ने भे दुर्बलम् अङ्गम्। भगवत् + ङस् → भगवतः (न नुम्)।
  vyakhya_en: |
    Set ex137 and ex138 side by side: भगवान् (nom.sg) vs भगवतः (gen.sg). The genitive is a भ/weak cell, so the stem stays plain भगवत् — no नुम्, no lengthening — and simply takes ङस् → भगवतः. Strong भगवान् · weak भगवतः: one stem, two shapes, and the case-cell decides which. This is exactly the राजन् pattern (राजा / राज्ञः, ex066) in a different stem-class.
- id: ex139
  segment: 150
  sentence: दण्डी गच्छति।
  translation: The staff-bearer goes.
  teaches: 'इन्-stem strong nom.sg दण्डी — the न् of the stem drops, the इ lengthens (न-lopa)'
  words:
  - form: दण्डी
    lemma: दण्डिन्
    gloss: the staff-bearer, one who holds a staff
    notes:
    - term: कर्तृ
      en: agent
    - text: 'दण्डिन् is an इन्-stem (दण्ड + इन्, "possessing a staff")'
    - cite: '8.2.7'
      role: नलोपः प्रातिपदिकान्तस्य — final न् of the nominal stem drops → दण्डि
    - cite: '7.1.70'
      role: 'सर्वनामस्थान — the nom.sg is strong; with न-lopa + लोपस्य lengthening → दण्डी'
    - term: प्रथमा
      en: nominative singular
  - form: गच्छति
    lemma: गम्
    gloss: goes
    notes:
    - term: गम्
      en: '"go"'
    - term: लट्
      en: present
  vyakhya: इन्नन्तस्य प्रातिपदिकस्य नलोपः; दीर्घः। दण्डिन् → दण्डी।
  vyakhya_en: |
    इन्-stems (दण्डिन् "staff-bearer," ज्ञानिन् "knower," योगिन् "yogi") build agent/possessor nouns. In the nominative singular the stem-final न् drops (8.2.7, नलोपः प्रातिपदिकान्तस्य) and the इ lengthens → दण्डी. So the dictionary stem दण्डिन् surfaces as दण्डी "the staff-bearer." Compare योगी, ज्ञानी, स्वामी — all the same shape.
- id: ex140
  segment: 150
  sentence: दण्डिनम् पश्यति।
  translation: He sees the staff-bearer.
  teaches: 'the इन्-stem in the accusative: दण्डिनम् — the न् stays before a vowel ending, where दण्डी loses it'
  words:
  - form: दण्डिनम्
    lemma: दण्डिन्
    gloss: the staff-bearer (object)
    notes:
    - term: कर्मन्
      en: object
    - text: 'before the vowel ending अम्, the न् is retained → दण्डिनम् (no न-lopa)'
    - cite: '2.3.2'
      role: कर्मणि द्वितीया → दण्डिनम्
    - term: द्वितीया
      en: accusative singular
  - form: पश्यति
    lemma: दृश्
    gloss: sees
    notes:
    - term: दृश्
      en: '"see"'
    - term: लट्
      en: present
  vyakhya: अजादौ प्रत्यये नकारः तिष्ठति। दण्डिन् + अम् → दण्डिनम् (न लोपः)।
  vyakhya_en: |
    दण्डी (nom.) vs दण्डिनम् (acc.): the नलोपः of 8.2.7 happens only at the END of a word, so when a vowel-initial ending like अम् follows, the न् has something to attach to and is kept → दण्डिनम्. The pair दण्डी / दण्डिनम् mirrors भगवान् / भगवतः and राजा / राज्ञः — every consonant stem shows this front (strong, visible) vs back (weak, stem-revealing) contrast.
- id: ex141
  segment: 150
  sentence: पितरः आगच्छन्ति।
  translation: The fathers come.
  teaches: 'ऋ-stem strong plural पितरः — गुण अर् in the nom.pl (vs sg पिता with vṛddhi), closing the ऋ-paradigm'
  words:
  - form: पितरः
    lemma: पितृ
    gloss: the fathers
    notes:
    - term: कर्तृ
      en: agent (plural)
    - text: 'पितृ nom.PL: the ऋ → गुण अर् before the strong ending → पितर् + अस् → पितरः'
    - cite: '7.3.110'
      role: ऋतो ङिसर्वनामस्थानयोः — ऋ takes गुण (अर्) in सर्वनामस्थान cells → पितर्
    - cite: '1.4.21'
      role: बहुषु बहुवचनम् → plural → पितरः
    - term: प्रथमा
      en: nominative plural (strong)
  - form: आगच्छन्ति
    lemma: गम्
    gloss: come
    notes:
    - term: गम्
      en: '"come" (आ + गम्)'
    - term: लट्
      en: present plural
  vyakhya: ऋदन्तस्य सर्वनामस्थाने गुणः। पितृ + अस् → पितरः। (एकवचने वृद्धिः — पिता।)
  vyakhya_en: |
    You met पिता (nom.sg, with vṛddhi आ → पिता) and पितरम् (acc., गुण अर्) in ex043–044. Here is the nominative PLURAL: पितरः, गुण अर् + the plural ending अस् (7.3.110). So the ऋ-stem grades its strength by cell — vṛddhi in the nom.sg (पिता), गुण elsewhere-strong (पितरम्, पितरः), plain ऋ in the weak cells (पितृभिः). The kinship and agent nouns (मातृ, भ्रातृ, कर्तृ, दातृ) all follow.
- id: ex142
  segment: 150
  sentence: राज्ञा सह राजानौ गच्छतः।
  translation: Together with the king, the two kings go.
  teaches: 'राजन् in the dual: strong राजानौ beside weak राज्ञा — the last two grades of the stem'
  words:
  - form: राज्ञा
    lemma: राजन्
    gloss: with/by the king
    notes:
    - term: करण
      en: accompaniment — "(together) with the king"
    - text: 'instr.sg = WEAK cell: राजन् loses its अ (अल्लोपः) → राज्ञ् + आ → राज्ञा'
    - cite: '6.4.134'
      role: अल्लोपोऽनः — the अ of the अन्-stem drops before a vowel ending → राज्ञ्
    - cite: '2.3.18'
      role: कर्तृकरणयोस्तृतीया → करण → राज्ञा
    - term: तृतीया
      en: instrumental singular (weak)
  - form: सह
    lemma: सह
    gloss: together with
    notes:
    - term: सहार्थ
      en: governs the तृतीया (accompaniment), as in ex032
  - form: राजानौ
    lemma: राजन्
    gloss: the two kings
    notes:
    - term: कर्तृ
      en: agent (dual)
    - text: 'nom.DUAL = STRONG cell: the अ lengthens → राजान् + औ → राजानौ'
    - cite: '7.1.70'
      role: सर्वनामस्थान (dual nom) is strong → the long स्टेम राजान्
    - cite: '1.4.22'
      role: द्व्येकयोर्द्विवचने → dual → राजानौ
    - term: प्रथमा
      en: nominative dual (strong)
  - form: गच्छतः
    lemma: गम्
    gloss: the two go
    notes:
    - term: गम्
      en: '"go" — 3rd person DUAL'
    - cite: '1.4.22'
      role: द्व्येकयोर्द्विवचने → dual verb → गच्छतः
    - term: लट्
      en: present dual
  vyakhya: सर्वनामस्थाने बलवत् (राजान्), अन्यत्र अल्लोपेन दुर्बलम् (राज्ञ्)। राजानौ — राज्ञा।
  vyakhya_en: |
    One sentence holds both halves of the राजन् paradigm. राजानौ "the two kings" is a STRONG cell (nom.dual, सर्वनामस्थान): the stem lengthens to राजान्. राज्ञा "with the king" is a WEAK cell (instr.sg): the अ of -अन् drops by अल्लोपः (6.4.134) → राज्ञ् + आ → राज्ञा. Strong राजान्- · weak राज्ञ्-: the same alternation as भगवान्/भगवतः and दण्डी/दण्डिनम्, now shown WITHIN one line, and in the dual you have been drilling since RV 1.2.

- id: ex172
  segment: 130
  kind: paradigm
  sentence: फलम् फले फलानि। फलम् फले फलानि। फलेन फलाभ्याम् फलैः। फलाय फलाभ्याम् फलेभ्यः। फलात् फलाभ्याम् फलेभ्यः। फलस्य फलयोः फलानाम्। फले फलयोः फलेषु। हे फल हे फले हे फलानि॥
  translation: The complete declension of फल "fruit" (a-stem neuter) — eight cases × three numbers.
  teaches: 'the whole अकारान्त नपुंसक paradigm — फल follows देव everywhere but the प्रथमा and द्वितीया (फलम्/फले/फलानि), where the neuter rules take over'
  words:
  - form: फलम्
    gloss: 'प्रथमा/द्वितीया एक — nom.=acc. sg. (अम्)'
    notes:
    - text: 'neuter प्रथमा = द्वितीया throughout — the defining feature'
    - cite: '7.1.24'
      role: अतोऽम् — after a short अ, neuter सु/अम् both → अम् → फलम्
    - term: नपुंसक
      en: neuter — nom. and acc. always identical
  - form: फले
    gloss: 'प्रथमा/द्वितीया द्वि — nom.=acc. dual (शी → ई)'
    notes:
    - cite: '7.1.23'
      role: स्वमोर्नपुंसकात् — neuter सु/अम् drop; the dual takes शी
    - cite: '6.1.102'
      role: अ + ई → ए → फले
    - term: द्विवचन
      en: dual (nom. = acc.)
  - form: फलानि
    gloss: 'प्रथमा/द्वितीया बहु — nom.=acc. pl. (शि → नुम् + इ)'
    notes:
    - cite: '7.1.20'
      role: जश्शसोः शिः — neuter जस्/शस् → शि (इ) in the plural
    - cite: '7.1.72'
      role: नपुंसकस्य झलचः — नुम् (न्) inserted before the ending → फलानि
    - term: बहुवचन
      en: plural (nom. = acc.)
  - form: फलेन
    gloss: 'तृतीया एक — instr. sg. (= देव: फलेन)'
    notes:
    - text: 'from the instrumental on, neuter declines EXACTLY like देव (masculine)'
    - term: तृतीया
      en: instrumental singular
  vyakhya: अकारान्तनपुंसकं देववत्, किन्तु प्रथमाद्वितीययोः नपुंसकविशेषः — फलम्/फले/फलानि। शेषं समानम्।
  vyakhya_en: |
    The neuter फल is the masculine देव (ex094) with ONE difference, repeated thrice: in the प्रथमा and द्वितीया — which are always identical in the neuter — the cells are फलम् (sg, अतोऽम्), फले (dual, शी), फलानि (pl, शि + नुम्). From the तृतीया down (फलेन, फलाय, फलस्य, फले…) it is letter-for-letter देव. So learn देव, change three cells, and you have every a-stem neuter — फल, वन, ज्ञान, पुष्प.
- id: ex173
  segment: 130
  kind: paradigm
  sentence: नदी नद्यौ नद्यः। नदीम् नद्यौ नदीः। नद्या नदीभ्याम् नदीभिः। नद्यै नदीभ्याम् नदीभ्यः। नद्याः नदीभ्याम् नदीभ्यः। नद्याः नद्योः नदीनाम्। नद्याम् नद्योः नदीषु। हे नदि हे नद्यौ हे नद्यः॥
  translation: The complete declension of नदी "river" (ī-stem feminine, ङीप्) — eight cases × three numbers.
  teaches: 'the whole ईकारान्त स्त्रीलिङ्ग paradigm — नदी, with its distinct नद्यै / नद्याः / नद्याम् and ई → य् before a vowel'
  words:
  - form: नदी
    gloss: 'प्रथमा एक — nom. sg. (long ई, सु elided)'
    notes:
    - cite: '4.1.3'
      role: स्त्रियाम् — feminine; the ङीप् (ई) stem-forming affix → नदी
    - term: प्रथमा
      en: nominative singular
  - form: नद्यौ
    gloss: 'प्रथमा द्वि — nom. dual (ई → य् before औ)'
    notes:
    - cite: '6.1.77'
      role: इको यणचि — ई before a vowel → य् (यण्) → नद्यौ
    - term: द्विवचन
      en: dual
  - form: नदीम्
    gloss: 'द्वितीया एक — acc. sg. (अम्, ई kept)'
    notes:
    - term: द्वितीया
      en: accusative singular
    - cite: '2.3.2'
      role: कर्मणि द्वितीया (the case sense); form नदी + अम् → नदीम्
  - form: नद्यै
    gloss: 'चतुर्थी एक — dat. sg. (ङे → स्याट् → यै)'
    notes:
    - cite: '7.3.116'
      role: ङेराम्नद्याम्नीभ्यः — ई/नदी-class stems take आम्/यै etc.; dat. → नद्यै
    - term: चतुर्थी
      en: dative singular
  - form: नद्याः
    gloss: 'पञ्चमी/षष्ठी एक — abl.=gen. sg. (आस्)'
    notes:
    - cite: '7.3.116'
      role: ङेराम्नद्याम्नीभ्यः — the नदी-class oblique sg → नद्याः
    - term: षष्ठी
      en: gen. (= abl.) singular
  - form: नद्याम्
    gloss: 'सप्तमी एक — loc. sg. (ङि → आम्)'
    notes:
    - cite: '7.3.116'
      role: ङेराम्नद्याम्नीभ्यः — loc. sg. of the नदी-class → नद्याम्
    - term: सप्तमी
      en: locative singular
  - form: नदि
    gloss: 'सम्बोधन एक — voc. sg. (shortened ई → इ)'
    notes:
    - cite: '7.3.117'
      role: vocative shortening; हे नदि (the इ-shortened call)
    - term: सम्बोधन
      en: vocative singular
  vyakhya: ईकारान्तं स्त्रीलिङ्गं (ङीप्) — अजादौ यण् (नद्यौ), अन्यत्र विशेषप्रत्ययाः नद्यै नद्याः नद्याम्। हे नदि इति ह्रस्वः।
  vyakhya_en: |
    The ī-stem feminine नदी (ङीप्, 4.1.3) gathered whole. Two signatures: (1) before a vowel ending the long ई becomes य् by यण् — नद्यौ, नद्यः, नद्या; (2) the oblique singular takes the special नदी-class endings नद्यै (dat), नद्याः (abl/gen), नद्याम् (loc), all by ङेराम्नद्याम्नीभ्यः (7.3.116). The vocative shortens to हे नदि. So every ङीप् feminine — नदी, देवी, गौरी, कुमारी — declines thus. With ex094 (देव), ex172 (फल), and this, the three commonest stem-classes now each have a full reference paradigm.
