  vyakhya: 'बहुव्रीहिपुञ्जः। पीतोदकाः जग्धतृणाः दुग्धदोहाः निरिन्द्रियाः इति चत्वारो गोविशेषणबहुव्रीहयः; अनन्दाः इति नञ्बहुव्रीहिः लोकविशेषणम्। ददत् इति दाञः शतृ (द्वित्वेन)। नचिकेतसः विमर्शः — निःसारदानस्य निःसारम् फलम्।'
  vyakhya_en: |
    Four **possessive compounds** in a row, each a spent cow: पीतोदकाः "whose
    water is drunk," जग्धतृणाः "whose grass is eaten," दुग्धदोहाः "milked dry,"
    निरिन्द्रियाः "past all vigour." A नञ्-बहुव्रीहि closes the thought — अनन्दाः
    (लोकाः) "joyless worlds." The reflection is the boy's: give what is worthless,
    and you reach worlds to match. ददत् is the reduplicating शतृ of दा, "(the
    giver) giving (them)."
