    curated: "the whole verse, verbatim and unaccented; word-separated (श्रद्धाविवेश and सोऽमन्यत shown split at their word-boundaries, sandhi noted). From GRETIL's edition of Olivelle 1998 (sa_kathopaniSad, KaU 1.2)."
  sentence: तम् ह कुमारम् सन्तम् दक्षिणासु नीयमानासु श्रद्धा आविवेश। सः अमन्यत॥
  translation: While he was still a boy, as the sacrificial gifts were being led out, faith entered him — and he thought.
  teaches: |
    a locative absolute in the plural — दक्षिणासु नीयमानासु "the gifts being led
    out" — with a passive present participle (नीयमानासु); and the perfect आविवेश
    "entered," closing on the imperfect अमन्यत "he thought."
