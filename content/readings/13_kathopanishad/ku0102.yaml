  vyakhya: 'भावलक्षणसप्तमी। दक्षिणासु नीयमानासु इति सतिसप्तमी (यस्य च भावेन…) — नीयमानासु इति नियतेः कर्मणि शानच्। सन्तम् इति अस्तेः शतृ। आविवेश इति विशेः लिट्; अमन्यत इति मनेः लङ्।'
  vyakhya_en: |
    A **locative absolute**, and this time in the plural: दक्षिणासु नीयमानासु,
    "the (sacrificial) gifts being led out" — both noun and participle in the
    locative (2.3.37). नीयमानासु is a *passive* present participle (शानच् on the
    passive stem नीय-), "being led." सन्तम् is the शतृ of अस्, "(him) being (a
    boy)." The perfect आविवेश "entered" carries the strange event — श्रद्धा,
    "faith," enters a child — and अमन्यत "he thought" (imperfect) hands us to his
    reflection in the next verse.
