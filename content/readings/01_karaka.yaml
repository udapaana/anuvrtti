- id: ex052
  segment: 70
  sentence: ग्रामं गच्छति।
  translation: He goes to the village.
  teaches: 'गत्यर्थ — with a verb of motion, the goal (कर्म) takes द्वितीया'
  words:
  - form: ग्रामं
    gloss: to the village (the goal)
    notes:
    - term: कर्मन्
      en: the goal of motion is treated as the object
    - cite: 1.4.49
      role: कर्तुरीप्सिततमं कर्म → the most-desired goal is कर्मन्
    - cite: 2.3.12
      role: गत्यर्थकर्मणि द्वितीयाचतुर्थ्यौ — with a motion-verb the goal takes द्वितीया (or चतुर्थी)
    - term: द्वितीया
      en: accusative
    - text: ग्रामम् → ग्रामं (final म् → anusvāra before ग)
  - form: गच्छति
    lemma: गम्
    gloss: goes
    notes:
    - term: गम्
      en: '"go"'
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
    - cite: 3.2.123
      role: वर्तमाने लट् → present
  vyakhya: गत्यर्थस्य धातोः कर्म गन्तव्यं द्वितीयायाम्। ग्रामो गन्तव्यः, अतः ग्रामम्।
  vyakhya_en: |
    A verb of motion (गम् "go") makes its destination the कर्मन् — the goal one most wants to reach (1.4.49) — and that takes the accusative (2.3.12). So "go TO the village" is simply ग्रामम् (acc.), no preposition needed. The same rule allows चतुर्थी (a dative of goal) in Vedic and poetry; classical prose prefers द्वितीया.

- id: ex053
  segment: 70
  sentence: मासम् अधीते।
  translation: He studies for a month.
  teaches: 'अत्यन्तसंयोग — unbroken extent of time/space takes द्वितीया'
  words:
  - form: मासम्
    gloss: for a (whole) month
    notes:
    - term: कर्मन्
      en: extent — the span over which the action runs without break
    - cite: 2.3.5
      role: कालाध्वनोरत्यन्तसंयोगे — a word of time or distance spanning an unbroken stretch takes द्वितीया
    - term: द्वितीया
      en: accusative
  - form: अधीते
    lemma: इ
    gloss: studies, recites
    notes:
    - term: इ
      en: 'अधि + इ "study" (आत्मनेपद)'
    - term: लट्
      en: present
  vyakhya: कालस्य अध्वनश्च अत्यन्तसंयोगे द्वितीया। मासम् इति कालपरिमाणम्।
  vyakhya_en: |
    Duration and distance, when the action fills the whole stretch without a gap, stand in the accusative (2.3.5) — मासम् "(for) a month," क्रोशम् "(for) a krośa of road." Not "to a month" but "across the whole of it." This is why "he studies for a month" needs no "for": the bare accusative मासम् carries the span.

- id: ex054
  segment: 110
  sentence: पुत्रेण सह आगच्छति।
  translation: He comes with his son.
  teaches: 'सह — the accompanying (subordinate) word takes तृतीया'
  words:
  - form: पुत्रेण
    gloss: with the son
    notes:
    - term: करण
      en: here the तृतीया of accompaniment, not instrument
    - cite: 2.3.19
      role: सहयुक्तेऽप्रधाने — with सह, the accompanier (the non-principal) takes तृतीया
    - term: तृतीया
      en: instrumental
  - form: सह
    gloss: with, together with
    notes:
    - term: अव्यय
      en: indeclinable governing the तृतीया
  - form: आगच्छति
    lemma: गम्
    gloss: comes
    notes:
    - term: गम्
      en: 'आ + गम् "come"'
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  vyakhya: सहयोगे अप्रधानं तृतीयायाम्। पिता प्रधानम्, पुत्रः अप्रधानः — अतः पुत्रेण।
  vyakhya_en: |
    "With" (सह) puts the companion — the *subordinate* party, not the principal — in the instrumental (2.3.19). The father is the principal (he is the agent who comes); the son merely accompanies, so the son is पुत्रेण, तृतीया. One case (तृतीया) thus carries two senses you now hold: instrument (by) and accompaniment (with).

- id: ex055
  segment: 110
  sentence: धनेन कुलम्।
  translation: A family (is honored) on account of wealth.
  teaches: 'हेतु — the cause/motive takes तृतीया'
  words:
  - form: धनेन
    gloss: on account of wealth, because of wealth
    notes:
    - term: हेतु
      en: cause — the reason for which something happens
    - cite: 2.3.23
      role: हेतौ — a word denoting the cause takes तृतीया (विद्यया यशः, धनेन कुलम्)
    - term: तृतीया
      en: instrumental
  - form: कुलम्
    gloss: the family
    notes:
    - term: कर्तृ
      en: subject (of an understood "is honored / rises")
    - term: प्रथमा
      en: nominative
  vyakhya: हेतौ तृतीया। धनं हेतुः, तेन कुलम् उन्नतम् — धनेन।
  vyakhya_en: |
    The cause or motive — "because of X" — takes the instrumental (2.3.23). विद्यया यशः "fame through learning," धनेन कुलम् "a family (raised) by wealth." It is the same तृतीया as instrument and accompaniment, now in a third sense: the reason. Note how much one case-ending does — the reader must read the *sense* from context, not the form alone.

- id: ex056
  segment: 120
  sentence: धनेन विना दुःखम्।
  translation: Without wealth, (there is) sorrow.
  teaches: 'विना — "without" takes तृतीया (optionally पञ्चमी/द्वितीया)'
  words:
  - form: धनेन
    gloss: without wealth
    notes:
    - term: करण
      en: the तृतीया governed by विना
    - cite: 2.3.32
      role: पृथग्विनानानाभिस्तृतीयान्यतरस्याम् — with पृथक्/विना/नाना the word takes तृतीया (also पञ्चमी, द्वितीया)
    - term: तृतीया
      en: instrumental
  - form: विना
    gloss: without
    notes:
    - term: अव्यय
      en: indeclinable — "without, apart from"
  - form: दुःखम्
    gloss: sorrow
    notes:
    - cite: "7.1.24"
      role: अतोऽम् — the neuter अ-stem takes अम् in प्रथमा and द्वितीया → दुःखम्
    - term: कर्तृ
      en: subject (of an understood "is/arises")
    - term: प्रथमा
      en: nominative
    - term: नपुंसक
      en: neuter
  vyakhya: विना-योगे तृतीया अन्यतरस्याम्। धनेन विना, धनाद् विना, धनं विना — त्रयं साधु।
  vyakhya_en: |
    पृथक्, विना, and नाना — all meaning "apart / without" — govern the instrumental, *optionally* (अन्यतरस्याम्, 2.3.32); the genitive… no, the ablative (पञ्चमी) and accusative are also allowed. So धनेन विना = धनाद् विना = धनं विना, all correct. The optionality (विभाषा / अन्यतरस्याम्) is itself a feature to notice: Pāṇini often sanctions more than one form.

- id: ex057
  segment: 120
  sentence: ग्रामात् पर्वतो दूरे।
  translation: The mountain is far from the village.
  teaches: 'अपादान/पञ्चमी for separation-distance — "from"'
  words:
  - form: ग्रामात्
    gloss: from the village
    notes:
    - term: अपादान
      en: the fixed point from which distance is measured
    - cite: 1.4.24
      role: ध्रुवमपायेऽपादानम् — the fixed source-point is अपादान
    - cite: 2.3.28
      role: अपादाने पञ्चमी → ग्रामात्
    - term: पञ्चमी
      en: ablative
  - form: पर्वतो
    lemma: पर्वत
    gloss: the mountain
    notes:
    - term: कर्तृ
      en: subject
    - term: प्रथमा
      en: nominative (पर्वतः → पर्वतो)
  - form: दूरे
    gloss: far (away)
    notes:
    - term: अधिकरण
      en: locus / adverbial — "at a distance"
    - cite: 2.3.36
      role: सप्तम्यधिकरणे च → दूरे (सप्तमी)
    - term: सप्तमी
      en: locative
  - form: पर्वतः
    gloss: the mountain
    notes:
    - term: कर्तृ
      en: subject
    - term: प्रथमा
      en: nominative
    - text: पर्वतः → पर्वतो before the voiced द (visarga सन्धि)
  vyakhya: अपायस्य ध्रुवम् अपादानम्, तस्मिन् पञ्चमी। ग्रामो ध्रुवः, ततो दूरम् — ग्रामात्।
  vyakhya_en: |
    The ablative (पञ्चमी) marks the fixed point one moves or measures *from* (1.4.24, 2.3.28). With words of distance — दूरे "far," अन्तिके "near" — the reference point stands in the ablative: ग्रामात् "from the village." You met पञ्चमी as "from" in विनयाद् याति; here it is spatial separation, the rule's core sense.

- id: ex058
  segment: 130
  sentence: सूर्ये उदिते कमलं विकसति।
  translation: When the sun has risen, the lotus opens.
  teaches: 'सति सप्तमी — the locative absolute: one act marking the time of another'
  words:
  - form: सूर्ये
    gloss: when the sun (is/has)
    notes:
    - term: अधिकरण
      en: the locative-absolute subject — its action marks the time
    - cite: 2.3.37
      role: यस्य च भावेन भावलक्षणम् — that whose action marks another's time takes सप्तमी
    - term: सप्तमी
      en: locative
  - form: उदिते
    gloss: having risen
    notes:
    - term: कृदन्त
      en: a past participle (क्त), agreeing with सूर्ये in सप्तमी
    - term: सप्तमी
      en: locative
    - text: उद् + इ → उदित "risen"
  - form: कमलं
    gloss: the lotus
    notes:
    - term: कर्तृ
      en: subject of the main clause
    - term: प्रथमा
      en: nominative
    - term: नपुंसक
      en: neuter
  - form: विकसति
    lemma: कस्
    gloss: opens, blossoms
    notes:
    - term: कस्
      en: 'वि + कस् "open out"'
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  vyakhya: यस्य भावेन अन्यस्य भावः लक्ष्यते, तत्र सप्तमी — सति सप्तमी। सूर्ये उदिते इति कालः।
  vyakhya_en: |
    The "locative absolute" (सति सप्तमी): when one event fixes the *time* of another, the first stands — subject and participle together — in the locative (2.3.37). सूर्ये उदिते "the sun having risen" = "when the sun rose." It is Sanskrit's compact "when / while" clause: a noun + participle in सप्तमी, needing no conjunction.

- id: ex059
  segment: 130
  sentence: नरस्य कृतिः।
  translation: The man's doing / the deed of the man.
  teaches: 'कृत्-योग — with a कृत् noun, agent & object take षष्ठी'
  words:
  - form: नरस्य
    gloss: of the man (the doer)
    notes:
    - term: कर्तृ
      en: the agent, but expressed through षष्ठी before a कृत् noun
    - cite: 2.3.65
      role: कर्तृकर्मणोः कृति — before a कृत्-formed word, agent and object take षष्ठी
    - term: षष्ठी
      en: genitive
  - form: कृतिः
    gloss: the doing, the deed
    notes:
    - term: कृदन्त
      en: a कृत् noun (action-noun in क्तिन्) from कृ "do"
    - cite: 3.3.94
      role: स्त्रियां क्तिन् — the feminine action-noun in क्तिन् → कृति
    - term: प्रथमा
      en: nominative
  vyakhya: कृति उपपदे कर्तृकर्मणोः षष्ठी। नरः कर्ता, कृतिः कृत्, अतः नरस्य कृतिः।
  vyakhya_en: |
    When the head word is a कृत्-derivative (an action- or agent-noun built from a root), its agent and object are expressed by the genitive, not their usual cases (2.3.65). नरस्य कृतिः = "the man's deed" — नर is logically the doer, but before कृति (a कृत् noun) it takes षष्ठी. This is why "the seeing of the lotus" is कमलस्य दर्शनम्: the कृत् noun pulls everything into the genitive.

- id: ex119
  segment: 50
  sentence: शिष्यः उपाध्यायात् अधीते।
  translation: The pupil learns from the teacher.
  teaches: 'special government: in formal study, the teacher one learns from is अपादान → पञ्चमी'
  words:
  - form: शिष्यः
    lemma: शिष्य
    gloss: the pupil
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: उपाध्यायात्
    lemma: उपाध्याय
    gloss: from the teacher — the source of the learning
    notes:
    - term: अपादान
      en: source — the one from whom knowledge is received
    - cite: 1.4.29
      role: आख्यातोपयोगे — in formal learning, the source-teacher is अपादान
    - term: पञ्चमी
      en: ablative
    - cite: 2.3.28
      role: अपादाने पञ्चमी → उपाध्यायात्
  - form: अधीते
    lemma: इ
    gloss: learns, studies
    notes:
    - term: इ
      en: '"study" (अधि + इ, आत्मनेपद)'
    - term: लट्
      en: present
  vyakhya: आख्यातोपयोगे उपाध्यायः अपादानम्। उपाध्यायात् अधीते — न उपाध्यायम्।
  vyakhya_en: |
    In formal study (आख्यातोपयोगे), the teacher one receives knowledge from is named अपादान — the source of departure — so it takes the पञ्चमी, not the द्वितीया (1.4.29). उपाध्यायात् अधीते "learns from the teacher," parallel to "fears the wolves" (ex017): a special verb pins an unexpected case.
- id: ex120
  segment: 50
  sentence: बालाय मोदकः रोचते।
  translation: The sweet is pleasing to the boy.
  teaches: 'special government: with रुच् "please," the one pleased is सम्प्रदान → चतुर्थी'
  words:
  - form: बालाय
    lemma: बाल
    gloss: to the boy — the one pleased
    notes:
    - term: सम्प्रदान
      en: the one to whom (the thing) is pleasing
    - cite: 1.4.33
      role: रुच्यर्थानां प्रीयमाणः — with verbs of pleasing, the pleased one is सम्प्रदान
    - term: चतुर्थी
      en: dative
    - cite: 2.3.13
      role: चतुर्थी सम्प्रदाने → बालाय
  - form: मोदकः
    lemma: मोदक
    gloss: the sweet
    notes:
    - term: कर्तृ
      en: grammatical subject — the thing that pleases
    - term: प्रथमा
      en: nominative
  - form: रोचते
    lemma: रुच्
    gloss: is pleasing, pleases
    notes:
    - term: रुच्
      en: '"please, be agreeable" (आत्मनेपद)'
    - term: गुण
      en: the root vowel strengthens before शप् — रुच् → रोच्
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  vyakhya: रुच्यर्थे प्रीयमाणः सम्प्रदानम्। बालाय रोचते — यः प्रीयते सः चतुर्थ्याम्।
  vyakhya_en: |
    With रुच् "please," the one who is pleased is treated as सम्प्रदान, the recipient — so the boy stands in the चतुर्थी, not the प्रथमा (1.4.33). मोदकः रोचते बालाय literally "the sweet is-pleasing to-the-boy" — the English subject ("the boy likes the sweet") is the Sanskrit dative. The pleasing thing (मोदकः) is the nominative.
- id: ex121
  segment: 50
  sentence: बालः पुष्पेभ्यः स्पृहयति।
  translation: The boy longs for flowers.
  teaches: 'special government: with स्पृह् "desire," the desired thing is सम्प्रदान → चतुर्थी'
  words:
  - form: बालः
    lemma: बाल
    gloss: the boy
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: पुष्पेभ्यः
    lemma: पुष्प
    gloss: for the flowers — the thing desired
    notes:
    - term: सम्प्रदान
      en: the desired object, treated as the goal of longing
    - cite: 1.4.36
      role: स्पृहेरीप्सितः — with स्पृह्, the desired thing is सम्प्रदान
    - term: चतुर्थी
      en: dative
    - cite: 2.3.13
      role: चतुर्थी सम्प्रदाने → पुष्पेभ्यः
    - term: बहुवचन
      en: plural
  - form: स्पृहयति
    lemma: स्पृह्
    gloss: longs for, desires
    notes:
    - term: स्पृह्
      en: '"desire, long for"'
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  vyakhya: स्पृहेः ईप्सितः सम्प्रदानम्। पुष्पेभ्यः स्पृहयति — न पुष्पाणि।
  vyakhya_en: |
    One expects the desired thing to be the object (कर्मन्, द्वितीया). But with स्पृह् "long for," Pāṇini names the desired thing सम्प्रदान — so it takes the चतुर्थी: पुष्पेभ्यः स्पृहयति "longs for flowers," not पुष्पाणि (1.4.36). Compare रुच् in ex120: a whole family of emotion-verbs routes their target through the dative.
- id: ex122
  segment: 50
  sentence: बालः नृपाय क्रुध्यति।
  translation: The boy is angry at the king.
  teaches: 'special government: the target of क्रुध् "be angry" is सम्प्रदान → चतुर्थी'
  words:
  - form: बालः
    lemma: बाल
    gloss: the boy
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: नृपाय
    lemma: नृप
    gloss: at the king — the target of the anger
    notes:
    - term: सम्प्रदान
      en: the one the anger is directed toward
    - cite: 1.4.37
      role: क्रुधद्रुहेर्ष्याऽसूयार्थानां यं प्रति कोपः — the target of anger is सम्प्रदान
    - term: चतुर्थी
      en: dative
    - cite: 2.3.13
      role: चतुर्थी सम्प्रदाने → नृपाय
  - form: क्रुध्यति
    lemma: क्रुध्
    gloss: is angry
    notes:
    - term: क्रुध्
      en: '"be angry"'
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  vyakhya: क्रुधेः यं प्रति कोपः स सम्प्रदानम्। नृपाय क्रुध्यति — चतुर्थ्याम्।
  vyakhya_en: |
    With क्रुध् "be angry" (and द्रुह् "harm," ईर्ष्या "envy," असूया "resent"), the one toward whom the feeling is aimed is सम्प्रदान — so it takes the चतुर्थी: नृपाय क्रुध्यति "is angry at the king" (1.4.37). The very next sūtra (ex123) shows what a preverb does to this — watch the case change.
- id: ex123
  segment: 50
  sentence: बालः नृपम् अभिक्रुध्यति।
  translation: The boy rages against the king.
  teaches: 'add a preverb to क्रुध् and the target shifts to कर्मन् → द्वितीया'
  words:
  - form: बालः
    lemma: बाल
    gloss: the boy
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: नृपम्
    lemma: नृप
    gloss: the king — now the direct object
    notes:
    - term: कर्मन्
      en: object — when क्रुध् carries a preverb, the target becomes कर्मन्
    - cite: 1.4.38
      role: क्रुधद्रुहोरुपसृष्टयोः कर्म — with a preverb, the target of क्रुध्/द्रुह् is कर्मन्
    - term: द्वितीया
      en: accusative
    - cite: 2.3.2
      role: कर्मणि द्वितीया → नृपम्
  - form: अभिक्रुध्यति
    lemma: क्रुध्
    gloss: rages against
    notes:
    - term: क्रुध्
      en: '"be angry," here with the preverb अभि'
    - term: उपसर्ग
      en: अभि — the preverb that flips the government
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  vyakhya: उपसृष्टे क्रुधौ यं प्रति कोपः तत् कर्म। अभिक्रुध्यति नृपम् — द्वितीयायाम्, न चतुर्थ्याम्।
  vyakhya_en: |
    The same verb क्रुध्, the same target — but add the preverb अभि and the case changes. Without a preverb the target is सम्प्रदान (चतुर्थी: नृपाय, ex122); WITH one it becomes a plain कर्मन् (द्वितीया: नृपम्), by 1.4.38. The minimal pair नृपाय क्रुध्यति / नृपम् अभिक्रुध्यति is Pāṇini's own demonstration that an उपसर्ग can rewrite कारक-assignment.
- id: ex124
  segment: 50
  sentence: मुनिः गिरिम् अधिशेते।
  translation: The sage lies upon the mountain.
  teaches: 'special government: with अधि + शी/स्था/आस्, the locus becomes कर्मन् → द्वितीया (not सप्तमी)'
  words:
  - form: मुनिः
    lemma: मुनि
    gloss: the sage
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: गिरिम्
    lemma: गिरि
    gloss: the mountain — the resting-place, here as object
    notes:
    - term: कर्मन्
      en: the locus, but treated as कर्मन् because of अधि + शी
    - cite: 1.4.46
      role: अधिशीङ्स्थाऽऽसां कर्म — with अधि+शी/स्था/आस्, the site is कर्मन्
    - term: द्वितीया
      en: accusative
    - cite: 2.3.2
      role: कर्मणि द्वितीया → गिरिम्
  - form: अधिशेते
    lemma: शी
    gloss: lies upon
    notes:
    - term: शी
      en: '"lie," here with the preverb अधि (आत्मनेपद)'
    - term: उपसर्ग
      en: अधि — makes the resting-site a कर्मन्
    - term: लट्
      en: present
  vyakhya: अधिपूर्वस्य शीङः आधारः कर्म। गिरिम् अधिशेते — द्वितीयायाम्, न गिरौ।
  vyakhya_en: |
    A resting-place is normally अधिकरण, taking the सप्तमी (गिरौ "on the mountain"). But after अधि, the verbs शी "lie," स्था "stand," and आस् "sit" take that very location as their कर्मन् — so it shifts to the द्वितीया: गिरिम् अधिशेते "lies upon the mountain" (1.4.46). Another case where the preverb, not the noun's role, decides the ending.

- id: ex125
  segment: 50
  sentence: माता पुत्रात् निलीयते।
  translation: The mother hides from her son.
  teaches: 'special government: the one you hide from — whose sight you avoid — is अपादान → पञ्चमी'
  words:
  - form: माता
    lemma: मातृ
    gloss: the mother
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: पुत्रात्
    lemma: पुत्र
    gloss: from the son — the one whose sight is avoided
    notes:
    - term: अपादान
      en: source — the one one withdraws from sight of
    - cite: 1.4.28
      role: अन्तर्द्धौ येनादर्शनमिच्छति — in hiding, the one you avoid being seen by is अपादान
    - term: पञ्चमी
      en: ablative
    - cite: 2.3.28
      role: अपादाने पञ्चमी → पुत्रात्
  - form: निलीयते
    lemma: ली
    gloss: hides
    notes:
    - term: ली
      en: '"hide, cling" (नि + ली, आत्मनेपद)'
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  vyakhya: अन्तर्द्धौ यस्मात् अदर्शनम् इच्छति तत् अपादानम्। पुत्रात् निलीयते — न पुत्रम्।
  vyakhya_en: |
    When you hide, the person you want NOT to be seen by is named अपादान — a point of withdrawal — so it takes the पञ्चमी (1.4.28). पुत्रात् निलीयते "hides from the son." Like the feared thing (ex017) and the teacher learned-from (ex119), this is अपादान stretched past literal motion: hiding is a kind of moving-away-from-sight.
- id: ex126
  segment: 50
  sentence: हिमवतः गङ्गा प्रभवति।
  translation: The Gaṅgā arises from the Himālaya.
  teaches: 'special government: with भू "arise," the source the agent springs from is अपादान → पञ्चमी'
  words:
  - form: हिमवतः
    lemma: हिमवत्
    gloss: from the Himālaya — the source of arising
    notes:
    - term: अपादान
      en: source — the origin the river springs from
    - cite: 1.4.31
      role: भुवः प्रभवः — with भू (arise), the source is अपादान
    - term: पञ्चमी
      en: ablative
    - cite: 2.3.28
      role: अपादाने पञ्चमी → हिमवतः
  - form: गङ्गा
    lemma: गङ्गा
    gloss: the Gaṅgā
    notes:
    - term: कर्तृ
      en: agent — the one that arises
    - term: प्रथमा
      en: nominative
  - form: प्रभवति
    lemma: भू
    gloss: arises, originates
    notes:
    - term: भू
      en: '"be, arise" (प्र + भू)'
    - term: गुण
      en: the root vowel strengthens before शप् — भू → भो → भव्
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  vyakhya: भुवः प्रभवः अपादानम्। हिमवतः गङ्गा प्रभवति — स्रोतसः उद्गमः पञ्चम्याम्।
  vyakhya_en: |
    With प्र + भू "arise, originate," the source the subject springs from is अपादान, in the पञ्चमी (1.4.31). हिमवतः गङ्गा प्रभवति "the Gaṅgā arises from the Himālaya." The river is the agent (नominative); its mountain-source is the point-of-departure. The same logic names the wax-source with जन् "be born" (1.4.30).
- id: ex127
  segment: 50
  sentence: शिष्यः गुरवे श्लाघते।
  translation: The pupil flatters the teacher.
  teaches: 'special government: with श्लाघ् "flatter," the one whose favour is courted is सम्प्रदान → चतुर्थी'
  words:
  - form: शिष्यः
    lemma: शिष्य
    gloss: the pupil
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: गुरवे
    lemma: गुरु
    gloss: to the teacher — the one whose favour is sought
    notes:
    - term: सम्प्रदान
      en: the one toward whom the flattery is aimed
    - cite: 1.4.34
      role: श्लाघह्नुङ्स्थाशपां ज्ञीप्स्यमानः — with श्लाघ् etc., the courted one is सम्प्रदान
    - term: चतुर्थी
      en: dative
    - cite: 2.3.13
      role: चतुर्थी सम्प्रदाने → गुरवे
  - form: श्लाघते
    lemma: श्लाघ्
    gloss: flatters, praises (to win favour)
    notes:
    - term: श्लाघ्
      en: '"flatter, extol" (आत्मनेपद)'
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  vyakhya: श्लाघादीनां ज्ञीप्स्यमानः सम्प्रदानम्। गुरवे श्लाघते — यस्य प्रसादम् इच्छति सः चतुर्थ्याम्।
  vyakhya_en: |
    With श्लाघ् "flatter," ह्नु "deny to," स्था "present oneself to," शप् "swear to," the person whose favour or notice is being courted (ज्ञीप्स्यमान) is सम्प्रदान — the चतुर्थी (1.4.34). गुरवे श्लाघते "flatters the teacher," i.e. praises him to win his good will. Another emotion/attitude verb that routes its target through the dative, like रुच् and क्रुध् (ex120, ex122).
- id: ex128
  segment: 50
  sentence: गोपः गां पयः दोग्धि।
  translation: The cowherd milks milk from the cow.
  teaches: 'अकथितं च: an unstated कारक (here the source, the cow) becomes a second कर्मन् → द्वितीया (a double-accusative verb)'
  words:
  - form: गोपः
    lemma: गोप
    gloss: the cowherd
    notes:
    - term: कर्तृ
      en: agent
    - term: प्रथमा
      en: nominative
  - form: गाम्
    lemma: गो
    gloss: the cow — the source, but here a second object
    notes:
    - term: कर्मन्
      en: the source (cow), unstated as अपादान, so taken as कर्मन्
    - cite: 1.4.51
      role: अकथितं च — a कारक not pinned to another role is taken as कर्मन्
    - term: द्वितीया
      en: accusative
    - cite: 2.3.2
      role: कर्मणि द्वितीया → गाम्
  - form: पयः
    lemma: पयस्
    gloss: milk — the primary object
    notes:
    - term: कर्मन्
      en: the primary object — what is drawn out
    - cite: 2.3.2
      role: कर्मणि द्वितीया → पयः
    - term: द्वितीया
      en: accusative
  - form: दोग्धि
    lemma: दुह्
    gloss: milks
    notes:
    - term: दुह्
      en: '"milk, draw out"'
    - term: लट्
      en: present
  vyakhya: दुह्यादीनां द्विकर्मकत्वम्। गौः अपादानम् इव, किन्तु अकथितत्वात् कर्म। गां पयः दोग्धि — द्वे द्वितीये।
  vyakhya_en: |
    A handful of verbs (दुह् "milk," याच् "ask," etc.) take TWO accusatives. The cow is really the source (one would expect अपादान, पञ्चमी), but since that role is left unstated, by अकथितं च it is simply taken as a कर्मन् — so BOTH the cow and the milk stand in the द्वितीया: गां पयः दोग्धि "milks milk from-the-cow." This is the first double-accusative in the reader.
- id: ex129
  segment: 50
  sentence: गुरुः शिष्यं ग्रामं गमयति।
  translation: The teacher makes the pupil go to the village.
  teaches: 'causative णिच्: in the causative of a motion-verb, the underlying agent (the goer) becomes a कर्मन् → द्वितीया'
  words:
  - form: गुरुः
    lemma: गुरु
    gloss: the teacher — the causer
    notes:
    - term: कर्तृ
      en: agent of the causative (the प्रयोजक, the one who makes it happen)
    - term: प्रथमा
      en: nominative
  - form: शिष्यम्
    lemma: शिष्य
    gloss: the pupil — the one made to go
    notes:
    - term: कर्मन्
      en: the underlying goer, now object of the causative
    - cite: 1.4.52
      role: गतिबुद्धि…अणि कर्ता स णौ — the base-agent of a motion/knowing verb becomes कर्मन् in the causative
    - term: द्वितीया
      en: accusative
    - cite: 2.3.2
      role: कर्मणि द्वितीया → शिष्यम्
  - form: ग्रामम्
    lemma: ग्राम
    gloss: to the village — the goal of motion
    notes:
    - term: कर्मन्
      en: goal of motion (the original object of गम्)
    - cite: 2.3.2
      role: कर्मणि द्वितीया → ग्रामम्
    - term: द्वितीया
      en: accusative
  - form: गमयति
    lemma: गम्
    gloss: makes (one) go
    notes:
    - term: गम्
      en: '"go," here CAUSATIVE गमि "make go"'
    - cite: 3.1.26
      role: हेतुमति च — the causative affix णिच् → गमयति
    - term: णिच्
      en: the causative suffix
    - term: लट्
      en: present
  vyakhya: गत्यर्थस्य अणि कर्ता णौ कर्म। गमयति शिष्यं — यः गन्ता सः कर्म। ग्रामम् अपि कर्म।
  vyakhya_en: |
    Make a verb causative (णिच्, 3.1.26: गम् → गमि "make go") and a new agent appears — the causer. For verbs of MOTION, knowing, and eating, the original agent (the one who actually goes) is demoted to कर्मन्, taking the द्वितीया (1.4.52). गुरुः शिष्यं ग्रामं गमयति "the teacher makes the pupil go to the village" — two accusatives: शिष्यम् (the demoted goer) and ग्रामम् (the goal). The first causative in the reader.
- id: ex130
  segment: 50
  sentence: स्वामी दासेन भारं वाहयति।
  translation: The master makes the servant carry the load.
  teaches: 'हेतु / causative: with a non-motion verb, the prompted base-agent is हेतु and stands in the करण → तृतीया'
  words:
  - form: स्वामी
    lemma: स्वामिन्
    gloss: the master — the causer
    notes:
    - term: कर्तृ
      en: agent of the causative (the प्रयोजक)
    - term: प्रथमा
      en: nominative
  - form: दासेन
    lemma: दास
    gloss: by the servant — the one made to carry
    notes:
    - term: हेतु
      en: the prompted base-agent (the actual carrier), treated as करण
    - cite: 1.4.55
      role: तत्प्रयोजको हेतुश्च — the driver of the कर्तृ is हेतु (a करण)
    - cite: 1.4.42
      role: साधकतमं करणम् — the most effective means is करण
    - term: तृतीया
      en: instrumental
    - cite: 2.3.18
      role: कर्तृकरणयोस्तृतीया → दासेन
  - form: भारम्
    lemma: भार
    gloss: the load — what is carried
    notes:
    - term: कर्मन्
      en: object — what is carried
    - cite: 2.3.2
      role: कर्मणि द्वितीया → भारम्
    - term: द्वितीया
      en: accusative
  - form: वाहयति
    lemma: वह्
    gloss: makes (one) carry
    notes:
    - term: वह्
      en: '"carry," here CAUSATIVE वाहि "make carry"'
    - cite: 3.1.26
      role: हेतुमति च — the causative affix णिच् → वाहयति
    - term: णिच्
      en: the causative suffix
    - term: लट्
      en: present
  vyakhya: अगत्यर्थे प्रयोज्यः कर्ता हेतुः, करणत्वात् तृतीयायाम्। दासेन वाहयति — न दासम्।
  vyakhya_en: |
    Contrast ex129. With a NON-motion verb like वह् "carry," the causative does NOT demote the base-agent to कर्मन्; instead the prompted doer is हेतु — a kind of करण, the means by which the causer accomplishes the act — and takes the तृतीया (1.4.55 + 1.4.42). स्वामी दासेन भारं वाहयति "the master makes the servant carry the load," literally "...carries the load BY-the-servant." The minimal contrast ex129/ex130 — accusative goer vs instrumental causee — is the heart of causative कारक.

- id: ex166
  segment: 110
  sentence: अन्तरेण धर्मं न सुखम्।
  translation: Without dharma there is no happiness.
  teaches: 'word-government: अन्तरा / अन्तरेण ("between, without") govern the द्वितीया'
  words:
  - form: अन्तरेण
    lemma: अन्तरेण
    gloss: without, apart from
    notes:
    - term: अव्यय
      en: governs the accusative of what is excluded
  - form: धर्मम्
    lemma: धर्म
    gloss: dharma (the thing done-without)
    notes:
    - term: कर्मन्
      en: the word governed by अन्तरेण
    - cite: '2.3.4'
      role: अन्तराऽन्तरेण युक्ते — a word governed by अन्तरा/अन्तरेण takes the द्वितीया
    - term: द्वितीया
      en: accusative
  - form: न
    lemma: न
    gloss: not
    notes:
    - term: अव्यय
      en: negation
  - form: सुखम्
    lemma: सुख
    gloss: happiness
    notes:
    - term: कर्तृ
      en: subject (of the verbless clause)
    - term: प्रथमा
      en: nominative
  vyakhya: अन्तरेणयुक्ते द्वितीया। अन्तरेण धर्मं — न धर्मस्य, न धर्मेण।
  vyakhya_en: |
    Certain governing words fix a case by themselves. अन्तरा "between" and अन्तरेण "without, apart from" take the द्वितीया (2.3.4): अन्तरेण धर्मम् "without dharma." Not the genitive English suggests — the word अन्तरेण demands the accusative. A small class of indeclinables (विना, नाना, also) work this way; the word, not the role, sets the case.
- id: ex167
  segment: 110
  sentence: जटाभिः तापसः।
  translation: An ascetic, (recognizable) by his matted hair.
  teaches: 'इत्थंभूतलक्षणे — the mark by which someone is recognised takes the तृतीया'
  words:
  - form: जटाभिः
    lemma: जटा
    gloss: by (his) matted locks
    notes:
    - term: करण
      en: the recognizing mark — "known BY ___"
    - cite: '2.3.21'
      role: इत्थंभूतलक्षणे — the sign that marks someone as being in a state → तृतीया
    - term: तृतीया
      en: instrumental
  - form: तापसः
    lemma: तापस
    gloss: an ascetic
    notes:
    - term: कर्तृ
      en: the one so recognized
    - term: प्रथमा
      en: nominative
  vyakhya: इत्थंभूतस्य लक्षणे तृतीया। जटाभिः तापसः — जटा एव चिह्नम्।
  vyakhya_en: |
    The mark by which you recognize someone as being "thus" (इत्थंभूत) stands in the तृतीया (2.3.21). जटाभिः तापसः "an ascetic — (you know him) by his matted hair." The instrumental here is not an instrument of action but a sign of identification: अक्ष्णा काणः "one-eyed by (the bad) eye," जटाभिः तापसः. A distinct, idiomatic use of the third case.
- id: ex168
  segment: 110
  sentence: अन्नस्य हेतोः वसति।
  translation: He dwells (there) for the sake of food.
  teaches: 'षष्ठी हेतुप्रयोगे — when हेतु is used, both it and the cause stand in the षष्ठी'
  words:
  - form: अन्नस्य
    lemma: अन्न
    gloss: of food (the cause)
    notes:
    - term: हेतु
      en: the cause — here in the genitive because हेतु is used
    - cite: '2.3.26'
      role: षष्ठी हेतुप्रयोगे — with the word हेतु, the cause takes the षष्ठी
    - term: षष्ठी
      en: genitive
  - form: हेतोः
    lemma: हेतु
    gloss: for the sake of, by reason of
    notes:
    - text: 'हेतु itself stands in the षष्ठी, agreeing with the cause-word'
    - term: षष्ठी
      en: genitive
  - form: वसति
    lemma: वस्
    gloss: dwells
    notes:
    - term: वस्
      en: '"dwell"'
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  vyakhya: हेतुशब्दप्रयोगे कारणं हेतुश्च षष्ठ्याम्। अन्नस्य हेतोः — कारणे षष्ठी।
  vyakhya_en: |
    Cause is normally the तृतीया (धनेन "because of wealth," ex033). But when the explicit word हेतु "reason" is used, BOTH it and the cause it names go into the षष्ठी (2.3.26): अन्नस्य हेतोः "for the sake of food," literally "by-reason of-food." So किम् + हेतु → किं हेतोः "why," and the common कस्य हेतोः. The presence of हेतु re-cases the cause.
- id: ex169
  segment: 110
  sentence: ग्रामं दूरम् अपसरति।
  translation: He moves far from the village.
  teaches: 'दूरान्तिकार्थैः — words for "far" / "near" optionally take the द्वितीया for what they are far/near from'
  words:
  - form: ग्रामम्
    lemma: ग्राम
    gloss: from the village
    notes:
    - term: कर्मन्
      en: the reference point of "far", in the accusative
    - cite: '2.3.35'
      role: दूरान्तिकार्थेभ्यो द्वितीया च — with दूर/अन्तिक words, the द्वितीया (also षष्ठी/पञ्चमी)
    - term: द्वितीया
      en: accusative
  - form: दूरम्
    lemma: दूर
    gloss: far
    notes:
    - term: अव्यय
      en: '"far" — the दूरार्थ word governing ग्रामम्'
  - form: अपसरति
    lemma: सृ
    gloss: moves away
    notes:
    - term: सृ
      en: '"move" (अप + सृ)'
    - term: गुण
      en: the root vowel strengthens before शप् — सृ → सर्
    - term: शप्
      en: the thematic अ between root and ending
    - term: लट्
      en: present
  vyakhya: दूरान्तिकार्थैः द्वितीया (षष्ठी पञ्चमी च)। ग्रामं दूरम् — ग्रामस्य / ग्रामात् इति विकल्पः।
  vyakhya_en: |
    Words meaning "far" (दूर) and "near" (अन्तिक) let the reference point take the द्वितीया (2.3.35) — ग्रामं दूरम् "far from the village" — though षष्ठी (ग्रामस्य दूरम्) and पञ्चमी (ग्रामात् दूरम्) are also allowed. A rare case where one relation offers three cases; the speaker chooses. Distance, like time (ex056), bends the usual case-assignment.
- id: ex170
  segment: 110
  sentence: गवां स्वामी नृपः।
  translation: The king is the lord of the cattle.
  teaches: 'स्वामि-ईश्वरादिभिः — with "owner / lord / master" words, what is owned takes the षष्ठी (or सप्तमी)'
  words:
  - form: गवाम्
    lemma: गो
    gloss: of the cattle (the thing owned)
    notes:
    - term: सम्बन्ध
      en: what is owned — governed by स्वामिन्
    - cite: '2.3.39'
      role: स्वामीश्वराधिपति… — with स्वामिन्/ईश्वर/अधिपति etc., the related thing takes षष्ठी (also सप्तमी)
    - term: षष्ठी
      en: genitive plural
  - form: स्वामी
    lemma: स्वामिन्
    gloss: the lord, owner
    notes:
    - text: 'इन्-stem स्वामिन् → nom.sg स्वामी (न-lopa, as दण्डी ex139)'
    - term: कर्तृ
      en: predicate noun
    - term: प्रथमा
      en: nominative
  - form: नृपः
    lemma: नृप
    gloss: the king
    notes:
    - term: कर्तृ
      en: subject
    - term: प्रथमा
      en: nominative
  vyakhya: स्वाम्यादिभिः सम्बन्धिनः षष्ठी (सप्तमी वा)। गवां स्वामी — गोषु स्वामी इति वा।
  vyakhya_en: |
    With "owner, lord, master, heir, witness, guarantor" (स्वामिन्, ईश्वर, अधिपति, दायाद…), the thing owned or presided over takes the षष्ठी — or optionally the सप्तमी (2.3.39). गवां स्वामी "lord of the cattle" (= गोषु स्वामी). So धनस्य ईश्वरः / धने ईश्वरः "master of wealth": the relation-word offers genitive or locative, the speaker's choice. (Note स्वामी itself = the इन्-stem of ex139.)
- id: ex171
  segment: 110
  sentence: मातरि साधुः पुत्रः।
  translation: A son good (in his conduct) toward his mother.
  teaches: 'साधु-निपुणाभ्याम् — with "good / skilful (toward someone)" the person is in the सप्तमी'
  words:
  - form: मातरि
    lemma: मातृ
    gloss: toward (his) mother
    notes:
    - term: अधिकरण
      en: the person toward whom the conduct is directed → locative
    - cite: '2.3.43'
      role: साधुनिपुणाभ्यामर्चायां सप्तमी — with साधु/निपुण (good conduct toward), use सप्तमी
    - term: सप्तमी
      en: locative
  - form: साधुः
    lemma: साधु
    gloss: good, well-behaved (toward)
    notes:
    - term: विशेषण
      en: the quality-word governing मातरि
    - term: प्रथमा
      en: nominative
  - form: पुत्रः
    lemma: पुत्र
    gloss: the son
    notes:
    - term: कर्तृ
      en: subject
    - term: प्रथमा
      en: nominative
  vyakhya: साधुनिपुणयोः अर्चायां सप्तमी। मातरि साधुः — यं प्रति सौजन्यम्।
  vyakhya_en: |
    With साधु "good (in behaviour)" and निपुण "adept," when the sense is right conduct TOWARD someone (अर्चा), that person stands in the सप्तमी (2.3.43): मातरि साधुः "good toward his mother," पितरि निपुणः "attentive to his father." Not the dative one might expect — the locative marks the object of one's good conduct. With ex166–171 the कारक.vibhakti reference now spans the idiomatic case-government rules, not just the core six.
