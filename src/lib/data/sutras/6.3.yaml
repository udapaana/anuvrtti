- id: '63109'
  ref: 6.3.109
  a: 6
  p: 3
  n: 109
  s: पृषोदरादीनि यथोपदिष्टम्
  iast: pṛṣodarādīni yathopadiṣṭam
  type: V
  typeName: vidhi
  pada:
  - पृषोदरादीनि
  - यथोपदिष्टम्
  adhikara: उत्तरपदे
  inherits: []
  feeds: []
  meaning: ''
  kashika: "पृषोदरप्रकाराणि शब्दरूपाणि, येषु लोपागमवर्णविकाराःशास्त्रेण न विहिता दृश्यन्ते च, तानि यथोपदिष्टानि\
    \ साधूनि भवन्ति। यानियानि यथोपदिष्टानि शिष्टैरुच्चारितानि प्रयुक्तानि, तानि तथैवानुगन्तव्यानि। पृषदुदरं\
    \ यस्य पृषोदरम्। पृषद् उद्वानं यस्य पृषोद्वानम्। अत्र तकारलोपो भवति। वारिवाहको बलाहकः। पूर्वशब्दस्य\
    \ बशब्द आदेश उत्तरपदादेश्च लत्वम्। जीवनस्य मूतो जीमूतः। वनशब्दस्य लोपः। शवानां शयनं श्मशानम्। शवशब्दस्य\
    \ श्मादेशः। शयनशब्दस्यापि शानशब्द आदेशः। ऊर्ध्वं खमस्येति उलूखलम्। ऊर्ध्वखशब्दयोरुलू खल इत्येतावादेशौ\
    \ भवतः। पिशिताशः पिशाचः। पिशिताशशब्दयोर्यथायोगं पिशाचशब्दावादेशौ। ब्रुवन्तोऽस्यां सीदन्तीति बृसी।\
    \ सदेरधिकरणे डट् प्रत्ययः। ब्रुवच्छब्दस्य चोपपदस्य बृशब्द आदेशो भवति। मह्यां रौतीति मयूरः। रौतेरचि\
    \ टिलोपः। महीशब्दस्य मयूभावः। एवमन्येऽपि अश्वत्थकपित्थमहित्थप्रभृतयो यथायोगमनुगन्तव्याः॥ दिक्शब्देभ्य\
    \ उत्तरस्य तीरस्य तारभावो वा भवति॥ दक्षिणतीरम्, दक्षिणतारम्। उत्तरतीरम्, उत्तरतारम्॥ वाचो वादे डत्वं\
    \ च लभावश्चोत्तरपदस्येञि प्रत्यये भवति॥ वाचं वदतीति वाग्वादः। तस्यापत्यं वाड्वालिः॥ षष उत्वं दतृदशधासूत्तरपदादेः\
    \ ष्टुत्वं च भवति॥ षड् दन्ता अस्य षोडन्। षट् च दश च षोडश॥ धासु वा षष उत्वं भवत्युत्तरपदादेश्च ष्टुत्वम्॥\
    \ षोढा, षड्धा कुरु। बहुवचननिर्देशो नानाधिकरणवाचिनो धाशब्दस्य प्रतिपत्त्यर्थः। इह मा भूत् — षड् दधाति\
    \ धयति वा षड्धेति॥ दुरो दाशनाशदभध्येषूत्वं वक्तव्यमुत्तरपदादेश्च ष्टुत्वम्॥ कृच्छे्रण दाश्यते नाश्यते\
    \ दभ्यते च यः, स दू॒डाशः॑ (शौ०सं० १.१३.१)। दू॒णाशः॑ (ऋ० ७.३२.७)। दू॒डभ॑(ऋ० ४.९.८)। दम्भेः खल्यनुनासिकलोपो१\
    \ निपातनात्। दुष्टं ध्यायतीति दू॒ढ्यः॑ (ऋ० ८.७५.९)। दुःशब्दोपपदस्य ध्यायतेः <<आतश्चोपसर्गे>> [[३.१.१३६]]\
    \ इति कप्रत्ययः॥ स्वरो रोहतौ छन्दस्युत्वं वक्त व्यम्॥ जा॒य ए॒हि॒ स्वो रो॒हाव (श०ब्रा० ५.२.१.१०)॥ पीवोपवसनादीनां\
    \ च लोपो वक्तव्यः॥ पीवो॑पवसनानाम् (मा०सं० २१.४३)। पयोपवसनानाम्। \n\nवर्णागमो वर्णविपर्ययश्च द्वौ चापरौ\
    \ वर्णविकारनाशौ।\n\nधातोस्तदर्थातिशयेन योगस्तदुच्यते पञ्चविधं निरुक्त म्॥"
  vartika:
  - दिक्शब्देभ्यस्तीरस्य तारभावो वा ।
  - षष उत्वं दतृदशधासूत्तरपदादेः ष्टुत्वं च ।
  - धासु वेति वाच्यम् ।
  - दुरो दाशनाशदभध्येषूत्वमुत्तरपदादेः ष्टुत्वं च ।
  - स्वरो रोहतौ छन्दस्युत्वम् ।
  - पीवोपवसनादीनां छन्दसि लोपः ।
  rule: |-
    In **पृषोदर** and the like, the elisions, augments, and letter-changes that the learned actually pronounce hold good as they pronounce them, even though no rule specifies them.
- id: '63110'
  ref: 6.3.110
  a: 6
  p: 3
  n: 110
  s: संख्याविसायपूर्वस्याह्नस्याहन्नन्यतरस्यां ङौ
  iast: saṃkhyāvisāyapūrvasyāhnasyāhannanyatarasyāṃ ṅau
  type: V
  typeName: vidhi
  pada:
  - संख्या-वि-साय-पूर्वस्य
  - अह्नस्य
  - अहन्
  - अन्यतरस्याम्
  - ङौ
  adhikara: उत्तरपदे
  inherits: []
  feeds: []
  meaning: |-
    When the word अह्न appears as an उत्तरपद in a समास where the पूर्वपद is either a number, or the words वि or साय, it is optionally converted to अहन् in presence of the प्रत्यय ङि.
  kashika: |-
    संख्या वि साय इत्येवंपूर्वस्याह्नशब्दस्य स्थानेऽहनित्ययमादेशो भवत्यन्यतरस्यां ङौ परतः। द्वयोरह्नोर्भवो द्व्यह्नः। त्र्यह्नः। द्व्यह्नि, द्व्यहनि। त्र्यह्नि, त्र्यहनि। द्व्यह्ने। त्र्यह्ने। व्यपगतमहो व्यह्नः। व्यह्नि, व्यहनि, व्यह्ने। सायमह्नः सायाह्नः। सायाह्नि, सायाहनि, सायाह्ने। एकदेशिसमासः पूर्वादिभ्योऽन्यस्यापि भवतीत्येतदेव विसायपूर्वस्याह्नस्य ग्रहणं ज्ञापकम्। तेन मध्यमह्नो मध्याह्न इत्यपि भवति। संख्याविसायपूर्वस्येति किम्? पूर्वाह्णे। अपराह्णे॥
  vartika: []
  rule: |-
    After a numeral, **वि**, or **साय**, **अह्न** optionally becomes **अहन्** in the locative singular (ङि).
