    तीर्थशब्द उत्तरपदे यत्प्रत्ययपरे परतः समानस्य स इत्ययमादेशो भवति। सतीर्थ्यः। <<समानतीर्थ वासी>> [[४.४.१०७]] इति यत् प्रत्ययः॥
  vartika: []
  rule: |-
    **समान** becomes **स** before **तीर्थ** when the **यत्** affix is added: सतीर्थ्यः.
