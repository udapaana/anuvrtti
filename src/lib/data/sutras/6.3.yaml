  iast: aṣaṣṭhyatṛtīyāsthasyānyasya dugāśīrāśā''sthā''sthitotsukotikārakarāgaccheṣu
  type: V
  typeName: vidhi
  pada:
  - अषष्ठी-अतृतीयास्थस्य
  - अन्यस्य
  - दुक्
  - आशीर्-आशा-आस्था-आस्थित-उत्सुक-उति-कारक-राग-च्छेषु
  adhikara: उत्तरपदे
  inherits: []
  feeds:
  - word: अषष्ठी-अतृतीयास्थस्य
    to: 6.3.100
  - word: दुक्
    to: 6.3.100
  meaning: ''
  kashika: "अषष्ठीस्थस्य अतृतीयास्थस्य चान्यशब्दस्य दुगागमो भवति आशिस् आशा आस्था आस्थित उत्सुक ऊति कारक\
    \ राग छ इत्येतेषु परतः। अन्या आशीः अन्यदाशीः। अन्या आशा अन्यदाशा। अन्या आस्था अन्यदास्था। अन्य आस्थितः\
    \ अन्यदास्थितः। अन्य उत्सुकः अन्यदुत्सुकः। अन्या ऊतिः अन्यदूतिः। अन्यः कारकः अन्यत्कारकः। अन्यो रागः\
    \ अन्यद्रागः। अन्यस्मिन् भवोऽन्यदीयः। गहादिषु [[४.२.१३८]] अन्यशब्दो द्रष्टव्यः। अषष्ठ्यतृतीयास्थस्येति\
    \ किम्? अन्यस्य आशीः अन्याशीः। अन्येन आस्थितः अन्यास्थितः। \n\nदुगागमोऽविशेषेण वक्त व्यः कारकच्छयोः।\n\
    \nषष्ठीतृतीययोर्नेष्ट आशीरादिषु सप्तसु॥\n\nअन्यस्य कारकम् अन्यत्कारकम्। अन्यस्येदम् अन्यदीयम्। अस्य\
    \ च द्विर्नञ्ग्रहणं लिङ्गम्॥"
  vartika: []
