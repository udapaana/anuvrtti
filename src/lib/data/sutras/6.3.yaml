  meaning: ''
  kashika: चितिशब्दस्य कपि परतो दीर्घो भवति। एकचितीकः। द्विचितीकः। त्रिचितीकः॥
  vartika: []
  rule: The final of **चिति** lengthens before the affix **कप्**.
- id: '63128'
  ref: 6.3.128
  a: 6
  p: 3
  n: 128
  s: विश्वस्य वसुराटोः
  iast: viśvasya vasurāṭoḥ
