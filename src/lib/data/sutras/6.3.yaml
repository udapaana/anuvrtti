    **अन्य**, when not in the genitive (6th) or instrumental (3rd) case, takes the augment **दुक्** (द्) before आशिस्, आशा, आस्था, आस्थित, उत्सुक, ऊति, कारक, राग, and the affix **छ**: अन्यदाशीः, अन्यदुत्सुकः, अन्यदीयः.
