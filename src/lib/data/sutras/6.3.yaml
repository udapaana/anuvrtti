  - word: दीर्घः
    from: 6.3.111
  feeds:
  - word: विश्वस्य
    to: 6.3.129
  - word: विश्वस्य
    to: 6.3.130
  meaning: ''
  kashika: |-
    विश्वशब्दस्य वसु राडित्येतयोरुत्तरपदयोर्दीर्घ आदेशो भवति। विश्वावसुः। विश्वाराट्। राडिति विकारनिर्देशो यत्रास्यैतद् रूपं तत्रैव यथा स्यात्। इह न भवति — विश्वराजौ। विश्वराजः॥
  vartika: []
  rule: |-
    The final vowel of **विश्व** lengthens before **वसु** and **राट्** (the form राज् takes).
- id: '63129'
  ref: 6.3.129
  a: 6
  p: 3
  n: 129
  s: नरे संज्ञायाम्
  iast: nare saṃjñāyām
  type: V
  typeName: vidhi
  pada:
  - नरे
  - संज्ञायाम्
  adhikara: उत्तरपदे
  inherits:
  - word: दीर्घः
    from: 6.3.111
  - word: विश्वस्य
    from: 6.3.128
  feeds: []
  meaning: ''
  kashika: |-
    नरशब्द उत्तरपदे संज्ञायां विषये विश्वस्य दीर्घो भवति। विश्वानरो नाम यस्य वैश्वानरिः पुत्रः। संज्ञायामिति किम्? विश्वे नरा यस्य स विश्वनरः॥
  vartika: []
  rule: |-
    The final vowel of **विश्व** lengthens before **नर** when the compound is a name.
- id: '63130'
  ref: 6.3.130
  a: 6
  p: 3
  n: 130
  s: मित्रे चर्षौ
  iast: mitre carṣau
  type: V
  typeName: vidhi
  pada:
  - मित्रे
  - च
  - ऋषौ
  adhikara: उत्तरपदे
  inherits:
  - word: दीर्घः
    from: 6.3.111
  - word: विश्वस्य
    from: 6.3.128
  feeds: []
  meaning: ''
  kashika: |-
    मित्रे चोत्तरपद ऋषावभिधेये विश्वस्य दीर्घो भवति। विश्वामित्रो नाम ऋषिः। ऋषाविति किम्? विश्वमित्रो माणवकः॥
  vartika: []
  rule: |-
    विश्व lengthens its final vowel before मित्र when the compound names a ऋषि (विश्वामित्रः the sage, but विश्वमित्रः a boy so named).
- id: '63131'
  ref: 6.3.131
  a: 6
  p: 3
  n: 131
  s: मन्त्रे सोमाश्वेन्द्रियविश्वदेव्यस्य मतौ
  iast: mantre somāśvendriyaviśvadevyasya matau
  type: V
  typeName: vidhi
  pada:
  - मन्त्रे
  - सोम-अश्व-इन्द्रिय-विश्वदेव्यस्य
  - मतौ
  adhikara: उत्तरपदे
  inherits:
  - word: दीर्घः
    from: 6.3.111
  feeds:
  - word: मन्त्रे
    to: 6.3.132
  meaning: ''
  kashika: |-
    मन्त्रविषये सोम अश्व इन्द्रिय विश्वदेव्य इत्येतेषां मतुप्प्रत्यये परतो दीर्घो भवति। सो॒मा॒व॒ती (ऋ०१०.९७.७)। अ॒श्वा॒व॒ती (ऋ० १०.९७.७)। इ॒न्दि्॒रयाव॒ती (तै०सं० २.४.२.१)। वि॒श्वदे॑व्यावती (तै०सं० ४.१.६.१)॥
  vartika: []
  rule: |-
    In a **मन्त्र**, सोम, अश्व, इन्द्रिय, and विश्वदेव्य lengthen their final vowel before the **प्रत्यय** मतुप्.
- id: '63132'
  ref: 6.3.132
  a: 6
  p: 3
  n: 132
  s: ओषधेश्च विभक्तावप्रथमायाम्
  iast: oṣadheśca vibhaktāvaprathamāyām
  type: V
  typeName: vidhi
  pada:
  - ओषधेः
  - च
  - विभक्तौ
  - अप्रथमायाम्
  adhikara: उत्तरपदे
  inherits:
  - word: दीर्घः
    from: 6.3.111
  - word: मन्त्रे
    from: 6.3.131
  feeds: []
  meaning: ''
  kashika: |-
    मन्त्र इति वर्तते। ओषधिशब्दस्य विभक्त ावप्रथमायां परतो दीर्घो भवति। ओष॑धीभिः पुनीतात् (ऋ० १०.३०.५)। नमः॑ पृथि॒व्यै नम॒ ओष॑धीभ्यः (तै०आ० २.१२.१)। विभक्ताविति किम्? ओषधिपते। अप्रथमायामिति किम्? स्थिरेयमस्त्वोषधिः॥
  vartika: []
  rule: |-
    In a **मन्त्र**, ओषधि lengthens its final before any **विभक्ति** except the प्रथमा (nominative).
- id: '63133'
  ref: 6.3.133
  a: 6
  p: 3
  n: 133
  s: ऋचि तुनुघमक्षुतङ्कुत्रोरुष्याणाम्
  iast: ṛci tunughamakṣutaṅkutroruṣyāṇām
  type: V
  typeName: vidhi
  pada:
  - ऋचि
  - तु-नु-घ-मक्षु-तङ्-कु-त्र-उरुष्याणाम्
  adhikara: उत्तरपदे
  inherits:
  - word: दीर्घः
    from: 6.3.111
  feeds:
  - word: ऋचि
    to: 6.3.134
  - word: ऋचि
    to: 6.3.135
  - word: ऋचि
    to: 6.3.136
  meaning: ''
  kashika: |-
    ऋचि विषये तु नु घ मक्षु तङ् कु त्र उरुष्य इत्येषां दीर्घो भवति। तु — आ तू न इन्द्र वृत्रहन् (ऋ०४.३२.१)। नु — नू करणे। घ — उ॒त वा॑ घा स्या॒लात् (ऋ० १.१०९.२)। मक्षु — म॒क्षू गोम॑न्तमीमहे (ऋ०८.३३.३)। तङ् — भर॑ता जा॒तवे॑दसम् (ऋ० १०.१७६.२)। तङिति थादेशस्य ङित्त्वपक्षे ग्रहणम्, तेनेह न भवति — शृ॒णोत॑ ग्रावाणः (तै०सं० १.३.१३.१)। कु — कूमनः। त्र — अत्रा गौः। उरुष्य — उ॒रु॒ष्या णो॑ अ॒भिश॑स्तेः॒ (ऋ० १.९१.१५)॥
  vartika: []
  rule: |-
    In the ऋग्वेद, तु, नु, घ, मक्षु, the **तङ्** ending, कु, the ending त्र, and उरुष्य lengthen their final.
- id: '63134'
  ref: 6.3.134
  a: 6
  p: 3
  n: 134
  s: इकः सुञि
  iast: ikaḥ suñi
  type: V
  typeName: vidhi
  pada:
  - इकः
  - सुञि
  adhikara: उत्तरपदे
  inherits:
  - word: दीर्घः
    from: 6.3.111
  - word: ऋचि
    from: 6.3.133
  feeds: []
  meaning: ''
  kashika: |-
    सुञ् निपातो गृह्यते। इगन्तस्य सुञि परतो मन्त्रविषये दीर्घो भवति। अ॒भी षु णः॒ सखी॑नाम् (ऋ० ४.३१.३)। ऊ॒र्ध्व ऊ॒ षु ण॑ ऊ॒तये॒ (ऋ० १.३६.१३)। <<सुञः>> [[८.३.१०५]] इति षत्वम्। <<नश्च धातुस्थोरुषुभ्यः>> [[८.४.२७]] इति णत्वम्॥
  vartika: []
  rule: |-
    In a **मन्त्र**, a first member ending in **इक्** (इ, उ, ऋ, ऌ) lengthens its final before the particle सु.
- id: '63135'
  ref: 6.3.135
  a: 6
  p: 3
  n: 135
  s: द्व्यचोऽतस्तिङः
  iast: dvyaco'tastiṅaḥ
  type: V
  typeName: vidhi
  pada:
  - द्व्यचः
  - अतः
  - तिङः
  adhikara: उत्तरपदे
  inherits:
  - word: दीर्घः
    from: 6.3.111
  - word: ऋचि
    from: 6.3.133
  feeds: []
  meaning: ''
  kashika: |-
    ऋचीति वर्तते। द्व्यचस्तिङन्तस्यात ऋग्विषये दीर्घो भवति। वि॒द्मा हि त्वा॒ गोप॑तिं शूर॒ गोना॑म् (ऋ० १०.४७.१)। वि॒द्मा श॒रस्य॑ पि॒तर॑म् (शौ०सं०१.२.१) द्व्यच इति किम्? अश्वा॒ भव॑त वा॒जिनः॑ (मा०सं० ९.६)। अत इति किम्? आ दे॒वान् व॑क्षि॒ यक्षि॑ च (ऋ० ५.२६.१)॥
  vartika: []
  rule: |-
    In the ऋग्वेद, a **तिङ्** ending in अ lengthens it when the verb has two syllables.
- id: '63136'
  ref: 6.3.136
  a: 6
  p: 3
  n: 136
  s: निपातस्य च
  iast: nipātasya ca
  type: V
  typeName: vidhi
  pada:
  - निपातस्य
  - च
  adhikara: उत्तरपदे
  inherits:
  - word: दीर्घः
    from: 6.3.111
  - word: ऋचि
    from: 6.3.133
  feeds: []
  meaning: ''
  kashika: |-
    ऋचीत्येव। निपातस्य च ऋग्विषये दीर्घ आदेशो भवति। ए॒वा ते॑ (ऋ० १०.२०.१०)। अच्छा॑ (ऋ० १.२.२)॥
  vartika: []
  rule: In the ऋग्वेद, a particle lengthens its final.
- id: '63137'
  ref: 6.3.137
  a: 6
  p: 3
  n: 137
  s: अन्येषामपि दृश्यते
  iast: anyeṣāmapi dṛśyate
  type: V
  typeName: vidhi
  pada:
  - अन्येषाम्
  - अपि
  - दृश्यते
  adhikara: उत्तरपदे
  inherits:
  - word: दीर्घः
    from: 6.3.111
  feeds: []
  meaning: ''
  kashika: |-
    अन्येषामपि दीर्घो दृश्यते, स शिष्टप्रयोगादनुगन्तव्यः। यस्य दीर्घत्वं न विहितम्, दृश्यते च प्रयोगे, तदनेन कर्तव्यम्। केशाकेशि। कचाकचि। जलाषाट्। नारकः। पूरुषः॥ शुनो दन्तदंष्ट्राकर्णकुन्दवराहपुच्छपदेषु॥ श्वादन्तः। श्वादंष्ट्रः। श्वाकर्णः। श्वाकुन्दः। श्वावराहः। श्वापुच्छः। श्वापदः॥
  vartika:
  - शुनोदन्तदंष्ट्राकर्णकुन्दवराहपुच्छपदेषु दीर्घो वाच्यः ।
  rule: |-
    This lengthening of the final is also seen in other words, to be followed from learned usage.
- id: '63138'
  ref: 6.3.138
  a: 6
  p: 3
  n: 138
  s: चौ
  iast: cau
  type: V
  typeName: vidhi
  pada:
  - चौ
  adhikara: उत्तरपदे
  inherits:
  - word: दीर्घः
    from: 6.3.111
  feeds: []
  meaning: "When the अञ्च् word is in a state where its अकार and नकार have been removed, it causes the\
    \ दीर्घ of the previous अण् letter. "
  kashika: |-
    चौ परतः पूर्वपदस्य दीर्घो भवति। चावित्यञ्चतिर्लुप्तनकाराकारो गृह्यते। दधीचः पश्य। दधीचा। दधीचे। मधूचः पश्य। मधूचा। मधूचे। अन्तरङ्गोऽपि हियणादेशो दीर्घविधानसामर्थ्याद् न प्रवर्तते॥
  vartika: []
  rule: |-
    The first member lengthens its final vowel before अञ्च् when अञ्च् has dropped its nasal and vowel and stands as च (दधि → दधीच-, मधु → मधूच-).
- id: '63139'
  ref: 6.3.139
  a: 6
  p: 3
  n: 139
