  meaning: ''
  kashika: |-
    इगन्तस्योपसर्गस्य काशशब्द उत्तरपदे दीर्घो भवति। नीकाशः। वीकाशः। अनूकाशः। पचाद्यच्प्रत्ययान्तोऽयं काशशब्दो न तु घञन्तः। इक इति किम्? प्रकाशः॥
  vartika: []
  rule: An **उपसर्ग** ending in इ or उ lengthens its final before **काश**.
- id: '63124'
  ref: 6.3.124
  a: 6
  p: 3
  n: 124
  s: दस्ति
  iast: dasti
  type: V
  typeName: vidhi
  pada:
  - दः
  - ति
  adhikara: उत्तरपदे
  inherits:
  - word: दीर्घः
    from: 6.3.111
  - word: उपसर्गस्य
    from: 6.3.122
  - word: इकः
    from: 6.3.123
  feeds: []
  meaning: ''
  kashika: |-
    दा इत्येतस्य यस्तकारादिरादेशस्तस्मिन् परत इगन्तस्योपसर्गस्य दीर्घो भवति। नीत्तम्। वीत्तम्। परीत्तम्। <<अच उपसर्गात् तः>> [[७.४.४७]] इत्यन्तस्य यद्यपि तकारः क्रियते, तथापि चर्त्वस्याश्रयात् सिद्धत्वमिति तकारादिर्भवति। इक इत्येव — प्रत्तम्। अवत्तम्। द इति किम्? वितीर्णम्। नितीर्णम्। तीति किम्? सुदत्तम्॥
  vartika: []
  rule: |-
    An **उपसर्ग** ending in इ or उ lengthens its final before **दा** when दा is replaced by a substitute beginning with त.
- id: '63125'
  ref: 6.3.125
  a: 6
  p: 3
  n: 125
  s: अष्टनः संज्ञायाम्
  iast: aṣṭanaḥ saṃjñāyām
  type: V
  typeName: vidhi
  pada:
  - अष्टनः
  - संज्ञायाम्
  adhikara: उत्तरपदे
  inherits:
  - word: दीर्घः
    from: 6.3.111
  feeds:
  - word: अष्टनः
    to: 6.3.126
  meaning: ''
  kashika: |-
    अष्टनित्येतस्योत्तरपदे संज्ञायां दीर्घो भवति। अष्टावक्रः। अष्टाबन्धुरः। अष्टापदम्। संज्ञायामिति किम्? अष्टपुत्रः। अष्टभार्यः॥
  vartika: []
  rule: |-
    The final of **अष्टन्** lengthens before a second member when the compound is a name.
- id: '63126'
  ref: 6.3.126
  a: 6
  p: 3
  n: 126
  s: छन्दसि च
  iast: chandasi ca
  type: V
  typeName: vidhi
  pada:
  - छन्दसि
  - च
  adhikara: उत्तरपदे
  inherits:
  - word: दीर्घः
    from: 6.3.111
  - word: अष्टनः
    from: 6.3.125
  feeds: []
  meaning: ''
  kashika: |-
    छन्दसि विषयेऽष्टन उत्तरपदे दीर्घो भवति। आ॒ग्ने॒य॑म॒ष्टा॑क॒पालं॒ नि॑र्व॒पेत् (मै०सं० २.१.३)। अष्टाहिरण्या दक्षिणा। अष्टापदी देवता सुमती। अष्टौ पादावस्या इति बहुव्रीहौ पादस्य लोपे [[५.४.१३८]] कृते <<पादोऽन्यतरस्याम्>> [[४.१.८]] इति ङीप्॥ गवि च युक्ते  भाषायामष्टनो दीर्घो भवतीति वक्त व्यम्॥ अष्टागवं शकटम्॥
  vartika:
  - भाषायामाष्टनो दीर्घो भवतीति वक्तव्यम् ।
  rule: In the **छन्दस्** too, the final of **अष्टन्** lengthens before a second member.
- id: '63127'
  ref: 6.3.127
  a: 6
  p: 3
  n: 127
  s: चितेः कपि
  iast: citeḥ kapi
