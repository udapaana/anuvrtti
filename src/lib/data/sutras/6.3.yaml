  meaning: |-
    When a ढकार is deleted due to a ढकार that follows it, or when a रेफ is deleted due to a रेफ that follows the अण् letter occurring before the deleted ढकार/रेफ becomes दीर्घ.
  kashika: |-
    ढकाररेफयोर्लोपो यस्मिन् स ढ्रलोपः, तत्र पूर्वस्याणो दीर्घो भवति। लीढम्। मीढम्। उपगूढम्। मूढः। रलोपे — नीरक्त म्। अग्नी रथः। इन्दू रथः। पुना रक्त ं वासः। प्राता राजक्रयः। पूर्वग्रहणमनुत्तरपदेऽपि पूर्वमात्रस्य दीर्घार्थम्। अण इति किम्? आतृढम्। आवृढम्॥
  vartika: []
  rule: When ढ् or र् drops, a preceding **अण्** vowel (अ, इ, उ) lengthens.
- id: '63112'
  ref: 6.3.112
  a: 6
  p: 3
  n: 112
  s: सहिवहोरोदवर्णस्य
  iast: sahivahorodavarṇasya
  type: V
  typeName: vidhi
  pada:
  - सहि-वहोः
  - ओत्
  - अवर्णस्य
  adhikara: उत्तरपदे
  inherits:
  - word: ढ्रलोपे
    from: 6.3.111
  - word: दीर्घः
    from: 6.3.111
  feeds: []
  meaning: |-
    For the verbs सह् and वह्, when a ढकार is deleted due to a ढकार that follows it,  the अकार occurring before the deleted ढकार is converted to ओ.
  kashika: |-
    सहि वहि इत्येतयोरवर्णस्यौकार आदेशो भवति ढ्रलोपे। सोढा। सोढुम्। सोढव्यम्। वोढा। वोढुम्। वोढव्यम्। अवर्णस्येति किम्? ऊढः। ऊढवान्। वर्णग्रहणं किम्? कृतायामपि वृद्धौ यथा स्यात्। उदवोढाम्। उदवोढम्। तादपि परस्तपरः, तपरत्वादाकारस्य ग्रहणं न स्यात्॥
  vartika: []
  rule: When ढ् or र् drops, the अ or आ of **सह्** and **वह्** becomes ओ.
- id: '63113'
  ref: 6.3.113
  a: 6
  p: 3
  n: 113
  s: साढ्यै साढ्वा साढेति निगमे
  iast: sāḍhyai sāḍhvā sāḍheti nigame
  type: V
  typeName: vidhi
  pada:
  - साढ्यै
  - साढ्वा
  - साढा
  - इति
  - निगमे
  adhikara: उत्तरपदे
  inherits:
  - word: दीर्घः
    from: 6.3.111
  feeds: []
  meaning: ''
  kashika: |-
    साढ्यै साढ्वा साढा इति निगमे निपात्यन्ते। सा॑ढ्य॒ै (मै० सं० १.६.३) समन्तात्। सा॒ढ्वा॑ (मै०सं० ३.८.५) शत्रून्। सहेः क्त्वाप्रत्यय ओत्त्वाभावः। पक्षे क्त्वाप्रत्ययस्य ध्यैभावः। साढेति तृचि रूपमेतत्। निगम इति किम्? सोढ्वा सोढेति भाषायाम्॥
  vartika: []
  rule: साढ्यै, साढ्वा, and साढा are the irregular forms in the **निगम** (Vedas).
- id: '63114'
  ref: 6.3.114
  a: 6
  p: 3
  n: 114
  s: संहितायाम्
  iast: saṃhitāyām
  type: AD
  typeName: adhikāra
  pada:
  - संहितायाम्
  adhikara: उत्तरपदे
  inherits:
  - word: दीर्घः
    from: 6.3.111
  feeds: []
  meaning: ''
  kashika: |-
    संहितायामित्ययमधिकारः। यदित ऊर्ध्वमनुक्रमिष्यामः संहितायामित्येवं तद् वेदितव्यम्। वक्ष्यति — <<द्व्यचोऽतस्तिङः>> [[६.३.१३५]] इति। वि॒द्मा हि त्वा॒ गोप॑तिं शूर॒ गोना॑म् (ऋ० १०.४७.१)। संहितायामिति किम्? विद्म, हि, त्वा, गोपतिम्, शूर, गोनाम्॥
  vartika: []
  rule: |-
    From here to the end of the **पाद**, supply **संहिता** (an unbroken flow of speech).
- id: '63115'
  ref: 6.3.115
  a: 6
  p: 3
  n: 115
  s: कर्णे लक्षणस्याविष्टाष्टपञ्चमणिभिन्नछिन्नछिद्रस्रुवस्वस्तिकस्य
  iast: karṇe lakṣaṇasyāviṣṭāṣṭapañcamaṇibhinnachinnachidrasruvasvastikasya
  type: V
  typeName: vidhi
  pada:
  - कर्णे
  - लक्षणस्य
  - अ-विष्ट-अष्ट-पञ्च-मणि-भिन्न-छिन्न-छिद्र-स्रुव-स्वस्तिकस्य
  adhikara: उत्तरपदे
  inherits:
  - word: दीर्घः
    from: 6.3.111
  feeds: []
  meaning: ''
  kashika: |-
    कर्णशब्द उत्तरपदे लक्षणवाचिनो दीर्घो भवति विष्ट अष्टन् पञ्चन् मणि भिन्न छिन्न छिद्र स्रुव स्वस्तिक इत्येतान् वर्जयित्वा। दात्राकर्णः। द्विगुणाकर्णः। त्रिगुणाकर्णः। द्व्यङ्गुलाकर्णः। अङ्गुलाकर्णः। यत् पशूनां स्वामिविशेषसंबन्धज्ञापनार्थं दात्राकारादि क्रियते, तदिह लक्षणं गृह्यते। लक्षणस्येति किम्? शोभनकर्णः। अविष्टादीनामिति किम्? विष्टकर्णः। अष्टकर्णः। पञ्चकर्णः। मणिकर्णः। भिन्नकर्णः। छिन्नकर्णः। छिद्रकर्णः। स्रुवकर्णः। स्वस्तिककर्णः॥
  vartika: []
  rule: |-
    Before **कर्ण**, the final vowel of a preceding word naming an ownership mark lengthens, except for विष्ट, अष्टन्, पञ्चन्, मणि, भिन्न, छिन्न, छिद्र, स्रुव, and स्वस्तिक.
- id: '63116'
  ref: 6.3.116
  a: 6
  p: 3
  n: 116
  s: नहिवृतिवृषिव्यधिरुचिसहितनिषु क्वौ
  iast: nahivṛtivṛṣivyadhirucisahitaniṣu kvau
  type: V
  typeName: vidhi
  pada:
  - नहि-वृति-वृषि-व्यधि-रुचि-सहि-तनिषु
  - क्वौ
  adhikara: उत्तरपदे
  inherits:
  - word: दीर्घः
    from: 6.3.111
  feeds: []
  meaning: ''
  kashika: |-
    नहि वृति वृषि व्यधि रुचि सहि तनि इत्येतेषु क्विप्रत्ययान्तेषूत्तरपदेषु पूर्वपदस्य दीर्घो भवति संहितायां विषये। नहि — उपानत्। परीणत्। वृति — नीवृत्। उपावृत्। वृषि — प्रावृट्। व्यधि — मर्मावित्। हृदयावित्। श्वावित्। रुचि — नीरुक्। अभीरुक्। सहि — ऋतीषट्। तनि — परीतत्२। <<गमःक्वौ>> [[६.४.४०]] इति गमादीनामिष्यते। ततस्तनोतेरप्यनुनासिकलोपः। क्वाविति किम्? परिणहनम्॥
  vartika: []
  rule: |-
    Before **नह्**, **वृत्**, **वृष्**, **व्यध्**, **रुच्**, **सह्**, and **तन्** taking the affix **क्वि**, the final vowel of the preceding word lengthens.
- id: '63117'
  ref: 6.3.117
  a: 6
  p: 3
  n: 117
  s: वनगिर्योः संज्ञायां कोटरकिंशुलकादीनाम्
  iast: vanagiryoḥ saṃjñāyāṃ koṭarakiṃśulakādīnām
  type: V
  typeName: vidhi
  pada:
  - वन-गिर्योः
  - संज्ञायाम्
  - कोटर-किंशुलकादीनाम्
  adhikara: उत्तरपदे
  inherits:
  - word: दीर्घः
    from: 6.3.111
  feeds:
  - word: संज्ञायाम्
    to: 6.3.118
  - word: संज्ञायाम्
    to: 6.3.119
  - word: संज्ञायाम्
    to: 6.3.120
  meaning: ''
  kashika: |-
    वन गिरि इत्येतयोरुत्तरपदयोर्यथासंख्यं कोटरादीनां किंशुलकादीनां च दीर्घो भवति संज्ञायां विषये। वने कोटरादीनाम् — कोटरावणम्। मिश्रकावणम्। सिध्रकावणम्। सारिकावणम्। गिरौ किंशुलकादीनाम् — किंशुलकागिरिः। अञ्जनागिरिः। कोटरकिंशुलकादीनामिति किम्? असिपत्रवनम्। कृष्णगिरिः॥ कोटर। मिश्रक। पुरग। सिध्रक। सारिक। कोटरादिः॥ किंशुलक। शाल्वक। अञ्जन। भञ्जन। लोहित। कुक्कुट। किंशुलकादिः॥
  vartika: []
  rule: |-
    As a name, the final vowel of कोटर etc. lengthens before **वन**, and that of किंशुलक etc. before **गिरि**.
- id: '63118'
  ref: 6.3.118
  a: 6
  p: 3
  n: 118
  s: वले
  iast: vale
  type: V
  typeName: vidhi
  pada:
  - वले
  adhikara: उत्तरपदे
  inherits:
  - word: दीर्घः
    from: 6.3.111
  - word: संज्ञायाम्
    from: 6.3.117
  feeds: []
  meaning: ''
  kashika: |-
    वले परतः पूर्वस्य दीर्घो भवति। आसुतीवलः। कृषीवलः। दन्तावलः। <<रजःकृष्या — सुतिपरिषदो वलच्>> [[५.२.११२]] इति वलच्प्रत्ययो गृह्यते, न प्रातिपदिकम्। अनुत्साहभ्रातृपितृणामित्येव — उत्साहवलः। भ्रातृवलः। पितृवलः॥
  vartika: []
  rule: The final vowel of the preceding word lengthens before the affix **वल**.
- id: '63119'
  ref: 6.3.119
  a: 6
  p: 3
  n: 119
  s: मतौ बह्वचोऽनजिरादीनाम्
  iast: matau bahvaco'najirādīnām
  type: V
  typeName: vidhi
  pada:
  - मतौ
  - बह्वचः
  - अ-नजिरादीनाम्
  adhikara: उत्तरपदे
  inherits:
  - word: दीर्घः
    from: 6.3.111
  - word: संज्ञायाम्
    from: 6.3.117
  feeds:
  - word: मतौ
    to: 6.3.120
  meaning: ''
  kashika: |-
    मतौ परतो बह्वचोऽजिरादिवर्जितस्य दीर्घो भवति संज्ञायां विषये। उदुम्बरावती। मशकावती। वीरणावती। पुष्करावती। अमरावती। <<नद्यां मतुप्>>[[४.२.८५]] इति मतुप्प्रत्ययः। <<संज्ञायाम्>> [[८.२.११]] इति मतोर्वत्वम्। बह्वच इति किम्? व्रीहिमती। अनजिरादीनामिति किम्? अजिरवती। खदिरवती। पुलिनवती। हंसकारण्डववती। चक्रवाकवती। संज्ञायामित्येव — वलयवती॥
  vartika: []
  rule: |-
    As a name, the final vowel of a word of more than two syllables lengthens before the affix **मत्**, except for अजिर etc.
- id: '63120'
  ref: 6.3.120
  a: 6
  p: 3
  n: 120
