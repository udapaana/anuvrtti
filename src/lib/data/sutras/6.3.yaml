  meaning: ''
  kashika: |-
    अनोरुत्तरस्याप ऊकारादेशो भवति देशाभिधाने। अनूपो देशः। देश इति किम्? अन्वीपम्। दीर्घोच्चारणमवग्रहार्थम्। अनु ऊपोऽनूप इति॥
  vartika: []
