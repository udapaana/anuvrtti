  - word: अनेकम्
    to: 2.2.29
  meaning: ''
  kashika: "अनेकं सुबन्तमन्यपदार्थे वर्तमानं सह समस्यते, बहुव्रीहिश्च समासो भवति। प्रथमार्थमेकं वर्जयित्वा\
    \ सर्वेषु विभक्त्यर्थेषु बहुव्रीहिर्भवति। प्राप्तमुदकं यं ग्रामम्, प्राप्तोदको ग्रामः। ऊढरथोऽनड्वान्।\
    \ उपहृतपशू रुद्रः। उद्धृतौदना स्थाली। चित्रगुर्देवदत्तः। वीरपुरुषको ग्रामः। प्रथमार्थे तु न भवति।\
    \ वृष्टे देवे गतः। अनेकग्रहणं किम्? बहूनामपि यथा स्यात् — \n\nसुसूक्ष्मजटकेशेन सुगजाजिनवाससा।\n\n\
    समन्तशितिरन्ध्रेण द्वयोर्वृत्तौ न सिध्यति॥\n\n॥ बहुव्रीहिः समानाधिकरणानामिति वक्तव्यम्॥ व्यधिकरणानां\
    \ मा भूत्पञ्चभिर्भुक्तमस्य॥ अव्ययानां च बहुव्रीहिर्वक्तव्यः॥ उच्चैर्मुखः। नीचैर्मुखः॥ सप्तम्युपमानपूर्वपदस्योत्तरपदलोपश्च\
    \ वक्तव्यः॥ कण्ठे स्थितः कालोऽस्य, कण्ठेकालः। उरसिलोमा। उष्ट्रस्य मुखमिव मुखं यस्य सः, उष्ट्रमुखः।\
    \ खरमुखः॥ समुदायविकारषष्ठ्याश्च बहुव्रीहिरुत्तरपदलोपश्चेति वक्तव्यम्॥ केशानां सङ्घातः, केशसंघातः,\
    \ केशसंघातश्चूडास्य केशचूडः। सुवर्णस्य विकारोऽलंकारोऽस्य सुवर्णालंकारः॥ प्रादिभ्यो धातुजस्योत्तरपदस्य\
    \ लोपश्च वा बहुव्रीहिर्वक्तव्यः॥ प्रपतितं पर्णमस्य, प्रपर्णः। प्रपतितपर्णः। प्रपतितं पलाशमस्य, प्रपलाशः।\
    \ प्रपतितपलाशः॥ नञोऽस्त्यर्थानां बहुव्रीहिर्वा चोत्तरपदलोपश्च वक्तव्यः॥ अविद्यमानः पुत्रो यस्य, अपुत्रः।\
    \ अविद्यमानपुत्रः। अभार्यः। अविद्यमानभार्यः॥ सुबधिकारेऽस्तिक्षीरादिवचनम्॥ अस्तिक्षीरा ब्राह्मणी। अस्त्यादयो\
    \ निपाताः॥"
  vartika:
  - प्रादिभ्यो धातुजस्य वाच्यो वा चोत्तरपदलोपः ।
  - नञोऽस्त्यर्थानां वाच्यो वा चोत्तरपदलोपः ।
  rule: |-
    Two or more inflected words compound to name something other than what they name singly, forming a **बहुव्रीहि**.
- id: '22025'
  ref: 2.2.25
  a: 2
  p: 2
  n: 25
  s: संख्ययाऽव्ययासन्नादूराधिकसंख्याः संख्येये
  iast: saṃkhyayā'vyayāsannādūrādhikasaṃkhyāḥ saṃkhyeye
  type: V
  typeName: vidhi
  pada:
  - संख्यया
  - अव्यय-आसन्न-अदूर-अधिक-संख्याः
  - संख्येये
  adhikara: आकडारात् एका संज्ञा
  inherits:
  - word: अनेकम्
    from: 2.2.24
  feeds: []
  meaning: ''
  kashika: |-
    संख्येये या संख्या वर्तते तया सहाव्ययासन्नादूराधिकसंख्याः समस्यन्ते, बहुव्रीहिश्च समासो भवति। अव्यय — उपदशाः। उपविंशाः। आसन्नदशाः। आसन्नविंशाः। अदूरदशाः। अदूरविंशाः। अधिकदशाः। अधिकविंशाः। संख्या — द्वित्राः। त्रिचतुराः। द्विदशाः। संख्ययेति किम्? पञ्च ब्राह्मणाः। अव्ययासन्नादूराधिकसंख्या इति किम्? ब्राह्मणाः पञ्च। संख्येय इति किम्? अधिका विंशतिर्गवाम्॥
  vartika: []
  rule: |-
    An **अव्यय**, and आसन्न, अदूर, अधिक, and a **संख्या** compound with another **संख्या** when the sense is a number, forming a **बहुव्रीहि**.
- id: '22026'
  ref: 2.2.26
  a: 2
  p: 2
  n: 26
  s: दिङ्नामान्यन्तराले
  iast: diṅnāmānyantarāle
  type: V
  typeName: vidhi
  pada:
  - दिङ्-नामानि
  - अन्तराले
  adhikara: आकडारात् एका संज्ञा
  inherits:
  - word: अनेकम्
    from: 2.2.24
  feeds: []
  meaning: ''
  kashika: |-
    दिशां नामानि दिङ्नामानि। दिङ्नामानि सुबन्तान्यन्तराले वाच्ये समस्यन्ते, बहुव्रीहिश्च समासो भवति। दक्षिणस्याश्च पूर्वस्याश्च दिशोर्यदन्तरालम्, दक्षिणपूर्वा दिक्। पूर्वोत्तरा। उत्तरपश्चिमा। पश्चिमदक्षिणा॥ सर्वनाम्नो वृत्तिमात्रे पुंवद्भावः॥ नामग्रहणं रूढ्यर्थम्। इह मा भूत् — ऐन्द्र्याश्च कौबेर्याश्च दिशोर्यदन्तरालमिति॥
  vartika: []
  rule: |-
    Names of the directions compound to name an intermediate direction, forming a **बहुव्रीहि**.
- id: '22027'
  ref: 2.2.27
  a: 2
  p: 2
  n: 27
  s: तत्र तेनेदमिति सरूपे
  iast: tatra tenedamiti sarūpe
  type: V
  typeName: vidhi
  pada:
  - तत्र
  - तेन्
  - इदम्
  - इति
  - सरूपे
  adhikara: आकडारात् एका संज्ञा
  inherits:
  - word: अनेकम्
    from: 2.2.24
  feeds: []
  meaning: ''
  kashika: |-
    तत्रेति सप्तम्यन्तं गृह्यते। तेनेति तृतीयान्तम्। सरूपग्रहणं प्रत्येकमभिसंबध्यते। तत्रेति सप्तम्यन्ते सरूपे पदे तेनेति च तृतीयान्ते इदमित्येतस्मिन्नर्थे समस्येते, बहुव्रीहिश्च समासो भवति। इतिकरणश्चेह विवक्षार्थो लौकिकमर्थमनुसारयति। ततो ग्रहणम्, प्रहरणम्, कर्मव्यतिहारः, युद्धं च समासार्थ इति सर्वमितिकरणाल्लभ्यते। यत् तत्रेति निर्दिष्टं ग्रहणं चेत् तद् भवति, यत् तेनेति निर्दिष्टं प्रहरणं चेत् तद् भवति, यदिदमिति निर्दिष्टं युद्धं चेत् तद् भवति। केशेषु केशेषु च गृहीत्वेदं युद्धं प्रवृत्तम्, केशाकेशि। कचाकचि। दण्डैश्च दण्डैश्च प्रहृत्येदं युद्धं प्रवृत्तम्, दण्डादण्डि। मुसलामुसलि। <<इच् कर्मव्यतिहारे>> [[५.४.१२७]] इतीच् समासान्तः, स चाव्ययम्। <<अन्येषामपि दृश्यते>> [[६.३.१३७]] इति पूर्वपदस्य दीर्घत्वम्। सरूपग्रहणं किम्? हलैश्च मुसलैश्च प्रहृत्येदं युद्धं प्रवृत्तम्॥
  vartika: []
  rule: |-
    Two like-formed words, both in the locative or both in the instrumental, compound in the sense 'this happens therein / by that', forming a **बहुव्रीहि**.
- id: '22028'
