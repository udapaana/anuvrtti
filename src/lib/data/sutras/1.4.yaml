  kashika: |-
    अनुशब्दस्तृतीयार्थे द्योत्ये कर्मप्रवचनीयसंज्ञो भवति। नदीमन्ववसिता सेना। पर्वतमन्ववसिता सेना। पर्वतेन संबद्धेत्यर्थः॥
  vartika: []
  rule: |-
    अनु is **कर्मप्रवचनीय** when it carries the force of the instrumental (with, alongside).
- id: '14086'
  ref: 1.4.86
