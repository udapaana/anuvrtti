- id: '14013'
  ref: 1.4.13
  a: 1
  p: 4
  n: 13
  s: यस्मात् प्रत्ययविधिस्तदादि प्रत्ययेऽङ्गम्
  iast: yasmāt pratyayavidhistadādi pratyaye'ṅgam
  type: S
  typeName: saṃjñā
  pada:
  - यस्मात्
  - प्रत्ययविधिः
  - तदादि
  - प्रत्यये
  - अङ्गम्
  adhikara: आकडारात् एका संज्ञा
  inherits: []
  feeds: []
  meaning: "When a प्रत्यय is attached to a word, everything that begins with the first letter of that\
    \ word up to (and excluding) the first letter of the प्रत्ययः itself, is called the an अङ्गम् of that\
    \ प्रत्यय. "
  kashika: |-
    यस्मात् प्रत्ययो विधीयते धातोर्वा प्रातिपदिकाद् वा तदादि शब्दरूपं प्रत्यये परतोऽङ्गसंज्ञं भवति। कर्ता। हर्ता। करिष्यति। हरिष्यति। अकरिष्यत्। औपगवः। कापटवः। यस्मादिति संज्ञिनिर्देशार्थम्, तदादीति संबन्धात्। प्रत्ययग्रहणं किम्? न्यविशत। व्यक्रीणीत। <<नेर्विशः>> [[१.३.१७]] इत्युपसर्गाद् विधिरस्ति, तदादेरङ्गसंज्ञा स्यात्। विधिग्रहणं किम्? प्रत्ययपरत्वमात्रे मा भूत्। स्त्री इयती॥ तदादिवचनं स्यादिनुमर्थम्॥ करिष्यावः, करिष्यामः। कुण्डानि। पुनः प्रत्ययग्रहणं किमर्थम्? लुप्तप्रत्यये मा भूत्। श्र्यर्थम्। भ्र्वर्थम्। अङ्गप्रदेशाः — <<अङ्गस्य>> [[६.४.१]] इत्येवमादयः॥
  vartika: []
  rule: |-
    When a **प्रत्यय** is added after a root or **प्रातिपदिक**, the form starting from that base, taken with the affix following, is the **अङ्ग**.
- id: '14014'
  ref: 1.4.14
  a: 1
  p: 4
  n: 14
  s: सुप्तिङन्तं पदम्
  iast: suptiṅantaṃ padam
