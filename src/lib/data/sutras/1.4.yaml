  typeName: saṃjñā
  pada:
  - सुप्-तिङ्-अन्तम्
  - पदम्
  adhikara: आकडारात् एका संज्ञा
  inherits: []
  feeds:
  - word: पदम्
    to: 1.4.15
  - word: पदम्
    to: 1.4.16
  - word: पदम्
    to: 1.4.17
  meaning: Any word ending in a सुप् प्रत्यय or a तिङ् प्रत्यय is called a पद.
  kashika: |-
    सुप्तिङिति प्रत्याहारग्रहणम्। सुबन्तं तिङन्तं च शब्दरूपं पदसंज्ञं भवति। ब्राह्मणाः पठन्ति। पदसंज्ञायामन्तग्रहणमन्यत्र संज्ञाविधौ प्रत्ययग्रहणे तदन्तविधेः प्रतिषेधार्थम्। गौरी ब्राह्मणितरा। पदप्रदेशाः — <<पदस्य>> [[८.१.१६]] <<पदात्>> [[८.१.१७]] इत्येवमादयः॥
  vartika: []
  rule: A form ending in **सुप्** [[4.1.2]] or **तिङ्** [[3.4.78]] is a **पद**.
- id: '14015'
  ref: 1.4.15
  a: 1
  p: 4
  n: 15
  s: नः क्ये
  iast: naḥ kye
  type: S
  typeName: saṃjñā
  pada:
  - नः
  - क्ये
  adhikara: आकडारात् एका संज्ञा
  inherits:
  - word: पदम्
    from: 1.4.14
  feeds: []
  meaning: |-
    A नकारान्त word gets the term 'पद' when followed by a प्रत्यय that begins with क्य.
  kashika: |-
    क्य इति क्यच्क्यङ्क्यषां सामान्यग्रहणम्। नान्तं शब्दरूपं क्ये परतः पदसंज्ञं भवति। क्यच् — राजीयति। क्यङ् — राजायते। क्यष् — वर्मायति, वर्मायते। सिद्धे सत्यारम्भो नियमार्थः। नान्तमेव क्ये परतः पदसंज्ञं भवति नान्यत्। वाच्यति। स्रुच्यति॥
  vartika: []
  rule: |-
    Before **क्य** (the affixes **क्यच्**, **क्यङ्**, **क्यष्**), a form ending in न् is a **पद**.
- id: '14016'
