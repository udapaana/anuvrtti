  meaning: |-
    The words included in the चादिगण are called निपात when used in a sense that does not denote an object.
  kashika: "चादयो निपातसंज्ञा भवन्ति न चेत् सत्त्वे वर्तन्ते। प्रसज्यप्रतिषेधोऽयम्, सत्त्वमिति च द्रव्यमुच्यते।\
    \ च। वा। ह। अह। एव। एवम्। नूनम्। शश्वत्। युगपत्। सूपत्। कूपत्। कुवित्। नेत्। चेत्। चण्। कच्चित्। यत्र।\
    \ नह। हन्त। माकिम्। नकिम्। माङ्। माङो ङकारो विशेषणार्थो <<माङि लुङ्>> [[३.३.१७५]] इति। इह न भवति —\
    \ मा भवतु, मा भविष्यति। नञ्। यावत्। तावत्। त्वा। त्वै। द्वै। रै। श्रौषट्। वौषट्। स्वाहा। वषट्। स्वधा।\
    \ ओम्। किल। तथा। अथ। सु। स्म। अस्मि। अ। इ। उ। ऋ। ऌ। ए। ऐ। ओ। औ। अम्। तक्। उञ्। उकञ्। वेलायाम्। मात्रायाम्।\
    \ यथा। यत्। यम्। तत्। किम्। पुरा। अद्धा। धिक्। हाहा। हे। है। प्याट्। पाट्। थाट्। अहो। उताहो। हो। तुम्।\
    \ तथाहि। खलु। आम्। आहो। अथो। ननु। मन्ये। मिथ्या। असि। ब्रूहि। तु। नु। इति। इव। वत्। चन। बत। इह। शम्।\
    \ कम्। अनुकम्। नहिकम्। हिकम्। सुकम्। सत्यम्। ऋतम्। श्रद्धा। इद्धा। मुधा। नोचेत्। नचेत्। नहि। जातु।\
    \ कथम्। कुतः। कुत्र। अव। अनु। हाहौ। हैहा। ईहा। आहोस्वित्। छम्बट्। खम्। दिष्ट्या। पशु। वट्। सह। आनुषक्।\
    \ अङ्ग। फट्। ताजक्। अये। अरे। चटु। बाट्। कुम्। खुम्। घुम्। हुम्। आईम्। शीम्। सीम्। वै। उपसर्गविभक्तिस्वरप्रतिरूपकाश्च\
    \ निपाताः (ग०सू० १६)। उपसग᐀्प्रतिरूपकाः — \n\nअवदत्तं विदत्तं च प्रदत्तं चादिकर्मणि।\n\nसुदत्तमनुदत्तं\
    \ च निदत्तमिति चेष्यते॥\n\n<<अच उपसर्गात् तः>> [[७.४.४७]] इति तत्वं न भवति। दुर्नीतम्। दुर्नयः। दुर्निर्णयः।\
    \ <<उपसर्गाद०>> [[८.४.१४]] इति णत्वं न भवति। असत्त्व इति किम्? पशुर्वै पुरुषः। पशुः पुरोडाशः। निपातप्रदेशाः\
    \ — <<स्वरादिनिपातमव्ययम्>> [[१.३.३७]] इत्येवमादयः॥"
  vartika: []
  rule: च and the rest are **निपात**s when they do not name a thing (a substance).
