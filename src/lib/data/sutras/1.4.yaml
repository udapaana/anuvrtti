  s: सिति च
  iast: siti ca
  type: S
  typeName: saṃjñā
  pada:
  - सिति
  - च
  adhikara: आकडारात् एका संज्ञा
  inherits:
  - word: पदम्
    from: 1.4.14
  feeds: []
  meaning: In presence of a प्रत्यय having सकार as इत्संज्ञक, the प्रकृति gets the term पद.
  kashika: |-
    <<यचि भम्>> [[१.४.१८]] इति वक्ष्यति, तस्यायं पुरस्तादपवादः। सिति प्रत्यये परतः पूर्वं पदसंज्ञं भवति। <<भवतष्ठक्छसौ>> [[४.२.११५]] — भवदीयः। <<ऊर्णाया युस्>> [[५.२.१२३]] — ऊर्णायुः। <<ऋतोरण्>> [[५.१.१०५]],<<छन्दसि घस्>> [[५.१.१०६]] — ऋत्वियः॥
  vartika: []
