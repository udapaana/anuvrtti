  feeds:
  - word: स्वादिषु
    to: 1.4.18
  - word: असर्वनामस्थाने
    to: 1.4.18
  meaning: |-
    If a प्रत्यय which is not a सर्वनामस्थान and which is specified in the fourth or fifth chapter gets attached to an प्रकृति , the प्रकृति gets the term पद.
  kashika: |-
    स्वादिष्विति सुशब्दादेकवचनाद् [[४.१.२]] आरभ्य आ कपः [[५.४.१५१]] प्रत्यया गृह्यन्ते। स्वादिषु प्रत्ययेषु परतः सर्वनामस्थानवर्जितेषु पूर्वं पदसंज्ञं भवति। राजभ्याम्, राजभिः। राजत्वम्। राजता। राजतरः। राजतमः। असर्वनामस्थान इति किम्? राजानौ, राजानः॥
  vartika: []
  rule: |-
    Before the affixes from **सु** [[4.1.2]] through **कप्** [[5.4.151]], when they are not **सर्वनामस्थान**, what comes before is a **पद**.
- id: '14018'
  ref: 1.4.18
  a: 1
  p: 4
  n: 18
  s: यचि भम्
  iast: yaci bham
  type: S
  typeName: saṃjñā
  pada:
  - यचि
  - भम्
  adhikara: आकडारात् एका संज्ञा
  inherits:
  - word: स्वादिषु
    from: 1.4.17
  - word: असर्वनामस्थाने
    from: 1.4.17
  feeds:
  - word: भम्
    to: 1.4.19
  - word: भम्
    to: 1.4.20
  meaning: |-
    If a यकारादि or an अजादि प्रत्यय which is not a सर्वनामस्थान and which is specified in the fourth or fifth chapter gets attached to a प्रकृति , the प्रकृति gets the term भ.
  kashika: |-
    स्वादिष्वसर्वनामस्थान इति वर्तते। पूर्वेण पदसंज्ञायां प्राप्तायां तदपवादो भसंज्ञा विधीयते। यकारादावजादौ च स्वादौ सर्वनामस्थानवर्जिते प्रत्यये परतः पूर्वं भसंज्ञं भवति। यकारादौ — गार्ग्यः। वात्स्यः। अजादौ — दाक्षिः। प्लाक्षिः॥ नभोऽङ्गिरोमनुषां वत्युपसंख्यानम्॥ नभ इव नभस्वत्। अङ्गिरा इव अङ्गिरस्वत्। मनुरिव मनुष्वत्॥ वृषण्वस्वश्वयोः॥ वृषन्नित्येतत् वस्वश्वयोः परतो भसंज्ञं भवति छन्दसि विषये। वृष॑ण्वसुः (ऋ०१.१११.१)। वृ॒षणश्वस्य मेने (श०ब्रा० ३.३.४.१८)। भप्रदेशाः — <<भस्य>> [[६.४.१२९]] इत्येवमादयः॥
  vartika:
  - नभोऽङिरोमनुषां वत्युपसंख्यानम् ।
  - वृषण्वस्वश्वयोः ।
  rule: |-
    Before such an affix (from **सु** to **कप्**, not **सर्वनामस्थान**) that starts with य् or a vowel, what comes before is **भ** instead.
