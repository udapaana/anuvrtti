  - word: हीने
    from: 1.4.86
  feeds: []
  meaning: ''
  kashika: |-
    उपशब्दोऽधिके हीने च द्योत्ये कर्मप्रवचनीयसंज्ञो भवति। उप खार्यां द्रोणः। उप निष्के कार्षापणम्। हीने — उप शाकटायनं वैयाकरणाः॥
  vartika: []
  rule: |-
    उप is **कर्मप्रवचनीय** when it means being more than, and also when it means being less than.
- id: '14088'
  ref: 1.4.88
  a: 1
  p: 4
  n: 88
  s: अपपरी वर्जने
  iast: apaparī varjane
  type: S
  typeName: saṃjñā
  pada:
  - अपपरी
  - वर्जने
  adhikara: आकडारात् एका संज्ञा
  inherits:
  - word: कर्मप्रवचनीयाः
    from: 1.4.83
  feeds: []
  meaning: ''
  kashika: |-
    अपपरी शब्दौ वर्जने द्योत्ये कर्मप्रवचनीयसंज्ञौ भवतः। प्रकृतेन संबन्धिना कस्यचिदनभिसंबन्धो वर्जनम्। अप त्रिगर्तेभ्यो वृष्टो देवः। परिपरि त्रिगर्तेभ्यो वृष्टो देवः। वर्जन इति किम्? ओदनं परिषिञ्चति॥
  vartika: []
  rule: अप and परि are **कर्मप्रवचनीय** when they mean leaving out.
- id: '14089'
  ref: 1.4.89
  a: 1
  p: 4
  n: 89
  s: आङ् मर्यादावचने
  iast: āṅ maryādāvacane
  type: S
  typeName: saṃjñā
  pada:
  - आङ्
  - मर्यादावचने
  adhikara: आकडारात् एका संज्ञा
  inherits:
  - word: कर्मप्रवचनीयाः
    from: 1.4.83
  feeds: []
  meaning: ''
  kashika: |-
    आङित्येष शब्दो मर्यादावचने कर्मप्रवचनीयसंज्ञो भवति। अवधिर्मर्यादा। वचनग्रहणादभिविधिरपि गृह्यते। आ पाटलिपुत्राद् वृष्टो देवः। आ कुमारं यशः पाणिनेः। आ सांकाश्यात्। आ मथुरायाः। मर्यादावचन इति किम्? ईषदर्थ क्रियायोगे च मा भूत्॥
  vartika:
  - आङ्मर्यादाभिविध्योरिति वक्तव्यम् ।
  rule: |-
    आङ् is **कर्मप्रवचनीय** when it marks a limit (up to, whether including or excluding the endpoint).
- id: '14090'
  ref: 1.4.90
  a: 1
  p: 4
  n: 90
  s: लक्षणेत्थम्भूताख्यानभागवीप्सासु प्रतिपर्यनवः
  iast: lakṣaṇetthambhūtākhyānabhāgavīpsāsu pratiparyanavaḥ
  type: S
  typeName: saṃjñā
  pada:
  - लक्षण-इत्थम्भूताख्यान-भाग-वीप्सासु
  - प्रति-परि-अनवः
  adhikara: आकडारात् एका संज्ञा
  inherits:
  - word: कर्मप्रवचनीयाः
    from: 1.4.83
  feeds:
  - word: लक्षण-इत्थम्भूताख्यान-भाग-वीप्सासु
    to: 1.4.91
  - word: लक्षण-इत्थम्भूताख्यान-भाग-वीप्सासु
    to: 1.4.92
  meaning: ''
  kashika: |-
    लक्षण इत्थंभूताख्याने भागे वीप्सायां च विषयभूतायां प्रति परि अनु इत्येते कर्मप्रवचनीयसंज्ञा भवन्ति। लक्षणे तावत् — वृक्षं प्रति विद्योतते विद्युत्। वृक्षं परि। वृक्षमनु। इत्थंभूताख्याने — साधुर्देवदत्तो मातरं प्रति। मातरं परि। मातरमनु। भागे — यदत्र मां प्रति स्यात्। मां परि स्यात्। मामनु स्यात्। वीप्सायाम् — वृक्षंवृक्षं प्रति सिञ्चति। परि सिञ्चति। अनु सिञ्चति। लक्षणादिष्विति किम्? ओदनं परिषिञ्चति। अथ परिशब्दयोगे पञ्चमी कस्माद् न भवति <<पञ्चम्यपाङ्परिभिः>> [[२.३.१०]] इति? वर्जनविषये सा विधीयते, अपशब्दसाहचर्यात्॥
  vartika: []
  rule: |-
    प्रति, परि, and अनु are **कर्मप्रवचनीय** when they mean a sign/direction toward something, a mere statement of circumstance ("as regards"), a share, or pervasion ("one after another").
- id: '14091'
