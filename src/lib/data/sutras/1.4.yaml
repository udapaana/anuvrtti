    ध्रुवं यदपाययुक्तमपाये साध्ये यदवधिभूतं तत् कारकमपादानसंज्ञं भवति। ग्रामादागच्छति। पर्वतादवरोहति। सार्थाद् धीनः। रथात् पतितः॥ जुगुप्साविरामप्रमादार्थानामुपसंख्यानम्॥ अधर्माज् जुगुप्सते। अधर्माद् विरमति। धर्मात् प्रमाद्यति। अपादानप्रदेशाः — <<अपादाने पञ्चमी>> [[२.३.२८]] इत्येवमादयः॥
  vartika:
  - जुगुप्साविरामप्रमादार्थनामुपसंख्यानम् ।
  rule: The fixed point that something moves away from is **अपादान**.
- id: '14025'
  ref: 1.4.25
  a: 1
  p: 4
  n: 25
  s: भीत्रार्थानां भयहेतुः
  iast: bhītrārthānāṃ bhayahetuḥ
  type: S
  typeName: saṃjñā
  pada:
  - भी-त्रा-अर्थानाम्
  - भयहेतुः
  adhikara: आकडारात् एका संज्ञा
  inherits:
  - word: अपादानम्
    from: 1.4.24
  feeds: []
  meaning: ''
  kashika: |-
    बिभेत्यर्थानां त्रायत्यर्थानां च धातूनां प्रयोगे भयहेतुर्यस्तत् कारकमपादानसंज्ञं भवति। चौरेभ्यो बिभेति। चौरेभ्य उद्विजते। त्रायत्यर्थानाम् — चौरेभ्यस्त्रायते। चौरेभ्यो रक्षति। भयहेतुरिति किम्? अरण्ये बिभेति। अरण्ये त्रायते॥
  vartika: []
  rule: With verbs of fearing or protecting, the source of the fear is **अपादान**.
- id: '14026'
  ref: 1.4.26
  a: 1
  p: 4
  n: 26
  s: पराजेरसोढः
  iast: parājerasoḍhaḥ
  type: S
  typeName: saṃjñā
  pada:
  - पराजेः
  - असोढः
  adhikara: आकडारात् एका संज्ञा
  inherits:
  - word: अपादानम्
    from: 1.4.24
  feeds: []
  meaning: ''
  kashika: |-
    परापूर्वस्य जयतेः प्रयोगेऽसोढो योऽर्थः, सोढुं न शक्यते, तत् कारकमपादानसंज्ञं भवति। अध्ययनात् पराजयते। असोढ इति किम्? शत्रून् पराजयते॥
  vartika: []
  rule: With **पराजि** 'find unbearable', what one cannot endure is **अपादान**.
- id: '14027'
  ref: 1.4.27
  a: 1
  p: 4
  n: 27
  s: वारणार्थानामीप्सितः
  iast: vāraṇārthānāmīpsitaḥ
  type: S
  typeName: saṃjñā
  pada:
  - वारण-अर्थानाम्
  - ईप्सितः
  adhikara: आकडारात् एका संज्ञा
  inherits:
  - word: अपादानम्
    from: 1.4.24
  feeds: []
  meaning: ''
  kashika: |-
    वारणार्थानां धातूनां प्रयोगे य ईप्सितोऽर्थः, तत् कारकमपादानसंज्ञं भवति। प्रवृत्तिविघातो वारणम्। यवेभ्यो गा वारयति। यवेभ्यो गा निवर्तयति। ईप्सित इति किम्? यवेभ्यो गा वारयति क्षेत्रे॥
  vartika: []
  rule: With verbs of warding off, the desired thing one is kept from is **अपादान**.
- id: '14028'
  ref: 1.4.28
  a: 1
  p: 4
  n: 28
  s: अन्तर्द्धौ येनादर्शनमिच्छति
  iast: antarddhau yenādarśanamicchati
  type: S
  typeName: saṃjñā
  pada:
  - अन्तर्द्धौ
  - येन
  - अदर्शनम्
  - इच्छति
  adhikara: आकडारात् एका संज्ञा
  inherits:
  - word: अपादानम्
    from: 1.4.24
  feeds: []
  meaning: ''
  kashika: |-
    व्यवधानमन्तर्धिः। अन्तर्धिनिमित्तं येनादर्शनमात्मन इच्छति, तत् कारकमपादानसंज्ञं भवति। उपाध्यायाद् अन्तर्धत्ते। उपाध्यायाद् निलीयते। मा मामुपाध्यायो द्राक्षीदिति निलीयते। अन्तर्धाविति किम्? चौरान् न दिदृक्षते। इच्छतिग्रहणं किम्? अदर्शनेच्छायां सत्यां सत्यपि दर्शने यथा स्यात्॥
  vartika: []
  rule: In hiding, the one whose sight you want to escape is **अपादान**.
- id: '14029'
  ref: 1.4.29
  a: 1
  p: 4
  n: 29
  s: आख्यातोपयोगे
  iast: ākhyātopayoge
  type: S
  typeName: saṃjñā
  pada:
  - आख्याता
  - उपयोगे
  adhikara: आकडारात् एका संज्ञा
  inherits:
  - word: अपादानम्
    from: 1.4.24
  feeds: []
  meaning: ''
  kashika: |-
    आख्याता प्रतिपादयिता। उपयोगो नियमपूर्वकं विद्याग्रहणम्। उपयोगे साध्ये य आख्याता, तत् कारकमपादानसंज्ञं भवति। उपाध्यायादधीते। उपाध्यायादागमयति। उपयोग इति किम्? नटस्य गाथां शृणोति॥
  vartika: []
  rule: In formal learning, the teacher one learns from is **अपादान**.
- id: '14030'
  ref: 1.4.30
  a: 1
  p: 4
  n: 30
  s: जनिकर्तुः प्रकृतिः
  iast: janikartuḥ prakṛtiḥ
  type: S
  typeName: saṃjñā
  pada:
  - जनिकर्तुः
  - प्रकृतिः
  adhikara: आकडारात् एका संज्ञा
  inherits:
  - word: अपादानम्
    from: 1.4.24
  feeds:
  - word: कर्तुः
    to: 1.4.31
  meaning: ''
  kashika: |-
    जनेः कर्ता जनिकर्ता। जन्यर्थस्य जन्मनः कर्ता जायमानः, तस्य या प्रकृतिः कारणं हेतुः, तत् कारकमपादानसंज्ञं भवति। शृङ्गाच् छरो जायते। गोमयाद् वृश्चिको जायते॥
  vartika: []
  rule: With जन् (be born), the source the agent springs from is the **अपादान**.
- id: '14031'
  ref: 1.4.31
  a: 1
  p: 4
  n: 31
  s: भुवः प्रभवः
  iast: bhuvaḥ prabhavaḥ
  type: S
  typeName: saṃjñā
  pada:
  - भुवः
  - प्रभवः
  adhikara: आकडारात् एका संज्ञा
  inherits:
  - word: अपादानम्
    from: 1.4.24
  - word: कर्तुः
    from: 1.4.30
  feeds: []
  meaning: ''
  kashika: |-
    कर्तुरिति वर्तते। भवनं भूः। प्रभवत्यस्मादिति प्रभवः। भूकर्तुः प्रभवो यः, तत् कारकमपादानसंज्ञं भवति। हिमवतो गङ्गा प्रभवति। काश्मीरेभ्यो वितस्ता प्रभवति। प्रथमत उपलभ्यत इत्यर्थः॥
  vartika: []
  rule: With भू (arise), the source the agent springs from is the **अपादान**.
- id: '14032'
  ref: 1.4.32
  a: 1
  p: 4
  n: 32
  s: कर्मणा यमभिप्रैति स सम्प्रदानम्
