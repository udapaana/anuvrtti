  kashika: |-
    भमिति वर्तते। तकारान्तं सकारान्तं शब्दरूपं मत्वर्थे प्रत्यये परतो भसंज्ञं भवति। उदश्वित्वान् घोषः। विद्युत्वान् बलाहकः। सकारान्तम् — यशस्वी। पयस्वी। तसाविति किम्? तक्षवान् ग्रामः॥
