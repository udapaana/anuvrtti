# Adhyāya 1, Pāda 4 — 110 sūtras
sutras:
- id: '14001'
  ref: 1.4.1
  a: 1
  p: 4
  n: 1
  s: आ कडारादेका संज्ञा
  iast: ā kaḍārādekā saṃjñā
  type: AD
  typeName: adhikāra
  pada:
  - आ
  - कडारात्
  - एका
  - संज्ञा
  adhikara: आकडारात् एका संज्ञा
  inherits: []
  feeds: []
  meaning: "If a word is given two संज्ञाs  under this अधिकार, and if the संज्ञा given by the later sutra\
    \ can only be given whenever the संज्ञा given by the earlier sutra is given, then under such circumstances,\
    \ the word gets only the संज्ञा given by the later sutra, not the earlier sutra. "
  kashika: |-
    <<कडाराः कर्मधारये>> [[२.२.३८]] इति वक्ष्यति। आ एतस्मात् सूत्रावधेर्यदित ऊर्ध्वमनुक्रमिष्यामः, तत्र एका संज्ञा भवतीति वेदितव्यम्। का पुनरसौ? या परानवकाशा च। अन्यत्र संज्ञासमावेशान्नियमार्थं वचनम्, एकैव संज्ञा भवतीति। वक्ष्यति — <<ह्रस्वं लघु>> [[१.४.१०]]। भिदि, छिदि — भेत्ता। छेत्ता। <<संयोगे गुरु>> [[१.४.११]]। शिक्षि, भिक्षि — शिक्षा। भिक्षा। संयोगपरस्य ह्रस्वस्य लघुसंज्ञा प्राप्नोति गुरुसंज्ञा च। एका संज्ञेति वचनाद् गुरुसंज्ञैव भवति। अततक्षत्। अररक्षत्। <<सन्वल्लघुनि०>> [[७.४.९३]] इत्येष विधिर्न भवति॥
  vartika: []
  rule: |-
    From here through **कडाराः कर्मधारये** [[2.2.38]], each thing gets only one **संज्ञा** (no piling up of names).
- id: '14002'
  ref: 1.4.2
  a: 1
  p: 4
  n: 2
  s: विप्रतिषेधे परं कार्यम्
  iast: vipratiṣedhe paraṃ kāryam
  type: P
  typeName: paribhāṣā
  pada:
  - विप्रतिषेधे
  - परम्
  - कार्यम्
  adhikara: आकडारात् एका संज्ञा
  inherits: []
  feeds: []
  meaning: "If two sutras that can be invoked independent of each other happen to conflict at the same\
    \ step during a प्रक्रिया, then the later occurring sutra gets applied by precedence. "
  kashika: |-
    तुल्यबलविरोधो विप्रतिषेधः। यत्र द्वौ प्रसङ्गावन्यार्थावेकस्मिन् युगपत् प्राप्नुतः स तुल्यबलविरोधो विप्रतिषेधः। तस्मिन् विप्रतिषेधे परं कार्यं भवति। उत्सर्गापवादनित्यानित्यान्तरङ्गबहिरङ्गेषु तुल्यबलता नास्तीति नायमस्य योगस्य विषयः। बलवतैव तत्र भवितव्यम्। अप्रवृत्तौ पर्यायेण वा प्रवृत्तौ प्राप्तायां वचनमारभ्यते। <<अतो दीर्घो यञि>> [[७.३.१०१]] <<सुपि च>> [[७.३.१०२]] इत्यस्यावकाशः — वृक्षाभ्याम्। प्लक्षाभ्याम्। <<बहुवचने झल्येत्>>[[७.३.१०३]] इत्यस्यावकाशः — वृक्षेषु। प्लक्षेषु। इहोभयं प्राप्नोतिवृक्षेभ्यः, प्लक्षेभ्य इति। परं भवति विप्रतिषेधेन॥
  vartika: []
  rule: |-
    When two rules of equal strength clash, the later one wins. (Exception/general, fixed/optional, **अन्तरङ्ग**/**बहिरङ्ग** are not equal strength — the stronger one wins there.)
