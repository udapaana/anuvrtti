  vartika: []
  rule: |-
    When अस्मद् ("I") agrees with the verb — present or merely understood — the verb takes the **उत्तम** (1st person).
- id: '14108'
  ref: 1.4.108
  a: 1
  p: 4
  n: 108
  s: शेषे प्रथमः
  iast: śeṣe prathamaḥ
  type: V
  typeName: vidhi
  pada:
  - शेषे
  - प्रथमः
  adhikara: आकडारात् एका संज्ञा
  inherits:
  - word: समानाधिकरणे
    from: 1.4.105
  - word: स्थानिनि
    from: 1.4.105
  - word: अपि
    from: 1.4.105
  feeds: []
  meaning: |-
    Where a form of the word other than अस्मद् or युष्मद् shows the same substance which is shown by the लकार, there the तिङन्तपद must be expressed using the प्रथमपुरुष प्रत्ययाs.
  kashika: |-
    शेष इति मध्यमोत्तमविषयादन्य उच्यते। यत्र युष्मदस्मदी समानाधिकरणे उपपदे न स्तः, तत्र शेषे प्रथमपुरुषो भवति। पचति। पचतः। पचन्ति॥
  vartika: []
  rule: |-
    Everywhere else — when neither "you" nor "I" agrees with the verb — it takes the **प्रथम** (3rd person).
- id: '14109'
  ref: 1.4.109
  a: 1
  p: 4
  n: 109
  s: परः सन्निकर्षः संहिता
  iast: paraḥ sannikarṣaḥ saṃhitā
  type: S
  typeName: saṃjñā
  pada:
  - परः
  - सन्निकर्षः
  - संहिता
  adhikara: आकडारात् एका संज्ञा
  inherits: []
  feeds: []
  meaning: Extreme closeness of letters is called संहिता.
  kashika: |-
    परशब्दोऽतिशये वर्तते। संनिकर्षः प्रत्यासत्तिः। परो यः संनिकर्षो वर्णनामर्धमात्राकालव्यवधानं स संहितासंज्ञो भवति। दध्यत्र। मध्वत्र। संहिताप्रदेशाः — <<संहितायाम्>> [[६.१.७२]] इत्येवमादयः॥
  vartika: []
  rule: |-
    The tightest closeness of sounds, a gap of half a **मात्रा** between them, is **संहिता**.
- id: '14110'
  ref: 1.4.110
  a: 1
