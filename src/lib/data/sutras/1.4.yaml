  typeName: saṃjñā
  pada:
  - प्रतिः
  - प्रतिनिधि-प्रतिदानयोः
  adhikara: आकडारात् एका संज्ञा
  inherits:
  - word: कर्मप्रवचनीयाः
    from: 1.4.83
  - word: लक्षण-इत्थम्भूताख्यान-भाग-वीप्सासु
    from: 1.4.90
  feeds: []
  meaning: ''
  kashika: |-
    मुख्यसदृशः प्रतिनिधिः। दत्तस्य प्रतिनिर्यातनं प्रतिदानम्। प्रतिनिधिविषये प्रतिदानविषये च प्रतिः कर्मप्रवचनीयसंज्ञो भवति। अभिमन्युरर्जुनतः प्रति। माषानस्मै तिलेभ्यः प्रति यच्छति॥
  vartika: []
  rule: |-
    प्रति is **कर्मप्रवचनीय** when it means a stand-in ("in place of") or an exchange ("in return for").
- id: '14093'
  ref: 1.4.93
  a: 1
  p: 4
  n: 93
  s: अधिपरी अनर्थकौ
