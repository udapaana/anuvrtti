  iast: hīne
  type: S
  typeName: saṃjñā
  pada:
  - हीने
  adhikara: आकडारात् एका संज्ञा
  inherits:
  - word: कर्मप्रवचनीयाः
    from: 1.4.83
  - word: अनुः
    from: 1.4.84
  feeds:
  - word: हीने
    to: 1.4.87
  meaning: ''
  kashika: |-
    हीन इति न्यून उच्यते स च उत्कृष्टापेक्षः। तेनेयं हीनोत्कृष्टसंबन्धे संज्ञा विज्ञायते। हीने द्योत्येऽयमनुः कर्मप्रवचनीयसंज्ञो भवति। अनु शाकटायनं वैयाकरणाः। अन्वर्जुनं योद्धारः॥
  vartika: []
  rule: अनु is **कर्मप्रवचनीय** when it means being lesser than something.
- id: '14087'
  ref: 1.4.87
  a: 1
  p: 4
  n: 87
  s: उपोऽधिके च
  iast: upo'dhike ca
