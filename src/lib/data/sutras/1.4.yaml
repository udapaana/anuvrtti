    to: 1.4.33
  - word: सम्प्रदानम्
    to: 1.4.34
  - word: सम्प्रदानम्
    to: 1.4.35
  - word: सम्प्रदानम्
    to: 1.4.36
  - word: सम्प्रदानम्
    to: 1.4.37
  - word: सम्प्रदानम्
    to: 1.4.38
  - word: सम्प्रदानम्
    to: 1.4.39
  - word: सम्प्रदानम्
    to: 1.4.40
  - word: सम्प्रदानम्
    to: 1.4.41
  meaning: ''
  kashika: |-
    कर्मणा करणभूतेन कर्ता यमभिप्रैति, तत् कारकं संप्रदानसंज्ञं भवति। अन्वर्थसंज्ञाविज्ञानाद् ददातिकर्मणेति विज्ञायते। उपाध्यायाय गां ददाति। माणवकाय भिक्षां ददाति॥ क्रियाग्रहणमपि कर्तव्यम्॥ क्रिययापि यमभिप्रैति स संप्रदानम्। श्राद्धाय निगर्हते। युद्धाय संनह्यते। पत्ये शेते। संप्रदानप्रदेशाः — <<चतुर्थी संप्रदाने>> [[२.३.१३]] इत्येवमादयः॥ कर्मणः करणसंज्ञा वक्तव्या संप्रदानस्य च कर्मसंज्ञा॥ पशुना रुद्रं यजते। पशुं रुद्राय ददातीत्यर्थः॥
  vartika:
  - क्रियया यमभिप्रैति स सम्प्रदानम् ।
  - कर्मणः करणसंज्ञा संप्रदानस्य च कर्मसंज्ञा वक्तव्या ।
  rule: |-
    The one the agent aims the object of giving at is the **सम्प्रदान** (the recipient).
- id: '14033'
  ref: 1.4.33
  a: 1
  p: 4
  n: 33
  s: रुच्यर्थानां प्रीयमाणः
  iast: rucyarthānāṃ prīyamāṇaḥ
  type: S
  typeName: saṃjñā
  pada:
  - रुचि-अर्थानाम्
  - प्रीयमाणः
  adhikara: आकडारात् एका संज्ञा
  inherits:
  - word: सम्प्रदानम्
    from: 1.4.32
  feeds: []
  meaning: ''
  kashika: |-
    रुचिना समानार्था रुच्यर्थाः। अन्यकर्तृकोऽभिलाषो रुचिः। रुच्यर्थानां धातूनां प्रयोगे प्रीयमाणो योऽर्थः, तत् कारकं संप्रदानसंज्ञं भवति। देवदत्ताय रोचते मोदकः। यज्ञदत्ताय स्वदतेऽपूपः। देवदत्तस्थस्याभिलाषस्य मोदकः कर्ता। प्रीयमाण इति किम्? देवदत्ताय रोचते मोदकः पथि॥
  vartika: []
  rule: |-
    With verbs meaning like रुच् (please), the one who is pleased is the **सम्प्रदान**.
- id: '14034'
  ref: 1.4.34
  a: 1
  p: 4
  n: 34
  s: श्लाघह्नुङ्स्थाशपां ज्ञीप्स्यमानः
  iast: ślāghahnuṅsthāśapāṃ jñīpsyamānaḥ
  type: S
  typeName: saṃjñā
  pada:
  - श्लाघ-ह्नुङ्-स्था-शपाम्
  - ज्ञीप्स्यमानः
  adhikara: आकडारात् एका संज्ञा
  inherits:
  - word: सम्प्रदानम्
    from: 1.4.32
  feeds: []
  meaning: ''
  kashika: |-
    श्लाघ, ह्नुङ्, स्था, शप् इत्येतेषां ज्ञीप्स्यमानो योऽर्थः, तत् कारकं संप्रदानसंज्ञं भवति। ज्ञीप्स्यमानो ज्ञपयितुमिष्यमाणो बोधयितुमभिप्रेतः। देवदत्ताय श्लाघते। देवदत्तं श्लाघमानस्तां श्लाघां तमेव ज्ञपयितुमिच्छतीत्यर्थः। एवं देवदत्ताय ह्नुते। यज्ञदत्ताय ह्नुते। देवदत्ताय तिष्ठते। यज्ञदत्ताय तिष्ठते। देवदत्ताय शपते। यज्ञदत्ताय शपते। ज्ञीप्स्यमान इति किम्? देवदत्तः श्लाघते॥
  vartika: []
  rule: |-
    With श्लाघ् (praise), ह्नु (deny), स्था (offer oneself), शप् (curse), the one you want to make aware of it is the **सम्प्रदान**.
- id: '14035'
  ref: 1.4.35
  a: 1
  p: 4
  n: 35
  s: धारेरुत्तमर्णः
  iast: dhāreruttamarṇaḥ
  type: S
  typeName: saṃjñā
  pada:
  - धारेः
  - उत्तमर्णः
  adhikara: आकडारात् एका संज्ञा
  inherits:
  - word: सम्प्रदानम्
    from: 1.4.32
  feeds: []
  meaning: ''
  kashika: |-
    धारयतेः प्रयोग उत्तमर्णो योऽर्थः, तत् कारकं संप्रदानसंज्ञं भवति। उत्तममृणं यस्य स उत्तमर्णः। कस्य चोत्तममृणम्? यदीयं धनम्, धनस्वामी प्रयोक्ता उत्तमर्णः, स संप्रदानसंज्ञो भवति। देवदत्ताय शतं धारयति। यज्ञदत्ताय शतं धारयति। उत्तमर्ण इति किम्? देवदत्ताय शतं धारयति ग्रामे॥
  vartika: []
  rule: With धारि (owe), the creditor is the **सम्प्रदान**.
- id: '14036'
  ref: 1.4.36
  a: 1
  p: 4
  n: 36
  s: स्पृहेरीप्सितः
  iast: spṛherīpsitaḥ
  type: S
  typeName: saṃjñā
  pada:
  - स्पृहेः
  - ईप्सितः
  adhikara: आकडारात् एका संज्ञा
  inherits:
  - word: सम्प्रदानम्
    from: 1.4.32
  feeds: []
  meaning: ''
  kashika: |-
    <<स्पृह ईप्सायाम्>> चुरादावदन्तः पठ्यते। तस्येप्सितो योऽर्थः, तत् कारकं संप्रदानसंज्ञं भवति। ईप्सित इत्यभिप्रेत उच्यते। पुष्पेभ्यः स्पृहयति। फलेभ्यः स्पृहयति। ईप्सित इति किम्? पुष्पेभ्यो वने स्पृहयति॥
  vartika: []
  rule: With स्पृह् (desire), the thing desired is the **सम्प्रदान**.
- id: '14037'
  ref: 1.4.37
  a: 1
  p: 4
  n: 37
  s: क्रुधद्रुहेर्ष्याऽसूयार्थानां यं प्रति कोपः
  iast: krudhadruherṣyā'sūyārthānāṃ yaṃ prati kopaḥ
  type: S
  typeName: saṃjñā
  pada:
  - क्रुध-द्रुह-ईर्ष्या-असूया-अर्थानाम्
  - यम्
  - प्रति
  - कोपः
  adhikara: आकडारात् एका संज्ञा
  inherits:
  - word: सम्प्रदानम्
    from: 1.4.32
  feeds:
  - word: यम्
    to: 1.4.38
  - word: प्रति
    to: 1.4.38
  - word: कोपः
    to: 1.4.38
  meaning: ''
  kashika: |-
    अमर्षः क्रोधः। अपकारो द्रोहः। अक्षमेर्ष्या। गुणेषु दोषाविष्करणमसूया। क्रुधाद्यर्थानां प्रयोगे यं प्रति कोपः, तत् कारकं संप्रदानसंज्ञे भवति। क्रोधस्तावत् कोप एव, द्रोहादयोऽपि कोपप्रभवा एव गृह्यन्ते। तस्मात् सामान्येन विशेषणं <<यं प्रति कोप>> इति। देवदत्ताय क्रुध्यति। देवदत्ताय द्रुह्यति। देवदत्तायेर्ष्यति। देवदत्तायासूयति। यं प्रति कोप इति किम्? भार्यामीर्ष्यति, मैनामन्यो द्राक्षीदिति॥
  vartika: []
  rule: |-
    With verbs meaning क्रुध् (be angry), द्रुह् (harm), ईर्ष्या (envy), असूया (find fault), the one the anger is aimed at is the **सम्प्रदान**.
