    \ नुद — नुन्नः, नुत्तः। विद — विन्नः, वित्तः। उन्द — समुन्नः, समुत्तः। त्रा — त्राणः, त्रातः। घ्रा\
    \ — घ्राणः, घ्रातः। ह्री — ह्रीणः, ह्रीतः। ह्री इत्येतस्मादप्राप्तं नत्वम्, इतरेषां नित्यं प्राप्तं\
    \ विकल्प्यते। <<विद विचारणे>> इत्यस्य विदेरिह ग्रहणमिष्यते। एवं ह्युक्तम् — \n\nवेत्तेस्तु विदितो\
    \ निष्ठा विद्यतेर्विन्न इष्यते।\n\nविन्तेर्विन्नश्च वित्तश्च भोगवित्तश्च विन्दतेः॥ इति॥"
  vartika: []
  rule: After नुद, विद, उन्द, त्रा, घ्रा, ह्री the **निष्ठा** त optionally becomes न।
