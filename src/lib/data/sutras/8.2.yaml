  iast: saṃyogāderāto dhātoryaṇvataḥ
  type: V
  typeName: vidhi
  pada:
  - संयोगादेः
  - आतः
  - धातोः
  - यण्वतः
  adhikara: पदस्य
  inherits:
  - word: निष्ठातः
    from: 8.2.42
  - word: नः
    from: 8.2.42
  feeds: []
  meaning: ''
  kashika: |-
    संयोगादिर्यो धातुराकारान्तो यण्वान्, तस्मादुत्तरस्य निष्ठातकारस्य नकारादेशो भवति। प्रद्राणः। प्रद्राणवान्। म्लानः। म्लानवान्। संयोगादेरिति किम्? यातः। यातवान्। आत इति किम्? च्युतः। च्युतवान्। प्लुतः। प्लुतवान्। धातोरिति किम्? निर्यातः। निर्वातः। यण्वत इति किम्? स्नातः। स्नातवान्॥
  vartika: []
  rule: |-
    The **निष्ठा** त becomes न after a root that ends in आ and begins with a conjunct consonant containing a **यण्** (semivowel).
- id: '82044'
  ref: 8.2.44
  a: 8
  p: 2
  n: 44
  s: ल्वादिभ्यः
  iast: lvādibhyaḥ
  type: V
  typeName: vidhi
  pada:
