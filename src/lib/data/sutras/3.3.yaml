  meaning: ''
  kashika: |-
    निघ इति निपूर्वाद् हन्तेरप् प्रत्ययः टिलोपो घत्वं च निपात्यते, निमितं चेदभिधेयं भवति। समन्ताद् मितं निमितम्, समारोहपरिणाहम्। निघा वृक्षाः। निघाः शालयः। निमितमिति किम्? निघातः॥
  vartika: []
  rule: |-
    निघ, meaning as high as it is broad, is the irregular form of नि + हन् with **अप्**: the final न drops and ह becomes घ. It holds only in that sense.
- id: '33088'
  ref: 3.3.88
  a: 3
  p: 3
  n: 88
  s: ड्वितः क्त्रिः
  iast: ḍvitaḥ ktriḥ
  type: V
  typeName: vidhi
  pada:
  - ड्वितः
  - क्त्रिः
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  feeds: []
  meaning: ''
  kashika: |-
    भावेऽकर्तरि च कारक इति वर्तते। डु इद् यस्य, तस्माद् ड्वितो धातोः क्त्रिः प्रत्ययो भवति। <<क्त्रेर्मम्नित्यम्>>  [[४.४.२०]] इति वचनात् केवलो न प्रयुज्यते।  <<डुपचष् पाके>> — पक्त्रिमम्। <<डुवप बीजसंताने>> — उप्त्रिमम्। <<डुकृञ् करणे>> — कृत्रिमम्॥
  vartika: []
  rule: |-
    A root marked with डु takes **क्त्रि** for the action. By [[4.4.20]] क्त्रि never stands alone, so म is always added: पक्त्रिम, उप्त्रिम, कृत्रिम.
- id: '33089'
  ref: 3.3.89
  a: 3
  p: 3
  n: 89
