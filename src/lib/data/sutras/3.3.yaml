    स्म इति वर्तते। अधीष्टं व्याख्यातम् [[३.३.१६१]]। स्मशब्द उपपदेऽधीष्टे गम्यमाने धातोर्लोट् प्रत्ययो भवति। लिङोऽपवादः। अङ्ग स्म राजन् माणवकमध्यापय। अङ्ग स्म राजन्नग्निहोत्रं जुहुधि॥
