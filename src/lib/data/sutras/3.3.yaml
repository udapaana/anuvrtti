  - word: उदात्तः
    from: 3.3.96
  feeds:
  - word: क्यप्
    to: 3.3.99
  - word: क्यप्
    to: 3.3.100
  meaning: ''
  kashika: |-
    उदात्त इत्येव। व्रजयजोर्धात्वोः स्त्रीलिङ्गे भावे क्यप् प्रत्ययो भवत्युदात्तः। क्तिनोऽपवादः। व्रज्या। इज्या। पित्करणमुत्तरत्र तुगर्थम्॥
  vartika: []
  rule: |-
    व्रज् and यज् take acutely accented **क्यप्** for a feminine word naming the action: व्रज्या, इज्या. This blocks **क्तिन्**.
- id: '33099'
  ref: 3.3.99
  a: 3
  p: 3
  n: 99
  s: संज्ञायां समजनिषदनिपतमनविदषुञ्शीङ्भृञिणः
  iast: saṃjñāyāṃ samajaniṣadanipatamanavidaṣuñśīṅbhṛñiṇaḥ
  type: V
  typeName: vidhi
  pada:
  - संज्ञायाम्
  - समज-निषद-निपत-मन-विद-षुञ्-शीङ्-भृञ्-इणः
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  - word: उदात्तः
    from: 3.3.96
  - word: क्यप्
    from: 3.3.98
  feeds: []
  meaning: ''
  kashika: |-
    भाव इति न स्वर्यते। पूर्व एवात्रार्थाधिकारः। समजादिभ्यो धातुभ्यः स्त्रियां क्यप् प्रत्ययो भवत्युदात्तः संज्ञायां विषये। समजन्त्यस्यामिति समज्या। निषद्या। निपत्या। मन्या। विद्या। सुत्या। शय्या। भृत्या। इत्या। कथं तदुक्तम् — <<स्त्रियां भावाधिकारोऽस्ति तेन भार्या प्रसिध्यति>> इति? भावाधिकारो भावव्यापारो वाच्यत्वेन विवक्षितः, न तु शास्त्रीयोऽधिकारः॥
  vartika: []
  rule: |-
    समज्, निषद्, निपत्, मन्, विद्, षु, शी, भृ, इ take acutely accented **क्यप्** for a feminine word that is an appellative: समज्या, निषद्या, निपत्या, मन्या, विद्या, सुत्या, शय्या, भृत्या, इत्या.
- id: '33100'
  ref: 3.3.100
  a: 3
  p: 3
  n: 100
  s: कृञः श च
  iast: kṛñaḥ śa ca
  type: V
  typeName: vidhi
  pada:
  - कृञः
  - श
  - च
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  - word: उदात्तः
    from: 3.3.96
  - word: क्यप्
    from: 3.3.98
  feeds:
  - word: श
    to: 3.3.101
  meaning: ''
  kashika: |-
    करोतेर्धातोः स्त्रियां शः प्रत्ययो भवति, चकारात् क्यप् च। योगविभागोऽत्र कर्तव्यः, क्तिन्नपि यथा स्यात्। क्रिया। कृत्या। कृतिः॥
  vartika: []
  rule: |-
    कृ takes **श** for a feminine word, and also **क्यप्** (and, by splitting the rule, **क्तिन्**): क्रिया, कृत्या, कृति.
- id: '33101'
  ref: 3.3.101
  a: 3
  p: 3
  n: 101
  s: इच्छा
  iast: icchā
  type: V
  typeName: vidhi
  pada:
  - इच्छा
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  - word: श
    from: 3.3.100
  feeds: []
  meaning: ''
  kashika: |-
    इषेर्धातोः शः प्रत्ययो यगभावश्च निपात्यते। इच्छा॥ परिचर्यापरिसर्यामृगयाटाट्यानामुपसंख्यानम्। परिचर्या। परिसर्या। मृगया। अटाट्या॥ जागर्तेरकारो वा॥ जागरा। जागर्या॥
  vartika:
  - परिचर्यापरिसर्यामृगयाटाट्यानामुपसङ्ख्यानम् ।
  - जागर्तेरकारो वा ।
  rule: 'इच्छा is the irregular form of इष् + **श**: the यक् of [[3.1.67]] is not added.'
- id: '33102'
  ref: 3.3.102
  a: 3
  p: 3
  n: 102
  s: अ प्रत्ययात्
  iast: a pratyayāt
  type: V
  typeName: vidhi
  pada:
  - अ
  - प्रत्ययात्
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  feeds:
  - word: अ
    to: 3.3.103
  meaning: ''
  kashika: |-
    प्रत्ययान्तेभ्यो धातुभ्यः स्त्रियामकारः प्रत्ययो भवति। क्तिनोऽपवादः। चिकीर्षा। जिहीर्षा। पुत्रीया। पुत्रकाम्या। लोलूया। कण्डूया॥
  vartika: []
  rule: |-
    A root ending in an affix (desiderative, causative, intensive, denominative) takes **अ** for a feminine word: चिकीर्षा, जिहीर्षा, पुत्रीया, लोलूया.
- id: '33103'
  ref: 3.3.103
  a: 3
  p: 3
  n: 103
  s: गुरोश्च हलः
  iast: gurośca halaḥ
  type: V
  typeName: vidhi
  pada:
