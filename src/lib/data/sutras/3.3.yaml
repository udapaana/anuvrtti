# Adhyāya 3, Pāda 3 — 176 sūtras
sutras:
- id: '33001'
  ref: 3.3.1
  a: 3
  p: 3
  n: 1
  s: उणादयो बहुलम्
  iast: uṇādayo bahulam
  type: V
  typeName: vidhi
  pada:
  - उणादयः
  - बहुलम्
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  feeds:
  - word: उणादयः
    to: 3.3.2
  - word: उणादयः
    to: 3.3.3
  meaning: ''
  kashika: |-
    वर्तमान इत्येव, संज्ञायामिति च। उणादयः प्रत्यया वर्तमानेऽर्थे संज्ञायां विषये बहुलं भवन्ति। यतो विहितास्ततोऽन्यत्रापि भवन्ति। केचिदविहिता एव प्रयोगत उन्नीयन्ते। <<कृवापाजिमिस्वदिसाध्यशूभ्य उण्>> (प०उ० १.१)। कारुः। वायुः। पायुः। जायुः। मायुः। स्वादुः। साधुः। आशुः।

    बाहुलकं प्रकृतेस्तनुदृष्टेः प्रायसमुच्चयनादपि तेषाम्।

    कार्यसशेषविधेश्च तदुक्तं नैगमरूढिभवं हि सुसाधु॥ १॥

    नाम च धातुजमाह निरुक्ते व्याकरणे शकटस्य च तोकम्।

    यन्न पदार्थविशेषसमुत्त्थं प्रत्ययतः प्रकृतेश्च तदूह्यम् ॥ २॥

    संज्ञासु धातुरूपाणि प्रत्ययाश्च ततः परे।

    कार्याद् विद्यादनूबन्धमेतच्छास्त्रमुणादिषु ॥ ३॥
  vartika: []
  rule: |-
    The **उणादि** affixes (उण् and the rest) attach diversely, with present meaning and naming sense.
- id: '33002'
  ref: 3.3.2
  a: 3
  p: 3
  n: 2
  s: भूतेऽपि दृश्यन्ते
  iast: bhūte'pi dṛśyante
  type: V
  typeName: vidhi
  pada:
  - भूते
  - अपि
  - दृश्यन्ते
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  - word: उणादयः
    from: 3.3.1
  feeds: []
  meaning: ''
  kashika: |-
    पूर्वत्र वर्तमानाधिकाराद् भूतार्थमिदं वचनम्। भूते काल उणादयः प्रत्यया दृश्यन्ते। वृत्तमिदं वर्त्म। चरितं तदिति चर्म। भसितं तदिति भस्म। दृशिग्रहणं प्रयोगानुसारार्थम्॥
  vartika: []
  rule: The **उणादि** affixes are also seen with past meaning.
- id: '33003'
  ref: 3.3.3
  a: 3
  p: 3
  n: 3
  s: भविष्यति गम्यादयः
  iast: bhaviṣyati gamyādayaḥ
  type: AD
  typeName: adhikāra
  pada:
  - भविष्यति
  - गमि-आदयः
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  - word: उणादयः
    from: 3.3.1
  feeds: []
  meaning: ''
  kashika: |-
    भविष्यति काले गम्यादयः शब्दाः साधवो भवन्ति। प्रत्ययस्यैव भविष्यत्कालता विधीयते न प्रकृतेः। गमी ग्रामम्। आगामी। प्रस्थायी। प्रतिरोधी। प्रतिबोधी। प्रतियोधी। प्रतियोगी। प्रतियायी। आयायी। भावी॥ अनद्यतन उपसंख्यानम्॥ श्वो गमी ग्रामम्॥
  vartika: []
  rule: गामि and the rest are valid forms with future meaning.
- id: '33004'
  ref: 3.3.4
  a: 3
  p: 3
  n: 4
  s: यावत्पुरानिपातयोर्लट्
  iast: yāvatpurānipātayorlaṭ
  type: V
  typeName: vidhi
  pada:
  - यावत्-पुरा-निपातयोः
  - लट्
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  feeds:
  - word: यावत्-पुरा-निपातयोः
    to: 3.3.5
  - word: यावत्-पुरा-निपातयोः
    to: 3.3.6
  - word: यावत्-पुरा-निपातयोः
    to: 3.3.7
  - word: यावत्-पुरा-निपातयोः
    to: 3.3.8
  - word: यावत्-पुरा-निपातयोः
    to: 3.3.9
  meaning: ''
  kashika: |-
    भविष्यतीत्येव। यावत्पुराशब्दयोर्निपातयोरुपपदयोर्भविष्यति काले धातोर्लट् प्रत्ययो भवति। यावद् भुङ्क्ते। पुरा भुङ्क्ते। निपातयोरिति किम्? यावद् दास्यति तावद् भोक्ष्यते। करणभूतया पुरा व्रजिष्यति॥
  vartika: []
  rule: With the particle यावत् or पुरा, **लट्** carries future meaning.
- id: '33005'
  ref: 3.3.5
  a: 3
  p: 3
  n: 5
  s: विभाषा कदाकर्ह्योः
  iast: vibhāṣā kadākarhyoḥ
  type: V
  typeName: vidhi
  pada:
  - विभाषा
  - कदा-कर्ह्योः
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  - word: यावत्-पुरा-निपातयोः
    from: 3.3.4
  feeds:
  - word: विभाषा
    to: 3.3.6
  - word: विभाषा
    to: 3.3.7
  - word: विभाषा
    to: 3.3.8
  - word: विभाषा
    to: 3.3.9
  meaning: ''
  kashika: |-
    कदा कर्हि इत्येतयोरुपपदयोर्विभाषा भविष्यति काले धातोर्लट् प्रत्ययो भवति। कदा भुङ्क्ते, कदा भोक्ष्यते, कदा भोक्ता। कर्हि भुङ्क्ते, कर्हि भोक्ष्यते, कर्हि भोक्ता॥
  vartika: []
  rule: With the adverb कदा or कर्हि, **लट्** optionally carries future meaning.
- id: '33006'
  ref: 3.3.6
  a: 3
  p: 3
  n: 6
  s: किंवृत्ते लिप्सायाम्
  iast: kiṃvṛtte lipsāyām
  type: V
  typeName: vidhi
  pada:
  - किंवृत्ते
  - लिप्सायाम्
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  - word: यावत्-पुरा-निपातयोः
    from: 3.3.4
  - word: विभाषा
    from: 3.3.5
  feeds: []
  meaning: ''
  kashika: |-
    विभाषेति वर्तते। किमो वृत्तं किंवृत्तम्। वृत्तग्रहणेन तद् विभक्त्यन्तं प्रतीयात्, डतरडतमौ चेति परिसंख्यानं स्मर्यते। किंवृत्त उपपदे लिप्सायां भविष्यति काले धातोर्विभाषा लट् प्रत्ययो भवति। लिप्सा, लब्धुमिच्छा प्रार्थनाभिलाषः। कं भवन्तो भोजयन्ति? कं भवन्तो भोजयितारः? लब्धुकामः पृच्छति — कतरो भिक्षां दास्यति, ददाति, दाता वा? कतमो भिक्षां दास्यति, ददाति, दाता वा? लिप्सायामिति किम्? कः पाटलिपुत्रं गमिष्यति॥
  vartika: []
  rule: |-
    With किम् (or its डतर/डतम derivatives) in the sentence, **लट्** optionally carries future meaning when the speaker wants to gain something.
- id: '33007'
  ref: 3.3.7
  a: 3
  p: 3
  n: 7
  s: लिप्स्यमानसिद्धौ च
  iast: lipsyamānasiddhau ca
  type: V
  typeName: vidhi
  pada:
  - लिप्स्यमान-सिद्धौ
  - च
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  - word: यावत्-पुरा-निपातयोः
    from: 3.3.4
  - word: विभाषा
    from: 3.3.5
  feeds: []
  meaning: ''
  kashika: |-
    विभाषेत्येव। लिप्स्यमानात् सिद्धिर्लिप्स्यमानसिद्धिः। लिप्स्यमानसिद्धौ गम्यमानायां भविष्यति काले धातोर्विभाषा लट् प्रत्ययो भवति। अकिंवृत्तार्थोऽयमारम्भः। यो भक्तं ददाति, स स्वर्गं गच्छति। यो भक्तं दास्यति, स स्वर्गं गमिष्यति। यो भक्तं दाता, स स्वर्गं गन्ता। लिप्स्यमानाद् भक्तात् स्वर्गसिद्धिमाचक्षाणो दातारं प्रोत्साहयति॥
  vartika: []
  rule: |-
    **लट्** also optionally carries future meaning when the sentence shows the gain another secures by meeting the speaker's wish.
- id: '33008'
  ref: 3.3.8
  a: 3
  p: 3
  n: 8
  s: लोडर्थलक्षणे च
  iast: loḍarthalakṣaṇe ca
  type: V
  typeName: vidhi
  pada:
  - लोट्-अर्थलक्षणे
  - च
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  - word: यावत्-पुरा-निपातयोः
    from: 3.3.4
  - word: विभाषा
    from: 3.3.5
  feeds:
  - word: लोट्-अर्थलक्षणे
    to: 3.3.9
  meaning: ''
  kashika: |-
    लोडर्थः प्रैषादिर्लक्ष्यते येन, स लोडर्थलक्षणो धात्वर्थः, तत्र वर्तमानाद् धातोर्भविष्यति काले विभाषा लट् प्रत्ययो भवति। उपाध्यायश्चेदागच्छति, उपाध्यायश्चेदागमिष्यति, उपाध्यायश्चेदागन्ता, अथ त्वं छन्दोऽधीष्व, अथ त्वं व्याकरणमधीष्व। उपाध्यायागमनमध्ययनप्रैषस्य लक्षणम्॥
  vartika: []
  rule: |-
    **लट्** optionally carries future meaning after the root whose action is the condition for another action stated in the imperative.
- id: '33009'
  ref: 3.3.9
  a: 3
  p: 3
  n: 9
  s: लिङ् चोर्ध्वमौहूर्तिके
  iast: liṅ cordhvamauhūrtike
  type: V
  typeName: vidhi
  pada:
  - लिङ्
  - च
  - ऊर्ध्वमौहूर्तिके
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  - word: यावत्-पुरा-निपातयोः
    from: 3.3.4
  - word: विभाषा
    from: 3.3.5
  - word: लोट्-अर्थलक्षणे
    from: 3.3.8
  feeds: []
  meaning: ''
  kashika: |-
    भविष्यति, विभाषा, लोडर्थलक्षण इति सर्वमनुवर्तते। ऊर्ध्वमौहूर्तिके भविष्यति काले लोडर्थलक्षणार्थे वर्तमानाद् धातोर्विभाषा लिङ् प्रत्ययो भवति, चकाराल्लट् च। ऊर्ध्वं मुहूर्ताद् भव ऊर्ध्वमौहूर्तिकः। निपातनात् समासः, उत्तरपदवृद्धिश्च। भविष्यतश्चैतद् विशेषणम्। ऊर्ध्वं मुहूर्तादुपरि मुहूर्तस्योपाध्यायश्चेदागच्छेत्, उपाध्यायश्चेदागच्छति, उपाध्यायश्चेदागमिष्यति, उपाध्यायश्चेदागन्ता, अथ त्वं छन्दोऽधीष्व, अथ त्वं व्याकरणमधीष्व॥
  vartika: []
  rule: |-
    Under those same conditions, when the future moment lies beyond a मुहूर्त (48 minutes), **लिङ्** optionally carries future meaning, and by च so does **लट्**.
- id: '33010'
