    from: 3.1.93
  feeds:
  - word: आवश्यक-आधमर्ण्ययोः
    to: 3.3.171
  meaning: ''
  kashika: |-
    अवश्यंभाव आवश्यकम्। उपाधिरयम्, नोपपदम्। अवश्यंभावविशिष्ट आधमर्ण्यविशिष्टे च कर्तरि वाच्ये धातोर्णिनिः प्रत्ययो भवति। अवश्यंकारी। मयूरव्यंसकादित्वात् समासः। आधमर्ण्ये खल्वपि — शतं दायी। सहस्रं दायी। निष्कं दायी॥
  vartika: []
  rule: |-
    When necessity (**आवश्यक**) or indebtedness (**आधमर्ण्य**) marks the agent, the root takes **णिनि**.
- id: '33171'
  ref: 3.3.171
  a: 3
  p: 3
  n: 171
  s: कृत्याश्च
  iast: kṛtyāśca
  type: V
  typeName: vidhi
  pada:
  - कृत्याः
  - च
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  - word: आवश्यक-आधमर्ण्ययोः
    from: 3.3.170
  feeds:
  - word: कृत्याः
    to: 3.3.172
  - word: च
    to: 3.3.172
  meaning: ''
  kashika: |-
    आवश्यकाधमर्ण्ययोरिति वर्तते। कृत्यसंज्ञकाश्च प्रत्यया आवश्यकाधमर्ण्ययोरुपाधिभूतयोर्धातोर्भवन्ति। भवता खल्ववश्यं कटः कर्तव्यः। अवश्यं करणीयः। अवश्यं कार्यः। अवश्यं कृत्यः। आधमर्ण्ये — भवता शतं दातव्यम्। सहस्रं देयम्। किमर्थमिदम्, यावता सामान्येन विहिता अस्मिन्नपि विषये भविष्यन्ति? विशेषविहितेन णिनिना बाध्येरन्। कर्तरि णिनिः, भावकर्मणोः कृत्याः, तत्र कुतो बाधप्रसङ्गः? तत्र केचिदाहुः — भव्यगेयादयः कर्तृवाचिनः कृत्याः, त इहोदाहरणमिति॥
  vartika: []
  rule: |-
    When necessity or indebtedness is meant, the root also takes the **कृत्य** affixes.
- id: '33172'
  ref: 3.3.172
  a: 3
  p: 3
  n: 172
  s: शकि लिङ् च
  iast: śaki liṅ ca
  type: V
  typeName: vidhi
  pada:
  - शकि
  - लिङ्
  - च
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  - word: कृत्याः
    from: 3.3.171
  - word: च
    from: 3.3.171
  feeds: []
  meaning: ''
  kashika: |-
    शकीति प्रकृत्यर्थविशेषणम्। शक्नोत्यर्थोपाधिके धात्वर्थे लिङ् प्रत्ययो भवति, चकारात् कृत्याश्च। भवता खलु भारो वोढव्यः,वहनीयः, वाह्यः। भवान् खलु भारं वहेत्। भवानिह शक्तः। सामान्यविहितानां पुनर्वचनं लिङा बाधा मा भूदिति॥
  vartika: []
  rule: |-
    When capability (**शक्ति**) is meant, the root takes **लिङ्** — and, by च, the **कृत्य** affixes.
- id: '33173'
  ref: 3.3.173
  a: 3
  p: 3
  n: 173
  s: आशिषि लिङ्लोटौ
  iast: āśiṣi liṅloṭau
  type: V
  typeName: vidhi
  pada:
  - आशिषि
  - लिङ्-लोटौ
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  feeds: []
  meaning: |
    लिङ्लकार and लोट्लकार are used to express the desire of something that cannot be easily attained.
  kashika: |-
    आशंसनमाशीः, अप्राप्तस्येष्टस्यार्थस्य प्राप्तुमिच्छा। प्रकृत्यर्थविशेषणं चैतत्। आशीर्विशिष्टेऽर्थे वर्तमान् धातोर्लिङ्लोटौ प्रत्ययौ भवतः। चिरं जीव्याद् भवान्। चिरं जीवतु भवान्। आशिषीति किम्? चिरं जीवति देवदत्तः॥
  vartika: []
  rule: When a blessing (**आशीस्**) is meant, the root takes **लिङ्** or **लोट्**.
- id: '33174'
  ref: 3.3.174
  a: 3
  p: 3
  n: 174
  s: क्तिच्क्तौ च संज्ञायाम्
  iast: kticktau ca saṃjñāyām
  type: V
  typeName: vidhi
  pada:
  - क्तिच्-क्तौ
  - च
  - संज्ञायाम्
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  feeds: []
  meaning: ''
  kashika: |-
    आशिषीत्येव। आशिषि विषये धातोः क्तिच्क्तौ प्रत्ययौ भवतः, समुदायेन चेत् संज्ञा गम्यते। तनुतात् तन्तिः। सनुतात् सातिः। भवतात् भूतिः। क्तः खल्वपि — देवा एनं देयासुर्देवदत्तः। सामान्येन विहितः क्तः पुनरु च्यते, क्तिचा बाधा मा भूदिति। चकारो विशेषणार्थः <<न क्तिचि दीर्घश्च>> [[६.४.३९]] इति॥
  vartika: []
  rule: |-
    When a blessing is meant and the whole word is a name (**संज्ञा**), the root takes **क्तिच्** or **क्त**.
- id: '33175'
  ref: 3.3.175
  a: 3
  p: 3
  n: 175
  s: माङि लुङ्
  iast: māṅi luṅ
  type: V
  typeName: vidhi
  pada:
  - माङि
  - लुङ्
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  feeds:
  - word: माङि
    to: 3.3.176
  - word: लुङ्
    to: 3.3.176
  meaning: 'In presence of the अव्यय माङ्, लुङ्लकारः is used. '
  kashika: |-
    माङ्युपपदे धातोर्लुङ् प्रत्ययो भवति। सर्वलकाराणामपवादः। मा कार्षीत्। मा हार्षीत्। कथं मा भवतु तस्य पापम्, मा भविष्यतीति? असाधुरेवायम्। केचिदाहुः — अङिदपरो माशब्दो विद्यते, तस्यायं प्रयोगः॥
  vartika: []
  rule: |-
    After a verb, when मा (माङ्) stands with it, add **लुङ्**. This blocks every other tense affix.
