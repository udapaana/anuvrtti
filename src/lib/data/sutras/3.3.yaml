  feeds: []
  meaning: ''
  kashika: |-
    घोरित्येव। कर्मण्युपपदे घुसंज्ञकेभ्यो धातुभ्यः किः प्रत्ययो भवत्यधिकरणे कारके। जलं धीयतेऽस्मिन्निति जलधिः। शरधिः। अधिकरणग्रहणमर्थान्तरनिरासार्थम्। चकारः प्रत्ययानुकर्षणार्थः॥
  vartika: []
