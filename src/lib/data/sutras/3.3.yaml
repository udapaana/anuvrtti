    from: 3.3.76
  - word: करणे
    from: 3.3.82
  feeds: []
  meaning: ''
  kashika: |-
    करणे हन इत्येव। परिशब्द उपपदे हन्तेर्धातोरप् प्रत्ययो भवति करणे कारके, घशब्दश्चादेशः। परिहन्यतेऽनेनेति परिघः। पलिघः॥
  vartika: []
  rule: |-
    After हन् with परि, as the instrument **कारक**, **अप्** comes, and घ replaces हन् (परिघः).
- id: '33085'
  ref: 3.3.85
  a: 3
  p: 3
  n: 85
  s: उपघ्न आश्रये
  iast: upaghna āśraye
  type: V
  typeName: vidhi
  pada:
  - उपघ्नः
  - आश्रये
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  - word: अप्
    from: 3.3.57
  - word: हनः
    from: 3.3.76
  feeds: []
  meaning: ''
  kashika: |-
    उपपूर्वस्य हन्तेरप् प्रत्यय उपधालोपश्च निपात्यत आश्रयेऽभिधेये। आश्रयशब्दः सामीप्यं प्रत्यासत्तिं लक्षयति। पर्वतोपघ्नः। ग्रामोपघ्नः। आश्रय इति किम्? पर्वतोपघात एवान्यः॥
  vartika: []
  rule: |-
    उपघ्न, meaning a slope to lean on, is the irregular form of उप + हन् with **अप्**: the penultimate अ of ह drops and हन् becomes घ्न. It holds only when the sense is proximity (आश्रय).
- id: '33086'
  ref: 3.3.86
  a: 3
  p: 3
  n: 86
  s: संघोद्घौ गणप्रशंसयोः
