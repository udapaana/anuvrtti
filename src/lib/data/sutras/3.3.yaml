  - word: कृत्
    from: 3.1.93
  feeds:
  - word: घोः
    to: 3.3.93
  - word: किः
    to: 3.3.93
  meaning: ''
  kashika: |-
    भावेऽकर्तरि च कारक इति वर्तते। उपसर्ग उपपदे घुसंज्ञकेभ्यो धातुभ्यः किः प्रत्ययो भवति। कित्करणमातो लोपार्थम्। प्रदिः। प्रधिः। अन्तर्धिः॥
  vartika: []
  rule: |-
    A **घु** root (दा, धा by [[1.1.20]]) with an **उपसर्ग** before it takes **कि** for the action: प्रदि, प्रधि, अन्तर्धि. The क् drops the final आ.
- id: '33093'
  ref: 3.3.93
  a: 3
  p: 3
