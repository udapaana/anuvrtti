  meaning: ''
  kashika: |-
    भविष्यतीत्येव। चकारः सन्नियोगार्थः। धातोरण् प्रत्ययो भवति भविष्यति काले कर्मण्युपपदे क्रियायां च क्रियार्थायाम्। <<कर्मण्यण्>> [[३.२.१]] इति सामान्येन विहितो वासरूपविधेरभावाद् ण्वुला बाधितः पुनरण् विधीयते, सोऽपवादत्वाद् ण्वुलं बाधते, परत्वात् कादीन्। तेनापवादविषयेऽपि भवत्येव। काण्डलावो व्रजति। अश्वदायो व्रजति। गोदायो व्रजति। कम्बलदायो व्रजति॥
  vartika: []
  rule: |-
    **अण्** carries future meaning when the word with it is in the accusative and the action is done for the sake of another action.
- id: '33013'
  ref: 3.3.13
  a: 3
  p: 3
  n: 13
  s: लृट् शेषे च
  iast: lṛṭ śeṣe ca
  type: V
  typeName: vidhi
  pada:
  - लृट्
  - शेषे
  - च
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  - word: क्रियायाम्
    from: 3.3.10
  - word: क्रियार्थायाम्
    from: 3.3.10
  feeds:
  - word: शेषे
    to: 3.3.14
  - word: शेषे
    to: 3.3.15
  meaning: "When a helper action is done for doing a main action in future (For example, 'going to school\
    \  for studying'), the लृट्लकार can be used to denote the main action ('studying' in this example).\
    \ In addition, the लृट्लकार can also be used to indicate a general action to be done in future, even\
    \ when no helper action is indicated. "
  kashika: |-
    भविष्यतीत्येव। शेषः क्रियार्थोपपदादन्यः। शेषे शुद्धे भविष्यति काले, चकारात् क्रियायां चोपपदे क्रियार्थायां धातोर्लृट प्रत्ययो भवति। करिष्यामीति व्रजति। हरिष्यामीति व्रजति। शेषे खल्वपि — करिष्यति। हरिष्यति॥
  vartika: []
  rule: |-
    In the remaining cases of plain future, and also with a verb naming an action done for the sake of the future action, **लृट्** is the affix.
- id: '33014'
  ref: 3.3.14
  a: 3
  p: 3
  n: 14
  s: लृटः सद् वा
  iast: lṛṭaḥ sad vā
  type: V
  typeName: vidhi
  pada:
  - लृटः
  - सत्
  - वा
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  - word: शेषे
    from: 3.3.13
  feeds: []
  meaning: ''
  kashika: |-
    लृटः स्थाने सत्संज्ञौ शतृशानचौ वा भवतः। व्यवस्थितविभाषेयम्। तेन यथा लटः शतृशानचौ तथास्यापि भवतः। अप्रथमासमानाधिकरणादिषु नित्यम्, अन्यत्र विकल्पः। करिष्यन्तं देवदत्तं पश्य। करिष्यमाणं देवदत्तं पश्य। हे करिष्यन्। हे करिष्यमाण। अर्जयिष्यमाणो वसति। प्रथमासमानाधिकरणे विकल्पः। करिष्यन् देवदत्तः। करिष्यमाणो देवदत्तः। करिष्यति। करिष्यते॥
  vartika: []
  rule: '**सत्** (शतृ and शानच्) optionally replace **लृट्**.'
- id: '33015'
  ref: 3.3.15
  a: 3
  p: 3
  n: 15
  s: अनद्यतने लुट्
  iast: anadyatane luṭ
  type: V
  typeName: vidhi
  pada:
  - अनद्यतने
  - लुट्
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  - word: शेषे
    from: 3.3.13
  feeds: []
  meaning: ' लुट्-लकार is used to indicate actions that will happen tomorrow or later.'
  kashika: |-
    भविष्यतीत्येव। भविष्यदनद्यतनेऽर्थे वर्तमानाद् धातोर्लुट् प्रत्ययो भवति। लृटोऽपवादः। श्वःकर्ता। श्वो भोक्ता । अनद्यतन इति बहुव्रीहिनिर्देशः। तेन व्यामिश्रे न भवति। अद्य श्वो वा भविष्यतीति॥ परिदेवने श्वस्तनी भविष्यदर्थे वक्तव्या॥ इयं नु कदा गन्ता, यैवं पादौ  निदधाति। अयं नु कदाध्येता, य एवमनभियुक्तः॥
  vartika: []
  rule: |-
    For a future that is not within the current day, **लुट्** is the affix (blocking **लृट्**).
