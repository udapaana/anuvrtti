    from: 3.1.93
  - word: अप्
    from: 3.3.57
  - word: हनः
    from: 3.3.76
  feeds: []
  meaning: ''
  kashika: |-
    समुदोरुपपदयोर्हन्तेर्धातोरप् प्रत्ययो भवति, टिलोपो घत्वं च निपात्यते, यथासंख्यं गणेऽभिधेये, प्रशंसायां गम्यमानायाम्। संघः पशूनाम्। उद्घो मनुष्याणाम्। गणप्रशंसयोरिति किम्? संघातः॥
  vartika: []
  rule: |-
    संघ 'collection' and उद्घ 'praise' are the irregular forms of सम्/उद् + हन् with **अप्**: the final न drops and ह becomes घ. संघ is for a collection, उद्घ for praise, respectively.
- id: '33087'
