    from: 3.1.93
  - word: अ
    from: 3.3.102
  feeds: []
  meaning: ''
  kashika: |-
    हलन्तो यो धातुर्गुरुमान्, ततः स्त्रियामकारः प्रत्ययो भवति। क्तिनोऽपवादः। कुण्डा। हुण्डा। ईहा। ऊहा। गुरोरिति किम्? भक्तिः। हल इति किम्? नीतिः॥
  vartika:
  - निष्ठायां सेट इति वक्तव्यम् ।
  rule: |-
    A root with a prosodially heavy vowel that ends in a consonant takes **अ** for a feminine word: कुण्डा, हुण्डा, ईहा, ऊहा. This blocks **क्तिन्**.
- id: '33104'
  ref: 3.3.104
  a: 3
  p: 3
  n: 104
  s: षिद्भिदादिभ्योऽङ्
  iast: ṣidbhidādibhyo'ṅ
  type: V
  typeName: vidhi
  pada:
  - षिद्-भिदादिभ्यः
  - अङ्
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  feeds:
  - word: अङ्
    to: 3.3.105
  - word: अङ्
    to: 3.3.106
  meaning: ''
  kashika: |-
    षिद्भ्यो भिदादिभ्यश्च स्त्रियामङ् प्रत्ययो भवति। गणपरिपठितेषु भिदादिषु निष्कृष्य प्रकृतयो गृह्यन्ते? जृष् — जरा। त्रपूष् — त्रपा। भिदादिभ्यः खल्वपि — भिदा। छिदा। विदा। क्षिपा। गुहा गिर्योषध्योः (ग०सू० २९)। श्रद्धा। मेधा। गोधा। आरा। हारा। कारा। क्षिया। तारा। धारा। लेखा। रेखा। चूडा। पीडा। वपा। वसा। मृजा। क्रपेः संप्रसारणं च (ग०सू० ३०)। कृपा। भिदा विदारणे (ग०सू० ३१)। भित्तिरन्या। छिदा द्वैधीकरणे (ग०सू० ३२)। छित्तिरन्या। आरा शस्त्र्याम् (ग०सू० ३३)। आर्तिरन्या। धारा प्रपाते (ग०सू०३४)। धृतिरन्या॥
  vartika:
  - क्रपेः सम्प्रसारणं च ।
  rule: |-
    Roots marked with षि, and the भिद्-group roots, take **अङ्** for a feminine word: जरा, त्रपा, भिदा, छिदा, धारा.
- id: '33105'
  ref: 3.3.105
  a: 3
  p: 3
  n: 105
  s: चिन्तिपूजिकथिकुम्बिचर्चश्च
  iast: cintipūjikathikumbicarcaśca
  type: V
  typeName: vidhi
  pada:
  - चिन्ति-पूजि-कथि-कुम्बि-चर्चः
  - च
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  - word: अङ्
    from: 3.3.104
  feeds: []
  meaning: ''
  kashika: |-
    <<चिति स्मृत्याम्>>  <<पूज पूजायाम्>>  <<कथ वाक्यप्रबन्धे>>  <<कुबि आच्छादने>>  <<चर्च अध्ययने>> चुरादिः। एभ्यो धातुभ्यो युचि प्राप्ते स्त्रियामङ् प्रत्ययो भवति। चिन्ता। पूजा। कथा। कुम्बा। चर्चा। चकाराद् युजपि भवति। चिन्तना॥
  vartika: []
  rule: |-
    चिन्त्, पूज्, कथ्, कुम्ब्, चर्च् take **अङ्**, and also **युच्**, for a feminine word: चिन्ता, पूजा, कथा, कुम्बा, चर्चा (or चिन्तना with युच्).
- id: '33106'
  ref: 3.3.106
  a: 3
  p: 3
  n: 106
  s: आतश्चोपसर्गे
  iast: ātaścopasarge
  type: V
  typeName: vidhi
  pada:
  - आतः
  - च
  - उपसर्गे
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  - word: अङ्
    from: 3.3.104
  feeds: []
  meaning: ''
  kashika: |-
    आकारान्तेभ्य उपसर्ग उपपदे स्त्रियामङ् प्रत्ययो भवति। क्तिनोऽपवादः। प्रदा। उपदा। प्रधा। उपधा। श्रदन्तरोरुपसर्गवद् वृत्तिः। श्रद्धा। अन्तर्धा॥
  vartika: []
  rule: |-
    A root ending in long आ, with an **उपसर्ग** before it, takes **अङ्** for a feminine word: प्रदा, प्रधा, उपदा, उपधा. This blocks **क्तिन्**.
- id: '33107'
  ref: 3.3.107
  a: 3
  p: 3
  n: 107
  s: ण्यासश्रन्थो युच्
  iast: ṇyāsaśrantho yuc
  type: V
  typeName: vidhi
  pada:
  - णि-आस-श्रन्थः
  - युच्
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  feeds: []
  meaning: ''
  kashika: |-
    ण्यन्तेभ्यो धातुभ्यः, आस श्रन्थ इत्येताभ्यां च स्त्रियां युच् प्रत्ययो भवति। अकारस्यापवादः। कारणा। हारणा। आसना। श्रन्थना। कथमास्या? <<ऋहलोर्ण्यत्>> [[३.१.१२४]] भविष्यति। वासरूपप्रतिषेधश्च स्त्रीप्रकरणविषयस्यैवोत्सर्गापवादस्य। श्रन्थिः क्र्यादिर्गृह्यते — <<श्रन्थ विमोचनप्रतिहर्षयोः>> इति, न चुरादिः — <<श्रन्थ ग्रन्थ संदर्भे>> इति, ण्यन्तत्वेनैव सिद्धत्वात्॥ घट्टिवन्दिविदिभ्य उपसंख्यानम्॥ घट्टना। वन्दना। वेदना। घट्टेर्भौवादिकस्य ग्रहणं <<घट्ट चलने>> इति, न चौरादिकस्य <<घट्ट संवरणे>> इत्यस्य ग्रहणम्, तस्य णेरित्येव सिद्धत्वात्॥ इषेरनिच्छार्थस्य युज्वक्तव्यः॥ अध्येषणा। अन्वेषणा ॥ परेर्वा ॥ पर्येषणा। परीष्टिः॥
  vartika:
  - घट्टिवन्दिविदिभ्यश्चेति वाच्यम् ।
  - इषेरनिच्छार्थस्य ।
  - परेर्वा ।
  rule: |-
    A root ending in णि, and आस् and श्रन्थ्, take **युच्** for a feminine word: कारणा, हारणा, आसना, श्रन्थना. This blocks **अ**.
- id: '33108'
  ref: 3.3.108
  a: 3
  p: 3
  n: 108
  s: रोगाख्यायां ण्वुल् बहुलम्
  iast: rogākhyāyāṃ ṇvul bahulam
  type: V
  typeName: vidhi
  pada:
  - रोगाख्यायाम्
  - ण्वुल्
  - बहुलम्
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  feeds:
  - word: ण्वुल्
    to: 3.3.109
  - word: ण्वुल्
    to: 3.3.110
  meaning: ''
  kashika: |-
    रोगाख्यायां गम्यमानायां धातोर्बहुलं ण्वुल् प्रत्ययो भवति। क्तिन्नादीनामपवादः। आख्याग्रहणं रोगास्य चेत् प्रत्ययान्तेन संज्ञा भवति। बहुलग्रहणं व्यभिचारार्थम्। प्रच्छर्दिका। प्रवाहिका। विचर्चिका। न च भवति — शिरोऽर्तिः॥ धात्वर्थनिर्देशे ण्वुल् वक्तव्यः॥ आशिका। शायिका वर्तते॥ इक्श्तिपौ धातुनिर्देशे॥ भिदिः। छिदिः। पचतिः। पठतिः॥ वर्णात् कारः॥ निर्देश इति प्रकृतम्। अकारः। इकारः॥ रादिफः॥ रेफः ॥ मत्वर्थाच्छः॥ अकारलोपश्च। मत्वर्थीयः। इणजादिभ्यः॥ आजिः। आतिः। आदिः॥ इक् कृष्यादिभ्यः॥ कृषिः। किरिः॥
  vartika:
  - धात्वर्थनिर्देशे ण्वुल् वक्तव्यः ।
  - इक्श्तिपौ धातुनिर्देशे ।
  - वर्णात्कारः ।
  - रादिफः ।
  - मत्वर्थाच्छः ।
  - इणजादिभ्यः ।
  - इञ् वपादिभ्यः ।
  - इक् कृष्यादिभ्यः ।
  - संपदादिभ्यः क्विप् ।
  rule: |-
    For a feminine word that names a disease, a root variously takes **ण्वुल्**: प्रच्छर्दिका, प्रवाहिका, विचर्चिका. This blocks **क्तिन्** and the rest.
- id: '33109'
  ref: 3.3.109
