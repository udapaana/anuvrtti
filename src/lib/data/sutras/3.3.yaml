  rule: |-
    स्था, गा, पा, पच् take **क्तिन्** for a feminine word naming the action: प्रस्थिति, उद्गीति, प्रपीति, पक्ति. This blocks **अङ्**.
- id: '33096'
  ref: 3.3.96
  a: 3
  p: 3
  n: 96
  s: मन्त्रे वृषेषपचमनविदभूवीरा उदात्तः
