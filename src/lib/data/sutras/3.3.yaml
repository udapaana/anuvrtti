  - word: ल्युट्
    to: 3.3.117
  meaning: ''
  kashika: |-
    नपुंसकलिङ्गे भावे धातोर्ल्युट् प्रत्ययो भवति। हसनं छात्रस्य। शोभनम्। जल्पनम्। शयनम्। आसनम्। योगविभाग उत्तरार्थः॥
  vartika: []
  rule: '**ल्युट्** also attaches to a root for the name of the action, in the neuter.'
- id: '33116'
  ref: 3.3.116
