  vartika: []
  rule: |-
    In the sense of 'to be given to that one's keeping', **त्रा** is added, and also **साति**, with **कृ**, **भू**, **अस्**, **सम्पद्**.
- id: '54056'
  ref: 5.4.56
  a: 5
  p: 4
  n: 56
  s: देवमनुष्यपुरुषपुरुमर्त्येभ्यो द्वितीयासप्तम्योर्बहुलम्
  iast: devamanuṣyapuruṣapurumartyebhyo dvitīyāsaptamyorbahulam
  type: V
  typeName: vidhi
  pada:
  - देव-मनुष्य-पुरुष-पुरु-मर्त्येभ्यः
  - द्वितीया-सप्तम्योः
  - बहुलम्
  adhikara: प्रत्ययः
  inherits:
  - word: अभूत-तद्भावे
    from: 5.4.50
  - word: त्रा
    from: 5.4.55
  feeds: []
  meaning: ''
  kashika: |-
    सातिर्निवृत्तः त्राप्रत्ययोऽनुवर्तते। देवादिभ्यः प्रातिपदिकेभ्यो द्वितीयासप्तम्यन्तेभ्यः त्रा प्रत्ययो भवति बहुलम्। कृभ्वस्तिभिरिति नात्र संबध्यते। सामान्येन विधानम्। देवान् गच्छति देवत्रा गच्छति। देवेषु वसति देवत्रा वसति। मनुष्यान् गच्छति मनुष्यत्रा गच्छति। मनुष्येषु वसति मनुष्यत्रा वसति। पुरुषान् गच्छति पुरुषत्रा गच्छति। पुरुषेषु वसति पुरुषत्रा वसति। पुरून् गच्छति पुरुत्रा गच्छति। पुरुषु वसति पुरुत्रा वसति। मर्त्यान् गच्छति मर्त्यत्रा गच्छति। मर्त्येषु वसति मर्त्यत्रा वसति। बहुलवचनादन्यत्रापि भवति। बहु॒त्रा जीव॑तो॒ मनः॑ (ऋ० १०.१६४.२) इति॥
  vartika: []
  rule: |-
    After देव, मनुष्य, पुरुष, पुरु, मर्त्य in the accusative or locative, **त्रा** is variously added, carrying that same accusative or locative force.
- id: '54057'
