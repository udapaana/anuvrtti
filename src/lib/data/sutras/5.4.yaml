  typeName: vidhi
  pada:
  - बहुप्रजाः
  - छन्दसि
  adhikara: प्रत्ययः
  inherits:
  - word: बहुव्रीहौ
    from: 5.4.113
  - word: नित्यम्
    from: 5.4.122
  - word: असिच्
    from: 5.4.122
  feeds: []
  meaning: ''
  kashika: |-
    बहुप्रजा इति छन्दसि निपात्यते। बहुप्॒रजा निर्ऋ॑ति॒मावि॑वेश (ऋ० १.१६४.३२)। छन्दसीति किम् ? बहुप्रजो ब्राह्मणः॥
  vartika: []
  rule: बहुप्रजास् is the valid form in the Vedas (बहुप्रजा), against secular बहुप्रजः.
- id: '54124'
  ref: 5.4.124
  a: 5
  p: 4
  n: 124
  s: धर्मादनिच् केवलात्
  iast: dharmādanic kevalāt
  type: V
  typeName: vidhi
  pada:
  - धर्मात्
  - अनिच्
  - केवलात्
  adhikara: प्रत्ययः
  inherits:
  - word: बहुव्रीहौ
    from: 5.4.113
  feeds:
  - word: अनिच्
    to: 5.4.125
  - word: अनिच्
    to: 5.4.126
  meaning: ''
  kashika: |-
    केवलाद् यो धर्मशब्दः तदन्तात् बहुव्रीहेरनिच्प्रत्ययो भवति समासान्तः। कल्याणो धर्मोऽस्य कल्याणधर्मा। प्रियधर्मा। केवलादिति किम् ? परमः स्वो धर्मोऽस्य परमस्वधर्मः। यद्येवं त्रिपदे बहुव्रीहौ प्राप्नोति — परमः स्वो धर्मोऽस्येति? एवं तर्हि केवलादिति पूर्वपदं निर्दिश्यते, केवलाद् पदाद् यो धर्मशब्दो न पदसमुदायात्, तदन्ताद् बहुव्रीहेः प्रत्ययः॥
  vartika: []
  rule: |-
    A **बहुव्रीहि** ending in धर्म takes **अनिच्** when धर्म stands alone as the final member, its first member a single word (कल्याणधर्मा); not परमस्वधर्मः.
- id: '54125'
  ref: 5.4.125
  a: 5
  p: 4
  n: 125
  s: जम्भा सुहरिततृणसोमेभ्यः
  iast: jambhā suharitatṛṇasomebhyaḥ
  type: V
  typeName: vidhi
  pada:
  - जम्भा
  - सुहरिततृणसोमेभ्यः
  adhikara: प्रत्ययः
  inherits:
  - word: बहुव्रीहौ
    from: 5.4.113
  - word: अनिच्
    from: 5.4.124
  feeds: []
  meaning: ''
  kashika: |-
    बहुव्रीहौ समासे स्वादिभ्यः परं जम्भेति कृतसमासान्तमुत्तरपदं निपात्यते। जम्भशब्दोऽभ्यवहार्यवाची दन्तविशेषवाची च। शोभनो जम्भोऽस्य सुजम्भा देवदत्तः। शोभनाभ्यवहार्यः शोभनदन्तो वा। एवं हरितजम्भा। तृणजम्भा। सोमजम्भा। दन्तवचनेतृणमिव जम्भोऽस्य, सोम इव जम्भोऽस्येति विग्रहीतव्यम्। सुहरिततृणसोमेभ्य इति किम्? पतितजम्भः॥
  vartika: []
  rule: |-
    After सु, हरित, तृण, सोम in a **बहुव्रीहि**, the final word is जम्भन् (with **समासान्त** अम्), meaning food or tooth (सुजम्भा, सोमजम्भा).
- id: '54126'
  ref: 5.4.126
  a: 5
  p: 4
  n: 126
  s: दक्षिणेर्मा लुब्धयोगे
  iast: dakṣiṇermā lubdhayoge
  type: V
  typeName: vidhi
  pada:
  - दक्षिणेर्मा
  - लुब्धयोगे
  adhikara: प्रत्ययः
  inherits:
  - word: बहुव्रीहौ
    from: 5.4.113
  - word: अनिच्
    from: 5.4.124
  feeds: []
  meaning: ''
  kashika: |-
    दक्षिणेर्मेति कृतसमासान्तो निपात्यते बहुव्रीहौ समासे लुब्धयोगे। लुब्धो व्याधः। दक्षिणमीर्ममस्य दक्षिणेर्मा मृगः। ईर्मं व्रणमुच्यते। दक्षिणमङ्गं व्रणितमस्य व्याधेनेत्यर्थः। लुब्धयोग इति किम् ? दक्षिणेर्मं शकटम्॥
  vartika: []
  rule: |-
    दक्षिणेर्मन् is an irregular **बहुव्रीहि** used of a stag wounded on the right by a hunter (दक्षिणेर्मा मृगः).
- id: '54127'
  ref: 5.4.127
  a: 5
  p: 4
  n: 127
  s: इच् कर्मव्यतिहारे
  iast: ic karmavyatihāre
  type: V
  typeName: vidhi
  pada:
  - इच्
  - कर्मव्यतिहारे
  adhikara: प्रत्ययः
  inherits:
  - word: बहुव्रीहौ
    from: 5.4.113
  feeds:
  - word: इच्
    to: 5.4.128
  meaning: ''
  kashika: |-
    कर्मव्यतिहारे यो बहुव्रीहिस्तस्मादिच् प्रत्ययो भवति। <<तत्र तेनेदमिति सरूपे>> [[२.२.२७]] इत्ययं बहुव्रीहिर्गृह्यते। केशेषु केशेषु गृहीत्वा इदं युद्धं प्रवृत्तं केशाकेशि। कचाकचि। मुसलैश्च मुसलैश्च प्रहृत्य इदं युद्धं प्रवृत्तं मुसलामुसलि। दण्डादण्डि। तिष्ठद्गुप्रभृतिषु [[२.१.१७]] अयमिच् प्रत्ययः पठ्यते॥
  vartika: []
  rule: A **बहुव्रीहि** denoting reciprocal action takes **इच्** (केशाकेशि, दण्डादण्डि).
- id: '54128'
  ref: 5.4.128
  a: 5
  p: 4
  n: 128
  s: द्विदण्ड्यादिभ्यश्च
  iast: dvidaṇḍyādibhyaśca
  type: V
  typeName: vidhi
  pada:
  - द्विदण्ड्यादिभ्यः
  - च
  adhikara: प्रत्ययः
  inherits:
  - word: बहुव्रीहौ
    from: 5.4.113
  - word: इच्
    from: 5.4.127
  feeds: []
  meaning: ''
  kashika: |-
    द्विदण्ड्यादयः शब्दा इच्प्रत्ययान्ताः साधवो भवन्ति। द्विदण्ड्यादिभ्य इति तादर्थ्य एषा चतुर्थी, न पञ्चमी। द्विदण्ड्याद्यर्थमिच् प्रत्ययो भवति। तथा भवति यथा द्विदण्ड्यादयः। सिध्यन्तीत्यर्थः। समुदायनिपातनाच्चार्थविशेषेऽवरुध्यन्ते। द्विदण्डि प्रहरति। द्विमुसलि प्रहरति। इह न भवति — द्विदण्डा शालेति। बहुव्रीह्यधिकारेऽपि तत्पुरुषात् क्वचिद् विधानमिच्छन्ति। निकुच्य कर्णौ धावति। निकुच्यकर्णि धावति। प्रोह्य पादौ हस्तिनं वाहयति। प्रोह्यपादि हस्तिनं वाहयति। मयूरव्यंसकादित्वात् [[२.१.७२]] समासः॥ द्विदण्डि। द्विमुसलि। उभाञ्जलि। उभयाञ्जलि। उभाकर्णि। उभयाकर्णि। उभादन्ति। उभयादन्ति। उभाहस्ति। उभयाहस्ति। उभापाणि। उभयापाणि। उभाबाहु। उभयाबाहु। एकपदि। प्रोह्यपदि। आढ्यपदि। सपदि। निकुच्यकर्णि। संहतपुच्छि। उभाबाहु, उभयाबाह्विति निपातनादिच्प्रत्ययलोपः। प्रत्ययलक्षणेनाव्ययीभावसंज्ञा॥
  vartika: []
  rule: द्विदण्डि and the rest are valid forms ending in **इच्** (द्विदण्डि प्रहरति).
- id: '54129'
