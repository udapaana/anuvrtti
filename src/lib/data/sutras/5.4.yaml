  feeds: []
  meaning: ''
  kashika: |-
    ब्रह्महस्तिभ्यां परो यो वर्चःशब्दस्तदन्तात् समासादच् प्रत्ययो भवति। ब्रह्मवर्चसम्। हस्तिवर्चसम्॥ पल्यराजभ्यां चेति वक्तव्यम्॥ पल्यवर्चसम्। राजवर्चसम्॥
