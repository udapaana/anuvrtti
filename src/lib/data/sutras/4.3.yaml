  iast: sāyaṃciramprāhṇeprage'vyayebhyaṣṭyuṭyulau tuṭ ca
  type: V
  typeName: vidhi
  pada:
  - सायम्-चिरम्-प्राह्णे-प्रगे-अव्ययेभ्यः
  - ट्यु-ट्युलौ
  - तुट्
  - च
  adhikara: प्रत्ययः
  inherits:
  - word: कालात्
    from: 4.3.11
  feeds:
  - word: ट्यु-ट्युलौ
    to: 4.3.24
  - word: तुट्
    to: 4.3.24
  - word: च
    to: 4.3.24
  meaning: |-
    The words सायम्, चिरम्, प्रगे, प्राह्णे, and all the कालवाचक-अव्ययानि get the ट्यु and ट्युल् प्रत्यय in the शैषिक-meanings. Also, the ट्यु and ट्युल् प्रत्यय get a तुट् आगम in this context.
  kashika: |-
    कालादित्येव। सायं चिरं प्राह्णे प्रगे इत्येतेभ्योऽव्ययेभ्यश्च कालवाचिभ्यः ट्युट्युलौ प्रत्ययौ भवतः, तयोश्चादिष्टयोः तुडागमो भवति। सायंतनम्। चिरंतनम्। प्राह्णेतनम्। प्रगेतनम्। अव्ययेभ्यः — दोषातनम्। दिवातनम्। सायमिति मकारान्तं पदमव्ययम्, ततोऽव्ययत्वादेव सिद्धः प्रत्ययः। यस्तु स्यतेरन्तकर्मणो घञि सायशब्दस्तस्येदं मकारान्तत्वं प्रत्ययसन्नियोगेन निपात्यते। दिवसावसानं सायः। चिरशब्दस्यापि मकारान्तत्वं निपात्यते। प्राह्णे प्रगे इत्येकारान्तत्वम्॥ चिरपरुत्परारिभ्यस्त्नो वक्तव्यः॥ चिरत्नम्। परुत्नम्। परारित्नम्॥ प्रगस्त छन्दसि गलोपश्च॥ प्॒रत्नम् (ऋ० १.३६.४)॥ अग्रपश्चाड्डिमच्॥ अग्रिमम्॥ पश्चिमम्॥ अन्ताच्चेति वक्तव्यम्॥ अन्तिमम्॥
  vartika:
  - चिरपरुुत्पराभ्यस्त्नो वक्तव्यः ।
  - अग्रादिपश्चाड्डिमच् ।
  - अन्ताच्च ।
  rule: |-
    After सायं, चिरम्, प्राह्णे, प्रगे, and after indeclinables denoting time, add **ट्यु** and **ट्युल्**, each with the augment तुट् (सायं → सायंतन, दिवा → दिवातन).
