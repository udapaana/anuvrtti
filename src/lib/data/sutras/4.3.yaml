- id: '43016'
  ref: 4.3.16
  a: 4
  p: 3
  n: 16
  s: संधिवेलाद्यृतुनक्षत्रेभ्योऽण्
  iast: saṃdhivelādyṛtunakṣatrebhyo'ṇ
  type: V
  typeName: vidhi
  pada:
  - संधिवेला-आदि-ऋतु-नक्षत्रेभ्यः
  - अण्
  adhikara: प्रत्ययः
  inherits:
  - word: कालात्
    from: 4.3.11
  feeds: []
  meaning: ''
  kashika: |-
    कालादित्येव। संधिवेलादिभ्य ऋतुभ्यो नक्षत्रेभ्यश्च कालवृत्तिभ्योऽण् प्रत्ययो भवति शैषिकः। ठञोऽपवादः। अण्ग्रहणं वृद्धाच्छस्य [[४.२.११४]] बाधनार्थम्। संधिवेलादिभ्यस्तावत् — सांधिवेलम्। सांध्यम्। ऋतुभ्यः — ग्रैष्मम्। शैशिरम्। नक्षत्रेभ्यः — तैषम्। पौषम्॥ संधिवेला। संध्या। अमावास्या। त्रयोदशी। चतुर्दशी। पञ्चदशी। पौर्णमासी। प्रतिपत्। संवत्सरात् फलपर्वणोः (ग०सू० १०२)। सांवत्सरं फलम्। सांवत्सरं पर्व॥
  vartika: []
  rule: |-
    After संधिवेला and its group, and after words for a season or an asterism, in the remaining senses, add **अण्** instead of ठञ्; restating अण् here also blocks छ for the वृद्ध words (संधिवेला → सांधिवेल, ग्रीष्म → ग्रैष्म, तिष्य → तैष).
