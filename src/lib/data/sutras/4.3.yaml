# Adhyāya 4, Pāda 3 — 168 sūtras
sutras:
- id: '43001'
  ref: 4.3.1
  a: 4
  p: 3
  n: 1
  s: युष्मदस्मदोरन्यतरस्यां खञ् च
  iast: yuṣmadasmadoranyatarasyāṃ khañ ca
  type: V
  typeName: vidhi
  pada:
  - युष्मद्-अस्मदोः
  - अन्यतरस्याम्
  - खञ्
  - च
  adhikara: प्रत्ययः
  inherits:
  - word: छः
    from: 4.2.137
  feeds:
  - word: युष्मद्-अस्मदोः
    to: 4.3.2
  - word: खञ्
    to: 4.3.2
  - word: युष्मद्-अस्मदोः
    to: 4.3.3
  - word: खञ्
    to: 4.3.3
  meaning: ''
  kashika: |-
    देशाधिकारो निवृत्तः। युष्मदस्मदोः खञ् प्रत्ययो भवति शैषिकः। चकाराच् छश्च। अन्यतरस्यांग्रहणाद् यथाप्राप्तम्। तदेते त्रयः प्रत्यया भवन्ति, तत्र वैषम्याद् यथासंख्यं न भवति। त्यदादित्वाद् वृद्धसंज्ञकयोर्युष्मदस्मदोश्छे प्राप्ते प्रत्येकं प्रत्ययत्रयं विधीयते। यौष्माकीणः। आस्माकीनः। युष्मदीयः। अस्मदीयः। यौष्माकः। आस्माकः॥
  vartika: []
  rule: |-
    After युष्मद् and अस्मद्, **खञ्** optionally comes in the leftover senses; च adds **छ**, and the option leaves **अण्** too.
- id: '43002'
  ref: 4.3.2
  a: 4
  p: 3
  n: 2
  s: तस्मिन्नणि च युष्माकास्माकौ
  iast: tasminnaṇi ca yuṣmākāsmākau
  type: V
  typeName: vidhi
  pada:
  - तस्मिन्
  - अणि
  - च
  - युष्माक-अस्माकौ
  adhikara: प्रत्ययः
  inherits:
  - word: युष्मद्-अस्मदोः
    from: 4.3.1
  - word: खञ्
    from: 4.3.1
  feeds:
  - word: तस्मिन्
    to: 4.3.3
  - word: अणि
    to: 4.3.3
  meaning: ''
  kashika: |-
    तस्मिन्निति साक्षाद् विहितः खञ् निर्दिश्यते, न चकारानुकृष्टश्छः। तस्मिन् खञि अणि च युष्मदस्मदोर्यथासंख्यं युष्माक अस्माक इत्येतावादेशौ भवतः। निमित्तयोरादेशौ प्रति यथासंख्यं कस्माद् न भवति ? योगविभागः करिष्यते, तस्मिन् खञि युष्मदस्मदोर्युष्माकास्माकौ भवतः। ततोऽणि चेति। यौष्माकीणः। आस्माकीनः। यौष्माकः। आस्माकः। तस्मिन्नणि चेति किम्? युष्मदीयः। अस्मदीयः॥
  vartika: []
  rule: |-
    Before **खञ्** and before **अण्**, युष्माक and अस्माक replace युष्मद् and अस्मद्.
- id: '43003'
  ref: 4.3.3
  a: 4
  p: 3
  n: 3
  s: तवकममकावेकवचने
  iast: tavakamamakāvekavacane
  type: V
  typeName: vidhi
  pada:
  - तवक-ममकौ
  - एकवचने
  adhikara: प्रत्ययः
  inherits:
  - word: युष्मद्-अस्मदोः
    from: 4.3.1
  - word: खञ्
    from: 4.3.1
  - word: तस्मिन्
    from: 4.3.2
  - word: अणि
    from: 4.3.2
  feeds: []
  meaning: ''
  kashika: |-
    एकवचनपरयोर्युष्मदस्मदोस्तवक ममक इत्येतावादेशौ भवति यथासंख्यं तस्मिन् खञि अणि च परतः। निमित्तयोस्तु यथासंख्यं पूर्ववदेव न भवति। ननु च <<न लुमताङ्गस्य>> [[१.१.६३]] इति प्रत्ययलक्षणप्रतिषेधादेकवचनपरता युष्मदस्मदोर्न संभवति ? वचनात् प्रत्ययलक्षणं भविष्यति। अथवा नैवेदं प्रत्ययग्रहणम्। किं तर्हि ? अन्वर्थग्रहणम्। एकवचने युष्मदस्मदी एकस्यार्थस्य वाचके तवकममकावादेशौ प्रतिपद्येते इति सूत्रार्थः। तावकीनः। मामकीनः। तावकः। मामकः। तस्मिन्नणि चेत्येव — त्वदीयः। मदीयः॥
  vartika: []
  rule: |-
    When one individual is meant, तवक and ममक replace युष्मद् and अस्मद् before **खञ्** and **अण्**.
- id: '43004'
  ref: 4.3.4
  a: 4
  p: 3
  n: 4
  s: अर्धाद्यत्
  iast: ardhādyat
  type: V
  typeName: vidhi
  pada:
  - अर्धात्
  - यत्
  adhikara: प्रत्ययः
  inherits: []
  feeds:
  - word: अर्धात्
    to: 4.3.5
  - word: यत्
    to: 4.3.5
  - word: अर्धात्
    to: 4.3.6
  - word: यत्
    to: 4.3.6
  - word: यत्
    to: 4.3.7
  meaning: ''
  kashika: |-
    अर्धशब्दाद् यत् प्रत्ययो भवति शैषिकः। अणोऽपवादः। अर्ध्यम्॥ सपूर्वपदाट् ठञ् वक्तव्यः॥ बालेयार्धिकम्। गौतमार्धिकम्॥
  vartika: []
  rule: After अर्ध, **यत्** comes in the leftover senses, blocking **अण्**.
- id: '43005'
  ref: 4.3.5
  a: 4
  p: 3
  n: 5
  s: परावराधमोत्तमपूर्वाच्च
  iast: parāvarādhamottamapūrvācca
  type: V
  typeName: vidhi
  pada:
  - पर-अवर-अधम-उत्तम-पूर्वात्
  - च
  adhikara: प्रत्ययः
  inherits:
  - word: अर्धात्
    from: 4.3.4
  - word: यत्
    from: 4.3.4
  feeds: []
  meaning: ''
  kashika: |-
    पर अवर अधम उत्तम इत्येवंपूर्वाच् चार्धाद् यत् प्रत्ययो भवति शैषिकः। परार्ध्यम्। अवरार्ध्यम्। अधमार्ध्यम्। उत्तमार्ध्यम्। पूर्वग्रहणं किम्, परावराधमोत्तमेभ्य इत्येवोच्यते, अर्धादिति वर्तते। तस्य तत्पूर्वता विज्ञास्यते ? परावरशब्दावदिग्ग्रहणावपि स्तः, परं सुखम् अवरं सुखमिति। तत्र कृतार्थत्वाद् दिक्छब्दपक्षे परेण ठञ्यतौ स्याताम्। अस्मात् पूर्वग्रहणाद् यत् प्रत्ययो भवति — परार्ध्यम्, अवरार्ध्यमिति॥
  vartika: []
  rule: |-
    After अर्ध preceded by पर, अवर, अधम, or उत्तम, **यत्** comes in the leftover senses.
- id: '43006'
  ref: 4.3.6
  a: 4
  p: 3
  n: 6
  s: दिक्पूर्वपदाट्ठञ् च
  iast: dikpūrvapadāṭṭhañ ca
  type: V
  typeName: vidhi
  pada:
  - दिक्-पूर्वपदात्
  - ठञ्
  - च
  adhikara: प्रत्ययः
  inherits:
  - word: अर्धात्
    from: 4.3.4
  - word: यत्
    from: 4.3.4
  feeds:
  - word: दिक्-पूर्वपदात्
    to: 4.3.7
  - word: ठञ्
    to: 4.3.7
  meaning: ''
  kashika: |-
    दिक्पूर्वपदादर्धान्तात् प्रातिपदिकात् ठञ् प्रत्ययो भवति चकाराद् यत् च शैषिकः। अणोऽपवादः। पौर्वार्धिकम्, पूर्वार्ध्यम्। दाक्षिणार्धिकम्, दक्षिणार्ध्यम्। पदग्रहणं स्वरूपविधिनिवारणार्थम्॥
  vartika: []
  rule: |-
    After अर्ध whose prior member names a direction, **ठञ्** comes in the leftover senses, and by च **यत्** too, blocking **अण्**.
- id: '43007'
  ref: 4.3.7
  a: 4
  p: 3
  n: 7
  s: ग्रामजनपदैकदेशादञ्ठञौ
  iast: grāmajanapadaikadeśādañṭhañau
  type: V
  typeName: vidhi
  pada:
  - ग्राम-जनपद-एकदेशात्
  - अञ्-ठञौ
  adhikara: प्रत्ययः
  inherits:
  - word: यत्
    from: 4.3.4
  - word: दिक्-पूर्वपदात्
    from: 4.3.6
  - word: ठञ्
    from: 4.3.6
  feeds: []
  meaning: ''
  kashika: |-
    दिक्पूर्वपदादित्येव। ग्रामैकदेशवाचिनो जनपदैकदेशवाचिनश्च प्रातिपदिकाद् दिक्पूर्वपदादर्धान्तादञ्ठञौ प्रत्ययौ भवतः शैषिकौ यतोऽपवादौ। इमे खल्वस्माकं ग्रामस्य जनपदस्य वा पौर्वार्धाः, पौर्वार्धिकाः। दाक्षिणार्धाः, दाक्षिणार्धिकाः॥
  vartika: []
  rule: |-
    After अर्ध preceded by a direction-word, naming a portion of a village or an inhabited country, **अञ्** and **ठञ्** come in the leftover senses, blocking **यत्**.
- id: '43008'
  ref: 4.3.8
  a: 4
  p: 3
  n: 8
  s: मध्यान्मः
  iast: madhyānmaḥ
  type: V
  typeName: vidhi
  pada:
  - मध्यात्
  - मः
  adhikara: प्रत्ययः
  inherits: []
  feeds:
  - word: मध्यात्
    to: 4.3.9
  meaning: ''
  kashika: |-
    मध्यशब्दाद् मः प्रत्ययो भवति शैषिकः। अणोऽपवादः। मध्यमः॥ आदेश्चेति वक्तव्यम्॥ आदिमः॥ अवोऽधसोर्लोपश्च॥ अवमम्॥ अधमम्॥
  vartika:
  - आदेश्चेति वक्तव्यम् ।
  - अवोधसोर्लोपश्च ।
  rule: After मध्य, म comes in the leftover senses, blocking **अण्**.
- id: '43009'
  ref: 4.3.9
  a: 4
  p: 3
  n: 9
  s: अ साम्प्रतिके
  iast: a sāmpratike
  type: V
  typeName: vidhi
  pada:
  - अ
  - साम्प्रतिके
  adhikara: प्रत्ययः
  inherits:
  - word: मध्यात्
    from: 4.3.8
  feeds: []
  meaning: ''
  kashika: |-
    अकारः प्रत्ययो भवति मध्यशब्दात् सांप्रतिके जातादौ प्रत्ययार्थे। मस्यापवादः। सांप्रतिकं न्याय्यं युक्तमुचितं सममुच्यते। नातिदीर्घं नातिह्रस्वं मध्यं काष्ठम्। नात्युत्कृष्टो नात्यवकृष्टो मध्यो वैयाकरणः। मध्या स्त्री॥
  vartika: []
  rule: |-
    After मध्य, in the remaining senses, add the **प्रत्यय** अ when the meaning is 'fit' or 'proper'; this blocks मस् (मध्य → माध्य).
- id: '43010'
  ref: 4.3.10
  a: 4
  p: 3
  n: 10
  s: द्वीपादनुसमुद्रं यञ्
  iast: dvīpādanusamudraṃ yañ
  type: V
  typeName: vidhi
  pada:
  - द्वीपात्
  - अनु-समुद्रम्
  - यञ्
  adhikara: प्रत्ययः
  inherits: []
  feeds: []
  meaning: ''
  kashika: |-
    समुद्रसमीपे यो द्वीपः, तस्माद् यञ् प्रत्ययो भवति शैषिकः। कच्छादिपाठाद् [[४.२.१३३]] अणो मनुष्यवुञः [[४.२.१३४]] चापवादः। द्वैप्यम्। द्वैप्यं भवन्तोऽनुचरिन्त चक्रम्। अनुसमुद्रमिति किम् ? द्वैपकम्। द्वैपमन्यत्॥
  vartika: []
  rule: |-
    After द्वीप meaning 'near the sea', in the remaining senses, add **यञ्**; this blocks both अण् and वुञ् (द्वीप → द्वैप्य).
- id: '43011'
  ref: 4.3.11
