  adhikara: प्रत्ययः
  inherits:
  - word: तस्य
    from: 4.3.120
  - word: इदम्
    from: 4.3.120
  feeds: []
  meaning: ''
  kashika: |-
    दण्डप्रधाना माणवा दण्डमाणवाः, अन्तेवासिनः शिष्याः। तेष्वभिधेयेषु वुञ् प्रत्ययो न भवति। गोत्रग्रहणमिहानुवर्तते, तेन वुञ्प्रतिषेधो विज्ञायते। गौकक्षाः दण्डमाणवा अन्तेवासिनो वा। दाक्षाः। माहकाः॥
  vartika: []
  rule: |-
    **वुञ्** does not come after a family-name when it names a beginner pupil (**दण्डमाणव**) or a live-in pupil (**अन्तेवासिन्**).
