    The विसर्ग  of गतिसंज्ञक नमस्  and पुरस् words is converted to सकार when followed by कवर्ग letter or a  पवर्ग letter.
  kashika: |-
    नमस् पुरस् इत्येतयोर्गतिसंज्ञकयोर्विसर्जनीयस्य सकारादेशो भवति कुप्वोः परतः। नमस्कर्ता। नमस्कर्तुम्। नमस्कर्तव्यम्। पुरस्कर्ता। पुरस्कर्तुम्। पुरस्कर्तव्यम्। गत्योरिति किम्? पूः, पुरौ, पुरः करोति॥
  vartika: []
  rule: |-
    The **विसर्ग** of नमस् and पुरस्, when they are **गति**, becomes स् before a hard guttural or labial.
