  meaning: "While doing a समास, if all the following conditions are met - \n1. the पूर्वपद ends in a विसर्ग\
    \ that follows an अकार, \n2. the उत्तरपद is either a form of the verb 'कृ', or a form of the verb\
    \ 'कमि' or is one of these words - कंस/कुम्भ/पात्र/कुशा/कर्णी\n3. पू्र्वपद is not an अव्यय\n4.  पू्र्वपद\
