  - प्रतिस्तब्ध-निस्तब्धौ
  - च
  adhikara: पूर्वत्रासिद्धम्
  inherits:
  - word: सः
    from: 8.3.56
  - word: न
    from: 8.3.110
  feeds: []
  meaning: ''
  kashika: |-
    प्रतिस्तब्ध निस्तब्ध इत्यतौ मूर्धन्यप्रतिषेधाय निपात्येते।  <<स्तन्भेः>> [[८.३.६७]] इति प्राप्तं षत्वं प्रतिषिध्यते। प्रतिस्तब्धः। निस्तब्धः॥
  vartika: []
  rule: |-
    प्रतिस्तब्ध and निस्तब्ध keep their स् against expectation; the **ष्** change does not reach them.
- id: '83115'
  ref: 8.3.115
  a: 8
  p: 3
  n: 115
  s: सोढः
  iast: soḍhaḥ
  type: V
  typeName: vidhi
  pada:
  - सोढः
  adhikara: पूर्वत्रासिद्धम्
  inherits:
  - word: सः
    from: 8.3.56
  - word: न
    from: 8.3.110
  feeds: []
  meaning: ''
  kashika: |-
    सहिरयं सोड्भूतो गृह्यते, तस्य सकारस्य मूर्धन्यादेशो न भवति। परिसोढा। परिसोढुम्। परिसोढव्यम्। सोड्भूतग्रहणं किम्? परिषहते॥
  vartika: []
  rule: |-
    The स् of सह in its सोढ form stays स्: परिसोढः, परिसोढुम्, परिसोढव्यम्. (As सह proper it changes: परिषहते.)
- id: '83116'
  ref: 8.3.116
  a: 8
  p: 3
  n: 116
  s: स्तम्भुसिवुसहां चङि
  iast: stambhusivusahāṃ caṅi
  type: V
  typeName: vidhi
  pada:
  - स्तम्भु-सिवु-सहाम्
  - चङि
  adhikara: पूर्वत्रासिद्धम्
  inherits:
  - word: सः
    from: 8.3.56
  - word: न
    from: 8.3.110
  feeds: []
  meaning: ''
  kashika: |-
    स्तम्भु सिवु सह इत्येतेषां चङि परतः सकारस्य मूर्धन्यादेशो न भवति। <<स्तन्भेः>> [[८.३.६७]] इति <<परिनिविभ्यः०>> [[८.३.७०]] इति च प्राप्तो मूर्धन्यः प्रतिषिध्यते। स्तम्भु — पर्यतस्तम्भत्। अभ्यतस्तम्भत्। सिवु — पर्यसीषिवत्। न्यसीषिवत्। सह — पर्यसीषहत्। व्यसीषहत्॥ स्तम्भुसिवुसहां चङि उपसर्गादिति वक्तव्यम्॥ उपसर्गाद् या प्राप्तिस्तस्या एव प्रतिषेधो यथा स्यात्, अभ्यासाद् या प्राप्तिस्तस्या मा भूदिति। तथा चैवोदाहृतम्॥
  vartika: []
  rule: |-
    In the reduplicated aorist (**चङ्**) the स् of स्तम्भ्, सिव्, सह stays स्: पर्यतस्तम्भत्, पर्यसीषिवत्, पर्यसीषहत्. (This blocks only the change the **उपसर्ग** would cause, not the one from the reduplicate.)
- id: '83117'
  ref: 8.3.117
  a: 8
  p: 3
  n: 117
  s: सुनोतेः स्यसनोः
  iast: sunoteḥ syasanoḥ
  type: V
  typeName: vidhi
  pada:
  - सुनोतेः
  - स्य-सनोः
  adhikara: पूर्वत्रासिद्धम्
  inherits:
  - word: सः
    from: 8.3.56
  - word: न
    from: 8.3.110
  feeds: []
  meaning: ''
  kashika: |-
    सुनोतेः सकारस्य मूर्धन्योदेशो न भवति स्ये सनि च परतः। अभिसोष्यति। परिसोष्यति। अभ्यसोष्यत्। पर्यसोष्यत्। सनि किमुदाहरणम्? सुसूषति। नैतदस्ति प्रयोजनम्, अत्र <<स्तौतिण्योरेव षण्यभ्यासात्>> [[८.३.६१]] इति नियमाद् न भविष्यति। इदं तर्हि, अभिसुसूषति। एतदपि नास्ति, <<स्थादिष्वभ्यासेन चाभ्यासस्य>> [[८.३.६४]] इति नियमात् । इदं तर्हि, अभिसुसूषतेरप्रत्ययोऽभिसुसूरित्युदाहरणमिति। अत्र हि सन् षभूतो न भवतीत्यभ्यासात् प्राप्तिरस्ति। स्यसनोरिति किम् ? सुषाव॥
  vartika: []
  rule: |-
    The स् of सु (सुनोति) stays स् before स्य and सन् — that is, in future, conditional, and desiderative: अभिसोष्यति, अभ्यसोष्यत्, अभिसुसूः. (Elsewhere it changes: सुषाव.)
- id: '83118'
  ref: 8.3.118
  a: 8
  p: 3
  n: 118
  s: सदेः परस्य लिटि
  iast: sadeḥ parasya liṭi
  type: V
  typeName: vidhi
  pada:
  - सदेः
  - परस्य
  - लिटि
  adhikara: पूर्वत्रासिद्धम्
  inherits:
  - word: सः
    from: 8.3.56
  - word: न
    from: 8.3.110
  feeds: []
  meaning: ''
  kashika: |-
    सदि ष्वञ्जि इत्येतयोर्धात्वोर्लिटि परतः सकारस्य परस्य मूर्धन्यो न भवति। अभिषसाद। परिषसाद। निषसाद। विषसाद। परिषस्वजे, परिषस्वजाते, परिषस्वजिरे। अभिषस्वजे। स्वञ्जेः संयोगान्तादपि विभाषा लिटः कित्त्वमिच्छन्ति (१.२.६ वा०) इति पक्षेऽनुषङ्गलोपः॥
  vartika:
  - स्वञ्जेरुपसंख्यानम् ।
  rule: |-
    In the **लिट्** (perfect), the later स् of सद् and ष्वञ्ज् — the one after the reduplicate — stays स्: अभिषसाद, निषसाद, परिषस्वजे (the first स् changes, the second does not).
- id: '83119'
  ref: 8.3.119
  a: 8
  p: 3
  n: 119
  s: निव्यभिभ्योऽड्व्यवाये वा छन्दसि
  iast: nivyabhibhyo'ḍvyavāye vā chandasi
  type: V
  typeName: vidhi
  pada:
  - नि-वि-अभिभ्यः
  - अड्व्यवाये
  - वा
  - छन्दसि
  adhikara: पूर्वत्रासिद्धम्
  inherits:
  - word: सः
    from: 8.3.56
  - word: न
    from: 8.3.110
  feeds: []
  meaning: ''
  kashika: |-
    नि वि अभि इत्येतेभ्यः उपसर्गेभ्यः उत्तरस्य सकारस्य अड्व्यवाये छन्दसि विषये मूर्दह्न्यादेशो न भवति वा। न्यषीदत् पिता नः, न्यसीदत्। व्यषीदत् पिता नः, व्यसीदत्। अभ्यषीदत्, अभ्यसीदत्। सदिष्वञ्जोरिति तदिह न अनुवर्तते। सामान्येन एव तद्वचनम्। व्यष्टौत्, व्यस्तौत्, अभ्यष्टौत्, अभ्यस्तौतित्येतदपि सिद्धं भवति। इति वामनकाशिकायां वृत्तौ अष्टमाध्यायस्य तृतीयः पादः। अष्टमाध्यायस्य चतुर्थः पादः।
  vartika: []
  rule: |-
    In the Vedas, after the **उपसर्ग** नि, वि, or अभि, a स् becomes ष् only optionally when the augment अट् stands between.
