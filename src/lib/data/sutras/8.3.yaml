  meaning: "In the Vedic usages, the पद ending in मतुँप् or क्वसुँ प्रत्यय undergo रुँत्वम् in the formation\
    \ of सम्बोधन-एकवचन form. "
  kashika: |-
    संहितायामिति वर्तते। मत्वन्तस्य वस्वन्तस्य च पदस्य रुरित्ययमादेशो भवति संबुद्धौ परतश्छन्दसि विषये। मत्वन्तस्य तावत् — इन्द्॑र मरुत्व इ॒ह पा॑हि॒ सोम॒म् (तै०सं० १.४.१८.१)। हरिवो मे॒दिनं॑ त्वा (तै०सं० ४.७.१४.४)। मरुतोऽस्य सन्ति, हरयोऽस्य सन्तीति मतुप्। सुतकारयोः हल्ङ्यादिलोपे [[६.१.६८]] संयोगान्तस्य लोपे [[८.२.२३]] च कृते नकारस्य रुर्भवति। वस्वन्तस्य खल्वपि — मीढ्व॑स्तो॒काय॒ तन॑याय मृळ (ऋ० २.३३.१४)। इन्द्र साह्वः। क्वसोर्निपातनं <<दाश्वान्साह्वान्मीढ्वांश्च>> [[६.१.१२]] इति। मतुवसोरिति किम्? ब्रह्मन् स्तोष्यामः। संबुद्धाविति किम्? य॑ ए॒वं॑ वि॒द्वा॑न॒ग्नि॑मुप॒ति॑ष्ठ॒ते (मै०सं०१.५.७)। छन्दसीति किम्? हे गोमन्। हे पपिवन्॥ वन उपसंख्यानं कर्तव्यम्॥ यस्त्वा॒यन्तं॒ वसु॑ना प्रातरित्वः(ऋ० १.१२५.२)। इणः प्रातःपूर्वस्य छन्दसि क्वनिप्॥ विभाषा भवद्भगवदघवतामोच्चावस्य॥ छन्दसि भाषायां च भवद् भगवद् अघवद् इत्येतेषां विभाषा रुर्वक्तव्यः, अवशब्दस्य च ओकारादेशः। सामान्येन छन्दसि भाषायां चेदं वचनम्। भवत् — हे भोः, हे भवन्। भगवत् — हे भगोः, हे भगवन्। अघवत् — हे अघोः, हे अघवन्। निपातविज्ञानाद् वा सिद्धम्। अथवा भो इत्येवमादयो निपाता द्रष्टव्याः। असंबुद्धावपि द्विवचनबहुवचनयोरपि दृश्यन्ते। भो देवदत्तयज्ञदत्तौ। भो देवदत्तयज्ञदत्तविष्णुमित्राः। तथा स्त्रियामपि च दृश्यन्ते — भो ब्राह्मणि इत्यादि। संहिताधिकार उत्तरत्रोपयुज्यते, यत्र भिन्नपदस्थौ निमित्तनिमित्तिनौ — ‘नश्छव्यप्रशान्>>[[८.३.७]] इति॥
  vartika:
  - वन उपसङ्ख्यानम् ।
  - विभाषा भवद्भगवदघवतामोच्चावस्य छन्दसि भाषायां च।
  rule: |-
    In the **छन्दस्**, the final त् or स् of a word ending in मत् or वस् becomes रु in the vocative singular.
- id: '83002'
  ref: 8.3.2
  a: 8
  p: 3
  n: 2
  s: अत्रानुनासिकः पूर्वस्य तु वा
  iast: atrānunāsikaḥ pūrvasya tu vā
  type: AD
  typeName: adhikāra
  pada:
  - अत्र
  - अनुनासिकः
  - पूर्वस्य
  - तु
  - वा
  adhikara: पदस्य
  inherits:
  - word: रु
    from: 8.3.1
  feeds: []
  meaning: |-
    For the रुँ generated using the rules from this रूत्वप्रकरण, the letter before  this रुँ is optionally converted to an अनुनासिक.
  kashika: |-
    अधिकारोऽयम्। इत उत्तरं यस्य स्थाने रुर्विधीयते, ततः पूर्वस्य तु वर्णस्य वानुनासिको भवतीत्येतदधिकृतं वेदितव्यम्, यदित ऊर्ध्वमनुक्रमिष्यामस्तत्र। वक्ष्यति — <<समःसुटि>> [[८.३.५]] — सँस्स्कर्ता। सँस्स्कर्तुम्। सँस्स्कर्तव्यम्। अत्रग्रहणं रुणा सह संनियोगप्रतिपत्त्यर्थम्। अधिकारपरिमाणापरिग्रहे हि सति <<ढो ढे लोपः>> [[८.३.१३]] इत्यत्रापि पूर्वस्यानुनासिक आशङ्क्येत॥
  vartika: []
  rule: |-
    From here through [[8.3.12]], supply this: the vowel before the letter replaced by रु optionally becomes nasal.
- id: '83003'
  ref: 8.3.3
  a: 8
  p: 3
  n: 3
  s: आतोऽटि नित्यम्
  iast: āto'ṭi nityam
  type: V
  typeName: vidhi
  pada:
  - आतः
  - अटि
  - नित्यम्
  adhikara: पदस्य
  inherits:
  - word: रु
    from: 8.3.1
  feeds: []
  meaning: "In this रूत्वप्रकरण, The रुँ that gets constructed at end of a पद causes an अनुनासिक of the\
    \ आकार just preceding it. "
  kashika: |-
    अटि परतो रोः पूर्वस्याकारस्य स्थाने नित्यमनुनासिकादेशो भवति। <<दीर्घादटि समानपादे>>[[८.३.९]] इति रुत्वं वक्ष्यति, ततः पूर्वस्यातोऽनुनासिकविकल्पे प्राप्ते नित्यार्थं वचनम्। म॒हाँ अ॑सि (ऋ०३.४६.२)। म॒हाँ इन्द्रो॒ य ओज॑सा (ऋ० ८.६.१)। दे॒वाँ अच्छा॒ दीद्य॑त् (ऋ० ३.१.१)। केचिदनुस्वारमधीयते, सच्छान्दसो व्यत्ययो द्रष्टव्यः। आत इति किम्? ये वा॒ वन॒स्पती॒ँ१रनु॑ (मा०सं० १३.७)। अटीति किम् ? भवांश्चरति। भवांश्छादयति। नित्यग्रहणं विस्पष्टार्थम्॥
  vartika: []
  rule: |-
    आ before रु always becomes nasal when an **अट्** letter (a vowel, or ह, य, व, र) follows.
- id: '83004'
  ref: 8.3.4
  a: 8
  p: 3
  n: 4
  s: अनुनासिकात् परोऽनुस्वारः
  iast: anunāsikāt paro'nusvāraḥ
  type: V
  typeName: vidhi
  pada:
  - अनुनासिकात्
  - परः
  - अनुस्वारः
  adhikara: पदस्य
  inherits:
  - word: रु
    from: 8.3.1
  feeds: []
  meaning: "If the रुँ letter generated in this रूत्वप्रकरण does not cause the previous letter to get\
    \ an अनुनासिक, then it will generate an अनुस्वार आगम just after that previous letter. "
  kashika: |-
    अन्यशब्दोऽत्राध्याहर्तव्यः। तदपेक्षया चेयमनुनासिकादिति पञ्चमी। अनुनासिकादन्यो यो वर्णो रोः पूर्वः, यस्यानुनासिको न कृतः, ततः परोऽनुस्वार आगमो भवति। वक्ष्यति — <<समःसुटि>> [[८.३.५]] — संस्स्कर्ता। संस्स्कर्तुम्। संस्स्कर्तव्यम्। <<पुमः खय्यम्परे>>[[८.३.६]] — पुंस्कामा। <<नश्छव्यप्रशान्>>[[८.३.७]] — भवांश्चरति। केचित् तु परशब्दमेवान्यार्थं वर्णयन्ति। अनुनासिकात् परोऽनुनासिकादन्योऽनुस्वारो भवति। यस्मिन् पक्षेऽनुनासिको नास्ति, तत्रानुस्वारागमो भवति। स तु कस्यागमो भवति? रोः पूर्वस्यैवेति वर्तते, व्याख्यानादादेशो न भवति॥
  vartika: []
  rule: |-
    When the vowel before रु is not made nasal, **अनुस्वार** is added after it instead.
- id: '83005'
  ref: 8.3.5
  a: 8
  p: 3
  n: 5
  s: समः सुटि
  iast: samaḥ suṭi
  type: V
  typeName: vidhi
  pada:
  - समः
  - सुटि
  adhikara: पदस्य
  inherits:
  - word: रु
    from: 8.3.1
  feeds: []
  meaning: When followed by  सुट् आगम, the मकार of सम् is converted to रुँ.
  kashika: |-
    रुर्वर्तते। सम् इत्येतस्य रुर्भवति सुटि परतः संहितायां विषये सँस्स्कर्ता। सँस्स्कर्तुम्। सँस्स्कर्तव्यम्। संस्स्कर्ता। संस्स्कर्तुम्। संस्स्कर्तव्यम्। अत्र रोर्विसर्जनीये कृते <<वा शरि>> [[८.३.३६]] इति पक्षे विसर्जनीय एव प्राप्नोति। व्यवस्थितविभाषा द्रष्टव्या। तेनात्र नित्यं सकार एव भवति। अस्मिन्नेव सूत्रे सकारादेशो वा निर्दिश्यते। समः स्सुटीति द्विसकारको निर्देशः। सम इति किम्? उपस्कर्ता। सुटीति किम्? संकृतिः। कश्चिदाह — ॥ संपुंकानां सो वक्तव्यः॥ रुविधौ ह्यनिष्टप्रसङ्गः — संस्स्कर्ता, पुंस्कामा, कांस्कानिति॥
  vartika:
  - संपुंकानां सो वक्तव्यः, समो वा लोपमेके ।
  rule: |-
    The म् of सम् becomes रु before the augment सुट् (and the preceding अ thereby becomes nasal or takes **अनुस्वार**).
- id: '83006'
  ref: 8.3.6
  a: 8
  p: 3
  n: 6
  s: पुमः खय्यम्परे
  iast: pumaḥ khayyampare
  type: V
  typeName: vidhi
  pada:
  - पुमः
  - खयि
  - अम्परे
  adhikara: पदस्य
  inherits:
  - word: रु
    from: 8.3.1
  feeds:
  - word: अम्परे
    to: 8.3.7
  - word: अम्परे
    to: 8.3.8
  meaning: |
    In the context of संहिता, when the word पुम् is followed by a letter from खय्  प्रत्याहार which in turn is followed by a letter form अम् प्रत्याहार, the मकार of पुम् is converted to रुँ.
  kashika: |-
    पुमित्येतस्य रुर्भवत्यम्परे खयि परतः। पुँस्कामा, पुंस्कामा। पुँस्पुत्रः, पुंस्पुत्रः। पुँस्फलम्, पुंस्फलम्। पुँश्चली,पुंश्चली। पुंस्कामेत्यत्र विसर्जनीयस्य <<कुप्वोः क पौ च>> [[८.३.३७]] इति प्राप्नोति। तस्मादत्र सकार एवादेशो वक्तव्यः। द्विसकारकनिर्देशपक्षे तु पूर्वस्मादेव सूत्रात् स इत्यनुवर्तते। रुत्वं त्वनुवर्तमानमपि नात्राभिसंबध्यते, संबन्धानुवृत्तिस्तस्येति। खयीति किम्? पुंदासः। पुंगवः। अम्पर इति किम्? पुंक्षीरम्। पुंक्षुरम्। परग्रहणं किम्? पुमाख्यः। पुमाचारः॥
  vartika: []
  rule: |-
    The म् of **पुम्** becomes **रु** before a surd stop (**खय्**) that is itself followed by a vowel, semivowel, or nasal (**अम्**).
- id: '83007'
  ref: 8.3.7
  a: 8
  p: 3
  n: 7
  s: नश्छव्यप्रशान्
  iast: naśchavyapraśān
  type: V
  typeName: vidhi
  pada:
  - नः
  - छवि
  - अप्रशान्
  adhikara: पदस्य
  inherits:
  - word: रु
    from: 8.3.1
  - word: अम्परे
    from: 8.3.6
  feeds:
  - word: छवि
    to: 8.3.8
  - word: नः
    to: 8.3.8
  - word: नः
    to: 8.3.9
  - word: नः
    to: 8.3.10
  - word: नः
    to: 8.3.11
  - word: नः
    to: 8.3.12
  meaning: "In the context of संहिता, when a पदान्त नकार is followed by a letter from छव् प्रत्याहार,\
    \ which in turn is followed by a letter from अम् प्रत्याहार, then the नकार is converted to रुँ. But\
    \ this conversion does not happen for the word 'प्रशान्'. \n"
  kashika: |-
    अम्पर इति वर्तते। नकारान्तस्य पदस्य प्रशान्वर्जितस्य रुर्भवत्यम्परे छवि परतः। भवाँश्छादयति, भवांश्छादयति। भवाँश्चिनोति, भवांश्चिनोति। भवाँष्टीकते, भवांष्टीकते। भवाँस्तरति, भवांस्तरति। छवीति किम्? भवान् करोति। अप्रशानिति किम्? प्रशान् छादयति। प्रशान् चिनोति। अम्पर इत्येव — भवान् त्सरुकः॥
  vartika: []
  rule: |-
    A word-final न्, except the न् of प्रशान्, becomes **रु** before a **छव्** letter (छ, ठ, थ, च, ट, त) that is itself followed by an **अम्** letter (vowel, semivowel, or nasal).
- id: '83008'
  ref: 8.3.8
  a: 8
  p: 3
  n: 8
  s: उभयथर्क्षु
  iast: ubhayatharkṣu
  type: V
  typeName: vidhi
  pada:
  - उभयथा
  - ऋक्षु
  adhikara: पदस्य
  inherits:
  - word: रु
    from: 8.3.1
  - word: अम्परे
    from: 8.3.6
  - word: छवि
    from: 8.3.7
  - word: नः
    from: 8.3.7
  feeds: []
  meaning: "In the context of संहिता and in the vedas, when a पदान्त नकार is followed by a letter from\
    \ छव् प्रत्याहार, which in turn is followed by a letter from अम् प्रत्याहार, then the नकार is optionally\
    \ converted to रुँ. "
  kashika: |-
    पूर्वण नित्ये प्राप्ते विकल्पः क्रियते। नकारान्तस्य पदस्य छवि परतोऽम्पर उभयथा ऋक्षु भवति, रुर्वा नकारो वा । तस्मिंस्त्वा दधाति, तस्मिन्त्वा दधाति। ऋक्ष्विति किम्? ताँस्त्वं खा॑द॒ सुखा॑दितान् (मा०सं० ११.७८)॥
  vartika: []
  rule: |-
    In the **ऋच्** verses this **रु** substitution is optional: the न् either becomes रु or stays.
- id: '83009'
  ref: 8.3.9
  a: 8
  p: 3
  n: 9
  s: दीर्घादटि समानपादे
  iast: dīrghādaṭi samānapāde
  type: V
  typeName: vidhi
  pada:
  - दीर्घात्
  - अटि
  - समानपादे
  adhikara: पदस्य
  inherits:
  - word: रु
    from: 8.3.1
  - word: नः
    from: 8.3.7
  feeds: []
  meaning: |-
    In the context of वेदाः - If a पदान्त-नकार present after a दीर्घ स्वर is followed by a letter from the अट् प्रत्याहार in the same पाद, then the नकार is optionally converted to रुँ.
  kashika: |-
    न इत्यनुवर्तते। दीर्घादुत्तरस्य पदान्तस्य नकारस्य रुर्भवत्यटि परतः तौ चेद् निमित्तनिमित्तिनौ समानपादे भवतः। ऋक्ष्विति प्रकृतत्वाद् ऋक्पाद इह गृह्यते। परि॒धीँरति॒ (ऋ०९.१०७.१९)। दे॒वाँ अच्छा॒ दीद्य॑त् (ऋ० ३.१.१)। म॒हाँ इन्द्रो॒ य ओज॑सा (ऋ० ८.६.१)। दीर्घादिति किम्? अह॒न्नहि॒म् (ऋ०१.३२.१)। अटीति किम्? इभ्यान् क्षत्रियान्। समानपाद इति किम्? यातु॒धाना॒नुप॑स्पृश (ऋ० १०.८७.२)। उभयथेत्येव — आदित्यान् हवामहे॥
  vartika: []
  rule: |-
    A word-final न् after a long vowel optionally becomes **रु** before an **अट्** letter (vowel or semivowel, but not ल्) when both stand in the same **पाद** of an **ऋच्** verse.
