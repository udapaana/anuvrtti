- id: '83097'
  ref: 8.3.97
  a: 8
  p: 3
  n: 97
  s: |-
    अम्बाम्बगोभूमिसव्यापद्वित्रिकुशेकुशङ्क्वङ्गुमञ्जिपुञ्जिपरमेबर्हिर्दिव्यग्निभ्यः स्थः
  iast: |-
    ambāmbagobhūmisavyāpadvitrikuśekuśaṅkvaṅgumañjipuñjiparamebarhirdivyagnibhyaḥ sthaḥ
  type: V
  typeName: vidhi
  pada:
  - |-
    अम्ब-आम्ब-गो-भूमि-सव्य-अप-द्वि-त्रि-कु-शेकु-शङ्कु-अङ्गु-मञ्जि-पुञ्जि-परमे-बर्हिस्-दिवि-अग्निभ्यः
  - स्थः
  adhikara: पूर्वत्रासिद्धम्
  inherits:
  - word: सः
    from: 8.3.56
  feeds: []
  meaning: ''
  kashika: |-
    अम्ब आम्ब गो भूमि सव्य अप द्वि त्रि कु शेकु शङ्कु अङ् गु मञ्जि पुञ्जि परमे बर्हिस् दिवि अग्नि इत्येतेभ्य उत्तरस्य स्थशब्दसकारस्य मूर्धन्यादेशो भवति। अम्बष्ठः। आम्बष्ठः। गोष्ठः। भूमिष्ठः। सव्येष्ठः। अपष्ठः। द्विष्ठः। त्रिष्ठः। कुष्ठः। शेकुष्ठः। शङ्कुष्ठः। अङ्गुष्ठः। मञ्जिष्ठः। पुञ्जिष्ठः। परमेष्ठः।  बर्हिष्ठः। दिविष्ठः। अग्निष्ठः॥ स्थास्थिन्स्थृृणामिति वक्तव्यम्॥ स्व्येष्ठाः। परमेष्ठी। सव्येष्ठृसारथिः॥
  vartika:
  - स्थास्थिन्स्थॄणामिति वक्तव्यम् ।
  rule: |-
    The स् of स्थ becomes **ष्** after अम्ब, आम्ब, गो, भूमि, सव्य, अप, द्वि, त्रि, कु, शेकु, शङ्कु, अङ्गु, मञ्जि, पुञ्जि, परमे, बर्हिस्, दिवि, अग्नि: गोष्ठः, भूमिष्ठः, अङ्गुष्ठः, परमेष्ठः, बर्हिष्ठः and so on. (स्थ here is the bare word-form, not the genitive of स्था.)
- id: '83098'
  ref: 8.3.98
  a: 8
  p: 3
  n: 98
  s: सुषामादिषु च
  iast: suṣāmādiṣu ca
  type: V
  typeName: vidhi
  pada:
  - सुषामादिषु
  - च
  adhikara: पूर्वत्रासिद्धम्
  inherits:
  - word: सः
    from: 8.3.56
  feeds: []
  meaning: ''
  kashika: |-
    सुषामादिषु शब्देषु सकारस्य मूर्धन्यादेशो भवति। शोभनं साम यस्यासौ सुषामा ब्राह्मणः। दुष्षामा। निष्षामा। निष्षेधः। दुष्षेधः। सुशब्दस्य कर्मप्रवचनीयसंज्ञकत्वाद् निर्दुर्शब्दयोश्च क्रियान्तरविषयत्वादनुपसर्गत्वे सति पाठोऽयम्। <<सेधतेर्गतौ>> [[८.३.१११]] इति वा प्रतिषेधबाधनार्थः। सुषन्धिः। दुष्षन्धिः। निष्षन्धिः। सुष्ठु। दुष्ठु। तिष्ठतेरुणादिषु (प०उ० १.२५) एतौ व्युत्पाद्येते। गौरिषक्थः संज्ञायाम् (ग०सू० १८२)। ङ्यापोः संज्ञाछन्दसोर्बहुलम् [[६.३.६३]] इति पूर्वपदस्य ह्रस्वत्वम्। प्रतिष्णिका। प्रतिष्णाशब्दादयं कन् प्रत्ययः। जलाषाहम्। नौषेचनम्। दुन्दुभिषेवणम्।
  vartika: []
  rule: |-
    The स् becomes **ष्** in सुषामन्, निष्षाम, सुष्ठु, गौरिषक्थ, प्रतिष्णिका and the rest of the सुषामादि list — an open class catching cerebral **ष्** changes no specific rule supplies.
