  - संज्ञायाम्
  - अगात्
  adhikara: पूर्वत्रासिद्धम्
  inherits:
  - word: सः
    from: 8.3.56
  feeds:
  - word: एति
    to: 8.3.100
  - word: संज्ञायाम्
    to: 8.3.100
  - word: अगात्
    to: 8.3.100
  meaning: ''
  kashika: |-
    एकारपरस्य सकारस्य मूर्धन्यादेशो भवतीण्कोरुत्तरस्यागकारात् परस्य संज्ञायां विषये। हरिषेणः। वारिषेणः। जानुषेणी। एतीति किम्? हरिसक्थम्। संज्ञायामिति किम्? पृथ्वी सेना यस्य स पृथुसेनो राजा। अगादिति किम्? विष्वक्सेनः। इण्कोरित्येव — सर्वसेनः।
  vartika: []
  rule: |-
    A स् after an **इण्** or **कु** letter, before ए, becomes **ष्** when the word is a name and the स् is not preceded by ग्: हरिषेणः, वारिषेणः, जानुषेणी. (Not पृथुसेनः, a non-name; not विष्वक्सेनः, where ग् precedes.)
- id: '83100'
