  meaning: |-
    The अपदान्त-सकार present in the 'साड्' form of the verb सह् is converted to षकार.
  kashika: |-
    सहेर्धातोः साड्रूपस्य यः सकारस्तस्य मूर्धन्य आदेशो भवति। जलाषाट्। तुराषाट्। पृतनाषाट्। सहेरिति किम्? सह डेन वर्तते सडः, तस्यापत्यं साडिः। साड्ग्रहणं किम्? यत्रास्यैतद् रूपं तत्र यथा स्यात्। इह मा भूत् — तुरासाहम्। स इति किम्? आकारस्य मा भूत्॥
  vartika: []
  rule: The स् of सह्, in its form साड् (साट्), becomes ष्।
- id: '83057'
  ref: 8.3.57
  a: 8
  p: 3
  n: 57
  s: इण्कोः
  iast: iṇkoḥ
  type: AD
  typeName: adhikāra
  pada:
  - इण्कोः
  adhikara: पूर्वत्रासिद्धम्
  inherits:
  - word: सः
    from: 8.3.56
  feeds: []
  meaning: |-
    This is an अधिकार, which goes till the end of the पाद. The कार्य designated in this अधिकार happens for a स्थानी that follows an इण् letter or a letter from कवर्ग.
  kashika: |-
    इण्कोरित्येतदधिकृतं वेदितव्यम्। इत उत्तरं यद् वक्ष्यामः, इणः कवर्गात् चेत्येवं तद् वेदितव्यम्। वक्ष्यति — ‘आदेशप्रत्यययोः‘[[८.३.५९]] — सिषेव। सुष्वाप। अग्निषु। वायुषु। कर्तृषु। हर्तृषु। गीर्षु। धूर्षु। वाक्षु। त्वक्षु। इण्कोरिति किम्? दास्यति। असौ॥
  vartika: []
  rule: |-
    From here to the end of the chapter, supply: when an **इण्** sound (any vowel but अ/आ, or र्) or a guttural precedes.
- id: '83058'
