  meaning: |-
    A verb gets the प्रत्ययाः of आत्मनेपद, even in the कर्तरि प्रयोग, in the context of व्यतिहार (exchange of actions).
  kashika: |-
    कर्मशब्दः क्रियावाची। व्यतिहारो विनिमयः। यत्रान्यसंबन्धिनीं क्रियामन्यः करोति, इतरसंबन्धिनीं चेतरः, स कर्मव्यतिहारः। तद्विशिष्टक्रियावचनाद् धातोरात्मनेपदं भवति। व्यतिलुनते। व्यतिपुनते। कर्मव्यतिहार इति किम्? लुनन्ति। कर्तृग्रहणमुत्तरार्थं  <<शेषात् कर्तरि परस्मैपदम्>> [[१.३.७८]] इति॥
  vartika: []
  rule: |-
    For the agent, when the action is reciprocal (each does to the other), the root takes **आत्मनेपद**.
- id: '13015'
  ref: 1.3.15
  a: 1
  p: 3
  n: 15
  s: न गतिहिंसार्थेभ्यः
  iast: na gatihiṃsārthebhyaḥ
  type: V
  typeName: vidhi
  pada:
  - न
  - गति-हिंसा-अर्थेभ्यः
  adhikara: ''
  inherits:
  - word: आत्मनेपदम्
    from: 1.3.12
  - word: कर्म-व्यतिहारे
    from: 1.3.14
  feeds:
  - word: न
    to: 1.3.16
  meaning: |-
    The verbs indicating the action of - (a) movement,  or (2) violence - do not get the प्रत्ययाः of आत्मनेपद in the कर्तरि प्रयोग, in the context of व्यतिहार (exchange of actions).
  kashika: |-
    पूर्वेणात्मनेपदं प्राप्तं प्रतिषिध्यते। गत्यर्थेभ्यो हिंसार्थेभ्यश्च धातुभ्यः कर्मव्यतिहार आत्मनेपदं न भवति । व्यतिगच्छन्ति। व्यतिसर्पन्ति। हिंसार्थेभ्यः — व्यतिहिंसन्ति। व्यतिघ्नन्ति॥ प्रतिषेधे हसादीनामुपसंख्यानम्॥ व्यतिहसन्ति। व्यतिजल्पन्ति। व्यतिपठन्ति ॥ हरतेरप्रतिषेधः॥ संप्रहरन्ते राजानः॥
  vartika:
  - हसादीनामुपसंख्यानम् ।
  - हरतेरप्रतिषेधः ।
  rule: |-
    But a root meaning motion or injury does not take **आत्मनेपद** for reciprocal action.
