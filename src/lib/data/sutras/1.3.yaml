  meaning: |
    When any of the उपसर्गs - सम् , अव, प्र, वि - is attached to the verb 'स्था', it gets the प्रत्ययाः of आत्मनेपद.
  kashika: |-
    सम् अव प्र वि इत्येवंपूर्वात् तिष्ठतेरात्मनेपदं भवति। संतिष्ठते। अवतिष्ठते। प्रतिष्ठते। वितिष्ठते॥ आङःस्थः प्रतिज्ञान इति वक्तव्यम्॥ अस्तिं सकारमातिष्ठते। आगमौ गुणवृद्धी आतिष्ठते॥
  vartika:
  - आङः प्रतिज्ञायाम् ।
  rule: After सम्, अव, प्र, or वि, स्था takes **आत्मनेपद**.
- id: '13023'
  ref: 1.3.23
  a: 1
  p: 3
  n: 23
  s: प्रकाशनस्थेयाख्ययोश्च
  iast: prakāśanastheyākhyayośca
  type: V
  typeName: vidhi
  pada:
  - प्रकाशन-स्थेय-आख्ययोः
  - च
  adhikara: ''
  inherits:
  - word: आत्मनेपदम्
    from: 1.3.12
  - word: स्थः
    from: 1.3.22
  feeds: []
  meaning: |-
    The verb स्था gets the प्रत्ययाः of आत्मनेपद when used in the meaning of - (a) Clearing explaining own opinion, and (b) Putting and end to a question / debate.
  kashika: |-
    स्वाभिप्रायकथनं प्रकाशनम्। स्थेयस्याख्या स्थेयाख्या। तिष्ठन्त्यस्मिन्निति स्थेयः। विवादपदनिर्णेता लोके स्थेय इति प्रसिद्धः, तस्य प्रतिपत्त्यर्थमाख्याग्रहणम्। प्रकाशने स्थेयाख्यायां च तिष्ठतेरात्मनेपदं भवति। प्रकाशने तावत् — तिष्ठते कन्या छात्रेभ्यः। तिष्ठते वृषली ग्रामपुत्रेभ्यः। प्रकाशयत्यात्मानमित्यर्थः। स्थेयाख्यायाम् — त्वयि तिष्ठते। मयि तिष्ठते। संशय्य कर्णादिषु तिष्ठते यः (कि० ३.१४)॥
  vartika: []
  rule: |-
    स्था takes **आत्मनेपद** when it means making one's intentions known, or acting as an arbitrator.
- id: '13024'
  ref: 1.3.24
  a: 1
  p: 3
  n: 24
  s: उदोऽनूर्ध्वकर्मणि
  iast: udo'nūrdhvakarmaṇi
  type: V
  typeName: vidhi
  pada:
  - उदः
  - अनूर्ध्वकर्मणि
  adhikara: ''
  inherits:
  - word: आत्मनेपदम्
    from: 1.3.12
  - word: स्थः
    from: 1.3.22
  feeds: []
  meaning: |
    When the उपसर्ग 'उत्' is attached to the verb 'स्था', it gets the प्रत्ययाः of आत्मनेपद, provided that the meaning is not 'moving upwards / standing up'.
  kashika: |-
    उत्पूर्वात् तिष्ठतेरनूर्ध्वकर्मणि वर्तमानादात्मनेपदं भवति। कर्मशब्दः क्रियावाची। अनूर्ध्वकर्मविशिष्टात् क्रियावचनात् तिष्ठतेरात्मनेपदं भवति। गेह उत्तिष्ठते। कुटुम्ब उत्तिष्ठते। तदर्थं यतत इत्यर्थः॥ उद ईहायामिति वक्तव्यम्॥ इह मा भूत् — अस्माद् ग्रामात् शतमुत्तिष्ठति। शतमुत्पद्यत इत्यर्थः। ईहाग्रहणमनूर्ध्वकर्मण एव विशेषणम्, नापवादः। अनूर्ध्वकर्मणीति किम्? आसनादुत्तिष्ठति॥
  vartika:
  - ईहायामिति वक्तव्यम् ।
  rule: After उत्, स्था takes **आत्मनेपद** when it does not mean rising up.
- id: '13025'
  ref: 1.3.25
  a: 1
  p: 3
  n: 25
  s: उपान्मन्त्रकरणे
  iast: upānmantrakaraṇe
  type: V
  typeName: vidhi
  pada:
  - उपात्
  - मन्त्रकरणे
  adhikara: ''
  inherits:
  - word: आत्मनेपदम्
    from: 1.3.12
  - word: स्थः
    from: 1.3.22
  feeds:
  - word: उपात्
    to: 1.3.26
  meaning: |
    When the उपसर्ग 'उप' is attached to the verb 'स्था', it gets the प्रत्ययाः of आत्मनेपद ; provided the meaning is 'to approach using the मन्त्रs'.
  kashika: |-
    उपपूर्वात् तिष्ठतेर्मन्त्रकरणेऽर्थे वर्तमानादात्मनेपदं भवति। ऐन्द्र्या गार्हपत्यमुपतिष्ठते। आग्नेय्याग्नीध्रमुपतिष्ठते। मन्त्रकरण इति किम्? भर्तारमुपतिष्ठति यौवनेन॥ उपाद् देवपूजासंगतिकरणमित्रकरणपथिष्विति वाच्यम्॥ देवपूजायाम् — आदित्यमुपतिष्ठते। संगतिकरणे — रथिकानुपतिष्ठते। मित्रकरणे — महामात्रानुपतिष्ठते। मित्रकरणसंगतिकरणयोः को विशेषः? संगतिकरणमुपश्लेषः,तद्यथा — गङ्गा यमुनामुपतिष्ठते। मित्रकरणं तु विनाप्युपश्लेषेण मैत्रीसंबन्धः। पथि — अयं पन्थाः स्रुघ्नमुपतिष्ठते॥ वा लिप्सायामिति वक्तव्यम्॥ भिक्षुको ब्राह्मणकुलमुपतिष्ठते, उपतिष्ठतीति वा॥
  vartika:
  - उपाद्देवपूजासंगतिकरणमित्रकरणपथिष्विति वक्तव्यम् ।
  - वा लिप्सायामिति वक्तव्यम् ।
  rule: After उप, स्था takes **आत्मनेपद** when it means worship with hymns.
