  typeName: vidhi
  pada:
  - परि-वि-अवेभ्यः
  - क्रियः
  adhikara: ''
  inherits:
  - word: आत्मनेपदम्
    from: 1.3.12
  feeds: []
  meaning: |
    When any of the उपसर्गs - परि, वि, अव - is attached to the verb 'क्री', it gets the प्रत्ययाः of आत्मनेपद.
  kashika: |-
    <<डुक्रीञ् द्रव्यविनिमये>> ञित्त्वात् कर्त्रभिप्राये क्रियाफले सिद्धमात्मनेपदम्, अकर्त्रभिप्रायार्थोऽयमारम्भः। परिव्यवेभ्य उत्तरस्मात् क्रीणातेरात्मनेपदं भवति। परिक्रीणीते। विक्रीणीते। अवक्रीणीते। पर्यादय उपसर्गा गृह्यन्ते। तेनेह न भवति — बहुवि क्रीणाति वनम्॥
  vartika: []
  rule: |-
    After परि, वि, or अव, क्री takes **आत्मनेपद** — even when the fruit of the action does not go to the agent.
- id: '13019'
