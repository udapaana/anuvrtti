    <<गॄ निगरणे>> इति तुदादौ पठ्यते, तस्येदं ग्रहणम्, न तु <<गॄ शब्दे>> इति क्र्यादिपठितस्य। तस्य ह्यवपूर्वस्य प्रयोग एव नास्ति। <<शेषात्०>> [[१.३.७८]] इति परस्मैपदे प्राप्ते, अवपूर्वाद् गिरतेरात्मनेपदं भवति। अवगिरते, अवगिरेते, अवगिरन्ते। अवादिति किम्? गिरति॥
  vartika: []
  rule: After **गॄ** (to swallow) with **अव**, use **आत्मनेपद**.
