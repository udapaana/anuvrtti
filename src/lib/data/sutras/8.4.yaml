  meaning: ''
  kashika: |-
    उदात्तादुत्तरस्यानुदात्तस्य स्वरितादेशो भवति। गार्ग्यः॑। वात्स्यः॑। पच॑ति पठ॑ति। अस्य स्वरितस्यासिद्धत्वाद्  <<अनुदात्तं पदमेकवर्जम्>> [[६.१.१५८]] इत्येतद् न प्रवर्तते। तेनोदात्तस्वरितावुभावपि श्रूयेते॥
  vartika: []
