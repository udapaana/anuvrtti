    न् of a **कृत्** affix (preceded by a vowel) added after a root that begins with a consonant and has an **इच्** vowel (इ, उ, ऋ, ऌ, ए, ओ, ऐ, औ) as its penult optionally becomes ण् when an **उपसर्ग** holds the trigger: प्रकोपणम्/प्रकोपनम्.
