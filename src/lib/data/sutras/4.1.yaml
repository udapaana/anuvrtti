  pada:
  - जानपद-कुण्ड-गोण-स्थल-भाज-नाग-काल-नील-कुश-कामुक-कबरात्
  - |-
    वृत्ति-अमत्र-अवपन-अकृत्रिम-अश्राणा-अस्थौल्य-वर्ण-अनाच्छादन-अयोविकार-मैथुनेच्छा-केशवेशेषु
  adhikara: प्रत्ययः
