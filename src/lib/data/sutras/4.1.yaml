    संहित शफ लक्षण वाम इत्येवमादेः प्रातिपदिकादूरूत्तरपदात् स्त्रियामूङ् प्रत्ययो भवति। अनौपम्यार्थ आरम्भः। संहितोरूः। शफोरूः। लक्षणोरूः। वामोरूः॥ सहितसहाभ्यां चेति वक्तव्यम्॥ सहितोरूः। सहोरूः॥
  vartika:
