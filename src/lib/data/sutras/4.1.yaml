  meaning: "To indicate the meaning of 'his/her offspring', the word कन्या gets the 'अण्' प्रत्यय and\
    \ it also gets 'कानीन' as आदेश. "
  kashika: |-
    कन्याशब्दादपत्येऽण् प्रत्ययो भवति। ढकोऽपवादः। तत्सन्नियोगेन कनीनशब्द आदेशो भवति। कन्याया अपत्यं कानीनः कर्णः। कानीनो व्यासः॥
  vartika: []
  rule: |-
    For a descendant, the **प्रत्यय** is **अण्** after कन्या, and कन्या becomes कनीन before it.
