  kashika: |-
    युवन्शब्दात् प्रातिपदिकात् स्त्रियां तिः प्रत्ययो भवति, स च तद्धितसंज्ञो भवति। ङीपोऽपवादः। युवतिः॥
  vartika: []
  rule: After युवन्, the feminine is ति, and this ति is a **तद्धित**.
