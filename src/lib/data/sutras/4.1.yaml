  - वत्स-भरद्वाज-अत्रिषु
  adhikara: प्रत्ययः
  inherits:
  - word: तस्य
    from: 4.1.92
  - word: अपत्यम्
    from: 4.1.92
  - word: अण्
    from: 4.1.112
  feeds: []
  meaning: "To indicate the meaning of 'his/her offspring' - \n1) The word विकर्ण when refers to the वत्सकुल,\n\
    2) The word शुङ्ग when refers to the भरद्वाजकुल, and \n3) The word छगल when refers to the अत्रिकुल\n\
    get the अण् प्रत्यय.\n"
  kashika: |-
    विकर्णशुङ्गच्छगलशब्देभ्यो यथासंख्यं वत्सभरद्वाजात्रिष्वपत्यविशेषेष्वण् प्रत्ययो भवति। वैकर्णो भवति वात्स्यश्चेत्। वैकर्णिरन्यः। शौङ्गो भवति भारद्वाजश्चेत्। शौङ्गिरन्यः। छागलो भवत्यात्रेयश्चेत्। छागलिरन्यः। शुङ्गाशब्दं स्त्रीलिङ्गमन्ये पठन्ति, ततो ढकं प्रत्युदाहरिन्त शौङ्गेय इति। द्वयमपि चैतत् प्रमाणमुभयथा सूत्रप्रणयनात्॥
  vartika: []
  rule: |-
    For a descendant, the **प्रत्यय** is **अण्** after विकर्ण, शुङ्ग, and छगल when a descendant of वत्स, भारद्वाज, and अत्रि respectively is meant.
