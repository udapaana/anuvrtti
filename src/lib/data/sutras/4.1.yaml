  iast: avṛddhābhyo nadīmānuṣībhyastannāmikābhyaḥ
  type: V
  typeName: vidhi
  pada:
  - अ-वृद्धाभ्यः
  - नदी-मानुषीभ्यः
  - तत्-नामिकाभ्यः
  adhikara: प्रत्ययः
  inherits:
  - word: तस्य
    from: 4.1.92
