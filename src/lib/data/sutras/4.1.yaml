  vartika:
  - वनो न हश इति वक्तव्यम् ।
  - बहुलं छन्दसि ।
  - बहुव्रीहौ वा ।
  rule: |-
    After a **प्रातिपदिक** ending in वन्, the feminine takes **ङीप्** (ई), and र् replaces the final न्.
- id: '41008'
  ref: 4.1.8
  a: 4
  p: 1
  n: 8
  s: पादोऽन्यतरस्याम्
  iast: pādo'nyatarasyām
  type: V
  typeName: vidhi
  pada:
  - पादः
  - अन्यतरस्याम्
  adhikara: प्रत्ययः
  inherits:
  - word: ङीप्
    from: 4.1.5
  feeds:
  - word: पादः
    to: 4.1.9
  meaning: ''
  kashika: |-
    पाद इति कृतसमासान्तः पादशब्दो निर्दिश्यते। पादन्तात् प्रातिपदिकादन्यतरस्यां स्त्रियां ङीप् प्रत्ययो भवति। द्विपात्। द्विपदी। त्रिपात्। त्रिपदी। चतुष्पाद्। चतुष्पदी॥
  vartika: []
  rule: |-
    After a **प्रातिपदिक** ending in पाद्, the feminine optionally takes **ङीप्** (ई).
- id: '41009'
  ref: 4.1.9
  a: 4
  p: 1
  n: 9
  s: टाबृचि
  iast: ṭābṛci
  type: V
  typeName: vidhi
  pada:
  - टाप्
  - ऋचि
  adhikara: प्रत्ययः
  inherits:
  - word: ङीप्
    from: 4.1.5
  - word: पादः
    from: 4.1.8
  feeds:
  - word: टाप्
    to: 4.1.10
  meaning: ''
  kashika: |-
    पाद इत्येव। ऋचीत्यभिधेयनिर्देशः। ऋचि वाच्यायां पादन्तात् प्रातिपदिकात् स्त्रियां टाप् प्रत्ययो भवति। ङीपोऽपवादः। द्विपदा ऋक्। त्रिपदा ऋक्। चतुष्पदा ऋक्। ऋचीति किम्? द्विपदी देवदत्ता॥
  vartika: []
  rule: |-
    When the word means a verse of the ऋग्वेद, a **प्रातिपदिक** ending in पाद् takes **टाप्** (आ) in the feminine instead.
- id: '41010'
  ref: 4.1.10
  a: 4
  p: 1
  n: 10
  s: न षट्स्वस्रादिभ्यः
  iast: na ṣaṭsvasrādibhyaḥ
  type: V
  typeName: vidhi
  pada:
  - न
  - षट्-स्वसृ-आदिभ्यः
  adhikara: प्रत्ययः
  inherits:
  - word: ङीप्
    from: 4.1.5
  - word: टाप्
    from: 4.1.9
  feeds:
  - word: न
    to: 4.1.11
  - word: न
    to: 4.1.12
  meaning: |-
    The words that get the term 'षट्', and the words स्वसृ, तिसृ, चतसृ, ननान्दृ, दुहितृ, यातृ, मातृ do not get the   ङीप्-प्रत्यय to indicate the feminine property.
  kashika: |-
    षट्संज्ञकेभ्यः स्वस्रादिभ्यश्च प्रातिपदिकेभ्यः स्त्रीप्रत्ययो न भवति। यो यतः प्राप्नोति स सर्वः प्रतिषिध्यते। पञ्च ब्राह्मण्यः। सप्त। नव। दश। स्वस्रादिभ्यः — स्वसा। दुहिता। ननान्दा। याता। माता। तिस्रः। चतस्रः।

    षट्संज्ञानामन्ते लुप्ते टाबुत्पत्तिः कस्मान्न स्यात्।

    प्रत्याहाराच्चापा सिद्धं दोषस्त्वित्त्वे तस्मान्नोभौ॥
  vartika: []
  rule: |-
    After a **षट्** stem and after स्वसृ and the words listed with it, no feminine affix is added.
- id: '41011'
  ref: 4.1.11
  a: 4
  p: 1
  n: 11
  s: मनः
  iast: manaḥ
  type: V
  typeName: vidhi
