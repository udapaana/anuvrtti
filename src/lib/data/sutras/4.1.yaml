  - सम्भस्त्राजिनशणपिण्डेभ्यः फलात् ।
  - मूलान्नञः ।
  - श्वेताच्च ।
  rule: |-
    After a **जाति** word ending in पाक, कर्ण, पर्ण, पुष्प, फल, मूल, or वाल, the feminine is also **ङीष्**.
- id: '41065'
