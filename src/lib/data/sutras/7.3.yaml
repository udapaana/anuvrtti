  s: शमामष्टानां दीर्घः श्यनि
  iast: śamāmaṣṭānāṃ dīrghaḥ śyani
  type: V
  typeName: vidhi
  pada:
  - शमाम्
  - अष्टानाम्
  - दीर्घः
  - श्यनि
  adhikara: अङ्गस्य
  inherits: []
  feeds:
  - word: दीर्घः
    to: 7.3.75
  - word: दीर्घः
    to: 7.3.76
  meaning: ''
  kashika: |-
    शमादीनामष्टानां दीर्घो भवति श्यनि परतः। शम् — शाम्यति। तम् — ताम्यति। दम् — दाम्यति। श्रम् — श्राम्यति। भ्रम् — भ्राम्यति। क्षम् — क्षाम्यति। क्लम् — क्लाम्यति। मदी — माद्यति। अष्टानामिति किम्?। अस्यति। श्यनीति किम्? भ्रमति। <<वा भ्राश०>> [[३.१.७०]] इति श्यनो विकल्पः। बभ्राम॥
  vartika: []
  rule: |-
    शम् and the seven roots after it (तम्, दम्, श्रम्, भ्रम्, क्षम्, क्लम्, मद्) lengthen their vowel before **श्यन्**.
