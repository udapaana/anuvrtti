  meaning: "The word अदस् gets an 'औ' आदेशः when followed by the सुँ-प्रत्यय, and the सुँ-प्रत्यय is removed. "
  kashika: "अदसः सौ परतः सकारस्य औकारादेशो भवति, सोश्च लोपो भवति। असौ॥ औत्वप्रतिषेधः साकच्काद् वा वक्तव्यः\
    \ सादुत्वं च॥ यदा चौत्वप्रतिषेधः तदा सकारादुत्तरस्योत्वं भवति। असुकः। असकौ॥ उत्तरपदभूतानां त्यदादीनामकृतसन्धीनामादेशा\
    \ वक्तव्याः॥ परमाहम्। परमायम्। परमानेन। \n\nअदसः सोर्भवेदौत्वं किं सुलोपो विधीयते।\n\nह्रस्वाल्लुप्येत\
    \ संबुद्धिर्न हलः प्रकृतं हि तत् ॥ १॥\n\nआप एत्वं भवेत्तस्मिन्न झलीत्यनुवर्तनात्।\n\nप्रत्ययस्थाच्च\
    \ कादित्वं शीभावश्च प्रसज्यते॥ २॥"
  vartika:
  - अदस औत्वप्रतिषेधः साकच्कस्य वा वक्तव्यः सादुत्वं च ।
  rule: औ replaces the स् of अदस् before सु, and सु drops.
