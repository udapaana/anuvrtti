  - word: न
    from: 7.2.8
  - word: इट्
    from: 7.2.8
  - word: एकाचः
    from: 7.2.10
  feeds:
  - word: श्र्युकः
    to: 7.2.12
  meaning: ''
  kashika: "श्रि इत्येतस्योगन्तानां च किति प्रत्यये परत इडागमो न भवति। श्रित्वा। श्रितः। श्रितवान्। उगन्तानां\
    \ च — युत्वा। युतः। युतवान्। लूत्वा। लूनः। लूनवान्। वृत्वा। वृतः। वृतवान्। तीर्त्वा। तीर्णः। तीर्णवान्।\
    \ श्र्युक इति किम्? विदितः। कितीति किम्? श्रयिता। श्रयितुम्। श्रयितव्यम्। केचिदत्र द्विककारनिर्देशेन\
    \ गकारप्रश्लेषं वर्णयन्ति, भूष्णुरित्येवं यथा स्यात्। सौत्रत्वात् च निर्देशस्य श्र्युकः कितीत्यत्र\
    \ चर्त्वस्यासिद्धत्वमनाश्रित्य रोरुत्वं न कृतं विसर्जनीयश्च कृत इति। <<ग्लाजिस्थश्च क्स्नुः>> [[३.२.१३९]]\
    \ इत्यत्र स्था आ इत्याकारप्रश्लेषेण स्थास्नोः सिद्धत्वाद् न किंचिदेतत्। उपदेश इत्येव — तीर्ण इत्यत्रापि\
    \ यथा स्यात्। इत्वे हि कृते रपरत्वे च न स्यात्। मा भूदेवम्। <<इट् सनि वा>>[[७.२.४१]] इति विकल्पे विहिते\
    \ <<यस्य विभाषा>> [[७.२.१५]] इति निष्ठायां प्रतिषेधो भविष्यति। कस्य पुनः सा विभाषा? ॠतः। यद्येवमित्वे\
    \ हि कृते नायमृकारान्तो भविष्यति। स्थानिवद्भावाद् भविष्यति। अनल्विधौ [[१.१.५६]] स्थानिवद्भावः, अल्विधिश्चायम्।\
    \ तस्मादनुवर्तयितव्यमुपदेश इति। तथा च सति जागरितः, जागरितवानित्यत्रापि प्राप्नोति, तदर्थमेकाच इत्यनुवर्तयितव्यम्।\
    \ ऊर्णोतेस्तु — \n\nवाच्य ऊर्णोर्णुवद्भावो यङ्प्रसिद्धिः प्रयोजनम्।\n\nआमश्च प्रतिषेधार्थमेकाचश्चेडुपग्रहात्॥\n\
    \nप्रोर्णुतः। प्रोर्णुतवान्॥"
  vartika: []
  rule: |-
    A **कित्** affix takes no **इट्** after श्रि, or after a root ending in **उक्** (उ, ऊ, ऋ, ॠ) in the **धातुपाठ**.
