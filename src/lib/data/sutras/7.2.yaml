  s: |-
    ग्रसितस्कभितस्तभितोत्तभितचत्तविकस्ताविशस्तृशंस्तृशास्तृतरुतृतरूतृवरुतृवरूतृवरूत्रीरुज्ज्वलितिक्षरितिक्षमितिवमित्यमितीति च
  iast: |-
    grasitaskabhitastabhitottabhitacattavikastāviśastṛśaṃstṛśāstṛtarutṛtarūtṛvarutṛvarūtṛvarūtrīrujjvalitikṣaritikṣamitivamityamitīti ca
  type: V
  typeName: vidhi
  pada:
  - |-
    ग्रसित-स्कभित-स्तभित-उत्तभित-चत्त-विकस्ता-विशस्तॄ-शंस्तृ-शास्तृ-तरुतृ-तरूतृ-वरुतृ-वरूतृ-वरूत्रीः-उज्ज्वलिति-क्षरिति-क्षमिति-वमिति-अमिति
  - इति
