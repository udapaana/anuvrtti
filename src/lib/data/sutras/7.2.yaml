    तकारादौ हकारादौ च विभक्तौ परतः किमित्येतस्य कु इत्ययमादेशो भवति। कुतः। कुत्र। कुह। तिहोरितीकार उच्चारणार्थः॥
  vartika: []
  rule: कु replaces किम् before a **विभक्ति** beginning with त or ह.
