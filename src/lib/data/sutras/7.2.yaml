    to: 7.2.104
  - word: किमः
    to: 7.2.105
  meaning: The word किम् is converted to 'क' in presence of a विभक्ति प्रत्यय.
  kashika: |-
    किम् इत्येतस्य क इत्ययमादेशो भवति विभक्तौ परतः। कः,कौ, के। साकच्कस्याप्ययमादेशो भवति, तेनाकार एव किमो न विधीयते — किमोऽदिति॥
  vartika: []
  rule: |-
    क replaces किम् before a **विभक्ति**. (The replacement is the whole क, not just अ, so it holds even with the **अकच्** augment.)
