  kashika: |-
    ऊर्णोतेरिडादौ सिचि परस्मैपदपरे परतो विभाषा वृद्धिर्न भवति। प्रौर्णवीत्, प्रौर्णावीत्। <<विभाषोर्णोः>>[[१.२.३]] इत्यङित्त्वपक्षे वृद्धिविकल्पोऽयम्। ङित्त्वपक्षे तु गुणवृद्ध्योरभाव उवङ् भवति। प्रौर्णुवीत्॥
