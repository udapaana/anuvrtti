  kashika: |-
    त्यदादीनां तकारदकारयोरनन्त्ययोः सकारादेशो भवति सौ परतः। त्यद् — स्यः। तद् — सः। एतद् — एषः। अदस् — असौ। अनन्त्ययोरिति किम्? हे स। सा॥
  vartika: []
  rule: |-
    स् replaces the non-final त् or द् of त्यद्, तद्, एतद्, अदस् before the nominative singular सु.
- id: '72107'
  ref: 7.2.107
  a: 7
  p: 2
