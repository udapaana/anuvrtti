  - word: अस्तातिः
    from: 5.3.27
  feeds:
  - word: अतसुच्
    to: 5.3.29
  meaning: ''
  kashika: |-
    दक्षिणोत्तराभ्यां दिग्देशकालेषु वर्तमानाभ्यां सप्तमीपञ्चमीप्रथमान्ताभ्यां स्वार्थेऽतसुच् प्रत्ययो भवति। अस्तातेरपवादः। दक्षिणाशब्दः काले न संभवतीति दिग्देशवृत्तिः परिगृह्यते। दक्षिणतो वसति। दक्षिणत आगतः। दक्षिणतो रमणीयम्। उत्तरतो वसति। उत्तरत आगतः। उत्तरतो रमणीयम्। अकारो विशेषणार्थः <<षष्ठ्यतसर्थप्रत्ययेन>> [[२.३.३०]] इति॥
  vartika: []
  rule: |-
    After दक्षिण and उत्तर in the locative, ablative, or nominative, naming a direction, place, or time, the **प्रत्यय** अतसुच् (अतस्) is added: दक्षिणतः, उत्तरतः. This blocks अस्ताति. (दक्षिणा never names a time, so for it only direction and place apply.)
- id: '53029'
