  meaning: ''
  kashika: |-
    संख्याया इत्येव। अधिकरणं द्रव्यम्, तस्य विचालः संख्यान्तरापादनम्। एकस्यानेकीकरणमनेकस्य वैकीकरणम्। अधिकरणविचाले गम्यमाने संख्यायाः स्वार्थे धा प्रत्ययो भवति। एकं राशिं पञ्चधा कुरु। अष्टधा कुरु। अनेकमेकधा कुरु॥
  vartika: []
  rule: |-
    After a number the **प्रत्यय** धा is also added when the sense is a change in how a substance is apportioned — making one into many or many into one: एकं राशिं पञ्चधा कुरु, अनेकमेकधा कुरु. (अधिकरण is the substance, विचाल the change in number.)
