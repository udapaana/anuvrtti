    विनो मतुपश्च लुग् भवत्यजाद्योः प्रत्यययोः परतः। इदमेव वचनं ज्ञापकमजादिसद्भावस्य। सर्व इमे स्रग्विणः, अयमेषामतिशयेन स्रग्वी स्रजिष्ठः। उभाविमौ स्रग्विणौ, अयमनयोरतिशयेन स्रग्वी स्रजीयान्। अयमस्मात् स्रजीयान्। सर्व इमे त्वग्वन्तः, अयमेषामतिशयेन त्वग्वान् त्वचिष्ठः। उभाविमौ त्वग्वन्तौ, अयमनयोरतिशयेन त्वग्वान् त्वचीयान्। अयमस्मात् त्वचीयान्॥
  vartika: []
  rule: |-
    Before **इष्ठन्** and **ईयसुन्**, the affixes **विन्** and **मतुप्** are **लुक्**-dropped: **स्रजिष्ठ**, **स्रजीयस्** (from **स्रग्विन्**); **त्वचिष्ठ**, **त्वचीयस्** (from **त्वग्वत्**).
- id: '53066'
  ref: 5.3.66
  a: 5
  p: 3
  n: 66
  s: प्रशंसायां रूपप्
  iast: praśaṃsāyāṃ rūpap
  type: V
  typeName: vidhi
  pada:
  - प्रशंसायाम्
  - रूपप्
  adhikara: प्रत्ययः
  inherits:
  - word: तिङः
    from: 5.3.56
  feeds: []
  meaning: ''
  kashika: |-
    प्रशंसा स्तुतिः। प्रकृत्यर्थस्य विशेषणं चैतत्। प्रशंसाविशिष्टेऽर्थे वर्तमानात् प्रातिपदिकात् स्वार्थे रूपप् प्रत्ययो भवति। स्वार्थिकाश्च प्रत्ययाः प्रकृत्यर्थविशेषस्य द्योतका भवन्ति। प्रशस्तो वैयाकरणो वैयाकरणरूपः। याज्ञिकरूपः। प्रकृत्यर्थस्य वैशिष्ट्ये प्रशंसा भवति। वृषलरूपोऽयम्, यः पलाण्डुना सुरां पिबति। चोररूपः, दस्युरूपः, योऽक्ष्णोरप्यञ्जनं हरेत्। <<तिङश्च>> [[५.३.५६]] इत्यनुवर्तते। पचतिरूपम् पचतोरूपम्, पचन्तिरूपम्। क्रियाप्रधानमाख्यातम्। एका च क्रियेति रूपप्प्रत्ययान्ताद् द्विवचनबहुवचने न भवतः। नपुंसकलिङ्गं तु भवति, लोकाश्रयत्वाल्लिङ्गस्य॥
  vartika: []
  rule: |-
    **रूपप्** follows a **प्रातिपदिक** or finite verb in its own sense when praise is meant: **वैयाकरणरूप** 'a celebrated grammarian', **चोररूप** 'a notorious thief'.
- id: '53067'
  ref: 5.3.67
  a: 5
  p: 3
  n: 67
  s: ईषदसमाप्तौ कल्पब्देश्यदेशीयरः
  iast: īṣadasamāptau kalpabdeśyadeśīyaraḥ
  type: V
  typeName: vidhi
  pada:
  - ईषद्-असमाप्तौ
  - कल्पप्-देश्य-देशीयरः
  adhikara: प्रत्ययः
  inherits:
  - word: तिङः
    from: 5.3.56
  feeds:
  - word: ईषद्-असमाप्तौ
    to: 5.3.68
  meaning: ''
  kashika: |-
    संपूर्णता पदार्थानां समाप्तिः। स्तोकेनासंपूर्णता ईषदसमाप्तिः। प्रकृत्यर्थविशेषणं चैतत्। ईषदसमाप्तिविशिष्टेऽर्थे वर्तमानात् प्रातिपदिकात् कल्पब् देश्य देशीयर् इत्येते प्रत्यया भवन्ति। ईषदसमाप्तः पटुः पटुकल्पः। पटुदेश्यः। पटुदेशीयः। मृदुकल्पः। मृदुदेश्यः। मृदुदेशीयः। तिङश्चेत्येव — पचतिकल्पम्। जल्पतिकल्पम्॥
  vartika: []
  rule: |-
    **कल्पप्** (कल्प), **देश्य**, and **देशीयर्** (देशीय) follow a **प्रातिपदिक** or finite verb that means slight incompleteness: **पटुकल्प**, **पटुदेश्य**, **पटुदेशीय** 'almost clever', **पचतिकल्पम्**.
- id: '53068'
  ref: 5.3.68
  a: 5
  p: 3
  n: 68
  s: विभाषा सुपो बहुच् पुरस्तात्तु
  iast: vibhāṣā supo bahuc purastāttu
  type: V
  typeName: vidhi
  pada:
  - विभाषा
  - सुपः
  - बहुच्
  - पुरस्तात्
  - तु
  adhikara: प्रत्ययः
  inherits:
  - word: तिङः
    from: 5.3.56
  - word: ईषद्-असमाप्तौ
    from: 5.3.67
  feeds:
  - word: सुपः
    to: 5.3.69
  meaning: ''
  kashika: |-
    ईषदसमाप्तिविशिष्टेऽर्थे वर्तमानात् सुबन्ताद् विभाषा बहुच् प्रत्ययो भवति, स तु पुरस्तादेव भवति न परतः। चित्करणमन्तोदात्तार्थम्। ईषदसमाप्तः पटुः बहुपटुः। बहुमृदुः। बहुगुडो द्राक्षा। विभाषावचनात् कल्पबादयोऽपि भवन्ति। सुब्ग्रहणं तिङन्ताद् मा भूदिति॥
  vartika: []
  rule: |-
    For slight incompleteness, **बहुच्** (बहु) optionally follows a declined noun — but it stands before the word, not after: **बहुपटु** 'tolerably skillful', **बहुमृदु**. (By 'optionally', **कल्प** etc. also apply.)
- id: '53069'
  ref: 5.3.69
  a: 5
  p: 3
  n: 69
  s: प्रकारवचने जातीयर्
  iast: prakāravacane jātīyar
  type: V
  typeName: vidhi
  pada:
  - प्रकारवचने
  - जातीयर्
  adhikara: प्रत्ययः
  inherits:
  - word: तिङः
    from: 5.3.56
  - word: सुपः
    from: 5.3.68
  feeds: []
  meaning: ''
  kashika: |-
    सामान्यस्य भेदको विशेषः प्रकारः, तस्य वचने। प्रकृत्यर्थविशेषणं चैतत्। सुबन्तात् प्रकारविशिष्टेऽर्थे वर्तमानात् प्रातिपदिकात् स्वार्थे जातीयर् प्रत्ययो भवति। प्रकारवति चायं प्रत्ययः। थाल् पुनः प्रकारमात्र एव भवति। पटुप्रकारः पटुजातीयः। मृदुजातीयः। दर्शनीयजातीयः॥
  vartika: []
  rule: |-
    **जातीयर्** (जातीय) follows a declined noun that expresses a kind or sort (**प्रकार**): **पटुजातीय** 'of the clever sort', **मृदुजातीय**.
- id: '53070'
  ref: 5.3.70
  a: 5
  p: 3
  n: 70
  s: प्रागिवात्कः
  iast: prāgivātkaḥ
  type: AD
  typeName: adhikāra
  pada:
  - प्राक्
  - इवात्
  - कः
  adhikara: प्रत्ययः
  inherits:
  - word: तिङः
    from: 5.3.56
  feeds: []
  meaning: ''
  kashika: |-
    <<इवे प्रतिकृतौ>> [[५.३.९६]] इति वक्ष्यति। प्रागेतस्मादिवसंशब्दनाद् यानित ऊर्ध्वमनुक्रमिष्यामः, कप्रत्ययस्तेष्वधिकृतो वेदितव्यः। वक्ष्यति — <<अज्ञाते>> [[५.३.७३]] इति। अश्वकः। गर्दभकः। तिङन्तादयं प्रत्ययो नेष्यते, अकजिष्यते। <<तिङश्च>> [[५.३.५६]] इत्यनुवृत्तमुत्तरसूत्रेणैव संबन्धनीयम्॥
  vartika: []
  rule: The affix **क** governs every rule from here down to **इवे प्रतिकृतौ** (5.3.96).
- id: '53071'
  ref: 5.3.71
  a: 5
  p: 3
  n: 71
  s: अव्ययसर्वनाम्नामकच् प्राक् टेः
  iast: avyayasarvanāmnāmakac prāk ṭeḥ
  type: V
  typeName: vidhi
  pada:
  - अव्ययसर्वनाम्नाम्
  - अकच्
  - प्राक्
  - टेः
  adhikara: प्रत्ययः
  inherits:
  - word: तिङः
    from: 5.3.56
  feeds:
  - word: अकच्
    to: 5.3.72
  meaning: |+
    For an अव्यय, a सर्वनामशब्द and  a तिङ्गन्त word the प्रत्यय 'अकच्' comes just before the 'टि'संज्ञक component of that word under  all the प्राग्-इवीय meanings.

  kashika: |-
    <<तिङश्च>> [[५.३.५६]] इत्येव। अव्ययानां सर्वनाम्नां च प्रागिवीयेष्वर्थेष्वकच् प्रत्ययो भवति, स च प्राक् टेः, न परतः। कस्यापवादः। उच्चकैः। नीचकैः। शनकैः। सर्वनाम्नः खल्वपि — सर्वके। विश्वके। उभयके। प्रातिपदिकात् सुप इति द्वयमपीहानुवर्तते। तत्राभिधानतो व्यवस्था भवति। क्वचित् प्रातिपदिकस्य प्राक् टेः प्रत्ययो भवति, क्वचित् सुबन्तस्य। युष्मकाभिः, अस्मकाभिः, युष्मकासु, अस्मकासु, युवकयोः, आवकयोरित्यत्र प्रातिपदिकस्य। त्वयका, मयका, त्वयकि, मयकीत्यत्र सुबन्तस्य॥ अकच्प्रकरणे तूष्णीमः काम् प्रत्ययो वक्तव्यः॥ स च मित्त्वादन्त्यादचः परो भवति। तूष्णीकामास्ते। तूष्णीकांतिष्ठति॥ शीले को मलोपश्च वक्तव्यः॥ तूष्णींशीलः, तूष्णीकः। <<तिङश्च>> [[५.३.५६]] इति प्रकृतमत्र संबध्यते। पचतकि। जल्पतकि॥
  vartika: []
  rule: |-
    **अकच्** (अक्) is inserted into an **अव्यय** or a **सर्वनाम** before its last vowel, in the senses of the **क**-section: **उच्चकैः**, **नीचकैः**, **सर्वके**, **विश्वके**. It blocks **क**.
- id: '53072'
  ref: 5.3.72
  a: 5
  p: 3
  n: 72
  s: कस्य च दः
  iast: kasya ca daḥ
  type: V
  typeName: vidhi
  pada:
  - कस्य
  - च
  - दः
  adhikara: प्रत्ययः
  inherits:
  - word: अकच्
    from: 5.3.71
  feeds: []
  meaning: ''
  kashika: |-
    ककारान्तस्य प्रातिपदिकस्याकच्सन्नियोगेन दकारादेशो भवति। चकारः सन्नियोगार्थः। सामर्थ्याच्चाव्ययग्रहणमनुवर्तते, न सर्वनामग्रहणम्, ककारान्तस्य सर्वनाम्नोऽसंभवात्। धिक् — धकित्। हिरुक् — हिरकुत्। पृथक् — पृथकत्॥
  vartika:
  - ओकारसकारभकारादौ सुपि सर्वनाम्नष्टे प्रागकच् ।
  - अकच्प्रकरणे तूष्णीमः काम् ।
  - शीले को मलोपश्च ।
  rule: |-
    **द** replaces the final क् of an **अव्यय** when **अकच्** is inserted: **धकित्** (from धिक्), **हिरकुत्** (from हिरुक्), **पृथकत्** (from पृथक्).
- id: '53073'
  ref: 5.3.73
  a: 5
  p: 3
  n: 73
  s: अज्ञाते
  iast: ajñāte
  type: V
  typeName: vidhi
  pada:
  - अज्ञाते
  adhikara: प्रत्ययः
  inherits: []
  feeds: []
  meaning: ''
  kashika: |-
    अज्ञातविशेषोऽज्ञातः। अज्ञातत्वोपाधिकेऽर्थे वर्तमानात् प्रातिपदिकात् तिङन्तात् च स्वार्थे यथाविहितं प्रत्ययो भवति। स्वेन रूपेण ज्ञाते पदार्थे विशेषरूपेणाज्ञाते प्रत्ययविधानमेतत्। कस्यायमश्व इति स्वस्वामिसंबन्धेनाज्ञातेऽश्वे प्रत्ययः, अश्वकः। गर्दभकः। उष्ट्रकः। एवमन्यत्रापि यथायोगमज्ञातता विज्ञेया। उच्चकैः। नीचकैः। सर्वके। विश्वके। पचतकि। जल्पतकि॥
  vartika: []
  rule: |-
    **क** and **अकच्** follow a noun or verb when the thing spoken of is unknown — unknown in its relation, not in itself: **अश्वक** 'whose horse?', **सर्वके**, **पचतकि**.
- id: '53074'
  ref: 5.3.74
  a: 5
  p: 3
  n: 74
  s: कुत्सिते
  iast: kutsite
  type: V
  typeName: vidhi
  pada:
  - कुत्सिते
  adhikara: प्रत्ययः
  inherits: []
  feeds:
  - word: कुत्सिते
    to: 5.3.75
  meaning: ''
  kashika: |-
    कुत्सितो गर्हितो निन्दितः। प्रकृत्यर्थविशेषणं चैतत्। कुत्सितत्वोपाधिकेऽर्थे वर्तमानात् प्रातिपदिकात् स्वार्थे यथाविहितं प्रत्ययो भवति। कुत्सितोऽश्वः अश्वकः। उष्ट्रकः। गर्दभकः। उच्चकैः। नीचकैः। सर्वके। विश्वके पचतकि। जल्पतकि॥
  vartika: []
  rule: |-
    **क** and **अकच्** follow when the thing is spoken of as contemptible: **अश्वक** 'a sorry horse', **पचतकि** 'cooks wretchedly'.
- id: '53075'
  ref: 5.3.75
  a: 5
  p: 3
  n: 75
  s: संज्ञायां कन्
  iast: saṃjñāyāṃ kan
