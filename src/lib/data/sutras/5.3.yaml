  a: 5
  p: 3
  n: 116
  s: दामन्यादित्रिगर्तषष्ठाच्छः
  iast: dāmanyāditrigartaṣaṣṭhācchaḥ
  type: V
  typeName: vidhi
  pada:
  - दामन्यादि-त्रिगर्तषष्ठात्
  - छः
  adhikara: प्रत्ययः
  inherits:
  - word: आयुधजीविसङ्घात्
    from: 5.3.114
  feeds: []
  meaning: ''
  kashika: "आयुधजीविसंघादिति वर्तते। दामन्यादिभ्यः प्रातिपदिकेभ्यः त्रिगर्तषष्ठेभ्यश्चायुध — जीविसंघवाचिभ्यः\
    \ स्वार्थे छः प्रत्ययो भवति। येषामायुधजीविनां संघानां षडन्तर्वर्गास्तत्र च त्रिगर्तः षष्ठः। त्रिगर्तः\
    \ षष्ठो येषाम्, ते  त्रिगर्तषष्ठा इत्युच्यन्ते। तेषु चेयं स्मृतिः — \n\nआहुस्त्रिगर्तषष्ठांस्तु  \
    \    कौण्डोपरथदाण्डकी।\n\nक्रौष्टकिर्जालमानिश्च ब्राह्मगुप्तोऽथ जानकिः॥\n\nइति। दामन्यादिभ्यस्तावत्\
    \ — दामनीयः, दामनीयौ, दामनयः। औलपीयः, औलपीयौ, औलपयः। त्रिगर्तषष्ठेभ्यः खल्वपि — कौण्डोपरथीयः, कौण्डोपरथीयौ,\
    \ कौण्डोपरथाः। दाण्डकीयः, दाण्डकीयौ, दाण्डकयः। क्रौष्टकीयः। जालमानीयः। ब्राह्मगुप्तीयः। जानकीयः॥ दामनी।\
    \ औलपि। आकिदन्ती। काकरन्ति। काकदन्ति। शत्रुन्तपि। सार्वसेनि। बिन्दु। मौञ्जायन। उलभ। सावित्रीपुत्र।\
    \ दामन्यादिः॥"
  vartika: []
  rule: |-
    दामनि and the rest, and the six त्रिगर्तषष्ठ warrior-stocks, take **छ** (ईय) with no change of sense when they name a band living by arms.
- id: '53117'
