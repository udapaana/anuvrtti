  - word: अद्व्यादिभ्यः
    from: 5.3.2
  - word: इदमः
    from: 5.3.3
  feeds: []
  meaning: ''
  kashika: |-
    रेफथकारादौ प्राग्दिशीये प्रत्यये परत इदम एतेतावादेशौ भवतः। इशोऽपवादः। रेफेऽकार उच्चारणार्थः। <<इदमो र्हिल्>> [[५.३.१६]] — एतर्हि। <<इदमस्थमुः>> [[५.३.२४]] — इत्थम्॥
  vartika:
  - थाहेतौ च च्छन्दसि ।
  rule: |-
    इदम् becomes एत before a **प्राग्दिशीय** affix beginning with र, and इत before one beginning with थ — एतर्हि, इत्थम्.
