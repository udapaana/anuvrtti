  typeName: vidhi
  pada:
  - पूगात्
  - ञ्यः
  - अग्रामणीपूर्वात्
  adhikara: प्रत्ययः
  inherits: []
  feeds:
  - word: ञ्यः
    to: 5.3.113
  meaning: ''
  kashika: |-
    इवार्थ इति निवृत्तम्। नानाजातीया अनियतवृत्तयोऽर्थकामप्रधानाः संघाः पूगाः। पूगवाचिनः प्रातिपदिकादग्रामणीपूर्वात् स्वार्थ ञ्यः प्रत्ययो भवति। लौहध्वज्यः, लौहध्वज्यौ, लोहध्वजाः। शैब्यः, शैब्यौ, शिबयः। चातक्यः, चातक्यौ, चातकाः। अग्रामणीपूर्वादिति किम्? देवदत्तो ग्रामणीरेषां त इमे देवदत्तकाः। यज्ञदत्तकाः॥
  vartika: []
  rule: |-
    A word for a **पूग** (a mixed crowd of men of no fixed livelihood, banded together to make a living) takes **ञ्य** with no change of sense, unless the word begins with the band's leader's name.
- id: '53113'
