    संपूर्वस्य जानातेः कर्मणि कारके द्वितीयायां प्राप्तायामन्यतरस्यां तृतीया विभक्तिर्भवति। पित्रा संजानीते, पितरं संजानीते। मात्रा संजानीते, मातरं संजानीते॥
  vartika: []
  rule: |-
