  meaning: ''
  kashika: |-
    फलसाधनयोग्यः पदार्थो लोके हेतुरुच्यते। तद्वाचिनस्तृतीया विभक्तिर्भवति। धनेन कुलम्। कन्यया शोकः। विद्यया यशः॥
