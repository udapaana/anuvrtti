  p: 3
  n: 44
  s: प्रसितोत्सुकाभ्यां तृतीया च
  iast: prasitotsukābhyāṃ tṛtīyā ca
  type: V
  typeName: vidhi
  pada:
  - प्रसित-उत्सुकाभ्याम्
  - तृतीया
  - च
  adhikara: अनभिहिते
  inherits:
  - word: सप्तमी
    from: 2.3.36
  - word: सप्तमी
    from: 2.3.43
  feeds:
  - word: तृतीया
    to: 2.3.45
  meaning: ''
  kashika: |-
    प्रसित उत्सुक इत्येताभ्यां योगे तृतीया विभक्तिर्भवति, चकारात् सप्तमी च। प्रसितः प्रसक्तः, यस्तत्र नित्यमेवावबद्धः, स प्रसितशब्देनोच्यते। केशैः प्रसितः, केशेषु प्रसितः। केशैरुत्सुकः, केशेषूत्सुकः॥
  vartika: []
  rule: |-
    With प्रसित or उत्सुक (intent on), the object takes the **तृतीया** (3rd), and by च also the **सप्तमी** (7th): केशैः / केशेषु प्रसितः.
- id: '23045'
