    With प्रेष्य and ब्रूहि, the oblation (**हविस्**) they govern takes the **षष्ठी** (6th) when offering to a deity is meant: अग्नये छागस्य हविषो वपाया मेदसोऽनुब्रूहि / प्रेष्य.
