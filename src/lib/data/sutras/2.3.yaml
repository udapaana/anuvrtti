  meaning: ''
  kashika: |-
    गत्यर्थानां धातूनां चेष्टाक्रियाणां परिस्पन्दक्रियाणां कर्मणि कारकेऽध्ववर्जिते द्वितीयाचतुर्थ्यौ भवतः। ग्रामं गच्छति। ग्रामाय गच्छति। ग्रामं व्रजति। ग्रामाय व्रजति। गत्यर्थग्रहणं किम्? ओदनं पचति। कर्मणीति किम्? अश्वेन व्रजति। चेष्टायामिति किम्? मनसा पाटलिपुत्रं गच्छति। अनध्वनीति किम्? अध्वानं गच्छति ॥ अध्वनीत्यर्थग्रहणम्॥ पन्थानं गच्छति। मार्गं गच्छति॥ आस्थितप्रतिषेधश्चायं विज्ञेयः॥ आस्थितः संप्राप्तः, आक्रान्त उच्यते। यत्र तूत्पथेन पन्थानं गच्छति, तत्र भवितव्यमेव चतुर्थ्या — पथे गच्छतीति। द्वितीयाग्रहणं किम्,न चतुर्थ्येव विकल्प्येत?  अपवादविषयेऽपि यथा स्यात्। ग्रामं गन्ता। ग्रामाय गन्ता। कृद्योगलक्षणा षष्ठी न भवति॥
  vartika: []
  rule: |-
    With a root of motion, the goal as **कर्म** takes the 2nd or the 4th case — but only for physical motion, and not when the goal is a word for 'road'.
- id: '23013'
  ref: 2.3.13
  a: 2
  p: 3
  n: 13
  s: चतुर्थी सम्प्रदाने
  iast: caturthī sampradāne
  type: V
  typeName: vidhi
  pada:
  - चतुर्थी
  - सम्प्रदाने
  adhikara: अनभिहिते
  inherits: []
  feeds:
  - word: चतुर्थी
    to: 2.3.14
  - word: चतुर्थी
    to: 2.3.15
  - word: चतुर्थी
    to: 2.3.16
  - word: चतुर्थी
    to: 2.3.17
  meaning: ''
  kashika: |-
    संप्रदाने कारके चतुर्थी विभक्तिर्भवति। उपाध्यायाय गां ददाति। माणवकाय भिक्षां ददाति। देवदत्ताय रोचते। पुष्पेभ्यः स्पृहयतीत्यादि॥ चतुर्थीविधाने तादर्थ्य उपसंख्यानम्॥ यूपाय दारु। कुण्डलाय हिरण्यम्। रन्धनाय स्थाली। अवहननायोलूखलम्॥ क्ऌपिसंपद्यमाने चतुर्थी वक्तव्या॥ मूत्राय कल्पते यवागूः। उच्चाराय कल्पते यवागूः॥क्ऌपीत्यर्थनिर्देशः॥  मूत्राय संपद्यते यवागूः। मूत्राय जायते यवागूः॥ उत्पातेन ज्ञाप्यमाने चतुर्थी वक्तव्या॥

    वाताय कपिला विद्युदातपायातिलोहिनी।

    पीता वर्षाय विज्ञेया दुर्भिक्षाय सिता भवेत्॥

    ॥ हितयोगे चतुर्थी वक्तव्या॥ गोभ्यो हितम्। अरोचकिने हितम्॥
  vartika:
  - तादर्थ्ये चतुर्थी वक्तव्या ।
  - कॢपि संपद्यमाने च ।
  - उत्पातेन ज्ञापिते च ।
  - हितयोगे च ।
  rule: |-
    The **सम्प्रदान** (the one the agent aims at through the action) takes the 4th case.
- id: '23014'
  ref: 2.3.14
  a: 2
  p: 3
  n: 14
  s: क्रियार्थोपपदस्य च कर्मणि स्थानिनः
  iast: kriyārthopapadasya ca karmaṇi sthāninaḥ
  type: V
  typeName: vidhi
  pada:
  - क्रिया-अर्थ-उपपदस्य
  - च
  - कर्मणि
  - स्थानिनः
  adhikara: अनभिहिते
  inherits:
  - word: चतुर्थी
    from: 2.3.13
  feeds: []
  meaning: ''
  kashika: |-
    क्रियार्था क्रियोपपदं यस्य, सोऽयं क्रियार्थोपपदः। <<तुमुन्ण्वुलौ क्रियायां क्रियार्थायाम्>> [[३.३.१०]] इत्येष विषयो लक्ष्यते। क्रियार्थोपपदस्य च स्थानिनोऽप्रयुज्यमानस्य धातोः कर्मणि कारके चतुर्थी विभक्तिर्भवति। द्वितीयापवादो योगः। एधेभ्यो व्रजति। पुष्पेभ्यो व्रजति। क्रियार्थोपपदस्येति किम्? प्रविश पिण्डीम्। प्रविश तर्पणम्। भक्षिरत्र स्थानी, न तु क्रियार्थोपपदः। कर्मणीति किम्? एधेभ्यो व्रजति शकटेन। स्थानिन इति किम्? एधानाहर्तुं व्रजति॥
  vartika: []
  rule: |-
    When a purpose-infinitive (the **तुमुन्**/**ण्वुल्** verb) is dropped from the sentence, its **कर्म** takes the 4th case (फलेभ्यो व्रजति = फलान्याहर्तुं व्रजति).
- id: '23015'
  ref: 2.3.15
  a: 2
  p: 3
  n: 15
  s: तुमर्थाच्च भाववचनात्
  iast: tumarthācca bhāvavacanāt
  type: V
  typeName: vidhi
  pada:
  - तुम्-अर्थात्
  - च
  - भाववचनात्
  adhikara: अनभिहिते
  inherits:
  - word: चतुर्थी
    from: 2.3.13
  feeds: []
  meaning: ''
  kashika: |-
    तुमुना समानार्थस्तुमर्थः। तुमर्थभाववचनप्रत्ययान्तात् प्रातिपदिकाच् चतुर्थी विभक्तिर्भवति। <<भाववचनाश्च>> [[३.३.११]] इति वक्ष्यति, तस्येदं ग्रहणम्। पाकाय व्रजति। त्यागाय व्रजति। भूतये व्रजति। संपत्तये व्रजति। तुमर्थादिति किम्? पाकः। त्यागः। रागः। भाववचनादिति किम्? कारको व्रजति॥
  vartika: []
  rule: |-
    After an abstract-action noun (**भाववचन**) that carries the force of **तुम्** (the purpose-infinitive), use the 4th case (यागाय व्रजति = यष्टुं व्रजति).
- id: '23016'
  ref: 2.3.16
  a: 2
  p: 3
  n: 16
  s: नमःस्वस्तिस्वाहास्वधालम्वषड्योगाच्च
  iast: namaḥsvastisvāhāsvadhālamvaṣaḍyogācca
  type: V
  typeName: vidhi
  pada:
  - नमः-स्वस्ति-स्वाहा-स्वधा-अलम्-वषट्-योगात्
  - च
  adhikara: अनभिहिते
  inherits:
  - word: चतुर्थी
    from: 2.3.13
  feeds: []
  meaning: ''
  kashika: |-
    नमः स्वस्ति स्वाहा स्वधा अलं वषट् इत्येतैर्योगे चतुर्थी विभक्तिर्भवति। न॑मो॒ दे॒वे॑भ्यः॒ (मै०सं० १.२.१३)। स्वस्ति प्रजाभ्यः। स्वाहा॒ अ॒ग्नये॒ (तै०सं० १.८.१३.३)। स्व॒धा॑ पि॒तृ॑भ्यः॒ (मै०सं० १.२.१३)। अलं मल्लो मल्लाय। अलमिति पर्याप्त्यर्थग्रहणम्। प्रभुर्मल्लो मल्लाय। शक्तो मल्लो मल्लाय। वषडग्नये। वषडिन्द्राय। चकारः पुनरस्यैव समुच्चयार्थः। तेनाशीर्विवक्षायामपि षष्ठीं बाधित्वा चतुर्थ्येव भवति। स्वस्ति गोभ्यो भूयात्। स्वस्ति ब्राह्मणेभ्यः॥
  vartika:
  - अलमिति पर्याप्त्यर्थग्रहणम् ।
  rule: |-
    In construction with नमः, स्वस्ति, स्वाहा, स्वधा, अलम्, or वषट्, use the 4th case (नमो देवेभ्यः, स्वस्ति प्रजाभ्यः, अलं मल्लो मल्लाय).
- id: '23017'
  ref: 2.3.17
  a: 2
  p: 3
  n: 17
  s: मन्यकर्मण्यनादरे विभाषाऽप्राणिषु
  iast: manyakarmaṇyanādare vibhāṣā'prāṇiṣu
  type: V
  typeName: vidhi
  pada:
  - मन्यकर्मणि
  - अनादरे
  - विभाषा
  - अप्राणिषु
  adhikara: अनभिहिते
  inherits:
  - word: चतुर्थी
    from: 2.3.13
  feeds: []
  meaning: ''
  kashika: |-
    मन्यतेः कर्म मन्यकर्म तस्मिन्। मन्यकर्मणि प्राणिवर्जिते विभाषा चतुर्थी विभक्तिर्भवत्यनादरे गम्यमाने। अनादरस्तिरस्कारः। न त्वा तृणं मन्ये, न त्वा तृणाय मन्ये। न त्वा बुसं मन्ये, न त्वा बुसाय मन्ये। मन्यतिग्रहणं किम्? न त्वा तृणं चिन्तयामि। विकरणनिर्देशः किमर्थः? न त्वा तृणं मन्वे। अनादर इति किम्?

    अश्मानं दृषदं मन्ये मन्ये काष्ठमुलूखलम्।

    अन्धायास्तं सुतं मन्ये यस्य माता न पश्यति॥

    अप्राणिष्विति किम्? न त्वा शृगालं मन्ये॥ यदेतदप्राणिष्विति तदनावादिष्विति वक्तव्यम्॥ व्यवस्थितविभाषा च ज्ञेया। न त्वा नावं मन्ये यावदुत्तीर्णं न नाव्यम्। न त्वान्नं मन्ये यावद् न भुक्तंश्राद्धम्। प्राणिषु तूभयम्। न त्वा काकं मन्ये। न त्वा शृगालं मन्ये। इह चतुर्थी द्वितीया च भवतः — न त्वा श्वानं मन्ये, न त्वा शुने मन्ये। युष्मदः कस्माद् न भवति चतुर्थी, एतदपि हि मन्यतेः कर्म? व्यवस्थितविभाषाविज्ञानादेव न भवति॥
  vartika:
  - अप्राणिष्वित्यपनीय नौकाकान्नशुकशृगालवर्ज्येष्विति वाच्यम् ।
  rule: |-
    The non-living **कर्म** of the verb मन्य (Divādi, with **श्यन्**) optionally takes the 4th case when contempt is meant (न त्वा तृणं/तृणाय मन्ये).
- id: '23018'
  ref: 2.3.18
  a: 2
  p: 3
  n: 18
  s: कर्तृकरणयोस्तृतीया
  iast: kartṛkaraṇayostṛtīyā
  type: V
  typeName: vidhi
  pada:
  - कर्तृ-करणयोः
  - तृतीया
  adhikara: अनभिहिते
  inherits: []
  feeds:
  - word: तृतीया
    to: 2.3.19
  - word: तृतीया
    to: 2.3.20
  - word: तृतीया
    to: 2.3.21
  - word: तृतीया
    to: 2.3.22
  - word: तृतीया
    to: 2.3.23
  meaning: ''
  kashika: |-
    कर्तरि करणे च कारके तृतीया विभक्तिर्भवति। देवदत्तेन कृतम्। यज्ञदत्तेन भुक्तम्। करणे — दात्रेण लुनाति। परशुना छिनत्ति॥ तृतीयाविधाने प्रकृत्यादिभ्य उपसंख्यानम्॥ प्रकृत्याभिरूपः। प्रकृत्या दर्शनीयः। प्रायेण याज्ञिकः। प्रायेण वैयाकरणः। गार्ग्योऽस्मि गोत्रेण। समेन धावति। विषमेण धावति। द्विद्रोणेन धान्यं क्रीणाति। पञ्चकेन पशून् क्रीणाति साहस्रेणाश्वान् क्रीणाति॥
  vartika:
  - प्रकृत्यादिभ्य उपसंख्यानम् ।
  rule: |-
    The **कर्तृ** (the independent doer) and the **करण** (the most effective means) take the 3rd case (देवदत्तेन कृतम्, दात्रेण लुनाति).
- id: '23019'
  ref: 2.3.19
  a: 2
  p: 3
  n: 19
  s: सहयुक्तेऽप्रधाने
  iast: sahayukte'pradhāne
  type: V
  typeName: vidhi
  pada:
  - सहयुक्ते
  - अप्रधाने
  adhikara: अनभिहिते
  inherits:
  - word: तृतीया
    from: 2.3.18
  feeds: []
  meaning: ''
  kashika: |-
    सहार्थेन युक्तेऽप्रधाने तृतीया विभक्तिर्भवति। पुत्रेण सहागतः पिता। पुत्रेण सह गोमान्। पितुरत्र क्रियादिसंबन्धः शब्देनोच्यते, पुत्रस्य तु प्रतीयमान इति तस्याप्राधान्यम्। सहार्थेन योगे तृतीयाविधानात् पर्यायप्रयोगेऽपि भवति। पुत्रेण सार्धमिति। विनापि सहशब्देन भवति। <<वृद्धो यूना०>> [[१.२.६५]] इति निदर्शनात्। अप्रधान इति किम्? शिष्येण सहोपाध्यायस्य गौः॥
  vartika: []
  rule: |-
    With सह, the accompanying — not the principal — word takes the 3rd case (पुत्रेण सहागतः पिता).
- id: '23020'
  ref: 2.3.20
  a: 2
  p: 3
  n: 20
  s: येनाङ्गविकारः
  iast: yenāṅgavikāraḥ
  type: V
  typeName: vidhi
  pada:
  - येन
  - अङ्ग-विकारः
  adhikara: अनभिहिते
  inherits:
  - word: तृतीया
    from: 2.3.18
  feeds: []
  meaning: ''
  kashika: |-
    अङ्गशब्दोऽत्राङ्गसमुदाये शरीरे वर्तते, येनेति च तदवयवो हेतुत्वेन निर्दिश्यते। येनाङ्गेन विकृतेनाङ्गिनो विकारो लक्ष्यते, ततस्तृतीयाविभक्तिर्भवति। अक्ष्णा काणः। पादेन खञ्जः। पाणिना कुण्ठः। अवयवधर्मेण समुदायो व्यपदिश्यते। अङ्गविकार इति किम्? अक्षि काणमस्य॥
  vartika: []
  rule: |-
    The defective limb by which a person's defect is marked takes the 3rd case (अक्ष्णा काणः, पादेन खञ्जः).
- id: '23021'
  ref: 2.3.21
  a: 2
  p: 3
  n: 21
  s: इत्थंभूतलक्षणे
  iast: itthaṃbhūtalakṣaṇe
  type: V
  typeName: vidhi
  pada:
  - इत्थंभूत-लक्षणे
  adhikara: अनभिहिते
  inherits:
  - word: तृतीया
    from: 2.3.18
  feeds: []
  meaning: ''
  kashika: |-
    कञ्चित् प्रकारं प्राप्त इत्थंभूतः, तस्य लक्षणमित्थंभूतलक्षणम्। ततस्तृतीया विभक्तिर्भवति। अपि भवान् कमण्डलुना छात्रमद्राक्षीत्। छात्रेणोपाध्यायम्। शिखया परिव्राजकम्। इह न भवति — कमण्डलुपाणिश्छात्र इति, लक्षणस्य समासेऽन्तर्भूतत्वात्। इत्थंभूत इति किम्? वृक्षं प्रति विद्योतनम्।
  vartika: []
  rule: |-
    The mark by which someone is recognized as being in a particular state takes the 3rd case (जटाभिस्तापसः, शिखया परिव्राजकम्).
- id: '23022'
  ref: 2.3.22
