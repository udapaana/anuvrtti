    संबोधने या प्रथमा तदन्तं शब्दरूपमामन्त्रितसंज्ञं भवति। तथा चैवोदाहृतम्। आमन्त्रितप्रदेशाः — <<आमन्त्रितं पूर्वमविद्यमानवत्>> [[८.१.७२]] इत्येवमादयः॥
