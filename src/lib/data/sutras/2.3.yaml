  meaning: ''
  kashika: |-
    कर्मप्रवचनीयैर्युक्ते द्वितीया विभक्तिर्भवति। <<अनुर्लक्षणे>> [[१.४.८४]] — शाकल्यस्य संहितामनु प्रावर्षत्। अगस्त्यमन्वसिञ्चन् प्रजाः॥
  vartika: []
  rule: A word governed by a **कर्मप्रवचनीय** takes the second case.
- id: '23009'
  ref: 2.3.9
  a: 2
  p: 3
