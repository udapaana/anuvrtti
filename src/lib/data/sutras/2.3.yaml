- id: '23011'
  ref: 2.3.11
  a: 2
  p: 3
  n: 11
  s: प्रतिनिधिप्रतिदाने च यस्मात्
  iast: pratinidhipratidāne ca yasmāt
  type: V
  typeName: vidhi
  pada:
  - प्रतिनिधि-प्रतिदाने
  - च
