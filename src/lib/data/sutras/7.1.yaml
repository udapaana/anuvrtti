  - असमासे
  adhikara: अङ्गस्य
  inherits:
  - word: नुम्
    from: 7.1.58
  - word: सर्वनामस्थाने
    from: 7.1.70
  feeds: []
  meaning: "The word युज् gets नुमागम in presence of a सर्वनामस्थान. However, if this word is in a समस्तपद,\
    \ then the नुमागम does not happen. "
  kashika: |-
    युजेरसमासे सर्वनामस्थाने परतो नुमागमो भवति। युङ्, युञ्जौ, युञ्जः। असमास इति किम्? अश्वयुक् , अश्वयुजौ, अश्वयुजः। युजेरितीकारनिर्देशाद् <<युज समाधौ>> इत्यस्य ग्रहणं न भवति। युजमापन्ना ऋषयः॥
  vartika: []
  rule: |-
    The **प्रातिपदिक** युज् takes **नुम्** in the **सर्वनामस्थान** when it does not stand in a compound: युङ्, युञ्जौ; but in a compound अश्वयुक्, अश्वयुजौ.
