  meaning: An इगन्त नपुंसकलिङ्ग word gets नुमागम when followed by an अजादि विभक्तिप्रत्यय.
  kashika: "इगन्तस्य नपुंसकस्याङ्गस्याजादौ विभक्तौ नुमागमो भवति। त्रपुणी। जतुनी। तुम्बुरुणी। त्रपुणे।\
    \ जुतने। तुम्बुरुणे। इक इति किम्? कुण्डे। पीठे। अचीति किम्? उत्तरार्थम्। यद्येवम्, तत्रैव कर्तव्यम्।\
    \ इह तु करणस्य एतत् प्रयोजनम् — हे त्रपो इत्यत्र नुम् मा भूदिति, <<न ङिसंबुद्ध्योः>> [[८.२.८]] इति\
    \ नलोपप्रतिषेधः स्यात्। ननु च <<न लुमताङ्गस्य>>[[१.१.६३]] इति प्रत्ययलक्षणे प्रतिषिद्धे विभक्तिरेव\
    \ नास्ति? एतदेवाज्ग्रहणं ज्ञापकं प्रत्ययलक्षणप्रतिषेधोऽत्र न भवतीति। तथा च संबुद्धिगुणः क्रियते। विभक्ताविति\
    \ किम्? तौम्बुरवं चूर्णम्। \n\nइकोऽचि व्यञ्जने मा भूदस्तु लोपःस्वरःकथम्।\n\nस्वरो वै श्रूयमाणेऽपि\
    \ लुप्ते किं न भविष्यति ॥ १॥\n\nरायात्वं तिसृभावश्च व्यवधानान्नुमा अपि।\n\nनुड् वाच्य उत्तरार्थं तु\
    \ इह किंचित् त्रपो इति॥ २॥"
  vartika: []
  rule: |-
    A neuter **अङ्ग** ending in an **इक्** vowel (इ, उ, ऋ, ऌ) takes **नुम्** before a case-affix beginning with a vowel: त्रपुणी, जतुने.
