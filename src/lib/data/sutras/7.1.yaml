    from: 7.1.2
  - word: झः
    from: 7.1.3
  - word: अत्
    from: 7.1.4
  feeds: []
  meaning: |-
    The झकार of the आत्मनेपदी प्रत्यय that follows an अनदन्त अङ्ग gets the 'अत्' आदेश.
  kashika: |-
    आत्मनेपदेषु यो झकारस्तस्यानकारान्तादङ्गादुत्तरस्यादित्ययमादेशो भवति। चिन्वते। चिन्वताम्। अचिन्वत। पुनते। लुनते। लुनताम्। अलुनत। आत्मनेपदेष्विति किम्? चिन्वन्ति। लुनन्ति। अनत इति किम्? च्यवन्ते। प्लवन्ते। नित्यत्वादत्र विकरणे कृते झोऽन्तादेशेन भवितव्यमित्यदादेशो न भवति। अनकारान्तेनाङ्गेन झकारविशेषणं किम्? इह मा भूत् — अद्य श्वो विजनिष्यमाणाः पतिभिः सह शयान्तै (वासि०गृ० १३.२४)॥
  vartika: []
  rule: |-
    In the **आत्मनेपद**, झ् becomes अत् when the **अङ्ग** before it does not end in अ.
- id: '71006'
  ref: 7.1.6
  a: 7
  p: 1
  n: 6
  s: शीङो रुट्
  iast: śīṅo ruṭ
  type: V
  typeName: vidhi
  pada:
  - शीङः
  - रुट्
  adhikara: अङ्गस्य
  inherits:
  - word: झः
    from: 7.1.3
  - word: अत्
    from: 7.1.4
  feeds:
  - word: रुट्
    to: 7.1.7
  - word: रुट्
    to: 7.1.8
  meaning: |-
    When the झ-प्रत्यय attached to the verb root शीङ् gets the आदेश अत्, then this आदेश also gets a आगम 'रुट्'.
  kashika: |-
    शीङोऽङ्गादुत्तरस्य झादेशस्यातो रुडागमो भवति। शेरते। शेरताम्। अशेरत। रुडयं परादिः क्रियते। स यदि झकारस्यैव स्याददादेशो न स्यादित्यत एवायमादेशस्यागमो विधीयते। सानुबन्धग्रहणमयङ्लुगर्थम्। तेनेह न भवति — व्यतिशेश्यते॥
  vartika: []
  rule: |-
    After the root **शी**, the अत् replacing झ् takes the **रुट्** augment, giving रत्.
- id: '71007'
