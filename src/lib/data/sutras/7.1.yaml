  - अत्
  - अभ्यस्तात्
  adhikara: अङ्गस्य
  inherits:
  - word: प्रत्ययादीनाम्
    from: 7.1.2
  - word: झः
    from: 7.1.3
  feeds:
  - word: अत्
    to: 7.1.5
  - word: अत्
    to: 7.1.6
  - word: अत्
    to: 7.1.7
  meaning: झकार of the प्रत्यय that follows an अभ्यस्त is converted to अत्.
  kashika: |-
    अभ्यस्तादङ्गादुत्तरस्य झकारस्य अदित्ययमादेशो भवति। ददति। ददतु। दधति। दधतु। जक्षति। जक्षतु। जाग्रति। जाग्रतु। अन्तादेशापवादोऽयं जुसादेशेन तु बाध्यते। अददुः। अजगारुः। अत्राप्यदादेशे कृत प्रत्ययाद्युदात्तत्वं भवति॥
  vartika: []
  rule: After a reduplicated **अङ्ग**, झ् becomes अत् (not अन्त्).
- id: '71005'
  ref: 7.1.5
  a: 7
  p: 1
