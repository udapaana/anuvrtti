- id: '71044'
  ref: 7.1.44
  a: 7
  p: 1
  n: 44
  s: तस्य तात्
  iast: tasya tāt
  type: V
  typeName: vidhi
  pada:
  - तस्य
  - तात्
  adhikara: अङ्गस्य
  inherits:
  - word: छन्दसि
    from: 7.1.38
  feeds:
  - word: तस्य
    to: 7.1.45
  meaning: ''
  kashika: |-
    तशब्दस्य लोण्मध्यमपुरुषबहुवचनस्य स्थाने तादित्ययमादेशो भवति। गा॑त्रं॒ गात्रम॒स्या॑नू॒नं कृणुतात् (मै०सं० ४.१३.४)। कृणुतेति प्राप्ते। ऊवध्यगो॒हं॑ पा॑र्थि॒वं खनतात् (मै०सं०४.१३.४)। खनतेति प्राप्ते। अ॒स्ना॑ र॒क्षः॒ सं॑सृ॒जतात् (मै०सं०४.१३.४)। संसृजतेति प्राप्ते। सू॑र्यं॒ च॑क्षु॒र्गमयता॒त् (मै०सं०४.१३.४)। गमयतेति प्राप्ते॥
  vartika: []
  rule: |-
    In the **छन्दस्**, the second-person plural imperative ending **त** becomes तात् (कृणुतात्).
- id: '71045'
  ref: 7.1.45
  a: 7
  p: 1
  n: 45
  s: तप्तनप्तनथनाश्च
  iast: taptanaptanathanāśca
  type: V
  typeName: vidhi
  pada:
  - तप्-तनप्-तन-थनाः
  - च
  adhikara: अङ्गस्य
  inherits:
  - word: छन्दसि
    from: 7.1.38
  - word: तस्य
    from: 7.1.44
  feeds: []
  meaning: ''
  kashika: |-
    तस्येति वर्तते। छन्दसि विषये तस्य स्थाने तप् तनप् तन थन इत्येत आदेशा भवन्ति। तप् — शृ॒णोत॑ ग्रावाणः (तै०सं०१.३.१३.१)। शृणुतेति प्राप्ते। सु॒नोता॑ (ऋ०७.३२.८)। सुनुतेति प्राप्ते। तनप् — सं व॑र॒त्रा द॑धातन (ऋ०१०.१०.१.५)। धत्तेति प्राप्ते। तन — जु॑जुष्टन (ऋ०४.३६.७)। जुषतेति प्राप्ते। छान्दसत्वात् श्लुः। थन — यदिष्ठन। यदिच्छतेति प्राप्ते। पित्करणमङित्त्वार्थम्॥
  vartika: []
  rule: |-
    In the **छन्दस्**, the second-person plural imperative ending **त** also becomes तप्, तनप्, तन, or थन (शृणोत, दधातन); the प् makes तप् and तनप् non-ङित्.
- id: '71046'
  ref: 7.1.46
  a: 7
  p: 1
  n: 46
  s: इदन्तो मसि
  iast: idanto masi
  type: V
  typeName: vidhi
  pada:
  - इदन्तः
  - मसि
  adhikara: अङ्गस्य
  inherits:
  - word: छन्दसि
    from: 7.1.38
  feeds: []
  meaning: ''
  kashika: |-
    छन्दसि विषये मसीत्ययं शब्द इकारान्तो भवति। मसः सकारान्तस्य इकारागमो भवति, स च तस्यान्तो भवति। तद्ग्रहणेन गृह्यत इत्यर्थः। पुन॒स्त्वोद् दी॑पयामसि (शौ०सं०१२.२.५)। उद्दीपयाम इति प्राप्ते। शलभान् भञ्जयामसि (पै०सं० ५.२०.४)। भञ्जयाम इति प्राप्ते। त्वयि॑ रात्रि वसामसि (शौ०सं०१९.४७.९)। वसाम इति प्राप्ते॥
  vartika: []
  rule: In the **छन्दस्**, the ending **मस्** takes a final इ, becoming मसि (दीपयामसि).
- id: '71047'
  ref: 7.1.47
  a: 7
  p: 1
  n: 47
  s: क्त्वो यक्
  iast: ktvo yak
  type: V
  typeName: vidhi
  pada:
  - क्त्वः
  - यक्
  adhikara: अङ्गस्य
