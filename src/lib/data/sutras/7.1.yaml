  meaning: The  औ and औट्-प्रत्ययs following a आबन्त अङ्ग get the आदेश 'शी'.
  kashika: "आबन्तादङ्गादुत्तरस्यौङः शीत्ययमादेशो भवति। खट्वे तिष्ठतः। खट्वे पश्य। बहुराजे। कारीषगन्ध्ये।\
    \ ङकारः सामान्यग्रहणार्थः, औटोऽपि ग्रहणं यथा स्यात्। \n\nऔकारोऽयं शीविधौ ङिद् गृहीतो ङिच्चास्माकं\
    \ नास्ति कोऽयं प्रकारः।\n\nसामान्यार्थस्तस्य चासञ्जनेऽस्मिन् ङित्कार्यं ते श्यां प्रसक्तं  स दोषः॥\
    \ १॥\n\nङित्त्वे विद्याद् वर्णनिर्देशमात्रं वर्णे यत् स्यात् तच्च विद्यात् तदादौ।\n\nवर्णश्चायं तेन\
    \ ङित्त्वेऽप्यदोषो निर्देशोऽयं पूर्वसूत्रेण वा स्यात्॥ २॥"
  vartika: []
  rule: |-
    After an **अङ्ग** ending in the feminine आप्, the dual ending औ (nominative and accusative) becomes शी (ई).
