  - word: क्त्वः
    to: 7.1.49
  meaning: ''
  kashika: |-
    क्त्वा इत्येतस्य यगागमो भवति छन्दसि विषये। द॒त्त्वाय (ऋ०१०.८५.३३) सविता धियः। दत्त्वेति प्राप्ते। <<क्त्वापिच्छन्दसि>> [[७.१.३८]] इत्यस्यानन्तरमिदं कस्माद् नोच्यते? समास इति तत्रानुवर्तते॥
  vartika: []
  rule: In the **छन्दस्**, **क्त्वा** takes the augment य at its end (दत्त्वाय).
- id: '71048'
  ref: 7.1.48
  a: 7
  p: 1
  n: 48
  s: इष्ट्वीनमिति च
  iast: iṣṭvīnamiti ca
  type: V
  typeName: vidhi
  pada:
  - इष्ट्वीनम्
  - इति
  - च
  adhikara: अङ्गस्य
  inherits:
  - word: छन्दसि
    from: 7.1.38
  - word: क्त्वः
    from: 7.1.47
  feeds: []
  meaning: ''
  kashika: |-
    इष्ट्वीनमित्ययं शब्दो निपात्यते छन्दसि विषये। यजेः क्त्वाप्रत्ययान्तस्य ईनमादेशोऽन्त्यस्य निपात्यते। इष्ट्वीनं देवान्। इष्ट्वा देवानिति प्राप्ते। पीत्वीनमित्यपीष्यते। चकारस्यानुक्तसमुच्चयार्थत्वात् सिद्धम्॥
  vartika: []
  rule: |-
    In the **छन्दस्**, इष्ट्वीनम् is the irregular form of इष्ट्वा (the final आ of यज्'s **क्त्वा** becoming ईनम्).
- id: '71049'
  ref: 7.1.49
  a: 7
  p: 1
  n: 49
  s: स्नात्व्यादयश्च
  iast: snātvyādayaśca
  type: V
  typeName: vidhi
  pada:
  - स्नात्व्यादयः
  - च
  adhikara: अङ्गस्य
  inherits:
  - word: छन्दसि
    from: 7.1.38
  - word: क्त्वः
    from: 7.1.47
  feeds: []
  meaning: ''
  kashika: |-
    स्नात्वी इत्येवमादयः शब्दा निपात्यन्ते छन्दसि विषये। स्ना॒त्वी॑ म॑ला॒दिव (मै०सं०३.११.१०)। स्नात्वेति प्राप्ते। पी॒त्वी सोम॑स्य वावृधे (ऋ०३.४०.७)। पीत्वेति प्राप्ते। प्रकारार्थोऽयमादिशब्दः॥
  vartika: []
  rule: |-
    In the **छन्दस्**, स्नात्वी and the like are irregular forms (स्नात्वी for स्नात्वा, पीत्वी for पीत्वा).
- id: '71050'
  ref: 7.1.50
  a: 7
  p: 1
  n: 50
  s: आज्जसेरसुक्
  iast: ājjaserasuk
  type: V
  typeName: vidhi
  pada:
  - आत्
  - जसेः
  - असुक्
  adhikara: अङ्गस्य
  inherits:
  - word: छन्दसि
    from: 7.1.38
  feeds:
  - word: असुक्
    to: 7.1.51
  - word: आत्
    to: 7.1.51
  - word: आत्
    to: 7.1.52
  meaning: ''
  kashika: |-
    अवर्णान्तादङ्गादुत्तरस्य जसेरसुगागमो भवति छन्दसि विषये। ब्राह्म॑णासः॒ पित॑रः॒ सोम्या॑सः (ऋ०६.७५.१०)। ब्राह्मणाः सोम्या इति प्राप्ते। ये पूर्वा॑सो॒ य उप॑रासः (ऋ०१०.१५.२) इत्यत्र परत्वादसुकि पुनः प्रसङ्गविज्ञानात् शीभावः प्राप्तः, <<सकृद्गतौ विप्रतिषेधे यद् बाधितं तद् बाधितमेव>> इति न भवति॥
  vartika: []
  rule: |-
    In the **छन्दस्**, after an **अङ्ग** ending in अ or आ, the nominative plural **जस्** (अस्) takes the augment असुक् (अस्) at its end (ब्राह्मणासः).
- id: '71051'
  ref: 7.1.51
  a: 7
  p: 1
  n: 51
  s: अश्वक्षीरवृषलवणानामात्मप्रीतौ क्यचि
  iast: aśvakṣīravṛṣalavaṇānāmātmaprītau kyaci
  type: V
  typeName: vidhi
  pada:
  - अश्व-क्षीर-वृष-लवणानाम्
  - आत्मप्रीतौ
  - क्यचि
  adhikara: अङ्गस्य
  inherits:
  - word: असुक्
    from: 7.1.50
  - word: आत्
    from: 7.1.50
  feeds: []
  meaning: ''
  kashika: |-
    छन्दसीत्यतः प्रभृति निवृत्तम्। अश्व क्षीर वृष लवण इत्येतेषामङ्गानामात्मप्रीतिविषये क्यचि परतोऽसुगागमो भवति। अश्वस्यति वडवा। क्षीरस्यति माणवकः। वृषस्यति गौः। लवणस्यत्युष्ट्रः। आत्मप्रीताविति किम्? अश्वीयति। क्षीरीयति। वृषीयति। लवणीयति॥ अश्ववृषयोर्मैथुनेच्छायामिति वक्तव्यम्॥ क्षीरलवणयोर्लालसायामिति वक्तव्यम्॥  तृष्णातिरेको लालसा। अन्यत्रात्मप्रीतावपि न भवति। अपर आह॥ सर्वप्रातिपदिकेभ्यो लालसायामसुग् वक्तव्यः॥ दध्यस्यति, मध्वस्यति इत्येवमाद्यर्थम्। अपर आह॥ सुग् वक्तव्यः॥ दधिस्यति, मधुस्यति इत्येवमाद्यर्थम्॥
  vartika:
  - अश्ववृषयोर्मैथुनेच्छायामिति वक्तव्यम् ।
  - क्षीरलवणयोर्लालसायाम् ।
  - सर्वप्रातिपदिकानां क्यचि लालसायां सुगसुकौ च ।
  rule: |-
    Before the denominative **क्यच्**, अश्व, क्षीर, वृष, and लवण take the augment असुक् (अस्) when the subject's delight in these is meant (अश्वस्यति वडवा).
- id: '71052'
  ref: 7.1.52
  a: 7
  p: 1
  n: 52
  s: आमि सर्वनाम्नः सुट्
  iast: āmi sarvanāmnaḥ suṭ
  type: V
  typeName: vidhi
  pada:
  - आमि
  - सर्वनाम्नः
  - सुट्
  adhikara: अङ्गस्य
  inherits:
  - word: आत्
