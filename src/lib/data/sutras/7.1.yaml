    \ हे पुरुदंसः। हे अनेहः। हे उशनः। उशनसः संबुद्धावपि पक्षेऽनङ् इष्यते। हे उशनन्। <<न ङिसंबुद्ध्योः>>[[८.२.८]]\
    \  इति नलोपप्रतिषेधोऽपि पक्ष इष्यते। हे उशन। तथा चोक्तम् — \n\nसंबोधने तूशनसस्त्रिरूपं सान्तं तथा\
    \ नान्तमथाप्यदन्तम्।\n\nमाध्यंदिनिर्वष्टि गुणं त्विगन्ते नपुंसके व्याघ्रपदां वरिष्ठः॥\n\nइति। तपरकरणमसन्देहार्थम्॥"
  vartika: []
  rule: |-
    अनङ् (अन्) replaces the final of **अङ्ग** ending in ऋ, and of उशनस्, पुरुदंसस्, अनेहस्, before सु, but not in the vocative singular (**सम्बुद्धि**).
- id: '71095'
  ref: 7.1.95
  a: 7
  p: 1
  n: 95
  s: तृज्वत् क्रोष्टुः
  iast: tṛjvat kroṣṭuḥ
  type: AT
  typeName: atideśa
  pada:
  - तृज्वत्
  - क्रोष्टुः
  adhikara: अङ्गस्य
  inherits:
  - word: सर्वनामस्थाने
    from: 7.1.86
  - word: असम्बुद्धौ
    from: 7.1.92
  feeds:
  - word: तृज्वत्
    to: 7.1.96
  - word: तृज्वत्
    to: 7.1.97
  meaning: |
    The word क्रोष्टु behaves like a  तृच्-प्रत्ययान्त word when followed by a सर्वनामस्थान not belonging to  सम्बोधनैकवचनम्.
  kashika: |-
    क्रोष्टुशब्दस्तुन्प्रत्ययान्तः संज्ञाशब्दः सर्वनामस्थानेऽसंबुद्धौ परतः तृज्वद् भवति। तृजन्तस्य यद् रूपं तदस्य भवतीत्यर्थः। रूपातिदेशोऽयम्। प्रत्यासत्तेश्च क्रुशेरेव तृजन्तस्य यद् रूपं तदतिदिश्यते। तत् च क्रोष्टृ इत्येतदन्तोदात्तम्। क्रोष्टा, क्रोष्टारौ, क्रोष्टारः। क्रोष्टारम्, क्रोष्टारौ। सर्वनामस्थान इत्येव — क्रोष्टून्। असंबुद्धावित्येव — हे क्रोष्टो॥
  vartika: []
  rule: |-
    क्रोष्टु counts as ending in तृच् (तृ) in the strong cases (**सर्वनामस्थान**), except the vocative singular (**सम्बुद्धि**).
- id: '71096'
  ref: 7.1.96
  a: 7
  p: 1
  n: 96
  s: स्त्रियां च
  iast: striyāṃ ca
  type: V
  typeName: vidhi
  pada:
  - स्त्रियाम्
  - च
  adhikara: अङ्गस्य
  inherits:
  - word: सर्वनामस्थाने
    from: 7.1.86
  - word: तृज्वत्
    from: 7.1.95
  feeds: []
  meaning: "In feminine context, the word क्रोष्टु behaves similar to the तृच्-प्रत्ययान्त words. "
  kashika: |-
    असर्वनामस्थानार्थमारम्भः। स्त्रियां च क्रोष्टुशब्दस्य तृज्वद् भवति। क्रोष्ट्री। क्रोष्ट्रीभ्याम्। क्रोष्ट्रीभिः। क्रोष्टुशब्दं केचिद् गौरादिषु पठन्ति। ते ङीषि प्रत्यये तृज्वद्भावं कुर्वन्ति। तेषां पञ्चभिः क्रोष्ट्रीभिः क्रीतैः पञ्चक्रोष्टृभी रथैरिति स्त्रीशब्दस्य लुकि कृते न सिध्यति। तत्र प्रतिविधेयम्। ये तु गौरादिषु न पठन्ति, तेषां स्त्रियामित्यर्थनिर्देशः, स्त्रियां वर्तमानःक्रोष्टुशब्दः तृज्वद् भवति। कृतेऽतिदेश <<ऋन्नेभ्यो ङीप्>>[[४.१.५]] इति ङीप् प्रत्ययः। तत्र <<उदात्तयणो हल्पूर्वात्>>[[६.१.१७४]] इत्यन्तोदात्त एव क्रोष्ट्रीशब्दो भवति॥
  vartika: []
  rule: |-
    In the feminine, क्रोष्टु counts as ending in तृच् (तृ) before every case-ending.
