  feeds: []
  meaning: "The verb root उप + लभ् gets a  नुमागम in the anticipation of a pratyay that starts with य्,\
    \ if the intended meaning of the resultant word is 'to praise'.  "
  kashika: |-
    उपादुत्तरस्य लभेः प्रशंसायां गम्यमानायां यकारादिप्रत्ययविषये नुमागमो भवति। उ॒प॒ल॒म्भ्या॑ भवता विद्या। उ॒प॒ल॒म्भ्या॑नि धनानि। ण्यत्प्रत्ययान्तत्वादन्तस्वरितत्वमेव। प्रशंसायामिति किम्? उपलभ्यमस्माद् वृषलात् किंचित्। पोरदुधत्वात् [[३.१.९८]] यत्प्रत्ययान्तमिदम्॥
  vartika: []
  rule: |-
    लभ् after उप takes **नुम्** before an affix beginning with य when the sense is praiseworthy: उपलम्भ्या.
- id: '71067'
  ref: 7.1.67
  a: 7
  p: 1
  n: 67
  s: उपसर्गात् खल्घञोः
  iast: upasargāt khalghañoḥ
  type: V
  typeName: vidhi
  pada:
  - उपसर्गात्
  - खल्-घञोः
  adhikara: अङ्गस्य
  inherits:
  - word: नुम्
    from: 7.1.58
  - word: लभेः
    from: 7.1.64
  feeds:
  - word: उपसर्गात्
    to: 7.1.68
  - word: खल्-घञोः
    to: 7.1.68
  meaning: |-
    The verb root लभ् gets a नुमागम in presence of  खल्-प्रत्यय and घञ्-प्रत्यय (only when) it is attached to an उपसर्ग .
  kashika: |-
    उपसर्गादुत्तरस्य लभेः खल्घञोः परतो नुमागमो भवति। ईषत्प्रलम्भः। सुप्रलम्भः। दुष्प्रलम्भः। घञि — प्रलम्भः। विप्रलम्भः। सिद्धे सत्यारम्भो नियमार्थः। उपसर्गादेव लभेः खल्घञोः परतो नुमागमो भवति, नान्यत्र। ईषल्लभः। लाभो वर्तते॥
  vartika: []
  rule: |-
    लभ् after any **उपसर्ग** takes **नुम्** before **खल्** and **घञ्**: ईषत्प्रलम्भः, प्रलम्भः. (This restricts 7.1.64: before these two affixes लभ् gets नुम् only with a preposition.)
- id: '71068'
  ref: 7.1.68
  a: 7
  p: 1
  n: 68
  s: न सुदुर्भ्यां केवलाभ्याम्
  iast: na sudurbhyāṃ kevalābhyām
  type: V
  typeName: vidhi
  pada:
  - न
  - सुदुर्भ्याम्
  - केवलाभ्याम्
  adhikara: अङ्गस्य
  inherits:
  - word: नुम्
    from: 7.1.58
  - word: लभेः
    from: 7.1.64
  - word: उपसर्गात्
    from: 7.1.67
  - word: खल्-घञोः
    from: 7.1.67
  feeds: []
  meaning: |-
    The verb root लभ् , when attached to only the 'सु' or 'दुर्' उपसर्ग (and no other उपसर्ग) does not get a नुमागम in presence of  खल्-प्रत्यय and घञ्-प्रत्यय.
  kashika: |-
    सु दुरित्येताभ्यां केवलाभ्यामन्योपसर्गरहिताभ्यामुपसृष्टस्य लभेः खल्घञोः परतो नुमागमो भवति। सुलभम्। दुर्लभम्। घञि — सुलाभः। दुर्लाभः। केवलाभ्यामिति किम्? सुप्रलम्भः। दुष्प्रलम्भः। सुदुर्भ्यामिति तृतीयां मत्वा केवलग्रहणं क्रियते। पञ्चम्यां हि व्यवहितत्वादेवाप्रसङ्गः। अतिसुलभमित्यत्र कर्मप्रवचनीयत्वादतेः केवल एव सुशब्द उपसर्ग इति भवति प्रतिषेधः। यदा त्वतिशब्दो न कर्मप्रवचनीयः, तदा नुम् भवत्येव — अतिसुलम्भ इति। पञ्चमीनिर्देशपक्षेऽप्येवमर्थं केवलग्रहणं कर्तव्यम्॥
  vartika: []
  rule: |-
    But लभ् after सु or दुर् standing alone (no other **उपसर्ग** with them) also takes **नुम्** before **खल्** and **घञ्**: सुलभम्, दुर्लभम्, सुलाभः.
- id: '71069'
