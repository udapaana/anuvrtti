  meaning: The verb roots मस्ज् and नश् get a नुमागम when followed by a झलादि प्रत्यय.
  kashika: |-
    मस्जि नशि इत्येतयोरङ्गयोर्झलादौ प्रत्यये नुमागमो भवति। मङ्क्ता। मङ्क्तुम्। मङ्क्तव्यम्। नंष्टा। नंष्टुम्। नंष्टव्यम्। झलीति किम्? मज्जनम्। नशनम्। <<मस्जेरन्त्यात् पूर्वं नुममिच्छन्त्यनुषङ्गादिलोपार्थम्>> (१.१.४७ वा०)। मग्नः। मग्नवान्॥
  vartika: []
  rule: |-
    मस्ज् and नश् take **नुम्** before an affix beginning with a **झल्** consonant (any consonant except a semivowel or nasal): मङ्क्ता, नंष्टा.
