  meaning: "The verb root लभ् (when used without any उपसर्ग) optionally gets a नुमागम in presence of \
    \ चिण्-प्रत्यय and णमुल्-प्रत्यय. "
  kashika: |-
    चिण् णमुल् इत्येतयोर्विभाषा लभेर्नुम् भवति। अलाभि, अलम्भि। लाभंलाभम्, लम्भंलम्भम्। व्यवस्थितविभाषा चेयम्, तेनानुपसृष्टस्य विकल्पः, उपसृष्टस्य नित्यं नुम् भवति। प्रालम्भि। प्रलम्भंप्रलम्भम्॥
  vartika: []
  rule: |-
    लभ् optionally takes **नुम्** before the **चिण्** aorist and the **णमुल्**: अलाभि or अलम्भि, लाभंलाभम् or लम्भंलम्भम्.
- id: '71070'
  ref: 7.1.70
  a: 7
  p: 1
  n: 70
  s: उगिदचां सर्वनामस्थानेऽधातोः
  iast: ugidacāṃ sarvanāmasthāne'dhātoḥ
  type: V
  typeName: vidhi
  pada:
  - उगिदचाम्
  - सर्वनामस्थाने
  - अधातोः
  adhikara: अङ्गस्य
