  vartika: []
  rule: Before the genitive plural **आम्**, **त्रि** becomes त्रय (त्रयाणाम्).
- id: '71054'
  ref: 7.1.54
  a: 7
  p: 1
  n: 54
  s: ह्रस्वनद्यापो नुट्
  iast: hrasvanadyāpo nuṭ
  type: V
  typeName: vidhi
  pada:
  - ह्रस्व-नदी-आपः
  - नुट्
  adhikara: अङ्गस्य
  inherits:
  - word: आमि
    from: 7.1.52
  feeds:
  - word: नुट्
    to: 7.1.55
  - word: नुट्
    to: 7.1.56
  - word: नुट्
    to: 7.1.57
  meaning: |-
    The आम्-प्रत्यय that follows a ह्रस्व word, a नदीसंज्ञक word, or an आबन्त word gets a नुट्-आगम.
  kashika: |-
    ह्रस्वान्ताद् नद्यन्तादाबन्ताच्चोत्तरस्यामो नुडागमो भवति।  ह्रस्वान्तात् तावत् — वक्षाणाम्। प्लक्षाणाम्। अग्नीनाम्। वायूनाम्। कर्तृणाम्। नद्यन्तात् — कुमारीणाम्। किशोरीणाम्। गौरीणाम्। शार्ङ्गरवीणाम्। लक्ष्मीणाम्। ब्रह्मबन्धूनाम्। वीरबन्धूनाम्। आबन्तात् — खट्वानाम्। मालानाम्। बहुराजानाम्। कारीषगन्ध्यानाम्॥
  vartika:
  - नुमचिरतृज्वद्भावेभ्यो नुट्पूर्वविप्रतिषेधेन ।
  rule: |-
    Before the genitive plural **आम्**, an **अङ्ग** ending in a short vowel, a **नदी** stem, or an आ-stem takes the augment नुट् (न्) (वृक्षाणाम्, कुमारीणाम्, खट्वानाम्).
- id: '71055'
  ref: 7.1.55
  a: 7
  p: 1
  n: 55
  s: षट्चतुर्भ्यश्च
  iast: ṣaṭcaturbhyaśca
