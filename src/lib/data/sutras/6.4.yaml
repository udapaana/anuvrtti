  meaning: |-
    The उपधा of the नकारान्त words becomes दीर्घ when the नकारान्त word is followed by the नाम्-प्रत्यय.
  kashika: |-
    नान्तस्याङ्गस्योपधाया नामि परतो दीर्घो भवति। पञ्चानाम्। सप्तानाम्। नवानाम्। दशानाम्। न इति किम्? चतुर्णाम्। नामीत्येव — चर्मणाम्॥
  vartika: []
  rule: |-
    An **अङ्ग** ending in न् lengthens its penultimate vowel before नाम् (पञ्चन् → पञ्चानाम्).
