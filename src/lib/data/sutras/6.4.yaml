  kashika: |-
    भावकरणवाचिनि घञि परतो रञ्जेरुपधाया नकारस्य लोपो भवति। भावे — आश्चर्यो रागः। विचित्रो रागः। करणे — रज्यतेऽनेनेति रागः। भावकरणयोरिति किम्? रजन्ति तस्मिन्निति रङ्गः॥
  vartika: []
