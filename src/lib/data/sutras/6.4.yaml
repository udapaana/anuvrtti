- id: '64161'
  ref: 6.4.161
  a: 6
  p: 4
  n: 161
  s: र ऋतो हलादेर्लघोः
  iast: ra ṛto halāderlaghoḥ
  type: V
  typeName: vidhi
  pada:
  - रः
  - ऋतः
  - हलादेः
  - लघोः
  adhikara: अङ्गस्य
  inherits:
  - word: इष्ठ-इमन्-ईयस्सु
    from: 6.4.154
  feeds:
  - word: रः
    to: 6.4.162
  - word: ऋतः
    to: 6.4.162
  meaning: ''
  kashika: |-
    रशब्द आदेशो भवति ऋकारस्य हलादेर्लघोरिष्ठेमेयस्सु परतः। प्रथिष्ठः। प्रथिमा। प्रथीयान्। म्रदिष्ठः। म्रदिमा। म्रदीयान्। ऋत इति किम्? पटिष्ठः। पटिमा। पटीयान्। हलादेरिति किम्? ऋजिष्ठः। ऋजिमा। ऋजीयान्। लघोरिति किम्? कृष्ण — कृष्णिष्ठः। कृष्णिमा। कृष्णीयान्। परिगणनमत्र कर्तव्यम्।

    पृथुं मृदुं भृशं चैव कृशं च दृढमेव च।

    परिपूर्वं वृढं चैव षडेतान् रविधौ स्मरेत्॥

    तत इह न भवति — कृतमाचष्टे कृतयति। मातरमाचष्टे मातयति। भ्रातयति॥
  vartika: []
  rule: |-
    Before इष्ठ, इमन्, and ईयस्, a stem's ऋ becomes र् when a consonant precedes it and the ऋ is prosodically short — in just six words पृथु, मृदु, भृश, कृश, दृढ, परिवृढ: पृथु → प्रथिष्ठः, मृदु → म्रदीयान्.
