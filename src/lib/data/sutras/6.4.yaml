  kashika: |-
    सावसंबुद्धौ परत इन्हन्पूषार्यम्णामुपधाया दीर्घो भवति। दण्डी। वृत्रहा। पूषा अर्यमा। असंबुद्धाविति किम्? हे दण्डिन्। हे वृत्रहन्। हे पूषन् । हे अर्यमन्॥
