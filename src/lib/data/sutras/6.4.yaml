  - word: असम्बुद्धौ
    from: 6.4.8
  feeds: []
  meaning: |-
    When followed by a प्रत्यय which is a सर्वनामस्थान other than सम्बोधन-एकवचन, the उपधा स्वर of a नकारान्त अङ्ग becomes optionally दीर्घ in वेदाः, if that उपधा स्वर is preceded by a षकार.
  kashika: |-
    षपूर्वस्याचो नोपधाया निगमविषये सर्वनामस्थाने परतोऽसंबुद्धौ वा दीर्घो भवति। स॑॑ त॑क्षा॒णं॒ ति॑ष्ठ॒न्तमब्रवी॒त् (मै० सं० २.४.१), स तक्षणं तिष्ठन्तमब्रवीत्। ऋभुक्षाणमिन्द्रम्, ऋ॒भु॒क्षण॒मिन्द्॒रम् (ऋ० १.१११.४)। निगम इति किम्? तक्षा, तक्षाणौ, तक्षाणः॥
  vartika: []
  rule: |-
    In Vedic usage, an **अङ्ग** ending in न् whose penultimate vowel is preceded by ष optionally lengthens that vowel before a **सर्वनामस्थान** ending (तक्षाणम् or तक्षणम्).
