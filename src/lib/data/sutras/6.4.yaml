    from: 6.4.23
  - word: उपधायाः
    from: 6.4.24
  - word: घञि
    from: 6.4.27
  feeds: []
  meaning: ''
  kashika: |-
    जवेऽभिधेये स्यद इति घञि निपात्यते। स्यन्देर्नलोपो वृद्ध्यभावश्च। इक्प्रकरणाद् <<न धातुलोप०>> [[१.१.४]] इति प्रतिषेधो नास्ति। गोस्यदः। अश्वस्यदः। जव इति किम्? तैलस्यन्दः। घृतस्यन्दः॥
  vartika: []
  rule: |-
    स्यद is **स्यन्द्** + **घञ्** in the sense of speed, with the nasal dropped and **वृद्धि** withheld.
- id: '64029'
