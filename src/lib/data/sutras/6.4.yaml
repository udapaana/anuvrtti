# Adhyāya 6, Pāda 4 — 175 sūtras
sutras:
- id: '64001'
  ref: 6.4.1
  a: 6
  p: 4
  n: 1
  s: अङ्गस्य
  iast: aṅgasya
  type: AD
  typeName: adhikāra
  pada:
  - अङ्गस्य
  adhikara: अङ्गस्य
  inherits:
  - word: दीर्घः
    from: 6.3.111
  - word: सम्प्रसारणस्य
    from: 6.3.139
  feeds: []
  meaning: "In all the rules starting from this sutra till the end of the seventh chapter the word 'अङ्गस्य'\
    \ should be included while interpreting the sutras. "
  kashika: |-
    अधिकारोऽयमा सप्तमाध्यायपरिसमाप्तेः। यदित ऊर्ध्वमनुक्रमिष्यामोऽङ्गस्येत्येवं तद् वेदितव्यम्। वक्ष्यति — <<हलः>> [[६.४.२]] — हूतः। जीनः। संवीतः। अङ्गस्येति किम्? निरुतम्। दुरुतम्। <<नामि>> [[६.४.३]] दीर्घः — अग्नीनाम्। वायूनाम्। अङ्गस्येति किम्? क्रिमिणां पश्य। पामनां पश्य। <<अतो भिस ऐस्>> [[७.१.९]] — वृक्षैः। प्लक्षैः। अङ्गस्येति किम्? ब्राह्मणभिस्सा। ओदनभिस्सिटा। अङ्गाधिकारः कृतोऽन्यार्थो नामि दीर्घत्वाद्यपि व्यवस्थापयतीति तदर्थम् अर्थवद्ग्रहणपरिभाषा (परि०१४) नाश्रयितव्या भवति। अङ्गस्येति संबन्धसामान्य एषा षष्ठी यथायोगं विशेषेष्ववतिष्ठते। अथवा प्रातिपदिकार्थमात्रमविवक्षितविभक्त्यर्थमधिक्रियते। तदुत्तरत्र यथायोगं विपरिणम्यते। ततोऽकारान्तादङ्गाद् भिस ऐसित्येवमाद्यपि सम्यक् संपन्नं भवति॥
  vartika: []
  rule: |-
    From here to the end of the seventh अध्याय, every operation taught applies to the **अङ्ग** (the stem).
- id: '64002'
  ref: 6.4.2
  a: 6
  p: 4
  n: 2
  s: हलः
  iast: halaḥ
  type: V
  typeName: vidhi
  pada:
  - हलः
  adhikara: अङ्गस्य
  inherits:
  - word: दीर्घः
    from: 6.3.111
  - word: सम्प्रसारणस्य
    from: 6.3.139
  feeds: []
  meaning: |-
    The letter which has been generated using सम्प्रसारणम् and which occurs at end of an अङ्ग becomes दीर्घ when there is a हल् letter which occurs just before it in that अङ्ग.
  kashika: |-
    अङ्गावयवाद्धलो यदुत्तरं संप्रसारणं तदन्तस्याङ्गस्य दीर्घो भवति। हूतः। जीनः। संवीतः। हल इति किम्? उतः। उतवान्। अङ्गावयवादिति किम्? निरुतम्। तदन्तस्येति किम्? विद्धः। विचितः। अण इत्येव — तृतीयः। <<०तृतीया>> [[२.३.१८]] इति वा निपातनादत्र दीर्घाभावः। अङ्गग्रहणमावर्तयितव्यं हल्विशेषणार्थम्, अङ्गकार्यप्रतिपत्त्यर्थं च॥
  vartika: []
  rule: |-
    A **सम्प्रसारण** vowel at the end of the **अङ्ग** lengthens when a consonant of the **अङ्ग** precedes it (ह्वा → हूतः).
- id: '64003'
  ref: 6.4.3
  a: 6
  p: 4
  n: 3
  s: नामि
  iast: nāmi
  type: V
  typeName: vidhi
  pada:
  - नामि
  adhikara: अङ्गस्य
  inherits:
  - word: दीर्घः
    from: 6.3.111
  feeds:
  - word: नामि
    to: 6.4.4
  - word: नामि
    to: 6.4.5
  - word: नामि
    to: 6.4.6
  - word: नामि
    to: 6.4.7
  meaning: In presence of the   नाम् प्रत्यय, the last letter of the अङ्ग becomes दीर्घ.
  kashika: |-
    नामित्येतत्  षष्ठीबहुवचनमागतनुट्कं गृह्यते। तस्मिन् परतोऽङ्गस्य दीर्घो भवति। अग्नीनाम्। वायूनाम्। कर्तृृणाम्। हर्तृृणाम्। अण इत्येतदत्र निवृत्तम्। आगतनुट्कग्रहणमुत्तरार्थम्, कृते च नुटि दीर्घप्रतिपत्त्यर्थम्। अन्यथा हि नुडेव न स्यात्।

    नामि दीर्घ आमि चेत्स्यात् कृते दीर्घे न नुड् भवेत्।

    वचनाद् यत्र तन्नास्ति नोपधायाश्च चर्मणाम्॥
  vartika: []
  rule: |-
    The **अङ्ग** lengthens its final before नाम् (the षष्ठी plural आम् with the नुट् augment).
- id: '64004'
  ref: 6.4.4
  a: 6
  p: 4
  n: 4
  s: न तिसृचतसृ
  iast: na tisṛcatasṛ
  type: V
  typeName: vidhi
  pada:
  - न
  - तिसृ-चतसृ
  adhikara: अङ्गस्य
  inherits:
  - word: दीर्घः
    from: 6.3.111
  - word: नामि
    from: 6.4.3
  feeds:
  - word: तिसृ-चतसृ
    to: 6.4.5
  meaning: 'The words तिसृ and चतसृ do not become दीर्घ in presence of the  नाम् प्रत्यय. '
  kashika: |-
    तिसृ चतसृ इत्येतयोर्नामि दीर्घो न भवति। तिसृणाम्। चतसृणाम्। इदमेव नामीति दीर्घप्रतिषेधवचनं ज्ञापकम् — <<अचि र ऋतः>>  [[७.२.१००]] इत्येतस्मात् पूर्वविप्रतिषेधेन नुडागमो भवतीति॥
  vartika: []
  rule: तिसृ and चतसृ do not lengthen their final before नाम्.
- id: '64005'
  ref: 6.4.5
  a: 6
  p: 4
  n: 5
  s: छन्दस्युभयथा
  iast: chandasyubhayathā
  type: V
  typeName: vidhi
  pada:
  - छन्दसि
  - उभयथा
  adhikara: अङ्गस्य
  inherits:
  - word: दीर्घः
    from: 6.3.111
  - word: नामि
    from: 6.4.3
  - word: तिसृ-चतसृ
    from: 6.4.4
  feeds:
  - word: उभयथा
    to: 6.4.6
  meaning: |-
    In presence of the नाम् प्रत्यय, the last letter of the अङ्ग might or might not be made दीर्घ in वेदाः.
  kashika: |-
    छन्दसि विषये तिसृचतस्रोर्नामि परत उभयथा दृश्यते, दीर्घश्चादीर्घश्च। तिसृणां मध्यन्दिने (काठ० सं० २७.९), तिसृ॒णां (ऋ० ५.६९.२) मध्यदिने। चतसृणां (काठ० सं० २७.९) मध्यदिने, चतसृणां मध्यदिने॥
  vartika: []
  rule: In the **छन्दस्**, तिसृ and चतसृ go both ways before नाम् — lengthened or not.
- id: '64006'
  ref: 6.4.6
  a: 6
  p: 4
  n: 6
  s: नृ च
  iast: nṛ ca
  type: V
  typeName: vidhi
  pada:
  - नृ
  - च
  adhikara: अङ्गस्य
  inherits:
  - word: दीर्घः
    from: 6.3.111
  - word: नामि
    from: 6.4.3
  - word: उभयथा
    from: 6.4.5
  feeds: []
  meaning: |-
    In presence of the नाम् प्रत्यय, the last letter of the word नृ becomes दीर्घ optionally.
  kashika: |-
    नृ इत्येतस्य नामि पर उभयथा भवति। त्वं नृणां (पै० सं० २.१०.४) नृपते। त्वं नृ॒णां नृ॑पते (ऋ० २.१.१)। केचिदत्र छन्दसीति नानुवर्तयन्ति। तेन भाषायामपि विकल्पो भवति॥
  vartika: []
  rule: नृ likewise lengthens, optionally, before नाम्.
