  meaning: "The स्वर preceding the नकार from (a) महत् and (b) any word that ends in न्स् - becomes दीर्घ\
    \ in presence of \nप्रत्यय that is also a सर्वनामस्थान, other than सम्बोधन-एकवचन."
  kashika: |-
    सकारान्तस्य संयोगस्य यो नकारः महतश्च तस्योपधाया दीर्घो भवति सर्वनामस्थाने परतोऽसंबुद्धौ। श्रेयान्, श्रेयांसौ, श्रेयांसः। श्रेयांसि। पयांसि। यशांसि। महतः खल्वपि — महान्, महान्तौ, महान्तः। असंबुद्धाविति किम्? हे श्रेयन्। हे महन्॥
  vartika: []
  rule: |-
    An **अङ्ग** ending in स् preceded by a nasal (the न् of the conjunct न्स्), and महत्, lengthen their penultimate vowel before a **सर्वनामस्थान** ending other than the **सम्बुद्धि** (श्रेयान्, महान्).
