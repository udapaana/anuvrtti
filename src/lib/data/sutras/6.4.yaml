  meaning: |-
    The उपधा letter of the verb-root 'क्रम्' undergoes an optional दीर्घादेश when followed by a झलादि क्त्वा प्रत्यय.
  kashika: |-
    क्रम उपधाया विभाषा दीर्घो भवति क्त्वाप्रत्यये झलादौ परतः। क्रन्त्वा, क्रान्त्वा। झलीत्येव — क्रमित्वा। प्रक्रम्य, उपक्रम्येति <<बहिरङ्गोऽपि ल्यबादेशोऽन्तरङ्गानपि विधीन् बाधते>> इति पूर्वमेव दीर्घत्वं न प्रवर्तते॥
  vartika: []
  rule: |-
    क्रम् optionally lengthens its penultimate vowel before **क्त्वा** when it is without the इट् augment (क्रान्त्वा or क्रन्त्वा, but क्रमित्वा with इट्).
