  meaning: ''
  kashika: |-
    बहोरुत्तरेषामिष्ठेमेयसां लोपो भवति, तस्य च बहोः स्थाने भू इत्ययमादेशो भवति। भूमा। भूयान्। बहुशब्दः पृथ्वादिषु पठ्यते। बहोरिति पुनर्ग्रहणं स्थानित्वप्रतिपत्त्यर्थम्, अन्यथा हि प्रत्ययानामेव भूभावः स्यात्॥
  vartika: []
