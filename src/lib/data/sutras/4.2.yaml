  s: कन्थापलदनगरग्रामहृदोत्तरपदात्
  iast: kanthāpaladanagaragrāmahṛdottarapadāt
  type: V
  typeName: vidhi
  pada:
  - कन्था-पलद-नगर-ग्राम-हृद-उत्तरपदात्
  adhikara: प्रत्ययः
  inherits:
  - word: छः
    from: 4.2.137
  - word: वृद्धात्
    from: 4.2.141
  feeds: []
  meaning: ''
  kashika: |-
    देश इत्येव, वृद्धादिति च । कन्थाद्युत्तरपदाद् देशवाचिनो वृद्धात् प्रातिपदिकाच् छः प्रत्ययो भवति शैषिकः। वाहीकग्रामादिलक्षणस्य प्रत्ययस्यापवादः। दाक्षिकन्थीयम्। माहिकिकन्थीयम्। दाक्षिपलदीयम्। माहिकिपलदीयम्। दाक्षिनगरीयम्। माहिकिनगरीयम्। दाक्षिग्रामीयम्। माहिकिग्रामीयम्। दाक्षिह्रदीयम्। माहिकिह्रदीयम्॥
  vartika: []
  rule: |-
    After a **वृद्ध** place-name whose second member is कन्था, पलद, नगर, ग्राम, or हृद, **छ** comes in the leftover senses.
