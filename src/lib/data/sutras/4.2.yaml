- id: '42034'
  ref: 4.2.34
  a: 4
  p: 2
  n: 34
  s: कालेभ्यो भववत्
  iast: kālebhyo bhavavat
  type: AT
  typeName: atideśa
  pada:
  - कालेभ्यः
  - भववत्
  adhikara: प्रत्ययः
  inherits:
  - word: सा
    from: 4.2.24
  - word: अस्य
    from: 4.2.24
  - word: देवता
    from: 4.2.24
  feeds: []
  meaning: |-
    For the कालवाची words, the same प्रत्यय that is provided for the meaning 'तत्र भवः' comes for the meaning 'सा अस्य देवता'  as well.
  kashika: |-
    कालविशेषवाचिभ्यो शब्देभ्यो भववत् प्रत्यया भवन्ति सास्य देवतेत्यस्मिन् विषये। <<कालाट् ठञ्>> [[४.३.११]] इति प्रकरणे भवे प्रत्यया विधास्यन्ते, ते सास्य देवतेत्यस्मिन्नर्थे तथैवेष्यन्ते, तदर्थमिदमुच्यते। वत्करणं सर्वसादृश्यपरिग्रहार्थम्। मासे भवं मासिकम्। आर्धमासिकम्। सांवत्सरिकम्। वासन्तम्। प्रावृषेण्यम्। तथा मासो देवतास्य मासिकम्। आर्धमासिकम्। सांवत्सरिकम्। वासन्तम्। प्रावृषेण्यम्॥
  vartika: []
  rule: |-
    After a word for a time-period, the same affixes that mark "who stays in it" (**ठञ्** etc., from [[4.3.11]] through [[4.3.53]]) also mark "this is its deity".
- id: '42035'
  ref: 4.2.35
  a: 4
  p: 2
  n: 35
  s: महाराजप्रोष्ठपदाट्ठञ्
  iast: mahārājaproṣṭhapadāṭṭhañ
  type: V
  typeName: vidhi
  pada:
  - महाराज-प्रोष्ठपदात्
  - ठञ्
  adhikara: प्रत्ययः
  inherits:
  - word: सा
    from: 4.2.24
  - word: अस्य
    from: 4.2.24
  - word: देवता
    from: 4.2.24
  feeds: []
  meaning: |-
    The words 'महाराज' and 'प्रोष्ठपद' get the प्रत्यय ठञ् in the meaning of 'सा अस्य देवता'.
  kashika: |-
    महाराजशब्दात् प्रोष्ठपदशब्दात् च ठञ् प्रत्ययो भवति सास्य देवतेत्यस्मिन् विषये। महाराजो देवतास्य माहाराजिकम्। प्रौष्ठपदिकम्॥ ठञ्प्रकरणे तदस्मिन् वर्तत इति नवयज्ञादिभ्य उपसंख्यानम्॥ नवयज्ञोऽस्मिन् वर्तते नावयज्ञिकः कालः। पाकयज्ञिकः॥ पूर्णमासादण्॥ पूर्णमासोऽस्यां वर्तते पा॒ैर्णमा॒सी॑ (मै०सं० १.६.९) तिथिः॥
  vartika:
  - तदस्मिन् वर्तत इति नवयज्ञादिभ्य उपसंख्यानम् ।
  - पूर्णमासादण् वक्तव्यः ।
  rule: After महाराज and प्रोष्ठपद, **ठञ्** marks "this is its deity".
- id: '42036'
  ref: 4.2.36
  a: 4
  p: 2
  n: 36
  s: पितृव्यमातुलमातामहपितामहाः
  iast: pitṛvyamātulamātāmahapitāmahāḥ
  type: V
  typeName: vidhi
  pada:
  - पितृव्य-मातुल-मातामह-पितामहाः
  adhikara: प्रत्ययः
  inherits: []
  feeds: []
  meaning: "The words पितृव्य, मातुल, मातामह and  पितामह are given 'readymade' (that is, without any प्रक्रिया). "
  kashika: |-
    पितृव्यादयो निपात्यन्ते। समर्थविभक्तिः प्रत्ययः प्रत्ययार्थोऽनुबन्ध इति सर्वं निपातनाद् विज्ञेयम्। पितृमातृभ्यां भ्रातर्यभिधेये व्यत् डुलच् इत्येतौ प्रत्ययौ निपात्येते। पितुर्भ्राता पितृव्यः। मातुर्भ्राता मातुलः। ताभ्यां पितरि डामहच्, मातरि षित् च। ताभ्यामेव पितरि डामहच् प्रत्ययो भवति। पितुः पिता पितामहः। मातुः पिता मातामहः। मातरि षित् च। पितामही। मातामही॥ अवेर्दुग्धे सोढदूसमरीसचो वक्तव्याः॥ अवेर्दुग्धम् अविसोढम्। अविदूसम्। अविमरीसम्॥ तिलान्निष्फलात् पिञ्जपेजौ प्रत्ययौ वक्तव्यौ॥ निष्फलस्तिलः तिलपिञ्जः। तिलपेजः॥ पिञ्जश्छन्दसि डिच्च॥ ति॒ल्पिञ्जं॒ दण्ड॑नं न॒डम् (शौ०सं० १२.२.५४)॥
  vartika:
  - पितुर्भ्रातरि व्यन् ।
  - मातुर्डुलच् ।
  - मातृपितृभ्यां पितरि डामहच् ।
  - मातरि षिच्च ।
  - अवेर्दुग्धे सोढदूसमरीसचो वक्तव्याः ।
  - तिलानिष्फलात्पिञ्जपेजौ ।
  - पिञ्जश्छन्दसि डिच्च ।
  rule: |-
    पितृव्य, मातुल, मातामह, पितामह are formed irregularly; from their shape you read back the affix, its meaning, and the case it follows.
