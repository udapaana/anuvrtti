  meaning: ''
  kashika: |-
    काशि इत्येवमादिभ्यष्ठञ् ञिठ इत्येतौ प्रत्ययौ भवतः शैषिकौ। इकार उच्चारणार्थः। ञकार एवोभयत्र विपर्यस्तदेशोऽनुबन्धः। स्त्रीप्रत्यये विशेषः। काशिकी, काशिका। चैदिकी, चैदिका। वृद्धादित्यत्रानुवर्तते। ये त्ववृद्धाः पठ्यन्ते वचनप्रामाण्यात् तेभ्यः प्रत्ययविधिः। देवदत्तशब्दः पठ्यते, तस्य <<एङ् प्राचां देशे>>[[१.१.७५]]इति वृद्धसंज्ञा। दैवदत्तिकः। वाहीकग्रामस्य तु नास्ति वृद्धसंज्ञा। दैवदत्तः। कथं भाष्य उदाहृतम् — वा नामधेयस्य वृद्धसंज्ञा वेदितव्या — देवदत्तीयाः, दैवदत्ताः(महाभाष्य १.१.८९) इति, यावता वृद्धसंज्ञापक्षे काश्यादित्वाट् ठञ्ञिठाभ्यां भवितव्यम्? तत्रैवं वर्णयन्ति — वा नामधेयस्येति व्यवस्थितविभाषेयम्, सा छे कर्तव्ये भवति, ठञ्ञिठयोर्न भवतीति॥ काशि। चेदि। संज्ञा। संवाह। अच्युत। मोहमान। शकुलाद। हस्तिकर्षू। कुदामन्। हिरण्य। करण। गोधाशन। भौरिकि। भौलिङ्गि। अरिन्दम। सर्वमित्र। देवदत्त। साधुमित्र। दासमित्र। दासग्राम। सौधावतान। युवराज। उपराज। सिन्धुमित्र। देवराज। आपदादिपूर्वपदात् कालात् (ग०सू० ९४)। आपत्कालिकी, आपत्कालिका। और्ध्वकालिकी, और्ध्वकालिका। तात्कालिकी, तात्कालिका॥
  vartika:
  - आपदादिपूर्वपदात्कालात् ।
  rule: काशि, चेदि... take ठञ् and ञिठ् in the remaining senses.
