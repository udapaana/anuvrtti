  s: राज्ञः क च
  iast: rājñaḥ ka ca
  type: V
  typeName: vidhi
  pada:
  - राज्ञः
  - क
  - च
  adhikara: प्रत्ययः
  inherits:
  - word: छः
    from: 4.2.137
  feeds: []
  meaning: ''
  kashika: |-
    असंभवाद् देशाधिकारो न विशेषणम्। राज्ञःककारश्चान्तादेशो भवति छश्च प्रत्ययः। राजकीयम्। आदेशमात्रमिह विधेयम्, प्रत्ययस्तु <<वृद्धाच्छः>>[[४.२.११४]] इत्येव सिद्धः॥
  vartika: []
  rule: With **छ**, क replaces the final of राजन्.
- id: '42141'
  ref: 4.2.141
  a: 4
  p: 2
  n: 141
  s: वृद्धादकेकान्तखोपधात्
  iast: vṛddhādakekāntakhopadhāt
  type: V
  typeName: vidhi
  pada:
  - वृद्धात्
  - अक-इक-अन्त-ख-उपधात्
  adhikara: प्रत्ययः
  inherits:
  - word: छः
    from: 4.2.137
  feeds:
  - word: वृद्धात्
    to: 4.2.142
  meaning: ''
  kashika: |-
    देश इत्येव। वृद्धाद् देशवाचिनोऽक इक इत्येवमन्तात् खकारोपधात् च प्रातिपदिकाच् छः प्रत्ययो भवति शैषिकः। कोपधलक्षणस्याणोऽपवादः, वाहीकग्रामलक्षणस्य च प्रत्ययस्य, <<रोपधेतोः प्राचाम्>> [[४.२.१२३]] इति च। अकान्तात् तावत् — आरीहणकीयम्। द्रौघणकीयम्। इकान्तात् — आश्वपथिकीयम्। शाल्मलिकीयम्। खोपधात् — कौटिशिखीयम्। आयोमुखीयम्॥ अकेकान्तग्रहणे कोपधग्रहणं सौसुकाद्यर्थम्॥ सौसुकीयम्। मौसुकीयम्। ऐन्द्रवेणुकीयम्॥
  vartika:
  - अकेकान्तग्रहणे कोपधग्रहणं सौसुकाद्यर्थम् ।
  rule: |-
    After a **वृद्ध** place-name ending in **अक्** or **इक्**, or having ख as its second-to-last sound, **छ** comes in the leftover senses, blocking **अण्** and the others.
- id: '42142'
  ref: 4.2.142
  a: 4
  p: 2
