- id: '42144'
  ref: 4.2.144
  a: 4
  p: 2
  n: 144
  s: विभाषाऽमनुष्ये
  iast: vibhāṣā'manuṣye
  type: V
  typeName: vidhi
  pada:
  - विभाषा
  - अ-मनुष्ये
  adhikara: प्रत्ययः
  inherits:
  - word: छः
    from: 4.2.137
  - word: पर्वतात्
    from: 4.2.143
  - word: च
    from: 4.2.143
  feeds: []
  meaning: ''
  kashika: |-
    पर्वतशब्दाच् छः प्रत्ययो भवति वामनुष्ये वाच्ये। पूर्वेण नित्ये प्राप्ते विकल्प उच्यते। पर्वतीयानि फलानि, पार्वतानि फलानि। पर्वतीयमुदकम्, पार्वतमुदकम्। अमनुष्य इति किम्? पर्वतीयो मनुष्यः॥
  vartika: []
  rule: After पर्वत, **छ** optionally comes in the leftover senses when no man is meant.
- id: '42145'
  ref: 4.2.145
  a: 4
  p: 2
  n: 145
  s: कृकणपर्णाद्भारद्वाजे
  iast: kṛkaṇaparṇādbhāradvāje
  type: V
  typeName: vidhi
  pada:
  - कृकण-पर्णात्
  - भारद्वाजे
  adhikara: प्रत्ययः
  inherits:
  - word: छः
    from: 4.2.137
  feeds: []
  meaning: ''
  kashika: |-
    देश इत्येव। भारद्वाजशब्दोऽपि देशवचन एव, न गोत्रशब्दः। प्रकृतिविशेषणं चैतत्, न प्रत्ययार्थः। कृकणपर्णशब्दाभ्यां भारद्वाजदेशवाचिभ्यां छः प्रत्ययो भवति शैषिकः। कृकणीयम्। पर्णीयम्। भारद्वाज इति किम्? कार्कणम्। पार्णम्॥

    ॥ इति श्रीजयादित्यविरचितायां काशिकायां वृत्तौ चतुर्थाध्यायस्य द्वितीयः पादः॥
  vartika: []
  rule: |-
    After कृकण and पर्ण naming the country भारद्वाज, **छ** comes in the leftover senses.
