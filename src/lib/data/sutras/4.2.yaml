    to: 4.2.5
  meaning: "To indicate the meaning of 'time occupied by a certain नक्षत्र', an appropriate तद्धित प्रत्यय\
    \ which  gets attached to the word in तृतीया विभक्ति undergoes a लुप् if the time being indicated\
    \ does not have a particular name. "
  kashika: |-
    पूर्वेण विहितस्य प्रत्ययस्य लुब् भवत्यविशेषे। न चेद् नक्षत्रयुक्तस्य कालस्य रात्र्यादिविशेषोऽभिधीयते। यावान् कालो नक्षत्रेण युज्यतेऽहोरात्रः, तस्याविशेषे लुब् भवति। अद्य पुष्यः। अद्य कृत्तिकाः। अविशेष इति किम् ? पौषी रात्रिः। पौषमहः॥
  vartika: []
  rule: |-
    The **प्रत्यय** of the preceding rule drops by **लुप्** when the time the asterism marks is not specified as day or night (अद्य पुष्यः).
