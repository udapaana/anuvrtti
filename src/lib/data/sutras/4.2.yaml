  meaning: "To express the meaning of 'colored by', an appropriate प्रत्यय gets added to the तृतीयासमर्थ\
    \ word representing the name of the color. "
  kashika: |-
    शुक्लस्य वर्णान्तरापादानमिह रञ्जेरर्थः। रज्यतेऽनेनेति रागः। तेनेति तृतीयासमर्थाद् रागविशेषवाचिनः प्रातिपदिकाद् रक्तमित्येतस्मिन्नर्थे यथाविहितं प्रत्ययो भवति। कषायेण रक्तं वस्त्रं काषायम्। माञ्जिष्ठम्। कौसुम्भम्। रागादिति किम्? देवदत्तेन रक्तं वस्त्रम्। कथं काषायौ गर्दभस्य कर्णौ, हारिद्रौ कुक्कुटस्य पादाविति? उपमानाद् भविष्यति, काषायाविव काषायौ, हारिद्राविव हारिद्रौ। <<द्वैपवैयाघ्रादञ्>> [[४.२.१२]] इति यावत् तृतीयासमर्थविभक्तिरनुवर्तते॥
  vartika: []
  rule: |-
    A colour-name in the instrumental takes **अण्** in the sense of "coloured by it": कषाय → काषाय.
- id: '42002'
  ref: 4.2.2
  a: 4
  p: 2
  n: 2
  s: लाक्षारोचनाशकलकर्दमाट्ठक्
  iast: lākṣārocanāśakalakardamāṭṭhak
  type: V
  typeName: vidhi
  pada:
  - लाक्षा-रोचना-शकल-कर्दमात्
  - ठक्
  adhikara: प्रत्ययः
  inherits:
  - word: रक्तम्
    from: 4.2.1
  - word: रागात्
    from: 4.2.1
  - word: तेन
    from: 4.2.1
  feeds: []
  meaning: "For the word  लाक्षा, रोचना, शकल and कर्दम, ठक्-प्रत्ययः is used to indicate the meaning of\
    \ 'colored by'. "
  kashika: |-
    लाक्षादिभ्यो रागवचनेभ्यस्तृतीयासमर्थेभ्यो रक्तमित्येतस्मिन्नर्थे ठक् प्रत्ययो भवति। अणोऽपवादः। लाक्षया रक्तं वस्त्रं लाक्षिकम्। रौचनिकम्। शाकलिकम्। कार्दमिकम्। शकलकर्दमाभ्यामणपीष्यते॥ शाकलम्। कार्दमम्॥ नील्या अन् वक्तव्यः॥ नील्या रक्तं नीलं वस्त्रम्॥ पीतात् कन् वक्तव्यः॥ पीतेन रक्तं  पीतकम्॥ हरिद्रामहारजनाभ्यामञ् वक्तव्यः॥ हारिद्रम्। माहारजनम्॥
  vartika:
  - शकलकर्दमाभ्यामुपसंख्यानम् ।
  - नील्या अङ्वक्तव्यः ।
  - पीतात्कन् वक्तव्यः ।
  - हरिद्रामहारजनाभ्यामञ् ।
  rule: |-
    लाक्षा, रोचना, शकल, कर्दम take **ठक्** in the sense of "coloured by it," blocking **अण्**.
