  a: 4
  p: 2
  n: 106
  s: तीररूप्योत्तरपदादञ्ञौ
  iast: tīrarūpyottarapadādaññau
  type: V
  typeName: vidhi
  pada:
  - तीर-रूप्य-उत्तरपदात्
