  - word: तत्
    from: 5.2.7
  - word: अलंगामी
    from: 5.2.15
  - word: यत्-खौ
    from: 5.2.16
  feeds: []
  meaning: ''
  kashika: |-
    अभ्यमित्रशब्दाद् द्वितीयासमर्थादलंगामीत्यस्मिन्नर्थे छः प्रत्ययो भवति, चकाराद् यत्खौ च। अभ्यमित्रमलंगामी अभ्यमित्रीयः, अभ्यमित्र्यः, अभ्यमित्रीणः। अमित्राभिमुखं सुष्ठु गच्छतीत्यर्थः॥
  vartika: []
  rule: |-
    After अभ्यमित्र (accusative), the **प्रत्यय** छ (ईय) marks "fit to advance on the enemy", and the च adds यत् and ख too: अभ्यमित्रीयः, अभ्यमित्र्यः, अभ्यमित्रीणः.
- id: '52018'
  ref: 5.2.18
  a: 5
  p: 2
  n: 18
  s: गोष्ठात् खञ् भूतपूर्वे
  iast: goṣṭhāt khañ bhūtapūrve
  type: V
  typeName: vidhi
  pada:
  - गोष्ठात्
  - खञ्
  - भूतपूर्वे
  adhikara: प्रत्ययः
  inherits:
  - word: तत्
    from: 5.2.7
  feeds:
  - word: खञ्
    to: 5.2.19
  - word: खञ्
    to: 5.2.20
  - word: खञ्
    to: 5.2.21
  - word: खञ्
    to: 5.2.22
  - word: खञ्
    to: 5.2.23
  meaning: ''
  kashika: |-
    गावस्तिष्ठन्त्यस्मिन्निति गोष्ठम्। गोष्ठशब्देन सन्निहितगोसमूहो देश उच्यते। भूतपूर्वग्रहणं तस्यैव विशेषणम्। गोष्ठशब्दाद् भूतपूर्वोपाधिकात् स्वार्थे खञ् प्रत्ययो भवति। गोष्ठो भूतपूर्वो गौष्ठीनो देशः। भूतपूर्वग्रहणं किम्? गोष्ठो वर्तते॥
  vartika: []
  rule: |-
    After गोष्ठ (a cow-pen), the **प्रत्यय** खञ् marks "what used to be one": गौष्ठीनो देशः, a place that was formerly a cow-pen.
- id: '52019'
  ref: 5.2.19
  a: 5
  p: 2
  n: 19
  s: अश्वस्यैकाहगमः
  iast: aśvasyaikāhagamaḥ
  type: V
  typeName: vidhi
  pada:
  - अश्वस्य
  - एकाहगमः
  adhikara: प्रत्ययः
  inherits:
  - word: तत्
    from: 5.2.7
  - word: खञ्
    from: 5.2.18
  feeds: []
  meaning: ''
  kashika: |-
    निर्देशादेव समर्थविभक्तिः। अश्वशब्दात् षष्ठीसमर्थादेकाहगम इत्येतस्मिन्नर्थे खञ् प्रत्ययो भवति। एकाहेन गम्यत इत्येकाहगमः। अश्वस्यैकाहगमोऽध्वा आश्वीनः। आश्वीनानि (तां०ब्रा० २१.१.९) शतं पतित्वा॥
  vartika: []
  rule: |-
    After अश्व (genitive), the **प्रत्यय** खञ् marks the distance covered in one day: आश्वीनः.
- id: '52020'
  ref: 5.2.20
  a: 5
  p: 2
  n: 20
  s: शालीनकौपीने अधृष्टाकार्ययोः
  iast: śālīnakaupīne adhṛṣṭākāryayoḥ
  type: V
  typeName: vidhi
  pada:
  - शालीन-कौपीने
  - अधृष्ट-अकार्ययोः
  adhikara: प्रत्ययः
  inherits:
  - word: तत्
    from: 5.2.7
  - word: खञ्
    from: 5.2.18
  feeds: []
  meaning: ''
  kashika: |-
    शालीनकौपीनशब्दौ निपात्येते यथासंख्यमधृष्टेऽकार्ये चाभिधेये। अधृष्टोऽप्रगल्भः। अकार्यमकरणार्हं विरुद्धम्। शालीनकौपीने अधृष्टाकार्ययोः पर्यायौ यथाकथंचिद् व्युत्पादयितव्यौ। शालाप्रवेशनमर्हति कूपावतारमर्हति इति खञ् प्रत्यय उत्तरपदलोपश्च निपात्यते। शालीनो जडः। कौपीनं पापम्॥
  vartika: []
  rule: |-
    शालीन (modest) and कौपीन (a shameful act) are the irregular forms, from शाला and कूप, when they carry those senses.
- id: '52021'
  ref: 5.2.21
  a: 5
  p: 2
  n: 21
  s: व्रातेन जीवति
  iast: vrātena jīvati
  type: V
  typeName: vidhi
  pada:
  - व्रातेन
  - जीवति
  adhikara: प्रत्ययः
  inherits:
  - word: तत्
    from: 5.2.7
  - word: खञ्
    from: 5.2.18
  feeds: []
  meaning: ''
  kashika: |-
    निर्देशादेव तृतीया समर्थविभक्तिः। व्रातशब्दात् तृतीयासमर्थाद् जीवतीत्यस्मिन्नर्थे खञ् प्रत्ययो भवति। नानाजातीया अनियतवृत्तय उत्सेधजीविनः संघा व्राताः। उत्सेधः शरीरम्, तदायास्य ये जीवन्ति, त उत्सेधजीविनः, तेषां कर्म व्रातम्। तेन व्रातेन जीवति व्रातीनः। तेषामेव व्रातानामन्यतम उच्यते। यस्त्वन्यस्तदीयेन जीवति, तत्र नेष्यते॥
  vartika: []
  rule: |-
    After व्रात (instrumental) — a roving band that lives by bodily labor — the **प्रत्यय** खञ् marks "who lives by it": व्रातीनः.
- id: '52022'
  ref: 5.2.22
  a: 5
  p: 2
  n: 22
  s: साप्तपदीनं सख्यम्
  iast: sāptapadīnaṃ sakhyam
  type: V
  typeName: vidhi
  pada:
  - साप्तपदीनम्
  - सख्यम्
  adhikara: प्रत्ययः
  inherits:
  - word: तत्
    from: 5.2.7
  - word: खञ्
    from: 5.2.18
  feeds: []
  meaning: ''
  kashika: |-
    साप्तपदीनमिति निपात्यते सख्येऽभिधेये। सप्तभिः पदैरवाप्यते साप्तपदीनम्। सख्यं जनाः साप्तपदीनमाहुः। कथं साप्तपदीनः सखा, साप्तपदीनं मित्रमिति ? यदा गुणप्रधानः साप्तपदीनशब्दः सखिभावे तत्कर्मणि च वर्तते, तदा सख्यशब्देन सामानाधिकरण्यं भवति, यदा तु लक्षणया वर्तते, तदा पुरुषेण सामानाधिकरण्यं भवति॥
  vartika: []
  rule: साप्तपदीन is the irregular form for friendship, from सप्तपद.
- id: '52023'
  ref: 5.2.23
  a: 5
  p: 2
  n: 23
  s: हैयंगवीनं संज्ञायाम्
  iast: haiyaṃgavīnaṃ saṃjñāyām
  type: V
  typeName: vidhi
  pada:
  - हैयङ्गवीनम्
  - संज्ञायाम्
  adhikara: प्रत्ययः
  inherits:
  - word: तत्
    from: 5.2.7
  - word: खञ्
    from: 5.2.18
  feeds: []
  meaning: ''
  kashika: |-
    हैयङ्गवीनं निपात्यते संज्ञायां विषये। ह्योगोदोहस्य हियङ्ग्वादेशः, तस्य विकारे खञ् प्रत्ययो भवति संज्ञायाम्। ह्योगोदोहस्य विकारो हैयङ्गवीनम्। घृतस्य संज्ञा। तेनेह न भवति — ह्योगोदोहस्य विकार उदश्वित्॥
  vartika: []
  rule: |-
    हैयंगवीन is the irregular form, as a Name, for fresh butter made from yesterday's milk (ह्यः + गो).
- id: '52024'
  ref: 5.2.24
  a: 5
  p: 2
  n: 24
  s: तस्य पाकमूले पील्वादिकर्णादिभ्यः कुणब्जाहचौ
  iast: tasya pākamūle pīlvādikarṇādibhyaḥ kuṇabjāhacau
  type: V
  typeName: vidhi
  pada:
  - तस्य
  - पाकमूले
  - पील्वादि-कर्णादिभ्यः
  - कुणप्-जाहचौ
  adhikara: प्रत्ययः
  inherits:
  - word: तत्
    from: 5.2.7
  feeds:
  - word: तस्य
    to: 5.2.25
  - word: पाकमूले
    to: 5.2.25
  meaning: ''
  kashika: |-
    तस्येति षष्ठीसमर्थेभ्यः पील्वादिभ्यः कर्णादिभ्यश्च यथासंख्यं पाकमूलयोरर्थयोः कुणब् जाहच् इत्येतौ प्रत्ययौ भवतः। पीलूनां पाकः पीलुकुणः। कर्कन्धुकुणः। कर्णादिभ्यः — कर्णस्य मूलं कर्णजाहम्॥ पीलु। कर्कन्धु। शमी। करीर। कुवल। बदर। अश्वत्थ। खदिर। पील्वादिः॥ कर्ण। अक्षि। नख। मुख। मख। केश। पाद। गुल्फ। भ्रूभङ्ग। दन्त। ओष्ठ। पृष्ठ। अङ्गुष्ठ। कर्णादिः॥
  vartika: []
  rule: |-
    After पील्वादि words (genitive) the **प्रत्यय** कुणप् (कुण) marks their fruiting-season, and after कर्णादि words the **प्रत्यय** जाहच् (जाह) marks their root: पीलुकुणः, कर्णजाहम्.
- id: '52025'
  ref: 5.2.25
  a: 5
  p: 2
  n: 25
  s: पक्षात्तिः
  iast: pakṣāttiḥ
