- id: '52091'
  ref: 5.2.91
  a: 5
  p: 2
  n: 91
  s: साक्षाद्द्रष्टरि संज्ञायाम्
  iast: sākṣāddraṣṭari saṃjñāyām
  type: V
  typeName: vidhi
  pada:
