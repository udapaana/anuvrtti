  meaning: ''
  kashika: |-
    साक्षाच्छब्दोऽव्ययम्। तस्मादिनिः प्रत्ययो भवति द्रष्टरि वाच्ये। संज्ञाग्रहणमभिधेयनियमार्थम्। साक्षाद् द्रष्टा साक्षी, साक्षिणौ, साक्षिणः। संज्ञाग्रहणादुपद्रष्टैवोच्यते, न दाता ग्रहीता वा॥
  vartika: []
