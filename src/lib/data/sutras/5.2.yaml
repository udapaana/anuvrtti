  adhikara: प्रत्ययः
  inherits:
  - word: तत्
    from: 5.2.7
  - word: तस्य
    from: 5.2.24
  - word: पाकमूले
    from: 5.2.24
  feeds: []
  meaning: ''
  kashika: |-
    तस्येत्येव। तस्येति षष्ठीसमर्थात् पक्षशब्दाद् मूलेऽभिधेये तिः प्रत्ययो भवति। मूलग्रहणमनुवर्तते, न पाकग्रहणम्, <<एकयोगनिर्दिष्टानामप्येकदेशोऽनुवर्तते>> इति। पक्षस्य मूलं पक्षतिः प्रतिपत्॥
  vartika: []
  rule: |-
    After पक्ष (genitive), the **प्रत्यय** ति marks its root — only मूल carries over from the previous rule, not पाक: पक्षतिः, the first day of a fortnight.
- id: '52026'
  ref: 5.2.26
  a: 5
  p: 2
  n: 26
  s: तेन वित्तश्चुञ्चुप्चणपौ
