    After कम् (water, happiness) and शम् (happiness), the seven affixes ब, भ, युस्, ति, तु, त, यस् come in the sense of **मतुप्** — कम्बः, कम्भः, कंयुः, कन्तिः, कन्तुः, कन्तः, कंयः, and likewise from शम्.
