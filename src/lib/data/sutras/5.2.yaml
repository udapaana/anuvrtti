  meaning: ''
  kashika: |-
    समांसमामिति वीप्सा। सुबन्तसमुदायः प्रकृतिः। विजायते गर्भं धारयतीति प्रत्ययार्थः। गर्भधारणेन सकलापि समा व्याप्यत इति अत्यन्तसंयोगे द्वितीया [[२.१.२९]]। समांसमां विजायते समांसमीना गौः। समांसमीना वडवा॥ पूर्वपदे सुपोऽलुग् वक्तव्यः॥ केचित् तु समायांसमायां विजायत इति विगृह्णन्ति, गर्भविमोचने तु विजनिर्वर्तत इत्याहुः॥ तेषां पूर्वपदे यलोपमात्रं निपात्यते, परिशिष्टस्यालुग् वक्तव्यः॥ अनुत्पत्तावुत्तरपदस्य च वा यलोपो वक्तव्यः॥ समांसमां विजायते, समायांसमायां विजायत इति वा॥
  vartika:
  - खप्रत्ययानुत्पत्तौ यलोपो वा वक्तव्यः ।
  rule: |-
    After समांसमाम् (accusative of time), the **प्रत्यय** ख (ईन) marks "who carries young year after year": समांसमीना गौः.
- id: '52013'
  ref: 5.2.13
  a: 5
  p: 2
  n: 13
  s: अद्यश्वीनाऽवष्टब्धे
  iast: adyaśvīnā'vaṣṭabdhe
  type: V
  typeName: vidhi
  pada:
  - अद्यश्वीन
  - अवष्टब्धे
  adhikara: प्रत्ययः
  inherits:
  - word: खः
    from: 5.2.6
  - word: तत्
    from: 5.2.7
  - word: विजायते
    from: 5.2.12
  feeds: []
  meaning: ''
  kashika: |-
    विजायत इति वर्तते। अद्यश्वीन इति निपात्यत अवष्टब्धे विजने, आसन्ने प्रसवे। आविदूर्ये हि मूर्धन्यो विधीयते,  <<अवाच्चालम्बनाविदूर्ययोः>> [[८.३.६८]] इति। अद्य वा श्वो वा विजायते अद्यश्वीना गौः। अद्यश्वीना वडवा। केचित् तु विजायत इति नानुवर्तयन्ति, अवष्टब्धमात्रे निपातनमित्याहुः। अद्यश्वीनं मरणम्। अद्यश्वीनो वियोग इति॥
  vartika: []
  rule: |-
    अद्यश्वीन is the irregular form for a female about to give birth today or tomorrow.
- id: '52014'
  ref: 5.2.14
  a: 5
  p: 2
  n: 14
  s: आगवीनः
  iast: āgavīnaḥ
  type: V
  typeName: vidhi
  pada:
  - आगवीनः
  adhikara: प्रत्ययः
  inherits:
  - word: खः
    from: 5.2.6
  - word: तत्
    from: 5.2.7
  feeds: []
  meaning: ''
  kashika: |-
    आगवीन इति निपात्यते। गोराङ्पूर्वाद् आ तस्य गोः प्रतिदानात् कर्मकारिणि खः प्रत्ययो निपात्यते। आगवीनः कर्मकरः। यो गवा भृतः कर्म करोति आ तस्य गोः प्रत्यर्पणात्॥
  vartika: []
  rule: |-
    आगवीन is the irregular form for a day-laborer who works until the cows come back, taking ख after आ + गो.
- id: '52015'
  ref: 5.2.15
  a: 5
  p: 2
  n: 15
  s: अनुग्वलंगामी
  iast: anugvalaṃgāmī
  type: V
  typeName: vidhi
  pada:
  - अनुगु
  - अलंगामी
  adhikara: प्रत्ययः
  inherits:
  - word: खः
    from: 5.2.6
  - word: तत्
    from: 5.2.7
  feeds:
  - word: अलंगामी
    to: 5.2.16
  - word: अलंगामी
    to: 5.2.17
  meaning: ''
  kashika: |-
    गोः पश्चाद् अनुगु। अनुगुशब्दादलंगामीत्यस्मिन्नर्थे खः प्रत्ययो भवति। अनुगु पर्याप्तं गच्छति अनुगवीनो गोपालकः॥
  vartika: []
  rule: |-
    After अनुगु (behind the cows), the **प्रत्यय** ख (ईन) marks "fit to follow": अनुगवीनः, a cowherd.
- id: '52016'
  ref: 5.2.16
  a: 5
  p: 2
  n: 16
  s: अध्वनो यत्खौ
  iast: adhvano yatkhau
  type: V
  typeName: vidhi
  pada:
  - अध्वनः
  - यत्-खौ
  adhikara: प्रत्ययः
  inherits:
  - word: तत्
    from: 5.2.7
  - word: अलंगामी
    from: 5.2.15
  feeds:
  - word: यत्-खौ
    to: 5.2.17
  meaning: ''
  kashika: |-
    तदिति द्वितीया समर्थविभक्तिरनुवर्तते। अलंगामीति च प्रत्ययार्थः। अध्वन्शब्दाद् द्वितीयासमर्थादलंगामीत्येतस्मिन्नर्थे यत्खौ प्रत्ययौ भवतः। अध्वानमलंगामी अध्वन्यः, अध्वनीनः। <<ये चाभावकर्मणोः>> [[६.४.१६८]], <<आत्माध्वानौ खे>> [[६.४.१६९]] इति प्रकृतिभावः॥
  vartika: []
  rule: |-
    After अध्वन् (accusative), the **प्रत्यय**s यत् (य) and ख (ईन) mark "fit to travel it": अध्वन्यः, अध्वनीनः.
- id: '52017'
  ref: 5.2.17
  a: 5
  p: 2
  n: 17
  s: अभ्यमित्राच्छ च
  iast: abhyamitrāccha ca
