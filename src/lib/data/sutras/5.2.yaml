  meaning: ''
  kashika: |-
    छन्दसि विषये बहुलं विनिः प्रत्ययो भवति मत्वर्थे। अग्ने॑ तेजस्विन् (तै०सं० ३.३.१.१)। न भवति, सूर्यो वर्चस्वान्॥ छन्दसि विनिप्रकरणेऽष्ट्रामेखलाद्वयोभयरुजाहृदयानां दीर्घत्वं चेति वक्तव्यम्॥ अष्ट्॒रावी (ऋ०१०.१०२.८)। मेखलावी। द्वयावी। उभया॒वी (ऋ० ८.१.२)। रुजावी। हृदयावी। द्वयोभयहृदयानि दीर्घत्वं प्रयोजयन्ति॥ मर्मणश्चेति वक्तव्यम्॥ मर्मावी॥ सर्वत्रामयस्योपसंख्यानम्॥ छन्दसि भाषायां च। आमया॒वी (तै०सं० ३.२.३.३)॥ शृङ्गवृन्दाभ्यामारकन् वक्तव्यः॥ शृङ्गारकः। वृ॒न्दारकः (श०ब्रा० १४.६.११.१)॥ फलबर्हाभ्यामिनज् वक्तव्यः॥ फलिनः। बर्हिणः॥ हृदयाच्चालुरन्यतरस्याम्॥ हृदयालुः, हृदयी, हृदयिकः, हृदयवान्॥ शीतोष्णतृप्रेभ्यस्तद् न सहत इत्यालुज् वक्तव्यः॥ शीतं न सहते शीतालुः। उष्णालुः। तृप्रालुः॥ तद् न सहत इति हिमाच्चेलुः॥ हिमं न सहते हिमेलुः॥ बलादूलच्॥ बलं न सहते बलूलः॥ वातात् समूहे च वातं न सहत इति च॥ वातानां समूहः, वातं न सहत इति वा वातूलः॥ पर्वमरुद्भ्यां तन् वक्तव्यः॥ प॑र्व॒तः (मै०सं० ४.१२.५)। मरुत्तः॥ अर्थात् तदभाव इनिर्वक्तव्यः॥ अर्थी। तदभाव इत्येव — अर्थवान्। तदेतत् सर्वं बहुलग्रहणेन सम्पद्यते॥
  vartika:
