  - word: तत्र
    from: 5.2.63
  - word: कन्
    from: 5.2.64
  - word: प्रसिते
    from: 5.2.66
  feeds: []
  meaning: ''
  kashika: |-
    तत्रेत्येव, प्रसित इति च। उदरशब्दात् सप्तमीसमर्थात् प्रसित इत्येतस्मिन्नर्थे ठक् प्रत्ययो भवति। आद्यून इति प्रत्ययार्थविशेषणम्। उदरेऽविजिगीषुर्भण्यते। यो बुभुक्षयात्यन्तं पीड्यते, स एवमुच्यते। उदरे प्रसित औदरिक आद्यूनः। आद्यून इति किम्? उदरकः॥
  vartika: []
  rule: |-
    After उदर (seventh case, in the 'absorbed therein' sense), when the word means 'voracious', add **ठक्**: उदरे प्रसितः = औदरिकः. Only in the 'voracious' sense — not उदरकः 'abdominal'.
- id: '52068'
  ref: 5.2.68
  a: 5
  p: 2
  n: 68
  s: सस्येन परिजातः
  iast: sasyena parijātaḥ
  type: V
  typeName: vidhi
  pada:
  - सस्येन
  - परिजातः
  adhikara: प्रत्ययः
  inherits:
  - word: कन्
    from: 5.2.64
  feeds: []
  meaning: ''
  kashika: |-
    कन् प्रत्यय इत्येव स्वर्यते, न ठक् । निर्देशादेव तृतीया समर्थविभक्तिः। सस्यशब्दात् तृतीयासमर्थात् परिजात इत्यस्मिन्नर्थे कन् प्रत्ययो भवति। सस्यशब्दोऽयं गुणवाची। परिः सर्वतो भावे वर्तते। यो गुणैः संबद्धो जायते, यस्य किंचिदपि वैगुण्यं नास्ति, तस्येदमभिधानम्। सस्येन परिजातः सस्यकः शालिः। सस्यकः साधुः। सस्यको मणिः। आकरशुद्ध इत्यर्थः॥
  vartika: []
  rule: |-
    After सस्य 'fine quality' (third case), in the sense 'richly endowed with it', add **कन्**: सस्येन परिजातः = सस्यकः शालिः 'flawless rice', सस्यको मणिः.
- id: '52069'
  ref: 5.2.69
  a: 5
  p: 2
  n: 69
  s: अंशं हारी
  iast: aṃśaṃ hārī
  type: V
  typeName: vidhi
  pada:
  - अंशम्
  - हारी
  adhikara: प्रत्ययः
  inherits:
  - word: कन्
    from: 5.2.64
  feeds: []
  meaning: ''
  kashika: |-
    अंशशब्दाद् निर्देशादेव द्वितीयासमर्थाद् हारीत्येतस्मिन्नर्थे कन् प्रत्ययो भवति। अंशं हारी अंशको दायादः। अंशकः पुत्रः। हारीत्यावश्यके  णिनिः [[३.३.१७०]]। तत्र षष्ठीप्रतिषेधात् कर्मणि द्वितीयैव भवति॥
  vartika: []
  rule: |-
    After अंश 'a share' (accusative), in the sense 'who must take it', add **कन्**: अंशं हारी = अंशकः 'an heir'.
- id: '52070'
  ref: 5.2.70
  a: 5
  p: 2
  n: 70
  s: तन्त्रादचिरापहृते
  iast: tantrādacirāpahṛte
  type: V
  typeName: vidhi
  pada:
  - तन्त्रात्
  - अचिर-अपहृते
  adhikara: प्रत्ययः
  inherits:
  - word: कन्
    from: 5.2.64
  feeds: []
  meaning: ''
  kashika: |-
    तन्त्रशब्दाद् निर्देशादेव पञ्चमीसमर्थादचिरापहृत इत्येतस्मिन्नर्थे कन् प्रत्ययो भवति। अचिरापहृतः स्तोककालापहृत इत्यर्थः। तन्त्रादचिरापहृतः तन्त्रकः पटः। तन्त्रकः प्रावारः। प्रत्यग्रो नव उच्यते॥
  vartika: []
  rule: |-
    After तन्त्र 'a loom' (ablative), in the sense 'taken off it not long ago', add **कन्**: तन्त्रादचिरापहृतः = तन्त्रकः पटः 'a fresh, unbleached cloth'.
- id: '52071'
  ref: 5.2.71
  a: 5
  p: 2
  n: 71
  s: ब्राह्मणकोष्णिके संज्ञायाम्
  iast: brāhmaṇakoṣṇike saṃjñāyām
  type: V
  typeName: vidhi
  pada:
  - ब्राह्मणक-उष्णिके
  - संज्ञायाम्
  adhikara: प्रत्ययः
  inherits:
  - word: कन्
    from: 5.2.64
  feeds: []
  meaning: ''
  kashika: |-
    ब्राह्मणक उष्णिक इत्येतौ शब्दौ निपात्येते कन्प्रत्ययान्तौ संज्ञायां विषये। ब्राह्मणको देशः। उष्णिका यवागूः। यत्रायुधजीविनो ब्राह्मणाः सन्ति, तस्य ब्राह्मणक इति संज्ञा। अल्पान्ना यवागूरुष्णिकेत्युच्यते॥
  vartika: []
  rule: |-
    ब्राह्मण and उष्णिक, both with **कन्**, are irregular as a **संज्ञा**: ब्राह्मणक is a place where weapon-bearing Brahmanas live, उष्णिका is thin gruel.
- id: '52072'
  ref: 5.2.72
  a: 5
  p: 2
  n: 72
  s: शीतोष्णाभ्यां कारिणि
  iast: śītoṣṇābhyāṃ kāriṇi
  type: V
  typeName: vidhi
  pada:
  - शीत-उष्णाभ्याम्
  - कारिणि
  adhikara: प्रत्ययः
  inherits:
  - word: कन्
    from: 5.2.64
  feeds: []
  meaning: ''
  kashika: |-
    शीतोष्णशब्दाभ्यां कारिण्यभिधेये कन् प्रत्ययो भवति। क्रियाविशेषणाद् द्वितीयासमर्थादयं प्रत्ययः। शीतं करोति शीतकः। अलसो जड उच्यते। उष्णं करोति उष्णकः। शीघ्रकारी दक्ष उच्यते॥
  vartika: []
  rule: |-
    After शीत and उष्ण, **कन्** marks one who goes about a task that way: शीतक is a sluggard, उष्णक is brisk and able.
- id: '52073'
  ref: 5.2.73
  a: 5
  p: 2
  n: 73
  s: अधिकम्
  iast: adhikam
  type: V
  typeName: vidhi
  pada:
  - अधिकम्
  adhikara: प्रत्ययः
  inherits:
  - word: कन्
    from: 5.2.64
  feeds: []
  meaning: ''
  kashika: |-
    अधिकमिति निपात्यते। अध्यारूढशब्दस्योत्तरपदलोपः कंश्च प्रत्ययः। अधिको द्रोणः खार्याम्। अधिका खारी द्रोणेन। कर्तरि कर्मणि चाध्यारूढशब्दः॥
  vartika: []
  rule: |-
    अधिक, meaning 'more', is the irregular **कन्** form of अध्यारूढ with its second member dropped.
- id: '52074'
  ref: 5.2.74
  a: 5
  p: 2
  n: 74
  s: अनुकाभिकाभीकः कमिता
  iast: anukābhikābhīkaḥ kamitā
  type: V
  typeName: vidhi
  pada:
  - अनुक-अभिक-अभीकः
  - कमिता
  adhikara: प्रत्ययः
  inherits:
  - word: कन्
    from: 5.2.64
  feeds: []
  meaning: ''
  kashika: |-
    अनुक अभिक अभीक इत्येते शब्दाः कन्प्रत्ययान्ता निपात्यन्ते कमितेत्यस्मिन्नर्थे। अभेः पक्षे दीर्घत्वं च निपात्यते। अनुकामयत अनुकः। अभिकः। अभीकः॥
  vartika: []
  rule: |-
    अनुक, अभिक, अभीक, all with **कन्**, are irregular forms meaning one free to do or fond of doing (from कम्); अभीक also irregularly lengthens its vowel.
- id: '52075'
  ref: 5.2.75
  a: 5
  p: 2
  n: 75
  s: पार्श्वेनान्विच्छति
  iast: pārśvenānvicchati
  type: V
  typeName: vidhi
  pada:
  - पार्श्वेन
  - अन्विच्छति
  adhikara: प्रत्ययः
  inherits:
  - word: कन्
    from: 5.2.64
  feeds:
  - word: अन्विच्छति
    to: 5.2.76
  meaning: ''
  kashika: |-
    पार्श्वशब्दात् तृतीयासमर्थादन्विच्छतीत्यस्मिन्नर्थे कन् प्रत्ययो भवति। अनृजुरुपायः पार्श्वम्। तेनार्थानन्विच्छति पार्श्वकः। मायावी कौसृतिको जालिक उच्यते॥
  vartika: []
  rule: |-
    After पार्श्व ('a crooked trick'), **कन्** marks one who pursues his ends by it: पार्श्वक is a trickster, a deceiver.
- id: '52076'
  ref: 5.2.76
  a: 5
  p: 2
  n: 76
  s: अयःशूलदण्डाजिनाभ्यां ठक्ठञौ
  iast: ayaḥśūladaṇḍājinābhyāṃ ṭhakṭhañau
  type: V
  typeName: vidhi
  pada:
  - अयःशूल-दण्डाजिनाभ्याम्
  - ठक्ठञौ
  adhikara: प्रत्ययः
  inherits:
  - word: कन्
    from: 5.2.64
  - word: अन्विच्छति
    from: 5.2.75
  feeds: []
  meaning: ''
  kashika: |-
    अन्विच्छतीत्येव। अयः शूलदण्डाजिनाभ्यां तृतीयासमर्थाभ्यामन्विच्छतीत्येतस्मिन्नर्थे ठक्ठञौ प्रत्ययौ भवतः। तीक्ष्ण उपायोऽयःशूलमुच्यते। तेनान्विच्छति आयःशूलिकः। साहसिक इत्यर्थः। दम्भो दण्डाजिनम्, तेनान्विच्छति दाण्डाजिनिकः। दाम्भिक इत्यर्थः॥
  vartika: []
  rule: |-
    After अयःशूल and दण्डाजिन, **ठक्** and **ठञ्** respectively mark one who pursues his ends by that: आयःशूलिक is a man of violence, दाण्डाजिनिक is a hypocrite.
- id: '52077'
  ref: 5.2.77
  a: 5
  p: 2
  n: 77
  s: तावतिथं ग्रहणमिति लुग्वा
  iast: tāvatithaṃ grahaṇamiti lugvā
  type: V
  typeName: vidhi
  pada:
  - तावतिथम्
  - ग्रहणम्
  - इति
  - लुक्
  - वा
  adhikara: प्रत्ययः
  inherits:
  - word: कन्
    from: 5.2.64
  feeds: []
  meaning: ''
  kashika: |-
    तावतां पूरणं तावतिथम्। गृह्यतेऽनेनेति ग्रहणम्। प्रकृतिविशेषणं चैतत्। पूरणप्रत्ययान्तात् प्रातिपदिकाद् ग्रहणोपाधिकात् स्वार्थे कन् प्रत्ययो भवति। पूरणप्रत्ययस्य वा लुक्। द्वितीयेन रूपेण ग्रन्थं गृह्णाति द्विकं ग्रहणम्, द्वितीयकम्। त्रिकम्, तृतीयकम्। चतुष्कम्, चतुर्थकम्॥ तावतिथेन गृह्णातीति कन् वक्तव्यः, पूरणप्रत्ययस्य च नित्यं लुक्॥ षष्ठेन रूपेण ग्रन्थं गृह्णाति षट्को देवदत्तः। पञ्चकः। चतुष्कः। इतिकरणो विवक्षार्थः। तेन ग्रन्थविषयमेव ग्रहणं विज्ञायते, नान्यविषयम्॥
  vartika:
  - तावतिथेन गृह्णातीति कन्वक्तव्यो नित्यं च लुक् ।
  rule: |-
    After an ordinal, **कन्** marks mastery gained on that attempt, and the ordinal **प्रत्यय** optionally drops: द्विक or द्वितीयक ग्रहण, त्रिक or तृतीयक. (For the person who masters it on that attempt, the ordinal drop is fixed: षट्क देवदत्त.)
- id: '52078'
  ref: 5.2.78
  a: 5
  p: 2
  n: 78
  s: स एषां ग्रामणीः
  iast: sa eṣāṃ grāmaṇīḥ
  type: V
  typeName: vidhi
  pada:
  - सः
  - एषाम्
  - ग्रामणीः
  adhikara: प्रत्ययः
  inherits:
  - word: कन्
    from: 5.2.64
  feeds: []
  meaning: ''
  kashika: |-
    स इति प्रथमासमर्थादेषामिति षष्ठ्यर्थे कन् प्रत्ययो भवति, यत् तत् प्रथमासमर्थं ग्रामणीश्चेत् स भवति। ग्रामणीः प्रधानो मुख्य इत्यर्थः। देवदत्तो ग्रामणीरेषां देवदत्तकाः। यज्ञदत्तकाः। ग्रामणीरिति किम्? देवदत्तः शत्रुरेषाम्॥
  vartika: []
  rule: |-
    After a word in the nominative standing for the genitive, **कन्** marks 'he is their leader': देवदत्तक are those whose ग्रामणी is Devadatta.
- id: '52079'
  ref: 5.2.79
  a: 5
  p: 2
  n: 79
  s: शृङ्खलमस्य बन्धनं करभे
  iast: śṛṅkhalamasya bandhanaṃ karabhe
  type: V
  typeName: vidhi
  pada:
  - शृङ्खलम्
  - अस्य
  - बन्धनम्
  - करभे
  adhikara: प्रत्ययः
  inherits:
  - word: कन्
    from: 5.2.64
  feeds: []
  meaning: ''
  kashika: |-
    शृङ्खलशब्दात् प्रथमासमर्थादस्येति षष्ठ्यर्थे कन् प्रत्ययो भवति। यत् तत् प्रथमासमर्थं बन्धनं चेत् तद् भवति, यत् तदस्येति निर्दिष्टं करभश्चेत् स भवति। शृङ्खलं बन्धनमस्य करभस्य शृङ्खलकः। उष्ट्राणां बालकाः करभाः। तेषां काष्ठमयं पाशकं पादे व्यतिषज्यते, तदुच्यते शृङ्खलमिति। यद्यपि रज्ज्वादिकमपि तत्रास्ति तथापि शृङ्खलमस्यास्वतन्त्रीकरणे भवति साधनमिति बन्धनमित्युच्यते॥
  vartika: []
  rule: |-
    After शृङ्खल ('a wooden clog'), **कन्** marks 'the clog is its fetter', when the whole word means a young camel: शृङ्खलक.
- id: '52080'
  ref: 5.2.80
  a: 5
  p: 2
  n: 80
  s: उत्क उन्मनाः
  iast: utka unmanāḥ
  type: V
  typeName: vidhi
  pada:
  - उत्कः
  - उन्मनाः
  adhikara: प्रत्ययः
  inherits:
  - word: कन्
    from: 5.2.64
  feeds: []
  meaning: ''
  kashika: |-
    उत्क इति निपात्यते, उन्मनाश्चेत् स भवति। उद्गतं मनो यस्य स उन्मनाः। उच्छब्दात् ससाधनक्रियावचनात् तद्वति कन् प्रत्ययो निपात्यते। उत्को देवदत्तः। उत्कः प्रवासी। उत्सुक इत्यर्थः॥
  vartika: []
