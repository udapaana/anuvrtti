  s: श्रोत्रियंश्छन्दोऽधीते
  iast: śrotriyaṃśchando'dhīte
  type: V
  typeName: vidhi
  pada:
  - श्रोत्रियन्
  - छन्दः
  - अधीते
  adhikara: प्रत्ययः
  inherits: []
  feeds: []
  meaning: ''
  kashika: |-
    श्रोत्रियन्निति निपात्यते छन्दोऽधीत इत्यस्मिन्नर्थे। नकारः स्वरार्थः। श्रोत्रियो ब्राह्मणः। श्रोत्रियंश्छन्दोऽधीत इति वाक्यार्थे पदवचनम्, छन्दसो वा श्रोत्रभावः, तदधीत इति घंश्च प्रत्ययः। कथं छन्दोऽधीते छान्दसः ? वाग्रहणमनुवर्तते <<तावतिथं ग्रहणमिति लुग् वा>> [[५.२.७७]] इत्यतः॥
  vartika: []
  rule: |-
    श्रोत्रिय, ending in irregular **घन्** (with न् for accent), means one who has studied the **छन्दस्**: श्रोत्रिय ब्राह्मण.
- id: '52085'
