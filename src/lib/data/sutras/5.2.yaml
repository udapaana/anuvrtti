    उत्क, the irregular **कन्** form of उद्, means longing, yearning: उत्क देवदत्त is the man whose mind reaches out (उन्मनस्).
- id: '52081'
  ref: 5.2.81
  a: 5
  p: 2
  n: 81
  s: कालप्रयोजनाद्रोगे
