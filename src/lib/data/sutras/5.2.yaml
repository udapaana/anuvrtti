    After साक्षात्, **इनि** marks an eyewitness, when the whole is a **संज्ञा**: साक्षिन्. The **संज्ञा** restricts it to the onlooker, not the giver or taker who also see the deed.
- id: '52092'
  ref: 5.2.92
  a: 5
  p: 2
  n: 92
  s: क्षेत्रियच् परक्षेत्रे चिकित्स्यः
  iast: kṣetriyac parakṣetre cikitsyaḥ
  type: V
  typeName: vidhi
  pada:
