# Adhyāya 5, Pāda 2 — 140 sūtras
sutras:
- id: '52001'
  ref: 5.2.1
  a: 5
  p: 2
  n: 1
  s: धान्यानां भवने क्षेत्रे खञ्
  iast: dhānyānāṃ bhavane kṣetre khañ
  type: V
  typeName: vidhi
  pada:
  - धान्यानाम्
  - भवने
  - क्षेत्रे
  - खञ्
  adhikara: प्रत्ययः
  inherits: []
  feeds:
  - word: धान्यानाम्
    to: 5.2.2
  - word: भवने
    to: 5.2.2
  - word: क्षेत्रे
    to: 5.2.2
  - word: धान्यानाम्
    to: 5.2.3
  - word: भवने
    to: 5.2.3
  - word: क्षेत्रे
    to: 5.2.3
  - word: धान्यानाम्
    to: 5.2.4
  - word: भवने
    to: 5.2.4
  - word: क्षेत्रे
    to: 5.2.4
  meaning: ''
  kashika: |-
    निर्देशादेव समर्थविभक्तिः। धान्यविशेषवाचिभ्यः षष्ठीसमर्थेभ्यो भवनेऽभिधेये खञ् प्रत्ययो भवति, तच्चेद् भवनं क्षेत्रं भवति। भवनमिति भवन्ति जायन्तेऽस्मिन्निति भवनम्। मुद्गानां भवनं क्षेत्रं मौद्गीनम्। कौद्रवीणम्। कौलत्थीनम्। धान्यानामिति किम् ? तृणानां भवनं क्षेत्रमित्यत्र न भवति। क्षेत्रमिति किम् ? मुद्गानां भवनं कुसूलम्। बहुवचनं स्वरूपविधिनिरासार्थम्॥
  vartika: []
  rule: |-
    After the name of a particular grain in the genitive, **खञ्** marks the field where it grows: मुद्ग → मौद्गीनम् क्षेत्रम्.
- id: '52002'
  ref: 5.2.2
  a: 5
  p: 2
  n: 2
  s: व्रीहिशाल्योर्ढक्
  iast: vrīhiśālyorḍhak
  type: V
  typeName: vidhi
  pada:
  - व्रीहि-शाल्योः
  - ढक्
  adhikara: प्रत्ययः
  inherits:
  - word: धान्यानाम्
    from: 5.2.1
  - word: भवने
    from: 5.2.1
  - word: क्षेत्रे
    from: 5.2.1
  feeds: []
  meaning: ''
  kashika: |-
    व्रीहिशालिशब्दाभ्यां ढक्  प्रत्ययो भवति भवने क्षेत्रेऽभिधेये। खञोऽपवादः। व्रीहीणां भवनं क्षेत्रं वै्रहेयम्। शालेयम्॥
  vartika: []
  rule: |-
    After व्रीहि and शालि, **ढक्** marks the field where they grow: व्रीहि → व्रैहेयम्, शालि → शालेयम्.
- id: '52003'
  ref: 5.2.3
  a: 5
  p: 2
  n: 3
  s: यवयवकषष्टिकाद्यत्
  iast: yavayavakaṣaṣṭikādyat
  type: V
  typeName: vidhi
  pada:
  - यव-यवक-षष्टिकात्
  - यत्
  adhikara: प्रत्ययः
  inherits:
  - word: धान्यानाम्
    from: 5.2.1
  - word: भवने
    from: 5.2.1
  - word: क्षेत्रे
    from: 5.2.1
  feeds: []
  meaning: ''
  kashika: |-
    यवादिभ्यः शब्देभ्यो यत् प्रत्ययो भवति भवने क्षेत्रेऽभिधेये। खञोऽपवादः। यवानां भवनं क्षेत्रं यव्यम्। यवक्यम्। षष्टिक्यम्॥
  vartika: []
  rule: 'After यव, यवक, षष्टिक, **यत्** marks the field where they grow: यव → यव्यम्.'
- id: '52004'
  ref: 5.2.4
  a: 5
  p: 2
  n: 4
  s: विभाषा तिलमाषोमाभङ्गाऽणुभ्यः
  iast: vibhāṣā tilamāṣomābhaṅgā'ṇubhyaḥ
  type: V
  typeName: vidhi
  pada:
  - विभाषा
  - तिल-माष-उमा-भङ्गा-अणुभ्यः
  adhikara: प्रत्ययः
  inherits:
  - word: धान्यानाम्
    from: 5.2.1
  - word: भवने
    from: 5.2.1
  - word: क्षेत्रे
    from: 5.2.1
  feeds: []
  meaning: ''
  kashika: |-
    तल माष उमा भङ्गा अणु इत्येतेभ्यो विभाषा यत् प्रत्ययो भवति भवने क्षेत्रेऽभिधेये। खञि प्राप्ते वचनम्, पक्षे सोऽपि भवति। उमाभङ्गयोरपि धान्यत्वमाश्रितमेव। तिल माष उमा भङ्गा अणु — एषां भवनं क्षेत्रं तिल्यम्, तैलीनम्। माष्यम्, माषीणम्। उम्यम्, औमीनम्। भङ्ग्यम्, भाङ्गीनम्। अणव्यम्, आणवीनम्॥
  vartika: []
  rule: |-
    After तिल, माष, उमा, भङ्गा, अणु, **यत्** optionally marks the field where they grow (otherwise खञ्): तिल → तिल्यम् or तैलीनम्.
- id: '52005'
  ref: 5.2.5
  a: 5
  p: 2
  n: 5
  s: सर्वचर्मणः कृतः खखञौ
  iast: sarvacarmaṇaḥ kṛtaḥ khakhañau
  type: V
  typeName: vidhi
  pada:
  - सर्व-चर्मणः
  - कृतः
  - ख-खञौ
  adhikara: प्रत्ययः
  inherits: []
  feeds: []
  meaning: ''
  kashika: |-
    सर्वचर्मन्शब्दात् तृतीयासमर्थात् कृत इत्यस्मिन्नर्थे खखञौ प्रत्ययौ भवतः। सर्वशब्दश्चात्र प्रत्ययार्थेन कृतेन संबध्यते, न चर्मणा। तत्रायमसमर्थसमासो द्रष्टव्यः। सर्वश्चर्मणा कृत इत्येतस्मिन् वाक्यार्थे वृत्तिः। सर्वचर्मीणः। सार्वचर्मीणः॥
  vartika: []
  rule: |-
    After सर्वचर्मन् (instrumental), **ख** (ईन) and **खञ्** mark "wholly made of that": सर्वचर्मन् → सर्वचर्मीणः or सार्वचर्मीणः.
