    kashika: |-
      तः परो यस्मात् सोऽयं तपरः, तादपि परस्तपरः। तपरो वर्णस्तत्कालस्यात्मना तुल्यकालस्य गुणान्तरयुक्तस्य सवर्णस्य ग्राहको भवति, स्वस्य च रूपस्य। विध्यर्थमिदम्। अणिति नानुवर्तते। अणामन्येषां च तपराणाम् इदमेव ग्रहणकशास्त्रम्। <<अतो भिस ऐस्>> [[७.१.९]] इत्येवमादिषु पूर्वग्रहणकशास्त्रं न प्रवर्तत एव। अतपरा अणस्तस्यावकाशः। किमुदाहरणम्? <<अतो भिस ऐस्>> [[७.१.९]] — वृक्षैः। प्लक्षैः। <<विड्वनोरनुनासिकस्यात्>> [[६.४.४१]] — अब्जाः। गोजाः। (ऋ० ४.४०.५) तत्कालस्येति किम्? खट्वाभिः। मालाभिः॥
    vartika: []
    rule: |-
      A letter with **त्** next to it stands only for **सवर्ण** letters of its own length, plus its own form.
