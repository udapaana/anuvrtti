    kashika: |-
      शे इत्येतत्  प्रगृह्यसंज्ञं भवति। किमिदं शे इति ? सुपामादेशश्छन्दसि [[७.१.३९]]। न यु॒ष्मे वा॑जबन्धवः (ऋ० ८.६८.१९)। अ॒स्मे इ॑न्द्राबृहस्पती (ऋ० ४.४९.४)। युष्मे इति (ऋ० पादपाठः)। अस्मे इति (ऋ० पादपाठः)। त्वे रायः॒ (तै० सं० ३२.५.२), मे रायः॒ (वाज० सं० ४.२२)। त्वे इति (तै० सं० पदपाठः) । मे इति (वाज० सं० पदपाठः) । छान्दसमेतदेवैकमुदाहरणम्  अ॒स्मे इ॑न्द्राबृहस्पती  (ऋ० ४.४९.४)  इति। तत्र तथा पाठात्।  इतरत्तु लौकिकमनुकरणम् । युष्मे इति। अस्मे इति। त्वे इति। मे इति॥
    vartika: []
    rule: The affix शे (its real form is ए) is **प्रगृह्य**.
  - id: "11014"
