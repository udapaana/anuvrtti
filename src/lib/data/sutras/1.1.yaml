    meaning: |-
      A टित्-आगम is attached before its substrate, and a कित्-आगम comes after its substrate.
    kashika: |-
      आदिष्टिद् भवति अन्तःकिद् भवति षष्ठीनिर्दिष्टस्य। लविता। मुण्डो भीषयते। टित्प्रदेशाः — <<आर्धधातुकस्येड् वलादेः>>[[७.२.३५]] इत्येवमादयः। कित्प्रदेशाः — <<भियो हेतुभये षुक्>> [[७.३.४०]] इत्येवमादयः॥
    vartika: []
    rule: |-
      An **आगम** marked with ट् goes at the front of what it augments; one marked with क् goes at the end.
