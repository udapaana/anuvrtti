    kashika: |-
      एकश्चासावच्चेत्येकाच् । निपातो य एकाच्  आङ्वर्जितःस  प्रगृह्यसंज्ञो भवति। अ अपेहि। इ इन्द्रं पश्य। उ उत्तिष्ठ। आ एवं नु मन्यसे (म० भा० १.१.१४) । आ एवं किल तत् (म० भा० १.१.१४)। निपात इति किम् ? चकारात्र। जहारात्र। एकाजिति किम्? प्राग्नये॒ वाच॑मीरय (ऋ०१०.१८७.१)। अनाङिति किम्? आ उदकान्तात् ओदकान्तात् ।

      ईषदर्थे क्रियायोगे मर्यादाभिविधौ च यः।

      एतमातं ङितं विद्याद्वाक्यस्मरणयोरङित्॥(म० भा० १.१.१४)
