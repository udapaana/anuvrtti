      The कार्य associated with a प्रत्यय happens even when the प्रत्यय undergoes a लोप.
    kashika: |-
      प्रत्ययनिमित्तं कार्यमसत्यपि प्रत्यये कथं नु नाम स्यादिति सूत्रमिदमारभ्यते। प्रत्ययलोपे कृते प्रत्ययलक्षणं प्रत्ययहेतुकं कार्यं भवति। अग्निचित्, सोमसुत्, अधोगित्यत्र सुप्तिङोर्लुप्तयोः <<सुप्तिङन्तं पदम्>> [[१.४.१४]] इति पदसंज्ञा भवति। अधोगिति दुहेर्लङि तिपि शब्लुकि तिलोपे घत्वभष्भावजश्त्वचर्त्वेषु कृतेषु रूपम्। प्रत्यय इति वर्तमाने पुनः प्रत्ययग्रहणं किम्? कृत्स्नप्रत्ययलोपे यथा स्यात्। इह मा भूत् — आघ्नीय। सङ्ग्मीय। (का०सं० ६.९)। हनिगम्योर्लिङात्मनेपदे <<लिङः सलोपोऽनन्त्यस्य>> [[७.२.७९]] इति सीयुट्सकारलोपः प्रत्ययैकदेशलोपः, तत्र प्रत्ययलक्षणेन झलि [[६.४.३७]] इत्यनुनासिकलोपो न भवति। प्रत्ययलक्षणमिति किम्? रायः कुलं रैकुलम्। गवे हितं गोहितम्। (म० भा० १.१.६२) आयवादेशौ न भवतो वर्णाश्रयत्वात्॥
    vartika:
      - वर्णाश्रये नास्ति प्रत्ययलक्षणम् ।
    rule: |-
      After a **प्रत्यय** is dropped by **लोप**, rules still act as if it were there. (The dropped affix keeps causing whatever it would have caused.)
