      \ भवति, न चेज्ज्ञातिधनयोस्संज्ञारूपेण वर्तते। स्वे पुत्राः, स्वाः पुत्राः। स्वे गावः, स्वा गावः। आत्मीया\
      \ इत्यर्थः। ज्ञातिप्रतिषेधः इति किम्? \n\nधूमायन्त इवाश्लिष्टाः प्रज्वलन्तीव संहताः।\n\nउल्मुकानीव\
      \ मेऽमी स्वा ज्ञातयो भरतर्षभ॥ (महाभारत ५.३६.३८)\n\nअधनाख्यायामिति किम्? प्रभूताः स्वा न दीयन्ते। प्रभूताः\
      \ स्वा न भुज्यन्ते। प्रभूतानि धनानीत्यर्थः॥"
    vartika: []
    rule: |-
      Before **जस्**, स्व is optionally **सर्वनाम** when it does not mean a kinsman or wealth.
