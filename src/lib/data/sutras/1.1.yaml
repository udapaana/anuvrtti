    type: AT
    typeName: atideśa
    pada:
      - न
      - पदान्त-द्विर्वचन-वरे-यलोप-स्वर-सवर्ण-अनुस्वार-दीर्घ-जश्-चर्-विधिषु
    adhikara: ""
    inherits:
      - word: स्थानिवत्
        from: 1.1.56
      - word: आदेशः
        from: 1.1.56
      - word: अचः
        from: 1.1.57
      - word: परस्मिन्पूर्वविधौ
