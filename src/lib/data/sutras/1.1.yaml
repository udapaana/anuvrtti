    kashika: |-
      ईत् ऊत् एत् इत्येवमन्तं द्विवचनं शब्दरूपं प्रगृह्यसंज्ञं भवति। अग्नी इति। वायू इति। माले इति। पचेते इति। पचेथे इति। ईदूदेदिति किम्? वृक्षावत्र। प्लक्षावत्र। द्विवचनमिति किम्? कुमार्यत्र। किशोर्यत्र। तपरकरणमसंदेहार्थम् । प्रगृह्यप्रदेशाः — <<प्लुतप्रगृह्या अचि नित्यम्>> [[६.१.१२५]] इत्येवमादयः। ईदादीनां प्रगृह्यत्वे मणीवादीनां प्रतिषेधो वक्तव्यः।

      मणीवोष्ट्रस्य लम्बेते प्रियौ वत्सतरौ मम (महाभारत १२.१७७.१२)।

      दम्प॑तीव (ऋ०२.३९.२)। जम्पतीव। रोदसीव॥
    vartika: []
    rule: A dual ending in ई, ऊ, or ए is **प्रगृह्य** — it takes no सन्धि.
