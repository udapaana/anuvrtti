    meaning: |-
      The words of the स्वरादिगण and the words which are called 'निपात' are all also known as 'अव्यय'.
    kashika: |-
      स्वरादीनि शब्दरूपाणि निपाताश्चाव्ययसंज्ञानि भवन्ति। स्वर्, अन्तर्, प्रातर् एते अन्तोदात्ताः पठ्यन्ते। पुनर् आद्युदात्तः। सनुतर्, उच्चैस्, नीचैस्, शनैस्, ऋधक्, आरात्, ऋते, युगपत्, पृथक् एतेऽपि सनुतर्प्रभृतयोऽन्तोदात्ताः पठ्यन्ते। ह्यस्, श्वस्, दिवा, रात्रौ, सायम्, चिरम्, मनाक्, ईषत्, जोषम्, तूष्णीम्, बहिस्, आविस्, अवस्, अधस्, समया, निकषा, स्वयम्, मृषा, नक्तम्, नञ्, हेतौ, अद्धा, इद्धा, सामि एतेऽपि ह्यस्प्रभृतयोऽन्तोदात्ताः पठ्यन्ते। वत् (ग०सू० ४), वदन्तमव्ययसंज्ञं भवति। ब्राह्मणवत्। क्षत्रियवत्। सन्, सनात्, सनत्, तिरस् एते आद्युदात्ताः पठ्यन्ते। अन्तरा अयमन्तोदात्तः। अन्तरेण, ज्योक्, कम्, शम्, सना, सहसा, विना, नाना, स्वस्ति, स्वधा, अलम्, वषट्, अन्यत्, अस्ति, उपांशु, क्षमा, विहायसा, दोषा, मुधा, मिथ्या। क्त्वातोसुन्कसुनः (ग०सू० ५), कृन्मकारान्तः सन्ध्यक्षरान्तः (ग०सू० ६), अव्ययीभावश्च (ग०सू० ७), पुरा, मिथो, मिथस्, प्रबाहुकम्, आर्यहलम्, अभीक्ष्णम्, साकम्, सार्द्धम्, समम्, नमस्, हिरुक्। तसिलादिः तद्धित एधाच्पर्यन्तः (ग०सू० ८), शस्तसी (ग०सू० ९), कृत्वसुच् (ग०सू० १०), सुच् (ग०सू० ११), आस्थालौ (ग०सू० १२), च्व्यर्थाश्च (ग०सू० १३), अम् (ग०सू० १४), आम् (ग०सू० १५), प्रतान्, प्रशान्। स्वरादिः। निपाता वक्ष्यन्ते — <<प्राग्रीश्वरान्निपाताः>> [[१.४.५६]] इति। च, वा, ह, अह, एव, एवमित्यादयः। अव्ययप्रदेशाः — <<अव्ययादाप्सुपः>>[[२.४.८२]] इत्येवमादयः।'अव्ययम्''इत्यन्वर्थसंज्ञा'।

      सदृशं त्रिषु लिङ्गेषु सर्वासु च विभक्तिषु।

      वचनेषु च सर्वेषु यन्न व्येति तदव्ययम्॥ (गो०ब्रा० १.१.२६)
    vartika: []
    rule: The words स्वर् and the rest, and the **निपात** particles, are **अव्यय**.
