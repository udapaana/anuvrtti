    kashika: |-
      <<विभाषा जसि>> [[१.१.३२]] इति वर्त्तते। द्वन्द्वे(१.१.३१) इति निवृत्तम्। प्रथम चरम तय अल्प अर्ध कतिपय नेम-इत्येते जसि विभाषा सर्वनामसंज्ञा भवन्ति। प्रथमे, प्रथमाः। चरमे, चरमाः। द्वितये, द्वितयाः। अल्पे, अल्पाः। अर्धे, अर्धाः। कतिपये, कतिपयाः। नेमे, नेमाः। 'तय' इति तयप्प्रत्ययः। शिष्टानि प्रातिपदिकानि। तत्र 'नेम' इति सर्वादिषु पठ्यते, तस्य प्राप्ते विभाषा, अन्येषामप्राप्ते। उभयशब्दस्य तयप्प्रत्ययान्तस्य गणे पाठान्नित्या सर्वनामसंज्ञा इहापि जस्कार्यं प्रति विभाषा। काकचोर्यथायोगं वृत्तिः॥
    vartika: []
    rule: |-
      Before **जस्**, the words प्रथम, चरम, a word ending in **तय**, अल्प, अर्ध, कतिपय, and नेम are optionally **सर्वनाम**.
