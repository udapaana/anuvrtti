    meaning: |-
      The word  'अन्तर', when used in the meaning of 'outside a certain place' or 'undergarment', is optionally called 'सर्वनाम' when followed by the 'जस्' प्रत्यय.
    kashika: |-
      अत्रापि पूर्वेण नित्या सर्वनामसंज्ञा प्राप्ता सा जसि विभाष्यते। अन्तरमित्येतच्छब्दरूपं विभाषा जसि सर्वनामसंज्ञं भवति बहिर्योगे उपसंव्याने च गम्यमाने। अन्तरे गृहाः, अन्तरा गृहाः। नगरबाह्याश्चाण्डालादिगृहा उच्यन्ते।[उपसंव्याने-]अन्तरे शाटकाः, अन्तराः शाटकाः। उपसंव्यानं  परिधानीयमुच्यते, न प्रावरणीयम्। बहिर्योगोपसंव्यानयोरिति किम्? अनयोर्ग्रामयोरन्तरे तापसः प्रतिवसति। तस्मिन्नन्तरे शीतान्युदकानि। मध्यप्रदेशवचनोऽन्तरशब्दः। गणसूत्रस्य चेदं प्रत्युदाहरणम्॥ अपुरीति च वक्तव्यम्(म•भा•१.१.३६ वा •)॥[इह मा भूत्]-अन्तरायां पुरि वसति॥ विभाषाप्रकरणे तीयस्य वा ङित्सु सर्वनामसंज्ञेत्युपसंख्यानम् (म•भा•१.१.३६ वा•१)॥ द्वितीयस्मै, द्वितीयाय। तृतीयस्मै, तृतीयाय॥
    vartika:
      - अपुरीति वक्तव्यम् ।
      - विभाषाप्रकरणे तीयस्य ङित्सूपसंख्यानम् ।
    rule: |-
      Before **जस्**, अन्तर is optionally **सर्वनाम** when it means 'outer' or 'an under-garment'.
