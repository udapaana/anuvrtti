    meaning: |-
      According to Shakalya, the ओकार at end of the सम्बोधन-एकवचन form, when followed by the word 'इति' in a non vedic context, gets the term प्रगृह्य.
    kashika: |-
      ओदिति वर्तते । संबुद्धिनिमित्तो य ओकारः स शाकल्यस्याचार्यस्य मतेन प्रगृह्यसंज्ञो भवति, इति शब्देऽनार्षेऽवैदिके परतः। वायो इति, वायविति (ऋ० ४.४६.१)। भानो इति, भानविति। संबुद्धाविति किम् ? गवित्ययमाह। अत्रानुकार्यानुकरणयोर्भेदस्याविवक्षितत्वादसत्यर्थवत्त्वे विभक्तिर्न भवति। शाकल्यग्रहणं विभाषार्थम् । इताविति किम् ? वायोऽत्र। अनार्ष इति किम्? एता गा ब्रह्मबन्ध इत्यब्रवीत्  (काठ०सं० १०.६)॥
    vartika: []
    rule: |-
      A vocative singular ending in ओ before इति is optionally **प्रगृह्य**, by शाकल्य, outside Vedic texts.
