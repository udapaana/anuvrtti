    feeds: []
    meaning:
      "The words 'पूर्व', 'पर', 'अवर', 'दक्षिण', 'उत्तर', 'अपर' and 'अधर'; when used in the sense\
      \ of 'limit' but not as a proper noun; are optionally called सर्वनाम when followed by the जस् प्रत्यय. "
    kashika: |-
      पूर्व पर अवर दक्षिण उत्तर अपर अधर इत्येतेषां गणे पाठात् पूर्वेण नित्यायां सर्वनामसञ्ज्ञायां प्राप्तायां जसि विभाषाऽऽरभ्यते। पूर्वादीनि विभाषा जसि सर्वनामसंज्ञानि भवन्ति व्यवस्थायामसंज्ञायाम्। स्वाभिधेयापेक्षावधिनियमो व्यवस्था। पूर्वे, पूर्वाः। परे, पराः। अवरे, अवराः। दक्षिणे, दक्षिणाः। उत्तरे, उत्तराः। अपरे, अपराः। अधरे, अधराः। व्यवस्थायामिति किम्? दक्षिणा इमे गाथकाः। प्रवीणा इत्यर्थः। असंज्ञायामिति किम्? उत्तराः कुरवः। सत्यामेव व्यवस्थायामियं तेषां संज्ञा॥
    vartika: []
    rule: |-
      Before **जस्**, the words पूर्व, पर, अवर, दक्षिण, उत्तर, अपर, अधर are optionally **सर्वनाम** when they mark relative position — not when they are names.
