# Adhyāya 1, Pāda 1 — 75 sūtras
sutras:
  - id: "11001"
    ref: 1.1.1
    a: 1
    p: 1
    n: 1
    s: वृद्धिरादैच्
    iast: vṛddhirādaic
    type: S
    typeName: saṃjñā
    pada:
      - वृद्धिः
      - आत्-ऐच्
    adhikara: ""
    inherits: []
    feeds:
      - word: वृद्धिः
        to: 1.1.3
    meaning: The letters आ, ऐ and  औ are called 'वृद्धि'.
    kashika: |-
      वृद्धिशब्दः संज्ञात्वेन विधीयते प्रत्येकमादैचां वर्णानां सामान्येन तद्भावितानामतद्भावितानां च। तपरकरणमैजर्थं तादपि परस्तपर इति, खट्वैडकादिषु त्रिमात्रचतुर्मात्रप्रसङ्गनिवृत्तये। आश्वलायनः। ऐतिकायनः। औपगवः। औपमन्यवः। शालीयः। मालीयः। वृद्धिप्रदेशाः — <<सिचि वृद्धिः परस्मैपदेषु>> [[७.२.१]] इत्येवमादयः॥
    vartika: []
    rule: आ, ऐ, औ are the **वृद्धि** vowels.
  - id: "11002"
    ref: 1.1.2
    a: 1
    p: 1
    n: 2
    s: अदेङ् गुणः
    iast: adeṅ guṇaḥ
    type: S
    typeName: saṃjñā
    pada:
      - अत्-एङ्
      - गुणः
    adhikara: ""
    inherits: []
    feeds:
      - word: गुणः
        to: 1.1.3
    meaning: The letters अ, ए and ओ are called 'गुण'.
    kashika: |-
      गुणशब्दः संज्ञात्वेन विधीयते प्रत्येकमदेङां वर्णानां सामान्येन तद्भावितानामतद्भावितानां च। तपरकरणं त्विह सर्वार्थम्। तरिता। चेता। स्तोता। पचन्ति। जयन्ति। अहं पचे।  गुणप्रदेशाः — <<मिदेर्गुणः>> [[७.३.८२]] इत्येवमादयः॥
    vartika: []
    rule: अ, ए, ओ are the **गुण** vowels.
  - id: "11003"
    ref: 1.1.3
    a: 1
    p: 1
    n: 3
    s: इको गुणवृद्धी
    iast: iko guṇavṛddhī
    type: P
    typeName: paribhāṣā
    pada:
      - इकः
      - गुण-वृद्धी
    adhikara: ""
    inherits:
      - word: वृद्धिः
        from: 1.1.1
      - word: गुणः
        from: 1.1.2
    feeds:
      - word: इकः
        to: 1.1.4
      - word: गुण-वृद्धी
        to: 1.1.4
      - word: इकः
        to: 1.1.5
      - word: गुण-वृद्धी
        to: 1.1.5
      - word: इकः
        to: 1.1.6
      - word: गुण-वृद्धी
        to: 1.1.6
    meaning: |-
      If the words गुण or वृद्धि are used to denote the operation of  गुणादेश or वृद्धि-आदेश without specifying where such an आदेश happens, then this आदेश should be done in place of the 'इक्' letter.
    kashika: |-
      परिभाषेयं स्थानिनियमार्था। अनियमप्रसङ्गे नियमो विधीयते। वृद्धिगुणौ स्वसंज्ञया शिष्यमाणाविक एव स्थाने वेदितव्यौ। वक्ष्यति — <<सार्वधातुकार्धधातुकयोः>> [[७.३.८४]] अङ्गस्य गुण इति। स इक एव स्थाने वेदितव्यः। तरति। नयति। भवति। वृद्धिः खल्वपि — अकार्षीत्। अहार्षीत्। अचैषीत्। अनैषीत्। अलावीत्। अस्तावीत्।गुणवृद्धी (यत्र) स्वसंज्ञया विधीयेते तत्र इक इति एतदुपस्थितं द्रष्टव्यम्। किं कृतं भवति? द्वितीयया षष्ठी प्रादुर्भाव्यते। मिदिमृजिपुगन्तलघूपधर्च्छिदृशिक्षिप्रक्षुद्रेष्वङ्गेनेग् विशेष्यते। जुसि सार्वधातुकादिगुणेष्विकाङ्गं विशेष्यते। मेद्यते। अबिभयुः। इक इति किम्? आत्सन्ध्यक्षरव्यञ्जनानां मा भूत् — यानम्। ग्लायति। उम्भिता। पुनर्गुणवृद्धिग्रहणं स्वसंज्ञया विधाने नियमार्थम्। इह मा भूत् — द्यौः। पन्थाः। सः। इममिति॥
    vartika: []
    rule: |-
      When a rule asks for **गुण** or **वृद्धि** but doesn't specify where, it changes the **इक्** vowel (इ, उ, ऋ, ऌ).
  - id: "11004"
    ref: 1.1.4
    a: 1
    p: 1
    n: 4
    s: न धातुलोप आर्धधातुके
    iast: na dhātulopa ārdhadhātuke
    type: V
    typeName: vidhi
    pada:
      - न
      - धातुलोपे
      - आर्धधातुके
    adhikara: ""
    inherits:
      - word: इकः
        from: 1.1.3
      - word: गुण-वृद्धी
        from: 1.1.3
    feeds:
      - word: न
        to: 1.1.5
      - word: न
        to: 1.1.6
    meaning: |-
      If a part of धातु gets removed due to an आर्धधातुक प्रत्यय, then that प्रत्यय cannot cause any  गुण or वृद्धि on the इक् letter of the remaining part of that धातु.
    kashika: |-
      धात्वेकदेशो धातुः, तस्य लोपो यस्मिन्नार्धधातुके तदार्धधातुकं धातुलोपं, तत्र ये गुणवृद्धी प्राप्नुतस्ते न भवतः। लोलुवः। पोपुवः। मरीमृजः। लोलूयादिभ्यो यङन्तेभ्यः पचाद्यचि [[३.१.१३४]] विहिते <<यङोचि च>> [[२.४.७४]] इति यङो लुकि कृते तमेवाचमाश्रित्य ये गुणवृद्धी प्राप्ते तयोः प्रतिषेधः। धातुग्रहणं किम्? लूञ् — लविता। रेड॑सि (वा०सं० ६.१८)। पर्णं नयेः। अनुबन्धप्रत्ययलोपे मा भूत्। रिषेर्हिंसार्थस्य विच्प्रत्ययलोप उदाहरणं रेडिति। आर्धधातुक इति किम्? त्रिधा॑ ब॒द्धो वृ॑ष॒भो रो॑रवीति (ऋ० ४.५.८३)। सार्वधातुके मा भूत्। इक इत्येव — अभाजि। रागः। बहुव्रीहिसमाश्रयणं किम्? क्नोपयति। प्रेद्धम्॥
    vartika: []
    rule: |-
      Before an **आर्धधातुक** affix that drops part of the root, **गुण** and **वृद्धि** changes don't happen.
  - id: "11005"
    ref: 1.1.5
    a: 1
    p: 1
    n: 5
    s: क्ङिति च
    iast: kṅiti ca
    type: V
    typeName: vidhi
    pada:
      - क्ङिति
      - च
    adhikara: ""
    inherits:
      - word: इकः
        from: 1.1.3
      - word: गुण-वृद्धी
        from: 1.1.3
      - word: न
        from: 1.1.4
    feeds: []
    meaning: |
      In presence of a कित्,  गित् or a ङित् प्रत्यय, any गुण or वृद्धि that might happen on an इक्-letter of an अङ्ग is prohibited.
    kashika: |-
      निमित्तसप्तम्येषा। क्ङिन्निमित्ते ये गुणवृद्धी प्राप्नुतस्ते न भवतः। चितः। चितवान्। स्तुतः। स्तुतवान्। भिन्नः। भिन्नवान्। मृष्टः। मृष्टवान्। ङिति खल्वपि — चिनुतः, चिन्वन्ति। मृष्टः, मृजन्ति। गकारोप्यत्र चर्त्वभूतो निर्दिश्यते। <<ग्लाजिस्थश्च क्स्नुः>> [[३.२.१३९]] — जिष्णुः। भूष्णुः। इक इत्येव — कामयते। लैगवायनः। मृजेरजादौ संक्रमे विभाषा वृद्धिरिष्यते। संक्रमो नाम गुणवृद्धिप्रतिषेधविषयः। परिमृजन्ति, परिमार्ज्जन्ति। परिमृजन्तु, परिमार्ज्जन्तु। लघूपधगुणस्याप्यत्र प्रतिषेधः। अचिनवमसुनवमित्यादौ लकारस्य सत्यपि ङित्वे यासुटो ङिद्वचनं ज्ञापकं ङिति यत्कार्यं तल्लकारे ङिति न भवतीति॥
    vartika: []
    rule: A **कित्** or **ङित्** affix blocks **गुण** and **वृद्धि**.
  - id: "11006"
    ref: 1.1.6
    a: 1
    p: 1
    n: 6
    s: दीधीवेवीटाम्
    iast: dīdhīvevīṭām
    type: V
    typeName: vidhi
    pada:
      - दीधी-वेवी-इटाम्
    adhikara: ""
    inherits:
      - word: इकः
        from: 1.1.3
      - word: गुण-वृद्धी
        from: 1.1.3
      - word: न
        from: 1.1.4
    feeds: []
    meaning:
      "The इक् letter of - (a) the verb दीधीङ्,  (b) The verb वेवीङ् , and (c) इडागम - do not undergo\
      \ a गुण or a वृद्धि. "
    kashika: |-
      दीधीवेव्योरिटश्च ये गुणवृद्धी प्राप्नुतस्ते न भवतः। आदीध्यनम्। आदीध्यकः। आवेव्यनम्। आवेव्यकः । इटः खल्वपि — कणिता श्वः, रणिता श्वः। वृद्धिरिटो न संभवतीति लघूपधगुणस्यात्र प्रतिषेधः॥
    vartika: []
    rule: दीधी, वेवी, and the augment **इट्** never take **गुण** or **वृद्धि**.
  - id: "11007"
    ref: 1.1.7
    a: 1
    p: 1
    n: 7
    s: हलोऽनन्तराः संयोगः
    iast: halo'nantarāḥ saṃyogaḥ
    type: S
    typeName: saṃjñā
    pada:
      - हलः
      - अनन्तराः
      - संयोगः
    adhikara: ""
    inherits: []
    feeds: []
    meaning:
      "Group of two or more  व्यञ्जनानि pronounced together without any स्वर or a pause between them\
      \ is referred as संयोग. "
    kashika: |-
      भिन्नजातीयैरज्भिरव्यवहिताः श्लिष्टोच्चारिता हलः संयोगसंज्ञा भवन्ति। समुदायः संज्ञी। जातौ चेदं बहुवचनम्, तेन द्वयोर्बहूनां च संयोगसंज्ञा सिद्धा भवति। अग्निरिति गनौ। अश्व इति शवौ। कर्ण इति रणौ। इन्द्रश्चन्द्रो मन्द्र इति नदराः। उष्ट्रो राष्ट्रं भ्राष्ट्रमिति षटराः। तिलान्स्त्र्यावपतीति नसतरयाः, नतसतरया वा। हल इति किम्? तितउच्छत्रम्। <<संयोगान्तस्य लोपः>> [[८.२.२३]] इति लोपः स्यात्। अनन्तरा इति किम्? पचति। पनसम्।  <<स्कोः संयोगाद्योः०>>[[८.२.२९]] इति लोपः स्यात्। संयोगप्रदेशाः — <<संयोगान्तस्य लोपः>> [[८.२.२३]] इत्येवमादयः॥
    vartika: []
    rule: Neighboring consonants (with no vowel between them) are **संयोग**.
  - id: "11008"
    ref: 1.1.8
    a: 1
    p: 1
    n: 8
    s: मुखनासिकावचनोऽनुनासिकः
    iast: mukhanāsikāvacano'nunāsikaḥ
    type: S
    typeName: saṃjñā
    pada:
      - मुख-नासिका-वचनः
      - अनुनासिकः
    adhikara: ""
    inherits: []
    feeds: []
    meaning: |-
      A letter whose pronunciation needs the usage of nose as well as mouth is called an अनुनासिक.
    kashika: |-
      मुखसहिता नासिका मुखनासिका, तया च उच्चार्यते वर्णः सोऽनुनासिकसंज्ञो भवति। <<आङोऽनुनासिकश्छन्दसि>> [[६.१.१२६]] — अ॒भ्र आँ अ॒पः (ऋ० ५.४८.१)। ग॒भी॒र आँ उग्र॑पुत्रे (ऋ० ८.६७.११)। च न आँ इन्द्रः। मुखग्रहणं किम्? अनुस्वारस्यैव हि स्यात्। नासिकाग्रहणं किम्? कचटतपानां मा भूत्। अनुनासिकप्रदेशाः — <<आङोऽनुनासिकश्छन्दसि>> [[६.१.१२६]] इत्येवमादयः॥
    vartika: []
    rule: A sound made through the nose along with the mouth is **अनुनासिक**.
  - id: "11009"
    ref: 1.1.9
    a: 1
    p: 1
    n: 9
    s: तुल्यास्यप्रयत्नं सवर्णम्
    iast: tulyāsyaprayatnaṃ savarṇam
    type: S
    typeName: saṃjñā
    pada:
      - तुल्य-आस्य-प्रयत्नम्
      - सवर्णम्
    adhikara: ""
    inherits: []
    feeds:
      - word: सवर्णम्
        to: 1.1.10
    meaning: |-
      Two letters are called सवर्ण of each other if their mouth-based location of pronunciation and their आभ्यन्तरप्रयत्न are same as of each other.
    kashika: |-
      तुल्यशब्दः सदृशपर्यायः । आस्ये भवमास्यं, ताल्वादिस्थानम्। प्रयतनं प्रयत्नः स्पृष्टतादिर्वर्णगुणः। तुल्य आस्ये प्रयत्नो यस्य वर्णस्य येन वर्णेन सह स समानजातीयं प्रति सवर्णसंज्ञो भवति। चत्वार आभ्यन्तराः प्रयत्नाः सवर्णसंज्ञायामाश्रीयन्ते। स्पृष्टता, ईषत्स्पृष्टता, संवृतता, विवृतता चेति। अ अ अ इति त्रयोऽकारा उदात्तानुदात्तस्वरिताः प्रत्येकं सानुनासिका निरनुनासिकाश्च ह्रस्वदीर्घप्लुतभेदादष्टादशधा भिद्यन्ते। तथेवर्णः। तथोवर्णः। तथा ऋवर्णः। ऌवर्णस्य दीर्घा न सन्ति। तं द्वादशप्रभेदमाचक्षते। सन्ध्यक्षराणां ह्रस्वा न सन्ति, तान्यपि द्वादशप्रभेदानि। अन्तःस्था द्विप्रभेदाः रेफवर्जिता यवलाः सानुनासिका निरनुनासिकाश्च। रेफोष्मणां सवर्णा न सन्ति। वर्ग्यो वर्ग्येण सवर्णः। दण्डाग्रम्। खट्वाग्रम्। आस्यग्रहणं किम्? कचटतपानां भिन्नस्थानानां तुल्यप्रयत्नानां मा भूत्। किं च स्यात् ? तर्प्ता, तर्प्तुमित्यत्र <<झरो झरि सवर्णे>> [[८.४.६५]] इति पकारस्य तकारे लोपःस्यात् । प्रयत्नग्रहणं किम् ? इचुयशानां तुल्यस्थानानां भिन्नप्रयत्नानां मा भूत् । किं च स्यात् ? अरुश्च्योततीत्यत्र <<झरो झरि सवर्णे>>[[८.४.६५]] इति शकारस्य चकारे लोपः स्यात्॥ ऋकारऌकारयोः सवर्णसंज्ञा वक्तव्या॥ होतृ ऌकारः — होतृृकारः। उभयोर्ऋवर्णस्य ऌवर्णस्य चान्तरतमः सवर्णो दीर्घो नास्तीति ऋकार एव दीर्घो भवति। सवर्णप्रदेशाः — <<अकः सवर्णे दीर्घः>> [[६.१.१०१]] इत्येवमादयः॥
    vartika:
      - ऋऌवर्णयोर्मिथः सावर्ण्यं वाच्यम् ।
    rule: |-
      Two sounds with the same place and the same effort of articulation are **सवर्ण**.
  - id: "11010"
