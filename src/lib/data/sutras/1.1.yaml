    feeds: []
    meaning: |-
      An आदेश done in place of an अच् letter due to the परनिमित्त never acts like a स्थानी; even for the single-letter-कार्याणि done on an entity prior to the location of the स्थानी; in the context of -  (1) पदान्तकार्य  (2) द्वित्वकार्य  (3) 'वरच्' प्रत्ययकार्य (4) यकारलोप  (5) स्वरविधि (6) सवर्णकार्य (7) अनुस्वारविधि (8) दीर्घादेशकार्य (9) जश्त्वकार्य and (10) चर्त्वकार्य.
    kashika: |-
      पूर्वेणातिप्रसक्तः स्थानिवद्भाव एतेषु विधिषु प्रतिषिध्यते। पदान्तविधिं प्रत्यजादेशो न स्थानिवद् भवति। कौ स्तः। यौ स्तः। तानि सन्ति। यानि सन्ति। <<श्नसोरल्लोपः>> [[६.४.१११]] क्ङिति सार्वधातुक इति परनिमित्तकः, स पूर्वविधावावादेशे यणादेशे च कर्तव्ये स्थानिवत् स्यात्, अस्माद् वचनाद् न भवति। द्विर्वचनविधिं प्रति [अजादेशः] न स्थानिवद् भवति। दद्ध्यत्र। मद्ध्वत्र। यणादेशः परनिमित्तकः, तस्य स्थानिवद्भावाद्  <<अनचि च>> [[८.४.४७]] इति धकारस्य द्विर्वचनं न स्यादस्माद् वचनाद् भवति । वरे योऽजादेशः स पूर्वविधिं प्रति न स्थानिवद् भवति। अप्सु यायावरः प्रवपेत पिण्डान्। यातेर्यङन्ताद्  <<यश्च यङः>> [[३.२.१७६]] इति वरचि कृते <<अतो लोपः>> [[६.४.४८]] परनिमित्तकः, तस्य स्थानिवत्त्वाद् <<आतो लोप इटि च>> [[६.४.६४]] इत्याकारलोपः स्याद्, अस्माद् वचनाद् न भवति। यलोप — यलोपविधिं प्रत्यजादेशो न स्थानिवद् भवति। कण्डूतिः। कण्डूयतेः क्तिचि कृते  <<अतो लोपः>> [[६.४.४८]] परनिमित्तको <<लोपो व्योर्वलि>> [[६.१.६६]] इति यलोपे स्थानिवत् स्याद्, अस्माद् वचनाद् न भवति। स्वर — स्वरविधिं प्रत्यजादेशो न स्थानिवद् भवति। चि॒कीर्ष॑कः। जि॒हीष॑कः । ण्वुलि कृते <<अतो लोपः>> [[६.४.४८]] परनिमित्तको <<लिति>> [[६.१.१९३]] प्रत्ययात् पूर्वमुदात्तमिति स्वरे कर्तव्ये न स्थानिवद् भवतीति। सवर्ण — सवर्णविधिं प्रत्यजादेशो न स्थानिवद् भवति। शिण्ढि। पिण्ढि। शिषेः पिषेश्च लोण्मध्यमपुरुषैकवचने  <<रुधादिभ्यः श्नम्>> [[३.१.७८]] हित्वधित्वष्टुत्वजश्त्वेषु कृतेषु <<श्नसोरल्लोपः>> [[६.४.१११]] क्ङिति सार्वधातुके परनिमित्तकः, अनुस्वारस्य ययि परसवर्णे [[८.४.५८]] कर्तव्ये न स्थानिवद् भवति। अनुस्वार — अनुस्वारविधिं प्रत्यजादेशो न स्थानिवद् भवति। शिंषन्ति। पिंषन्ति। <<नश्चापदान्तस्य झलि>> [[८.३.२४]] इत्यनुस्वारे कर्तव्ये <<श्नसोरल्लोपः>> [[६.४.१११]] न स्थानिवद् भवति। दीर्घ — दीर्घविधिं प्रत्यजादेशो न स्थानिवद् भवति। प्रतिदीव्ना। प्रतिदीव्ने। प्रतिदिवन्नित्येतस्य <<भस्य>> [[६.४.१२९]] इत्यधिकृत्य तृतीयैकवचने चतुर्थ्येकवचने च <<अल्लोपोऽनः>> [[६.४.१३४]] इत्यकारलोपः परनिमित्तकः, तस्य स्थानिवद्भावाद् <<हलि च>> [[८.२.७७]] इति दीर्घत्वं न स्यात्, न ह्ययं वकारो हल्पर इति, अस्माद् वचनाद् भवति। जश् — जश्विधिं प्रत्यजादेशो न स्थानिवद् भवति। सग्धि॑श्च मे॒ सपी॑तिश्च मे (मा०सं० १८.९)। ब॒ब्धां ते॒ हरी॑ धा॒नाः (नि० ५.१२)। अदेः क्तिनि <<बहुलं छन्दसि>> [[२.४.३९]] इति घस्लादेशः,<<घसिभसोर्हलि च>> [[६.४.१००]] इत्युपधालोपः,<<झलो झलि>> [[८.२.२६]] इति सकारलोपः,<<झषस्तथोर्धोऽधः>> [[८.२.४०]] इति धत्वम्, उपधालोपस्य स्थानिवत्त्वात् <<झलां जश् झशि>> [[८.४.५३]] इति घकारस्य जश्त्वं न स्याद्, अस्माद् वचनाद् भवति। समाना ग्धिः, समानस्य सभावः। सग्धिः। बब्धामिति। भसेर्लोड्द्विवचने शपः श्लुः, द्विर्वचनम्, अभ्यासकार्यम्, <<घसिभसोर्हलि च>> [[६.४.१००]]इत्युपधालोपः,<<झलो झलि>>[[८.२.२६]]इति सकारलोपः, <<झषस्तथोर्धोऽधः>>[[८.२.४०]]इति धत्वम्। उपधालोपस्य स्थानिवत्त्वात् <<झलां जश् झशि>> [[८.४.५३]] इति भकारस्य जश्त्वं न स्याद्, अस्माद् वचनाद् भवति। चर् — चर्विधिं प्रत्यजादेशो न स्थानिवद् भवति। जक्षतुः। जक्षुः। अक्ष॑न् पि॒तरोऽमी॑मदन्त पि॒तरः॑ (मा०सं० १९.३६)। लिड्द्विवचनबहुवचनयोरदेर्घस्लादेशः, <<गमहनजनखनघसाम्०>> [[६.४.९८]] इत्युपधालोपः, द्विर्वचनम्, अभ्यासकार्यम्। तत्रोपधालोपस्य स्थानिवत्त्वात् <<खरि च>> [[८.४.५५]] इति घकारस्य चर्त्वं न स्याद्, अस्माद् वचनाद् भवति। <<शासिवसिघसीनां च>> [[८.३.६०]] इति षत्वम्। अक्षन्नित्यदेर्लुङ्बहुवचने घस्लादेशः, च्लेरागतस्य <<मन्त्रे घसह्वर०>> [[२.४.८०]] इति लुक्।  <<गमहनजनखनघसाम्०>> [[६.४.९८]] इत्युपधालोपः, तस्य स्थानिवत्त्वात् <<खरि च>> [[८.४.५५]] इति चर्त्वं न स्याद्, अस्माद् वचनाद् भवति॥ स्वरदीर्घयलोपेषु लोपाजादेशो न स्थानिवद् भवति॥ अन्यस्तु स्थानिवदेव। तेन ब॒हु॒ख॒ट्वकः॑, किर्योः, गिर्योः, वाय्वोरिति स्थानिवत्त्वात् स्वरदीर्घयलोपा न भवन्ति॥
    vartika:
      - स्वरदीर्घयलोपेषु लोपाजादेशो न स्थानिवद् ।
      - क्विलुगुपधात्वचङ्परनिर्ह्रासकुत्वेषूपसंख्यानम् ।
      - पूर्वत्रासिद्धे न स्थानिवत् ।
      - तस्य दोषः संयोगादिलोपलत्वणत्वेषु ।
    rule: |-
      That counting-as-the-स्थानिन् does not hold for rules about word-finals, doubling, the affix **वरच्**, **यलोप**, accent, **सवर्ण**, **अनुस्वार**, lengthening, or **जश्**/**चर्** substitution.
  - id: "11059"
    ref: 1.1.59
    a: 1
    p: 1
    n: 59
    s: द्विर्वचनेऽचि
    iast: dvirvacane'ci
    type: AT
    typeName: atideśa
    pada:
      - द्विर्वचने
      - अचि
    adhikara: ""
    inherits:
      - word: स्थानिवत्
        from: 1.1.56
      - word: आदेशः
        from: 1.1.56
    feeds: []
    meaning:
      "An आदेश done in place of an अच् letter acts like a स्थानी for the द्वित्वकार्य, provided that\
      \ such a द्वित्वकार्य is caused by an अजादि षनिमित्त. "
    kashika: |-
      द्विर्वचननिमित्तेऽचि अजादेशः स्थानिवद् भवति द्विर्वचन एव कर्तव्ये। रूपातिदेशश्चायं नियतकालः। तेन कृते द्विर्वचने पुनरादेशरूपमेवावतिष्ठते। आल्लोपोपधालोपणिलोपयणयवायावादेशाः प्रयोजनम्। आल्लोपः — पपतुः, पपुः। <<आतो लोप इटि च>> [[६.४.६४]] इत्याकारलोपे कृते तस्य स्थानिवद्भावाद् <<एकाचो०>> [[६.१.१]] इति द्विर्वचनं भवति। उपधालोपः — जघ्नतुः, जघ्नुः। <<गमहनजनखनघसाम्०>> [[६.४.९८]] इत्युपधालोपे कृतेऽनच्कत्वाद् द्विर्वचनं न स्यात्, अस्माद् वचनाद् भवति। णिलोपः — आटिटत्। अटतेर्णिचि लुङि  चङि  णिलोपे कृते तस्य स्थानिवत्त्वाद् <<अजादेर्द्वितीयस्य>> [[६.१.२]] इति टिशब्दस्य द्विर्वचनं भवति। यण् — चक्रतुः, चक्रुः। करोतेरतुसि उसि च यणादेशे कृतेऽनच्कत्वाद् द्विर्वचनं न स्यात्, स्थानिवत्त्वाद् भवति। अयवायावादेशाः — निनय। निनाय। लुलव। लुलाव। नयतेर्लुनातेश्चोत्तमे णलि गुणे कृते वृद्धौ चायवायावादेशाः, तेषां स्थानिवत्त्वाद् नेनैलोलाविति द्विर्वचनं भवति। द्विर्वचने कर्तव्य इति किम्? जग्ले। मम्ले। श्रवणमाकारस्य न भवति। द्विर्वचननिमित्त इति किम्? दुद्यूषति। ऊठि यणादेशो न स्थानिवद् भवति। अचीति किम्? जेघ्रीयते। देध्मीयते। <<ई घ्राध्मोः>> [[७.४.३१]] <<यङि  च>> [[७.४.३०]] इतीकारादेशः, तस्य स्थानिवद्भावादाकारस्य द्विर्वचनं स्यात्, अज्ग्रहणाद् न भवति॥
    vartika: []
    rule: |-
      Before a vowel affix that triggers doubling, a vowel's **आदेश** counts as its **स्थानिन्** — keeping the original's very form — only for the doubling, then it reverts.
  - id: "11060"
    ref: 1.1.60
    a: 1
    p: 1
    n: 60
    s: अदर्शनं लोपः
    iast: adarśanaṃ lopaḥ
    type: S
    typeName: saṃjñā
    pada:
      - अदर्शनं
      - लोपः
    adhikara: ""
    inherits:
      - word: स्थाने
        from: 1.1.50
    feeds:
      - word: अदर्शनं
        to: 1.1.61
    meaning: non-appearance of a letter or a group of letters is called लोप.
    kashika: |-
      अदर्शनम्, अश्रवणम्, अनुच्चारणम्, अनुपलब्धिः, अभावः, वर्णविनाश इत्यनर्थान्तरम्। एतैः शब्दैर्योऽर्थोऽभिधीयते, तस्य लोप इतीयं संज्ञा भवति। अर्थस्येयं संज्ञा न शब्दस्य। प्रसक्तस्यादर्शनं लोपसंज्ञं भवति। <<गोधाया ढ्रक्>> [[४.१.१२९]] — गौधेरः। पचेरन्। <<जीवे रदानुक्>> (द०उ० १.१६३) — जीरदानुः। स्रिवेर्मनिन् — आस्रेमाणम्। यकारवकारयोरदर्शनमिहोदाहरणम्। अपरस्यानुबन्धादेः प्रसक्तस्य। लोपप्रदेशाः — <<लोपो व्योर्वलि>> [[६.१.६६]] इत्येवमादयः॥
    vartika: []
    rule: "**लोप** is disappearance — not heard, not spoken, not written."
  - id: "11061"
    ref: 1.1.61
    a: 1
    p: 1
    n: 61
    s: प्रत्ययस्य लुक्श्लुलुपः
    iast: pratyayasya lukślulupaḥ
    type: S
    typeName: saṃjñā
    pada:
      - प्रत्ययस्य
      - लुक्-श्लु-लुपः
    adhikara: ""
    inherits:
      - word: अदर्शनं
        from: 1.1.60
    feeds: []
    meaning: |-
      The elision of a प्रत्यय done using the specific words लुक्, श्लु and लुप् is respectively known by the terms लुक्, श्लु, लुप्.
    kashika: |-
      अदर्शनमिति वर्तते। प्रत्ययादर्शनस्य लुक्, श्लु, लुप् इत्येताः संज्ञा भवन्ति। अनेकसंज्ञाविधानाच् च तद्भावितग्रहणमिह विज्ञायते। लुक्संज्ञाभावितं प्रत्ययादर्शनं लुक्संज्ञं भवति, श्लुसंज्ञाभावितं श्लुसंज्ञं भवति, लुप्संज्ञाभावितं लुप्संज्ञं भवति। तेन संज्ञानां संकरो न भवति। विधिप्रदेशेषु च भाविनी संज्ञा विज्ञायते। अत्ति। जुहोति। वरणाः। प्रत्ययग्रहणं किम्? अगस्तयः। कुण्डिनाः। लुक्श्लुलुप्प्रदेशाः — <<लुक् तद्धितलुकि>> [[१.२.४९]], <<जुहोत्यादिभ्यः श्लुः>> [[२.४.७५]],<<जनपदे लुप्>> [[४.२.८१]] इत्येवमादयः॥
    vartika: []
    rule: |-
      When a rule drops a **प्रत्यय** using the word **लुक्**, **श्लु**, or **लुप्**, that dropping takes the matching name — **लुक्**, **श्लु**, or **लुप्**.
