    meaning: |-
      The words used in the rules of the grammar represent the verbatim sequence of the letters (and not their underlying meaning); except for the technical terms which represent the meaning rather than the verbatim sequence of the letters.
    kashika: |-
      शास्त्रे स्वमेव रूपं शब्दस्य ग्राह्यं बोध्यं प्रत्याय्यं भवति, न बाह्योऽर्थः, शब्दसंज्ञां वर्जयित्वा। शब्देनार्थावगतेरर्थे कार्यस्यासंभवात् तद्वाचिनां शब्दानां संप्रत्ययो मा भूदिति सूत्रमिदमारभ्यते। <<अग्नेर्ढक्>> [[४.२.३३]] — आग्नेयमष्टाकपालं निर्वपेत् (वै०श्रौ० १.१९)। अग्निशब्दोऽग्निशब्दस्यैव ग्राहको भवति, न ज्वलनः पावको धूमकेतुरिति, नातः प्रत्ययो भवति। <<उदश्वितोन्यतरस्याम्>> [[४.२.१९]] — औदश्वित्कम्। औदश्वितम्। तक्रमरिष्टं कालशेयं दण्डाहतं मथितमिति नातः प्रत्ययो भवति। अशब्दसंज्ञेति किम्? <<दाधा घ्वदाप्>> [[१.१.२०]], <<तरप्तमपौ घः>> [[१.१.२२]] घुग्रहणेषु घग्रहणेषु च संज्ञिनां ग्रहणम्, न संज्ञायाः॥ सित्तद्विशेषाणां वृक्षाद्यर्थम् (म०भा० १.१.६८ वा० ५)॥ सिन्निर्देशः कर्तव्यः। ततो वक्तव्यं तद्विशेषाणां ग्रहणं भवतीति। किं प्रयोजनम्? वृक्षाद्यर्थम्। <<विभाषा वृक्षमृगतृण०>> [[२.४.१२]] इति। प्लक्षन्यग्रोधम्, प्लक्षन्यग्रोधाः॥ पित्पर्यायवचनस्य च स्वाद्यर्थम् (म०भा० १.१.६८ वा० ६)॥ पिन्निर्देशः कर्तव्यः। ततो वक्तव्यं पर्यायवचनस्य ग्रहणं भवति, चकारात् स्वस्य रूपस्य तद्विशेषाणां चेति। किं प्रयोजनम्? स्वाद्यर्थम्। <<स्वे पुषः>> [[३.४.४०]] — स्वपोषं पुष्टः। रैपोषम्। धनपोषम्। विद्यापोषम्। अश्वपोषम्। गोपोषम्॥ जित्पर्यायवचनस्यैव राजाद्यर्थम्॥ जिन्निर्देशः कर्तव्यः (म०भा० १.१.६८ वा० ७)। ततो वक्तव्यं पर्यायवचनस्यैव ग्रहणं भवतीति, न स्वरूपस्य, नापि तद्विशेषाणाम्। किं प्रयोजनम्? राजाद्यर्थम्। <<सभा राजामनुष्यपूर्वा>> [[२.४.२३]] — इनसभम्। ईश्वरसभम्। तस्यैव न भवति — राजसभा। तद्विशेषाणां च न भवति — पुष्यमित्रसभा। चन्द्रगुप्तसभा॥ झित्तद्विशेषाणां च मत्स्याद्यर्थम् (म०भा० १.१.६८ वा० ८)॥ झिन्निर्देशः कर्तव्यः। ततो वक्तव्यं तस्य च ग्रहणं भवति तद्विशेषाणां चेति। किं प्रयोजनम्? मत्स्याद्यर्थम्। <<पक्षिमत्स्यमृगान् हन्ति>> [[४.४.३५]] इति ठक्। पाक्षिकः। मात्स्यिकः। तद्विशेषाणाम् — शाकुनिकः। पर्यायाणां न भवति — अजिह्मान् हन्ति। अनिमिषान् हन्तीति। अस्यैकस्येष्यते (म०भा० १.१.६८)। मीनान् हन्ति मैनिकः॥
    vartika:
      - अर्थवद्ग्रहणे नानर्थकस्य ग्रहणम् ।
    rule: |-
      A word in a rule stands for its own form, not its meaning — except when the word is a **संज्ञा**, which stands for the things it names.
