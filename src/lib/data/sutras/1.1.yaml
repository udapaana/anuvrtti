    meaning: A स्वर and a व्यञ्जन cannot be सवर्ण of each other.
    kashika: |-
      अच्च हल् च अज्झलौ। तुल्यास्यप्रयत्नावपि अज्झलौ परस्परं सवर्णसंज्ञौ न भवतः। अवर्णहकारौ — दण्डहस्तः। इवर्णशकारौ — दधिशीतम्, सवर्णदीर्घत्वं न भवति। वैपाशो मत्स्यः, आनडुहं चर्मेति — <<यस्येति च>> [[६.४.१४८]] इति लोपो न भवति॥
    vartika: []
    rule: |-
      A vowel and a consonant are never **सवर्ण**, even with the same place and effort.
