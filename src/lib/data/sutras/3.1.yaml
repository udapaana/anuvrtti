    धातोः सिप् प्रत्ययो भवति बहुलं लेटि परतः। जोषि॑ष॒त् (ऋ०२.३५.१)। तारिषत् (ऋ०२.२५.१२)। मन्दिषत् । न च भवति — पता॑ति दि॒द्युत् (ऋ० ७.२५.१)। उद॒धिं च्या॑वया॒ति। (तै०सं० ३.५.५.२)॥
  vartika:
