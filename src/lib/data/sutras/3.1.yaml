  kashika: |-
    धातोश्च्लिः प्रत्ययो भवति लुङि परतः। इकार उच्चारणार्थः, चकारः स्वरार्थः। अस्य सिजादीनादेशान् वक्ष्यति। तत्रैवोदाहरिष्यामः॥
