  - word: आम्
    from: 3.1.35
  - word: अन्यतरस्याम्
    from: 3.1.38
  feeds: []
  meaning: ''
  kashika: |-
    <<ञिभी भये>>, <<ह्री लज्जायाम्>> , <<डुभृञ् धारणपोषणयोः>> , <<हु दानादनयोः>> एतेभ्यो लिटि परत आम् प्रत्ययो भवत्यन्यतरस्याम्, श्लाविव चास्मिन् कार्यं भवति। किं पुनस्तत्? द्वित्वमित्त्वं च। बिभयाञ्चकार, बिभाय। जिह्रयाञ्चकार, जिह्राय। बिभराञ्चकार, बभार। जुहवाञ्चकार, जुहाव॥
  vartika: []
  rule: |-
    Before **लिट्**, भी, ह्री, भृ, and हु optionally take **आम्**; with **आम्** they behave as if **श्लु** had applied (so they reduplicate) and belong to the ह्वादि class.
- id: '31040'
  ref: 3.1.40
  a: 3
  p: 1
  n: 40
  s: कृञ् चानुप्रयुज्यते लिटि
  iast: kṛñ cānuprayujyate liṭi
  type: V
  typeName: vidhi
  pada:
  - कृञ्
  - च
  - अनुप्रयुज्यते
  - लिटि
  adhikara: प्रत्ययः
  inherits:
  - word: आम्
    from: 3.1.35
  feeds: []
  meaning: |-
    The लिट्-लकार forms of verb roots कृ, भू, and अस् are applied after the आम्-प्रत्यय.
  kashika: |-
    आम्प्रत्ययस्य पश्चात् कृञनुप्रयुज्यते लिटि परतः। कृञिति प्रत्याहारेण कृभ्वस्तयो गृह्यन्ते, तत्सामर्थ्यादस्तेर्भूभावो न भवति। पाचयाञ्चकार। पाचयाम्बभूव। पाचयामास॥
  vartika: []
  rule: |-
    Before **लिट्**, कृ is added after the **आम्**-form. **कृञ्** here covers कृ, भू, and अस्; that use blocks the replacement of अस् by भू.
- id: '31041'
  ref: 3.1.41
  a: 3
  p: 1
  n: 41
  s: विदाङ्कुर्वन्त्वित्यन्यतरस्याम्
  iast: vidāṅkurvantvityanyatarasyām
  type: V
  typeName: vidhi
  pada:
  - विदाङ्-कुर्वन्तु
  - इति
  - अन्यतरस्याम्
  adhikara: प्रत्ययः
  inherits:
  - word: आम्
    from: 3.1.35
  feeds:
  - word: अन्यतरस्याम्
    to: 3.1.42
  meaning: ''
  kashika: |-
    विदाङ्कुर्वन्त्वित्येतदन्यतरस्यां निपात्यते। किं पुनरिह निपात्यते? विदेर्लोटि आम्प्रत्ययः, गुणाभावः, लोटो लुक् , कृञश्च लोट्परस्यानुप्रयोगः। अत्र भवन्तो विदाङ्कुर्वन्तु, विदन्तु। इतिकरणः प्रदर्शनार्थः, न केवलं प्रथमपुरुषबहुवचनम्। किं तर्हि? सर्वाण्येव लोड्वचनान्यनुप्रयुज्यन्ते। विदाङ्करोतु। विदाङ्कुरुतात्। विदाङ्कुरुताम्। विदाङ्कुरु। विदाङ्कुरुतमित्यादि॥
  vartika: []
  rule: |-
    विदाङ्कुर्वन्तु is an optional irregular form: विद् takes **आम्** before **लोट्**, the **लोट्** ending drops by **लुक्**, no **गुण**, and कृ in **लोट्** follows. The इति extends this to every person and number.
- id: '31042'
  ref: 3.1.42
  a: 3
  p: 1
