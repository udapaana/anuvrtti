  meaning: ''
  kashika: "आचार इत्यनुवर्तते। उपमानात् कर्तुःसुबन्तादाचारेऽर्थे वा क्यङ् प्रत्ययो भवति, सकारस्य च लोपो\
    \ भवति। अन्वाचयशिष्टः सलोपः, तदभावेऽपि क्यङ् भवत्येव — श्येन इवाचरति काकः, श्येनायते। कुमुदं पुष्करायते।\
    \ सलोपविधावपि वाग्रहणं संबध्यते, सा च व्यवस्थितविभाषा भवति। \n\nओजसोऽप्सरसो नित्यं पयसस्तु विभाषया।\
    \ (तु० — जैनेन्द्र सू० २.१.९)। ओ॒जा॒यमा॑नं॒ यो अहिं॑ ज॒घान॒ (ऋ०२.१२.११)। ओजायते। अप्सरायते। पयायते।\
    \ पयस्यते। सलोपविधौ च कर्तुरिति स्थानषष्ठी संपद्यते, तत्रालोऽन्त्यनियमे सति, हंसायते सारसायत इति सलोपो\
    \ न भवति॥ आचारेऽवगल्भक्लीबहोडेभ्यः क्विब् वा वक्तव्यः॥ अवगल्भते। अवगल्भायते। क्लीबते। क्लीबायते। होडते।\
    \ होडायते॥ सर्वप्रातिपदिकेभ्य इत्येके॥ अश्व इवाचरति, अश्वायते। अश्वति। गर्दभायते। गर्दभति॥"
  vartika:
  - आचारेऽवगल्भक्लीबहोढेभ्यः क्विब्वा वक्तव्यः ।
  - सर्वप्रातिपदिकेभ्यः क्विब्वा वक्तव्यः ।
  rule: |-
    **क्यङ्** optionally attaches to a **सुप्**-ending word naming the standard the agent is compared to, in the sense of behaving like it, and a final स of the word drops: श्येनायते, अप्सरायते.
- id: '31012'
  ref: 3.1.12
  a: 3
  p: 1
  n: 12
  s: भृशादिभ्यो भुव्यच्वेर्लोपश्च हलः
  iast: bhṛśādibhyo bhuvyacverlopaśca halaḥ
  type: V
  typeName: vidhi
  pada:
  - भृशादिभ्यः
  - भुवि
  - अच्वेः
  - लोपः
  - च
  - हलः
  adhikara: प्रत्ययः
  inherits:
  - word: वा
    from: 3.1.7
  - word: क्यङ्
    from: 3.1.11
  feeds:
  - word: भुवि
    to: 3.1.13
  - word: अच्वेः
    to: 3.1.13
  meaning: ''
  kashika: |-
    भृश इत्येवमादिभ्यः प्रातिपदिकेभ्योऽच्व्यन्तेभ्यो भुवि भवत्यर्थे क्यङ् प्रत्ययो भवति, हलन्तानां च लोपः। अच्वेरिति प्रत्येकमभिसंबध्यते। किमर्थं पुनरिदमुच्यते, यावता भवतियोगे च्विर्विधीयते, तेनोक्तार्थत्वाच् च्व्यन्तेभ्यो न क्यङ् भविष्यति? तत्सदृश — प्रतिपत्त्यर्थं तर्हि च्विप्रतिषेधः क्रियते। अभूततद्भावविषयेभ्यो भृशादिभ्यः क्यङ् प्रत्ययः। अभृशो भृशो भवति, भृशायते। शीघ्रायते॥ भृश। शीघ्र। मन्द। चपल। पण्डित। उत्सुक। उन्मनस्। अभिमनस्। सुमनस्। दुर्मनस्। रहस्। रेहस्। शश्वत्। बृहत्। वेहत्। नृषत्। शुधि। अधर। ओजस्। वर्चस्। भृशादिः। अच्वेरिति किम्? भृशीभवति॥
  vartika: []
  rule: |-
    **क्यङ्** attaches to भृश् and the rest (not already carrying **च्वि**) in the sense of becoming what one was not, and a final consonant of the word drops: भृशायते, शीघ्रायते.
- id: '31013'
  ref: 3.1.13
  a: 3
  p: 1
  n: 13
  s: लोहितादिडाज्भ्यः क्यष्
  iast: lohitādiḍājbhyaḥ kyaṣ
  type: V
  typeName: vidhi
  pada:
  - लोहितादि-डाज्भ्यः
  - क्यष्
  adhikara: प्रत्ययः
  inherits:
  - word: वा
    from: 3.1.7
  - word: क्यङ्
    from: 3.1.11
  - word: भुवि
    from: 3.1.12
  - word: अच्वेः
    from: 3.1.12
  feeds: []
  meaning: ''
  kashika: |-
    लोहितादिभ्यो डाजन्तेभ्यश्च भवत्यर्थे क्यष् प्रत्ययो भवति। लोहितायति। लोहितायते। डाजन्तेभ्यः — पटपटायति। पटपटायते॥ लोहितडाज्भ्यः क्यष्वचनम्, भृशादिष्वितराणि॥ यानि लोहितादिषु पठ्यन्ते तेभ्यःक्यङेव, अपरिपठितेभ्यस्तु क्यषेव भवति। वर्मायति। वर्मायते। निद्रायति। निद्रायते। करुणायति। करुणायते। कृपायति। कृपायते। आकृतिगणश्चायम्। तथा च ककारः सामान्यग्रहणार्थोऽनुबध्यते  <<नःक्ये>> (१.४.१५) इति। नहि पठितानां मध्ये नकारान्तः शब्दोऽस्ति। कृभ्वस्तिभिरिव क्यषापि योगे डाज् भवतीत्येतदेव वचनं ज्ञापकम्। अच्वेरित्यनुवृत्तेरभूततद्भावे क्यष् विज्ञायते॥ लोहित। नील। हरित। पीत। मद्र। फेन। मन्द। लोहितादिः॥
  vartika:
  - भृशादिष्वितराणि ।
  rule: |-
    **क्यष्** attaches to लोहित and the rest, and to words ending in **डाच्**, in the sense of becoming what one was not: लोहितायति, पटपटायते.
- id: '31014'
  ref: 3.1.14
  a: 3
  p: 1
  n: 14
  s: कष्टाय क्रमणे
  iast: kaṣṭāya kramaṇe
