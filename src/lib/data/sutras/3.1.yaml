  meaning: |-
    When used with the meaning of 'giving a hug', The च्लि-प्रत्यय that follows the verb root श्लिष् is converted to क्स.
  kashika: |-
    श्लिषेर्धातोरालिङ्गनक्रियावचनात् परस्य च्लेःक्स आदेशो भवति। आलिङ्गनमुपगूहनं परिष्वङ्गः। अत्र नियमार्थमेतत्। आश्लिक्षत् कन्यां देवदत्तः। आलिङ्गन इति किम्? समाश्लिषज्जतु काष्ठम्॥
  vartika: []
  rule: |-
    **क्स** replaces **च्लि** after श्लिष् when it means 'embrace'. (A restriction: only in that sense.)
