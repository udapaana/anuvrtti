  s: शल इगुपधादनिटः क्सः
  iast: śala igupadhādaniṭaḥ ksaḥ
  type: V
  typeName: vidhi
  pada:
  - शलः
  - इगुपधात्
  - अनिटः
  - क्सः
  adhikara: प्रत्ययः
  inherits:
  - word: लुङि
    from: 3.1.43
  - word: च्लेः
    from: 3.1.44
  feeds:
  - word: क्सः
    to: 3.1.46
  - word: क्सः
    to: 3.1.47
  meaning: |-
    The च्लि प्रत्यय that follows a शल्-वर्णान्त, इगुपध and अनिट्-धातु is converted to 'क्स.
  kashika: |-
    शलन्तो यो धातुरिगुपधः, तस्मात् परस्य च्लेरनिटः क्स आदेशो भवति। दुह — अधुक्षत्। लिह — अलिक्षत्। शल इति किम्? अभैत्सीत्। अच्छैत्सीत्। इगुपधादिति किम्? अधाक्षीत्। अनिट इति किम्? अकोषीत्। अमोषीत्॥
  vartika: []
  rule: |-
    **क्स** replaces **च्लि** after a root that ends in a **शल्** consonant (श, ष, स, ह), has an **इक्** vowel (इ, उ, ऋ, ऌ) as its penult, and takes no **इट्**.
