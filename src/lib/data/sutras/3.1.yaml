  s: प्रुसृल्वः समभिहारे वुन्
  iast: prusṛlvaḥ samabhihāre vun
  type: V
  typeName: vidhi
  pada:
  - प्रु-सृ-ल्वः
  - समभिहारे
  - वुन्
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  feeds:
