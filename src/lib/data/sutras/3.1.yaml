  kashika: |-
    मृजेर्धातोर्विभाषा क्यप् प्रत्ययो भवति। ऋदुपधत्वात् प्राप्तविभाषेयम्। परिमृज्यः, परिमार्ग्यः॥
  vartika: []
  rule: मृज् optionally takes **क्यप्**.
- id: '31114'
  ref: 3.1.114
  a: 3
  p: 1
  n: 114
  s: राजसूयसूर्यमृषोद्यरुच्यकुप्यकृष्टपच्याव्यथ्याः
  iast: rājasūyasūryamṛṣodyarucyakupyakṛṣṭapacyāvyathyāḥ
  type: V
  typeName: vidhi
  pada:
  - राजसूय-सूर्य-मृषोद्य-रुच्य-कुप्य-कृष्टपच्य-अव्यथ्याः
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  - word: कृत्याः
    from: 3.1.95
  - word: क्यप्
    from: 3.1.106
  feeds: []
  meaning: ''
  kashika: |-
    राजसूय सूर्य मृषोद्य रुच्य कुप्य कृष्टपच्य अव्यथ्य इत्येते शब्दाः क्यपि निपात्यन्ते। राज्ञा सोतव्यः, राजा वेह सूयते राजसूयः क्रतुः। सूसर्तिभ्यां क्यप् सर्तेरुत्वं सुवतेर्वा रुडागमः। सरति सुवति वा सूर्यः। मृषापूर्वस्य वदतेः पक्षे यति प्राप्ते नित्यं क्यब् निपात्यते। मृषोद्यम्। रोचतेऽसौ रुच्यः। कर्तरि क्यप्। गुपेरादेः कत्वं च संज्ञायाम्। कुप्यम्। गोप्यमन्यत्। कृष्टे पच्यन्ते कृष्टपच्याः। कर्मकर्तरि निपातनम्। न व्यथते अव्यथ्यः॥
  vartika: []
  rule: |-
    राजसूय, सूर्य, मृषोद्य, रुच्य, कुप्य, कृष्टपच्य, and अव्यथ्य are formed irregularly with **क्यप्**.
- id: '31115'
  ref: 3.1.115
  a: 3
  p: 1
  n: 115
  s: भिद्योद्ध्यौ नदे
  iast: bhidyoddhyau nade
  type: V
  typeName: vidhi
  pada:
  - भिद्य-उद्ध्यौ
  - नदे
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  - word: कृत्याः
    from: 3.1.95
  - word: क्यप्
    from: 3.1.106
  feeds: []
  meaning: ''
  kashika: |-
    भिदेरुज्झेश्च क्यब् निपात्यते नदेऽभिधेये। उज्झेर्धत्वं च। भिनत्ति कूलं भिद्यः। उज्झत्युदकम् उद्ध्यः। नद इति किम्? भेत्ता। उज्झिता॥
  vartika: []
  rule: |-
    भिद्य and उद्ध्य are formed irregularly with **क्यप्** when they name a river (the झ् of उज्झ् also becomes ध).
- id: '31116'
