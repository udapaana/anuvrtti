  meaning: ''
  kashika: "इषिकर्म यो धातुरिषिणैव समानकर्तृकः, तस्मादिच्छायामर्थे वा सन् प्रत्ययो भवति। कर्मत्वं समानकर्तृकत्वं\
    \ च धातोरर्थद्वारकम्। कर्तुमिच्छति, चिकीर्षति। जिहीर्षति। धातुग्रहणं किम्? सोपसर्गादुत्पत्तिर्मा भूत्\
    \ — प्रकर्तुमैच्छत्, प्राचिकीर्षत्। कर्मण इति किम्? करणान् मा भूत् — गमनेनेच्छति। समानकर्तृकादिति\
    \ किम्? देवदत्तस्य भोजनमिच्छति यज्ञदत्तः। इच्छायामिति किम्? कर्तुं जानाति। वावचनाद् वाक्यमपि भवति।\
    \ धातोरिति विधानादत्र सन आर्धधातुकसंज्ञा भवति, न पूर्वत्र॥ आशङ्कायामुपसंख्यानम्॥ आशङ्के पतिष्यति कूलम्।\
    \ पिपतिषति कूलम्। श्वा मुमूर्षति॥ इच्छासन्नन्तात् प्रतिषेधो वक्तव्यः॥  चिकीर्षितुमिच्छति। विशेषणं\
    \ किम्? जुगुप्सिषते। मीमांसिषते॥ \n\nशैषिकान्मतुबर्थीयाच्छैषिको मतुबर्थिकः।\n\nसरूपः प्रत्ययो नेष्टः\
    \ सन्नन्तान्न सनिष्यते॥"
  vartika:
  - आशङ्कायां सन्वक्तव्यः ।
  - |-
    शैषिकान्मतुबर्थीयाच्छैषिको मतुबर्थिकः । सरूपः प्रत्ययो नेष्टः सन्नन्तान्न सनिष्यते ।
  rule: |-
    After a root naming the wished-for object, when the wisher is also its agent, **सन्** optionally marks wishing: कर्तुम् इच्छति becomes चिकीर्षति.
