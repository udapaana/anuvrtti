  meaning: ''
  kashika: |-
    <<कासृ शब्दकुत्सायाम्>> ततः प्रत्ययान्तेभ्यश्च धातुभ्य आम् प्रत्ययो भवति लिटि परतोऽमन्त्रविषये। कासाञ्चक्रे। प्रत्ययान्तेभ्यः — लोलूयाञ्चके। अमन्त्र इति किम्? कृ॒ष्णो नो॑नाव (ऋ० १.७९.२)॥ कास्यनेकाच इति वक्तव्यं चुलुम्पाद्यर्थम्॥

    आमोऽमित्त्वमदन्तत्वादगुणत्वं विदेस्तथा।

    आस्कासोरांविधानाच् च पररूपं कतन्तवत्॥
  vartika:
  - कास्यनेकाज्ग्रहणं कर्तव्यम् ।
  rule: |-
    Before **लिट्** outside a **मन्त्र**, कास् and any root ending in a **प्रत्यय** take **आम्**.
- id: '31036'
  ref: 3.1.36
  a: 3
  p: 1
  n: 36
  s: इजादेश्च गुरुमतोऽनृच्छः
  iast: ijādeśca gurumato'nṛcchaḥ
  type: V
  typeName: vidhi
  pada:
  - इजादेः
  - च
  - गुरुमतः
  - अनृच्छः
  adhikara: प्रत्ययः
  inherits:
  - word: लिटि
    from: 3.1.35
  - word: आम्
    from: 3.1.35
  feeds: []
  meaning: |-
    A verb which can be called as 'इजादिः गुरुमान्' gets an आम् प्रत्यय when followed by लिट्-लकार. However, this प्रत्यय is not seen for the verb root ऋच्छ्.
  kashika: "इजादिर्यो धातुर्गुरुमान् ऋच्छतिवर्जितः, तस्माच्च लिटि परत आम् प्रत्ययो भवति। <<ईह चेष्टायाम्>>,\
    \ <<ऊह वितर्के>>। ईहाञ्चक्रे। ऊहाञ्चके्र। इजादेरिति किम्? ततक्ष। ररक्ष। गुरुमत इति किम्? इयज। उवप।\
    \ अनृच्छ इति किम्? आनर्च्छ, आनर्च्छतुः, आनर्च्छुः॥ ऊर्णोतेश्च प्रतिषेधो वक्तव्यः॥ प्रोर्णुनाव। अथवा\
    \ — \n\nवाच्य ऊर्णोर्णुवद्भावो यङ्प्रसिद्धिः प्रयोजनम्।\n\nआमश्च प्रतिषेधार्थम् एकाचश्चेडुपग्रहात्॥"
  vartika: []
  rule: |-
    Before **लिट्**, a root beginning with an **इच्** vowel and carrying a heavy vowel takes **आम्**, except ऋच्छ्.
