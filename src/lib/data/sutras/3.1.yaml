  meaning: ''
  kashika: |-
    रोमन्थशब्दात् तपः शब्दाच्च कर्मणो यथाक्रमं वर्तिचरोरर्थयोः क्यङ्  प्रत्ययो भवति। रोमन्थं वर्तयति, रोमन्थायते गौः॥ हनुचलन इति वक्तव्यम्॥ इह मा भूत् — कीटो रोमन्थं वर्तयति॥ तपसः परस्मैपदं च ॥ तपश्चरति, तपस्यति॥
  vartika:
