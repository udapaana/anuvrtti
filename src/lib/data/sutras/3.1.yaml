    ग्रहेर्धातोः कप्रत्ययो भवति गेहे कर्तरि। गृहं वेश्म। तात्स्थ्याद् दाराश्च। गृह्णन्तीति गृहा दाराः। गृहाणि वेश्मानि॥
  vartika: []
  rule: ग्रह् takes **क** when the agent it names is a house.
