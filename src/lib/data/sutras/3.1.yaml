    दुनोतेर्नयतेश्चानुपसर्गे णप्रत्ययो भवति। दुनोतीति दावः। नयतीति नायः। अनुपसर्ग इति किम्? प्रदवः। प्रणयः॥
  vartika: []
  rule: दु and नी take **ण** when no **उपसर्ग** precedes them.
