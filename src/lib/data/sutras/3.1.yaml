  - word: च्लेः
    from: 3.1.44
  feeds:
  - word: चङ्
    to: 3.1.49
  - word: चङ्
    to: 3.1.50
  - word: चङ्
    to: 3.1.51
  meaning: |-
    For the verbs ending in णि-प्रत्यय, and for the verbs  श्रि, द्रु and स्रु, the  च्लि-प्रत्यय is converted to चङ् in the  कर्तरि context.
  kashika: "सिजपवादश्चङ् विधीयते। ण्यन्तेभ्यो धातुभ्यः श्रि द्रु स्रु इत्येतेभ्यश्च परस्य च्लेश्चङादेशो\
    \ भवति कर्तृवाचिनि लुङि परतः। ङकारो गुणवृद्धिप्रतिषेधार्थः, चकारः<<चङि>> (६.१.११) इति विशेषणार्थः।\
    \ अचीकरत्। अजीहरत्। अशिश्रियत्। अदुद्रुवत्। असुस्रुवत्। कर्तरीति किम्? अकारयिषातां कटौ देवदत्तेन॥\
    \ कमेरुपसंख्यानम्॥ <<आयादय आर्धधातुके वा>> (३.१.३१) इति यदा णिङ् नास्ति तदैतदुपसंख्यानम्। अचकमत। णिङ्पक्षे\
    \ सन्वद्भावः। अचीकमत। \n\nनाकमिष्टं सुखं यान्ति सुयुक्तै र्वडवारथैः।\n\nअथ पत्काषिणो यान्ति येऽचीकमतभाषिणः॥"
  vartika:
  - कमेश्च्लेश्चङ् वक्तव्यः ।
  rule: |-
    Before **लुङ्** signifying the agent, **चङ्** replaces **च्लि** after a root ending in **णि** and after श्रि, द्रु, स्रु. The ङ blocks **गुण** and **वृद्धि**, the च marks it off from **अङ्**; **चङ्** triggers reduplication.
