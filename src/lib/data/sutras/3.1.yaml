  s: आनाय्योऽनित्ये
  iast: ānāyyo'nitye
  type: V
  typeName: vidhi
  pada:
  - आनाय्यः
  - अनित्ये
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  - word: कृत्याः
    from: 3.1.95
  - word: ण्यत्
    from: 3.1.124
  feeds: []
  meaning: ''
  kashika: "आनाय्य इति निपात्यतेऽनित्येऽभिधेये। नयतेराङ्पूर्वाण् ण्यदायादेशौ निपात्येते। आनाय्यो दक्षिणाग्निः।\
    \ रूढिरेषा। तस्मादनित्यविशेषे दक्षिणाग्नावेवावतिष्ठते। तस्य चानित्यत्वं नित्यमजागरणात्। यश्च गार्हपत्यादानीयते\
    \ दक्षिणाग्निराहवनीयेन सहैकयोनिः, तत्रैतन्निपातनम्, न दक्षिणाग्निमात्रे। तस्य हि योनिर्विकल्प्यते\
    \ वैश्यकुलाद् वित्तवतो भ्राष्ट्राद् वा गार्हपत्याद् वा (तु० — पार०गृ० १.२.३) इति। \n\nआनाय्योऽनित्य\
    \ इति चेद् दक्षिणाग्नौ कृतं भवेत्।\n\nएकयोनौ च तं विद्यादानेयो ह्यन्यथा भवेत्॥"
  vartika: []
  rule: आनाय्य is irregular when it means impermanent.
