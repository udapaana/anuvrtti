  kashika: |-
    <<डुक्रीञ् द्रव्यविनिमये>> इत्येवमादिभ्यो धातुभ्यः श्नाप्रत्ययो भवति। शपोऽपवादः। शकारः सार्वधातुकसंज्ञार्थः। क्रीणाति। प्रीणाति॥
