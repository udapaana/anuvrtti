    चकारेण ण्युडनुकृष्यते। जहातेर्जिहातेश्च धातोर्ण्युट् प्रत्ययो भवति व्रीहौ काले च कर्तरि। हायना नाम व्रीहयः, जहत्युदकमिति कृत्वा। काले — हायनः संवत्सरः, जिहीते भावानिति कृत्वा॥
