  - word: कृत्याः
    from: 3.1.95
  feeds: []
  meaning: ''
  kashika: "अमाशब्दः सहार्थे वर्तते। तस्मिन्नुपपदे वसेर्धातोः कालेऽधिकरणे ण्यत् प्रत्ययो भवति, तत्रान्यतरस्यां\
    \ वृद्ध्यभावो निपात्यते। सह वसतोऽस्मिन् काले सूर्यचन्द्रमसावित्यमावास्या, अमावस्या। एकदेशविकृतस्यानन्यत्वात्<<अमावास्याया\
    \ वा>> (४.३.३०) इत्यत्रामावस्याशब्दस्यापि ग्रहणं भवति।  \n\nअमावसोरहं ण्यतोर्निपातयाम्यवृद्धिताम्।\n\
    \nतथैकवृत्तिता तयोः स्वरश्च मे प्रसिध्यति॥"
  vartika: []
  rule: |-
    अमावस्य is formed irregularly: वस् after अमा takes **ण्यत्** for time-location, and optionally the **वृद्धि** is dropped.
- id: '31123'
  ref: 3.1.123
  a: 3
  p: 1
  n: 123
  s: |-
    छन्दसि निष्टर्क्यदेवहूयप्रणीयोन्नीयोच्छिष्यमर्यस्तर्याध्वर्यखन्यखान्यदेवयज्यापृच्छ्यप्रतिषीव्यब्रह्मवाद्यभाव्यस्ताव्योपचाय्यपृडानि
  iast: |-
    chandasi niṣṭarkyadevahūyapraṇīyonnīyocchiṣyamaryastaryādhvaryakhanyakhānyadevayajyāpṛcchyapratiṣīvyabrahmavādyabhāvyastāvyopacāyyapṛḍāni
  type: V
  typeName: vidhi
  pada:
  - छन्दसि
  - |-
    निष्टर्क्य-देवहूय-प्रणीय-उन्नीय-उच्छिष्य-मर्य-स्तर्या-ध्वर्य-खन्य-खान्य-देवयज्या-आपृच्छ्य-प्रतिषीव्य-ब्रह्मवाद्य-भाव्य-स्ताव्य-उपचाय्यपृडानि
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  - word: कृत्याः
    from: 3.1.95
  feeds: []
  meaning: ''
  kashika: |-
    निष्टर्क्यादयः शब्दाश्छन्दसि विषये निपात्यन्ते। यदिह लक्षणेनानुपपन्नं तत् सर्वं निपातनात् सिद्धम्। निष्टर्क्य इति <<कृती छेदने>> इत्यस्माद् निस्पूर्वात् क्यपि प्राप्ते ण्यत्, आद्यन्तविपर्ययश्च, निसश्च षत्वं निपात्यते। निष्टर्क्यं (ऐ०आ० ५.१.३) चिन्वीत पशुकामः। देवशब्द उपपदे ह्वयतेर्जुहोतेर्वा क्यप्, दीर्घस्तुगभावश्च। देवहूयः (श०ब्रा० २.१.३.२)। प्रपूर्वादुत्पूर्वाच्च नयतेः क्यप्। प्रणीयः। उन्नीयः। उत्पूर्वाच्छिषेःक्यप्। उ॒च्िछष्यः॑(मै०सं० ३.९.२)। <<मृङ्  प्राणत्यागे>>, <<स्तृञ् आच्छादने>>, <<ध्वृ हूर्छने>>, एतेभ्यो यत् प्रत्ययः। मर्यः॑ (तै०आ० १.३.२)। स्त॒र्या। स्त्रियामेव निपातनम्। ध्वर्यः। खनेर्यत्। खन्या॑ (तै०सं० ७.४.१३.१)। एतस्मादेव ण्यत्। खान्यः। देवशब्द उपपदे यजेर्यः। देवय॒ज्या (ऋ० १०.३०.१५)। स्त्रीलिङ्गनिपातनम्। आङ्पूर्वात् पृच्छेः क्यप्। आपृच्छ्यः॑ (ऋ० १.६०.२)। प्रतिपूर्वात् सीव्यतेः क्यप् षत्वं च। प्रतिषीव्यः। ब्रह्मण्युपपदे वदेर्ण्यत्। ब्रह्म॒वाद्य॑म् (तै०सं० २.५.८.३)। भवतेः स्तौतेश्च ण्यत्, आवादेशश्च भवति। भा॒व्य॑म् (शौ०सं० १३.१.५४), स्ताव्यः। उपपूर्वस्य चिनोतेर्ण्यदायादेशौ। उपचाय्यपृडम् (काठ०सं० ११.१)। पृडे चोत्तरपदे निपातनमेतत्॥ हिरण्य इति वक्तव्यम्॥ हिरण्यादन्यत्र उपचेयपृडमेव।

    निष्टर्क्ये व्यत्ययं विद्यान्निसः षत्वं निपातनात्।

    ण्यदायादेश इत्येता उपचाय्ये निपातितौ ॥ १॥

    ण्यदेकस्माच्चतुर्भ्यः क्यप् चतुर्भ्यश्च यतो विधिः।

    ण्यदेकस्माद्यशब्दश्च द्वौ क्यपौ ण्यद्विधिश्चतुः॥ २॥
  vartika:
  - हिरण्य इति वक्तव्यम् ।
  rule: |-
    In the **छन्दस्** these words are irregular: निष्टर्क्य, देवहूय, प्रणीय, उन्नीय, उच्छिष्य, मर्य, स्तर्या, ध्वर्य, खन्य, खान्य, देवयज्या, आपृच्छ्य, प्रतिषीव्य, ब्रह्मवाद्य, भाव्य, स्ताव्य, उपचाय्य, पृड.
