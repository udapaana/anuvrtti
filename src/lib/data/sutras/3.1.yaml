# Adhyāya 3, Pāda 1 — 150 sūtras
sutras:
- id: '31001'
  ref: 3.1.1
  a: 3
  p: 1
  n: 1
  s: प्रत्ययः
  iast: pratyayaḥ
  type: S
  typeName: saṃjñā
  pada:
  - प्रत्ययः
  adhikara: प्रत्ययः
  inherits: []
  feeds: []
  meaning: 'Everything told in this अधिकार are known as प्रत्ययाः. '
  kashika: |-
    अधिकारोऽयम्। प्रत्ययशब्दः संज्ञात्वेनाधिक्रियते। आ पञ्चमाध्यायपरिसमाप्तेर्यानित ऊर्ध्वमनुक्रमिष्यामः, प्रत्ययसंज्ञास्ते वेदितव्याः, प्रकृत्युपपदोपाधिविकारागमान् वर्जयित्वा। वक्ष्यति — <<तव्यत्तव्यानीयरः>>(३.१.९६)। कर्त्तव्यम्। करणीयम्। प्रत्ययप्रदेशाः — <<प्रत्ययलोपे प्रत्ययलक्षणम्>> (१.१.६२) इत्येवमादयः॥
  vartika: []
  rule: From here on, what is introduced is a **प्रत्यय**.
- id: '31002'
  ref: 3.1.2
  a: 3
  p: 1
  n: 2
  s: परश्च
  iast: paraśca
  type: AD
  typeName: adhikāra
  pada:
  - परः
  - च
  adhikara: प्रत्ययः
  inherits: []
  feeds: []
  meaning: All the words told in this अधिकार are to be attached at the end of the प्रकृति.
  kashika: |-
    अयमप्यधिकारो योगेयोग उपतिष्ठते, परिभाषा वा। परश्च स भवति धातोर्वा प्रातिपदिकाद् वा यः प्रत्ययसंज्ञः। कर्तव्यम्। तैत्तिरीयम्। चकारः पुनरस्यैव समुच्चयार्थः। तेनोणादिषु परत्वं न विकल्प्यते॥
  vartika: []
  rule: And a **प्रत्यय** comes after the **धातु** or **प्रातिपदिक**.
- id: '31003'
  ref: 3.1.3
  a: 3
  p: 1
  n: 3
  s: आद्युदात्तश्च
  iast: ādyudāttaśca
  type: AD
  typeName: adhikāra
  pada:
  - आद्युदात्तः
  - च
  adhikara: प्रत्ययः
  inherits: []
  feeds: []
  meaning: The first स्वर of all the प्रत्ययाः mentioned in this अधिकार becomes उदात्त.
  kashika: |-
    अयमप्यधिकारः परिभाषा वा। आद्युदात्तश्च स भवति यः प्रत्ययसंज्ञः। अनियतस्वर — प्रत्ययप्रसङ्गेऽनेकाक्षु च प्रत्ययेषु देशस्यानियमे सति वचनमिदमादेरुदात्तार्थम्।कर्तव्यम्। तैत्तिरीयम्॥
  vartika: []
  rule: |-
    A **प्रत्यय** takes the acute accent on its first syllable, unless a more specific rule places it elsewhere.
- id: '31004'
  ref: 3.1.4
  a: 3
  p: 1
  n: 4
  s: अनुदात्तौ सुप्पितौ
  iast: anudāttau suppitau
  type: V
  typeName: vidhi
  pada:
  - अनुदात्तौ
  - सुप्पितौ
  adhikara: प्रत्ययः
  inherits: []
  feeds: []
  meaning: The first letter of the सुप् and the पित् प्रत्ययाः is अनुदात्त.
  kashika: |-
    पूर्वस्यायमपवादः। सुपः पितश्च प्रत्यया अनुदात्ता भवन्ति। दृषदौ। दृषदः। पितःखल्वपि — पचति। पठति॥
  vartika: []
  rule: |-
    The **सुप्** case-endings and **पित्** affixes (those with indicatory प) are अनुदात्त. This blocks 3.1.3.
- id: '31005'
  ref: 3.1.5
  a: 3
  p: 1
  n: 5
  s: गुप्तिज्किद्भ्यः सन्
  iast: guptijkidbhyaḥ san
  type: V
  typeName: vidhi
  pada:
  - गुप्-तिज्-किद्भ्यः
  - सन्
  adhikara: प्रत्ययः
  inherits: []
  feeds:
  - word: सन्
    to: 3.1.6
  - word: सन्
    to: 3.1.7
  meaning: ''
  kashika: |-
    <<गुप गोपने>> , <<तिज निशाने>> , <<कित निवासे>>  एतेभ्यो धातुभ्यः सन् प्रत्ययो भवति। प्रत्ययसंज्ञा चाधिकृतैव। जुगुप्सते। तितिक्षते। चिकित्सति॥ निन्दाक्षमाव्याधिप्रतीकारेषु सन्निष्यतेऽन्यत्र यथाप्राप्तं प्रत्यया भवन्ति॥ गोपयति। तेजयति। सङ्केतयति। गुपादिष्वनुबन्धकरणमात्मनेपदार्थम्॥
  vartika: []
  rule: |-
    गुप्, तिज्, and कित् take **सन्** — गुप् in the sense of despising, तिज् of enduring, कित् of healing: जुगुप्सते, तितिक्षते, चिकित्सते.
- id: '31006'
  ref: 3.1.6
  a: 3
  p: 1
  n: 6
  s: मान्बधदान्शान्भ्यो दीर्घश्चाभ्यासस्य
  iast: mānbadhadānśānbhyo dīrghaścābhyāsasya
  type: V
  typeName: vidhi
  pada:
  - मान्-बध-दान्-शान्भ्यः
  - दीर्घः
  - च
  - अभ्यासस्य
  adhikara: प्रत्ययः
  inherits:
  - word: सन्
    from: 3.1.5
  feeds: []
  meaning: ''
  kashika: |-
    <<मान पूजायाम्>>,  <<बध बन्धने>>, <<दान अवखण्डने>>, <<शान अवतेजने>> इत्येतेभ्यो  धातुभ्यः सन् प्रत्ययो भवति, अभ्यासस्य चेकारस्य दीर्घादेशो भवति। मीमांसते। बीभत्सते। दीदांसते। शीशांसते। उत्तरसूत्रे वाग्रहणं सर्वस्य शेषो विज्ञायते, तेन क्वचिद् न भवत्यपि। मानयति। बाधयति। दानयति। निशानयति॥ अत्रापि सन्नर्थविशेष इष्यते॥ मानेर्जिज्ञासायाम्, बधेर्वैरूप्ये, दानेरार्जवे, शानेर्निशाने॥
  vartika: []
  rule: |-
    मान्, बध्, दान्, and शान् take **सन्**, and the इ of the **अभ्यास** (reduplicate) becomes long ई: मीमांसते, बीभत्सते, दीदांसते, शीशांसते.
