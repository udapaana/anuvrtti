  s: णिश्रिद्रुस्रुभ्यः कर्तरि चङ्
  iast: ṇiśridrusrubhyaḥ kartari caṅ
  type: V
  typeName: vidhi
  pada:
  - णि-श्रि-द्रु-स्रुभ्यः
  - कर्तरि
  - चङ्
