    from: 3.1.93
  - word: कृत्याः
    from: 3.1.95
  - word: क्यप्
    from: 3.1.106
  feeds: []
  meaning: ''
  kashika: |-
    खनेर्धातोः क्यप् प्रत्ययो भवति, ईकारश्चान्तादेशः। खेयम्। दीर्घनिर्देशः प्रश्लेषार्थः। तत्र द्वितीय इकारो <<ये विभाषा>> (६.४.४३) इत्यात्वबाधनार्थः॥
  vartika: []
  rule: खन् takes **क्यप्**, and long ई replaces its final.
- id: '31112'
  ref: 3.1.112
  a: 3
  p: 1
  n: 112
  s: भृञोऽसंज्ञायाम्
  iast: bhṛño'saṃjñāyām
  type: V
  typeName: vidhi
  pada:
  - भृञः
  - असंज्ञायाम्
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  - word: कृत्याः
    from: 3.1.95
  - word: क्यप्
    from: 3.1.106
  feeds: []
  meaning: ''
  kashika: |-
    भृञो धातोरसंज्ञायां विषये क्यप् प्रत्ययो भवति। भृत्याः कर्मकराः। भर्तव्या इत्यर्थः। असंज्ञायामिति किम्? भार्यो नाम क्षत्रियः॥ संपूर्वाद् विभाषा॥ संभृत्याः, संभार्याः॥

    संज्ञायां पुंसि दृष्टत्वान्न ते भार्या प्रसिध्यति।

    स्त्रियां भावाधिकारोऽस्ति तेन भार्या प्रसिध्यति॥
  vartika:
  - समश्च बहुलम् ।
  rule: भृञ् takes **क्यप्** when the word is not a name.
