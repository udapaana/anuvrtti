  meaning: ''
  kashika: |-
    सुब्रह्मण्या नाम निगदस्तत्र <<यज्ञकर्मण्य०>> (१.२.३४) इति <<विभाषा छन्दसि>> (१.२.३६) इति चैकश्रुतिः प्राप्ता प्रतिषिध्यते। सुब्रह्मण्यायामेकश्रुतिर्न भवति। यस्तु लक्षणप्राप्तः स्वरितस्तस्योदात्त आदेशो भवति। सुब्रह्मण्यो॒३म् इन्द्रा॒गच्छ, ह॒रिव आ॒गच्छ, मे॒धातिथेर्मेष, वृ॒षणश्वस्य मेने, गौ॒रावस्कन्दिन्न॒हल्यायै जार, कौ॒शिकब्राह्मण गौ॒तमब्रुवाण, श्वः॒ सु॒त्यामा॒गच्छ म॒घवन् (श०ब्रा० ३.३.४.१७ — १९)। अत्र सुब्रह्मण्योमित्योकारस्तित्स्वरेण स्वरितस्तस्योदात्तो विधीयते। इन्द्र आगच्छेत्यामन्त्रितमाद्युदात्तं द्वितीयो वर्णोऽनुदात्तः। <<उदात्तादनुदात्तस्य स्वरितः>> (८.४.६६) इति स्वरितः प्रसक्तस्तस्यानेनोदात्तः क्रियते । तेन द्वावप्युदात्तौ संपन्नौ। आगच्छेत्याकार उदात्तः। ततः परोऽनुदात्तः स्वरितस्तस्यानेनोदात्तः क्रियते । तदेवमिन्द्र आगच्छेति चत्वार उदात्ताः। पश्चिम एकोऽनुदात्तः। हरिव आगच्छेत्यनयैव प्रक्रियया चत्वार उदात्ता द्वावनुदात्तौ। मेधातिथेरिति षष्ठ्यन्तं परमामन्त्रितमनुप्रविशति। <<सुबामन्त्रिते पराङ्गवत् स्वरे>> (२.१.२)इति। ततः सकलस्यामन्त्रिताद्युदात्तत्वे कृते द्वितीयमक्षरमनुदात्तम्, तस्य <<उदात्तादनुदात्तस्य स्वरितः>> (८.४.६६) इति स्वरितत्वे प्राप्त इदमुदात्तत्वं विधीयते। तेन द्वावप्युदात्तौ भवतः, शेषमनुदात्तम्। वृषणश्वस्य मेने इति समानं पूर्वेण। गौरावस्कन्दिन्निति तथैव द्वे आद्ये अक्षरे उदात्ते, शेषमनुदात्तम्। अहल्यायै जारेति सुबन्तस्यामन्त्रितानुप्रवेशात् तद्वदेव स्वरः। द्वावुदात्तौ, शेषमनुदात्तम्। कौशिकब्राह्मणेति समस्तमामन्त्रितमाद्युदात्तं तत्र पूर्ववद् द्वावुदात्तौ, शेषमनुदात्तम्। एवं गौतमब्रुवाणेति द्वावुदात्तौ, शेषमनुदात्तम्। श्वः सुत्यामागच्छ मघवन्निति श्वःशब्द उदात्तः सुत्यामित्यन्तोदात्तः। <<संज्ञायां समजनिषद०>>(३.३.९९) इति क्यपो विधान उदात्त इति वर्तते। आगच्छेति द्वावुदात्तौ। अन्त्योऽनुदात्तः। मघवन्निति पदात् परमामन्त्रितं निहन्यते॥
  vartika: []
  rule: |-
    In the **सुब्रह्मण्या** there is no **एकश्रुति**, and a vowel that would be **स्वरित** becomes **उदात्त** instead.
