  meaning: |-
    For a verb root that does not end in a संयोग, the अपित् प्रत्यय of  लिट्-लकार behaves like a कित् प्रत्यय.
  kashika: |-
    अपिदिति वर्तते। असंयोगान्ताद् धातोः परो लिट् प्रत्ययोऽपित् किद् भवति। बिभिदतुः, बिभिदुः। चिच्छिदतुः, चिच्छिदुः। ईजतुः, ईजुः। असंयोगादिति किम्? सस्रंसे। दध्वंसे। अपिदित्येव — बिभेदिथ॥
  vartika:
  - ऋदुपधेभ्यो लिटः कित्त्वं गुणात्पूर्वप्रतिषेधेन ।
  rule: |-
    After a root not ending in a conjunct, a **लिट्** affix that is not **पित्** counts as **कित्**.
- id: '12006'
  ref: 1.2.6
  a: 1
  p: 2
  n: 6
  s: इन्धिभवतिभ्यां च
  iast: indhibhavatibhyāṃ ca
  type: AT
  typeName: atideśa
  pada:
  - इन्धि-भवतिभ्यां
  - च
  adhikara: ''
  inherits:
  - word: लिट्
    from: 1.2.5
  - word: कित्
    from: 1.2.5
  feeds: []
  meaning: ''
  kashika: |-
    इन्धिभवतीत्येताभ्यां परो लिट् प्रत्ययः किद् भवति। समी॑धे दस्यु॒हन्त॑मम् (ऋ० ६.१६.१५)। पु॒त्र ई॑धे॒ अथ॑र्वणः (ऋ० ६.१६.१४)। भवतेः खल्वपि — बभूव। बभूविथ। इन्धेः संयोगार्थं ग्रहणम्। भवतेः पिदर्थम्। अत्रेष्टिः॥ श्रन्थिग्रन्थिदम्भिस्वञ्जीनामिति वक्तव्यम्॥ श्रेथतुः, श्रेथुः। ग्रेथतुः। ग्रेथुः। देभतुः, देभुः। परिषस्वजे, परिषस्वजाते॥
  vartika:
  - श्रन्थिग्रन्थिदम्भिस्वञ्जीनां लिटः कित्वम् [वा]।
  rule: After **इन्ध्** and **भू**, the **लिट्** affixes count as **कित्**.
- id: '12007'
  ref: 1.2.7
  a: 1
  p: 2
  n: 7
  s: मृडमृदगुधकुषक्लिशवदवसः क्त्वा
  iast: mṛḍamṛdagudhakuṣakliśavadavasaḥ ktvā
  type: AT
  typeName: atideśa
  pada:
  - मृड-मृद-गुध-कुष-क्लिश-वद-वसः
  - क्त्वा
  adhikara: ''
  inherits:
  - word: कित्
    from: 1.2.5
  feeds:
  - word: क्त्वा
    to: 1.2.8
  meaning: ''
  kashika: |-
    मृड मृद गुध कुष क्लिश वद वस् इत्येतेभ्यः परः क्त्वा प्रत्ययः किद् भवति।  <<न क्त्वा सेट्>> (१.२.१८) इति कित्त्वप्रतिषेधं वक्ष्यति, तस्यायं पुरस्तादपकर्षः। गुधकुषक्लिशीनां तु <<रलो व्युपधाद्धलादेः संश्च>> (१.२.२६) इति विकल्पे प्राप्ते नित्यार्थं वचनम्। मृडित्वा। मृदित्वा। गुधित्वा। कुषित्वा। क्लिशित्वा। उदित्वा। उषित्वा॥
  vartika: []
  rule: |-
    After **मृड्**, **मृद्**, **गुध्**, **कुष्**, **क्लिश्**, **वद्**, and **वस्**, the affix **क्त्वा** is **कित्**.
