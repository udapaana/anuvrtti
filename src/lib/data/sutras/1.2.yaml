    to: 1.2.10
  meaning: ''
  kashika: |-
    रुद विद मुष ग्रहि स्वपि प्रच्छ इत्येतेभ्यः संश्च क्त्वा च कितौ भवतः। रुदविदमुषीणां <<रलो व्युपधाद्धलादेः संश्च>> (१.२.२६) इति विकल्पे प्राप्ते नित्यार्थं ग्रहणम्। ग्रहेर्विध्यर्थमेव। स्वपिप्रच्छ्योः सन्नर्थं ग्रहणम्। किदेव हि क्त्वा। रुदित्वा, रुरुदिषति। विदित्वा, विविदिषति। मुषित्वा, मुमुषिषति। गृहीत्वा, जिघृक्षति। सुप्त्वा, सुषुप्सति। पृष्ट्वा, पिपृच्छिषति। ग्रहादीनां कित्त्वात् संप्रसारणं भवति। <<किरश्च पञ्चभ्यः>> (७.२.७५) इति प्रच्छेरिडागमः॥
  vartika: []
  rule: |-
    After **रुद्**, **विद्**, **मुष्**, **ग्रह्**, **स्वप्**, and **प्रच्छ्**, the affixes **क्त्वा** and **सन्** are **कित्**.
