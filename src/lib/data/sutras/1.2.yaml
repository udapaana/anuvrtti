# Adhyāya 1, Pāda 2 — 73 sūtras
sutras:
- id: '12001'
  ref: 1.2.1
  a: 1
  p: 2
  n: 1
  s: गाङ्कुटादिभ्योऽञ्णिन्ङित्
  iast: gāṅkuṭādibhyo'ñṇinṅit
  type: AT
  typeName: atideśa
  pada:
  - गाङ्-कुट्-आदिभ्यः
  - अ-ञ्णित्
  - ङित्
  adhikara: ''
  inherits: []
  feeds:
  - word: ङित्
    to: 1.2.2
  - word: ङित्
    to: 1.2.3
  - word: ङित्
    to: 1.2.4
  meaning: |-
    The non-ञित् and non-णित्  प्रत्ययाः attached to the - (1) the 'गाङ्' आदेश (that happens to the धातु 'इङ् अध्ययने'), and (2) the verbs of the कुटादिगण (an अन्तर्गण of तुदादिगण) - behave as if they are ङित्.
  kashika: |-
    अतिदेशोऽयम्। गाङिति इङादेशो गृह्यते, न <<गाङ् गतौ>> इति,ङकारस्यानन्यार्थत्वात्। कुटादयोऽपि <<कुट कौटिल्ये>> इत्येतदारभ्य यावत् <<कुङ् शब्दे>> इति। एभ्यो गाङ्कुटादिभ्यः परेऽञ्णितः प्रत्यया ङितो भवन्ति, ङिद्वद् भवन्तीत्यर्थः। गाङ ः — अध्यगीष्ट, अध्यगीषाताम्, अध्यगीषत। कुटादिभ्यः — उत्कुटिता। उत्कुटितुम्। उत्कुटितव्यम्। उत्पुटिता। उत्पुटितुम्। उत्पुटितव्यम्। अञ्णिदिति किम्? उत्कोटयति। उच्चुकोट। उत्कोटकः। उत्कोटो वर्तते॥ व्यचेः कुटादित्वमनसीति वक्तव्यम्॥ विचिता। विचितुम्। विचितव्यम्। अनसीति किम्? उरुव्यचाः॥
  vartika:
  - व्यचेः कुटादित्वमनसीति वक्तव्यम् ।
  rule: |-
    After **गाङ्** and the **कुट्**-series roots, every **प्रत्यय** counts as **ङित्** — except a **ञित्** or **णित्** one.
- id: '12002'
  ref: 1.2.2
  a: 1
  p: 2
  n: 2
  s: विज इट्
  iast: vija iṭ
  type: AT
  typeName: atideśa
  pada:
  - विजः
  - इट्
  adhikara: ''
  inherits:
  - word: ङित्
    from: 1.2.1
  feeds:
  - word: इट्
    to: 1.2.3
  meaning: |-
    A प्रत्यय that gets an इडागम is considered ङित् when attached to the dhatu 'विज्'.
  kashika: |-
    <<ओविजी भयचलनयोः>> अस्मात् पर इडादिः प्रत्ययो ङिद्वद् भवति। उद्विजिता। उद्विजितुम्। उद्विजितव्यम्। इडिति किम्? उद्वेजनम्। उद्वेजनीयम्॥
  vartika: []
  rule: |-
    After **विज्**, a **प्रत्यय** that starts with the augment **इट्** counts as **ङित्**.
- id: '12003'
  ref: 1.2.3
  a: 1
  p: 2
  n: 3
  s: विभाषोर्णोः
  iast: vibhāṣorṇoḥ
  type: AT
  typeName: atideśa
  pada:
  - विभाषा
  - ऊर्णोः
  adhikara: ''
  inherits:
  - word: ङित्
    from: 1.2.1
  - word: इट्
    from: 1.2.2
  feeds: []
  meaning: ''
  kashika: |-
    इडिति वर्तते। <<ऊर्णुञ् आच्छादने>> अस्मात् पर इडादिः प्रत्ययो विभाषा ङिद्वद् भवति। प्रोर्णुविता, प्रोर्णविता। इडित्येव — प्रोर्णवनम्। प्रोर्णवनीयम्॥
  vartika: []
  rule: |-
    After **ऊर्णु**, a **प्रत्यय** that starts with the augment **इट्** optionally counts as **ङित्**.
- id: '12004'
  ref: 1.2.4
  a: 1
  p: 2
  n: 4
  s: सार्वधातुकमपित्
  iast: sārvadhātukamapit
  type: AT
  typeName: atideśa
  pada:
  - सार्वधातुकम्
  - अपित्
  adhikara: ''
  inherits:
  - word: ङित्
    from: 1.2.1
  feeds:
  - word: अपित्
    to: 1.2.5
  meaning: 'An अपित् सार्वधातुकप्रत्ययः behaves like a ङित् प्रत्यय. '
  kashika: |-
    सार्वधातुकं यदपित् तद् ङिद्वद् भवति। कुरुतः, कुर्वन्ति। चिनुतः, चिन्वन्ति। सार्वधातुकमिति किम्? कर्ता। कर्तुम्। कर्तव्यम्। अपिदिति किम्? करोति। करोषि। करोमि॥
  vartika: []
  rule: A **सार्वधातुक** affix that is not **पित्** counts as **ङित्**.
