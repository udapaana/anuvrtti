  meaning: ''
  kashika: |-
    पथिमथिशब्दावौणादिकाविनिप्रत्ययान्तौ प्रत्ययस्वरेणान्तोदात्तौ, तयोः सर्वनामस्थाने परत आदिरुदात्तो भवति। पन्थाः॑, पन्था॑नौ, पन्था॑नः। मन्थाः॑, मन्था॑नौ, मन्था॑नः। सर्वनामस्थान इति किम् ? प॒थः पश्य। म॒थः पश्य। उदात्तनिवृत्तिस्वरेणान्तोदात्तो भवति। प्रत्ययलक्षणमत्रापि नेष्यते। प॒थिपि्॑रय इत्यत्र पूर्वपदप्रकृतिस्वरेणान्तोदात्तः पथिशब्दः॥
  vartika: []
  rule: |-
    पथिन् and मथिन् take the acute on their first syllable before a **सर्वनामस्थान** ending.
- id: '61200'
