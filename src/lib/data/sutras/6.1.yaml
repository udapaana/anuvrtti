    from: 6.1.94
  - word: अव्यक्तानुकरणस्य
    from: 6.1.98
  feeds: []
  meaning: |-
    When a word which is used to imitate some abstract sound and which ends is the phrase 'त्' is followed by an आम्रेडितसंज्ञक which is further followed by the pratyay डाच्, then the 'त्' of the first word and the first letter of the आम्रेडितसंज्ञक are combined to form a पररूप-एकादेश.
  kashika: |-
    अव्यक्त ानुकरणस्य, अतः, अन्त्यस्येति चानुवर्तते। डाच्परं यदाम्रेडितं तस्मिन् पूर्वस्याव्यक्त ानुकरणस्याच्छब्दस्य योऽन्त्यस्तकारस्तस्य पूर्वस्य परस्य चाद्यस्य वर्णस्य नित्यं पररूपमेकादेशो भवति। पटपटा करोति। दमदमा करोति। पटदित्यस्माद् <<अव्यक्त ानुकरणाद्॰>> [[५.४.५७]] इति डाचि विहिते <<डाचि बहुलम्०>> (८.१.१२ वा०) इति द्विर्वचनम्, तच्च टिलोपात् पूर्वमेवेष्यते॥
  vartika: []
  rule: |-
    When such a doubled sound-imitation word takes the affix डाच्, the final त् of the first member together with the initial consonant of the second member always becomes that following consonant (पररूप).
