  meaning: ''
  kashika: |-
    एङ ोऽति इत्येव। एङ इति यत् पञ्चम्यन्तमनुवर्तते, तदर्थादिह प्रथमान्तं भवति। प्रकृतिरिति स्वभावः कारणं  वाभिधीयते। अन्तरित्यव्ययमधिकरणभूतं मध्यमाचष्टे। पादशब्देन च ऋक्पादस्यैव ग्रहणमिष्यते, न तु श्लोकपादस्य। अवकारयकारपरेऽति परत एङ्  प्रकृत्या भवति। स्वभावेनावतिष्ठते, कारणात्मना वा भवति, न विकारमापद्यते। तौ चेद् निमित्तकार्यिणावन्तः पादमृक्पादमध्ये भवतः। ते अग्रे अश्व॑॑मायुञ्ज॒न् (मा० सं०९.७)। ते अ॑॑स्मिन् ज॒वमाद॑॑धुः (मा० सं० ९.७)। उ॒प॒प्॒रयन्ता॑े॑ अध्व॒रम्(ऋ०१.७४.१)। शिरो॑ अपश्यम्(ऋ०१.१६३.६)। सुजा॑ते॒ अश्व॑सूनृते(ऋ०५.७९.१)। अध्व॑र्यो॒ अदि्॑॑रभिः सु॒तम् (ऋ०९.५१.१)। अन्तः पादमिति किम् ? कया॑ म॒ती कुत॒ एता॑स ए॒तेऽर्च॑न्ति॒ (ऋ० १.१६५.१)। अव्यपर  इति किम् ? त॑े॑ऽवदन् (ऋ०१०.१०९.१)। तेजोऽय॒स्मय॒म् (मा० सं०१२.६३)। एङिति किम् ? अन्व॒ग्निरु॒षसा॒मग्॑॑रमख्य॒त् (शौ० सं० ७.८२.४)। केचिदिदं सूत्रं नान्तःपादमव्यपर इति पठन्ति, ते संहितायामिह यदुच्यते तस्य सर्वस्य प्रतिषेधं वर्णयन्ति॥
  vartika: []
  rule: |-
    Inside a **पाद** of a Vedic verse, a final ए or ओ and the following अ each keep their own form, unless व् or य् follows that अ.
