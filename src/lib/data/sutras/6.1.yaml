    to: 6.1.76
  meaning: "A ह्रस्व स्वर gets a तुक्-आगमः when followed by a छकार, in the context of संहिता. "
  kashika: |-
    ह्रस्वस्य तुगिति वर्तते। छकारे परतः संहितायां विषये ह्रस्वस्य तुगागमो भवति। इच्छति। यच्छति। ह्रस्व एवात्रागमी, न तु तदन्तः। तेन चिच्छिदतुश्चिच्छिदुरित्यत्र  तुगभ्यासस्य ग्रहणेन न गृह्यत इति हलादिःशेषेण न निवर्त्यते, नावयवावयवः समुदायावयवो भवतीति॥
  vartika: []
  rule: |-
    Before छ, a preceding short vowel takes the augment **तुक्** (त्). The augment attaches to the short vowel itself, not to the word that ends in it.
- id: '61074'
  ref: 6.1.74
  a: 6
  p: 1
  n: 74
  s: आङ्माङोश्च
  iast: āṅmāṅośca
