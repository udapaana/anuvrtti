  feeds: []
  meaning: ''
  kashika: |-
    चन्द्रशब्द उत्तरपदे ह्रस्वात् परः सुडागमो भवति मन्त्रविषये। सुश्च॑न्द्॒र (ऋ॰ ५.६.५) युष्मान्। ह्रस्वादिति किम् ? सूर्याचन्द्र॒मसा॑विव (ऋ॰ ५.५१.१५)। मन्त्र इति किम् ? सुचन्द्रा पौर्णमासी। उत्तरपदं समास एव भवतीति प्रसिद्धम्, तत इह न भवति — शु॒क्रम॑सि च॒न्द्रम॑सि (मा॰ सं॰ ४.१८)॥
  vartika: []
  rule: |-
    In a **मन्त्र**, चन्द्र takes **सुट्** as the second member of a compound after a short vowel.
- id: '61152'
