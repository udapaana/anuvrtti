  kashika: "समासस्यान्त उदात्तो भवति। रा॒ज॒पु॒रु॒षः। ब्रा॒ह्म॒ण॒क॒म्ब॒लः। क॒न्या॒स्व॒नः। प॒ट॒ह॒श॒ब्दः।\
    \ न॒दी॒घो॒षः। रा॒ज॒पृ॒षत्। ब्रा॒ह्म॒ण॒स॒मित्। <<स्वरविधौ व्यञ्जनमविद्यमानवद्०>>इति हलन्तेऽप्यन्तोदात्तत्वं\
    \ भवति। नानापदस्वरस्यापवादः॥ \n\n॥ इति श्रीवामनविरचितायां काशिकायां वृत्तौ षष्ठाध्यायस्य प्रथमः पादः॥"
  vartika: []
  rule: |-
    A **समास** takes the **उदात्त** on its last syllable (consonants count as absent, so the accent lands on the last vowel even when a consonant follows).
