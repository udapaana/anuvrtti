    अव्यात् अवद्यात् अवक्रमुः अव्रत अयम् अवन्तु अवस्यु इत्येतेषु वकारयकारपरेऽप्यति परतोऽन्तः पादमेङ्  प्रकृत्या भवति। अ॒ग्निः प्॑॑रथ॒मो वस॑ु॑भिर्नो अव्या॒त् (तै० सं० २.१.११.२)। मि॑॑त्रमहो अव॒द्यात् (ऋ० ४.४.१५)। माशि॑वासो॒ अव॑॑क्रमुः (ऋ० ७.३२.२७)। ते ना॑े॑ अव्रताः। शा॑॑तवा॒रो अ॒यं म॒णिः (शौ० सं० १९.३६.५)। ते ना॑े॑ अवन्तु पि॒तरः॒ (ऋ० १०.१५.१)। कु॒शि॒कासा॑े॑ अव॒स्यव॑ः॑ (ऋ० ३.४२.९)॥
  vartika: []
  rule: |-
    Inside a **पाद**, ए or ओ and the following अ keep their forms before अव्यात्, अवद्यात्, अवक्रमुः, अव्रत, अयम्, अवन्तु, अवस्यु, even though व् or य् follows.
