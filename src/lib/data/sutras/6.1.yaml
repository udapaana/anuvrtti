  adhikara: संहितायाम्
  inherits:
  - word: ह्रस्वस्य
    from: 6.1.71
  - word: तुक्
    from: 6.1.71
  feeds: []
  meaning: |-
    This is an अधिकार that runs till <<पारस्करप्रभृतीनि च संज्ञायाम्>> [[6.1.157]]. Anything told in this अधिकार happens only in the context of संहिता.
  kashika: |-
    अधिकारोऽयम् <<अनुदात्तं पदमेकवर्जम्>> [[६.१.१५८]] इति यावत्। प्रागेतस्मात् सूत्रादित उत्तरं यद् वक्ष्यामः संहितायामित्येवं तद् वेदितव्यम्। वक्ष्यति — <<इको यणचि>> [[६.१.७७]] — दध्यत्र। मध्वत्र। संहितायामिति  किम् ? दधि अत्र। मधु अत्र॥
  vartika: []
  rule: |-
    In every rule from here through [[6.1.157]], supply **संहितायाम्** (in continuous, unbroken speech).
