  adhikara: ''
  inherits:
  - word: एकवचनम्
    from: 2.4.1
  - word: द्वन्द्वः
    from: 2.4.2
  - word: न
    from: 2.4.14
  feeds:
  - word: अधिकरणैतावत्त्वे
    to: 2.4.16
  meaning: ''
  kashika: |-
    नेति वर्तते। अधिकरणं वर्त्तिपदार्थः। स हि समासस्यार्थस्याधारः। तस्यैतावत्त्वे परिमाणे गम्यमाने द्वन्द्वो नैकवद् भवति। यथायथमेकद्भावः प्राप्तः प्रतिषिध्यते। दश दन्तोष्ठाः। दश मार्दङ्गिकपाणविकाः॥
  vartika: []
  rule: |-
    A **द्वन्द्व** that fixes the count of concrete things is not singular (दश दन्तोष्ठाः).
- id: '24016'
  ref: 2.4.16
  a: 2
  p: 4
  n: 16
  s: विभाषा समीपे
  iast: vibhāṣā samīpe
  type: V
  typeName: vidhi
  pada:
  - विभाषा
  - समीपे
  adhikara: ''
  inherits:
  - word: एकवचनम्
    from: 2.4.1
  - word: द्वन्द्वः
    from: 2.4.2
  - word: अधिकरणैतावत्त्वे
    from: 2.4.15
  feeds: []
  meaning: ''
  kashika: |-
    अधिकरणैतावत्त्वस्य समीपे विभाषा द्वन्द्व एकवद् भवति। उपदशं दन्तोष्ठम्, उपदशा दन्तोष्ठाः। उपदशं मार्दङ्गिकपाणविकम्, उपदशा मार्दङ्गिकपाणविकाः। अव्ययस्य संख्ययाव्ययीभावोऽपि विहितो बहुव्रीहिरपि, तत्रैकवद्भावपक्षेऽव्ययीभावोऽनुप्रयुज्यते, इतरत्र बहुव्रीहिः॥
  vartika: []
  rule: |-
    A **द्वन्द्व** giving an approximate count of concrete things is optionally singular (उपदशं दन्तोष्ठम्).
- id: '24017'
