  iast: luṭaḥ prathamasya ḍāraurasaḥ
  type: V
  typeName: vidhi
  pada:
  - लुटः
  - प्रथमस्य
  - डा-रौ-रसः
  adhikara: ''
  inherits: []
  feeds: []
  meaning: |-
    The प्रथमपुरुष प्रत्ययाः of लुट्-लकार are converted respectively to डा, रौ and रस्.
  kashika: |-
    लुडादेशस्य प्रथमपुरुषस्य परस्मैपदस्यात्मनेपदस्य च यथाक्रमं डा रौ रस् इत्येत आदेशा भवन्ति। कर्ता, कर्तारौ, कर्तारः। आत्मनेपदस्य — अध्येता, अध्येतारौ, अध्येतारः। प्रथमस्येति किम्? श्वः कर्तासि। श्वोऽध्येतासे॥

    ॥ इति श्रीजयादित्यविरचितायां काशिकायां वृत्तौ द्वितीयाध्यायस्य चतुर्थः पादः॥
  vartika: []
  rule: |-
    For the three third-person **लुट्** endings, **परस्मैपद** and **आत्मनेपद** alike, **डा**, **रौ**, **रस्** are the substitutes respectively.
