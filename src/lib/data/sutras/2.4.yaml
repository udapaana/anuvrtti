  n: 22
  s: छाया बाहुल्ये
  iast: chāyā bāhulye
  type: V
  typeName: vidhi
  pada:
  - छाया
  - बाहुल्ये
  adhikara: तत्पुरुषोऽनञ्कर्मधारयः
  inherits:
  - word: नपुंसकम्
    from: 2.4.17
  feeds: []
  meaning: ''
  kashika: |-
    <<विभाषा सेनासुराच्छाया०>> [[२.४.२५]] इति विभाषां वक्ष्यति, नित्यार्थमिदं वचनम्। छायान्तस्तत्पुरुषो नपुंसकलिङ्गो भवति बाहुल्ये गम्यमाने। पूर्वपदार्थधर्मो बाहुल्यम्। शलभादीनां हि बहुत्वं गम्यते। शलभच्छायम्। इक्षुच्छायम्। बाहुल्य इति किम्? कुड्यच्छाया॥
  vartika: []
  rule: |-
    A **तत्पुरुष** ending in छाया is neuter when it means a dense mass of the first thing (शलभच्छायम्, a sky-darkening swarm of locusts).
- id: '24023'
  ref: 2.4.23
  a: 2
  p: 4
  n: 23
  s: सभा राजामनुष्यपूर्वा
  iast: sabhā rājāmanuṣyapūrvā
  type: V
  typeName: vidhi
  pada:
  - सभा
  - राज-अ-मनुष्य-पूर्वा
  adhikara: तत्पुरुषोऽनञ्कर्मधारयः
  inherits:
  - word: नपुंसकम्
    from: 2.4.17
  feeds:
  - word: सभा
    to: 2.4.24
  meaning: ''
  kashika: |-
    सभान्तस्तत्पुरुषो नपुंसकलिङ्गो भवति, सा चेत् सभा राजपूर्वा अमनुष्यपूर्वा च भवति। इनसभम्। ईश्वरसभम्। इह कस्माद् न भवति — राजसभा? पर्यायवचनस्यैवेष्यते। तदुक्तम् — <<जित् पर्यायस्यैव राजाद्यर्थम्>> (१.१.६८ वा०) इति। अमनुष्यपूर्वा — रक्षःसभम्। पिशाचसभम्। इह कस्माद् न भवति — काष्ठसभा? अमनुष्यशब्दो रूढिरूपेण रक्षःपिशाचादिष्वेव वर्तते। राजामनुष्यपूर्वेति किम्? देवदत्तसभा॥
  vartika: []
  rule: |-
    A **तत्पुरुष** ending in सभा is neuter when preceded by a synonym of राजा or by a word for a non-human being (इनसभम्, रक्षःसभम्).
- id: '24024'
