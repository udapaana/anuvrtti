  meaning: ''
  kashika: |-
    सेना सुरा छाया शाला निशा इत्येवमन्तस्तत्पुरुषो नपुंसकलिङ्गो भवति विभाषा। ब्राह्मणसेनम्, ब्राह्मणसेना। यवसुरम्, यवसुरा। कुड्यच्छायम्, कुड्यच्छाया। गोशालम्, गोशाला। श्वनिशम्, श्वनिशा॥
