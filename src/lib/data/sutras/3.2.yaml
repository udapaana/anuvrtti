  meaning: ''
  kashika: |-
    अभिज्ञा स्मृतिः, तद्ववचन उपपदे भूतानद्यतने लृट् प्रत्ययो भवति। लङोऽपवादः। अभिजानासि देवदत्त कश्मीरेषु वत्स्यामः। वचनग्रहणं पर्यायार्थम्। अभिजानासि, स्मरसि, बुध्यसे, चेतयस इति॥
  vartika: []
  rule: |-
    With a word for recollection (**अभिज्ञा**) connected to it, a root takes लृट् (second future) for past sense before the current day, blocking लङ् (अभिजानासि देवदत्त कश्मीरेषु वत्स्यामः); वचन extends this to अभिज्ञा's synonyms.
