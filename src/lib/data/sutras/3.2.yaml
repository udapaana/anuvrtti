    प्र उपपदे लपादिभ्यो घिनुण् भवति। प्रलापी। प्रसारी। प्रद्रावी। प्रमाथी। प्रवादी। प्रवासी। वस  इति <<वस निवासे>> इत्यस्य ग्रहणं नाच्छादनार्थस्य, लुग्विकरणत्वात्॥
  vartika: []
  rule: '**घिनुण्** comes after लप्, सृ, द्रु, मथ, वद्, and वस् when प्र is the upapada.'
- id: '32146'
  ref: 3.2.146
  a: 3
  p: 2
  n: 146
  s: निन्दहिंसक्लिशखादविनाशपरिक्षिपपरिरटपरिवादिव्याभाषासूञो वुञ्
  iast: nindahiṃsakliśakhādavināśaparikṣipapariraṭaparivādivyābhāṣāsūño vuñ
  type: V
  typeName: vidhi
  pada:
  - निन्द-हिंस-क्लिश-खाद-विनाश-परिक्षिप-परिरट-परिवादि-व्याभाष-असूयः
  - वुञ्
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  feeds: []
  meaning: ''
  kashika: |-
    निन्दादिभ्यो धातुभ्यस्तच्छीलादिषु कर्तृषु वुञ् प्रत्ययो भवति। पञ्चम्यर्थे प्रथमा। <<क्लिश उपतापे>> <<क्लिशू विबाधने>> द्वयोरपि ग्रहणम्। निन्दकः। हिंसकः। क्लेशकः। खादकः। विनाशकः। परिक्षेपकः। परिराटकः। परिवादकः। व्याभाषकः। असूयकः। ण्वुलैव सिद्धे वुञ्विधानं ज्ञापनार्थम् — ताच्छीलिकेषु वासरूपन्यायेन तृजादयो न भवन्ति (महाभाष्य २.१३३) इति॥
  vartika: []
  rule: |-
    **वुञ्** comes after निन्द्, हिंस्, क्लिश्, खाद्, विनाश्, परिक्षिप्, परिरट्, परिवद्, व्याभाष्, and असूय to name such an agent.
- id: '32147'
  ref: 3.2.147
  a: 3
  p: 2
  n: 147
  s: देविक्रुशोश्चोपसर्गे
  iast: devikruśoścopasarge
  type: V
  typeName: vidhi
  pada:
  - देवि-क्रुशोः
  - च
  - उपसर्गे
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  feeds: []
  meaning: ''
  kashika: |-
    देवयतेः क्रुशेश्चोपसर्ग उपपदे वुञ् प्रत्ययो भवति। आदेवकः। परिदेवकः। आक्रोशकः। परिक्रोशकः। उपसर्ग इति किम्? देवयिता। क्रोष्टा॥
  vartika: []
  rule: |-
    **वुञ्** comes after देवि (to lament) and क्रुश (to cry out) when an **उपसर्ग** is the upapada.
- id: '32148'
