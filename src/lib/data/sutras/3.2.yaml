  meaning: ''
  kashika: |-
    शक्तौ गम्यमानायां हस्तिकपाटयोः कर्मणोरुपपदयोर्हन्तेष्टक् प्रत्ययो भवति। मनुष्यकर्तृकार्थ आरम्भः। हस्तिनं हन्तुं शक्त ो हस्तिघ्नो मनुष्यः। कं पाटयति प्रविशत इति कपाटघ्नश्चौरः। शक्ताविति किम्? विषेण हस्तिनं हन्ति हस्तिघातः॥
  vartika: []
  rule: |-
    **टक्** comes after हन् when हस्ति or कपाट is the object compounded with it and capability is meant: हस्तिघ्नः (a man strong enough to kill an elephant), कपाटघ्नः. Without the capability sense, **अण्**: हस्तिघातः.
