  iast: krudhamaṇḍārthebhyaśca
  type: V
  typeName: vidhi
  pada:
  - क्रुध-मण्डार्थेभ्यः
  - च
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  - word: युच्
    from: 3.2.148
  feeds: []
  meaning: ''
  kashika: |-
    <<क्रुध कोपे>> <<मडि भूषायाम्>>  इत्येतदर्थेभ्यश्च धातुभ्यो युच् प्रत्ययो भवति। क्रोधनः। रोषणः। मण्डनः। भूषणः॥
  vartika: []
  rule: |-
    **युच्** also comes after verbs meaning क्रुध् (to be angry) and मण्ड (to adorn).
- id: '32152'
  ref: 3.2.152
  a: 3
  p: 2
  n: 152
  s: न यः
