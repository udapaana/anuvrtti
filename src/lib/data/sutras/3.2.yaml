- id: '32149'
  ref: 3.2.149
  a: 3
  p: 2
  n: 149
  s: अनुदात्तेतश्च हलादेः
  iast: anudāttetaśca halādeḥ
  type: V
  typeName: vidhi
  pada:
  - अनुदात्तेतः
  - च
  - हलादेः
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  - word: अकर्मकात्
    from: 3.2.148
  - word: युच्
    from: 3.2.148
  feeds: []
  meaning: ''
  kashika: |-
    अनुदात्तेद् यो धातुर्हलादिरकर्मकः, ततश्च युच् प्रत्ययो भवति। वर्तनः। वर्धनः। अनुदात्तेत इति किम्? भविता। हलादेरिति किम्? एधिता। आदिग्रहणं किम्? जुगुप्सनः। मीमांसनः। अकर्मकादित्येव — वसिता वस्त्रम्॥
  vartika: []
  rule: |-
    **युच्** also comes after an intransitive verb that is आत्मनेपदी, begins with a consonant, and is अनुदात्तेत् (has a gravely-accented indicatory vowel).
- id: '32150'
  ref: 3.2.150
  a: 3
  p: 2
  n: 150
  s: जुचङ्क्रम्यदन्द्रम्यसृगृधिज्वलशुचलषपतपदः
  iast: jucaṅkramyadandramyasṛgṛdhijvalaśucalaṣapatapadaḥ
  type: V
  typeName: vidhi
  pada:
  - जु-चङ्क्रम्य-दन्द्रम्य-सृ-गृधि-ज्वल-शुच-लष-पत-पदः
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  - word: युच्
    from: 3.2.148
  feeds: []
  meaning: ''
  kashika: |-
    जुप्रभृतिभ्यो धातुभ्यो युच् प्रत्ययो भवति तच्छीलादिषु कर्तृषु। जु इति सौत्रो धातुः। जवनः। चङ्क्रमणः। दन्द्रमणः। सरणः। गर्धनः। ज्वलनः। शोचनः। लषणः। पतनः। पदनः। चलनार्थानां पदेश्च ग्रहणं सकर्मकार्थमिह। ज्ञापकार्थं च पदिग्रहणमन्ये वर्णयन्ति — <<ताच्छीलिकेषु मिथो वासरूपविधिर्नास्ति>> इति। तेनालंकृञस्तृन् न भवति, अलंकर्तेति। तथाहि — पदेरुकञा विशेषविहितेन सामान्यविहितस्य युचोऽसरूपत्वात् समावेशो भवेदेव, किमनेन विधानेन? ज्ञापकार्थं पुनर्विधीयते। प्रायिकं चैतज् ज्ञापकम्। क्वचित् समावेश इष्यत एव। गन्ता खेटं विकत्थनः॥
  vartika: []
  rule: |-
    **युच्** comes after जु, चङ्क्रम्य, दन्द्रम्य, सृ, गृध, ज्वल, शुच, लष, पत, and पद to name such an agent.
- id: '32151'
