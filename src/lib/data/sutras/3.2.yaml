    to: 3.2.122
  meaning: ''
  kashika: |-
    भूत इत्येव। नशब्दे नुशब्दे चोपपदे पृष्टप्रतिवचने विभाषा लट् प्रत्ययो भवति भूते। अकार्षीः कटं देवदत्त? न करोमि भोः। नाकार्षम्। अहं नु करोमि। अहं न्वकार्षम्॥
  vartika: []
  rule: |-
    With न or नु connected to it, a root optionally takes लट् for past sense in an answer to a question (अकार्षीः कटं देवदत्त? — न करोमि / नाकार्षम्; अहं नु करोमि / अहं न्वकार्षम्).
- id: '32122'
