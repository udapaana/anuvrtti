  vartika: []
  rule: 'गत्वर is formed irregularly: drop the नासिक्य of गम् and add **क्वरप्**.'
- id: '32165'
  ref: 3.2.165
  a: 3
  p: 2
  n: 165
  s: जागुरूकः
  iast: jāgurūkaḥ
  type: V
  typeName: vidhi
  pada:
  - जागुः
  - ऊकः
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  feeds: []
  meaning: ''
  kashika: जागर्तेरूकः प्रत्ययो भवति तच्छीलादिषु कर्तृषु। जागरूकः॥
  vartika: []
  rule: After जागृ, **ऊक** attaches for the habitual agent.
- id: '32166'
  ref: 3.2.166
  a: 3
  p: 2
  n: 166
  s: यजजपदशां यङः
  iast: yajajapadaśāṃ yaṅaḥ
  type: V
  typeName: vidhi
  pada:
  - यज-जप-दशाम्
