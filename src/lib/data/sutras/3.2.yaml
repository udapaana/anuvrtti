    पुर् सर्व इत्येतयोः कर्मणोरुपपदयोर्यथासंख्यं दारिसहोर्धात्वोः खच् प्रत्ययो भवति। पुरं दारयति पुरंदरः। सर्वंसहो राजा॥ भगे च दारेरिति वक्तव्यम्॥ भगन्दरः॥
  vartika:
  - भगे च दारेरिति काशिका ।
  rule: |-
    **खच्** comes after दारि (to split) and सह् (to bear) when पुर् and सर्व respectively are the objects compounded with them: पुरन्दरः, सर्वंसहः. So also दारि with भग: भगन्दरः.
