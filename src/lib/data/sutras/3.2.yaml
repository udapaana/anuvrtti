  vartika: []
  rule: After या ending in **यङ्**, **वरच्** attaches for the habitual agent.
- id: '32177'
  ref: 3.2.177
  a: 3
  p: 2
  n: 177
  s: भ्राजभासधुर्विद्युतोर्जिपॄजुग्रावस्तुवः क्विप्
