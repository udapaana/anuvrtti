    **खच्** comes after भृ, तॄ, वृ, जि, धारि, सहि, तपि, दम् when an object compounded with it makes a name: विश्वम्भरा, रथन्तरम्, पतिंवरा, शत्रुञ्जयः, युगन्धरः, शत्रुंसहः, शत्रुन्तपः, अरिन्दमः. Without the name sense: कुटुम्बभारः.
