    भूत इत्येव। भूतेऽर्थ वर्तमानाद् धातोर्लुङ् प्रत्ययो भवति। अकार्षीत्। अहार्षीत्॥ वसतेर्लुङ् रात्रिशेषे जागरणसंततौ वक्तव्यः॥  क्व भवानुषितः? अहमत्रावात्सम्॥
