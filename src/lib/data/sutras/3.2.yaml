  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  feeds: []
  meaning: ''
  kashika: |-
    यजादीनां यङन्तानामूकः प्रत्ययो भवति तच्छीलादिषु कर्तृषु। यायजूकः। जञ्जपूकः। दन्दशूकः॥
  vartika: []
  rule: |-
    After यज्, जप्, and दश् when they end in **यङ्**, **ऊक** attaches for the habitual agent.
- id: '32167'
  ref: 3.2.167
  a: 3
  p: 2
  n: 167
  s: नमिकम्पिस्म्यजसकमहिंसदीपो रः
  iast: namikampismyajasakamahiṃsadīpo raḥ
  type: V
  typeName: vidhi
  pada:
  - नमि-कम्पि-स्मि-अजस-कम-हिंस-दीपः
  - रः
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  feeds: []
  meaning: ''
  kashika: |-
    नम्यादिभ्यो धातुभ्यस्तच्छीलादिषु कर्तृषु रः प्रत्ययो भवति। नम्रं काष्ठम्। कम्प्रा शाखा। स्मेरं मुखम्। अजस्रं जुहोति। कम्रा युवतिः। हिंस्रं रक्षः। दीपं्र काष्ठम्। अजस्रमिति <<जसु मोक्षणे>> नञ्पूर्वो रप्रत्ययान्तः क्रियासातत्ये वर्तते॥
  vartika: []
  rule: |-
    After नम्, कम्प्, स्मि, अजस्, कम्, हिंस्, and दीप्, **र** attaches for the habitual agent.
- id: '32168'
  ref: 3.2.168
  a: 3
  p: 2
  n: 168
  s: सनाशंसभिक्ष उः
  iast: sanāśaṃsabhikṣa uḥ
  type: V
  typeName: vidhi
  pada:
  - सन्-आशंस-भिक्षः
  - उः
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  feeds:
  - word: उः
    to: 3.2.169
  - word: उः
    to: 3.2.170
  meaning: ''
  kashika: |-
    सन् इति सन् प्रत्ययो गृह्यते, न सनिर्धातुः, अनभिधानाद् व्याप्तिन्यायाद् वा। सन्नन्तेभ्यो धातुभ्य आशंसेर्भिक्षेश्च तच्छीलादिषु कर्तृषु उः प्रत्ययो भवति। चिकीर्षुः। जिहीर्षुः। आशंसुः। भिक्षुः। <<आङः शसि इच्छायाम्>> इत्यस्य ग्रहणम्, न शंसेःस्तुत्यर्थस्य॥
  vartika: []
  rule: |-
    After a root ending in **सन्**, and after आशंस् and भिक्ष्, **उ** attaches for the habitual agent.
- id: '32169'
  ref: 3.2.169
  a: 3
  p: 2
  n: 169
  s: विन्दुरिच्छुः
  iast: vinduricchuḥ
  type: V
  typeName: vidhi
  pada:
  - विन्दुः
  - इच्छुः
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  - word: उः
    from: 3.2.168
  feeds: []
  meaning: ''
  kashika: |-
    विदेर्नुमागम इषेश्छत्वमुकारश्च प्रत्ययो निपात्यते तच्छीलादिषु कर्तृषु वेदनशीलो विन्दुः। एषणशील इच्छुः॥
  vartika: []
  rule: |-
    विन्दु and इच्छु are formed irregularly with **उ** for the habitual agent (विद् takes the नुम् augment; इष् changes ष to छ).
- id: '32170'
  ref: 3.2.170
  a: 3
  p: 2
  n: 170
  s: क्याच्छन्दसि
  iast: kyācchandasi
  type: V
  typeName: vidhi
  pada:
  - क्यात्
  - छन्दसि
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  - word: उः
    from: 3.2.168
  feeds:
  - word: छन्दसि
    to: 3.2.171
  meaning: ''
  kashika: |-
    क्य इति क्यच्क्यङ्क्यषां सामान्येन निर्देशः। क्यप्रत्ययान्ताद् धातोश्छन्दसि विषये तच्छीलादिषु कर्तृषु उकारप्रत्ययो भवति। मित्र॒युः॑ (मै०सं० २.६.१२)। <<न च्छन्दस्यपुत्रस्य>> [[७.४.३५]] इति प्रतिषेधाद् न दीर्घः। स॑ स्वे॒द॒युः॑ (मै०सं० ४.१२.२.४४)। सुम्न॒युः (ऋ० १.७९.१०)। छन्दसीति किम्? मित्रीयिता॥
  vartika: []
  rule: |-
    In the **छन्दस्**, after a root ending in **क्य** (क्यच्, क्यङ्, क्यप्), **उ** attaches for the habitual agent.
- id: '32171'
  ref: 3.2.171
  a: 3
  p: 2
  n: 171
  s: आदृगमहनजनः किकिनौ लिट् च
  iast: ādṛgamahanajanaḥ kikinau liṭ ca
  type: V
  typeName: vidhi
  pada:
  - आदृ-गम-हन-जनः
  - कि-किनौ
  - लिट्
  - च
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  - word: छन्दसि
    from: 3.2.170
  feeds: []
  meaning: ''
  kashika: |-
    आकारान्तेभ्य ऋवर्णान्तेभ्यो गम हन जन इत्येतेभ्यश्च छन्दसि विषये तच्छीलादिषु किकिनौ प्रत्ययौ भवतः। लिड्वच्च तौ भवतः। आदिति तकारो मुखसुखार्थः, न त्वयं तपरः, मा भूत् तादपि परस्तपर इति ऋकारे तत्कालग्रहणम्। प॒पिः सोमं॑ द॒दिर्गाः (ऋ० ६.२३.४)। मित्रावरुणा॒ ततु॑रिम् (ऋ० ४.३९.२)। दू॒रे ह्यध्वा॒ जगु॑रिः (ऋ०  १०.१०८.१)। जग्मि॒र्युवा॑ (ऋ० ७.२०.१)। जघ्नि॑र्वृ॒त्रम् (ऋ० ९.६१.२०)। जज्ञि॒ बीज॒म् (तै० सं० ७.५.२०.१)। अथ किमर्थं कित्त्वम्, यावता <<असंयोगाल्लिट् कित्>>[[१.२.५]] इति कित्त्वं सिद्धमेव? <<ऋच्छत्यृताम्>> [[७.४.११]] इति लिटि गुणः प्रतिषेधविषय आरभ्यते, तस्यापि बाधनार्थं कित्त्वम्॥ किकिनावुत्सर्गश्छन्दसि सदादिभ्यो दर्शनात्॥ सेदिः॒ (श०ब्रा० ७.३.१.२३)। ने॒मिः (ऋ० २.५.३)॥ भाषायां धाञ्कृञ्सृजनिगमिनमिभ्यः किकिनौ वक्तव्यौ॥ दधिः। चक्रिः। सस्रिः। जज्ञिः। जग्मिः। नेमिः॥ सहिवहिचलिपतिभ्यो यङन्तेभ्यः किकिनौ वक्तव्यौ॥ <<दीर्घोऽकितः>> [[७.४.८३]]। सासहिः। वावहिः। चाचलिः। पापतिः॥
  vartika:
  - भाषायां धाञ्कृसृगमिजनिनमिभ्यः ।
  - सासहिवावहिचाचलिपापतीनामुपसंख्यानम् ।
  rule: |-
    In the **छन्दस्**, after a root ending in आ or in ऋ/ॠ, and after गम्, हन्, and जन्, **कि** and **किन्** attach for the habitual agent, and they count as **लिट्** (so the root reduplicates).
