  type: V
  typeName: vidhi
  pada:
  - जल्प-भिक्ष-कुट्ट-लुण्ट-वृङः
  - षाकन्
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  feeds: []
  meaning: ''
  kashika: |-
    जल्पादिभ्यो धातुभ्यस्तच्छीलादिषु कर्तृषु षाकन् प्रत्ययो भवति। षकारो ङीषर्थः। जल्पाकः। भिक्षाकः। कुट्टाकः। लुण्टाकः। वराकः। वराकः। वराकी॥
  vartika: []
  rule: |-
