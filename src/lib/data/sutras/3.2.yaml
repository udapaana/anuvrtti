- id: '32156'
  ref: 3.2.156
  a: 3
  p: 2
  n: 156
  s: प्रजोरिनिः
  iast: prajoriniḥ
  type: V
  typeName: vidhi
  pada:
  - प्रजोः
  - इनिः
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  feeds:
  - word: इनिः
    to: 3.2.157
  meaning: ''
  kashika: प्रपूर्वाज् जवतेः तच्छीलादिषु कर्तृषु इनिः प्रत्ययो भवति। प्रजवी। प्रजविनौ॥
  vartika: []
  rule: After प्रजु, **इनि** attaches for the habitual agent.
- id: '32157'
  ref: 3.2.157
  a: 3
  p: 2
  n: 157
  s: जिदृक्षिविश्रीण्वमाव्यथाभ्यमपरिभूप्रसूभ्यश्च
  iast: jidṛkṣiviśrīṇvamāvyathābhyamaparibhūprasūbhyaśca
  type: V
  typeName: vidhi
  pada:
  - जि-दृ-क्षि-वि-श्रि-इण्-वम-अव्यथ-अभ्यम-परिभू-प्रसूभ्यश्च
  - च
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  - word: इनिः
    from: 3.2.156
  feeds: []
  meaning: ''
  kashika: |-
    जि जये। दृङादरे। क्षि क्षये, क्षि निवासगत्योः इति द्वयोरपि ग्रहणम्। प्रसू इति षू प्रेरणे इत्यस्य् ग्रहणम्। जिप्रभृतिभ्यो धातुभ्यः इनिः प्रत्ययो भवति तच्छीलादिषु कर्तृषु। जयी। दरी। क्षयी। विश्रयी। अत्ययी। वमी। अव्यथी। अभ्यमी। परिभवी। प्रसवी।
  vartika: []
  rule: |-
    After जि, दृ, क्षि, विश्रि, इ, वम्, अव्यथ, अभ्यम, परिभू, and प्रसू, **इनि** attaches for the habitual agent.
- id: '32158'
  ref: 3.2.158
  a: 3
  p: 2
  n: 158
  s: स्पृहिगृहिपतिदयिनिद्रातन्द्राश्रद्धाभ्य आलुच्
  iast: spṛhigṛhipatidayinidrātandrāśraddhābhya āluc
  type: V
  typeName: vidhi
  pada:
  - स्पृहि-गृहि-पति-दयि-निद्रा-तन्द्रा-श्रद्धाभ्यः
  - आलुच्
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  feeds: []
  meaning: ''
  kashika: |-
    <<स्पृह ईप्सायाम्>> <<गृह ग्रहणे>> <<पत गतौ>> चुरादावदन्ताः पठ्यन्ते। <<दय दानगतिरक्षणेषु>> <<द्रा कुत्सायां गतौ>> निपूर्वस्तत्पूर्वश्च, तदो नकारान्तता च निपात्यते। डुधाञ्  श्रत्पूर्वः। एतेभ्यस्तच्छीलादिषु कर्तृषु आलुच् प्रत्ययो भवति। स्पृहयालुः। गृहयालुः। पतयालुः। दयालुः। निद्रालुः। तन्द्रालुः। श्रद्धालुः॥ आलुचि शीङो ग्रहणं कर्तव्यम्॥ शयालुः॥
  vartika: []
  rule: |-
    After स्पृह्, गृह्, पत्, दय्, निद्रा, तन्द्रा, and श्रद्धा, **आलुच्** attaches for the habitual agent.
- id: '32159'
  ref: 3.2.159
  a: 3
  p: 2
  n: 159
  s: दाधेट्सिशदसदो रुः
  iast: dādheṭsiśadasado ruḥ
  type: V
  typeName: vidhi
  pada:
  - दा-धेट्-सि-शद-सदः
  - रुः
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  feeds: []
  meaning: ''
  kashika: |-
    दा धेट् सि शद सद इत्येतेभ्यो रुः प्रत्ययो भवति। दारुः। धारुर्वत्सो मातरम्। <<न लोकाव्यय०>>[[२.३.६९]] इत्युकारप्रश्लेषात् षष्ठी न भवति। सेरुः। शद्रुः। सद्र्रुः॥
  vartika: []
  rule: After दा, धेट्, सि, शद्, and सद्, **रु** attaches.
- id: '32160'
  ref: 3.2.160
  a: 3
  p: 2
  n: 160
  s: सृघस्यदः क्मरच्
  iast: sṛghasyadaḥ kmarac
  type: V
  typeName: vidhi
  pada:
  - सृ-घसि-अदः
  - क्मरच्
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  feeds: []
  meaning: ''
  kashika: |-
    सृ घसि अद् इत्येतेभ्यो धातुभ्यः तच्छीलादिषु कर्तृषु क्मरच् प्रत्ययो भवति। सृमरः। घस्मरः। अद्मरः॥
  vartika: []
  rule: After सृ, घस्, and अद्, **क्मरच्** attaches for the habitual agent.
- id: '32161'
  ref: 3.2.161
  a: 3
  p: 2
  n: 161
  s: भञ्जभासमिदो घुरच्
  iast: bhañjabhāsamido ghurac
  type: V
  typeName: vidhi
  pada:
  - भञ्ज-भास-मिदः
  - घुरच्
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  feeds: []
  meaning: ''
  kashika: |-
    भञ्ज भास मिद इत्येतेभ्यो घुरच् प्रत्ययो भवति तच्छीलादिषु कर्तृषु। भङ्गुरं काष्ठम्। घित्त्वात् कुत्वम्। भासुरं ज्योतिः। मेदुरः पशुः। भञ्जेः कर्मकर्तरि प्रत्ययः, स्वभावात्॥
  vartika: []
  rule: |-
    After भञ्ज्, भास्, and मिद्, **घुरच्** attaches for the habitual agent (the घ triggers the guttural change, as in भङ्गुर).
- id: '32162'
  ref: 3.2.162
  a: 3
  p: 2
  n: 162
  s: विदिभिदिच्छिदेः कुरच्
  iast: vidibhidicchideḥ kurac
  type: V
  typeName: vidhi
  pada:
  - विदि-भिदि-च्छिदेः
  - कुरच्
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  feeds: []
  meaning: ''
  kashika: |-
    ज्ञानार्थस्य विदेः ग्रहणं न लाभार्थस्य  स्वभावात्। विदादिभ्यो धातुभ्यः तच्छीलादिषु कर्तृषु कुरच् प्रत्ययो भवति। विदुरः पण्डितः। भिदुरं काष्ठम्। छिदुरा रज्जुः। भिदिच्छिद्योः कर्मकर्तरि प्रयोगः॥ व्यधेः संप्रसारणं कुरच्च वक्तव्यः॥ विधुरः॥
  vartika: []
  rule: After विद् (to know), भिद्, and छिद्, **कुरच्** attaches for the habitual agent.
- id: '32163'
  ref: 3.2.163
  a: 3
  p: 2
  n: 163
  s: इण्नश्जिसर्त्तिभ्यः क्वरप्
  iast: iṇnaśjisarttibhyaḥ kvarap
  type: V
  typeName: vidhi
  pada:
  - इण्-नश्-जि-सर्त्तिभ्यः
  - क्वरप्
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  feeds:
  - word: क्वरप्
    to: 3.2.164
  meaning: ''
  kashika: |-
    इण् नश् जि सर्ति इत्येतेभ्यो धातुभ्यस्तच्छीलादिषु कर्तृषु क्वरप् प्रत्ययो भवति। पकारस्तुगर्थः। इत्वरः। इत्वरी। नश्वरः। नश्वरी। जित्वरः। जित्वरी। सृत्वरः। सृत्वरी। <<नेड् वशि कृति>> [[७.२.८]] इतीट्प्रतिषेधः॥
  vartika: []
  rule: |-
    After इ, नश्, जि, and सृ, **क्वरप्** attaches for the habitual agent (the प marks the **तुक्** augment, as in इत्वर).
- id: '32164'
  ref: 3.2.164
  a: 3
  p: 2
  n: 164
  s: गत्वरश्च
  iast: gatvaraśca
  type: V
  typeName: vidhi
