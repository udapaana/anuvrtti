  meaning: ''
  kashika: |-
    भवतेर्धातोः संज्ञायामन्तरे च गम्यमाने क्विप् प्रत्ययो भवति। विभूर्नाम कश्चित्। अन्तरे — प्रतिभूः। धनिकाधमर्णयोरन्तरे यस्तिष्ठति, स प्रतिभूरुच्यते॥
  vartika: []
  rule: After भू, **क्विप्** attaches when the word names something or means a surety.
- id: '32180'
  ref: 3.2.180
  a: 3
  p: 2
  n: 180
  s: विप्रसम्भ्यो ड्वसंज्ञायाम्
  iast: viprasambhyo ḍvasaṃjñāyām
  type: V
  typeName: vidhi
  pada:
  - वि-प्र-सम्-भ्यः
  - डु
  - असंज्ञायाम्
  adhikara: प्रत्ययः
  inherits:
  - word: कृत्
    from: 3.1.93
  - word: भुवः
    from: 3.2.179
  feeds: []
  meaning: ''
  kashika: |-
    भुव इति वर्तते। वि प्र सम् इत्येवंपूर्वाद् भवतेर्धातोर्डुप्रत्ययो भवति, न चेत् संज्ञा गम्यते। विभुः सर्वगतः। प्रभुः स्वामी। संभुर्जनिता। असंज्ञायामिति किम्? विभूर्नाम कश्चित्॥ डुप्रकरणे मितद्र्वादिभ्य उपसंख्यानम्॥ मितं द्रवति मितद्रुः। शंभुः॥
  vartika:
  - डुप्रकरणे मितद्र्वादिभ्य उपसंख्यानम् ।
  rule: |-
    After भू preceded by वि, प्र, or सम्, **डु** attaches, provided the word is not a name.
- id: '32181'
