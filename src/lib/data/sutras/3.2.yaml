  - word: कृत्
    from: 3.1.93
  - word: ष्ट्रन्
    from: 3.2.181
  - word: करणे
    from: 3.2.182
  feeds: []
  meaning: ''
  kashika: |-
    पू इति पूङ्पूञोस्सामान्येन ग्रहणम्। अस्माद् धातोः करणे कारके ष्ट्रन् प्रत्ययो भवति, तच्चेत् करणं हलसूकरयोरवयवो भवति। हलस्य पोत्रम्। सूकरस्य पोत्रम्। मुखमुच्यते॥
  vartika: []
  rule: |-
    After पू (purify), **ष्ट्रन्** marks the instrument when the word names a part of a plough or a hog (पोत्रम्, the plough-share or the snout).
- id: '32184'
