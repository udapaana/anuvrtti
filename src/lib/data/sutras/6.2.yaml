  meaning: ''
  kashika: |-
    अन्त इत्यधिकारः। यदित ऊर्ध्वमनुक्रमिष्यामस्तत्र समासस्योत्तरपदस्यान्त उदात्तो भवतीत्येवं तद् वेदितव्यम्। वक्ष्यति — <<थाथघञ्क्त ाजबित्रकाणाम्>>[[६.२.१४४]] इति। सु॒नी॒थः। अ॒व॒भृ॒थः॥
  vartika: []
