    निष्ठान्तादुपमानवाचिनश्च मुखं स्वाङ्गमुत्तरपदमन्यतरस्यां बहुव्रीहौ समासेऽन्तोदात्तं भवति। प्॒रक्षा॒लि॒त॒मु॒खः, प्॒रक्षा॒लि॒तमु॑खः, प्रक्षा॑लितमुखः। यदैतदुत्तरपदान्तोदात्तत्वं न भवति तदा <<निष्ठोपसर्गपूर्वमन्यतरस्याम्>> [[६.२.११०]] इति पक्षे पूर्वपदान्तोदात्तत्वम्, तदभावपक्षेऽपि पूर्वपदप्रकृतिस्वरत्वेन गतिस्वर इति त्रीण्युदाहरणानि भवन्ति। उपमानात् — सिं॒ह॒मु॒खः, सिं॒हमु॑खः। व्या॒घ्॒रमु॒खः, व्या॒घ्रमु॑खः॥
