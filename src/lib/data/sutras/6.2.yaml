  s: इत्थम्भूतेन कृतमिति च
  iast: itthambhūtena kṛtamiti ca
  type: V
  typeName: vidhi
  pada:
  - इत्थम्भूतेन
  - कृतम्
  - इति
  - च
  adhikara: उत्तरपदादिः
  inherits:
  - word: क्तः
    from: 6.2.145
  - word: कारकात्
    from: 6.2.148
  feeds: []
  meaning: ''
  kashika: |-
    इमं प्रकारमापन्न इत्थंभूतः। इत्थंभूतेन कृतमित्येतस्मिन्नर्थे यः समासो वर्तते, तत्र क्तान्तमुत्तरपदमन्तोदात्तं भवति। सु॒प्त॒प्॒रल॒पि॒तम्। उ॒न्म॒त्त॒प्॒रल॒पि॒तम्। प्॒रम॒त्त॒गी॒तम्। वि॒प॒न्न॒श्र्ाुतम्। कृतमिति क्रियासामान्ये करोतिर्वर्तते, नाभूतप्रादुर्भाव एव। तेन प्रलपिताद्यपि कृतं भवति। <<तृतीया कर्मणि>> [[६.२.४८]] इत्यस्यायमपवादः। भावे तु यदा प्रलपितादयस्तदा थाथादिस्वरेणैव [[६.२.१४४]] सिद्धमन्तोदात्तत्वं भवति॥
  vartika: []
  rule: |-
    When a **समास** means 'done by one in such a condition', the **क्त** participle as second member takes **उदात्त** on its final.
- id: '62150'
  ref: 6.2.150
  a: 6
  p: 2
  n: 150
  s: अनो भावकर्मवचनः
  iast: ano bhāvakarmavacanaḥ
  type: V
  typeName: vidhi
  pada:
  - अनः
  - भावकर्मवचनः
  adhikara: उत्तरपदादिः
  inherits:
  - word: कारकात्
    from: 6.2.148
  feeds: []
  meaning: ''
  kashika: |-
    अनप्रत्ययान्तमुत्तरपदं भाववचनं कर्मवचनं च कारकात् परमन्तोदात्तं भवति। ओ॒द॒न॒भो॒ज॒नं सुखम्। प॒यः॒पा॒नं सुखम्। च॒न्द॒न॒पि्॒रय॒ङ्गु॒का॒ले॒प॒नं सुखम्। कर्मवचनरा॒ज॒भो॒ज॒नाः शालयः। रा॒जा॒च्छा॒द॒नानि॑ वासांसि। <<कर्मणि च येन संस्पर्शात् कर्तुः शरीरसुखम्>>[[३.३.११६]] इत्ययं योग उभयथा वर्ण्यते — कर्मण्युपपदे भावे ल्युड् भवति, कर्मण्यभिधेये ल्युड् भवतीति। तत्र पूर्वस्मिन् सूत्रार्थे भाववचनोदाहरणानि, उत्तरत्र कर्मवचनोदाहरणानि। अन इति किम्? ह॒स्त॒हा॒र्य॑मुदश्वित्। भावकर्मवचन इति किम्? द॒न्त॒धाव॑नम्। करणे ल्युट्। कारकादित्येव — नि॒दर्श॑नम्। अ॒व॒लेख॑नम्। सर्वेषु प्रत्युदाहरणेषु प्रकृतिस्वरो भवति॥
  vartika: []
  rule: |-
    After a **कारक**, a second member ending in **अन** that names the action itself (**भाव**) or its object (**कर्म**) takes **उदात्त** on its final.
- id: '62151'
  ref: 6.2.151
  a: 6
  p: 2
  n: 151
  s: मन्क्तिन्व्याख्यानशयनासनस्थानयाजकादिक्रीताः
  iast: manktinvyākhyānaśayanāsanasthānayājakādikrītāḥ
  type: V
  typeName: vidhi
  pada:
  - मन्-क्तिन्-व्याख्यान-शयन-आसन-स्थान-याजकादि-क्रीताः
  adhikara: उत्तरपदादिः
  inherits:
  - word: कारकात्
    from: 6.2.148
  feeds: []
  meaning: ''
  kashika: |-
    मन्नन्तं क्तिन्नन्तं व्याख्यान शयन आसन स्थान इत्येतानि याजकादयः क्रीतशब्दश्चोत्तरपदमन्तोदात्तं भवति। मन् — र॒थ॒व॒र्त्म। श॒क॒ट॒व॒र्त्म। क्तिन् — पा॒ण्िानि॒कृ॒तिः। आ॒पि॒श॒लि॒कृ॒तिः। व्याख्यान — ऋ॒ग॒य॒न॒व्या॒ख्या॒नम्। छ॒न्दो॒व्या॒ख्या॒नम्। शयन — रा॒ज॒श॒य॒नम्। ब्रा॒ह्म्ाण्ाश्ाय॒नम्। आसन — रा॒जा॒स॒नम्। ब्॒राह्म्ाणा॒स॒नम्। स्थान — गो॒स्था॒नम्। अ॒श्व॒स्था॒नम्। याजकादि — ब्रा॒ह्म्ाण॒या॒ज॒कः। क्षत्रि॒॒य॒या॒ज॒कः। ब्॒राह्म्ाण्ापू॒ज॒कः। क्ष॒त्र्िाय॒पू॒ज॒कः। याजकादयो ये <<याजकादिभिश्च>>[[२.२.९]] इति षष्ठीसमासार्थाः पठ्यन्ते, त एवेह गृह्यन्ते। क्रीत — गो॒क्री॒तः। अ॒श्व॒क्री॒तः। कृत्स्वरापवादोऽयं  योगः। क्रीतशब्दे तु <<तृतीया कर्मणि>>[[६.२.४८]] इत्यस्यापवादः। व्याख्यानशयनासनस्थानानामभावकर्मार्थं ग्रहणम्। कारकादित्येव — प्रकृ॑तिः। प्रहृ॑तिः॥
  vartika: []
  rule: |-
    After a **कारक**, these second members take **उदात्त** on the final: words ending in **मन्** or **क्तिन्**, the words व्याख्यान, शयन, आसन, स्थान, क्रीत, and the याजकादि words.
- id: '62152'
  ref: 6.2.152
