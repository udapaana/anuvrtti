    सक्थमिति कृतसमासान्तः सक्थिशब्दोऽत्र गृह्यते, सोऽक्रान्तात् परो विभाषान्तोदात्तो भवति। गौ॒र॒स॒क्थः, गौ॒र॒स॑क्थः। श्ल॒क्ष्ण॒स॒क्थः, श्ल॒क्ष्णस॑क्थः। अक्रान्तादिति किम् ? च॒क्॒रस॒क्थः। षचश्चित्त्वाद् नित्यमन्तोदात्तत्वं भवति॥
  vartika: []
