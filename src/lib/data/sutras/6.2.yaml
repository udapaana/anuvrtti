  meaning: ''
  kashika: |-
    उपसर्गात् स्वाङ्गं ध्रुवं पर्शुवर्जितमन्तोदात्तं भवति बहुव्रीहौ समासे। प्॒रपृ॒ष्ठः। प्रो॒द॒रः। प्॒रल॒ला॒टः। ध्रुवमित्येकरूपमुच्यते। ध्रुवमस्य शीलम् इति यथा। सततं यस्य प्रगतं पृष्ठं भवति स प्रपृष्ठः।  उपसर्गादति किम् ? द॒र्शनीय॑ललाट स्वाङ्गमिति किम् ? प्रशा॑खो वृक्षः। ध्रुवमिति किम्? उद्बा॑हुः क्रोशति। अपर्श्विति किम् ? उत्प॑र्शुः। विप॑र्शुः॥
  vartika: []
  rule: |-
    In a **बहुव्रीहि**, after an **उपसर्ग** a word for a permanent bodily part, except पर्शु, takes **उदात्त** on its final.
- id: '62178'
