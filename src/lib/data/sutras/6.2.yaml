  meaning: ''
  kashika: |-
    बहुव्रीहौ समास इदम् एतद् तदित्येतेभ्य उत्तरस्य प्रथमशब्दस्य पूरणप्रत्ययान्तस्य च क्रियागणने वर्तमानस्यान्त उदात्तो भवति। इदं प्रथमं गमनं भोजनं वा यस्य स इ॒दं॒प्॒रथ॒मः। इ॒दं॒द्वि॒ती॒यः। इ॒दं॒तृ॒ती॒यः। ए॒त॒त्प्॒रथ॒मः। ए॒त॒द्द्वि॒ती॒यः। ए॒त॒त्तृ॒ती॒यः। त॒त्प्॒रथ॒मः। त॒द्द्वि॒ती॒यः। त॒त्त्ाृती॒यः। बहुव्रीहाविति किम्? अनेन प्रथम इ॒दंप्॑रथमः। तृतीयेति योगविभागात् समासः। इदमेतत्तद्भ्य इति किम्? यत्प्॑रथमः। प्रथमपूरणयोरिति किम्? तानि बहून्यस्य तद्ब॑हुः। क्रियागणन इति किम्? अयं प्रथम एषां त इ॒दंप्॑रथमाः। द्रव्यगणनमेतत्। गणन इति किम्? अयं प्रथम एषां त इ॒दंप्॑रथमाः। इदंप्रधाना इत्यर्थः। उत्तरपदस्य कार्यित्वात् कपि पूर्वमन्तोदात्तं भवति। इ॒दं॒प्॒रथ॒मकाः॑। बहुव्रीहावित्येतद् <<वनं समासे>>[[६.२.१७८]] इति प्रागेतस्मादधिकृतं वेदितव्यम्॥
  vartika: []
  rule: |-
    In a **बहुव्रीहि**, after इदम्, एतद्, तद्, the word प्रथम or an ordinal takes **उदात्त** on its final when counting how many times an action happens.
