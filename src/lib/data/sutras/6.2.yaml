  s: सोरवक्षेपणे
  iast: soravakṣepaṇe
  type: V
  typeName: vidhi
  pada:
  - सोः
  - अवक्षेपणे
  adhikara: उत्तरपदादिः
  inherits:
  - word: उपसर्गात्
    from: 6.2.177
  - word: तत्पुरुषे
    from: 6.2.193
  feeds: []
  meaning: ''
  kashika: |-
    सुशब्दात् परमुत्तरपदं तत्पुरुषे समासेऽन्तोदात्तं भवत्यवक्षेपणे गम्यमाने। अवक्षेपणं निन्दा। इह खल्विदानीं सुस्थण्डिले सुस्फिगाभ्यां सु॒प्॒रत्य॒व॒सि॒तः। सुशब्दोऽत्र पूजायामेव। वाक्यार्थस्तु अवक्षेपणमसूयया तथाभिधानात्। सोरिति किम्? कुब्रा॑ह्मणः। अवक्षेपण इति किम् ? शोभनेषु तृणेषु सुतृ॑णेषु॥
  vartika: []
  rule: |-
    After सु in a **तत्पुरुष**, the second member takes the **उदात्त** on the final when reproach is meant (though सु itself names praise).
- id: '62196'
  ref: 6.2.196
