  meaning: ''
  kashika: |-
    स्फिग पूत वीणा अञ्जस् अध्वन् कुक्षि इत्येतान्युत्तरपदानि सीरनामानि च नामशब्दश्चापादुत्तराण्यन्तोदात्तानि भवन्ति। अ॒प॒स्फि॒गम्। अ॒प॒पू॒तम्। अ॒प॒वी॒णम्। अ॒पा॒ञ्जः। अ॒पा॒ध्वा। <<उपसर्गादध्वनः>> [[५.४.८५]] इति यदा समासान्तो नास्ति, तदानेनान्तोदात्तत्वं भवति। तस्मिन् हि सत्यच्प्रत्ययस्य चित्त्वादेव सिद्धम्। अनित्यश्च समासान्तः (परि० ८४) इत्येतदेव ज्ञापकम्। अ॒प॒कु॒क्षिः। अ॒प॒सी॒रः। अ॒प॒ह॒लम्। अ॒प॒ला॒ङ्ग॒लम्। अ॒प॒ना॒म। सर्वत्र प्रादिसमासो बहुव्रीहिरव्ययीभावो वा। स्फिगपूतकुक्षीणां ग्रहणमबहुव्रीह्यर्थम — ध्रुवार्थमस्वाङ्गार्थं च॥
  vartika: []
  rule: |-
    After अप, the words स्फिग, पूत, वीणा, अञ्जस्, अध्वन्, कुक्षि, नामन्, and any word for a plough take the **उदात्त** on the final.
- id: '62188'
  ref: 6.2.188
  a: 6
  p: 2
  n: 188
  s: अधेरुपरिस्थम्
  iast: adheruparistham
  type: V
  typeName: vidhi
  pada:
  - अधेः
  - उपरिस्थम्
  adhikara: उत्तरपदादिः
  inherits:
  - word: उपसर्गात्
    from: 6.2.177
  feeds: []
  meaning: ''
  kashika: |-
    अधेरुत्तरमुपरिस्थवाचि अन्तोदात्तं भवति। अ॒धि॒द॒न्तः। अ॒धि॒क॒र्णः। अ॒धि॒के॒शः। अध्यारूढो दन्त इति प्रादिसमासः। अध्यारूढो वा दन्त इति समानाधिकरण उत्तरपदलोपी समासः। दन्तस्योपरि योऽन्यो दन्तो जायते, स उच्यतेऽधिदन्त इति। उपरिस्थमिति किम्? अ॒धि॒कर॑णम्॥
  vartika: []
  rule: |-
    After अधि, a word for something that grows or stands over another takes the **उदात्त** on the final.
- id: '62189'
  ref: 6.2.189
  a: 6
  p: 2
  n: 189
  s: अनोरप्रधानकनीयसी
  iast: anorapradhānakanīyasī
  type: V
  typeName: vidhi
  pada:
  - अनोः
  - अप्रधान-कनीयसी
  adhikara: उत्तरपदादिः
  inherits:
  - word: उपसर्गात्
    from: 6.2.177
  feeds: []
  meaning: ''
  kashika: |-
    अनोरुत्तरमप्रधानवाचि कनीयश्चान्तोदात्तं भवति। अनुगतो ज्येष्ठम् अ॒नु॒ज्ये॒ष्ठः। अ॒नु॒म॒ध्य॒मः। पूर्वपदार्थप्रधानः प्रादिसमासोऽयम्। अनुगतः कनीयान् अ॒नु॒क॒नी॒यान्। उत्तरपदार्थप्रधानोऽयम्। प्रधानार्थं च कनीयोग्रहणम्। अप्रधानकनीयसी इति किम्? अनुगतो ज्येष्ठो अनु॑ज्येष्ठः॥
  vartika: []
  rule: |-
    After अनु, a subordinate (non-principal) second member, and the word कनीयस्, take the **उदात्त** on the final.
- id: '62190'
  ref: 6.2.190
  a: 6
  p: 2
  n: 190
  s: पुरुषश्चान्वादिष्टः
  iast: puruṣaścānvādiṣṭaḥ
  type: V
  typeName: vidhi
  pada:
  - पुरुषः
  - च
  - अन्वादिष्टः
  adhikara: उत्तरपदादिः
  inherits:
  - word: उपसर्गात्
    from: 6.2.177
  feeds: []
  meaning: ''
  kashika: |-
    पुरुषशब्दोऽन्वादिष्टवाची चानोरुत्तरोऽन्तोदात्तो भवति। अन्वादिष्टः पुरुषः अ॒नु॒पु॒रु॒षः। अन्वादिष्टोऽन्वाचितः कथितानुकथितो वा। अन्वादिष्ट इति किम् ? अनुगतः पुरुषः अनु॑पुरुषः॥
  vartika: []
  rule: |-
    After अनु, पुरुष takes the **उदात्त** on the final when it means a man already mentioned.
- id: '62191'
  ref: 6.2.191
  a: 6
  p: 2
  n: 191
  s: अतेरकृत्पदे
  iast: aterakṛtpade
  type: V
  typeName: vidhi
  pada:
  - अतेः
  - अकृत्पदे
  adhikara: उत्तरपदादिः
  inherits:
  - word: उपसर्गात्
    from: 6.2.177
  feeds: []
  meaning: ''
  kashika: |-
    अतेःपरमकृदन्तं पदशब्दश्चान्तोदात्तो भवति। अ॒त्य॒ङ्कु॒शो नागः। अ॒ति॒क॒शोऽश्वः। पदशब्दःखल्वपि — अ॒ति॒प॒दा शक्वरी। अकृत्पद इति किम्? अति॑कारकः॥ अतेर्धातुलोप इति वक्त व्यम्॥ इह मा भूत् — शोभनो गार्ग्यः अति॑गार्ग्यः। इह च यथा स्यात् — अतिक्रान्तः कारकाद् अ॒ति॒का॒र॒क इति॥
  vartika:
  - अतेर्धातुलोप इति वक्तव्यम् ।
  rule: |-
    After अति, a word not formed by a **कृत्** affix, and the word पद, take the **उदात्त** on the final syllable.
- id: '62192'
  ref: 6.2.192
  a: 6
  p: 2
  n: 192
  s: नेरनिधाने
  iast: neranidhāne
  type: V
  typeName: vidhi
  pada:
  - नेः
  - अनिधाने
  adhikara: उत्तरपदादिः
  inherits:
  - word: उपसर्गात्
    from: 6.2.177
  feeds: []
  meaning: ''
  kashika: |-
    नेः परमुत्तरपदमन्तोदात्तं भवत्यनिधाने। निधानमप्रकाशता। नि॒मू॒लम्। न्य॒क्षम्। नि॒तृ॒णम्। बहुव्रीहिरयं प्रादिसमासो वा। अव्ययीभावे तु समासान्तोदात्तत्वेनैव सिद्धम्। अनिधान इति किम् ? निवा॑ग् वृषलः। निद॑ण्डः। निहितवाक्, निहितदण्ड इत्यर्थः। निशब्दोऽत्र निधानार्थं ब्रवीति। प्रादयो हि वृत्तिविषये ससाधनां क्रियामाहुः॥
  vartika: []
  rule: |-
    After नि, the second member takes the **उदात्त** on the final when the sense is not laying-down (not concealing).
- id: '62193'
  ref: 6.2.193
  a: 6
  p: 2
  n: 193
  s: प्रतेरंश्वादयस्तत्पुरुषे
  iast: prateraṃśvādayastatpuruṣe
  type: V
  typeName: vidhi
  pada:
  - प्रतेः
  - अंश्वादयः
  - तत्पुरुषे
  adhikara: उत्तरपदादिः
  inherits:
  - word: उपसर्गात्
    from: 6.2.177
  feeds:
  - word: तत्पुरुषे
    to: 6.2.194
  - word: तत्पुरुषे
    to: 6.2.195
  - word: तत्पुरुषे
    to: 6.2.196
  meaning: ''
  kashika: |-
    प्रतेरंश्वादयस्तत्पुरुषे समासेऽन्तोदात्ता भवन्ति। प्रतिगतः अंशुः प्॒रत्यं॒शुः। प्॒रति॒ज॒नः। प्॒रति॒रा॒जा। राजशब्दः समासान्तस्यानित्यत्वाद् यदा टज् नास्ति, तदा प्रयोजयति। तस्मिन् हि सति चित्त्वादेवान्तोदात्तत्वं सिद्धम्। तत्पुरुष इति किम् ? प्रतिगता अंशवोऽस्य प्रत्यं॑शुः अयमुष्ट्रः॥ अंशु। जन। राजन्। उष्ट्र। खेटक। अजिर। आर्द्रा। श्रवण। कृत्तिका। अर्ध। पुर॥
  vartika: []
  rule: |-
    After प्रति in a **तत्पुरुष**, the words अंशु, जन, राजन् and the rest of the list take the **उदात्त** on the final.
- id: '62194'
  ref: 6.2.194
  a: 6
  p: 2
  n: 194
  s: उपाद् द्व्यजजिनमगौरादयः
  iast: upād dvyajajinamagaurādayaḥ
  type: V
  typeName: vidhi
  pada:
  - उपात्
  - द्व्यजजिनम्
  - अगौरादयः
  adhikara: उत्तरपदादिः
  inherits:
  - word: उपसर्गात्
    from: 6.2.177
  - word: तत्पुरुषे
    from: 6.2.193
  feeds: []
  meaning: ''
  kashika: |-
    उपादुत्तरं द्व्यजजिनं चान्तोदात्तं भवति तत्पुरुषे समासे गौरादीन् वर्जयित्वा। उपगतो देवम् उ॒प॒दे॒वः। उ॒प॒सो॒मः। उ॒पे॒न्द्रः। उ॒प॒ह॒ोडः। अजिन — उ॒पा॒जि॒नम्। अगौरादय इति किम् ? उप॑गौरः। उप॑तैषः। तत्पुरुष इत्येव — उपगतः सोमोऽस्य उप॑सोमः॥  गौर। तैष। तैट। लट। लोट। जिह्वा। कृष्णा। कन्या। गुड। कल्प। पाद। गौरादिः॥
  vartika: []
  rule: |-
    After उप in a **तत्पुरुष**, a two-syllable word and अजिन् take the **उदात्त** on the final, but not the words गौर and the rest of its list.
- id: '62195'
  ref: 6.2.195
  a: 6
  p: 2
