  adhikara: उत्तरपदादिः
  inherits: []
  feeds: []
  meaning: ''
  kashika: |-
    थ अथ घञ् क्त  अज् अप् इत्र क इत्येवमन्तानामुत्तरपदानां गतिकारकोपपदात् परेषामन्त उदात्तो भवति। सु॒नी॒थः। अ॒व॒भृ॒थः(तै०सं० १.७.५.३)। <<हनिकुषिनीरमिकाशिभ्यः क्थन्>> (प०उ० २.२) इति <<अवे भृञः>> (प०उ० २.३) इति च क्थन्प्रत्ययान्तावेतौ। तत्र कुदुत्तरपदप्रकृतिस्वरत्वेनाद्युदात्तमुत्तरपदं स्यात्। अथ — आ॒व॒स॒थः (शौ०सं० ९.६.७)। उ॒प॒व॒स॒थः। <<उपसर्गे वसेः>> (प०उ० ३.११६) इत्यथन्प्रत्ययः। घञ् — प्॒रभे॒दः। का॒ष्ठ॒भे॒दः। र॒ज्जु॒भे॒दः। क्त — दू॒रा॒दा॒ग॒तः। वि॒शु॒ष्कः। आ॒त॒प॒श्ाुष्कः। अच् — प्र॒क्ष॒यः। प्॒रज॒यः। <<क्षयो निवासे>> [[६.१.२०१]] <<जयः करणम्>> [[६.१.२०२]] इति चाद्युदात्तौ क्षयजयशब्दौ प्रयोजयतः। अप् — प्र॒ल॒वः(तै० आ० ५.४.५)। प्र॒स॒वः (तै०सं० १.७.८.३)। इत्र — प्॒रल॒वि॒त्रम्। प्॒रस॒वि॒त्रम्। क — गो॒वृ॒षः। ख॒री॒वृ॒षः। गां वर्षति, खरीं वर्षतीति मूलविभुजादित्वात् (३.२.५ वा०) कप्रत्ययः। प्र॒वृ॒षः। प्॒रहृ॒षः। इगुपधात् [[३.१.१३५]] इति कप्रत्ययः। <<वृषादीनां च>> [[६.१.२०३]] इति वृषशब्द आद्युदात्तः। गतिकारकोपपदादित्येव — सुस्तु॑तं भवता। कर्मप्रवचनीयेऽव्ययस्वर एव भवति॥
  vartika: []
  rule: |-
    After a **गति**, **कारक**, or **उपपद**, a second member ending in थ, अथ, घञ्, क्त, अच्, अप्, इत्र, or क takes **उदात्त** on its last syllable.
