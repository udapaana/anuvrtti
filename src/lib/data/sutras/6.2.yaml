  vartika:
  - चेलराज्यादिस्वरादव्ययस्वरो भवति पूर्वविप्रतिषेधेन ।
  rule: |-
    राज्य ending a **तत्पुरुष** that is not a **कर्मधारय** takes **उदात्त** on its first syllable.
- id: '62131'
