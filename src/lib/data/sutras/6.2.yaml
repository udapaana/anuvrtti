  s: प्रादस्वाङ्गं संज्ञायाम्
  iast: prādasvāṅgaṃ saṃjñāyām
  type: V
  typeName: vidhi
  pada:
  - प्रात्
  - अस्वाङ्गम्
  - संज्ञायाम्
  adhikara: उत्तरपदादिः
  inherits:
  - word: उपसर्गात्
    from: 6.2.177
  feeds: []
  meaning: ''
  kashika: |-
    प्रादुत्तरपदमस्वाङ्गवाचि संज्ञायां विषयेऽन्तोदात्तं भवति। प्॒रको॒ष्ठम्। प्॒रगृ॒हम्। प्॒रद्वा॒रम्। अस्वाङ्गमिति किम्? प्रह॑स्तम्। प्रप॑दम्। संज्ञायामिति किम् ? प्रपी॑ठम्॥
  vartika: []
  rule: |-
    After प्र, a word that does not name a body part takes the **उदात्त** on the final when the compound is a **संज्ञा**.
- id: '62184'
  ref: 6.2.184
  a: 6
  p: 2
  n: 184
  s: निरुदकादीनि च
  iast: nirudakādīni ca
  type: V
  typeName: vidhi
  pada:
  - निरुदकादीनि
  - च
  adhikara: उत्तरपदादिः
  inherits:
  - word: उपसर्गात्
    from: 6.2.177
  feeds: []
  meaning: ''
  kashika: |-
    निरुदकादीनि च शब्दरूपाण्यन्तोदात्तानि भवन्ति। नि॒रु॒द॒कम्। नि॒रु॒ल॒पम्। नि॒रु॒प॒लम्। इत्यन्ये पठन्ति। नि॒र्म॒श॒कम्। नि॒र्म॒क्ष्िाकम्। एषां प्रादिसमासो बहुव्रीहिर्वा। अव्ययीभावे तु समासान्तोदात्तत्वेनैव सिद्धम्। नि॒ष्का॒ल॒कः। निष्क्रान्तः कालकादिति कन्प्रत्ययान्तेन कालशब्देन प्रादिसमासः। नि॒ष्का॒लि॒क इत्यन्ये पठन्ति। नि॒ष्पे॒षः। दु॒स्त॒री॒पः। <<अवितृस्तृतन्त्रिभ्य ईः>> (प० उ० ३.१५८) — तरीः। तां पातीति तरीपः। कुत्सितस्तरीपो दुस्तरीपः। नि॒स्त॒री॒प इति केचित् पठन्ति। अपरे नि॒स्त॒री॒क इति। ते तरीशब्दान्ते बहुव्रीहौ कपं कुर्वन्ति। नि॒र॒जि॒नम्। उ॒द॒जि॒नम्। उ॒पा॒जि॒नम्। परेर्हस्तपादकेशकर्षाः (ग०सू० १७९)। प॒रि॒ह॒स्तः। प॒रि॒पा॒दः। प॒रि॒के॒शः। प॒रि॒क॒र्षः। निरुदकादिराकृतिगणः॥
  vartika: []
  rule: निरुदक and the words in its list take the **उदात्त** on the final.
- id: '62185'
