  - word: चङि
    to: 7.4.9
  meaning: ''
  kashika: |-
    अङ्गस्य इति वर्तते। चङ्परे णौ यदङ्गम्, तस्य उपधाया ह्रस्वो भवति। अचीकरत्। अजीहरत्। अलीलवत्। अपीपवत्। अत्र द्विर्वचनोपधाह्रस्वत्वयोः प्राप्तयोः परत्वादुपधाह्रस्वत्वम्, तत्र कृते द्विर्वचनम्। इह तु मा भवानटिटतिति नित्यत्वाद् द्वितीयस्य द्विर्वचनं प्राप्नोति, तथा सति ह्रस्वभाविनोऽङ्गस्य अकारस्य उपधात्वं विहितम् इति ह्रस्वो न स्यात्? नैष दोषः। ओणेः ऋदित् करणं ज्ञापकं नित्यमपि द्विर्वचनमुपधाह्रस्वत्वेन बाध्यते इति। णौ इति किम्? चङ्युपधाया ह्रस्वः इत्युच्यमाने अलीलवदित्यत्र वचनसामर्थ्यातन्तरङ्गामपि वृद्धिमादेशं च बाधित्वा ह्रस्वः स्यात्। अदीदपदित्यत्र ह्रस्वत्वेन पुको बाधः स्यात्। अपीपचतित्येवमादौतु नैव स्यात्। चङि इति किम्? कारयति। हारयति। उपधाया इति किम्? अचकाङ्क्षत्। अववाञ्छत्। तदेददुपधाग्रहणमुत्तरार्थमवश्यं कर्तव्यं तदिह अपि ह्रस्वत्वं निवर्तयति इत्येवमर्थं येन न अव्यवधानम् इत्येतन्नाश्रयितव्यम् इति। उपधाह्रस्वत्वे णेर्णिच्युपसङ्ख्यानम्। वदित्वन्तं प्रयोजितवानवीवदत् वीणां परिवादकेन। योऽसौ णौ णिलोपस्तस्य स्थानिवद्भावेन अग्लोपित्वातङ्गस्य ह्रस्वो न प्राप्नोति। ण्याकृतिनिर्देशात् सिद्धम्।
  vartika: []
  rule: |-
    Before **चङ्** (the reduplicating aorist sign), the penultimate vowel of the causative **अङ्ग** shortens.
- id: '74002'
  ref: 7.4.2
  a: 7
  p: 4
  n: 2
  s: नाग्लोपिशास्वृदिताम्
  iast: nāglopiśāsvṛditām
  type: V
  typeName: vidhi
  pada:
  - न
  - अग्लोपिशास्वृदिताम्
  adhikara: अङ्गस्य
  inherits:
  - word: उपधायाः
    from: 7.4.1
  - word: ह्रस्वः
    from: 7.4.1
  - word: णौ
    from: 7.4.1
  - word: चङि
    from: 7.4.1
  feeds: []
  meaning: ''
  kashika: |-
    अग्लोपिनामङ्गानां शासेः ऋदितां च णौ चङि उपधाया ह्रस्वो न भवति। अग्लोपिनां तावत् मालामाख्यतममालत्। मातरमाख्यतममातरत्। राजानमतिक्रान्तवानत्यरराजत्। लोमान्यनुमृष्टवानन्वलुलोमत्। अगेव यत्र केवलो लुप्यते तत्र स्थानिवद्भावादपि सिद्धम्, हलचोरादेशे तु न सिध्यतीति तदर्थम् एतद् वचनम्। शासेः अशशासत्। ऋदिताम् बाधृ अबवाधत्। याचृ अययाचत्। ढौकृ अडुढौकत्।
  vartika: []
  rule: |-
    This shortening before **चङ्** does not apply to a denominative **अङ्ग** that dropped an **अक्** vowel before णि, nor to शास्, nor to a root with an indicatory ऋ (**ऋदित्**).
- id: '74003'
  ref: 7.4.3
  a: 7
  p: 4
  n: 3
  s: भ्राजभासभाषदीपजीवमीलपीडामन्यतरस्याम्
  iast: bhrājabhāsabhāṣadīpajīvamīlapīḍāmanyatarasyām
  type: V
  typeName: vidhi
  pada:
  - भ्राजभासभाषदीपजीवमीलपीडाम्
  - अन्यतरस्याम्
  adhikara: अङ्गस्य
  inherits:
  - word: उपधायाः
    from: 7.4.1
  - word: ह्रस्वः
    from: 7.4.1
  - word: णौ
    from: 7.4.1
  - word: चङि
    from: 7.4.1
  feeds: []
  meaning: ''
  kashika: |-
    भ्राज भास भाष दीप जीव मील पीड इत्येतेषामङ्गानां णौ चङि उपधाया ह्रस्वो भवति अन्यतरस्याम्। भ्राज अबिभ्रजत्, अबभ्राजत्। भास अबीभसत्, अबभासत्। भाष अबीभषत्, अबभाषत्। दीप अदीदिपत्, अदिदीपत्। जीव अजीजिवत्, अजिजीवत्। मील अमीमिलत्, अमिमीलत्। पीड अपीपिडत्, अपिपीडत्। भ्राजभासोरृदित्करणमपाणिनीयम्। काण्यादीनां चेति वक्तव्यम्। कण अचीकणत्, अचकाणत्। वण अवीवणत्, अववाणत्।
  vartika:
  - काण्यादीनां चेति वक्तव्यम् ।
  rule: |-
    For भ्राज्, भास्, भाष्, दीप्, जीव्, मील्, पीड्, the shortening before **चङ्** is optional.
- id: '74004'
  ref: 7.4.4
  a: 7
  p: 4
  n: 4
  s: लोपः पिबतेरीच्चाभ्यासस्य
  iast: lopaḥ pibaterīccābhyāsasya
  type: V
  typeName: vidhi
