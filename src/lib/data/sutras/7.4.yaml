- id: '74007'
  ref: 7.4.7
  a: 7
  p: 4
  n: 7
  s: उर्ऋत्
  iast: urṛt
  type: V
  typeName: vidhi
  pada:
  - उः
  - ऋत्
  adhikara: अङ्गस्य
  inherits:
  - word: णौ
    from: 7.4.1
  - word: चङि
    from: 7.4.1
  - word: वा
    from: 7.4.6
  feeds:
  - word: ऋत्
    to: 7.4.8
  meaning: ''
  kashika: |-
    णौ चङि उपधायाः ऋवर्णस्य स्थाने वा ऋकारादेशो भवति। इररारामपवादः। इर् अचिकीर्तत्, अचीकृतत्। अर् अववर्तत्, अवीवृतत्। आर् अममार्जत्, अमीमृजत्। वचनसामर्थ्यादन्तरङ्गा अपि इररारो बाध्यन्ते। तप्रकरणं दीर्घेऽपि स्थानिनि ह्रस्व एव यथा स्यात्, अचीकृततिति। न च अयं भाव्यमानः, किन्तु आदेशान्तरनिवृत्त्यर्थं स्वरूपम् एव एतदभ्यनुज्ञायते।
  vartika: []
  rule: |-
    Before **चङ्**, a penultimate ऋ or ॠ of the causative **अङ्ग** optionally becomes short ऋ (blocking the इर्, अर्, आर् substitutes).
