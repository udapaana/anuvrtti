  - लोपः
  - पिबतेः
  - ईत्
  - च
  - अभ्यासस्य
  adhikara: अङ्गस्य
  inherits:
  - word: णौ
    from: 7.4.1
  - word: चङि
    from: 7.4.1
  feeds: []
  meaning: ''
  kashika: |-
    पिबतेः अङ्गस्य णौ चङि उपधायाः लोपो भवति, अभ्यासस्य ईकारादेशो भवति। अपीप्यत्, अपीप्यताम्, अपीप्यन्। उपधालोपे कृते ओः पुयण् वचनं ज्ञापकं णौ स्थानिवद्भावस्य इति स्थानिवद्भावाद् द्विर्वचनम्।
  vartika: []
  rule: |-
    For the causative of पा 'drink' before **चङ्**, the penultimate vowel drops (**लोप**), and the reduplicate's vowel becomes ई.
