    to: 7.4.15
  meaning: ''
  kashika: |-
    शॄ पॄ दॄ इत्येतेषां अङ्गानां लिटि परतो वा ह्रस्वो भवति। शॄ विशश्रतुः, विशश्रुः। विशशरतुः, विशशरुः। दॄ विदद्रतुः, विदद्रुः। विददरतुः, विददरुः। पॄ निपप्रतुः, निपप्रुः। निपपरतुः, निपपरुः। ह्रस्ववचनम् इत्वोत्वनिवृत्त्यर्थम्। केचिदेतत् सूत्रं प्रत्याचक्षते। श्रा पाके, द्रा कुत्सायां गतौ, प्रा पूरणे इत्येतेषामनेकार्था धातवः इति शॄदॄप्रामर्थे वर्तमानानां विशश्रतुः, विशश्रुः, विदद्रतुः, विदद्रुः, निपप्रतुः, निपप्रुः इत्येतानि रूपाणि साधयन्ति। तथा च सति क्वसौ विशशृवानित्येतद् रूपं न स्यात्।
  vartika: []
  rule: |-
    शॄ, दॄ, पॄ (of the क्र्यादि class) optionally shorten their vowel in **लिट्** (the perfect).
- id: '74013'
