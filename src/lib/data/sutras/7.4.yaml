- id: '74009'
  ref: 7.4.9
  a: 7
  p: 4
  n: 9
  s: दयतेर्दिगि लिटि
  iast: dayaterdigi liṭi
  type: V
  typeName: vidhi
  pada:
  - दयतेः
  - दिगि
  - लिटि
  adhikara: अङ्गस्य
  inherits:
  - word: चङि
    from: 7.4.1
  feeds:
  - word: लिटि
    to: 7.4.10
  - word: लिटि
    to: 7.4.11
  meaning: ''
  kashika: |-
    दयतेरङ्गस्य लिटि परतो दिगि इत्ययमादेशो भवति। अव्दिग्ये, अवदिग्याते, अवदिग्यिरे। दयतेः इति दीङो ग्रहणं न तु दय दाने इत्यस्य। तस्य हि लिति आम् विहितः। दिग्यादेशेन द्विर्वचनस्य बाधनम् इष्यते।
  vartika:
  - दिग्यादेशेन द्वित्व बाधनमिष्यते ।
  rule: |-
    Before **लिट्** (the perfect), दय् (दे, root देङ् 'protect') becomes दिगि (blocking reduplication).
- id: '74010'
  ref: 7.4.10
  a: 7
  p: 4
  n: 10
  s: ऋतश्च संयोगादेर्गुणः
  iast: ṛtaśca saṃyogāderguṇaḥ
  type: V
  typeName: vidhi
  pada:
  - ऋतः
  - च
  - संयोगादेः
  - गुणः
  adhikara: अङ्गस्य
  inherits:
  - word: लिटि
    from: 7.4.9
  feeds:
  - word: गुणः
    to: 7.4.11
  - word: गुणः
    to: 7.4.12
  meaning: ''
  kashika: |-
    ऋकारान्तस्य अङ्गस्य संयोगादेः गुणो भवति लिटि परतः। स्वृ सस्वरतुः। सस्वरुः। ध्वृ दध्वरतुः। दध्वरुः। स्मृ सस्मरतुः। सस्मरुः। ऋतः इति किम्? चिक्षियतुः। चिक्षियुः। संयोगादेः इति किम्? चक्रतुः। चकृउः। प्रतिषेधविषयेऽपि गुणो यथा स्यातित्ययमारम्भः। वृद्धिविषये तु पूर्वविप्रतिषेधेन वृद्धिरेव इष्यते। सस्वार। सस्मार। लिटि इत्येव, स्मृतः। स्मृतवान्। संयोगादेर्गुणविधाने संयोगोपधग्रहणं कृञर्थं कर्तव्यम्। सञ्चस्करतुः, सञ्चस्करुः इति। अत्र हि पूर्वं धातुः साधनेन युज्यते पश्चादुपसर्गेण इत्यत्र दर्शने लिति कृते, तदाश्रये च द्विर्वचने, पश्चादुपसर्गयोगे सति, <<अडभ्यासव्यवायेऽपि>> [[6.1.136]] इति सुत् क्रियते। एवं च कृत्वा संस्कृषीष्ट, उपस्कृषीष्ट इत्यत्र सुटो बहिरङ्गलक्षणस्य असिद्धत्वातृतश्च संयोगादेः इति इडागमो न भवति।
  vartika: []
  rule: |-
    A root ending in short ऋ and beginning with a conjunct consonant takes **गुण** in **लिट्** (the perfect).
- id: '74011'
