  meaning: ''
  kashika: |-
    लघुनि धात्वक्षरे परतो योऽभ्यासः तस्य चङ्परे णौ परतः सनीव कार्यं भवति अनग्लोपे। <<सन्यतः>> [[7.4.79]] इत्युक्तम्, चङ्परेऽपि तथा। अचीकरत्। अपीपचत्। <<ओः पुयण्ज्यपरे>> [[7.4.80]] इत्युक्तम्, चङ्परेऽपि तथा। अपीपवत्। अलीलवत्। अजीजवत्। <<स्रवतिशृणोतिद्रवतिप्रवतिप्लवतिच्यवतीनां वा>> [[7.4.81]] इत्युक्तम्, चङ्परेऽपि तथा। असिस्रवत्, असुस्रवत्। अशिश्रवत्, अशुश्रवत्। अदिद्रवत्, अदुद्रवत्। अपिप्रवत्, अपुप्रवत्। अपिप्लवत्, अपुप्लवत्। अचिच्यवत्, अचुच्यवत्। लुघुनि इति किम्? अततक्षत्। अररक्षत्। जागरयतेः अजजागरत्। अत्र केचिद् गशब्दम् लघुमाश्रित्य सन्ववद्भाम् इच्छन्ति, सर्वत्रैव लघोरानन्तर्यमभ्यासेन न अस्तीति व्यवधानेऽपि वचनप्रामाण्याद् भवितव्यम्, तदसत्। येन न अव्यवधानं तेन व्यवहितेऽपि वचनप्रामाण्यातित्येकेन व्यवधानमाश्रीयते, न पुनरनेकेन। यद्येवम्, कथमचिक्षणतिति? आचार्यप्रवृत्तिर्ज्ञापयति भवत्येवं जातीयकानाम् इत्त्वम् इति। यदयं तद् बाधनार्थं सम्रत्यादीनामत्वम् विदधाति। चङ्परे इति किम्? अहं पपच। परग्रहणं किम्? चङि एव केवले मा भूत्, अचकमत। अनग्लोपे इति किम्? अचकथत्। दृषदमाख्यातवानददृषत्। वादितवन्तं प्रयोजितवानवीवददित्यत्र योऽसौ णौ णेर्लोपो नासावग्लोप इत्याश्रीयते। किं कारणम्? चङ्परे इति णिजातेर्निमित्तत्वेन आक्षेपात्, ततोऽन्यस्य अको लोपः परिगृह्यते। मीमादीनामत्र ग्रहणात् सन्वद्भावेन अभ्यासलोपो न भवति इत्युक्तम्। किं च सन्वतिति सनाश्रयं कार्यमतिदिश्यते, न च लोपः सनम् एव अपेक्षते, किं तर्हि, इस्भावाद्यपि। तदभावातमीमपतित्यादौ अभ्यासलोपो न भविष्यति।
  vartika: []
  rule: |-
    In the reduplicated **चङ्** aorist of the causative, the **अभ्यास** before a light root-vowel is treated as in the **सन्**, provided no **अक्** vowel of the root was dropped before the causative णि.
