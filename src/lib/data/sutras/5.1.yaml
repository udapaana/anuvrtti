  meaning: ''
  kashika: |-
    तस्येति षष्ठीसमर्थाद् भाव इत्येतस्मिन्नर्थे त्वतलौ प्रत्ययौ भवतः। भवतोऽस्मादभिधानप्रत्ययाविति भावः। शब्दस्य प्रवृत्तिनिमित्तं भावशब्देनोच्यते। अश्वस्य भावः अश्वत्वम्। अश्वता। गोत्वम्। गोता॥
  vartika: []
  rule: |-
    **त्व** and **तल्** attach to a genitive word meaning "the nature of that": अश्वस्य भावः → अश्वत्वम् or अश्वता.
- id: '51120'
  ref: 5.1.120
  a: 5
  p: 1
  n: 120
  s: आ च त्वात्
  iast: ā ca tvāt
  type: AD
  typeName: adhikāra
  pada:
