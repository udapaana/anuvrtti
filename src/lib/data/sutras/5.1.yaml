  iast: kambalācca saṃjñāyām
  type: V
  typeName: vidhi
  pada:
  - कम्बलात्
  - च
  - संज्ञायाम्
  adhikara: प्रत्ययः
  inherits:
  - word: यत्
    from: 5.1.2
  feeds: []
  meaning: ''
  kashika: |-
    कम्बलात् प्राक्क्रीतीयेष्वर्थेषु यत् प्रत्ययो भवति संज्ञायां विषये। छस्यापवादः। कम्बल्यमूर्णापलशतम्। संज्ञायामिति किम् ? कम्बलीया ऊर्णा॥
  vartika: []
