  s: न नञ्पूर्वात्तत्पुरुषादचतुरसंगतलवणवटयुधकतरसलसेभ्यः
  iast: na nañpūrvāttatpuruṣādacaturasaṃgatalavaṇavaṭayudhakatarasalasebhyaḥ
  type: V
  typeName: vidhi
  pada:
