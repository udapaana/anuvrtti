  meaning: ''
  kashika: |-
    मत्वर्थे च सहस्रशब्दाद् घः प्रत्ययो भवति। सहस्रमस्य विद्यते सहस्रियः। <<तपःसहस्राभ्यां विनीनी>> [[५.२.१०२]],<<अण् च>> [[५.२.१०३]] इत्यस्यापवादः॥
  vartika: []
