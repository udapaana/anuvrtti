    from: 4.4.2
  feeds: []
  meaning: ''
  kashika: |-
    तेनेत्येव। व्यञ्जनवाचिभ्यः प्रातिपदिकेभ्यस्तृतीयासमर्थेभ्य उपसिक्त इत्येतस्मिन्नर्थे ठक्  प्रत्ययो भवति। दध्ना उपसिक्तं दाधिकम्। सौपिकम्। खारिकम्। व्यञ्जनैरिति किम् ? उदकेनोपसिक्त ओदनः॥
  vartika: []
  rule: |-
    After a third-case word naming a condiment, in the sense 'sprinkled with it', add **ठक्** (दध्ना उपसिक्तम् → दाधिकम्). A condiment word only — not उदकेन उपसिक्तम्.
