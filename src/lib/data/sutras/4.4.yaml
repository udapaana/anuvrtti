  meaning: ''
  kashika: "भावे चार्थे छन्दसि विषये शिवादिभ्यस्तातिल् प्रत्ययो भवति। शिवस्य भावः शिवतातिः (पै०सं०५.३६.१)।\
    \ शंता॑तिः॒ (ऋ० ८.१८.७) । अरि॒ष्टता॑तिः (ऋ०१०.६०.८)। यतः पूर्णोऽवधिः। अतः परमन्यः प्रत्ययोऽधिक्रियते॥\
    \ \n\n॥ इति श्रीजयादित्यविरचितायां काशिकायां वृत्तौ चतुर्थाध्यायस्य चतुर्थः पादः॥"
  vartika: []
  rule: |-
    In the **छन्दस्**, **तातिल्** also attaches after शिव, शम्, and अरिष्ट in the genitive when the sense is **भाव** (the state of being that thing).
