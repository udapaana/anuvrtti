    In the Vedas, **स्रोतस्** optionally takes **ड्यत्** or **ड्य** for 'what stays there'; the **ड** drops its अस् (स्रोतसि भवः → स्रोत्य). **यत्** stays available as the other option (स्रोतस्य); the two **ड्य** affixes differ only in accent.
