  vartika:
  - मांसौदनग्रहणं संघातविगृहीतार्थम् ।
  rule: |-
    After श्राणा and मांसौदन, **टिठन्** adds in the sense "this is rightfully given to whom", blocking **ठक्**: श्राणिकः, मांसौदनिकः. (The ट् marks the feminine in ङीप्; the इ is just for pronouncing the affix.)
