  s: गृहपतिना संयुक्ते ञ्यः
  iast: gṛhapatinā saṃyukte ñyaḥ
  type: V
  typeName: vidhi
  pada:
  - गृहपतिना
  - संयुक्ते
  - ञ्यः
  adhikara: प्रत्ययः
  inherits: []
