  vartika: []
  rule: |-
    After मुद्ग, in the sense 'mixed with it', add **अण्**, blocking **ठक्** (मौद्ग ओदनः).
- id: '44026'
  ref: 4.4.26
  a: 4
  p: 4
  n: 26
  s: व्यञ्जनैरुपसिक्ते
  iast: vyañjanairupasikte
