  kashika: |-
    स्रोतस्शब्दाद् विभाषा ड्यत् ड्य इत्येतौ प्रत्ययौ भवतस्तत्र भव इत्येतस्मिन् विषये। यतोऽपवादः। पक्षे सोऽपि भवति। स्रोतसि भवः स्रो॒त्यः (ऋ०१०.१०४.८)। स्रो॑त॒स्यः (शौ०सं० १९.२.४)। ड्यड्ड्ययोः स्वरे विशेषः॥
