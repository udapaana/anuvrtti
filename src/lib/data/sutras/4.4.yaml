    आयुधशब्दाच् छप्रत्ययो भवति, चकारात् ठंश्च, जीवतीत्येतस्मिन् विषये। आयुधेन जीवति आयुधीयः। आयुधिकः॥
  vartika: []
  rule: After आयुध, **छ** — and by च also **ठन्** — marks he lives by it.
- id: '44015'
  ref: 4.4.15
  a: 4
  p: 4
  n: 15
  s: हरत्युत्सङ्गादिभ्यः
  iast: haratyutsaṅgādibhyaḥ
  type: V
  typeName: vidhi
  pada:
  - हरति
  - उत्सङ्गादिभ्यः
  adhikara: प्रत्ययः
  inherits:
  - word: तेन
    from: 4.4.2
  feeds:
  - word: हरति
    to: 4.4.16
  - word: हरति
    to: 4.4.17
  - word: हरति
    to: 4.4.18
  meaning: ''
  kashika: |-
    तेनेत्येव। उत्सङ्गादिभ्यस्तृतीयासमर्थेभ्यो हरतीत्येतस्मिन्नर्थे ठक्  प्रत्ययो भवति। हरतिर्देशान्तरप्रापणे वर्तते। उत्सङ्गेन हरति औत्सङ्गिकः। औडुपिकः॥ उत्सङ्ग। उडुप। उत्पत। पिटक। उत्सङ्गादिः॥
  vartika: []
  rule: |-
    After उत्सङ्ग and the rest in the third case, **ठक्** marks he carries it (takes it to another place).
- id: '44016'
  ref: 4.4.16
  a: 4
  p: 4
  n: 16
  s: भस्त्रादिभ्यः ष्ठन्
  iast: bhastrādibhyaḥ ṣṭhan
  type: V
  typeName: vidhi
  pada:
  - भस्त्रा-आदिभ्यः
  - ष्ठन्
  adhikara: प्रत्ययः
  inherits:
  - word: तेन
    from: 4.4.2
  - word: हरति
    from: 4.4.15
  feeds:
  - word: ष्ठन्
    to: 4.4.17
  meaning: ''
  kashika: |-
    भस्त्रेत्येवमादिभ्यस्तृतीयासमर्थेभ्यो हरतीत्येतस्मिन्नर्थे ष्ठन् प्रत्ययो भवति। भस्त्रया हरति भस्त्रिकः। भस्त्रिकी। भरटिकः। भरटिकी॥ भस्त्रा।  भरट। भरण। शीर्षभार। शीर्षेभार। अंसभार। अंसेभार। भस्त्रादिः॥
  vartika: []
  rule: |-
    After भस्त्रा and the rest in the third case, **ष्ठन्** marks he carries by it. The ष् takes the feminine **ङीष्**.
- id: '44017'
  ref: 4.4.17
  a: 4
  p: 4
  n: 17
  s: विभाषा विवधवीवधात्
  iast: vibhāṣā vivadhavīvadhāt
  type: V
  typeName: vidhi
  pada:
  - विभाषा
  - विवध-वीवधात्
  adhikara: प्रत्ययः
  inherits:
  - word: तेन
    from: 4.4.2
  - word: हरति
    from: 4.4.15
  - word: ष्ठन्
    from: 4.4.16
  feeds: []
  meaning: ''
  kashika: |-
    हरतीत्येव। विवधवीवधशब्दाभ्यां तृतीयासमर्थाभ्यां विभाषा ष्ठन् प्रत्ययो भवति। तेन मुक्ते प्रकृतष्ठग् भवति। विवधेन हरति विवधिकः। विवधिकी । वीवधिकः। वीवधिकी। ठक् खल्वपि — वैवधिकः। वैवधिकी। विवधवीवधशब्दौ समानार्थौ पथि पर्याहारे च वर्तेते॥
  vartika:
  - वीवधादपि ।
  rule: |-
    After विवध and वीवध in the third case, **ष्ठन्** optionally marks he carries by it; otherwise the governing **ठक्** holds.
- id: '44018'
  ref: 4.4.18
  a: 4
  p: 4
  n: 18
  s: अण् कुटिलिकायाः
  iast: aṇ kuṭilikāyāḥ
  type: V
  typeName: vidhi
  pada:
  - अण्
  - कुटिलिकायाः
  adhikara: प्रत्ययः
  inherits:
  - word: तेन
    from: 4.4.2
  - word: हरति
    from: 4.4.15
  feeds: []
  meaning: ''
  kashika: |-
    हरतीत्येव। कुटिलिकाशब्दात् तृतीयासमर्थादण् प्रत्ययो भवति हरतीत्येतस्मिन्नर्थे। कुटिलिकया हरति मृगो व्याधं कौटिलिको मृगः। कुटिलिकया हरत्यङ्गारान् कौटिलिकः कर्मारः। कुटिलिका वक्रगतिः, कर्माराणामायुधकर्षणी लोहमयी यष्टिश्चोच्यते॥
  vartika: []
  rule: After कुटिलिका in the third case, **अण्** marks he carries by it.
- id: '44019'
  ref: 4.4.19
  a: 4
  p: 4
  n: 19
  s: निर्वृत्तेऽक्षद्यूतादिभ्यः
  iast: nirvṛtte'kṣadyūtādibhyaḥ
  type: V
  typeName: vidhi
  pada:
  - निर्वृत्ते
  - अक्ष-द्यूत-आदिभ्यः
  adhikara: प्रत्ययः
  inherits:
  - word: तेन
    from: 4.4.2
  feeds:
  - word: निर्वृत्ते
    to: 4.4.20
  - word: निर्वृत्ते
    to: 4.4.21
  meaning: ''
  kashika: |-
    तेनेत्येव। अक्षद्यूतादिभ्यस्तृतीयासमर्थेभ्यो निर्वृत्त इत्येतस्मिन्नर्थे ठक्  प्रत्ययो भवति। अक्षद्यूतेन निर्वृत्तम् आक्षद्यूतिकं वैरम्। जानुप्रहृतिकम्॥ अक्षद्यूत। जानुप्रहृत। जङ्घाप्रहृत। पादस्वेदन। कण्टकमर्दन। गतागत। यातोपयात। अनुगत। अक्षद्यूतादिः॥
  vartika: []
  rule: After अक्षद्यूत and the rest in the third case, **ठक्** marks completed by it.
- id: '44020'
  ref: 4.4.20
  a: 4
  p: 4
  n: 20
  s: क्त्रेर्मम् नित्यम्
  iast: ktrermam nityam
  type: V
  typeName: vidhi
  pada:
  - क्त्रेः
  - मप्
  - नित्यम्
  adhikara: प्रत्ययः
  inherits:
  - word: तेन
    from: 4.4.2
  - word: निर्वृत्ते
    from: 4.4.19
  feeds: []
  meaning: ''
  kashika: |-
    निर्वृत्त इत्येव। <<ड्वितः क्त्रिः>> [[३.३.८८]] इत्ययं त्रिशब्दो गृह्यते। त्र्यन्ताद् नित्यं मप् प्रत्ययो भवति तेन निर्वृत्त इत्येतस्मिन्नर्थे। <<डुपचष् पाके>> — पक्त्रिमम्। डुवप् — उप्त्रिमम्। डुकृञ् — कृत्रिमम्। नित्यग्रहणं स्वातन्त्र्यनिवृत्त्यर्थम्। तेन त्र्यन्तं नित्यं मप्प्रत्ययान्तमेव भवति, विषयान्तरे न प्रयोक्तव्यमिति॥ भावप्रत्ययान्तादिमब् वक्तव्यः॥ पाकेन निर्वृत्तं पाकिमम्। त्यागिमम् सेकिमम्। कुट्टिमम्॥
  vartika:
  - भावप्रत्ययान्तादिमब्वक्तव्यः ।
  rule: |-
    After a word ending in the affix **त्रि** (the **क्त्रि** of [[3.3.88]]), **मप्** always follows, in the sense completed by it: पक्त्रिम, उप्त्रिम, कृत्रिम. A **क्त्रि**-word never stands alone — **मप्** is fixed to it.
- id: '44021'
  ref: 4.4.21
  a: 4
  p: 4
  n: 21
  s: अपमित्ययाचिताभ्यां कक्कनौ
  iast: apamityayācitābhyāṃ kakkanau
  type: V
  typeName: vidhi
  pada:
  - अपमित्य-याचिताभ्याम्
  - कक्-कनौ
  adhikara: प्रत्ययः
  inherits:
  - word: तेन
    from: 4.4.2
  - word: निर्वृत्ते
    from: 4.4.19
  feeds: []
  meaning: ''
  kashika: |-
    निर्वृत्त इत्येव। अपमित्ययाचितशब्दाभ्यां यथासंख्यं कक्  कन् इत्येतौ प्रत्ययौ भवतो निर्वृत्त इत्येतस्मिन्नर्थे। आपमित्यकम्। याचितकम्॥
  vartika: []
  rule: |-
    After अपमित्य and याचित, in the sense of completion, add **कक्** and **कन्** respectively (अपमित्य → आपमित्यकम्, याचित → याचितकम्).
- id: '44022'
  ref: 4.4.22
  a: 4
  p: 4
  n: 22
  s: संसृष्टे
  iast: saṃsṛṣṭe
  type: V
  typeName: vidhi
  pada:
  - संसृष्टे
  adhikara: प्रत्ययः
  inherits:
  - word: तेन
    from: 4.4.2
  feeds:
  - word: संसृष्टे
    to: 4.4.23
  - word: संसृष्टे
    to: 4.4.24
  - word: संसृष्टे
    to: 4.4.25
  meaning: ''
  kashika: |-
    तेनेत्येव। तृतीयासमर्थात् संसृष्ट इत्येतस्मिन्नर्थे ठक्  प्रत्ययो भवति। संसृष्टमेकीभूतमभिन्नमित्यर्थः। दध्ना संसृष्टं दाधिकम्। मारिचिकम्। शार्ङ्गवेरिकम्। पैप्पलिकम्॥
  vartika: []
  rule: |-
    After a third-case word, in the sense 'mixed with it', add **ठक्** (दध्ना संसृष्टम् → दाधिकम्).
- id: '44023'
  ref: 4.4.23
  a: 4
  p: 4
  n: 23
  s: चूर्णादिनिः
  iast: cūrṇādiniḥ
  type: V
  typeName: vidhi
  pada:
  - चूर्णात्
  - इनिः
  adhikara: प्रत्ययः
  inherits:
  - word: तेन
    from: 4.4.2
  - word: संसृष्टे
    from: 4.4.22
  feeds: []
  meaning: ''
  kashika: |-
    चूर्णशब्दादिनिः प्रत्ययो भवति संसृष्टे। ठकोऽपवादः। चूर्णैः संसृष्टाश्चूर्णिनोऽपूपाः चूर्णिनो धानाः॥
  vartika: []
  rule: |-
    After चूर्ण, in the sense 'mixed with it', add **इनि**, blocking **ठक्** (चूर्णिनः).
- id: '44024'
  ref: 4.4.24
  a: 4
  p: 4
  n: 24
  s: लवणाल्लुक्
  iast: lavaṇālluk
  type: V
  typeName: vidhi
  pada:
  - लवणात्
  - लुक्
  adhikara: प्रत्ययः
  inherits:
  - word: तेन
    from: 4.4.2
  - word: संसृष्टे
    from: 4.4.22
  feeds: []
  meaning: ''
  kashika: |-
    संसृष्ट इत्यनेनोत्पन्नस्य ठको लवणशब्दाद् लुग् भवति। लवणः सूपः। लवणं शाकम्। लवणा यवागूः। द्रव्यवाची लवणशब्दो लुकं प्रयोजयति, न गुणवाची॥
  vartika: []
  rule: |-
    After लवण, the **ठक्** of 'mixed with it' drops by **लुक्** (लवणः सूपः). This holds when लवण names the substance, not when it qualifies.
- id: '44025'
  ref: 4.4.25
  a: 4
  p: 4
  n: 25
  s: मुद्गादण्
  iast: mudgādaṇ
  type: V
  typeName: vidhi
  pada:
