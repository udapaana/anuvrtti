  - word: तेन
    from: 4.4.2
  - word: चरति
    from: 4.4.8
  feeds: []
  meaning: ''
  kashika: |-
    आकर्षशब्दात् ष्ठल् प्रत्ययो भवति चरतीत्येतस्मिन्नर्थे। ठकोऽपवादः। लकारः स्वरार्थः। षकारो ङीषर्थः। आकर्षेण चरति आकर्षिकः। आकर्षिकी। आकर्ष इति सुवर्णपरीक्षार्थो निकषोपल उच्यते॥
  vartika: []
  rule: |-
    After आकर्ष, **ष्ठल्** marks he gets on by it, blocking **ठक्**. The ल् sets the accent; the ष् takes the feminine **ङीष्**.
