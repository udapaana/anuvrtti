  meaning: ''
  kashika: "नौशब्दाद् द्व्यचश्च प्रातिपदिकाट् ठन् प्रत्ययो भवति तरतीत्येतस्मिन्नर्थे। ठकोऽपवादः। नावा\
    \ तरति नाविकः। द्व्यचः खल्वपि — घटिकः। प्लविकः। बाहुकः। षकारः सांहितिको नानुबन्धः। बाहुका स्त्री।\
    \ \n\nआकर्षात् पर्पादेर्भस्त्रादिभ्यः कुसीदसूत्राच्च।\n\nआवसथात् किशरादेः षितः षडेते ठगधिकारे॥\n\n\
    विधिवाक्यापेक्षं च षट्त्वम्, प्रत्ययास्तु सप्त॥"
  vartika: []
  rule: |-
    After नौ and after two-syllable bases, **ठन्** marks he crosses by it, blocking **ठक्**.
