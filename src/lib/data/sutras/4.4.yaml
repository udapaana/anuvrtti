  meaning: |-
    The ठक् प्रत्यय is attached to a तृतीयासमर्थ instrument to indicate  (1) a person who gambles, (2) A person who digs, (3) A person who wins, (4) An entity that is won.
  kashika: |-
    तेनेति तृतीयासमर्थाद् दीव्यति खनति जयति जितमित्येतेष्वर्थेषु ठक् प्रत्ययो भवति। अक्षैर्दीव्यति आक्षिकः। शालाकिक ः। अभ्र्या खनति आभ्रिकः। कौद्दालिकः। अक्षैर्जयति आक्षिकः। अक्षैर्जितम् आक्षिकम्। शालाकिकम्। सर्वत्र करणे तृतीया समर्थविभक्तिः। देवदत्तेन जितमिति प्रत्ययो न भवति, अनभिधानात्। अङ्गुल्या खनतीति च। प्रत्ययार्थे संख्याकालयोरविवक्षा। क्रियाप्रधानत्वेऽपि चाख्यातस्य तद्धितः स्वभावात् साधनप्रधानः॥
  vartika: []
  rule: |-
    After a word in the third case, **ठक्** marks the senses he plays with it, he digs with it, he conquers with it, or it is conquered by it.
- id: '44003'
  ref: 4.4.3
  a: 4
  p: 4
  n: 3
  s: संस्कृतम्
  iast: saṃskṛtam
  type: V
  typeName: vidhi
  pada:
  - संस्कृतम्
  adhikara: प्रत्ययः
  inherits:
  - word: तेन
    from: 4.4.2
  feeds:
  - word: संस्कृतम्
    to: 4.4.4
  meaning: |-
    To express an entity that has been cultured / processed, an appropriate तद्धितप्रत्यय gets attached to the तृतीयासमर्थ word indicating the substance used for culturing / processing.
  kashika: |-
    तेनेति तृतीयासमर्थात् संस्कृतमित्येतस्मिन्नर्थे ठक् प्रत्ययो भवति। सत उत्कर्षाधानं संस्कारः। दध्ना संस्कृतं दाधिकम्। शार्ङ्गवेरिकम्। मारिचिकम्। योगविभाग उत्तरार्थः॥
  vartika: []
  rule: |-
    After a word in the third case, **ठक्** marks refined by it (made finer or tastier).
- id: '44004'
  ref: 4.4.4
  a: 4
  p: 4
  n: 4
  s: कुलत्थकोपधादण्
  iast: kulatthakopadhādaṇ
  type: V
  typeName: vidhi
  pada:
  - कुलत्थ-क-उपधात्
  - अण्
  adhikara: प्रत्ययः
  inherits:
  - word: तेन
    from: 4.4.2
  - word: संस्कृतम्
    from: 4.4.3
  feeds: []
  meaning: ''
  kashika: |-
    कुलत्थशब्दात् ककारोपधाच् छब्दाच् च प्रातिपदिकादण् प्रत्ययो भवति संस्कृतमित्येतस्मिन् विषये। ठकोऽपवादः। कुलत्थैः संस्कृतं कौलत्थम्। ककारोपधात् — तैत्तिडीकम्। दार्दभकम्॥
  vartika: []
  rule: |-
    After कुलत्थ and after words with a penultimate क्, **अण्** marks refined by it, blocking **ठक्**.
