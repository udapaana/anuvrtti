name: Deploy अनुवृत्ति to anuvrtti.udapaana.in

env:
  # The vidyut commit the grammar engine is built from. See the pin note in
  # the WASM build step below before changing it.
  VIDYUT_REV: 8da2f90bee3ce1c07505fa432fc3729e3f7e02ea

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # The build scripts run under Bun (it executes TypeScript natively, so the
      # `npx tsx` wrapper they used to need is gone). CI only had Node, which
      # would fail at the first `bun scripts/...` in `npm run build`.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build vidyut-prakriya WASM
        run: |
          echo "🔧 Building vidyut-prakriya WASM..."
          # PINNED, and it must stay pinned.
          #
          # This was `--depth 1` of HEAD, which made the deploy non-deterministic
          # in the one dependency that decides what the corpus MEANS. vidyut is
          # the grammar engine: it settles लिङ्ग, विभक्ति, वचन, पुरुष, पद and
          # गण for every word the reader shows. An unpinned clone meant two
          # deploys a week apart could ship different grammar, with no diff, no
          # review and nothing in the repo to say so — while every number the
          # checks are ratcheted against (the लिङ्ग fixture, the derivation
          # baseline, the coverage floors) was measured locally against the
          # committed binary, which was ten months older still.
          #
          # To move it: bump this SHA, rebuild static/wasm/ locally at the same
          # SHA (scripts/build-wasm.sh), run `bun run check`, and commit the two
          # together. If the baselines move, that IS the review — an engine
          # change that alters the corpus should be visible as one.
          git clone https://github.com/ambuda-org/vidyut.git /tmp/vidyut
          cd /tmp/vidyut
          git checkout ${{ env.VIDYUT_REV }}
          cd vidyut-prakriya
          wasm-pack build --target web --out-dir $GITHUB_WORKSPACE/static/wasm/vidyut-prakriya
          cp www/static/vidyut-prakriya.js $GITHUB_WORKSPACE/static/wasm/vidyut-prakriya/
          sed -i 's|from "./wasm/vidyut_prakriya.js"|from "./vidyut_prakriya.js"|' $GITHUB_WORKSPACE/static/wasm/vidyut-prakriya/vidyut-prakriya.js
          echo "✅ WASM build complete"

      - name: Build
        run: npm run build
        env:
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
          GITHUB_APP_TOKEN: ${{ secrets.GITHUB_APP_TOKEN }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .svelte-kit/cloudflare --project-name=anuvrtti --commit-dirty=true
